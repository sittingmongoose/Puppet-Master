name: Bootstrap TestPro onboarding and tour

on:
  push:
    branches:
      - concept/test-pro-pm-onboarding-tour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the concept branch
        uses: actions/checkout@v4
        with:
          ref: concept/test-pro-pm-onboarding-tour
          fetch-depth: 0

      - name: Install the authored onboarding and tour
        shell: bash
        run: |
          set -euo pipefail
          cat .pmpro-bootstrap/part-* > /tmp/pmpro-source.b64
          base64 --decode /tmp/pmpro-source.b64 > /tmp/pmpro-source.tar.gz
          tar -xzf /tmp/pmpro-source.tar.gz -C "$GITHUB_WORKSPACE"
          python3 - <<'PYCODE'
          from pathlib import Path
          target = Path('Concepts/TestProPmConcept.html')
          text = target.read_text(encoding='utf-8')
          injection = chr(10).join([
              '',
              '<!-- PMPRO_ONBOARDING_TOUR_V2 -->',
              '<link rel="stylesheet" href="./pmpro/onboarding.css">',
              '<script src="./pmpro/onboarding.js"></script>',
              ''
          ])
          if './pmpro/onboarding.css' not in text or './pmpro/onboarding.js' not in text:
              at = text.lower().rfind('</body>')
              if at < 0:
                  at = text.lower().rfind('</html>')
              if at < 0:
                  raise SystemExit('Could not find a safe injection point in TestProPmConcept.html')
              text = text[:at] + injection + text[at:]
              target.write_text(text, encoding='utf-8')
          if text.count('./pmpro/onboarding.css') != 1 or text.count('./pmpro/onboarding.js') != 1:
              raise SystemExit('PMPRO references are missing or duplicated')
          PYCODE
          node --check Concepts/pmpro/onboarding.js
          grep -Fq './pmpro/onboarding.css' Concepts/TestProPmConcept.html
          grep -Fq './pmpro/onboarding.js' Concepts/TestProPmConcept.html

      - name: Upload exact assembled concept for independent QA
        uses: actions/upload-artifact@v4
        with:
          name: test-pro-pm-concept-assembled
          path: |
            Concepts/TestProPmConcept.html
            Concepts/pmpro/onboarding.css
            Concepts/pmpro/onboarding.js
            Concepts/pmpro/README.md
          if-no-files-found: error
          retention-days: 7

      - name: Commit implementation and remove bootstrap material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pmpro-bootstrap
          rm -f .github/workflows/pmpro-bootstrap.yml
          git config user.name "Puppet Master concept builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A Concepts/TestProPmConcept.html Concepts/pmpro .pmpro-bootstrap .github/workflows/pmpro-bootstrap.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Rebuild newbie onboarding and guided tour"
          git push origin HEAD:concept/test-pro-pm-onboarding-tour
