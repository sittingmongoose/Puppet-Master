name: Assistant v3 matrix publication
on:
  push:
    branches: [completion/assistant-v3-demo-index-20260907]
    paths:
      - .github/workflows/assistant-v3-matrix-publication.yml
      - scripts/pm-assistant-v3-demo-matrix.py
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: python3 -m pip install PyYAML jsonschema
      - name: Generate source-exact identity matrix
        run: python3 scripts/pm-assistant-v3-demo-matrix.py
      - name: Verify unchanged concepts and current generated state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/assistant-final-checks
          python3 "Concepts/chat-assistant-concepts/5.6 Pro/build.py" --check > /tmp/assistant-final-checks/assistant-build.txt
          python3 Concepts/pm7-tools/build_testpm_assistant_settings.py --check > /tmp/assistant-final-checks/settings-build.txt
          python3 scripts/pm-plan-index.py validate > /tmp/assistant-final-checks/index.json
          python3 scripts/pm-shard-plans.py --check > /tmp/assistant-final-checks/shards.json
          python3 scripts/pm-plans-verify.py verify-spec-lock > /tmp/assistant-final-checks/spec-lock.json
          python3 scripts/pm-plans-verify.py validate-evidence > /tmp/assistant-final-checks/evidence.json
          set +e
          node tests/test_v3_residuals.js > /tmp/assistant-final-checks/node-suite.txt 2>&1
          printf '%s\n' "$?" > /tmp/assistant-final-checks/node-suite-exit-code.txt
          set -e
      - name: Publish matrix only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Puppet Master coverage verification'
          git config user.email '42017982+sittingmongoose@users.noreply.github.com'
          git add -f Plans/.audits/assistant-settings-v3/DEMO_REQUIREMENT_MATRIX.json Plans/.audits/assistant-settings-v3/DEMO_REQUIREMENT_MATRIX.csv Plans/.audits/assistant-settings-v3/DEMO_MATRIX_VALIDATION.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Publish 551-row two-workflow coverage matrix; retain unproven demo and native obligations'
            git push origin HEAD:completion/assistant-v3-demo-index-20260907
          fi
          git rev-parse HEAD > /tmp/assistant-final-checks/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-matrix-publication
          path: |
            /tmp/assistant-final-checks/
            Plans/.audits/assistant-settings-v3/DEMO_*MATRIX*
            Plans/.audits/assistant-settings-v3/DEMO_MATRIX_VALIDATION.json
          retention-days: 14
