<style>
/* =====================================================================
   C6 — SPLIT RAIL
   The panel itself carries a thin vertical glyph gutter — a recursive
   secondary nav of the panel's own sections — beside a dense, keyboard-
   first content column. The gutter gives constant orientation, so the
   content can be information-dense (tight rows, mono values) without
   feeling lost. Arrow Up/Down on the gutter moves sections. At max width
   the gutter grows abbreviated labels; at min width it's a glyph strip.
   ===================================================================== */
.side-panel-view { background: var(--surface); }

.sr-shell { flex: 1; display: flex; min-height: 0; }
.sr-gutter {
  flex: none; width: var(--sr-g, 42px);
  background: var(--surface-alt, var(--surface));
  border-right: 1px solid var(--border-light);
  display: flex; flex-direction: column; align-items: stretch;
  padding: var(--sm) 0; gap: 2px; overflow: hidden;
}
[data-theme^="friendly"] .sr-gutter { background: color-mix(in srgb, var(--pm6-cozy-card-base) 60%, transparent); border-right-color: var(--pm6-cozy-chrome-border); }
[data-theme^="glass"] .sr-gutter { background: rgba(var(--glass-tint-rgb), calc(var(--glass-alpha) * .5)); border-right-color: var(--glass-hairline); }
.sr-gbtn {
  position: relative; flex: none; width: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0; color: var(--text-secondary); cursor: pointer;
  border-left: 2px solid transparent;
  font-family: var(--display-font); font-size: 7.5px; font-weight: 700; letter-spacing: .4px;
  transition: color var(--motion-fast) var(--ease-out), background var(--motion-fast) var(--ease-out);
}
.sr-gbtn svg { width: 15px; height: 15px; }
.sr-gbtn .gl { display: none; line-height: 1; text-transform: uppercase; }
.sr-gbtn .gc { position: absolute; top: 4px; right: 6px; min-width: 12px; height: 12px; padding: 0 3px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--accent-primary) 22%, transparent); color: var(--accent-primary); font-family: var(--mono-font); font-size: 8px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.sr-gbtn:hover { color: var(--text-primary); background: var(--accent-soft); }
.sr-gbtn.active { color: var(--accent-primary); border-left-color: var(--accent-primary); background: var(--accent-soft); }
.sr-gbtn:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: -2px; }

.sr-content { flex: 1; min-width: 0; position: relative; }
.sr-pane { position: absolute; inset: 0; display: flex; flex-direction: column; padding: var(--md) var(--lg) var(--lg); }
.sr-pane.pm-hidden { display: none; }
.sr-ph { flex: none; display: flex; align-items: center; gap: var(--md); margin-bottom: var(--md); min-width: 0; }
.sr-pt { font-family: var(--display-font); font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--text-primary); flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-pc { font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); flex: none; }
.sr-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }

/* dense rows */
.sr-row { display: flex; align-items: center; gap: var(--sm); padding: 4px 2px; border-bottom: 1px solid var(--border-light); min-width: 0; cursor: default; }
.sr-row:last-child { border-bottom: none; }
.sr-row.click { cursor: pointer; }
.sr-row.click:hover { background: var(--accent-soft); }
.sr-ri { width: 12px; height: 12px; flex: none; color: var(--text-muted); }
.sr-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.sr-main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.sr-name { font-size: 11px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.sr-sub { font-size: 9px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-val { font-family: var(--mono-font); font-size: 9.5px; color: var(--text-secondary); flex: none; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-mono { font-family: var(--mono-font); }
.sr-kv { display: flex; justify-content: space-between; gap: var(--md); font-size: 10.5px; padding: 3px 2px; border-bottom: 1px dashed var(--border-light); }
.sr-kv:last-child { border-bottom: none; }
.sr-k { color: var(--text-muted); flex: none; }
.sr-v { color: var(--text-primary); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sr-group { font-family: var(--display-font); font-size: 8px; letter-spacing: 1.3px; color: var(--text-muted); padding: var(--md) 2px 3px; display: flex; align-items: center; gap: var(--sm); }
.sr-group::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }

.sr-pane .pm-btn { padding: 5px 9px; min-height: 24px; font-size: 9.5px; }
.sr-btns { display: flex; flex-wrap: wrap; gap: var(--sm); margin-top: var(--md); }
.sr-btns .pm-btn { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sr-acts { display: flex; flex-wrap: wrap; gap: var(--sm); margin-top: var(--sm); }
.sr-acts .pm-btn { padding: 4px 8px; min-height: 22px; font-size: 9px; }

.sr-flags { display: flex; align-items: center; gap: var(--sm); margin-top: var(--sm); }
.sr-flag { font-family: var(--mono-font); font-size: 10px; font-weight: 700; padding: 3px 8px; border: 1px solid var(--border-light); border-radius: var(--radius-xs); color: var(--text-muted); }
.sr-flag.on { color: var(--accent-primary); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent-primary) 40%, transparent); }
.sr-scope .pm6-tb-menu-trigger { border: 1px solid var(--border-light); border-radius: var(--radius-xs); margin-left: auto; padding: 3px 8px; font-family: var(--mono-font); font-size: 9.5px; }

.sr-hit { display: flex; gap: var(--sm); align-items: baseline; padding: 2px 2px 2px 16px; border-radius: var(--radius-xs); cursor: pointer; }
.sr-hit:hover { background: var(--accent-soft); }
.sr-ln { font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); min-width: 22px; text-align: right; flex: none; }
.sr-hit code { font-family: var(--mono-font); font-size: 9.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sr-hit em { font-style: normal; color: var(--text-primary); background: color-mix(in srgb, var(--accent-warning) 24%, transparent); border-radius: 2px; padding: 0 1px; }
.sr-file { display: flex; align-items: center; gap: var(--sm); font-family: var(--mono-font); font-size: 10px; color: var(--accent-blue); padding: 5px 2px 2px; cursor: pointer; }
.sr-file svg { width: 11px; height: 11px; }
.sr-file b { margin-left: auto; font-weight: 400; color: var(--text-muted); }

.sr-log { font-family: var(--mono-font); font-size: 9px; line-height: 1.5; background: color-mix(in srgb, var(--graph-failed) 6%, var(--surface-elevated)); border-left: 2px solid var(--graph-failed); border-radius: var(--radius-xs); padding: var(--sm) var(--md); margin: var(--sm) 0; }
.sr-log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-log .fail { color: var(--graph-failed); }

/* expandable worktree rows */
.sr-wt { border: 1px solid var(--border-light); border-radius: var(--radius-xs); margin-bottom: var(--sm); }
.sr-wt-h { display: flex; align-items: center; gap: var(--sm); padding: 5px 7px; cursor: pointer; min-width: 0; }
.sr-wt-h .chev { width: 10px; height: 10px; color: var(--text-muted); transition: transform var(--motion-med) var(--ease-default); flex: none; }
.sr-wt.open .chev { transform: rotate(90deg); }
.sr-wt-b { display: none; padding: 2px 7px 7px; }
.sr-wt.open .sr-wt-b { display: block; }

.sr-graph { font-family: var(--mono-font); font-size: 9.5px; display: flex; flex-direction: column; gap: 3px; }
.sr-gn { display: flex; align-items: center; gap: var(--sm); }
.sr-gn .dot { width: 7px; height: 7px; }
.sr-gind { padding-left: 14px; position: relative; }
.sr-gind::before { content: ''; position: absolute; left: 3px; top: -6px; width: 7px; height: 11px; border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); }

.sr-chain { position: relative; padding-left: 20px; }
.sr-chain::before { content: ''; position: absolute; left: 7px; top: 9px; bottom: 9px; width: 1px; background: var(--border-light); }
.sr-stage { position: relative; display: flex; align-items: center; gap: var(--sm); padding: 3px 0; min-width: 0; }
.sr-stage i { position: absolute; left: -20px; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; font-family: var(--mono-font); font-size: 8px; font-style: normal; border-radius: 50%; background: var(--surface-elevated); border: 1px solid var(--border); color: var(--text-muted); }
.sr-stage.done i { border-color: var(--graph-passed); color: var(--graph-passed); }
.sr-stage.now i { border-color: var(--graph-running); color: var(--graph-running); }
.sr-stage-l { font-size: 10px; color: var(--text-secondary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sr-fam { font-family: var(--mono-font); font-size: 8px; padding: 1px 5px; border-radius: 2px; background: color-mix(in srgb, var(--accent-blue) 14%, transparent); color: var(--accent-blue); flex: none; }

.side-panel-slot[data-wtier="min"] { --sr-g: 32px; }
.side-panel-slot[data-wtier="min"] .sr-pane { padding: var(--sm) var(--md) var(--md); }
.side-panel-slot[data-wtier="min"] .sr-gbtn svg { width: 13px; height: 13px; }
.side-panel-slot[data-wtier="min"] .sr-gbtn .gc { right: 3px; }
.side-panel-slot[data-wtier="min"] .sr-val,
.side-panel-slot[data-wtier="min"] .sr-sub,
.side-panel-slot[data-wtier="min"] .sr-pc { display: none; }
.side-panel-slot[data-wtier="wide"] { --sr-g: 60px; }
.side-panel-slot[data-wtier="wide"] .sr-gbtn .gl { display: block; }
</style>
</head>

<script>

/* keyboard-first gutter: Arrow Up/Down moves between sections */
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown') return;
  var g = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.sr-gbtn') : null;
  if (!g) return;
  ev.preventDefault();
  var btns = Array.prototype.slice.call(g.parentElement.querySelectorAll('.sr-gbtn'));
  var i = btns.indexOf(g);
  var n = btns[(i + (ev.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length];
  n.focus(); n.click();
});
</script>
