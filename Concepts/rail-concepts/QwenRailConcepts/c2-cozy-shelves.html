/* =====================================================================
   C2 — COZY SHELVES
   The rail as a set of soft, category-tinted shelves: rounded pill
   banners, comfortable pill rows, gentle lift on hover. Tints derive from
   the per-shelf category accent so it stays theme-correct on all 8 themes
   (no hardcoded pastels). The opposite register to C1's hard gauges —
   warmth, rounded corners, breathing room — collapsing gracefully to a
   tinted tab strip at minimum width.

   Unified chrome (this revision): a single segmented tab bar (.pm-segtab:
   line-icon stacked over an uppercase label, active = accent + 2px
   underline) drives the sub-views of every multi-section panel, and one
   compact button vocabulary (square per-row icon buttons, equal-width
   segmented action rows, pill text buttons) replaces the old scattered
   pills. Shelves no longer clip their children, so the PM sprout menus
   float cleanly over the shelf below them.
   ===================================================================== */
.side-panel-view { background: var(--surface); }

/* pill banner head */
.sh-banner {
  flex: none; display: flex; align-items: center; gap: var(--md);
  padding: var(--lg); min-width: 0; overflow: visible;
  margin: var(--md) var(--md) 0;
  border-radius: var(--radius-lg);
  background: var(--surface-elevated);
  box-shadow: var(--elev-1);
  position: relative; z-index: 3;
}
.sh-bico {
  width: 26px; height: 26px; flex: none; border-radius: var(--radius-pill);
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--accent-primary) 16%, transparent);
  color: var(--accent-primary);
}
.sh-bico svg { width: 13px; height: 13px; }
/* banner title keeps a guaranteed share so the status pill yields (ellipsizes) first at 240-280px (retro fonts run wide) */
.sh-title { font-family: var(--display-font); font-size: 11px; font-weight: 700; letter-spacing: .4px; flex: 1 1 auto; min-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-bstatus { margin-left: auto; flex: 0 4 auto; min-width: 0; max-width: 50%; display: inline-flex; align-items: center; gap: 6px; font-size: 9.5px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--graph-passed) 14%, transparent); color: var(--graph-passed); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-bstatus .sh-btext { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* status chip that doubles as a toggle for the advanced-index panel */
.sh-bstatus.sh-idxtoggle { cursor: pointer; user-select: none; display: inline-flex; align-items: center; min-width: 0; max-width: 68%; transition: background var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out); }
.sh-bstatus.sh-idxtoggle:hover { background: color-mix(in srgb, var(--graph-passed) 24%, transparent); }
.sh-bstatus .sh-idxlabel { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-bstatus .sh-bchev { width: 10px; height: 10px; flex: none; transition: transform var(--motion-med) var(--ease-default); }
.sh-bstatus.open .sh-bchev { transform: rotate(180deg); }
/* a shelf whose sprout menu is open must paint above the shelves below it.
   State class (.menu-open) is toggled by page JS off the shared menu.js
   is-open hooks — no :has(), so the Slint port gets an explicit boolean. */
.sh-shelf.menu-open { position: relative; z-index: 6; }
/* Open menus lift accordion/row overflow so sprout panels are not clipped */
.sh-shelf.menu-open .pm-acc-inner,
.sh-shelf.menu-open .sh-accb,
[data-acc].menu-open .pm-acc-inner,
[data-acc].menu-open > .sh-accb { overflow: visible !important; }
.sh-run.menu-open,
.sh-ctr.menu-open,
.sh-wt.menu-open,
.sh-chg.menu-open,
.sh-commit.menu-open { overflow: visible !important; }
.pm6-tb-menu-wrap.menu-open { position: relative; z-index: 50; }
/* Rail menus portal to body while open (see _shared/menu.js) */
/* history commits: no inset left accent rail on hover (base.css .sh-commit:hover) */
.sh-commit:hover, .sh-commit-h:hover { box-shadow: none !important; border-left-color: transparent !important; }
/* no flashing left rail on running rows (keep the dot pulse, drop the blink
   stripe). Rows that contain a running dot carry an explicit .is-running
   class in markup (Slint: per-row boolean) instead of :has(.dot-run). */
.sh-row.is-running::after { content: none; }
/* banner status that collapses to its indicator light at the min tier (Docker ctx) */
.sh-bstatus[data-narrow="light"] .sh-btext { transition: opacity var(--motion-fast) var(--ease-out); }
/* defensive ellipsis so bold row names never hard-clip (basic theme exposed these) */
.sh-name, .sh-rlabel, .fm-path, .ad-cttl, .ad-rname, .sh-fileh { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* inside the column wrapper, size the name to content but let it shrink so the
   nested status chip never overflows the row (base rule is flex:1 = grow) */
.sh-main > .sh-name { flex: 0 1 auto; }
/* the name's text lives in its own shrinkable span so it can ellipsize inside
   the flex container; the nested status chip keeps its natural width */
.sh-name > .sh-nm-txt { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-name > .pm-chip, .sh-name > .pm-gs { flex: none; }
.sh-run-h, .sh-ctr-h { min-width: 0; max-width: 100%; }
.sh-run-h .pm-chip, .sh-ctr-h .pm-chip, .sh-bstatus .pm-chip { flex: 0 1 auto; max-width: 42%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Docker's 6-tab bar: labels shorten by measure (data-fit on the segtab) */
.pm-segtab.fm-docktabs .pm-segtab-item > .eq-full,
.pm-segtab.fm-docktabs .pm-segtab-item > .eq-abbr { display: none; }
.pm-segtab.fm-docktabs .pm-segtab-item svg { width: 16px; height: 16px; }
.pm-segtab.fm-docktabs[data-fit="abbr"] .pm-segtab-item > .eq-abbr { display: inline; }
.pm-segtab.fm-docktabs[data-fit="abbr"] .pm-segtab-item svg { width: 15px; height: 15px; }
.pm-segtab.fm-docktabs[data-fit="full"] .pm-segtab-item > .eq-full { display: inline; }
.pm-segtab.fm-docktabs[data-fit="full"] .pm-segtab-item svg { width: 15px; height: 15px; }
/* at the min tier the artifacts type-pill yields its space to the title */
.side-panel-slot[data-wtier="min"] .sh-card .sh-fam { display: none; }
/* at the min tier agent/container rows drop the secondary meta line so the
   name + status chip fit without clipping (there's no room for all three) */
.side-panel-slot[data-wtier="min"] .sh-run-h .sh-meta,
.side-panel-slot[data-wtier="min"] .sh-ctr-h .sh-meta { display: none; }
/* cap the secondary meta line so name + status chip always fit (basic @220) */
.sh-run-h .sh-meta, .sh-ctr-h .sh-meta { flex: 0 1 38%; min-width: 0; }
.fm-regrow { display: flex; flex-direction: column; gap: 4px; padding: 6px 2px; border-bottom: 1px solid color-mix(in srgb, var(--border-light) 70%, transparent); }
.fm-regrow:last-of-type { border-bottom: 0; }
.fm-regname { font-family: var(--mono-font); font-size: 10.5px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fm-regstat { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fm-regnote { font-size: 9px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* worktree filter chips: one line; abbreviate at the min tier */
.sh-wtchips { flex-wrap: nowrap !important; overflow-x: auto; scrollbar-width: thin; }
.sh-wtchips .pm-chipbtn { flex: 0 0 auto; }
.sh-wtchips .pm-chipbtn .wt-abbr { display: none; }
.sh-wtchips .pm-chipbtn .wt-full { display: inline; }
/* advanced-index panel that drops from under the banner.
   Only max-height + opacity animate (Slint: height + opacity); the open
   spacing lives INSIDE the clipped box (inner shelf margin-top) so no
   margin transition is needed. */
.sh-idxpanel { overflow: hidden; max-height: 0; opacity: 0; margin: 0 var(--md); transition: max-height var(--motion-med) var(--ease-out), opacity var(--motion-med) var(--ease-out); }
.sh-idxpanel.open { max-height: 268px; opacity: 1; }
.sh-idxpanel .sh-shelf { margin-top: var(--sm); margin-bottom: 0; }
.side-panel-slot[data-wtier="min"] .sh-idxpanel { margin: 0 var(--sm); }
@media (prefers-reduced-motion: reduce) { .sh-idxpanel { transition: opacity var(--motion-fast) var(--ease-out); } .sh-idxpanel:not(.open) { max-height: 0; } .sh-idxpanel.open { max-height: 268px; } }
[data-reduced-motion="1"] .sh-idxpanel { transition: opacity var(--motion-fast) var(--ease-out); }
[data-reduced-motion="1"] .sh-idxpanel:not(.open) { max-height: 0; }
[data-reduced-motion="1"] .sh-idxpanel.open { max-height: 268px; }
/* branch picker — full width of the Changes pane at every tier */
.sh-bbranch { display: block; width: 100%; flex: none; margin-left: 0; max-width: none; min-width: 0; }
.sh-bbranch .pm6-tb-menu-trigger { display: flex; align-items: center; gap: 6px; min-width: 0; width: 100%; border: 1px solid var(--border-light); border-radius: var(--radius-pill); padding: 3px 9px; box-sizing: border-box; }
.sh-bbranch .pm6-tb-menu-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-bbranch .pm6-tb-menu { min-width: 100%; width: 100%; box-sizing: border-box; }

.sh-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--md); }
/* let sprout popups float over neighbouring chrome instead of being clipped
   at narrow widths (a 210px menu inside a 220px panel must not be cut off) */
.side-panel-slot { overflow: visible; }

/* ---- unified segmented tab bar (icon over label, sliding ink underline) ---- */
.pm-segtab {
  flex: none; display: flex; position: relative;
  margin: var(--md) var(--md) 0;
  border-bottom: 1px solid var(--border-light);
  background: color-mix(in srgb, var(--cat, var(--accent-primary)) 5%, var(--surface-elevated));
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  overflow: hidden;
}
/* sliding active underline (ported from the files variant, adapted to
   transform-only motion: fixed 100px basis scaled/translated by JS —
   Slint: animated x + width on a 2px Rectangle, never a width transition) */
.pm-segtab-ink { position: absolute; left: 0; bottom: 0; height: 2px; width: 100px; background: var(--cat, var(--accent-primary)); border-radius: 2px 2px 0 0; transform: scaleX(0); transform-origin: 0 50%; transition: transform var(--motion-med) var(--ease-default); pointer-events: none; }
.pm-segtab-item {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 2px 8px; margin-bottom: -1px;
  background: none; border: 0; border-bottom: 2px solid transparent;
  cursor: pointer; color: var(--text-muted);
  font-family: var(--display-font); font-size: 8px; font-weight: 700; letter-spacing: 1px;
  transition: color var(--motion-fast) var(--ease-out), background var(--motion-fast) var(--ease-out);
}
.pm-segtab-item svg { width: 15px; height: 15px; flex: none; transition: transform var(--motion-med) var(--ease-default); }
.pm-segtab-item.active svg { transform: translateY(-1px) scale(1.1); }
.pm-segtab-item > span { max-width: 100%; padding: 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pm-segtab-item:hover { color: var(--text-secondary); background: color-mix(in srgb, var(--cat, var(--accent-primary)) 6%, transparent); }
.pm-segtab-item.active { color: var(--cat, var(--accent-primary)); }

/* shelves */
.sh-shelf {
  border-radius: var(--radius-lg);
  background: color-mix(in srgb, var(--cat, var(--accent-blue)) 7%, var(--surface-elevated));
  border: 1px solid color-mix(in srgb, var(--cat, var(--accent-blue)) 16%, var(--border-light));
  margin-bottom: var(--md);
  overflow: visible;
  box-shadow: var(--elev-1);
}
.sh-head {
  display: flex; align-items: center; gap: var(--md);
  padding: var(--md) var(--lg);
  background: color-mix(in srgb, var(--cat, var(--accent-blue)) 11%, transparent);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}
.sh-head[data-collapse] { cursor: pointer; }
.sh-hico {
  width: 22px; height: 22px; flex: none; border-radius: var(--radius-pill);
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--cat, var(--accent-blue)) 20%, transparent);
  color: var(--cat, var(--accent-blue));
}
.sh-hico svg { width: 12px; height: 12px; }
.sh-hlabel { font-family: var(--display-font); font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; color: var(--text-primary); }
.sh-hcount { margin-left: auto; flex: 0 1 auto; max-width: 48%; font-size: 9.5px; font-weight: 700; padding: 1px 8px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--cat, var(--accent-blue)) 16%, transparent); color: var(--cat, var(--accent-blue)); white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sh-hcount .hc-full, .sh-hcount .hc-abbr { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sh-hstatus { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 9px; font-weight: 700; padding: 2px 9px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--graph-passed) 14%, transparent); color: var(--graph-passed); white-space: nowrap; }
.sh-hstatus .dot { width: 7px; height: 7px; flex: none; }
.sh-body { padding: var(--md) var(--lg) var(--lg); }

/* cozy buttons */
.side-panel-view .pm-btn { border-radius: var(--radius-pill); }
.side-panel-view .pm-btn:hover { transform: translateY(-1px); box-shadow: var(--elev-hover); }
.side-panel-view .pm-minibtn { border-radius: var(--radius-pill); width: 24px; height: 24px; }

/* ---- generic accordion body (base.css spring grid owns expand/collapse;
   keep padding only — do not fight display:grid !important) ---- */
.sh-accb { padding: 0 var(--lg) var(--lg); }
.sh-accchev { width: 10px; height: 10px; color: var(--text-muted); transition: transform var(--motion-med) var(--ease-default); flex: none; }
/* only the owning row's host chevron (direct child) — never nested SVGs or nested expanders */
[data-acc].open > [data-collapse] > .sh-accchev { transform: rotate(90deg); }

/* pill rows */
.sh-row {
  display: flex; align-items: center; gap: var(--md);
  padding: 6px 8px; border-radius: var(--radius-md); min-width: 0;
  transition: background var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out);
  cursor: pointer;
}
.sh-row:hover { background: color-mix(in srgb, var(--cat, var(--accent-blue)) 10%, transparent); transform: translateX(2px); }
.sh-row.flat { cursor: default; }
.sh-row.flat:hover { transform: none; }
.sh-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.sh-main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.sh-name { font-size: 11.5px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.sh-meta { font-size: 9.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-mono { font-family: var(--mono-font); }
.sh-rowact { display: flex; gap: var(--xs); flex: none; margin-left: auto; }

/* changed-file / branch / stash rows as collapsed expanders: header keeps the
   pill-row look (button-free — actions live in the sprung .sh-accb body) */
.sh-chg { border-radius: var(--radius-md); min-width: 0; }
.sh-chg-h { display: flex; align-items: center; gap: var(--md); padding: 6px 8px; border-radius: var(--radius-md); cursor: pointer; min-width: 0; }
.sh-chg-h:hover { background: color-mix(in srgb, var(--cat, var(--accent-blue)) 10%, transparent); }
.sh-chg > .sh-accb { padding: 0 8px 6px 24px; }
/* compact +N/-N diffstat chip so collapsed headers carry the triage signal */
.sh-ds { flex: none; font-family: var(--mono-font); font-size: 9px; white-space: nowrap; }
.sh-ds .add { color: var(--graph-passed); font-weight: 700; }
.sh-ds .del { color: var(--graph-failed); font-weight: 700; }
/* first-hunk preview line inside a changed-file body (mono, dim) */
.sh-hunkprev { font-family: var(--mono-font); font-size: 9.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0 0; }
/* files-touched mini rows (commit / stash bodies): path ellipsizes, stat stays */
.sh-cfl { display: flex; align-items: baseline; gap: var(--md); font-family: var(--mono-font); font-size: 9.5px; color: var(--text-secondary); padding: 1px 0; min-width: 0; }
.sh-cfl .f { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sh-kv { display: flex; align-items: baseline; justify-content: space-between; gap: var(--md); padding: 3px 2px; font-size: 11.5px; }
.sh-k { color: var(--text-muted); flex: none; }
.sh-v { color: var(--text-primary); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* wrapping kv for long mono keys (secrets / image digests) */
.sh-kvwrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px var(--md); padding: 3px 2px; font-size: 11.5px; }
.sh-kvwrap .sh-k { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
.sh-kvwrap .pm-chip { flex: none; }

/* equal-width + commit action rows */
.pm-eqrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sm); margin-top: var(--sm); }
.pm-eqrow .pm-btn { min-width: 0; padding: 5px 6px; }
.eq-abbr { display: none; }
.pm-commitrow { display: flex; align-items: center; gap: var(--sm); margin-top: var(--sm); }
.pm-commitrow .pm-input { flex: 1; min-width: 0; }
.pm-commitrow .pm-minibtn { flex: none; }
.pm-commitrow .pm-btn { flex: 0 0 auto; }

/* search */
.sh-flags { display: flex; align-items: center; gap: var(--sm); margin-top: var(--md); }
.sh-flag { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--cat) 8%, transparent); border: 1px solid color-mix(in srgb, var(--cat) 16%, transparent); color: var(--text-secondary); transition: all var(--motion-fast) var(--ease-out); }
.sh-flag:hover { color: var(--text-primary); }
.sh-flag.on { color: var(--cat); background: color-mix(in srgb, var(--cat) 18%, transparent); border-color: color-mix(in srgb, var(--cat) 40%, transparent); }
/* scope trigger shrinks with an ellipsized label instead of overflowing the flags row at 240px */
.sh-flags .sh-scope { margin-left: auto; flex: 0 1 auto; min-width: 0; }
.sh-scope .pm6-tb-menu-trigger { border: 1px solid color-mix(in srgb, var(--cat) 18%, transparent); border-radius: var(--radius-pill); padding: 4px 9px; display: flex; align-items: center; gap: 4px; max-width: 100%; }
.sh-scope .pm6-tb-menu-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-stats { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sm); margin-top: var(--md); font-family: var(--mono-font); font-size: 9.5px; color: var(--text-secondary); }
.sh-stats b { color: var(--text-primary); font-weight: 700; }
.sh-stats .dot { width: 7px; height: 7px; flex: none; }
/* min tier: drop the timing chunk so the stats stay one line (Slint has no wrapping row) */
.sh-stats .sh-stat-time { display: inline-flex; align-items: center; gap: var(--sm); }
.side-panel-slot[data-wtier="min"] .sh-stats .sh-stat-time { display: none; }
/* segmented tabs sitting directly under the banner (search find/replace) */
.pm-segtab.flat { margin: var(--sm) var(--md) 0; border-radius: 0; background: transparent; }
/* sticky action footer pinned to the panel bottom (independent of scroll) */
.sh-foot { flex: none; display: flex; align-items: center; gap: var(--sm); padding: var(--sm) var(--md); background: var(--surface-elevated); border-top: 1px solid var(--border-light); box-shadow: 0 -6px 14px -10px color-mix(in srgb, var(--text-primary) 40%, transparent); }
.sh-foot .sh-footcount { font-family: var(--mono-font); font-size: 10px; color: var(--text-muted); white-space: nowrap; }
.sh-foot .sh-footcount b { color: var(--text-primary); font-weight: 700; }
.side-panel-slot[data-wtier="min"] .sh-foot { padding: var(--sm); }

.sh-file { background: color-mix(in srgb, var(--cat) 5%, var(--surface-elevated)); border-radius: var(--radius-md); margin-bottom: var(--sm); overflow: hidden; }
.sh-fileh { display: flex; align-items: center; gap: var(--sm); padding: 6px 9px; cursor: pointer; font-family: var(--mono-font); font-size: 10.5px; color: var(--cat); }
/* the path lives in its own shrinkable span so it ellipsizes and the count <b> stays visible */
.sh-fileh .sh-fp { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-fileh b { margin-left: auto; flex: none; font-weight: 400; color: var(--text-muted); }

/* tests runs expandable rows (attention-deck style: wrapping meta line) */
.sh-run { border-radius: var(--radius-md); margin-bottom: var(--sm); background: var(--surface-elevated); border: 1px solid var(--border-light); overflow: hidden; }
.sh-run-h { display: flex; align-items: center; gap: var(--md); padding: 7px 9px; cursor: pointer; min-width: 0; }
/* two-line clamp via fixed max-height clip (Slint-portable: fixed-height wrapped Text with clip, no -webkit-line-clamp) */
.sh-runmeta { font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); white-space: normal; overflow: hidden; max-height: 26px; line-height: 1.4; }
/* GitHub Actions run expanders: always-visible failure banner (outside .sh-accb),
   per-job mini-rows, step sublines, artifacts strip, dispatch mini-form */
.sh-runfail { font-family: var(--mono-font); font-size: 9px; color: var(--graph-failed); padding: 0 9px 6px 29px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-job { display: flex; align-items: center; gap: var(--sm); padding: 2px; font-size: 10.5px; min-width: 0; }
.sh-job .sh-dot { width: 7px; height: 7px; }
.sh-jname { color: var(--text-primary); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-jdur { margin-left: auto; font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); flex: none; }
.sh-jstep { font-family: var(--mono-font); font-size: 9px; color: var(--graph-failed); padding: 0 2px 3px 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-jstep.muted { color: var(--text-muted); }
.sh-arth { font-size: 9.5px; font-weight: 700; letter-spacing: .4px; color: var(--text-secondary); margin-top: var(--sm); padding: 2px; }
.sh-art { display: flex; align-items: center; gap: var(--sm); padding: 2px 2px 2px 15px; font-family: var(--mono-font); font-size: 9.5px; color: var(--text-primary); min-width: 0; cursor: pointer; border-radius: var(--radius-sm); }
.sh-art:hover { background: color-mix(in srgb, var(--cat, var(--accent-blue)) 9%, transparent); }
.sh-art.expired { color: var(--text-muted); cursor: default; }
.sh-art.expired:hover { background: none; }
.sh-grp { font-family: var(--display-font); font-size: 8.5px; font-weight: 700; letter-spacing: 1.2px; color: var(--text-muted); padding: var(--md) 2px 1px; }
.sh-dispform { display: flex; flex-direction: column; gap: var(--sm); margin-top: var(--sm); padding: var(--md); border: 1px dashed var(--border-light); border-radius: var(--radius-md); }
.sh-dfk { font-size: 8.5px; font-weight: 700; letter-spacing: 1px; color: var(--text-muted); }
.sh-dfrow { display: flex; align-items: center; gap: var(--md); min-width: 0; }
.sh-dfrow > .sh-k { flex: none; font-size: 10px; min-width: 44px; }
.sh-dfrow .pm6-tb-menu-wrap { flex: 1 1 auto; min-width: 0; }
.sh-dfrow .pm6-tb-menu-trigger { width: 100%; }
.sh-chk { display: flex; align-items: center; gap: var(--sm); font-size: 10.5px; color: var(--text-primary); cursor: pointer; }
.sh-chk input { accent-color: var(--cat, var(--accent-blue)); width: 12px; height: 12px; margin: 0; flex: none; }

/* agents expandable detail */
.sh-agdetail { padding: 2px 2px 4px; }

/* name text absorbs shrinkage before nested status chips do — chips keep
   their natural width until the name is fully ellipsized (fit intent above) */
.sh-name > .sh-nm-txt { flex-shrink: 40; }
/* testing/agents state additions: live-run border (explicit .is-running class,
   mirrors .sh-ctr.is-running — Slint: per-row boolean, no :has()) */
.sh-run.is-running { border-color: color-mix(in srgb, var(--graph-running) 45%, transparent); background: linear-gradient(90deg, color-mix(in srgb, var(--graph-running) 7%, transparent), var(--surface-elevated) 62%); }
/* errored (harness/compile/setup failure) is NOT failed (assertion) — distinct orange chip */
.pm-chip-errored { background: color-mix(in srgb, var(--accent-orange) 14%, transparent); color: var(--accent-orange); border-color: color-mix(in srgb, var(--accent-orange) 32%, transparent); }
/* informational pm-note variant: neutral border + muted glyph instead of the warning tint */
.pm-note-info { background: color-mix(in srgb, var(--accent-blue) 7%, transparent); border-color: var(--border-light); }
.pm-note-info svg { color: var(--text-muted); }
/* assurance note that sits between a shelf head and its collapsed body */
.sh-shelf > .pm-note { margin: var(--md) var(--lg); }
/* changed-since-last-view marker on collapsed agent headers (real app clears it on expand) */
.sh-chgdot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-primary); flex: none; }
/* tiny model mark in identity kvs — tooltip carries the full model string */
.sh-modelmark { font-family: var(--mono-font); font-size: 8.5px; font-weight: 700; padding: 0 6px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--cat, var(--accent-blue)) 14%, transparent); color: var(--cat, var(--accent-blue)); }
/* collapsible sumcards (lane capacity): header toggles, body springs via the shared .sh-accb layer */
.pm-sumcard[data-acc] .pm-sumcard-h[data-collapse] { cursor: pointer; }
.pm-sumcard[data-acc] > .sh-accb { padding: 0; }
.pm-sumcard .sh-accchev { width: 9px; height: 9px; }
/* one-line last-run receipt summary */
.sh-lrline { display: flex; align-items: center; gap: var(--md); margin-bottom: var(--md); min-width: 0; }
.sh-lrsum { font-family: var(--mono-font); font-size: 10px; color: var(--text-secondary); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* chip row as soft segmented pills */
.side-panel-view .pm-chipbtn { border-radius: var(--radius-pill); }


/* progressive disclosure — labels shorten by MEASURE (data-fit), not by a
   hardcoded width tier. JS tries full, then abbr/symbol when the pill or its
   row overflows at the current rail width (see pillFit below). */
.sh-bstatus .sh-bshort { display: none; }
.sh-bstatus.sh-idxtoggle { max-width: 68%; }
.pm-chip .chip-abbr { display: none; }
.sh-hcount .hc-abbr { display: none; } /* paired with .hc-full default */

/* data-fit states */
.sh-bstatus .sh-idxabbr { display: none; }
.sh-bstatus[data-narrow="short"][data-fit="abbr"] .sh-bfull { display: none; }
.sh-bstatus[data-narrow="short"][data-fit="abbr"] .sh-bshort { display: inline; }
.sh-bstatus[data-narrow="short"][data-fit="abbr"] .sh-idxfull { display: none; }
.sh-bstatus[data-narrow="short"][data-fit="abbr"] .sh-idxabbr { display: inline; }
.sh-bstatus[data-narrow="extra"][data-fit="abbr"] .sh-bextra,
.sh-bstatus[data-narrow="extra"][data-fit="symbol"] .sh-bextra { display: none; }
.sh-bstatus[data-narrow="symbol"][data-fit="abbr"] .sh-btext,
.sh-bstatus[data-narrow="symbol"][data-fit="abbr"] .sh-idxlabel,
.sh-bstatus[data-narrow="symbol"][data-fit="symbol"] .sh-btext,
.sh-bstatus[data-narrow="symbol"][data-fit="symbol"] .sh-idxlabel { display: none; }
.sh-bstatus[data-narrow="symbol"][data-fit="abbr"],
.sh-bstatus[data-narrow="symbol"][data-fit="symbol"] { flex: 0 0 auto; max-width: none; padding: 5px 7px; gap: 4px; }
.sh-bstatus[data-narrow="light"][data-fit="abbr"] .sh-btext,
.sh-bstatus[data-narrow="light"][data-fit="symbol"] .sh-btext { display: none; }
.sh-bstatus[data-narrow="light"][data-fit="abbr"],
.sh-bstatus[data-narrow="light"][data-fit="symbol"] { display: inline-flex; padding: 5px; }
.sh-bstatus[data-fit="abbr"] .sh-bextra,
.sh-bstatus[data-fit="symbol"] .sh-bextra { display: none; }
.pm-chip[data-narrow-chip][data-fit="abbr"] .chip-full { display: none; }
.pm-chip[data-narrow-chip][data-fit="abbr"] .chip-abbr { display: inline; }
.pm-chip[data-narrow-chip][data-fit="abbr"] { max-width: none; padding: 1px 6px; }
.sh-hcount[data-fit="abbr"] .hc-full { display: none; }
.sh-hcount[data-fit="abbr"] .hc-abbr { display: inline; }
.sh-wtchips[data-fit="abbr"] .pm-chipbtn { padding: 4px 7px; }
.sh-wtchips[data-fit="abbr"] .wt-full { display: none; }
.sh-wtchips[data-fit="abbr"] .wt-abbr { display: inline; }
.pm-eqrow[data-fit="abbr"] .eq-full,
.pm-btnrow[data-fit="abbr"] .eq-full,
.pm-segtab[data-fit="abbr"] .eq-full { display: none; }
.pm-eqrow[data-fit="abbr"] .eq-abbr,
.pm-btnrow[data-fit="abbr"] .eq-abbr,
.pm-segtab[data-fit="abbr"] .eq-abbr { display: inline; }
/* Measure pass: lay out inactive panels / hidden panes INVISIBLY so banner
   tabs and always-visible pills can be fitted. Do NOT force-expand closed
   accordion bodies (that thrashed layout while dragging). Body chips refit
   when the row opens via PMPillFit(acc). Do NOT set animation:none on the
   whole slot — restoring it retriggers railPanelIn (black flash). */
.side-panel-slot.pill-fit-measure .side-panel-view:not(.active) {
  display: flex !important;
  position: absolute !important;
  inset: 0;
  visibility: hidden !important;
  pointer-events: none !important;
  z-index: -1;
  animation: none !important;
}
.side-panel-slot.pill-fit-measure [data-pane].pm-hidden {
  display: flex !important;
  flex-direction: column !important;
  position: absolute !important;
  inset: 0;
  visibility: hidden !important;
  pointer-events: none !important;
  z-index: -1;
}
.side-panel-slot.pill-fit-measure [data-pane].pm-hidden > * {
  animation: none !important;
}

/* history: no left border / rail on hover */
.sh-commit, .sh-commit-h { border-left: 0 !important; box-shadow: none !important; }
.sh-commit:hover, .sh-commit-h:hover { background: color-mix(in srgb, var(--cat) 10%, transparent); box-shadow: none !important; border-left: 0 !important; }
.sh-commit::before, .sh-commit::after, .sh-commit-h::before, .sh-commit-h::after { content: none !important; }
/* investigation body must clear the head */
.sh-body.sh-accb { padding-top: var(--md); }
.sh-shelf[data-acc] > .sh-head { position: relative; z-index: 2; }
.sh-shelf[data-acc] > .sh-body.sh-accb { position: relative; z-index: 1; padding-top: var(--md); }
/* investigation starts open so the chip row is visible for fit-checks */
#panel-artifacts .sh-shelf[data-acc] > .sh-body.sh-accb .pm-chip { position: relative; z-index: 0; }
/* compose identity split rows */
.sh-cmpid { display: flex; flex-direction: column; align-items: stretch; gap: var(--sm); padding: 0 2px var(--sm); min-width: 0; }
.sh-cmpid-row { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sm); min-width: 0; }
.sh-cmpid .sh-cmpf { flex: 1 1 90px; min-width: 56px; font-family: var(--mono-font); font-size: 9.5px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-cmpid .pm-minibtn { flex: none; margin-left: auto; }


/* agent timing sits under the header row so it fits at mid/min (not only wide) */
.sh-agtime { display: flex; align-items: center; gap: var(--sm); padding: 0 8px 5px 28px; font-family: var(--mono-font); font-size: 9.5px; color: var(--text-muted); min-width: 0; }
.sh-agtime b { color: var(--text-secondary); font-weight: 700; }
#panel-agents .sh-run-h .pm-rmetric { display: none !important; }
#panel-agents .sh-agtime { display: flex; }

/* width tiers — layout chrome only (padding, icon-only tabs). Pill *labels*
   are data-fit measured, not tier-gated. */
.side-panel-slot[data-wtier="min"] .sh-owner { display: none; }
.side-panel-slot[data-wtier="min"] .sh-bbranch { width: 100%; max-width: none; }
.side-panel-slot[data-wtier="min"] .sh-bbranch .pm6-tb-menu-trigger { width: 100%; max-width: none; padding: 4px 8px; }
.side-panel-slot[data-wtier="min"] .sh-head { padding: var(--md); }
.side-panel-slot[data-wtier="min"] .sh-body { padding: var(--sm) var(--md) var(--md); }
.side-panel-slot[data-wtier="min"] .sh-accb { padding: 0 var(--md) var(--md); }
.side-panel-slot[data-wtier="min"] .sh-banner { padding: var(--md); margin: var(--sm) var(--sm) 0; }
.side-panel-slot[data-wtier="min"] .pm-segtab { margin: var(--sm) var(--sm) 0; }
.side-panel-slot[data-wtier="min"] .sh-scroll { padding: var(--sm); }
.side-panel-slot[data-wtier="min"] .sh-title { font-size: 10.5px; letter-spacing: .2px; }
.side-panel-slot[data-wtier="min"] .pm-segtab-item { gap: 0; padding: 8px 1px 7px; }
.side-panel-slot[data-wtier="min"] .pm-segtab-item > span { display: none; }
.side-panel-slot[data-wtier="min"] .pm-segtab-item svg { width: 16px; height: 16px; }

/* pane entrance: staggered rise on subview switches (ported fmPaneIn pattern;
   transform/opacity only, delays capped at the 4th child, reduced-motion safe) */
@keyframes shPaneIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
[data-pane]:not(.pm-hidden) > * { animation: shPaneIn .3s var(--ease-out) both; }
[data-pane]:not(.pm-hidden) > *:nth-child(2) { animation-delay: .05s; }
[data-pane]:not(.pm-hidden) > *:nth-child(3) { animation-delay: .1s; }
[data-pane]:not(.pm-hidden) > *:nth-child(n+4) { animation-delay: .15s; }

@media (prefers-reduced-motion: reduce) {
  .sh-stage.now .sh-stgnum::after { content: none; }
  .sh-thumb::after { transition: none; }
  .pm-segtab-ink { transition: none; }
  [data-pane]:not(.pm-hidden) > * { animation: none; }
}
[data-reduced-motion="1"] .sh-stage.now .sh-stgnum::after { content: none; }
[data-reduced-motion="1"] .sh-thumb::after { transition: none; }
[data-reduced-motion="1"] .pm-segtab-ink { transition: none; }
[data-reduced-motion="1"] [data-pane]:not(.pm-hidden) > * { animation: none; }
</style>

<script>PMChrome.boot({ badge: { id: 'C2', name: 'Cozy Shelves' } });
(function () {
  var t = document.getElementById('shIdxToggle'), p = document.getElementById('shIdxPanel');
  if (t && p) t.addEventListener('click', function () {
    var open = p.classList.toggle('open');
    t.classList.toggle('open', open);
    t.setAttribute('aria-expanded', String(open));
    p.setAttribute('aria-hidden', String(!open));
  });

  /* ---- search: file-group expanders — path-click guard (path opens the
          result, only the rest of the header toggles) + collapse/expand all ---- */
  (function searchGroups() {
    var panel = document.getElementById('panel-search'); if (!panel) return;
    panel.querySelectorAll('.sh-fileh .sh-fp[data-demo-action]').forEach(function (sp) {
      sp.addEventListener('click', function (ev) { ev.stopPropagation(); });
    });
    function setAll(open) {
      panel.querySelectorAll('[data-pane="find"] .sh-file[data-acc]').forEach(function (f) {
        f.classList.toggle('open', open);
        var h = f.querySelector('[data-collapse]');
        if (h) h.setAttribute('aria-expanded', String(open));
      });
    }
    var c = document.getElementById('shResCollapse'), x = document.getElementById('shResExpand');
    if (c) c.addEventListener('click', function () { setAll(false); });
    if (x) x.addEventListener('click', function () { setAll(true); });
  })();

  /* ---- search: one query state — find/replace inputs, flags and scope
          menus mirror each other (the Slint port models one SearchQuery) ---- */
  (function searchMirror() {
    var panel = document.getElementById('panel-search'); if (!panel) return;
    var qF = panel.querySelector('[data-pane="find"] .pm-input input');
    var qR = panel.querySelector('[data-pane="replace"] .pm-input input');
    if (qF && qR) {
      qF.addEventListener('input', function () { qR.value = qF.value; });
      qR.addEventListener('input', function () { qF.value = qR.value; });
    }
    var fF = panel.querySelectorAll('[data-pane="find"] .sh-flags .sh-flag');
    var fR = panel.querySelectorAll('[data-pane="replace"] .sh-flags .sh-flag');
    function pair(a, b) {
      a.forEach(function (fa, i) {
        fa.addEventListener('click', function () {
          var tw = b[i]; if (!tw) return;
          var on = fa.classList.contains('on');
          tw.classList.toggle('on', on);
          tw.setAttribute('aria-pressed', String(on));
        });
      });
    }
    pair(fF, fR); pair(fR, fF);
    function mirrorScope(src, dst) {
      if (!src || !dst) return;
      src.addEventListener('pm-menu-pick', function (ev) {
        var it = ev.detail && ev.detail.item; if (!it) return;
        var v = it.getAttribute('data-value');
        dst.querySelectorAll('.pm6-tb-menu-item').forEach(function (x) { x.classList.toggle('is-selected', x.getAttribute('data-value') === v); });
        var wrap = dst.closest('.pm6-tb-menu-wrap');
        var lab = wrap && wrap.querySelector('.pm6-tb-menu-label');
        if (lab) lab.textContent = it.getAttribute('data-label') || it.textContent.trim();
      });
    }
    var mF = document.getElementById('shScopeMenu'), mR = document.getElementById('shReplScopeMenu');
    mirrorScope(mF, mR); mirrorScope(mR, mF);
  })();

  /* ---- search: filters disclosure + honest 'filtered' chip in the stats ---- */
  (function searchFilters() {
    var ft = document.getElementById('shFilterToggle'), fp = document.getElementById('shFilterPanel');
    if (!ft || !fp) return;
    ft.addEventListener('click', function () {
      var open = fp.classList.toggle('open');
      ft.classList.toggle('open', open);
      ft.setAttribute('aria-expanded', String(open));
      fp.setAttribute('aria-hidden', String(!open));
    });
    var inc = document.getElementById('shGlobInc'), exc = document.getElementById('shGlobExc'), ign = document.getElementById('shIgnoreToggle');
    var chips = document.querySelectorAll('#panel-search .js-filterchip');
    function upd() {
      var on = (inc && inc.value.trim() !== '') || (exc && exc.value.trim() !== '') || (ign && !ign.classList.contains('on'));
      chips.forEach(function (ch) { ch.style.display = on ? '' : 'none'; });
    }
    [inc, exc].forEach(function (el) { if (el) el.addEventListener('input', upd); });
    if (ign) ign.addEventListener('click', function () {
      ign.classList.toggle('on');
      ign.setAttribute('aria-pressed', String(ign.classList.contains('on')));
      upd();
    });
  })();

  /* ---- search: index chip demo cycle ok -> building 42% (cancel) ->
          stale (refresh) -> ok, driven by any rebuild_index click ---- */
  (function idxCycle() {
    var panel = document.getElementById('panel-search'); if (!panel) return;
    var dot = document.getElementById('shIdxDot'), label = document.getElementById('shIdxLabel');
    var strip = document.getElementById('shIdxState'), stext = document.getElementById('shIdxStateText'), sdot = document.getElementById('shIdxStateDot');
    var bCancel = document.getElementById('shIdxCancel'), bRefresh = document.getElementById('shIdxRefresh');
    if (!dot || !label || !strip || !stext || !sdot) return;
    var timers = [];
    function clearT() { timers.forEach(clearTimeout); timers = []; }
    function setIdxLabel(full, abbr) {
      var f = label.querySelector('.sh-idxfull');
      var a = label.querySelector('.sh-idxabbr');
      if (f && a) { f.textContent = full; a.textContent = abbr; }
      else label.textContent = full;
    }
    function state(name) {
      var toggle = document.getElementById('shIdxToggle');
      if (name === 'building') {
        dot.className = 'dot dot-run'; setIdxLabel('Indexing · 42%', '42%');
        sdot.className = 'dot dot-run'; stext.textContent = 'building search index — 42% (539 / 1,284 docs)';
        strip.hidden = false; if (bCancel) bCancel.hidden = false; if (bRefresh) bRefresh.hidden = true;
        if (toggle) toggle.setAttribute('title', 'Indexing · 42%');
      } else if (name === 'stale') {
        dot.className = 'dot dot-warn'; setIdxLabel('Stale · abc12ef', 'stale');
        sdot.className = 'dot dot-warn'; stext.textContent = 'stale — changes since abc12ef';
        strip.hidden = false; if (bCancel) bCancel.hidden = true; if (bRefresh) bRefresh.hidden = false;
        if (toggle) toggle.setAttribute('title', 'Stale · abc12ef');
      } else {
        dot.className = 'dot dot-ok'; setIdxLabel('Indexed · 1,284', '1,284');
        strip.hidden = true;
        if (toggle) toggle.setAttribute('title', 'Indexed · 1,284');
      }
      if (typeof window.PMPillFit === 'function') window.PMPillFit(toggle || label);
    }
    panel.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-demo-action="cmd.search.rebuild_index"]');
      if (!b) return;
      clearT();
      state('building');
      timers.push(setTimeout(function () { state('stale'); }, 1600));
      timers.push(setTimeout(function () { state('ok'); }, 3200));
    });
    if (bCancel) bCancel.addEventListener('click', function () {
      clearT();
      state('stale');
      timers.push(setTimeout(function () { state('ok'); }, 2200));
    });
  })();

  /* ---- pill / chip / count label fit ---------------------------------
     Measure at the current rail width — not a hardcoded breakpoint.
     Inactive panels / hidden panes layout invisibly via .pill-fit-measure.
     Closed accordion bodies are NOT force-expanded (refit on open). */
  (function pillFit() {
    var slot = document.getElementById('sidePanelSlot'); if (!slot) return;
    var SELECT =
      '.pm-chip[data-narrow-chip],' +
      '.sh-bstatus[data-narrow],' +
      '.sh-hcount,' +
      '.sh-wtchips,' +
      '.pm-eqrow,' +
      '.pm-btnrow,' +
      '.pm-segtab.fm-docktabs';
    var ROW = '.sh-name, .sh-run-h, .sh-ctr-h, .sh-chg-h, .sh-wt-h, .sh-head, .sh-banner, .sh-kvwrap, .sh-r1, .fm-changerow, .fm-openrow';

    function overflows(el) {
      if (!el || el.getBoundingClientRect().width < 1) return false;
      return el.scrollWidth > el.clientWidth + 1;
    }
    function preferredWidth(el) {
      if (!el) return 0;
      var prev = {
        width: el.style.width,
        flex: el.style.flex,
        maxWidth: el.style.maxWidth,
        minWidth: el.style.minWidth
      };
      el.style.width = 'auto';
      el.style.flex = '0 0 auto';
      el.style.maxWidth = 'none';
      el.style.minWidth = '0';
      void el.offsetWidth;
      var w = Math.ceil(el.scrollWidth);
      el.style.width = prev.width;
      el.style.flex = prev.flex;
      el.style.maxWidth = prev.maxWidth;
      el.style.minWidth = prev.minWidth;
      return w;
    }
    function bannerCrowded(st) {
      var banner = st.closest('.sh-banner');
      if (!banner || banner.getBoundingClientRect().width < 1) return false;
      if (overflows(banner)) return true;
      var title = banner.querySelector('.sh-title');
      var ico = banner.querySelector('.sh-bico');
      var gap = parseFloat(getComputedStyle(banner).columnGap || getComputedStyle(banner).gap) || 8;
      var pad = (parseFloat(getComputedStyle(banner).paddingLeft) || 0) +
        (parseFloat(getComputedStyle(banner).paddingRight) || 0);
      var icoW = ico ? Math.ceil(ico.getBoundingClientRect().width) : 0;
      /* .sh-title has min-width:45% — reserve that floor even when the
         word is short (SEARCH), otherwise we under-count crowding. */
      var titleMin = 0;
      if (title) {
        var tw = getComputedStyle(title).minWidth;
        if (tw && tw.endsWith('%')) titleMin = banner.clientWidth * (parseFloat(tw) / 100);
        else titleMin = parseFloat(tw) || 0;
      }
      var titleW = Math.max(preferredWidth(title), Math.ceil(titleMin));
      var need = preferredWidth(st);
      var used = pad + icoW + titleW + gap * ((ico ? 1 : 0) + (title ? 1 : 0));
      return used + need > banner.clientWidth + 1;
    }
    function rowOverflows(el) {
      if (el.matches('.sh-bstatus[data-narrow]') && bannerCrowded(el)) return true;
      var row = el.closest(ROW);
      if (row && overflows(row)) return true;
      var sr = slot.getBoundingClientRect();
      var er = el.getBoundingClientRect();
      return er.right > sr.right + 1 || er.left < sr.left - 1;
    }
    function needsShort(el) {
      return overflows(el) || rowOverflows(el);
    }
    function setFit(el, fit) {
      if (fit) el.setAttribute('data-fit', fit);
      else el.removeAttribute('data-fit');
      void el.offsetWidth;
    }
    function isFittable(el) {
      if (el.matches('.pm-chip[data-narrow-chip], .sh-bstatus[data-narrow], .sh-wtchips, .pm-segtab.fm-docktabs')) return true;
      if (el.matches('.sh-hcount') && el.querySelector('.hc-abbr')) return true;
      if (el.matches('.pm-eqrow, .pm-btnrow') && el.querySelector('.eq-abbr')) return true;
      return false;
    }
    function fitOne(el) {
      if (!isFittable(el)) return;
      if (el.matches('.pm-segtab.fm-docktabs') || el.matches('.sh-wtchips') || el.matches('.pm-eqrow') || el.matches('.pm-btnrow')) {
        setFit(el, 'full');
        if (!needsShort(el)) return;
        setFit(el, 'abbr');
        if (el.matches('.pm-segtab.fm-docktabs') && needsShort(el)) setFit(el, null);
        return;
      }
      if (el.matches('.sh-bstatus[data-narrow="extra"]')) {
        setFit(el, 'full');
        if (!needsShort(el)) return;
        setFit(el, 'abbr');
        return;
      }
      if (el.matches('.sh-bstatus[data-narrow="light"]') || el.matches('.sh-bstatus[data-narrow="symbol"]')) {
        setFit(el, 'full');
        if (!needsShort(el)) return;
        setFit(el, 'abbr');
        if (needsShort(el)) setFit(el, 'symbol');
        return;
      }
      if (el.matches('.sh-bstatus[data-narrow="short"]') || el.matches('.pm-chip[data-narrow-chip]') || el.matches('.sh-hcount')) {
        setFit(el, 'full');
        if (!needsShort(el)) return;
        setFit(el, 'abbr');
      }
    }
    function fitIn(root) {
      Array.prototype.forEach.call(root.querySelectorAll(SELECT), fitOne);
    }
    function run(scope) {
      slot.classList.add('pill-fit-measure');
      try {
        void slot.offsetWidth;
        fitIn(scope && slot.contains(scope) ? scope : slot);
      } finally {
        slot.classList.remove('pill-fit-measure');
      }
    }
    var scheduled = null;
    var pendingScope = null;
    function schedule(scope) {
      if (scope && slot.contains(scope)) {
        if (!pendingScope) pendingScope = scope;
        else if (pendingScope !== scope) pendingScope = slot;
      } else {
        pendingScope = slot;
      }
      if (scheduled) cancelAnimationFrame(scheduled);
      scheduled = requestAnimationFrame(function () {
        scheduled = null;
        var target = pendingScope;
        pendingScope = null;
        run(target === slot ? null : target);
      });
    }
    window.PMPillFit = schedule;
    if (window.ResizeObserver) new ResizeObserver(function () { schedule(); }).observe(slot);
    document.addEventListener('click', function (ev) {
      if (ev.target.closest('.pm-segtab-item, [data-tab]')) schedule();
    });
    schedule();
  })();

  /* sliding segtab ink underline (transform-only: 100px basis scaled +
          translated to the active item; ResizeObserver keeps it honest across
          rail resizes and first layout of hidden panels) ---- */
  (function segInk() {
    document.querySelectorAll('.side-panel-view .pm-segtab').forEach(function (st) {
      var ink = document.createElement('span');
      ink.className = 'pm-segtab-ink';
      ink.setAttribute('aria-hidden', 'true');
      st.appendChild(ink);
      function move() {
        var act = st.querySelector('.pm-segtab-item.active');
        if (!act || !act.offsetWidth) { ink.style.transform = 'scaleX(0)'; return; }
        ink.style.transform = 'translateX(' + act.offsetLeft + 'px) scaleX(' + (act.offsetWidth / 100) + ')';
      }
      st.addEventListener('click', function () { requestAnimationFrame(move); });
      if (window.ResizeObserver) new ResizeObserver(function () { move(); }).observe(st);
      window.addEventListener('resize', move);
      requestAnimationFrame(move);
    });
  })();

  /* ---- worktree filter chips actually filter rows by owner category ---- */
  (function wtFilter() {
    var chips = document.querySelector('#panel-source .sh-wtchips');
    if (!chips) return;
    chips.addEventListener('click', function (ev) {
      var btn = ev.target.closest('.pm-chipbtn');
      if (!btn) return;
      chips.querySelectorAll('.pm-chipbtn').forEach(function (c) { c.classList.toggle('active', c === btn); });
      var f = btn.getAttribute('data-wtf') || 'all';
      document.querySelectorAll('#panel-source .sh-wt[data-owner]').forEach(function (wt) {
        wt.classList.toggle('pm-hidden', f !== 'all' && wt.getAttribute('data-owner') !== f);
      });
    });
  })();

  /* ---- artifacts family tabs actually show/hide cards by data-fam ---- */
  (function famFilter() {
    var panel = document.getElementById('panel-artifacts');
    if (!panel) return;
    panel.addEventListener('click', function (ev) {
      var tab = ev.target.closest('.pm-segtab-item[data-tab]');
      if (!tab) return;
      var f = tab.getAttribute('data-tab');
      panel.querySelectorAll('.sh-card[data-fam]').forEach(function (c) {
        c.classList.toggle('pm-hidden', f !== 'all' && c.getAttribute('data-fam') !== f);
      });
    });
  })();

  /* ---- artifacts sort menu actually reorders cards (honest sort) ---- */
  (function artSort() {
    var panel = document.getElementById('panel-artifacts');
    if (!panel) return;
    var scroll = panel.querySelector('.sh-scroll');
    var anchor = scroll ? scroll.querySelector('.pm-empty') : null;
    if (!scroll || !anchor) return;
    function ts(c) { var p = (c.getAttribute('data-ts') || '0:0:0').split(':'); return (+p[0]) * 3600 + (+p[1]) * 60 + (+p[2]); }
    var FAM = { web: 0, browser: 1, evidence: 2 };
    var menu = panel.querySelector('#shArtSort');
    if (!menu) return;
    /* bound on the menu node itself: menu.js stopPropagation()s item clicks,
       so a panel-level delegate would never hear them */
    menu.addEventListener('click', function (ev) {
      var it = ev.target.closest('.pm6-tb-menu-item');
      if (!it) return;
      var mode = it.getAttribute('data-value');
      var cards = Array.prototype.slice.call(scroll.querySelectorAll(':scope > .sh-card'));
      cards.sort(function (a, b) {
        if (mode === 'old') return ts(a) - ts(b);
        if (mode === 'fam') { var d = (FAM[a.getAttribute('data-fam')] !== undefined ? FAM[a.getAttribute('data-fam')] : 9) - (FAM[b.getAttribute('data-fam')] !== undefined ? FAM[b.getAttribute('data-fam')] : 9); if (d) return d; }
        return ts(b) - ts(a);
      });
      cards.forEach(function (c) { scroll.insertBefore(c, anchor); });
    });
  })();

  /* ---- artifacts live recording: elapsed counter ticks while streaming ---- */
  (function artElapsed() {

  /* ---- testing live run (tr-2221): elapsed ticks while the run is active ---- */
  (function tstElapsed() {

  /* ---- global: hover titles on informative / interactive elements (#11) ---- */
  (function titles() {
    function set(el, txt) { if (el && !el.getAttribute('title') && txt) el.setAttribute('title', txt.trim().replace(/\s+/g, ' ')); }
    document.querySelectorAll('.side-panel-view .pm-segtab-item').forEach(function (el) { set(el, el.textContent); });
    document.querySelectorAll('.sh-hlabel, .sh-head[data-collapse]').forEach(function (el) {
      var head = el.classList.contains('sh-head') ? el : el.closest('.sh-head');
      var lab = head ? head.querySelector('.sh-hlabel') : el;
      var extra = head ? (head.querySelector('.sh-hcount, .sh-hstatus') || {}).textContent || '' : '';
      set(el, ((lab && lab.textContent) || el.textContent) + (extra ? ' · ' + extra : ''));
    });
    document.querySelectorAll('.sh-bstatus').forEach(function (el) { set(el, el.getAttribute('title') || el.textContent); });
    document.querySelectorAll('.pm-chip, .sh-fam, .sh-pill, .sh-valk, .sh-agtime, .dot').forEach(function (el) { set(el, el.textContent || el.className); });
    document.querySelectorAll('.sh-card, .fm-changerow, .fm-openrow, .sh-row[data-demo-action], .sh-commit, .sh-commit-h, .sh-wt-h, .sh-run-h, .sh-ctr-h, .sh-chg-h, .sh-stage-h, .sh-fileh, .pm-sumcard-h, [data-collapse]').forEach(function (el) {
      var n = el.querySelector('.sh-rlabel, .sh-name, .fm-path, .sh-msg, .sh-branch, .sh-nm-txt, .sh-stage-l'); set(el, n ? n.textContent : el.textContent);
    });
    document.querySelectorAll('.pm6-tb-menu-trigger').forEach(function (el) { var l = el.querySelector('.pm6-tb-menu-label'); set(el, l ? l.textContent : el.textContent); });
    document.querySelectorAll('.pm6-tb-menu-item').forEach(function (el) { set(el, el.textContent); });
    document.querySelectorAll('.pm-btn, .pm-minibtn, .fm-tbtn, .sh-toggle, .pm-chipbtn, .ab-icon, .sb-preset, .tb-page-tab').forEach(function (el) { if (!el.getAttribute('title')) set(el, el.textContent || el.getAttribute('aria-label')); });
    document.querySelectorAll('.sh-k, .sh-title, .sh-bico, .sh-sha, .sh-age, .sh-meta, .sh-ds, .sh-portchip, .sh-modelmark').forEach(function (el) { set(el, el.textContent || el.getAttribute('aria-label')); });
    document.querySelectorAll('.pm-rmetric').forEach(function (el) { set(el, el.textContent || 'Timing'); });
    document.querySelectorAll('.sh-banner').forEach(function (el) {
      var ti = el.querySelector('.sh-title'); set(el, ti ? ti.textContent : el.textContent);
    });
  })();
})();
