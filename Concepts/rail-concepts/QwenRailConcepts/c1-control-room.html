<style>
/* =====================================================================
   C1 — CONTROL ROOM
   The rail as an instrument deck: LED status strips, right-aligned mono
   readouts, thin meter bars, category-colored section rails. Information
   is telemetry — every row a gauge, every state a light. At min width
   readouts shed their keys and keep the values; at max width readout
   pairs flow two-up.
   ===================================================================== */
.side-panel-view { background: var(--surface); }

/* panel status strip */
.cr-head {
  flex: none; display: flex; align-items: center; gap: var(--md);
  padding: var(--lg) var(--lg) var(--md); min-width: 0; overflow: hidden;
  border-bottom: var(--border-width-inner,1px) solid var(--border-light);
  background:
    repeating-linear-gradient(90deg, transparent 0 7px, color-mix(in srgb, var(--text-primary) 3%, transparent) 7px 8px),
    var(--surface-elevated);
}
.cr-led { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.cr-led.ok  { background: var(--graph-passed); box-shadow: 0 0 7px color-mix(in srgb, var(--graph-passed) 70%, transparent); }
.cr-led.err { background: var(--graph-failed); box-shadow: 0 0 7px color-mix(in srgb, var(--graph-failed) 70%, transparent); animation: crBlink 1.1s steps(2) infinite; }
.cr-led.run { background: var(--graph-running); box-shadow: 0 0 7px color-mix(in srgb, var(--graph-running) 70%, transparent); animation: crBlink 1.6s var(--ease-out) infinite; }
.cr-led.idle{ background: var(--graph-pending); }
@keyframes crBlink { 50% { opacity: .35; } }
.cr-title { font-family: var(--display-font); font-size: 11px; font-weight: 700; letter-spacing: 1px; flex: 1 1 auto; min-width: max-content; white-space: nowrap; }
.cr-count { margin-left: auto; flex: 0 1 auto; min-width: 0; max-width: 50%; font-family: var(--mono-font); font-size: 9.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* instrument groups */
.cr-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--md) var(--lg) var(--lg); }
.cr-g {
  border-left: 2px solid var(--cc, var(--accent-blue));
  padding: 2px 0 2px var(--lg);
  margin: 0 0 var(--lg);
}
.cr-gl {
  font-family: var(--display-font); font-size: 8.5px; font-weight: 700;
  letter-spacing: 2px; color: var(--cc, var(--accent-blue));
  display: flex; align-items: center; gap: var(--md); margin-bottom: var(--sm);
}
.cr-gl .pm-chip { font-size: 8.5px; padding: 0 6px; }
.cr-gl-right { margin-left: auto; color: var(--text-muted); font-family: var(--mono-font); font-size: 9px; letter-spacing: 0; }

/* readouts */
.cr-read { display: flex; align-items: baseline; justify-content: space-between; gap: var(--md); padding: 2.5px 0; min-width: 0; }
.cr-k { font-size: 8.5px; font-weight: 700; letter-spacing: 1.2px; color: var(--text-muted); text-transform: uppercase; flex: none; }
.cr-v { font-family: var(--mono-font); font-size: 11px; color: var(--text-primary); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr-v.dim { color: var(--text-secondary); }
.cr-v .pm-chip { vertical-align: 1px; }
.cr-meter { height: 3px; background: var(--border-light); border-radius: 2px; margin: 4px 0 6px; overflow: hidden; }
.cr-meter i { display: block; height: 100%; width: var(--p, 50%); background: var(--cc, var(--accent-blue)); border-radius: 2px; transition: width .5s var(--ease-out); }

/* control buttons — membrane pads */
.c1 .pm-btn, .side-panel-view .pm-btn {
  font-family: var(--display-font); font-size: 8.5px; font-weight: 700;
  letter-spacing: 1.4px; text-transform: uppercase;
  border-radius: var(--radius-xs);
}
.cr-pads { display: flex; flex-wrap: wrap; gap: var(--sm); margin-top: var(--sm); }
.cr-pads .pm-btn { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cr-row .pm-btn { max-width: 46%; overflow: hidden; text-overflow: ellipsis; }
.side-panel-slot[data-wtier="min"] .side-panel-view .pm-btn { font-size: 8px; padding: 4px 6px; letter-spacing: .8px; }

/* query deck */
.cr-flags { display: flex; align-items: center; gap: var(--sm); margin-top: var(--sm); }
.cr-flag {
  font-family: var(--mono-font); font-size: 10px; font-weight: 700;
  padding: 3px 7px; border-radius: var(--radius-xs);
  border: 1px solid var(--border-light); color: var(--text-muted);
  transition: all var(--motion-fast) var(--ease-out); cursor: pointer;
}
.cr-flag:hover { color: var(--text-primary); border-color: var(--border); }
.cr-flag.on { color: var(--accent-primary); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent-primary) 40%, transparent); }
.cr-scope .pm6-tb-menu-trigger { border: 1px solid var(--border-light); border-radius: var(--radius-xs); margin-left: auto; font-family: var(--mono-font); font-size: 10px; padding: 3px 7px; }
.cr-scope .pm6-tb-menu { min-width: 170px; }

/* results */
.cr-file {
  display: flex; align-items: baseline; gap: var(--md);
  font-family: var(--mono-font); font-size: 10.5px; color: var(--accent-blue);
  padding: 5px 4px 2px; cursor: pointer;
}
.cr-file:hover { text-decoration: underline; }
.cr-file b { margin-left: auto; font-weight: 400; color: var(--text-muted); }
.cr-hit { display: flex; gap: var(--md); align-items: baseline; padding: 1.5px 4px; border-radius: var(--radius-xs); cursor: pointer; }
.cr-hit:hover { background: var(--accent-soft); }
.cr-ln { font-family: var(--mono-font); font-size: 9.5px; color: var(--text-muted); min-width: 26px; text-align: right; flex: none; }
.cr-hit code { font-family: var(--mono-font); font-size: 10px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cr-hit em { font-style: normal; color: var(--text-primary); background: color-mix(in srgb, var(--accent-warning) 26%, transparent); border-radius: 2px; padding: 0 1px; }

/* rows (agents, docker containers, runs) */
.cr-row { display: flex; align-items: center; gap: var(--md); padding: 5px 4px; border-radius: var(--radius-xs); min-width: 0; }
.cr-row:hover { background: var(--accent-soft); }
.cr-row-main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.cr-row-name { font-size: 11.5px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cr-row-meta { font-family: var(--mono-font); font-size: 9.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* log block */
.cr-log {
  font-family: var(--mono-font); font-size: 9.5px; line-height: 1.55;
  background: color-mix(in srgb, var(--graph-failed) 5%, var(--surface));
  border-left: 2px solid var(--graph-failed);
  padding: var(--md); margin: var(--sm) 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cr-log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cr-log .fail { color: var(--graph-failed); }

/* publish chain */
.cr-chain { position: relative; padding-left: 20px; margin: var(--sm) 0; }
.cr-chain::before { content: ''; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 1px; background: var(--border-light); }
.cr-stage { position: relative; display: flex; align-items: center; gap: var(--md); padding: 3.5px 0; min-width: 0; }
.cr-stage i {
  position: absolute; left: -20px; width: 15px; height: 15px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono-font); font-size: 8.5px; font-style: normal;
  border: 1px solid var(--border); border-radius: 50%;
  background: var(--surface-elevated); color: var(--text-muted);
}
.cr-stage.done i { border-color: var(--graph-passed); color: var(--graph-passed); }
.cr-stage.now i { border-color: var(--graph-running); color: var(--graph-running); animation: crBlink 1.6s var(--ease-out) infinite; }
.cr-stage-l { font-size: 11px; color: var(--text-secondary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr-stage.done .cr-stage-l { color: var(--text-primary); }

/* worktrees / accordions */
.cr-acc { border: 1px solid var(--border-light); border-radius: var(--radius-xs); margin-bottom: var(--sm); background: var(--surface-elevated); }
.cr-acc-h { display: flex; align-items: center; gap: var(--md); padding: 6px 8px; cursor: pointer; min-width: 0; }
.cr-acc-h .chev { width: 10px; height: 10px; color: var(--text-muted); transition: transform var(--motion-med) var(--ease-default); flex: none; }
.cr-acc.open .chev { transform: rotate(90deg); }
.cr-acc-b { display: none; padding: 2px 8px 8px; }
.cr-acc.open .cr-acc-b { display: block; }
.cr-pill { font-family: var(--mono-font); font-size: 9px; padding: 1px 6px; border-radius: var(--radius-pill); flex: none; }
.cr-pill.clean { color: var(--graph-passed); background: color-mix(in srgb, var(--graph-passed) 12%, transparent); }
.cr-pill.dirty { color: var(--accent-warning); background: color-mix(in srgb, var(--accent-warning) 14%, transparent); }
.cr-branch { font-family: var(--mono-font); font-size: 10.5px; color: var(--text-primary); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr-owner { font-size: 9.5px; color: var(--text-muted); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.cr-acts { display: flex; flex-wrap: wrap; gap: var(--sm); margin-top: var(--sm); }
.cr-acts .pm-btn { padding: 4px 7px; min-height: 22px; font-size: 8px; }

/* commits */
.cr-commit { padding: 4px; border-radius: var(--radius-xs); cursor: pointer; }
.cr-commit:hover { background: var(--accent-soft); }
.cr-commit-top { display: flex; gap: var(--md); align-items: baseline; }
.cr-sha { font-family: var(--mono-font); font-size: 10px; color: var(--accent-blue); }
.cr-age { font-size: 9.5px; color: var(--text-muted); margin-left: auto; }
.cr-msg { font-size: 10.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* graph sketch */
.cr-graph { font-family: var(--mono-font); font-size: 10px; display: flex; flex-direction: column; gap: 3px; padding: var(--sm) 0; }
.cr-gnode { display: flex; align-items: center; gap: var(--md); }
.cr-gnode .dot { width: 7px; height: 7px; }
.cr-gindent { padding-left: 16px; position: relative; }
.cr-gindent::before { content: ''; position: absolute; left: 3px; top: -6px; width: 8px; height: 12px; border-left: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); }

/* artifact receipts */
.cr-receipt { border: 1px solid var(--border-light); border-left: 2px solid var(--cc, var(--accent-blue)); border-radius: var(--radius-xs); padding: var(--md); margin-bottom: var(--sm); background: var(--surface-elevated); cursor: pointer; transition: box-shadow var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.cr-receipt:hover { box-shadow: var(--elev-1); transform: translateY(-1px); }
.cr-r1 { display: flex; align-items: center; gap: var(--md); min-width: 0; }
.cr-fam { font-family: var(--mono-font); font-size: 8.5px; letter-spacing: .04em; padding: 1px 6px; border-radius: var(--radius-xs); background: color-mix(in srgb, var(--cc, var(--accent-blue)) 14%, transparent); color: var(--cc, var(--accent-blue)); flex: none; }
.cr-rlabel { font-size: 11px; font-weight: 600; color: var(--text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr-prev { font-family: var(--mono-font); font-size: 9.5px; color: var(--text-secondary); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cr-rmeta { font-size: 9px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cr-prov { display: flex; flex-wrap: wrap; gap: var(--sm); align-items: center; margin-top: var(--sm); }
.cr-prov .pm-minibtn { width: auto; padding: 0 7px; height: 20px; font-size: 9px; font-weight: 700; gap: 4px; display: inline-flex; }

/* width-tier adaptation */
.side-panel-slot[data-wtier="min"] .cr-k { display: none; }
.side-panel-slot[data-wtier="min"] .cr-title { font-size: 10.5px; letter-spacing: .6px; }
.side-panel-slot[data-wtier="min"] .cr-read { justify-content: flex-end; }
.side-panel-slot[data-wtier="min"] .cr-owner { display: none; }
.side-panel-slot[data-wtier="min"] .cr-count { display: none; }
.side-panel-slot[data-wtier="wide"] .cr-g.two-up { display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--lg); }
.side-panel-slot[data-wtier="wide"] .cr-g.two-up .cr-gl { grid-column: 1 / -1; }

/* filter chips -> instrument switches */
.side-panel-view .pm-chipbtn { border-radius: var(--radius-xs); font-family: var(--mono-font); text-transform: lowercase; }
</style>
</head>
