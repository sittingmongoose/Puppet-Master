<style>
/* =====================================================================
   C3 — SINGLE THREAD (focus tunnel)
   Only one section occupies the panel at a time; a scrollable depth rail
   at the top moves you between sections. Because each section gets the
   whole height, the layout is editorial and roomy — the most legible of
   the six at minimum width, and at maximum width it simply breathes more.
   Big section titles + a short category accent rule anchor each pane.
   ===================================================================== */
.side-panel-view { background: var(--surface); }

.st-head {
  flex: none; display: flex; align-items: center; gap: var(--md);
  padding: var(--lg); min-width: 0; overflow: hidden;
}
.st-hico { width: 26px; height: 26px; flex: none; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent-primary); }
.st-hico svg { width: 14px; height: 14px; }
.st-htitle { font-family: var(--display-font); font-size: 12px; font-weight: 700; letter-spacing: .6px; flex: 1 1 auto; min-width: max-content; white-space: nowrap; }
.st-hstatus { margin-left: auto; flex: 0 1 auto; min-width: 0; max-width: 50%; display: inline-flex; align-items: center; gap: 6px; font-size: 9.5px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--graph-passed) 14%, transparent); color: var(--graph-passed); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-hstatus .dot { width: 7px; height: 7px; flex: none; }

.st-rail { flex: none; display: flex; gap: var(--sm); padding: 0 var(--lg) var(--md); border-bottom: 1px solid var(--border-light); }
.st-chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: var(--radius-pill); border: 1px solid var(--border-light); color: var(--text-secondary); font-size: 10px; font-weight: 700; letter-spacing: .03em; transition: all var(--motion-fast) var(--ease-out); }
.st-chip svg { width: 12px; height: 12px; }
.st-chip:hover { color: var(--text-primary); border-color: var(--border); }
.st-chip.active { color: var(--accent-primary); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent-primary) 38%, transparent); box-shadow: inset 0 -2px 0 var(--accent-primary); }
.st-cnt { font-family: var(--mono-font); font-size: 9px; padding: 0 5px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--text-primary) 8%, transparent); color: var(--text-muted); }
.st-chip.active .st-cnt { background: color-mix(in srgb, var(--accent-primary) 18%, transparent); color: var(--accent-primary); }

.st-body { flex: 1; min-height: 0; }
.st-pane { padding: var(--lg); }
.st-htitle2 { font-family: var(--display-font); font-size: 15px; font-weight: 700; letter-spacing: .3px; display: flex; align-items: baseline; gap: var(--md); }
.st-hsub { font-family: var(--body-font); font-size: 10.5px; font-weight: 500; color: var(--text-muted); letter-spacing: 0; }
.st-rule { height: 3px; width: 34px; border-radius: 2px; background: var(--cat, var(--accent-blue)); margin: var(--md) 0 var(--lg); }

/* roomy rows */
.st-row { display: flex; align-items: center; gap: var(--md); padding: 9px 4px; border-bottom: 1px solid var(--border-light); min-width: 0; }
.st-row:last-child { border-bottom: none; }
.st-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.st-name { font-size: 12.5px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.st-meta { font-size: 10.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-mono { font-family: var(--mono-font); }
.st-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

.st-kv { display: flex; align-items: baseline; justify-content: space-between; gap: var(--md); padding: 6px 0; font-size: 12px; border-bottom: 1px dashed var(--border-light); }
.st-k { color: var(--text-muted); flex: none; }
.st-v { color: var(--text-primary); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.st-pane .pm-btn { padding: 9px 14px; font-size: 11px; font-weight: 700; }
.st-btns { display: flex; flex-wrap: wrap; gap: var(--md); margin-top: var(--lg); }
.st-btns .pm-btn { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* search roomy */
.st-flags { display: flex; align-items: center; gap: var(--md); margin-top: var(--lg); }
.st-flag { font-family: var(--mono-font); font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: var(--radius-md); border: 1px solid var(--border-light); color: var(--text-muted); }
.st-flag.on { color: var(--accent-primary); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent-primary) 40%, transparent); }
.st-scope .pm6-tb-menu-trigger { border: 1px solid var(--border-light); border-radius: var(--radius-md); margin-left: auto; padding: 6px 12px; font-size: 11px; }
.st-file { margin-top: var(--md); }
.st-fileh { display: flex; align-items: center; gap: var(--md); font-family: var(--mono-font); font-size: 12px; color: var(--accent-blue); padding: 8px 0 4px; cursor: pointer; border-top: 1px solid var(--border-light); }
.st-fileh:first-child { border-top: none; }
.st-fileh svg { width: 13px; height: 13px; }
.st-fileh b { margin-left: auto; font-weight: 400; color: var(--text-muted); }
.st-hit { display: flex; gap: var(--md); align-items: baseline; padding: 5px 6px; border-radius: var(--radius-md); cursor: pointer; }
.st-hit:hover { background: var(--accent-soft); }
.st-ln { font-family: var(--mono-font); font-size: 11px; color: var(--text-muted); min-width: 30px; text-align: right; flex: none; }
.st-hit code { font-family: var(--mono-font); font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.st-hit em { font-style: normal; color: var(--text-primary); background: color-mix(in srgb, var(--accent-warning) 24%, transparent); border-radius: 3px; padding: 0 2px; }

.st-log { font-family: var(--mono-font); font-size: 10.5px; line-height: 1.6; background: color-mix(in srgb, var(--graph-failed) 6%, var(--surface-elevated)); border-left: 3px solid var(--graph-failed); border-radius: var(--radius-sm); padding: var(--md) var(--lg); margin: var(--md) 0; }
.st-log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-log .fail { color: var(--graph-failed); }

/* worktrees roomy cards */
.st-wt { border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: var(--md) var(--lg); margin-bottom: var(--md); background: var(--surface-elevated); }
.st-wt-top { display: flex; align-items: center; gap: var(--md); min-width: 0; }
.st-pill { font-size: 9.5px; font-weight: 700; padding: 2px 9px; border-radius: var(--radius-pill); flex: none; }
.st-pill.clean { color: var(--graph-passed); background: color-mix(in srgb, var(--graph-passed) 14%, transparent); }
.st-pill.dirty { color: var(--accent-warning); background: color-mix(in srgb, var(--accent-warning) 16%, transparent); }
.st-branch { font-family: var(--mono-font); font-size: 12px; color: var(--text-primary); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-owner { font-size: 10px; color: var(--text-muted); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.st-wt-acts { display: flex; flex-wrap: wrap; gap: var(--sm); margin-top: var(--md); }
.st-wt-acts .pm-btn { padding: 6px 10px; font-size: 10px; }

/* commits roomy */
.st-commit { padding: 8px 0; border-bottom: 1px solid var(--border-light); cursor: pointer; }
.st-commit:last-of-type { border-bottom: none; }
.st-sha { font-family: var(--mono-font); font-size: 12px; color: var(--accent-blue); }
.st-age { font-size: 10.5px; color: var(--text-muted); margin-left: auto; }
.st-msg { font-size: 12px; color: var(--text-secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* graph */
.st-graph { font-family: var(--mono-font); font-size: 11.5px; display: flex; flex-direction: column; gap: 6px; }
.st-gn { display: flex; align-items: center; gap: var(--md); }
.st-gn .dot { width: 9px; height: 9px; }
.st-gind { padding-left: 18px; position: relative; }
.st-gind::before { content: ''; position: absolute; left: 4px; top: -8px; width: 9px; height: 15px; border-left: 2px solid var(--border); border-bottom: 2px solid var(--border); border-radius: 0 0 0 4px; }

/* chain */
.st-chain { position: relative; padding-left: 30px; }
.st-chain::before { content: ''; position: absolute; left: 11px; top: 14px; bottom: 14px; width: 2px; background: var(--border-light); }
.st-stage { position: relative; display: flex; align-items: center; gap: var(--md); padding: 7px 0; min-width: 0; }
.st-stage i { position: absolute; left: -30px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-family: var(--mono-font); font-size: 10px; font-style: normal; border-radius: 50%; background: var(--surface-elevated); border: 2px solid var(--border); color: var(--text-muted); }
.st-stage.done i { border-color: var(--graph-passed); color: var(--graph-passed); }
.st-stage.now i { border-color: var(--graph-running); color: var(--graph-running); animation: stP 1.6s var(--ease-out) infinite; }
@keyframes stP { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--graph-running) 35%, transparent); } 50% { box-shadow: 0 0 0 5px transparent; } }
.st-stage-l { font-size: 12px; color: var(--text-secondary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-stage.done .st-stage-l { color: var(--text-primary); }

/* artifact roomy rows */
.st-art { border: 1px solid var(--border-light); border-left: 3px solid var(--cat, var(--accent-blue)); border-radius: var(--radius-md); padding: var(--md) var(--lg); margin-bottom: var(--md); cursor: pointer; transition: box-shadow var(--motion-fast) var(--ease-out); }
.st-art:hover { box-shadow: var(--elev-1); }
.st-r1 { display: flex; align-items: center; gap: var(--md); min-width: 0; }
.st-fam { font-family: var(--mono-font); font-size: 9px; padding: 2px 8px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--cat, var(--accent-blue)) 14%, transparent); color: var(--cat, var(--accent-blue)); flex: none; }
.st-rlabel { font-size: 12.5px; font-weight: 600; color: var(--text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-prev { font-family: var(--mono-font); font-size: 10.5px; color: var(--text-secondary); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-rmeta { font-size: 10px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-prov { display: flex; flex-wrap: wrap; gap: var(--sm); align-items: center; margin-top: var(--md); }
.st-prov .pm-minibtn { width: auto; padding: 0 10px; height: 24px; font-size: 10px; font-weight: 700; }

/* min tier: rail collapses to icon+count */
.side-panel-slot[data-wtier="min"] .st-clabel { display: none; }
.side-panel-slot[data-wtier="min"] .st-pane { padding: var(--md); }
.side-panel-slot[data-wtier="min"] .st-htitle2 { font-size: 13px; }
.side-panel-slot[data-wtier="min"] .st-owner { display: none; }
.side-panel-slot[data-wtier="min"] .st-hstatus { display: none; }
.side-panel-slot[data-wtier="min"] .st-htitle { font-size: 10.5px; letter-spacing: .2px; }
</style>
