/* =====================================================================
   C2 — COZY SHELVES · FILE MANAGER
   The File Manager re-cut in the cozy-shelves language: a soft pill
   banner carrying the worktree-root picker, a toolbar carrying the
   Hide-ignored toggle, a segmented tab bar (Explorer / Changed / Open),
   a comfortable nested
   tree of pill rows with hover-reveal quick actions, a reskinned PM
   sprout context menu (Slint has no native one), and a sticky status
   footer. Tints derive from theme tokens so it stays correct on all 8
   themes; glyphs are bundled stroke SVGs only (F3-417: no emoji /
   pictographs / CDN icons; every icon-only control carries a label and
   a non-icon status word). Tree behavior defers to Plans/FileManager.md:
   virtualized (row 24px, lazy expand, 10k row-cap + Show more), current-
   file reveal with hidden-by-filter disclosure, read-only git badges
   sourced from Source Control, path-based narrow open, single-row open
   (no bulk-open), worktree-keyed roots.
   ===================================================================== */
.side-panel-view { background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.side-panel-view:not(.active) { display: none; }

/* ---- banner ---- */
.sh-banner {
  flex: none; display: flex; align-items: center; gap: var(--md);
  padding: var(--lg); min-width: 0; overflow: visible;
  margin: var(--md) var(--md) 0; border-radius: var(--radius-lg);
  background:
    radial-gradient(135% 150% at 6% -30%, color-mix(in srgb, var(--accent-primary) 17%, transparent), transparent 56%),
    radial-gradient(120% 150% at 100% 0%, color-mix(in srgb, var(--accent-blue) 11%, transparent), transparent 52%),
    var(--surface-elevated);
  box-shadow: var(--elev-1); position: relative; z-index: 2;
}
.sh-bico { width: 26px; height: 26px; flex: none; border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--accent-primary) 16%, transparent); color: var(--accent-primary); transition: transform var(--motion-med) var(--ease-default), background var(--motion-fast) var(--ease-out); }
.sh-banner:hover .sh-bico { transform: rotate(-7deg) scale(1.06); }
.sh-bico svg { width: 13px; height: 13px; }
.sh-title { font-family: var(--display-font); font-size: 12px; font-weight: 700; letter-spacing: .9px; flex: 0 0 auto; }
.sh-bbranch { margin-left: auto; flex: 0 1 52%; min-width: 0; }
.sh-bbranch .pm6-tb-menu-trigger { display: flex; align-items: center; gap: 6px; min-width: 0; width: 100%; border: 1px solid var(--border-light); border-radius: var(--radius-pill); padding: 3px 9px; }
.sh-bbranch .pm6-tb-menu-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono-font); font-size: 10px; }
.sh-bhead-acts { display: flex; align-items: center; gap: var(--xs); flex: none; }

/* ---- segmented tab bar (shared idiom) ---- */
.pm-segtab { flex: none; display: flex; margin: var(--sm) var(--md) 0; border-bottom: 1px solid var(--border-light); background: color-mix(in srgb, var(--cat, var(--accent-primary)) 5%, var(--surface-elevated)); border-radius: var(--radius-lg) var(--radius-lg) 0 0; overflow: hidden; position: relative; }
.pm-segtab-ink { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--cat, var(--accent-primary)); border-radius: 2px 2px 0 0; transition: transform var(--motion-med) var(--ease-default), width var(--motion-med) var(--ease-default); pointer-events: none; box-shadow: 0 0 10px color-mix(in srgb, var(--cat, var(--accent-primary)) 55%, transparent); }
.pm-segtab-item { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 2px 8px; margin-bottom: -1px; background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer; color: var(--text-muted); font-family: var(--display-font); font-size: 8px; font-weight: 700; letter-spacing: 1px; transition: color var(--motion-fast) var(--ease-out), background var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); position: relative; z-index: 1; }
.pm-segtab-item svg { width: 15px; height: 15px; flex: none; transition: transform var(--motion-med) var(--ease-default); }
.pm-segtab-item.active svg { transform: translateY(-1px) scale(1.1); }
.pm-segtab-item > span { max-width: 100%; padding: 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pm-segtab-item:hover { color: var(--text-secondary); background: color-mix(in srgb, var(--cat, var(--accent-primary)) 6%, transparent); }
.pm-segtab-item.active { color: var(--cat, var(--accent-primary)); }

/* ---- selection bar (appears on multi-select) ---- */
.fm-selbar { flex: none; display: none; align-items: center; gap: var(--sm); padding: var(--sm) var(--md); margin: var(--sm) var(--md) 0; border-radius: var(--radius-md); background: color-mix(in srgb, var(--accent-primary) 12%, var(--surface-elevated)); border: 1px solid color-mix(in srgb, var(--accent-primary) 30%, transparent); }
.fm-selbar.show { display: flex; }
.fm-selbar .fm-selcount { font-family: var(--mono-font); font-size: 10px; color: var(--text-secondary); white-space: nowrap; }
.fm-selbar .fm-selcount b { color: var(--text-primary); }
.fm-selbar .fm-selacts { display: flex; gap: var(--xs); margin-left: auto; flex-wrap: wrap; }

.sh-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--md) var(--md) var(--md) 6px; scrollbar-width: thin; scrollbar-color: var(--pm6-sb-thumb) transparent; }
.sh-scroll::-webkit-scrollbar { width: 10px; }

/* ---- filter / type-ahead (collapsible; toggled from the toolbar) ---- */
.fm-filter { display: none; opacity: 0; overflow: hidden; margin-bottom: 0; align-items: center; gap: var(--sm); transition: max-height var(--motion-med) var(--ease-default), opacity var(--motion-med) var(--ease-out), margin-bottom var(--motion-med) var(--ease-default); }
.fm-filter.open { display: flex; opacity: 1; margin-bottom: var(--md); }
.fm-filter .pm-input { flex: 1 1 auto; min-width: 0; border-radius: var(--radius-pill); }
.fm-filtercount { flex: 0 0 auto; font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); white-space: nowrap; }
.fm-filterclear { flex: none; }

/* ---- tree ---- */
.fm-tree { display: flex; flex-direction: column; }
.fm-node { border-radius: var(--radius-md); }
.fm-row { display: grid; grid-template-columns: auto var(--sm) minmax(0, 1fr) auto; align-items: center; padding: 2px 6px; border-radius: var(--radius-md); min-width: 0; cursor: pointer; position: relative; transition: background var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out), box-shadow var(--motion-fast) var(--ease-out); }
.fm-row > .fm-chevron, .fm-row > .fm-ficon { grid-column: 1; }
.fm-row > .fm-name { grid-column: 3; }
.fm-row > .fm-trail { grid-column: 4; }
.fm-row:hover { background: color-mix(in srgb, var(--accent-primary) 8%, transparent); transform: translateX(2px); }
.fm-row:active { transform: scale(.985); }
.fm-row.selected { background: color-mix(in srgb, var(--accent-primary) 16%, transparent); }
.fm-row.active-file { background: color-mix(in srgb, var(--accent-primary) 12%, transparent); }
.fm-row.ignored { opacity: .5; }
.fm-row.ignored .fm-name { font-style: italic; }
.fm-chevron { width: 12px; height: 12px; flex: none; color: var(--text-muted); transition: transform var(--motion-med) var(--ease-default); }
.fm-node.open > .fm-row > .fm-chevron { transform: rotate(90deg); }
.fm-ficon { width: 15px; height: 15px; flex: none; color: var(--text-muted); }
.fm-ficon.folder { color: var(--accent-warning); }
.fm-ficon.rs { color: var(--accent-orange); }
.fm-ficon.ts, .fm-ficon.tsx { color: var(--accent-blue); }
.fm-ficon.js, .fm-ficon.jsx { color: var(--cat-amber); }
.fm-ficon.svelte { color: var(--accent-magenta); }
.fm-ficon.sql { color: var(--accent-lime); }
.fm-ficon.toml { color: var(--accent-orange); }
.fm-ficon.yml, .fm-ficon.yaml { color: var(--accent-lime); }
.fm-ficon.xml { color: var(--accent-magenta); }
.fm-ficon.md { color: var(--text-secondary); }
.fm-ficon.docker { color: var(--accent-blue); }
.fm-name { min-width: 0; font-size: 11px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color var(--motion-fast) var(--ease-out); }
.fm-name.mono { font-family: var(--mono-font); font-size: 10.5px; }
.fm-folder > .fm-row > .fm-name { font-weight: 600; }
/* filename colour by git state: clean = normal text; ignored = muted/dull */
.fm-row.M > .fm-name { color: var(--accent-warning); }
.fm-row.A > .fm-name { color: var(--graph-passed); }
.fm-row.Q > .fm-name { color: var(--accent-blue); }
.fm-row.D > .fm-name { color: var(--graph-failed); }
.fm-row.C > .fm-name { color: var(--accent-blue); }
.fm-row.ignored > .fm-name { color: var(--text-muted); }
/* trailing cell: fixed-width right column so counts + badges align on every row;
   quick actions overlay it on hover (gradient backdrop) so nothing jumps */
.fm-trail { position: relative; display: flex; align-items: center; justify-content: flex-end; gap: 4px; min-width: 46px; height: 20px; }
.fm-trail .fm-markers { display: flex; align-items: center; gap: 4px; transition: opacity var(--motion-fast) var(--ease-out); }
.fm-count { flex: none; font-family: var(--mono-font); font-size: 8.5px; color: var(--text-muted); }
.fm-gitbadge { flex: none; display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono-font); font-size: 8px; font-weight: 700; padding: 0 5px; border-radius: var(--radius-pill); }
.fm-gitbadge svg { width: 9px; height: 9px; }
.fm-gitbadge.M { color: var(--accent-warning); background: color-mix(in srgb, var(--accent-warning) 16%, transparent); }
.fm-gitbadge.A { color: var(--graph-passed); background: color-mix(in srgb, var(--graph-passed) 16%, transparent); }
.fm-gitbadge.Q { color: var(--text-muted); background: color-mix(in srgb, var(--text-muted) 18%, transparent); }
.fm-gitbadge.D { color: var(--graph-failed); background: color-mix(in srgb, var(--graph-failed) 16%, transparent); }
.fm-gitbadge.C { color: var(--accent-blue); background: color-mix(in srgb, var(--accent-blue) 16%, transparent); }
.fm-quick { position: absolute; right: 0; top: 50%; transform: translateY(-50%) translateX(6px); display: flex; align-items: center; gap: 2px; padding-left: 12px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface-elevated) 94%, transparent) 30%, var(--surface-elevated) 62%); opacity: 0; pointer-events: none; transition: opacity var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.fm-quick .pm-minibtn { width: 20px; height: 20px; border-radius: var(--radius-pill); transition: transform var(--motion-fast) var(--ease-out), background var(--motion-fast) var(--ease-out); }
.fm-quick .pm-minibtn:hover { transform: translateY(-1px) scale(1.08); }
.fm-quick .pm-minibtn svg { width: 11px; height: 11px; }
.fm-row:hover .fm-quick, .fm-row.selected .fm-quick { opacity: 1; transform: translateY(-50%) translateX(0); pointer-events: auto; }
.fm-row:hover .fm-markers, .fm-row.selected .fm-markers { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .fm-quick, .fm-trail .fm-markers { transition: none; } }
[data-reduced-motion="1"] .fm-quick, [data-reduced-motion="1"] .fm-trail .fm-markers { transition: none; }
/* nesting — closed = display:none (guaranteed 0 height, no gaps); open/close
   height is animated via JS-measured max-height (see collapse IIFE) */
.fm-children { display: none; opacity: 0; overflow: hidden; padding-left: 7px; border-left: 1px solid color-mix(in srgb, var(--border-light) 80%, transparent); margin-left: 5px; transition: max-height var(--motion-med) var(--ease-default), opacity var(--motion-med) var(--ease-out); will-change: max-height, opacity; }
.fm-node.open > .fm-children { display: block; opacity: 1; }
/* row-cap + show more */
.fm-showmore { display: flex; align-items: center; gap: var(--sm); padding: 4px 8px 4px 20px; font-family: var(--mono-font); font-size: 9px; color: var(--accent-primary); cursor: pointer; }
.fm-showmore:hover { text-decoration: underline; }
.fm-emptytree { padding: var(--lg); text-align: center; color: var(--text-muted); font-size: 10.5px; line-height: 1.6; }

/* ---- cozy shelf cards (Changed / Open groups) ---- */
.sh-shelf { border-radius: var(--radius-lg); background: color-mix(in srgb, var(--cat, var(--accent-blue)) 7%, var(--surface-elevated)); border: 1px solid color-mix(in srgb, var(--cat, var(--accent-blue)) 16%, var(--border-light)); margin-bottom: var(--md); overflow: visible; box-shadow: var(--elev-1); }
.sh-head { display: flex; align-items: center; gap: var(--md); padding: var(--md) var(--lg); background: color-mix(in srgb, var(--cat, var(--accent-blue)) 11%, transparent); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
.sh-hico { width: 22px; height: 22px; flex: none; border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--cat, var(--accent-blue)) 20%, transparent); color: var(--cat, var(--accent-blue)); }
.sh-hico svg { width: 12px; height: 12px; }
.sh-hlabel { font-family: var(--display-font); font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; color: var(--text-primary); }
.sh-hcount { margin-left: auto; font-size: 9.5px; font-weight: 700; padding: 1px 8px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--cat, var(--accent-blue)) 16%, transparent); color: var(--cat, var(--accent-blue)); }
.sh-body { padding: var(--md) var(--lg) var(--lg); }
.side-panel-view .pm-minibtn { border-radius: var(--radius-pill); width: 24px; height: 24px; }
.side-panel-view .pm-btn { border-radius: var(--radius-pill); }
.sh-kv { display: flex; align-items: baseline; justify-content: space-between; gap: var(--md); padding: 3px 2px; font-size: 11.5px; }
.sh-k { color: var(--text-muted); flex: none; }
.sh-v { color: var(--text-primary); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fm-changerow { display: flex; align-items: center; gap: var(--sm); padding: 5px 6px 5px 9px; border-radius: var(--radius-md); min-width: 0; position: relative; transition: background var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.fm-changerow::before { content: ''; position: absolute; left: 0; top: 5px; bottom: 5px; width: 2px; border-radius: 2px; background: var(--cat, var(--accent-blue)); opacity: 0; transform: scaleY(.4); transition: opacity var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.fm-changerow:hover { background: color-mix(in srgb, var(--cat) 9%, transparent); transform: translateX(2px); }
.fm-changerow:hover::before { opacity: 1; transform: scaleY(1); }
.fm-openrow { display: flex; align-items: center; gap: var(--sm); padding: 5px 6px; border-radius: var(--radius-md); min-width: 0; cursor: pointer; transition: background var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.fm-openrow:hover { background: color-mix(in srgb, var(--cat) 9%, transparent); transform: translateX(2px); }
.fm-openrow.active-file { background: color-mix(in srgb, var(--accent-primary) 10%, transparent); }
.fm-openrow .fm-path { flex: 1 1 auto; min-width: 0; font-family: var(--mono-font); font-size: 10px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fm-openrow .fm-dirty { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent-warning); }
/* changed/open row expanders — collapsed header = badge/dot + filename (+ elided
   parent dir, filename-first); the .sh-accb body (shared spring layer) carries the
   full path, hunk stats, and the per-row actions moved out of the header */
.fm-changerow { cursor: pointer; }
.sh-head[data-collapse] { cursor: pointer; }
.fm-cfile { flex: 1 1 auto; min-width: 0; font-family: var(--mono-font); font-size: 10px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fm-cdir { flex: 0 1 auto; max-width: 42%; min-width: 0; font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fm-cchev { flex: none; width: 11px; height: 11px; color: var(--text-muted); transition: transform var(--motion-med) var(--ease-default); }
[data-acc].open > [data-collapse] > .fm-cchev { transform: rotate(90deg); }
.sh-accchev { width: 10px; height: 10px; color: var(--text-muted); transition: transform var(--motion-med) var(--ease-default); flex: none; }
[data-acc].open > [data-collapse] > .sh-accchev { transform: rotate(90deg); }
.fm-cbody { display: flex; flex-direction: column; gap: 5px; padding: 2px 8px 7px 9px; }
.fm-cpath { font-family: var(--mono-font); font-size: 9.5px; color: var(--text-secondary); word-break: break-all; }
.fm-chunks { display: flex; align-items: center; gap: var(--sm); font-family: var(--mono-font); font-size: 9px; }
.fm-chunks .add { color: var(--graph-passed); }
.fm-chunks .del { color: var(--graph-failed); }
.fm-chunks .meta { color: var(--text-muted); }
.fm-cacts { display: flex; gap: var(--xs); flex-wrap: wrap; }
.fm-cacts .pm-btn { font-size: 9px; padding: 3px 9px; }
.fm-cacts .pm-btn.danger { color: var(--accent-error); border-color: color-mix(in srgb, var(--accent-error) 40%, transparent); }
/* toolbar selection chip (always visible while a selection exists) */
.fm-tbtn.fm-selchip { color: var(--accent-primary); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent-primary) 40%, transparent); }
.fm-tbtn.fm-selchip b { font-family: var(--mono-font); font-weight: 700; }
.fm-reveal-note { display: flex; align-items: center; gap: var(--sm); padding: var(--sm) var(--md); margin-bottom: var(--md); border-radius: var(--radius-md); background: color-mix(in srgb, var(--accent-warning) 10%, var(--surface-elevated)); border: 1px solid color-mix(in srgb, var(--accent-warning) 28%, transparent); font-size: 9.5px; color: var(--text-secondary); }
.fm-reveal-note svg { width: 12px; height: 12px; flex: none; color: var(--accent-warning); }
.fm-indexchip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono-font); font-size: 8.5px; color: var(--accent-warning); }
.fm-indexchip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-warning); animation: shPulse 1.6s var(--ease-out) infinite; }
@keyframes shPulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* ---- reskinned file context menu (sprout family) ---- */
.fm-ctx { position: fixed; z-index: 300; min-width: 224px; padding: 5px; border-radius: var(--radius-md); background: var(--surface-elevated); border: 1px solid var(--border); box-shadow: var(--elev-2); display: none; transform-origin: var(--pm6-sprout-ox, 12%) var(--pm6-sprout-oy, 0%); }
.fm-ctx.is-open { display: block; animation: fmSprout .16s var(--ease-out); }
@keyframes fmSprout { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
.fm-ctx-item { display: flex; align-items: center; gap: var(--sm); width: 100%; padding: 6px 9px; border: 0; background: none; border-radius: var(--radius-xs); color: var(--text-secondary); font-size: 11px; cursor: pointer; text-align: left; }
.fm-ctx-item:hover { background: var(--accent-soft); color: var(--text-primary); }
.fm-ctx-item svg { width: 13px; height: 13px; flex: none; color: var(--text-muted); }
.fm-ctx-item:hover svg { color: var(--text-primary); }
.fm-ctx-item .fm-ctx-label { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fm-ctx-item .fm-ctx-key { flex: none; font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); }
.fm-ctx-item.destructive { color: var(--accent-error); }
.fm-ctx-item.destructive svg { color: var(--accent-error); }
.fm-ctx-item[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.fm-ctx-sep { height: 1px; background: var(--border-light); margin: 4px 6px; }

/* ---- sticky footer ---- */
.sh-foot { flex: none; display: flex; align-items: center; gap: var(--sm); padding: var(--sm) var(--md); background: var(--surface-elevated); border-top: 1px solid var(--border-light); box-shadow: 0 -6px 14px -10px color-mix(in srgb, var(--text-primary) 40%, transparent); }
.sh-foot .fm-footstat { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); white-space: nowrap; }
.sh-foot .fm-footstat .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--graph-passed); flex: none; }
.sh-foot .fm-footstat.warn .dot { background: var(--accent-warning); }
.sh-foot .fm-footmeta { margin-left: auto; font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* opacity pulse (shPulse idiom) — the dot's background already follows its state,
   so the pulse colour tracks it for free (no box-shadow keyframes: Slint 1.17) */
.sh-foot .fm-footstat .dot { animation: fmbreathe 2.6s var(--ease-out) infinite; }
@keyframes fmbreathe { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
/* active-pane entrance */
@keyframes fmPaneIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
[data-pane]:not(.pm-hidden) > * { animation: fmPaneIn .3s var(--ease-out) both; }
[data-pane]:not(.pm-hidden) > *:nth-child(2) { animation-delay: .05s; }
[data-pane]:not(.pm-hidden) > *:nth-child(3) { animation-delay: .1s; }
[data-pane]:not(.pm-hidden) > *:nth-child(4) { animation-delay: .15s; }

/* ---- file toolbar (new file / new folder / collapse-all / ignored / filter) ---- */
.fm-toolbar-wrap { flex: none; margin: var(--sm) var(--md) 0; padding: 6px 8px; border-radius: var(--radius-lg); background: color-mix(in srgb, var(--accent-blue) 6%, var(--surface-elevated)); border: 1px solid color-mix(in srgb, var(--accent-blue) 14%, var(--border-light)); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--text-primary) 4%, transparent), var(--elev-1); position: relative; overflow: hidden; }
.fm-toolbar-wrap::before { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 140% at 0% -40%, color-mix(in srgb, var(--accent-blue) 12%, transparent), transparent 60%); pointer-events: none; }
.fm-toolbar { display: flex; flex-wrap: nowrap; align-items: center; gap: var(--xs); position: relative; z-index: 1; }
.fm-toolbar-hint { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 5px; padding-left: 8px; font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); white-space: nowrap; opacity: .9; }
.fm-toolbar-hint svg { width: 12px; height: 12px; flex: none; color: var(--accent-blue); }
.fm-toolbar-hint b { color: var(--text-secondary); font-weight: 700; }
.fm-tbtn { display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto; max-width: 100%; font-family: var(--display-font); font-size: 8px; font-weight: 700; letter-spacing: .5px; padding: 4px 8px; border-radius: var(--radius-pill); border: 1px solid var(--border-light); background: var(--surface-elevated); color: var(--text-secondary); cursor: pointer; white-space: nowrap; transition: transform var(--motion-fast) var(--ease-out), background var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out), box-shadow var(--motion-fast) var(--ease-out); }
.fm-tbtn svg { width: 12px; height: 12px; flex: none; }
.fm-tbtn > span { display: none; overflow: hidden; text-overflow: ellipsis; }
.fm-toolbar.txt .fm-tbtn > span { display: inline; }
.fm-tbtn:hover { color: var(--text-primary); border-color: var(--border); background: var(--accent-soft); transform: translateY(-1px); box-shadow: var(--elev-1); }
.fm-tbtn:active { transform: translateY(0) scale(.96); }
.fm-tbtn.on { color: var(--accent-primary); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent-primary) 40%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent-primary) 22%, transparent); }
/* ---- context-menu submenus (Open with / Copy path) ---- */
.fm-ctx-wrap { position: relative; }
.fm-ctx-sub { position: absolute; left: calc(100% - 4px); top: -5px; min-width: 196px; padding: 5px; border-radius: var(--radius-md); background: var(--surface-elevated); border: 1px solid var(--border); box-shadow: var(--elev-2); display: none; z-index: 1; }
.fm-ctx-wrap.open > .fm-ctx-sub { display: block; animation: fmSprout .14s var(--ease-out); }
.fm-ctx-item .fm-ctx-caret { margin-left: auto; width: 12px; height: 12px; color: var(--text-muted); flex: none; }

/* width tiers */
.side-panel-slot[data-wtier="min"] .sh-banner { padding: var(--md); margin: var(--sm) var(--sm) 0; }
.side-panel-slot[data-wtier="min"] .pm-segtab { margin: var(--sm) var(--sm) 0; }
.side-panel-slot[data-wtier="min"] .pm-segtab-item { gap: 0; padding: 8px 1px 7px; }
.side-panel-slot[data-wtier="min"] .pm-segtab-item > span { display: none; }
.side-panel-slot[data-wtier="min"] .pm-segtab-item svg { width: 16px; height: 16px; }
.side-panel-slot[data-wtier="min"] .sh-scroll { padding: var(--sm); }
.side-panel-slot[data-wtier="min"] .sh-foot { padding: var(--sm); }
.side-panel-slot[data-wtier="min"] .sh-foot .fm-footmeta { display: none; }
/* worktree trigger: full label+chevron when room, branch glyph only when tight */
.sh-bbranch .pm6-tb-menu-trigger .fm-root-ico { display: none; }
.side-panel-slot[data-wtier="min"] .sh-bbranch { flex: 0 0 auto; max-width: none; }
.side-panel-slot[data-wtier="min"] .sh-bbranch .pm6-tb-menu-trigger { width: auto; padding: 4px 8px; }
.side-panel-slot[data-wtier="min"] .sh-bbranch .pm6-tb-menu-trigger .fm-root-ico { display: inline-flex; }
.side-panel-slot[data-wtier="min"] .sh-bbranch .pm6-tb-menu-trigger .pm6-tb-menu-label,
.side-panel-slot[data-wtier="min"] .sh-bbranch .pm6-tb-menu-trigger .pm-ico.sm:not(.fm-root-ico) { display: none; }
.side-panel-slot[data-wtier="min"] .fm-selbar { margin: var(--sm) var(--sm) 0; }

@media (prefers-reduced-motion: reduce) {
  .fm-ctx.is-open { animation: none; }
  .fm-indexchip .dot { animation: none; }
  .sh-foot .fm-footstat .dot { animation: none; }
  .fm-children, .pm-segtab-ink, .fm-row, .fm-quick, .fm-chevron, .fm-cchev, .fm-changerow::before { transition: none; }
  [data-pane]:not(.pm-hidden) > * { animation: none; }
}
[data-reduced-motion="1"] .fm-ctx.is-open { animation: none; }
[data-reduced-motion="1"] .fm-indexchip .dot { animation: none; }
[data-reduced-motion="1"] .sh-foot .fm-footstat .dot { animation: none; }
[data-reduced-motion="1"] .fm-children, [data-reduced-motion="1"] .pm-segtab-ink, [data-reduced-motion="1"] .fm-row, [data-reduced-motion="1"] .fm-quick, [data-reduced-motion="1"] .fm-chevron, [data-reduced-motion="1"] .fm-cchev, [data-reduced-motion="1"] .fm-changerow::before { transition: none; }
[data-reduced-motion="1"] [data-pane]:not(.pm-hidden) > * { animation: none; }
/* glass themes: give sprout menus a near-solid backing so tree rows don't bleed through */
[data-theme^="glass"] .pm6-tb-menu, [data-theme^="glass"] .fm-ctx, [data-theme^="glass"] .fm-ctx-sub { background: linear-gradient(var(--surface-elevated), var(--surface-elevated)), color-mix(in srgb, var(--surface) 92%, transparent); }
</style>
</head>
<body>
<div id="app"></div>
<template id="rail-panels">

  <!-- FILE MANAGER -->
  <div class="side-panel-view" id="panel-files">
    <div class="sh-banner">
      <span class="sh-bico"><i data-ico="files" class="pm-ico"></i></span>
      <span class="sh-title">FILES</span>
      <div class="pm6-tb-menu-wrap sh-bbranch">
        <button type="button" class="pm6-tb-menu-trigger" id="fmRootBtn" aria-controls="fmRootMenu">
          <i data-ico="branch" class="pm-ico sm fm-root-ico"></i><span class="pm6-tb-menu-label" id="fmRootLabel">main</span><i data-ico="chevD" class="pm-ico sm"></i>
        </button>
        <div class="pm6-tb-menu pm6-tb-menu-left" id="fmRootMenu" role="menu" aria-label="Worktree root" data-pm-menu-select>
          <button type="button" class="pm6-tb-menu-item is-selected" role="menuitem" data-value="main" data-label="main" data-root="main" data-demo-action="cmd.git.worktree.open" data-demo-arg="cmd.git.worktree.open -> main (workspace; focus File Manager)">main <span class="pm6-tb-menu-meta">workspace</span></button>
          <button type="button" class="pm6-tb-menu-item" role="menuitem" data-value="lane-b" data-label="orch/lane-b-api" data-root="orch/lane-b-api" data-demo-action="cmd.git.worktree.open" data-demo-arg="cmd.git.worktree.open -> orch/lane-b-api (.worktrees/lane-b-api; focus File Manager)">orch/lane-b-api <span class="pm6-tb-menu-meta">run #47</span></button>
          <button type="button" class="pm6-tb-menu-item" role="menuitem" data-value="lane-d" data-label="orch/lane-d-infra" data-root="orch/lane-d-infra" data-demo-action="cmd.git.worktree.open" data-demo-arg="cmd.git.worktree.open -> orch/lane-d-infra (.worktrees/lane-d-infra; focus File Manager)">orch/lane-d-infra <span class="pm6-tb-menu-meta">run #47</span></button>
          <button type="button" class="pm6-tb-menu-item" role="menuitem" data-value="import" data-label="thread/import-fixes" data-root="thread/import-fixes" data-demo-action="cmd.git.worktree.open" data-demo-arg="cmd.git.worktree.open -> thread/import-fixes (.worktrees/import-fixes; focus File Manager)">thread/import-fixes <span class="pm6-tb-menu-meta">thread</span></button>
          <button type="button" class="pm6-tb-menu-item" role="menuitem" data-value="spike" data-label="spike/r2-storage" data-root="spike/r2-storage" aria-disabled="true" data-demo-action="demo.reason" data-demo-arg="spike/r2-storage is read-only in this demo (manual worktree)">spike/r2-storage <span class="pm6-tb-menu-meta">read-only</span></button>
        </div>
      </div>
      <div class="sh-bhead-acts">
        <button class="pm-minibtn" title="Refresh" data-demo-action="cmd.file.refresh" data-demo-arg="cmd.file.refresh -> re-read active worktree tree"><i data-ico="refresh" class="pm-ico sm"></i></button>
        <button class="pm-minibtn" title="Pop out" data-demo-action="cmd.panel.undock" data-demo-arg="cmd.panel.undock -> File Manager (dock left/right)"><i data-ico="external" class="pm-ico sm"></i></button>
      </div>
    </div>

    <div class="pm-segtab" role="tablist" aria-label="File Manager views" style="--cat:var(--cat-blue)">
      <span class="pm-segtab-ink" id="fmTabInk" aria-hidden="true"></span>
      <button type="button" class="pm-segtab-item active" data-tab="explorer" role="tab" aria-label="Explorer"><i data-ico="folderOpen" class="pm-ico"></i><span>Explorer</span></button>
      <button type="button" class="pm-segtab-item" data-tab="changed" role="tab" aria-label="Changed"><i data-ico="diff" class="pm-ico"></i><span>Changed</span></button>
      <button type="button" class="pm-segtab-item" data-tab="open" role="tab" aria-label="Open"><i data-ico="file" class="pm-ico"></i><span>Open</span></button>
    </div>

    <div class="fm-toolbar-wrap">
      <div class="fm-toolbar" id="fmToolbar">
        <button type="button" class="fm-tbtn" id="fmNewFile" title="New file" data-demo-action="cmd.file.new_file" data-demo-arg="cmd.file.new_file -> prompting name (single target context)"><i data-ico="filePlus" class="pm-ico"></i><span>New file</span></button>
        <button type="button" class="fm-tbtn" id="fmNewFolder" title="New folder" data-demo-action="cmd.file.new_folder" data-demo-arg="cmd.file.new_folder -> prompting name (single target context)"><i data-ico="folderPlus" class="pm-ico"></i><span>New folder</span></button>
        <button type="button" class="fm-tbtn" id="fmCollapseAll" title="Collapse / expand all folders"><i data-ico="boxMinus" class="pm-ico" id="fmCollapseIco"></i><span id="fmCollapseLbl">Collapse all</span></button>
        <button type="button" class="fm-tbtn" id="fmHideIgnored" aria-pressed="false" title="Hide ignored files"><i data-ico="eye" class="pm-ico"></i><span>Ignored</span></button>
        <button type="button" class="fm-tbtn" id="fmFilterToggle" aria-pressed="false" title="Filter / type-ahead"><i data-ico="search" class="pm-ico"></i><span>Filter</span></button>
        <button type="button" class="fm-tbtn fm-selchip" id="fmSelChip" style="display:none" title="Clear selection"><b id="fmSelChipN">0</b><span class="fm-selchip-lbl">&nbsp;selected</span></button>
        <span class="fm-toolbar-hint" id="fmToolbarHint" title="Items in view"><i data-ico="files" class="pm-ico"></i><b id="fmHintCount">0</b></span>
      </div>
    </div>

    <div class="fm-selbar" id="fmSelBar" role="status">
      <span class="fm-selcount"><b id="fmSelCount">0</b> selected</span>
      <span class="fm-selacts">
        <button class="pm-minibtn" title="Copy paths" data-demo-action="cmd.file.copy_path" data-demo-arg="cmd.file.copy_path -> newline-delimited absolute paths of selection"><i data-ico="copy" class="pm-ico sm"></i></button>
        <button class="pm-minibtn" title="Cut" data-demo-action="cmd.file.cut_nodes" data-demo-arg="cmd.file.cut_nodes -> mark selection for move (visibly armed)"><i data-ico="scissors" class="pm-ico sm"></i></button>
        <button class="pm-minibtn" title="Add to chat" data-demo-action="cmd.chat.add_file_reference" data-demo-arg="cmd.chat.add_file_reference -> selection as visible chips (file-only)"><i data-ico="chat" class="pm-ico sm"></i></button>
        <button class="pm-minibtn danger" title="Delete selection" data-demo-action="cmd.file.delete" data-demo-arg="cmd.file.delete -> recursive delete of selection (confirm)"><i data-ico="trash" class="pm-ico sm"></i></button>
        <button class="pm-minibtn" id="fmSelClear" title="Clear selection"><i data-ico="x" class="pm-ico sm"></i></button>
      </span>
    </div>

    <div class="sh-scroll">

      <!-- EXPLORER -->
      <div data-pane="explorer">
        <div class="fm-filter" id="fmFilterWrap">
          <label class="pm-input"><i data-ico="search" class="pm-ico sm"></i><input id="fmFilter" type="text" placeholder="Filter files…" aria-label="Filter files"></label>
          <span class="fm-filtercount" id="fmFilterCount"></span>
          <button class="pm-minibtn fm-filterclear" id="fmFilterClear" title="Clear filter" style="display:none"><i data-ico="x" class="pm-ico sm"></i></button>
        </div>
        <div class="fm-reveal-note" id="fmRevealNote" style="display:none"><i data-ico="warn" class="pm-ico"></i><span id="fmRevealText"></span></div>
        <div class="fm-tree" id="fmTree">
          <!-- Slint port note: this nested DOM tree maps to a FLAT ListView row model
               (visible rows only; depth, indent, chevron and indent-guide count become
               per-row properties) per FILE-MANAGER-DEEPDIVE §4.2 — do not port the nesting. -->

          <div class="fm-node fm-folder" data-acc>
            <div class="fm-row" data-collapse tabindex="0" role="treeitem" aria-expanded="false" data-path="src" data-kind="folder">
              <i data-ico="chevR" class="pm-ico fm-chevron"></i><span class="fm-name">src</span><span class="fm-count">7</span>
              <span class="fm-quick"><button class="pm-minibtn" title="New file" data-demo-action="cmd.file.new_file" data-demo-arg="cmd.file.new_file -> parent src (single target)"><i data-ico="plus" class="pm-ico sm"></i></button><button class="pm-minibtn" title="Open in terminal" data-demo-action="cmd.terminal.show" data-demo-arg="cmd.terminal.show -> cwd src/"><i data-ico="terminal" class="pm-ico sm"></i></button></span>
            </div>
            <div class="fm-children">
              <div class="fm-node fm-file" data-acc>
                <div class="fm-row" tabindex="0" role="treeitem" data-path="src/main.rs" data-name="main.rs" data-kind="rs" data-demo-action="cmd.file.open" data-demo-arg="cmd.file.open -> src/main.rs (OpenFile path-based, single row)">
                  <i data-ico="rust" class="pm-ico fm-ficon rs"></i><span class="fm-name mono">main.rs</span>
                  <span class="fm-quick"><button class="pm-minibtn" title="Add to chat" data-demo-action="cmd.chat.add_file_reference" data-demo-arg="cmd.chat.add_file_reference -> src/main.rs"><i data-ico="chat" class="pm-ico sm"></i></button><button class="pm-minibtn" title="Copy relative path" data-demo-action="cmd.file.copy_path" data-demo-arg="cmd.file.copy_path -> src/main.rs (relative)"><i data-ico="copy" class="pm-ico sm"></i></button></span>
                </div>
              </div>

              <div class="fm-node fm-folder" data-acc>
                <div class="fm-row" data-collapse tabindex="0" role="treeitem" aria-expanded="false" data-path="src/routes" data-kind="folder">
                  <i data-ico="chevR" class="pm-ico fm-chevron"></i><span class="fm-name">routes</span><span class="fm-count">2</span>
                </div>
                <div class="fm-children">
                  <div class="fm-node fm-file" data-acc>
                    <div class="fm-row" tabindex="0" role="treeitem" data-path="src/routes/recipes.rs" data-name="recipes.rs" data-kind="rs" data-git="M" data-demo-action="cmd.file.open" data-demo-arg="cmd.file.open -> src/routes/recipes.rs">
                      <i data-ico="rust" class="pm-ico fm-ficon rs"></i><span class="fm-name mono">recipes.rs</span><span class="fm-gitbadge M keep"><i data-ico="diff" class="pm-ico"></i>M</span>
                      <span class="fm-quick"><button class="pm-minibtn" title="Stage" data-demo-action="cmd.git.stage_hunks" data-demo-arg="cmd.git.stage_hunks -> recipes.rs"><i data-ico="plus" class="pm-ico sm"></i></button><button class="pm-minibtn" title="Open diff" data-demo-action="cmd.git.diff_open" data-demo-arg="cmd.git.diff_open -> recipes.rs"><i data-ico="diff" class="pm-ico sm"></i></button></span>
                    </div>
                  </div>
                  <div class="fm-node fm-file" data-acc>
                    <div class="fm-row" tabindex="0" role="treeitem" data-path="src/routes/auth.rs" data-name="auth.rs" data-kind="rs" data-demo-action="cmd.file.open" data-demo-arg="cmd.file.open -> src/routes/auth.rs">
                      <i data-ico="rust" class="pm-ico fm-ficon rs"></i><span class="fm-name mono">auth.rs</span>
                      <span class="fm-quick"><button class="pm-minibtn" title="Add to chat" data-demo-action="cmd.chat.add_file_reference" data-demo-arg="cmd.chat.add_file_reference -> src/routes/auth.rs"><i data-ico="chat" class="pm-ico sm"></i></button><button class="pm-minibtn" title="Copy relative path" data-demo-action="cmd.file.copy_path" data-demo-arg="cmd.file.copy_path -> src/routes/auth.rs (relative)"><i data-ico="copy" class="pm-ico sm"></i></button></span>
                    </div>
                  </div>
                </div>
              </div>

              <div class="fm-node fm-folder" data-acc>
                <div class="fm-row" data-collapse tabindex="0" role="treeitem" aria-expanded="false" data-path="src/services" data-kind="folder">
                  <i data-ico="chevR" class="pm-ico fm-chevron"></i><span class="fm-name">services</span><span class="fm-count">4</span>
                </div>
                <div class="fm-children">
                  <div class="fm-node fm-file" data-acc>
                    <div class="fm-row" tabindex="0" role="treeitem" data-path="src/services/image.rs" data-name="image.rs" data-kind="rs" data-git="M" data-demo-action="cmd.file.open" data-demo-arg="cmd.file.open -> src/services/image.rs">
                      <i data-ico="rust" class="pm-ico fm-ficon rs"></i><span class="fm-name mono">image.rs</span><span class="fm-gitbadge M keep"><i data-ico="diff" class="pm-ico"></i>M</span>
                      <span class="fm-quick"><button class="pm-minibtn" title="Stage" data-demo-action="cmd.git.stage_hunks" data-demo-arg="cmd.git.stage_hunks -> image.rs"><i data-ico="plus" class="pm-ico sm"></i></button><button class="pm-minibtn" title="Open diff" data-demo-action="cmd.git.diff_open" data-demo-arg="cmd.git.diff_open -> image.rs"><i data-ico="diff" class="pm-ico sm"></i></button></span>
                    </div>
                  </div>
                  <div class="fm-node fm-file" data-acc>
                    <div class="fm-row" tabindex="0" role="treeitem" data-path="src/services/import.rs" data-name="import.rs" data-kind="rs" data-demo-action="cmd.file.open" data-demo-arg="cmd.file.open -> src/services/import.rs">
                      <i data-ico="rust" class="pm-ico fm-ficon rs"></i><span class="fm-name mono">import.rs</span>
                      <span class="fm-quick"><button class="pm-minibtn" title="Add to chat" data-demo-action="cmd.chat.add_file_reference" data-demo-arg="cmd.chat.add_file_reference -> src/services/import.rs"><i data-ico="chat" class="pm-ico sm"></i></button><button class="pm-minibtn" title="Copy relative path" data-demo-action="cmd.file.copy_path" data-demo-arg="cmd.file.copy_path -> src/services/import.rs (relative)"><i data-ico="copy" class="pm-ico sm"></i></button></span>
                    </div>
                  </div>
                  <div class="fm-node fm-folder" data-acc>
                    <div class="fm-row" data-collapse tabindex="0" role="treeitem" aria-expanded="false" data-path="src/services/import/normalize_units" data-kind="folder">
                      <i data-ico="chevR" class="pm-ico fm-chevron"></i><span class="fm-name">normalize_units</span><span class="fm-count">2</span>
                    </div>
                    <div class="fm-children">
                      <div class="fm-node fm-file" data-acc>
                        <div class="fm-row" tabindex="0" role="treeitem" data-path="src/services/import/normalize_units/mixed_fractions.rs" data-name="mixed_fractions.rs" data-kind="rs" data-git="A" data-demo-action="cmd.file.open" data-demo-arg="cmd.file.open -> mixed_fractions.rs">
                          <i data-ico="rust" class="pm-ico fm-ficon rs"></i><span class="fm-name mono">mixed_fractions.rs</span><span class="fm-gitbadge A keep"><i data-ico="plus" class="pm-ico"></i>A</span>
                          <span class="fm-quick"><button class="pm-minibtn" title="Stage" data-demo-action="cmd.git.stage_hunks" data-demo-arg="cmd.git.stage_hunks -> mixed_fractions.rs"><i data-ico="plus" class="pm-ico sm"></i></button><button class="pm-minibtn" title="Open diff" data-demo-action="cmd.git.diff_open" data-demo-arg="cmd.git.diff_open -> mixed_fractions.rs"><i data-ico="diff" class="pm-ico sm"></i></button></span>
                        </div>
                      </div>
                      <div class="fm-node fm-file" data-acc>
                        <div class="fm-row" tabindex="0" role="treeitem" data-path="src/services/import/normalize_units/units_table.rs" data-name="units_table.rs" data-kind="rs" data-demo-action="cmd.file.open" data-demo-arg="cmd.file.open -> units_table.rs">
                          <i data-ico="rust" class="pm-ico fm-ficon rs"></i><span class="fm-name mono">units_table.rs</span>
                          <span class="fm-quick"><button class="pm-minibtn" title="Copy relative path" data-demo-action="cmd.file.copy_path" data-demo-arg="cmd.file.copy_path -> units_table.rs (relative)"><i data-ico="copy" class="pm-ico sm"></i></button></span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

<script>
PMChrome.boot({ badge: { id: 'C2·FM', name: 'Cozy File Manager' } });
/* The shared shell injects its own built-in File Manager panel (also id="panel-files",
   class pm-files-panel). This concept replaces it, so remove that built-in copy and keep
   only the cozy redesign from our <template> (still wired to the FILES activity-bar icon). */
(function () {
  var builtIn = document.querySelector('.side-panel-view.pm-files-panel#panel-files');
  if (builtIn) builtIn.remove();
  if (window.PMRail && PMRail.showPanel) PMRail.showPanel('panel-files');
})();

(function () {
  'use strict';
  var panel = document.getElementById('panel-files');
  if (!panel) return;
  var tree = document.getElementById('fmTree');
  var ctx = document.getElementById('fmContextMenu');

  /* ---- hydrate the file-type / edit glyphs chrome boot did not know ---- */
  panel.querySelectorAll('i[data-ico]').forEach(function (el) {
    if (!el.innerHTML) el.innerHTML = window.PMIcon(el.getAttribute('data-ico'));
  });
  ctx.querySelectorAll('i[data-ico]').forEach(function (el) {
    if (!el.innerHTML) el.innerHTML = window.PMIcon(el.getAttribute('data-ico'));
  });

  /* ---- context menu: reskinned sprout via PMMenu.openAt — bound at panel level
          so tree rows AND Changed/Open pane rows all get it ---- */
  var ctxTarget = null;
  function rowOf(el) { return el && el.closest ? el.closest('.fm-row, .fm-changerow, .fm-openrow') : null; }
  panel.addEventListener('contextmenu', function (ev) {
    var r = rowOf(ev.target);
    if (!r) return;
    ev.preventDefault();
    ctxTarget = r;
    /* disable Paste unless a folder/root is the target */
    var paste = document.getElementById('fmCtxPaste');
    if (paste) paste.setAttribute('aria-disabled', r.getAttribute('data-kind') === 'folder' ? 'false' : 'true');
    if (window.PMMenu && PMMenu.openAt) PMMenu.openAt(ctx, ev.clientX, ev.clientY);
    ctx.dispatchEvent(new CustomEvent('pm-ctx-open'));
  });
  /* keyboard context menu (Shift+F10 / Menu) on a focused row */
  panel.addEventListener('keydown', function (ev) {
    if (ev.key !== 'F10' && ev.key !== 'ContextMenu') return;
    var r = rowOf(ev.target);
    if (!r) return;
    if (ev.key === 'F10' && !ev.shiftKey) return;
    ev.preventDefault();
    ctxTarget = r;
    var rc = r.getBoundingClientRect();
    if (window.PMMenu && PMMenu.openAt) PMMenu.openAt(ctx, rc.left + 16, rc.bottom);
  });

  /* ---- multi-select model (one active row + additive/range multi-select
          for drag-out / delete / path-copy; open stays single-row) ---- */
  var rows = Array.prototype.slice.call(tree.querySelectorAll('.fm-row[data-path]'));
  var selected = new Set();
  var lastIdx = -1;
  var selBar = document.getElementById('fmSelBar');
  var selCount = document.getElementById('fmSelCount');
  function paintSel() {
    rows.forEach(function (r, i) { var on = selected.has(r); r.classList.toggle('selected', on); r.setAttribute('aria-selected', String(on)); r.dataset.idx = i; });
    selCount.textContent = selected.size;
    selBar.classList.toggle('show', selected.size > 1);
    var chip = document.getElementById('fmSelChip'), chipN = document.getElementById('fmSelChipN');
    if (chip) { chip.style.display = selected.size > 0 ? '' : 'none'; if (chipN) chipN.textContent = selected.size; }
    if (window.__fmToolbarFit) window.__fmToolbarFit();
    if (window.__fmUpdateHint) window.__fmUpdateHint();
  }
  function clearSel() { selected.clear(); paintSel(); }
  document.getElementById('fmSelClear').addEventListener('click', clearSel);
  var selChip = document.getElementById('fmSelChip');
  if (selChip) selChip.addEventListener('click', clearSel);

  tree.addEventListener('click', function (ev) {
    /* ignore clicks on quick-action buttons / chevrons (they have their own job) */
    if (ev.target.closest('.fm-quick') || ev.target.closest('[data-collapse]')) return;
    var r = rowOf(ev.target);
    if (!r || !r.getAttribute('data-path')) return;
    var i = rows.indexOf(r);
    if (ev.shiftKey && lastIdx >= 0) {
      /* range selection sweeps VISIBLE rows only — rows hidden inside collapsed
         folders or by the filter / Hide-ignored must never be silently included */
      var lo = Math.min(i, lastIdx), hi = Math.max(i, lastIdx);
      for (var k = lo; k <= hi; k++) if (rows[k].offsetParent !== null) selected.add(rows[k]);
    } else if (ev.metaKey || ev.ctrlKey) {
      if (selected.has(r)) selected.delete(r); else selected.add(r);
      lastIdx = i;
    } else {
      selected.clear(); selected.add(r); lastIdx = i;
    }
    paintSel();
  });

  /* ---- derive row git-status class from data-git (drives filename colour) ---- */
  tree.querySelectorAll('.fm-row[data-git]').forEach(function (r) {
    var g = r.getAttribute('data-git');
    if (g === 'M') r.classList.add('M');
    else if (g === 'A') r.classList.add('A');
    else if (g === 'D') r.classList.add('D');
    else if (g === 'C') r.classList.add('C');
    else if (g === '?' || g === 'Q') r.classList.add('Q');
  });

  /* ---- folders inherit the strongest descendant change colour
          (precedence: conflict > added/untracked > modified > deleted) ---- */
  (function folderInherit() {
    var RANK = { C: 4, Q: 3, '?': 3, A: 3, M: 2, D: 1 };
    var CLS = ['M', 'A', 'Q', 'D', 'C'];
    function statusOf(node) {
      var row = node.querySelector(':scope > .fm-row');

      n.style.display = show ? '' : 'none';
      if (q && show && !isFolder && n.dataset.match === '1') matches++;
      if (q && isFolder && descHit && show && !n.classList.contains('open')) window.__fmAnimate(n, true);
    });
    fcount.textContent = !q ? '' : (matches ? matches + ' match' + (matches === 1 ? '' : 'es') : 'no matches');
    /* hidden-file disclosure for the current file (filter or Hide-ignored) */
    var cur = tree.querySelector('.fm-row.active-file');
    if (cur) {
      var hidden = false, p = cur.closest('.fm-node');
      while (p) { if (p.style.display === 'none') { hidden = true; break; } p = p.parentElement ? p.parentElement.closest('.fm-node') : null; }
      if (hidden) {
        revealText.textContent = q ? 'Current file is hidden by this filter — clear it to reveal in the tree.' : 'Current file is hidden by Hide ignored — turn it off to reveal in the tree.';
        revealNote.style.display = '';
      } else { revealNote.style.display = 'none'; }
    }
    updateToolbarHint();
    if (window.__fmRefreshCollapse) window.__fmRefreshCollapse();
  }
  filter.addEventListener('input', applyVisibility);
  fclear.addEventListener('click', function () { filter.value = ''; applyVisibility(); filter.focus(); });

  /* ---- Hide ignored toggle (eye -> eyeOff swap mirrors the state) ---- */
  hideBtn.addEventListener('click', function () {
    var on = hideBtn.classList.toggle('on');
    hideBtn.setAttribute('aria-pressed', String(on));
    hideBtn.setAttribute('title', on ? 'Show ignored files' : 'Hide ignored files');
    var ic = hideBtn.querySelector('i[data-ico]');
    if (ic) { ic.setAttribute('data-ico', on ? 'eyeOff' : 'eye'); ic.innerHTML = window.PMIcon(on ? 'eyeOff' : 'eye', ic.className); }
    applyVisibility();
  });

  /* ---- worktree root switch (demonstrates worktree-keyed tree identity) ---- */
  var rootMenu = document.getElementById('fmRootMenu');
  var rootLabel = document.getElementById('fmRootLabel');
  var watchStat = document.getElementById('fmWatchStat');
  rootMenu.addEventListener('pm-menu-pick', function (ev) {
    var item = ev.detail && ev.detail.item;
    if (!item) return;
    var root = item.getAttribute('data-root') || item.getAttribute('data-label');
    rootLabel.textContent = root;
    watchStat.querySelector('.dot').style.background = root === 'main' ? 'var(--graph-passed)' : 'var(--accent-warning)';
    watchStat.childNodes[watchStat.childNodes.length - 1].textContent = 'Watching 18 · root ' + root + ' · .gitignore respected';
  });

  /* ---- demo: cycle the indexing/degraded chip on the footer for 2.5s after refresh ---- */
  var indexChip = document.getElementById('fmIndexChip');
  var indexText = document.getElementById('fmIndexText');
  panel.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-demo-action="cmd.file.refresh"]');
    if (!b) return;
    indexText.textContent = 'Refreshing index…';
    indexChip.style.display = '';
    setTimeout(function () { indexText.textContent = 'Building search index — first build may take several minutes'; }, 700);
    setTimeout(function () { indexChip.style.display = 'none'; }, 2500);
  });

  paintSel();
})();
</script>
</body>
</html>
