.dB-proj{display:flex;align-items:center;justify-content:space-between;gap:var(--sm);min-width:0;padding:0 0 var(--xs)}

.dB-topo{display:flex;flex-direction:column;gap:var(--sm)}

.dB-imgi{flex:none;color:var(--text-muted)}
.dB-imgtag{font-family:var(--mono-font);font-size:9.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}

.dB-kids{display:flex;flex-direction:column;gap:1px;margin:var(--xs) 0 0 9px;border-left:1px solid color-mix(in srgb,var(--cc,var(--accent-blue)) 42%,var(--border-light));padding-left:10px}

.dB-sub{display:flex;align-items:center;gap:var(--sm);min-width:0;margin:var(--md) 0 var(--xs);font-family:var(--display-font);font-size:8px;font-weight:700;letter-spacing:1.8px;color:var(--cc2,var(--text-muted))}
.dB-sub::after{content:'';flex:1 1 auto;min-width:8px;height:1px;background:var(--border-light)}
.dB-card .pm-kv{font-size:10.5px}
.dB-regs{min-width:0}

.dB-chain{position:relative;display:flex;flex-direction:column;margin:var(--sm) 0;padding-left:20px}

.dB-stage{position:relative;display:flex;align-items:center;gap:var(--md);min-width:0;padding:3.5px 0}
.dB-stage i{position:absolute;left:-20px;width:13px;height:13px;display:flex;align-items:center;justify-content:center;font-family:var(--mono-font);font-size:8px;font-style:normal;color:var(--text-muted);border:1px solid var(--border);border-radius:50%;background:var(--surface-elevated)}
.dB-stage.done i{border-color:var(--graph-passed);color:var(--graph-passed)}
.dB-stage.now i{border-color:var(--graph-running);color:var(--graph-running);animation:dBpulse 1.6s var(--ease-out) infinite}
@keyframes dBpulse{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--graph-running) 22%,transparent)}}
.dB-stagel{flex:1 1 auto;min-width:0;font-size:10.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dB-stage.done .dB-stagel{color:var(--text-primary)}
.dB-stage .pm-chip{font-size:8px;padding:0 6px}

.dB-pads{display:flex;flex-wrap:wrap;gap:var(--sm);margin-top:var(--sm)}

.dB-accl{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dB-accm{flex:none;font-family:var(--mono-font);font-size:9px;color:var(--text-muted)}
.dB-accb .dB-log{margin:4px 8px 8px}

.side-panel-slot[data-wtier="min"] .dB-ports,
.side-panel-slot[data-wtier="min"] .dB-cmeta,
.side-panel-slot[data-wtier="min"] .dB-secmeta,
.side-panel-slot[data-wtier="min"] .dB-accm{display:none}

.side-panel-slot[data-wtier="min"] .dB-sico{width:16px;height:16px}
.side-panel-slot[data-wtier="wide"] .dB-topo{display:grid;grid-template-columns:1fr 1fr;gap:var(--sm);align-items:start}
.side-panel-slot[data-wtier="wide"] .dB-regs{display:grid;grid-template-columns:1fr 1fr;column-gap:var(--lg)}
