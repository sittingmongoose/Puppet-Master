<style>
.bB-head{flex:none;display:flex;align-items:center;gap:var(--md);padding:var(--lg);min-width:0;overflow:hidden;border-bottom:1px solid var(--border-light)}
.bB-hico{width:26px;height:26px;flex:none;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-primary)}
.bB-title{font-family:var(--display-font);font-size:11px;font-weight:700;letter-spacing:.6px;flex:1 1 auto;min-width:max-content;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bB-stat{margin-left:auto;flex:0 1 auto;min-width:0;max-width:52%;font-family:var(--mono-font);font-size:9.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bB-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:var(--md) var(--lg) var(--lg)}

.bB-term{
  background:color-mix(in srgb, var(--surface) 92%, #000);
  border:1px solid var(--border-light);
  border-radius:var(--radius-sm);
  padding:var(--md);
  font-family:var(--mono-font);
  font-size:10.5px;
  line-height:1.6;
  box-shadow:var(--elev-1), inset 0 2px 14px color-mix(in srgb, #000 20%, transparent);
}
.bB-prompt{
  display:flex;align-items:baseline;gap:var(--md);min-width:0;
  padding:var(--lg) 0 3px;
  color:var(--text-muted);font-size:9.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bB-prompt:first-child{padding-top:2px}
.bB-tag{
  flex:none;font-family:var(--display-font);font-size:8px;font-weight:700;
  letter-spacing:1.8px;color:var(--cc, var(--accent-primary));
}
.bB-cmdline{min-width:0;overflow:hidden;text-overflow:ellipsis}
.bB-pcount{color:var(--accent-warning)}

.bB-row{
  display:flex;align-items:center;gap:var(--sm);min-width:0;
  padding:2px 4px;border-radius:var(--radius-xs);
  transition:background var(--motion-fast) var(--ease-out),
    box-shadow var(--motion-fast) var(--ease-out),
    transform var(--motion-fast) var(--ease-out);
}
.bB-row:hover{
  background:color-mix(in srgb, var(--accent-primary) 6%, transparent);
  box-shadow:inset 2px 0 0 var(--cc, var(--accent-primary));
  transform:translateX(1px);
}
.bB-xy{flex:none;width:24px;font-weight:700;white-space:pre;text-align:left}
.bB-xy-st{color:var(--graph-passed)}
.bB-xy-wt{color:var(--accent-warning)}
.bB-xy-uu{color:var(--graph-failed)}
.bB-path{
  flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--text-secondary);cursor:pointer;
  transition:color var(--motion-fast) var(--ease-out);
}
.bB-path:hover{color:var(--text-primary)}
.bB-dstat{display:none;flex:none;font-size:9.5px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.bB-dstat b{font-weight:400;color:var(--graph-passed)}
.bB-dstat i{font-style:normal;color:var(--graph-failed)}
.bB-acts{display:flex;gap:4px;flex:none;margin-left:auto}
.bB-acts .pm-minibtn{width:18px;height:18px;border-radius:var(--radius-xs)}
.bB-acts .pm-minibtn svg{width:10px;height:10px}

.bB-row:has(.dot-run){
  position:relative;overflow:hidden;
  background:linear-gradient(90deg, color-mix(in srgb, var(--graph-running) 8%, transparent), transparent 62%);
}
.bB-row:has(.dot-run)::after{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--graph-running);
  animation:bBLive 1.8s var(--ease-out) infinite;
}
@keyframes bBLive{0%,100%{opacity:.35}50%{opacity:1}}
.bB-op{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-secondary)}
.bB-op.dim{color:var(--text-muted)}

.bB-conf{margin:1px 0}
.bB-acch{
  display:flex;align-items:center;gap:var(--sm);min-width:0;
  padding:3px 4px;border-radius:var(--radius-xs);cursor:pointer;
  color:var(--graph-failed);font-weight:700;font-size:10px;
  transition:background var(--motion-fast) var(--ease-out);
}
.bB-acch:hover{background:color-mix(in srgb, var(--graph-failed) 9%, transparent)}
.bB-chev{flex:none;color:var(--text-muted);transition:transform var(--motion-med) var(--ease-default)}
.bB-conf.open .bB-chev{transform:rotate(90deg)}
.bB-acct{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bB-accn{flex:none;font-size:9px;color:var(--text-muted);font-weight:400}
.bB-accb{display:grid;grid-template-rows:0fr;opacity:0}
.bB-cfl{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:1px 4px 1px 32px;font-size:9.5px;color:var(--text-muted);
}
.bB-mk-ours{color:var(--graph-failed)}
.bB-mk-sep{color:var(--text-muted)}
.bB-mk-theirs{color:var(--accent-orange)}
.bB-cfl.panic{color:var(--graph-failed)}
.bB-cfl em{font-style:normal;color:var(--text-secondary)}

.bB-switchrow{padding:3px 0 1px}
.bB-switcher{
  width:100%;min-width:0;justify-content:flex-start;gap:var(--sm);
  border:1px solid var(--border-light);border-radius:var(--radius-xs);
  padding:4px 8px;min-height:24px;
}
.bB-switcher .bB-branchlabel{
  flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--mono-font);font-size:10.5px;font-weight:600;color:var(--text-primary);
  text-align:left;
}
.bB-switcher svg{flex:none}
.bB-bmeta{
  padding:2px 4px 0;color:var(--text-muted);font-size:9.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.bB-dock{display:flex;align-items:center;gap:var(--sm);min-width:0;padding:4px 0 2px}
.bB-dock{flex-wrap:wrap;gap:var(--sm)}
.bB-dock .pm-input{flex:1 1 100%;min-width:0;padding:5px 8px}
.bB-dock .pm-input input{font-family:var(--mono-font);font-size:10.5px}
.bB-cmds{display:flex;flex-wrap:wrap;gap:var(--sm);padding:2px 0}
.bB-cmd{
  flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
  font-size:10px;letter-spacing:0;text-transform:lowercase;
  padding:4px 7px;min-height:24px;border-radius:var(--radius-xs);
  white-space:nowrap;
}

.bB-wt{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:var(--sm);align-items:center}
.bB-pill{
  display:inline-flex;align-items:center;gap:4px;flex:none;
  font-size:9px;font-weight:700;letter-spacing:.04em;
  padding:1px 6px;border-radius:var(--radius-pill);white-space:nowrap;
}
.bB-pill .dot{width:5px;height:5px}
.bB-clean{color:var(--graph-passed);background:color-mix(in srgb, var(--graph-passed) 12%, transparent)}
.bB-dirty{color:var(--accent-warning);background:color-mix(in srgb, var(--accent-warning) 14%, transparent)}
.bB-runp{color:var(--graph-running);background:color-mix(in srgb, var(--graph-running) 13%, transparent)}
.bB-wtbranch{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-primary);cursor:pointer}
.bB-wtbranch:hover{text-decoration:underline dotted}
.bB-wtpath{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-muted);font-size:9.5px}
.bB-wtend{display:flex;align-items:center;gap:4px;min-width:0;justify-self:end}
.bB-owner{max-width:56px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-muted);font-size:9.5px}

.bB-sha{flex:none;color:var(--accent-orange);font-size:10px;font-variant-numeric:tabular-nums;cursor:pointer}
.bB-sha:hover{text-decoration:underline dotted}
.bB-hmsg{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-secondary)}
.bB-decor{color:var(--accent-lime)}
.bB-age{flex:none;color:var(--text-muted);font-size:9.5px;font-variant-numeric:tabular-nums}

.bB-star{flex:none;width:10px;text-align:center;font-weight:700;color:var(--accent-lime)}
.bB-star.off{color:transparent}
.bB-bname{flex:none;max-width:44%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-primary);cursor:pointer}
.bB-bname:hover{text-decoration:underline dotted}
.bB-binfo{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-muted)}
.bB-stname{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-secondary)}
.bB-stname b{font-weight:700;color:var(--accent-magenta)}

.bB-end{padding-top:var(--lg)}
.bB-cursor{
  display:inline-block;width:6px;height:11px;margin-left:3px;vertical-align:-2px;
  background:var(--accent-primary);
  animation:bBBlink 1.1s steps(2) infinite;
}
@keyframes bBBlink{50%{opacity:0}}

.side-panel-slot[data-wtier="wide"] .bB-dstat{display:inline}
.side-panel-slot[data-wtier="min"] .bB-owner{display:none}
.side-panel-slot[data-wtier="min"] .bB-cmd .pm-ico{display:none}
.side-panel-slot[data-wtier="min"] .bB-cmd{padding:4px 5px;font-size:9px}
.side-panel-slot[data-wtier="min"] .bB-bname{max-width:38%}
</style>
