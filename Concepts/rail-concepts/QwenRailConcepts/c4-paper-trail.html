<style>
/* =====================================================================
   C4 — PAPER TRAIL
   The panel as a dated ledger on a single vertical timeline. Section
   headers become rubber-stamp markers on the spine; search hit nodes
   carry their LINE NUMBERS; git nodes carry status; history nodes carry
   commit times. Stamp-style outline status chips + monospace detail give
   it an archival, evidence-ledger feel — the panel reads top-to-bottom as
   "what happened", which suits source/artifacts/actions especially well.
   ===================================================================== */
.side-panel-view { background: var(--surface); }
.pt-stamp-font { font-family: 'Special Elite', var(--mono-font); }

.pt-head { flex: none; display: flex; align-items: center; gap: var(--md); padding: var(--lg); min-width: 0; overflow: hidden; border-bottom: 1px solid var(--border-light); }
.pt-hico { width: 26px; height: 26px; flex: none; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent-primary); }
.pt-hico svg { width: 14px; height: 14px; }
.pt-htitle { font-family: var(--display-font); font-size: 11px; font-weight: 700; letter-spacing: .6px; flex: 1 1 auto; min-width: max-content; white-space: nowrap; }
.pt-hread { margin-left: auto; flex: 0 1 auto; min-width: 0; max-width: 50%; font-family: var(--mono-font); font-size: 9.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pt-filter { flex: none; display: flex; gap: var(--sm); padding: var(--md) var(--lg) 0; }
.pt-fstamp { flex: none; font-family: 'Special Elite', var(--mono-font); font-size: 9.5px; letter-spacing: .04em; padding: 3px 9px; border: 1.5px solid var(--border); color: var(--text-secondary); border-radius: 2px; transform: rotate(-.6deg); }
.pt-fstamp.active { color: var(--accent-primary); border-color: var(--accent-primary); background: var(--accent-soft); }

.pt-scroll { flex: 1; min-height: 0; }
.pt-tl { position: relative; padding: var(--md) var(--lg) var(--lg) 30px; }
.pt-tl::before { content: ''; position: absolute; left: 11px; top: var(--md); bottom: var(--lg); width: 2px; background: repeating-linear-gradient(var(--border) 0 4px, transparent 4px 8px); }

/* group stamp marker on the spine */
.pt-grp { position: relative; margin: 16px 0 10px; display: flex; align-items: center; gap: var(--md); }
.pt-grp::before { content: ''; position: absolute; left: -23px; width: 9px; height: 9px; border-radius: 50%; background: var(--cat, var(--accent-blue)); box-shadow: 0 0 0 3px var(--surface); }
.pt-gstamp { font-family: 'Special Elite', var(--mono-font); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--cat, var(--accent-blue)); border: 1.5px solid color-mix(in srgb, var(--cat, var(--accent-blue)) 55%, transparent); padding: 2px 8px; border-radius: 2px; background: var(--surface); transform: rotate(-.8deg); }
.pt-gmeta { font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }

/* entry */
.pt-entry { position: relative; margin-bottom: 10px; }
.pt-node { position: absolute; left: -27px; top: 6px; width: 13px; height: 13px; border-radius: 50%; background: var(--surface-elevated); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; }
.pt-node.ok { border-color: var(--graph-passed); }
.pt-node.err { border-color: var(--graph-failed); }
.pt-node.run { border-color: var(--graph-running); animation: ptP 1.6s var(--ease-out) infinite; }
.pt-node.warn { border-color: var(--accent-warning); }
@keyframes ptP { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--graph-running) 35%, transparent); } 50% { box-shadow: 0 0 0 4px transparent; } }
.pt-ln { position: absolute; left: -30px; top: 4px; font-family: var(--mono-font); font-size: 8px; color: var(--text-muted); background: var(--surface-elevated); border: 1px solid var(--border-light); border-radius: 2px; padding: 1px 3px; min-width: 18px; text-align: center; }

.pt-card { background: var(--surface-elevated); border: 1px solid var(--border-light); border-left: 2px solid var(--cat, var(--border)); border-radius: var(--radius-sm); padding: var(--md) var(--lg); cursor: default; transition: box-shadow var(--motion-fast) var(--ease-out); }
.pt-card.click { cursor: pointer; }
.pt-card.click:hover { box-shadow: var(--elev-1); }
.pt-top { display: flex; align-items: center; gap: var(--md); min-width: 0; }
.pt-stamp { flex: none; font-family: 'Special Elite', var(--mono-font); font-size: 8px; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border: 1.5px solid var(--border); border-radius: 2px; color: var(--text-secondary); transform: rotate(-.7deg); }
.pt-stamp.ok { color: var(--graph-passed); border-color: color-mix(in srgb, var(--graph-passed) 55%, transparent); }
.pt-stamp.err { color: var(--graph-failed); border-color: color-mix(in srgb, var(--graph-failed) 55%, transparent); }
.pt-stamp.warn { color: var(--accent-warning); border-color: color-mix(in srgb, var(--accent-warning) 55%, transparent); }
.pt-stamp.run { color: var(--graph-running); border-color: color-mix(in srgb, var(--graph-running) 55%, transparent); }
.pt-ttl { font-size: 11.5px; font-weight: 600; color: var(--text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pt-when { flex: none; font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); }
.pt-det { font-family: var(--mono-font); font-size: 10px; color: var(--text-secondary); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pt-det em { font-style: normal; color: var(--text-primary); background: color-mix(in srgb, var(--accent-warning) 24%, transparent); border-radius: 2px; padding: 0 2px; }
.pt-meta { font-size: 9px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pt-kv { display: flex; justify-content: space-between; gap: var(--md); font-size: 11px; padding: 2px 0; }
.pt-kv .k { color: var(--text-muted); flex: none; }
.pt-kv .v { color: var(--text-primary); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pt-act { display: flex; flex-wrap: wrap; gap: var(--sm); margin-top: var(--md); }
.pt-act .pm-btn { padding: 5px 9px; min-height: 24px; font-size: 9.5px; }
.pt-log { font-family: var(--mono-font); font-size: 9.5px; line-height: 1.55; background: color-mix(in srgb, var(--graph-failed) 6%, var(--surface)); border-radius: 2px; padding: var(--sm) var(--md); margin-top: var(--sm); }
.pt-log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pt-log .fail { color: var(--graph-failed); }
.pt-prov { display: flex; flex-wrap: wrap; gap: var(--sm); align-items: center; margin-top: var(--sm); }
.pt-prov .pm-minibtn { width: auto; padding: 0 8px; height: 22px; font-size: 9px; font-weight: 700; }
.pt-fam { font-family: var(--mono-font); font-size: 8px; padding: 1px 6px; border-radius: 2px; background: color-mix(in srgb, var(--cat, var(--accent-blue)) 14%, transparent); color: var(--cat, var(--accent-blue)); flex: none; }

.pt-qcard .pm-input { margin-bottom: var(--md); }
.pt-flags { display: flex; align-items: center; gap: var(--sm); }
.pt-flag { font-family: var(--mono-font); font-size: 10.5px; font-weight: 700; padding: 3px 8px; border: 1.5px solid var(--border-light); border-radius: 2px; color: var(--text-muted); }
.pt-flag.on { color: var(--accent-primary); border-color: var(--accent-primary); background: var(--accent-soft); }
.pt-scope .pm6-tb-menu-trigger { border: 1.5px solid var(--border-light); border-radius: 2px; margin-left: auto; padding: 3px 8px; font-family: var(--mono-font); font-size: 10px; }

.pt-graph { font-family: var(--mono-font); font-size: 10px; display: flex; flex-direction: column; gap: 4px; }
.pt-gn { display: flex; align-items: center; gap: var(--md); }
.pt-gn .dot { width: 8px; height: 8px; }
.pt-gind { padding-left: 16px; position: relative; }
.pt-gind::before { content: ''; position: absolute; left: 3px; top: -7px; width: 8px; height: 13px; border-left: 2px solid var(--border); border-bottom: 2px solid var(--border); }

.pt-chain .pt-entry { margin-bottom: 6px; }

.side-panel-slot[data-wtier="min"] .pt-tl { padding-left: 24px; }
.side-panel-slot[data-wtier="min"] .pt-tl::before { left: 8px; }
.side-panel-slot[data-wtier="min"] .pt-node { left: -21px; }
.side-panel-slot[data-wtier="min"] .pt-ln { left: -24px; }
.side-panel-slot[data-wtier="min"] .pt-grp::before { left: -17px; }
.side-panel-slot[data-wtier="min"] .pt-when,
.side-panel-slot[data-wtier="min"] .pt-meta { display: none; }
.side-panel-slot[data-wtier="min"] .pt-htitle { font-size: 10.5px; }
</style>
</head>
