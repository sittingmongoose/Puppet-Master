<style>
/* =====================================================================
   C5 — ATTENTION DECK
   A triage model: each panel leads with ONE hero = the single most
   urgent thing, then a severity-ranked deck of compact cards, with the
   calm "all clear" bulk collapsed into grouped ok-cards. Categories are
   gone; ordering is by "what needs you". A queue bar at the top gives
   the at-a-glance status budget. Context that is always needed (the
   search query, the active branch) is pinned above the deck, not a card.
   ===================================================================== */
.side-panel-view { background: var(--surface); }

.ad-head { flex: none; display: flex; align-items: center; gap: var(--md); padding: var(--lg); min-width: 0; overflow: hidden; }
.ad-hico { width: 26px; height: 26px; flex: none; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent-primary); }
.ad-hico svg { width: 14px; height: 14px; }
.ad-htitle { font-family: var(--display-font); font-size: 11px; font-weight: 700; letter-spacing: .6px; flex: 1 1 auto; min-width: max-content; white-space: nowrap; }

/* pinned context (not a card) */
.ad-ctx { flex: none; padding: 0 var(--lg) var(--md); border-bottom: 1px solid var(--border-light); display: flex; flex-direction: column; gap: var(--sm); }
.ad-flags { display: flex; align-items: center; gap: var(--sm); }
.ad-flag { font-family: var(--mono-font); font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); color: var(--text-muted); }
.ad-flag.on { color: var(--accent-primary); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent-primary) 40%, transparent); }
.ad-scope .pm6-tb-menu-trigger { border: 1px solid var(--border-light); border-radius: var(--radius-sm); margin-left: auto; padding: 4px 9px; font-family: var(--mono-font); font-size: 10px; }

.ad-scroll { flex: 1; min-height: 0; }
.ad-body { padding: var(--md) var(--lg) var(--lg); }

/* queue bar */
.ad-queue { display: flex; flex-wrap: wrap; gap: var(--sm); margin-bottom: var(--md); }
.ad-q { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: var(--radius-pill); border: 1px solid var(--border-light); color: var(--text-secondary); }
.ad-q .dot { width: 7px; height: 7px; }
.ad-q b { font-family: var(--mono-font); }

/* section eyebrows */
.ad-sec { display: flex; align-items: center; gap: var(--md); font-family: var(--display-font); font-size: 8.5px; font-weight: 700; letter-spacing: 1.4px; margin: var(--lg) 0 var(--sm); }
.ad-sec.now { color: var(--accent-error); }
.ad-sec.att { color: var(--accent-warning); }
.ad-sec.ok { color: var(--text-muted); }
.ad-sec::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }

/* hero */
.ad-hero {
  position: relative; overflow: hidden;
  border-radius: var(--radius-lg);
  background:
    radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--sev, var(--accent-error)) 16%, transparent), transparent 60%),
    var(--surface-elevated);
  border: 1px solid var(--border-light);
  border-left: 4px solid var(--sev, var(--accent-error));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--sev, var(--accent-error)) 14%, transparent), var(--elev-2);
  padding: var(--lg);
  margin-bottom: var(--md);
}
.ad-eyebrow { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display-font); font-size: 8.5px; font-weight: 700; letter-spacing: 1.4px; color: var(--sev, var(--accent-error)); margin-bottom: var(--sm); }
.ad-eyebrow .dot { width: 8px; height: 8px; }
.ad-hero-t { font-size: 14px; font-weight: 700; color: var(--text-primary); line-height: 1.25; min-width: 0; }
.ad-hero-d { font-family: var(--mono-font); font-size: 10.5px; color: var(--text-secondary); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ad-hero-m { font-size: 9.5px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ad-hero .pm-btn { margin-top: var(--md); padding: 8px 12px; }
.ad-hero-acts { display: flex; flex-wrap: wrap; gap: var(--sm); margin-top: var(--md); }
.ad-hero-acts .pm-btn { margin-top: 0; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ad-log { font-family: var(--mono-font); font-size: 9.5px; line-height: 1.55; background: color-mix(in srgb, var(--graph-failed) 6%, var(--surface)); border-radius: var(--radius-sm); padding: var(--sm) var(--md); margin-top: var(--md); }
.ad-log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ad-log .fail { color: var(--graph-failed); }

/* compact horizontal publish stepper (inside hero) */
.ad-steps { display: flex; align-items: center; gap: 0; margin-top: var(--md); }
.ad-step { display: flex; align-items: center; flex: 1; min-width: 0; }
.ad-step i { width: 18px; height: 18px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--mono-font); font-size: 9px; font-style: normal; border: 2px solid var(--border); color: var(--text-muted); background: var(--surface); }
.ad-step.done i { border-color: var(--graph-passed); color: var(--graph-passed); }
.ad-step.now i { border-color: var(--graph-running); color: var(--graph-running); animation: adP 1.6s var(--ease-out) infinite; }
@keyframes adP { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--graph-running) 35%, transparent); } 50% { box-shadow: 0 0 0 4px transparent; } }
.ad-step .ln { flex: 1; height: 2px; background: var(--border-light); margin: 0 3px; }
.ad-step.done .ln { background: color-mix(in srgb, var(--graph-passed) 50%, transparent); }
.ad-step:last-child .ln { display: none; }

/* deck cards */
.ad-card { position: relative; border-radius: var(--radius-md); background: var(--surface-elevated); border: 1px solid var(--border-light); border-left: 3px solid var(--sev, var(--border)); padding: var(--md) var(--lg); margin-bottom: var(--sm); transition: box-shadow var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.ad-card.click { cursor: pointer; }
.ad-card.click:hover { box-shadow: var(--elev-hover); transform: translateY(-1px); }
.ad-c1 { display: flex; align-items: center; gap: var(--md); min-width: 0; }
.ad-c1 .dot { width: 8px; height: 8px; flex: none; }
.ad-cttl { font-size: 11.5px; font-weight: 600; color: var(--text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ad-cmeta { font-family: var(--mono-font); font-size: 9.5px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ad-cact { display: flex; flex-wrap: wrap; gap: var(--sm); margin-top: var(--sm); }
.ad-cact .pm-btn { padding: 5px 9px; min-height: 24px; font-size: 9.5px; }

/* grouped "all clear" card with compact rows */
.ad-okcard { border-radius: var(--radius-lg); background: color-mix(in srgb, var(--graph-passed) 4%, var(--surface-elevated)); border: 1px solid color-mix(in srgb, var(--graph-passed) 14%, var(--border-light)); padding: var(--sm) var(--lg) var(--lg); margin-bottom: var(--sm); }
.ad-okcard-h { font-family: var(--display-font); font-size: 8.5px; letter-spacing: 1.2px; color: var(--text-muted); padding: var(--sm) 0 var(--sm); display: flex; align-items: center; gap: var(--md); }
.ad-okcard-h .dot { width: 7px; height: 7px; background: var(--graph-passed); border-radius: 50%; }
.ad-row { display: flex; align-items: center; gap: var(--md); padding: 5px 0; border-top: 1px solid var(--border-light); min-width: 0; }
.ad-row:first-of-type { border-top: none; }
.ad-row .dot { width: 7px; height: 7px; flex: none; border-radius: 50%; }
.ad-rmain { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.ad-rname { font-size: 11px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.ad-rmeta { font-size: 9.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ad-mono { font-family: var(--mono-font); }
.ad-chips { display: flex; flex-wrap: wrap; gap: var(--sm); margin: var(--sm) 0; }

.side-panel-slot[data-wtier="min"] .ad-hero-t { font-size: 12.5px; }
.side-panel-slot[data-wtier="min"] .ad-cmeta,
.side-panel-slot[data-wtier="min"] .ad-rmeta { display: none; }
.side-panel-slot[data-wtier="min"] .ad-body { padding: var(--sm) var(--md) var(--md); }
.side-panel-slot[data-wtier="min"] .ad-hero { padding: var(--md); }
.side-panel-slot[data-wtier="min"] .ad-htitle { font-size: 10.5px; }
</style>
<style>.side-panel-slot[data-wtier="min"] .ad-flags{flex-wrap:wrap}.side-panel-slot[data-wtier="min"] .ad-scope{margin-left:0}</style>
</head>
