<body data-concept-model="Qwen">

<script src="_shared/usage-icons.js"></script>

<script>
PMUsageChrome.boot({ badge: { id: 'U6', name: 'Workspace' } });
if (window.PMContext) window.PMContext.mountTriggers(document.getElementById('sbChips'));

(function () {
  'use strict';
  var D = window.USAGE, fmt = window.USfmt, R = window.USrender;
  function $(id) { return document.getElementById(id); }
  function prov(o) { return o ? { source: o.source_class, conf: o.source_confidence, fresh: o.projection_freshness } : null; }
  function hydrate(scope) {
    scope.querySelectorAll('i[data-ico]').forEach(function (el) {
      el.innerHTML = window.PMIcon(el.getAttribute('data-ico'), el.className);
    });
  }

  var provOrder = D.quotas.slice().sort(function (a, b) {
    var au = a.used == null ? -1 : a.used, bu = b.used == null ? -1 : b.used;
    if (au !== bu) return bu - au;
    return a.name.localeCompare(b.name);
  });
  var current = 'overview';
  var chartWin = '24h';
  var mutedSeries = {};
  var LF = { q: '', plat: '', rep: '' };
  var LSORT = { key: '', dir: 1 };

  function quotaTone(q) {
    if (q.used != null) return R.fillTone(q.used);
    var t = (window.USvs[q.vs] || { tone: 'mute' }).tone;
    return t === 'ok' || t === 'warn' || t === 'err' ? t : 'mute';
  }
  function resetText(q) {
    if (q.reset == null) return 'no reset exposed';
    if (q.reset === 'unknown') return 'unknown reset';
    return 'resets ' + q.reset + (q.resetAt ? ' · at ' + q.resetAt : '');
  }
  function quotaForLedgerProv(prov) {
    var p = String(prov).toLowerCase();
    if (p === 'claude') return 'claude';
    if (p === 'claude code') return 'claude-code';
    if (p.indexOf('codex') === 0) return p.indexOf('plus') !== -1 ? 'codex-plan' : 'codex-api';
    if (p.indexOf('copilot') === 0) return 'copilot';
    if (p.indexOf('gemini') === 0) return p.indexOf('workspace') !== -1 ? 'gemini-ws' : 'gemini';
    if (p.indexOf('antigravity') === 0) return 'antigravity';
    if (p === 'cursor') return 'cursor';
    if (p === 'opencode') return 'opencode';
    if (p.indexOf('ollama') === 0) return 'ollama';
    if (p.indexOf('windsurf') === 0) return 'windsurf';
    return null;
  }
  function accountsForQuota(q) {
    var out = [];
    D.accounts.forEach(function (a, i) {
      if (q.name.indexOf(a.prov) === 0 || q.id.indexOf(a.prov.toLowerCase()) === 0) out.push({ a: a, i: i });
    });
    return out;
  }
  function cacheForQuota(q) {
    return D.cache.filter(function (c) {
      if (c.name === q.name) return true;
      if (q.id === 'codex-plan' && c.name === 'Codex (Plus)') return true;
      if (q.id === 'copilot' && c.name === 'Copilot') return true;
      return false;
    });
  }
  function gatingForQuota(q) {
    var g = D.planGating.filter(function (x) { return x.prov === q.name; });
    return g[0] || null;
  }

  function renderStrip() {
    var gB = D.guards.filter(function (g) { return g.state === 'blocked'; }).length;
    var gW = D.guards.filter(function (g) { return g.state === 'warn'; }).length;
    var pct = Math.round(D.budget.spentMTD / D.budget.monthlyLimit * 100);
    var measured = provOrder.filter(function (q) { return q.used != null; });
    var top = measured[0], next = measured[1];
    var topTone = top ? R.fillTone(top.used) : 'mute';
    var bigColor = topTone === 'hot' ? 'var(--tone-err-text)' : (topTone === 'warn' ? 'var(--tone-warn-text)' : 'var(--accent-primary)');
    $('u6Strip').innerHTML =
      '<section class="u6-st-focal" aria-label="Top quota pressure">' +
        '<span class="u6-st-kick">' + R.ic('gauge') + 'top pressure \u00b7 ' + (top ? top.win + ' window' : '\u2014') + '</span>' +
        '<div class="u6-st-frow">' +
          '<span class="u6-st-big"' + (top ? ' data-counter="' + top.used + '" data-decimals="0"' : '') + ' style="color:' + bigColor + '">' + (top ? top.used + '%' : '\u2014') + '</span>' +
          '<span class="u6-st-fmeta">' +
            '<span class="u6-st-fname">' + (top ? top.name : '') + '</span>' +
            '<span class="u6-rbar u6-st-bar"><span class="us-fill ' + topTone + '" data-fill="' + (top ? top.used : 0) + '" style="--wf:' + (top ? top.used : 0) + '%"></span></span>' +
            '<span class="u6-st-s">resets ' + (top && top.reset !== 'unknown' ? top.reset : '\u2014') + (next ? ' \u00b7 next in queue: ' + next.name + ' at ' + next.used + '%' : '') + '</span>' +
            '<span class="u6-st-s">' + R.projChip(D.projectionMeta) + '</span>' +
          '</span>' +
        '</div>' +
      '</section>' +
      '<div class="u6-st-band">' +
        '<section class="u6-st-grp" aria-label="Cost"><span class="u6-st-gk">' + R.ic('wallet') + 'cost</span><div class="u6-st-cells">' +
          '<div class="u6-st-c prim"><span class="u6-st-v"><span data-counter="' + D.burn.perHour.toFixed(2) + '" data-prefix="$" data-decimals="2">$' + D.burn.perHour.toFixed(2) + '</span>/hr</span><span class="u6-st-s">burn rate \u00b7 $' + D.burn.perDay.toFixed(1) + '/day pace \u00b7 ' + fmt.cost(D.spend['5h']) + ' last 5h</span></div>' +
          '<div class="u6-st-c prim"><span class="u6-st-v"><span data-counter="' + D.budget.spentMTD.toFixed(2) + '" data-prefix="$" data-decimals="2">' + fmt.cost(D.budget.spentMTD) + '</span></span><span class="u6-st-s">spent MTD \u00b7 ' + pct + '% of ' + fmt.cost(D.budget.monthlyLimit) + ' \u00b7 ' + R.projChip(prov(D.budget)) + '</span></div>' +
        '</div></section>' +
        '<section class="u6-st-grp" aria-label="Signals"><span class="u6-st-gk">' + R.ic('shield') + 'signals</span><div class="u6-st-cells">' +
          '<div class="u6-st-c quiet"><span class="u6-st-v ok">' + (D.contextByRole ? '<span data-counter="' + D.contextByRole.cacheHitRate + '" data-decimals="1">' + D.contextByRole.cacheHitRate + '</span>%' : '\u2014') + '</span><span class="u6-st-s">ctx cache hit \u00b7 \u2212' + fmt.cost(D.cacheTotalSaved) + ' provider cache today</span></div>' +
          '<div class="u6-st-c quiet"><span class="u6-st-v ' + (gB ? 'err' : 'ok') + '"><span data-counter="' + gB + '" data-decimals="0">' + gB + '</span> blocked \u00b7 <span data-counter="' + gW + '" data-decimals="0">' + gW + '</span> warn</span><span class="u6-st-s">guards \u00b7 token spike paused node n-19</span></div>' +
        '</div></section>' +
      '</div>' +
      '<div class="u6-st-fresh">' +
        '<span class="us-fresh" id="u6Fresh"><span class="d"></span><span id="u6FreshTxt">' + D.projectionHealth + ' \u00b7 as of ' + D.asOf + '</span></span>' +
        '<span class="u6-st-s">next auto-refresh ' + D.nextAutoRefresh + ' \u00b7 every ' + D.refreshMin + ' min</span>' +
      '</div>';
  }

  function provRowHTML(q, i) {
    var tone = quotaTone(q);
    var hot = q.used != null && q.used >= 90;
    var warm = q.used != null && q.used >= 70 && !hot;
    var pulse = hot ? ' pulse' : '';
    var val = q.used != null ? q.used + '%' : R.chip(q.vs);
    var bar = q.used != null ? '<span class="u6-rbar"><span class="us-fill ' + tone + '" data-fill="' + q.used + '" style="--wf:' + q.used + '%"></span></span>' : '';
    var rank = '<span class="u6-rank' + (hot ? ' hot' : '') + '">' + String(i + 1).padStart(2, '0') + '</span>';
    return '<div class="u6-row' + (hot ? ' p-hot' : warm ? ' p-warn' : '') + '" data-sub="q:' + q.id + '" data-filter="' + (q.name + ' ' + q.plan).toLowerCase() + '" role="option" tabindex="-1" aria-selected="false" title="' + q.name + ' · ' + q.plan + '">' +
      '<span class="us-dot ' + tone + pulse + '"></span>' +
      '<span class="u6-row-main">' +
        '<span class="u6-row-top">' + rank + '<span class="u6-row-name">' + q.name + '</span><span class="u6-row-val">' + val + '</span></span>' +
        bar +
        '<span class="u6-row-meta">' + q.plan + ' · ' + resetText(q) + '</span>' +
      '</span></div>';
  }
  function metaRowHTML(id, ico, label, val, meta, dot, cat) {
    return '<div class="u6-row" data-sub="' + id + '" role="option" tabindex="-1" aria-selected="false" style="--cat:' + cat + '">' +
      '<span class="u6-row-ico">' + R.ic(ico) + '</span>' +
      '<span class="u6-row-main">' +
        '<span class="u6-row-top"><span class="u6-row-name">' + label + '</span><span class="u6-row-val">' + val + '</span></span>' +
        '<span class="u6-row-meta"><span class="us-dot ' + dot + '" style="width:6px;height:6px;margin-right:5px"></span>' + meta + '</span>' +
      '</span></div>';
  }

  function renderRail() {
    var gB = D.guards.filter(function (g) { return g.state === 'blocked'; }).length;
    var gW = D.guards.filter(function (g) { return g.state === 'warn'; }).length;
    var cds = D.accounts.filter(function (a) { return a.cooldownSec != null && a.cooldownSec > 0; }).length;
    var ctxPct = Math.round(D.contextBudget.totalTokens / D.contextBudget.limit * 100);
    var html = '<span class="u6-railind" aria-hidden="true"></span><div class="u6-rgroup">Pinned</div>';
    html += '<div class="u6-row" data-sub="overview" role="option" tabindex="-1" aria-selected="false" style="--cat:var(--accent-primary)">' +
      '<span class="u6-row-ico">' + R.ic('grid') + '</span>' +
      '<span class="u6-row-main">' +
        '<span class="u6-row-top"><span class="u6-row-name">Overview</span><span class="u6-row-val">' + D.quotas.length + ' providers</span></span>' +
        '<span class="u6-row-meta"><span class="us-dot ok" style="width:6px;height:6px;margin-right:5px"></span>pressure-sorted composite · as of ' + D.asOf + '</span>' +
      '</span></div>';
    html += '<div class="u6-rgroup">Providers · by pressure <span class="gc">' + D.quotas.length + '</span></div>';
    html += provOrder.map(provRowHTML).join('');
    html += '<div class="u6-rgroup">Workspace</div>';
    html += metaRowHTML('guard', 'shield', 'Guard', gB + ' blk · ' + gW + ' warn', 'token_spike paused node n-19', gB ? 'err' : 'ok', 'var(--accent-error)');
    html += metaRowHTML('budget', 'pie', 'Budget', Math.round(D.budget.spentMTD / D.budget.monthlyLimit * 100) + '% of ' + fmt.cost(D.budget.monthlyLimit), 'policy: block at limit', 'warn', 'var(--accent-lime)');
    html += metaRowHTML('cache', 'layers', 'Cache', '\u2212$' + D.cacheTotalSaved.toFixed(2), 'saved today · zero \u2260 unsupported', 'ok', 'var(--accent-lime)');
    html += metaRowHTML('tools', 'chip', 'Tools', D.tools.length + ' tools', 'p50/p95 · err · index_used', 'info', 'var(--accent-blue)');
    html += metaRowHTML('accounts', 'users', 'Accounts', D.accounts.length + ' accts', cds + ' cooling down · requested vs effective', cds ? 'warn' : 'ok', 'var(--accent-blue)');
    html += metaRowHTML('context', 'brain', 'Context', ctxPct + '% full', fmt.tok(D.contextBudget.totalTokens) + ' / ' + fmt.tok(D.contextBudget.limit) + ' tokens', ctxPct >= 90 ? 'warn' : 'info', 'var(--accent-orange)');
    html += metaRowHTML('ledger', 'clipboard', 'Ledger', '<span id="u6RailLedgerN">' + D.ledger.length + '</span> events', 'live · usage event ref per row', 'ok', 'var(--accent-lime)');
    html += metaRowHTML('coaching', 'spark', 'Coaching', 'grade ' + D.efficiency.grade, D.efficiency.score + '/100 · wins · improvements · risks', 'info', 'var(--accent-magenta)');
    $('u6RailScroll').innerHTML = html;
    hydrate($('u6RailScroll'));
    window.USrender.deText($('u6RailScroll'));
  }

  var railIndPlaced = false;
  function railIndex(id) {
    var rows = $('u6RailScroll').querySelectorAll('.u6-row');
    for (var i = 0; i < rows.length; i++) { if (rows[i].getAttribute('data-sub') === id) return i; }
    return -1;
  }
  function placeRailInd(instant) {
    var ind = $('u6RailScroll').querySelector('.u6-railind');
    var row = $('u6RailScroll').querySelector('.u6-row.active');
    if (!ind) return;
    if (!row || row.hasAttribute('hidden')) { ind.classList.remove('placed'); return; }
    if (instant) ind.style.transition = 'none';
    ind.style.transform = 'translateY(' + row.offsetTop + 'px)';
    ind.style.height = row.offsetHeight + 'px';
    if (instant) { void ind.offsetWidth; ind.style.transition = ''; }
    ind.classList.add('placed');
  }
  window.addEventListener('resize', function () { if (railIndPlaced) placeRailInd(true); });

  function select(id) {
    var prev = current;
    current = id;
    $('u6RailScroll').querySelectorAll('.u6-row').forEach(function (r) {
      var on = r.getAttribute('data-sub') === id;
      r.classList.toggle('active', on);
      r.setAttribute('aria-selected', on ? 'true' : 'false');
      r.setAttribute('tabindex', on ? '0' : '-1');
    });
    placeRailInd(!railIndPlaced);
    railIndPlaced = true;
    /* dossier swap direction follows travel through the pressure-sorted index */
    var dir = 0;
    if (prev !== id) {
      var a = railIndex(prev), b = railIndex(id);
      if (a !== -1 && b !== -1 && a !== b) dir = b > a ? 1 : -1;
    }
    renderDetail(dir);
  }

  function pan(ico, title, meta, body, cat) {
    return '<section class="u6-pan" style="--cat:' + (cat || 'var(--accent-blue)') + '">' +
      '<header class="u6-panh"><span class="u6-panico">' + R.ic(ico) + '</span><span class="u6-pant">' + title + '</span>' +
      (meta ? '<span class="u6-panm">' + meta + '</span>' : '') + '</header>' +
      '<div class="u6-panb">' + body + '</div></section>';
  }
  function dhead(ico, title, sub, acts, cat, klass, kick) {
    return '<div class="u6-dhead' + (klass ? ' ' + klass : '') + '" style="--cat:' + (cat || 'var(--accent-primary)') + '">' +
      '<span class="u6-dh-ico">' + R.ic(ico) + '</span>' +
      '<div class="u6-dh-t">' + (kick ? '<span class="u6-dh-k">' + kick + '</span>' : '') + '<h2>' + title + '</h2><span class="u6-dh-sub">' + sub + '</span></div>' +
      '<div class="u6-dh-acts">' + (acts || '') + '</div></div>';
  }
  function prioHTML(q) {
    var rank = -1;
    for (var i = 0; i < provOrder.length; i++) { if (provOrder[i].id === q.id) { rank = i + 1; break; } }
    if (rank < 1) return '';
    var hot = q.used != null && q.used >= 90;
    return '<span class="u6-prio' + (hot ? ' hot' : '') + '" title="position in the pressure-sorted queue">P' + rank + '<i>of ' + provOrder.length + ' \u00b7 by pressure</i></span>';
  }
  function sigRows(list, cls) {
    return list.map(function (s) { return '<div class="u6-sigrow ' + cls + '"><span class="sd"></span><span class="st">' + s.text + '</span></div>'; }).join('');
  }
  function donutHTML(name, pct, toneVar) {
    pct = Math.min(100, Math.max(0, pct));
    return '<span class="u6-donut"><svg viewBox="0 0 64 64" role="img" aria-label="' + name + ' at ' + pct + '%">' +
      '<circle class="dbg" cx="32" cy="32" r="26"></circle>' +
      '<circle class="dfill" cx="32" cy="32" r="26" stroke="' + toneVar + '" data-pct="' + pct + '" style="stroke-dasharray:163.4;stroke-dashoffset:163.4"></circle>' +
      '<text x="32" y="33">' + pct + '%</text></svg><small>' + name + '</small></span>';
  }
  var toneVar = { ok: 'var(--tone-ok)', warn: 'var(--tone-warn)', hot: 'var(--tone-err)' };

  function legendHTML() {
    var series = [['inp', 'Input', '--ser-inp'], ['out', 'Output', '--ser-out'], ['rea', 'Reasoning', '--ser-rea'], ['cache', 'Cache r/w', '--ser-cache']];
    return series.map(function (s) {
      return '<button type="button" data-series="' + s[0] + '" class="' + (mutedSeries[s[0]] ? 'muted' : '') + '" aria-pressed="' + String(!mutedSeries[s[0]]) + '" title="Toggle ' + s[1] + ' series"><span class="u6-swatch" style="background:var(' + s[2] + ')"></span>' + s[1] + '</button>';
    }).join('');
  }
  function winbtnsHTML() {
    return '<span class="u6-winbtns">' + ['5h', '24h', '7d'].map(function (w) {
      return '<button type="button" data-cw="' + w + '" class="' + (w === chartWin ? 'on' : '') + '">' + w + '</button>';
    }).join('') + '</span>';
  }
  function chartInnerHTML() {
    var ds = D.chart[chartWin] || D.chart['24h'];
    var sums = ds.cols.map(function (c) { return c[1] + c[2] + c[3] + c[4]; });
    var max = Math.max.apply(null, sums) || 1;
    var cols = ds.cols.map(function (c) {
      var segs = [['inp', c[1]], ['out', c[2]], ['rea', c[3]], ['cache', c[4]]].map(function (s) {
        var h = (s[1] / max * 100).toFixed(1);
        return '<i class="s-' + s[0] + '" data-h="' + h + '" style="opacity:' + (mutedSeries[s[0]] ? '.12' : '1') + '"></i>';
      }).join('');
      return '<div class="u6-col"><span class="tip"><b>' + c[0] + '</b> · in ' + c[1] + ' · out ' + c[2] + ' · rea ' + c[3] + ' · cache ' + c[4] + '</span>' +
        '<span class="u6-stack">' + segs + '</span></div>';
    }).join('');
    var gl = [25, 50, 75].map(function (p) { return '<span class="u6-gl" style="bottom:' + p + '%"></span>'; }).join('');
    return '<div class="u6-chart">' +
      '<div class="u6-plotarea">' + gl + cols + '<span class="u6-bline" style="bottom:' + D.chartBudgetLine + '%"><span>budget ' + D.budget.warningThreshold + '%</span></span></div>' +
      '<div class="u6-xrow">' + ds.cols.map(function (c) { return '<b>' + c[0] + '</b>'; }).join('') + '</div>' +
      '<div class="u6-legend">' + legendHTML() + '</div></div>';
  }
  function animateChartSegs(scope) {
    var rm = window.USrender.isRM();
    (scope || document).querySelectorAll('.u6-stack i[data-h]').forEach(function (seg, i) {
      var h = parseFloat(seg.getAttribute('data-h')) || 0;

  function refreshChart() {
    var box = $('u6ChartBox');

        '<button class="u6-btn" data-goto="guard">' + R.ic('shield') + 'Open guard</button></div>';
    }
    attn += '<div class="u6-attn-c warnv sec" data-goto="q:' + top.id + '"><span class="us-dot warn pulse"></span>' +
      '<span class="u6-attn-t"><b>' + top.name + ' at ' + top.used + '% of its ' + top.win + ' window</b><span>' + top.plan + ' · ' + resetText(top) + '</span></span>' +
      '<button class="u6-btn" data-goto="q:' + top.id + '">' + R.ic('thermo') + 'Open ' + top.name + '</button></div>';

        '<span class="nm"><span class="nmt">' + q.name + '</span>' + (q.vs !== 'measured' ? R.chip(q.vs) : '') + '</span>' +
        '<span class="us-meter">' + R.meter(q.used) + '</span>' +
        '<span class="pc">' + q.used + '%</span>' +
        '<span class="rs">' + (q.reset === 'unknown' ? 'unknown reset' : q.reset) + '</span></div>';

    var pctMTD = Math.round(D.budget.spentMTD / D.budget.monthlyLimit * 100);
    var budgetBody =
      '<div style="display:flex;gap:var(--lg);align-items:center;flex-wrap:wrap">' +
        donutHTML('Spent MTD', pctMTD, toneVar[R.fillTone(pctMTD)]) +
        '<div class="u6-kv" style="flex:1;min-width:180px">' +
          '<div class="u6-kvi"><b>Spent MTD</b><span class="us-cost">' + fmt.cost(D.budget.spentMTD) + '</span></div>' +
          '<div class="u6-kvi"><b>Projected</b><span class="us-cost">' + fmt.cost(D.budget.projectedMTD) + ' ' + R.projChip(prov(D.budget)) + '</span></div>' +
          '<div class="u6-kvi"><b>Policy</b><span>block at limit</span></div>' +
          '<div class="u6-kvi"><b>Warn at</b><span>' + D.budget.warningThreshold + '%</span></div>' +
        '</div></div>' +
      R.meterRow('MTD', pctMTD) +
      '<div><button class="u6-btn" data-goto="budget">' + R.ic('pie') + 'Open budget · presets</button></div>';

    var sigBody =
      '<div class="us-foot" style="margin-bottom:2px"><span style="font-weight:700;color:var(--tone-ok-text)">WINS</span></div>' + sigRows(D.signals.wins.slice(0, 2), 'win') +
      '<div class="us-foot" style="margin:6px 0 2px"><span style="font-weight:700;color:var(--tone-info-text)">IMPROVEMENTS</span></div>' + sigRows(D.signals.improvements.slice(0, 2), 'imp') +
      '<div class="us-foot" style="margin:6px 0 2px"><span style="font-weight:700;color:var(--tone-warn-text)">RISKS</span></div>' + sigRows(D.signals.risks.slice(0, 2), 'risk') +
      '<div><button class="u6-btn" data-goto="coaching">' + R.ic('spark') + 'Open coaching</button></div>';

    return dhead('grid', 'Overview', 'curated composite · ' + D.quotas.length + ' providers sorted by pressure · as of ' + D.asOf, R.chip('measured') + ' ' + R.conf('high') + ' ' + R.projChip(D.projectionMeta), 'var(--accent-primary)') +
      '<div class="u6-attn">' + attn + '</div>' +
      /* pairing is height-balanced so neither column strands a void on a tall
         partner: the two tall panels (quota list, signal feed) share a row and
         the two short panels (chart, budget) share the next — a composed desk,
         not two short cards floating beside two tall ones */
      '<div class="u6-duo">' +
        pan('thermo', 'Quota pressure', 'top 6 · click to drill in', qlist, 'var(--accent-orange)') +
        pan('spark', 'Signals', 'wins · improvements · risks', sigBody, 'var(--accent-magenta)') +
      '</div>' +
      '<div class="u6-duo">' +
        pan('trend', 'Token analytics', '<span id="u6ChartMeta">last 24h</span>' + winbtnsHTML(), '<div id="u6ChartBox">' + chartInnerHTML() + '</div>', 'var(--accent-magenta)') +
        pan('pie', 'Budget pulse', fmt.cost(D.budget.monthlyLimit) + ' limit', budgetBody, 'var(--accent-lime)') +
      '</div>' +
      '<div class="us-foot">' + R.ic('help') + '<span>Missing a number? Every quota carries a value-state chip — <b>disabled, not exposed, hidden, unknown</b> are states, never zero. Projections refreshed ' + D.asOfMin + 'm ago; next auto-refresh ' + D.nextAutoRefresh + '.</span></div>';
  }

  function cacheRowHTML(c) {
    if (c.state === 'unsupported') {
      return '<div class="u6-crow"><span class="u6-cname">' + c.name + '</span>' + R.chip('unsupported') +
        '<span class="u6-cnums dim">provider does not expose cache fields</span><span class="u6-cnums dim">\u2014</span><span class="u6-csave na">\u2014</span>' +
        (c.note ? '<div class="u6-cnote">' + c.note + '</div>' : '') + '</div>';
    }
    var zero = (c.save || 0) === 0;
    var note = c.zeroNote ? '<div class="u6-cnote">' + c.zeroNote + '</div>' : (c.missReason ? '<div class="u6-cnote">miss reason: ' + c.missReason + '</div>' : '');
    return '<div class="u6-crow"><span class="u6-cname">' + c.name + '</span>' + R.chip(c.state) +
      '<span class="us-meter">' + R.meter(c.hit, 'ok') + '<span class="pc">' + c.hit + '%</span></span>' +
      '<span class="u6-cnums">r ' + fmt.tok(c.cr) + ' · w ' + fmt.tok(c.cw) + '</span>' +
      '<span class="u6-csave' + (zero ? ' zero' : '') + '">' + (zero ? '$0.00' : '\u2212$' + c.save.toFixed(2)) + '</span>' + note + '</div>';
  }

  function ledgerRowHTML(r, key, fresh, withProv) {
    var main = '<tr' + (fresh ? ' class="us-new"' : '') + ' data-lrow="' + key + '">' +
      '<td><button class="u6-lcaret" data-lk="' + key + '" title="Show details" aria-label="Show details" aria-expanded="false">' + R.ic('chevR') + '</button></td>' +
      '<td class="mono">' + r.t + '</td>' +
      '<td class="ev-' + r.ev + '">' + (R.evLabel[r.ev] || r.ev) + '</td>' +
      '<td class="mono">' + r.run + ' \u00b7 ' + r.lane + '</td>' +
      (withProv ? '<td>' + r.prov + '</td>' : '') +
      '<td class="mono">' + r.model + '</td>' +
      '<td class="num">' + fmt.num(r.tin) + '</td><td class="num">' + fmt.num(r.tout) + '</td>' +
      '<td class="num">' + (r.cr == null ? '<span class="dim" title="not reported">\u2014</span>' : fmt.num(r.cr)) + '</td>' +
      '<td>' + R.chip(r.rep) + '</td>' +
      '<td class="num">' + (r.cost ? fmt.cost(r.cost) : '$0.00') + '</td></tr>';
    var kv = r.detail || {};
    var cells = Object.keys(kv).map(function (k) { return '<div class="u6-di"><b>' + window.USrender.humanCap(k) + '</b><span>' + window.USrender.human(kv[k]) + '</span></div>'; }).join('') +
      '<div class="u6-di"><b>Latency</b><span>' + r.lat + '</span></div>' +
      '<div class="u6-di"><b>Account</b><span class="mono">' + r.acct + '</span></div>';
    var det = '<tr class="u6-ldetail" data-ldetail="' + key + '" hidden><td></td><td colspan="' + (withProv ? 10 : 9) + '"><div class="u6-dgrid">' + cells + '</div>' +
      '<div class="u6-drill"><span class="u6-ref">usage event ref <b>' + (r.ref || '\u2014') + '</b></span>' +
      '<button class="u6-btn" data-demo-action="usage.drill" data-demo-arg="Open in Orchestrator \u00b7 ' + (r.ref || '') + '">' + R.ic('external') + 'Open in Orchestrator</button></div></td></tr>';
    return main + det;
  }

  function acctCardHTML(x) {
    var a = x.a;
    var markers = (a.requested ? '<span class="u6-marker req">' + R.ic('user') + 'requested</span>' : '') +
      (a.effective ? '<span class="u6-marker eff">' + R.ic('check') + 'effective</span>' : '');
    var dot = a.pressure === 'cooldown' || a.pressure === 'exhausted' ? 'err' : (a.pressure === 'approaching_threshold' ? 'warn' : 'ok');
    var cd = a.cooldownSec != null ? ' <span class="u6-cd" data-cd-idx="' + x.i + '">' + R.fmtCd(a.cooldownSec) + '</span>' : '';
    var presMap = { ok: 'measured', approaching_threshold: 'estimated', cooldown: 'blocked', exhausted: 'failed' };
    var presChip = a.pressure !== 'ok' ? R.chip(presMap[a.pressure]) : '';
    var lv = a.lastValidated ? 'validated ' + a.lastValidated + ' ago' : (a.resetAt ? 'back at ' + a.resetAt : '');
    return '<div class="u6-acc' + (a.effective ? ' effective' : '') + '">' +
      '<div class="u6-acc-h"><span class="u6-acc-name">' + a.prov + ' \u00b7 ' + a.name + '</span><span class="u6-acc-mail">' + a.mail + '</span>' + markers + '</div>' +
      '<div class="u6-acc-status"><span class="us-dot ' + dot + (dot !== 'ok' ? ' pulse' : '') + '"></span><span>' + a.status + cd + '</span><span style="margin-left:auto;flex:none">' + presChip + '</span></div>' +
      (lv ? '<div class="u6-acc-note">' + R.ic('clock') + '<span>' + lv + (a.reason ? ' · ' + a.reason : '') + '</span></div>' : '') +
      (a.note ? '<div class="u6-acc-note">' + R.ic('info') + '<span>' + a.note + '</span></div>' : '') + '</div>';
  }

  function dProvider(qid) {
    var q = D.quotas.filter(function (x) { return x.id === qid; })[0];
    if (!q) return dOverview();
    var acts = prioHTML(q) + ' ' + R.chip(q.vs) + ' ' + R.conf(q.conf);

    var qBody = '';
    if (q.used != null) {
      var t = R.fillTone(q.used);
      qBody += '<div class="u6-qbig"><span class="us-big ' + t + '">' + q.used + '%</span>' +
        '<span class="u6-qbig-r"><span class="us-bigk">' + q.win + ' window \u00b7 ' + q.kind + ' \u00b7 scope ' + q.scope + '</span>' +
        '<span class="u6-bigbar"><span class="us-fill ' + t + '" data-fill="' + q.used + '" style="--wf:' + q.used + '%"></span></span></span></div>';
      (q.windows || []).slice(1).forEach(function (w) {
        if (w.used != null) qBody += R.meterRow(w.id || w.window_kind, w.used);
      });
      if (q.premiumLeft != null) {
        var pu = Math.round((1 - q.premiumLeft / q.premiumTotal) * 100);
        qBody += R.meterRow('prem', pu, pu >= 90 ? 'hot' : 'warn');
        qBody += '<div class="us-foot">' + R.ic('info') + '<span><b>' + q.premiumLeft + ' of ' + q.premiumTotal + '</b> premium requests left this month \u2014 included models remain available after exhaustion.</span></div>';
      }
      (q.windows || []).forEach(function (w) {
        if (!w.runOutLabel) return;
        qBody += '<div class="u6-runout">' + R.ic('timer') + '<span class="ro-l">' + w.label + '</span><span title="' + w.runOutBasis + '">' + w.runOutLabel + '</span>' + R.chip(w.runOutState) + R.conf(w.runOutConf) + '</div>';
      });
    } else {
      qBody += '<div class="u6-noread">' + R.chip(q.vs) + ' ' + R.conf(q.conf) + '<span>No usable reading this cycle \u2014 this is a state, never a zero.</span></div>';
    }
    qBody += '<div class="u6-kv">' +
      '<div class="u6-kvi"><b>Window model</b><span>' + q.kind + ' \u00b7 ' + q.win + '</span></div>' +
      '<div class="u6-kvi"><b>Reset</b><span>' + resetText(q) + '</span></div>' +
      '<div class="u6-kvi"><b>Plan</b><span>' + q.plan + '</span></div>' +
      '<div class="u6-kvi"><b>Scope</b><span>' + q.scope + '</span></div></div>';
    if (q.note) qBody += '<div class="us-foot">' + R.ic('info') + '<span>' + q.note + '</span></div>';

    var cs = cacheForQuota(q);
    var cacheBody = cs.length
      ? cs.map(cacheRowHTML).join('')
      : '<div class="u6-empty">' + R.ic('layers') + '<span>No cache line reported for this provider \u2014 absent, not zero.</span></div>';

    var accts = accountsForQuota(q);
    var acctBody = accts.length
      ? accts.map(acctCardHTML).join('')
      : '<div class="u6-empty">' + R.ic('users') + '<span>No account rows are tied to this provider.</span></div>';

    var mid = pan('dial', 'Quota & window', R.chip(q.vs), qBody, 'var(--accent-blue)') +
      pan('layers', 'Prompt cache', 'zero \u2260 unsupported', cacheBody, 'var(--accent-lime)');

    var gate = gatingForQuota(q);
    var right = '';
    if (gate) {
      var gt = { ok: 'ok', included_premium_exhausted: 'warn', rate_limited: 'warn', unverified: 'mute', plan_not_included: 'err' }[gate.state] || 'mute';
      right += pan('key', 'Plan gating', gate.state.replace(/_/g, ' '),
        '<div class="u6-gate"><span class="vs vs-' + gt + '">' + gate.status + '</span><b>' + gate.status + '</b><span class="sub">' + gate.sub + (gate.extra ? ' \u00b7 ' + gate.extra : '') + '</span></div>',
        'var(--accent-orange)');
    }
    right += pan('users', 'Accounts', 'requested vs effective', acctBody, 'var(--accent-blue)');

    var rows = D.ledger.filter(function (r) { return quotaForLedgerProv(r.prov) === q.id; });
    var subtotal = rows.reduce(function (s, r) { return s + (r.cost || 0); }, 0);
    var ledgerBody;
    if (rows.length) {
      ledgerBody = '<div class="us-tblwrap" style="max-height:340px"><table class="us-tbl"><thead><tr>' +
        '<th style="width:24px" aria-label="Expand"></th><th>Time</th><th>Event</th><th>Run \u00b7 lane</th><th>Model</th>' +
        '<th class="num">In</th><th class="num">Out</th><th class="num">Cache r</th><th>Report</th><th class="num">Cost</th>' +
        '</tr></thead><tbody id="u6ProvLedgerBody">' +
        rows.map(function (r, i) { return ledgerRowHTML(r, 'p' + i, false, false); }).join('') +
        '</tbody></table></div>' +
        '<div class="u6-lsum"><span><b>' + rows.length + '</b> events in window</span><span>subtotal <b class="us-cost">' + fmt.cost(subtotal) + '</b></span><span>cost lands on the effective account</span></div>';
    } else {
      ledgerBody = '<div class="u6-empty">' + R.ic('clipboard') + '<span>No ledger events for this provider in the current window.</span></div>';
    }

    return dhead('dial', q.name, q.plan + ' \u00b7 ' + q.kind + ' window \u00b7 scope ' + q.scope + ' \u00b7 ' + resetText(q), acts, 'var(--accent-blue)', 'dossier', 'provider dossier \u00b7 ' + q.id) +
      '<div class="u6-duo eq">' + mid + '</div>' +
      '<div class="u6-duo eq">' + right + '</div>' +
      pan('clipboard', 'Event ledger', 'filtered to ' + q.name, ledgerBody, 'var(--accent-lime)') +
      '<div class="us-foot">' + R.ic('help') + '<span>Every reading carries a value-state chip and source confidence \u2014 <b>' + q.name + '</b> is shown exactly as reported; missing is never rendered as zero.</span></div>';
  }

  function guardCardHTML(g) {
    var cls = g.state === 'blocked' ? 'blocked' : (g.state === 'warn' ? 'warn' : 'ok');
    var stChip = { blocked: 'blocked', warn: 'estimated', allowed: 'measured', watch: 'unknown' }[g.state] || 'unknown';
    var why = '<div class="u6-why"><button type="button" class="u6-why-t" aria-expanded="false"><span class="car">' + R.ic('chevR') + '</span>Why was this ' + g.state + '?</button>' +

        '<button class="u6-btn" data-demo-action="usage.anomaly_allow" data-demo-arg="Allow once: ' + g.kind + '">It was expected \u2014 allow once</button></div>'
      : '';

      '<div class="u6-guard-body">' + g.body + '</div>' +

        pan('sliders', 'Warning threshold', 'presets exactly 50 / 80 / 90 / 95 / 100', presetRowHTML() + '<div class="us-foot">' + R.ic('info') + '<span>Policy is <b>' + D.budget.policy.replace(/_/g, ' ') + '</b>. A budget does not cap spend by itself \u2014 the policy decides what happens at the limit.</span></div>', 'var(--accent-blue)') +

  /* top sections cascade in behind the swap; deeper sections become scroll
     reveals (.pm-rev) — the dossier is long and the reveal belongs to the reader */
  function stageSections(el, rm) {
    var stag = 24;
    try { var t = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--mo-stagger')); if (isFinite(t) && t > 0) stag = t; } catch (e) {}
    Array.prototype.forEach.call(el.children, function (kid, i) {
      if (i >= 3) { kid.classList.add('pm-rev'); return; }
      if (!rm) { kid.classList.add('u6-sec-in'); kid.style.animationDelay = (i * stag) + 'ms'; }
    });
  }

  function renderDetail(dir) {
    var el = $('u6DetailBody');
    var html;
    if (current.indexOf('q:') === 0) html = dProvider(current.slice(2));
    else html = (BUILDERS[current] || dOverview)();
    var sc = $('u6Detail');
    var rm = R.isRM();
    /* lift a ghost of the outgoing dossier so it can drift away over the incoming one */
    var ghost = null;
    if (dir && !rm) {
      ghost = el.cloneNode(true);
      ghost.removeAttribute('id');
      ghost.querySelectorAll('[id]').forEach(function (n) { n.removeAttribute('id'); });
      ghost.querySelectorAll('.u6-sec-in').forEach(function (n) { n.classList.remove('u6-sec-in'); n.style.animationDelay = ''; });
      ghost.classList.remove('u6-in-up', 'u6-in-down');
      ghost.classList.add('u6-swap-ghost', dir > 0 ? 'u6-out-up' : 'u6-out-down');
      ghost.setAttribute('aria-hidden', 'true');
      ghost.style.left = el.offsetLeft + 'px';
      ghost.style.top = el.offsetTop + 'px';
      ghost.style.width = el.offsetWidth + 'px';
    }
    el.innerHTML = html;
    hydrate(el);
    window.USrender.deText(el);
    if (current === 'ledger') wireLedgerPane();
    if (window.PMUsageShell) window.PMUsageShell.wireDemoActions(el);
    sc.scrollTop = 0;
    if (ghost) {
      sc.appendChild(ghost);
      ghost.addEventListener('animationend', function () { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); });
      setTimeout(function () { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 1200);
    }
    el.classList.remove('u6-in-up', 'u6-in-down');
    if (dir && !rm) {

      el.classList.add(dir > 0 ? 'u6-in-down' : 'u6-in-up');

    var next = null;
    if (ev.key === 'ArrowDown') next = Math.min(idx + 1, rows.length - 1);
    else if (ev.key === 'ArrowUp') next = Math.max(idx - 1, 0);
    else if (ev.key === 'Home') next = 0;
    else if (ev.key === 'End') next = rows.length - 1;
    else if ((ev.key === 'Enter' || ev.key === ' ') && idx !== -1) { ev.preventDefault(); select(rows[idx].getAttribute('data-sub')); return; }

        if (c) c.textContent = tb.querySelectorAll('[data-lrow]').length + ' of ' + D.ledger.length + ' events';
      }
    } else if (current.indexOf('q:') === 0 && quotaForLedgerProv(r.prov) === current.slice(2)) {
      var pb = $('u6ProvLedgerBody');
      if (pb) pb.insertAdjacentHTML('afterbegin', ledgerRowHTML(r, key, true, false));
    }
  }, 9000);

  setInterval(function () {
    if (document.visibilityState !== 'visible') return;
    D.accounts.forEach(function (a, i) {
      if (a.cooldownSec != null && a.cooldownSec > 0) {
        a.cooldownSec--;
        document.querySelectorAll('[data-cd-idx="' + i + '"]').forEach(function (el) { el.textContent = R.fmtCd(a.cooldownSec); });
      }
    });
  }, 1000);

  renderRail();
  renderStrip();
  requestAnimationFrame(function () { R.animateFills($('u6Strip')); R.animateCounters($('u6Strip')); R.animateFills($('u6RailScroll')); });
  select('overview');
})();
</script>
