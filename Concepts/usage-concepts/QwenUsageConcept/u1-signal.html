<script>
PMUsageChrome.boot({ badge: { id: 'U1', name: 'Signal' } });

(function () {
  'use strict';
  var D = window.USAGE, fmt = window.USfmt, R = window.USrender;
  function $(id) { return document.getElementById(id); }
  function rewire() { if (window.PMUsageShell && window.PMUsageShell.wireDemoActions) window.PMUsageShell.wireDemoActions(document); }

  function whyHTML(g, i, prefix) {
    return '<div class="u1-why" data-why="' + prefix + i + '"><div class="u1-why-t"><span class="car">' + R.ic('chevR') + '</span>Why was this ' + g.state + '?</div>' +
      '<div class="u1-why-b"><div class="u1-dgrid">' + g.why.map(function (kv) { return '<div class="u1-di"><b>' + kv[0] + '</b><span>' + kv[1] + '</span></div>'; }).join('') + '</div></div></div>';
  }
  function wireWhy(scope) {
    (scope || document).querySelectorAll('.u1-why-t').forEach(function (t) {
      if (t._wired) return; t._wired = true;
      t.addEventListener('click', function () { t.parentElement.classList.toggle('open'); });
    });
  }
  function pickStat(g, keys) {
    for (var i = 0; i < keys.length; i++) {
      for (var j = 0; j < g.why.length; j++) { if (g.why[j][0] === keys[i]) return g.why[j]; }
    }
    return g.why[0];
  }
  function altQuota(exclId) {
    var c = D.quotas.filter(function (q) { return q.used != null && q.vs === 'measured' && q.id !== exclId; })
      .sort(function (a, b) { return a.used - b.used; })[0];
    return c || null;
  }
  function routeBtn(label, arg) {
    return '<button class="u1-btn" data-demo-action="usage.route" data-demo-arg="' + arg + '">' + R.ic('swap') + label + '</button>';
  }

  /* ---------------- triage model: merge guards + quotas + accounts, rank by severity ---------------- */
  function buildItems() {
    var items = [];
    D.guards.forEach(function (g, i) {
      var sevW = { high: 3, medium: 2, low: 1 }[g.severity] || 1;
      var it = { type: 'guard', g: g, gi: i, title: g.title, sum: g.body, where: g.where + ' · ' + g.t };
      if (g.state === 'blocked') { it.rank = 0; it.tone = 'err'; it.tag = 'BLOCKED'; it.v = 100 + sevW; it.chip = R.chip('blocked'); }
      else if (g.state === 'warn') { it.rank = 1; it.tone = 'warn'; it.tag = 'WARN'; it.v = 60 + sevW; it.chip = R.chip('estimated'); }
      else if (g.state === 'watch') { it.rank = 2; it.tone = 'info'; it.tag = 'WATCH'; it.v = 46 + sevW; it.chip = R.chip('local_estimated'); }
      else { it.rank = 2; it.tone = 'mute'; it.tag = 'ALLOWED'; it.v = 40 + sevW; it.chip = R.chip('measured'); }
      items.push(it);
    });
    D.quotas.forEach(function (q) {
      if (q.used == null || q.used < 70) return;
      var it = { type: 'quota', q: q, title: q.name + ' — ' + q.used + '% of its ' + q.win + ' window used', sum: q.note || (q.plan + ' · ' + q.kind), where: q.plan + ' · ' + q.kind + ' · ' + q.win + ' window · resets ' + (q.reset || 'unknown') };
      if (q.used >= 90) { it.rank = 0; it.tone = 'err'; it.tag = q.used + '% WINDOW'; it.v = q.used; }
      else { it.rank = 1; it.tone = 'warn'; it.tag = q.used + '% WINDOW'; it.v = q.used; }
      it.chip = R.chip(q.vs);
      items.push(it);
    });
    D.accounts.forEach(function (a, i) {
      if (a.pressure === 'ok') return;
      var it = { type: 'acct', a: a, ai: i, title: a.prov + ' · ' + a.name + ' — ' + a.pressure.replace(/_/g, ' '), sum: a.status, where: a.mail + (a.lastValidated ? ' · validated ' + a.lastValidated + ' ago' : '') };
      if (a.pressure === 'exhausted') { it.rank = 0; it.tone = 'err'; it.tag = 'EXHAUSTED'; it.v = 95; it.chip = R.chip('failed'); }
      else if (a.pressure === 'cooldown') { it.rank = 1; it.tone = 'warn'; it.tag = 'COOLDOWN'; it.v = 84; it.chip = R.chip('blocked'); }
      else { it.rank = 1; it.tone = 'warn'; it.tag = 'APPROACHING'; it.v = 88; it.chip = R.chip('estimated'); }
      items.push(it);
    });
    items.sort(function (x, y) { return x.rank - y.rank || y.v - x.v; });
    return items;
  }
  function sideHTML(it) {
    if (it.type === 'quota') {
      var q = it.q;
      return '<span class="u1-sidetxt">' + R.ic('timer') + ' resets ' + (q.reset === 'unknown' || !q.reset ? 'unknown' : q.reset) + '</span>';
    }
    if (it.type === 'acct') {
      var a = it.a;
      var cd = a.cooldownSec != null ? '<span class="u1-sidetxt"><span class="u1-cd" data-cd-idx="' + it.ai + '">' + R.fmtCd(a.cooldownSec) + '</span></span>' : '';
      var extra = a.pressure === 'approaching_threshold' ? '<span class="u1-sidetxt">' + (D.quotas.filter(function (q) { return q.id === 'copilot'; })[0] || {}).premiumLeft + ' premium left</span>' : '';
      return cd + extra + '<span class="u1-sidetxt">' + (a.resetAt ? 'back at ' + a.resetAt : (a.lastValidated ? 'validated ' + a.lastValidated + ' ago' : '')) + '</span>';
    }
    var st = pickStat(it.g, ['Observed', 'Cost avoided', 'Hit rate', 'Confidence']);
    return '<span class="u1-sidetxt" style="font-weight:700;color:var(--text-primary)">' + st[1] + '</span><span class="u1-sidetxt">' + st[0] + '</span>';
  }
  function actsHTML(it) {
    if (it.type === 'guard') {
      var g = it.g;
      if (g.state === 'blocked') {
        return '<button class="u1-btn primary" data-demo-action="usage.anomaly_keep" data-demo-arg="Keep blocking ' + g.kind + ' on node n-19">' + R.ic('shieldCk') + 'Looks right — keep blocking</button>' +
          '<button class="u1-btn" data-demo-action="usage.anomaly_allow" data-demo-arg="Allow once: ' + g.kind + '">' + R.ic('play') + 'It was expected — allow once</button>';
      }
      if (g.state === 'warn') return '<button class="u1-btn" data-demo-action="usage.cache_stabilize" data-demo-arg="Stabilize system-prompt prefix order on lane-c-frontend">' + R.ic('pin') + 'Stabilize prefix order</button>';
      if (g.state === 'watch') return '<button class="u1-btn" data-demo-action="usage.guard_ack" data-demo-arg="Acknowledged: ' + g.kind + ' estimator active">' + R.ic('check') + 'Acknowledge</button>';
      return '<span class="u1-noact">no action needed — below the 3.0× limit</span>';
    }
    if (it.type === 'acct') {
      var a = it.a;
      if (a.pressure === 'cooldown') {
        var sib = D.accounts.filter(function (x) { return x.prov === a.prov && x.pressure === 'ok'; })[0];
        return routeBtn(sib ? 'Route to ' + sib.name : 'Route ' + a.prov + ' work elsewhere', 'Route ' + a.prov + ' work to ' + (sib ? sib.name : 'another account') + ' until ' + (a.resetAt || 'cooldown ends'));
      }
      var alt = altQuota('copilot');
      return routeBtn('Route new work to ' + (alt ? alt.name : 'another provider'), 'Route new ' + a.prov + ' work to ' + (alt ? alt.name : 'another provider') + ' (premium requests nearly exhausted)');
    }
    var q = it.q, alt2 = altQuota(q.id);
    return routeBtn('Route to ' + (alt2 ? alt2.name : 'another provider'), 'Route new ' + q.name + ' work to ' + (alt2 ? alt2.name + ' (' + alt2.used + '% used)' : 'another provider'));
  }

  /* ---------------- status line ---------------- */
  function renderBand(items) {
    var act = items.filter(function (i) { return i.rank === 0; }).length;
    var press = items.filter(function (i) { return i.rank === 1; }).length;
    var watch = items.filter(function (i) { return i.rank === 2; }).length;
    var calm = D.quotas.filter(function (q) { return q.used != null && q.used < 70; }).length;
    var unread = D.quotas.filter(function (q) { return q.used == null; }).length;
    $('u1Band').classList.toggle('calm', act === 0);
    $('u1Kick').textContent = 'SITUATION · AS OF ' + D.asOf + ' · NEXT AUTO-REFRESH ' + D.nextAutoRefresh;
    var parts = [];
    var blockedG = D.guards.filter(function (g) { return g.state === 'blocked'; }).length;
    if (blockedG) parts.push('<b class="hot">' + blockedG + ' guard blocking spend</b>');
    var hot = D.quotas.filter(function (q) { return q.used != null && q.used >= 90; }).length;
    if (hot) parts.push('<b class="hot">' + hot + ' provider past 90% of its window</b>');
    var ap = D.accounts.filter(function (a) { return a.pressure !== 'ok'; }).length;
    if (ap) parts.push('<b class="warm">' + ap + ' accounts under pressure</b>');
    var warmQ = D.quotas.filter(function (q) { return q.used != null && q.used >= 70 && q.used < 90; }).length;
    if (warmQ) parts.push('<b class="warm">' + warmQ + ' quota crossing its window</b>');
    $('u1Sit').innerHTML = parts.length
      ? parts.join(' · ') + ' <span class="quiet">— ' + calm + ' providers calm, ' + unread + ' unreadable-by-design.</span>'
      : 'All quiet — no guards, no pressure, every readable provider inside its window.';
    var ticks = [
      { n: act, l: 'needs action', t: 'var(--tone-err)' },
      { n: press, l: 'pressure', t: 'var(--tone-warn)' },
      { n: watch, l: 'watch', t: 'var(--tone-info)' },
      { n: calm, l: 'calm', t: 'var(--tone-ok)' },
      { n: unread, l: 'unreadable', t: 'var(--tone-mute)' }
    ];
    $('u1Tally').innerHTML = ticks.map(function (k) {
      return '<span class="u1-tick" style="--tc:' + k.t + '" title="' + k.n + ' ' + k.l + '"><span class="n">' + k.n + '</span><span class="l">' + k.l + '</span></span>';
    }).join('');
    $('u1SpendBig').dataset.counter = D.spend['5h'];
    $('u1SpendLbl').innerHTML = 'spend · last 5h ' + R.chip('pricing_estimated') + ' <span style="color:var(--text-muted)">list-rate basis — may differ from your bill</span>';
    var cp = D.quotas.filter(function (q) { return q.id === 'copilot'; })[0];
    var reads = [
      { ico: 'bolt', k: 'burn', v: '$' + D.burn.perHour.toFixed(2) + '<small>/hr</small>', s: '$' + D.burn.perDay.toFixed(2) + '/day pace', cls: '' },
      { ico: 'trend', k: 'month pace', v: fmt.cost(D.forecast.monthPace), s: '+' + D.forecast.monthPaceDelta + '% vs last mo', cls: 'warn' },
      { ico: 'layers', k: 'cache saved', v: '\u2212$' + D.cacheTotalSaved.toFixed(2), s: 'today · provider caches', cls: 'ok' },
      { ico: 'hourglass', k: 'block end', v: fmt.cost(D.forecast.blockProjection), s: 'projected at 5h mark', cls: '' },
      { ico: 'thermo', k: 'top window', v: (cp ? cp.used + '%' : '\u2014'), s: cp ? cp.name : '', cls: cp && cp.used >= 90 ? 'err' : 'warn' }
    ];
    $('u1Reads').innerHTML = reads.map(function (r) {
      return '<div class="u1-read"><span class="k">' + R.ic(r.ico) + r.k + '</span><span class="v ' + r.cls + '">' + r.v + ' <small>' + r.s + '</small></span></div>';
    }).join('');
  }

  /* ---------------- NOW hero + severity deck ---------------- */
  function nowHTML(it) {
    var cls = it.tone === 'err' ? '' : (it.tone === 'warn' ? ' warn' : ' info');
    var stats = it.type === 'guard'
      ? [pickStat(it.g, ['Observed', 'Hit rate', 'Confidence']), pickStat(it.g, ['Cost avoided', 'Decision', 'Suggestion'])]
      : it.type === 'quota'
        ? [[it.q.used + '%', it.q.win + ' window used'], [it.q.sevenUsed != null ? it.q.sevenUsed + '%' : '\u2014', '7-day window']]
        : [[it.a.pressure === 'cooldown' && it.a.cooldownSec != null ? R.fmtCd(it.a.cooldownSec) : '\u2014', it.a.pressure === 'cooldown' ? 'cooldown remaining' : 'pressure state'], [it.a.resetAt || '\u2014', it.a.resetAt ? 'back at' : 'no reset time']];
    return '<section class="u1-now' + cls + '" aria-label="Most urgent item">' +
      '<div style="min-width:0">' +
        '<div class="u1-nowkick"><span class="us-dot ' + (it.tone === 'mute' ? 'info' : it.tone) + ' pulse"></span><span class="u1-sevtag ' + it.tone + '">' + it.tag + '</span><span>' + (it.type === 'guard' ? 'anomaly guard · ' + it.g.kind : it.type === 'quota' ? 'quota · ' + it.q.plan : 'account · ' + it.a.prov) + '</span></div>' +
        '<h2 class="u1-nowtitle">' + it.title + '</h2>' +
        '<div class="u1-nowbody">' + it.sum + '</div>' +
        '<div class="u1-nowwhere">' + it.where + '</div>' +
        (it.type === 'guard' ? whyHTML(it.g, 99, 'now') : '') +
        '<div class="u1-nowacts">' + actsHTML(it) + '</div>' +
      '</div>' +
      '<div class="u1-nowstats">' + stats.map(function (s) { return '<span class="u1-nstat"><b>' + s[0] + '</b><span>' + s[1] + '</span></span>'; }).join('') +
      '</div></section>';
  }
  function cardHTML(it, i) {
    var meters = it.type === 'quota'
      ? '<div class="u1-c-meters">' + R.meterRow('5h', it.q.used) + (it.q.sevenUsed != null ? R.meterRow('7d', it.q.sevenUsed) : '') + '</div>'
      : '';
    return '<article class="u1-card" style="--sev:var(--tone-' + it.tone + ')">' +
      '<span class="u1-rank">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<div class="u1-c-main">' +
        '<div class="u1-c-kick"><span class="u1-sevtag ' + it.tone + '">' + it.tag + '</span><span>' + (it.type === 'guard' ? 'guard · ' + it.g.t : it.type === 'quota' ? 'quota · ' + it.q.kind + ' · ' + it.q.win : 'account · ' + it.a.prov) + '</span>' + (it.type === 'quota' ? R.conf(it.q.conf) : '') + it.chip + '</div>' +
        '<div class="u1-c-title">' + it.title + '</div>' +
        '<div class="u1-c-sum">' + it.sum + '</div>' +
      '</div>' +
      '<div class="u1-c-meta">' + sideHTML(it) + '</div>' +
      meters +
      (it.type === 'guard' ? '<div class="u1-c-span">' + whyHTML(it.g, i, 'c') + '</div>' : '') +
      '<div class="u1-c-act">' + actsHTML(it) + '</div>' +
    '</article>';
  }
  function renderTriage() {
    var items = buildItems();
    var now = items[0], deck = items.slice(1);
    renderBand(items);
    $('u1NowMeta').textContent = now ? (now.type === 'guard' ? 'an anomaly guard needs your call' : now.type === 'quota' ? 'a provider window is nearly spent' : 'an account needs relief') : 'nothing urgent';
    $('u1Now').innerHTML = now ? nowHTML(now) : '<section class="u1-now info"><div><div class="u1-nowkick"><span class="us-dot ok"></span><span class="u1-sevtag" style="color:var(--tone-ok-text);background:color-mix(in srgb,var(--tone-ok) 14%, transparent)">ALL CLEAR</span></div><h2 class="u1-nowtitle">Nothing needs you right now</h2><div class="u1-nowbody">No guard is blocking, no provider is past its window, and every account is inside its thresholds. The deck below is empty — the reference shelves further down tell the full story.</div></div></section>';
    $('u1DeckCount').textContent = deck.length + ' queued';

      '<div class="row"><span class="k">Retention</span><span class="v">' + D.retentionDays + ' days</span></div>' +
      '<div class="row"><span class="k">Spend basis</span><span class="v">' + D.spendBasis + ' ' + R.chip('pricing_estimated') + '</span></div>' +
      '<div class="row"><span class="k">Guard window</span><span class="v">' + D.guardConfig.windowMin + ' min · ' + D.guardConfig.spikeRatio + '\u00d7 spike</span></div>';
    $('u1WC').innerHTML = D.whatCounts.map(function (w) {
      var a = w.counts === true ? '<span class="a yes">COUNTS</span>' : w.counts === false ? '<span class="a no">DOESN\u2019T</span>' : '<span class="a part">PARTIAL</span>';
      return '<div class="us-wc"><span class="q">' + w.q + (w.note ? ' <span style="color:var(--text-muted)">— ' + w.note + '</span>' : '') + '</span>' + a + '</div>';
    }).join('');
    $('u1Attr').innerHTML = D.attribution.map(function (at) {
      return '<div class="u1-attr"><span class="nm" title="' + at.name + '">' + at.name + '</span>' +
        '<span class="us-track"><span class="us-fill info" data-fill="' + at.pct + '" style="--wf:' + at.pct + '%"></span></span>' +
        '<span class="pc">' + at.pct + '%</span></div>';
    }).join('');
    $('u1BasisNote').innerHTML = 'Attribution by orchestrator entity (Claude Code /usage pattern). List-rate pricing is an estimate — the provider console remains the billing source of truth.';
  }

  /* ---------------- refresh + boot ---------------- */
  $('u1FreshTxt').textContent = D.projectionHealth + ' · as of ' + D.asOf;
  $('u1Refresh').addEventListener('click', function () {
    var b = this; b.classList.add('spinning');
    $('u1FreshTxt').textContent = 'refreshing\u2026';
    $('u1Fresh').classList.add('stale');
    setTimeout(function () {
      b.classList.remove('spinning');
      $('u1Fresh').classList.remove('stale');
      $('u1FreshTxt').textContent = D.projectionHealth + ' · as of ' + D.asOf;
      renderAll();
      if (window.toast) window.toast('Usage projections refreshed (demo)');
    }, 900);
  });

  function renderAll() {
    renderTriage();
    renderClear();
    renderCoach();
    renderChartWin();
    renderChart();
    renderBudget();
    renderCache();
    renderContext();
    renderTools();
    renderAccounts();
    renderLedger();
    renderProv();
    R.animateCounters(document);
    R.animateFills(document);
  }
  buildLedgerMenus();
  renderAll();
})();
</script>
</body>
</html>
