.u11-sheet-links { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; border-top: 1px solid var(--border-light); }

.u11-exp-intents { display: flex; flex-direction: column; gap: 6px; }

.u11-exp-fmts { display: flex; gap: 5px; flex-wrap: wrap; }

  transition: all var(--motion-fast) var(--ease-out); }
.u11-exp-fmt:hover { color: var(--text-primary); border-color: var(--border); }
.u11-exp-fmt.on { color: var(--accent-primary); background: var(--accent-soft); border-color: var(--accent-primary); }
.u11-exp-fmt.adv { opacity: .6; }
.u11-exp-go { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 8px; border-radius: var(--radius-md);
  border: none; background: var(--accent-primary); color: var(--surface-elevated); cursor: pointer;

          <button class="u11-item u11-sub" data-tab="tools"><span class="u11-iico"><i data-ico="chip" class="pm-ico sm"></i></span><span class="u11-itxt"><span class="u11-ilbl"><span class="u11-ilbl-t">Tools</span><span class="u11-dot" data-dot="tools"></span></span><span class="u11-imeta" data-meta="tools"></span></span></button>
          <button class="u11-item u11-sub" data-tab="signals"><span class="u11-iico"><i data-ico="spark" class="pm-ico sm"></i></span><span class="u11-itxt"><span class="u11-ilbl"><span class="u11-ilbl-t">Signals</span><span class="u11-dot" data-dot="signals"></span></span><span class="u11-imeta" data-meta="signals"></span></span></button>

      <div class="u11-panes">

        <section class="u11-pane" data-pane="overview" aria-label="Overview">
          <header class="u11-kick">
            <b class="u11-kn">01</b>
            <div class="u11-kmain"><h2 class="u11-kt">Right now</h2>
              <p class="u11-kd">The short version — plans under pressure, what happens next, and the money this month. Every room below is composed of widgets you can move, resize, configure and re-scope.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="u11-kpis" id="u11Kpis" aria-label="Key figures"></div>
          <div class="uw-canvas" data-u11-page="u11-overview" data-u11-types="capacity,plans,costs,attention,context,accounts"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="plans" aria-label="Plans and limits">
          <header class="u11-kick">
            <b class="u11-kn">02</b>
            <div class="u11-kmain"><h2 class="u11-kt">Plans &amp; limits</h2>
              <p class="u11-kd">Included allowances and extra capacity per product — each with a plain-language <b>what happens next</b>. Unknown limits say so; they never render as zero.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-plans" data-u11-types="plans,capacity,authority"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="costs" aria-label="Costs">
          <header class="u11-kick">
            <b class="u11-kn">03</b>
            <div class="u11-kmain"><h2 class="u11-kt">Costs &amp; spending</h2>
              <p class="u11-kd">What this month has cost so far — API-billed vs plan-included against one cost authority. The spending limit is yours; it is not a plan allowance.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-costs" data-u11-types="costs,analytics"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="accounts" aria-label="Accounts">
          <header class="u11-kick">
            <b class="u11-kn">04</b>
            <div class="u11-kmain"><h2 class="u11-kt">Accounts &amp; connections</h2>
              <p class="u11-kd">Configured accounts grouped by provider. Requested is what you chose; used is what served it — mismatches surface only when they matter. CLI-owned profiles stay distinct from API routes.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-accounts" data-u11-types="accounts,authority"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="free" aria-label="Free models">
          <header class="u11-kick">
            <b class="u11-kn">05</b>
            <div class="u11-kmain"><h2 class="u11-kt">Free models</h2>
              <p class="u11-kd">A catalog &amp; routing lens over the free routes you actually set up — not a provider, not a billing identity. Unconfigured upstream providers never appear here.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-free" data-u11-types="free,authority"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="context" aria-label="Context">
          <header class="u11-kick">
            <b class="u11-kn">06</b>
            <div class="u11-kmain"><h2 class="u11-kt">Context &amp; cache</h2>
              <p class="u11-kd">What is eating the current effective window, and how well the cache serves it. The ring in the status bar opens the compact module; <b>More details</b> opens the full inspector.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-context" data-u11-types="context,cache"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="analytics" aria-label="Analytics">
          <header class="u11-kick">
            <b class="u11-kn">07</b>
            <div class="u11-kmain"><h2 class="u11-kt">Token analytics</h2>
              <p class="u11-kd">Input, output, reasoning and cache-read traffic stacked across 5h / 24h / 7d. Click a legend entry to mute its series.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-analytics" data-u11-types="analytics,costs"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="ledger" aria-label="Ledger">
          <header class="u11-kick">
            <b class="u11-kn">08</b>
            <div class="u11-kmain"><h2 class="u11-kt">Ledger</h2>
              <p class="u11-kd">One immutable event per real provider attempt, grouped under the logical work you asked for. Failed, interrupted and queued attempts stay in history; removed accounts keep their identity but leave the picker.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-ledger" data-u11-types="ledger,runs,operations"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="attention" aria-label="Attention">
          <header class="u11-kick">
            <b class="u11-kn">09</b>
            <div class="u11-kmain"><h2 class="u11-kt">Attention</h2>
              <p class="u11-kd">Anomaly &amp; quota guard decisions — blocked, warned, allowed, watching — each carrying its why.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-attention" data-u11-types="attention"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="cache" aria-label="Prompt cache">
          <header class="u11-kick">
            <b class="u11-kn">10</b>
            <div class="u11-kmain"><h2 class="u11-kt">Prompt cache</h2>
              <p class="u11-kd">Per-connection prompt-cache hit and savings. Zero is a measurement; unsupported is a capability — they are never rendered the same way.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-cache" data-u11-types="cache"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="tools" aria-label="Tools">
          <header class="u11-kick">
            <b class="u11-kn">11</b>
            <div class="u11-kmain"><h2 class="u11-kt">Tool usage</h2>
              <p class="u11-kd">Latency and error tax by tool over the last 24h. Self-recovering tools are counted once — never as duplicate user work.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-tools" data-u11-types="tools"></div>
        </section>

            <b class="u11-kn">12</b>
            <div class="u11-kmain"><h2 class="u11-kt">Signals &amp; efficiency</h2>
              <p class="u11-kd">Wins, improvements and risks — the number you see is the number you trust.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-signals" data-u11-types="signals"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="authority" aria-label="Source authority">
          <header class="u11-kick">
            <b class="u11-kn">13</b>
            <div class="u11-kmain"><h2 class="u11-kt">Source authority</h2>
              <p class="u11-kd">The advanced layer — provenance, settlement, freshness and route evidence. Raw IDs and receipts live here, never in Essentials.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-authority" data-u11-types="authority"></div>
        </section>

      </div>
    </div>
  </div>
</template>

<div class="u11-pop-scrim" id="u11PopScrim" aria-hidden="true"></div>
<aside class="u11-pop" id="u11Pop" role="dialog" aria-label="Choose the scope">
  <div class="u11-pop-head">
    <span class="u11-pop-ico"><i data-ico="filter"></i></span>
    <div class="u11-pop-t">
      <span class="u11-pop-tt">Scope</span>
      <span class="u11-pop-td">Choose what the numbers are made of — provider family, account, connection, product, meter, or a comparison set. Same-provider accounts stay grouped; joins are stable IDs, never display names.</span>
    </div>
    <button type="button" class="u11-pop-x" id="u11PopX" title="Close" aria-label="Close scope picker"><i data-ico="x"></i></button>
  </div>
  <div class="u11-pop-list" id="u11PopList" role="listbox" aria-label="Scopes"></div>
  <div class="u11-pop-foot" id="u11PopFoot"></div>
</aside>

<div class="pm-sprout uw-sprout" id="u11SheetSprout" role="dialog" aria-label="Usage settings" hidden></div>
<div class="pm-sprout uw-sprout" id="u11ExportSprout" role="dialog" aria-label="Export usage" hidden></div>

<script src="_shared/icons.js"></script>
<script src="_shared/usage-icons.js"></script>
<script src="u11-icons.js?v=20260813a"></script>

<script src="_shared/usage-data.js"></script>
<script src="u11-time.js?v=20260813a"></script>
<script src="u11-data.js?v=20260813a"></script>
<script src="_shared/usage-chrome.js"></script>
<script src="_shared/usage-widgets.js"></script>
<script src="u11-widgets.js?v=20260813a"></script>
<script src="u11-rundetail.js?v=20260813a"></script>
<script src="u11-context.js?v=20260813a"></script>
<script>
(function () {
  'use strict';

  var D = window.U11, T = window.U11time;
  var fmt = window.USfmt, R = window.USrender;
  function $(id) { return document.getElementById(id); }
  function ic(n) { return R.ic(n); }
  function reduced() { return R.isRM(); }

  /* ---------- persisted U11 state (filename-independent keys) ---------- */
  var STORE = {
    get: function (k, fb) { try { var v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); } catch (e) { return fb; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var disclosure = STORE.get('u11:disclosure', 'essentials');
  if (['essentials', 'standard', 'advanced'].indexOf(disclosure) === -1) disclosure = 'essentials';
  window.U11W.disclosure = disclosure;

  /* scope fallback: if a persisted scope id vanished, fall back safely (§15.4) */
  var savedScope = STORE.get('u11:scope', 'scope:all');
  function scopeExists(id) {
    if (id === 'scope:all') return true;
    if (id === 'cmp:coding-sprint') return true;
    return !!(D.familyById[id] || D.accountById[id] || D.connectionById[id] || D.productById[id] || D.meterById[id]);
  }
  if (!scopeExists(savedScope)) savedScope = 'scope:all';
  window.U11W.pageScope = savedScope;

  var settings = STORE.get('u11:settings', null) || JSON.parse(JSON.stringify(D.settingsDefaults));

  /* ---------- boot chrome + widgets ---------- */
  window.PMUsageChrome.boot({ badge: { id: 'U11', name: 'Prism II' } });
  window.U11W.register();
  if (window.U11Context) window.U11Context.mountTriggers($('sbChips'));

  var HANDLES = [];
  var CANVASES = [];

  function typesForRoom(roomTypes) {
    var allowed = window.U11W.typesForDisclosure[disclosure];
    return roomTypes.filter(function (t) { return allowed.indexOf(t) !== -1; });
  }

  /* curated hole-free boards on the 4-track tier (deterministic; no dense flow) */
  var BOARDS = {
    'u11-overview': [
      { type: 'capacity', c: 4, r: 8 }, { type: 'plans', c: 4, r: 10 },
      { type: 'costs', c: 2, r: 11 }, { type: 'context', c: 2, r: 11 },
      { type: 'attention', c: 2, r: 9 }, { type: 'accounts', c: 2, r: 9 }
    ],
    'u11-plans': [{ type: 'plans', c: 4, r: 11 }, { type: 'capacity', c: 2, r: 9 }, { type: 'authority', c: 2, r: 9 }],
    'u11-costs': [{ type: 'costs', c: 2, r: 12 }, { type: 'analytics', c: 4, r: 10 }],
    'u11-accounts': [{ type: 'accounts', c: 4, r: 11 }, { type: 'authority', c: 2, r: 8 }],
    'u11-free': [{ type: 'free', c: 4, r: 11 }, { type: 'authority', c: 2, r: 8 }],
    'u11-context': [{ type: 'context', c: 2, r: 10 }, { type: 'cache', c: 2, r: 10 }],
    'u11-analytics': [{ type: 'analytics', c: 4, r: 11 }, { type: 'costs', c: 2, r: 9 }],
    'u11-ledger': [{ type: 'ledger', c: 4, r: 12 }, { type: 'runs', c: 2, r: 10 }, { type: 'operations', c: 2, r: 10 }],
    'u11-attention': [{ type: 'attention', c: 3, r: 11 }],
    'u11-cache': [{ type: 'cache', c: 3, r: 11 }],
    'u11-tools': [{ type: 'tools', c: 3, r: 11 }],
    'u11-signals': [{ type: 'signals', c: 3, r: 11 }],
    'u11-authority': [{ type: 'authority', c: 3, r: 10 }]
  };

  function mountCanvases() {
    document.querySelectorAll('[data-u11-page]').forEach(function (cv) {
      var pageId = cv.getAttribute('data-u11-page');
      var roomTypes = (cv.getAttribute('data-u11-types') || '').split(',').filter(Boolean);
      var types = typesForRoom(roomTypes);
      var h = window.PMWidgets.mount(cv, { pageId: pageId, types: types.length ? types : roomTypes.slice(0, 1), defaultBoard: BOARDS[pageId] || null });
      HANDLES.push(h);
      CANVASES.push(cv);
      window.U11W.wireCanvas(cv);
      wireSortKeys(cv);
      var mo = new MutationObserver(function (muts) {
        muts.forEach(function (m) {
          Array.prototype.forEach.call(m.addedNodes, function (n) {
            if (n.nodeType !== 1) return;
            if (n.classList && n.classList.contains('uw-body')) window.U11W.animateBody(n);
            if (n.querySelectorAll) {
              n.querySelectorAll('.uw-body').forEach(function (b) { window.U11W.animateBody(b); });
            }
            if (window.PMUsageShell) window.PMUsageShell.wireDemoActions(n);
          });
        });
      });
      mo.observe(cv, { childList: true, subtree: true });
      cv.querySelectorAll('.uw-body').forEach(function (b) { window.U11W.animateBody(b); });
      if (window.PMUsageShell) window.PMUsageShell.wireDemoActions(cv);
    });
  }

  function wireSortKeys(cv) {
    cv.addEventListener('keydown', function (e) {
      var th = e.target.closest && e.target.closest('th[data-wd-sort]');
      if (!th || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault(); th.click();
    });
  }

  /* ---------- head / rail / kicker text ---------- */
  function headLine() {
    $('u11HeadSub').innerHTML = 'AI cost &amp; usage for <b>' + D.meta.project + '</b> — one room at a time. Refreshes every <b>' + D.meta.refreshMin + ' min</b> · history kept <b>' + D.meta.retentionDays + ' days</b>';
    var f = $('u11Fresh');
    f.classList.remove('stale', 'degraded');
    if (D.meta.projectionHealth === 'stale') f.classList.add('stale');
    if (D.meta.projectionHealth === 'degraded') f.classList.add('degraded');
    f.title = 'Projection health: ' + D.meta.projectionHealth + ' · next auto-refresh ' + T.atClock(D.meta.nextAutoRefresh) + ' · zone ' + T.zone;
    $('u11FreshTxt').textContent = D.meta.projectionHealth + ' · as of ' + T.atClock(D.meta.now);
  }

  function hotMeters() {
    return D.meters.filter(function (m) { return m.usedPct != null && m.usedPct >= 90; });
  }
  function warmMeters() {
    return D.meters.filter(function (m) { return m.usedPct != null && m.usedPct >= 70 && m.usedPct < 90; });
  }

  function railStatus() {
    function dot(name, tone) {
      var el = document.querySelector('[data-dot="' + name + '"]');
      if (!el) return;
      el.className = 'u11-dot ' + tone;
      el.title = name + ': ' + tone;
    }
    function meta(name, txt) {
      var el = document.querySelector('[data-meta="' + name + '"]');
      if (el && el.textContent !== txt) el.textContent = txt;
    }
    var hot = hotMeters().length, warm = warmMeters().length;
    var blocked = D.guards.filter(function (g) { return g.state === 'blocked'; }).length;
    var attn = D.accounts.filter(function (a) { return a.state !== 'ready'; }).length +
      D.connections.filter(function (c) { return c.state === 'needs_reconnect'; }).length;
    dot('overview', blocked || hot ? 'warn' : 'ok');
    dot('plans', hot ? 'err' : (warm ? 'warn' : 'ok'));
    dot('costs', 'ok');
    dot('accounts', attn ? 'warn' : 'ok');
    dot('free', 'ok');
    var ctxPct = D.threadById['thread:t-88'].context.pct;
    dot('context', ctxPct >= 90 ? 'warn' : 'ok');
    dot('analytics', 'ok');
    dot('ledger', 'ok');
    dot('attention', blocked ? 'err' : 'ok');
    dot('cache', 'ok');
    dot('tools', 'ok');
    dot('signals', 'ok');
    dot('authority', 'info');

    meta('overview', 'as of ' + T.atClock(D.meta.now));
    meta('plans', D.products.length + ' products · ' + hot + ' hot');
    meta('costs', fmt.cost(D.costs.spentMonthMicro / 1e6) + ' this month');
    meta('accounts', D.visibleAccounts().length + ' accounts' + (attn ? ' · ' + attn + ' attention' : ''));
    meta('free', D.eligibleFreeModels().length + ' eligible routes');
    meta('context', fmt.tok(D.threadById['thread:t-88'].context.used) + '/' + fmt.tok(D.threadById['thread:t-88'].context.limit));
    meta('analytics', 'stacked · 3 windows');
    meta('ledger', D.attempts.length + ' immutable events');
    meta('attention', blocked ? blocked + ' blocked' : 'none blocked');
    meta('cache', '−$' + D.cacheStats.reduce(function (s, c) { return s + (c.save || 0); }, 0).toFixed(2) + ' today');
    meta('tools', D.tools.length + ' tools · 24h');
    meta('signals', D.signals.grade + ' · ' + D.signals.score);
    meta('authority', 'provenance · settlement');

    var sn = D.scopeNode(window.U11W.pageScope);
    meta('scope', sn.kind === 'all' ? 'all current usage' : sn.label);
    dot('scope', sn.kind === 'all' ? 'ok' : 'info');
  }

  function kickerMeta() {
    var km = {
      overview: 'as of ' + T.atClock(D.meta.now) + ' · next ' + T.atClock(D.meta.nextAutoRefresh),
      plans: D.products.length + ' products · continuation each',
      costs: 'limit ' + fmt.cost(D.costs.spendingLimitMicro / 1e6) + ' · warn at ' + D.costs.warningThresholdPct + '%',
      accounts: D.visibleAccounts().length + ' accounts · requested vs used',
      free: D.eligibleFreeModels().length + ' eligible · ' + (D.freeModels.length - D.eligibleFreeModels().length) + ' flagged',
      context: fmt.tok(D.threadById['thread:t-88'].context.used) + ' / ' + fmt.tok(D.threadById['thread:t-88'].context.limit) + ' · ' + D.threadById['thread:t-88'].context.pct + '%',
      analytics: 'stacked shares · mute via legend',
      ledger: D.attempts.length + ' events · ' + D.works.length + ' work items',
      attention: D.guards.length + ' decisions',
      cache: D.cacheStats.length + ' connections',
      tools: D.tools.length + ' tools · last 24h',
      signals: D.signals.grade + ' · ' + D.signals.score,
      authority: 'source class · settlement · freshness'
    };
    document.querySelectorAll('.u11-pane').forEach(function (p) {
      var name = p.getAttribute('data-pane');
      var m = p.querySelector('[data-kmeta]');
      if (m && km[name] != null) m.textContent = km[name];
      var chip = p.querySelector('[data-scope]');
      if (!chip) return;
      var scope = window.U11W.pageScope;
      var sn = D.scopeNode(scope);
      chip.classList.remove('pm-hidden');
      if (sn.kind === 'all') {
        chip.className = 'u11-scope wide';
        chip.innerHTML = ic('globe2') + 'all current usage';
      } else {
        chip.className = 'u11-scope scoped';
        chip.innerHTML = ic('filter') + sn.label;
      }
      chip.title = 'Change scope';
    });
  }

  function updateScopeChip() {
    var chip = $('u11ScopeChip');
    if (!chip) return;
    var sn = D.scopeNode(window.U11W.pageScope);
    var txt = sn.kind === 'all' ? 'All' : sn.label;
    chip.classList.toggle('scoped', sn.kind !== 'all');
    chip.textContent = txt;
  }

  /* ---------- data-quality banner (only when there is a real problem) ---------- */
  function renderBanner() {
    var slot = $('u11BannerSlot');
    var problems = [];
    D.connections.forEach(function (c) { if (c.state === 'needs_reconnect') problems.push(D.accountLabel(c.accountId) + ' needs reconnect'); });
    D.meters.forEach(function (m) { if (m.vs === 'unknown' && m.usedPct == null) problems.push((D.productById[m.productId] || {}).label + ' limit unknown'); });
    if (!problems.length) { slot.innerHTML = ''; return; }
    slot.innerHTML = '<div class="u11-banner" style="margin:0 var(--us-pad)">' + ic('alert') +
      '<span><b>' + problems.length + ' source' + (problems.length > 1 ? 's' : '') + '</b> need attention — ' + problems.slice(0, 2).join(' · ') +
      (problems.length > 2 ? ' · +' + (problems.length - 2) + ' more' : '') + '</span>' +
      '<span class="u11-banner-act"><button type="button" class="u11w-minibtn" data-goto="accounts">Review</button></span></div>';
    var btn = slot.querySelector('[data-goto]');
    if (btn) btn.addEventListener('click', function () { goTo('accounts'); });
  }

  /* ---------- scope picker pop-out (hierarchical, stable IDs) ---------- */
  var pop = $('u11Pop'), scrim = $('u11PopScrim'), popList = $('u11PopList');
  var popOpen = false, lastFocus = null;

  function meterPressure(m) {
    return m.usedPct == null ? -1 : m.usedPct;
  }
  function pressureOfProductSet(ids) {
    var max = -1;
    D.meters.forEach(function (m) {
      if (ids[m.productId] && m.usedPct != null && m.usedPct > max) max = m.usedPct;
    });
    return max;
  }
  function toneCls(p) { return p >= 90 ? 'err' : (p >= 70 ? 'warn' : 'ok'); }
  function valCls(p) { return p >= 90 ? ' hot' : (p >= 70 ? ' warm' : ''); }

  function scopeRow(id, label, metaTxt, level, pressure, extra) {
    var on = window.U11W.pageScope === id;
    var dotHtml = pressure == null ? '<span class="u11-pop-dot"></span>'
      : '<span class="u11-pop-dot ' + toneCls(pressure) + '"></span>';
    var valHtml = pressure == null ? '' : '<span class="u11-pop-val' + valCls(pressure) + '">' + pressure + '%</span>';
    return '<button type="button" class="u11-pop-row lv' + level + (on ? ' on' : '') + '" role="option" aria-selected="' + on + '" tabindex="-1" data-scopeid="' + id + '">' +
      dotHtml +
      '<span class="u11-pop-main">' +
        '<span class="u11-pop-top"><span class="u11-pop-name">' + label + (extra || '') + '</span>' + valHtml + '</span>' +
        (metaTxt ? '<span class="u11-pop-meta">' + metaTxt + '</span>' : '') +
      '</span><span class="u11-pop-ck">' + ic('check') + '</span></button>';
  }

  function buildPopList() {
    var html = '';
    html += scopeRow('scope:all', 'All current usage', 'the default view · every configured source', 0, null);
    D.comparisonSets.forEach(function (c) {
      var set = {};
      c.productIds.forEach(function (p) { set[p] = true; });
      html += scopeRow(c.id, c.label, 'comparison set · ' + c.productIds.length + ' products', 0, pressureOfProductSet(set));
    });
    html += '<div class="u11-pop-g">Provider families · accounts grouped</div>';

    D.visibleFamilies().forEach(function (f) {
      var famAccts = D.accountsOfFamily(f.id).filter(function (a) { return !a.removed; });
      if (!famAccts.length) return;
      var famSet = D.scopeProductSet(f.id);
      html += scopeRow(f.id, f.label, famAccts.length + ' account' + (famAccts.length > 1 ? 's' : ''), 0, pressureOfProductSet(famSet));

      famAccts.forEach(function (a) {
        var conns = D.connectionsOfAccount(a.id);
        var acctSet = D.scopeProductSet(a.id);
        var attn = a.state !== 'ready' ? ' · needs attention' : '';
        html += scopeRow(a.id, a.label, conns.length + ' connection' + (conns.length > 1 ? 's' : '') + attn, 1, pressureOfProductSet(acctSet));

        conns.forEach(function (cn) {
          var cliBadge = cn.authMethod === 'cli_owned_profile' ? '<span class="u11-pop-cli" title="OAuth owned by ' + cn.authOwnedBy + '">CLI</span>' : '';
          var connSet = D.scopeProductSet(cn.id);
          var connAttn = cn.state === 'needs_reconnect' ? ' · reconnect needed' : '';
          html += scopeRow(cn.id, cn.label, D.accountLabel(a.id) + connAttn, 2, pressureOfProductSet(connSet), cliBadge);

          D.productsOfConnection(cn.id).forEach(function (p) {
            var meters = D.metersOfProduct(p.id);
            if (!meters.length) return;
            var prodSet = {}; prodSet[p.id] = true;
            var cont = D.continuation[p.id];
            html += scopeRow(p.id, p.label, meters.length + ' meter' + (meters.length > 1 ? 's' : '') + (cont ? ' · ' + p.kind.replace(/_/g, ' ') : ''), 3, pressureOfProductSet(prodSet));
            meters.forEach(function (m) {
              html += scopeRow(m.id, m.label, m.windowKind.replace(/_/g, ' ') + (m.resetAt ? ' · ' + T.when(m.resetAt, D.meta.now, 'reset') : ''), 3, m.usedPct);
            });
          });
        });
      });
    });
    popList.innerHTML = html;
    updatePopFoot();
  }

  function updatePopFoot() {
    var scope = window.U11W.pageScope;
    var evts = D.attempts.filter(function (a) { return D.attemptInScope(a, scope); });
    var cost = evts.reduce(function (s, a) { return s + (a.costMicro || 0); }, 0);
    var who = D.scopeNode(scope).label;
    $('u11PopFoot').innerHTML = '<b>' + evts.length + '</b> usage events · <b>' + fmt.cost(cost / 1e6) + '</b> measured cost for <b>' + who + '</b>. Removed accounts keep their history but never appear here.';
  }

  function placePop() {
    var body = document.querySelector('.u11-body');
    var r = body ? body.getBoundingClientRect() : { right: window.innerWidth - 16, top: 60 };
    var w = Math.min(368, window.innerWidth - 24);
    pop.style.width = w + 'px';
    var left = Math.max(12, r.right - 16 - w);
    var top = Math.max(12, r.top + 2);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    requestAnimationFrame(function () {
      var h = pop.offsetHeight;
      if (top + h > window.innerHeight - 12) pop.style.top = Math.max(12, window.innerHeight - h - 12) + 'px';
    });
  }
  function openPop() {
    if (popOpen) return;
    popOpen = true;
    lastFocus = document.activeElement;
    buildPopList();
    placePop();
    scrim.classList.add('on');
    pop.classList.add('on');
    var sel = popList.querySelector('.u11-pop-row.on') || popList.querySelector('.u11-pop-row');
    if (sel) sel.focus();
  }
  function closePop() {
    if (!popOpen) return;
    popOpen = false;
    scrim.classList.remove('on');
    pop.classList.remove('on');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function pickScope(id) {
    var changed = window.U11W.pageScope !== id;
    window.U11W.pageScope = id;
    STORE.set('u11:scope', id);
    buildPopList();
    setTimeout(function () {
      closePop();
      if (changed) applyScope();
    }, reduced() ? 0 : 190);
  }
  scrim.addEventListener('click', closePop);
  $('u11PopX').addEventListener('click', closePop);
  popList.addEventListener('click', function (e) {
    var row = e.target.closest('.u11-pop-row');
    if (!row) return;
    pickScope(row.getAttribute('data-scopeid'));
  });
  popList.addEventListener('keydown', function (e) {
    var rows = Array.prototype.slice.call(popList.querySelectorAll('.u11-pop-row'));
    var idx = rows.indexOf(document.activeElement);
    var next = null;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next = Math.min(idx + 1, rows.length - 1);
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') next = Math.max(idx - 1, 0);
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = rows.length - 1;
    else if ((e.key === 'Enter' || e.key === ' ') && idx > -1) { e.preventDefault(); pickScope(rows[idx].getAttribute('data-scopeid')); return; }
    if (next == null || !rows[next]) return;
    e.preventDefault(); rows[next].focus();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && popOpen) closePop(); });
  window.addEventListener('resize', function () { if (popOpen) placePop(); });

  function applyScope() {
    HANDLES.forEach(function (h) { try { h.rerender(); } catch (e) {} });
    railStatus();
    kickerMeta();
    updateScopeChip();
    D.dispatch('cmd.account.select_profile', { scope: window.U11W.pageScope });
  }

  /* ---------- depth flight (calm pane switch, ported from U10) ---------- */
  var DEPTH = { cur: null, flight: null };
  function railItems() { return Array.prototype.slice.call(document.querySelectorAll('.u11-rail .u11-item[data-tab]')); }
  function paneEl(n) { return document.querySelector('.u11-pane[data-pane="' + n + '"]'); }
  function currentPane() {
    if (DEPTH.cur) return DEPTH.cur;
    var p = document.querySelector('.u11-pane:not(.pm-hidden)');
    return p ? p.getAttribute('data-pane') : 'overview';
  }
  function settlePanes(name) {
    document.querySelectorAll('.u11-pane').forEach(function (p) {
      var on = p.getAttribute('data-pane') === name;
      p.classList.toggle('pm-hidden', !on);
      p.classList.remove('u11-leaving', 'u11-entering');
      if (!on) p.classList.remove('u11-anim');
    });
  }
  function landFlight(f) {
    if (!f || f.done) return;
    f.done = true;
    if (DEPTH.flight === f) DEPTH.flight = null;
    clearTimeout(f.timer);
    if (f.aIn) { f.aIn.onfinish = null; f.aIn.cancel(); }
    if (f.aOut) { f.aOut.onfinish = null; f.aOut.cancel(); }
    settlePanes(f.target);
  }
  function goTo(name) {
    if (!name || !paneEl(name)) return;
    landFlight(DEPTH.flight);
    var cur = currentPane();
    if (name === cur) return;
    var items = railItems();
    var order = items.map(function (it) { return it.getAttribute('data-tab'); });
    var deeper = order.indexOf(name) > order.indexOf(cur);
    items.forEach(function (it) { it.classList.toggle('active', it.getAttribute('data-tab') === name); });
    placeRailInd(true);
    var grp = $('u11MoreGrp');
    if (grp && ['attention', 'cache', 'tools', 'signals', 'authority'].indexOf(name) !== -1) {
      grp.classList.remove('closed');
      var mt = grp.querySelector('[data-more-toggle]');
      if (mt) mt.setAttribute('aria-expanded', 'true');
    }
    DEPTH.cur = name;
    var out = paneEl(cur), inn = paneEl(name);

    var th = D.threadById['thread:t-88'];
    var saved = D.cacheStats.reduce(function (s, c) { return s + (c.save || 0); }, 0);
    var ready = D.visibleAccounts().filter(function (a) { return a.state === 'ready'; }).length;
    var total = D.visibleAccounts().length;
    var limitPct = Math.round(D.costs.spentMonthMicro / D.costs.spendingLimitMicro * 100);
    var cards = [];
    cards.push('<div class="u11-kpi"><span class="u11-kpi-ico h-blue">' + ic('wallet') + '</span><div class="u11-kpi-main">' +
      '<div class="u11-kpi-val">' + kpiNum(D.costs.spentMonthMicro / 1e6, 'cost') + '</div>' +
      '<div class="u11-kpi-lab">Spent this month</div></div>' +
      '<span class="u11-kpi-vis"><span class="us-track u11w-track"><span class="us-fill ' + (limitPct >= 90 ? 'f-pink' : limitPct >= 70 ? 'f-orange' : 'f-lime') + '" data-fill="' + limitPct + '" style="--wf:' + limitPct + '%"></span></span></span></div>');
    cards.push('<div class="u11-kpi"><span class="u11-kpi-ico h-pink">' + ic('dial') + '</span><div class="u11-kpi-main">' +
      '<div class="u11-kpi-val">' + kpiNum(hot ? hot.usedPct : 0, 'num') + '<i class="u11w-unit">%</i></div>' +
      '<div class="u11-kpi-lab">Hottest plan · ' + (hot ? (D.productById[hot.productId] || {}).label : '—') + '</div></div>' +
      '<span class="u11-kpi-vis">' + kpiRing(hot ? hot.usedPct : 0, hot && hot.usedPct >= 90 ? 'var(--tone-err)' : 'var(--u11-pink, #ff4d6d)') + '</span></div>');
    cards.push('<div class="u11-kpi"><span class="u11-kpi-ico h-teal">' + ic('inbox') + '</span><div class="u11-kpi-main">' +
      '<div class="u11-kpi-val">' + kpiNum(th.context.pct, 'num') + '<i class="u11w-unit">%</i></div>' +
      '<div class="u11-kpi-lab">Context window · ' + fmt.tok(th.context.used) + ' / ' + fmt.tok(th.context.limit) + '</div></div>' +
      '<span class="u11-kpi-vis">' + kpiRing(th.context.pct, 'var(--u11-teal, #2dd4bf)') + '</span></div>');
    cards.push('<div class="u11-kpi"><span class="u11-kpi-ico h-lime">' + ic('layers') + '</span><div class="u11-kpi-main">' +
      '<div class="u11-kpi-val">' + kpiNum(saved, 'dec', 2, '$') + '</div>' +
      '<div class="u11-kpi-lab">Cache saved today</div></div>' +
      '<span class="u11-kpi-vis"><span class="u11w-spark">' + D.cacheStats.map(function (c) { return '<i class="sp-teal" data-h="' + Math.round((c.save || 0) / Math.max(saved, 0.01) * 100) + '" style="height:8%"></i>'; }).join('') + '</span></span></div>');
    cards.push('<div class="u11-kpi"><span class="u11-kpi-ico h-orange">' + ic('users') + '</span><div class="u11-kpi-main">' +
      '<div class="u11-kpi-val"><b class="u11w-num static">' + ready + ' / ' + total + '</b></div>' +
      '<div class="u11-kpi-lab">Accounts ready</div></div>' +
      '<span class="u11-kpi-vis"><span class="u11w-dots">' + Array.apply(null, Array(total)).map(function (_, i) { return '<i class="' + (i < ready ? 'on h-blue' : '') + '"></i>'; }).join('') + '</span></span></div>');
    cards.push('<div class="u11-kpi"><span class="u11-kpi-ico h-purple">' + ic('spark') + '</span><div class="u11-kpi-main">' +
      '<div class="u11-kpi-val"><b class="u11w-num static">' + D.signals.grade + '</b><i class="u11w-unit">' + D.signals.score + '/100</i></div>' +
      '<div class="u11-kpi-lab">Efficiency signals</div></div>' +
      '<span class="u11-kpi-vis"><span class="u11w-grad"><span class="u11w-gradmask" data-gm="' + (100 - D.signals.score) + '"></span></span></span></div>');
    cards.push('<div class="u11-kpi"><span class="u11-kpi-ico h-teal">' + ic('globe2') + '</span><div class="u11-kpi-main">' +
      '<div class="u11-kpi-val">' + kpiNum(D.eligibleFreeModels().length, 'num') + '</div>' +
      '<div class="u11-kpi-lab">Free routes eligible</div></div></div>');
    cards.push('<div class="u11-kpi"><span class="u11-kpi-ico h-mute">' + ic('clipboard') + '</span><div class="u11-kpi-main">' +
      '<div class="u11-kpi-val">' + kpiNum(D.attempts.length, 'num') + '</div>' +
      '<div class="u11-kpi-lab">Ledger events · immutable</div></div></div>');
    el.innerHTML = cards.map(function (c, i) { return c.replace('class="u11-kpi"', 'class="u11-kpi" style="animation-delay:' + (i * 55) + 'ms"'); }).join('');
    window.U11W.animateBody(el);
  }

  /* ---------- boot ---------- */
  headLine();
  mountCanvases();
  renderKpis();
  railStatus();
  kickerMeta();
  updateScopeChip();
  renderBanner();
  applyDisclosureUI();
  initRailInd();
  document.querySelectorAll('.u11-rail .u11-item').forEach(function (it, i) { it.style.setProperty('--u11-ri', String(i)); });
  document.querySelectorAll('.u11-pop-head i[data-ico], .u11-pop-x i[data-ico]').forEach(function (el) {
    el.innerHTML = window.PMIcon(el.getAttribute('data-ico'), el.className);
  });
  R.deText(document);
})();
</script>
</body>
</html>
