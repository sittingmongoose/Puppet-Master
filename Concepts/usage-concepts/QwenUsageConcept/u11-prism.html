/* =====================================================================
   U11 — PRISM II
   U10 Prism cloned, then rebuilt to the U11 packet: human room names,
   three disclosure levels, a stable-ID hierarchical scope picker,
   conditional capacity/runs widgets, and one reusable run detail.
   Deterministic grid (NO dense flow), Slint-portable CSS only.
   ===================================================================== */

/* =====================================================================
   FONT LOADING — the CDN reference is DELIBERATE, the fallback is now EXPLICIT
   (audit A09-12)
   ---------------------------------------------------------------------
   The four references in <head> above — two preconnects, one preload-as-style
   and the <noscript> stylesheet — are the same four-reference prelude
   PMConcept7 ships (Concepts/PMConcept7.html:142-147). This is therefore an
   app-level pattern the concept SHARES, not a concept deviation, and stripping
   it here would make the two diverge. The decision is to keep it.

   What was wrong was not the CDN, it was the silence. With no network the
   stylesheet request completes with transferSize 0, Chromium raises no
   requestfailed and nothing is logged, so five of the eight families simply do
   not resolve. Every theme stack then ended in a bare `system-ui, sans-serif`,
   which means the offline face was accidental rather than chosen: a geometric
   body and a humanist body fell through to the same OS font, and the condensed
   retro body fell through to something not condensed at all.

   The rules below re-declare each family's stack with the SAME web faces first,
   so nothing changes when the CDN answers, then a local chain picked to match
   that family's voice. An offline load now renders predictably. Selectors use
   html[data-theme^=...] to outrank the shims at the end of _shared/themes.css;
   this page's sheet also loads last.
   ===================================================================== */

  --display-font: 'Cal Sans', 'Nunito', 'Trebuchet MS', 'Segoe UI', Verdana, 'DejaVu Sans', system-ui, sans-serif;

            <b class="u11-kn">01</b>
            <div class="u11-kmain"><h2 class="u11-kt">Right now</h2>
              <p class="u11-kd">The short version — plans under pressure, what happens next, and the money this month. Every room below is composed of widgets you can move, resize, configure and re-scope.</p></div>

        <section class="u11-pane pm-hidden" data-pane="plans" id="u11pane-plans" aria-labelledby="u11tab-plans" aria-label="Plans and limits">

            <b class="u11-kn">02</b>
            <div class="u11-kmain"><h2 class="u11-kt">Plans &amp; limits</h2>

            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-plans" data-u11-types="plans,capacity,authority"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="costs" id="u11pane-costs" aria-labelledby="u11tab-costs" aria-label="Costs">

            <b class="u11-kn">03</b>
            <div class="u11-kmain"><h2 class="u11-kt">Costs &amp; spending</h2>
              <p class="u11-kd">What this month has cost so far — API-billed vs plan-included against one cost authority. The spending limit is yours; it is not a plan allowance.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-costs" data-u11-types="costs,analytics"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="accounts" id="u11pane-accounts" aria-labelledby="u11tab-accounts" aria-label="Accounts">
          <header class="u11-kick">
            <b class="u11-kn">04</b>
            <div class="u11-kmain"><h2 class="u11-kt">Accounts &amp; connections</h2>
              <p class="u11-kd">Configured accounts grouped by provider. Requested is what you chose; used is what served it — mismatches surface only when they matter. CLI-owned profiles stay distinct from API routes.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-accounts" data-u11-types="accounts,authority"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="free" id="u11pane-free" aria-labelledby="u11tab-free" aria-label="Free models">

            <b class="u11-kn">05</b>
            <div class="u11-kmain"><h2 class="u11-kt">Free models</h2>
              <p class="u11-kd">A catalog &amp; routing lens over the free routes you actually set up — not a provider, not a billing identity. Unconfigured upstream providers never appear here.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-free" data-u11-types="free,authority"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="context" id="u11pane-context" aria-labelledby="u11tab-context" aria-label="Context">

            <b class="u11-kn">06</b>

            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-context" data-u11-types="context,cache"></div>
        </section>

            <b class="u11-kn">07</b>
            <div class="u11-kmain"><h2 class="u11-kt">Token analytics</h2>

            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-analytics" data-u11-types="analytics,costs"></div>
        </section>

            <b class="u11-kn">08</b>

            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-ledger" data-u11-types="ledger,runs,operations"></div>
        </section>

            <b class="u11-kn">09</b>

              <p class="u11-kd">Anomaly &amp; quota guard decisions, each carrying its why. Blocked and warned decisions are shown by default; set the widget's <b>Show</b> control to <b>all</b> for the allowed and watching ones.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-attention" data-u11-types="attention"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="cache" id="u11pane-cache" aria-labelledby="u11tab-cache" aria-label="Prompt cache">
          <header class="u11-kick">
            <b class="u11-kn">10</b>
            <div class="u11-kmain"><h2 class="u11-kt">Prompt cache</h2>
              <p class="u11-kd">Per-connection prompt-cache hit and savings. A reported zero, a route that does not expose cache, and a route we could not read are three different statements — never the same one.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-cache" data-u11-types="cache"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="tools" id="u11pane-tools" aria-labelledby="u11tab-tools" aria-label="Tools">

            <b class="u11-kn">11</b>
            <div class="u11-kmain"><h2 class="u11-kt">Tool usage</h2>
              <p class="u11-kd">Latency and error tax by tool over the last 24h. Self-recovering tools are counted once — never as duplicate user work.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-tools" data-u11-types="tools"></div>
        </section>

          <header class="u11-kick">
            <b class="u11-kn">12</b>
            <div class="u11-kmain"><h2 class="u11-kt">Signals &amp; efficiency</h2>
              <p class="u11-kd">Wins, improvements and risks — the number you see is the number you trust.</p></div>
            <div class="u11-kmeta"><button class="u11-scope pm-hidden" data-scope></button><span class="u11-km" data-kmeta></span></div>
          </header>
          <div class="uw-canvas" data-u11-page="u11-signals" data-u11-types="signals"></div>
        </section>

        <section class="u11-pane pm-hidden" data-pane="authority" id="u11pane-authority" aria-labelledby="u11tab-authority" aria-label="Source authority">

          </header>
          <div class="uw-canvas" data-u11-page="u11-authority" data-u11-types="authority"></div>
        </section>

<script>
(function () {
  'use strict';

  var D = window.U11, T = window.U11time;
  var fmt = window.USfmt, R = window.USrender;
  function $(id) { return document.getElementById(id); }
  function ic(n) { return R.ic(n); }
  function reduced() { return R.isRM(); }

  /* ---------- persisted U11 state (filename-independent keys) ---------- */
  var STORE = {
    get: function (k, fb) { try { var v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); } catch (e) { return fb; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var disclosure = STORE.get('u11:disclosure', 'essentials');
  if (['essentials', 'standard', 'advanced'].indexOf(disclosure) === -1) disclosure = 'essentials';
  window.U11W.disclosure = disclosure;

  /* scope fallback: if a persisted scope id vanished, fall back safely (§15.4) */
  var savedScope = STORE.get('u11:scope', 'scope:all');
  function scopeExists(id) {
    if (id === 'scope:all') return true;
    if (id === 'cmp:coding-sprint') return true;
    return !!(D.familyById[id] || D.accountById[id] || D.connectionById[id] || D.productById[id] || D.meterById[id]);
  }
  if (!scopeExists(savedScope)) savedScope = 'scope:all';
  window.U11W.pageScope = savedScope;

  /* Settings-owned policy, read-only.

     Corrected 2026-08-18 (audit A01-01, A01-02, A01-04). This used to be
     rehydrated from localStorage and written back on every change, which made
     Usage a second policy store: five Settings-owned policies were persisted
     here, no command was dispatched, no deep link fired, and — because the
     renderers still read the fixture — the page went on reporting the old value
     as current fact. Usage reports; Settings configures. The projection below is
     what the Settings owner currently says, and nothing in this page writes it. */
  var settingsOwned = D.settingsDefaults;

  /* Local view state only: which product's continuation ladder is on screen.
     That is a view filter with no durable side effect, which the packet
     explicitly allows to stay local. */
  var settingsView = STORE.get('u11:settingsView', {}) || {};

  /* ---------- date range (audit A09-09) ----------

     Before this, the whole application exposed exactly three preset windows on
     one widget (the analytics chart's 5h/24h/7d) and nothing else: no custom
     range, no calendar, no per-room window. The control below is page-level and
     really drives the figures this page renders itself — the key figures on
     Overview, the room strip in every room, the scope picker's footer and the
     export. Widgets that publish their own window (plan resets, the chart's
     5h/24h/7d, the 24h tool table) keep it, and the room strip says so rather
     than implying the range reaches everywhere. The clock is the demo clock, so
     every preset is deterministic. */
  var NOWMS = Date.parse(D.meta.now);
  var RANGE_PRESETS = [
    { id: '5h', label: 'Last 5 hours', ms: 5 * 3600000 },
    { id: '24h', label: 'Last 24 hours', ms: 24 * 3600000 },
    { id: '7d', label: 'Last 7 days', ms: 7 * 86400000 },
    { id: '30d', label: 'Last 30 days', ms: 30 * 86400000 },
    { id: 'all', label: 'All recorded usage', ms: null }
  ];
  function presetById(id) {
    for (var i = 0; i < RANGE_PRESETS.length; i++) if (RANGE_PRESETS[i].id === id) return RANGE_PRESETS[i];
    return null;
  }
  function isDay(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function normRange(r) {
    if (!r || typeof r !== 'object') return { id: '24h', from: null, to: null };
    if (r.id === 'custom' && isDay(r.from) && isDay(r.to) && r.from <= r.to) {
      return { id: 'custom', from: r.from, to: r.to };
    }
    return { id: presetById(r.id) ? r.id : '24h', from: null, to: null };
  }
  var range = normRange(STORE.get('u11:range', { id: '24h' }));
  function rangeWindow() {
    if (range.id === 'custom') {
      var f = Date.parse(range.from + 'T00:00:00Z'), t = Date.parse(range.to + 'T23:59:59Z');
      return { from: f, to: t, id: 'custom',
        label: 'Custom · ' + T.atMonthDayClock(new Date(f).toISOString()) + ' to ' + T.atMonthDayClock(new Date(t).toISOString()) };
    }
    var p = presetById(range.id) || RANGE_PRESETS[1];
    if (p.ms == null) return { from: null, to: null, id: p.id, label: p.label };
    return { from: NOWMS - p.ms, to: NOWMS, id: p.id, label: p.label };
  }
  function rangeShort() {
    if (range.id !== 'custom') return (presetById(range.id) || RANGE_PRESETS[1]).label;
    return 'Custom range';
  }
  function inWindow(iso, win) {
    if (!iso) return false;
    if (win.from == null) return true;
    var ms = Date.parse(iso);
    return !isNaN(ms) && ms >= win.from && ms <= win.to;
  }
  /* Events for the current scope AND range. Attempts with no start time are
     never silently folded in or dropped: they are counted and stated. */
  function rangeEvents() {
    var scope = window.U11W.pageScope, win = rangeWindow();
    var scoped = D.attempts.filter(function (a) { return D.attemptInScope(a, scope); });
    var list = [], untimed = 0;
    scoped.forEach(function (a) {
      if (!a.startedAt) { untimed += 1; return; }
      if (inWindow(a.startedAt, win)) list.push(a);
    });
    return { win: win, list: list, untimed: untimed, scoped: scoped.length, all: D.attempts.length };
  }

  /* ---------- cost is a statement, never a defaulted number (GUI-USG-003/004) ----------

     costMicro is 0 on plan-covered, BYOK and unknown attempts alike, so any
     surface that reads it directly prints "$0.00" for three different facts —
     exactly what GUI-USG-003 forbids ("unknown cost fails closed", MUST_NOT
     $0.00) and what GUI-USG-004 forbids for BYOK/subscription routes. Every
     cost this page renders or exports goes through costFacet() first: the
     provider's own number is shown only where display_cost_policy says show,
     a plan-covered or BYOK route says which one it is, and an unknown cost says
     it is unknown. A provider-reported zero stays a reported zero (GUI-USG-002)
     because it arrives as policy show with cost_status provider_reported. */
  function costFacet(a) {
    if (a.hiddenSubscription || a.costStatus === 'hidden_subscription' || a.displayCostPolicy === 'subscription_covered') return 'covered';
    if (a.hiddenByok || a.costStatus === 'hidden_byok' || a.displayCostPolicy === 'hide') return 'byok';
    if (a.displayCostPolicy === 'show' && a.costMicro != null) return 'money';
    return 'unknown';
  }
  function costSummary(list) {
    var s = { micro: 0, money: 0, covered: 0, byok: 0, unknown: 0, count: (list || []).length };
    (list || []).forEach(function (a) {
      var f = costFacet(a);
      if (f === 'money') { s.micro += a.costMicro; s.money += 1; }
      else s[f] += 1;
    });
    return s;
  }
  /* One phrase, in words, that can never read as a zero for a missing value. */
  function costPhrase(s) {
    var parts = [];
    if (s.money) parts.push(fmt.cost(s.micro / 1e6) + ' priced by the provider on ' + s.money + ' event' + (s.money > 1 ? 's' : ''));
    else parts.push('no event here carries a published price');
    if (s.covered) parts.push(s.covered + ' covered by a plan');
    if (s.byok) parts.push(s.byok + ' billed to your own key');
    if (s.unknown) parts.push(s.unknown + ' cost not reported');
    return parts.join(' · ');
  }
  var COST_TITLE = 'A plan-covered route, a bring-your-own-key route and an unreported cost are three different statements. ' +
    'None of them is a zero, and a provider-reported zero is still a reported figure.';

  /* ---------- boot chrome + widgets ---------- */
  window.PMUsageChrome.boot({ badge: { id: 'U11', name: 'Prism II' } });

  /* Webfont arrival, stated rather than assumed (audit A09-12, part two).

     The fallback stacks above make an offline render deliberate instead of
     accidental, but they cannot make it VISIBLE. With no network the stylesheet
     request completes with transferSize 0, Chromium raises no requestfailed and
     nothing is logged, so a reader on an air-gapped box has no way to know the
     typography they are looking at is not the intended one. This says so, in the
     same register the rest of the page uses for unknown state: it reports what
     did not arrive, and claims nothing about why. */
  (function () {
    var WEB_FAMILIES = ['Cal Sans', 'Inter', 'JetBrains Mono', 'Nunito', 'Outfit', 'Quicksand', 'Rajdhani', 'Sora'];
    function missingFamilies() {
      if (!document.fonts || !document.fonts.check) return null; /* cannot tell: say nothing */
      var out = [];
      WEB_FAMILIES.forEach(function (f) {
        try { if (!document.fonts.check('1em "' + f + '"')) out.push(f); } catch (e) { /* unqueryable */ }
      });
      return out;
    }
    function report() {
      var missing = missingFamilies();
      if (!missing || !missing.length) return; /* all arrived, or not knowable */
      var host = $('u11HeadSub');
      if (!host) return;
      var note = document.createElement('span');
      note.className = 'u11-fontnote';
      note.setAttribute('data-u11-fields', 'webfonts_missing:' + missing.length + ' · of:' + WEB_FAMILIES.length);
      note.title = missing.length + ' of ' + WEB_FAMILIES.length + ' web typefaces did not load: ' +
        missing.join(', ') + '. The page is rendering its local fallback stacks, which are chosen to match ' +
        'each family rather than left to chance. Nothing else about the page is affected.';
      note.textContent = missing.length === WEB_FAMILIES.length
        ? 'Local typefaces — no web fonts loaded'
        : 'Local typefaces for ' + missing.length + ' of ' + WEB_FAMILIES.length;
      host.appendChild(document.createTextNode(' '));
      host.appendChild(note);
    }
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(report, function () {});
    } else {
      setTimeout(report, 1200);
    }
  })();
  window.U11W.register();
  if (window.U11Context) window.U11Context.mountTriggers($('sbChips'));

  var HANDLES = [];
  var CANVASES = [];

  function typesForRoom(roomTypes) {
    var allowed = window.U11W.typesForDisclosure[disclosure];
    return roomTypes.filter(function (t) { return allowed.indexOf(t) !== -1; });
  }

  /* ---------- disclosure actually filters what mounts (audit A09-03) ----------

     typesForRoom() always computed the right list, but the list never reached
     the items: mount() was handed defaultBoard as well, and the engine prefers
     a board whenever one exists (seedItems, _shared/usage-widgets.js:108-110)
     while boardItems() filters on type registration alone. A stored layout took
     the same path. Measured consequence: the mounted-type list was byte
     identical at Essentials, Standard and Advanced for all thirteen rooms, so
     the Advanced-only Source authority widget mounted at Essentials — under its
     own footnote saying it never appears there.

     Two rules now hold together:
       · a level may only mount the types it allows (the board is filtered, and
         a stored layout is filtered before the engine reads it);
       · a level never DELETES anything (§5.1). Out-of-level widgets are parked
         with their position and come back the moment the level allows them.
     A type the room's board introduces is seeded once per level, so raising the
     level still ADDS what that level brings, and a widget the user removed on
     purpose stays removed. */
  var PMW_VERSION = 2;
  var parked = STORE.get('u11:parked', {}) || {};
  var seededTypes = STORE.get('u11:seeded', {}) || {};
  function pmwKey(pageId) { return 'pmw:' + pageId; }
  function storedItems(pageId) {
    var env = STORE.get(pmwKey(pageId), null);
    if (!env) return null;
    var items = Array.isArray(env) ? env : (Array.isArray(env.items) ? env.items : null);
    return items ? items.slice() : null;
  }
  function levelReconcile(pageId, allowed, board) {
    var items = storedItems(pageId);
    var park = (parked[pageId] || []).filter(function (p) { return p && p.item && p.item.type; });
    /* what this page had already seeded BEFORE this level — copied, because the
       new list below is what gets stored and the two must stay distinguishable */
    var before = (seededTypes[pageId] || []).slice();
    var seen = before.slice();
    var i, restored = [];

    /* the types this level introduces are seeded once, from the room's board */
    (board || []).forEach(function (b) { if (seen.indexOf(b.type) === -1) seen.push(b.type); });
    if (!items) { seededTypes[pageId] = seen; STORE.set('u11:seeded', seededTypes); return; }

    var keep = [], stay = [];
    items.forEach(function (it, idx) {
      if (it && allowed.indexOf(it.type) !== -1) keep.push(it);
      else if (it) stay.push({ at: idx, item: it });
    });
    park.forEach(function (p) {
      if (allowed.indexOf(p.item.type) !== -1) restored.push(p);
      else stay.push(p);
    });
    restored.sort(function (a, b) { return a.at - b.at; });
    for (i = 0; i < restored.length; i++) {
      keep.splice(Math.min(restored[i].at, keep.length), 0, restored[i].item);
    }
    /* board types this level introduces and this page has never seeded: a level
       ADDS what it brings, once — after that the layout is the user's */
    (board || []).forEach(function (b) {
      var present = keep.filter(function (k) { return k.type === b.type; }).length;
      if (!present && before.indexOf(b.type) === -1) {
        keep.push({ uid: 'seed_' + b.type + '_' + pageId, type: b.type, c: b.c, r: b.r, cfg: {}, focus: false });
      }
    });
    parked[pageId] = stay;
    seededTypes[pageId] = seen;
    STORE.set('u11:parked', parked);
    STORE.set('u11:seeded', seededTypes);
    STORE.set(pmwKey(pageId), { v: PMW_VERSION, items: keep });
  }

  /* plain-language names for the widget types, so an empty room can say what
     it would hold without printing a raw enum token */
  var TYPE_LABELS = {
    plans: 'Plans & limits', costs: 'Costs & spending', accounts: 'Accounts & connections',
    attention: 'Attention', context: 'Context & cache', capacity: 'Completion capacity',
    free: 'Free models', ledger: 'Ledger', runs: 'Runs & agents', operations: 'Maintenance & operations',
    analytics: 'Token analytics', tools: 'Tool usage', cache: 'Prompt cache', signals: 'Signals & efficiency',
    authority: 'Source authority'
  };
  var LEVEL_LABELS = { essentials: 'Essentials', standard: 'Standard', advanced: 'Advanced' };
  function typeLabel(t) { return TYPE_LABELS[t] || R.humanCap(t); }
  function firstLevelFor(types) {
    var order = window.U11W.DISC_ORDER, i, j;
    for (i = 0; i < order.length; i++) {
      var allow = window.U11W.typesForDisclosure[order[i]];
      for (j = 0; j < types.length; j++) if (allow.indexOf(types[j]) !== -1) return order[i];
    }
    return 'advanced';
  }
  /* A room with nothing at this level says so, in that room. It never borrows an
     out-of-level widget to look full. */
  function roomLevelNotice(cv, allowedHere, roomTypes) {
    var pane = cv.closest('.u11-pane');
    if (!pane) return;
    var old = pane.querySelector('.u11-empty');
    if (old) old.parentNode.removeChild(old);
    /* with no types at this level the Add-widget picker would offer nothing, so
       the button is not left as a control that opens an empty menu */
    pane.classList.toggle('is-levelempty', !allowedHere.length);
    if (allowedHere.length) return;
    var need = firstLevelFor(roomTypes);
    var names = roomTypes.map(typeLabel);
    var el = document.createElement('div');
    el.className = 'u11-empty';
    el.innerHTML = '<span class="u11-empty-ic">' + ic('layers') + '</span>' +
      '<span class="u11-empty-main"><b>Nothing in this room at the ' + LEVEL_LABELS[disclosure] + ' level.</b>' +
      '<p>' + names.join(' and ') + (names.length > 1 ? ' belong' : ' belongs') + ' to the ' + LEVEL_LABELS[need] +
      ' level. Nothing was removed and nothing is hidden — this room has no ' + LEVEL_LABELS[disclosure] +
      ' content, and no out-of-level widget is mounted to make it look full.</p></span>' +
      '<span class="u11-empty-act"><button type="button" class="u11w-minibtn" data-u11-golevel="' + need + '">Switch to ' + LEVEL_LABELS[need] + '</button></span>';
    cv.insertAdjacentElement('beforebegin', el);
  }

  /* curated hole-free boards on the 4-track layout (deterministic; no dense flow) */
  var BOARDS = {
    'u11-overview': [
      { type: 'capacity', c: 4, r: 8 }, { type: 'plans', c: 4, r: 10 },
      { type: 'costs', c: 2, r: 11 }, { type: 'context', c: 2, r: 11 },
      { type: 'attention', c: 2, r: 9 }, { type: 'accounts', c: 2, r: 9 }
    ],
    'u11-plans': [{ type: 'plans', c: 4, r: 11 }, { type: 'capacity', c: 2, r: 9 }, { type: 'authority', c: 2, r: 9 }],
    'u11-costs': [{ type: 'costs', c: 2, r: 12 }, { type: 'analytics', c: 4, r: 10 }],
    'u11-accounts': [{ type: 'accounts', c: 4, r: 11 }, { type: 'authority', c: 2, r: 8 }],
    'u11-free': [{ type: 'free', c: 4, r: 11 }, { type: 'authority', c: 2, r: 8 }],
    'u11-context': [{ type: 'context', c: 2, r: 10 }, { type: 'cache', c: 2, r: 10 }],
    'u11-analytics': [{ type: 'analytics', c: 4, r: 11 }, { type: 'costs', c: 2, r: 9 }],
    'u11-ledger': [{ type: 'ledger', c: 4, r: 12 }, { type: 'runs', c: 2, r: 10 }, { type: 'operations', c: 2, r: 10 }],
    'u11-attention': [{ type: 'attention', c: 3, r: 11 }],
    'u11-cache': [{ type: 'cache', c: 3, r: 11 }],
    'u11-tools': [{ type: 'tools', c: 3, r: 11 }],
    'u11-signals': [{ type: 'signals', c: 3, r: 11 }],
    'u11-authority': [{ type: 'authority', c: 3, r: 10 }]
  };

  function mountCanvases() {
    document.querySelectorAll('[data-u11-page]').forEach(function (cv) {
      var pageId = cv.getAttribute('data-u11-page');
      var roomTypes = (cv.getAttribute('data-u11-types') || '').split(',').filter(Boolean);
      var types = typesForRoom(roomTypes);
      /* the board is filtered to this level too — passing the full board is how
         out-of-level widgets used to mount (A09-03) */
      var board = (BOARDS[pageId] || []).filter(function (b) { return types.indexOf(b.type) !== -1; });
      levelReconcile(pageId, types, board);
      var h = window.PMWidgets.mount(cv, { pageId: pageId, types: types, defaultBoard: board.length ? board : null });
      roomLevelNotice(cv, types, roomTypes);
      HANDLES.push(h);
      CANVASES.push(cv);
      window.U11W.wireCanvas(cv);
      wireSortKeys(cv);
      var mo = new MutationObserver(function (muts) {
        muts.forEach(function (m) {
          Array.prototype.forEach.call(m.addedNodes, function (n) {
            if (n.nodeType !== 1) return;
            if (n.classList && n.classList.contains('uw-body')) window.U11W.animateBody(n);
            if (n.querySelectorAll) {
              n.querySelectorAll('.uw-body').forEach(function (b) { window.U11W.animateBody(b); });
            }
            if (window.PMUsageShell) window.PMUsageShell.wireDemoActions(n);
          });
        });
      });
      mo.observe(cv, { childList: true, subtree: true });
      cv.querySelectorAll('.uw-body').forEach(function (b) { window.U11W.animateBody(b); });
      if (window.PMUsageShell) window.PMUsageShell.wireDemoActions(cv);
    });
  }

  function wireSortKeys(cv) {
    cv.addEventListener('keydown', function (e) {
      var th = e.target.closest && e.target.closest('th[data-wd-sort]');
      if (!th || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault(); th.click();
    });
  }

  /* ---------- head / rail / kicker text ---------- */
  function headLine() {
    $('u11HeadSub').innerHTML = 'AI cost &amp; usage for <b>' + D.meta.project + '</b> — one room at a time. Refreshes every <b>' + D.meta.refreshMin + ' min</b> · history kept <b>' + D.meta.retentionDays + ' days</b>';
    var f = $('u11Fresh');
    f.classList.remove('stale', 'degraded');
    if (D.meta.projectionHealth === 'stale') f.classList.add('stale');
    if (D.meta.projectionHealth === 'degraded') f.classList.add('degraded');
    f.title = 'Projection health: ' + D.meta.projectionHealth + ' · next auto-refresh ' + T.atClock(D.meta.nextAutoRefresh) + ' · zone ' + T.zone;
    $('u11FreshTxt').textContent = D.meta.projectionHealth + ' · as of ' + T.atClock(D.meta.now);
  }

  function hotMeters() {
    return D.meters.filter(function (m) { return m.usedPct != null && m.usedPct >= 90; });
  }
  function warmMeters() {
    return D.meters.filter(function (m) { return m.usedPct != null && m.usedPct >= 70 && m.usedPct < 90; });
  }

  function railStatus() {
    function dot(name, tone) {
      var el = document.querySelector('[data-dot="' + name + '"]');
      if (!el) return;
      el.className = 'u11-dot ' + tone;
      el.title = name + ': ' + tone;
    }
    function meta(name, txt) {
      var el = document.querySelector('[data-meta="' + name + '"]');
      if (el && el.textContent !== txt) el.textContent = txt;
    }
    var hot = hotMeters().length, warm = warmMeters().length;
    var blocked = D.guards.filter(function (g) { return g.state === 'blocked'; }).length;
    var attn = D.accounts.filter(function (a) { return a.state !== 'ready'; }).length +
      D.connections.filter(function (c) { return c.state === 'needs_reconnect'; }).length;
    dot('overview', blocked || hot ? 'warn' : 'ok');
    dot('plans', hot ? 'err' : (warm ? 'warn' : 'ok'));
    dot('costs', 'ok');
    dot('accounts', attn ? 'warn' : 'ok');
    dot('free', 'ok');
    var ctxPct = D.threadById['thread:t-88'].context.pct;
    dot('context', ctxPct >= 90 ? 'warn' : 'ok');
    dot('analytics', 'ok');
    dot('ledger', 'ok');
    dot('attention', blocked ? 'err' : 'ok');
    dot('cache', 'ok');
    dot('tools', 'ok');
    dot('signals', 'ok');
    dot('authority', 'info');

    meta('overview', 'as of ' + T.atClock(D.meta.now));
    meta('plans', D.products.length + ' products · ' + hot + ' hot');
    meta('costs', fmt.cost(D.costs.spentMonthMicro / 1e6) + ' this month');
    meta('accounts', D.visibleAccounts().length + ' accounts' + (attn ? ' · ' + attn + ' attention' : ''));
    meta('free', D.eligibleFreeModels().length + ' eligible routes');
    meta('context', fmt.tok(D.threadById['thread:t-88'].context.used) + '/' + fmt.tok(D.threadById['thread:t-88'].context.limit));
    meta('analytics', 'stacked · 3 windows');
    meta('ledger', D.attempts.length + ' immutable events');
    meta('attention', blocked ? blocked + ' blocked' : 'none blocked');
    meta('cache', '−$' + D.cacheStats.reduce(function (s, c) { return s + (c.save || 0); }, 0).toFixed(2) + ' today');
    meta('tools', D.tools.length + ' tools · 24h');
    meta('signals', D.signals.grade + ' · ' + D.signals.score);
    meta('authority', 'provenance · settlement');

    var sn = D.scopeNode(window.U11W.pageScope);
    meta('scope', sn.kind === 'all' ? 'all current usage' : sn.label);
    dot('scope', sn.kind === 'all' ? 'ok' : 'info');
  }

  function kickerMeta() {
    /* Corrected 2026-08-18 (audit A03-12). This read "<n> products · continuation
       each" at every disclosure level while only 12 of the 29 products have a

  /* ---------- the range, bucketed: a real table and a real graph (audit A09-09) ----------

     control closed the ranges half, but the whole document still held exactly
     one HTML table (the tool table, on its own fixed 24-hour window) and two
     chart surfaces (costs and analytics, the analytics one on its own
     5h/24h/7d windows) — so no table and no graph anywhere followed the range
     the reader had chosen, and there was no per-day view of anything.

     by the page range and the page scope, bucketed in the reader's own zone
     rather than in UTC. The bucket follows the range — hours inside a two-day
     window, days beyond it — so a five-hour range shows the shape of those five
     hours instead of collapsing to a single column.

     published price says so in words instead of drawing a zero bar or $0.00.

     attemptInScope, which deliberately matches removed accounts so their

  var DAY_KEY_FMT = null, DAY_LBL_FMT = null, DAY_SHORT_FMT = null, HOUR_FMT = null;
  function dayFormatters() {

    var shrt = { month: 'short', day: 'numeric' };
    var hr = { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };

       the only zone these buckets use — a "day" here is the reader's day. */
    try {
      DAY_KEY_FMT = new Intl.DateTimeFormat('en-CA', { timeZone: T.zoneId, year: opt.year, month: opt.month, day: opt.day });
      DAY_LBL_FMT = new Intl.DateTimeFormat('en-US', { timeZone: T.zoneId, weekday: lbl.weekday, month: lbl.month, day: lbl.day });
      DAY_SHORT_FMT = new Intl.DateTimeFormat('en-US', { timeZone: T.zoneId, month: shrt.month, day: shrt.day });
      HOUR_FMT = new Intl.DateTimeFormat('en-GB', { timeZone: T.zoneId, hour: hr.hour, minute: hr.minute, hourCycle: hr.hourCycle });
    } catch (e) {

      DAY_LBL_FMT = new Intl.DateTimeFormat('en-US', lbl);
      DAY_SHORT_FMT = new Intl.DateTimeFormat('en-US', shrt);

  var HOUR_BUCKET_MAX_MS = 48 * 3600000;
  function bucketOf(ms, byHour) {
    var d = new Date(ms);
    var day = DAY_KEY_FMT.format(d);
    return byHour ? day + ' ' + HOUR_FMT.format(d).slice(0, 2) : day;
  }
  function bucketLabel(ms, byHour) {
    var d = new Date(ms);
    return byHour ? DAY_LBL_FMT.format(d) + ' · ' + HOUR_FMT.format(d).slice(0, 2) + ':00'
      : DAY_LBL_FMT.format(d);
  }
  function bucketShort(ms, byHour) {
    var d = new Date(ms);

    var who = D.scopeNode(window.U11W.pageScope).label;
    var curList = ev.list.filter(function (a) { return D.attemptIsCurrent(a); });
    var histList = ev.list.filter(function (a) { return D.attemptIsHistorical(a); });
    var span = (ev.win.from == null || ev.win.to == null) ? null : (ev.win.to - ev.win.from);
    var byHour = span != null && span <= HOUR_BUCKET_MAX_MS;

      '<span class="u11-tb-c">' + ev.win.label + ' · ' + who + ' · current accounts · ' + unit + 's in ' + T.zone + '</span></div>';

        : '<span class="num" title="' + (tt.note || '').replace(/"/g, '') + '">' + fmt.tok(tt.total) + '</span>';

        : '<span class="u11-tb-unk" title="' + COST_TITLE + '">no published price</span>';

    var allCs = costSummary(curList);
    var foot = '<tr><th scope="row">' + keys.length + ' ' + unit + (keys.length === 1 ? '' : 's') + '</th>' +
      '<td class="num">' + curList.length + '</td>' +
      '<td>' + (allTt.total == null
        ? '<span class="u11-tb-unk">not reported</span>'
        : '<span class="num" title="' + (allTt.note || '').replace(/"/g, '') + '">' + fmt.tok(allTt.total) + '</span>') + '</td>' +
      '<td>' + (allCs.money
        ? '<span class="num" title="' + COST_TITLE + '">' + fmt.cost(allCs.micro / 1e6) + '</span>'
        : '<span class="u11-tb-unk" title="' + COST_TITLE + '">no published price</span>') + '</td>' +
      '<td>' + otherCostStates(allCs) + '</td></tr>';
    host.innerHTML = head +
      '<div class="u11-tb-chart" role="img" aria-label="Events per ' + unit + ' for this range and scope. The table below carries the same figures.">' + bars + '</div>' +
      /* the accessible name is an aria-label, not an off-screen <caption>: a

      '<div class="u11-tb-scroll"><table class="u11-tb-tbl" aria-label="Usage by ' + unit + ' for the selected date range and scope">' +
      '<thead><tr><th scope="col">' + (byHour ? 'Hour' : 'Day') + '</th><th scope="col">Events</th><th scope="col">Tokens</th>' +
      '<th scope="col">Priced by the provider</th><th scope="col">Other cost states</th></tr></thead>' +
      '<tbody>' + rows + '</tbody><tfoot>' + foot + '</tfoot></table></div>' +
      '<div class="u11-tb-note">The graph plots how many events landed in each ' + unit + ', which is always known. ' +
      'Tokens and money are reported only where the provider reported them — one with nothing published says so ' +

  /* ---------- scope picker pop-out (hierarchical, stable IDs) ---------- */
  var pop = $('u11Pop'), scrim = $('u11PopScrim'), popList = $('u11PopList');

  /* Pressure for a set of products.

  function pressureOfProductSet(ids) {
    var max = null;
    D.meters.forEach(function (m) {

     The concept read the URL exactly once, for the embed flag, and wrote it
     never: no room, scope, level, range or fixture was re-enterable, linkable
     or assertable by URL. The hash now carries the four pieces of view state
     plus a one-shot fixture trigger. localStorage still holds the same state —
     the hash simply wins on load and is kept in step afterwards, so an existing
     stored view is never lost by opening a link. */
  /* replaceState throws on a file:// document (opaque origin), which is exactly

     directly and hashSelf keeps the resulting hashchange from re-entering. */

  function writeHash() {
    var parts = ['room=' + currentPane(), 'level=' + disclosure, 'scope=' + window.U11W.pageScope];
    parts.push('range=' + (range.id === 'custom' ? 'custom:' + range.from + '..' + range.to : range.id));
    var h = '#' + parts.join('&');
    if (location.hash === h) return;
    hashSelf = h;
    try { history.replaceState(null, '', h); } catch (e) { location.hash = h; }
  }
  function parseHash() {
    var raw = String(location.hash || '').replace(/^#/, '');
    var out = {};

    raw.split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i < 1) return;
      out[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
    return out;
  }
  function rangeFromHash(v) {
    if (!v) return null;
    if (v.indexOf('custom:') === 0) {
      var pair = v.slice(7).split('..');

    return presetById(v) ? normRange({ id: v }) : null;

    if (h.level && h.level !== disclosure) setDisclosure(h.level, true);
    if (h.range) {
      var r = rangeFromHash(h.range);
      if (r && (r.id !== range.id || r.from !== range.from || r.to !== range.to)) applyRange(r, true);
    }
    if (h.scope && h.scope !== window.U11W.pageScope && scopeExists(h.scope)) {
