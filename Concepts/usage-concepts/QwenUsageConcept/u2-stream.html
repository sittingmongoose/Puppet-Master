  function renderTools() {
    var rows = D.tools.map(function (t) {
      var errCls = t.err >= 5 ? 'err' : t.err >= 2 ? 'warn' : 'ok';
      var idx = t.idx == null ? '<span class="dim">\u2014</span>' : '<span class="us-meter" style="min-width:80px">' + R.meter(t.idx, 'info') + '<span class="pc">' + t.idx + '%</span></span>';
      return '<tr><td class="mono">' + t.tool + '</td><td class="num">' + fmt.num(t.calls) + '</td>' +
        '<td class="num">' + t.p50 + 'ms</td><td class="num">' + fmt.num(t.p95) + 'ms</td>' +
        '<td><span class="vs vs-' + errCls + '">' + t.err.toFixed(1) + '%</span></td><td>' + idx + '</td></tr>';
    }).join('');
    $('u2Tools').innerHTML = '<div class="us-tblwrap"><table class="us-tbl">' +
      '<thead><tr><th>Tool</th><th class="num">Calls</th><th class="num">p50</th><th class="num">p95</th><th>Error rate</th><th>index_used</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  }

  function renderAccounts() {
    var presChip = { ok: R.chip('measured'), approaching_threshold: R.chip('estimated'), cooldown: R.chip('blocked'), exhausted: R.chip('failed') };
    var cards = D.accounts.map(function (a, i) {
      var markers = (a.requested ? '<span class="u2-marker req"><span class="us-dot info" style="width:6px;height:6px"></span>requested</span>' : '') +
        (a.effective ? '<span class="u2-marker eff">' + R.ic('check') + 'effective</span>' : '');
      var cd = a.cooldownSec != null ? ' <span class="u2-cd" data-cd-idx="' + i + '">' + R.fmtCd(a.cooldownSec) + '</span>' : '';
      var dot = a.pressure === 'cooldown' || a.pressure === 'exhausted' ? 'err' : (a.pressure === 'approaching_threshold' ? 'warn' : 'ok');
      var val = a.lastValidated ? '<span class="mono dim" style="font-size:var(--fs-2xs)">validated ' + a.lastValidated + ' ago</span>' : (a.resetAt ? '<span class="mono dim" style="font-size:var(--fs-2xs)">back at ' + a.resetAt + '</span>' : '');
      return '<div class="u2-acct' + (a.effective ? ' effective' : '') + '">' +
        '<div class="u2-acct-h"><span class="u2-acct-name">' + a.prov + ' · ' + a.name + '</span><span class="u2-acct-mail mono">' + a.mail + '</span>' + markers + '</div>' +
        '<div class="u2-acct-status"><span class="us-dot ' + dot + (dot !== 'ok' ? ' pulse' : '') + '"></span><span style="min-width:0">' + a.status + cd + '</span><span style="margin-left:auto;display:inline-flex;gap:6px;align-items:center">' + val + (a.pressure !== 'ok' ? presChip[a.pressure] : '') + '</span></div>' +
        (a.note ? '<div class="u2-acct-note">' + R.ic('info') + '<span>' + a.note + '</span></div>' : '') + '</div>';
    }).join('');
    var hist = D.pressureHistory.map(function (h2) {
      var tone = h2.kind === 'switch' ? 'info' : (h2.state === 'exhausted' ? 'err' : (h2.state === 'approaching' ? 'warn' : 'mute'));
      return '<div class="us-wc"><span class="q mono" style="flex:0 0 40px">' + h2.t + '</span><span class="q">' + h2.text + '</span><span class="a" style="color:var(--tone-' + tone + '-text)">' + h2.reason + '</span></div>';
    }).join('');
    $('u2Accounts').innerHTML = '<div class="u2-accts">' + cards + '</div>' +
      '<hr class="us-hr">' +
      '<div class="us-foot" style="margin-bottom:4px"><i data-ico="history" class="pm-ico sm"></i><span><b>Pressure &amp; switch history</b> (append-only) — requested is the account you chose; effective is the one doing the work; cost lands on effective.</span></div>' + hist;
    $('u2TcA').textContent = D.accounts.length;
  }

  function renderGuards() {
    $('u2GuardMeta').textContent = D.guards.length + ' decisions · ' + D.guardConfig.windowMin + 'm window · ' + D.guardConfig.spikeRatio.toFixed(1) + '\u00d7 spike';
    var rows = D.guards.map(function (g, i) {
      var cls = g.state === 'blocked' ? 'blocked' : (g.state === 'warn' ? 'warnc' : 'ok');
      var stChip = g.state === 'blocked' ? R.chip('blocked') : (g.state === 'warn' ? R.chip('estimated') : R.chip('measured'));
      var why = '<div class="u2-why" data-why="' + i + '"><div class="u2-why-t" role="button" tabindex="0" aria-expanded="false">' + R.ic('chevR', 'pm-ico sm') + '<span>Why was this ' + g.state + '?</span></div>' +
        '<div class="u2-why-b"><div class="u2-dgrid">' + g.why.map(function (kv) { return '<div class="u2-di"><b>' + kv[0] + '</b><span>' + kv[1] + '</span></div>'; }).join('') + '</div></div></div>';
      var actions = g.state === 'blocked'
        ? '<div style="display:flex;gap:var(--sm);flex-wrap:wrap"><button type="button" class="u2-btn primary" data-demo-action="usage.anomaly_keep" data-demo-arg="Keep blocking ' + g.kind + '">Looks right — keep blocking</button><button type="button" class="u2-btn" data-demo-action="usage.anomaly_allow" data-demo-arg="Allow once: ' + g.kind + '">It was expected — allow once</button></div>' : '';
      return '<div class="u2-guard ' + cls + '"><div class="u2-guard-h">' + R.ic('shield') + '<span class="u2-guard-name">' + g.title + '</span>' + stChip + '</div>' +
        '<div class="u2-guard-body">' + g.body + '</div><div class="u2-guard-body" style="color:var(--text-muted)">' + g.where + ' · ' + g.t + '</div>' + why + actions + '</div>';
    }).join('');
    $('u2Guards').innerHTML = '<div class="u2-guards">' + rows + '</div>' +
      '<div class="us-foot" style="margin-top:var(--md)"><i data-ico="info" class="pm-ico sm"></i><span>Guard types: ' + D.guardTypes.join(', ') + '. Confidence = ' + D.guardConfig.confidence + '.</span></div>';
    $('u2TcG').textContent = D.guards.length;
  }

  function renderSignals() {
    var e = D.efficiency;
    $('u2GradeMeta').textContent = 'grade ' + e.grade + ' · ' + e.score + '/100';
    var comp = e.components.map(function (c) {
      return '<div class="u2-fam"><span class="u2-fam-name">' + c.k + ' (' + Math.round(c.w * 100) + '%)</span>' +
        '<span class="us-meter">' + R.meter(c.v, c.adverse ? 'hot' : 'ok') + '<span class="pc">' + c.v + '%</span></span><span class="u2-fam-tok">' + (c.adverse ? 'lower is better' : '') + '</span></div>';
    }).join('');
    function sig(list, cls) { return list.map(function (s) { return '<div class="u2-sigrow ' + cls + '"><span class="sd"></span><span class="st">' + s.text + '</span></div>'; }).join(''); }
    $('u2Signals').innerHTML =
      '<div class="u2-grade"><span class="u2-grade-g">' + e.grade + '</span><span class="u2-grade-s">' + e.score + '/100 · retry tax ' + e.retryTaxPct + '% \u2248 ' + fmt.cost(e.retryTaxUsd) + ' this run</span></div>' +
      '<div class="u2-siglabel" style="color:var(--text-secondary)">EFFICIENCY COMPONENTS</div>' + comp +
      '<hr class="us-hr">' +
      '<div class="u2-siglabel" style="color:var(--tone-ok-text)">WINS</div>' + sig(D.signals.wins, 'win') +
      '<div class="u2-siglabel" style="color:var(--tone-info-text)">IMPROVEMENTS</div>' + sig(D.signals.improvements, 'imp') +
      '<div class="u2-siglabel" style="color:var(--tone-warn-text)">RISKS</div>' + sig(D.signals.risks, 'risk');
  }

  function renderContext() {
    var cb = D.contextBudget;
    var pct = Math.round(cb.totalTokens / cb.limit * 100);
    $('u2CtxMeta').textContent = fmt.tok(cb.totalTokens) + ' / ' + fmt.tok(cb.limit) + ' tokens · ' + pct + '%';
    var rows = cb.families.map(function (f) {
      return '<div class="u2-fam"><span class="u2-fam-name" title="' + (f.note || '') + '">' + f.name + '</span>' +
        '<span class="us-meter">' + R.meter(f.share, 'info') + '<span class="pc">' + f.share + '%</span></span>' +
        '<span class="u2-fam-tok">' + fmt.tok(f.tokens) + '</span></div>';
    }).join('');
    var omitted = cb.omitted.map(function (o) {
      return '<div class="us-wc"><span class="q">' + o.name + '</span><span class="a part">' + o.reason + '</span></div>';
    }).join('');
    $('u2Context').innerHTML =
      '<div class="us-meter" style="margin-bottom:var(--sm)"><span class="lb">all</span>' + R.meter(pct) + '<span class="pc">' + pct + '%</span></div>' + rows +
      '<hr class="us-hr">' +
      '<div class="us-foot" style="margin-bottom:4px"><i data-ico="info" class="pm-ico sm"></i><span>Omitted / deferred catalog entries carry a reason receipt.</span></div>' + omitted;
  }

  function renderCounts() {
    var rows = D.whatCounts.map(function (w) {
      var cls = w.counts === true ? 'yes' : (w.counts === false ? 'no' : 'part');
      var label = w.counts === true ? 'counts' : (w.counts === false ? 'doesn\u2019t count' : 'partial');
      return '<div class="us-wc"><span class="q">' + w.q + (w.note ? ' <span style="color:var(--text-muted)">— ' + w.note + '</span>' : '') + '</span><span class="a ' + cls + '">' + label + '</span></div>';
    }).join('');
    $('u2Counts').innerHTML = rows +
      '<hr class="us-hr">' +
      '<div class="us-foot"><i data-ico="info" class="pm-ico sm"></i><span>Spend basis: <b>' + D.spendBasis + '</b> ' + R.chip('pricing_estimated') + ' — list-rate pricing may differ from the actual bill. Projection health: <b>' + D.projectionHealth + '</b>. Missing is a state (' + R.chip('disabled') + R.chip('not_exposed') + R.chip('unknown') + '), never zero.</span></div>';
  }

  function renderProvenance() {
    $('u2Provenance').innerHTML = 'Normalized UsageRecords with a stable <b>usage_event_ref</b> per row · projections as of <b>' + D.asOf + '</b> (' + D.projectionHealth + ') · cost attributed to the <b>effective</b> account · every number carries a value-state chip — disabled, not exposed, hidden, unknown are states, never zero.';
  }

  function buildMenus() {
    var provs = {}; D.ledger.forEach(function (r) { provs[r.prov] = 1; });
    $('u2PlatMenu').innerHTML = '<button type="button" class="pm6-tb-menu-item is-selected" role="menuitem" data-value="">All platforms</button>' +
      Object.keys(provs).sort().map(function (p) { return '<button type="button" class="pm6-tb-menu-item" role="menuitem" data-value="' + p + '">' + p + '</button>'; }).join('');
    $('u2RepMenu').innerHTML = '<button type="button" class="pm6-tb-menu-item is-selected" role="menuitem" data-value="">Any reporting</button>' +
      ['measured', 'estimated', 'unsupported'].map(function (r) { return '<button type="button" class="pm6-tb-menu-item" role="menuitem" data-value="' + r + '">' + r + '</button>'; }).join('');
    $('u2PlatMenu').addEventListener('pm-menu-pick', function (ev) { LF.plat = ev.detail.value || ''; $('u2PlatLabel').textContent = ev.detail.value || 'All platforms'; applyFilter(); });
    $('u2RepMenu').addEventListener('pm-menu-pick', function (ev) { LF.rep = ev.detail.value || ''; $('u2RepLabel').textContent = ev.detail.value || 'Any reporting'; applyFilter(); });
  }
  $('u2Search').addEventListener('input', function () { LF.q = this.value.toLowerCase(); applyFilter(); });

  $('u2Spine').addEventListener('click', function (ev) {
    var car = ev.target.closest('.u2-caret');
    if (car) {
      var node = car.closest('.u2-ev');
      var det = node.querySelector('.u2-ev-detail');
      det.hidden = !det.hidden;
      node.classList.toggle('open', !det.hidden);
      car.setAttribute('aria-expanded', String(!det.hidden));
      return;
    }
    var whyT = ev.target.closest('.u2-why-t');
    if (whyT) {
      var w = whyT.parentElement;
      w.classList.toggle('open');
      whyT.setAttribute('aria-expanded', String(w.classList.contains('open')));
    }
  });
  document.querySelector('.u2-dossier').addEventListener('click', function (ev) {
    var whyT = ev.target.closest('.u2-why-t');
    if (whyT) {
      var w = whyT.parentElement;
      w.classList.toggle('open');
      whyT.setAttribute('aria-expanded', String(w.classList.contains('open')));
    }
  });
  document.querySelector('.u2-tabs').addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-tab]');
    if (!t) return;
    if (t.getAttribute('data-tab') === 'budget') {
      var ds = $('u2Donuts');
      if (ds) {
        ds.querySelectorAll('.dfill').forEach(function (c) { c.style.strokeDashoffset = 163.4; });
        requestAnimationFrame(function () { R.animateDonuts(ds); });
      }
    }
    if (t.getAttribute('data-tab') === 'analytics') requestAnimationFrame(animateChart);
  });

  var liveIdx = 0, liveRef = 2000;
  setInterval(function () {
    if (document.visibilityState !== 'visible') return;
    var src = D.livePool[liveIdx++ % D.livePool.length];
    var r = {}; Object.keys(src).forEach(function (k) { r[k] = src[k]; });
    r.ref = 'ue-47-' + (liveRef++);
    var now = new Date(); r.t = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
    D.ledger.unshift(r); if (D.ledger.length > 40) D.ledger.pop();
    var box = $('u2ActiveEvs');
    if (box) {
      var tmp = document.createElement('div');
      tmp.innerHTML = nodeHTML(r, 'L' + Date.now(), true);
      while (tmp.firstChild) box.insertBefore(tmp.firstChild, box.firstChild);
    }
    updateBlkStats(); updateEvCount();
  }, 9000);

  setInterval(function () {
    if (document.visibilityState !== 'visible') return;
    D.accounts.forEach(function (a, i) {
      if (a.cooldownSec != null && a.cooldownSec > 0) {
        a.cooldownSec--;
        var el = document.querySelector('[data-cd-idx="' + i + '"]');
        if (el) el.textContent = R.fmtCd(a.cooldownSec);
      }
    });
  }, 1000);

  $('u2Refresh').addEventListener('click', function () {
    var b = this; b.classList.add('spinning');
    $('u2FreshTxt').textContent = 'refreshing\u2026';
    $('u2Fresh').classList.add('stale');
    setTimeout(function () {
      b.classList.remove('spinning');
      $('u2Fresh').classList.remove('stale');
      $('u2FreshTxt').textContent = 'current · as of ' + D.asOf;
      renderAll();
      if (window.toast) window.toast('Usage projections refreshed (demo)');
    }, 900);
  });

  function renderAll() {
    renderBand(); renderSpine(); renderQuotas(); renderBudget(); renderAnalytics();
    renderCache(); renderTools(); renderAccounts(); renderGuards(); renderSignals();
    renderContext(); renderCounts(); renderProvenance();
    R.animateCounters(document); R.animateDonuts(document);
    requestAnimationFrame(function () { R.animateFills(document); });
  }
  buildMenus();
  renderAll();
})();
</script></body></html>
