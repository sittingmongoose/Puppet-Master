<?xml version="1.0" encoding="UTF-8"?>
<!-- Tray glyph variant 2: puppet (marionette head) + single bold control bar + string.
     Preserves the "Puppet Master" metaphor as a legible silhouette. Reads at 16x16.
     Works as a macOS template image (single fill = black+alpha).
     Canvas 24x24. -->
<svg id="tray-puppet" data-name="Puppet + String" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Top control bar (the "puppeteer's crossbar") -->
  <rect fill="#000000" x="3.5" y="3" width="17" height="2.6" rx="1.3"/>
  <!-- Single bold string from center of bar down to the head -->
  <rect fill="#000000" x="11.2" y="5.6" width="1.6" height="5.2"/>
  <!-- Marionette head: rounded square with two eye dots — a recognizable "puppet" -->
  <rect fill="#000000" x="7" y="11" width="10" height="9.5" rx="2.2"/>
  <!-- Eyes cut as negative space (transparent) -->
  <rect fill="#FFFFFF" x="9.2" y="13.8" width="1.8" height="1.8" rx="0.6"/>
  <rect fill="#FFFFFF" x="13.0" y="13.8" width="1.8" height="1.8" rx="0.6"/>
  <!-- Small smile -->
  <path fill="#FFFFFF" d="M9.5,17.6 q1.5,1.6 5,0 v1.1 q-2.5,1.4 -5,0 Z"/>
</svg>
