<?xml version="1.0" encoding="UTF-8"?>
<!-- Tray glyph variant 3: simplified full mark — bold "PM" with the control bar + two
     thickened strings, most faithful to the app icon. Strings thickened to survive 16px.
     Works as a macOS template image (single fill = black+alpha).
     Canvas 24x24. -->
<svg id="tray-mark" data-name="Simplified Full Mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Control bar across the top (the angled puppeteer bar, simplified to horizontal) -->
  <rect fill="#000000" x="2.5" y="3" width="19" height="2.2" rx="1.1"/>
  <!-- Two thickened strings down to the PM -->
  <rect fill="#000000" x="6.6" y="5.2" width="1.6" height="5.4"/>
  <rect fill="#000000" x="15.8" y="5.2" width="1.6" height="5.4"/>
  <!-- Bold PM monogram below -->
  <path fill="#000000" d="M4.5,11 h5.8 c2.2,0 3.7,1.3 3.7,3.4 0,2.2 -1.5,3.5 -3.9,3.5 H7 v4.1 H4.5 Z m2.5,2 v2.9 h2.8 c1,0 1.6,-0.55 1.6,-1.45 0,-0.9 -0.6,-1.45 -1.6,-1.45 Z"/>
  <path fill="#000000" d="M14.5,22 V11 h2.2 l3,4.7 c0.27,0.45 0.5,1 0.8,1.6 h0.04 C20.5,16.65 20.45,16.05 20.45,15.4 V11 h2.4 v11 h-2.2 l-3.1,-4.85 c-0.27,-0.45 -0.5,-1 -0.8,-1.6 h-0.04 c0.04,0.75 0.09,1.35 0.09,1.95 V22 Z"/>
</svg>
