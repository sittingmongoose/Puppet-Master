     data-concept-model="Kimi K3" label renders in the shell titlebar and the

<script>
(function () {
  'use strict';
  const K3 = window.K3, store = window.K3Store, data = window.K3Data;

  // 1. Environment from query params, then persisted semantic state.
  K3.setEnv(K3.parseQuery());
  store.loadPersisted();

  // 2. Demo data (synchronous; ships as JS for file:// safety).
  data.init({ seed: K3.env.seed });

  // 2b. A boot with no persisted session has no active thread; everything
  //     downstream (header title, composer send, ring stats) needs one.
  if (!data.thread(store.get('activeThreadId', null))) {
    const first = data.listThreads()[0];
    if (first) store.set('activeThreadId', first.id);
  }

  const ctx = K3.makeCtx();

  // Hoisted observability handle: K3States.apply records stateApplied here,
  // and the initial ?state= application happens inside mountPairing() below —
  // long before the full hook object is assembled at the end of boot.
  window.__k3 = { stateApplied: null };

  // 3. Fake shell (title bar, app rail, dashboard ghost, editor tabs,
  //    docked dock + pop-out floating window roots).
  const shell = window.K3Shell.mount(document.getElementById('k3-app'), ctx);

  let mounted = null; // {windowInst, threadInst, composerInst, mode}

  function currentMountRoot() {
    return K3.env.mode === 'popout' ? shell.floatRoot : shell.dockRoot;
  }

  function mountPairing() {
    unmountPairing();
    const wdef = K3.windows[K3.env.windowId];
    const tdef = K3.threads[K3.env.threadId];
    if (!wdef || !tdef) {
      console.error('K3: unknown pairing', K3.env.windowId, K3.env.threadId);
      return;
    }
    const root = currentMountRoot();
    root.innerHTML = '';
    const windowInst = wdef.mount(root, ctx);
    const threadSlot = root.querySelector('[data-k3-slot="thread"]');
    const composerSlot = root.querySelector('[data-k3-slot="composer"]');
    if (!threadSlot || !composerSlot) {
      console.error('K3: window ' + K3.env.windowId + ' must provide thread and composer slots');
      return;
    }
    const threadInst = tdef.mount(threadSlot, ctx);
    const composerInst = window.K3Composer.mount(composerSlot, ctx);
    mounted = { windowInst, threadInst, composerInst, mode: K3.env.mode };
    shell.setPairingMeta(wdef.meta, tdef.meta);
    if (K3.env.state && window.K3States) window.K3States.apply(K3.env.state, ctx);
  }

  function unmountPairing() {
    if (!mounted) return;
    window.K3UI.closeAll();
    try { mounted.composerInst && mounted.composerInst.unmount && mounted.composerInst.unmount(); } catch (e) {}
    try { mounted.threadInst && mounted.threadInst.unmount && mounted.threadInst.unmount(); } catch (e) {}
    try { mounted.windowInst && mounted.windowInst.unmount && mounted.windowInst.unmount(); } catch (e) {}
    mounted = null;
  }

  function applyPairing(windowId, threadId) {
    if (windowId && K3.windows[windowId]) K3.env.windowId = windowId;
    if (threadId && K3.threads[threadId]) K3.env.threadId = threadId;
    mountPairing();
  }

  // 4. Remount on mount-form change (docked <-> pop-out): geometry changes,
  //    semantic state does not.
  let lastMode = K3.env.mode;
  K3.on('env', (env) => {
    document.documentElement.style.setProperty('--k3-chat-w', env.width + 'px');
    if (env.mode !== lastMode) {
      lastMode = env.mode;
      mountPairing();
    }
  });
  document.documentElement.style.setProperty('--k3-chat-w', K3.env.width + 'px');

  // 5. Bridge: announce + accept env/pairing/snapshot messages.
  window.K3Bridge.listenInHost(applyPairing);
  window.K3Bridge.announceReady();
  window.K3Bridge.listenHub();
  window.K3Bridge.announceHub();

  // 6. Boot.
  mountPairing();

  // 7. Test/observability hooks (merged — stateApplied recorded during the
  //    initial mount above must survive).
  window.__k3 = Object.assign(window.__k3, {
    env: K3.env,
    store,
    data,
    pairing: () => ({ windowId: K3.env.windowId, threadId: K3.env.threadId, mode: K3.env.mode }),
    remount: mountPairing,
    applyPairing
  });

  // 8. Dev drawer (review harness; ships separately — guard keeps this inert
  //    until devdrawer.js is present).
  if (K3.env && new URLSearchParams(location.search).get('demo') === '1' && window.K3DevDrawer) {
    window.K3DevDrawer.mount(document.body, ctx);
  }
})();
</script>
