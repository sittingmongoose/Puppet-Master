<style>
  /* The runner's own chrome. Deliberately plain: it is instrumentation, not a concept, and it must
   * not introduce a style that could be mistaken for one of the eight. */
  .tr-bar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    font-family: var(--body-font); font-size: 13px; color: var(--text-primary);
  }
  .tr-bar button {
    padding: 4px 12px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--surface-elevated); color: var(--text-primary); cursor: pointer;
  }
  .tr-summary { margin-left: auto; font-variant-numeric: tabular-nums; }
  .tr-summary[data-state="pass"] { color: var(--accent-lime, #35a35a); }
  .tr-summary[data-state="fail"] { color: var(--accent-error, #c0392b); }
  .tr-body { padding: 12px; font-family: var(--mono-font); font-size: 12px; }
  .tr-row { display: flex; gap: 10px; padding: 2px 0; }
  .tr-row[data-ok="0"] { color: var(--accent-error, #c0392b); }
  .tr-name { flex: 0 0 160px; }
  .tr-note { color: var(--text-muted); }
  .tr-refused { padding: 12px; color: var(--accent-error, #c0392b); max-width: 70ch; line-height: 1.5; }
  /* The mount host is real: suites measure computed geometry, so the compositions must actually
   * render at full size rather than in a thumbnail. */
  .tr-host { min-height: 900px; }
</style>

<script>
(function () {
  'use strict';
  var out = document.getElementById('tr-out');
  var summary = document.getElementById('tr-summary');

  function line(name, ok, note) {
    var row = document.createElement('div');
    row.className = 'tr-row';
    row.setAttribute('data-ok', ok ? '1' : '0');
    var n = document.createElement('span'); n.className = 'tr-name'; n.textContent = name;
    var v = document.createElement('span'); v.textContent = ok ? 'pass' : 'FAIL';
    row.appendChild(n); row.appendChild(v);
    if (note) { var m = document.createElement('span'); m.className = 'tr-note'; m.textContent = note; row.appendChild(m); }
    out.appendChild(row);
  }

  function render(res) {
    out.innerHTML = '';
    if (res.refused) {
      var r = document.createElement('div');
      r.className = 'tr-refused';
      r.textContent = res.reason;
      out.appendChild(r);
      summary.textContent = 'refused';
      summary.setAttribute('data-state', 'fail');
      return;
    }
    /* Per-suite rows, derived from the failure list so a suite with no failures reads as one pass
     * line rather than fifty. */
    var bySuite = {};
    window.PMXSuites.list().forEach(function (n) { bySuite[n] = { failed: 0, notes: [] }; });
    (res.failures || []).forEach(function (f) {
      if (!bySuite[f.suite]) bySuite[f.suite] = { failed: 0, notes: [] };
      bySuite[f.suite].failed++;
      if (bySuite[f.suite].notes.length < 2) {
        bySuite[f.suite].notes.push(f.msg + (f.actual !== undefined ? ' (got ' + f.actual + ')' : ''));
      }
    });
    Object.keys(bySuite).forEach(function (n) {
      line(n, bySuite[n].failed === 0, bySuite[n].notes.join(' | '));
    });
    summary.textContent = res.passed + '/' + res.total + ' pass · ' + res.failed + ' failed · ' +
      res.errors + ' console errors · ' + res.warnings + ' warnings · ' + res.elapsedMs + 'ms';
    summary.setAttribute('data-state', (res.failed === 0 && res.errors === 0 && res.warnings === 0) ? 'pass' : 'fail');

    /* One object a driver can read without parsing the page. */
    window.__pmxTestExit = {
      total: res.total, passed: res.passed, failed: res.failed,
      errors: res.errors, warnings: res.warnings, elapsedMs: res.elapsedMs,
      viewport: res.viewport, failures: res.failures,
      consoleMessages: res.consoleMessages
    };
  }

  function boot() {
    /* The compositions mount into a real, full-size host: every geometry assertion reads computed
     * layout, so a scaled-down preview would measure the wrong thing. */
    return window.PMXWorkspace.boot();
  }

  document.getElementById('tr-run').addEventListener('click', function () {
    summary.textContent = 'running…';
    window.PMXSuites.runAll({ force: location.search.indexOf('force=1') >= 0 }).then(render);
  });

  document.getElementById('tr-matrix').addEventListener('click', function () {
    summary.textContent = 'running matrix…';
    window.PMXSuites.runMatrix({}).then(function (m) {
      out.innerHTML = '';
      line('matrix', m.failed === 0, m.pairings.length + ' pairing/width runs · ' + m.total +
        ' assertions · ' + m.failed + ' failed · ' + m.errors + ' console errors · ' + m.warnings + ' warnings');
      summary.textContent = m.total + ' assertions · ' + m.failed + ' failed';
      summary.setAttribute('data-state', m.failed === 0 ? 'pass' : 'fail');
      window.__pmxMatrixExit = m;
    });
  });

  boot().then(function () {
    summary.textContent = 'ready · ' + window.PMXSuites.list().length + ' suites';
    /* Auto-run when a driver asks for it, so a headless run needs no synthetic click. */
    if (location.search.indexOf('run=1') >= 0) {
      window.PMXSuites.runAll({ force: location.search.indexOf('force=1') >= 0 }).then(render);
    }
  }).catch(function (e) {
    summary.textContent = 'boot failed';
    summary.setAttribute('data-state', 'fail');
    var d = document.createElement('div');
    d.className = 'tr-refused';
    d.textContent = 'The workspace could not start: ' + (e && e.message ? e.message : String(e));
    out.appendChild(d);
  });
})();
</script>
