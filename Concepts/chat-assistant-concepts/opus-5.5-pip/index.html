<!doctype html>
<html lang="en" data-theme="basic-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip in the chat · Opus 5.5</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #121212; overflow: hidden; }
  #chat { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  /* the concept's own bar: centred over the chat's empty top bar, out of the chat's way */
  .pc-bar { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 8px;
    padding: 4px 6px 4px 10px; border-radius: 10px; font: 500 12px/1 Inter, system-ui, sans-serif; color: #e8e8ea;
    background: rgba(28, 28, 32, .92); border: 1px solid rgba(255, 255, 255, .12); box-shadow: 0 6px 22px rgba(0, 0, 0, .35); }
  .pc-bar b { font-weight: 650; white-space: nowrap; }
  .pc-model { padding: 3px 6px; border-radius: 6px; background: rgba(255, 255, 255, .08); color: #b9b9c2; white-space: nowrap; }
  .pc-bar select, .pc-bar button { font: inherit; color: inherit; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .14); border-radius: 7px; padding: 5px 8px; cursor: pointer; }
  .pc-bar button:hover, .pc-bar select:hover { background: rgba(255, 255, 255, .12); }
  .pc-bar button:focus-visible, .pc-bar select:focus-visible { outline: 2px solid #7aa7ff; outline-offset: 1px; }
  .pc-wait { position: fixed; inset: 0; display: grid; place-items: center; color: #9a9aa3; font: 13px Inter, system-ui, sans-serif; pointer-events: none; }
  @media (max-width: 1100px) { .pc-model, .pc-bar b { display: none; } }
</style>
</head>
<body>
<div class="pc-wait" id="wait">Loading the 5.6 Pro chat…</div>
<iframe id="chat" title="Puppet Master chat with Pip" src="../5.6%20Pro/index.html"></iframe>
<div class="pc-bar" role="toolbar" aria-label="Pip in the chat">
  <b>Pip in the chat</b><span class="pc-model" data-concept-model="Opus 5.5">Opus 5.5</span>
  <label><span class="pc-sr" hidden>Open</span>
    <select id="open" aria-label="Open a sheet or panel">
      <option value="">Open…</option>
      <optgroup label="Sheets">
        <option value="Memory & teaching|af-memory-open">Memory</option>
        <option value="Memory & teaching|af-teach-open">Teach Puppet Master</option>
        <option value="Workflows|collab-open-configure|brainstorm">BrainStorm</option>
        <option value="Workflows|collab-open-configure|crew">Crew</option>
        <option value="Workflows|collab-open-configure|review">Review</option>
        <option value="Workflows|collab-open-configure|chat_room">Chat Room</option>
        <option value="Scheduling|sched-open-message">Schedule a message</option>
        <option value="Scheduling|sched-open-manage">Scheduled</option>
        <option value="Assistance|eli5-open">Explain simply</option>
        <option value="Preferences|af-settings-open">New chat defaults</option>
      </optgroup>
      <optgroup label="Work and plans">
        <option value="@plan">Plan ready for review</option>
        <option value="@subagents">Activity: Subagents</option>
        <option value="@wand">Wand menu</option>
      </optgroup>
      <optgroup label="Settings">
        <option value="@pip">Pip settings</option>
        <option value="@studio">Demo Studio (Pip parts)</option>
      </optgroup>
    </select>
  </label>
  <select id="theme" aria-label="Theme">
    <option value="basic-dark">Basic Dark</option><option value="basic-light">Basic Light</option>
    <option value="friendly-dark">Friendly Dark</option><option value="friendly-light">Friendly Light</option>
    <option value="glass-dark">Glass Dark</option><option value="glass-light">Glass Light</option>
    <option value="retro-dark">Retro Dark</option><option value="retro-light">Retro Light</option>
    <option value="nier-dark">NieR Dark</option><option value="nier-light">NieR Light</option>
  </select>
  <button type="button" id="pipset">Pip settings</button>
</div>
<script>
(function () {
  'use strict';
  const frame = document.getElementById('chat');
  const base = new URL('./', location.href);
  // what the chat needs, in order: the logo kit (Pip's drawing), the onboarding's voice, then the layer
  const STEPS = [
    ['css', new URL('pip-chat.css', base).href],
    ['js', new URL('../../Icon-Concepts/Opus5.5icon/pm-logo.js', base).href],
    ['js', new URL('../../onboarding/opus-5.5-pip/sound.js', base).href],
    ['js', new URL('pip-chat.js', base).href]
  ];
  const win = () => frame.contentWindow, doc = () => frame.contentDocument;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const ready = () => { const w = document.getElementById('wait'); if (w) w.remove(); };
  function inject() {
    const d = doc(); if (!d) return;
    // the shared single file carries Pip inside the chat already
    if (d.documentElement.getAttribute('data-pip-chat') === 'on') { ready(); return; }
    if (d.documentElement.hasAttribute('data-pip-chat')) return;
    d.documentElement.setAttribute('data-pip-chat', 'loading');
    let i = 0;
    const next = () => {
      if (i >= STEPS.length) { d.documentElement.setAttribute('data-pip-chat', 'on'); ready(); return; }
      const [kind, url] = STEPS[i++];
      const el = d.createElement(kind === 'css' ? 'link' : 'script');
      if (kind === 'css') { el.rel = 'stylesheet'; el.href = url; } else el.src = url;
      el.onload = next;
      el.onerror = () => { console.error('Pip in the chat: could not load', url); next(); };
      (kind === 'css' ? d.head : d.body).appendChild(el);
    };
    next();
  }
  frame.addEventListener('load', () => {
    // the chat builds itself on load; give it a beat, then bring Pip in
    const tryIt = (n) => { if (win().PM56_DEMO && win().PM56_EXT && doc().body.dataset.theme) inject(); else if (n < 60) setTimeout(() => tryIt(n + 1), 100); };
    tryIt(0);
  });

  /* open a surface the way a person would: the wand, its group, the row */
  async function press(sel) { const el = doc().querySelector(sel); if (el) { el.click(); await wait(380); return true; } return false; }
  async function escape() {
    for (let i = 0; i < 3; i++) { doc().dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await wait(120); }
  }
  async function openRow(group, action, kind) {
    await escape();
    await press('[data-menu="wand"]');
    const sel = `.overlay-menu button[data-action="${action}"]${kind ? `[data-kind="${kind}"]` : ''}`;
    if (!doc().querySelector(sel)) {
      const g = [...doc().querySelectorAll('.overlay-menu [data-action="polish-wand-group"]')].find((b) => b.textContent.trim().indexOf(group) === 0);
      if (g) { g.click(); await wait(380); }
    }
    await press(sel);
  }
  async function open(v) {
    const W = win();
    if (!v || !W.PM56_DEMO) return;
    if (v === '@plan') { await escape(); W.PM56_DEMO.openPlan(); return; }
    if (v === '@subagents') { await escape(); W.PM56_DEMO.openActivity('subagents'); return; }
    if (v === '@wand') { await escape(); await press('[data-menu="wand"]'); return; }
    if (v === '@pip') { await escape(); if (W.PIP_CHAT) W.PIP_CHAT.open(); return; }
    if (v === '@studio') { await escape(); const b = [...doc().querySelectorAll('button')].find((x) => /Demo Studio/.test(x.textContent)); if (b) b.click(); return; }
    const [group, action, kind] = v.split('|');
    await openRow(group, action, kind);
  }
  document.getElementById('open').addEventListener('change', (e) => { open(e.target.value); e.target.value = ''; });
  document.getElementById('pipset').addEventListener('click', () => open('@pip'));
  const themeSel = document.getElementById('theme');
  function setTheme(t) { const W = win(); if (W && W.PM56_DEMO) W.PM56_DEMO.setTheme(t); themeSel.value = t; }
  themeSel.addEventListener('change', () => setTheme(themeSel.value));
  // the Concept Hub's theme and motion reach the chat inside
  window.addEventListener('message', (ev) => {
    const m = ev.data;
    if (!m || m.source !== 'pm-concept-hub' || m.type !== 'pm-concept-state' || !m.state) return;
    if (m.state.theme) setTheme(m.state.theme);
    const d = doc(); if (d) d.documentElement.setAttribute('data-motion', m.state.reducedMotion ? 'reduced' : 'full');
  });
  if (window.parent !== window) window.parent.postMessage({ source: 'pm-concept', type: 'pm-concept-ready' }, '*');
  window.PIP_HOST = { open, setTheme, frame };
})();
</script>
</body>
</html>
