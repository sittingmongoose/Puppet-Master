  <script>
  (function () {
    if (new URLSearchParams(location.search).get("harness") !== "1") return;
    document.addEventListener("DOMContentLoaded", function () {
      var d = document.createElement("div");
      d.className = "pmq-harness";
      d.innerHTML =
        '<div class="pmq-harness-head"><span>Demo harness · not product chrome</span><button type="button" data-hclose aria-label="Close harness">Close</button></div>' +
        '<div class="pmq-harness-body"></div>';
      document.body.appendChild(d);
      var body = d.querySelector(".pmq-harness-body");
      var groups = {
        history: ["history.peek", "history.pin_compact", "history.pin_full", "history.unpin", "history.switch_thread"],
        question: ["question.prepare", "question.select", "question.next", "question.validation_error", "question.skip", "question.cancel", "question.submit"],
        goal: ["goal.start", "goal.progress", "goal.pause", "goal.resume", "goal.update", "goal.blocked", "goal.complete"],
        todo: ["todo.add", "todo.complete", "todo.reopen", "todo.block"],
        subagent: ["subagent.spawn", "subagent.progress", "subagent.complete", "subagent.fail", "subagent.retry"],
        activity: ["activity.thinking_summary", "activity.search", "activity.read", "activity.browser", "activity.test", "activity.edit", "activity.generate"],
        diff: ["diff.create", "diff.update", "diff.open"],
        artifact: ["artifact.loading", "artifact.ready", "artifact.switch", "artifact.error", "artifact.close"],
        decision: ["decision.approval_open", "decision.details", "decision.approve", "decision.deny", "decision.branch"],
        thread: ["thread.send_request", "thread.receive_response", "thread.spawn_related", "thread.branch"],
        system: ["system.port_collision", "system.worktree_collision", "system.cross_project", "system.compact_now", "system.redirect", "system.crew", "system.reset"]
      };
      var names = (window.PMChatDemoTriggers && window.PMChatDemoTriggers.names()) || [];
      names.forEach(function (n) { var g = n.split(".")[0]; (groups[g] = groups[g] || []); if (groups[g].indexOf(n) < 0) groups[g].push(n); });
      Object.keys(groups).forEach(function (g) {
        var h = document.createElement("div");
        h.className = "pmq-harness-group";
        h.innerHTML = "<b>" + g + "</b>";
        groups[g].forEach(function (n) {
          var b = document.createElement("button");
          b.type = "button";
          b.textContent = n.split(".")[1];
          b.title = n;
          b.addEventListener("click", function () { window.__pmDemoTrigger(n, {}); });
          h.appendChild(b);
        });
        body.appendChild(h);
      });
      d.querySelector("[data-hclose]").addEventListener("click", function () { d.remove(); });
    });
  })();
  </script>
  <style>
    .pmq-harness {
      position: fixed; left: 8px; bottom: 8px; z-index: 90;

      border: 1px solid var(--border-strong, #999); border-radius: 10px;
      box-shadow: 0 8px 28px rgb(0 0 0 / .25);
      font: 11px/1.4 system-ui, sans-serif;
