<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5.6 Sol Assistant Chat — Visual Evidence Contact Sheet</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; background: #0b1015; color: #eef5fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { position: sticky; z-index: 3; top: 0; display: flex; align-items: end; justify-content: space-between; gap: 24px; padding: 20px 24px; border-bottom: 1px solid #33404a; background: rgb(11 16 21 / .94); backdrop-filter: blur(12px); }
    header span, figcaption span { color: #89a0ae; font-size: .72rem; font-weight: 760; letter-spacing: .11em; text-transform: uppercase; }
    h1 { margin: 3px 0 0; font-size: 1.45rem; }
    header strong { color: #6fd8ff; font-size: 1.25rem; }
    nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 24px 0; }
    nav button { min-height: 34px; padding: 6px 10px; border: 1px solid #33404a; border-radius: 5px; background: #141c22; color: #cbd8df; }
    nav button[aria-pressed="true"] { border-color: #6fd8ff; color: #6fd8ff; }
    main { padding: 8px 24px 48px; }
    section { scroll-margin-top: 90px; margin-top: 28px; }
    section > header { position: static; display: block; padding: 0 0 10px; border: 0; background: transparent; backdrop-filter: none; }
    h2 { margin: 0; font-size: 1.1rem; }
    section > header p { max-width: 82ch; margin: 4px 0 0; color: #9caeb8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 12px; }
    figure { min-width: 0; margin: 0; overflow: hidden; border: 1px solid #33404a; border-radius: 7px; background: #11191f; }
    figure a { display: block; aspect-ratio: 2 / 1; overflow: hidden; background: #06090c; }
    figure img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: top center; transition: transform 160ms ease-out; }
    figure:hover img { transform: scale(1.015); }
    figcaption { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; }
    figcaption strong { font-size: .8rem; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { figure img { transition: none; } figure:hover img { transform: none; } }
  </style>
</head>
<body>
  <header>
    <div><span>Assistant Chat visual acceptance evidence</span><h1>Concept family contact sheet</h1></div>
    <div><strong data-concept-model="5.6 Sol">5.6 Sol</strong><span> · 115 inspected frames</span></div>
  </header>
  <nav aria-label="Evidence groups">
    <button type="button" data-filter="all" aria-pressed="true">All evidence</button>
    <button type="button" data-filter="core">Theme × width</button>
    <button type="button" data-filter="question">Question grammars</button>
    <button type="button" data-filter="work">Work grammars</button>
    <button type="button" data-filter="state">Pressure states</button>
    <button type="button" data-filter="trigger">Corrected triggers</button>
  </nav>
  <main id="sheet"></main>
  <script>
    const themes = ["friendly-dark", "friendly-light", "retro-dark", "retro-light", "basic-dark", "basic-light", "glass-dark", "glass-light"];
    const widths = [520, 750, 975, 1200];
    const threads = Array.from({ length: 8 }, (_, index) => `thread-${String(index + 1).padStart(2, "0")}`);
    const stateFrames = [
      "state-decisions-offline.png",
      "state-artifact-error.png",
      "state-route-picker-520.png",
      "state-search-all-520.png",
      "state-durable-composer-520.png",
      "state-popout-context.png",
      "state-deterministic-controller.png"
    ];
    const correctedTriggers = [
      "activity.browser", "activity.edit", "activity.fetch", "activity.generate", "activity.read", "activity.search", "activity.test", "activity.thinking_summary",
      "artifact.close", "artifact.error", "artifact.loading", "artifact.ready", "artifact.switch",
      "decision.approval_open", "decision.approve", "decision.branch", "decision.deny", "decision.details",
      "diff.create", "diff.open", "diff.update",
      "goal.blocked", "goal.complete", "goal.pause", "goal.progress", "goal.replan", "goal.resume", "goal.start", "goal.update",
      "history.peek", "history.pin_compact", "history.pin_full", "history.switch_thread", "history.unpin",
      "question.cancel", "question.next", "question.open", "question.prepare", "question.select", "question.skip", "question.submit", "question.validation_error",
      "subagent.complete", "subagent.fail", "subagent.progress", "subagent.queue", "subagent.retry", "subagent.spawn",
      "system.port_collision", "system.reset", "system.worktree_collision",
      "thread.branch", "thread.receive_response", "thread.send_request", "thread.spawn_related",
      "todo.add", "todo.block", "todo.complete", "todo.reopen"
    ];
    const groups = [
      {
        id: "core",
        title: "Theme and width matrix",
        description: "Eight themes crossed with the required 520, 750, 975, and 1200 px Chat widths. Each theme uses a different diagonal window/thread pairing.",
        frames: themes.flatMap((theme) => widths.map((width) => ({ file: `${theme}-${width}.png`, label: `${theme.replaceAll("-", " ")} · ${width} px` })))
      },
      {
        id: "question",
        title: "Eight questionnaire grammars",
        description: "Each thread concept owns a different spatial question composition while sharing durable answer, skip, cancel, revisit, and submit semantics.",
        frames: threads.map((thread) => ({ file: `question-${thread}.png`, label: `${thread} · question lifecycle` }))
      },
      {
        id: "work",
        title: "Eight operational-work grammars",
        description: "Goal, Todo, subagent, Crew, activity, diff, and resource truth projected through eight distinct structures.",
        frames: threads.map((thread) => ({ file: `work-${thread}.png`, label: `${thread} · operational work` }))
      },
      {
        id: "state",
        title: "Pressure and recovery states",
        description: "Approvals, route warnings, offline transport, artifact failure, compact selectors, durable draft, pop-out context, and the prototype-only controller.",
        frames: stateFrames.map((file) => ({ file, label: file.replace(".png", "").replaceAll("-", " ") }))
      },
      {
        id: "trigger",
        title: "Revision-2 corrected trigger evidence",
        description: "All 59 exact contract events plus the separate scenario-reset capture. Visible receipts are paired with automated non-receipt semantic assertions in the raw browser receipts.",
        frames: [
          ...correctedTriggers.map((trigger) => ({ file: `trigger-${trigger.replace(".", "-")}.png`, label: trigger })),
          { file: "trigger-scenario-reset.png", label: "scenario.reset" }
        ]
      }
    ];
    const sheet = document.getElementById("sheet");
    for (const group of groups) {
      const section = document.createElement("section");
      section.dataset.group = group.id;
      section.innerHTML = `<header><h2>${group.title}</h2><p>${group.description}</p></header><div class="grid">${group.frames.map((frame) => `<figure><a href="frames/${frame.file}"><img src="frames/${frame.file}" alt="${frame.label} 5.6 Sol Assistant Chat rendered evidence" loading="lazy"></a><figcaption><strong>${frame.label}</strong><span>5.6 Sol</span></figcaption></figure>`).join("")}</div>`;
      sheet.append(section);
    }
    document.querySelector("nav").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-filter]");
      if (!button) return;
      document.querySelectorAll("nav button").forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
      document.querySelectorAll("main section").forEach((section) => { section.hidden = button.dataset.filter !== "all" && section.dataset.group !== button.dataset.filter; });
    });
  </script>
</body>
</html>
