/* =====================================================================
   Puppet Master Assistant — motion helpers
   ---------------------------------------------------------------------
   Pure-string builders plus two runtime helpers, shared by app.js and by
   every working-animation take. Loaded before app.js.

   Why string builders: renderApp() produces HTML and hands it to
   pmPatch(), which reconciles it into the living DOM. A node only gets
   created when it is genuinely new, so a CSS entrance animation on that
   node fires exactly once, when the thing it represents first appears.
   That means the cascade needs no JS orchestration at all -- give a row
   a data-k that encodes its identity and the motion follows for free.
   ===================================================================== */
(() => {
  'use strict';

  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  /* Split text into per-word spans so prose resolves a word at a time,
     the way the reference streams it (~1 word per 45-65ms). `from` lets
     a caller continue a cascade that started in an earlier block. */
  function words(text, from = 0, cap = 120) {
    const parts = String(text ?? '').split(/(\s+)/);
    let i = from, out = '';
    for (const p of parts) {
      if (!p) continue;
      if (/^\s+$/.test(p)) { out += p; continue; }
      out += `<span class="pm-word" style="--pm-stagger:${Math.min(i, cap)}">${esc(p)}</span>`;
      i++;
    }
    return out;
  }
  const wordCount = (text) => String(text ?? '').trim().split(/\s+/).filter(Boolean).length;

  /* A number that rolls when it changes. The data-k carries the value,
     so pmPatch replaces the inner node only on a real change -- which is
     precisely when the roll should play. */
  function roll(value, cls = '') {
    const v = esc(value);
    return `<span class="pm-roll ${cls}"><i data-k="roll:${v}">${v}</i></span>`;
  }

  /* First-Last-Invert-Play. Used for height and rail-position changes,
     which cannot be transitioned directly (height:auto, flex reflow). */
  function flip(nodes, mutate, opts = {}) {
    const list = Array.isArray(nodes) ? nodes : [nodes];
    const live = list.filter(Boolean);
    const first = new Map();
    live.forEach((n) => first.set(n, n.getBoundingClientRect()));
    mutate();
    const dur = opts.duration ?? 320;
    const ease = opts.easing ?? 'cubic-bezier(.22,.80,.28,1)';
    live.forEach((n) => {
      const a = first.get(n), b = n.getBoundingClientRect();
      if (!a || !b.width || !b.height) return;
      const dx = a.left - b.left, dy = a.top - b.top;
      const sx = a.width / b.width, sy = a.height / b.height;
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 &&
          Math.abs(sx - 1) < 0.01 && Math.abs(sy - 1) < 0.01) return;
      n.animate(
        [{ transformOrigin: 'top left', transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})` },
         { transformOrigin: 'top left', transform: 'none' }],
        { duration: dur, easing: ease, composite: 'replace' }
      );
    });
  }

  /* Animate a container between its current height and whatever it
     becomes after `mutate` -- the expand/collapse the reference uses
     when a past step is re-opened. */
  function flipHeight(el, mutate, opts = {}) {
    if (!el) { mutate(); return; }
    const from = el.getBoundingClientRect().height;
    mutate();
    const to = el.getBoundingClientRect().height;
    if (Math.abs(from - to) < 1) return;
    el.animate(
      [{ height: `${from}px` }, { height: `${to}px` }],
      { duration: opts.duration ?? 320, easing: opts.easing ?? 'cubic-bezier(.22,.80,.28,1)' }
    );
  }

  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  window.PM56_MOTION = { words, wordCount, roll, flip, flipHeight, reduced, esc };

  /* Registry for working-animation takes that live outside app.js.
     A take is `(ctx) => htmlString`; see makeWorkCtx() in app.js for the
     shape of ctx. Registering index N makes it option N in the mixer. */
  window.PM56_WORKING = window.PM56_WORKING || {};
})();

/* Working-animation takes — group a. Registered into window.PM56_WORKING.
   Each take is (ctx) => htmlString. See makeWorkCtx() in app.js for ctx.

   Takes 8..11. Four deliberately different readings of "the assistant is
   working". They share the measured motion vocabulary in motion.css but
   nothing structural:

     8  Step Rail     an accumulating rail of tool discs + bold verb,
                      collapsing to "14 tools used" with a rotating chevron
     9  Word Stream   prose only; tools fold inline as quiet chips
     10 Tool Collapse the tools are the content; an overlapping avatar-stack
                      that fans out on click with a FLIP
     11 Diff Tape     a receipt-printer tape of numeric diff lines

   Patch discipline (renderApp reconciles with pmPatch, it does not
   replace innerHTML):
     - a CSS entrance fires only when a node is genuinely NEW,
     - data-k is the identity that decides "new",
     - anything that must survive the 1050ms tick carries a constant key,
     - anything that must replay on a step change carries the step id.
   ===================================================================== */
(() => {
  'use strict';
  const W = window.PM56_WORKING;
  const M = window.PM56_MOTION;
  const esc = M.esc;

  /* =====================================================================
     8 — STEP RAIL
     ---------------------------------------------------------------------
     The reference mechanic. Measured from sheets/rail3.jpg:
       f0477  old label out, new label in at ~0.3 alpha        (~90ms)
       f0480  new disc begins to grow, ~65ms after the label   (~150ms)
       f0486  disc settled, tint and ring resolved
       f0494+ shimmer band crosses the bold verb only
     and sheets/collapse_rail.jpg for the collapse to "13 tools used" plus
     the chevron rotation, and sheets/hover_open.jpg for hover-to-reopen.
     ===================================================================== */

  /* [gerund, past participle, grey count] — the reference label is always
     "bold verb" + "grey count", e.g. "Making 1 edit" / "13 tools used". */
  const RAIL = {
    prepare:  ['Preparing',  'Prepared',  '3 checks'],
    think:    ['Thinking',   'Thought',   '4 signals'],
    files:    ['Exploring',  'Explored',  '3 files'],
    search:   ['Searching',  'Searched',  '3 sources'],
    fetch:    ['Fetching',   'Fetched',   '4 pages'],
    browser:  ['Inspecting', 'Inspected', '2 traces'],
    bash:     ['Profiling',  'Profiled',  '3 benchmarks'],
    agents:   ['Delegating', 'Delegated', '2 agents'],
    edit:     ['Making',     'Made',      '3 edits'],
    app:      ['Driving',    'Drove',     '1 inspector'],
    test:     ['Testing',    'Tested',    '14 assertions'],
    validate: ['Validating', 'Validated', '42 checks'],
    render:   ['Rendering',  'Rendered',  '2 artifacts'],
    complete: ['Finishing',  'Finished',  '14 tools']
  };
  const railMeta = (s) => RAIL[s.id] || [s.label, s.label, ''];

  /* Detail rows differ by what the step actually produced, so the block
     under the rail is never the same shape twice in a row. */
  function rail8Rows(ctx, s) {
    if (s.kind === 'edit') {
      return ctx.D.changes.map((c) => ({ text: 'Edited ' + c.path, add: c.add, del: c.del }));
    }
    if (s.kind === 'agents') {
      return ctx.D.subagents.slice(0, 2).map((a) => ({ text: a.name + ' · ' + a.current, tag: a.status }));
    }
    return (s.evidence || []).slice(0, 3).map((e) => ({ text: e }));
  }

  function rail8Row(r, i, key) {
    let meta = '';
    if (r.add != null) {
      meta = `<span class="rail8-meta"><b class="rail8-add">+${r.add}</b><b class="rail8-del">−${r.del}</b></span>`;
    } else if (r.tag) {
      meta = `<span class="rail8-meta"><b class="rail8-tag">${esc(r.tag)}</b></span>`;
    }
    /* stagger starts at 1 so the first row lands at 175ms + 45ms = 220ms,
       the measured "old out -> new label -> first row" handoff. */
    return `<span class="rail8-row pm-materialize" data-k="${key}" style="--pm-stagger:${i}"><span class="rail8-rowtext">${esc(r.text)}</span>${meta}</span>`;
  }

  W[8] = (ctx) => {
    const { D, icon, index, total, completed, running, step, workReceipt } = ctx;
    const steps = ctx.steps;

    /* Three states. `shut` is the finished collapse; `past` is a step the
       reader re-opened from the collapsed rail; otherwise the live run. */
    const shut = completed && index === total - 1;
    const list = completed ? steps : steps.slice(0, index + 1);
    const editIdx = Math.max(0, steps.findIndex((s) => s.kind === 'edit'));

    /* An accumulating rail. `enter` only ever lands on a node that pmPatch
       has just created, so pm-disc-in plays once per step and never on a
       plain re-render. The previous disc simply changes class and lets its
       width/tint transition run — that is the demotion in the reference. */
    const track = list.map((s, i) => {
      const cur = !shut && i === index;
      const cls = 'pm-rail-item rail8-item ' + (cur ? 'current enter' : 'done');
      const act = completed ? ` data-action="inspect-work-step" data-value="${i}"` : '';
      const btn = `<button type="button" class="${cls}" data-k="ri:${s.id}"${act} title="${esc(s.label)} · ${esc(s.verb)}" aria-label="${esc(s.label)}">${icon(s.icon, 11)}</button>`;
      if (!completed) return btn;
      const m = railMeta(s);
      const pop = `<span class="rail8-pop" data-k="p8:${s.id}"><span class="rail8-pastlabel"><b>${esc(m[1])}</b><i>${esc(m[2])}</i></span><span class="rail8-poprows pm-rows">${rail8Rows(ctx, s).map((r, j) => rail8Row(r, j, `pp8:${s.id}:${j}`)).join('')}</span></span>`;
      return btn + pop;
    }).join('');

    const m = railMeta(step);
    /* Verb and count are keyed by step id, so pmPatch re-mounts them on a
       real swap and only then: the 90ms settle plays once per handoff and
       never on a plain re-render. The 1370ms shimmer rides the same node —
       its band is inside the box from ~493ms to ~973ms, comfortably within
       the 1050ms a step lasts, so one full crossing is seen per step. */
    const label = shut
      ? `<span class="rail8-head-label" data-k="l8"><span class="rail8-sum">${M.roll(total)} tools used</span></span>`
      : `<span class="rail8-head-label" data-k="l8"><span class="rail8-verb ${running ? 'pm-shimmer' : 'pm-shimmer pm-settled'}" data-k="v8:${step.id}">${esc(completed ? m[1] : m[0])}</span><span class="rail8-count" data-k="c8:${step.id}">${esc(m[2])}</span></span>`;

    const chev = completed
      ? `<button type="button" class="rail8-chev ${shut ? '' : 'open'}" data-k="chev8" data-action="inspect-work-step" data-value="${shut ? editIdx : total - 1}" title="${shut ? 'Re-open the editing step' : 'Collapse back to the summary'}">${icon('down', 12)}</button>`
      : '';

    const under = shut
      ? `<span class="rail8-idle" data-k="idle8">${workReceipt()}</span>`
      : rail8Rows(ctx, step).map((r, j) => rail8Row(r, j, `r8:${step.id}:${j}`)).join('');

    return `<div class="rail8 ${completed ? 'done8' : ''}" data-k="rail8" style="--rail8-n:${total}">`
      + `<div class="rail8-head" data-k="rail8-head"><span class="pm-rail rail8-track" data-k="rail8-track">${track}</span>${label}<span class="rail8-spacer"></span>${chev}</div>`
      + `<div class="rail8-under pm-rows" data-k="u8">${under}</div>`
      + `</div>`;
  };
  W[8].ownsAgents = true;

  /* =====================================================================
     9 — WORD STREAM
     ---------------------------------------------------------------------
     Prose, and effectively nothing else. Measured from sheets/prose_stream.jpg:
     one word arrives every 2 frames (~43-65ms), each word resolving out of
     blur and out of grey on its own rather than the paragraph fading as a
     block. Tool calls are not rows here — they fold into the sentence as
     quiet chips, so the reader never leaves the reading path.

     Only the last three clauses stay mounted; older ones recede by opacity
     (a transition on a surviving node, not a re-entrance).
     ===================================================================== */
  const NARR = {
    prepare: ['I have the thread pinned to ', { i: 'branch', t: 'feature/query-index' }, ' and the tool policy read, so nothing here will surprise us later.'],
    think: ['The shape of this is read-heavy, about ninety-five percent reads, so the real question is selectivity against write pressure.'],
    files: ['Reading ', { i: 'folder-search', t: 'queries.rs' }, ' and ', { i: 'document', t: 'schema.rs' }, ', the fan-out sits exactly where I expected: three call sites resolving events one row at a time.'],
    search: ['I checked ', { i: 'search', t: 'multicolumn index order' }, ' against primary documentation rather than trusting memory on column order.'],
    fetch: ['Pulled ', { i: 'download', t: '4 primary pages' }, ' and kept only the seven sections that actually govern the leading column.'],
    browser: ['On the live dashboard the slow path reproduces cleanly at ', { i: 'globe', t: 'p95 482 ms' }, ', and the console is quiet, so this is the database and not the client.'],
    bash: ['A single ', { i: 'terminal', t: 'EXPLAIN ANALYZE' }, ' over a hundred and twenty-eight thousand rows confirms the sequential scan.'],
    agents: ['I handed the two independent reviews to ', { i: 'users', t: 'Query Analyzer' }, ' and ', { i: 'users', t: 'Schema Reviewer' }, ' so they can read in parallel while I write.'],
    edit: ['Now the change itself. ', { i: 'file-edit', t: 'migration 0043' }, ' adds the tenant-first composite index, and two call sites collapse into one batched query.'],
    app: ['I refreshed the inspector so the planner can see the new index, and it picks it up immediately.'],
    test: ['Replayed the real dashboard workflow at both widths; ', { i: 'flask', t: '14 assertions' }, ' pass with nothing clipped.'],
    validate: ['Everything is green: ', { i: 'check-circle', t: '42 tests' }, ', lint and types clean, and p95 lands at seventy-one milliseconds.'],
    render: ['I rendered the comparison as ', { i: 'chart', t: 'Query Benchmark Dashboard' }, ' so the numbers stay inspectable instead of quoted.'],
    complete: ['That is the whole change: eighty-six percent off p95, three files touched, and the rollback is one dropped index.']
  };

  /* Prose and chips share one cascade counter, so a chip lands on the beat
     the sentence would have given that word. */
  function clause9(tokens, icon) {
    let n = 0, out = '';
    for (const t of tokens) {
      if (typeof t === 'string') { out += M.words(t, n); n += M.wordCount(t); }
      else {
        out += `<span class="ws-chip" style="--pm-stagger:${n}">${icon(t.i, 10)}<b>${esc(t.t)}</b></span>`;
        n += 1;
      }
    }
    return out;
  }

  W[9] = (ctx) => {
    const { steps, index, running, completed, icon, formatElapsed, elapsed } = ctx;
    const from = Math.max(0, index - 2);
    let body = '';
    for (let i = from; i <= index; i++) {
      const s = steps[i];
      const tokens = NARR[s.id] || [s.detail];
      /* data-step-kind re-resolves --pm-step inside the clause, so each
         sentence keeps the hue of the tool it is describing. */
      body += `<span class="ws-clause pm-stream" data-k="wc:${s.id}" data-step-kind="${esc(s.kind)}" data-age="${index - i}">`
        + clause9(tokens, icon)
        + (i === index && running ? `<span class="ws-caret" data-k="ws-caret"></span>` : '')
        + `</span>`;
    }
    const coda = completed
      ? `<span class="ws-coda" data-k="ws-coda">Worked for ${esc(formatElapsed(elapsed))} · 14 tools · 3 files · 2 agents · 42 tests · 2 artifacts.</span>`
      : '';
    return `<div class="ws9" data-k="ws9"><div class="ws9-flow" data-k="ws9-flow">${body}</div>${coda}</div>`;
  };
  W[9].ownsAgents = true;

  /* =====================================================================
     10 — TOOL COLLAPSE
     ---------------------------------------------------------------------
     Inverse emphasis: the tools are the subject, the prose is a footnote.
     A live avatar-stack of tool discs grows as the run proceeds behind a
     rolling "N tools used"; clicking unpacks it into a full row.

     The fan state is take-local, held here rather than in app state, and
     is re-emitted into the class list every render so the 1050ms tick
     cannot silently close it. The unpack itself is a real FLIP: measure,
     swap the margins, invert, play.
     ===================================================================== */
  let fanOpen = false;
  const A = (window.PM56_A = window.PM56_A || {});
  A.fan = function (el) {
    const root = el.closest ? el.closest('.tc10') : null;
    if (!root) return;
    const items = Array.prototype.slice.call(root.querySelectorAll('.tc10-item'));
    fanOpen = !fanOpen;
    const mutate = () => { root.classList.toggle('fanned', fanOpen); };
    if (M.reduced()) mutate();
    else M.flip(items, mutate, { duration: 340, easing: 'cubic-bezier(.22,.80,.28,1)' });
  };

  W[10] = (ctx) => {
    const { steps, index, completed, running, icon, commandForStep, step } = ctx;
    const list = completed ? steps : steps.slice(0, index + 1);
    const n = list.length;

    /* Run order, right-anchored. Reversing the list made every disc move --
       which was the point -- but it also made the unpacked summary read
       backwards, with "Preparing" last. Anchoring the pile on its right edge
       gets the same displacement from chronological order: tools append at
       the end, the right edge stays put, so everything already in the pile
       slides left to make room. data-flip-move plays that back over 420ms
       instead of teleporting; the key is the step id, which never changes,
       so a disc that MOVES is never also re-mounted -- only the genuinely
       new one pops. Newest sits on top, so z-index climbs with position. */
    const shown = list;
    const stack = shown.map((s, i) => {
      const live = !completed && i === n - 1;
      return `<span class="tc10-item ${live ? 'live' : ''}" data-flip-move data-k="tk:${s.id}" style="z-index:${i + 1}" title="${esc(s.label)}">${icon(s.icon, 13)}</span>`;
    }).join('');

    const names = shown.map((s, i) => `<span class="tc10-name" data-k="tn:${s.id}" style="--pm-stagger:${i}">${esc(s.label)}</span>`).join('');

    return `<div class="tc10 ${fanOpen ? 'fanned' : ''} ${completed ? 'done10' : ''}" data-k="tc10">`
      + `<div class="tc10-top" data-k="tc10-top"><span class="tc10-count"><b>${M.roll(n)}</b> tool${n === 1 ? '' : 's'} used</span><span class="tc10-spacer"></span><button type="button" class="tc10-chev" onclick="PM56_A.fan(this)" data-k="tc10-chev" title="Fan the tool stack out or pack it back">${icon('chevron', 12)}</button></div>`
      + `<div class="tc10-stackwrap" onclick="PM56_A.fan(this)" data-k="tc10-stackwrap" title="Click to unpack the stack"><span class="tc10-stack" data-k="tc10-stack">${stack}</span></div>`
      + `<div class="tc10-foot pm-rows" data-k="tc10-foot">`
      + `<span class="tc10-line" data-k="tl:${step.id}"><b class="${running ? 'pm-shimmer' : 'pm-shimmer pm-settled'}">${esc(step.label)}</b><code>${esc(commandForStep(step))}</code></span>`
      + `<span class="tc10-names" data-k="tc10-names">${names}</span>`
      + `</div></div>`;
  };
  W[10].ownsAgents = true;

  /* =====================================================================
     11 — DIFF TAPE
     ---------------------------------------------------------------------
     Typographic and numeric: no discs, no icons. A receipt tape whose
     newest lines print in at the bottom and push everything above them up
     out of frame. The upward scroll is not a transform — each new row
     animates its own height from zero, so a bottom-anchored clipped column
     does the scrolling for free and every line above moves in step.

     One row per step was too little event: a single work step really
     produces several tape entries, so each step emits two or three — a
     read, a measurement, a write — and they print in sequence, one per
     140ms beat, not as a block. Within a beat the line does two things:
     the paper advances (height 0 -> 20px) and then the ink lands, column
     by column, verb -> path -> leader -> number. The head counters are
     odometers that step once per landing row rather than jumping on the
     handoff frame, so there is something continuous to track while the
     paper moves.

     Numerals roll on change; additions flash green once and deletions red
     once, on the beat their line arrives, then settle to muted.
     ===================================================================== */
  const TAPE = {
    prepare:  [{ v: 'read', p: '.pm/policy.toml',                      k: 'ln', n: 38 },
               { v: 'head', p: 'git · feature/query-index',            k: 'no', n: 1, u: 'ref' },
               { v: 'list', p: 'tools · allowlist',                    k: 'no', n: 9, u: 'tools' }],
    think:    [{ v: 'note', p: 'selectivity vs write pressure',        k: 'no', n: 4, u: 'signals' },
               { v: 'calc', p: 'workload mix · read vs write',         k: 'no', n: '95%', u: 'reads' },
               { v: 'rank', p: 'index shapes · tenant-first',          k: 'no', n: 3, u: 'options' }],
    files:    [{ v: 'read', p: 'src/analytics/queries.rs',             k: 'ln', n: 412 },
               { v: 'read', p: 'src/analytics/schema.rs',              k: 'ln', n: 196 },
               { v: 'grep', p: 'resolve_events · call sites',          k: 'no', n: 3, u: 'sites' }],
    search:   [{ v: 'find', p: 'postgresql.org · multicolumn',         k: 'no', n: 3, u: 'hits' },
               { v: 'find', p: 'postgresql.org · concurrent refresh',  k: 'no', n: 2, u: 'hits' },
               { v: 'keep', p: 'primary sources only',                 k: 'no', n: 5, u: 'kept' }],
    fetch:    [{ v: 'get',  p: 'docs/pg/indexes-multicolumn',          k: 'no', n: 7, u: 'sections' },
               { v: 'get',  p: 'docs/pg/rules-materializedviews',      k: 'no', n: 4, u: 'sections' },
               { v: 'cite', p: 'leading-column rule',                  k: 'no', n: 2, u: 'quotes' }],
    browser:  [{ v: 'open', p: 'dashboard/query-performance',          k: 'no', n: 1, u: 'route' },
               { v: 'trace',p: 'analytics.events · p50',               k: 'ms', n: 96 },
               { v: 'trace',p: 'analytics.events · p95',               k: 'ms', n: 482 }],
    bash:     [{ v: 'gen',  p: 'fixtures/events.ndjson',               k: 'ln', n: 128400 },
               { v: 'plan', p: 'EXPLAIN ANALYZE · seq scan',           k: 'no', n: 0, u: 'index' },
               { v: 'run',  p: 'cargo bench analytics_query',          k: 'ms', n: 482 }],
    agents:   [{ v: 'spawn',p: 'agent/query-analyzer · read-only',     k: 'no', n: 1, u: 'agent' },
               { v: 'spawn',p: 'agent/schema-reviewer · read-only',    k: 'no', n: 1, u: 'agent' },
               { v: 'wait', p: 'two reviews in parallel',              k: 'no', n: 2, u: 'agents' }],
    edit:     [{ v: 'new',  p: 'migrations/0043_tenant_created.sql',   k: 'diff', a: 18, d: 0 },
               { v: 'edit', p: 'src/analytics/queries.rs',             k: 'diff', a: 51, d: 14 },
               { v: 'edit', p: 'src/analytics/bench.rs',               k: 'diff', a: 31, d: 3 }],
    app:      [{ v: 'open', p: 'app/database-inspector',               k: 'no', n: 1, u: 'window' },
               { v: 'sync', p: 'schema · metadata refresh',            k: 'no', n: 1, u: 'refresh' },
               { v: 'check',p: 'planner · idx_tenant_created',         k: 'no', n: 1, u: 'index' }],
    test:     [{ v: 'run',  p: 'query-dashboard.spec · 1280px',        k: 'ok', n: 9 },
               { v: 'run',  p: 'query-dashboard.spec · 720px',         k: 'ok', n: 5 },
               { v: 'pass', p: 'no clipped rows at either width',      k: 'ok', n: 14 }],
    validate: [{ v: 'pass', p: 'cargo test --all',                     k: 'ok', n: 42 },
               { v: 'lint', p: 'clippy · rustfmt · lsp',               k: 'ok', n: 3 },
               { v: 'stat', p: 'working tree · staged',                k: 'no', n: 3, u: 'files' }],
    render:   [{ v: 'make', p: 'artifact/benchmark-dashboard',         k: 'no', n: 2, u: 'artifacts' },
               { v: 'write',p: 'artifact/p95-series.csv',              k: 'ln', n: 128 }],
    complete: [{ v: 'p95',  p: 'analytics.events · 482 ms → 71 ms',    k: 'ms', n: 71 },
               { v: 'drop', p: 'rollback · one index',                 k: 'no', n: 1, u: 'step' }]
  };

  function tape11Right(r) {
    if (r.k === 'diff') return `<b class="dt-add">+${esc(r.a)}</b><b class="dt-del">−${esc(r.d)}</b>`;
    if (r.k === 'ms') return `<b class="dt-ms">${esc(r.n)}</b><i>ms</i>`;
    if (r.k === 'ok') return `<b class="dt-ok">${esc(r.n)}</b><i>ok</i>`;
    if (r.k === 'ln') return `<b class="dt-ln">${esc(r.n.toLocaleString('en-US'))}</b><i>ln</i>`;
    return `<b class="dt-ln">${esc(r.n)}</b><i>${esc(r.u || 'hits')}</i>`;
  }

  /* A head counter that steps once per landing row instead of jumping on
     the handoff frame. seq[0] is the value already on screen; every later
     entry carries `b`, the row index within the step whose beat it should
     land on. The whole odometer is keyed by its final value, so pmPatch
     re-mounts it — and so replays it — exactly when the number really
     changes, and never on the 1050ms tick. */
  function dtOdo(seq, name) {
    const n = seq.length;
    const body = seq.map((s, i) => {
      const outB = i + 1 < n ? seq[i + 1].b : null;
      const cls = ['dt-odo-v'];
      const st = [];
      if (s.b != null) { cls.push('in'); st.push(`--dt-in:${esc(s.b)}`); }
      if (outB != null) { cls.push('out'); st.push(`--dt-out:${esc(outB)}`); }
      else cls.push('now');
      return `<i class="${cls.join(' ')}" style="${st.join(';')}">${esc(s.v)}</i>`;
    }).join('');
    return `<span class="dt-odo" data-k="odo:${esc(name)}:${esc(seq[n - 1].v)}">${body}</span>`;
  }

  W[11] = (ctx) => {
    const { steps, index, completed, formatElapsed, elapsed } = ctx;
    let add = 0, del = 0, touched = 0;
    const rows = [];
    steps.slice(0, index + 1).forEach((s, si) => {
      (TAPE[s.id] || []).forEach((e, j) => {
        if (e.k === 'diff') { add += e.a; del += e.d; touched += 1; }
        rows.push(Object.assign({ sid: s.id, kind: s.kind, j: j, fresh: si === index }, e));
      });
    });

    /* The rows this step is printing right now. Their index within the step
       is both the print beat and the beat the counters step on. */
    const cur = rows.filter((r) => r.fresh);
    const base = rows.length - cur.length;
    const lineSeq = [{ v: base }].concat(cur.map((r, i) => ({ v: base + i + 1, b: r.j })));
    let a0 = add, d0 = del;
    cur.forEach((r) => { if (r.k === 'diff') { a0 -= r.a; d0 -= r.d; } });
    const addSeq = [{ v: a0 }], delSeq = [{ v: d0 }];
    let ar = a0, dr = d0;
    cur.forEach((r) => {
      if (r.k !== 'diff') return;
      if (r.a) { ar += r.a; addSeq.push({ v: ar, b: r.j }); }
      if (r.d) { dr += r.d; delSeq.push({ v: dr, b: r.j }); }
    });

    /* Six 20px rows fit the 120px window. A row further than six from the end
       is behind the clip once the step has finished printing -- but it cannot
       be unmounted, because the column is bottom-anchored and those rows are
       what the new ones push against; dropping them would collapse the tape
       for the length of the print. So it is *retired* instead: it keeps its
       place in flow and stays painted through the print, then takes
       visibility:hidden once it is genuinely behind the edge (dt-retire, 620ms,
       comfortably after the last row reaches full height at 460ms).
       Pixel-wise this changes nothing -- those rows are already clipped, and a
       control render with them deleted is byte-identical. What it changes is
       the geometry: getBoundingClientRect() reports a clipped row at its
       unclipped position, which is above the tape and therefore on top of the
       header, and that had a rect-based probe reporting the header count as
       colliding with a row nobody can see. A retired row is honestly invisible
       to any probe that reads visibility. */
    /* Six when the window is all rows; five once the completion total is in
       it, because that row is 26px plus a 4px rule and eats a row and a half
       of the 120px. */
    const FOLD = completed ? 5 : 6;
    const last = rows.length - 1;
    let tape = rows.map((r, ri) => (
      `<span class="dt-row${r.fresh ? ' fresh' : ''}${ri < rows.length - FOLD ? ' retired' : ''}"`
      + ` data-k="dt:${r.sid}:${r.j}"`
      + ` data-step-kind="${esc(r.kind)}" style="--pm-stagger:${esc(r.j)}">`
      + `<i class="dt-v">${esc(r.v)}</i>`
      + `<i class="dt-p">${esc(r.p)}</i>`
      + `<i class="dt-lead"></i>`
      + `<i class="dt-n">${tape11Right(r)}</i>`
      + (ri === last && !completed ? `<i class="dt-feed" data-k="dt-feed"></i>` : '')
      + `</span>`
    )).join('');

    if (completed) {
      tape += `<span class="dt-row dt-total" data-k="dt:total" style="--pm-stagger:${esc(cur.length)}">`
        + `<i class="dt-v">total</i><i class="dt-p">${esc(touched)} files changed</i><i class="dt-lead"></i>`
        + `<i class="dt-n"><b class="dt-add">+${esc(add)}</b><b class="dt-del">−${esc(del)}</b></i></span>`;
    }

    const head = `<div class="dt-head" data-k="dt-head">`
      + `<span class="dt-clock">${M.roll(formatElapsed(elapsed))}</span>`
      + `<span class="dt-sep">/</span>`
      + `<span class="dt-lines">${dtOdo(lineSeq, 'lines')}<i>lines</i></span>`
      + `<span class="dt-spacer"></span>`
      + `<span class="dt-tot"><b class="dt-add">+${dtOdo(addSeq, 'add')}</b>`
      + `<b class="dt-del">−${dtOdo(delSeq, 'del')}</b></span>`
      + `</div>`;

    return `<div class="dt11 ${completed ? 'done11' : ''}" data-k="dt11">${head}`
      + `<div class="dt-tape" data-k="dt-tape">${tape}</div></div>`;
  };
  W[11].ownsAgents = true;
})();

/* Working-animation takes — group b. Registered into window.PM56_WORKING.
   Each take is (ctx) => htmlString. See makeWorkCtx() in app.js for ctx.

   Group b is the abstract / spatial end of the range:
     12  Signal Meter   — concentric arc gauges + a live scope trace. No prose.
     13  Blueprint      — the run draws itself as an inked schematic.
     14  Timeline Scrub — the whole run on a time axis, scrubbable.
     15  Terminal Cast  — asciinema-style typing transcript.

   Motion contract (see the note above pmPatch in app.js): renderApp()
   reconciles rather than replaces, so a keyframe entrance fires exactly
   when a node is genuinely new. Every take below keys its nodes by the
   thing they represent, so entrances play once and CSS transitions --
   which need a surviving node -- carry the per-tick state changes.
   Timings come from motion.css, which derived them from the reference
   recording frame by frame. Nothing here invents a duration.            */
(() => {
  'use strict';
  const W = window.PM56_WORKING;
  const M = window.PM56_MOTION;

  /* ==================================================================
     Shared, deterministic run fixtures for group b.
     DUR sums to 134s, which is exactly the elapsed time completeWorking()
     settles on, so the timeline axis and the shared receipt agree.
     ================================================================== */
  const DUR = [4, 8, 11, 8, 6, 9, 12, 15, 17, 7, 10, 12, 9, 6];
  const CUM = DUR.reduce((a, d) => (a.push(a[a.length - 1] + d), a), [0]);
  const RUN_T = CUM[CUM.length - 1];                    // 134

  /* Four-character channel codes. Take 12 and 13 read as instruments, so
     they never spell a word out -- they use the register code instead. */
  const CODE = {
    prepare: 'PREP', thought: 'COGN', files: 'READ', 'web-search': 'SRCH',
    'web-fetch': 'FTCH', browser: 'BRWS', bash: 'EXEC', agents: 'FORK',
    edit: 'WRIT', app: 'CTRL', test: 'PROB', validate: 'VRFY',
    artifact: 'RNDR', complete: 'DONE'
  };
  const codeFor = (s) => CODE[s && s.kind] || 'OPER';
  const clockAt = (t) => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;

  /* ==================================================================
     12 — SIGNAL METER
     ------------------------------------------------------------------
     An instrument cluster. Three concentric gauges (phase / flow /
     confidence) fill by transitioning stroke-dashoffset on a path whose
     pathLength is normalised to 100, so the value IS the offset. A scope
     trace scrolls continuously underneath; its amplitude follows the
     throughput signal via a transitioned scaleY on the trace wrapper.
     There is no step list and no sentence anywhere in this take.
     ================================================================== */

  /* Throughput, confidence and the p95 the fixtures quote (482ms baseline
     at the bench step, 71ms once validation lands). Cumulative tool count
     ends at 14, which is the number the shared receipt reports. */
  const FLOW = [10, 26, 48, 62, 55, 70, 88, 73, 94, 64, 82, 76, 58, 30];
  const CONF = [6, 16, 25, 33, 41, 50, 57, 63, 71, 78, 85, 92, 97, 100];
  const P95 = [482, 482, 482, 482, 482, 482, 482, 482, 318, 262, 205, 71, 71, 71];
  const OPS = [0, 1, 3, 4, 6, 7, 9, 11, 12, 13, 14, 14, 14, 14];

  /* A 280-degree gauge arc, opening at the bottom. */
  function arcPath(cx, cy, r, a0, sweep) {
    const rad = (d) => (d * Math.PI) / 180;
    const x1 = cx + r * Math.cos(rad(a0)), y1 = cy + r * Math.sin(rad(a0));
    const x2 = cx + r * Math.cos(rad(a0 + sweep)), y2 = cy + r * Math.sin(rad(a0 + sweep));
    return `M${x1.toFixed(2)} ${y1.toFixed(2)}A${r} ${r} 0 ${sweep > 180 ? 1 : 0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
  }
  const ARC = [50, 39.5, 29].map((r) => arcPath(59, 59, r, 130, 280));

  /* Two identical tiles of a band-limited trace. Every component period
     divides the 240-unit tile, so translating by exactly one tile is
     seamless and the scroll never shows a seam. */
  const WAVE = (() => {
    const comps = [[240, 7.4, 0.4], [120, 4.6, 1.9], [80, 3.1, 3.4], [48, 2.0, 0.7], [30, 1.2, 2.6]];
    let d = '';
    for (let x = 0; x <= 480; x += 2) {
      let y = 22;
      for (const c of comps) y += c[1] * Math.sin((2 * Math.PI * x) / c[0] + c[2]);
      d += (x ? 'L' : 'M') + x + ' ' + y.toFixed(2);
    }
    return d;
  })();

  W[12] = (ctx) => {
    const { esc, D, index, step, running, completed, elapsed, formatElapsed, steps, icon } = ctx;
    const last = steps.length - 1;
    const phase = Math.round((index / last) * 100);
    const flow = completed ? 0 : FLOW[index];
    const conf = CONF[index];
    const code = codeFor(step);
    const amp = (0.16 + (flow / 100) * 0.84).toFixed(3);
    const chan = `${String(index + 1).padStart(2, '0')}/${last + 1}`;
    const stateCode = completed ? 'HOLD' : running ? 'LIVE' : 'PAUS';

    const gauge = (i, cls, v) =>
      `<path class="pm12-trk ${cls}" d="${ARC[i]}" pathLength="100"/>` +
      `<path class="pm12-val ${cls}" data-k="arc:${cls}" d="${ARC[i]}" pathLength="100" style="stroke-dashoffset:${100 - v}"/>`;

    const meter = (k, cls, label, value, unit) =>
      `<div class="pm12-m" data-k="m:${k}"><label><i class="${cls}"></i>${esc(label)}</label>` +
      `<b>${M.roll(value)}<u>${esc(unit)}</u></b></div>`;

    /* Child agents arrive as extra channels on the same instrument rather
       than as a card of prose underneath it -- see ownsAgents below. */
    const subs = step.kind === 'agents' ? D.subagents.slice(0, 2) : [];
    const subRows = subs.length ? `<div class="pm12-subs" data-k="subs">${subs.map((a, i) => {
      const st = a.status === 'blocked' ? 'BLK' : a.status === 'working' ? 'RUN' : 'OK';
      return `<button class="pm12-sub ${esc(a.status)}" data-k="sub:${esc(a.id)}" data-action="open-agent" data-id="${esc(a.id)}" title="${esc(a.name)} · ${esc(a.current)}">
        <span class="pm12-sub-ch">SUB ${String(index + 1).padStart(2, '0')}.${i + 1}</span>
        <span class="pm12-sub-bar"><i style="width:${Number(a.progress) || 0}%"></i></span>
        <span class="pm12-sub-v">${M.roll(Number(a.progress) || 0)}<u>%</u></span>
        <span class="pm12-sub-st ${esc(a.status)}">${st}</span>
      </button>`;
    }).join('')}</div>` : '';

    return `<div class="pm12" data-k="pm12" role="img" aria-label="Signal meter: channel ${esc(chan)}, ${esc(code)}, phase ${phase} percent, throughput ${flow} percent, confidence ${conf} percent">
<div class="pm12-cluster">
  <div class="pm12-gauge" data-k="gauge">
    <svg viewBox="0 0 118 118" width="118" height="118" aria-hidden="true">
      ${gauge(0, 'a', phase)}${gauge(1, 'b', flow)}${gauge(2, 'c', conf)}
    </svg>
    <div class="pm12-core"><b>${M.roll(phase)}<u>%</u></b><span>PHASE</span></div>
  </div>
  <div class="pm12-right">
    <div class="pm12-chan">
      <span class="pm12-ch">CH ${esc(chan)}</span>
      <strong class="${running ? 'pm-shimmer' : 'pm-shimmer pm-settled'}" data-k="code:${esc(code)}">${esc(code)}</strong>
      <span class="pm12-sp"></span>
      <span class="pm12-st ${stateCode.toLowerCase()}">${esc(stateCode)}</span>
      <span class="pm12-clock">${esc(formatElapsed(elapsed))}</span>
    </div>
    <div class="pm12-scope" data-k="scope">
      <svg class="pm12-grid" viewBox="0 0 240 44" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 11H240M0 22H240M0 33H240"/>
      </svg>
      <div class="pm12-amp" style="--amp:${amp}">
        <svg class="pm12-trace" viewBox="0 0 240 44" preserveAspectRatio="none" aria-hidden="true">
          <g class="pm12-scroll ${running ? '' : 'held'}" data-k="scroll"><path d="${WAVE}" vector-effect="non-scaling-stroke"/></g>
        </svg>
      </div>
      <i class="pm12-head"></i>
    </div>
    <div class="pm12-meters">
      ${meter('flow', 'b', 'FLOW', flow, '%')}
      ${meter('conf', 'c', 'CONF', conf, '%')}
      ${meter('p95', 'd', 'P95', P95[index], 'ms')}
      ${meter('ops', 'e', 'OPS', OPS[index], '')}
    </div>
  </div>
</div>
<div class="pm12-reg" data-k="reg">${steps.map((s, i) =>
      `<i data-k="tk:${esc(s.id)}" class="${i < index ? 'done' : i === index ? 'now' : ''}"></i>`).join('')}</div>
${subRows}
${completed ? ctx.workReceipt() : ''}</div>`;
  };
  /* The instrument reports its own child channels, so the shared inline
     agent list must not also be appended underneath it. */
  W[12].ownsAgents = true;

  /* ==================================================================
     13 — BLUEPRINT
     ------------------------------------------------------------------
     The run inks itself onto a drafting grid. Future steps sit on the
     sheet as dashed ghosts, so you can read where the work is going;
     as each step lands the ghost is replaced by an inked node and the
     trace that reaches it strokes itself on (stroke-dashoffset, with
     pathLength normalised to 1 so one keyframe fits every edge length).
     A pen head runs ahead of the wet ink, and a drafting crosshair
     glides from station to station instead of cutting.

     Staging. The handoff is a drafting gesture, so it plays as a
     sequence rather than a swap -- each beat waits for the one before
     it to arrive:
        0-300ms  the trace strokes on, heavy and step-coloured, with the
                 pen head at its tip; the crosshair glides to the new
                 station (360ms on the measured pop easing); the station
                 the run just left demotes to grey over 260ms
       300-470   the node inks -- the disc pops only once the pen arrives
       340-470   the callout caption slides in behind it
       430-540   the station code fades up beneath the node
     The edge one step ahead marches while it waits, so the sheet says
     where the pen is going before it gets there.
     ================================================================== */

  const LANE = { up: 44, mid: 90, dn: 136 };
  const PLAN = ['mid', 'mid', 'up', 'dn', 'dn', 'up', 'up', 'dn', 'mid', 'up', 'dn', 'dn', 'up', 'mid'];
  const NX = PLAN.map((_, i) => Math.round(24 + i * 38.3));

  /* Orthogonal trace routing with rounded corners, the way a board is
     drawn. Same-lane hops are a straight run. */
  function edgePath(i) {
    const x1 = NX[i], x2 = NX[i + 1], y1 = LANE[PLAN[i]], y2 = LANE[PLAN[i + 1]];
    const sx = x1 + 11, ex = x2 - 11;
    if (y1 === y2) return `M${sx} ${y1}H${ex}`;
    const mx = Math.round((x1 + x2) / 2), r = 7, dir = y2 > y1 ? 1 : -1;
    return `M${sx} ${y1}H${mx - r}Q${mx} ${y1} ${mx} ${y1 + dir * r}V${y2 - dir * r}Q${mx} ${y2} ${mx + r} ${y2}H${ex}`;
  }
  const EDGE = PLAN.slice(0, -1).map((_, i) => edgePath(i));

  W[13] = (ctx) => {
    const { esc, index, step, running, completed, steps, icon } = ctx;
    const inked = [], ghosts = [], traces = [], ghostTraces = [];

    for (let i = 0; i < steps.length; i++) {
      const s = steps[i], x = NX[i], y = LANE[PLAN[i]];
      if (i < steps.length - 1) {
        /* An edge is tinted by the step it lands on, so the ink that
           arrives at a node is that node's colour while it is wet. */
        const kind = esc(steps[i + 1].kind);
        if (i < index) {
          traces.push(`<path class="pm13-edge" data-k="e:${esc(s.id)}" data-step-kind="${kind}" d="${EDGE[i]}" pathLength="1"/>`);
        } else {
          /* The next edge to be drawn marches: anticipation, one step
             ahead of the pen, and only ever one. */
          ghostTraces.push(`<path class="pm13-gedge${i === index ? ' soon' : ''}" data-k="ge:${esc(s.id)}" data-step-kind="${kind}" d="${EDGE[i]}"/>`);
        }
      }
      if (i <= index) {
        const cls = i === index ? (completed ? 'done end' : 'now') : 'done';
        inked.push(
          `<g class="pm13-node ${cls}" data-k="n:${esc(s.id)}" transform="translate(${x} ${y})" data-step-kind="${esc(s.kind)}">
             <g class="pm13-pop"><circle class="pm13-disc" r="11"/><g class="pm13-gl" transform="translate(-5.5 -5.5)">${icon(s.icon, 11)}</g></g>
             <text class="pm13-lb" y="${PLAN[i] === 'dn' ? 25 : 25}">${esc(CODE[s.kind] || 'OPER')}</text>
           </g>`);
      } else {
        ghosts.push(`<circle class="pm13-ghost${i === index + 1 ? ' soon' : ''}" data-k="g:${esc(s.id)}" data-step-kind="${esc(s.kind)}" cx="${x}" cy="${y}" r="5"/>`);
      }
    }

    const cx = NX[index], cy = LANE[PLAN[index]];
    /* Current flowing along the live trace, once the pen has left it. */
    const chase = running && index > 0
      ? `<path class="pm13-chase" data-k="chase" data-step-kind="${esc(step.kind)}" d="${EDGE[index - 1]}" pathLength="1"/>` : '';
    /* The pen: a bright head with a short trail, keyed to the step it is
       drawing so it is a genuinely new node exactly once per landing and
       its one pass plays then. It runs the same path as the ink on the
       same 300ms, so the head sits on the wet tip the whole way. */
    const pen = index > 0
      ? `<g class="pm13-pen" data-k="pen:${esc(step.id)}" data-step-kind="${esc(step.kind)}">
           <path class="pm13-pen-t" d="${EDGE[index - 1]}" pathLength="1"/>
           <path class="pm13-pen-h" d="${EDGE[index - 1]}" pathLength="1"/>
         </g>` : '';

    return `<div class="pm13" data-k="pm13">
<div class="pm13-tb">
  <span class="k">SCHEMATIC</span><span class="v">RUN-0043 · QUERY PATH</span>
  <span class="sp"></span>
  <span class="k">NODE</span><span class="v">${M.roll(String(index + 1).padStart(2, '0'))}/${steps.length}</span>
  <span class="k">REV</span><span class="v" data-k="rev:${completed ? 'f' : 'd'}">${completed ? 'FINAL' : 'DRAFT'}</span>
</div>
<div class="pm13-sheet" data-k="sheet">
  <svg viewBox="0 0 546 176" width="100%" preserveAspectRatio="xMidYMid meet" aria-label="Schematic of the run so far, ${index + 1} of ${steps.length} nodes inked">
    <defs><pattern id="pm13grid" width="13" height="13" patternUnits="userSpaceOnUse">
      <path d="M13 0H0V13" fill="none" stroke="currentColor" stroke-width=".5" opacity=".16"/>
    </pattern></defs>
    <rect class="pm13-paper" width="546" height="176" fill="url(#pm13grid)"/>
    <g class="pm13-ghosts">${ghostTraces.join('')}${ghosts.join('')}</g>
    <g class="pm13-cur" data-k="cur" data-step-kind="${esc(step.kind)}" style="transform:translate(${cx}px,${cy}px)">
      <line class="pm13-rule" x1="-546" y1="0" x2="546" y2="0"/>
      <line class="pm13-rule" x1="0" y1="-176" x2="0" y2="176"/>
      <circle class="pm13-cur1" r="17"/><circle class="pm13-cur2" r="17"/>
    </g>
    <g class="pm13-ink">${traces.join('')}${pen}${chase}${inked.join('')}</g>
  </svg>
</div>
<div class="pm13-cap" data-k="cap" data-step-kind="${esc(step.kind)}">
  <span class="pm13-cap-k" data-k="capk:${esc(step.id)}">${esc(CODE[step.kind] || 'OPER')}</span>
  <span class="pm13-cap-v" data-k="capv:${esc(step.id)}"><strong class="${running ? 'pm-shimmer' : 'pm-shimmer pm-settled'}">${esc(step.verb)}</strong></span>
</div>
${completed ? ctx.workReceipt() : ''}</div>`;
  };

  /* ==================================================================
     14 — TIMELINE SCRUB
     ------------------------------------------------------------------
     The whole run laid out on one time axis, each step a segment sized
     by its duration and tinted by its kind, so the finished strip is a
     colour record of the run. The playhead transitions its left offset
     on every tick. Scrubbing is real: hovering a segment swaps the
     detail card underneath it (pure CSS :has, so it survives the patch),
     and clicking one jumps the run to that moment via the shared
     inspect-work-step action.

     Staging. A scrub is a move along an axis, so the handoff is played
     as travel rather than as a swap:
        0-520ms  the playhead glides to its new offset while the segment
                 it just cleared fills to 100% under a seal that wipes
                 left to right -- the ink is laid down, not switched
       40-195    the detail rows cascade in on the measured 45ms beat
      150-520    the sentence resolves a word at a time behind them
      340-540    the evidence run arrives last
     The deck is still a single-slot swap, so only one card is ever
     painted: the cascade happens inside the card that is arriving,
     never across two.
     ================================================================== */

  W[14] = (ctx) => {
    const { esc, index, step, running, completed, steps, icon, formatElapsed } = ctx;
    const headT = completed ? RUN_T : CUM[index] + DUR[index] * 0.62;
    const headP = Math.max(0.4, Math.min(99.6, (headT / RUN_T) * 100));

    const segs = steps.map((s, i) => {
      const state = i < index ? 'done' : i === index ? 'now' : 'next';
      const fill = i < index || completed ? 100 : i === index ? 62 : 0;
      const wide = DUR[i] >= 9;
      /* The segment the playhead has just cleared. Keyed, and present for
         exactly one step, so its seal is a genuinely new node and wipes
         once -- the hatched live fill resolving into laid ink. */
      const just = i === index - 1 || (completed && i === index);
      return `<button class="pm14-seg ${state}${just ? ' just' : ''}" data-k="seg:${esc(s.id)}" data-step-kind="${esc(s.kind)}"
        style="flex:${DUR[i]} 0 0%" data-action="inspect-work-step" data-value="${i}"
        title="${esc(s.label)} · ${DUR[i]}s · click to scrub here">
        <i class="pm14-fill" style="width:${fill}%"></i>
        ${just ? `<i class="pm14-seal" data-k="seal:${esc(s.id)}"></i>` : ''}
        <span class="pm14-glyph">${icon(s.icon, wide ? 11 : 9)}</span>
      </button>`;
    }).join('');

    const cards = steps.map((s, i) => {
      const live = i === index;
      /* The cascade is carried by a class the render adds and removes, not
         by node identity: all fourteen cards live in the deck permanently,
         so only a class change can replay an entrance. pmSyncAttrs writes
         the class, which is what makes the animation newly applied. */
      const row = live ? ' pm-materialize' : '';
      return `<div class="pm14-card ${live ? 'live' : ''}" data-k="card:${esc(s.id)}" data-step-kind="${esc(s.kind)}">
        <div class="pm14-card-top${row}" style="--pm-stagger:0">
          <span class="pm14-badge">${icon(s.icon, 10)}${esc(s.label)}</span>
          <strong class="${live && running ? 'pm-shimmer' : ''}">${esc(s.verb)}</strong>
        </div>
        <div class="pm14-meta${row}" style="--pm-stagger:1">
          <span class="pm14-span">t+${clockAt(CUM[i])} → t+${clockAt(CUM[i + 1])}</span>
          <span class="pm14-dur">${DUR[i]}.0s</span>
          <span class="pm14-sp"></span>
        </div>
        <p class="${live ? 'pm-stream' : ''}">${live ? M.words(s.detail) : esc(s.detail)}</p>
        <div class="pm14-ev">${s.evidence.slice(0, 3).map((e, k) =>
          `<span class="${row}" style="--pm-stagger:${k}">${esc(e)}</span>`).join('')}</div>
      </div>`;
    }).join('');

    const ticks = [0, 30, 60, 90, 120].map((t) =>
      `<i style="left:${((t / RUN_T) * 100).toFixed(2)}%"><u>${clockAt(t)}</u></i>`).join('');

    return `<div class="pm14" data-k="pm14">
<div class="pm14-head-row">
  <span class="pm14-k">TIMELINE</span><span class="pm14-v">RUN-0043</span>
  <span class="pm14-sp"></span>
  <span class="pm14-now">t+${M.roll(clockAt(Math.round(headT)))}</span>
  <span class="pm14-tot">/ ${esc(formatElapsed(RUN_T))}</span>
</div>
<div class="pm14-ruler" data-k="ruler">${ticks}</div>
<div class="pm14-track" data-k="track">${segs}<i class="pm14-playhead" data-k="playhead" style="left:${headP.toFixed(2)}%"></i></div>
<div class="pm14-cards" data-k="cards">${cards}</div>
<div class="pm14-hint">Hover a segment to inspect it · click to scrub the run there</div>
${completed ? ctx.workReceipt() : ''}</div>`;
  };

  /* ==================================================================
     15 — TERMINAL CAST
     ------------------------------------------------------------------
     asciinema. Each step echoes its command, which types itself with a
     steps() width animation and a block caret, then the output lines
     resolve one cascade beat apart and the exit status settles in after
     them. The transcript is a bottom-anchored flex column clipped at the
     top, which is exactly how a terminal scrolls.
     ================================================================== */

  const TYPE_MS = 17;                          // per character
  const HOST = 'pm@puppet-master';
  /* A two-line prompt, so the command always starts at column zero and
     the type-on can never reflow onto a second line halfway through. */
  const PS1 = `<div class="pm15-ps"><span class="pm15-ps1">${HOST}</span><span class="pm15-ps2">~/analytics</span><span class="pm15-git">feature/query-index</span></div>`;

  W[15] = (ctx) => {
    const { esc, D, index, step, running, completed, steps, commandForStep, formatElapsed } = ctx;

    /* The spawn step prints its children as job lines, which is what a
       cast would actually show -- see ownsAgents below. Each child takes
       two short lines rather than one long one, so no line can wrap at
       the narrow card width; the tail budget below counts lines, and a
       wrap it did not predict would push the transcript out of the box. */
    const pad = (v, n) => { v = String(v); return v.length >= n ? v : v + ' '.repeat(n - v.length); };
    const outLinesFor = (s) => s.kind !== 'agents' ? s.evidence
      : D.subagents.slice(0, 2).reduce((acc, a, i) => acc.concat([
        `[${i + 1}] ${pad(a.id, 15)}${pad(a.status, 9)}${String(a.progress).padStart(3)}%`,
        `    ${a.current}`
      ]), []);

    /* A terminal shows its tail. Bottom-anchoring an overflowing flex
       column would let the oldest lines spill UP out of the window and
       land on the card header, so instead: measure how many whole blocks
       fit in the window and render only those. LH / BLK_PAD / WIN mirror
       the CSS, and every line above is short enough not to wrap, so the
       arithmetic is exact at both the 367px and 570px card widths. */
    const LH = 15, BLK_PAD = 7, WIN = 300 - 16;   /* == CSS max-height - padding */
    const blockPx = (s) => (3 + outLinesFor(s).length) * LH + BLK_PAD;
    const tailPx = completed ? 4 * LH + BLK_PAD : (running ? 0 : 2 * LH + BLK_PAD);
    let budget = WIN - tailPx, first = index;
    for (let i = index; i >= 0; i--) {
      const h = blockPx(steps[i]);
      if (i !== index && h > budget) break;
      budget -= h; first = i;
    }

    const blocks = [];
    for (let i = first; i <= index; i++) {
      const s = steps[i];
      const cmd = commandForStep(s);
      const live = i === index && !completed;
      const n = Math.max(1, cmd.length);
      const d0 = `${n * TYPE_MS}ms`;
      const out = outLinesFor(s).map((e, j) =>
        `<div class="pm15-out ${live ? 'in' : ''}" data-k="o:${esc(s.id)}:${j}" style="--d0:${d0};--i:${j}">` +
        `<span class="pm15-pfx">·</span>${esc(e)}</div>`).join('');
      blocks.push(
        `<div class="pm15-blk ${live ? 'live' : 'done'}" data-k="b:${esc(s.id)}">
          ${PS1}
          <div class="pm15-cmd"><span class="pm15-dollar">$</span>` +
        (live
          ? `<span class="pm15-type" data-k="ty:${esc(s.id)}" style="--n:${n}">${esc(cmd)}</span><i class="pm15-caret" data-k="caret"></i>`
          : `<span class="pm15-txt">${esc(cmd)}</span>`) +
        `</div>${out}
          <div class="pm15-exit ${live ? 'in' : ''}" data-k="x:${esc(s.id)}" style="--d0:${d0};--i:${outLinesFor(s).length}">
            <span class="pm15-ok">exit 0</span><span class="pm15-el">${DUR[i]}.0s</span>
            <span class="pm15-sp"></span><span class="pm15-at">t+${clockAt(CUM[i])}</span>
          </div>
        </div>`);
    }

    if (completed) {
      blocks.push(
        `<div class="pm15-blk tail" data-k="b:receipt">
          ${PS1}
          <div class="pm15-cmd"><span class="pm15-dollar">$</span><span class="pm15-txt">pm receipt --run 0043</span></div>
          <div class="pm15-out" data-k="o:receipt:0"><span class="pm15-pfx">·</span>worked ${esc(formatElapsed(RUN_T))} · 14 tools · 3 files · 2 agents · 42 tests · 2 artifacts</div>
          <div class="pm15-exit" data-k="x:receipt"><span class="pm15-ok">exit 0</span><span class="pm15-el">0.1s</span><span class="pm15-sp"></span><span class="pm15-at">t+${clockAt(RUN_T)}</span></div>
        </div>`);
    } else if (!running) {
      blocks.push(`<div class="pm15-blk tail" data-k="b:idle">${PS1}<div class="pm15-cmd"><span class="pm15-dollar">$</span><i class="pm15-caret idle" data-k="caret-idle"></i></div></div>`);
    }

    return `<div class="pm15" data-k="pm15">
<div class="pm15-bar">
  <span class="pm15-title">cast · ${esc(HOST)}</span>
  <span class="pm15-sp"></span>
  <span>${esc(formatElapsed(ctx.elapsed))}</span>
  <span class="pm15-div">|</span>
  <span>96x24</span>
  <span class="pm15-div">|</span>
  <span class="pm15-rec ${running ? 'on' : ''}">${running ? 'REC' : completed ? 'END' : 'IDLE'}</span>
</div>
<div class="pm15-scroll ${first > 0 ? 'scrolled' : ''}" data-k="cast">${blocks.join('')}</div>
</div>`;
  };

  /* The cast prints its own job table on the spawn step, so the shared
     inline agent card must not also be appended under the terminal.
     Takes 13 and 14 both carry prose already and use the shared list. */
  W[15].ownsAgents = true;

  void M;
})();

/* Working-animation takes — group c. Registered into window.PM56_WORKING.
   Each take is (ctx) => htmlString. See makeWorkCtx() in app.js for ctx.

   Takes 16..23. One faithful reading of the reference recording and seven
   variations on the same idea: a quiet stage under the shared phase chrome
   (app.js renderPhaseChrome) that shows what the agent is actually doing
   at a readable pace. The chrome owns the icon trail, the bold verb and
   grey count, the concrete rows, the compact "N steps" receipt and the
   click-to-reopen discs; these bodies are the stage picture beneath it.

     16 Loom          the video-faithful stage: verb, streamed detail, bar
     17 Pulse Grid    14 step tiles; the current one carries a radar sweep
     18 Ledger        phase verbs left, rolling counters right, sliding bar
     19 Constellation one star per step, connectors inked as work proceeds
     20 Metronome     a pendulum keeps time; phase ticks mark the arc
     21 Filmstrip     14 frames; the active frame develops into focus
     22 Sonar         ring pulses + rotating sweep; blips per done phase
     23 Circuit       8 pads on a trace; the live segment carries dashes

   Patch discipline (renderApp reconciles with pmPatch, it does not
   replace innerHTML):
     - a CSS entrance fires only when a node is genuinely NEW,
     - data-k is the identity that decides "new",
     - anything that must survive the 2000ms tick carries a constant key,
     - anything that must replay on a step change carries the step id.
   ===================================================================== */
(() => {
  'use strict';
  const W = window.PM56_WORKING;
  const M = window.PM56_MOTION;
  const esc = M.esc;

  /* The phase list, shared by takes that draw one glyph per phase. Derived
     from the same phaseGroups map the shared chrome uses, so the stage and
     the chrome always agree on what a phase is. */
  function phasesOf(D) {
    const phases = [];
    for (const s of D.workSteps) {
      const p = D.phaseGroups[s.kind] || s.kind;
      const g = phases[phases.length - 1];
      if (g && g.phase === p) g.steps.push(s); else phases.push({ phase: p, first: s, steps: [s] });
    }
    return phases;
  }
  const activePhase = (phases, step) => phases.findIndex(g => g.steps.some(s => s.id === step.id));

  /* =====================================================================
     16 — LOOM (the video-faithful stage)
     ---------------------------------------------------------------------
     The reference shows almost nothing beneath the phase chrome except the
     work itself: the current verb, the live detail streaming in word by
     word, and a hairline progress bar in the step's hue. Fidelity here is
     restraint — the chrome above carries the trail, the rows and the
     compaction exactly as measured from the recording.
     ===================================================================== */
  W[16] = (ctx) => {
    const { step, pct, running } = ctx;
    return `<div class="loom-stage" data-k="loom">
      <div class="loom-verb ${running ? 'pm-shimmer' : 'pm-shimmer pm-settled'}" data-k="loom16v:${step.id}">${esc(step.verb)}</div>
      <div class="loom-detail pm-stream" data-k="l16:${step.id}">${M.words(step.detail)}</div>
      <div class="loom-bar" data-k="p16"><i style="width:${pct}%"></i></div>
    </div>`;
  };

  /* =====================================================================
     17 — PULSE GRID
     ---------------------------------------------------------------------
     The whole run as a wall of tiles: one per step, done tiles lit in the
     current phase hue, the live tile carrying a slow radar sweep. The map
     of where the work is, readable at a glance.
     ===================================================================== */
  W[17] = (ctx) => {
    const { steps, step, index, icon } = ctx;
    const tiles = steps.map((s, i) => {
      const st = i < index ? 'done' : i === index ? 'current' : 'next';
      return `<span class="c17-tile ${st}" data-k="g17:${s.id}" title="${esc(s.label)} · ${esc(s.verb)}">${st === 'next' ? '' : icon(s.icon, 12)}</span>`;
    }).join('');
    return `<div class="c17-grid" data-k="c17" aria-label="Step grid: ${index + 1} of ${steps.length} active">${tiles}</div>`;
  };

  /* =====================================================================
     18 — LEDGER
     ---------------------------------------------------------------------
     A bookkeeper's sheet: every phase gets a row, and the right column
     rolls its completed-step count as the work proceeds. A 2px bar in the
     phase hue slides between rows to mark where the agent is now.
     ===================================================================== */
  W[18] = (ctx) => {
    const { D, steps, step, index } = ctx;
    const phases = phasesOf(D);
    const active = activePhase(phases, step);
    const rows = phases.map((g, i) => {
      const meta = D.phaseMeta[g.first.kind] || {};
      const done = g.steps.filter(s => steps.indexOf(s) <= index).length;
      const st = i < active ? 'done' : i === active ? 'current' : 'next';
      return `<div class="c18-row ${st}" data-k="c18r:${g.phase}"><span class="c18-name">${esc(meta.verb || g.phase)}</span><span class="c18-val">${M.roll(done)}<u>/ ${g.steps.length}</u></span></div>`;
    }).join('');
    return `<div class="c18-sheet" data-k="c18">${rows}<i class="c18-bar" data-k="c18bar" style="top:${active * 22 + 27}px"></i></div>`;
  };

  /* =====================================================================
     19 — CONSTELLATION
     ---------------------------------------------------------------------
     One fixed star per step in a fixed sky; as work proceeds the stars
     light in the phase hue and the connector between them inks itself in.
     The run as a picture you can see the shape of.
     ===================================================================== */
  const STARS = [[14, 70], [36, 38], [58, 60], [80, 26], [102, 48], [124, 18], [146, 42], [168, 64], [190, 32], [212, 52], [234, 24], [256, 46], [278, 62], [302, 36]];
  W[19] = (ctx) => {
    const { steps, step, index } = ctx;
    const segs = [];
    for (let i = 1; i <= index && i < steps.length; i++) {
      const [x1, y1] = STARS[i - 1], [x2, y2] = STARS[i];
      segs.push(`<line class="c19-seg" data-k="c19s:${steps[i].id}" pathLength="1" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`);
    }
    const stars = STARS.map(([x, y], i) => {
      const st = i < index ? 'done' : i === index ? 'current' : 'next';
      return `<circle class="c19-star ${st}" data-k="c19n:${steps[i].id}" cx="${x}" cy="${y}" r="${i === index ? 4 : 3}"/>`;
    }).join('');
    const [cx, cy] = STARS[index];
    return `<div class="c19-sky" data-k="c19" aria-label="Constellation: ${index + 1} of ${steps.length} stars lit">
      <svg viewBox="0 0 316 88" width="100%" height="88" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        ${segs.join('')}${stars}<circle class="c19-halo" data-k="c19h:${step.id}" cx="${cx}" cy="${cy}" r="4"/>
      </svg>
    </div>`;
  };

  /* =====================================================================
     20 — METRONOME
     ---------------------------------------------------------------------
     Work as tempo: a pendulum keeps time in the phase hue while a row of
     eight phase ticks records the passage — tinted when done, glowing when
     live. The step counter rolls beneath.
     ===================================================================== */
  W[20] = (ctx) => {
    const { D, step, index } = ctx;
    const phases = phasesOf(D);
    const active = activePhase(phases, step);
    const ticks = phases.map((g, i) => {
      const st = i < active ? 'done' : i === active ? 'current' : 'next';
      return `<i class="c20-tick ${st}" data-k="c20t:${g.phase}" title="${esc((D.phaseMeta[g.first.kind] || {}).verb || g.phase)}"></i>`;
    }).join('');
    return `<div class="c20-body" data-k="c20">
      <div class="c20-dial" data-k="c20d"><i class="c20-arm" data-k="c20a"></i><i class="c20-pivot"></i></div>
      <div class="c20-ticks" data-k="c20ticks">${ticks}</div>
      <div class="c20-count" data-k="c20c">step ${M.roll(index + 1)} <u>/ ${D.workSteps.length}</u></div>
    </div>`;
  };

  /* =====================================================================
     21 — FILMSTRIP
     ---------------------------------------------------------------------
     The run as a strip of film: fourteen frames with sprocket holes, the
     reel sliding so the live frame sits center, where it "develops" from a
     blur into focus. Past frames keep their image, future frames are dark.
     ===================================================================== */
  W[21] = (ctx) => {
    const { steps, step, index, icon } = ctx;
    const frames = steps.map((s, i) => {
      const st = i < index ? 'done' : i === index ? 'current' : 'next';
      return `<span class="c21-frame ${st}" data-k="f21:${s.id}" title="${esc(s.label)} · ${esc(s.verb)}">${st === 'next' ? '' : icon(s.icon, 13)}<u>${i + 1}</u></span>`;
    }).join('');
    return `<div class="c21-strip" data-k="c21" aria-label="Filmstrip: frame ${index + 1} of ${steps.length} developing">
      <div class="c21-reel" data-k="c21reel" style="transform:translateX(-${index * 58 + 29}px)">${frames}</div>
    </div>`;
  };

  /* =====================================================================
     22 — SONAR
     ---------------------------------------------------------------------
     The agent pinging its environment: ring pulses, a rotating sweep, one
     blip per completed phase at a fixed bearing. Beside the scope, the
     actual command for the current step in mono — the readout.
     ===================================================================== */
  W[22] = (ctx) => {
    const { D, step, commandForStep } = ctx;
    const phases = phasesOf(D);
    const active = activePhase(phases, step);
    const blips = phases.map((g, i) => {
      const st = i < active ? 'done' : i === active ? 'current' : '';
      if (!st) return '';
      const a = (i / phases.length) * 2 * Math.PI - Math.PI / 2;
      const r = 20 + (i % 3) * 8;
      const x = 50 + Math.cos(a) * r, y = 50 + Math.sin(a) * r;
      return `<i class="c22-blip ${st}" data-k="c22b:${g.phase}" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%" title="${esc((D.phaseMeta[g.first.kind] || {}).past || g.phase)}"></i>`;
    }).join('');
    return `<div class="c22-body" data-k="c22">
      <div class="c22-scope" data-k="c22s" aria-label="Sonar: ${active} of ${phases.length} phases swept">
        <i class="c22-ring c22-r1" data-k="c22r1"></i><i class="c22-ring c22-r2" data-k="c22r2"></i>
        <i class="c22-sweep" data-k="c22sw"></i>${blips}<i class="c22-core"></i>
      </div>
      <div class="c22-readout" data-k="c22ro">
        <span class="c22-cmd pm-materialize" data-k="s22:${step.id}">${esc(commandForStep(step))}</span>
      </div>
    </div>`;
  };

  /* =====================================================================
     23 — CIRCUIT
     ---------------------------------------------------------------------
     The run as current on a board: eight pads on a trace, one per phase.
     Done segments stay lit, the segment being energized carries moving
     dashes, and the live pad breathes. The counter rolls beneath.
     ===================================================================== */
  W[23] = (ctx) => {
    const { D, step, index } = ctx;
    const phases = phasesOf(D);
    const active = activePhase(phases, step);
    const n = phases.length;
    const xs = phases.map((g, i) => 14 + i * (292 / (n - 1)));
    const doneLines = [];
    for (let i = 1; i <= active && i < n; i++) {
      doneLines.push(`<line class="c23-done" data-k="c23d:${phases[i].phase}" x1="${xs[i - 1]}" y1="26" x2="${xs[i]}" y2="26"/>`);
    }
    const live = active > 0 ? `<line class="c23-live" data-k="c23l:${phases[active].phase}" x1="${xs[active - 1]}" y1="26" x2="${xs[active]}" y2="26"/>` : '';
    const pads = phases.map((g, i) => {
      const st = i < active ? 'done' : i === active ? 'current' : 'next';
      return `<circle class="c23-pad ${st}" data-k="c23p:${g.phase}" cx="${xs[i].toFixed(1)}" cy="26" r="${i === active ? 5 : 3.5}"><title>${esc((D.phaseMeta[g.first.kind] || {}).verb || g.phase)}</title></circle>`;
    }).join('');
    return `<div class="c23-body" data-k="c23" aria-label="Circuit: pad ${active + 1} of ${n} energized">
      <svg viewBox="0 0 320 52" width="100%" height="52" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <line class="c23-base" x1="14" y1="26" x2="306" y2="26"/>
        ${doneLines.join('')}${live}${pads}
      </svg>
      <div class="c23-count" data-k="c23c">${M.roll(index + 1)} steps energized</div>
    </div>`;
  };
})();
</script>
  <script>(() => {
  'use strict';

  const D = window.PM56_DATA;
  const M = window.PM56_MOTION;
  if (!D) throw new Error('PM56_DATA was not loaded.');

  const clone = (v) => JSON.parse(JSON.stringify(v));
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

  /* Ordinal and wall-clock for a message, derived rather than stored so the
     fixtures need no change. The clock walks forward from a fixed start so a
     timeline reads sensibly and stays deterministic between renders. */
  function msgIndex(id){
    const t=activeThread(); if(!t) return 0;
    const i=t.messages.findIndex(x=>x.id===id);
    return i<0?0:i;
  }
  function msgClock(m){
    const i=msgIndex(m.id);
    const mins=(11*60+42)+i*3;
    return String(Math.floor(mins/60)%24).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
  }

    return `<article class="working-card ${state.work.completed?'is-done ':''}working-variant-${v}" data-working-variant="${v}" data-step-kind="${esc(step.kind)}" data-k="workcard"><div class="working-head"><span class="work-phase-icon">${icon(step.icon,14)}</span><div><strong>${state.work.completed?'Completed work':'Working'}</strong><span class="sub"> · ${formatElapsed(state.work.elapsed)}</span></div><span class="spacer"></span><div class="working-controls">${state.work.running?`<button class="icon-button" data-action="pause-working" title="Pause the live demo">${icon('pause',13)}</button>`:`<button class="icon-button" data-action="start-working" title="Start or resume the complete work sequence">${icon('play',13)}</button>`}<button class="icon-button" data-action="step-working" title="Advance one operation">${icon('step',13)}</button><button class="icon-button" data-action="complete-working" title="Complete the sequence">${icon('check',13)}</button><button class="icon-button" data-action="reset-working" title="Reset to Preparing">${icon('reset',13)}</button><button class="icon-button ${state.work.expanded?'active':''}" data-action="toggle-work-history" title="${state.work.expanded?'Hide':'Show'} organized work history and evidence">${icon(state.work.expanded?'collapse':'expand',13)}</button></div></div><div class="working-body" data-flip data-k="wv:${v}">${co.noChrome?'':renderPhaseChrome(ctx,co)}${(shut&&!co.keepBody)?'':renderWorkingVariant(v,step,pct)}${renderLiveAgentInline(step)}${state.work.expanded?renderWorkHistory():''}</div></article>`;
  }

  /* Everything a working-animation take needs, so takes can live outside
     this IIFE (see motion.js / variants-*.js) and still reach state, the
     fixtures and the shared render helpers. */
  /* Families are 8 options wide except Working Animation, whose length is
     whatever data.js declares. */
  /* Takes that already render child agents themselves must not also get
     the shared inline list appended underneath. */
  const AGENT_OWNING_TAKES=new Set([6]);
  function takeOwnsAgents(v){ return AGENT_OWNING_TAKES.has(v) || !!(window.PM56_WORKING&&window.PM56_WORKING[v]&&window.PM56_WORKING[v].ownsAgents); }
  const FAMILY_SIZES={2:()=>D.workingTakes.length, 5:()=>D.transcriptTakes.length};
  function familyMax(f){ const g=FAMILY_SIZES[f]; return (g?g():8) - 1; }
  /* Shared working-chrome opts per take. Take 8 (Step Rail) implements the
     full reference mechanic privately — trail, rows, compaction and
     per-step reopen — so it gets neither the chrome nor the shut-body
     gate (keepBody). Takes 0/11/15 already print concrete per-step rows
     in their bodies, so the chrome skips its row block for them. Takes
     4/6 end on a meaningful final stage that should stay visible after
     compaction. */
  const CHROME_OPTS={0:{noRows:true},4:{keepBody:true},6:{keepBody:true},8:{noChrome:true,keepBody:true},11:{noRows:true},15:{noRows:true}};
  function makeWorkCtx(step,pct){
    return {
      state, D, step, pct,
      steps: D.workSteps,
      index: state.work.step,
      total: D.workSteps.length,
      running: state.work.running,
      completed: state.work.completed,
      elapsed: state.work.elapsed,
      icon, esc, formatElapsed, commandForStep,
      workReceipt: renderWorkReceipt,
      M: window.PM56_MOTION
    };
  }

  /* The reference-video chrome shared by every take: an icon trail of
     phases, a bold verb + grey count, concrete readable rows for what is
     actually happening right now; on completion it compacts to the trail
     plus an "N steps" roll and the work receipt, and clicking any disc
     re-expands that phase's rows. data-k discipline follows variants-a.js:
     constant keys survive the tick, step/phase-keyed nodes remount and
     replay their entrance animation. */
  function renderPhaseChrome(ctx,opts){
    const {D,step,index,running,completed,M,esc,icon}=ctx;
    const open=state.work.openPhase;
    const shut=completed&&open==null;
    const phases=[];
    for(const s of D.workSteps){
      const p=D.phaseGroups[s.kind]||s.kind;
      const g=phases[phases.length-1];
      if(g&&g.phase===p){g.steps.push(s);}else{phases.push({phase:p,first:s,steps:[s]});}
    }
    const cur=phases.find(g=>g.steps.some(s=>s.id===step.id))||phases[phases.length-1];
    const activeIdx=completed?phases.length-1:phases.indexOf(cur);
    const trail=phases.map((g,i)=>{
      const meta=D.phaseMeta[g.first.kind]||{};
      const cls='pm-rail-item wa-disc '+(completed||i<activeIdx?'done':i===activeIdx?'current enter':'')+(open===g.phase?' open':'');
      const act=completed?` data-action="toggle-work-phase" data-value="${g.phase}"`:'';
      return `<button type="button" class="${cls}" data-k="wa:${g.phase}"${act} title="${esc(meta.past||meta.verb||g.phase)} ${esc(meta.count||'')}" aria-label="${esc(meta.past||meta.verb||g.phase)}">${icon(g.first.icon,11)}</button>`;
    }).join('');
    /* `off` continues the entrance cascade across the steps of one opened
       phase, so rows always land top-to-bottom in document order. */
    const rowsFor=(s,off=0)=>{
      const rows=(D.phaseRows[s.kind]&&D.phaseRows[s.kind][s.id])||s.evidence.slice(0,3).map(t=>({text:t}));
      let w=off;
      return rows.map((r,j)=>{
        const body=r.stream?`<span class="wa-prose pm-stream">${M.words(r.text,w)}</span>`:`<span class="wa-rowtext">${esc(r.text)}</span>`;
        if(r.stream)w+=M.wordCount(r.text);
        const metaBit=r.add!=null?`<span class="wa-meta"><b class="wa-add">+${r.add}</b>${r.del!=null?` <b class="wa-del">−${r.del}</b>`:''}</span>`:r.tag?`<span class="wa-meta"><b class="wa-tag">${esc(r.tag)}</b></span>`:'';
        return `<span class="wa-row pm-materialize" data-k="war:${s.id}:${j}" style="--pm-stagger:${off+j}">${body}${metaBit}</span>`;
      }).join('');
    };
    let label;
    if(shut){
      label=`<b class="wa-verb" data-k="wv2:sum">${M.roll(index+1)} steps</b>`;
    }else if(open){
      const g=phases.find(x=>x.phase===open)||cur, m=D.phaseMeta[g.first.kind]||{};
      label=`<b class="wa-verb" data-k="wv2:${open}">${esc(m.past)}</b><i class="wa-count" data-k="wc2:${open}">${esc(m.count)}</i>`;
    }else{
      const meta=D.phaseMeta[cur.first.kind]||{};
      label=`<b class="wa-verb ${running?'pm-shimmer':'pm-shimmer pm-settled'}" data-k="wv2:${cur.phase}">${esc(meta.verb)}</b><i class="wa-count" data-k="wc2:${cur.phase}">${esc(meta.count)}</i>`;
    }
    const chev=completed?`<button type="button" class="wa-chev${open?' open':''}" data-k="wchev" data-action="toggle-work-phase" data-value="${open||(D.phaseGroups[step.kind]||step.kind)}" title="${open?'Collapse phase details':'Show phase details'}">${icon('down',12)}</button>`:'';
    let under='';
    if(shut){ under=`<div class="wa-under wa-shut" data-k="wau">${ctx.workReceipt()}</div>`; }
    else if(!opts.noRows){
      const g=open?phases.find(x=>x.phase===open):null;
      let off=0;const rows=(g?g.steps:[step]).map(st=>{const h=rowsFor(st,off);off+=((D.phaseRows[st.kind]&&D.phaseRows[st.kind][st.id])||st.evidence.slice(0,3)).length;return h;}).join('');
