.working-variant-12 .pm12-m label i{ width:5px; height:5px; flex:0 0 auto; border-radius:1px; }
.working-variant-12 .pm12-m label i.b{ background:var(--accent-2); }
.working-variant-12 .pm12-m label i.c{ background:var(--positive); }
.working-variant-12 .pm12-m label i.d{ background:var(--warning); }
.working-variant-12 .pm12-m label i.e{ background:var(--subtle); }
.working-variant-12 .pm12-m b{ display:block; margin-top:3px; font:700 14px/1 var(--font-mono); letter-spacing:-.02em; white-space:nowrap; }
.working-variant-12 .pm12-m b u{ text-decoration:none; font-size:8px; color:var(--muted); margin-left:2px; }

/* ---- phase register ---- */
.working-variant-12 .pm12-reg{
  display:flex; align-items:flex-end; gap:4px; height:12px;
  border-bottom:1px solid var(--border); padding-bottom:1px;
}
.working-variant-12 .pm12-reg i{
  flex:1; height:2px; background:var(--surface-4);
  transition:height var(--pm-t-handoff) var(--pm-ease-pop), background-color var(--pm-t-handoff) var(--pm-ease-out);
}
.working-variant-12 .pm12-reg i.done{ height:4px; background:color-mix(in srgb,var(--pm-step,var(--accent)) 50%,var(--surface-4)); }
.working-variant-12 .pm12-reg i.now{ height:12px; background:var(--pm-step,var(--accent)); }

/* ---- child agents as extra channels on the same instrument ---- */
.working-variant-12 .pm12-subs{ display:grid; gap:5px; }
.working-variant-12 .pm12-sub{
  display:grid; grid-template-columns:56px minmax(0,1fr) 34px 26px; gap:8px; align-items:center;
  width:100%; padding:0; border:0; background:transparent; cursor:pointer; text-align:left;
  font:600 8px/1 var(--font-mono); letter-spacing:.1em; color:var(--subtle);
  animation:pm12-chan-in var(--pm-t-row) var(--pm-ease-out) both;
}
.working-variant-12 .pm12-sub:nth-child(2){ animation-delay:var(--pm-t-cascade); }
.working-variant-12 .pm12-sub:hover .pm12-sub-ch{ color:var(--text); }
.working-variant-12 .pm12-sub-bar{ height:4px; background:var(--surface-4); overflow:hidden; }
.working-variant-12 .pm12-sub-bar i{
  display:block; height:100%; background:var(--pm-step,var(--accent));
  transition:width 640ms var(--pm-ease-out);
}
.working-variant-12 .pm12-sub-v{ font:700 10px/1 var(--font-mono); color:var(--text); text-align:right; }
.working-variant-12 .pm12-sub-v u{ text-decoration:none; font-size:7px; color:var(--muted); }
.working-variant-12 .pm12-sub-st{ text-align:right; color:var(--muted); }
.working-variant-12 .pm12-sub-st.blocked{ color:var(--danger); }
.working-variant-12 .pm12-sub.blocked .pm12-sub-bar i{ background:var(--danger); }
.working-variant-12 .pm12-sub-st.working{ color:var(--pm-step,var(--accent)); }
@keyframes pm12-chan-in{ from{ opacity:0; filter:blur(var(--pm-blur)); } to{ opacity:1; filter:blur(0); } }

@keyframes pm12-cluster-in{ from{ opacity:0; filter:blur(var(--pm-blur)); } to{ opacity:1; filter:blur(0); } }

/* =====================================================================
   13 — BLUEPRINT
   ---------------------------------------------------------------------
   The handoff is staged as a drafting gesture. Every beat is named here
   so the sequence can be read in one place rather than inferred from
   scattered delays:

     --pm13-draw    0 -> 300ms   the pen crosses the new edge at a
                                 constant speed (linear, like the chase)
                                 and the ink behind it is wet: heavy and
                                 step-coloured, drying to board grey over
                                 the 320ms after it lands
     --pm13-glide   0 -> 360ms   the drafting crosshair travels to the
                                 new station on the measured pop easing
     --pm13-demote  0 -> 260ms   the station just left fades to grey
     --pm13-cap    70 -> 335ms   the callout writes itself: the chip
                                 lands first and a mask edge then crosses
                                 the verb left to right, so the line is
                                 back inside the measured 220ms handoff
                                 and finishes writing after it
     --pm13-ink   300 -> 470ms   the node inks only once the pen arrives
     --pm13-code  430 -> 540ms   the station code fades up beneath it

   Nothing here pulses. Everything either travels, strokes on, or settles
   once -- which is what separates a drawing from a blinking diagram.
   ===================================================================== */
.working-variant-13 .pm13{
  display:grid; gap:8px;
  --pm13-draw:300ms;
  --pm13-glide:360ms;
  --pm13-demote:260ms;
  --pm13-cap:70ms;
  --pm13-ink:300ms;
  --pm13-code:430ms;
}
.working-variant-13 .pm13-tb{ display:flex; align-items:center; gap:6px; font:600 8px/1 var(--font-mono); letter-spacing:.12em; }
.working-variant-13 .pm13-tb .k{ color:var(--subtle); }
.working-variant-13 .pm13-tb .v{ color:var(--muted); }
.working-variant-13 .pm13-tb .sp{ flex:1; border-bottom:1px dashed var(--border); align-self:center; height:1px; }

.working-variant-13 .pm13-sheet{
  border:1px solid var(--border); border-radius:3px; background:var(--surface);
  overflow:hidden; color:var(--text);
}
.working-variant-13 .pm13-sheet svg{ display:block; }
.working-variant-13 .pm13-paper{ opacity:1; }

/* ---- un-inked future: dashed ghosts on the sheet ----
   The one edge the pen is about to draw marches, and the station it is
   heading for warms to that step's colour: anticipation, exactly one
   step deep, so the sheet is never a field of moving dashes. */
.working-variant-13 .pm13-ghost{
  fill:none; stroke:var(--subtle); stroke-width:1; stroke-dasharray:1.6 2.4; opacity:.5;
  transition:stroke var(--pm13-demote) var(--pm-ease-out), opacity var(--pm13-demote) var(--pm-ease-out);
}
.working-variant-13 .pm13-gedge{
  fill:none; stroke:var(--subtle); stroke-width:1; stroke-dasharray:2 3.5; opacity:.32;
  transition:stroke var(--pm13-demote) var(--pm-ease-out), opacity var(--pm13-demote) var(--pm-ease-out);
}
.working-variant-13 .pm13-ghost.soon{ stroke:var(--pm-step,var(--accent)); opacity:.8; }
.working-variant-13 .pm13-gedge.soon{
  stroke:var(--pm-step,var(--accent)); opacity:.5;
  animation:pm13-march var(--pm-shimmer-cycle) linear infinite;
}
@keyframes pm13-march{ from{ stroke-dashoffset:0; } to{ stroke-dashoffset:-11; } }

/* ---- inked traces ----
   Each edge strokes itself on once, when its step lands, then dries:
   the second animation is delayed by the whole draw and fills backwards,
   so the stroke is heavy and step-coloured while it is wet and settles
   to board grey afterwards. */
.working-variant-13 .pm13-edge{
  fill:none; stroke:var(--border-strong); stroke-width:1.4; stroke-linecap:round;
  stroke-dasharray:1;
  animation:pm13-draw var(--pm13-draw) linear both,
            pm13-dry 320ms var(--pm-ease-out) var(--pm13-draw) both;
}
@keyframes pm13-draw{ from{ stroke-dashoffset:1; } to{ stroke-dashoffset:0; } }
@keyframes pm13-dry{
  from{ stroke-width:2.6; stroke:var(--pm-step,var(--accent)); }
  to  { stroke-width:1.4; stroke:var(--border-strong); }
}

/* ---- the pen: a bright head with a halo, riding the wet tip ----
   Same path, same duration, same linear easing as the draw, so the head
   is on the tip of the ink for the whole crossing rather than racing it.
   pathLength is 1, so .018 of the path is the head whatever its length. */
.working-variant-13 .pm13-pen path{
  fill:none; stroke-linecap:round;
  animation:pm13-pen var(--pm13-draw) linear both,
            pm13-pen-lift 90ms linear calc(var(--pm13-draw) - 30ms) forwards;
}
/* The halo is the step colour; the tip is ink, so it reads as a nib
   against the wet stroke in both the light and the dark themes rather
   than disappearing into the line it is drawing. */
.working-variant-13 .pm13-pen-t{ stroke:var(--pm-step,var(--accent)); stroke-width:9; stroke-dasharray:.02 .98; opacity:.3; }
.working-variant-13 .pm13-pen-h{ stroke:color-mix(in srgb,var(--text) 72%,var(--pm-step,var(--accent))); stroke-width:2.6; stroke-dasharray:.016 .984; }
@keyframes pm13-pen{ from{ stroke-dashoffset:1; } to{ stroke-dashoffset:.004; } }
/* The pen lifts off the board rather than parking on the node. forwards,
   not both: a backwards fill would drag the halo's own opacity up to the
   head's for the whole crossing. */
@keyframes pm13-pen-lift{ to{ opacity:0; } }

/* current flowing along the live trace — travels, never pulses */
.working-variant-13 .pm13-chase{
  fill:none; stroke:var(--pm-step,var(--accent)); stroke-width:2; stroke-linecap:round;
  stroke-dasharray:.16 .84;
  animation:pm13-chase var(--pm-shimmer-cycle) linear infinite;
}
@keyframes pm13-chase{ from{ stroke-dashoffset:1; } to{ stroke-dashoffset:0; } }

/* ---- inked nodes ---- */
.working-variant-13 .pm13-pop{
  transform-box:fill-box; transform-origin:50% 50%;
  animation:pm13-pop-in 170ms var(--pm-ease-pop) both;
  animation-delay:var(--pm13-ink);
}
/* The disc is on the board as the pen arrives and spends the rest of the
   170ms settling into size -- fading it linearly across the whole window
   made the node look late by a tenth of a second. */
@keyframes pm13-pop-in{
  from{ opacity:0; transform:scale(.34); }
  40% { opacity:1; }
  to  { opacity:1; transform:none; }
}
/* The station the run has just left demotes rather than switching: fill,
   ring and glyph all glide to grey over the same 260ms. */
.working-variant-13 .pm13-disc{
  fill:var(--surface); stroke:var(--border-strong); stroke-width:1.2;
  transition:fill var(--pm13-demote) var(--pm-ease-out),
             stroke var(--pm13-demote) var(--pm-ease-out),
             stroke-width var(--pm13-demote) var(--pm-ease-out);
}
.working-variant-13 .pm13-gl{ color:var(--subtle); transition:color var(--pm13-demote) var(--pm-ease-out); }
.working-variant-13 .pm13-node.now .pm13-disc{ fill:color-mix(in srgb,var(--pm-step,var(--accent)) 16%,var(--surface)); stroke:var(--pm-step,var(--accent)); stroke-width:1.6; }
.working-variant-13 .pm13-node.now .pm13-gl{ color:var(--pm-step,var(--accent)); }
.working-variant-13 .pm13-node.done .pm13-gl{ color:color-mix(in srgb,var(--pm-step,var(--accent)) 70%,var(--muted)); }
.working-variant-13 .pm13-node.end .pm13-disc{ fill:color-mix(in srgb,var(--positive) 18%,var(--surface)); stroke:var(--positive); }
.working-variant-13 .pm13-node.end .pm13-gl{ color:var(--positive); }
.working-variant-13 .pm13-lb{
  fill:var(--subtle); font:600 6.5px var(--font-mono); letter-spacing:.09em; text-anchor:middle;
  animation:pm13-lb-in var(--pm-t-row) var(--pm-ease-out) both; animation-delay:var(--pm13-code);
  transition:fill var(--pm13-demote) var(--pm-ease-out);
}
.working-variant-13 .pm13-node.now .pm13-lb{ fill:var(--pm-step,var(--accent)); }
@keyframes pm13-lb-in{ from{ opacity:0; } to{ opacity:1; } }

/* ---- drafting crosshair that glides to the live station ----
   Two datum rules and two rings. The rules span the sheet, so the travel
   between stations is something you can watch from anywhere on the
   drawing; the svg viewBox clips them, nothing leaves the card. The
   group sits under the ink layer, so nodes and codes stay legible. */
.working-variant-13 .pm13-cur{
  transition:transform var(--pm13-glide) var(--pm-ease-pop);
  pointer-events:none;
}
.working-variant-13 .pm13-rule{
  stroke:var(--pm-step,var(--accent)); stroke-width:1; stroke-dasharray:3 4; opacity:.24;
  transition:stroke var(--pm13-demote) linear;
}
.working-variant-13 .pm13-cur1,
.working-variant-13 .pm13-cur2{ fill:none; stroke:var(--pm-step,var(--accent)); stroke-width:1; opacity:.5;
  transition:stroke var(--pm13-demote) linear; }
.working-variant-13 .pm13-cur2{ stroke-dasharray:2 3; opacity:.9; }

/* ---- caption: the callout the pen writes ---- */
.working-variant-13 .pm13-cap{ display:flex; align-items:baseline; gap:8px; min-width:0; }
.working-variant-13 .pm13-cap-k{
  font:700 8px/1 var(--font-mono); letter-spacing:.14em; color:var(--pm-step,var(--accent));
  border:1px solid color-mix(in srgb,var(--pm-step,var(--accent)) 40%,var(--border)); padding:3px 5px;
  flex:0 0 auto;
  animation:pm13-cap-in var(--pm-t-row) var(--pm-ease-out) both;
  animation-delay:var(--pm13-cap);
}
/* The verb is not faded in, it is written: a soft mask edge crosses the
   line left to right, which is the one entrance that survives alongside
   .pm-shimmer -- the shimmer owns colour and background-clip on the
   <strong>, so the wrapper has to carry the reveal. */
.working-variant-13 .pm13-cap-v{
  min-width:0;
  -webkit-mask-image:linear-gradient(90deg,#000 0 42%,transparent 62%);
          mask-image:linear-gradient(90deg,#000 0 42%,transparent 62%);
  -webkit-mask-size:260% 100%;          mask-size:260% 100%;
  -webkit-mask-repeat:no-repeat;        mask-repeat:no-repeat;
  animation:pm13-write 220ms linear both;
  animation-delay:calc(var(--pm13-cap) + var(--pm-t-cascade));
}
@keyframes pm13-write{
  from{ -webkit-mask-position:100% 0; mask-position:100% 0; }
  to  { -webkit-mask-position:0 0;    mask-position:0 0; }
}
@keyframes pm13-cap-in{
  from{ opacity:0; transform:translateX(-7px); filter:blur(var(--pm-blur)); }
  60% { opacity:1; }
  to  { opacity:1; transform:none; filter:blur(0); }
}
.working-variant-13 .pm13-cap strong{ font-size:12px; font-weight:750; letter-spacing:-.01em; min-width:0; }

/* =====================================================================
   14 — TIMELINE SCRUB
   ---------------------------------------------------------------------
   A scrub is travel along an axis, so the handoff is played as travel:

     --pm14-travel  0 -> 520ms   the playhead glides to its new offset
                                 and every fill width moves with it
     --pm14-seal    0 -> 420ms   the segment the head just cleared is
                                 sealed by a band that wipes left to
                                 right, so the live hatching resolves
                                 into laid ink instead of switching
     rows          40 -> 195ms   the detail rows cascade on the measured
                                 45ms beat
     sentence     150 -> 520ms   the detail resolves a word at a time
     evidence     340 -> 540ms   the evidence run arrives last

   The deck is still a single-slot swap -- the outgoing card is gone in
   the same frame -- so the cascade only ever happens inside one card and
   two sentences are never painted over each other.
   ===================================================================== */
.working-variant-14 .pm14{
  display:grid; gap:7px;
  --pm14-travel:520ms;
  --pm14-seal:420ms;
}
.working-variant-14 .pm14-head-row{ display:flex; align-items:baseline; gap:6px; font:600 8px/1 var(--font-mono); letter-spacing:.12em; }
.working-variant-14 .pm14-k{ color:var(--subtle); }
.working-variant-14 .pm14-v{ color:var(--muted); }
.working-variant-14 .pm14-sp{ flex:1; }
.working-variant-14 .pm14-now{ font-size:12px; font-weight:800; letter-spacing:0; color:var(--text); }
.working-variant-14 .pm14-tot{ color:var(--subtle); }

/* ---- ruler ---- */
.working-variant-14 .pm14-ruler{ position:relative; height:10px; }
.working-variant-14 .pm14-ruler i{ position:absolute; bottom:0; width:1px; height:4px; background:color-mix(in srgb,var(--subtle) 70%,transparent); }
.working-variant-14 .pm14-ruler i u{
  position:absolute; left:0; bottom:5px; text-decoration:none;
  font:600 7px/1 var(--font-mono); color:var(--subtle); letter-spacing:.08em;
}

/* ---- the axis ---- */
.working-variant-14 .pm14-track{
  position:relative; display:flex; align-items:stretch; height:30px;
  border:1px solid var(--border); border-radius:3px; overflow:visible; background:var(--surface-3);
}
.working-variant-14 .pm14-seg{
  position:relative; min-width:0; padding:0; border:0; border-right:1px solid var(--surface);
  background:transparent; cursor:pointer; overflow:hidden; display:grid; place-items:center;
  transition:background-color var(--pm-t-handoff) var(--pm-ease-out);
}
.working-variant-14 .pm14-seg:first-child{ border-radius:2px 0 0 2px; }
.working-variant-14 .pm14-seg:last-child{ border-right:0; border-radius:0 2px 2px 0; }
.working-variant-14 .pm14-fill{
  position:absolute; left:0; top:0; bottom:0; width:0;
  background:color-mix(in srgb,var(--pm-step,var(--accent)) 34%,var(--surface-3));
  transition:width var(--pm14-travel) var(--pm-ease-out);
}
.working-variant-14 .pm14-seg.now .pm14-fill{
  background:
    repeating-linear-gradient(115deg,
      transparent 0 6px,
      color-mix(in srgb,var(--pm-step,var(--accent)) 22%,transparent) 6px 12px),
    color-mix(in srgb,var(--pm-step,var(--accent)) 42%,var(--surface-3));
  background-size:34px 100%,100% 100%;
  animation:pm14-scan var(--pm-shimmer-cycle) linear infinite;
}
@keyframes pm14-scan{ from{ background-position:0 0,0 0; } to{ background-position:34px 0,0 0; } }
.working-variant-14 .pm14-seg.now{ box-shadow:inset 0 0 0 1px var(--pm-step,var(--accent)); z-index:2; }
/* The seal: the wipe that lays the segment down as the head leaves it.
   It is a keyed node that exists for exactly one step, so it plays once
   and is never restarted by the 1050ms tick. Clipped by the segment's
   own overflow, so it cannot reach the edge of the card. */
.working-variant-14 .pm14-seal{
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background-image:linear-gradient(100deg,
      transparent 0 40%,
      color-mix(in srgb,var(--pm-step,var(--accent)) 62%,transparent) 46%,
      color-mix(in srgb,var(--text) 26%,transparent) 50%,
      color-mix(in srgb,var(--pm-step,var(--accent)) 42%,transparent) 54%,
      transparent 60% 100%);
  background-size:300% 100%; background-repeat:no-repeat; background-position:100% 0;
  animation:pm14-seal var(--pm14-seal) var(--pm-ease-out) both;
}
/* The band is moved by background-position rather than by a transform:
   a translated overlay makes the segment report scrollWidth past its own
   box for the length of the wipe, which is a defect a probe will find
   even though overflow:hidden means nothing is ever painted outside. */
@keyframes pm14-seal{
  from{ background-position:100% 0; opacity:1; }
  70% { opacity:1; }
  to  { background-position:0 0; opacity:0; }
}
.working-variant-14 .pm14-glyph{ position:relative; z-index:2; display:grid; place-items:center; color:var(--subtle); transition:color var(--pm-t-icon) var(--pm-ease-out); }
.working-variant-14 .pm14-seg.done .pm14-glyph{ color:color-mix(in srgb,var(--pm-step,var(--accent)) 62%,var(--text)); }
.working-variant-14 .pm14-seg.now .pm14-glyph{ color:var(--text); }
.working-variant-14 .pm14-seg:hover{
  background:color-mix(in srgb,var(--text) 8%,transparent);
  outline:1px solid color-mix(in srgb,var(--text) 55%,transparent); outline-offset:-1px; z-index:3;
}
.working-variant-14 .pm14-seg:hover::after{
  content:""; position:absolute; left:0; top:-4px; bottom:-4px; width:1px; background:var(--text); opacity:.6;
}
.working-variant-14 .pm14-seg:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }

/* The head carries a soft band with it, so the travel is readable as
   travel rather than as a hairline teleporting. */
.working-variant-14 .pm14-playhead{
  position:absolute; top:-5px; bottom:-5px; width:1px; background:var(--text); z-index:4;
  transition:left var(--pm14-travel) var(--pm-ease-out);
  animation:pm14-head-in var(--pm-t-handoff) var(--pm-ease-out) both;
}
.working-variant-14 .pm14-playhead::before{
  content:""; position:absolute; left:-3px; top:-3px; width:7px; height:7px;
  background:var(--text); transform:rotate(45deg);
}
.working-variant-14 .pm14-playhead::after{
  content:""; position:absolute; left:-9px; right:-9px; top:5px; bottom:5px; pointer-events:none;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--text) 20%,transparent),transparent);
}
@keyframes pm14-head-in{ from{ opacity:0; } to{ opacity:1; } }

/* ---- detail deck: one card per segment, only the addressed one shows ----
   Every card is the same fixed height and clipped, so swapping between
   them on hover never reflows anything below the deck. */
.working-variant-14 .pm14-cards{ position:relative; height:80px; }
/* The deck is a single-slot swap, not a crossfade: the card that loses
   .live drops to zero in the same frame, and the arriving card is opaque
   immediately -- its rows, not the card, carry the entrance. Two stacked
   cards at part opacity would smear two sentences over each other. */
.working-variant-14 .pm14-card{
  position:absolute; inset:0; opacity:0; pointer-events:none; overflow:hidden;
  border-left:2px solid var(--pm-step,var(--accent)); padding:3px 0 0 8px;
  --pm-row-base:40ms;
}
.working-variant-14 .pm14-card.live{ opacity:1; }
.working-variant-14 .pm14-card-top{ display:flex; align-items:baseline; gap:6px; min-width:0; }
.working-variant-14 .pm14-badge{
  display:inline-flex; align-items:center; gap:4px; flex:0 0 auto;
  font:700 8px/1 var(--font-mono); letter-spacing:.1em; text-transform:uppercase;
  color:var(--pm-step,var(--accent));
}
.working-variant-14 .pm14-card-top strong{
  font-size:12px; font-weight:750; letter-spacing:-.01em;
  min-width:0; flex:0 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.working-variant-14 .pm14-meta{ display:flex; align-items:baseline; gap:7px; margin-top:3px; }
.working-variant-14 .pm14-span{ font:600 8px/1 var(--font-mono); color:var(--subtle); flex:0 0 auto; }
.working-variant-14 .pm14-dur{ font:700 9px/1 var(--font-mono); color:var(--muted); flex:0 0 auto; }
.working-variant-14 .pm14-card p{
  margin:3px 0 0; font-size:10px; line-height:1.4; color:var(--muted);
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
}
/* The sentence resolves a word at a time behind the rows above it. The
   beat is half the 45ms row cascade, because this is one row filling in,
   not a list arriving -- a full 45ms per word would still be writing
   itself when the next step lands. */
.working-variant-14 .pm14-card p.pm-stream{ --pm-t-cascade:26ms; }
.working-variant-14 .pm14-card p.pm-stream .pm-word{
  animation-delay:calc(150ms + var(--pm-stagger,0) * var(--pm-t-cascade));
}
/* The evidence run is deliberately one clipped line; it fades out rather
   than cutting a word in half when the card is at its narrow width. */
.working-variant-14 .pm14-ev{
  display:flex; gap:4px 10px; margin-top:3px; white-space:normal; overflow:hidden;
  flex-wrap:wrap;
  --pm-row-base:340ms;
}
.working-variant-14 .pm14-ev span{ font:600 10px/1.3 var(--font-mono); color:var(--subtle); }
.working-variant-14 .pm14-ev span::before{ content:"· "; }
.working-variant-14 .pm14-hint{ font:600 10px/1 var(--font-mono); letter-spacing:.06em; color:var(--subtle); }

/* Scrub addressing. :has() lets the hovered segment drive the deck with
   no JS at all, which means it survives the keyed patch untouched. */
.working-variant-14 .pm14:has(.pm14-seg:hover) .pm14-card.live{ opacity:0; }
.working-variant-14 .pm14:has(.pm14-seg:nth-child(1):hover) .pm14-card:nth-child(1),
.working-variant-14 .pm14:has(.pm14-seg:nth-child(2):hover) .pm14-card:nth-child(2),
.working-variant-14 .pm14:has(.pm14-seg:nth-child(3):hover) .pm14-card:nth-child(3),
.working-variant-14 .pm14:has(.pm14-seg:nth-child(4):hover) .pm14-card:nth-child(4),
.working-variant-14 .pm14:has(.pm14-seg:nth-child(5):hover) .pm14-card:nth-child(5),
.working-variant-14 .pm14:has(.pm14-seg:nth-child(6):hover) .pm14-card:nth-child(6),
.working-variant-14 .pm14:has(.pm14-seg:nth-child(7):hover) .pm14-card:nth-child(7),
.working-variant-14 .pm14:has(.pm14-seg:nth-child(8):hover) .pm14-card:nth-child(8),
.working-variant-14 .pm14:has(.pm14-seg:nth-child(9):hover) .pm14-card:nth-child(9),
.working-variant-14 .pm14:has(.pm14-seg:nth-child(10):hover) .pm14-card:nth-child(10),
.working-variant-14 .pm14:has(.pm14-seg:nth-child(11):hover) .pm14-card:nth-child(11),
.working-variant-14 .pm14:has(.pm14-seg:nth-child(12):hover) .pm14-card:nth-child(12),
.working-variant-14 .pm14:has(.pm14-seg:nth-child(13):hover) .pm14-card:nth-child(13),
.working-variant-14 .pm14:has(.pm14-seg:nth-child(14):hover) .pm14-card:nth-child(14){ opacity:1; }

/* ---- reduced motion, takes 13 and 14 ---------------------------------
   The global rule caps loops at one pass; these two takes also stage
   their handoffs over ~500ms, and a staged sequence is still motion. Flatten
   the delays so every beat lands at once, keep the state changes legible,
   and never leave a `both`-filled entrance holding an element at zero. */
@media (prefers-reduced-motion: reduce){
  .working-variant-13 .pm13-edge,
  .working-variant-13 .pm13-pen path,
  .working-variant-13 .pm13-pop,
  .working-variant-13 .pm13-lb,
  .working-variant-13 .pm13-cap-k,
  .working-variant-13 .pm13-cap-v{ animation-delay:0ms; animation-duration:120ms; }
  .working-variant-13 .pm13-cap-v{ filter:none; }
  .working-variant-13 .pm13-cur{ transition-duration:120ms; }
  .working-variant-14 .pm14-card p.pm-stream .pm-word{ animation-delay:0ms; animation-duration:1ms; filter:none; }
  .working-variant-14 .pm14-seal{ animation-duration:120ms; }
  .working-variant-14 .pm14-fill,
  .working-variant-14 .pm14-playhead{ transition-duration:120ms; }
}

/* =====================================================================
   15 — TERMINAL CAST
   ===================================================================== */
.working-variant-15 .pm15{ border:1px solid var(--border); background:var(--code); border-radius:2px; overflow:hidden; }
.working-variant-15 .pm15-bar{
  display:flex; align-items:center; gap:7px; padding:5px 8px;
  border-bottom:1px solid var(--border); background:var(--surface-2);
  font:600 8px/1 var(--font-mono); letter-spacing:.08em; color:var(--muted);
}
.working-variant-15 .pm15-title{ color:var(--subtle); }
.working-variant-15 .pm15-sp{ flex:1; }
.working-variant-15 .pm15-div{ color:color-mix(in srgb,var(--subtle) 55%,transparent); }
.working-variant-15 .pm15-rec{ color:var(--subtle); }
.working-variant-15 .pm15-rec.on{ color:var(--danger); }

.working-variant-15 .pm15-scroll{
  display:flex; flex-direction:column; justify-content:flex-end;
  /* min-height keeps the window a terminal-shaped box while it fills;
     max-height is the budget the take's JS renders against, so the
     transcript never overflows and never overlaps the card header. */
  min-height:150px; max-height:302px; overflow:hidden; padding:8px 9px;
  font:10px/1.5 var(--font-mono);
}
.working-variant-15 .pm15-scroll.scrolled{
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 20px);
          mask-image:linear-gradient(180deg,transparent 0,#000 20px);
}
.working-variant-15 .pm15-blk{ flex:0 0 auto; padding-bottom:7px; }
.working-variant-15 .pm15-blk.done{ opacity:.66; }
.working-variant-15 .pm15-blk.live,
.working-variant-15 .pm15-blk.tail{ opacity:1; }

.working-variant-15 .pm15-ps{ display:flex; gap:8px; white-space:pre; flex-wrap:wrap; }
.working-variant-15 .pm15-ps1{ color:var(--positive); }
.working-variant-15 .pm15-ps2{ color:var(--accent-2); }
.working-variant-15 .pm15-git{ color:var(--warning); }
.working-variant-15 .pm15-git::before{ content:"("; }
.working-variant-15 .pm15-git::after{ content:")"; }
.working-variant-15 .pm15-cmd{ display:flex; align-items:baseline; white-space:pre; }
.working-variant-15 .pm15-dollar{ color:var(--muted); flex:0 0 auto; }
.working-variant-15 .pm15-dollar::after{ content:" "; }
.working-variant-15 .pm15-txt{ color:var(--text); white-space:pre-wrap; word-break:break-word; min-width:0; }

/* the type-on: a steps() width reveal, which is what a cast actually is */
.working-variant-15 .pm15-type{
  display:inline-block; overflow:hidden; white-space:pre; vertical-align:bottom;
  color:var(--text); width:0;
  animation-name:pm15-type;
  animation-duration:calc(var(--n,20) * 17ms);
  animation-timing-function:steps(var(--n,20),end);
  animation-fill-mode:both;
}
@keyframes pm15-type{ from{ width:0; } to{ width:calc(var(--n,20) * 1ch); } }

.working-variant-15 .pm15-caret{
  display:inline-block; width:.62em; height:1.05em; margin-left:1px;
  background:var(--text); vertical-align:-.18em;
  animation:pm15-blink 1060ms step-end infinite;
}
.working-variant-15 .pm15-caret.idle{ background:var(--muted); }
@keyframes pm15-blink{ 0%,50%{ opacity:1; } 50.01%,100%{ opacity:0; } }

/* pre-wrap so the spawn step can column-align its job table with real
   padding, while long lines still wrap at the narrow card width. */
.working-variant-15 .pm15-out{ color:var(--muted); padding-left:2px; white-space:pre-wrap; word-break:break-word; }
.working-variant-15 .pm15-out .pm15-pfx{ color:color-mix(in srgb,var(--subtle) 75%,transparent); padding-right:6px; }
.working-variant-15 .pm15-out.in{
  animation:pm15-out-in var(--pm-t-row) var(--pm-ease-out) both;
  animation-delay:calc(var(--d0,0ms) + var(--i,0) * var(--pm-t-cascade));
}
@keyframes pm15-out-in{
  from{ opacity:0; filter:blur(var(--pm-blur)); transform:translateY(var(--pm-rise)); }
  60% { opacity:1; }
  to  { opacity:1; filter:blur(0); transform:none; }
}

.working-variant-15 .pm15-exit{ display:flex; align-items:baseline; gap:8px; padding-left:2px; font-size:9px; }
.working-variant-15 .pm15-ok{ color:var(--positive); }
.working-variant-15 .pm15-el{ color:var(--subtle); }
.working-variant-15 .pm15-at{ color:color-mix(in srgb,var(--subtle) 85%,transparent); }
.working-variant-15 .pm15-exit .pm15-sp{ flex:1; }
.working-variant-15 .pm15-exit.in{
  animation:pm15-exit-in var(--pm-t-label) var(--pm-ease-out) both;
  animation-delay:calc(var(--d0,0ms) + var(--i,0) * var(--pm-t-cascade) + 120ms);
}
@keyframes pm15-exit-in{ from{ opacity:0; transform:translateY(2px); } to{ opacity:1; transform:none; } }

/* =====================================================================
   Reduced motion — stop the loops, keep the state changes legible.
   ===================================================================== */
@media (prefers-reduced-motion: reduce){
  .working-variant-12 .pm12-scroll,
  .working-variant-13 .pm13-chase,
  .working-variant-14 .pm14-seg.now .pm14-fill,
  .working-variant-15 .pm15-caret{ animation:none; }
  .working-variant-15 .pm15-caret{ opacity:1; }
  .working-variant-15 .pm15-type{ animation-duration:1ms; }
  .working-variant-13 .pm13-edge{ animation-duration:1ms; }
  .working-variant-13 .pm13-pop,
  .working-variant-13 .pm13-lb{ animation-duration:1ms; animation-delay:0ms; }
  .working-variant-15 .pm15-out.in,
  .working-variant-15 .pm15-exit.in{ animation-duration:1ms; animation-delay:0ms; filter:none; }
}

/* Working-animation takes — group c (variants-c.js, takes 16..23).
   Every rule is scoped under .working-variant-N so takes cannot bleed
   into each other. Entrances reuse the measured vocabulary in motion.css
   (pm-materialize, pm-shimmer, pm-stream); new keyframes are per-take
   and prefixed cNN-. All durations reference the --pm-t-* tokens. */

/* 16 — Loom ------------------------------------------------------------ */
.working-variant-16 .loom-stage{display:flex;flex-direction:column;gap:7px}
.working-variant-16 .loom-verb{font-weight:750;font-size:13px;letter-spacing:-.01em}
.working-variant-16 .loom-detail{color:var(--muted);font-size:11px;line-height:1.5}
.working-variant-16 .loom-bar{height:2px;background:var(--surface-4);border-radius:2px;overflow:hidden;margin-top:2px}
.working-variant-16 .loom-bar i{display:block;height:100%;background:var(--pm-step,var(--accent));border-radius:inherit;transition:width var(--pm-t-panel) var(--pm-ease-out)}

/* 17 — Pulse Grid ------------------------------------------------------- */
.working-variant-17 .c17-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.working-variant-17 .c17-tile{position:relative;height:34px;border-radius:8px;border:1px solid var(--border);display:grid;place-items:center;color:var(--muted);overflow:hidden;background:var(--surface-3)}
.working-variant-17 .c17-tile.done{color:var(--text);border-color:color-mix(in srgb,var(--pm-step,var(--accent)) 45%,var(--border));background:color-mix(in srgb,var(--pm-step,var(--accent)) 12%,var(--surface-3))}
.working-variant-17 .c17-tile.current{color:var(--pm-step,var(--accent));border-color:color-mix(in srgb,var(--pm-step,var(--accent)) 60%,var(--border))}
.working-variant-17 .c17-tile.current::after{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0deg,color-mix(in srgb,var(--pm-step,var(--accent)) 30%,transparent) 60deg,transparent 120deg);animation:c17-sweep 1.8s linear infinite}
@keyframes c17-sweep{to{transform:rotate(360deg)}}

/* 18 — Ledger ------------------------------------------------------------ */
.working-variant-18 .c18-sheet{position:relative;padding:5px 10px 7px;display:flex;flex-direction:column}
.working-variant-18 .c18-row{display:flex;align-items:baseline;justify-content:space-between;height:22px;font-size:11px}
.working-variant-18 .c18-name{color:var(--muted)}
.working-variant-18 .c18-row.done .c18-name{color:var(--text)}
.working-variant-18 .c18-row.current .c18-name{color:var(--pm-step,var(--accent));font-weight:600}
.working-variant-18 .c18-val{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:inline-flex;align-items:baseline;gap:2px}
.working-variant-18 .c18-val u{text-decoration:none;opacity:.6}
.working-variant-18 .c18-bar{position:absolute;left:10px;right:10px;height:2px;border-radius:2px;background:var(--pm-step,var(--accent));transition:top var(--pm-t-panel) var(--pm-ease-out)}

/* 19 — Constellation ------------------------------------------------------ */
.working-variant-19 .c19-sky{border-radius:10px;background:color-mix(in srgb,var(--pm-step,var(--accent)) 4%,var(--surface-3))}
.working-variant-19 .c19-star.next{fill:var(--surface-4)}
.working-variant-19 .c19-star.done{fill:color-mix(in srgb,var(--pm-step,var(--accent)) 75%,var(--text));animation:c19-pop 260ms var(--pm-ease-pop) both;transform-box:fill-box;transform-origin:center}
.working-variant-19 .c19-star.current{fill:var(--pm-step,var(--accent))}
.working-variant-19 .c19-seg{stroke:color-mix(in srgb,var(--pm-step,var(--accent)) 40%,var(--border));stroke-width:1;stroke-dasharray:1;animation:c19-ink var(--pm-t-panel) var(--pm-ease-out) both}
.working-variant-19 .c19-halo{fill:none;stroke:var(--pm-step,var(--accent));stroke-width:1;animation:c19-halo 1.6s var(--pm-ease-out) infinite}
@keyframes c19-pop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes c19-ink{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes c19-halo{0%{r:4;opacity:.9}100%{r:11;opacity:0}}

/* 20 — Metronome ----------------------------------------------------------- */
.working-variant-20 .c20-body{display:flex;flex-direction:column;align-items:center;gap:9px}
.working-variant-20 .c20-dial{position:relative;width:120px;height:64px;overflow:hidden}
.working-variant-20 .c20-arm{position:absolute;left:50%;top:6px;width:2px;height:54px;margin-left:-1px;border-radius:2px;background:linear-gradient(var(--pm-step,var(--accent)),transparent);transform-origin:top center;animation:c20-swing 1.6s var(--pm-ease-out) infinite alternate}
.working-variant-20 .c20-pivot{position:absolute;left:50%;top:4px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--pm-step,var(--accent))}
.working-variant-20 .c20-ticks{display:flex;gap:9px}
.working-variant-20 .c20-tick{width:10px;height:10px;border-radius:3px;background:var(--surface-4);border:1px solid var(--border)}
.working-variant-20 .c20-tick.done{background:color-mix(in srgb,var(--pm-step,var(--accent)) 55%,var(--surface-3));border-color:color-mix(in srgb,var(--pm-step,var(--accent)) 55%,var(--border))}
.working-variant-20 .c20-tick.current{background:var(--pm-step,var(--accent));border-color:var(--pm-step,var(--accent));animation:c20-glow 1.6s var(--pm-ease-out) infinite alternate}
.working-variant-20 .c20-count{font-size:10px;color:var(--muted)}
.working-variant-20 .c20-count u{text-decoration:none;opacity:.7}
@keyframes c20-swing{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes c20-glow{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--pm-step,var(--accent)) 55%,transparent)}to{box-shadow:0 0 0 4px color-mix(in srgb,var(--pm-step,var(--accent)) 0%,transparent)}}

/* 21 — Filmstrip --------------------------------------------------------------- */
.working-variant-21 .c21-strip{position:relative;height:78px;border-radius:10px;background:linear-gradient(#0d0f13,#0d0f13) padding-box;background-color:#0d0f13;overflow:hidden}
.working-variant-21 .c21-strip::before,.working-variant-21 .c21-strip::after{content:'';position:absolute;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,transparent 0 10px,#2a2f38 10px 18px);opacity:.8}
.working-variant-21 .c21-strip::before{top:2px}
.working-variant-21 .c21-strip::after{bottom:2px}
.working-variant-21 .c21-reel{display:flex;gap:4px;height:100%;padding:12px 0;margin-left:50%;transition:transform var(--pm-t-panel) var(--pm-ease-out);will-change:transform}
.working-variant-21 .c21-frame{flex:0 0 54px;height:54px;border-radius:5px;border:1px solid #23272f;background:#15181e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#3c424d}
.working-variant-21 .c21-frame u{text-decoration:none;font-size:10px;letter-spacing:.04em}
.working-variant-21 .c21-frame.done{color:#8a93a3;background:#1b1f27}
.working-variant-21 .c21-frame.current{color:var(--pm-step,var(--accent));border-color:color-mix(in srgb,var(--pm-step,var(--accent)) 60%,#23272f);animation:c21-develop 600ms var(--pm-ease-out) both}
@keyframes c21-develop{from{filter:blur(3px) saturate(.4)}to{filter:blur(0) saturate(1)}}

/* 22 — Sonar ------------------------------------------------------------------------ */
.working-variant-22 .c22-body{display:flex;align-items:center;gap:14px}
.working-variant-22 .c22-scope{position:relative;width:100px;height:100px;flex:none;border-radius:50%;border:1px solid color-mix(in srgb,var(--pm-step,var(--accent)) 35%,var(--border));background:radial-gradient(circle,color-mix(in srgb,var(--pm-step,var(--accent)) 6%,var(--surface-3)) 0%,var(--surface-3) 72%);overflow:hidden}
.working-variant-22 .c22-scope::before{content:'';position:absolute;inset:25%;border-radius:50%;border:1px solid color-mix(in srgb,var(--pm-step,var(--accent)) 18%,transparent)}
.working-variant-22 .c22-ring{position:absolute;inset:0;border-radius:50%;border:1px solid color-mix(in srgb,var(--pm-step,var(--accent)) 45%,transparent);animation:c22-ring 1.8s var(--pm-ease-out) infinite}
.working-variant-22 .c22-r2{animation-delay:.9s}
.working-variant-22 .c22-sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,color-mix(in srgb,var(--pm-step,var(--accent)) 26%,transparent) 0deg,transparent 70deg);animation:c22-sweep 2.4s linear infinite}
.working-variant-22 .c22-core{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--pm-step,var(--accent))}
.working-variant-22 .c22-blip{position:absolute;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:color-mix(in srgb,var(--pm-step,var(--accent)) 80%,var(--text))}
.working-variant-22 .c22-blip.current{animation:c22-blip 1.2s var(--pm-ease-out) infinite}
.working-variant-22 .c22-readout{min-width:0;flex:1}
.working-variant-22 .c22-cmd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;color:var(--text);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes c22-ring{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1);opacity:0}}
@keyframes c22-sweep{to{transform:rotate(360deg)}}
@keyframes c22-blip{0%,100%{opacity:1}50%{opacity:.35}}
.working-variant-22 .c22-cmd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;color:var(--text);display:block;white-space:normal;overflow-wrap:anywhere;line-height:1.5}
/* 23 — Circuit --------------------------------------------------------------------------- */
.working-variant-23 .c23-body{display:flex;flex-direction:column;gap:2px}
.working-variant-23 .c23-base{stroke:var(--surface-4);stroke-width:2}
.working-variant-23 .c23-done{stroke:color-mix(in srgb,var(--pm-step,var(--accent)) 70%,var(--text));stroke-width:2;animation:c23-lit 260ms var(--pm-ease-out) both}
.working-variant-23 .c23-live{stroke:var(--pm-step,var(--accent));stroke-width:2;stroke-dasharray:4 5;animation:c23-flow 1.2s linear infinite}
.working-variant-23 .c23-pad.next{fill:var(--surface-3);stroke:var(--surface-4)}
.working-variant-23 .c23-pad.done{fill:color-mix(in srgb,var(--pm-step,var(--accent)) 70%,var(--text));stroke:none}
.working-variant-23 .c23-pad.current{fill:var(--pm-step,var(--accent));stroke:none;animation:c23-breathe 1.6s var(--pm-ease-out) infinite alternate}
.working-variant-23 .c23-count{font-size:10px;color:var(--muted);text-align:right}
@keyframes c23-lit{from{opacity:0}to{opacity:1}}
@keyframes c23-flow{to{stroke-dashoffset:-18}}
@keyframes c23-breathe{from{opacity:1}to{opacity:.55}}

/* =====================================================================
   Transcript takes 8-15.
   Options 0-7 live in styles.css. These are scoped under
   .transcript[data-variant="N"] exactly like those, so they operate on the
   same markup and inherit every feature it carries: long-message fade and
   expand, message details, per-message actions, system and event cards,
   the working card, plan cards, artifact cards and decision surfaces.

   Drawn from a survey of 36 open-source AI chat clients. Each fills a gap
   the first eight leave open; provenance is noted per take.

   Shared hooks emitted by renderTextMessage():
     data-index / --msg-index   ordinal within the thread
     data-time                  deterministic wall clock
     data-speaker               "You" | "Assistant"
   ===================================================================== */

/* ---- 8 Aligned Bubbles ----------------------------------------------
   The modern consensus: user writes a sentence, the model writes a
   document, so only the user gets a bubble. 5 of 12 surveyed web clients
   land here (LibreChat, Jan, Lobe Chat, Open WebUI, AnythingLLM). The
   base transcript right-aligns the user at 88% width, which is not the
   same thing -- a bubble has to be compact to read as one. Jan's trick of
   putting the larger gap BEFORE a user turn restores the rhythm that a
   full-bleed assistant turn loses. */
.transcript[data-variant="8"] .transcript-inner{gap:10px}
.transcript[data-variant="8"] .message-user{margin-top:16px}
.transcript[data-variant="8"] .message-user .message-surface{
  width:fit-content;max-width:min(72%,560px);
  border-radius:16px 16px 4px 16px;padding:10px 14px}
.transcript[data-variant="8"] .message-assistant .message-surface{
  width:100%;padding:0 2px;background:none;border:0}
.transcript[data-variant="8"] .message-assistant .message-role{
  color:var(--accent);letter-spacing:.02em}
.transcript[data-variant="8"] .message-user{animation:tr8-user 320ms var(--pm-ease-pop) both}
.transcript[data-variant="8"] .message-assistant{animation:tr8-reply 260ms var(--pm-ease-out) both}
@keyframes tr8-user{from{opacity:0;transform:translateX(20px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tr8-reply{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:blur(0)}}

/* ---- 9 Zebra Rows ---------------------------------------------------
   Full-bleed alternating bands. Unambiguous turn boundaries at any
   length, and the band is a free status channel -- Big-AGI tints rows for
   errors and for edited system prompts. Newer apps abandoned stripes as
   tool rendering got richer, so the band here is kept very quiet. */
.transcript[data-variant="9"] .transcript-inner{gap:0}
.transcript[data-variant="9"] .message,
.transcript[data-variant="9"] .system-card,
.transcript[data-variant="9"] .event-card{
  padding:14px clamp(10px,2vw,22px);margin:0 calc(-1 * clamp(10px,2vw,22px));
  border-bottom:1px solid var(--border)}
.transcript[data-variant="9"] .message:nth-child(odd){background:var(--surface-2)}
.transcript[data-variant="9"] .event-card{background:color-mix(in srgb,var(--warning) 7%,var(--surface-2))}
.transcript[data-variant="9"] .message-user .message-surface{
  width:100%;background:none;border:0;border-radius:0;padding:0}
.transcript[data-variant="9"] .message-assistant .message-surface{width:100%;padding:0}
.transcript[data-variant="9"] .message-user::before{
  content:attr(data-speaker);display:block;font-size:10px;font-weight:700;
  color:var(--muted);margin-bottom:6px}
.transcript[data-variant="9"] .message{animation:tr9-band 340ms var(--pm-ease-out) both}
@keyframes tr9-band{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0)}}

/* ---- 10 Sticky Rail -------------------------------------------------
   Big-AGI pins the avatar column beside a long answer
   (position:sticky; top:0.25rem) so attribution never scrolls away from
   the text it belongs to. Worth having as a whole layout, not a detail. */
.transcript[data-variant="10"] .transcript-inner{gap:18px}
.transcript[data-variant="10"] .message{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;justify-content:start}
.transcript[data-variant="10"] .message::before{
  content:attr(data-speaker);position:sticky;top:4px;align-self:start;
  font-size:10px;font-weight:750;color:var(--muted);text-align:right;
  padding-top:2px;border-right:2px solid var(--border);padding-right:10px;min-height:22px}
.transcript[data-variant="10"] .message-assistant::before{
  color:var(--accent);border-right-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.transcript[data-variant="10"] .message-assistant .message-role{display:none}
.transcript[data-variant="10"] .message-user .message-surface{
  width:100%;border-radius:10px;padding:9px 12px}
.transcript[data-variant="10"] .message-assistant .message-surface{width:100%;padding:0}
.transcript[data-variant="10"] .message{animation:tr10-rail 300ms var(--pm-ease-out) both}
@keyframes tr10-rail{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}

/* ---- 11 Timeline Gutter ---------------------------------------------
   Jan threads tool calls between reasoning paragraphs on one continuous
   dotted rail. Applied to whole turns, with the deterministic clock from
   data-time as the tick label, the transcript reads as a record. */
.transcript[data-variant="11"] .transcript-inner{gap:16px;padding-left:4px}
.transcript[data-variant="11"] .message{
  display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;position:relative}
.transcript[data-variant="11"] .message::before{
  content:attr(data-time);font-family:var(--font-mono);font-size:9px;color:var(--subtle);
  text-align:right;padding-top:3px}
.transcript[data-variant="11"] .message::after{
  content:"";position:absolute;left:63px;top:6px;bottom:-16px;width:1px;
  border-left:1px dotted color-mix(in srgb,var(--accent) 35%,var(--border));
  animation:tr11-rail 380ms var(--pm-ease-out) both;transform-origin:top}
.transcript[data-variant="11"] .message:last-child::after{display:none}
.transcript[data-variant="11"] .message-surface{position:relative}
.transcript[data-variant="11"] .message-surface::before{
  content:"";position:absolute;left:-19px;top:6px;width:7px;height:7px;border-radius:50%;
  background:var(--surface);border:2px solid var(--accent);
  animation:tr11-dot 260ms var(--pm-ease-pop) both}
.transcript[data-variant="11"] .message-user .message-surface{width:100%;border-radius:10px;padding:9px 12px}
.transcript[data-variant="11"] .message-assistant .message-surface{width:100%;padding:0}
@keyframes tr11-rail{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes tr11-dot{from{opacity:0;transform:scale(.2) translateY(-6px)}to{opacity:1;transform:none}}

/* ---- 12 Notebook Cells ----------------------------------------------
   In[n] / Out[n]. No surveyed chat client ships this, though every one of
   them is a sequence of numbered request/response pairs -- which is what a
   notebook is. The ordinal comes from data-index. */
.transcript[data-variant="12"] .transcript-inner{gap:12px}
.transcript[data-variant="12"] .message{
  display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start}
.transcript[data-variant="12"] .message::before{
  font-family:var(--font-mono);font-size:10px;color:var(--subtle);text-align:right;padding-top:8px;
  animation:tr12-stamp 240ms var(--pm-ease-pop) both}
.transcript[data-variant="12"] .message-user::before{content:"In [" counter(msgc) "]";color:var(--accent)}
.transcript[data-variant="12"] .message-assistant::before{content:"Out [" counter(msgc) "]";color:var(--positive)}
.transcript[data-variant="12"] .transcript-inner{counter-reset:msgc}
.transcript[data-variant="12"] .message{counter-increment:msgc}
.transcript[data-variant="12"] .message-surface{
  width:100%!important;border-radius:0;border:0;border-left:2px solid var(--border);
  background:var(--surface-2);padding:8px 12px}
.transcript[data-variant="12"] .message-user .message-surface{
  border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--surface-2))}
.transcript[data-variant="12"] .message-assistant .message-surface{border-left-color:var(--positive)}
.transcript[data-variant="12"] .message-assistant .message-role{display:none}
.transcript[data-variant="12"] .message-surface{animation:tr12-cell 300ms var(--pm-ease-out) both}
@keyframes tr12-stamp{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes tr12-cell{from{opacity:0;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(0)}}

/* ---- 13 Focus Reader ------------------------------------------------
   Big-AGI ghosts messages dropped from context (1px dashed + grayscale)
   rather than hiding them. As a mode: everything recedes except the turn
   you are reading, so a long transcript stops competing with itself.
   Hover or focus restores any turn, so nothing is unreachable. */
.transcript[data-variant="13"] .transcript-inner{gap:16px}
.transcript[data-variant="13"] .transcript-inner > *{
  filter:opacity(.42) saturate(.55);
  transition:filter 320ms var(--pm-ease-out)}
.transcript[data-variant="13"] .transcript-inner > :nth-last-child(-n+2),
.transcript[data-variant="13"] .transcript-inner > *:hover,
.transcript[data-variant="13"] .transcript-inner > *:focus-within{
  filter:none}
.transcript[data-variant="13"] .message-user .message-surface{width:min(80%,700px)}
.transcript[data-variant="13"] .message{animation:tr13-focus 360ms var(--pm-ease-out) both}
@keyframes tr13-focus{from{transform:translateY(10px) scale(.99)}to{transform:none}}

/* ---- 14 Print Sheet -------------------------------------------------
   Khoj ships a ~120-line @media print stylesheet that re-renders the
   conversation as a document: user turns become headings, the assistant
   goes full width, chrome vanishes, and the timestamp is re-injected as a
   divider from a data attribute. It is the only project in the survey
   treating "the transcript as a printed page" as a first-class rendering.
   Here it is a live mode rather than something you only get on paper. */
.transcript[data-variant="14"]{background:var(--surface-2)}
.transcript[data-variant="14"] .transcript-inner{
  max-width:760px;gap:20px;background:var(--surface);
  padding:30px clamp(18px,3vw,40px);border-radius:4px;
  box-shadow:0 1px 3px rgb(0 0 0 / .10),0 10px 34px rgb(0 0 0 / .06)}
.transcript[data-variant="14"] .message-user{display:block}
.transcript[data-variant="14"] .message-user .message-surface{
  width:100%;background:none;border:0;border-radius:0;padding:0;
  border-bottom:1px solid var(--border);padding-bottom:8px}
.transcript[data-variant="14"] .message-user .message-body{
  font-size:16px;font-weight:750;line-height:1.35;letter-spacing:-.01em}
.transcript[data-variant="14"] .message-user::before{
  content:attr(data-time);display:block;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--subtle);margin-bottom:5px}
.transcript[data-variant="14"] .message-assistant .message-surface{width:100%;padding:0}
.transcript[data-variant="14"] .message-assistant .message-body{font-size:13.5px;line-height:1.75}
.transcript[data-variant="14"] .message-assistant .message-role{
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--subtle);
  margin-bottom:7px}
.transcript[data-variant="14"] .message-assistant .message-role svg{display:none}
.transcript[data-variant="14"] .message-actions .text-button{font-size:9px;color:var(--subtle)}
.transcript[data-variant="14"] .message{animation:tr14-page 380ms var(--pm-ease-out) both}
@keyframes tr14-page{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- 15 Threaded Turns ----------------------------------------------
   No app in the survey renders a branching transcript -- all eight that
   support regeneration collapse siblings to a "< n/m >" stepper, and any
   nesting happens INSIDE one assistant turn. So: the work a turn spawned
   hangs off it on a drawn branch, and the turn itself stays the trunk. */
.transcript[data-variant="15"] .transcript-inner{gap:10px}
.transcript[data-variant="15"] .message-user .message-surface{width:min(78%,640px)}
.transcript[data-variant="15"] .message-assistant .message-surface{width:100%;padding:0}
.transcript[data-variant="15"] .transcript-inner > :not(.message){
  margin-left:28px;position:relative}
.transcript[data-variant="15"] .transcript-inner > :not(.message)::before{
  content:"";position:absolute;left:-15px;top:-8px;bottom:50%;width:13px;
  border-left:1px solid color-mix(in srgb,var(--accent) 40%,var(--border));
  border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,var(--border));
  border-bottom-left-radius:9px;
  animation:tr15-branch 340ms var(--pm-ease-out) both;transform-origin:top left}
.transcript[data-variant="15"] .message{animation:tr15-turn 300ms var(--pm-ease-out) both}
@keyframes tr15-branch{from{opacity:0;transform:scaleY(.1)}to{opacity:1;transform:scaleY(1)}}
@keyframes tr15-turn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){
  .transcript[data-variant="8"] .message-user,.transcript[data-variant="8"] .message-assistant,
  .transcript[data-variant="9"] .message,.transcript[data-variant="10"] .message,
  .transcript[data-variant="11"] .message::after,.transcript[data-variant="11"] .message-surface::before,
  .transcript[data-variant="12"] .message::before,.transcript[data-variant="12"] .message-surface,
  .transcript[data-variant="13"] .message,.transcript[data-variant="14"] .message,
  .transcript[data-variant="15"] .message,
    .transcript[data-variant="15"] .transcript-inner > :not(.message)::before{
    animation:none}
}
</style>
