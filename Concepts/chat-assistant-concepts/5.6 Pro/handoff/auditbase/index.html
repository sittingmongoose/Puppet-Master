<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Puppet Master — Assistant Concept Lab 5.6 Pro</title>
  <style>:root {
  --font-ui: Inter, "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-friendly: Poppins, Inter, "Segoe UI Variable", system-ui, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --header-h: 42px;
  --status-h: 24px;
  --radius-xs: 6px;
  --radius-sm: 9px;
  --radius: 12px;
  --radius-lg: 18px;
  --spring: 520ms linear(0,0.006,0.025 2.8%,0.101 6.1%,0.539 18.9%,0.749 25%,0.866 31.2%,0.937 37.6%,0.978 44.4%,1.002 51.8%,1.014 59.8%,1.017 68.8%,1.011 79.1%,1.003 89.8%,1);
  --spring-soft: 440ms linear(0,0.01,0.04 4%,0.17 9%,0.55 20%,0.79 31%,0.92 43%,0.985 56%,1.012 70%,1.005 84%,1);
  --ease: cubic-bezier(.2,.75,.25,1);
--on-accent:#fff;
  --shadow-float: 0 18px 65px rgb(0 0 0 / .42), 0 4px 18px rgb(0 0 0 / .26);
  --shadow-soft: 0 8px 28px rgb(0 0 0 / .20);
  --z-menu: 1000;
  --z-drawer: 900;
  --z-tip: 1100;
}
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; }
body { font-family:var(--font-ui); font-size:13px; line-height:1.45; color:var(--text); background:var(--canvas); text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased; }
button, input, textarea, select { font:inherit; color:inherit; }
button { border:0; }
button, [role="button"] { -webkit-tap-highlight-color:transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline:2px solid color-mix(in srgb,var(--accent) 72%,white); outline-offset:2px; }
[hidden] { display:none !important; }
svg { display:block; }
::selection { background:color-mix(in srgb,var(--accent) 32%,transparent); }

body[data-theme="basic-dark"] { --canvas:#080a11;--surface:#0e111a;--surface-2:#131725;--surface-3:#1a2030;--surface-4:#222a3b;--text:#f3f5fb;--muted:#8e97aa;--subtle:#626b7d;--border:#252b39;--border-strong:#353d50;--accent:#8b72ff;--accent-2:#5cc8ff;--positive:#5cd69b;--warning:#f5bd55;--danger:#ff6c7d;--glass:rgba(18,22,34,.92);--code:#090d16;--user:#22203a;--assistant:#111621; }
body[data-theme="basic-light"] { --canvas:#edf0f6;--surface:#ffffff;--surface-2:#f5f7fb;--surface-3:#e9edf5;--surface-4:#dfe4ee;--text:#111827;--muted:#667085;--subtle:#8d96a8;--border:#dce1eb;--border-strong:#c8cfdd;--accent:#6552df;--accent-2:#187da8;--positive:#16845a;--warning:#a96400;--danger:#c73b52;--glass:rgba(255,255,255,.94);--code:#f3f5f8;--user:#ece9ff;--assistant:#fff; }

body[data-theme="friendly-light"] { --canvas:#f8f2ef;--surface:#fffaf7;--surface-2:#f7ece8;--surface-3:#efdfda;--surface-4:#e5d2cc;--text:#382e35;--muted:#756772;--subtle:#a3929d;--border:#eadbd6;--border-strong:#d8c3bc;--accent:#cf5f85;--accent-2:#268f83;--positive:#2f8d63;--warning:#9b6815;--danger:#c94f5c;--glass:rgba(255,250,247,.94);--code:#f4e9e6;--user:#f8dde7;--assistant:#fffaf7; }
body[data-theme="glass-dark"] { --on-accent:#1b1030;--canvas:#130d2b;--surface:rgba(22,16,47,.72);--surface-2:rgba(34,25,65,.72);--surface-3:rgba(54,40,88,.68);--surface-4:rgba(71,53,107,.72);--text:#faf7ff;--muted:#b0a8c9;--subtle:#7c7298;--border:rgba(181,159,255,.16);--border-strong:rgba(196,179,255,.28);--accent:#b287ff;--accent-2:#75d7ef;--positive:#7be0af;--warning:#ffd074;--danger:#ff8198;--glass:rgba(24,17,52,.82);--code:rgba(8,6,22,.72);--user:rgba(104,67,160,.35);--assistant:rgba(25,20,50,.72); }
body[data-theme="glass-light"] { --canvas:#e7e3f5;--surface:rgba(255,255,255,.62);--surface-2:rgba(250,248,255,.74);--surface-3:rgba(238,233,250,.74);--surface-4:rgba(227,220,244,.78);--text:#28213d;--muted:#716987;--subtle:#9991aa;--border:rgba(92,69,135,.13);--border-strong:rgba(92,69,135,.23);--accent:#7a55ca;--accent-2:#237e9d;--positive:#25845e;--warning:#9b6710;--danger:#ba435c;--glass:rgba(255,255,255,.78);--code:rgba(241,238,249,.82);--user:rgba(205,190,240,.58);--assistant:rgba(255,255,255,.62); }
body[data-theme="retro-dark"] { --on-accent:#06251a;--canvas:#07110f;--surface:#0b1714;--surface-2:#10221d;--surface-3:#163028;--surface-4:#1b3d32;--text:#d9ffe7;--muted:#7db394;--subtle:#4f8065;--border:#1b3b30;--border-strong:#2e5b49;--accent:#60f39a;--accent-2:#59d6ff;--positive:#74ffb0;--warning:#f2d35e;--danger:#ff6b70;--glass:rgba(8,22,18,.94);--code:#040b09;--user:#153426;--assistant:#0b1814;--font-ui:var(--font-mono); }
body[data-theme="retro-light"] { --canvas:#ecebd7;--surface:#f8f6df;--surface-2:#efedd2;--surface-3:#e2dfbf;--surface-4:#d4d0aa;--text:#22342b;--muted:#607567;--subtle:#8a9a8f;--border:#d6d2b2;--border-strong:#bbb794;--accent:#19734c;--accent-2:#166d83;--positive:#16734c;--warning:#86600d;--danger:#a33d42;--glass:rgba(248,246,223,.95);--code:#e8e5c9;--user:#d7eadb;--assistant:#f8f6df;--font-ui:var(--font-mono); }
body[data-theme^="friendly"] { --font-ui:var(--font-friendly); }
body[data-theme^="glass"]::before { content:"";position:fixed;inset:-25%;z-index:-1;background:radial-gradient(circle at 15% 20%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 34%),radial-gradient(circle at 82% 18%,color-mix(in srgb,var(--accent-2) 22%,transparent),transparent 32%),radial-gradient(circle at 55% 88%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 38%);filter:blur(12px); }

#pmRoot { width:100%;height:100%; }
#pmOverlayRoot { position:fixed;inset:0;pointer-events:none;z-index:var(--z-menu); }
.pm-shell { display:grid;grid-template-rows:var(--header-h) minmax(0,1fr) var(--status-h);width:100%;height:100%;background:var(--canvas); }
.app-header { display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface) 94%,transparent);min-width:0;z-index:20; }
.brand { display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;letter-spacing:-.015em;white-space:nowrap; }
.brand-mark { width:15px;height:15px;border-radius:5px;background:linear-gradient(135deg,var(--accent-2),var(--accent));box-shadow:0 0 18px color-mix(in srgb,var(--accent) 45%,transparent); }
.brand small { color:var(--muted);font-weight:500;border-left:1px solid var(--border);padding-left:9px; }
.header-spacer { flex:1; }
.header-actions { display:flex;align-items:center;gap:4px;min-width:0; }
.header-chip, .icon-button, .soft-button, .primary-button, .text-button, .selector-button { display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:30px;border-radius:var(--radius-sm);cursor:pointer;transition:background 150ms var(--ease),color 150ms var(--ease),border-color 150ms var(--ease),transform 150ms var(--ease); }
.header-chip { padding:0 9px;background:transparent;color:var(--muted); }
.header-chip:hover,.icon-button:hover,.text-button:hover,.selector-button:hover { background:var(--surface-3);color:var(--text); }
.header-chip:active,.icon-button:active,.soft-button:active,.primary-button:active { transform:scale(.965); }
.icon-button { width:30px;height:30px;background:transparent;color:var(--muted);padding:0; }
.icon-button.active { color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface-2)); }
.soft-button { padding:0 11px;background:var(--surface-3);color:var(--text);border:1px solid var(--border); }
.soft-button:hover { background:var(--surface-4);border-color:var(--border-strong); }
.primary-button { padding:0 13px;background:var(--accent);color:var(--on-accent);font-weight:680;box-shadow:0 7px 20px color-mix(in srgb,var(--accent) 24%,transparent); }
.primary-button:hover { filter:brightness(1.08); }
.text-button { padding:0 7px;background:transparent;color:var(--muted); }
.text-button.danger { color:var(--danger); }
.workspace { display:grid;grid-template-columns:minmax(250px,var(--editor-w,54%)) 5px minmax(430px,1fr);min-height:0;min-width:0; }
.editor-pane { min-width:0;min-height:0;display:grid;grid-template-rows:36px minmax(0,1fr);background:var(--surface);border-right:1px solid var(--border); }
.editor-tabs { display:flex;align-items:end;gap:1px;padding:4px 6px 0;border-bottom:1px solid var(--border);overflow:auto hidden;background:var(--surface-2);scrollbar-width:none; }
.editor-tabs::-webkit-scrollbar { display:none; }
.editor-tab { display:flex;align-items:center;gap:6px;min-width:110px;max-width:210px;height:31px;padding:0 9px;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap; }
.editor-tab.active { background:var(--surface);color:var(--text);box-shadow:inset 0 2px var(--accent); }
.editor-tab-label { overflow:hidden;text-overflow:ellipsis; }
.editor-tab .close { margin-left:auto;opacity:.45; }
.editor-body { min-height:0;overflow:auto;padding:20px 24px;background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 96%,transparent),var(--surface)); }
.editor-empty { height:100%;display:grid;place-items:center;color:var(--subtle);text-align:center; }
.editor-doc { max-width:980px;margin:0 auto;animation:fade-up 280ms var(--ease) both; }
.editor-doc h1 { font-size:24px;line-height:1.2;margin:0 0 8px;letter-spacing:-.025em; }
.editor-doc h2 { font-size:16px;margin:24px 0 8px; }
.editor-doc p { color:var(--muted);max-width:78ch; }
.editor-meta { display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px; }
.meta-pill { padding:4px 8px;border:1px solid var(--border);border-radius:999px;color:var(--muted);background:var(--surface-2);font-size:11px; }
.code-block { margin:14px 0;padding:14px 16px;border-radius:var(--radius);background:var(--code);border:1px solid var(--border);font:12px/1.65 var(--font-mono);overflow:auto;white-space:pre; }
.diff-line.add { color:var(--positive); }.diff-line.del { color:var(--danger); }.diff-line.focus { background:color-mix(in srgb,var(--accent) 14%,transparent); }
.resizer { position:relative;background:transparent;cursor:col-resize;z-index:14; }
.resizer::after { content:"";position:absolute;inset:0 1px;background:var(--border);transition:background 150ms; }
.resizer:hover::after,.resizer.dragging::after { background:var(--accent); }
.assistant-pane { min-width:0;min-height:0;background:var(--surface);display:grid;grid-template-rows:minmax(0,1fr); }
.assistant-grid { min-width:0;min-height:0;display:grid;grid-template-columns:var(--history-w,224px) minmax(0,1fr); }
.assistant-grid.history-closed { grid-template-columns:minmax(0,1fr); }
.assistant-grid.activity-pinned { grid-template-columns:var(--history-w,210px) minmax(250px,var(--activity-w,310px)) minmax(300px,1fr); }
.assistant-grid.history-closed.activity-pinned { grid-template-columns:minmax(250px,var(--activity-w,310px)) minmax(300px,1fr); }
.history-panel { min-width:0;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);border-right:1px solid var(--border);background:var(--surface-2);overflow:hidden; }
.history-head { display:flex;align-items:center;gap:5px;padding:7px;border-bottom:1px solid var(--border); }
.history-head .soft-button { flex:1; }
.history-search { padding:8px;border-bottom:1px solid var(--border); }
.input-wrap { display:flex;align-items:center;gap:7px;padding:0 9px;height:32px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--muted);transition:border-color 150ms,box-shadow 150ms; }
.input-wrap:focus-within { border-color:color-mix(in srgb,var(--accent) 60%,var(--border));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent); }
.input-wrap input { min-width:0;flex:1;border:0;outline:0;background:transparent;font-size:12px; }
.history-scroll { min-height:0;overflow:auto;padding:6px;scrollbar-gutter:stable; }
.section-head { display:flex;align-items:center;gap:6px;padding:8px 7px 5px;color:var(--subtle);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase; }
.section-head .count { margin-left:auto;min-width:18px;height:18px;display:grid;place-items:center;border-radius:9px;background:var(--surface-3);font-size:9px; }
.thread-row { position:relative;display:grid;grid-template-columns:18px minmax(0,1fr) 28px;align-items:center;gap:5px;min-height:52px;padding:6px 5px 6px 8px;border-radius:10px;color:var(--muted);cursor:pointer;transition:background 160ms,color 160ms,transform 160ms;overflow:hidden; }
.thread-row:hover { background:var(--surface-3);color:var(--text); }
.thread-row.active { background:color-mix(in srgb,var(--accent) 12%,var(--surface-3));color:var(--text); }
.thread-row.active::before { content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 42%,transparent); }
.thread-copy { min-width:0; }
.thread-title { display:flex;align-items:center;gap:5px;font-weight:620;font-size:12px;white-space:nowrap; }
.thread-title span:first-child { overflow:hidden;text-overflow:ellipsis; }
.thread-sub { display:flex;gap:5px;min-width:0;margin-top:2px;font-size:10px;color:var(--subtle); }
.thread-sub .summary { overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.thread-unread { min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:9px;font-weight:700; }
.thread-status-slot { width:18px;height:18px;display:grid;place-items:center; }
.thread-more { width:28px;height:28px;opacity:0;transform:scale(.82);transition:opacity 130ms,transform var(--spring-soft); }
.thread-row:hover .thread-more,.thread-row:focus-within .thread-more { opacity:1;transform:scale(1); }
.thread-row:hover .thread-status-slot,.thread-row:focus-within .thread-status-slot { opacity:0;transform:scale(.6); }
.status-dot { width:7px;height:7px;border-radius:50%;background:var(--subtle); }
.status-dot.working,.status-dot.reviewing { background:var(--warning);animation:status-pulse 1.5s ease-in-out infinite; }
.status-dot.complete,.status-dot.idle { background:var(--positive); }.status-dot.blocked,.status-dot.failed { background:var(--danger); }.status-dot.waiting,.status-dot.paused { background:var(--accent-2); }
.status-ring { width:15px;height:15px;border-radius:50%;background:conic-gradient(var(--accent) var(--progress,62%),var(--surface-4) 0);position:relative;animation:ring-breathe 2.1s ease-in-out infinite; }
.status-ring::after { content:"";position:absolute;inset:3px;border-radius:50%;background:var(--surface-2); }
.status-bars { display:flex;align-items:end;gap:2px;height:14px; }
.status-bars i { width:2px;height:35%;background:var(--accent);border-radius:2px;animation:equalize 1.1s ease-in-out infinite; }.status-bars i:nth-child(2){animation-delay:-.3s}.status-bars i:nth-child(3){animation-delay:-.6s}
.status-branch { width:15px;height:15px;position:relative; }.status-branch::before,.status-branch::after{content:"";position:absolute;background:var(--accent);border-radius:2px}.status-branch::before{left:3px;top:2px;width:2px;height:11px}.status-branch::after{left:4px;top:7px;width:8px;height:2px;transform:rotate(-28deg);transform-origin:left}.status-branch{animation:branch-pulse 1.8s infinite}
.status-word { font-size:8px;font-weight:800;text-transform:uppercase;color:var(--warning);letter-spacing:.04em; }
.status-orbit { width:15px;height:15px;border:1px solid var(--border-strong);border-radius:50%;position:relative; }.status-orbit::after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:var(--accent);left:5px;top:-2px;transform-origin:2px 9px;animation:spin 1.7s linear infinite}
.status-clock { width:15px;height:15px;border:1px solid var(--muted);border-radius:50%;position:relative; }.status-clock::before{content:"";position:absolute;width:1px;height:5px;background:var(--accent);left:6px;top:2px;transform-origin:bottom;animation:clock 2s linear infinite}
.status-underline { width:16px;height:2px;background:var(--accent);border-radius:2px;animation:underline-run 1.6s var(--ease) infinite; }

.chat-stage { min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto auto;background:var(--surface);position:relative; }
.chat-header { min-width:0;height:46px;display:flex;align-items:center;gap:7px;padding:0 10px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface) 96%,transparent);z-index:10; }
.chat-title { min-width:0;display:flex;align-items:center;gap:6px;font-weight:700; }
.chat-title span { overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.chat-state { display:flex;align-items:center;gap:4px;font-size:10px;color:var(--warning);font-weight:650;white-space:nowrap; }
.chat-meta { color:var(--subtle);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.chat-head-spacer { flex:1; }
.context-ring { width:31px;height:31px;border-radius:50%;padding:3px;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--context-pct,64)*1%),var(--surface-3) 0);cursor:pointer;transition:transform var(--spring-soft),filter 160ms;box-shadow:0 0 0 1px var(--border); }
.context-ring:hover { transform:scale(1.08) rotate(3deg);filter:brightness(1.08); }
.context-ring::after { content:attr(data-value);width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--text);font-size:8px;font-weight:800; }
.transcript { min-height:0;overflow:auto;padding:18px clamp(12px,2.4vw,28px) 24px;scroll-behavior:smooth;scrollbar-gutter:stable; }
.transcript-inner { width:100%;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:15px; }
.message { position:relative;min-width:0;animation:message-arrive 420ms var(--spring-soft) both; }
.message-user { display:flex;justify-content:flex-end; }
.message-user .message-surface { width:min(88%,820px);background:var(--user);border:1px solid color-mix(in srgb,var(--accent) 16%,var(--border));border-radius:16px 16px 5px 16px;padding:11px 13px; }
.message-assistant .message-surface { width:100%;padding:0 2px; }
.message-role { display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:10px;font-weight:700;color:var(--muted); }
.message-body { font-size:13px;line-height:1.62;overflow-wrap:anywhere; }
.message-body p { margin:0 0 9px; }.message-body p:last-child{margin-bottom:0}
.message-actions { display:flex;align-items:center;gap:2px;margin-top:6px;opacity:0;transform:translateY(-2px);transition:opacity 150ms,transform 150ms; }
.message:hover .message-actions,.message:focus-within .message-actions,.message-actions.always { opacity:1;transform:none; }
.message-actions .text-button { min-height:25px;font-size:10px; }
.long-fade { max-height:150px;overflow:hidden;position:relative; }.long-fade::after{content:"";position:absolute;left:0;right:0;bottom:0;height:65px;background:linear-gradient(transparent,var(--surface));pointer-events:none}.message-user .long-fade::after{background:linear-gradient(transparent,var(--user))}
.message-details { margin-top:8px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;animation:details-open 300ms var(--spring-soft) both; }
.detail-kv label { display:block;color:var(--subtle);font-size:9px;text-transform:uppercase;letter-spacing:.06em; }.detail-kv strong{font-size:11px;font-weight:650}
.system-card { width:100%;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);overflow:hidden;animation:message-arrive 420ms var(--spring-soft) both; }
.system-card-head { display:flex;align-items:center;gap:8px;padding:10px 11px;border-bottom:1px solid var(--border); }.system-card-head .title{font-weight:700}.system-card-head .sub{color:var(--muted);font-size:11px}.system-card-head .spacer{flex:1}
.system-card-body { padding:11px; }
.event-card { display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2); }

/* === PM56 FINAL HARDENING LAYER === */
/* These overrides intentionally live last. They harden the concept lab against
   direct-file rendering, narrow panels, popup clipping, and hover-only content. */
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body,
button,
input,
textarea,
select {
  /* Form controls do not inherit font-family, so they are named here on
     purpose. It must resolve through --font-ui or the per-theme typography
     (retro's mono, friendly's Poppins) is silently overridden. */
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body[data-theme="friendly-dark"], body[data-theme="friendly-light"],
[data-theme="friendly-dark"], [data-theme="friendly-light"] {
  --pm-body-font: Poppins, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
button, [role="button"], [data-action] { touch-action: manipulation; }
button:disabled { pointer-events: none; }

/* Never let a grid/flex child force the application wider than its panel. */
.app-shell, .workspace, .editor-shell, .assistant-shell, .assistant-body,
.chat-column, .transcript, .composer-shell, .history-panel, .activity-detail,
.message, .message-body, .working-animation, .decision-host,
.activity-domain-section, .artifact-card, .plan-card,
.selector-row, .composer-tools, .thread-row, .thread-copy,
.model-picker, .popup-menu, .menu-panel, [role="menu"], [role="dialog"] {
  min-width: 0;
}
.message-body, .message-copy, .thread-title, .thread-preview, .menu-copy,
.activity-domain-summary, .artifact-summary, .plan-summary,
[data-wrap="true"] { overflow-wrap: anywhere; word-break: break-word; }
pre, code, .code-block { white-space: pre-wrap; overflow-wrap: anywhere; }

/* History content is readable in the resting state. Only the status/action
   affordance changes on hover. */
.thread-row,
.thread-row .thread-copy,
.thread-row .thread-title,
.thread-row .thread-preview,
.thread-row .thread-meta,
.thread-item,
.thread-item .thread-content {
  opacity: 1 !important;
  visibility: visible !important;
}
.thread-row .thread-actions,
.thread-item .thread-actions { opacity: 0; pointer-events: none; }
.thread-row:hover .thread-actions,
.thread-row:focus-within .thread-actions,
.thread-item:hover .thread-actions,
.thread-item:focus-within .thread-actions { opacity: 1; pointer-events: auto; }

/* Live child-agent copy must never be hover-gated. */
.live-agent, .live-agent *, .agent-lane, .agent-lane *,
.working-agent, .working-agent *, .subagent-live, .subagent-live * {
  visibility: visible;
}
.live-agent .agent-copy, .agent-lane .agent-copy,
.working-agent .agent-copy, .subagent-live .agent-copy { opacity: 1 !important; }

/* One high, collision-safe popup layer. */
#overlay-root, #portal-root, .overlay-root, .portal-root {
  position: fixed !important;
  inset: 0 !important;
  z-index: 2147482000 !important;
  pointer-events: none !important;
  overflow: visible !important;
  isolation: isolate;
}
#overlay-root > *, #portal-root > *, .overlay-root > *, .portal-root > * {
  pointer-events: auto !important;
}
.popup-menu, .menu-panel, .popover, .context-popover, .hover-card,
.submenu, .sidecar-menu, .model-picker, [role="menu"], [role="listbox"],
[role="dialog"], .drawer, .question-surface, .decision-surface {
  max-width: min(calc(100vw - 16px), 680px);
  max-height: calc(100vh - 16px);
  overscroll-behavior: contain;
}
.popup-menu, .menu-panel, .popover, .context-popover, .model-picker,
[role="menu"], [role="listbox"] {
  overflow: auto;
  scrollbar-gutter: stable;
}
.submenu, .sidecar-menu { overflow: auto; }

/* The main menu and a sidecar should read as one animated unit. */
.menu-cluster, .menu-with-sidecar, .popup-cluster {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  pointer-events: auto;
}
.sidecar-menu, .submenu {
  transform-origin: var(--submenu-origin, left center);
  animation: pm56-sidecar-in 340ms cubic-bezier(.2, 1.22, .32, 1) both;
}
@keyframes pm56-sidecar-in {
  0% { opacity: 0; transform: translate3d(var(--submenu-shift, -10px),0,0) scale(.94); }
  62% { opacity: 1; transform: translate3d(2px,0,0) scale(1.012); }
  100% { opacity: 1; transform: none; }
}
.popup-menu, .menu-panel, .model-picker, .context-popover {
  transform-origin: var(--popup-origin, top center);
  animation: pm56-popup-in 380ms cubic-bezier(.16, 1.18, .32, 1) both;
}
@keyframes pm56-popup-in {
  0% { opacity: 0; transform: translate3d(0,var(--popup-shift,8px),0) scale(.965); filter: blur(2px); }
  58% { opacity: 1; transform: translate3d(0,-2px,0) scale(1.006); filter: blur(0); }
  100% { opacity: 1; transform: none; filter: none; }
}

/* Root menus choose a side once; every child follows it. */
.menu-cluster[data-side="left"] { flex-direction: row-reverse; }
.menu-cluster[data-side="left"] .sidecar-menu,
.menu-cluster[data-side="left"] .submenu {
  --submenu-origin: right center;
  --submenu-shift: 10px;
}
.menu-cluster[data-side="right"] .sidecar-menu,
.menu-cluster[data-side="right"] .submenu {
  --submenu-origin: left center;
  --submenu-shift: -10px;
}

/* Activity domains are always real controls, with a visible hover response. */
.activity-domain, .activity-chip, [data-activity-domain] {
  position: relative;
  cursor: pointer;
  pointer-events: auto;
  transition: transform 220ms cubic-bezier(.2,.9,.24,1.25),
              background-color 180ms ease, border-color 180ms ease,
              box-shadow 220ms ease;
}
.activity-domain:hover, .activity-chip:hover, [data-activity-domain]:hover {
  transform: translateY(-2px) scale(1.015);
}
.activity-domain:active, .activity-chip:active, [data-activity-domain]:active {
  transform: translateY(0) scale(.985);
}
.activity-hover-card, .activity-preview {
  max-width: min(340px, calc(100vw - 24px));
  pointer-events: none;
}

/* Questions, approvals, and plan decisions occupy document flow above the
   Activity Bar rather than covering transcript content. */
.decision-host {
  position: relative !important;
  inset: auto !important;
  z-index: 8;
  flex: 0 0 auto;
  /* max-height and overflow are owned by the .decision-host rule above,
     which animates the collapse. Re-declaring them here made the
     transition animate to a different target. */
  overscroll-behavior: contain;
}

/* Dynamic pickers shrink to their contents, but never exceed the designed cap. */
.model-picker, .model-menu {
  /* No height:auto!important here: app.js sets an inline height from
     modelMenuHeight() precisely so the picker can transition between
     sizes. An !important shorthand silently killed that. */
  min-height: 0;
  max-height: min(560px, calc(100vh - 24px));
  transition: width 360ms cubic-bezier(.16,1.16,.3,1),
              height 380ms cubic-bezier(.16,1.16,.3,1),
              max-height 380ms cubic-bezier(.16,1.16,.3,1);
}
.model-list, .menu-results { max-height: min(390px, calc(100vh - 170px)); overflow: auto; }

/* Stable scroll surfaces. */
.transcript, .thread-list, .history-scroll, .editor-content,
.activity-detail-scroll, .drawer-content, .question-body {
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
}

/* Do not let transient notices intercept composer input after they fade. */
.toast[aria-hidden="true"], .toast.is-leaving { pointer-events: none !important; }

/* Resizers remain discoverable without obscuring content. */
.resize-handle, [data-resize-handle] {
  z-index: 20;
  touch-action: none;
  user-select: none;
}
.resize-handle:hover, [data-resize-handle]:hover {
  background: color-mix(in srgb, var(--accent, #8b6cff) 30%, transparent);
}

/* (duplicate reduced-motion block removed -- see motion.css) */

@media (max-width: 700px) {
  .popup-menu, .menu-panel, .model-picker, .context-popover,
  [role="menu"], [role="listbox"], [role="dialog"] {
    max-width: calc(100vw - 12px);
    max-height: calc(100vh - 12px);
  }
  .menu-cluster { gap: 0; }
  .menu-cluster .sidecar-menu, .menu-cluster .submenu {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    max-width: none !important;
    animation-name: pm56-mobile-submenu-in;
  }
  @keyframes pm56-mobile-submenu-in {
    0% { opacity: 0; transform: translateX(18px) scale(.98); }
    100% { opacity: 1; transform: none; }
  }
}

/* =====================================================================
   Puppet Master Assistant — motion system
   ---------------------------------------------------------------------
   One vocabulary shared by every working-animation take. The timings are
   not invented: they are measured from the reference screen recording
   (ScreenRecording_07-29-2026 19-24-09_1.mov, 1417 frames @ ~46fps),
   frame by frame. See the table below for the frames each value came
   from, so a future pass can re-derive rather than guess.

     label settle   ~90ms    f0477 -> f0481   text swaps in at ~0.3 alpha
     icon pop       ~150ms   f0480 -> f0486   scale + fade + tint
     row materialize ~110ms  f0657 -> f0661   blur(4px) -> blur(0)
     row cascade     ~45ms   f0920 -> f0951   one word / one row per beat
     step handoff   ~220ms   f0196 -> f0209   old out, new label, first row
     shimmer cycle  ~1370ms  f0494 -> f0557   band crosses verb in ~500ms
   ===================================================================== */

:root{
  --pm-t-label: 90ms;
  --pm-t-icon: 150ms;
  --pm-t-row: 110ms;
  --pm-t-cascade: 45ms;
  --pm-t-handoff: 220ms;
  --pm-t-panel: 320ms;
  --pm-shimmer-cycle: 1370ms;
  --pm-blur: 4px;
  --pm-rise: 3px;
  --pm-ease-out: cubic-bezier(.22,.80,.28,1);
  --pm-ease-in: cubic-bezier(.55,.06,.68,.19);
  /* The measured settle: fast attack, one small overshoot, no ring-out. */
  --pm-ease-pop: linear(0,.028,.111 8%,.412 20%,.686 30%,.867 40%,.964 50%,1.012 62%,1.014 74%,1.003 88%,1);
}

/* ---- Per-step colour identity ---------------------------------------
   In the reference each activity type owns a hue: Thinking indigo,
   Exploring blue, Figma navy, Making green. The active disc, its ring
   and the shimmer band all read from --pm-step so they agree.          */
[data-step-kind]{ --pm-step: var(--accent); }
[data-step-kind="prepare"]    { --pm-step:#8b7bf7; }
[data-step-kind="thought"]    { --pm-step:#7c6cf0; }
[data-step-kind="files"]      { --pm-step:#3b8ef0; }
[data-step-kind="web-search"] { --pm-step:#2ea8d5; }
[data-step-kind="web-fetch"]  { --pm-step:#22a2b8; }
[data-step-kind="browser"]    { --pm-step:#37a5e8; }
[data-step-kind="bash"]       { --pm-step:#7d8794; }
[data-step-kind="agents"]     { --pm-step:#c46be0; }
[data-step-kind="edit"]       { --pm-step:#37b075; }
[data-step-kind="app"]        { --pm-step:#4ea36a; }
[data-step-kind="test"]       { --pm-step:#d99a2b; }
[data-step-kind="validate"]   { --pm-step:#3fae8a; }
[data-step-kind="artifact"]   { --pm-step:#e0725b; }
[data-step-kind="complete"]   { --pm-step:#3fb27a; }

/* ---- Materialize: the signature entrance ----------------------------
   Rows in the reference do not slide in. They resolve out of a blur,
   which is why the effect reads as "the answer arriving" rather than
   "a list animating". --pm-stagger indexes a cascade.                  */
@keyframes pm-materialize{
  from{ opacity:0; filter:blur(var(--pm-blur)); transform:translateY(var(--pm-rise)); }
  60% { opacity:1; }
  to  { opacity:1; filter:blur(0); transform:none; }
}
.pm-materialize{
  animation: pm-materialize var(--pm-t-row) var(--pm-ease-out) both;
  animation-delay: calc(var(--pm-row-base,0ms) + var(--pm-stagger,0) * var(--pm-t-cascade));
  will-change: opacity, filter, transform;
}
/* Detail rows wait for the label to settle, then resolve. The recording
   shows the first row appearing 65ms after the swap and fully resolved by
   195ms; 65ms base + one 45ms slot + the 110ms materialize lands it at
   220ms. A larger base opens a visible hollow where the card shows a title
   with no rows -- which is what a 175ms base did. */
.pm-rows{ --pm-row-base: 65ms; }
.pm-materialize-done{ will-change:auto; }

@keyframes pm-dematerialize{
  from{ opacity:1; filter:blur(0); }
  to  { opacity:0; filter:blur(var(--pm-blur)); }
}
.pm-leaving{ animation: pm-dematerialize 45ms var(--pm-ease-in) both; pointer-events:none; }

/* ---- Shimmer --------------------------------------------------------
   A light band crosses the active verb left to right. Geometry: with a
   background 380% of the box, the highlight travels 2.8 box-widths per
   cycle, so it is *inside* the box for 1/2.8 = 36% of 1370ms = ~500ms,
   which is what the recording shows. Only the bold verb ever shimmers;
   the grey count beside it stays flat, and the disc does not pulse --
   the shimmer is the sole "still working" signal.                      */
@keyframes pm-shimmer{ from{ background-position:100% 0; } to{ background-position:0% 0; } }
.pm-shimmer{
  --pm-ink: var(--text);
  --pm-glow: color-mix(in srgb, var(--pm-step, var(--accent)) 62%, var(--surface-4));
  background-image: linear-gradient(100deg,
      var(--pm-ink) 46%, var(--pm-glow) 50%, var(--pm-ink) 54%);
  background-size: 380% 100%;
  background-position: 100% 0;
  background-repeat: no-repeat;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: pm-shimmer var(--pm-shimmer-cycle) linear infinite;
  will-change: background-position;
}
.pm-shimmer.pm-settled{ animation:none; background:none; color:var(--text); will-change:auto; }

/* ---- Word stream ----------------------------------------------------
   Prose arrives ~1 word per 45-65ms, each word materializing on its own
   rather than the paragraph fading in as a block.                      */
.pm-stream .pm-word{
  display:inline-block;
  white-space:pre;
  animation: pm-materialize 90ms var(--pm-ease-out) both;
  animation-delay: calc(var(--pm-stagger,0) * var(--pm-t-cascade));
  --pm-rise: 0px;
}

/* ---- Step rail ------------------------------------------------------
   The active step is a tinted disc with a coloured ring. On completion
   it demotes to a small grey glyph and the next disc grows in.         */
.pm-rail{ display:flex; align-items:center; gap:2px; min-width:0; }
.pm-rail-item{
  width:15px; height:15px; flex:0 0 auto;
  border-radius:50%;
  display:grid; place-items:center;
  color:var(--subtle);
  background:transparent;
  border:1px solid transparent;
  transform:scale(.86);
  transition:
    width var(--pm-t-icon) var(--pm-ease-pop),
    height var(--pm-t-icon) var(--pm-ease-pop),
    transform var(--pm-t-icon) var(--pm-ease-pop),
    background-color var(--pm-t-icon) var(--pm-ease-out),
    border-color var(--pm-t-icon) var(--pm-ease-out),
    color var(--pm-t-icon) var(--pm-ease-out);
}
.pm-rail-item.done{ color:var(--subtle); border-color:var(--border); }
.pm-rail-item.current{
  width:22px; height:22px;
  transform:scale(1);
  color:var(--pm-step, var(--accent));
  background:color-mix(in srgb, var(--pm-step, var(--accent)) 14%, transparent);
  border-color:color-mix(in srgb, var(--pm-step, var(--accent)) 55%, transparent);
}
.pm-rail-item.enter{ animation: pm-disc-in var(--pm-t-icon) var(--pm-ease-pop) both; }
@keyframes pm-disc-in{
  from{ opacity:0; transform:scale(.4); filter:blur(2px); }
  to  { opacity:1; transform:scale(1); filter:blur(0); }
}

/* ---- Digit roll -----------------------------------------------------
   Counters increment by rolling, not snapping.                         */
.pm-roll{ position:relative; display:inline-block; overflow:hidden; vertical-align:bottom; }
.pm-roll > i{ display:block; font-style:normal; animation: pm-roll 260ms var(--pm-ease-pop) both; }
.pm-roll > i.pm-roll-ghost{ position:absolute; left:0; right:0; top:0; pointer-events:none;
  animation: pm-roll-out 260ms var(--pm-ease-pop) both; }
@keyframes pm-roll{ from{ transform:translateY(0.95em) } to{ transform:none } }
@keyframes pm-roll-out{ from{ transform:none; opacity:1 } to{ transform:translateY(-0.95em); opacity:0 } }

/* ---- Missing keyframes ----------------------------------------------
   .editor-doc and .capability-dot both referenced animations that were
   never defined, so four live elements carried a dead animation-name.  */
@keyframes fade-up{
  from{ opacity:0; transform:translateY(6px); }
  to  { opacity:1; transform:none; }
}
@keyframes capability-pop{
  from{ opacity:0; transform:scale(.7); }
  60% { opacity:1; }
  to  { opacity:1; transform:none; }
}
.capability-dot{ animation-duration:var(--pm-t-icon); }

/* ---- Reduced motion -------------------------------------------------
   The blanket rule this replaces flattened every duration to 0.001ms,
   which erased the state changes as well as the decoration -- the lab's
   entire subject matter collapsed into static cards. Instead: stop the
   infinite decorative loops, keep the short state transitions.         */
@media (prefers-reduced-motion: reduce){
  /* Cap every loop at a single pass rather than enumerating decorative
     classes one by one -- an enumeration silently misses new ones (it had
     already missed .state-mark.live). Finite entrances are untouched, so
     state changes stay legible. */
  *, *::before, *::after{ animation-iteration-count:1 !important; }
  .pm-shimmer{ animation:none; background:none; color:var(--text); }
  .pm-materialize, .pm-stream .pm-word{ animation-duration:1ms; animation-delay:0ms; filter:none; }
  .pm-rail-item{ transition-duration:120ms; }
  .status-dot.working,.status-dot.reviewing,.status-ring,.status-bars i,.status-branch,
  .status-orbit::after,.status-clock::before,.status-underline,.orbit-track,.orbit-core,
  .calm-glyph,.bench-scan,.lane-wave i,.fast-bolt,.activity-bar[data-variant="6"]::before,
  .working-variant-0 .phase-dot.current,.calm-dots i.current,.activity-goal-tree .tree-child.live,
  .mini-graph i{ animation:none !important; }
}

/* ---- Theme cross-fade -----------------------------------------------
   Armed by applyTheme() only for the duration of a swap, so nothing else
   in the lab carries a permanent colour transition. */
body.pm-theming,
body.pm-theming .pm-shell, body.pm-theming .app-header,
body.pm-theming .editor-pane, body.pm-theming .editor-tabs, body.pm-theming .editor-doc,
body.pm-theming .code-block, body.pm-theming .assistant-pane, body.pm-theming .chat-stage,
body.pm-theming .chat-header, body.pm-theming .history-panel, body.pm-theming .activity-panel,
body.pm-theming .transcript, body.pm-theming .message-surface, body.pm-theming .working-card,
body.pm-theming .activity-wrap, body.pm-theming .activity-bar,
body.pm-theming .composer, body.pm-theming .composer-box, body.pm-theming .status-bar{
  transition: background-color 280ms var(--pm-ease-out),
              border-color 280ms var(--pm-ease-out) !important;
}
@media (prefers-reduced-motion: reduce){ body.pm-theming, body.pm-theming *{ transition:none !important; } }

/* Working-animation takes — group a. Scope every rule under
   .working-variant-N so takes cannot collide with each other.

   Durations come from the shared tokens in motion.css, which were measured
   from the reference recording frame by frame:
     --pm-t-label 90ms   --pm-t-icon 150ms   --pm-t-row 110ms
     --pm-t-cascade 45ms --pm-t-handoff 220ms --pm-shimmer-cycle 1370ms
   Colour comes only from theme variables plus --pm-step (the per-step-kind
   accent set by data-step-kind on .working-card), so all eight themes work.
   ===================================================================== */

/* =====================================================================
   8 — STEP RAIL
   An accumulating rail of tool discs. The active disc is larger, tinted
   and ringed; on completion it demotes to a small grey glyph while the
   next one grows in 65ms after the label swaps. Finished, the whole
   thing shuts to "14 tools used" with a chevron, and hovering any past
   disc re-opens that step in place with its verb in the past tense.
   ===================================================================== */
.working-variant-8 .rail8 {
  position:relative; padding:1px 0 0; container-type:inline-size;
  --rail8-top:26px; --rail8-gap:9px;
}
/* The disc metrics live on .rail8-head, not on .rail8: an element is never
   its own container, so a @container rule targeting .rail8 would never
   match. .rail8-head is an ancestor of both the discs and the hover panels,
   which is everything that needs to know the rail geometry.
   --rail8-n is the step count, supplied by the take; the collapsed rail is
   n discs plus n-1 gaps, which is where the past-tense label starts. */
.working-variant-8 .rail8-head {
  display:flex; align-items:center; gap:10px; min-height:26px;
  --rail8-d:15px; --rail8-g:2px;
  --rail8-w:calc(var(--rail8-n,14) * var(--rail8-d)
                 + (var(--rail8-n,14) - 1) * var(--rail8-g) + 12px);
}
.working-variant-8 .rail8-track { flex:0 0 auto; gap:var(--rail8-g); }
.working-variant-8 .rail8-spacer { flex:1 1 auto; }
.working-variant-8 .rail8-item {
  width:var(--rail8-d); height:var(--rail8-d);
  padding:0; font:inherit; cursor:default; -webkit-appearance:none; appearance:none;
}
.working-variant-8 .rail8-item.current {
  width:calc(var(--rail8-d) + 7px); height:calc(var(--rail8-d) + 7px);
}
/* The assistant pane is resizable; below ~430px the rail tightens rather
   than pushing the label out of the card. */
@container (max-width: 430px) {
  .working-variant-8 .rail8-head { --rail8-d:13px; --rail8-g:1px; gap:7px; }
  .working-variant-8 .rail8-verb { font-size:11.5px; }
  .working-variant-8 .rail8-count { font-size:11px; }
  .working-variant-8 .rail8-pastlabel b { font-size:11.5px; }
  .working-variant-8 .rail8-pastlabel i { font-size:11px; }
}

.working-variant-8 .done8 .rail8-item { cursor:pointer; }
.working-variant-8 .rail8-item svg {
  transition:transform var(--pm-t-icon) var(--pm-ease-pop);
}
.working-variant-8 .rail8-item.current svg { transform:scale(1.2); }
/* The reference starts the disc ~65ms after the label settles, so the two
   never move on the same frame (f0477 label, f0480 disc). */
.working-variant-8 .rail8-item.enter { animation-delay:65ms; }
.working-variant-8 .done8 .rail8-item:hover,
.working-variant-8 .done8 .rail8-item:focus-visible {
  color:var(--pm-step, var(--accent));
  background:color-mix(in srgb, var(--pm-step, var(--accent)) 14%, transparent);
  border-color:color-mix(in srgb, var(--pm-step, var(--accent)) 50%, transparent);
  outline:none;
}

.working-variant-8 .rail8-head-label {
  display:flex; align-items:baseline; gap:5px; min-width:0;
  transition:opacity 45ms var(--pm-ease-in);
}
.working-variant-8 .rail8-verb {
  font-weight:750; font-size:12.5px; letter-spacing:-.012em; white-space:nowrap;
}
/* The shimmer is the only "still working" signal — the disc must not pulse.
   The 90ms settle and the 1370ms band run together on the one node. */
.working-variant-8 .rail8-verb.pm-shimmer {
  animation:rail8-settle var(--pm-t-label) var(--pm-ease-out) both,
            pm-shimmer var(--pm-shimmer-cycle) linear infinite;
}
.working-variant-8 .rail8-verb.pm-shimmer.pm-settled { animation:rail8-settle var(--pm-t-label) var(--pm-ease-out) both; }
@keyframes rail8-settle { from { opacity:.28; } to { opacity:1; } }

.working-variant-8 .rail8-count {
  font-size:12px; color:var(--muted); white-space:nowrap;
  animation:rail8-settle var(--pm-t-label) var(--pm-ease-out) both;
}
.working-variant-8 .rail8-sum { font-size:12.5px; font-weight:650; color:var(--text); }
.working-variant-8 .rail8-sum .pm-roll { font-weight:750; }

.working-variant-8 .rail8-chev {
  width:22px; height:22px; flex:0 0 auto; border-radius:7px; padding:0;
  display:grid; place-items:center; cursor:pointer;
  background:transparent; border:1px solid transparent; color:var(--subtle);
  transition:transform var(--pm-t-handoff) var(--pm-ease-pop),
             color var(--pm-t-icon) var(--pm-ease-out),
             border-color var(--pm-t-icon) var(--pm-ease-out);
}
.working-variant-8 .rail8-chev:hover { color:var(--text); border-color:var(--border); }
.working-variant-8 .rail8-chev.open { transform:rotate(-180deg); }

.working-variant-8 .rail8-under {
  margin-top:var(--rail8-gap); min-height:56px; display:flex; flex-direction:column; gap:5px;
  transition:opacity 45ms var(--pm-ease-in);
}
.working-variant-8 .rail8-idle { display:block; }
.working-variant-8 .rail8-idle .work-receipt { margin-top:0; }

/* The rows carry .pm-materialize and their container carries .pm-rows, so
   the handoff budget lives in the shared --pm-row-base token rather than
   in a number copied into this file. First row at 175ms + one 45ms slot =
   220ms, which is the measured handoff. */
.working-variant-8 .rail8-row {
  display:flex; align-items:baseline; gap:10px; font-size:10.5px;
}
.working-variant-8 .rail8-rowtext {
  flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; color:var(--text); opacity:.84;
}
.working-variant-8 .rail8-meta {
  flex:0 0 auto; display:flex; gap:7px; font-family:var(--font-mono); font-size:10px;
}
.working-variant-8 .rail8-add { color:var(--positive); font-weight:700; }
.working-variant-8 .rail8-del { color:var(--danger); font-weight:700; }
.working-variant-8 .rail8-tag {
  color:var(--warning); font-size:9px; font-weight:700;
  text-transform:uppercase; letter-spacing:.05em;
}

/* Hover-to-re-open. The panel is a sibling of the disc, so one selector
   drives all fourteen; the idle content simply fades away under it. */
.working-variant-8 .rail8-pop {
  position:absolute; left:0; right:0; top:calc(var(--rail8-top) + var(--rail8-gap)); display:none;
}
.working-variant-8 .rail8-item:hover + .rail8-pop,
.working-variant-8 .rail8-item:focus-visible + .rail8-pop {
  display:block; animation:rail8-open var(--pm-t-row) var(--pm-ease-out) both;
}
.working-variant-8 .rail8-poprows { display:flex; flex-direction:column; gap:5px; }
/* The panel is anchored at --rail8-top, so pulling its label back by the
   same amount lands it on the head line, exactly where the live verb sits
   and exactly where the reference puts the past-tense label. */
.working-variant-8 .rail8-pastlabel {
  position:absolute; left:var(--rail8-w, 248px);
  top:calc(-1 * (var(--rail8-top) + var(--rail8-gap))); height:var(--rail8-top);
  max-width:calc(100% - var(--rail8-w, 248px) - 26px);
  display:flex; align-items:center; gap:5px; white-space:nowrap; overflow:hidden;
}
.working-variant-8 .rail8-pastlabel b { font-weight:750; font-size:12.5px; color:var(--text); letter-spacing:-.012em; }
.working-variant-8 .rail8-pastlabel i { font-style:normal; font-size:12px; color:var(--muted); }
@keyframes rail8-open { from { opacity:0; filter:blur(var(--pm-blur)); } to { opacity:1; filter:blur(0); } }

.working-variant-8 .rail8.done8:has(.rail8-item:hover) .rail8-head-label,
.working-variant-8 .rail8.done8:has(.rail8-item:focus-visible) .rail8-head-label,
.working-variant-8 .rail8.done8:has(.rail8-item:hover) .rail8-under,
.working-variant-8 .rail8.done8:has(.rail8-item:focus-visible) .rail8-under { opacity:0; }

/* =====================================================================
   9 — WORD STREAM
   Prose and nothing else. Words resolve out of blur and out of grey one
   at a time; tool calls fold into the sentence as quiet chips instead of
   becoming rows. Older clauses recede by opacity on a surviving node, so
   nothing ever re-enters.
   ===================================================================== */
.working-variant-9 .ws9 { padding:2px 1px 0; }
.working-variant-9 .ws9-flow {
  font-size:12.5px; line-height:1.64; letter-spacing:-.005em; color:var(--text);
}
.working-variant-9 .ws-clause {
  display:block; margin:0 0 8px;
  transition:opacity var(--pm-t-handoff) var(--pm-ease-out);
}
.working-variant-9 .ws-clause:last-child { margin-bottom:0; }
.working-variant-9 .ws-clause[data-age="1"] { opacity:.5; }
.working-variant-9 .ws-clause[data-age="2"] { opacity:.26; }

.working-variant-9 .ws-clause .pm-word {
  animation-name:ws-word; animation-duration:90ms; animation-fill-mode:backwards;
}
@keyframes ws-word {
  from { opacity:0; filter:blur(var(--pm-blur)); color:var(--subtle); }
  55%  { opacity:1; }
  to   { opacity:1; filter:blur(0); }
}

.working-variant-9 .ws-chip {
  display:inline-flex; align-items:center; gap:4px; margin:0 1px;
  padding:1px 6px 1px 5px; border-radius:7px; vertical-align:-1px;
  font-size:11px; line-height:1.4; color:var(--text);
  background:color-mix(in srgb, var(--pm-step, var(--accent)) 11%, var(--surface-3));
  border:1px solid color-mix(in srgb, var(--pm-step, var(--accent)) 26%, var(--border));
  animation:ws-chip-in var(--pm-t-row) var(--pm-ease-out) backwards;
  animation-delay:calc(var(--pm-stagger,0) * var(--pm-t-cascade));
}
.working-variant-9 .ws-chip svg { color:var(--pm-step, var(--accent)); flex:none; }
.working-variant-9 .ws-chip b { font-weight:600; white-space:nowrap; }
@keyframes ws-chip-in {
  from { opacity:0; filter:blur(var(--pm-blur)); transform:translateY(2px) scale(.94); }
  to   { opacity:1; filter:blur(0); transform:none; }
}

.working-variant-9 .ws-caret {
  display:inline-block; width:2px; height:.95em; margin-left:3px;
  vertical-align:-2px; border-radius:1px;
  background:var(--pm-step, var(--accent));
  animation:ws-caret var(--pm-shimmer-cycle) var(--pm-ease-out) infinite;
}
@keyframes ws-caret { 0% { opacity:1; } 42% { opacity:.1; } 70%,100% { opacity:1; } }

.working-variant-9 .ws-coda {
  display:block; margin-top:11px; font-size:10.5px; color:var(--subtle);
  letter-spacing:.01em;
  animation:ws-coda-in var(--pm-t-row) var(--pm-ease-out) both;
}
@keyframes ws-coda-in { from { opacity:0; filter:blur(var(--pm-blur)); } to { opacity:1; filter:blur(0); } }

/* =====================================================================
   10 — TOOL COLLAPSE
   The tools are the content. An overlapping avatar-stack of tool discs
   grows through the run under a rolling count; clicking fans it into a
   full row (the movement itself is a FLIP played from variants-a.js, so
   no CSS transition is declared on the properties it animates).
   ===================================================================== */
.working-variant-10 .tc10 { display:flex; flex-direction:column; gap:11px; container-type:inline-size; }
.working-variant-10 .tc10-top { display:flex; align-items:center; gap:8px; }
.working-variant-10 .tc10-count { font-size:12px; color:var(--muted); }
.working-variant-10 .tc10-count b {
  font-weight:750; font-size:16px; color:var(--text);
  letter-spacing:-.025em; margin-right:3px;
}
.working-variant-10 .tc10-spacer { flex:1 1 auto; }
.working-variant-10 .tc10-chev {
  width:22px; height:22px; flex:0 0 auto; padding:0; border-radius:7px;
  display:grid; place-items:center; cursor:pointer;
  background:var(--surface-3); border:1px solid var(--border); color:var(--muted);
  transition:transform 340ms var(--pm-ease-pop), color var(--pm-t-icon) var(--pm-ease-out),
             border-color var(--pm-t-icon) var(--pm-ease-out);
}
.working-variant-10 .tc10.fanned .tc10-chev {
  transform:rotate(90deg); color:var(--pm-step, var(--accent));
  border-color:color-mix(in srgb, var(--pm-step, var(--accent)) 45%, var(--border));
}

.working-variant-10 .tc10-stackwrap { cursor:pointer; padding:3px 0; }
.working-variant-10 .tc10-stack { display:flex; align-items:center; justify-content:flex-end; }
.working-variant-10 .tc10.fanned .tc10-stack { justify-content:flex-start; }
.working-variant-10 .tc10.fanned .tc10-stack { flex-wrap:wrap; row-gap:5px; }
.working-variant-10 .tc10-item {
  width:30px; height:30px; flex:0 0 auto; margin-left:-12px;
  border-radius:50%; display:grid; place-items:center;
  background:var(--surface-3); border:1px solid var(--border); color:var(--subtle);
  box-shadow:0 0 0 2px var(--surface-2);
  animation:tc10-pop var(--pm-t-icon) var(--pm-ease-pop) both;
  transition:background-color var(--pm-t-handoff) var(--pm-ease-out),
             color var(--pm-t-handoff) var(--pm-ease-out),
             border-color var(--pm-t-handoff) var(--pm-ease-out),
             box-shadow var(--pm-t-handoff) var(--pm-ease-out);
}
.working-variant-10 .tc10-item:first-child { margin-left:0; }
/* The pile is newest-first, so the live disc is the one on top and every
   disc behind it is overlapped on its LEFT: the glyph rides a little right
   of centre to stay whole. Fanning re-centres every glyph, which is a
   second, quieter beat inside the unpack. */
.working-variant-10 .tc10-item svg { transition:transform 300ms var(--pm-ease-out); }
.working-variant-10 .tc10-item:not(:last-child) svg { transform:translateX(-3px); }
.working-variant-10 .tc10.fanned .tc10-item svg { transform:none; }
/* The gap opens before the disc lands in it: renderApp's FLIP starts the
   pile moving at once, and the new disc holds its from-state (fill:both)
   until the room it needs is on its way. 80ms rather than more, because the
   count beside it rolls over 260ms and must not look settled at a number the
   pile has not reached yet. */
.working-variant-10 .tc10-item.live { animation-delay:80ms; }
.working-variant-10 .tc10-item.live {
  background:color-mix(in srgb, var(--pm-step, var(--accent)) 17%, var(--surface-3));
  border-color:color-mix(in srgb, var(--pm-step, var(--accent)) 55%, var(--border));
  color:var(--pm-step, var(--accent));
  box-shadow:0 0 0 2px var(--surface-2),
             0 0 0 3px color-mix(in srgb, var(--pm-step, var(--accent)) 32%, transparent);
}
.working-variant-10 .tc10.fanned .tc10-item { margin-left:5px; }
.working-variant-10 .tc10.fanned .tc10-item:first-child { margin-left:0; }
/* The assistant pane is resizable. Fourteen 30px discs at a 12px lap need
   264px; below that the pile tightens rather than pushing its own right-hand
   end out of the card (measured: a 222px card overflowed by 56px on the last
   step). Same device as take 8's rail, and for the same reason. */
@container (max-width: 300px) {
  /* Tightening alone is not enough here: at fourteen discs the lap needed to
     fit one row is wider than half a disc, which slices the glyphs. So the
     pile wraps instead. The stack takes 10px of horizontal padding and EVERY
     disc keeps the -10px margin, including the first: that way the first disc
     of each wrapped line lands exactly on the stack's border box instead of
     being pulled out of it, and the padding on the right leaves flexbox the
     slack it needs (line breaking sums margin boxes, so without it the last
     disc of a line can still overhang by its own lap). */
  .working-variant-10 .tc10-stack { flex-wrap:wrap; row-gap:4px; padding:0 10px; }
  .working-variant-10 .tc10-item,
  .working-variant-10 .tc10-item:first-child { width:26px; height:26px; margin-left:-10px; }
  .working-variant-10 .tc10.fanned .tc10-stack { padding:0; }
  .working-variant-10 .tc10.fanned .tc10-item,
  .working-variant-10 .tc10.fanned .tc10-item:first-child { margin-left:4px; }
  .working-variant-10 .tc10-count b { font-size:15px; }
}
@keyframes tc10-pop {
  from { opacity:0; transform:scale(.4) translateX(-10px); filter:blur(2px); }
  to   { opacity:1; transform:none; filter:blur(0); }
}

.working-variant-10 .tc10-foot { min-height:52px; }
/* The line re-mounts on every step, so it must not start from nothing: the
   reference swaps a label in at ~0.3 alpha, never through an empty frame.
   At 175ms + a cascade slot it left a visible 110ms hole where the verb and
   the command had been. */
.working-variant-10 .tc10-line {
  display:flex; flex-direction:column; gap:5px; min-width:0;
  animation:tc10-line-in var(--pm-t-row) var(--pm-ease-out) both;
  animation-delay:var(--pm-row-base,65ms);
}
.working-variant-10 .tc10.fanned .tc10-line { display:none; }
/* No colour here on purpose: .pm-shimmer needs color:transparent to let
   its clipped gradient show, and .pm-settled paints it back. Setting
   color:var(--text) on this rule out-specifies both and silently kills
   the band while leaving the animation running. */
.working-variant-10 .tc10-line b { font-size:12px; font-weight:700; align-self:flex-start; }
/* Same rule the reference sets: only the active bold verb ever shimmers,
   and nothing else in the take carries a "still working" loop. */
.working-variant-10 .tc10-line b.pm-shimmer.pm-settled { color:var(--text); }
.working-variant-10 .tc10-line code {
  font-family:var(--font-mono); font-size:10px; color:var(--accent-2);
  background:var(--code); border:1px solid var(--border); border-radius:8px;
  padding:6px 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
@keyframes tc10-line-in {
  from { opacity:.28; filter:blur(var(--pm-blur)); transform:translateY(var(--pm-rise)); }
  to   { opacity:1; filter:blur(0); transform:none; }
}
/* The command gets its own beat after the verb, so the foot resolves in two
   steps rather than as one block. It is a separate element from the shimmering
   verb on purpose — an animation shorthand on that <b> would out-specify
   .pm-shimmer and silently kill the band. */
.working-variant-10 .tc10-line code {
  animation:tc10-code-in 140ms var(--pm-ease-out) both; animation-delay:130ms;
}
@keyframes tc10-code-in {
  from { opacity:0; transform:translateY(3px); }
  to   { opacity:1; transform:none; }
}

.working-variant-10 .tc10-names { display:none; flex-wrap:wrap; gap:4px; }
.working-variant-10 .tc10.fanned .tc10-names { display:flex; }
.working-variant-10 .tc10-name {
  font-size:9.5px; color:var(--muted); padding:2px 6px; border-radius:6px;
  background:var(--surface-3); border:1px solid var(--border); white-space:nowrap;
  animation:tc10-name-in var(--pm-t-row) var(--pm-ease-out) both;
  animation-delay:calc(var(--pm-stagger,0) * var(--pm-t-cascade));
}
@keyframes tc10-name-in {
  from { opacity:0; filter:blur(var(--pm-blur)); transform:translateY(3px); }
  to   { opacity:1; filter:blur(0); transform:none; }
}

/* =====================================================================
   11 — DIFF TAPE
   Typographic and numeric: no icons, no discs. Each step prints two or
   three lines, one per 140ms beat, and each line does two things in
   turn: the paper advances (its own height 0 -> 20px, which is what
   scrolls the bottom-anchored clipped column upward) and then the ink
   lands column by column — verb, path, leader, number. The head
   counters are odometers timed to the same beats, so the totals step up
   as the lines land instead of jumping on the handoff frame.
   ===================================================================== */
.working-variant-11 .dt11 {
  font-family:var(--font-mono); display:flex; flex-direction:column; gap:7px;
  --dt-beat:140ms;    /* one printed line per beat */
  --dt-print:180ms;   /* the paper advance itself */
  --dt-ink:85ms;      /* ink starts while the line is still rising */
  --dt-col:34ms;      /* column-to-column cascade inside one line */
  --dt-hit:215ms;     /* when a line's number becomes readable */
  --dt-h:20px;
}
/* padding-bottom is clearance, not decoration: the row straddling the top of
   the window sits ~10px above the tape when the completion total is present,
   and the header's own numerals must stay clear of it. */
.working-variant-11 .dt-head {
  display:flex; align-items:baseline; gap:7px; font-size:9.5px;
  color:var(--subtle); letter-spacing:.05em; text-transform:uppercase;
  border-bottom:1px dashed var(--border-strong); padding-bottom:9px;
}
.working-variant-11 .dt-spacer { flex:1 1 auto; }
.working-variant-11 .dt-sep { color:var(--border-strong); }
.working-variant-11 .dt-clock { color:var(--muted); }
.working-variant-11 .dt-lines i,
.working-variant-11 .dt-n i { font-style:normal; color:var(--subtle); margin-left:3px; font-size:9px; }
.working-variant-11 .dt-tot { display:flex; gap:7px; }
/* The head totals are summaries, not events: the per-line flash belongs to
   the tape. What reads as change up here is the odometer stepping. */
.working-variant-11 .dt-head .dt-add { animation:none; color:color-mix(in srgb, var(--positive) 84%, var(--muted)); }
.working-variant-11 .dt-head .dt-del { animation:none; color:color-mix(in srgb, var(--danger) 84%, var(--muted)); }

/* ---- Head odometer ---------------------------------------------------
   Values are stacked in one line-tall clip. Everything but the current
   value is taken out of flow, so the box is sized by the value that ends
   up showing and the earlier ones can roll past behind it. Each value
   knows the beat it arrives on (--dt-in) and the beat it leaves on
   (--dt-out), which are the beats of the rows that produced them.      */
.working-variant-11 .dt-odo {
  position:relative; display:inline-block; overflow:hidden; vertical-align:bottom;
  --dt-glow:0;
}
.working-variant-11 .dt-tot .dt-odo { --dt-glow:1; }
.working-variant-11 .dt-odo-v { display:block; font-style:normal; white-space:nowrap; }
.working-variant-11 .dt-odo-v:not(.now) { position:absolute; left:0; top:0; pointer-events:none; }
.working-variant-11 .dt-odo-v.in {
  animation:dt-odo-in 200ms var(--pm-ease-pop) both,
            dt-odo-hit 520ms var(--pm-ease-out) both;
  animation-delay:calc(var(--dt-in,0) * var(--dt-beat) + var(--dt-hit)),
                  calc(var(--dt-in,0) * var(--dt-beat) + var(--dt-hit));
}
.working-variant-11 .dt-odo-v.in.out {
  animation:dt-odo-in 200ms var(--pm-ease-pop) both,
            dt-odo-hit 520ms var(--pm-ease-out) both,
            dt-odo-out 200ms var(--pm-ease-pop) both;
  animation-delay:calc(var(--dt-in,0) * var(--dt-beat) + var(--dt-hit)),
                  calc(var(--dt-in,0) * var(--dt-beat) + var(--dt-hit)),
                  calc(var(--dt-out,0) * var(--dt-beat) + var(--dt-hit));
}
.working-variant-11 .dt-odo-v.out:not(.in) {
  animation:dt-odo-out 200ms var(--pm-ease-pop) both;
  animation-delay:calc(var(--dt-out,0) * var(--dt-beat) + var(--dt-hit));
}
@keyframes dt-odo-in { from { transform:translateY(0.95em); opacity:0; } to { transform:none; opacity:1; } }
@keyframes dt-odo-out { from { transform:none; opacity:1; } to { transform:translateY(-0.95em); opacity:0; } }
/* currentColor, so one keyframe serves the grey line count and the green
   and red totals in all eight themes; --dt-glow scales it to nothing on
   the counters that should stay quiet. */
@keyframes dt-odo-hit {
  from { text-shadow:0 0 calc(9px * var(--dt-glow,0)) currentColor; }
  to   { text-shadow:0 0 0 rgba(0,0,0,0); }
}

.working-variant-11 .dt-tape {
  height:120px; overflow:hidden;
  display:flex; flex-direction:column; justify-content:flex-end;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 24px);
  mask-image:linear-gradient(to bottom, transparent 0, #000 24px);
}
/* Each row carries its own step's hue on a 2px margin rule, so a step's
   two or three lines read as one block of paper — at six visible rows
   that is the current step plus the tail of the one before it. */
.working-variant-11 .dt-row {
  position:relative; flex:0 0 auto; height:var(--dt-h); line-height:var(--dt-h);
  overflow:hidden; display:flex; align-items:baseline; gap:7px;
  font-size:10.5px; color:var(--muted);
  padding-left:8px;
  border-left:2px solid color-mix(in srgb, var(--pm-step, var(--accent)) 42%, transparent);
  animation:dt-print var(--dt-print) var(--pm-ease-out) both;
  animation-delay:calc(var(--pm-stagger,0) * var(--dt-beat));
}
@keyframes dt-print { from { height:0; opacity:0; } 45% { opacity:1; } to { height:var(--dt-h); opacity:1; } }
/* Paper still warm from the head: the lines this step printed carry a wash
   of the step hue. 120ms + 2 beats + 620ms = 1020ms, so the last line is
   cool again just before the 1050ms tick prints the next step. */
.working-variant-11 .dt-row.fresh {
  animation:dt-print var(--dt-print) var(--pm-ease-out) both,
            dt-hot 620ms linear both;
  animation-delay:calc(var(--pm-stagger,0) * var(--dt-beat)),
                  calc(var(--pm-stagger,0) * var(--dt-beat) + 120ms);
}
@keyframes dt-hot {
  from { background:color-mix(in srgb, var(--pm-step, var(--accent)) 11%, transparent); }
  to   { background:color-mix(in srgb, var(--pm-step, var(--accent)) 0%, transparent); }
}
/* Rows that have travelled past the top of the window. They stay in flow --
   the bottom-anchored column needs them -- and stay painted long enough for
   the step that pushed them out to finish printing, then go honestly
   invisible instead of merely clipped. See the note in variants-a.js. */
.working-variant-11 .dt-row.retired {
  animation:dt-print var(--dt-print) var(--pm-ease-out) both,
            dt-retire 1ms linear both;
  animation-delay:calc(var(--pm-stagger,0) * var(--dt-beat)), 620ms;
}
@keyframes dt-retire { from { visibility:visible; } to { visibility:hidden; } }

.working-variant-11 .dt-v {
  font-style:normal; flex:0 0 34px; color:var(--subtle);
  font-size:9px; text-transform:uppercase; letter-spacing:.06em;
  --dt-i:0;
}
.working-variant-11 .dt-p {
  font-style:normal; flex:0 1 auto; min-width:0; color:var(--text); opacity:.86;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  --dt-i:1;
}
.working-variant-11 .dt-n { font-style:normal; flex:0 0 auto; display:flex; gap:6px; --dt-i:3; }
/* The ink, one column at a time, after the paper has started to rise. */
.working-variant-11 .dt-row > i.dt-v,
.working-variant-11 .dt-row > i.dt-p,
.working-variant-11 .dt-row > i.dt-n {
  animation:dt-ink 130ms var(--pm-ease-out) both;
  animation-delay:calc(var(--pm-stagger,0) * var(--dt-beat) + var(--dt-ink) + var(--dt-i,0) * var(--dt-col));
}
@keyframes dt-ink { from { opacity:0; filter:blur(2px); } to { opacity:1; filter:blur(0); } }
/* The leader is drawn, not faded: it runs out from the path towards the
   number in the gap between the two landing. */
.working-variant-11 .dt-lead {
  flex:1 1 auto; min-width:10px; align-self:center; height:0;
  border-bottom:1px dotted var(--border-strong); opacity:.7;
  transform-origin:left center;
  animation:dt-draw 240ms var(--pm-ease-out) both;
  animation-delay:calc(var(--pm-stagger,0) * var(--dt-beat) + var(--dt-ink) + 2 * var(--dt-col));
}
@keyframes dt-draw { from { transform:scaleX(0); opacity:0; } to { transform:scaleX(1); opacity:.7; } }
/* A tape's own "still feeding" signal: a hard-edged block cursor on the
   newest line. steps(1,end) so it snaps like a terminal caret rather than
   breathing — deliberately unlike take 9's soft prose caret. forwards
   rather than both, so it stays hidden through its delay instead of
   back-filling on top of a line that has not printed yet. */
.working-variant-11 .dt-feed {
  flex:0 0 auto; width:6px; height:11px; margin-left:2px; align-self:center;
  background:var(--pm-step, var(--accent)); opacity:0;
  animation:dt-feed 900ms steps(1,end) infinite forwards;
  animation-delay:calc(var(--pm-stagger,0) * var(--dt-beat) + var(--dt-hit));
}
@keyframes dt-feed { 0% { opacity:1; } 50% { opacity:0; } 100% { opacity:1; } }

.working-variant-11 .dt-add, .working-variant-11 .dt-del,
.working-variant-11 .dt-ok, .working-variant-11 .dt-ms, .working-variant-11 .dt-ln { font-weight:700; }
.working-variant-11 .dt-ln { color:var(--muted); }
/* Every flash waits for its own line's beat, so three diffs arriving in
   one step flash in sequence rather than all at once. */
.working-variant-11 .dt-row .dt-add,
.working-variant-11 .dt-row .dt-del,
.working-variant-11 .dt-row .dt-ok,
.working-variant-11 .dt-row .dt-ms {
  animation-duration:520ms; animation-timing-function:var(--pm-ease-out); animation-fill-mode:both;
  animation-delay:calc(var(--pm-stagger,0) * var(--dt-beat) + var(--dt-hit));
}
.working-variant-11 .dt-add { color:var(--positive); animation-name:dt-flash-add; }
.working-variant-11 .dt-del { color:var(--danger); animation-name:dt-flash-del; }
.working-variant-11 .dt-ok { color:var(--positive); animation-name:dt-flash-add; }
.working-variant-11 .dt-ms { color:var(--warning); animation-name:dt-flash-run; }
@keyframes dt-flash-add {
  0%   { color:var(--positive); text-shadow:0 0 9px color-mix(in srgb, var(--positive) 65%, transparent); }
  26%  { color:var(--positive); }
  100% { color:color-mix(in srgb, var(--positive) 74%, var(--muted)); text-shadow:none; }
}
@keyframes dt-flash-del {
  0%   { color:var(--danger); text-shadow:0 0 9px color-mix(in srgb, var(--danger) 65%, transparent); }
  26%  { color:var(--danger); }
  100% { color:color-mix(in srgb, var(--danger) 74%, var(--muted)); text-shadow:none; }
}
@keyframes dt-flash-run {
  0%   { color:var(--warning); text-shadow:0 0 9px color-mix(in srgb, var(--warning) 60%, transparent); }
  26%  { color:var(--warning); }
  100% { color:color-mix(in srgb, var(--warning) 72%, var(--muted)); text-shadow:none; }
}

.working-variant-11 .dt-total {
  border-top:1px dashed var(--border-strong); border-left-color:transparent;
  height:26px; line-height:26px; margin-top:4px;
}
.working-variant-11 .dt-total .dt-v,
.working-variant-11 .dt-total .dt-p { color:var(--text); opacity:1; font-weight:700; }
@keyframes dt-print-total { from { height:0; opacity:0; } to { height:26px; opacity:1; } }
.working-variant-11 .dt-total { animation-name:dt-print-total; }

/* ---- Reduced motion --------------------------------------------------
   Keep the state changes (they are the subject), stop the loops. */
@media (prefers-reduced-motion: reduce) {
  /* motion.css caps every loop at one pass; these three are the loops this
     file adds, and each is killed outright rather than left to finish a
     pass. The two shimmers also have to drop back to painted text, since
     .pm-shimmer leaves color:transparent behind when its animation stops. */
  .working-variant-9 .ws-caret { animation:none; opacity:.75; }
  .working-variant-11 .dt-feed { animation:none; opacity:.75; }
  .working-variant-8 .rail8-verb.pm-shimmer,
  .working-variant-8 .rail8-verb.pm-shimmer.pm-settled,
  .working-variant-10 .tc10-line b.pm-shimmer,
  .working-variant-10 .tc10-line b.pm-shimmer.pm-settled {
    animation:none; background:none; color:var(--text);
  }
  /* Everything below is cancelled outright rather than squeezed to 1ms.
     Squeezing leaves the element's resting appearance owned by an animation's
     fill, which is fragile in two ways: a media query adds no specificity, so
     a short override silently loses to the longer selector that declared the
     animation (`.dt-row > i` does not out-specify `.dt-row > i.dt-v`, and
     `.dt-odo-v` does not out-specify `.dt-odo-v.in.out`), and any reader that
     samples the computed style of a filled animation gets the from-state back.
     With animation:none the resting style IS the declared style, and every
     one of these declares a visible one -- which is why none of them may be
     given `opacity:0` in their base rule. The two exceptions keep an
     animation because hiding is their whole job. */
  .working-variant-9 .ws-chip,
  .working-variant-10 .tc10-item,
  .working-variant-10 .tc10-item.live,
  .working-variant-10 .tc10-name,
  .working-variant-10 .tc10-line,
  .working-variant-10 .tc10-line code,
  .working-variant-11 .dt-row,
  .working-variant-11 .dt-row.fresh,
  .working-variant-11 .dt-row > i.dt-v,
  .working-variant-11 .dt-row > i.dt-p,
  .working-variant-11 .dt-row > i.dt-n,
  .working-variant-11 .dt-lead,
  .working-variant-11 .dt-odo-v,
  .working-variant-11 .dt-odo-v.in,
  .working-variant-11 .dt-odo-v.in.out,
  .working-variant-11 .dt-odo-v.out:not(.in) { animation:none; filter:none; transform:none; }
  /* The flashes settle to a muted mix; with the animation gone that mix has
     to be declared, or the numbers rest at their full alert colour. */
  .working-variant-11 .dt-row .dt-add { animation:none; color:color-mix(in srgb, var(--positive) 74%, var(--muted)); }
  .working-variant-11 .dt-row .dt-del { animation:none; color:color-mix(in srgb, var(--danger) 74%, var(--muted)); }
  .working-variant-11 .dt-row .dt-ok  { animation:none; color:color-mix(in srgb, var(--positive) 74%, var(--muted)); }
  .working-variant-11 .dt-row .dt-ms  { animation:none; color:color-mix(in srgb, var(--warning) 72%, var(--muted)); }
  /* Exception 1: the odometer's earlier values are stacked behind the current
     one and were only ever taken away by their roll-out. With no roll there is
     nothing to read but the current value. */
  .working-variant-11 .dt-odo-v:not(.now) { visibility:hidden; }
  /* Exception 2: a retired row has to keep a (1ms) animation, because
     visibility:hidden is what it exists to reach. Nothing is being pushed out
     over time here, so it can go invisible on the frame it leaves the window. */
  .working-variant-11 .dt-row.retired {
    animation:dt-retire 1ms linear 1ms both; filter:none; transform:none;
  }
  .working-variant-11 .dt-row.retired { animation-duration:1ms, 1ms; animation-delay:0ms, 1ms; }
}

/* Working-animation takes — group b. Scope every rule under
   .working-variant-N so takes cannot collide with each other.

   12 Signal Meter · 13 Blueprint · 14 Timeline Scrub · 15 Terminal Cast

   Durations reuse the tokens motion.css measured from the reference
   recording: --pm-t-label 90ms, --pm-t-icon 150ms, --pm-t-row 110ms,
   --pm-t-cascade 45ms, --pm-t-handoff 220ms, --pm-shimmer-cycle 1370ms.
   Nothing below invents a timing; the two longer values (640ms gauge
   sweep / playhead glide) are --pm-t-panel-class travel, deliberately
   slower than a handoff because they cross the whole instrument.       */

/* =====================================================================
   12 — SIGNAL METER
   ===================================================================== */
.working-variant-12 .pm12{ display:grid; gap:10px; }
.working-variant-12 .pm12-cluster{ display:grid; grid-template-columns:118px minmax(0,1fr); gap:13px; align-items:stretch; }

/* ---- concentric gauges ---- */
.working-variant-12 .pm12-gauge{ position:relative; width:118px; height:118px; animation:pm12-cluster-in 260ms var(--pm-ease-out) both; }
.working-variant-12 .pm12-gauge svg{ display:block; }
.working-variant-12 .pm12-trk{ fill:none; stroke:var(--surface-4); stroke-width:5; stroke-linecap:round; }
.working-variant-12 .pm12-val{
  fill:none; stroke-width:5; stroke-linecap:round;
  /* the value IS the offset, because pathLength is normalised to 100.
     The 200-unit gap parks the next dash past the end of the path, so a
     zeroed gauge shows nothing at all rather than a stray round cap. */
  stroke-dasharray:100 200;
  transition: stroke-dashoffset 640ms var(--pm-ease-out), stroke var(--pm-t-icon) linear;
}
.working-variant-12 .pm12-val.a{ stroke:var(--pm-step,var(--accent)); }
/* The middle ring is deliberately lighter-weight as well as a different
   hue, because two themes (friendly, retro) put --accent-2 and
   --positive close together and hue alone would not separate them. */
.working-variant-12 .pm12-val.b{ stroke:var(--accent-2); stroke-width:3.4; }
.working-variant-12 .pm12-val.c{ stroke:var(--positive); }
.working-variant-12 .pm12-trk.b{ stroke-width:3.4; }
.working-variant-12 .pm12-core{
  position:absolute; inset:0; display:grid; place-content:center; text-align:center; line-height:1;
}
.working-variant-12 .pm12-core b{ font:700 21px/1 var(--font-mono); letter-spacing:-.03em; display:flex; align-items:baseline; justify-content:center; gap:1px; }
.working-variant-12 .pm12-core b u{ text-decoration:none; font-size:10px; color:var(--muted); }
.working-variant-12 .pm12-core span{ display:block; margin-top:4px; font:600 7px/1 var(--font-mono); letter-spacing:.16em; color:var(--subtle); }

/* ---- channel header ---- */
.working-variant-12 .pm12-right{ display:grid; grid-template-rows:auto auto 1fr; gap:8px; min-width:0; }
.working-variant-12 .pm12-chan{ display:flex; align-items:center; gap:7px; font:600 9px/1 var(--font-mono); letter-spacing:.1em; }
.working-variant-12 .pm12-ch{ color:var(--subtle); }
.working-variant-12 .pm12-chan strong{ font:800 12px/1 var(--font-mono); letter-spacing:.08em; }
.working-variant-12 .pm12-sp{ flex:1; }
.working-variant-12 .pm12-st{ padding:2px 5px; border:1px solid var(--border); color:var(--muted); }
.working-variant-12 .pm12-st.live{ color:var(--pm-step,var(--accent)); border-color:color-mix(in srgb,var(--pm-step,var(--accent)) 45%,var(--border)); }
.working-variant-12 .pm12-st.hold{ color:var(--positive); border-color:color-mix(in srgb,var(--positive) 45%,var(--border)); }
.working-variant-12 .pm12-clock{ color:var(--muted); }

/* ---- scope ---- */
.working-variant-12 .pm12-scope{
  position:relative; height:50px; overflow:hidden;
  border:1px solid var(--border); background:var(--code); border-radius:3px;
}
.working-variant-12 .pm12-grid{ position:absolute; inset:0; width:100%; height:100%; }
.working-variant-12 .pm12-grid path{ fill:none; stroke:var(--border); stroke-width:1; vector-effect:non-scaling-stroke; opacity:.8; }
.working-variant-12 .pm12-amp{
  position:absolute; inset:0;
  transform:scaleY(var(--amp,1));
  transition:transform 640ms var(--pm-ease-out);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 92%,transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 92%,transparent 100%);
}
.working-variant-12 .pm12-trace{ position:absolute; inset:0; width:100%; height:100%; }
.working-variant-12 .pm12-trace path{ fill:none; stroke:var(--pm-step,var(--accent)); stroke-width:1.4; stroke-linejoin:round; transition:stroke var(--pm-t-icon) linear; }
/* one tile is 240 user units wide and the trace is exactly periodic over
   it, so translating by a tile loops with no seam */
@keyframes pm12-wave{ from{ transform:translateX(0); } to{ transform:translateX(-240px); } }
.working-variant-12 .pm12-scroll{ animation:pm12-wave 3400ms linear infinite; }
.working-variant-12 .pm12-scroll.held{ animation-play-state:paused; }
.working-variant-12 .pm12-head{
  position:absolute; top:0; bottom:0; right:8%; width:1px;
  background:color-mix(in srgb,var(--pm-step,var(--accent)) 70%,transparent);
}

/* ---- numeric readouts ---- */
.working-variant-12 .pm12-meters{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; align-content:end; }
.working-variant-12 .pm12-m{ min-width:0; border-top:1px solid var(--border); padding-top:5px; }
.working-variant-12 .pm12-m label{ display:flex; align-items:center; gap:4px; font:600 7px/1 var(--font-mono); letter-spacing:.14em; color:var(--subtle); }
