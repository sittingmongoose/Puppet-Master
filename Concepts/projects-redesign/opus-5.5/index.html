<!doctype html>
<html lang="en" data-theme="basic-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects page and New Project · Opus 5.5</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #101012; overflow: hidden; font: 500 12px/1.2 Inter, system-ui, sans-serif; color: #e6e6ea; }
  :root { --dock-h: 78px; }
  /* the review strip sits under PMConcept7, so the page being judged keeps the whole window above it */
  .pc-dock { position: fixed; inset: auto 0 0 0; height: var(--dock-h); box-sizing: border-box; display: grid; grid-template-rows: 44px 1fr;
    background: #18181b; border-top: 1px solid #2a2a30; z-index: 3; }
  .pc-bar { display: flex; align-items: center; gap: 10px; padding: 0 12px; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
  .pc-bar b { font-weight: 650; }
  .pc-model { padding: 3px 6px; border-radius: 6px; background: rgba(255, 255, 255, .08); color: #b9b9c2; }
  .pc-sep { width: 1px; align-self: stretch; margin: 10px 2px; background: #2e2e35; flex: none; }
  .pc-seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 8px; background: #222226; border: 1px solid #2e2e35; }
  .pc-seg button { font: inherit; color: #c9c9d1; background: transparent; border: 0; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  .pc-seg button:hover { background: rgba(255, 255, 255, .07); color: #fff; }
  .pc-seg button[aria-pressed="true"] { background: #e6e6ea; color: #111; }
  .pc-seg button kbd { font: 600 9.5px/1 ui-monospace, monospace; opacity: .55; margin-left: 4px; }
  .pc-bar select, .pc-bar .pc-btn { font: inherit; color: inherit; background: #222226; border: 1px solid #2e2e35; border-radius: 7px; padding: 5px 8px; cursor: pointer; }
  .pc-bar select:hover, .pc-bar .pc-btn:hover { background: #2a2a2f; }
  .pc-bar select:disabled { opacity: .6; cursor: progress; }
  .pc-bar label.pc-check { display: inline-flex; align-items: center; gap: 5px; color: #c9c9d1; cursor: pointer; }
  .pc-bar :focus-visible { outline: 2px solid #7aa7ff; outline-offset: 1px; }
  .pc-note { padding: 0 14px 0; color: #b4b4bd; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pc-note b { color: #fff; font-weight: 650; }
  .pc-stage { position: fixed; inset: 0 0 var(--dock-h) 0; display: flex; justify-content: center; background: #0b0b0d; }
  #pm7 { display: block; height: 100%; width: 100%; border: 0; background: #1e1e1e; transition: width .2s ease; }
  .pc-wait { position: fixed; inset: 0 0 var(--dock-h) 0; display: grid; place-items: center; color: #8d8d96; pointer-events: none; z-index: 2; }
  @media (prefers-reduced-motion: reduce) { #pm7 { transition: none; } }
</style>
</head>
<body>
<div class="pc-stage"><iframe id="pm7" title="PMConcept7 with the Projects concepts" src="../../PMConcept7.html?o55=off"></iframe></div>
<div class="pc-wait" id="wait">Loading PMConcept7…</div>
<div class="pc-dock">
  <div class="pc-bar" role="toolbar" aria-label="Projects concepts">
    <b>Projects</b><span class="pc-model" data-concept-model="Opus 5.5">Opus 5.5</span>
    <span class="pc-sep" aria-hidden="true"></span>
    <div class="pc-seg" id="opt" role="group" aria-label="Concept">
      <button type="button" data-opt="a" aria-pressed="true">A · Polish<kbd>1</kbd></button>
      <button type="button" data-opt="b" aria-pressed="false">B · Ledger<kbd>2</kbd></button>
      <button type="button" data-opt="c" aria-pressed="false">C · Split<kbd>3</kbd></button>
      <button type="button" data-opt="before" aria-pressed="false">Today<kbd>0</kbd></button>
    </div>
    <select id="look" aria-label="Look">
      <option value="basic-dark">Basic Dark</option><option value="basic-light">Basic Light</option>
      <option value="friendly-dark">Friendly Dark</option><option value="friendly-light">Friendly Light</option>
      <option value="glass-dark">Glass Dark</option><option value="glass-light">Glass Light</option>
      <option value="retro-dark">Retro Dark</option><option value="retro-light">Retro Light</option>
      <option value="nier-dark">NieR Dark</option><option value="nier-light">NieR Light</option>
    </select>
    <select id="scenario" aria-label="Projects shown">
      <option value="demo">Projects: the demo set</option>
      <option value="first">Projects: first run, none yet</option>
      <option value="many">Projects: 40 projects</option>
    </select>
    <select id="width" aria-label="Window width">
      <option value="">Full width</option><option value="1280">1280 px</option><option value="1024">1024 px</option><option value="860">860 px</option><option value="640">640 px</option>
    </select>
    <span class="pc-sep" aria-hidden="true"></span>
    <button type="button" class="pc-btn" data-act="new">New Project</button>
    <button type="button" class="pc-btn" data-act="missing">Folder missing</button>
    <button type="button" class="pc-btn" data-act="unfinished">Setup didn't finish</button>
    <button type="button" class="pc-btn" data-act="reset">Reset demo</button>
    <label class="pc-check"><input type="checkbox" id="reduced"> Reduced motion</label>
  </div>
  <div class="pc-note" id="note"></div>
</div>
<script src="concept-hub-bridge.js"></script>
<script>
(function () {
  'use strict';
  /* This page and PMConcept7 talk only by message. Served (the Concept Hub, a local server), the two share an origin and
     this page also adds the layer to PMConcept7. In the single file the layer is already inside, and a sandboxed preview
     (T3's file preview) gives PMConcept7 an origin of its own, where reaching into it fails; messages cross that line. */
  const frame = document.getElementById('pm7');
  const base = new URL('./', location.href);
  const STEPS = [
    ['css', 'layer/core.css'], ['js', 'layer/core.js'], ['js', 'layer/flow.js'], ['js', 'layer/parts.js'],
    ['css', 'concepts/a.css'], ['js', 'concepts/a.js'],
    ['css', 'concepts/b.css'], ['js', 'concepts/b.js'],
    ['css', 'concepts/c.css'], ['js', 'concepts/c.js'],
    ['js', 'layer/boot.js']
  ].map(([k, p]) => [k, new URL(p, base).href]);
  const NOTES = {
    a: '<b>A · Polish.</b> Today’s page, kept and brought up to Home and Usage: the same cards, now with a status mark and word, a Safe line (history, online copy, backup), labelled actions and a More menu. One New Project button opens a stepped window that asks what onboarding asks, without the stage.',
    b: '<b>B · Ledger.</b> Usage’s layout: a side list of views with counts, a header row of filters, and one ledger row per project with its status, place, history, online copy and backup. A row opens an inspector beside it. New Project is a sheet from the right on one scrolling page.',
    c: '<b>C · Split.</b> A project list on the left and the chosen project’s own page on the right: what it is doing, where it lives, how it is kept safe, and what needs you. New Project is a launcher: paste a link or a folder, or pick a way, then one short page and Create.',
    before: '<b>Today.</b> PMConcept7’s current Projects page, unchanged: New Project and Open Folder open the same sheet, the card icons have no labels, and the folder-missing project points to a Settings page that cannot fix it.'
  };
  const UI = { opt: 'a', scenario: 'demo' };
  const $ = (id) => document.getElementById(id);
  let live = false;

  const send = (msg) => { try { frame.contentWindow.postMessage(Object.assign({ source: 'pjx-host' }, msg), '*'); } catch (e) { /* not there yet */ } };
  const config = () => send({ cmd: 'config', opt: UI.opt, scenario: UI.scenario });
  function paintBar() {
    document.querySelectorAll('#opt button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.opt === UI.opt)));
    $('note').innerHTML = NOTES[UI.opt];
    $('scenario').value = UI.scenario;
    document.querySelectorAll('[data-act]').forEach((b) => { b.disabled = UI.opt === 'before'; });
  }

  /* PMConcept7 keeps each project's look in that project's Settings, so switching looks here writes them; the values found
     on arrival are put back when this page closes. The layer keeps its demo projects in sessionStorage only. */
  const KEYS = ['tastebook', 'harbor', 'loom'].map((p) => 'pm7:settings:tome-tabs:v1:' + p);
  const OB = 'pm.o55.onboarding.v1';
  const SNAP = {};
  try { KEYS.concat(OB).forEach((k) => { SNAP[k] = localStorage.getItem(k); }); } catch (e) { /* storage may be off */ }
  window.addEventListener('pagehide', () => {
    try {
      KEYS.forEach((k) => { if (SNAP[k] === null) localStorage.removeItem(k); else if (SNAP[k] !== undefined) localStorage.setItem(k, SNAP[k]); });
      if (SNAP[OB] === null && /projects-concept/.test(localStorage.getItem(OB) || '')) localStorage.removeItem(OB);
    } catch (e) { /* ignore */ }
  });

  // served: add the layer to PMConcept7 once its shell is there (skipped when the layer is inside already, or out of reach)
  function inject() {
    let d = null;
    try { d = frame.contentDocument; } catch (e) { d = null; }
    if (!d || !d.documentElement || d.documentElement.hasAttribute('data-pjx-layer')) return;
    const W = frame.contentWindow;
    if (!(W.PMG && W.PM_PAGES && d.getElementById('panel-projects') && d.getElementById('themeSelect'))) { setTimeout(inject, 150); return; }
    d.documentElement.setAttribute('data-pjx-layer', 'loading');
    let i = 0;
    const next = () => {
      if (i >= STEPS.length) return;
      const [kind, url] = STEPS[i++];
      const el = d.createElement(kind === 'css' ? 'link' : 'script');
      if (kind === 'css') { el.rel = 'stylesheet'; el.href = url; } else el.src = url;
      el.onload = next;
      el.onerror = () => { console.error('Projects concept: could not load', url); next(); };
      (kind === 'css' ? d.head : d.body).appendChild(el);
    };
    next();
  }
  frame.addEventListener('load', () => { live = false; inject(); });

  // until the layer answers, ask every 300 ms whether it is there (it may have spoken before this page was listening)
  setInterval(() => { if (!live) send({ cmd: 'hello' }); }, 300);

  window.addEventListener('message', (ev) => {
    const m = ev.data;
    if (!m || typeof m !== 'object') return;
    if (m.source === 'pjx' && ev.source === frame.contentWindow) {
      if (m.type === 'ready' && !live) {
        live = true;
        const w = $('wait'); if (w) w.remove();
        config();
        if ($('reduced').checked) send({ cmd: 'motion', reduced: true });
      }
      if (m.state) {
        if (m.state.look) $('look').value = m.state.look;
        if (m.state.opt) { UI.opt = m.state.opt; UI.scenario = m.state.scenario || UI.scenario; paintBar(); }
        if (m.type === 'look-done') $('look').disabled = false;
      }
      return;
    }
    // the Concept Hub's look and reduced motion reach PMConcept7 inside
    if (m.source === 'pm-concept-hub' && m.type === 'pm-concept-state' && m.state) {
      $('reduced').checked = !!m.state.reducedMotion;
      send({ cmd: 'motion', reduced: !!m.state.reducedMotion });
      if (m.state.theme && m.state.theme !== $('look').value) send({ cmd: 'look', look: m.state.theme });
    }
  });

  $('opt').addEventListener('click', (e) => { const b = e.target.closest('button[data-opt]'); if (!b) return; UI.opt = b.dataset.opt; paintBar(); config(); });
  $('scenario').addEventListener('change', (e) => { UI.scenario = e.target.value; config(); });
  $('look').addEventListener('change', (e) => { e.target.disabled = true; send({ cmd: 'look', look: e.target.value }); setTimeout(() => { e.target.disabled = false; }, 4000); });
  $('width').addEventListener('change', (e) => { frame.style.width = e.target.value ? e.target.value + 'px' : '100%'; });
  $('reduced').addEventListener('change', (e) => send({ cmd: 'motion', reduced: e.target.checked }));
  document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => send({ cmd: 'act', act: b.dataset.act })));
  // 1-3 pick a concept and 0 shows today's page (outside text fields; inside PMConcept7 the layer listens for the same keys)
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || /input|select|textarea/i.test((e.target && e.target.tagName) || '')) return;
    const map = { 1: 'a', 2: 'b', 3: 'c', 0: 'before' };
    if (map[e.key]) { UI.opt = map[e.key]; paintBar(); config(); }
  });
  paintBar();
  window.PJX_HOST = { frame, UI, send, config, isLive: () => live };
})();
</script>
</body>
</html>
