<!doctype html>
<html lang="en" data-theme="friendly-dark" data-reduced-motion="0" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>02 Atlas — GLM-5.2 Settings</title>
  <link rel="stylesheet" href="assets/themes.css">
  <link rel="stylesheet" href="assets/shell.css">
  <link rel="stylesheet" href="assets/managers.css">
  <style>
    /* ===== CONCEPT 02 ATLAS — spatial/cartographic IA ===== */
    .at-stage { display: flex; flex-direction: column; height: 100%; min-height: 0; }

    /* HOME: atlas overview */
    .at-home { flex: 1; display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
    .at-canvas { position: relative; overflow: hidden; padding: 18px; }
    .at-canvas-inner { position: relative; width: 100%; height: 100%;
      /* showcase: static cartographic backdrop — survey grid + contour rings, zero animation */
      background:
        radial-gradient(closest-side at 26% 32%, transparent 66%, color-mix(in srgb, var(--accent) 6%, transparent) 67%, transparent 69%),
        radial-gradient(closest-side at 26% 32%, transparent 82%, color-mix(in srgb, var(--accent) 5%, transparent) 83%, transparent 85%),
        radial-gradient(closest-side at 74% 74%, transparent 58%, color-mix(in srgb, var(--accent) 6%, transparent) 59%, transparent 61%),
        radial-gradient(closest-side at 74% 74%, transparent 76%, color-mix(in srgb, var(--accent) 4%, transparent) 77%, transparent 79%),
        repeating-linear-gradient(0deg, transparent 0 55px, color-mix(in srgb, var(--ink) 4%, transparent) 55px 56px),
        repeating-linear-gradient(90deg, transparent 0 55px, color-mix(in srgb, var(--ink) 4%, transparent) 55px 56px);
    }
    /* command overlay search — top center, dims the map when focused */
    .at-cmdk { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 20; width: min(560px, 80%); }
    .at-cmdk-field { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 46px; background: var(--surface-elev); border: 1px solid var(--line); border-radius: var(--r-pill); box-shadow: var(--sh-2); transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }
    .at-cmdk-field:focus-within { border-color: var(--accent-line); box-shadow: var(--sh-2), 0 0 0 3px var(--accent-soft); }
    .at-cmdk-field input { flex: 1; background: transparent; border: none; outline: none; font-size: 14px; color: var(--ink); }
    .at-cmdk-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface-elev); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh-3); max-height: 340px; overflow: auto; padding: 6px; z-index: 25; }
    .at-cmdk-result { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; }
    .at-cmdk-result:hover { background: var(--surface-2); }
    .at-cmdk-result .at-rkind { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); width: 76px; flex: none; }

    /* regions: named areas with boundaries; size encodes density (settings count) */
    .at-regions { position: relative; display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: minmax(70px, auto); gap: 10px; padding: 70px 4px 16px; height: 100%; overflow: auto; }
    .at-region {
      position: relative; border: 1px solid var(--line); background: var(--surface);
      border-radius: var(--r-lg); padding: 14px; cursor: pointer; text-align: left; color: inherit;
      display: flex; flex-direction: column; gap: 6px;
      transition: transform var(--t-mid) var(--ease), border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
    }
    .at-region:hover { transform: translateY(-2px) scale(1.005); border-color: var(--accent-line); background: var(--surface-2); box-shadow: var(--sh-2); z-index: 3; }
    /* showcase: hover composes with the pointer tilt (vars written by pointerFX) */
    [data-reduced-motion="0"] .at-region:hover {
      transform: translateY(-2px) scale(1.005) perspective(900px) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
    }
    .at-region.has-attention { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
    .at-region-top { display: flex; align-items: center; gap: 8px; }
    .at-region-icon { width: 30px; height: 30px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); border-radius: var(--r-xs); flex: none; }
    .at-region h3 { margin: 0; font-size: 14px; font-weight: 700; }
    .at-region-purpose { color: var(--ink-2); font-size: 11px; line-height: 1.4; }
    .at-region-meta { display: flex; align-items: center; gap: 6px; margin-top: auto; flex-wrap: wrap; }
    /* you-are-here marker (text badge on current region) */
    .at-here { position: absolute; top: 8px; right: 10px; font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); display: none; }
    .at-region.current .at-here { display: inline; }
    /* traveling you-are-here pin — eases between regions across the map */
    .at-pin { position: absolute; z-index: 8; width: 14px; height: 14px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg) translateZ(0); background: var(--accent); border: 2px solid var(--surface-elev); box-shadow: var(--sh-1); pointer-events: none; opacity: .95; transition: left 320ms var(--ease-settle), top 320ms var(--ease-settle); }
    .at-pin::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--surface-elev); opacity: .35; }
    [data-reduced-motion="1"] .at-pin { transition: none; }
    /* region grid spans (density-encoded sizes) */
    .at-r-general       { grid-column: span 4; grid-row: span 2; }
    .at-r-appearance    { grid-column: span 3; grid-row: span 2; }
    .at-r-agents        { grid-column: span 5; grid-row: span 3; }
    .at-r-permissions   { grid-column: span 3; grid-row: span 2; }
    .at-r-code          { grid-column: span 4; grid-row: span 2; }
    .at-r-context       { grid-column: span 5; grid-row: span 2; }
    .at-r-planning      { grid-column: span 4; grid-row: span 2; }
    .at-r-git           { grid-column: span 3; grid-row: span 2; }
    .at-r-extensions    { grid-column: span 5; grid-row: span 2; }
    .at-r-media         { grid-column: span 3; grid-row: span 2; }
    .at-r-system        { grid-column: span 4; grid-row: span 2; }

    /* right rail: notices + legend */
    .at-rail { border-left: 1px solid var(--line); background: var(--surface); overflow: auto; padding: 16px; }
    .at-rail h2 { font-size: 13px; margin: 0 0 10px; letter-spacing: .04em; }
    .at-legend { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .at-legend-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-2); }
    .at-region-shape { border: 1px solid var(--line); border-radius: var(--r-xs); flex: none; }
    .at-notice-mini { padding: 10px; border-radius: var(--r-sm); border: 1px solid var(--line); margin-bottom: 8px; background: var(--surface-2); }
    .at-notice-mini.attention { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
    .at-notice-mini.continue { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
    .at-notice-mini h4 { margin: 0 0 4px; font-size: 12px; }
    .at-notice-mini .muted { font-size: 11px; }
    .at-notice-mini button { margin-top: 6px; }

    /* WORKSPACE: focus + context */
    .at-workspace { display: grid; grid-template-columns: 200px 1fr 180px; height: 100%; min-height: 0; }
    .at-focus { overflow: auto; padding: clamp(14px,2vw,28px); }
    .at-focus-inner { max-width: 820px; margin: 0 auto; }
    .at-focus h2 { font-size: 22px; margin: 0 0 4px; }
    .at-focus-purpose { color: var(--ink-2); font-size: 13px; margin-bottom: 16px; }
    .at-sub-section { padding: 12px 0; scroll-margin-top: 16px; }
    .at-sub-section + .at-sub-section { border-top: 1px solid var(--line-2); }
    .at-sub-section h3 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }

    /* minimap (context rail) */
    .at-minimap { border-right: 1px solid var(--line); background: var(--surface); overflow: auto; padding: 12px 10px; }
    .at-mm-label { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
    .at-mm-region { display: block; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; color: var(--ink-2); padding: 6px 8px; border-radius: var(--r-xs); cursor: pointer; font-size: 12px; position: relative; }
    .at-mm-region:hover { background: var(--surface-2); color: var(--ink); }
    .at-mm-region.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
    .at-mm-region .at-mm-here { position: absolute; left: -2px; top: 50%; transform: translateY(-50%); width: 3px; height: 60%; background: var(--accent); border-radius: 99px; opacity: 0; }
    .at-mm-region.active .at-mm-here { opacity: 1; }
    .at-mm-sub { display: block; width: 100%; text-align: left; background: transparent; border: none; color: var(--ink-3); padding: 3px 8px 3px 16px; border-radius: var(--r-xs); cursor: pointer; font-size: 11px; }
    .at-mm-sub:hover { color: var(--ink); }
    .at-mm-sub.active { color: var(--accent); }

    /* viewport indicator (right context rail) — draggable/clickable jump affordance */
    .at-viewport-rail { border-left: 1px solid var(--line); background: var(--surface); padding: 12px; overflow: auto; }
    .at-viewport-rail .at-mm-label { margin-bottom: 6px; }
    .at-viewport-track { position: relative; width: 8px; height: 200px; background: var(--surface-3); border-radius: 99px; margin: 8px auto; cursor: pointer; }
    .at-viewport-track::before { content: ""; position: absolute; top: -8px; bottom: -8px; left: -8px; right: -8px; }
    .at-viewport-track.dragging .at-viewport-thumb { box-shadow: 0 0 0 4px var(--accent-soft); }
    .at-viewport-thumb { position: absolute; left: 0; right: 0; background: var(--accent); border-radius: 99px; transition: top var(--t-fast) var(--ease), height var(--t-fast) var(--ease); }
    .at-vp-sublist { display: flex; flex-direction: column; gap: 2px; }
    .at-vp-sub { font-size: 11px; padding: 4px 8px; border-radius: var(--r-xs); color: var(--ink-3); cursor: pointer; }
    .at-vp-sub.active { color: var(--accent); background: var(--accent-soft); }

    .at-backbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .at-manager { height: 100%; display: flex; flex-direction: column; }

    /* motion: cartographic zoom/pan */
    [data-reduced-motion="0"] .at-region { animation: at-zoom-in 480ms var(--ease-settle) backwards; }
    .at-region:nth-child(1){animation-delay:0ms}.at-region:nth-child(2){animation-delay:50ms}.at-region:nth-child(3){animation-delay:100ms}
    .at-region:nth-child(4){animation-delay:150ms}.at-region:nth-child(5){animation-delay:200ms}.at-region:nth-child(6){animation-delay:250ms}
    @keyframes at-zoom-in { from { opacity:0; transform: scale(.96); } to { opacity:1; transform:none; } }
    /* showcase: survey beam — each region's boundary draws left→right on map entry, then rests */
    .at-region { overflow: hidden; }
    .at-region::before {
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; z-index: 2;
      background: linear-gradient(90deg, transparent, var(--accent-line), transparent);
      opacity: 0; pointer-events: none; transform-origin: left center;
    }
    [data-reduced-motion="0"] .at-region::before { animation: at-beam 640ms var(--ease-settle) backwards; }
    .at-region:nth-child(1)::before{animation-delay:80ms}.at-region:nth-child(2)::before{animation-delay:130ms}
    .at-region:nth-child(3)::before{animation-delay:180ms}.at-region:nth-child(4)::before{animation-delay:230ms}
    .at-region:nth-child(5)::before{animation-delay:280ms}.at-region:nth-child(6)::before{animation-delay:330ms}
    @keyframes at-beam { 0% { opacity: 0; transform: scaleX(0); } 35% { opacity: .9; } 100% { opacity: 0; transform: scaleX(1); } }
    /* showcase: viewport thumb follows with a spring-like overshoot curve */
    [data-reduced-motion="0"] #vpThumb { transition: top 260ms var(--ease-pop), height 200ms var(--ease); }
    /* C2: region → focus directed continuity (scale + cross-fade via shared swapStage zoom) */
    /* C2: viewport thumb tweens (not snap) — superseded by the spring-curve rule above */
    /* C2: minimap active region indicator slide */
    [data-reduced-motion="0"] .at-mm-region { transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }

    /* squeeze */
    @media (max-width: 1100px) {
      .at-home { grid-template-columns: 1fr; }
      .at-rail { border-left: none; border-top: 1px solid var(--line); max-height: 240px; }
      .at-workspace { grid-template-columns: 1fr; }
      .at-minimap, .at-viewport-rail { display: none; }
      .at-drawerbtn { display: inline-flex !important; }
    }
    .at-drawerbtn { display: none; }
  </style>
</head>
<body>
  <div class="pm-shell" data-rail="open" data-chat="closed"></div>
  <noscript>
    <div style="position:fixed;top:8px;right:12px;z-index:99;padding:3px 9px;border:1px solid #6fc6e8;color:#6fc6e8;border-radius:999px;font:bold 10px sans-serif">GLM-5.2</div>
  </noscript>
  <a data-concept-model="GLM-5.2" href="index.html" title="GLM-5.2 settings concept"
     style="position:fixed;bottom:var(--footer-h,30px);right:12px;z-index:40;display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--accent-line,#6fc6e8);background:var(--accent-soft,rgba(111,198,232,.14));color:var(--accent,#6fc6e8);border-radius:999px;font:bold 9px sans-serif;text-decoration:none;opacity:.85">GLM-5.2 · 02</a>

  <script src="assets/icons.svg.js"></script>
  <script src="assets/demo-data.js"></script>
  <script src="concept-hub-bridge.js"></script>
  <script src="assets/state.js"></script>
  <script src="assets/motion.js"></script>
  <script src="assets/shared.js"></script>
  <script src="assets/managers.js"></script>
  <script src="assets/spellcheck.js"></script>
  <script>
    (function () {
      "use strict";
      PM.jumpOffset = function () { return 60; };

      function shell() {
        var s = document.querySelector(".pm-shell");
        s.innerHTML =
          PM.shared.topbar('<span data-crumb>Settings</span>', "02 Atlas") +
          '<nav class="pm-activity" aria-label="Surrounding navigation">' + PM.shared.activityButtons(PM.state.rail) + '</nav>' +
          PM.shared.rail() +
          '<main class="pm-stage" data-stage></main>' +
          PM.shared.chat() +
          PM.shared.footer();
        PM.shared.wireShell();
        // showcase: pointer-reactive glow/tilt/magnetic press (auto-gated)
        PM.motion.pointerFX && PM.motion.pointerFX(document);
      }

      function regionIcon(catId) {
        return ({ general:"home", appearance:"theme", agents:"pam", permissions:"shield", code:"code",
          context:"brain", planning:"compass", git:"history", extensions:"mcp", media:"media", system:"server" })[catId] || "grid";
      }

      /* ---------- HOME: atlas ---------- */
      function home() {
        var regions = PM.categories.map(function (c) {
          var dest = PM_DEMO.destinations.find(function (d) { return d.target === c.id || d.target.indexOf(c.id + ".") === 0; });
          var status = dest ? dest.status : "";
          var statusKind = dest ? dest.statusKind : "neutral";
          var managerCount = c.sub.filter(function (s) { return s.manager; }).length;
          var sizeClass = "at-r-" + c.id;
          var mgrs = managerCount ? '<span class="chip">' + managerCount + ' manager' + (managerCount>1?"s":"") + '</span>' : "";
          var current = c.id === PM.state.activeCat;
          return [
            '<button class="at-region ' + sizeClass + (statusKind==="warn"?" has-attention":"") + (current?" current":"") + '" data-pm-tilt="1" data-region="' + c.id + '">',
              '<span class="at-here">You are here</span>',
              '<div class="at-region-top">',
                '<span class="at-region-icon">' + PM.svg(regionIcon(c.id), 16) + '</span>',
                '<h3>' + c.title + '</h3>',
              '</div>',
              '<span class="at-region-purpose">' + c.purpose + '</span>',
              '<div class="at-region-meta">',
                status ? '<span class="chip ' + (statusKind!=="neutral"?statusKind:"") + '">' + status + '</span>' : "",
                mgrs,
                '<span class="chip">' + c.sub.length + ' sections</span>',
              '</div>',
            '</button>'
          ].join("");
        }).join("");

        var notices = [];
        ["attention","continue","recommended"].forEach(function (kind) {
          PM_DEMO.notices[kind].forEach(function (n) {
            var kindLabel = { attention:"Needs attention", continue:"Continue setup", recommended:"Recommended" }[kind];
            notices.push('<div class="at-notice-mini ' + kind + '"><span class="muted">' + kindLabel + '</span><h4>' + n.headline + '</h4><button class="btn sm primary" data-notice-target="' + n.target + '">' + n.action + '</button></div>');
          });
        });

        var stage = document.querySelector("[data-stage]");
        stage.innerHTML = [
          '<div class="at-stage">',
            '<div class="at-home">',
              '<div class="at-canvas">',
                '<div class="at-cmdk">',
                  '<div class="at-cmdk-field"><span class="muted">' + PM.svg("search",16) + '</span><input type="search" placeholder="Search the settings map…" data-search-input aria-label="Search settings"><span class="muted small">⌘K</span></div>',
                  '<div class="at-cmdk-results hidden" data-results></div>',
                '</div>',
                '<div class="at-canvas-inner"><div class="at-regions">' + regions + '<span class="at-pin" id="atPin" aria-hidden="true"></span></div></div>',
              '</div>',
              '<aside class="at-rail">',
                '<h2>Legend</h2>',
                '<div class="at-legend">',
                  '<div class="at-legend-row"><span class="at-region-shape" style="width:18px;height:14px"></span>Region — a settings area</div>',
                  '<div class="at-legend-row"><span class="at-region-shape has-attention" style="width:18px;height:14px;border-color:var(--warn)"></span>Needs attention</div>',
                  '<div class="at-legend-row"><span style="width:6px;height:6px;background:var(--accent);border-radius:50%"></span>You are here</div>',
                  '<div class="at-legend-row"><span class="muted">Region size reflects content density.</span></div>',
                '</div>',
                '<h2>Notices</h2>',
                notices.join(""),
                '<div style="margin-top:12px">' + PM.shared.themePicker() + '</div>',
              '</aside>',
            '</div>',
            PM.shared.recentWork(),
            PM.shared.ownedStrip("c2"),
          '</div>'
        ].join("");
        wireHome();
      }

      /* position the traveling you-are-here pin over a region (or hide it) */
      function positionPin(catId, animateFrom) {
        var pin = document.getElementById("atPin");
        if (!pin) return;
        var region = catId && document.querySelector('[data-region="' + catId + '"]');
        if (!region) { pin.style.opacity = "0"; return; }
        var host = pin.parentNode;
        if (animateFrom && !PM.state.reducedMotion) {
          // start from the previous position, then settle onto the target region
          pin.style.transition = "none";
          pin.style.left = (parseFloat(pin.style.left || "0")) + "px";
          pin.style.top = (parseFloat(pin.style.top || "0")) + "px";
          void pin.offsetWidth;
          pin.style.transition = "";
        }
        pin.style.left = (region.offsetLeft + region.offsetWidth - 24) + "px";
        pin.style.top = (region.offsetTop + 10) + "px";
        pin.style.opacity = ".95";
        void host.offsetWidth;
        // showcase: the pin drops in with a small spring settle (state-only under reduced motion)
        if (PM.motion && PM.motion.spring && !PM.state.reducedMotion) {
          PM.motion.spring(pin, function (v) {
            pin.style.transform = "rotate(-45deg) scale(" + v.toFixed(3) + ")";
          }, { from: 1.35, to: 1, stiffness: 210, damping: 13 });
        }
      }

      function wireHome() {
        var inp = document.querySelector("[data-search-input]");
        var res = document.querySelector("[data-results]");
        // search: keyboard arrows/enter + empty state + typo tolerance + match highlight
        PM.shared.wireSearchDropdown({
          input: inp, resultsHost: res, itemSelector: ".at-cmdk-result",
          render: function (results) {
            return results.map(function (r) {
              var km = PM.shared.searchKindMeta(r.kind);
              var target = r.manager ? 'data-r-manager="' + r.manager + '"' : 'data-r-cat="' + r.cat + '" data-r-sub="' + (r.sub||"") + '"';
              return '<div class="at-cmdk-result" ' + target + ' tabindex="0" role="option"><span class="at-rkind ' + km.cls + '">' + km.label + '</span><div class="col"><strong>' + PM.shared.hl(r.label, r.range) + '</strong><span class="muted small"> ' + (r.expl||"").slice(0,50) + '</span></div></div>';
            }).join("");
          },
          onPick: function (r, el) {
            if (!el) return;
            PM.motion && PM.motion.captureOrigin(el);
            var mgr = el.getAttribute("data-r-manager");
            if (mgr) { PM.openManager(mgr); render(); return; }
            PM.openCategory(el.getAttribute("data-r-cat"), el.getAttribute("data-r-sub"));
            render();
          }
        });
        document.querySelectorAll("[data-region]").forEach(function (b) {
          b.addEventListener("click", function () {
            var cat = this.getAttribute("data-region");
            // the pin travels to the region, then the map zooms in from that region (spatial origin)
            PM._atlasLastRegion = cat;
            PM.motion && PM.motion.captureOrigin(this);
            positionPin(cat, true);
            if (PM.state.reducedMotion) { PM.openCategory(cat); render(); return; }
            setTimeout(function () { PM.openCategory(cat); render(); }, 230);
          });
        });
        document.querySelectorAll("[data-notice-target]").forEach(function (b) {
          b.addEventListener("click", function () {
            var t = this.getAttribute("data-notice-target");
            if (t.indexOf(".")>-1) PM.openCategory(t.split(".")[0], t.split(".")[1]); else PM.openCategory(t);
            render();
          });
        });
        PM.shared.wireThemePicker();
        PM.shared.wireRecentWork();
        PM.shared.wireOwnedStrip(document.querySelector("[data-stage]"));
        PM.shared.wireShell();
        // returning to the map keeps the last visited region marked
        positionPin(PM.state.activeCat || PM._atlasLastRegion);
      }

      /* ---------- WORKSPACE: focus + context ---------- */
      function workspace() {
        var cat = PM.catById(PM.state.activeCat);
        // minimap: all regions, current one expanded with subcategories
        var minimap = PM.categories.map(function (c) {
          var subs = c.id === PM.state.activeCat ? c.sub.map(function (s) {
            return '<button class="at-mm-sub' + (s.id===PM.state.activeSub?" active":"") + '" data-mm-sub="' + s.id + '" data-mm-cat="' + c.id + '">' + s.title + '</button>';
          }).join("") : "";
          return [
            '<button class="at-mm-region' + (c.id===PM.state.activeCat?" active":"") + '" data-mm-cat="' + c.id + '"><span class="at-mm-here"></span>' + c.title + '</button>',
            subs
          ].join("");
        }).join("");

        var focusDoc = cat.sub.map(function (s) {
          var body = s.manager ? PM.shared.managerPromo(s.manager) : PM.shared.subList(cat.id, s.id);
          var managerNote = s.manager ? '<a class="cr-sub-manage" data-sub-manager="' + s.manager + '" style="margin-left:auto;font-size:11px">Open ' + PM.managers[s.manager].title + ' ' + PM.svg("external",11) + '</a>' : "";
          return '<section class="at-sub-section" data-sub-section="' + s.id + '"><h3>' + s.title + managerNote + '</h3><div class="set-list">' + body + '</div></section>';
        }).join("");

        // viewport rail: subcategory list of current region + scroll indicator
        var vpSubs = cat.sub.map(function (s) {
          return '<button class="at-vp-sub' + (s.id===PM.state.activeSub?" active":"") + '" data-vp-sub="' + s.id + '">' + s.title + '</button>';
        }).join("");

        var stage = document.querySelector("[data-stage]");
        stage.innerHTML = [
          '<div class="at-workspace">',
            '<aside class="at-minimap">',
              '<div class="at-mm-label">Map</div>',
              minimap,
            '</aside>',
            '<div class="at-focus" data-scroller>',
              '<div class="at-backbar" style="position:sticky;top:0;z-index:5;background:var(--surface);margin:0 0 12px;display:flex;align-items:center;gap:10px">',
                '<button class="btn sm ghost" data-go-home>' + PM.svg("back",13) + 'Map</button>',
                '<span class="muted small">Settings · <b style="color:var(--ink)">' + cat.title + '</b></span>',
                '<span class="grow"></span>',
                PM.shared.exposureControl(),
              '</div>',
              '<div class="at-focus-inner">',
                '<h2>' + cat.title + '</h2>',
                '<p class="at-focus-purpose">' + cat.purpose + '</p>',
                focusDoc,
                PM.shared.proseField("Notes for this region", "I definately want to recieve seperate reports on this cuz the occured issue is thru the roof."),
              '</div>',
            '</div>',
            '<aside class="at-viewport-rail">',
              '<div class="at-mm-label">In view</div>',
              '<div class="at-viewport-track"><div class="at-viewport-thumb" id="vpThumb" style="top:0;height:20%"></div></div>',
              '<div class="at-vp-sublist">' + vpSubs + '</div>',
            '</aside>',
          '</div>'
        ].join("");
        wireWorkspace();
        PM.initScrollspy();
        setTimeout(function () { PM.initScrollspy(); }, 60);
      }

      function wireWorkspace() {
        document.querySelector("[data-go-home]").addEventListener("click", function () { PM.goHome(); render(); });
        document.querySelectorAll("[data-mm-cat]").forEach(function (b) {
          b.addEventListener("click", function () {
            var c = this.getAttribute("data-mm-cat");
            if (c !== PM.state.activeCat) { PM.openCategory(c); render(); }
          });
        });
        document.querySelectorAll("[data-mm-sub]").forEach(function (b) {
          b.addEventListener("click", function () {
            var cat = this.getAttribute("data-mm-cat"), sub = this.getAttribute("data-mm-sub");
            if (cat !== PM.state.activeCat) { PM.openCategory(cat, sub); render(); }
            else { PM.openSub(sub); render(); }
          });
        });
        document.querySelectorAll("[data-vp-sub]").forEach(function (b) {
          b.addEventListener("click", function () { PM.openSub(this.getAttribute("data-vp-sub")); render(); });
        });
        document.querySelectorAll("[data-sub-manager]").forEach(function (a) {
          a.addEventListener("click", function (e) { e.preventDefault(); PM.openManager(this.getAttribute("data-sub-manager")); render(); });
        });
        PM.shared.wireSettings(document.querySelector(".at-focus-inner"));
        var focusInner = document.querySelector(".at-focus-inner");
        PM.shared.wireExposureControl(document.querySelector(".at-workspace"));
        PM.shared.applyExposure(document.querySelector(".at-workspace"));
        PM.shared.wireProseFields(focusInner);
        PM.onScrollspy = function (subId) {
          document.querySelectorAll("[data-mm-sub],[data-vp-sub]").forEach(function (b) {
            b.classList.toggle("active", b.getAttribute("data-mm-sub") === subId || b.getAttribute("data-vp-sub") === subId);
          });
          // viewport thumb position
          var cat = PM.catById(PM.state.activeCat);
          var idx = cat.sub.findIndex(function (s) { return s.id === subId; });
          var thumb = document.getElementById("vpThumb");
          if (thumb && cat.sub.length) {
            var pct = (idx / cat.sub.length) * 100;
            thumb.style.top = pct + "%"; thumb.style.height = Math.max(12, 100/cat.sub.length) + "%";
          }
        };
        // viewport rail: click or drag the track to move the reading position
        var track = document.querySelector(".at-viewport-track");
        var scroller = document.querySelector("[data-scroller]");
        if (track && scroller) {
          var seek = function (e) {
            var r = track.getBoundingClientRect();
            var pct = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
            scroller.scrollTop = pct * (scroller.scrollHeight - scroller.clientHeight);
          };
          track.addEventListener("pointerdown", function (e) {
            e.preventDefault();
            track.classList.add("dragging");
            track.setPointerCapture && track.setPointerCapture(e.pointerId);
            seek(e);
            var move = function (ev) { seek(ev); };
            var up = function () {
              track.classList.remove("dragging");
              track.removeEventListener("pointermove", move);
              track.removeEventListener("pointerup", up);
              track.removeEventListener("pointercancel", up);
            };
            track.addEventListener("pointermove", move);
            track.addEventListener("pointerup", up);
            track.addEventListener("pointercancel", up);
          });
        }
        PM.shared.wireShell();
      }

      /* ---------- MANAGER ---------- */
      function manager() {
        var m = PM.managers[PM.state.activeManager];
        var stage = document.querySelector("[data-stage]");
        stage.innerHTML = [
          '<div class="at-manager" data-manager-id="' + m.id + '">',
            '<div class="at-backbar">',
              '<button class="btn sm ghost" data-go-home>' + PM.svg("back",13) + 'Map</button>',
              '<span class="muted small">Settings · <b style="color:var(--ink)">' + PM.catById(m.managerCat).title + '</b> · ' + m.title + '</span>',
            '</div>',
            '<div style="flex:1;min-height:0;overflow:hidden">' + PM.managers_lib.render(m.id) + '</div>',
          '</div>'
        ].join("");
        document.querySelector("[data-go-home]").addEventListener("click", function () { PM.goHome(); render(); });
        PM.managers_lib.wire(stage.querySelector(".mgr"));
        PM.shared.wireShell();
      }

      var _renderToken = 0;
      function render() {
        var crumb = document.querySelector("[data-crumb]");
        if (PM.state.view === "home" && crumb) crumb.innerHTML = "Settings map";
        else if (crumb) crumb.innerHTML = 'Settings · <b>' + (PM.state.activeManager ? PM.managers[PM.state.activeManager].title : (PM.catById(PM.state.activeCat)||{}).title) + '</b>';
        var token = ++_renderToken;
        function renderView() {
          if (token !== _renderToken) return;
          if (PM.state.view === "home") home();
          else if (PM.state.view === "manager") manager();
          else workspace();
        }
        // cartographic continuity: zoom settle into a region, plain crossfade back to the map
        var home_ = PM.state.view === "home";
        PM.shared.swapStage(renderView, { outDir: home_ ? "right" : "none", inDir: home_ ? "left" : "none", zoom: !home_ });
      }

      PM.render = render;
      PM._inboxRoute = function (t) {
        if (PM.managers[t]) { PM.openManager(t); } else { PM.openCategory(t.split(".")[0], t.split(".")[1]); }
        PM.render();
      };
      PM.init();
      PM.motion.install();
      shell();
      render();
    })();
  </script>
</body>
</html>
