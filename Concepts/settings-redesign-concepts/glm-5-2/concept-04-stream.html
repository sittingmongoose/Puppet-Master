<!doctype html>
<html lang="en" data-theme="friendly-dark" data-reduced-motion="0" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>04 Stream — GLM-5.2 Settings</title>
  <link rel="stylesheet" href="assets/themes.css">
  <link rel="stylesheet" href="assets/shell.css">
  <link rel="stylesheet" href="assets/managers.css">
  <style>
    /* ===== CONCEPT 04 STREAM — continuous navigable document ===== */
    .sr-stage { display: grid; grid-template-columns: 56px 1fr; height: 100%; min-height: 0; }

    /* landmark rail — named markers on a ruler, NOT pills */
    .sr-landmarks { border-right: 1px solid var(--line); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 4px; position: relative; }
    .sr-landmarks::before { content: ""; position: absolute; top: 14px; bottom: 14px; left: 50%; width: 2px; background: var(--line); transform: translateX(-50%); }
    .sr-landmark { position: relative; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 6px 0; cursor: pointer; background: transparent; border: none; color: var(--ink-3); z-index: 1; width: 100%; }
    .sr-landmark:hover { color: var(--ink); }
    .sr-landmark-tick { width: 12px; height: 12px; border-radius: 50%; background: var(--surface-3); border: 2px solid var(--line); transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
    .sr-landmark:hover .sr-landmark-tick { transform: scale(1.2); }
    .sr-landmark.active .sr-landmark-tick { background: var(--accent); border-color: var(--accent); }
    .sr-landmark-label { position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); background: var(--surface-elev); border: 1px solid var(--line); padding: 3px 8px; border-radius: var(--r-xs); font-size: 11px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity var(--t-fast) var(--ease); box-shadow: var(--sh-1); z-index: 10; }
    .sr-landmark:hover .sr-landmark-label, .sr-landmark.active .sr-landmark-label { opacity: 1; }

    /* the river */
    .sr-river { overflow: auto; padding: clamp(16px,3vw,40px) clamp(20px,4vw,60px); }
    .sr-river-inner { max-width: 880px; margin: 0 auto; }

    /* headwaters (home beat at the top of the river) */
    .sr-head { padding-bottom: 24px; border-bottom: 1px solid var(--line-2); margin-bottom: 24px; }
    .sr-eyebrow { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .sr-h1 { font-size: clamp(24px,3vw,36px); font-weight: 800; letter-spacing: -.025em; margin: 6px 0 6px; line-height: 1.1; }
    .sr-h1 .sr-thesis { color: var(--accent); }
    .sr-sub { color: var(--ink-2); max-width: 60ch; margin-bottom: 16px; }
    .sr-search { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 44px; background: var(--surface-elev); border: 1px solid var(--line); border-radius: var(--r-pill); max-width: 560px; transition: border-color var(--t-fast) var(--ease); }
    .sr-search:focus-within { border-color: var(--accent-line); }
    .sr-search input { flex: 1; background: transparent; border: none; outline: none; font-size: 14px; color: var(--ink); }
    .sr-results { position: relative; max-width: 560px; margin-top: 8px; }
    .sr-results-inner { background: var(--surface-elev); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh-3); max-height: 320px; overflow: auto; padding: 6px; }
    .sr-result { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; }
    .sr-result:hover { background: var(--surface-2); }
    .sr-result .sr-rkind { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); width: 74px; flex: none; }

    /* opening status beat — notices inline in the river */
    .sr-beat { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: 10px; margin: 16px 0; }
    .sr-notice { padding: 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
    .sr-notice.attention { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
    .sr-notice.continue { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
    .sr-notice.recommended { border-color: color-mix(in srgb, var(--info) 40%, var(--line)); }
    .sr-notice h3 { margin: 0 0 4px; font-size: 13px; }
    .sr-notice .muted { font-size: 11px; }
    .sr-notice-kind { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .sr-notice.attention .sr-notice-kind { color: var(--bad); }
    .sr-notice.continue .sr-notice-kind { color: var(--warn); }
    .sr-notice.recommended .sr-notice-kind { color: var(--info); }
    .sr-notice-actions { margin-top: 8px; }

    /* named sections (destinations) in the stream */
    .sr-section { padding: 22px 0; border-bottom: 1px solid var(--line-2); scroll-margin-top: 16px; }
    .sr-section:last-child { border-bottom: none; }
    .sr-section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .sr-section-icon { width: 34px; height: 34px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); border-radius: var(--r-sm); flex: none; }
    .sr-section h2 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
    .sr-section-purpose { color: var(--ink-2); font-size: 13px; margin-bottom: 14px; max-width: 70ch; }
    .sr-section-status { margin-left: auto; }
    /* channels (subsections / managers) as tabs within a section */
    .sr-channels { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
    .sr-channel { padding: 8px 12px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--ink-2); cursor: pointer; font-size: 13px; white-space: nowrap; }
    .sr-channel:hover { color: var(--ink); }
    .sr-channel.active { color: var(--accent); border-bottom-color: var(--accent); }
    .sr-sub-section { padding: 12px 0; scroll-margin-top: 16px; }
    .sr-sub-section + .sr-sub-section { border-top: 1px solid var(--line-2); }
    .sr-sub-section h3 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }

    /* config strip */
    .sr-config { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 12px 0; }

    /* manager rendered inside a channel */
    .sr-manager-host { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }

    /* scroll progress along the landmark rail */
    .sr-progress { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 2px; background: var(--accent); transition: height var(--t-fast) var(--ease); border-radius: 99px; z-index: 0; }

    /* motion: scroll-linked flow, gentle — nothing animates when calm */
    [data-reduced-motion="0"] .sr-section { opacity: 0; transform: translateY(6px); transition: opacity var(--t-slow) var(--ease-settle), transform var(--t-slow) var(--ease-settle); }
    [data-reduced-motion="0"] .sr-section.in-view { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .sr-section { opacity: 1 !important; transform: none !important; } }
    /* C2: landmark tick rides scroll position (tween, not snap) */
    [data-reduced-motion="0"] .sr-landmark-tick { transition: background var(--t-mid) var(--ease), transform var(--t-fast) var(--ease), border-color var(--t-mid) var(--ease); }
    [data-reduced-motion="0"] .sr-progress { transition: height var(--t-fast) linear; }
    /* C2: channel cross-fade */
    [data-reduced-motion="0"] [data-channel-body] { transition: opacity var(--t-mid) var(--ease); }

    @media (max-width: 760px) {
      .sr-landmarks { display: none; }
      .sr-stage { grid-template-columns: 1fr; }
      .sr-landmarks-mobile { display: flex !important; }
    }
    .sr-landmarks-mobile { display: none; }
  </style>
</head>
<body>
  <div class="pm-shell" data-rail="open" data-chat="closed"></div>
  <noscript>
    <div style="position:fixed;top:8px;right:12px;z-index:99;padding:3px 9px;border:1px solid #6fc6e8;color:#6fc6e8;border-radius:999px;font:bold 10px sans-serif">GLM-5.2</div>
  </noscript>
  <a data-concept-model="GLM-5.2" href="index.html" title="GLM-5.2 settings concept"
     style="position:fixed;bottom:var(--footer-h,30px);right:12px;z-index:40;display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--accent-line,#6fc6e8);background:var(--accent-soft,rgba(111,198,232,.14));color:var(--accent,#6fc6e8);border-radius:999px;font:bold 9px sans-serif;text-decoration:none;opacity:.85">GLM-5.2 · 04</a>

  <script src="assets/icons.svg.js"></script>
  <script src="assets/demo-data.js"></script>
  <script src="concept-hub-bridge.js"></script>
  <script src="assets/state.js"></script>
  <script src="assets/motion.js"></script>
  <script src="assets/shared.js"></script>
  <script src="assets/managers.js"></script>
  <script src="assets/spellcheck.js"></script>
  <script>
    (function () {
      "use strict";
      PM.jumpOffset = function () { return 60; };
      // Stream renders managers as channels within their section, so owned-strip cards
      // scroll to the owning section and switch to the manager's channel.
      PM.openOwnedManager = function (id) {
        var m = PM.managers[id]; if (!m) return;
        var sec = document.querySelector('[data-section="' + m.managerCat + '"]');
        if (!sec) return;
        var scroller = PM.scroller();
        if (scroller) scroller.scrollTo({ top: sec.offsetTop - 20, behavior: PM.state.reducedMotion ? "auto" : "smooth" });
        var ch = sec.querySelector('[data-channel-manager="' + id + '"]');
        if (ch) ch.click();
      };

      function shell() {
        var s = document.querySelector(".pm-shell");
        s.innerHTML =
          PM.shared.topbar('<span data-crumb>Settings stream</span>', "04 Stream") +
          '<nav class="pm-activity" aria-label="Surrounding navigation">' + PM.shared.activityButtons(PM.state.rail) + '</nav>' +
          PM.shared.rail() +
          '<main class="pm-stage" data-stage></main>' +
          PM.shared.chat() +
          PM.shared.footer();
        PM.shared.wireShell();
      }

      function sectionIcon(catId) {
        return ({ general:"home", appearance:"theme", agents:"pam", permissions:"shield", code:"code",
          context:"brain", planning:"compass", git:"history", extensions:"mcp", media:"media", system:"server" })[catId] || "grid";
      }

      function home() {
        // landmark rail = one marker per category
        var landmarks = PM.categories.map(function (c, i) {
          return '<button class="sr-landmark" data-landmark="' + c.id + '"><span class="sr-landmark-tick"></span><span class="sr-landmark-label">' + c.title + '</span></button>';
        }).join("");

        // notices beat
        var beat = [];
        ["attention","continue","recommended"].forEach(function (kind) {
          PM_DEMO.notices[kind].forEach(function (n) {
            var kindLabel = { attention:"Needs attention", continue:"Continue setup", recommended:"Recommended" }[kind];
            beat.push('<div class="sr-notice ' + kind + '"><span class="sr-notice-kind">' + kindLabel + '</span><h3>' + n.headline + '</h3><span class="muted">' + n.consequence + '</span><div class="sr-notice-actions"><button class="btn sm primary" data-notice-target="' + n.target + '">' + n.action + '</button></div></div>');
          });
        });

        // sections — every category as a named section in the river (packet: every domain discoverable).
        // Destination status is used where one exists; others get a neutral section count.
        var sections = PM.categories.map(function (cat) {
          var d = PM_DEMO.destinations.find(function (dd) { return dd.target === cat.id || dd.target.indexOf(cat.id + ".") === 0; });
          // channels = subcategories (manager subcategories get a manager channel)
          var channels = cat.sub.map(function (s, i) {
            return '<button class="sr-channel' + (i===0?" active":"") + '" data-channel="' + s.id + '"' + (s.manager?' data-channel-manager="' + s.manager + '"':'') + '>' + s.title + '</button>';
          }).join("");
          // first subcategory content shown by default
          var firstSub = cat.sub[0];
          var body = channelBody(cat, firstSub);
          var statusText = d ? d.status : (cat.sub.length + ' sections');
          var statusKind = d ? d.statusKind : 'neutral';
          var statusChip = '<span class="chip ' + (statusKind!=="neutral"?statusKind:"") + '">' + statusText + '</span>';
          return [
            '<section class="sr-section" data-section="' + cat.id + '"' + (d?' data-dest="' + d.id + '"':'') + '>',
              '<div class="sr-section-head">',
                '<span class="sr-section-icon">' + PM.svg(sectionIcon(cat.id), 18) + '</span>',
                '<div><h2>' + cat.title + '</h2></div>',
                '<div class="sr-section-status">' + statusChip + '</div>',
              '</div>',
              '<p class="sr-section-purpose">' + cat.purpose + '</p>',
              '<div class="sr-channels">' + channels + '</div>',
              '<div class="sr-channel-body" data-channel-body>' + body + '</div>',
            '</section>'
          ].join("");
        }).join("");

        var stage = document.querySelector("[data-stage]");
        stage.innerHTML = [
          '<div class="sr-stage">',
            '<aside class="sr-landmarks" id="srLandmarks">',
              '<div class="sr-progress" id="srProgress" style="height:0"></div>',
              landmarks,
            '</aside>',
            '<div class="sr-river" data-scroller>',
              '<div class="sr-river-inner">',
                '<div class="sr-head">',
                  '<div class="sr-eyebrow">Concept 04 · Stream · GLM-5.2</div>',
                  '<h1 class="sr-h1">Settings as a <span class="sr-thesis">river to read.</span></h1>',
                  '<p class="sr-sub">One continuous stream. Landmark markers track your place; search jumps the river; managers are channels within their section.</p>',
                  '<div class="sr-search"><span class="muted">' + PM.svg("search",16) + '</span><input type="search" placeholder="Search the stream…" data-search-input aria-label="Search settings"><span class="muted small">⌘K</span></div>',
                  '<div class="sr-results hidden" data-results><div class="sr-results-inner"></div></div>',
                  '<div class="sr-config">' + PM.shared.themePicker() + '</div>',
                '</div>',
                PM.shared.recentWork(),
                PM.shared.ownedStrip("c4"),
                '<div class="sr-beat">' + beat.join("") + '</div>',
                sections,
              '</div>',
            '</div>',
          '</div>'
        ].join("");
        wireHome();
        initRiverScroll();
      }

      function channelBody(cat, sub) {
        if (sub.manager) {
          // render the manager inline as a channel
          return '<div class="sr-manager-host" data-manager-host="' + sub.manager + '"><div data-manager-id="' + sub.manager + '">' + PM.managers_lib.render(sub.manager) + '</div></div>';
        }
        var rows = PM.shared.subList(cat.id, sub.id);
        return '<div class="row between" style="margin-bottom:8px">' + PM.shared.exposureControl() + '</div>' +
          '<section class="sr-sub-section" data-sub-section="' + sub.id + '"><div class="set-list">' + rows + '</div></section>' +
          PM.shared.proseField("Notes for this channel", "I definately want to recieve seperate reports on this cuz the occured issue is thru the roof.");
      }

      function wireHome() {
        // search
        var inp = document.querySelector("[data-search-input]");
        var res = document.querySelector("[data-results]");
        var resInner = res.querySelector(".sr-results-inner");
        inp.addEventListener("input", function () {
          var results = PM.runSearch(this.value);
          if (!this.value.trim() || !results.length) { res.classList.add("hidden"); return; }
          res.classList.remove("hidden");
          resInner.innerHTML = results.map(function (r) {
            var km = PM.shared.searchKindMeta(r.kind);
            var target = r.manager ? 'data-r-manager="' + r.manager + '"' : 'data-r-cat="' + r.cat + '" data-r-sub="' + (r.sub||"") + '"';
            return '<div class="sr-result" ' + target + '><span class="sr-rkind ' + km.cls + '">' + km.label + '</span><div class="col"><strong>' + r.label + '</strong><span class="muted small"> ' + (r.expl||"").slice(0,46) + '</span></div></div>';
          }).join("");
        });
        resInner.addEventListener("click", function (e) {
          var r = e.target.closest(".sr-result"); if (!r) return;
          inp.value = ""; res.classList.add("hidden");
          var mgr = r.getAttribute("data-r-manager");
          var cat = r.getAttribute("data-r-cat"), sub = r.getAttribute("data-r-sub");
          // scroll to the section, then switch to channel
          var sec = document.querySelector('[data-section="' + cat + '"]');
          if (sec) {
            PM.focusSub(cat + "__section", { jump: true });
            var scroller = PM.scroller();
            scroller && scroller.scrollTo({ top: sec.offsetTop - 20, behavior: PM.state.reducedMotion ? "auto" : "smooth" });
            // switch channel
            if (sub) {
              var chBtn = sec.querySelector('[data-channel="' + sub + '"]');
              if (chBtn) chBtn.click();
            }
            // if it's a setting, focus-flash its row after jump
            setTimeout(function () {
              if (sub) {
                var row = sec.querySelector('[data-setting-row$=".' + sub + '"]') || sec.querySelector('[data-sub-section="' + sub + '"]');
                if (row) { row.classList.add("focus-flash"); }
              }
            }, 400);
          }
        });
        // landmarks → scroll to section
        document.querySelectorAll("[data-landmark]").forEach(function (b) {
          b.addEventListener("click", function () {
            var id = this.getAttribute("data-landmark");
            var sec = document.querySelector('[data-section="' + id + '"]');
            if (sec) {
              var scroller = PM.scroller();
              scroller && scroller.scrollTo({ top: sec.offsetTop - 20, behavior: PM.state.reducedMotion ? "auto" : "smooth" });
            }
          });
        });
        // channel switching (B2: clear pending timeouts on outgoing manager; C2: cross-fade)
        document.querySelectorAll("[data-channel]").forEach(function (b) {
          b.addEventListener("click", function () {
            var sec = this.closest(".sr-section");
            var cat = sec.getAttribute("data-section");
            var subId = this.getAttribute("data-channel");
            var manager = this.getAttribute("data-channel-manager");
            sec.querySelectorAll(".sr-channel").forEach(function (c) { c.classList.remove("active"); });
            this.classList.add("active");
            var sub = PM.catById(cat).sub.find(function (s) { return s.id === subId; });
            var bodyHost = sec.querySelector("[data-channel-body]");
            // B2: cancel any pending refresh-overlay timeout on the outgoing manager
            var oldMgr = bodyHost.querySelector("[data-manager-host] .mgr");
            if (oldMgr && oldMgr.dataset.pmTimer) { clearTimeout(Number(oldMgr.dataset.pmTimer)); }
            bodyHost.querySelectorAll(".refresh-overlay").forEach(function (o) { o.remove(); });
            // C2 motion: cross-fade the channel body
            PM.motion.crossFade(bodyHost, function () {
              bodyHost.innerHTML = channelBody(PM.catById(cat), sub);
              if (manager) {
                var host = bodyHost.querySelector('[data-manager-host="' + manager + '"]');
                if (host) PM.managers_lib.wire(host.querySelector(".mgr"));
              } else {
                PM.shared.wireSettings(bodyHost);
                PM.shared.wireProseFields(bodyHost);
              }
            });
          });
        });
        // notices
        document.querySelectorAll("[data-notice-target]").forEach(function (b) {
          b.addEventListener("click", function () {
            var t = this.getAttribute("data-notice-target");
            var cat = t.split(".")[0];
            var sec = document.querySelector('[data-section="' + cat + '"]');
            if (sec) {
              var scroller = PM.scroller();
              scroller && scroller.scrollTo({ top: sec.offsetTop - 20, behavior: PM.state.reducedMotion?"auto":"smooth" });
            }
          });
        });
        PM.shared.wireThemePicker();
        PM.shared.wireRecentWork();
        PM.shared.wireOwnedStrip(document.querySelector("[data-stage]"));
        PM.shared.wireShell();
      }

      /* river scroll: update active landmark + progress + in-view reveals */
      function initRiverScroll() {
        var scroller = PM.scroller();
        if (!scroller) return;
        var sections = Array.prototype.slice.call(scroller.querySelectorAll("[data-section]"));
        var landmarks = Array.prototype.slice.call(document.querySelectorAll("[data-landmark]"));
        var progress = document.getElementById("srProgress");
        function update() {
          var st = scroller.scrollTop;
          var sh = scroller.scrollHeight - scroller.clientHeight;
          if (progress && sh > 0) progress.style.height = Math.max(0, Math.min(1, st/sh)) * 100 + "%";
          // active landmark = last section whose top is above the activation line
          var active = sections[0] && sections[0].getAttribute("data-section");
          sections.forEach(function (s) {
            if (s.getBoundingClientRect().top - scroller.getBoundingClientRect().top < 120) active = s.getAttribute("data-section");
            // in-view reveal
            var r = s.getBoundingClientRect();
            if (r.top < window.innerHeight * 0.85 && r.bottom > 60) s.classList.add("in-view");
          });
          landmarks.forEach(function (l) { l.classList.toggle("active", l.getAttribute("data-landmark") === active); });
        }
        scroller.addEventListener("scroll", update, { passive: true });
        update();
      }

      PM.render = home;
      PM.init();
      PM.motion.install();
      shell();
      home();
    })();
  </script>
</body>
</html>
