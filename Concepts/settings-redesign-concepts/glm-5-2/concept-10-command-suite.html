<!doctype html>
<html lang="en" data-theme="glass-dark" data-reduced-motion="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>10 Rethemed Command Suite — GLM-5.2 Settings</title>
<link rel="stylesheet" href="assets/themes.css">
<link rel="stylesheet" href="assets/shell.css">
<link rel="stylesheet" href="assets/v2/pm-std.css">

<script src="assets/v2/pm-inventory.js"></script>
<script src="assets/v2/pm-data.js"></script>
<script src="assets/v2/pm-managers.js"></script>
<script src="assets/v2/pm-search.js"></script>

<style>
/* ===== CONCEPT 10 — RETHEMED COMMAND SUITE (GLM-5.2) =====
   Layout borrowed from the Command Suite reference: command-index navigation,
   keyboard-first movement, multi-pane left-to-right drill-down, compact legible
   tables, direct path/status visibility, editor beside context, transactional copy.
   Fully rethemed to Puppet Master: no fake terminal, no green-on-black, no CRT,
   no monospace body copy — normal human language on PM theme tokens. */
.m10 { height: 100%; display: flex; min-width: 0; }
/* command index pane */
.m10-index { width: 300px; flex: none; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; }
.m10-index-head { padding: 12px 12px 8px; }
.m10-cmdinput { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-elev); }
.m10-cmdinput:focus-within { border-color: var(--accent-line); }
.m10-cmdinput input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--ink); font-size: 13px; }
.m10-hint { display: flex; gap: 10px; padding: 7px 2px 0; font-size: 10.5px; color: var(--ink-4); }
.m10-index-list { flex: 1; overflow: auto; padding: 4px 8px 12px; }
.m10-idx-group { padding: 10px 8px 4px; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.m10-idx-item { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 7px 9px; border-radius: var(--r-xs); border: none; background: none; color: var(--ink-2); font: inherit; font-size: 12.5px; cursor: pointer; }
.m10-idx-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m10-idx-item .ct { font-size: 10px; color: var(--ink-4); }
.m10-idx-item:hover, .m10-idx-item[data-v2focus="1"] { background: var(--surface-2); color: var(--ink); }
.m10-idx-item[aria-selected="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
/* main area */
.m10-main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
.m10-pathbar { display: flex; align-items: center; gap: 8px; padding: 9px clamp(12px, 2vw, 24px); border-bottom: 1px solid var(--line); background: var(--surface); font-size: 12px; color: var(--ink-3); min-height: 38px; }
.m10-pathbar b { color: var(--ink); font-weight: 650; }
.m10-pathbar .sp { flex: 1; }
.m10-panes { flex: 1; min-height: 0; display: flex; }
.m10-pane { min-width: 0; overflow: auto; }
.m10-pane.p1 { flex: 1.1; border-right: 1px solid var(--line); }
.m10-pane.p2 { flex: 1.4; border-right: 1px solid var(--line); }
.m10-pane.p3 { flex: 1.5; }
.m10-pane-head { position: sticky; top: 0; z-index: 2; background: var(--surface); padding: 10px clamp(12px, 1.6vw, 20px) 8px; border-bottom: 1px solid var(--line); font-size: 13.5px; font-weight: 750; display: flex; align-items: center; gap: 8px; }
.m10-pane-head .sub { font-size: 11px; color: var(--ink-3); font-weight: 600; }
.m10-pane-body { padding: 10px clamp(12px, 1.6vw, 20px) 40px; }
/* compact legible table */
.m10-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.m10-table th { position: sticky; top: 0; text-align: left; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); padding: 6px 8px; border-bottom: 1px solid var(--line-2); background: var(--bg); }
.m10-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.m10-table tr { cursor: pointer; }
.m10-table tbody tr:hover { background: var(--surface); }
.m10-table tr[aria-selected="true"] { background: var(--surface-2); }
.m10-table td.mut { color: var(--ink-2); }
.m10-table td .lbl { font-weight: 650; color: var(--ink); }
.m10-table td .ds { font-size: 11px; color: var(--ink-3); max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m10-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 650; white-space: nowrap; }
/* home content inside pane1 */
.m10-hero { padding: 18px clamp(12px, 1.8vw, 24px) 8px; }
.m10-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); }
.m10-eyebrow b { color: var(--accent); }
.m10-h1 { font-size: clamp(22px, 2.6vw, 30px); font-weight: 800; letter-spacing: -.02em; margin: 4px 0 4px; }
.m10-sub { font-size: 13px; color: var(--ink-2); margin-bottom: 14px; max-width: 56ch; }
.m10-searchwrap { position: relative; margin: 0 clamp(12px, 1.8vw, 24px) 12px; }
.m10-search { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; background: var(--surface-elev); border: 1px solid var(--line); border-radius: var(--r-sm); box-shadow: var(--sh-1); }
.m10-search:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.m10-search input { flex: 1; min-width: 0; background: none; border: none; outline: none; font-size: 15px; color: var(--ink); }
.m10-drop { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; background: var(--surface-elev); border: 1px solid var(--line-2); border-radius: var(--r-sm); box-shadow: var(--sh-3); max-height: 340px; overflow: auto; padding: 4px; }
.m10-res { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: var(--r-xs); cursor: pointer; }
.m10-res:hover, .m10-res[aria-selected="true"] { background: var(--surface-2); }
.m10-res .k { flex: none; width: 78px; font-size: 9.5px; font-weight: 800; text-transform: uppercase; color: var(--ink-4); }
.m10-res .lbl { font-size: 12.5px; font-weight: 650; }
.m10-res .path { font-size: 10.5px; color: var(--ink-3); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m10-res .why { font-size: 10px; color: var(--warn); }
.m10-drop-empty { padding: 14px; text-align: center; font-size: 12px; color: var(--ink-2); }
.m10-note { display: flex; gap: 9px; align-items: center; margin: 0 clamp(12px, 1.8vw, 24px) 10px; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--warn) 38%, var(--line)); border-radius: var(--r-xs); background: color-mix(in srgb, var(--warn-soft) 40%, var(--surface)); font-size: 12px; }
.m10-note button { margin-left: auto; }
.m10-att { margin: 0 clamp(12px, 1.8vw, 24px) 12px; border: 1px solid var(--line); border-radius: var(--r-xs); overflow: hidden; }
.m10-att-row { display: flex; align-items: center; gap: 8px; padding: 7px 11px; font-size: 12px; border-bottom: 1px solid var(--line); }
.m10-att-row:last-child { border-bottom: none; }
.m10-att-row .d { color: var(--ink-3); font-size: 11px; }
.m10-att-row button { margin-left: auto; }
/* editor rows in pane3 */
.m10-setrow { display: flex; gap: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); margin-bottom: 8px; }
.m10-setrow .info { flex: 1; min-width: 0; }
.m10-setrow .lbl { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.m10-setrow .desc { font-size: 12px; color: var(--ink-2); line-height: 1.55; margin-top: 3px; max-width: 60ch; }
.m10-setrow .ctl { flex: none; width: 200px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.m10-setrow[data-status="managed"] .ctl { opacity: .55; }
.m10-setrow[data-status="unavailable"] { opacity: .62; }
.m10-switch { position: relative; width: 40px; height: 22px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line); cursor: pointer; flex: none; }
.m10-switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.m10-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface-elev); transition: transform var(--t-fast) var(--ease); }
.m10-switch[aria-checked="true"]::after { transform: translateX(18px); }
.m10-sel { height: 30px; padding: 0 9px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-xs); color: var(--ink); font: inherit; font-size: 12px; max-width: 100%; }
.m10-range { width: 100%; accent-color: var(--accent); }
.m10-err { font-size: 11px; color: var(--bad); }
.m10-why button { font-size: 11.5px; color: var(--ink-4); background: none; border: none; cursor: pointer; font-weight: 650; padding: 0; }
.m10-details { margin-top: 7px; padding: 9px 11px; border: 1px dashed var(--line-2); border-radius: var(--r-xs); font-size: 11.5px; color: var(--ink-2); line-height: 1.6; }
.m10-details b { color: var(--ink); }
.m10-kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; font-size: 12.5px; margin-bottom: 12px; }
.m10-kv .k { color: var(--ink-3); font-weight: 650; }
.m10-kv .v { color: var(--ink); line-height: 1.5; overflow-wrap: anywhere; }
.m10-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.m10-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.m10-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-xs); background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 650; cursor: pointer; }
.m10-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.m10-offline { display: flex; gap: 9px; padding: 10px 12px; margin: 8px 0; border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); border-radius: var(--r-xs); background: color-mix(in srgb, var(--warn-soft) 45%, var(--surface)); font-size: 12px; }
.m10-work { border: 1px solid var(--line); border-radius: var(--r-xs); padding: 11px 13px; margin: 8px 0; font-size: 12px; }
.m10-work .bar { height: 5px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin-top: 7px; }
.m10-work .bar > div { height: 100%; background: var(--accent); transition: width var(--t-mid) var(--ease); }
.m10-setup { border: 1px solid var(--line-2); border-radius: var(--r-xs); padding: 12px 14px; margin: 8px 0; }
.m10-setup ol { margin: 4px 0 0; padding-left: 18px; font-size: 11.5px; color: var(--ink-2); line-height: 1.7; }
.m10-skel { border-radius: var(--r-xs); background: var(--surface-2); animation: v2-shimmer 1.4s ease-in-out infinite; }
.m10-empty { padding: 26px 16px; text-align: center; color: var(--ink-3); font-size: 12.5px; }
/* drawer + copy */
.m10-drawer { position: absolute; right: 0; top: 0; bottom: 0; width: min(420px, 92%); z-index: 45; background: var(--surface-elev); border-left: 1px solid var(--line-2); transform: translateX(102%); transition: transform var(--t-mid) var(--ease); display: flex; flex-direction: column; }
.m10-drawer[data-open="1"] { transform: none; box-shadow: var(--sh-3); }
.m10-drawer-head { display: flex; align-items: center; gap: 8px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
.m10-drawer-head h4 { margin: 0; font-size: 14px; flex: 1; }
.m10-drawer-body { flex: 1; overflow: auto; padding: 13px 15px; font-size: 12.5px; line-height: 1.65; color: var(--ink-2); }
.m10-drawer-body b { color: var(--ink); }
.m10-veil { position: absolute; inset: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 58%, transparent); display: grid; place-items: center; padding: 16px; }
.m10-copy { width: min(880px, 100%); max-height: calc(100% - 14px); display: flex; flex-direction: column; background: var(--surface-elev); border: 1px solid var(--line-2); border-radius: var(--r-lg); overflow: hidden; }
.m10-copy-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.m10-copy-head h3 { margin: 0; font-size: 15.5px; font-weight: 800; flex: 1; }
.m10-copy-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; }
.m10-copy-foot { display: flex; gap: 8px; padding: 11px 16px; border-top: 1px solid var(--line); }
.m10-copy-foot .sp { flex: 1; }
.m10-step { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.m10-srcgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-bottom: 10px; }
.m10-src { padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); cursor: pointer; background: var(--surface); }
.m10-src[aria-selected="true"] { border-color: var(--accent-line); background: var(--surface-2); }
.m10-catgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.m10-cat { display: grid; grid-template-columns: 17px 1fr; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); cursor: pointer; background: var(--surface); }
.m10-cat[aria-selected="true"] { border-color: var(--accent-line); background: var(--surface-2); }
.m10-counts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.m10-count { padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-xs); font-size: 11px; color: var(--ink-3); }
.m10-count b { font-size: 15px; color: var(--ink); margin-right: 4px; }
.m10-cplist { border: 1px solid var(--line); border-radius: var(--r-xs); height: 210px; overflow: auto; }
.m10-receipt { border: 1px solid color-mix(in srgb, var(--ok) 40%, var(--line)); background: color-mix(in srgb, var(--ok-soft) 38%, var(--surface)); border-radius: var(--r-xs); padding: 12px; font-size: 12.5px; }
/* topbar */
.m10-proj { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.m10-proj b { color: var(--ink); }
@media (max-width: 1099px) { .m10-index { width: 240px; } .m10-panes { flex-direction: column; overflow: auto; } .m10-pane { flex: none !important; border-right: none !important; border-bottom: 1px solid var(--line); min-height: 200px; } .m10-setrow { flex-direction: column; } .m10-setrow .ctl { width: 100%; align-items: flex-start; } .m10-catgrid { grid-template-columns: 1fr; } }
@media (max-width: 899px) {
  .pm-shell { grid-template-columns: 60px 1fr var(--chat-w, 0px); grid-template-areas: "topbar topbar topbar" "activity stage chat" "footer footer footer"; }
  .m10 { flex-direction: column; }
  .m10-index { width: auto; flex: none; max-height: 34%; border-right: none; border-bottom: 1px solid var(--line); }
}
@media (min-width: 1900px) { .m10-index { width: 340px; } }

/* ===== squeeze: 760px topbar survival (added by verification pass) ===== */
@media (max-width: 899px) {
  .pm-topbar .pm-brand { display: none; }
  .pm-topbar { gap: 6px; }
  #themeBtn, #closeBtn, #navToggle { font-size: 0; gap: 0; padding: 0 9px; }
  #themeBtn svg, #closeBtn svg, #navToggle svg { margin-right: 0; }
  #projChip, .d5-projchip, .e6-proj, .c7-proj, .t8-proj, .n9-proj, .m10-proj, .o11-proj { max-width: 130px; overflow: hidden; white-space: nowrap; }
  .d5-mini-search, .e6-minis, .c7-minis, .t8-minis, .n9-minis, .m10-cmdinput, .o11-search { min-width: 90px !important; }
}
</style>
</head>
<body>
<div class="pm-shell" id="shell" data-rail="closed" data-chat="closed">
  <header class="pm-topbar">
    <span class="pm-brand">PUPPET&nbsp;MASTER</span>
    <span class="pm-crumb" id="pathTop"><b>Settings</b></span>
    <span class="pm-spacer"></span>
    <span class="m10-proj" id="projChip"></span>
    <button class="m10-btn" id="themeBtn"></button>
    <button class="m10-btn" id="closeBtn"></button>
  </header>
  <nav class="pm-activity" aria-label="Activity Bar" id="activity"></nav>
  <aside class="pm-rail" data-hidden></aside>
  <main class="pm-stage" id="stage" style="position:relative;">
    <a data-concept-model="GLM-5.2" href="index.html" title="GLM-5.2 settings concept" style="position:absolute;opacity:0;pointer-events:none;" aria-hidden="true">GLM-5.2</a>
    <div class="m10" id="app">
      <aside class="m10-index v2-surface">
        <div class="m10-index-head">
          <div class="m10-cmdinput"><span id="idxIcon"></span><input id="idxFilter" type="search" placeholder="Go to… (domains, pages, managers)" aria-label="Command index filter" autocomplete="off"></div>
          <div class="m10-hint"><span><span class="v2kbd">↑</span><span class="v2kbd">↓</span> move</span><span><span class="v2kbd">↵</span> open</span><span><span class="v2kbd">esc</span> back</span></div>
        </div>
        <div class="m10-index-list v2-surface" id="idxList" role="listbox"></div>
      </aside>
      <div class="m10-main">
        <div class="m10-pathbar" id="pathbar"></div>
        <div class="m10-panes" id="panes"></div>
      </div>
    </div>
    <div class="m10-drawer v2-surface" id="drawer" data-open="0"><div class="m10-drawer-head"><h4 id="drawerTitle">Details</h4><button class="m10-btn" id="drawerClose"></button></div><div class="m10-drawer-body" id="drawerBody"></div></div>
    <div id="menuHost"></div>
  </main>
  <aside class="pm-chat" data-hidden></aside>
  <footer class="pm-footer" id="footer"></footer>
</div>
<script>
(function () {
  "use strict";
  var PM2 = window.PM2, STORE = new PM2.Store("c10");
  var NS = "concept-10-command-suite";
  var el = function (id) { return document.getElementById(id); };
  var app = el("app"), stage = el("stage");
  var NAV = new PM2.routes.Nav({ domain: null });
  var QP = new URLSearchParams(location.search);
  if (QP.get("theme")) document.documentElement.setAttribute("data-theme", QP.get("theme"));
  if (QP.get("reduced") === "1") document.documentElement.setAttribute("data-reduced-motion", "1");
  var ICONS = { general: "settings", ai: "pam", safety: "shield", code: "code", memory: "memory", planning: "compass", branching: "crew", media: "map", web: "search", personas: "users", extensions: "stack", system: "grid" };
  function esc(x) { return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  el("projChip").innerHTML = '<span class="sdot ok"></span><b>' + PM2.currentProject.name + "</b> · current project";
  el("closeBtn").innerHTML = PM2.svg("close", 13) + "Close";
  el("idxIcon").innerHTML = PM2.svg("search", 13);
  el("themeBtn").innerHTML = PM2.svg("settings", 13) + "Glass Dark";
  el("drawerClose").innerHTML = PM2.svg("close", 12) + "Close";
  el("activity").innerHTML = ["home", "settings", "terminal", "stack", "users", "search"].map(function (i) { return '<button class="pm-act" aria-label="' + i + '">' + PM2.svg(i, 18) + "</button>"; }).join("");
  el("footer").innerHTML = "<span><b>Settings</b> · " + NS + "</span><span class='pm-spacer'></span><span>828 settings · 12 domains</span>";

  var menu = null;
  function openMenu(anchor, items, onPick) {
    closeMenu();
    var m = document.createElement("div"); m.className = "v2menu";
    m.innerHTML = items.map(function (it, i) { return it.sep ? '<div class="v2menu-sep"></div>' : '<button class="v2menu-item" data-i="' + i + '">' + (it.icon ? PM2.svg(it.icon, 14) : "") + '<span class="v2menu-label">' + it.label + "</span></button>"; }).join("");
    el("menuHost").appendChild(m);
    var r = anchor.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    var top = r.bottom - sr.top + 6, left = Math.min(Math.max(0, r.left - sr.left), sr.width - 230);
    if (r.bottom + 280 > window.innerHeight) top = Math.max(4, r.top - sr.top - 280);
    m.style.top = top + "px"; m.style.left = left + "px";
    m.addEventListener("click", function (e) { var b = e.target.closest(".v2menu-item"); if (!b) return; closeMenu(); onPick(items[+b.dataset.i]); });
    menu = m;
  }
  function closeMenu() { if (menu) { menu.remove(); menu = null; return true; } return false; }
  document.addEventListener("click", function (e) { if (menu && !menu.contains(e.target)) closeMenu(); }, true);
  el("themeBtn").addEventListener("click", function () {
    var themes = PM2.mgrById["mgr.appearance"].themes;
    openMenu(el("themeBtn"), themes.map(function (t) { return { label: t }; }).concat([{ sep: 1 }, { label: "Reduced motion: " + (RM() ? "on" : "off") }]), function (it) {
      if (it.label.indexOf("Reduced") === 0) { document.documentElement.setAttribute("data-reduced-motion", RM() ? "0" : "1"); return; }
      document.documentElement.setAttribute("data-theme", it.label);
      document.documentElement.style.colorScheme = /-dark$/.test(it.label) ? "dark" : "light";
      el("themeBtn").innerHTML = PM2.svg("settings", 13) + it.label;
    });
  });
  function RM() { return document.documentElement.getAttribute("data-reduced-motion") === "1"; }
  el("closeBtn").addEventListener("click", goHome);

      list.append(pad2, win2);
      function draw2() {
        var w = PM2.window({ scrollTop: list.scrollTop, viewportHeight: 210, rowHeight: RH, total: rows.length });
        pad2.style.height = (w.padTop + w.count * RH + w.padBottom) + "px"; win2.style.transform = "translateY(" + w.padTop + "px)";
        var h = "";
        for (var i = w.first; i < w.first + w.count; i++) {
          var rr = rows[i]; if (!rr) break;
          var s = PM2.inventory.byId[rr.settingId];
          h += '<div style="height:' + RH + 'px;display:flex;align-items:center;gap:8px;font-size:11.5px;border-bottom:1px solid var(--line)"><span class="v2badge ' + (rr.kind === "additions" ? "ok" : rr.kind === "replacements" ? "info" : rr.kind === "conflicts" ? "warn" : rr.kind === "unavailable" ? "bad" : "") + '">' + rr.kind.replace(/s$/, "") + '</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(s ? s.label : rr.settingId) + "</span></div>";
        }
        win2.innerHTML = h;
      }
      draw2(); list.addEventListener("scroll", draw2);
      f.innerHTML = '<button class="m10-btn" id="copyBack">Back</button><span class="sp"></span><button class="m10-btn primary" id="copyGo">Restore point & apply</button>';
      el("copyBack").addEventListener("click", function () { COPY.step = 1; drawCopy(); });
      el("copyGo").addEventListener("click", function () {
        COPY.step = 3;
        b.innerHTML = '<div class="m10-step">4 of 4 · Applying atomically…</div><div class="m10-work" id="cw"></div>'; f.innerHTML = "";
        var box = el("cw");
        var w = STORE.work({ kind: "copy", label: "Copy settings", phases: ["restore point", "apply", "verify"], steps: 10, fast: true });
        var un = STORE.subscribe("work", function () {
          box.innerHTML = "<b>" + esc(w.label) + "</b> — " + esc(w.note) + '<div class="bar"><div style="width:' + ((w.phaseI + 1) / 3 * 100) + '%"></div></div>';
          if (w.state === "done") {
            un();
            COPY.result = STORE.applyCopy(COPY.preview, COPY.cats);
            b.innerHTML = '<div class="m10-step">Done — verified & receipted</div><div class="m10-receipt"><b>' + COPY.result.counts.applied + " values copied</b> · " + COPY.result.counts.skipped + " skipped. Receipt <b>" + esc(COPY.result.receipt.id) + "</b> · restore point <b>" + esc(COPY.result.restorePoint.label) + "</b>.<br>" + COPY.result.verify.note + "</div>" +
              '<div class="m10-offline" style="border-color:var(--line);margin-top:8px"><span class="sdot ok"></span><b>' + esc(PM2.currentProject.name) + "</b> and <b>" + esc(COPY.preview.source.name) + "</b> are independent from here on.</div>";
            f.innerHTML = '<button class="m10-btn" id="copyRoll">Rollback</button><span class="sp"></span><button class="m10-btn primary" id="copyDone">Done</button>';
            el("copyRoll").addEventListener("click", function () { STORE.rollback(COPY.result.restorePoint.id); openDrawer("Rollback complete", "Restored to the pre-copy restore point. Receipt recorded."); copyClose(); });
            el("copyDone").addEventListener("click", copyClose);
          }
        });
      });
    }
  }

  /* boot */
  var initial = PM2.routes.parse(location.hash);
  if (initial.domain || initial.manager || initial.mode) NAV.stack = [Object.assign({ domain: null }, initial)];
  render(NAV.top());
  if (initial.row || initial.object || initial.query) land(PM2.routes.planFor(initial), PM2.search.byRid(initial.resultId || "") || null);
  window.__C10 = { PM2: PM2, STORE: STORE, NAV: NAV, state: state, pickResult: pickResult };
})();
</script>
