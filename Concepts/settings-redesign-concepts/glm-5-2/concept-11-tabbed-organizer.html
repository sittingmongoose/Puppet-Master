<style>
/* ===== CONCEPT 11 — RETHEMED TABBED ORGANIZER (GLM-5.2) =====
   Layout borrowed from the Tabbed Organizer reference: category tabs like a
   well-organized file system, layered sheets that preserve location, compact Home
   categories + recent changes, related-manager strip, roster + detail tabs, nested
   deep-link stack, copy categories + source in adjacent panes. Fully rethemed to
   Puppet Master: no paper, binder, folders-as-skeuomorph, staples, or office skin. */
.o11 { height: 100%; display: flex; flex-direction: column; min-width: 0; }
/* category tab strip */
.o11-tabs { display: flex; gap: 2px; padding: 8px clamp(10px, 2vw, 26px) 0; border-bottom: 1px solid var(--line); background: var(--surface-2); overflow-x: auto; scrollbar-width: none; }
.o11-tabs::-webkit-scrollbar { display: none; }
.o11-tab { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border: 1px solid var(--line); border-bottom: none; border-radius: var(--r-sm) var(--r-sm) 0 0; background: var(--surface); color: var(--ink-2); font: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer; white-space: nowrap; }
.o11-tab:hover { color: var(--ink); }
.o11-tab[aria-selected="true"] { background: var(--bg); color: var(--ink); border-color: var(--line-2); box-shadow: inset 0 2px 0 var(--accent); }
.o11-tab .ct { font-size: 10px; color: var(--ink-4); font-weight: 600; }
/* sheet area */
.o11-sheets { flex: 1; min-height: 0; position: relative; background: var(--bg); }
.o11-sheet { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; background: var(--bg); transform: translateY(14px); opacity: 0; pointer-events: none; transition: transform var(--t-mid) var(--ease), opacity var(--t-mid) var(--ease); }
.o11-sheet[data-active="1"] { transform: none; opacity: 1; pointer-events: auto; }
.o11-sheet-bar { display: flex; align-items: center; gap: 8px; padding: 8px clamp(12px, 2vw, 26px); font-size: 11.5px; color: var(--ink-3); border-bottom: 1px solid var(--line); background: var(--surface); }
.o11-sheet-bar b { color: var(--ink); font-weight: 650; }
.o11-sheet-bar .sp { flex: 1; }
.o11-sheet-body { flex: 1; min-height: 0; overflow: auto; }
.o11-canvas { max-width: 1080px; margin: 0 auto; padding: clamp(16px, 2.6vw, 36px) clamp(14px, 2.6vw, 32px) 60px; }
/* HOME */
.o11-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.o11-eyebrow b { color: var(--accent); }
.o11-h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 800; letter-spacing: -.02em; margin: 4px 0 4px; }
.o11-sub { color: var(--ink-2); font-size: 13.5px; margin-bottom: 16px; max-width: 60ch; line-height: 1.6; }
.o11-searchwrap { position: relative; margin-bottom: 14px; }
.o11-search { display: flex; align-items: center; gap: 11px; height: 48px; padding: 0 15px; background: var(--surface-elev); border: 1px solid var(--line); border-radius: var(--r-sm); box-shadow: var(--sh-1); }
.o11-search:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.o11-search input { flex: 1; min-width: 0; background: none; border: none; outline: none; font-size: 15.5px; color: var(--ink); }
.o11-drop { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; background: var(--surface-elev); border: 1px solid var(--line-2); border-radius: var(--r-sm); box-shadow: var(--sh-3); max-height: 360px; overflow: auto; padding: 4px; }
.o11-res { display: flex; align-items: center; gap: 9px; padding: 8px 9px; border-radius: var(--r-xs); cursor: pointer; }
.o11-res:hover, .o11-res[aria-selected="true"] { background: var(--surface-2); }
.o11-res .k { flex: none; width: 80px; font-size: 9.5px; font-weight: 800; text-transform: uppercase; color: var(--ink-4); }
.o11-res .lbl { font-size: 13px; font-weight: 650; }
.o11-res .path { font-size: 11px; color: var(--ink-3); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.o11-res .why { font-size: 10.5px; color: var(--warn); }
.o11-drop-empty { padding: 14px; text-align: center; font-size: 12.5px; color: var(--ink-2); }
.o11-note { display: flex; align-items: center; gap: 10px; padding: 10px 13px; margin-bottom: 14px; border: 1px solid color-mix(in srgb, var(--warn) 38%, var(--line)); border-radius: var(--r-xs); background: color-mix(in srgb, var(--warn-soft) 40%, var(--surface)); font-size: 12.5px; }
.o11-note button { margin-left: auto; }
.o11-hgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; margin-bottom: 16px; }
.o11-catcard { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; margin-bottom: 6px; }
.o11-catcard:hover { border-color: var(--accent-line); }
.o11-catcard .t { font-size: 13px; font-weight: 700; flex: 1; }
.o11-catcard .cnt { font-size: 11px; color: var(--ink-3); font-weight: 650; }
.o11-recent { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); overflow: hidden; }
.o11-recent-row { display: flex; gap: 8px; align-items: center; padding: 7px 11px; font-size: 12px; border-bottom: 1px solid var(--line); }
.o11-recent-row:last-child { border-bottom: none; }
.o11-recent-row .when { margin-left: auto; color: var(--ink-4); font-size: 10.5px; }
.o11-h3 { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
.o11-att { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); margin-bottom: 14px; }
.o11-att-row { display: flex; align-items: center; gap: 8px; padding: 7px 11px; font-size: 12.5px; border-bottom: 1px solid var(--line); }
.o11-att-row:last-child { border-bottom: none; }
.o11-att-row .d { color: var(--ink-3); font-size: 11.5px; }
.o11-att-row button { margin-left: auto; }
.o11-utils { display: flex; gap: 8px; flex-wrap: wrap; }
.o11-util { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 650; cursor: pointer; }
.o11-util:hover { color: var(--ink); }
/* DOMAIN sheet */
.o11-dom-head { display: flex; align-items: center; gap: 12px; padding: 0 0 10px; }
.o11-dom-head h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.015em; }
.o11-dom-head .meta { font-size: 12px; color: var(--ink-3); }
.o11-relstrip { display: flex; gap: 6px; padding: 8px 0 14px; overflow-x: auto; }
.o11-rel { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 650; cursor: pointer; white-space: nowrap; }
.o11-rel:hover { border-color: var(--accent-line); color: var(--ink); }
.o11-rel .sdot { flex: none; }
.o11-grouplist { display: grid; gap: 7px; }
.o11-grouprole { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; }
.o11-grouprole:hover { border-color: var(--accent-line); }
.o11-grouprole .t { font-size: 13.5px; font-weight: 700; flex: 1; }
.o11-grouprole .cnt { font-size: 11.5px; color: var(--ink-3); }
/* settings rows */
.o11-setrow { display: flex; gap: 15px; padding: 13px 15px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); margin-bottom: 7px; }
.o11-setrow .info { flex: 1; min-width: 0; }
.o11-setrow .lbl { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.o11-setrow .desc { font-size: 12px; color: var(--ink-2); line-height: 1.55; margin-top: 3px; max-width: 66ch; }
.o11-setrow .ctl { flex: none; width: 210px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.o11-setrow[data-status="managed"] .ctl { opacity: .55; }
.o11-setrow[data-status="unavailable"] { opacity: .62; }
.o11-switch { position: relative; width: 40px; height: 22px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line); cursor: pointer; flex: none; }
.o11-switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.o11-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface-elev); transition: transform var(--t-fast) var(--ease); }
.o11-switch[aria-checked="true"]::after { transform: translateX(18px); }
.o11-sel { height: 30px; padding: 0 9px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-xs); color: var(--ink); font: inherit; font-size: 12px; max-width: 100%; }
.o11-range { width: 100%; accent-color: var(--accent); }
.o11-err { font-size: 11px; color: var(--bad); }
.o11-why button { font-size: 11.5px; color: var(--ink-4); background: none; border: none; cursor: pointer; font-weight: 650; padding: 0; }
.o11-details { margin-top: 7px; padding: 9px 11px; border: 1px dashed var(--line-2); border-radius: var(--r-xs); font-size: 11.5px; color: var(--ink-2); line-height: 1.6; }
.o11-details b { color: var(--ink); }
/* MANAGER sheet: roster + detail tabs */
.o11-mgr-head { display: flex; align-items: center; gap: 11px; padding: 0 0 8px; }
.o11-mgr-head h2 { margin: 0; font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 9px; }
.o11-mgr-head .sum { font-size: 12px; color: var(--ink-3); }
.o11-mgr-head .sp { flex: 1; }
.o11-mgr-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 14px; align-items: start; }
.o11-roster { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); overflow: hidden; }
.o11-rrow { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.o11-rrow:last-child { border-bottom: none; }
.o11-rrow:hover { background: var(--surface-2); }
.o11-rrow[aria-selected="true"] { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--accent); }
.o11-rrow .lbl { font-size: 13px; font-weight: 650; }
.o11-rrow .sub { font-size: 11px; color: var(--ink-3); }
.o11-rrow .sdot { margin-left: auto; }
.o11-detail { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 16px; }
.o11-detail h3 { margin: 0 0 2px; font-size: 16.5px; font-weight: 800; }
.o11-dtabs { display: flex; gap: 4px; margin: 8px 0 12px; flex-wrap: wrap; }
.o11-dtab { padding: 6px 11px; font-size: 12px; font-weight: 650; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-xs); cursor: pointer; }
.o11-dtab[aria-selected="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.o11-detail .dsub { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; margin-bottom: 10px; }
.o11-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.o11-kv { display: grid; grid-template-columns: 140px 1fr; gap: 4px 13px; font-size: 12.5px; margin-bottom: 12px; }
.o11-kv .k { color: var(--ink-3); font-weight: 650; }
.o11-kv .v { color: var(--ink); line-height: 1.5; overflow-wrap: anywhere; }
.o11-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.o11-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-xs); background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 650; cursor: pointer; }
.o11-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.o11-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.o11-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.o11-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.o11-table td.mut { color: var(--ink-2); }
.o11-offline { display: flex; gap: 9px; padding: 10px 12px; margin: 8px 0; border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); border-radius: var(--r-xs); background: color-mix(in srgb, var(--warn-soft) 45%, var(--surface)); font-size: 12px; }
.o11-work { border: 1px solid var(--line); border-radius: var(--r-xs); padding: 11px 13px; margin: 8px 0; font-size: 12px; }
.o11-work .bar { height: 5px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin-top: 7px; }
.o11-work .bar > div { height: 100%; background: var(--accent); transition: width var(--t-mid) var(--ease); }
.o11-setup { border: 1px solid var(--line-2); border-radius: var(--r-xs); padding: 12px 14px; margin: 8px 0; }
.o11-setup ol { margin: 4px 0 0; padding-left: 18px; font-size: 11.5px; color: var(--ink-2); line-height: 1.7; }
.o11-skel { border-radius: var(--r-xs); background: var(--surface-2); animation: v2-shimmer 1.4s ease-in-out infinite; }
/* drawer + copy (adjacent panes) */
.o11-drawer { position: absolute; right: 0; top: 0; bottom: 0; width: min(420px, 92%); z-index: 45; background: var(--surface-elev); border-left: 1px solid var(--line-2); transform: translateX(102%); transition: transform var(--t-mid) var(--ease); display: flex; flex-direction: column; }
.o11-drawer[data-open="1"] { transform: none; box-shadow: var(--sh-3); }
.o11-drawer-head { display: flex; align-items: center; gap: 8px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
.o11-drawer-head h4 { margin: 0; font-size: 14px; flex: 1; }
.o11-drawer-body { flex: 1; overflow: auto; padding: 13px 15px; font-size: 12.5px; line-height: 1.65; color: var(--ink-2); }
.o11-drawer-body b { color: var(--ink); }
.o11-veil { position: absolute; inset: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 58%, transparent); display: grid; place-items: center; padding: 16px; }
.o11-copy { width: min(900px, 100%); max-height: calc(100% - 14px); display: flex; flex-direction: column; background: var(--surface-elev); border: 1px solid var(--line-2); border-radius: var(--r-lg); overflow: hidden; }
.o11-copy-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.o11-copy-head h3 { margin: 0; font-size: 15.5px; font-weight: 800; flex: 1; }
.o11-copy-body { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); }
.o11-copy-l { padding: 14px 16px; border-right: 1px solid var(--line); overflow: auto; }
.o11-copy-r { padding: 14px 16px; overflow: auto; }
.o11-copy-foot { display: flex; gap: 8px; padding: 11px 16px; border-top: 1px solid var(--line); }
.o11-copy-foot .sp { flex: 1; }
.o11-step { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.o11-src { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); margin-bottom: 7px; cursor: pointer; background: var(--surface); }
.o11-src[aria-selected="true"] { border-color: var(--accent-line); background: var(--surface-2); }
.o11-cat { display: grid; grid-template-columns: 17px 1fr; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); margin-bottom: 7px; cursor: pointer; background: var(--surface); }
.o11-cat[aria-selected="true"] { border-color: var(--accent-line); background: var(--surface-2); }
.o11-counts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.o11-count { padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-xs); font-size: 11px; color: var(--ink-3); }
.o11-count b { font-size: 15px; color: var(--ink); margin-right: 4px; }
.o11-cplist { border: 1px solid var(--line); border-radius: var(--r-xs); height: 230px; overflow: auto; }
.o11-receipt { border: 1px solid color-mix(in srgb, var(--ok) 40%, var(--line)); background: color-mix(in srgb, var(--ok-soft) 38%, var(--surface)); border-radius: var(--r-xs); padding: 12px; font-size: 12.5px; }
/* topbar */
.o11-proj { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.o11-proj b { color: var(--ink); }
@media (max-width: 1023px) {
  .o11-hgrid { grid-template-columns: 1fr; }
  .o11-mgr-body { grid-template-columns: 1fr; }
  .o11-copy-body { grid-template-columns: 1fr; }
  .o11-copy-l { border-right: none; border-bottom: 1px solid var(--line); }
  .o11-setrow { flex-direction: column; }
  .o11-setrow .ctl { width: 100%; align-items: flex-start; }
}
@media (max-width: 899px) {
  .pm-shell { grid-template-columns: 60px 1fr var(--chat-w, 0px); grid-template-areas: "topbar topbar topbar" "activity stage chat" "footer footer footer"; }
  .pm-rail { position: absolute; z-index: 44; top: var(--shell-h); bottom: var(--footer-h); left: 60px; width: 260px; box-shadow: var(--sh-3); background: var(--surface-elev); }
}
@media (min-width: 1900px) { .o11-canvas { max-width: 1280px; } }

/* ===== squeeze: 760px topbar survival (added by verification pass) ===== */
@media (max-width: 899px) {
  .pm-topbar .pm-brand { display: none; }
  .pm-topbar { gap: 6px; }
  #themeBtn, #closeBtn, #navToggle { font-size: 0; gap: 0; padding: 0 9px; }
  #themeBtn svg, #closeBtn svg, #navToggle svg { margin-right: 0; }
  #projChip, .d5-projchip, .e6-proj, .c7-proj, .t8-proj, .n9-proj, .m10-proj, .o11-proj { max-width: 130px; overflow: hidden; white-space: nowrap; }
  .d5-mini-search, .e6-minis, .c7-minis, .t8-minis, .n9-minis, .m10-cmdinput, .o11-search { min-width: 90px !important; }
}

<body>
<div class="pm-shell" id="shell" data-rail="closed" data-chat="closed">
  <header class="pm-topbar">
    <span class="pm-brand">PUPPET&nbsp;MASTER</span>
    <button class="o11-btn" id="navToggle" aria-label="Settings navigation"></button>
    <span class="pm-crumb" id="pathTop"><b>Settings</b></span>
    <span class="pm-spacer"></span>
    <span class="o11-proj" id="projChip"></span>
    <button class="o11-btn" id="themeBtn"></button>
    <button class="o11-btn" id="closeBtn"></button>
  </header>
  <nav class="pm-activity" aria-label="Activity Bar" id="activity"></nav>
  <aside class="pm-rail" id="rail" data-hidden></aside>
  <main class="pm-stage" id="stage" style="position:relative;">
    <a data-concept-model="GLM-5.2" href="index.html" title="GLM-5.2 settings concept" style="position:absolute;opacity:0;pointer-events:none;" aria-hidden="true">GLM-5.2</a>
    <div class="o11" id="app">
      <div class="o11-tabs v2-surface" id="tabstrip" role="tablist" aria-label="Settings categories"></div>
      <div class="o11-sheets" id="sheets"></div>
    </div>
    <div class="o11-drawer v2-surface" id="drawer" data-open="0"><div class="o11-drawer-head"><h4 id="drawerTitle">Details</h4><button class="o11-btn" id="drawerClose"></button></div><div class="o11-drawer-body" id="drawerBody"></div></div>
    <div id="menuHost"></div>
  </main>
  <aside class="pm-chat" data-hidden></aside>
  <footer class="pm-footer" id="footer"></footer>
</div>
<script>
(function () {
  "use strict";
  var PM2 = window.PM2, STORE = new PM2.Store("c11");
  var NS = "concept-11-tabbed-organizer";
  var el = function (id) { return document.getElementById(id); };
  var app = el("app"), stage = el("stage");
  var NAV = new PM2.routes.Nav({ domain: null });
  var QP = new URLSearchParams(location.search);
  if (QP.get("theme")) document.documentElement.setAttribute("data-theme", QP.get("theme"));
  if (QP.get("reduced") === "1") document.documentElement.setAttribute("data-reduced-motion", "1");

        f.innerHTML = "";
        var box = el("cw");
        var w = STORE.work({ kind: "copy", label: "Copy settings", phases: ["restore point", "apply", "verify"], steps: 10, fast: true });
        var un = STORE.subscribe("work", function () {
          box.innerHTML = "<b>" + esc(w.label) + "</b> — " + esc(w.note) + '<div class="bar"><div style="width:' + ((w.phaseI + 1) / 3 * 100) + '%"></div></div>';
          if (w.state === "done") {
            un();
            COPY.result = STORE.applyCopy(COPY.preview, COPY.cats);
            R.innerHTML = '<div class="o11-step">Done — verified & receipted</div><div class="o11-receipt"><b>' + COPY.result.counts.applied + " values copied</b> · " + COPY.result.counts.skipped + " skipped. Receipt <b>" + esc(COPY.result.receipt.id) + "</b> · restore point <b>" + esc(COPY.result.restorePoint.label) + "</b>.<br>" + COPY.result.verify.note + "</div>" +
              '<div class="o11-offline" style="border-color:var(--line);margin-top:8px"><span class="sdot ok"></span><b>' + esc(PM2.currentProject.name) + "</b> and <b>" + esc(COPY.preview.source.name) + "</b> are independent from here on.</div>";
            f.innerHTML = '<button class="o11-btn" id="copyRoll">Rollback</button><span class="sp"></span><button class="o11-btn primary" id="copyDone">Done</button>';
            el("copyRoll").addEventListener("click", function () { STORE.rollback(COPY.result.restorePoint.id); openDrawer("Rollback complete", "Restored to the pre-copy restore point. Receipt recorded."); copyClose(); });
            el("copyDone").addEventListener("click", copyClose);
          }
        });
      });
    }
  }

  /* boot */
  var initial = PM2.routes.parse(location.hash);
  if (initial.domain || initial.manager || initial.mode) NAV.stack = [Object.assign({ domain: null }, initial)];
  render(NAV.top());
  if (initial.row || initial.object || initial.query) land(PM2.routes.planFor(initial), PM2.search.byRid(initial.resultId || "") || null);
  window.__C11 = { PM2: PM2, STORE: STORE, NAV: NAV, state: state, pickResult: pickResult };
})();
</script>
