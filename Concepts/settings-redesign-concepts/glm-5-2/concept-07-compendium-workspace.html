<body>
<div class="pm-shell" id="shell" data-rail="closed" data-chat="closed">
  <header class="pm-topbar">
    <span class="pm-brand">PUPPET&nbsp;MASTER</span>
    <button class="c7-tb" id="navToggle" aria-label="Settings navigation"></button>
    <nav class="c7-crumb" id="crumb" aria-label="Settings location"></nav>
    <span class="pm-spacer"></span>
    <div class="c7-minis" id="miniWrap" hidden><span id="miniIcon"></span><input id="miniSearch" type="search" placeholder="Search settings" aria-label="Search settings" autocomplete="off"></div>
    <span class="c7-proj" id="projChip"></span>
    <button class="c7-tb" id="themeBtn"></button>
    <button class="c7-tb" id="closeBtn"></button>
  </header>
  <nav class="pm-activity" aria-label="Activity Bar" id="activity"></nav>
  <aside class="pm-rail" id="rail" data-hidden></aside>
  <main class="pm-stage" id="stage" style="position:relative;">
    <a data-concept-model="GLM-5.2" href="index.html" title="GLM-5.2 settings concept" style="position:absolute;opacity:0;pointer-events:none;" aria-hidden="true">GLM-5.2</a>
    <div class="c7" id="app"></div>
    <div class="c7-drawer v2-surface" id="drawer" data-open="0"><div class="c7-drawer-head"><h4 id="drawerTitle">Details</h4><button class="c7-tb" id="drawerClose"></button></div><div class="c7-drawer-body" id="drawerBody"></div></div>
    <div id="menuHost"></div>
  </main>
  <aside class="pm-chat" data-hidden></aside>
  <footer class="pm-footer" id="footer"></footer>
</div>
<script>
(function () {
  "use strict";
  var PM2 = window.PM2, STORE = new PM2.Store("c07");
  var NS = "concept-07-compendium-workspace";
  var el = function (id) { return document.getElementById(id); };
  var app = el("app"), stage = el("stage");
  var NAV = new PM2.routes.Nav({ domain: null });
  var QP = new URLSearchParams(location.search);
  if (QP.get("theme")) document.documentElement.setAttribute("data-theme", QP.get("theme"));
  if (QP.get("reduced") === "1") document.documentElement.setAttribute("data-reduced-motion", "1");
  var ICONS = { general: "settings", ai: "pam", safety: "shield", code: "code", memory: "memory", planning: "compass", branching: "crew", media: "map", web: "search", personas: "users", extensions: "stack", system: "grid" };
  function esc(x) { return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  el("projChip").innerHTML = '<span class="sdot ok"></span><b>' + PM2.currentProject.name + "</b> · current project";
  el("closeBtn").innerHTML = PM2.svg("close", 13) + "Close";
  el("navToggle").innerHTML = PM2.svg("list", 13) + "Settings";
  el("miniIcon").innerHTML = PM2.svg("search", 13);
  el("themeBtn").innerHTML = PM2.svg("settings", 13) + "Friendly Dark";
  el("drawerClose").innerHTML = PM2.svg("close", 12) + "Close";
  el("activity").innerHTML = ["home", "settings", "terminal", "stack", "users", "search"].map(function (i) { return '<button class="pm-act" aria-label="' + i + '">' + PM2.svg(i, 18) + "</button>"; }).join("");
  el("footer").innerHTML = "<span><b>Settings</b> · " + NS + "</span><span class='pm-spacer'></span><span>828 settings · 12 categories · compendium</span>";

  var menu = null;
  function openMenu(anchor, items, onPick) {
    closeMenu();
    var m = document.createElement("div"); m.className = "v2menu";
    m.innerHTML = items.map(function (it, i) { return it.sep ? '<div class="v2menu-sep"></div>' : '<button class="v2menu-item" data-i="' + i + '">' + (it.icon ? PM2.svg(it.icon, 14) : "") + '<span class="v2menu-label">' + it.label + "</span></button>"; }).join("");
    el("menuHost").appendChild(m);
    var r = anchor.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    var top = r.bottom - sr.top + 6, left = Math.min(Math.max(0, r.left - sr.left), sr.width - 230);
    if (r.bottom + 280 > window.innerHeight) top = Math.max(4, r.top - sr.top - 280);
    m.style.top = top + "px"; m.style.left = left + "px";
    m.addEventListener("click", function (e) { var b = e.target.closest(".v2menu-item"); if (!b) return; closeMenu(); onPick(items[+b.dataset.i]); });
    menu = m;
  }
  function closeMenu() { if (menu) { menu.remove(); menu = null; return true; } return false; }
  document.addEventListener("click", function (e) { if (menu && !menu.contains(e.target)) closeMenu(); }, true);
  el("themeBtn").addEventListener("click", function () {
    var themes = PM2.mgrById["mgr.appearance"].themes;
    openMenu(el("themeBtn"), themes.map(function (t) { return { label: t }; }).concat([{ sep: 1 }, { label: "Reduced motion: " + (RM() ? "on" : "off") }]), function (it) {
      if (it.label.indexOf("Reduced") === 0) { document.documentElement.setAttribute("data-reduced-motion", RM() ? "0" : "1"); return; }
      document.documentElement.setAttribute("data-theme", it.label);
      document.documentElement.style.colorScheme = /-dark$/.test(it.label) ? "dark" : "light";
      el("themeBtn").innerHTML = PM2.svg("settings", 13) + it.label;
    });
  });
  function RM() { return document.documentElement.getAttribute("data-reduced-motion") === "1"; }
  el("closeBtn").addEventListener("click", goHome);
  el("navToggle").addEventListener("click", function () { var r = el("rail"); r.dataset.hidden = r.dataset.hidden ? "" : "hidden"; });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (closeMenu()) return;
      if (el("drawer").dataset.open === "1") { closeDrawer(); return; }
      if (COPY.open) { copyClose(); return; }
      if (NAV.canBack()) { NAV.back(); return; }
      if (state.view !== "home") goHome();
    }
  });

  var state = { view: "home", domain: null, section: null, manager: null, object: null, tab: 0, hydrated: {}, lastQuery: "", lastRid: null, facet: "all", compSel: null };
  var lastRendered = "", pendingRestore = null;
  var appHash = null; /* last hash this app itself wrote; its hashchange echo is ignored (a deep-link render can push a second route before the echo arrives, and re-pushing the stale route would swallow the compendium jump) */
  NAV.on(function (route, depth, extra) {
    var s = PM2.routes.str(route);
    if (extra && extra.returnedFrom && extra.returnedFrom.query) pendingRestore = { query: extra.returnedFrom.query, resultId: extra.returnedFrom.resultId };
    if (s === lastRendered) return;
    lastRendered = s; appHash = location.hash = s; render(route);
  });
  window.addEventListener("hashchange", function () { if (location.hash === appHash) return; var r = PM2.routes.parse(location.hash); if (PM2.routes.str(r) !== PM2.routes.str(NAV.top())) NAV.go(r); });
  function goHome() { state.view = "home"; state.domain = state.section = state.manager = null; NAV.reset({ domain: null }); render({ domain: null }); }

  /* search */
  var drop = null, dropSel = -1;
  function searchAttach(input) {
    var wrap = input.parentElement;
    input.addEventListener("input", function () { state.lastQuery = input.value; showDrop(wrap, PM2.search.query(input.value)); });
    input.addEventListener("keydown", function (e) {
      if (!drop) { if (e.key === "Escape" && state.view !== "home") goHome(); return; }
      var rows = drop.querySelectorAll(".c7-res");
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); dropSel = e.key === "ArrowDown" ? Math.min(rows.length - 1, dropSel + 1) : Math.max(0, dropSel - 1); rows.forEach(function (r, i) { r.setAttribute("aria-selected", i === dropSel ? "true" : "false"); }); rows[dropSel] && rows[dropSel].scrollIntoView({ block: "nearest" }); }
      else if (e.key === "Enter") { e.preventDefault(); var rid = dropSel >= 0 && rows[dropSel] ? rows[dropSel].dataset.rid : (rows[0] && rows[0].dataset.rid); if (rid) pickResult(rid); }
      else if (e.key === "Escape") hideDrop();
    });
  }
  function showDrop(wrap, res) {
    hideDrop();
    if (!res.query) return;
    drop = document.createElement("div"); drop.className = "c7-drop v2-surface";
    var html = "";
    if (!res.results.length) {
      html = '<div class="c7-drop-empty">No results' + (res.suggestion ? " — did you mean <b>" + esc(res.suggestion) + "</b>?" : "") + "</div>";
      if (res.suggestion) html += '<div class="c7-res" data-rid="suggest:' + esc(res.suggestion) + '"><span class="g">suggestion</span><span class="lbl">“' + esc(res.suggestion) + "”</span></div>";
    } else {
      res.results.forEach(function (r) {
        html += '<div class="c7-res" data-rid="' + esc(r.rid) + '"><span class="g">' + r.type.replace(/_/g, " ").slice(0, 11) + '</span><span class="lbl">' + esc(r.label) + '</span><span class="path">' + esc(r.path.join(" › ")) + "</span>" + (r.availability ? '<span class="why">' + esc(r.availability) + "</span>" : "") + "</div>";
      });
    }
    drop.innerHTML = html; wrap.appendChild(drop); dropSel = -1;
    drop.addEventListener("mousedown", function (e) {
      var row = e.target.closest(".c7-res"); if (!row) return; e.preventDefault();
      if (row.dataset.rid.indexOf("suggest:") === 0) { var q = row.dataset.rid.slice(8); var inp = wrap.querySelector("input"); inp.value = q; state.lastQuery = q; showDrop(wrap, PM2.search.query(q)); return; }
      pickResult(row.dataset.rid);
    });
  }
  function hideDrop() { if (drop) { drop.remove(); drop = null; } }
  document.addEventListener("click", function (e) { if (drop && !e.target.closest(".c7-searchwrap") && !e.target.closest(".c7-minis")) hideDrop(); });
  function pickResult(rid) {
    var entry = PM2.search.byRid(rid); if (!entry) return;
    state.lastRid = rid; hideDrop();
    if (entry.type === "intentional_help_result" && entry.dest.mode === "copy") { NAV.go({ mode: "copy" }); openCopy(); return; }
    var plan = PM2.routes.planFor(entry.dest);
    NAV.go(Object.assign({}, entry.dest, { query: state.lastQuery, resultId: rid }));
    land(plan, entry);
  }
  function land(plan, entry) {
    var tries = 0;
    (function go() {
      var target = null;
      if (plan.route.row) {
        target = stage.querySelector('[data-row="' + plan.route.row + '"]');
        if (target && state.view === "compendium") { /* select in compendium */ }
      }
      if (!target && plan.route.object) target = stage.querySelector('[data-obj="' + plan.route.object + '"]');
      if (!target && plan.route.manager) target = stage.querySelector('[data-mgr="' + plan.route.manager + '"]');
      if (!target && plan.route.row) target = stage.querySelector('[data-row="' + plan.route.row + '"]');
      if (!target && tries++ < 16) { setTimeout(go, 110); return; }
      if (target) {
        if (plan.route.row) state.calmRow = plan.route.row; /* virtualized compendium redraws its rows on scroll; drawRows re-applies the calm highlight + focus */
        target.scrollIntoView({ block: "center", behavior: RM() ? "auto" : "smooth" });
        target.classList.remove("v2-calm"); void target.offsetWidth; target.classList.add("v2-calm");
        if (target.classList.contains("c7-row")) selectRow(target.dataset.row);
        var f = target.querySelector("input,select,button,.c7-switch") || target;
        try { f.focus({ preventScroll: true }); } catch (e) {}
      }
      if (entry && entry.type === "setting") {
        var s = PM2.inventory.byId[plan.route.row];
        if (s) openDrawer("Why you landed here", "<b>" + esc(s.label) + "</b> matched your search for “" + esc(state.lastQuery) + "”.<br>" + esc(s.desc) + "<br><br>Location: " + esc(PM2.routes.crumb(NAV.top()).join(" › ")) + "<br>Back returns you to the query and this result.");
      }
    })();
  }

  function render(route) {
    closeDrawer(); hideDrop();
    if (route.manager && PM2.mgrById[route.manager]) renderManager(route);
    else if (route.domain === "all") renderCompendium(route);
    else if (route.domain) renderDomain(route);
    else if (route.mode === "copy") { renderHome(); openCopy(); }
    else renderHome();
    renderRail(route); renderCrumb(route);
    el("miniWrap").hidden = state.view === "home";
  }
  function renderCrumb(route) {
    var html = "<b>Settings</b>";
    if (route.domain === "all") html += ' <span>›</span> All settings';
    else PM2.routes.crumb(route).forEach(function (p) { html += ' <span>›</span> ' + esc(p); });
    if (NAV.canBack()) html = '<button class="c7-tb" id="backBtn">' + PM2.svg("back", 12) + "Back</button>" + html;
    el("crumb").innerHTML = html;
    var b = el("backBtn"); if (b) b.addEventListener("click", function () { NAV.back(); });
  }
  function renderRail(route) {
    var html = '<div class="pm-rail-head">Settings</div><div class="pm-rail-body v2-surface">';
    html += '<div class="pm-side-item" data-nav="home"' + (!route.domain ? ' aria-current="page"' : "") + ">" + PM2.svg("home", 15) + "Home</div>";
    html += '<div class="pm-side-item" data-nav="all"' + (route.domain === "all" ? ' aria-current="page"' : "") + ">" + PM2.svg("list", 15) + "All settings</div>";
    PM2.inventory.categories.forEach(function (c) {
      html += '<div class="pm-side-item" data-nav="' + c.id + '"' + (route.domain === c.id ? ' aria-current="page"' : "") + ">" + PM2.svg(ICONS[c.id] || "grid", 15) + esc(c.title) + '<span class="pm-side-cnt">' + PM2.inventory.byCategory[c.id].length + "</span></div>";
    });
    html += '<div class="pm-side-item" data-nav="copy">' + PM2.svg("layers", 15) + "Copy from…</div></div>";
    el("rail").innerHTML = html;
    el("rail").querySelectorAll("[data-nav]").forEach(function (n) {
      n.addEventListener("click", function () {
        var v = n.dataset.nav;
        if (v === "home") goHome(); else if (v === "copy") openCopy(); else NAV.jump({ domain: v });
        if (window.innerWidth < 900) el("rail").dataset.hidden = "hidden";
      });
    });
  }

  /* HOME */
  function renderHome() {
    state.view = "home"; state.domain = state.section = state.manager = null;
    var html = '<div class="c7-home v2-surface"><div class="c7-wrap">';
    html += '<div class="c7-eyebrow"><b>07</b> · A2 Compendium Workspace · Take 1</div>';
    html += '<h1 class="c7-h1">The whole of Settings, one compendium</h1>';
    html += '<div class="c7-sub">Browse by area, or open the <b>All Settings</b> index — every one of 828 settings, faceted and searchable, for <b>' + esc(PM2.currentProject.name) + "</b>.</div>";
    html += '<div class="c7-searchwrap"><div class="c7-search">' + PM2.svg("search", 17) + '<input id="homeSearch" type="search" placeholder="Search all settings, managers, objects, actions…" aria-label="Universal search" autocomplete="off"><span class="v2kbd">/</span></div></div>';
    html += '<div class="c7-note"><span class="sdot warn"></span><span><b>One provider needs setup</b> — Codex CLI installs only explicitly, from the official source.</span><span style="flex:1"></span><button class="c7-tb" data-dest=\'' + esc(JSON.stringify({ manager: "mgr.provider", object: "prov.codex-cli" })) + '\'>Open</button></div>';
    html += '<div class="c7-grid">';
    html += '<div class="c7-col"><h3 class="lt">Browse by area</h3><div class="c7-area">';
    PM2.inventory.categories.forEach(function (c) {
      html += '<div class="c7-area-card" data-domain="' + c.id + '" tabindex="0"><span class="ic">' + PM2.svg(ICONS[c.id] || "grid", 18) + '</span><div style="min-width:0"><div class="t">' + esc(c.title) + '</div><div class="d">' + PM2.inventory.byCategory[c.id].length + " settings · " + PM2.managers.filter(function (m) { return m.domain === c.id; }).length + " managers</div></div></div>";
    });
    html += "</div></div>";
    html += '<div class="c7-col"><h3 class="lt">Needs attention · 3</h3><div class="c7-att">';
    [{ t: "Codex CLI setup required", d: "explicit install", go: { manager: "mgr.provider", object: "prov.codex-cli" } },
     { t: "ntfy offline", d: "queued since 08-17", go: { manager: "mgr.notifications", object: "ntf.ntfy" } },
     { t: "Vault migration awaits restart", d: "storage", go: { manager: "mgr.storage", object: "sto.migrate" } }].forEach(function (a) {
      html += '<div class="c7-att-row"><span class="sdot warn"></span><span>' + esc(a.t) + '</span><span class="d">' + esc(a.d) + '</span><button data-dest=\'' + esc(JSON.stringify(a.go)) + "'>Open</button></div>";
    });
    html += '</div><h3 class="lt" style="margin-top:16px">Recent changes</h3><div class="c7-recent">';
    [["Theme", "Glass Dark", "today 10:12"], ["Fast lane model", "gpt-5.2-mini (fallback)", "yesterday"], ["Quiet hours", "22:00–07:00", "Aug 14"]].forEach(function (r) {
      html += '<div class="c7-recent-row"><span class="sdot info"></span><span><b>' + r[0] + "</b> → " + esc(r[1]) + '</span><span class="when">' + r[2] + "</span></div>";
    });
    html += "</div></div></div>";
    html += '<div class="c7-utils"><button class="c7-util primary" data-nav="all">' + PM2.svg("list", 13) + 'All Settings — full index</button><button class="c7-util" data-nav="copy">' + PM2.svg("layers", 13) + 'Copy settings from another project</button></div>';
    html += "</div></div>";
    app.innerHTML = html;
    searchAttach(el("homeSearch"));
    var rq = pendingRestore ? pendingRestore.query : NAV.top().query;
    if (rq) { el("homeSearch").value = rq; state.lastQuery = rq; if (pendingRestore && pendingRestore.resultId) state.lastRid = pendingRestore.resultId; pendingRestore = null; }
    app.querySelectorAll("[data-domain]").forEach(function (c) {
      c.addEventListener("click", function () { NAV.jump({ domain: c.dataset.domain }); });
      c.addEventListener("keydown", function (e) { if (e.key === "Enter") NAV.jump({ domain: c.dataset.domain }); });
    });
    app.querySelectorAll("[data-dest]").forEach(function (b) { b.addEventListener("click", function (e) { e.stopPropagation(); var d = JSON.parse(b.dataset.dest); NAV.go(d); land(PM2.routes.planFor(d)); }); });
    app.querySelectorAll(".c7-util").forEach(function (b) { b.addEventListener("click", function () { var v = b.dataset.nav; if (v === "all") NAV.go({ domain: "all" }); else if (v === "copy") openCopy(); }); });
  }

  /* DOMAIN OVERVIEW — key settings + related managers + pages */
  function renderDomain(route) {
    state.view = "domain"; state.domain = route.domain; state.manager = null;
    var c = PM2.inventory.categories.filter(function (x) { return x.id === route.domain; })[0];
    var mgrs = PM2.managers.filter(function (m) { return m.domain === route.domain; });
    var rows = PM2.inventory.byCategory[route.domain];
    var key = rows.filter(function (s) { return s.curated || (s.badges || []).length; }).slice(0, 8);
    if (key.length < 6) key = rows.slice(0, 6);
    var html = '<div class="c7-dom v2-surface"><div class="c7-dom-head"><div class="cr"><b>Settings</b> › ' + esc(c.title) + '</div><h2>' + esc(c.title) + '</h2><div class="lede">' + rows.length + ' settings · ' + c.subgroups.length + ' pages · ' + mgrs.length + ' managers · changes apply to ' + esc(PM2.currentProject.name) + ' only.</div></div>';
    html += '<div class="c7-dom-body">';
    html += '<div><div class="c7-panel"><div class="c7-panel-h">Key settings</div><div class="c7-key" id="keyRows"></div></div>';
    html += '<div class="c7-panel" style="margin-top:12px"><div class="c7-panel-h">Pages</div><div class="c7-rel c7-pagelist">';
    c.subgroups.forEach(function (sg) {
      var sid = sg.id || sg, srows = PM2.inventory.subgroups[route.domain + "." + sid] || [];
      html += '<div class="c7-pagerow" data-page="' + sid + '">' + PM2.svg("stack", 14) + '<span>' + esc(sg.title || sid) + '</span><span class="cnt">' + srows.length + "</span></div>";
    });
    html += "</div></div></div>";
    html += '<div><div class="c7-panel"><div class="c7-panel-h">Related managers</div><div class="c7-rel">';
    mgrs.forEach(function (m) {
      html += '<div class="c7-relrow" data-mgr="' + m.id + '"><span style="color:var(--ink-2)">' + PM2.svg(m.icon, 16) + '</span><div style="min-width:0;flex:1"><div class="t">' + esc(m.title) + '</div><div class="d">' + esc(m.blurb) + "</div></div>" + '<span class="v2badge ' + (m.health.kind === "ok" ? "ok" : m.health.kind) + '">' + esc(m.health.text) + "</span></div>";
    });
    if (route.domain === "system") {
      PM2.owners.forEach(function (o) {
        html += '<div class="c7-relrow" data-owner="' + o.id + '"><span style="color:var(--ink-2)">' + PM2.svg("plug", 16) + '</span><div style="min-width:0;flex:1"><div class="t">' + esc(o.title) + '</div><div class="d">' + esc(o.owner) + "</div></div>" + '<span class="v2badge info">insertion</span></div>';
      });
    }
    html += '</div></div><button class="c7-util" data-all-of="' + route.domain + '" style="margin-top:12px">' + PM2.svg("list", 13) + "All " + rows.length + " settings in " + esc(c.title) + " →</button></div>";
    html += "</div></div>";
    app.innerHTML = html;
    var keyHost = el("keyRows");
    key.forEach(function (s) {
      var st = STORE.get(s.id), meta = PM2.statusMeta[st.status];
      var d = document.createElement("div");
      d.className = "c7-keyrow"; d.dataset.row = s.id;
      d.innerHTML = '<div><div class="lbl">' + esc(s.label) + ' <span class="v2badge ' + (meta.tone === "neutral" ? "" : meta.tone) + '">' + esc(meta.label) + '</span></div><div class="desc">' + esc(s.desc.slice(0, 140)) + (s.desc.length > 140 ? "…" : "") + "</div></div>" + keyCtl(s, st);
      wireCtl(d, s);
      keyHost.appendChild(d);
    });
    app.querySelectorAll("[data-mgr]").forEach(function (r) { r.addEventListener("click", function () { NAV.go({ domain: route.domain, manager: r.dataset.mgr }); }); });
    app.querySelectorAll("[data-owner]").forEach(function (r) {
      r.addEventListener("click", function () {
        var o = PM2.owners.filter(function (x) { return x.id === r.dataset.owner; })[0];
        openDrawer(o.title, "<b>Owner:</b> " + esc(o.owner) + "<br><b>Contract:</b> " + esc(o.contract) + "<br><b>Return:</b> " + esc(o.returnRoute));
      });
    });
    app.querySelectorAll("[data-page]").forEach(function (p) {
      p.addEventListener("click", function () { state.facet = "domain:" + route.domain; NAV.go({ domain: "all" }); setTimeout(function () { jumpToPage(route.domain, p.dataset.page); }, 100); });
    });
    var ab = app.querySelector("[data-all-of]");
    if (ab) ab.addEventListener("click", function () { state.facet = "domain:" + route.domain; NAV.go({ domain: "all" }); });
    if (route.page && route.row) {
      /* deep-link straight through to the compendium carrying the exact row; its virtualized list scrolls to the row and calm-highlights it there. replace:true keeps the domain entry from being re-pushed so Back still reaches the previous view */
      state.facet = "domain:" + route.domain;
      NAV.go({ domain: "all", page: route.page, section: route.section, row: route.row }, { replace: true });
    }
  }
  function jumpToPage(domainId, pageId) {
    var t = stage.querySelector('[data-pagerow="' + pageId + '"]');

    } else if (COPY.step === 1) {
      b.innerHTML = '<div class="c7-step">2 of 4 · Categories</div><div class="c7-catgrid">' + PM2.copyCategories.map(function (c) {
        return '<div class="c7-cat" data-cat="' + c.id + '" aria-selected="' + (COPY.cats.indexOf(c.id) >= 0) + '"><span class="v2kbd" style="border-radius:5px;height:20px">' + (COPY.cats.indexOf(c.id) >= 0 ? "✓" : "") + '</span><div><b style="font-size:13px">' + esc(c.title) + '</b><div style="font-size:11.5px;color:var(--ink-2)">' + esc(c.includes) + "</div></div></div>";
      }).join("") + "</div>";
      f.innerHTML = '<button class="c7-btn" id="copyBack">Back</button><span class="sp"></span><button class="c7-btn" id="copyNext">Preview copy</button>';
      b.querySelectorAll("[data-cat]").forEach(function (c) {
        c.addEventListener("click", function () {
          var id = c.dataset.cat, i = COPY.cats.indexOf(id);
          if (i >= 0) COPY.cats.splice(i, 1); else COPY.cats.push(id);
          c.setAttribute("aria-selected", COPY.cats.indexOf(id) >= 0);
          c.querySelector(".v2kbd").textContent = COPY.cats.indexOf(id) >= 0 ? "✓" : "";
        });
      });
      el("copyBack").addEventListener("click", function () { COPY.step = 0; drawCopy(); });
      el("copyNext").addEventListener("click", function () { COPY.preview = PM2.copyPreview(COPY.src, COPY.cats); COPY.step = 2; drawCopy(); });
    } else if (COPY.step === 2) {
      var t = COPY.preview.totals;
      b.innerHTML = '<div class="c7-step">3 of 4 · Preview with detailed diff</div>' +
        '<div class="c7-counts"><span class="c7-count"><span class="n">' + t.additions + '</span><span class="l">additions</span></span><span class="c7-count"><span class="n">' + t.replacements + '</span><span class="l">replacements</span></span><span class="c7-count"><span class="n">' + t.unchanged + '</span><span class="l">unchanged</span></span><span class="c7-count"><span class="n">' + t.unavailable + '</span><span class="l">not copyable</span></span><span class="c7-count"><span class="n">' + t.conflicts + '</span><span class="l">conflicts skipped</span></span></div>' +
        '<div class="c7-offline" style="border-color:var(--line)"><span class="sdot info"></span>' + esc(COPY.preview.credentialNote) + "</div>" +
        '<div class="c7-diff v2-surface" id="cpDiff"><div class="c7-diff-row" style="font-weight:800;font-size:10px;text-transform:uppercase;color:var(--ink-3)"><span>Kind</span><span>This project</span><span>Source</span></div></div>';
      var list = el("cpDiff"), rows = COPY.preview.rows;
      function addRows() {
        var w = PM2.window({ scrollTop: list.scrollTop, viewportHeight: 240, rowHeight: 30, total: rows.length });
        var h = "";
        for (var i = w.first; i < w.first + w.count; i++) {
          var rr = rows[i]; if (!rr) break;
          var s = PM2.inventory.byId[rr.settingId];
          var mine = STORE.get(rr.settingId);
          h += '<div class="c7-diff-row ' + rr.kind.slice(0, 4) + '"><span class="k">' + rr.kind.replace(/s$/, "") + '</span><span class="y">' + esc(s ? s.label : rr.settingId) + ' — ' + esc(JSON.stringify(mine.value)).slice(0, 26) + '</span><span class="s">' + (rr.kind === "unchanged" ? "same" : esc(JSON.stringify(rr.sourceValue)).slice(0, 26)) + "</span></div>";
        }
        while (list.children.length > 1) list.lastChild.remove();
        var pad3 = document.createElement("div"); pad3.style.height = w.padTop + "px";
        var win3 = document.createElement("div"); win3.style.position = "relative"; win3.style.transform = "translateY(" + w.padTop + "px)";
        win3.innerHTML = h;
        list.append(pad3, win3);
      }
      addRows();
      list.addEventListener("scroll", addRows);
      f.innerHTML = '<button class="c7-btn" id="copyBack">Back</button><span class="sp"></span><span style="font-size:11.5px;color:var(--ink-3)">Restore point created before any change.</span><button class="c7-btn primary" id="copyGo">Restore point & apply</button>';
      el("copyBack").addEventListener("click", function () { COPY.step = 1; drawCopy(); });
      el("copyGo").addEventListener("click", function () {
        COPY.step = 3;
        b.innerHTML = '<div class="c7-step">4 of 4 · Applying atomically…</div><div class="c7-work" id="cw"></div>'; f.innerHTML = "";
        var box = el("cw");
        var w = STORE.work({ kind: "copy", label: "Copy settings", phases: ["restore point", "apply", "verify"], steps: 10, fast: true });
        var un = STORE.subscribe("work", function () {
          box.innerHTML = "<b>" + esc(w.label) + "</b> — " + esc(w.note) + '<div class="bar"><div style="width:' + ((w.phaseI + 1) / 3 * 100) + '%"></div></div>';
          if (w.state === "done") {
            un();
            COPY.result = STORE.applyCopy(COPY.preview, COPY.cats);
            b.innerHTML = '<div class="c7-step">Done — verified & receipted</div><div class="c7-receipt"><b>' + COPY.result.counts.applied + " copied</b> · " + COPY.result.counts.skipped + " skipped.<br>Verified " + COPY.result.verify.checked + " / mismatches " + COPY.result.verify.mismatches + ". Receipt <b>" + esc(COPY.result.receipt.id) + "</b> · restore point <b>" + esc(COPY.result.restorePoint.label) + "</b>.<br>" + COPY.result.verify.note + "</div>" +
              '<div class="c7-offline" style="border-color:var(--line);margin-top:8px"><span class="sdot ok"></span><b>' + esc(PM2.currentProject.name) + "</b> and <b>" + esc(COPY.preview.source.name) + "</b> are independent from here on.</div>";
            f.innerHTML = '<button class="c7-btn" id="copyRoll">Rollback</button><span class="sp"></span><button class="c7-btn primary" id="copyDone">Done</button>';
            el("copyRoll").addEventListener("click", function () { STORE.rollback(COPY.result.restorePoint.id); openDrawer("Rollback complete", "Restored to the pre-copy restore point. Receipt recorded."); copyClose(); });
            el("copyDone").addEventListener("click", copyClose);
          }
        });
      });
    }
  }

  /* boot */
  var initial = PM2.routes.parse(location.hash);
  if (initial.domain || initial.manager || initial.mode) NAV.stack = [Object.assign({ domain: null }, initial)];
  render(NAV.top());
  if (initial.row || initial.object || initial.query) land(PM2.routes.planFor(initial), PM2.search.byRid(initial.resultId || "") || null);
  searchAttach(el("miniSearch"));
  window.__C7 = { PM2: PM2, STORE: STORE, NAV: NAV, state: state, pickResult: pickResult, selectRow: (typeof selectRow === "function") ? selectRow : null };
})();
</script>
</body>
</html>
