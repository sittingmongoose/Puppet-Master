<style>
/* ===== CONCEPT 09 — RETHEMED TOME TABS (GLM-5.2) =====
   Layout borrowed from the Tome reference: persistent chapter EDGE TABS (left),
   layered page depth with stable location, broad central canvas, domain tabs +
   manager-local tabs, roster + tabbed detail. Fully rethemed to Puppet Master:
   no parchment, brass, gears, book ornament, sepia, or fantasy language. */
.n9 { height: 100%; display: flex; min-width: 0; }
/* edge tabs */
.n9-edge { width: 84px; flex: none; display: flex; flex-direction: column; gap: 4px; padding: 10px 6px; border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; scrollbar-width: none; }
.n9-edge::-webkit-scrollbar { display: none; }
.n9-edge-tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px 8px; border-radius: var(--r-sm); border: 1px solid transparent; background: none; color: var(--ink-3); cursor: pointer; min-height: 58px; flex: none; }
.n9-edge-tab:hover { color: var(--ink); background: var(--surface-2); }
.n9-edge-tab[aria-selected="true"] { color: var(--ink); background: var(--surface-2); border-color: var(--line-2); box-shadow: inset 3px 0 0 var(--accent); }
.n9-edge-tab .vlabel { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; font-weight: 750; letter-spacing: .06em; max-height: 66px; overflow: hidden; flex: none; }
.n9-edge-tab .dot { position: absolute; top: 6px; right: 8px; }
.n9-edge-home { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px; border-radius: var(--r-sm); border: 1px solid transparent; background: none; color: var(--ink-2); cursor: pointer; flex: none; }
.n9-edge-home[aria-selected="true"] { color: var(--ink); background: var(--surface-2); border-color: var(--line-2); box-shadow: inset 3px 0 0 var(--accent); }
.n9-edge-home span { font-size: 10px; font-weight: 750; }
/* broad central canvas */
.n9-canvas { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; background: var(--bg); }
.n9-page { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line-2); box-shadow: var(--sh-2); transform: translateX(26px); opacity: 0; pointer-events: none; transition: transform var(--t-mid) var(--ease), opacity var(--t-mid) var(--ease); }
.n9-page[data-active="1"] { transform: none; opacity: 1; pointer-events: auto; }
.n9-page[data-depth="2"] { transform: translateX(52px) scale(.985); }
.n9-page[data-depth="2"][data-active="1"] { transform: none; }
.n9-stackbar { display: flex; align-items: center; gap: 7px; padding: 8px clamp(14px, 2.4vw, 30px); font-size: 11.5px; color: var(--ink-3); border-bottom: 1px solid var(--line); background: var(--surface-2); min-height: 34px; }
.n9-stackbar b { color: var(--ink); font-weight: 650; }
.n9-stackbar .pages { display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; }
.n9-stackbar .pg { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid var(--line); border-radius: var(--r-xs); background: var(--surface); white-space: nowrap; }
.n9-stackbar .pg[data-here="1"] { border-color: var(--accent-line); color: var(--ink); }
.n9-stackbar .sp { flex: 1; }
.n9-body { flex: 1; min-height: 0; overflow: auto; }
/* HOME on canvas */
.n9-home-inner { max-width: 1000px; margin: 0 auto; padding: clamp(18px, 3vw, 44px) clamp(16px, 3vw, 36px) 60px; }
.n9-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.n9-eyebrow b { color: var(--accent); }
.n9-h1 { font-size: clamp(25px, 3.2vw, 34px); font-weight: 800; letter-spacing: -.02em; margin: 4px 0 4px; }
.n9-sub { color: var(--ink-2); font-size: 13.5px; margin-bottom: 18px; max-width: 60ch; line-height: 1.6; }
.n9-searchwrap { position: relative; margin-bottom: 16px; }
.n9-search { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 17px; background: var(--surface-elev); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh-1); }
.n9-search:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.n9-search input { flex: 1; min-width: 0; background: none; border: none; outline: none; font-size: 16px; color: var(--ink); }
.n9-drop { position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 30; background: var(--surface-elev); border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: var(--sh-3); max-height: 380px; overflow: auto; padding: 4px; }
.n9-res { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-xs); cursor: pointer; }
.n9-res:hover, .n9-res[aria-selected="true"] { background: var(--surface-2); }
.n9-res .k { flex: none; width: 84px; font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-4); }
.n9-res .lbl { font-size: 13px; font-weight: 650; }
.n9-res .path { font-size: 11px; color: var(--ink-3); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.n9-res .why { font-size: 10.5px; color: var(--warn); flex: none; }
.n9-drop-empty { padding: 16px; text-align: center; font-size: 12.5px; color: var(--ink-2); }
.n9-note { display: flex; align-items: center; gap: 10px; padding: 11px 14px; margin-bottom: 14px; border: 1px solid color-mix(in srgb, var(--warn) 38%, var(--line)); border-radius: var(--r-sm); background: color-mix(in srgb, var(--warn-soft) 42%, var(--surface)); font-size: 12.5px; }
.n9-note button { margin-left: auto; }
.n9-att { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-elev); margin-bottom: 18px; }
.n9-att-row { display: flex; align-items: center; gap: 9px; padding: 8px 12px; font-size: 12.5px; border-bottom: 1px solid var(--line); }
.n9-att-row:last-child { border-bottom: none; }
.n9-att-row .d { color: var(--ink-3); font-size: 11.5px; }
.n9-att-row button { margin-left: auto; }
.n9-chapter-list { display: grid; gap: 6px; }
.n9-chrow { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 13px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-elev); cursor: pointer; }
.n9-chrow:hover { border-color: var(--accent-line); }
.n9-chrow .ic { width: 40px; height: 40px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--accent); display: grid; place-items: center; }
.n9-chrow .t { font-size: 14.5px; font-weight: 750; }
.n9-chrow .d { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
.n9-chrow .cnt { font-size: 11px; color: var(--ink-3); font-weight: 650; text-align: right; }
.n9-utils { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.n9-util { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 650; cursor: pointer; }
.n9-util:hover { color: var(--ink); border-color: var(--line-2); }
/* DOMAIN page */
.n9-dom-head { display: flex; align-items: center; gap: 12px; padding: 18px clamp(16px, 2.6vw, 32px) 8px; }
.n9-dom-head .ic { color: var(--accent); }
.n9-dom-head h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.015em; }
.n9-dom-head .meta { font-size: 12px; color: var(--ink-3); }
.n9-dom-head .sp { flex: 1; }
.n9-sections { padding: 4px clamp(16px, 2.6vw, 32px) 50px; max-width: 920px; }
.n9-secrow { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 13px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-elev); margin-bottom: 7px; cursor: pointer; }
.n9-secrow.mgr { background: var(--surface-2); }
.n9-secrow:hover { border-color: var(--accent-line); }
.n9-secrow .t { font-size: 13.5px; font-weight: 700; }
.n9-secrow .d { font-size: 11.5px; color: var(--ink-2); margin-top: 1px; }
.n9-secrow .cnt { font-size: 11px; color: var(--ink-3); }
.n9-sec-h { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 18px 0 9px; }
/* SETTINGS rows */
.n9-setrow { display: flex; gap: 16px; padding: 13px 15px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-elev); margin-bottom: 7px; }
.n9-setrow .info { flex: 1; min-width: 0; }
.n9-setrow .lbl { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.n9-setrow .desc { font-size: 12px; color: var(--ink-2); line-height: 1.55; margin-top: 3px; max-width: 68ch; }
.n9-setrow .ctl { flex: none; width: 210px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.n9-setrow[data-status="managed"] .ctl { opacity: .55; }
.n9-setrow[data-status="unavailable"] { opacity: .62; }
.n9-switch { position: relative; width: 40px; height: 22px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line); cursor: pointer; flex: none; }
.n9-switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.n9-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface-elev); transition: transform var(--t-fast) var(--ease); }
.n9-switch[aria-checked="true"]::after { transform: translateX(18px); }
.n9-sel { height: 30px; padding: 0 9px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-xs); color: var(--ink); font: inherit; font-size: 12px; max-width: 100%; }
.n9-range { width: 100%; accent-color: var(--accent); }
.n9-err { font-size: 11px; color: var(--bad); }
.n9-why button { font-size: 11.5px; color: var(--ink-4); background: none; border: none; cursor: pointer; font-weight: 650; padding: 0; }
.n9-details { margin-top: 7px; padding: 9px 11px; border: 1px dashed var(--line-2); border-radius: var(--r-xs); font-size: 11.5px; color: var(--ink-2); line-height: 1.6; }
/* MANAGER: roster + tabbed detail */
.n9-mgr-head { display: flex; align-items: center; gap: 11px; padding: 14px clamp(16px, 2.6vw, 32px) 8px; }
.n9-mgr-head h2 { margin: 0; font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 9px; }
.n9-mgr-head .sum { font-size: 12px; color: var(--ink-3); }
.n9-mgr-head .sp { flex: 1; }
.n9-mgr-body { flex: 1; min-height: 0; display: flex; }
.n9-roster { width: 330px; flex: none; border-right: 1px solid var(--line); overflow: auto; padding: 8px; }
.n9-roster-group { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 9px 8px 4px; }
.n9-rrow { display: flex; align-items: center; gap: 9px; padding: 9px 9px; border-radius: var(--r-xs); cursor: pointer; border: 1px solid transparent; }
.n9-rrow:hover { background: var(--surface-2); }
.n9-rrow[aria-selected="true"] { background: var(--surface-2); border-color: var(--line-2); }
.n9-rrow .lbl { font-size: 12.5px; font-weight: 650; }
.n9-rrow .sub { font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.n9-rrow .sdot { margin-left: auto; }
.n9-detail { flex: 1; min-width: 0; overflow: auto; padding: 16px clamp(16px, 2.2vw, 30px) 44px; }
.n9-detail h3 { margin: 0 0 2px; font-size: 17px; font-weight: 800; }
.n9-dtabs { display: flex; gap: 2px; margin: 8px 0 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.n9-dtab { padding: 7px 11px; font-size: 12px; font-weight: 650; color: var(--ink-3); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; }
.n9-dtab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.n9-detail .dsub { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; margin-bottom: 10px; }
.n9-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.n9-kv { display: grid; grid-template-columns: 140px 1fr; gap: 4px 13px; font-size: 12.5px; margin-bottom: 12px; }
.n9-kv .k { color: var(--ink-3); font-weight: 650; }
.n9-kv .v { color: var(--ink); line-height: 1.5; overflow-wrap: anywhere; }
.n9-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.n9-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-xs); background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 650; cursor: pointer; }
.n9-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.n9-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.n9-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.n9-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.n9-table td.mut { color: var(--ink-2); }
.n9-offline { display: flex; gap: 9px; padding: 10px 12px; margin: 8px 0; border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); border-radius: var(--r-xs); background: color-mix(in srgb, var(--warn-soft) 45%, var(--surface)); font-size: 12px; }
.n9-work { border: 1px solid var(--line); border-radius: var(--r-xs); padding: 11px 13px; margin: 8px 0; font-size: 12px; }
.n9-work .bar { height: 5px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin-top: 7px; }
.n9-work .bar > div { height: 100%; background: var(--accent); transition: width var(--t-mid) var(--ease); }
.n9-setup { border: 1px solid var(--line-2); border-radius: var(--r-xs); padding: 12px 14px; margin: 8px 0; }
.n9-setup ol { margin: 4px 0 0; padding-left: 18px; font-size: 11.5px; color: var(--ink-2); line-height: 1.7; }
.n9-skel { border-radius: var(--r-xs); background: var(--surface-2); animation: v2-shimmer 1.4s ease-in-out infinite; }
/* drawer + copy */
.n9-drawer { position: absolute; right: 0; top: 0; bottom: 0; width: min(420px, 92%); z-index: 45; background: var(--surface-elev); border-left: 1px solid var(--line-2); box-shadow: var(--sh-3); transform: translateX(102%); transition: transform var(--t-mid) var(--ease); display: flex; flex-direction: column; }
.n9-drawer[data-open="1"] { transform: none; }
.n9-drawer-head { display: flex; align-items: center; gap: 8px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
.n9-drawer-head h4 { margin: 0; font-size: 14px; flex: 1; }
.n9-drawer-body { flex: 1; overflow: auto; padding: 13px 15px; font-size: 12.5px; line-height: 1.65; color: var(--ink-2); }
.n9-drawer-body b { color: var(--ink); }
.n9-veil { position: absolute; inset: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 58%, transparent); display: grid; place-items: center; padding: 16px; }
.n9-copy { width: min(760px, 100%); max-height: calc(100% - 14px); display: flex; flex-direction: column; background: var(--surface-elev); border: 1px solid var(--line-2); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sh-3); }
.n9-copy-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.n9-copy-head h3 { margin: 0; font-size: 15.5px; font-weight: 800; flex: 1; }
.n9-copy-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; }
.n9-copy-foot { display: flex; gap: 8px; padding: 11px 16px; border-top: 1px solid var(--line); }
.n9-copy-foot .sp { flex: 1; }
.n9-step { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.n9-src { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--r-sm); margin-bottom: 7px; cursor: pointer; background: var(--surface); }
.n9-src[aria-selected="true"] { border-color: var(--accent-line); background: var(--surface-2); }
.n9-cat { display: grid; grid-template-columns: 17px 1fr; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); margin-bottom: 7px; cursor: pointer; background: var(--surface); }
.n9-cat[aria-selected="true"] { border-color: var(--accent-line); background: var(--surface-2); }
.n9-counts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.n9-count { padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-xs); font-size: 11px; color: var(--ink-3); }
.n9-count b { font-size: 15px; color: var(--ink); margin-right: 4px; }
.n9-cplist { border: 1px solid var(--line); border-radius: var(--r-xs); height: 190px; overflow: auto; }
.n9-receipt { border: 1px solid color-mix(in srgb, var(--ok) 40%, var(--line)); background: color-mix(in srgb, var(--ok-soft) 38%, var(--surface)); border-radius: var(--r-xs); padding: 12px; font-size: 12.5px; }
/* topbar */
.n9-crumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); min-width: 0; overflow: hidden; }
.n9-crumb b { color: var(--ink); white-space: nowrap; }
.n9-proj { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.n9-proj b { color: var(--ink); }
.n9-minis { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; min-width: 170px; max-width: 300px; flex: 1; border: 1px solid var(--line); border-radius: var(--r-xs); background: var(--surface); }
.n9-minis input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--ink); font-size: 12.5px; }
@media (max-width: 999px) {
  .n9-edge { width: 64px; }
  .n9-edge-tab .vlabel { font-size: 9px; max-height: 60px; }
  .n9-mgr-body { flex-direction: column; }
  .n9-roster { width: auto; border-right: none; border-bottom: 1px solid var(--line); max-height: 36%; flex: none; }
  .n9-setrow { flex-direction: column; }
  .n9-setrow .ctl { width: 100%; align-items: flex-start; }
}
@media (max-width: 899px) {
  .pm-shell { grid-template-columns: 60px 1fr var(--chat-w, 0px); grid-template-areas: "topbar topbar topbar" "activity stage chat" "footer footer footer"; }
  .n9 { flex-direction: column; }
  .n9-edge { width: auto; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 6px; }
  .n9-edge-tab { min-height: 0; flex-direction: row; padding: 8px 10px; }
  .n9-edge-tab .vlabel { writing-mode: horizontal-tb; transform: none; max-height: none; }
  .n9-edge-home { flex-direction: row; }
  .n9-page { position: absolute; }
  .n9-crumb { display: none; }
}
@media (min-width: 1900px) { .n9-home-inner { max-width: 1180px; } .n9-roster { width: 380px; } }

/* ===== squeeze: 760px topbar survival (added by verification pass) ===== */
@media (max-width: 899px) {
  .pm-topbar .pm-brand { display: none; }
  .pm-topbar { gap: 6px; }
  #themeBtn, #closeBtn, #navToggle { font-size: 0; gap: 0; padding: 0 9px; }
  #themeBtn svg, #closeBtn svg, #navToggle svg { margin-right: 0; }
  #projChip, .d5-projchip, .e6-proj, .c7-proj, .t8-proj, .n9-proj, .m10-proj, .o11-proj { max-width: 130px; overflow: hidden; white-space: nowrap; }
  .d5-mini-search, .e6-minis, .c7-minis, .t8-minis, .n9-minis, .m10-cmdinput, .o11-search { min-width: 90px !important; }
}
</style>
</head>
<body>
<div class="pm-shell" id="shell" data-rail="closed" data-chat="closed">
  <header class="pm-topbar">
    <span class="pm-brand">PUPPET&nbsp;MASTER</span>
    <nav class="n9-crumb" id="crumb" aria-label="Settings location"></nav>
    <span class="pm-spacer"></span>
    <div class="n9-minis" id="miniWrap" hidden><span id="miniIcon"></span><input id="miniSearch" type="search" placeholder="Search settings" aria-label="Search settings" autocomplete="off"></div>
    <span class="n9-proj" id="projChip"></span>
    <button class="n9-btn" id="themeBtn"></button>
    <button class="n9-btn" id="closeBtn"></button>
  </header>
  <nav class="pm-activity" aria-label="Activity Bar" id="activity"></nav>
  <aside class="pm-rail" data-hidden></aside>

<script>
(function () {

  el("themeBtn").innerHTML = PM2.svg("settings", 13) + "Friendly Dark";

  el("activity").innerHTML = ["home", "settings", "terminal", "stack", "users", "search"].map(function (i) { return '<button class="pm-act" aria-label="' + i + '">' + PM2.svg(i, 18) + "</button>"; }).join("");
  el("footer").innerHTML = "<span><b>Settings</b> · " + NS + "</span><span class='pm-spacer'></span><span>828 settings · 12 chapters</span>";

  var menu = null;
  function openMenu(anchor, items, onPick) {

    menu = m;
  }
  function closeMenu() { if (menu) { menu.remove(); menu = null; return true; } return false; }
  document.addEventListener("click", function (e) { if (menu && !menu.contains(e.target)) closeMenu(); }, true);
  el("themeBtn").addEventListener("click", function () {
    var themes = PM2.mgrById["mgr.appearance"].themes;
    openMenu(el("themeBtn"), themes.map(function (t) { return { label: t }; }).concat([{ sep: 1 }, { label: "Reduced motion: " + (RM() ? "on" : "off") }]), function (it) {
      if (it.label.indexOf("Reduced") === 0) { document.documentElement.setAttribute("data-reduced-motion", RM() ? "0" : "1"); return; }

  });

  var state = { view: "home", domain: null, section: null, manager: null, object: null, tab: 0, hydrated: {}, lastQuery: "", lastRid: null };
  var lastRendered = "", pendingRestore = null;

    if (s === lastRendered) return;

  });
  window.addEventListener("hashchange", function () { var r = PM2.routes.parse(location.hash); if (PM2.routes.str(r) !== PM2.routes.str(NAV.top())) NAV.go(r); });
  function goHome() { state.view = "home"; state.domain = state.section = state.manager = null; NAV.reset({ domain: null }); render(NAV.top()); }

  /* search */
  var drop = null, dropSel = -1;
  function searchAttach(input) {
    var wrap = input.parentElement;

    drop.addEventListener("mousedown", function (e) {

      if (row.dataset.rid.indexOf("suggest:") === 0) { var q = row.dataset.rid.slice(8); var inp = wrap.querySelector("input"); inp.value = q; state.lastQuery = q; showDrop(wrap, PM2.search.query(q)); return; }
      pickResult(row.dataset.rid);
    });
  }
  function hideDrop() { if (drop) { drop.remove(); drop = null; } }
  document.addEventListener("click", function (e) { if (drop && !e.target.closest(".n9-searchwrap") && !e.target.closest(".n9-minis")) hideDrop(); });
  function pickResult(rid) {
    var entry = PM2.search.byRid(rid); if (!entry) return;
    state.lastRid = rid; hideDrop();
    if (entry.type === "intentional_help_result" && entry.dest.mode === "copy") { NAV.go({ mode: "copy" }); openCopy(); return; }
    var plan = PM2.routes.planFor(entry.dest);

    land(plan, entry);
  }
  function land(plan, entry) {
    var tries = 0;
    (function go() {
      var target = null;
      if (plan.route.row) target = stage.querySelector('[data-row="' + plan.route.row + '"]');
      if (!target && plan.route.object) target = stage.querySelector('[data-obj="' + plan.route.object + '"]');
      if (!target && plan.route.manager) target = stage.querySelector('[data-mgr="' + plan.route.manager + '"]');

      }
    })();
  }

  /* layered pages: one page element per nav depth */
  var pages = [];
  function mountPage(depth) {
    while (pages.length >= depth) { var p = pages.pop(); p.remove(); }
    var pg = document.createElement("div");

    return pg;
  }
  function drawStackbar() {
    var html = '<span>' + PM2.svg("layers", 13) + "</span><span class=\"pages\">";
    var names = ["Home"];

    el("stackbar").innerHTML = html;
    var b = el("backBtn"); if (b) b.addEventListener("click", function () { NAV.back(); });
  }
  function render(route) {
    closeDrawer(); hideDrop();
    if (route.manager && PM2.mgrById[route.manager]) renderManager(route);
    else if (route.domain === "all") renderAll();
    else if (route.domain) { state.view = "domain"; renderDomain(route); }
    else if (route.mode === "copy") { renderHome(); openCopy(); }
    else renderHome();
    drawEdge(route); renderCrumb(route);
    el("miniWrap").hidden = state.view === "home";
  }
  function renderCrumb(route) {
    var html = "<b>Settings</b>";
    if (route.domain === "all") html += ' <span>›</span> All settings';
    else PM2.routes.crumb(route).forEach(function (p) { html += ' <span>›</span> ' + esc(p); });
    el("crumb").innerHTML = html;
  }
  function drawEdge(route) {
    var html = '<button class="n9-edge-home" data-nav="home" aria-selected="' + (!route.domain ? "true" : "false") + '">' + PM2.svg("home", 17) + "<span>Home</span></button>";
    PM2.inventory.categories.forEach(function (c) {
      var attn = PM2.managers.some(function (m) { return m.domain === c.id && m.health.kind !== "ok"; });

    html += '<button class="n9-edge-home" data-nav="copy">' + PM2.svg("layers", 17) + "<span>Copy</span></button>";

  }

  /* HOME */
  function renderHome() {

    var pg = mountPage(1);
    var html = '<div class="n9-body v2-surface"><div class="n9-home-inner">';

    html += '<div class="n9-searchwrap"><div class="n9-search">' + PM2.svg("search", 17) + '<input id="homeSearch" type="search" placeholder="Search settings, managers, actions…" aria-label="Universal search" autocomplete="off"><span class="v2kbd">/</span></div></div>';

    html += '<div class="n9-att">' +
      '<div class="n9-att-row"><span class="sdot warn"></span><span>Codex CLI setup required</span><span class="d">explicit install</span><button class="n9-btn" data-dest="d1">Open</button></div>' +
      '<div class="n9-att-row"><span class="sdot warn"></span><span>ntfy offline</span><span class="d">since 08-17</span><button class="n9-btn" data-dest="d2">Open</button></div>' +
      '<div class="n9-att-row"><span class="sdot info"></span><span>Vault migration awaits restart</span><span class="d">storage</span><button class="n9-btn" data-dest="d3">Open</button></div></div>';
    html += '<div class="n9-sec-h">Chapters</div><div class="n9-chapter-list">';

    });
    html += "</div>";
    html += '<div class="n9-utils"><button class="n9-util" data-nav="all">' + PM2.svg("list", 13) + 'All settings index</button><button class="n9-util" data-nav="copy">' + PM2.svg("layers", 13) + 'Copy settings from another project</button></div>';
    html += "</div></div>";

    var DESTS = { d1: { manager: "mgr.provider", object: "prov.codex-cli" }, d2: { manager: "mgr.notifications", object: "ntf.ntfy" }, d3: { manager: "mgr.storage", object: "sto.migrate" } };
    pg.querySelector("#noteGo").addEventListener("click", function () { NAV.go(DESTS.d1); land(PM2.routes.planFor(DESTS.d1)); });
    pg.querySelectorAll("[data-dest]").forEach(function (b) { b.addEventListener("click", function () { var d = DESTS[b.dataset.dest]; NAV.go(d); land(PM2.routes.planFor(d)); }); });

    pg.querySelectorAll(".n9-util").forEach(function (b) { b.addEventListener("click", function () { var v = b.dataset.nav; if (v === "all") NAV.go({ domain: "all" }); else if (v === "copy") openCopy(); }); });
  }

  /* DOMAIN */
  function renderDomain(route) {

  /* setting row */

      draw2(); list.addEventListener("scroll", draw2);
      f.innerHTML = '<button class="n9-btn" id="copyBack">Back</button><span class="sp"></span><button class="n9-btn primary" id="copyGo">Restore point & apply</button>';
      el("copyBack").addEventListener("click", function () { COPY.step = 1; drawCopy(); });
      el("copyGo").addEventListener("click", function () {
        COPY.step = 3;
        b.innerHTML = '<div class="n9-step">4 of 4 · Applying atomically…</div><div class="n9-work" id="cw"></div>'; f.innerHTML = "";
        var box = el("cw");
        var w = STORE.work({ kind: "copy", label: "Copy settings", phases: ["restore point", "apply", "verify"], steps: 10, fast: true });
        var un = STORE.subscribe("work", function () {
          box.innerHTML = "<b>" + esc(w.label) + "</b> — " + esc(w.note) + '<div class="bar"><div style="width:' + ((w.phaseI + 1) / 3 * 100) + '%"></div></div>';
          if (w.state === "done") {
            un();
            COPY.result = STORE.applyCopy(COPY.preview, COPY.cats);
            b.innerHTML = '<div class="n9-step">Done — verified & receipted</div><div class="n9-receipt"><b>' + COPY.result.counts.applied + " values copied</b> · " + COPY.result.counts.skipped + " skipped. Receipt <b>" + esc(COPY.result.receipt.id) + "</b> · restore point <b>" + esc(COPY.result.restorePoint.label) + "</b>.<br>" + COPY.result.verify.note + "</div>" +
              '<div class="n9-offline" style="border-color:var(--line);margin-top:8px"><span class="sdot ok"></span><b>' + esc(PM2.currentProject.name) + "</b> and <b>" + esc(COPY.preview.source.name) + "</b> are independent from here on.</div>";
            f.innerHTML = '<button class="n9-btn" id="copyRoll">Rollback</button><span class="sp"></span><button class="n9-btn primary" id="copyDone">Done</button>';
            el("copyRoll").addEventListener("click", function () { STORE.rollback(COPY.result.restorePoint.id); openDrawer("Rollback complete", "Restored to the pre-copy restore point. Receipt recorded."); copyClose(); });
            el("copyDone").addEventListener("click", copyClose);
          }
        });
      });
    }
  }

  /* boot */
  var initial = PM2.routes.parse(location.hash);
  if (initial.domain || initial.manager || initial.mode) NAV.stack = [Object.assign({ domain: null }, initial)];
  render(NAV.top());
  if (initial.row || initial.object || initial.query) land(PM2.routes.planFor(initial), PM2.search.byRid(initial.resultId || "") || null);
  searchAttach(el("miniSearch"));
  window.__C9 = { PM2: PM2, STORE: STORE, NAV: NAV, state: state, pickResult: pickResult };
})();
</script>
