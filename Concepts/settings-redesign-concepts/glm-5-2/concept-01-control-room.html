<!doctype html>
<html lang="en" data-theme="friendly-dark" data-reduced-motion="0" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>01 Control Room — GLM-5.2 Settings</title>
  <link rel="stylesheet" href="assets/themes.css">
  <link rel="stylesheet" href="assets/shell.css">
  <link rel="stylesheet" href="assets/managers.css">
  <style>
    /* ===== CONCEPT 01 CONTROL ROOM — editorial/command IA ===== */
    .pm-shell { grid-template-areas:
      "topbar topbar topbar topbar"
      "activity rail stage chat"
      "footer footer footer footer"; }

    /* HOME: command center */
    .cr-home { display: flex; flex-direction: column; height: 100%; padding: clamp(16px,3vw,40px); overflow: auto; }
    .cr-hero { max-width: 1100px; margin: 0 auto; width: 100%; }
    .cr-eyebrow { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .cr-eyebrow .cr-num { color: var(--ink-3); margin-right: 8px; }
    .cr-h1 { font-size: clamp(26px,3.4vw,40px); font-weight: 800; letter-spacing: -.03em; margin: 6px 0 4px; line-height: 1.05; }
    .cr-h1 .cr-thesis { color: var(--accent); }
    .cr-sub { color: var(--ink-2); font-size: 14px; max-width: 60ch; margin-bottom: 18px; }

    /* dominant omni-search — the primary verb */
    .cr-searchwrap { position: relative; margin-bottom: 22px; }
    .cr-search {
      display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 56px;
      background: var(--surface-elev); border: 1px solid var(--line); border-radius: var(--r-lg);
      box-shadow: var(--sh-2); transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
    }
    .cr-search:focus-within { border-color: var(--accent-line); box-shadow: var(--sh-2), 0 0 0 3px var(--accent-soft); }
    .cr-search .cr-sicon { color: var(--ink-3); flex: none; }
    .cr-search input { flex: 1; background: transparent; border: none; outline: none; font-size: 16px; color: var(--ink); }
    .cr-search .cr-kbd { font-size: 11px; color: var(--ink-3); padding: 2px 7px; border: 1px solid var(--line); border-radius: var(--r-xs); }
    /* results dropdown */
    .cr-results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--surface-elev); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh-3); max-height: 360px; overflow: auto; z-index: 20; padding: 6px; }
    .cr-result { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--r-sm); cursor: pointer; }
    .cr-result:hover, .cr-result.focus { background: var(--surface-2); }
    .cr-result .cr-rkind { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); width: 78px; flex: none; }
    .cr-result strong { font-size: 13px; }
    .cr-result .muted { font-size: 12px; }

    /* notices — needs attention / continue / recommended */
    .cr-notices { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 22px; }
    .cr-notice { padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
    .cr-notice.attention { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
    .cr-notice.continue { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
    .cr-notice.recommended { border-color: color-mix(in srgb, var(--info) 40%, var(--line)); }
    .cr-notice-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .cr-notice-kind { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .cr-notice.attention .cr-notice-kind { color: var(--bad); }
    .cr-notice.continue .cr-notice-kind { color: var(--warn); }
    .cr-notice.recommended .cr-notice-kind { color: var(--info); }
    .cr-notice h3 { margin: 0; font-size: 14px; font-weight: 700; line-height: 1.3; }
    .cr-notice .cr-conseq { color: var(--ink-2); font-size: 12px; }
    .cr-notice-actions { display: flex; gap: 8px; margin-top: 4px; }

    /* primary destinations — LARGE EDITORIAL PANELS, never pills */
    .cr-dests-label { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
    .cr-dests { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .cr-dest {
      display: flex; flex-direction: column; gap: 8px; padding: 18px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
      cursor: pointer; text-align: left; color: inherit;
      transition: transform var(--t-mid) var(--ease), border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
      min-height: 120px;
    }
    .cr-dest:hover { transform: translateY(-3px); border-color: var(--accent-line); background: var(--surface-2); box-shadow: var(--sh-2); }
    .cr-dest-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .cr-dest-icon { width: 36px; height: 36px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); border-radius: var(--r-sm); flex: none; }
    .cr-dest h3 { margin: 0; font-size: 16px; font-weight: 700; }
    .cr-dest .cr-dest-purpose { color: var(--ink-2); font-size: 12px; line-height: 1.5; }
    .cr-dest-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
    .cr-dest-open { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--accent); }

    /* ===== WORKSPACE: book-TOC (left vertical index + continuous document) ===== */
    .cr-workspace { display: grid; grid-template-columns: 240px 1fr; height: 100%; min-height: 0; }
    .cr-toc { border-right: 1px solid var(--line); background: var(--surface); overflow: auto; padding: 14px 10px; }
    .cr-toc-search { margin-bottom: 12px; }
    .cr-toc-search .field { width: 100%; }
    .cr-toc-cat { display: block; width: 100%; text-align: left; background: transparent; border: none; color: var(--ink-2); padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .cr-toc-cat:hover { background: var(--surface-2); color: var(--ink); }
    .cr-toc-cat.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .cr-toc-cat .cr-toc-glyph { width: 18px; flex: none; opacity: .7; }
    .cr-toc-subs { padding-left: 26px; margin: 2px 0 6px; }
    .cr-toc-sub { display: block; width: 100%; text-align: left; background: transparent; border: none; color: var(--ink-3); padding: 5px 8px; border-radius: var(--r-xs); cursor: pointer; font-size: 12px; transition: color var(--t-mid) var(--ease), background var(--t-fast) var(--ease); position: relative; }
    .cr-toc-sub:hover { color: var(--ink); background: var(--surface-2); }
    .cr-toc-sub.active { color: var(--accent); font-weight: 600; background: var(--accent-soft); }
    .cr-toc-sub.active::before { content: ""; position: absolute; left: 0; top: 20%; bottom: 20%; width: 2px; background: var(--accent); border-radius: 99px; }
    .cr-doc { overflow: auto; padding: clamp(16px,3vw,40px); }
    .cr-doc-inner { max-width: 860px; margin: 0 auto; }
    .cr-doc h2 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.02em; }
    .cr-doc .cr-doc-purpose { color: var(--ink-2); margin-bottom: 18px; font-size: 13px; }
    .cr-sub-section { padding: 14px 0; scroll-margin-top: 16px; }
    .cr-sub-section + .cr-sub-section { border-top: 1px solid var(--line-2); }
    .cr-sub-section h3 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
    .cr-sub-section h3 .cr-sub-tag { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

    /* MANAGER view reuses .mgr */
    .cr-manager { height: 100%; }
    .cr-backbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .cr-backbar .cr-backcrumb { color: var(--ink-3); font-size: 12px; }
    .cr-backbar .cr-backcrumb b { color: var(--ink); }

    /* home config strip (theme/reduced motion) */
    .cr-configstrip { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }

    /* concept motion: editorial cinematic — staggered reveals */
    [data-reduced-motion="0"] .cr-dest, [data-reduced-motion="0"] .cr-notice {
      opacity: 0; transform: translateY(8px); animation: cr-rise 520ms var(--ease-settle) forwards;
    }
    [data-reduced-motion="0"] .cr-dest:nth-child(2) { animation-delay: 60ms; }
    [data-reduced-motion="0"] .cr-dest:nth-child(3) { animation-delay: 120ms; }
    [data-reduced-motion="0"] .cr-dest:nth-child(4) { animation-delay: 180ms; }
    [data-reduced-motion="0"] .cr-dest:nth-child(n+5) { animation-delay: 240ms; }
    @keyframes cr-rise { to { opacity: 1; transform: none; } }

    /* narrow/squeezed: collapse TOC into a drawer */
    .pm-shell[data-rail="open"] .cr-squeezed .cr-toc { display: none; }
    @media (max-width: 900px) {
      .cr-workspace { grid-template-columns: 1fr; }
      .cr-toc { position: fixed; top: var(--shell-h); bottom: var(--footer-h); left: 60px; width: 240px; z-index: 30; box-shadow: var(--sh-3); transform: translateX(-110%); transition: transform var(--t-mid) var(--ease); }
      .cr-toc.open { transform: none; }
      .cr-drawerbtn { display: inline-flex !important; }
    }
    .cr-drawerbtn { display: none; }
  </style>
</head>
<body>
  <div class="pm-shell" data-rail="open" data-chat="closed">
    <!-- topbar -->
    <!-- activity, rail, stage, chat, footer injected by JS -->
  </div>
  <!-- Static visible model label (also satisfies validate.py's static-source check).
       The JS topbar chip is an enhancement; this badge persists in the page source. -->
  <noscript>
    <div style="position:fixed;top:8px;right:12px;z-index:99;padding:3px 9px;border:1px solid #6fc6e8;color:#6fc6e8;border-radius:999px;font:bold 10px sans-serif">GLM-5.2</div>
  </noscript>
  <a data-concept-model="GLM-5.2" href="index.html" title="GLM-5.2 settings concept"
     style="position:fixed;bottom:var(--footer-h,30px);right:12px;z-index:40;display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--accent-line,#6fc6e8);background:var(--accent-soft,rgba(111,198,232,.14));color:var(--accent,#6fc6e8);border-radius:999px;font:bold 9px sans-serif;text-decoration:none;opacity:.85">GLM-5.2 · 01</a>

  <script src="assets/icons.svg.js"></script>
  <script src="assets/demo-data.js"></script>
  <script src="concept-hub-bridge.js"></script>
  <script src="assets/state.js"></script>
  <script src="assets/motion.js"></script>
  <script src="assets/shared.js"></script>
  <script src="assets/managers.js"></script>
  <script src="assets/spellcheck.js"></script>
  <script>
    (function () {
      "use strict";
      PM.jumpOffset = function () { return 80; };

      /* ---------- SHELL ---------- */
      function shell() {
        var s = document.querySelector(".pm-shell");
        s.innerHTML =
          PM.shared.topbar('<span data-crumb>Settings</span>', "01 Control Room") +
          '<nav class="pm-activity" aria-label="Surrounding navigation">' + PM.shared.activityButtons(PM.state.rail) + '</nav>' +
          PM.shared.rail() +
          '<main class="pm-stage" data-stage></main>' +
          PM.shared.chat() +
          PM.shared.footer();
        PM.shared.wireShell();
      }

      /* ---------- HOME ---------- */
      function home() {
        var dests = PM_DEMO.destinations.map(function (d, i) {
          var cat = PM.catById(d.target.split(".")[0]);
          var icon = d.manager ? PM.managers[d.manager].icon : (cat && cat.id === "appearance" ? "theme" : cat && cat.id === "system" ? "server" : "grid");
          var statusChip = d.statusKind && d.statusKind !== "neutral"
            ? '<span class="chip ' + d.statusKind + '">' + d.status + '</span>'
            : '<span class="chip">' + d.status + '</span>';
          return [
            '<button class="cr-dest" data-dest="' + d.target + '" ' + (d.manager ? 'data-manager="' + d.manager + '"' : "") + '>',
              '<div class="cr-dest-top">',
                '<span class="cr-dest-icon">' + PM.svg(icon, 18) + '</span>',
                statusChip,
              '</div>',
              '<h3>' + d.title + '</h3>',
              '<span class="cr-dest-purpose">' + d.purpose + '</span>',
              '<div class="cr-dest-foot">',
                '<span class="cr-dest-open">Open ' + PM.svg("chevron", 13) + '</span>',
              '</div>',
            '</button>'
          ].join("");
        }).join("");

        var notices = [];
        ["attention","continue","recommended"].forEach(function (kind) {
          PM_DEMO.notices[kind].forEach(function (n) {
            var kindLabel = { attention:"Needs attention", continue:"Continue setup", recommended:"Recommended" }[kind];
            notices.push([
              '<div class="cr-notice ' + kind + '">',
                '<div class="cr-notice-head"><span class="cr-notice-kind">' + kindLabel + '</span></div>',
                '<h3>' + n.headline + '</h3>',
                '<span class="cr-conseq">' + n.consequence + '</span>',
                '<div class="cr-notice-actions">',
                  '<button class="btn sm primary" data-notice="' + n.id + '" data-target="' + n.target + '">' + n.action + '</button>',
                  n.secondary ? '<button class="btn sm ghost">' + n.secondary + '</button>' : '',
                '</div>',
              '</div>'
            ].join(""));
          });
        });

        var stage = document.querySelector("[data-stage]");
        stage.innerHTML = [
          '<div class="cr-home">',
            '<div class="cr-hero">',
              '<div class="cr-eyebrow"><span class="cr-num">Concept 01</span>Control Room · GLM-5.2</div>',
              '<h1 class="cr-h1">Settings as <span class="cr-thesis">mission control.</span></h1>',
              '<p class="cr-sub">One dominant search is the primary verb. Important areas are large editorial panels with a title, purpose, and live status — never filter chips. Notices carry one clear action.</p>',
              '<div class="cr-searchwrap">',
                '<div class="cr-search">',
                  '<span class="cr-sicon">' + PM.svg("search", 20) + '</span>',
                  '<input type="search" placeholder="Search settings, areas, actions…" data-search-input aria-label="Search settings">',
                  '<span class="cr-kbd">⌘K</span>',
                '</div>',
                '<div class="cr-results hidden" data-results></div>',
              '</div>',
              '<div class="cr-configstrip">',
                '<button class="btn sm" data-go-workspace>Browse all areas</button>',
                PM.shared.themePicker(),
              '</div>',
              PM.shared.recentWork(),
              PM.shared.ownedStrip("c1"),
              '<div class="cr-dests-label">All areas</div>',
              '<div class="cr-notices">' + notices.join("") + '</div>',
              '<div class="cr-dests">' + dests + '</div>',
            '</div>',
          '</div>'
        ].join("");
        wireHome();
      }

      function wireHome() {
        // search
        var inp = document.querySelector("[data-search-input]");
        var res = document.querySelector("[data-results]");
        inp.addEventListener("input", function () {
          var q = this.value;
          var results = PM.runSearch(q);
          if (!q.trim() || !results.length) { res.classList.add("hidden"); res.innerHTML = ""; return; }
          res.classList.remove("hidden");
          res.innerHTML = results.map(function (r, i) {
            var km = PM.shared.searchKindMeta(r.kind);
            var sub = r.expl ? '<span class="muted"> — ' + r.expl.slice(0,60) + (r.expl.length>60?"…":"") + '</span>' : "";
            var target = r.manager ? 'data-r-manager="' + r.manager + '"' : 'data-r-cat="' + r.cat + '" data-r-sub="' + (r.sub||"") + '"';
            return '<div class="cr-result ' + (i===0?"focus":"") + '" ' + target + ' tabindex="0"><span class="cr-rkind ' + km.cls + '">' + km.label + '</span><div class="col"><strong>' + r.label + '</strong>' + sub + '</div></div>';
          }).join("");
          // C2 motion: search results cascade in (editorial cinematic, 30ms stagger)
          PM.motion.staggerIn(res, ".cr-result", { step: 28, duration: 260, axis: "y" });
        });
        inp.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            var first = res.querySelector(".cr-result");
            if (first) first.click();
          }
        });
        res.addEventListener("click", function (e) {
          var r = e.target.closest(".cr-result"); if (!r) return;
          var mgr = r.getAttribute("data-r-manager");
          if (mgr) { PM.openManager(mgr); render(); return; }
          var cat = r.getAttribute("data-r-cat"), sub = r.getAttribute("data-r-sub");
          inp.value = ""; res.classList.add("hidden");
          PM.openCategory(cat, sub); render();
        });
        // destinations
        document.querySelectorAll(".cr-dest").forEach(function (d) {
          d.addEventListener("click", function () {
            var mgr = this.getAttribute("data-manager");
            var t = this.getAttribute("data-dest");
            if (mgr) { PM.openManager(mgr); }
            else { PM.openCategory(t.split(".")[0], t.split(".")[1]); }
            render();
          });
        });
        // notices
        document.querySelectorAll("[data-notice]").forEach(function (n) {
          n.addEventListener("click", function () {
            var t = this.getAttribute("data-target");
            if (t.indexOf(".") > -1) PM.openCategory(t.split(".")[0], t.split(".")[1]);
            else PM.openCategory(t);
            render();
          });
        });
        document.querySelector("[data-go-workspace]").addEventListener("click", function () {
          PM.openCategory("general"); render();
        });
        PM.shared.wireThemePicker();
        PM.shared.wireRecentWork();
        PM.shared.wireOwnedStrip(document.querySelector("[data-stage]"));
        PM.shared.wireShell();
      }

      /* ---------- WORKSPACE (book-TOC) ---------- */
      function workspace() {
        var stage = document.querySelector("[data-stage]");
        var cat = PM.catById(PM.state.activeCat);
        var toc = PM.categories.map(function (c) {
          var subs = c.sub.map(function (s) {
            return '<button class="cr-toc-sub' + (c.id===PM.state.activeCat && s.id===PM.state.activeSub?" active":"") + '" data-toc-sub="' + s.id + '" data-toc-cat="' + c.id + '">' + s.title + '</button>';
          }).join("");
          var open = c.id === PM.state.activeCat;
          return [
            '<button class="cr-toc-cat' + (open?" active":"") + '" data-toc-cat="' + c.id + '">',
              '<span class="cr-toc-glyph">' + PM.svg(tocIcon(c.id), 16) + '</span>',
              c.title,
            '</button>',
            open ? '<div class="cr-toc-subs">' + subs + '</div>' : ''
          ].join("");
        }).join("");

        // continuous document of all subcategories for the active category
        var doc = cat.sub.map(function (s) {
          var key = cat.id + "." + s.id;
          var body = s.manager ? PM.shared.managerPromo(s.manager) : PM.shared.subList(cat.id, s.id);
          var managerNote = s.manager ? '<a class="cr-sub-manage" data-sub-manager="' + s.manager + '" style="margin-left:auto;font-size:11px">Open ' + PM.managers[s.manager].title + ' ' + PM.svg("external",12) + '</a>' : "";
          return [
            '<section class="cr-sub-section" data-sub-section="' + s.id + '">',
              '<h3>' + s.title + managerNote + ' <span class="cr-sub-tag">' + cat.title + '</span></h3>',
              '<div class="set-list">' + body + '</div>',
            '</section>'
          ].join("");
        }).join("");

        stage.innerHTML = [
          '<div class="cr-workspace">',
            '<aside class="cr-toc" id="crToc">',
              '<div class="cr-toc-search"><span class="field"><span class="muted">' + PM.svg("search",14) + '</span><input type="search" data-toc-search placeholder="Search" aria-label="Search settings"></span></div>',
              toc,
            '</aside>',
            '<div class="cr-doc" data-scroller>',
              '<div class="cr-backbar" style="position:sticky;top:0;background:var(--surface);z-index:5;margin:-16px -40px 16px;padding:10px 40px;border-bottom:1px solid var(--line)">',
                '<button class="btn sm ghost" data-go-home>' + PM.svg("back",13) + 'Home</button>',
                '<span class="cr-backcrumb">Settings · <b>' + cat.title + '</b></span>',
                '<span class="grow"></span>',
                '<span style="margin-right:8px">' + PM.shared.exposureControl() + '</span>',
                '<button class="cr-drawerbtn btn sm ghost" data-drawer>' + PM.svg("list",14) + 'Sections</button>',
              '</div>',
              '<div class="cr-doc-inner">',
                '<h2>' + cat.title + '</h2>',
                '<p class="cr-doc-purpose">' + cat.purpose + '</p>',
                doc,
                PM.shared.proseField("Notes for this area", "I definately want to recieve seperate reports on this cuz the occured issue is thru the roof."),
              '</div>',
            '</div>',
          '</div>'
        ].join("");
        wireWorkspace();
        PM.initScrollspy();
        // re-trigger scrollspy after layout settles
        setTimeout(function () { PM.initScrollspy(); }, 60);
      }

      function tocIcon(catId) {
        return ({ general:"home", appearance:"theme", agents:"pam", permissions:"shield", code:"code",
          context:"brain", planning:"compass", git:"history", extensions:"mcp", media:"media", system:"server" })[catId] || "grid";
      }

      function wireWorkspace() {
        document.querySelector("[data-go-home]").addEventListener("click", function () { PM.goHome(); render(); });
        document.querySelectorAll("[data-toc-cat]").forEach(function (b) {
          b.addEventListener("click", function () {
            var c = this.getAttribute("data-toc-cat");
            if (c !== PM.state.activeCat) { PM.openCategory(c); render(); }
          });
        });
        document.querySelectorAll("[data-toc-sub]").forEach(function (b) {
          b.addEventListener("click", function () {
            var sub = this.getAttribute("data-toc-sub");
            var cat = this.getAttribute("data-toc-cat");
            if (cat !== PM.state.activeCat) { PM.openCategory(cat, sub); render(); }
            else { PM.openSub(sub); render(); }
          });
        });
        document.querySelectorAll("[data-sub-manager]").forEach(function (a) {
          a.addEventListener("click", function (e) {
            e.preventDefault();
            PM.openManager(this.getAttribute("data-sub-manager")); render();
          });
        });
        // toc search → global search deep-link
        var ts = document.querySelector("[data-toc-search]");
        ts.addEventListener("input", function () {
          var results = PM.runSearch(this.value);
          if (!this.value.trim() || !results.length) return;
          var first = results[0];
          if (first.kind === "manager") { /* ignore */ }
        });
        // drawer toggle on narrow
        var drawerBtn = document.querySelector("[data-drawer]");
        if (drawerBtn) drawerBtn.addEventListener("click", function () {
          document.getElementById("crToc").classList.toggle("open");
        });
        PM.shared.wireSettings(document.querySelector(".cr-doc-inner"));
        // A2 exposure control + A1 prose/spellcheck wiring
        var docInner = document.querySelector(".cr-doc-inner");
        PM.shared.wireExposureControl(document.querySelector(".cr-workspace"), function () {
          PM.motion && PM.motion.staggerIn(docInner, ".set-row:not([style*='none'])", { step: 16, duration: 200 });
        });
        PM.shared.applyExposure(document.querySelector(".cr-workspace"));
        PM.shared.wireProseFields(docInner);
        PM.onScrollspy = function (subId) {
          document.querySelectorAll("[data-toc-sub]").forEach(function (b) {
            b.classList.toggle("active", b.getAttribute("data-toc-sub") === subId && b.getAttribute("data-toc-cat") === PM.state.activeCat);
          });
        };
        PM.shared.wireShell();
      }

      /* ---------- MANAGER ---------- */
      function manager() {
        var m = PM.managers[PM.state.activeManager];
        var stage = document.querySelector("[data-stage]");
        stage.innerHTML = [
          '<div class="cr-manager" data-manager-id="' + m.id + '">',
            '<div class="cr-backbar">',
              '<button class="btn sm ghost" data-go-home>' + PM.svg("back",13) + 'Home</button>',
              '<span class="cr-backcrumb">Settings · <b>' + PM.catById(m.managerCat).title + '</b> · ' + m.title + '</span>',
            '</div>',
            '<div style="flex:1;min-height:0;overflow:hidden">', PM.managers_lib.render(m.id), '</div>',
          '</div>'
        ].join("");
        document.querySelector("[data-go-home]").addEventListener("click", function () { PM.goHome(); render(); });
        PM.managers_lib.wire(stage.querySelector(".mgr"));
        PM.shared.wireShell();
      }

      /* ---------- RENDER ROOT ---------- */
      var _lastView = null;
      function render() {
        var crumb = document.querySelector("[data-crumb]");
        if (PM.state.view === "home" && crumb) crumb.innerHTML = "Settings";
        else if (crumb) crumb.innerHTML = 'Settings · <b>' + (PM.state.activeManager ? PM.managers[PM.state.activeManager].title : (PM.catById(PM.state.activeCat)||{}).title) + '</b>';

        var stage = document.querySelector("[data-stage]");
        // C2 motion: on home entry, stagger the destination panels + notices (editorial cinematic)
        if (PM.state.view === "home" && _lastView !== "home" && PM.motion) {
          home();
          PM.motion.staggerIn(stage, ".cr-dest", { step: 50, duration: 460, axis: "y", delay: 80 });
          PM.motion.staggerIn(stage, ".cr-notice", { step: 40, duration: 380, axis: "y" });
        } else if (PM.state.view === "home") home();
        else if (PM.state.view === "manager") manager();
        else workspace();
        _lastView = PM.state.view;
      }

      PM.render = render;
      PM.init();
      PM.motion.install();
      shell();
      render();
    })();
  </script>
</body>
</html>
