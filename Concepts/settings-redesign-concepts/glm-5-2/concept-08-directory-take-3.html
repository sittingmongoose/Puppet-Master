<style>
/* ===== CONCEPT 08 — A1 DIRECTORY / TAKE 3 (GLM-5.2) =====
   Native geometry: bright, spacious directory. FEWER, LARGER domain cards with strong
   icon/title/purpose hierarchy. Domain overview = manager destinations + key groups.
   Provider summary as high-value status cards with explicit quick actions.
   Full-width copy flow with selectable categories. Card lift motion. */
.t8 { height: 100%; overflow: auto; }
.t8-inner { max-width: 1280px; margin: 0 auto; padding: clamp(20px, 3.4vw, 52px) clamp(18px, 3vw, 44px) 70px; }
.t8-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-3); }
.t8-eyebrow b { color: var(--accent); }
.t8-h1 { font-size: clamp(28px, 3.8vw, 42px); font-weight: 850; letter-spacing: -.025em; margin: 6px 0 6px; }
.t8-sub { font-size: 14.5px; color: var(--ink-2); max-width: 60ch; margin-bottom: 22px; line-height: 1.6; }
.t8-searchwrap { position: relative; margin-bottom: 20px; }
.t8-search { display: flex; align-items: center; gap: 14px; height: 62px; padding: 0 22px; background: var(--surface-elev); border: 1.5px solid var(--line); border-radius: 99px; box-shadow: var(--sh-1); }
.t8-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.t8-search input { flex: 1; min-width: 0; background: none; border: none; outline: none; font-size: 17px; color: var(--ink); }
.t8-drop { position: absolute; top: calc(100% + 10px); left: 10px; right: 10px; z-index: 30; background: var(--surface-elev); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--sh-3); max-height: 400px; overflow: auto; padding: 8px; }
.t8-res { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r); cursor: pointer; }
.t8-res:hover, .t8-res[aria-selected="true"] { background: var(--surface-2); }
.t8-res .lbl { font-size: 14px; font-weight: 700; }
.t8-res .path { font-size: 12px; color: var(--ink-3); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t8-res .k { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-4); flex: none; }
.t8-res .why { font-size: 11px; color: var(--warn); flex: none; }
.t8-drop-empty { padding: 20px; text-align: center; color: var(--ink-2); font-size: 13px; }
.t8-note { display: flex; align-items: center; gap: 12px; padding: 14px 18px; margin-bottom: 22px; border-radius: var(--r-lg); border: 1.5px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn-soft) 55%, var(--surface)); }
.t8-note .t { font-size: 14.5px; font-weight: 750; }
.t8-note .d { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
/* attention — compact */
.t8-att { display: flex; gap: 10px; margin-bottom: 26px; flex-wrap: wrap; }
.t8-att-item { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--surface); font-size: 12.5px; color: var(--ink); }
.t8-att-item .d { color: var(--ink-3); font-size: 11.5px; }
.t8-att-item button { border: none; background: none; color: var(--accent); font-weight: 700; font-size: 12px; cursor: pointer; }
/* LARGE domain cards */
.t8-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.t8-card { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: transform var(--t-mid) var(--ease), box-shadow var(--t-mid) var(--ease), border-color var(--t-fast) var(--ease); }
.t8-card:hover { transform: translateY(-3px); box-shadow: var(--sh-2); border-color: var(--line-2); }
.t8-card .ic { width: 52px; height: 52px; border-radius: var(--r); background: var(--surface-2); color: var(--accent); display: grid; place-items: center; }
.t8-card h3 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.015em; }
.t8-card .purpose { font-size: 13.5px; color: var(--ink-2); line-height: 1.6; max-width: 56ch; }
.t8-card .meta { display: flex; gap: 14px; font-size: 12px; color: var(--ink-3); font-weight: 650; }
.t8-card .go { position: absolute; top: 22px; right: 22px; color: var(--ink-4); }
.t8-utils { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
.t8-util { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 13px; font-weight: 650; cursor: pointer; }
.t8-util:hover { border-color: var(--accent-line); color: var(--ink); }
/* domain overview: manager destinations + key groups */
.t8-dom { min-height: 100%; }
.t8-dom-head { padding: clamp(20px, 3vw, 40px) clamp(18px, 3vw, 44px) 4px; max-width: 1280px; margin: 0 auto; }
.t8-dom-head .back { margin-bottom: 12px; }
.t8-dom-head h2 { margin: 0; font-size: clamp(24px, 3vw, 32px); font-weight: 850; letter-spacing: -.02em; display: flex; align-items: center; gap: 14px; }
.t8-dom-head h2 .ic { width: 46px; height: 46px; border-radius: var(--r); background: var(--surface-2); color: var(--accent); display: grid; place-items: center; }
.t8-dom-head .lede { color: var(--ink-2); font-size: 13.5px; margin-top: 6px; }
.t8-dom-body { max-width: 1280px; margin: 0 auto; padding: 12px clamp(18px, 3vw, 44px) 60px; }
.t8-sec-h { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 22px 0 12px; }
.t8-mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.t8-mcard { display: flex; flex-direction: column; gap: 8px; padding: 18px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); cursor: pointer; transition: border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
.t8-mcard:hover { border-color: var(--accent-line); transform: translateY(-2px); }
.t8-mcard .t { font-size: 15.5px; font-weight: 750; display: flex; align-items: center; gap: 9px; }
.t8-mcard .d { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
.t8-grouplist { display: grid; gap: 8px; }
.t8-grouprole { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; }
.t8-grouprole:hover { border-color: var(--accent-line); }
.t8-grouprole .t { font-size: 14px; font-weight: 700; flex: 1; }
.t8-grouprole .cnt { font-size: 12px; color: var(--ink-3); font-weight: 650; }
/* provider summary: status cards + quick actions */
.t8-provgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.t8-prov { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.t8-prov .hd { display: flex; align-items: center; gap: 10px; }
.t8-prov .nm { font-size: 16px; font-weight: 800; }
.t8-prov .rows { display: grid; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.t8-prov .rows b { color: var(--ink); font-weight: 650; }
.t8-prov .qa { display: flex; gap: 8px; flex-wrap: wrap; }
/* setting rows */
.t8-setrow { display: flex; gap: 18px; padding: 15px 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin-bottom: 10px; align-items: flex-start; }
.t8-setrow .info { flex: 1; min-width: 0; }
.t8-setrow .lbl { font-size: 14.5px; font-weight: 750; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.t8-setrow .desc { font-size: 12.5px; color: var(--ink-2); line-height: 1.6; margin-top: 4px; max-width: 68ch; }
.t8-setrow .ctl { flex: none; width: 220px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.t8-setrow[data-status="managed"] .ctl { opacity: .55; }
.t8-setrow[data-status="unavailable"] { opacity: .62; }
.t8-switch { position: relative; width: 44px; height: 24px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line); cursor: pointer; flex: none; }
.t8-switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.t8-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface-elev); transition: transform var(--t-fast) var(--ease); }
.t8-switch[aria-checked="true"]::after { transform: translateX(20px); }
.t8-sel { height: 32px; padding: 0 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; color: var(--ink); font: inherit; font-size: 12.5px; max-width: 100%; }
.t8-range { width: 100%; accent-color: var(--accent); }
.t8-btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 15px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 12.5px; font-weight: 700; cursor: pointer; }
.t8-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.t8-btn.sm { height: 28px; padding: 0 12px; font-size: 11.5px; }
.t8-why button { font-size: 12px; color: var(--ink-3); background: none; border: none; cursor: pointer; font-weight: 650; padding: 0; }
.t8-details { margin-top: 8px; padding: 11px 13px; border: 1px dashed var(--line-2); border-radius: var(--r-sm); font-size: 12px; color: var(--ink-2); line-height: 1.65; }
.t8-details b { color: var(--ink); }
.t8-err { font-size: 11.5px; color: var(--bad); }
/* manager view */
.t8-mgr { min-height: 100%; }
.t8-mgr-head { display: flex; align-items: center; gap: 14px; padding: clamp(18px, 2.8vw, 34px) clamp(18px, 3vw, 44px) 10px; max-width: 1280px; margin: 0 auto; }
.t8-mgr-head h2 { margin: 0; font-size: 24px; font-weight: 850; letter-spacing: -.02em; display: flex; gap: 11px; align-items: center; }
.t8-mgr-head .sum { font-size: 13px; color: var(--ink-2); }
.t8-tabs { display: flex; gap: 6px; padding: 0 clamp(18px, 3vw, 44px) 12px; max-width: 1280px; margin: 0 auto; flex-wrap: wrap; }
.t8-tab { height: 32px; padding: 0 15px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 12.5px; font-weight: 650; cursor: pointer; }
.t8-tab[aria-selected="true"] { background: var(--ink); color: var(--surface-elev); border-color: var(--ink); }
.t8-mgr-body { max-width: 1280px; margin: 0 auto; padding: 0 clamp(18px, 3vw, 44px) 60px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 18px; align-items: start; }
.t8-listcard { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.t8-lrow { display: flex; align-items: center; gap: 11px; padding: 13px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.t8-lrow:last-child { border-bottom: none; }
.t8-lrow:hover { background: var(--surface-2); }
.t8-lrow[aria-selected="true"] { background: var(--surface-2); }
.t8-lrow .t { font-size: 14px; font-weight: 700; }
.t8-lrow .d { font-size: 11.5px; color: var(--ink-3); }
.t8-detail { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 20px; }
.t8-detail h3 { margin: 0 0 3px; font-size: 18px; font-weight: 800; }
.t8-detail .dsub { font-size: 13px; color: var(--ink-2); line-height: 1.6; margin-bottom: 12px; }
.t8-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.t8-kv { display: grid; grid-template-columns: 150px 1fr; gap: 5px 14px; font-size: 12.5px; margin-bottom: 14px; }
.t8-kv .k { color: var(--ink-3); font-weight: 650; }
.t8-kv .v { color: var(--ink); line-height: 1.55; overflow-wrap: anywhere; }
.t8-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.t8-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.t8-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 7px 9px; border-bottom: 1px solid var(--line); }
.t8-table td { padding: 8px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
.t8-table td.mut { color: var(--ink-2); }
.t8-offline { display: flex; gap: 10px; padding: 11px 14px; margin: 8px 0; border-radius: var(--r-sm); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); background: color-mix(in srgb, var(--warn-soft) 45%, var(--surface)); font-size: 12.5px; }
.t8-work { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; margin: 8px 0; font-size: 12.5px; }
.t8-work .bar { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin-top: 8px; }
.t8-work .bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width var(--t-mid) var(--ease); }
.t8-setup { border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 13px 15px; margin: 8px 0; }
.t8-setup ol { margin: 6px 0 0; padding-left: 18px; font-size: 12px; color: var(--ink-2); line-height: 1.7; }
/* full-width copy */
.t8-copy { position: absolute; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
.t8-copy-head { display: flex; align-items: center; gap: 12px; padding: 18px clamp(18px, 3vw, 44px); border-bottom: 1px solid var(--line); background: var(--surface); }
.t8-copy-head h3 { margin: 0; font-size: 20px; font-weight: 850; }
.t8-copy-body { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
.t8-copy-left { padding: 22px clamp(18px, 2.6vw, 34px); border-right: 1px solid var(--line); overflow: auto; }
.t8-copy-right { padding: 22px clamp(18px, 2.6vw, 34px); overflow: auto; }
.t8-copy-foot { display: flex; gap: 10px; padding: 14px clamp(18px, 3vw, 44px); border-top: 1px solid var(--line); background: var(--surface); }
.t8-copy-foot .sp { flex: 1; }
.t8-step { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.t8-src { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: var(--r-lg); margin-bottom: 10px; cursor: pointer; background: var(--surface); }
.t8-src[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.t8-cat { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: var(--r); margin-bottom: 9px; cursor: pointer; background: var(--surface); }
.t8-cat[aria-selected="true"] { border-color: var(--accent); background: var(--surface-2); }
.t8-check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line-2); flex: none; display: grid; place-items: center; margin-top: 1px; }
.t8-cat[aria-selected="true"] .t8-check { background: var(--accent); border-color: var(--accent); }
.t8-counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
.t8-count { padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: center; }
.t8-count .n { font-size: 24px; font-weight: 850; display: block; }
.t8-count .l { font-size: 11px; color: var(--ink-3); }
.t8-cplist { border: 1px solid var(--line); border-radius: var(--r); height: 300px; overflow: auto; }
.t8-receipt { border: 1.5px solid color-mix(in srgb, var(--ok) 45%, var(--line)); background: color-mix(in srgb, var(--ok-soft) 40%, var(--surface)); border-radius: var(--r); padding: 16px; font-size: 13.5px; }
/* drawer */
.t8-drawer { position: absolute; right: 0; top: 0; bottom: 0; width: min(440px, 94%); z-index: 45; background: var(--surface-elev); border-left: 1px solid var(--line-2); box-shadow: var(--sh-3); transform: translateX(102%); transition: transform var(--t-mid) var(--ease); display: flex; flex-direction: column; }
.t8-drawer[data-open="1"] { transform: none; }
.t8-drawer-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.t8-drawer-head h4 { margin: 0; font-size: 15px; flex: 1; }
.t8-drawer-body { flex: 1; overflow: auto; padding: 14px 16px; font-size: 13px; line-height: 1.65; color: var(--ink-2); }
.t8-drawer-body b { color: var(--ink); }
/* topbar */
.t8-crumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); min-width: 0; overflow: hidden; }
.t8-crumb b { color: var(--ink); white-space: nowrap; }
.t8-proj { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 99px; border: 1px solid var(--line); font-size: 12px; color: var(--ink-2); background: var(--surface); }
.t8-proj b { color: var(--ink); }
.t8-minis { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; min-width: 190px; max-width: 320px; flex: 1; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); }
.t8-minis input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--ink); font-size: 13px; }
.t8-skel { border-radius: var(--r-sm); background: var(--surface-2); animation: v2-shimmer 1.4s ease-in-out infinite; }
.t8-virt { position: relative; overflow: auto; }
@media (max-width: 1023px) {
  .t8-grid { grid-template-columns: 1fr; }
  .t8-mgr-body { grid-template-columns: 1fr; }
  .t8-copy-body { grid-template-columns: 1fr; }
  .t8-copy-left { border-right: none; border-bottom: 1px solid var(--line); }
  .t8-setrow { flex-direction: column; }
  .t8-setrow .ctl { width: 100%; align-items: flex-start; }
}
@media (max-width: 899px) {
  .pm-shell { grid-template-columns: 60px 1fr var(--chat-w, 0px); grid-template-areas: "topbar topbar topbar" "activity stage chat" "footer footer footer"; }
  .pm-rail { position: absolute; z-index: 44; top: var(--shell-h); bottom: var(--footer-h); left: 60px; width: 260px; box-shadow: var(--sh-3); background: var(--surface-elev); }
  .t8-crumb { display: none; }
}
@media (min-width: 1900px) { .t8-inner, .t8-dom-body, .t8-mgr-body, .t8-dom-head, .t8-mgr-head, .t8-tabs { max-width: 1520px; } .t8-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* ===== squeeze: 760px topbar survival (added by verification pass) ===== */
@media (max-width: 899px) {
  .pm-topbar .pm-brand { display: none; }
  .pm-topbar { gap: 6px; }
  #themeBtn, #closeBtn, #navToggle { font-size: 0; gap: 0; padding: 0 9px; }
  #themeBtn svg, #closeBtn svg, #navToggle svg { margin-right: 0; }
  #projChip, .d5-projchip, .e6-proj, .c7-proj, .t8-proj, .n9-proj, .m10-proj, .o11-proj { max-width: 130px; overflow: hidden; white-space: nowrap; }
  .d5-mini-search, .e6-minis, .c7-minis, .t8-minis, .n9-minis, .m10-cmdinput, .o11-search { min-width: 90px !important; }
}

<body>
<div class="pm-shell" id="shell" data-rail="closed" data-chat="closed">
  <header class="pm-topbar">
    <span class="pm-brand">PUPPET&nbsp;MASTER</span>
    <button class="t8-btn sm" id="navToggle" aria-label="Settings navigation"></button>
    <nav class="t8-crumb" id="crumb" aria-label="Settings location"></nav>
    <span class="pm-spacer"></span>
    <div class="t8-minis" id="miniWrap" hidden><span id="miniIcon"></span><input id="miniSearch" type="search" placeholder="Search settings" aria-label="Search settings" autocomplete="off"></div>
    <span class="t8-proj" id="projChip"></span>
    <button class="t8-btn sm" id="themeBtn"></button>
    <button class="t8-btn sm" id="closeBtn"></button>
  </header>
  <nav class="pm-activity" aria-label="Activity Bar" id="activity"></nav>
  <aside class="pm-rail" id="rail" data-hidden></aside>
  <main class="pm-stage" id="stage" style="position:relative;">
    <a data-concept-model="GLM-5.2" href="index.html" title="GLM-5.2 settings concept" style="position:absolute;opacity:0;pointer-events:none;" aria-hidden="true">GLM-5.2</a>
    <div class="t8" id="app"></div>

</div>
<script>
(function () {

  var ICONS = { general: "settings", ai: "pam", safety: "shield", code: "code", memory: "memory", planning: "compass", branching: "crew", media: "map", web: "search", personas: "users", extensions: "stack", system: "grid" };

  el("projChip").innerHTML = '<span class="sdot ok"></span><b>' + PM2.currentProject.name + "</b>&nbsp;· current project";
  el("closeBtn").innerHTML = PM2.svg("close", 13) + "Close";
  el("navToggle").innerHTML = PM2.svg("list", 13) + "Settings";
  el("miniIcon").innerHTML = PM2.svg("search", 13);
  el("themeBtn").innerHTML = PM2.svg("settings", 13) + "Friendly Light";
  el("drawerClose").innerHTML = PM2.svg("close", 12) + "Close";
  el("activity").innerHTML = ["home", "settings", "terminal", "stack", "users", "search"].map(function (i) { return '<button class="pm-act" aria-label="' + i + '">' + PM2.svg(i, 18) + "</button>"; }).join("");
  el("footer").innerHTML = "<span><b>Settings</b> · " + NS + "</span><span class='pm-spacer'></span><span>828 settings · 12 categories</span>";

  var menu = null;
  function openMenu(anchor, items, onPick) {
    closeMenu();
    var m = document.createElement("div"); m.className = "v2menu";
    m.innerHTML = items.map(function (it, i) { return it.sep ? '<div class="v2menu-sep"></div>' : '<button class="v2menu-item" data-i="' + i + '">' + (it.icon ? PM2.svg(it.icon, 14) : "") + '<span class="v2menu-label">' + it.label + "</span></button>"; }).join("");
    el("menuHost").appendChild(m);
    var r = anchor.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    var top = r.bottom - sr.top + 6, left = Math.min(Math.max(0, r.left - sr.left), sr.width - 230);
    if (r.bottom + 280 > window.innerHeight) top = Math.max(4, r.top - sr.top - 280);
    m.style.top = top + "px"; m.style.left = left + "px";
    m.addEventListener("click", function (e) { var b = e.target.closest(".v2menu-item"); if (!b) return; closeMenu(); onPick(items[+b.dataset.i]); });

  }
  function closeMenu() { if (menu) { menu.remove(); menu = null; return true; } return false; }
  document.addEventListener("click", function (e) { if (menu && !menu.contains(e.target)) closeMenu(); }, true);
  el("themeBtn").addEventListener("click", function () {
    var themes = PM2.mgrById["mgr.appearance"].themes;
    openMenu(el("themeBtn"), themes.map(function (t) { return { label: t }; }).concat([{ sep: 1 }, { label: "Reduced motion: " + (RM() ? "on" : "off") }]), function (it) {
      if (it.label.indexOf("Reduced") === 0) { document.documentElement.setAttribute("data-reduced-motion", RM() ? "0" : "1"); return; }
      document.documentElement.setAttribute("data-theme", it.label);
      document.documentElement.style.colorScheme = /-dark$/.test(it.label) ? "dark" : "light";
      el("themeBtn").innerHTML = PM2.svg("settings", 13) + it.label;
    });
  });
  function RM() { return document.documentElement.getAttribute("data-reduced-motion") === "1"; }
  el("closeBtn").addEventListener("click", goHome);
  el("navToggle").addEventListener("click", function () { var r = el("rail"); r.dataset.hidden = r.dataset.hidden ? "" : "hidden"; });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (closeMenu()) return;

      if (COPY.open) { copyClose(); return; }
      if (NAV.canBack()) { NAV.back(); return; }
      if (state.view !== "home") goHome();
    }
  });

  var state = { view: "home", domain: null, section: null, manager: null, object: null, tab: 0, hydrated: {}, lastQuery: "", lastRid: null };
  var lastRendered = "", pendingRestore = null;
  NAV.on(function (route, depth, extra) {
    var s = PM2.routes.str(route);
    if (extra && extra.returnedFrom && extra.returnedFrom.query) pendingRestore = { query: extra.returnedFrom.query, resultId: extra.returnedFrom.resultId };
    if (s === lastRendered) return;

  });
  window.addEventListener("hashchange", function () { var r = PM2.routes.parse(location.hash); if (PM2.routes.str(r) !== PM2.routes.str(NAV.top())) NAV.go(r); });
  function goHome() { state.view = "home"; state.domain = state.section = state.manager = null; NAV.reset({ domain: null }); render({ domain: null }); }

  /* search */
  var drop = null, dropSel = -1;
  function searchAttach(input) {
    var wrap = input.parentElement;
    input.addEventListener("input", function () { state.lastQuery = input.value; showDrop(wrap, PM2.search.query(input.value)); });

      if (!drop) { if (e.key === "Escape" && state.view !== "home") goHome(); return; }
      var rows = drop.querySelectorAll(".t8-res");
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); dropSel = e.key === "ArrowDown" ? Math.min(rows.length - 1, dropSel + 1) : Math.max(0, dropSel - 1); rows.forEach(function (r, i) { r.setAttribute("aria-selected", i === dropSel ? "true" : "false"); }); rows[dropSel] && rows[dropSel].scrollIntoView({ block: "nearest" }); }
      else if (e.key === "Enter") { e.preventDefault(); var rid = dropSel >= 0 && rows[dropSel] ? rows[dropSel].dataset.rid : (rows[0] && rows[0].dataset.rid); if (rid) pickResult(rid); }
      else if (e.key === "Escape") hideDrop();
    });
  }
  function showDrop(wrap, res) {
    hideDrop();
    if (!res.query) return;
    drop = document.createElement("div"); drop.className = "t8-drop v2-surface";
    var html = "";
    if (!res.results.length) {
      html = '<div class="t8-drop-empty">No results' + (res.suggestion ? " — did you mean <b>" + esc(res.suggestion) + "</b>?" : "") + "</div>";
      if (res.suggestion) html += '<div class="t8-res" data-rid="suggest:' + esc(res.suggestion) + '"><span class="lbl">“' + esc(res.suggestion) + "”</span></div>";
    } else {
      res.results.forEach(function (r) {
        html += '<div class="t8-res" data-rid="' + esc(r.rid) + '"><span class="k">' + r.type.replace(/_/g, " ").slice(0, 10) + '</span><span class="lbl">' + esc(r.label) + '</span><span class="path">' + esc(r.path.join(" › ")) + "</span>" + (r.availability ? '<span class="why">' + esc(r.availability) + "</span>" : "") + "</div>";
      });
    }
    drop.innerHTML = html; wrap.appendChild(drop); dropSel = -1;
    drop.addEventListener("mousedown", function (e) {
      var row = e.target.closest(".t8-res"); if (!row) return; e.preventDefault();
      if (row.dataset.rid.indexOf("suggest:") === 0) { var q = row.dataset.rid.slice(8); var inp = wrap.querySelector("input"); inp.value = q; state.lastQuery = q; showDrop(wrap, PM2.search.query(q)); return; }
      pickResult(row.dataset.rid);
    });
  }
  function hideDrop() { if (drop) { drop.remove(); drop = null; } }
  document.addEventListener("click", function (e) { if (drop && !e.target.closest(".t8-searchwrap") && !e.target.closest(".t8-minis")) hideDrop(); });
  function pickResult(rid) {
    var entry = PM2.search.byRid(rid); if (!entry) return;
    state.lastRid = rid; hideDrop();
    if (entry.type === "intentional_help_result" && entry.dest.mode === "copy") { NAV.go({ mode: "copy" }); openCopy(); return; }
    var plan = PM2.routes.planFor(entry.dest);
    NAV.go(Object.assign({}, entry.dest, { query: state.lastQuery, resultId: rid }));
    land(plan, entry);
  }
  function land(plan, entry) {
    var tries = 0;
    (function go() {
      var target = null;
      if (plan.route.row) target = stage.querySelector('[data-row="' + plan.route.row + '"]');
      if (!target && plan.route.object) target = stage.querySelector('[data-obj="' + plan.route.object + '"]');
      if (!target && plan.route.manager) target = stage.querySelector('[data-mgr="' + plan.route.manager + '"]');
      if (!target && tries++ < 16) { setTimeout(go, 110); return; }
      if (target) {
        target.scrollIntoView({ block: "center", behavior: RM() ? "auto" : "smooth" });
        target.classList.remove("v2-calm"); void target.offsetWidth; target.classList.add("v2-calm");
        var f = target.querySelector("input,select,button,.t8-switch") || target;
        try { f.focus({ preventScroll: true }); } catch (e) {}
      }
      if (entry && entry.type === "setting") {
        var s = PM2.inventory.byId[plan.route.row];
        if (s) openDrawer("Landed on a setting", "<b>" + esc(s.label) + "</b><br>" + esc(s.desc) + "<br><br>Location: " + esc(PM2.routes.crumb(NAV.top()).join(" › ")) + (state.lastQuery ? "<br>From search: “" + esc(state.lastQuery) + "”" : ""));
      }
    })();
  }

  function render(route) {
    closeDrawer(); hideDrop();
    if (route.manager && PM2.mgrById[route.manager]) renderManager(route);
    else if (route.domain === "all") renderAll();
    else if (route.domain) renderDomain(route);
    else if (route.mode === "copy") { renderHome(); openCopy(); }
    else renderHome();
    renderRail(route); renderCrumb(route);
    el("miniWrap").hidden = state.view === "home";
  }
  function renderCrumb(route) {
    var html = "<b>Settings</b>";
    if (route.domain === "all") html += ' <span>›</span> All settings';
    else PM2.routes.crumb(route).forEach(function (p) { html += ' <span>›</span> ' + esc(p); });
    if (NAV.canBack()) html = '<button class="t8-btn sm" id="backBtn">' + PM2.svg("back", 12) + "Back</button>" + html;
    el("crumb").innerHTML = html;
    var b = el("backBtn"); if (b) b.addEventListener("click", function () { NAV.back(); });
  }
  function renderRail(route) {
    var html = '<div class="pm-rail-head">Settings</div><div class="pm-rail-body v2-surface">';
    html += '<div class="pm-side-item" data-nav="home"' + (!route.domain ? ' aria-current="page"' : "") + ">" + PM2.svg("home", 15) + "Home</div>";
    PM2.inventory.categories.forEach(function (c) {
      html += '<div class="pm-side-item" data-nav="' + c.id + '"' + (route.domain === c.id ? ' aria-current="page"' : "") + ">" + PM2.svg(ICONS[c.id] || "grid", 15) + esc(c.title) + '<span class="pm-side-cnt">' + PM2.inventory.byCategory[c.id].length + "</span></div>";
    });
    html += '<div class="pm-side-item" data-nav="all">' + PM2.svg("list", 15) + "All settings</div>";
    html += '<div class="pm-side-item" data-nav="copy">' + PM2.svg("layers", 15) + "Copy from…</div></div>";
    el("rail").innerHTML = html;
    el("rail").querySelectorAll("[data-nav]").forEach(function (n) {
      n.addEventListener("click", function () {
        var v = n.dataset.nav;
        if (v === "home") goHome(); else if (v === "copy") openCopy(); else NAV.jump({ domain: v });
        if (window.innerWidth < 900) el("rail").dataset.hidden = "hidden";
      });
    });
  }

  /* HOME — bright, spacious, LARGE cards */
  function renderHome() {
    state.view = "home"; state.domain = state.section = state.manager = null;
    var html = '<div class="t8 v2-surface" style="height:100%"><div class="t8-inner">';
    html += '<div class="t8-eyebrow"><b>08</b> · A1 Directory · Take 3</div>';
    html += '<h1 class="t8-h1">Settings</h1>';
    html += '<div class="t8-sub">A bright, calm directory for <b>' + esc(PM2.currentProject.name) + "</b>. Every change applies to this project only.</div>";
    html += '<div class="t8-searchwrap"><div class="t8-search">' + PM2.svg("search", 19) + '<input id="homeSearch" type="search" placeholder="Search settings, managers, actions…" aria-label="Universal search" autocomplete="off"><span class="v2kbd">/</span></div></div>';
    html += '<div class="t8-note"><span class="sdot warn"></span><div style="flex:1"><div class="t">One provider needs setup before some operations run</div><div class="d">Codex CLI — explicit install from the official source. Nothing is bundled or automatic.</div></div><button class="t8-btn primary" id="noteGo">Set up</button></div>';
    html += '<div class="t8-att">' +
      '<span class="t8-att-item"><span class="sdot warn"></span>Codex CLI setup <span class="d">explicit</span><button data-dest="d1">Open</button></span>' +
      '<span class="t8-att-item"><span class="sdot warn"></span>ntfy offline <span class="d">since 08-17</span><button data-dest="d2">Open</button></span>' +
      '<span class="t8-att-item"><span class="sdot info"></span>Vault migration <span class="d">restart pending</span><button data-dest="d3">Open</button></span>' +
      "</div>";
    html += '<div class="t8-grid">';
    PM2.inventory.categories.forEach(function (c) {
      var mgrs = PM2.managers.filter(function (m) { return m.domain === c.id; });
      var changed = 0; PM2.inventory.byCategory[c.id].forEach(function (s) { if (STORE.get(s.id).status === "custom") changed++; });
      html += '<div class="t8-card" data-domain="' + c.id + '" tabindex="0" role="link">' +
        '<span class="go">' + PM2.svg("chevron", 18) + "</span>" +
        '<span class="ic">' + PM2.svg(ICONS[c.id] || "grid", 26) + "</span>" +
        "<div><h3>" + esc(c.title) + "</h3></div>" +
        '<div class="purpose">' + esc(PURPOSES[c.id] || "") + "</div>" +
        '<div class="meta"><span>' + PM2.inventory.byCategory[c.id].length + " settings</span><span>" + mgrs.length + " managers</span><span>" + changed + " changed</span></div></div>";
    });
    html += "</div>";
    html += '<div class="t8-utils"><button class="t8-util" data-nav="all">' + PM2.svg("list", 14) + 'All settings index</button><button class="t8-util" data-nav="copy">' + PM2.svg("layers", 14) + 'Copy settings from another project</button></div>';
    html += "</div></div>";
    app.innerHTML = html;
    searchAttach(el("homeSearch"));
    var rq = pendingRestore ? pendingRestore.query : NAV.top().query;
    if (rq) { el("homeSearch").value = rq; state.lastQuery = rq; if (pendingRestore && pendingRestore.resultId) state.lastRid = pendingRestore.resultId; pendingRestore = null; }
    var DESTS = { d1: { manager: "mgr.provider", object: "prov.codex-cli" }, d2: { manager: "mgr.notifications", object: "ntf.ntfy" }, d3: { manager: "mgr.storage", object: "sto.migrate" } };
    el("noteGo").addEventListener("click", function () { NAV.go(DESTS.d1); land(PM2.routes.planFor(DESTS.d1)); });
    app.querySelectorAll("[data-dest]").forEach(function (b) { b.addEventListener("click", function () { var d = DESTS[b.dataset.dest]; NAV.go(d); land(PM2.routes.planFor(d)); }); });

    app.querySelectorAll(".t8-util").forEach(function (b) { b.addEventListener("click", function () { var v = b.dataset.nav; if (v === "all") NAV.go({ domain: "all" }); else if (v === "copy") openCopy(); }); });
  }

  /* DOMAIN — manager destinations + key groups */
  function renderDomain(route) {
    state.view = "domain"; state.domain = route.domain; state.manager = null;
    var c = PM2.inventory.categories.filter(function (x) { return x.id === route.domain; })[0];
    var mgrs = PM2.managers.filter(function (m) { return m.domain === route.domain; });
    var html = '<div class="t8-dom v2-surface"><div class="t8-dom-head"><div class="back"><button class="t8-btn sm" id="domBack">' + PM2.svg("back", 12) + "Back</button></div>";
    html += "<h2>" + PM2.svg(ICONS[c.id] || "grid", 24) + " " + esc(c.title) + '</h2><div class="lede">' + esc(PURPOSES[c.id] || "") + " · " + PM2.inventory.byCategory[c.id].length + " settings · changes apply to " + esc(PM2.currentProject.name) + " only.</div></div>";
    html += '<div class="t8-dom-body">';
    if (route.domain === "ai") {
      html += '<div class="t8-sec-h">Provider summary</div><div class="t8-provgrid" id="provGrid"></div>';
    }
    html += '<div class="t8-sec-h">Managers</div><div class="t8-mgrid">';
    mgrs.forEach(function (m) {
      html += '<div class="t8-mcard" data-mgr="' + m.id + '" tabindex="0"><div class="t">' + PM2.svg(m.icon, 18) + esc(m.title) + '</div><div class="d">' + esc(m.blurb) + '</div><div><span class="v2badge ' + (m.health.kind === "ok" ? "ok" : m.health.kind) + '">' + esc(m.health.text) + "</span></div></div>";

    });
    html += "</div>";
    html += '<div id="pageHost" style="margin-top:18px"></div>';
    html += "</div></div>";
    app.innerHTML = html;
    el("domBack").addEventListener("click", function () { NAV.back(); });
    if (route.domain === "ai") drawProvSummary();

        app.querySelectorAll(".t8-grouprole").forEach(function (x) { x.style.borderColor = "var(--line)"; });

      setTimeout(function () { var t = app.querySelector('[data-row="' + route.row + '"]'); if (t) { t.scrollIntoView({ block: "center" }); t.classList.add("v2-calm"); } }, 320);
    }
  }
  function drawProvSummary() {
    var m = PM2.mgrById["mgr.provider"];
    var host = el("provGrid");
    m.records.slice(0, 6).forEach(function (r) {
      var tone = r.status === "ok" ? "ok" : r.status === "bad" ? "bad" : "warn";
      var qa = (r.actions || []).slice(0, 2).map(function (a) {
        return '<button class="t8-btn sm' + (a.kind === "primary" ? " primary" : "") + '" data-paction="' + esc(a.id) + '" data-pobj="' + esc(r.id) + '">' + esc(a.label) + "</button>";
      }).join("");
      host.innerHTML += '<div class="t8-prov" data-obj="' + r.id + '"><div class="hd"><span class="sdot ' + tone + '"></span><span class="nm">' + esc(r.label) + '</span><span style="flex:1"></span><span class="v2badge ' + tone + '">' + esc(r.statusLabel || "Ready") + "</span></div>" +
        '<div class="rows">' + (r.chips || []).slice(0, 3).map(function (ch) { return "<span>" + esc(ch[0]) + ": <b>" + esc(String(ch[1])) + "</b></span>"; }).join("") + "</div>" +
        '<div class="qa">' + qa + "</div></div>";
    });

      card.addEventListener("click", function (e) {

    host.querySelectorAll("[data-paction]").forEach(function (b) {
      b.addEventListener("click", function (e) {

    } else if (COPY.step === 1) {
      L.innerHTML = '<div class="t8-step">Step 2 · Categories</div>' + PM2.copyCategories.map(function (c) {
        return '<div class="t8-cat" data-cat="' + c.id + '" aria-selected="' + (COPY.cats.indexOf(c.id) >= 0) + '"><span class="t8-check">' + (COPY.cats.indexOf(c.id) >= 0 ? PM2.svg("close", 0) : "") + '</span><div><div style="font-size:14px;font-weight:750">' + esc(c.title) + '</div><div style="font-size:12px;color:var(--ink-2);margin-top:2px">' + esc(c.includes) + "</div></div></div>";
      }).join("");
      R.innerHTML = '<div class="t8-step">Selected</div><div id="catSummary" style="font-size:13.5px;color:var(--ink-2);line-height:1.7"></div>';
      function sum() { el("catSummary").innerHTML = COPY.cats.length + " of 10 categories selected<br>" + COPY.cats.map(function (id) { return esc(PM2.copyCategories.filter(function (c) { return c.id === id; })[0].title); }).join("<br>"); }
      L.querySelectorAll("[data-cat]").forEach(function (c) {
        c.addEventListener("click", function () {
          var id = c.dataset.cat, i = COPY.cats.indexOf(id);
          if (i >= 0) COPY.cats.splice(i, 1); else COPY.cats.push(id);
          c.setAttribute("aria-selected", COPY.cats.indexOf(id) >= 0);
          sum();
        });
      });
      sum();
      f.innerHTML = '<button class="t8-btn" id="copyBack">Back</button><span class="sp"></span><button class="t8-btn primary" id="copyNext">Preview copy</button>';
      el("copyBack").addEventListener("click", function () { COPY.step = 0; drawCopy(); });
      el("copyNext").addEventListener("click", function () { COPY.preview = PM2.copyPreview(COPY.src, COPY.cats); COPY.step = 2; drawCopy(); });
    } else if (COPY.step === 2) {
      var t = COPY.preview.totals;
      L.innerHTML = '<div class="t8-step">Step 3 · Preview</div><div class="t8-counts">' +
        '<div class="t8-count"><span class="n">' + t.additions + '</span><span class="l">additions</span></div>' +
        '<div class="t8-count"><span class="n">' + t.replacements + '</span><span class="l">replacements</span></div>' +
        '<div class="t8-count"><span class="n">' + t.unchanged + '</span><span class="l">unchanged</span></div>' +
        '<div class="t8-count"><span class="n">' + t.unavailable + '</span><span class="l">not copyable</span></div>' +
        '<div class="t8-count"><span class="n">' + t.conflicts + '</span><span class="l">conflicts skipped</span></div></div>' +
        '<div class="t8-offline" style="border-color:var(--line)"><span class="sdot info"></span>' + esc(COPY.preview.credentialNote) + "</div>";
      R.innerHTML = '<div class="t8-step">Item-level preview</div><div class="t8-cplist v2-surface" id="cpList"></div>';
      var list = el("cpList"), rows = COPY.preview.rows, RH = 34;
      var pad2 = document.createElement("div"); pad2.className = "v2-virt-pad";
      var win2 = document.createElement("div"); win2.style.position = "relative";
      list.append(pad2, win2);
      function draw2() {
        var w = PM2.window({ scrollTop: list.scrollTop, viewportHeight: 300, rowHeight: RH, total: rows.length });
        pad2.style.height = (w.padTop + w.count * RH + w.padBottom) + "px"; win2.style.transform = "translateY(" + w.padTop + "px)";
        var h = "";
        for (var i = w.first; i < w.first + w.count; i++) {
          var rr = rows[i]; if (!rr) break;
          var s = PM2.inventory.byId[rr.settingId];
          h += '<div style="height:' + RH + 'px;display:flex;align-items:center;gap:9px;font-size:12.5px;border-bottom:1px solid var(--line)"><span class="v2badge ' + (rr.kind === "additions" ? "ok" : rr.kind === "replacements" ? "info" : rr.kind === "conflicts" ? "warn" : rr.kind === "unavailable" ? "bad" : "") + '">' + rr.kind.replace(/s$/, "") + '</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(s ? s.label : rr.settingId) + "</span></div>";
        }
        win2.innerHTML = h;
      }
      draw2(); list.addEventListener("scroll", draw2);
      f.innerHTML = '<button class="t8-btn" id="copyBack">Back</button><span class="sp"></span><span style="font-size:12px;color:var(--ink-3);align-self:center">Restore point is created before anything changes.</span><button class="t8-btn primary" id="copyGo">Restore point & apply</button>';
      el("copyBack").addEventListener("click", function () { COPY.step = 1; drawCopy(); });
      el("copyGo").addEventListener("click", function () {
        COPY.step = 3;
        R.innerHTML = '<div class="t8-step">Step 4 · Applying atomically</div><div class="t8-work" id="cw"></div>';
        f.innerHTML = "";
        var box = el("cw");
        var w = STORE.work({ kind: "copy", label: "Copy settings", phases: ["restore point", "apply", "verify"], steps: 10, fast: true });
        var un = STORE.subscribe("work", function () {
          box.innerHTML = "<b>" + esc(w.label) + "</b> — " + esc(w.note) + '<div class="bar"><div style="width:' + ((w.phaseI + 1) / 3 * 100) + '%"></div></div>';
          if (w.state === "done") {
            un();
            COPY.result = STORE.applyCopy(COPY.preview, COPY.cats);
            R.innerHTML = '<div class="t8-step">Done — verified, receipted, rollback available</div><div class="t8-receipt"><b>' + COPY.result.counts.applied + " values copied</b> · " + COPY.result.counts.skipped + " skipped (unavailable/conflict).<br>Verified " + COPY.result.verify.checked + " rows · " + COPY.result.verify.mismatches + " mismatches. Receipt <b>" + esc(COPY.result.receipt.id) + "</b> · restore point <b>" + esc(COPY.result.restorePoint.label) + "</b>.<br>" + COPY.result.verify.note + "</div>" +
              '<div class="t8-offline" style="border-color:var(--line);margin-top:10px"><span class="sdot ok"></span><b>' + esc(PM2.currentProject.name) + "</b> and <b>" + esc(COPY.preview.source.name) + "</b> are independent from here on.</div>";
            f.innerHTML = '<button class="t8-btn" id="copyRoll">' + PM2.svg("back", 12) + "Rollback</button><span class=\"sp\"></span><button class=\"t8-btn primary\" id=\"copyDone\">Done</button>";
            el("copyRoll").addEventListener("click", function () { STORE.rollback(COPY.result.restorePoint.id); openDrawer("Rollback complete", "Restored to the pre-copy restore point. Receipt recorded."); copyClose(); });
            el("copyDone").addEventListener("click", copyClose);
          }
        });
      });
    }
  }

  /* boot */
  var initial = PM2.routes.parse(location.hash);
  if (initial.domain || initial.manager || initial.mode) NAV.stack = [Object.assign({ domain: null }, initial)];
  render(NAV.top());
  if (initial.row || initial.object || initial.query) land(PM2.routes.planFor(initial), PM2.search.byRid(initial.resultId || "") || null);
  searchAttach(el("miniSearch"));
  window.__C8 = { PM2: PM2, STORE: STORE, NAV: NAV, state: state, pickResult: pickResult };
})();
</script>
</body>
</html>
