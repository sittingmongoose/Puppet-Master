<title>06 A1 Directory / Take 2 — GLM-5.2 Settings</title>

<link rel="stylesheet" href="assets/shell.css">
<link rel="stylesheet" href="assets/v2/pm-std.css">

<script src="assets/v2/pm-inventory.js"></script>

<style>
/* ===== CONCEPT 06 — A1 DIRECTORY / TAKE 2 (GLM-5.2) =====
   Native geometry: editorial single-column destination list on Home; a NARROW STABLE
   major-domain rail beside the content sheet; large destination rows with descriptions;
   restrained detail sheet; nested subnav stays inside the sheet. Slide-sheet motion. */
.e6 { height: 100%; display: flex; min-width: 0; }
.e6-rail { width: 216px; flex: none; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; }
.e6-rail-head { padding: 16px 16px 8px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.e6-rail-body { flex: 1; overflow: auto; padding: 0 8px 14px; }
.e6-rail-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--r-sm); font-size: 12.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.e6-rail-item:hover { background: var(--surface-2); color: var(--ink); }
.e6-rail-item[aria-current="page"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.e6-rail-item .cnt { margin-left: auto; font-size: 10.5px; color: var(--ink-3); font-weight: 600; }
.e6-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.e6-sheet { flex: 1; min-height: 0; overflow: auto; background: var(--bg); }
.e6-page { max-width: 860px; margin: 0 auto; padding: clamp(18px, 3vw, 44px) clamp(16px, 3vw, 40px) 60px; }

/* ---------- HOME (editorial list) ---------- */
.e6-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.e6-eyebrow b { color: var(--accent); }
.e6-h1 { font-size: clamp(26px, 3.4vw, 36px); font-weight: 300; letter-spacing: -.015em; margin: 6px 0 4px; }
.e6-h1 b { font-weight: 750; }
.e6-sub { color: var(--ink-2); font-size: 14px; line-height: 1.6; max-width: 62ch; margin-bottom: 22px; }
.e6-searchwrap { position: relative; margin-bottom: 16px; }
.e6-search { display: flex; align-items: center; gap: 11px; height: 46px; padding: 0 15px; background: var(--surface-elev);
  border: 1px solid var(--line); border-bottom: 2px solid var(--line-2); border-radius: var(--r-sm); transition: border-color var(--t-fast) var(--ease); }
.e6-search:focus-within { border-bottom-color: var(--accent); }
.e6-search input { flex: 1; min-width: 0; background: none; border: none; outline: none; font-size: 15px; color: var(--ink); }
.e6-drop { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; background: var(--surface-elev);
  border: 1px solid var(--line-2); border-radius: var(--r-sm); box-shadow: var(--sh-3); max-height: 340px; overflow: auto; padding: 4px; }
/* compact anchored dropdown rows — narrower than Take 1, more editorial */
.e6-res { display: flex; align-items: baseline; gap: 10px; padding: 8px 10px; border-radius: var(--r-xs); cursor: pointer; }
.e6-res:hover, .e6-res[aria-selected="true"] { background: var(--surface-2); }
.e6-res .lbl { font-size: 13px; font-weight: 650; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34%; flex: none; }
.e6-res .path { font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.e6-res .k { flex: none; font-size: 9.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-4); }
.e6-res .why { flex: none; font-size: 10.5px; color: var(--warn); }
.e6-drop-empty { padding: 16px; text-align: center; font-size: 12.5px; color: var(--ink-2); }
/* single quiet banner */
.e6-note { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; margin-bottom: 18px; border: 1px solid color-mix(in srgb, var(--warn) 38%, var(--line)); border-radius: var(--r-sm); background: color-mix(in srgb, var(--warn-soft) 40%, var(--surface)); font-size: 12.5px; color: var(--ink); }
.e6-note .t { font-weight: 700; }
.e6-note .d { color: var(--ink-2); margin-top: 1px; }
/* attention list — compact inline */
.e6-att { margin-bottom: 24px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.e6-att-title { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.e6-att-row { display: flex; align-items: center; gap: 9px; padding: 6px 0; font-size: 13px; }
.e6-att-row .d { color: var(--ink-2); font-size: 12px; }
.e6-att-row .go { margin-left: auto; font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; font-weight: 650; }
/* editorial destination rows — the dominant content */
.e6-dest { display: grid; grid-template-columns: 44px 1fr auto; gap: 16px; align-items: start; padding: 18px 6px; border-bottom: 1px solid var(--line); cursor: pointer; }
.e6-dest:hover .e6-dest-t { color: var(--accent); }
.e6-dest-ic { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--ink-2); background: var(--surface); }
.e6-dest-t { font-size: 17px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 3px; transition: color var(--t-fast) var(--ease); }
.e6-dest-d { font-size: 13px; color: var(--ink-2); line-height: 1.6; max-width: 66ch; }
.e6-dest-meta { text-align: right; font-size: 11.5px; color: var(--ink-3); line-height: 1.7; white-space: nowrap; }
.e6-dest-meta b { color: var(--ink-2); font-weight: 650; }
.e6-utils { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 22px; }
.e6-util { font-size: 12.5px; color: var(--ink-3); background: none; border: none; cursor: pointer; padding: 0; font-weight: 600; }
.e6-util:hover { color: var(--accent); }

/* ---------- DOMAIN SHEET (restrained, nested subnav inside) ---------- */
.e6-crumb2 { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }
.e6-crumb2 b { color: var(--ink); font-weight: 650; }
.e6-h2 { font-size: clamp(21px, 2.6vw, 27px); font-weight: 300; letter-spacing: -.01em; margin: 2px 0 6px; }
.e6-h2 b { font-weight: 750; }
.e6-lede { font-size: 13.5px; color: var(--ink-2); line-height: 1.65; max-width: 64ch; margin-bottom: 18px; }
.e6-subnav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 5; border-bottom: 1px solid var(--line); }
.e6-subnav button { padding: 5px 12px; font-size: 12px; font-weight: 650; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pill); cursor: pointer; }
.e6-subnav button[aria-selected="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.e6-sec { margin-bottom: 26px; scroll-margin-top: 64px; }
.e6-sec-h { font-size: 15.5px; font-weight: 750; margin-bottom: 2px; }
.e6-sec-d { font-size: 12.5px; color: var(--ink-3); margin-bottom: 10px; }
.e6-mgrrow { display: grid; grid-template-columns: 40px 1fr auto; gap: 13px; align-items: center; padding: 13px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); margin-bottom: 8px; cursor: pointer; }
.e6-mgrrow:hover { border-color: var(--accent-line); }
.e6-mgrrow .t { font-size: 14px; font-weight: 700; }
.e6-mgrrow .d { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
.e6-setrow { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 18px; padding: 13px 2px; border-bottom: 1px solid var(--line); }
.e6-setrow .lbl { font-size: 13.5px; font-weight: 650; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.e6-setrow .desc { font-size: 12.5px; color: var(--ink-2); line-height: 1.6; margin-top: 3px; max-width: 62ch; }
.e6-setrow .ctl { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.e6-setrow[data-status="managed"] .ctl { opacity: .55; }
.e6-setrow[data-status="unavailable"] { opacity: .6; }
.e6-why-l { margin-top: 5px; }
.e6-why-l button { font-size: 11.5px; color: var(--ink-4); background: none; border: none; cursor: pointer; font-weight: 650; padding: 0; }
.e6-why-l button:hover { color: var(--accent); }
.e6-details { margin-top: 7px; padding: 9px 12px; border-left: 2px solid var(--line-2); font-size: 11.5px; color: var(--ink-2); line-height: 1.65; }
.e6-switch { position: relative; width: 38px; height: 21px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line); cursor: pointer; flex: none; }
.e6-switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.e6-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--surface-elev); transition: transform var(--t-fast) var(--ease); }
.e6-switch[aria-checked="true"]::after { transform: translateX(17px); }
.e6-sel { height: 30px; padding: 0 9px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-xs); color: var(--ink); font: inherit; font-size: 12px; max-width: 100%; }
.e6-range { width: 100%; accent-color: var(--accent); }
.e6-err { font-size: 11px; color: var(--bad); }

/* ---------- MANAGER: compact roster + DETAIL SHEET (slides over) ---------- */
.e6-mgr { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.e6-mgr-head { display: flex; align-items: baseline; gap: 12px; padding: 16px clamp(16px, 2.6vw, 30px) 6px; }
.e6-mgr-head h2 { margin: 0; font-size: 20px; font-weight: 300; }
.e6-mgr-head h2 b { font-weight: 750; }
.e6-mgr-head .sum { font-size: 12px; color: var(--ink-3); }
.e6-mgr-head .sp { flex: 1; }
.e6-tabs { display: flex; gap: 18px; padding: 0 clamp(16px, 2.6vw, 30px); border-bottom: 1px solid var(--line); overflow-x: auto; }
.e6-tab { padding: 8px 2px 10px; font-size: 12.5px; font-weight: 650; color: var(--ink-3); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.e6-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.e6-mgr-body { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.e6-roster { height: 100%; overflow: auto; padding: 12px clamp(16px, 2.6vw, 30px); }
.e6-rrow { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.e6-rrow:hover .e6-r-t { color: var(--accent); }
.e6-rrow[aria-selected="true"] .e6-r-t { color: var(--accent); }
.e6-r-t { font-size: 13.5px; font-weight: 650; }
.e6-r-s { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
.e6-dsheet { position: absolute; inset: 0; z-index: 8; background: var(--surface-elev); border-left: 1px solid var(--line-2); box-shadow: var(--sh-2);
  transform: translateX(102%); transition: transform var(--t-mid) var(--ease); display: flex; flex-direction: column; }
.e6-dsheet[data-open="1"] { transform: none; }
.e6-ds-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.e6-ds-head h3 { margin: 0; font-size: 16px; font-weight: 750; flex: 1; }
.e6-ds-body { flex: 1; overflow: auto; padding: 16px 18px 40px; }
.e6-ds-body .dsub { font-size: 13px; color: var(--ink-2); line-height: 1.6; margin-bottom: 12px; }
.e6-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.e6-kv { display: grid; grid-template-columns: 140px 1fr; gap: 5px 14px; font-size: 12.5px; margin-bottom: 14px; }
.e6-kv .k { color: var(--ink-3); font-weight: 650; }
.e6-kv .v { color: var(--ink); line-height: 1.55; overflow-wrap: anywhere; }
.e6-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 6px; }
.e6-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-xs); background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 650; cursor: pointer; }
.e6-btn:hover { color: var(--ink); }
.e6-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.e6-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.e6-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.e6-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); color: var(--ink); vertical-align: top; }
.e6-table td.mut { color: var(--ink-2); }
.e6-offline { display: flex; gap: 9px; padding: 10px 12px; margin-bottom: 10px; border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); border-radius: var(--r-xs); background: color-mix(in srgb, var(--warn-soft) 45%, var(--surface)); font-size: 12px; }
.e6-work { border: 1px solid var(--line); border-radius: var(--r-xs); padding: 11px 13px; background: var(--surface); margin: 10px 0; font-size: 12px; }
.e6-work .bar { height: 5px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin-top: 7px; }
.e6-work .bar > div { height: 100%; background: var(--accent); transition: width var(--t-mid) var(--ease); }
.e6-setup { border: 1px solid var(--line-2); border-radius: var(--r-xs); padding: 12px 14px; margin: 10px 0; }
.e6-setup h4 { margin: 0 0 4px; font-size: 13px; }
.e6-setup ol { margin: 4px 0 0; padding-left: 18px; font-size: 11.5px; color: var(--ink-2); line-height: 1.7; }
.e6-skel { border-radius: var(--r-xs); background: var(--surface-2); animation: v2-shimmer 1.4s ease-in-out infinite; }

/* quiet copy dialog */
.e6-veil { position: absolute; inset: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 55%, transparent); display: grid; place-items: center; padding: 16px; }
.e6-copy { width: min(720px, 100%); max-height: calc(100% - 16px); display: flex; flex-direction: column; background: var(--surface-elev); border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.e6-copy-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.e6-copy-head h3 { margin: 0; font-size: 15px; font-weight: 750; }
.e6-copy-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; }
.e6-copy-foot { display: flex; gap: 8px; padding: 11px 16px; border-top: 1px solid var(--line); }
.e6-copy-foot .sp { flex: 1; }
.e6-step { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.e6-src { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--r-xs); margin-bottom: 7px; cursor: pointer; }
.e6-src[aria-selected="true"] { border-color: var(--accent-line); background: var(--surface-2); }
.e6-cats { display: grid; gap: 7px; }
.e6-cat { display: grid; grid-template-columns: 17px 1fr; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-xs); cursor: pointer; }
.e6-cat[aria-selected="true"] { border-color: var(--accent-line); background: var(--surface-2); }
.e6-counts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.e6-count { display: flex; align-items: baseline; gap: 6px; padding: 7px 11px; border: 1px solid var(--line); border-radius: var(--r-xs); font-size: 11px; color: var(--ink-3); }
.e6-count b { font-size: 15px; color: var(--ink); }
.e6-cplist { border: 1px solid var(--line); border-radius: var(--r-xs); height: 200px; overflow: auto; }
.e6-receipt { border: 1px solid color-mix(in srgb, var(--ok) 40%, var(--line)); background: color-mix(in srgb, var(--ok-soft) 35%, var(--surface)); border-radius: var(--r-xs); padding: 13px; font-size: 12.5px; }
/* details drawer (left, mirrors the sheet metaphor) */
.e6-drawer { position: absolute; left: 0; top: 0; bottom: 0; width: min(400px, 92%); z-index: 45; background: var(--surface-elev); border-right: 1px solid var(--line-2);
  display: flex; flex-direction: column; transform: translateX(-102%); transition: transform var(--t-mid) var(--ease); }
.e6-drawer[data-open="1"] { transform: none; }
.e6-drawer-head { display: flex; align-items: center; gap: 8px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
.e6-drawer-head h4 { margin: 0; font-size: 14px; flex: 1; }
.e6-drawer-body { flex: 1; overflow: auto; padding: 13px 15px; font-size: 12.5px; line-height: 1.65; color: var(--ink-2); }
.e6-drawer-body b { color: var(--ink); }
/* topbar bits */
.e6-crumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); min-width: 0; overflow: hidden; }
.e6-crumb b { color: var(--ink); white-space: nowrap; }
.e6-proj { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.e6-proj b { color: var(--ink); }
.e6-tb { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border: 1px solid var(--line); border-radius: var(--r-xs); background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 650; cursor: pointer; }
.e6-tb.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.e6-minis { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; min-width: 180px; max-width: 300px; flex: 1; border: 1px solid var(--line); border-radius: var(--r-xs); background: var(--surface); }
.e6-minis input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--ink); font-size: 12.5px; }
.e6-nb { display: none; }
@media (max-width: 1023px) {
  .e6-rail { position: absolute; z-index: 44; top: var(--shell-h); bottom: var(--footer-h); left: 60px; width: 236px; box-shadow: var(--sh-3); }
  .e6-nb { display: inline-flex; }
  .e6-crumb { display: none; }
  .e6-setrow { grid-template-columns: 1fr; }
  .e6-setrow .ctl { align-items: flex-start; }
  .e6-dest { grid-template-columns: 44px 1fr; }
  .e6-dest-meta { grid-column: 2; text-align: left; }
}
@media (max-width: 899px) {
  .pm-shell { grid-template-columns: 60px 1fr var(--chat-w, 0px); grid-template-areas: "topbar topbar topbar" "activity stage chat" "footer footer footer"; }
}
@media (min-width: 1800px) { .e6-page { max-width: 980px; } .e6-rail { width: 248px; } }

/* ===== squeeze: 760px topbar survival (added by verification pass) ===== */
@media (max-width: 899px) {
  .pm-topbar .pm-brand { display: none; }
  .pm-topbar { gap: 6px; }
  #themeBtn, #closeBtn, #navToggle { font-size: 0; gap: 0; padding: 0 9px; }
  #themeBtn svg, #closeBtn svg, #navToggle svg { margin-right: 0; }
  #projChip, .d5-projchip, .e6-proj, .c7-proj, .t8-proj, .n9-proj, .m10-proj, .o11-proj { max-width: 130px; overflow: hidden; white-space: nowrap; }
  .d5-mini-search, .e6-minis, .c7-minis, .t8-minis, .n9-minis, .m10-cmdinput, .o11-search { min-width: 90px !important; }
}
</style>
</head>
<body>
<div class="pm-shell" id="shell" data-rail="closed" data-chat="closed">
  <header class="pm-topbar">
    <span class="pm-brand">PUPPET&nbsp;MASTER</span>
    <button class="e6-tb e6-nb" id="navToggle" aria-label="Settings navigation"></button>
    <nav class="e6-crumb" id="crumb" aria-label="Settings location"></nav>
    <span class="pm-spacer"></span>
    <div class="e6-minis" id="miniWrap" hidden><span id="miniIcon"></span><input id="miniSearch" type="search" placeholder="Search settings" aria-label="Search settings" autocomplete="off"></div>
    <span class="e6-proj" id="projChip"></span>
    <button class="e6-tb" id="themeBtn"></button>
    <button class="e6-tb" id="closeBtn"></button>
  </header>
  <nav class="pm-activity" aria-label="Activity Bar" id="activity"></nav>
  <aside class="pm-rail" data-hidden></aside>
  <main class="pm-stage" id="stage" style="position:relative;">
    <a data-concept-model="GLM-5.2" href="index.html" title="GLM-5.2 settings concept" style="position:absolute;opacity:0;pointer-events:none;" aria-hidden="true">GLM-5.2</a>
    <div class="e6" id="app">
      <aside class="e6-rail" id="e6rail"></aside>

  /* DOMAIN sheet — nested subnav inside the sheet */

      var list = el("cpList"), rows = COPY.preview.rows, RH = 30, pad2 = document.createElement("div"), win2 = document.createElement("div");
      pad2.className = "v2-virt-pad"; win2.style.position = "relative"; list.append(pad2, win2);
      function draw2() {
        var w = PM2.window({ scrollTop: list.scrollTop, viewportHeight: 200, rowHeight: RH, total: rows.length });
        pad2.style.height = (w.padTop + w.count * RH + w.padBottom) + "px"; win2.style.transform = "translateY(" + w.padTop + "px)";
        var h = "";
        for (var i = w.first; i < w.first + w.count; i++) {
          var rr = rows[i]; if (!rr) break;
          var s = PM2.inventory.byId[rr.settingId];
          h += '<div style="height:' + RH + 'px;display:flex;align-items:center;gap:8px;font-size:11.5px;border-bottom:1px solid var(--line)"><span class="v2badge ' + (rr.kind === "additions" ? "ok" : rr.kind === "replacements" ? "info" : rr.kind === "conflicts" ? "warn" : rr.kind === "unavailable" ? "bad" : "") + '">' + rr.kind.replace(/s$/, "") + '</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(s ? s.label : rr.settingId) + "</span></div>";
        }
        win2.innerHTML = h;
      }
      draw2(); list.addEventListener("scroll", draw2);
      f.innerHTML = '<button class="e6-tb" id="copyBack">Back</button><span class="sp"></span><button class="e6-tb" id="copyGo" style="background:var(--accent);border-color:var(--accent);color:var(--accent-ink)">Restore point & apply</button>';
      el("copyBack").addEventListener("click", function () { COPY.step = 1; drawCopy(); });
      el("copyGo").addEventListener("click", function () {
        COPY.step = 3;
        b.innerHTML = '<div class="e6-step">4 of 4 · Applying…</div><div class="e6-work" id="cw"></div>'; f.innerHTML = "";
        var box = el("cw");
        var w = STORE.work({ kind: "copy", label: "Copy settings", phases: ["restore point", "apply", "verify"], steps: 10, fast: true });
        var un = STORE.subscribe("work", function () {
          box.innerHTML = "<b>" + esc(w.label) + "</b> — " + esc(w.note) + '<div class="bar"><div style="width:' + ((w.phaseI + 1) / 3 * 100) + '%"></div></div>';
          if (w.state === "done") {
            un();
            COPY.result = STORE.applyCopy(COPY.preview, COPY.cats);
            b.innerHTML = '<div class="e6-step">Done</div><div class="e6-receipt"><b>' + COPY.result.counts.applied + " values copied</b> · " + COPY.result.counts.skipped + " skipped.<br>Verified: " + COPY.result.verify.checked + " checked, " + COPY.result.verify.mismatches + " mismatches. Receipt <b>" + esc(COPY.result.receipt.id) + "</b> · restore point <b>" + esc(COPY.result.restorePoint.label) + "</b>.<br>" + COPY.result.verify.note + "</div>" +
              '<div class="e6-offline" style="border-color:var(--line);margin-top:8px"><span class="sdot ok"></span><b>' + esc(PM2.currentProject.name) + "</b> and <b>" + esc(COPY.preview.source.name) + "</b> are independent. Nothing propagates later.</div>";
            f.innerHTML = '<button class="e6-tb" id="copyRoll">Rollback</button><span class="sp"></span><button class="e6-tb" id="copyDone" style="background:var(--accent);border-color:var(--accent);color:var(--accent-ink)">Done</button>';
            el("copyRoll").addEventListener("click", function () { STORE.rollback(COPY.result.restorePoint.id); openDrawer("Rollback complete", "Values restored to the pre-copy restore point. Receipt recorded."); copyClose(); });
            el("copyDone").addEventListener("click", copyClose);
          }
        });
      });
    }
  }

  /* boot */
  var initial = PM2.routes.parse(location.hash);
  if (initial.domain || initial.manager || initial.mode) NAV.stack = [Object.assign({ domain: null }, initial)];
  render(NAV.top());
  if (initial.row || initial.object || initial.query) land(PM2.routes.planFor(initial), PM2.search.byRid(initial.resultId || "") || null);
  searchAttach(el("miniSearch"));
  window.__C6 = { PM2: PM2, STORE: STORE, NAV: NAV, state: state, pickResult: pickResult };
})();
</script>
</body>
</html>
