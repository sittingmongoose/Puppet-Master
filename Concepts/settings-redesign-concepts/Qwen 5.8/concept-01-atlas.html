<!doctype html>
<html lang="en" data-theme="friendly-dark" data-reduced-motion="0" data-concept-id="concept-01-atlas">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas — Settings Directory — Qwen 5.8</title>
<link rel="stylesheet" href="_shared/pm-shell.css">
<style>
/* ============================================================
   Atlas — a directory of places, each with its own document.
   Cartographic travel: every view arrives from a spatial origin.
   ============================================================ */

.at-home, .at-work { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
.at-home { scroll-behavior: smooth; }
[data-reduced-motion="1"] .at-home, [data-reduced-motion="1"] .at-work { scroll-behavior: auto; }

/* --- Cartographic travel ------------------------------------ */
.at-view { animation: atTravel .46s cubic-bezier(.2, .8, .2, 1) both; }
.at-view[data-travel="back"] { animation-name: atTravelBack; }
@keyframes atTravel {
  from { opacity: 0; transform: translate3d(26px, 10px, 0) scale(.99); }
  to { opacity: 1; transform: none; }
}
@keyframes atTravelBack {
  from { opacity: 0; transform: translate3d(-26px, 10px, 0) scale(.99); }
  to { opacity: 1; transform: none; }
}
[data-reduced-motion="1"] .at-view,
[data-reduced-motion="1"] .at-view[data-travel="back"] { animation: none; }

.at-rise { animation: atRise .3s ease both; }
@keyframes atRise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
[data-reduced-motion="1"] .at-rise { animation: none; }

.at-kicker { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }

/* --- Home ---------------------------------------------------- */
.at-home-head { padding: 32px 40px 8px; max-width: 1200px; margin: 0 auto; width: 100%; }
.at-home-title { font-size: 30px; font-weight: 700; color: var(--text-1); margin: 4px 0 2px; letter-spacing: -.01em; }
.at-home-sub { color: var(--text-2); font-size: 13.5px; max-width: 660px; margin: 0; }

.at-searchwrap { padding: 18px 40px 6px; max-width: 1200px; margin: 0 auto; width: 100%; }
.at-search {
  display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--radius-l); padding: 13px 16px; box-shadow: var(--shadow);
}
.at-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.at-search input { flex: 1; border: none; outline: none; background: none; color: var(--text-1); font-size: 15px; min-width: 0; }
.at-search .pm-ico { color: var(--text-3); }
.at-search-hint { color: var(--text-3); font-size: 11px; white-space: nowrap; }

.at-results { max-width: 1200px; margin: 0 auto; width: 100%; padding: 10px 40px 30px; }
.at-results-group { margin: 14px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-3); }
.at-result {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid var(--border);
  background: var(--surface); border-radius: var(--radius-m); padding: 10px 14px; cursor: pointer; margin-bottom: 6px;
  color: var(--text-1);
}
.at-result:hover, .at-result:focus-visible, .at-result.active { border-color: var(--accent); background: var(--surface-2); }
.at-result .at-r-main { flex: 1; min-width: 0; }
.at-r-title { color: var(--text-1); font-weight: 600; font-size: 13px; }
.at-r-path { color: var(--text-3); font-size: 11.5px; }
.at-r-note { color: var(--text-3); font-size: 11.5px; margin-top: 2px; }
.pm-search-type {
  font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border-strong);
  color: var(--text-2); background: var(--surface-3); white-space: nowrap; flex: none;
}
.pm-search-type[data-rt="action"] { color: var(--info); border-color: color-mix(in srgb, var(--info) 45%, transparent); }
.pm-search-type[data-rt="status"] { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.pm-search-type[data-rt="diagnostic"] { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.pm-search-type[data-rt="setup"] { color: var(--info); border-color: color-mix(in srgb, var(--info) 45%, transparent); }
.pm-search-type[data-rt="unavailable"] { color: var(--text-3); }
.pm-search-type[data-rt="manager"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

.at-cols { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 24px; max-width: 1200px; margin: 0 auto; width: 100%; padding: 14px 40px 46px; align-items: start; }

.at-dir { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius-l); background: var(--surface); }
.at-dir-cap { padding: 12px 18px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-3); border-bottom: 1px solid var(--border); }
.at-dest {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: 14px; align-items: center;
  width: 100%; text-align: left; border: none; border-bottom: 1px solid var(--border); background: none;
  padding: 14px 18px; cursor: pointer; color: var(--text-1); font: inherit;
  transition: background-color .16s;
}
.at-dest:last-child { border-bottom: none; }
.at-dest:hover, .at-dest:focus-visible { background: var(--surface-2); }
.at-dest-ico { width: 34px; height: 34px; border-radius: var(--radius-m); background: var(--surface-3); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-2); transition: color .16s, border-color .16s; }
.at-dest:hover .at-dest-ico, .at-dest:focus-visible .at-dest-ico { color: var(--accent); border-color: var(--accent); }
.at-dest-main { min-width: 0; }
.at-dest-title { display: block; font-size: 14.5px; font-weight: 650; color: var(--text-1); }
.at-dest-purpose { display: block; font-size: 12px; color: var(--text-2); margin-top: 1px; }
.at-dest-status { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.at-open {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--surface-2);
  color: var(--text-1); font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  transition: border-color .16s, color .16s, background-color .16s;
}
.at-dest:hover .at-open, .at-dest:focus-visible .at-open { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.at-side { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.at-side h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-3); font-weight: 650; }
.at-notice { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 12px 14px; margin-bottom: 8px; }
.at-notice-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
.at-notice-x { border: none; background: none; color: var(--text-3); cursor: pointer; padding: 2px; border-radius: var(--radius-s); display: inline-flex; }
.at-notice-x:hover { color: var(--text-1); background: var(--surface-2); }
.at-notice h4 { margin: 0 0 4px; font-size: 13px; color: var(--text-1); font-weight: 650; }
.at-notice p { margin: 0 0 10px; font-size: 12px; color: var(--text-2); }
.at-notice-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.at-recent { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--border); padding: 9px 2px; cursor: pointer; color: var(--text-2); font: inherit; font-size: 12.5px; }
.at-recent:hover, .at-recent:focus-visible { color: var(--text-1); }
.at-recent .when { margin-left: auto; color: var(--text-3); font-size: 11px; white-space: nowrap; }
.at-note-card { border: 1px dashed var(--border-strong); border-radius: var(--radius-m); padding: 14px 16px; color: var(--text-2); font-size: 12.5px; margin-bottom: 12px; background: var(--surface-3); }

/* --- Workspace ------------------------------------------------ */
.at-work-head {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 9px 22px; background: var(--bg-shell); border-bottom: 1px solid var(--border);
}
[data-chrome-blur="on"] .at-work-head { backdrop-filter: var(--chrome-blur); }
.at-cat-title { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 700; color: var(--text-1); white-space: nowrap; }
.at-cat-title .pm-ico { color: var(--accent); }
.at-cat-purpose { color: var(--text-3); font-size: 12px; }
.at-head-right { display: flex; align-items: center; gap: 8px; position: relative; margin-left: auto; }

.at-cats { display: flex; gap: 2px; padding: 5px 14px; border-bottom: 1px solid var(--border); background: var(--bg-shell); overflow-x: auto; flex-wrap: nowrap; }
.at-cat-tab {
  display: inline-flex; align-items: center; gap: 6px; border: none; background: none; color: var(--text-2);
  font-size: 12px; padding: 5px 10px; border-radius: var(--radius-s); cursor: pointer; white-space: nowrap; flex: none;
}
.at-cat-tab:hover { background: var(--surface-2); color: var(--text-1); }
.at-cat-tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 650; }

.at-mini-searchwrap { position: relative; }
.at-search-mini { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-m); padding: 5px 10px; width: 230px; }
.at-search-mini input { flex: 1; border: none; outline: none; background: none; color: var(--text-1); font-size: 12.5px; min-width: 0; }
.at-mini-drop {
  position: absolute; top: calc(100% + 6px); right: 0; width: 340px; max-height: 340px; overflow-y: auto; z-index: 60;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-m);
  box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column; gap: 4px;
}
.at-mini-drop .at-result { margin-bottom: 0; padding: 8px 10px; }
.at-mini-drop-note { font-size: 11.5px; color: var(--text-3); padding: 8px; }

.at-work-body { position: relative; display: grid; grid-template-columns: 232px minmax(0, 1fr); align-items: start; }
.at-toc { position: sticky; top: 52px; align-self: start; padding: 16px 10px 16px 14px; max-height: calc(100vh - 170px); overflow-y: auto; min-width: 0; }
.at-toc-cap { padding: 0 10px 8px; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); }
.at-toc-marker {
  position: absolute; left: 14px; width: 208px; height: 30px; border-radius: var(--radius-s);
  background: var(--accent-soft); z-index: 0; pointer-events: none;
  transition: transform .28s cubic-bezier(.2, .8, .2, 1), height .28s cubic-bezier(.2, .8, .2, 1);
}
[data-reduced-motion="1"] .at-toc-marker { transition: none; }
.at-toc-item {
  position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: none; background: none;
  color: var(--text-2); font-size: 12.5px; padding: 7px 10px; border-radius: var(--radius-s); cursor: pointer; white-space: nowrap;
  transition: color .18s;
}
.at-toc-item:hover { color: var(--text-1); }
.at-toc-item.active { color: var(--accent); font-weight: 650; }
.at-toc-item .pm-ico { flex: none; opacity: .55; }
.at-toc-item.active .pm-ico { opacity: 1; }

.at-toc-drawer { display: none; }
.at-toc-close { display: none; position: absolute; top: 8px; right: 8px; }

.at-doc { padding: 20px 30px 90px; min-width: 0; max-width: 940px; }
.at-sub { margin-bottom: 36px; scroll-margin-top: 64px; }
.at-sub-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.at-sub-head h2 { font-size: 17px; margin: 0; color: var(--text-1); font-weight: 700; }
.at-sub-count { color: var(--text-3); font-size: 11.5px; }

/* --- Demonstrated manager language (at-*) ---------------------- */
.at-mgr-cap { margin: 18px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-3); }

.at-chain-row, .at-src-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); margin-bottom: 5px; font-size: 12.5px; color: var(--text-1); }
.at-chain-row code { font-family: var(--font-mono); font-size: 12px; }
.at-src-row .pm-note { flex: 1; min-width: 140px; }
.at-src-row.omitted { background: var(--surface-3); color: var(--text-2); }

.at-mem { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 12px 14px; margin-bottom: 8px; }
.at-mem .txt { color: var(--text-1); font-size: 13px; }
.at-mem .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; align-items: center; }
.at-mem-actions { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }

.at-persona { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 12px 14px; margin-bottom: 8px; }
.at-persona-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--text-1); font-size: 13px; }
.at-persona-head b { font-size: 13.5px; }
.at-persona-desc { font-size: 12px; color: var(--text-2); margin: 4px 0 8px; }
.at-persona-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 11.5px; color: var(--text-2); margin-bottom: 8px; }
.at-persona-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.at-cap-chip {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border-strong); border-radius: var(--radius-m);
  background: var(--surface-3); color: var(--text-1); font-size: 12.5px; padding: 8px 12px; flex-wrap: wrap;
}
.at-cap-chip .pm-ico { color: var(--info); }

.at-crew-member { display: grid; grid-template-columns: minmax(110px, 160px) minmax(0, 1fr); gap: 4px 12px; font-size: 12px; padding: 5px 0; border-bottom: 1px dashed var(--border); }
.at-crew-member:last-child { border-bottom: none; }
.at-crew-member .role { color: var(--text-1); font-weight: 600; }
.at-crew-member .route { color: var(--text-2); }
.at-crew-member .cands { grid-column: 1 / -1; color: var(--text-3); font-size: 11.5px; }

.at-bsd-grid { display: flex; flex-direction: column; gap: 4px; }
.at-preset { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 8px 12px; margin-bottom: 6px; color: var(--text-1); font-size: 12.5px; }
.at-preset .pm-note { flex: 1; min-width: 140px; }

/* --- Shared-grammar manager touch-ups --------------------------- */
.at-mgr .pm-mgr-head { position: relative; }
.at-mgr .pm-rule-add input { flex: 1; min-width: 160px; }
.at-mgr .pm-trace input { min-width: 200px; }
.at-mgr .pm-form-grid label { min-width: 0; }
.at-mgr .pm-inspect-row { grid-template-columns: minmax(150px, 230px) minmax(0, 1fr); }
.at-mgr .pm-reslist { display: flex; flex-direction: column; gap: 6px; }
.at-resitem { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 9px 13px; }
.at-resitem-main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--text-1); font-size: 12.5px; }
.at-resitem-main b { font-size: 12.5px; }
.at-resitem .pm-note { margin-top: 3px; }
.at-resitem-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.at-log { font-family: var(--font-mono); font-size: 11px; color: var(--text-2); padding: 2px 0; }

/* --- Width tiers -------------------------------------------------- */
.pm-app[data-wtier="squeezed"] .at-cols, .pm-app[data-wtier="narrow"] .at-cols { grid-template-columns: 1fr; }
.pm-app[data-wtier="squeezed"] .at-home-head, .pm-app[data-wtier="narrow"] .at-home-head,
.pm-app[data-wtier="squeezed"] .at-searchwrap, .pm-app[data-wtier="narrow"] .at-searchwrap,
.pm-app[data-wtier="squeezed"] .at-results, .pm-app[data-wtier="narrow"] .at-results,
.pm-app[data-wtier="squeezed"] .at-cols, .pm-app[data-wtier="narrow"] .at-cols { padding-left: 18px; padding-right: 18px; }
.pm-app[data-wtier="squeezed"] .at-search-hint, .pm-app[data-wtier="narrow"] .at-search-hint { display: none; }
.pm-app[data-wtier="squeezed"] .at-dest { grid-template-columns: 34px minmax(0, 1fr); }
.pm-app[data-wtier="squeezed"] .at-dest-status { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: flex-start; }
.pm-app[data-wtier="squeezed"] .at-open { grid-column: 1 / -1; justify-content: center; }

.pm-app[data-wtier="squeezed"] .at-work-body, .pm-app[data-wtier="narrow"] .at-work-body { grid-template-columns: 1fr; }
.pm-app[data-wtier="squeezed"] .at-toc, .pm-app[data-wtier="narrow"] .at-toc { display: none; }
.pm-app[data-wtier="squeezed"] .at-toc-drawer, .pm-app[data-wtier="narrow"] .at-toc-drawer { display: inline-flex; }
.pm-app[data-wtier="squeezed"] .at-toc.open, .pm-app[data-wtier="narrow"] .at-toc.open {
  display: block; position: fixed; top: 46px; bottom: 32px; left: 0; width: min(280px, 84vw); z-index: 80;
  background: var(--surface); border-right: 1px solid var(--border-strong); box-shadow: var(--shadow);
  padding: 40px 12px 16px; max-height: none; overflow-y: auto;
}
.pm-app[data-wtier="squeezed"] .at-toc.open .at-toc-close, .pm-app[data-wtier="narrow"] .at-toc.open .at-toc-close { display: inline-flex; }
.pm-app[data-wtier="squeezed"] .at-toc.open .at-toc-marker, .pm-app[data-wtier="narrow"] .at-toc.open .at-toc-marker { left: 12px; width: calc(min(280px, 84vw) - 28px); }
.pm-app[data-wtier="squeezed"] .at-search-mini, .pm-app[data-wtier="narrow"] .at-search-mini { width: 160px; }
.pm-app[data-wtier="squeezed"] .at-cat-purpose { display: none; }
.pm-app[data-wtier="squeezed"] .at-mini-drop { width: min(340px, calc(100vw - 32px)); }
.pm-app[data-wtier="squeezed"] .at-doc, .pm-app[data-wtier="narrow"] .at-doc { padding-left: 18px; padding-right: 18px; }

/* Forms never clip: allow wrapping everywhere a control row can get tight. */
.at-mgr .pm-set-ctl { justify-content: flex-start; }
.pm-app[data-wtier="squeezed"] .pm-set-main { flex-direction: column; align-items: stretch; gap: 8px; }
</style>
</head>
<body>
<div id="app" data-concept-model="Qwen 5.8"></div>
<script src="_shared/pm-icons.js"></script>
<script src="_shared/pm-demo-data.js"></script>
<script src="_shared/pm-data-extra.js"></script>
<script src="_shared/pm-state.js"></script>
<script src="_shared/pm-settings-core.js"></script>
<script src="_shared/pm-managers.js"></script>
<script src="_shared/pm-shell.js"></script>
<script src="_shared/concept-hub-bridge.js"></script>
<script>
(function () {
  "use strict";

  var MODEL = "Qwen 5.8";
  var D = window.PMDemoData;
  var M = window.PMManagers;
  var esc = M.esc;
  var ico = function (n, s) { return window.PMIcons.get(n, s || 14); };

  // ============================================================
  // Boot (contract order)
  // ============================================================
  window.PMState.init("concept-01-atlas");
  M.setPrefix("at-");
  var shell = window.PMShell.mount({ conceptName: "Atlas", model: MODEL });
  var content = shell.content;
  var INDEX = window.PMCore.buildSearchIndex();

  var spy = null;
  var currentCat = null;      // for cartographic travel direction
  var currentView = null;
  var localUi = { permView: "expert", openMems: {}, openPersonas: {}, miniDrop: false };
  var memTrash = [];          // deleted gists: { index, snap } — full snapshots for reinsertion
  var memHistory = {};         // id -> [{ text }] superseded versions, newest first
  var activeResult = -1;

  function destById(id) {
    for (var i = 0; i < D.destinations.length; i++) if (D.destinations[i].id === id) return D.destinations[i];
    return null;
  }
  function subById(d, sid) {
    for (var i = 0; i < d.subcategories.length; i++) if (d.subcategories[i].id === sid) return d.subcategories[i];
    return null;
  }
  function subForManager(d, mgr) {
    for (var i = 0; i < d.subcategories.length; i++) if (d.subcategories[i].manager === mgr) return d.subcategories[i];
    return null;
  }

  // ============================================================
  // Small shared render helpers
  // ============================================================
  function statusChip(dest) {
    var k = dest.status.kind;
    if (k === "attention") return '<span class="pm-badge pm-badge-danger">' + ico("alertTriangle", 11) + " " + esc(dest.status.summary) + "</span>";
    if (k === "warn") return '<span class="pm-badge pm-badge-warn">' + ico("clock", 11) + " " + esc(dest.status.summary) + "</span>";
    if (k === "setup") return '<span class="pm-badge pm-badge-info">' + ico("clock", 11) + " " + esc(dest.status.summary) + "</span>";
    return '<span class="pm-badge pm-badge-ok">' + ico("checkCircle", 11) + " " + esc(dest.status.summary) + "</span>";
  }

  function rtChip(rt) {
    return '<span class="pm-search-type" data-rt="' + esc(rt) + '">' + esc(rt) + "</span>";
  }

  function noticeCard(n) {
    var chip = n.group === "attention" ? "pm-badge-danger" : n.group === "continue" ? "pm-badge-info" : "pm-badge-ok";
    var icon = n.group === "attention" ? "alertTriangle" : n.group === "continue" ? "clock" : "spark";

  function bindHome() {
    var q = document.getElementById("at-q");
    var results = document.getElementById("at-results");
    var dir = document.getElementById("at-directory");
    var last = null;
    activeResult = -1;

    function run() {
      var v = q.value.trim();
      if (!v) { results.hidden = true; dir.hidden = false; last = null; activeResult = -1; return; }
      var hits = window.PMCore.search(v, INDEX);
      dir.hidden = true; results.hidden = false;
      if (!hits.length) {
        results.innerHTML = '<div class="at-note-card">No matches for “' + esc(v) + '”. Try “compaction”, “spellcheck”, “backup”, or a provider name.</div>';
        last = null; activeResult = -1; return;
      }
      var groups = {};
      hits.forEach(function (h) {
        var g = h.kind === "setting" ? "Settings" : h.kind === "manager" ? "Managers" : h.kind === "provider" || h.kind === "model" ? "Providers & models" : h.kind === "persona" ? "Personas" : h.kind === "action" ? "One-shot actions" : h.kind === "status" ? "Status" : h.kind === "diagnostic" ? "Diagnostics" : h.kind === "setup" ? "Setup" : "Places";
        (groups[g] = groups[g] || []).push(h);
      });
      var html = "";
      var idx = 0;
      Object.keys(groups).forEach(function (g) {
        html += '<div class="at-results-group">' + g + "</div>";
        groups[g].forEach(function (h) { html += resultRow(h, idx++); });
      });
      results.innerHTML = html;
      last = hits;
      activeResult = 0;
      mark();
    }

    function mark() {
      results.querySelectorAll("[data-hit]").forEach(function (b) {
        b.classList.toggle("active", Number(b.getAttribute("data-hit")) === activeResult);
      });
      var el = results.querySelector('[data-hit="' + activeResult + '"]');
      if (el) el.scrollIntoView({ block: "nearest" });
    }

    function go(hit) {
      if (!hit) return;
      window.PMState.navigate(Object.assign({ name: "workspace" }, hit.target));
    }

    q.addEventListener("input", run);
    q.addEventListener("keydown", function (e) {
      var n = last ? last.length : 0;
      if (!n) return;
      if (e.key === "ArrowDown") { e.preventDefault(); activeResult = Math.min(activeResult + 1, n - 1); mark(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); activeResult = Math.max(activeResult - 1, 0); mark(); }
      else if (e.key === "Enter") { e.preventDefault(); go(last[Math.max(activeResult, 0)]); }
      else if (e.key === "Escape") { q.value = ""; run(); }
    });

    results.addEventListener("click", function (e) {
      var b = e.target.closest("[data-hit]");
      if (b && last) go(last[Number(b.getAttribute("data-hit"))]);
    });

    content.querySelectorAll("[data-dest]").forEach(function (b) {
      b.addEventListener("click", function () {
        window.PMState.navigate({ name: "workspace", category: b.getAttribute("data-dest") });
      });
    });
    content.querySelectorAll("[data-recent]").forEach(function (b) {
      b.addEventListener("click", function () {
        var r = window.PMState.state.recents.filter(function (x) { return x.id === b.getAttribute("data-recent"); })[0];
        if (r) window.PMState.navigate(Object.assign({ name: "workspace" }, r.target));
      });
    });
    content.querySelectorAll("[data-notice-go]").forEach(function (b) {
      b.addEventListener("click", function () {
        var n = window.PMState.state.notices.filter(function (x) { return x.id === b.getAttribute("data-notice-go"); })[0];
        if (n) noticeAction(n, false);
      });
    });
    content.querySelectorAll("[data-notice-sec]").forEach(function (b) {
      b.addEventListener("click", function () {
        var n = window.PMState.state.notices.filter(function (x) { return x.id === b.getAttribute("data-notice-sec"); })[0];
        if (n) noticeAction(n, true);
      });
    });
  }

  function renderWorkspace(v) {
    var d = destById(v.category);

    var travel = "fwd";

      var ids = D.destinations.map(function (x) { return x.id; });
      travel = ids.indexOf(d.id) < ids.indexOf(currentCat) ? "back" : "fwd";
    } else if (!currentCat) {
      travel = "fwd";

        "</span>" +

        }).join("") +

          '<button class="pm-btn pm-btn-quiet pm-btn-sm pm-btn-ico at-toc-close" id="at-toc-close" aria-label="Close sections">' + ico("x", 13) + "</button>" +
          '<div class="at-toc-cap">Sections</div>' +

  function hydrateManagers(d, v) {
    d.subcategories.forEach(function (sub) {
      var slots = [];
      if (sub.manager) slots.push(sub.manager);
      if (sub.id === "bsd") slots.push("bsd");
      if (sub.id === "goal-mode") slots.push("goal-automation");
      slots.forEach(function (mgrId) {
        var slot = content.querySelector('[data-manager-slot="' + mgrId + '"]');
        if (!slot) return;
        if (mgrId === "providers") { mgrProviders(slot, false); return; }
        var render = MGR[mgrId];
        if (!render) {
          slot.innerHTML = M.managerShell({ id: mgrId, title: window.PMCore.managerTitle(mgrId), body: '<div class="pm-empty">Shared grammar manager.</div>' });
          return;
        }
        window.PMCore.hydrateManager(slot, function (el) { render(el); });
      });
    });
  }

  function bindWorkspace(v, d) {
    var scroller = document.getElementById("at-work");
    var doc = document.getElementById("at-doc");

    document.getElementById("at-back").addEventListener("click", function () {
      window.PMState.navigate({ name: "home" });
    });
    content.querySelectorAll("[data-cat]").forEach(function (b) {
      b.addEventListener("click", function () {
        window.PMState.navigate({ name: "workspace", category: b.getAttribute("data-cat") });
      });
    });

    var toc = document.getElementById("at-toc");
    var marker = document.getElementById("at-toc-marker");
    var tocItems = content.querySelectorAll(".at-toc-item");

    function placeMarker(id) {
      var btn = toc.querySelector('[data-sub="' + id + '"]');
      if (!btn || !marker) return;
      // .at-toc is positioned (sticky), so btn.offsetTop is nav-local.
      marker.style.transform = "translateY(" + btn.offsetTop + "px)";
      marker.style.height = btn.offsetHeight + "px";
      marker.style.top = "0";
    }

    if (spy) { spy.destroy(); spy = null; }
    spy = window.PMCore.scrollspy(scroller, function () {
      return d.subcategories.map(function (s) { return { id: s.id, el: doc.querySelector('[data-sub-section="' + s.id + '"]') }; });
    }, function (id) {
      tocItems.forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-sub") === id); });
      placeMarker(id);
    }, { offset: 84 });

    tocItems.forEach(function (b) {
      b.addEventListener("click", function () {
        spy.jumpTo(b.getAttribute("data-sub"));
        toc.classList.remove("open");
      });
    });

    var tocToggle = document.getElementById("at-toc-toggle");
    if (tocToggle) tocToggle.addEventListener("click", function () { toc.classList.toggle("open"); });
    var tocClose = document.getElementById("at-toc-close");
    if (tocClose) tocClose.addEventListener("click", function () { toc.classList.remove("open"); });

    // Mini search in the workspace head.
    var q2 = document.getElementById("at-q2");
    var drop = document.getElementById("at-mini-drop");
    var miniHits = [];
    function miniRun() {
      var val = q2.value.trim();
      if (!val) { drop.hidden = true; miniHits = []; return; }
      miniHits = window.PMCore.search(val, INDEX).slice(0, 8);
      if (!miniHits.length) {
        drop.innerHTML = '<div class="at-mini-drop-note">No matches for “' + esc(val) + '”.</div>';
        drop.hidden = false; return;
      }
      drop.innerHTML = miniHits.map(function (h, i) { return resultRow(h, i); }).join("");
      drop.hidden = false;
    }
    function miniGo(i) {
      var h = miniHits[i];
      if (!h) return;
      drop.hidden = true; q2.value = "";
      window.PMState.navigate(Object.assign({ name: "workspace" }, h.target));
    }
    q2.addEventListener("input", miniRun);
    q2.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); miniGo(0); }
      if (e.key === "Escape") { drop.hidden = true; q2.value = ""; }
    });
    drop.addEventListener("click", function (e) {
      var b = e.target.closest("[data-hit]");
      if (b) miniGo(Number(b.getAttribute("data-hit")));
    });
    document.addEventListener("click", function (e) {
      if (!drop.hidden && !e.target.closest(".at-mini-searchwrap")) drop.hidden = true;
    });

    // Deep-link targets: subcategory jump, setting focus, provider scroll.
    function maybeFocus() {
      if (v.subcategory) {
        spy.jumpTo(v.subcategory, function () { focusTarget(); });
        return;
      }
      if (v.manager) {
        var subForMgr = subForManager(d, v.manager);
        if (subForMgr) { spy.jumpTo(subForMgr.id, function () { focusTarget(); }); return; }
      }
      focusTarget();
    }
    function focusTarget() {
      if (v.setting) {
        var row = content.querySelector('[data-setting-row="' + v.setting + '"]');
        if (row) { row.scrollIntoView({ block: "center", behavior: window.PMCore.reducedMotion() ? "auto" : "smooth" }); window.PMCore.focusFlash(row); }
      } else if (v.provider) {
        waitForEl('[data-provider-card="' + v.provider + '"]', function (card) {
          card.scrollIntoView({ block: "start", behavior: window.PMCore.reducedMotion() ? "auto" : "smooth" });
          window.PMCore.focusFlash(card);
          // Open the install tab when an update action is the point of the visit.
          var instTab = card.querySelector('[data-ptab="install"]');
          if (instTab) instTab.click();
        });
      } else if (v.manager) {
        waitForEl('[data-manager="' + v.manager + '"]', function (mgr) {
          mgr.scrollIntoView({ block: "start", behavior: window.PMCore.reducedMotion() ? "auto" : "smooth" });
          window.PMCore.focusFlash(mgr);
        });
      }
    }
    function waitForEl(sel, fn) {
      var tries = 0;
      (function poll() {
        var el = content.querySelector(sel);
        if (el) { fn(el); return; }
        if (++tries > 40) return;
        setTimeout(poll, 120);
      })();
    }
    maybeFocus();
  }

  // ============================================================
  // Targeted re-renders on state events
  // ============================================================
  function inWorkspace(cat) {
    return currentView && currentView.name === "workspace" && currentView.category === cat;
  }

  function rerenderManagerInPlace(mgrId) {
    var slot = content.querySelector('[data-manager-slot="' + mgrId + '"]');
    if (!slot) return;
    if (mgrId === "providers") { mgrProviders(slot, true); return; }
    var render = MGR[mgrId];
    if (render) render(slot);
  }

  function patchSettingRow(id) {
    var el = content.querySelector('[data-setting-row="' + id + '"]');
    if (!el) return;
    var tmp = document.createElement("div");
    tmp.innerHTML = M.settingRow(window.PMState.getSetting(id));
    var fresh = tmp.firstChild;
    fresh.classList.toggle("open", el.classList.contains("open"));
    el.replaceWith(fresh);
  }

  window.PMState.subscribe(function (kind, payload) {
    if (kind === "navigate") { route(); return; }
    if (kind === "scenario") { route(); return; }
    if (kind === "setting") { patchSettingRow(payload.id); if (inWorkspace("behavior") && payload.id.indexOf("behavior.bsd") === 0) rerenderManagerInPlace("bsd"); return; }
    if (kind === "notices") { if (currentView && currentView.name === "home") renderHome(); return; }
    if (kind === "catalog") {
      var strip = content.querySelector("[data-catalog-strip]");
      if (strip) strip.innerHTML = catalogStripHtml();
      return;
    }
    if (kind === "providers") {
      if (!inWorkspace("models")) return;
      var slot = content.querySelector('[data-manager-slot="providers"]');
      if (!slot) return;
      // Full provider body rebuild keeps the catalog strip intact.
      var body = slot.querySelector("[data-providers-body]");
      if (body) providersBody(body);
      return;
    }
    if (kind === "collections") {
      var n = payload.name;
      // A trace re-render would wipe the freshly written trace result; the
      // delegated handler already wrote it into the live panel.
      if (n === "permissionRules" && inWorkspace("permissions") && !payload.trace) rerenderManagerInPlace("permissions");
      if ((n === "notificationDestinations" || n === "eventRouting" || n === "quietHours") && inWorkspace("notifications")) rerenderManagerInPlace("notifications");
      if ((n === "soundLibrary" || n === "soundPacks") && inWorkspace("notifications")) rerenderManagerInPlace("sounds");
      if (n === "formatterTable" && inWorkspace("code")) rerenderManagerInPlace("formatters");
      if ((n === "commandsCatalog" || n === "shortcutBindings") && inWorkspace("code")) rerenderManagerInPlace("commands");
      if (n === "backupRuns" && inWorkspace("system")) rerenderManagerInPlace("backup");
      if (n === "searchIndexCfg" && inWorkspace("system")) rerenderManagerInPlace("search-index");
      return;
    }
    if (kind === "lifecycle") {
      if (inWorkspace("system")) {
        rerenderManagerInPlace("backup");
        // Setting rows may have changed through import/reset — refresh the document rows cheaply.
        var d = destById("system");
        if (d) d.subcategories.forEach(function (sub) {
          sub.settings.forEach(function (s) { patchSettingRow(s.id); });
        });
      }
      return;
    }
  });

  // ============================================================
  // Concept-local interactions (demonstrated managers)
  // ============================================================
  document.addEventListener("click", function (e) {
    var t = e.target;
    var el;

    // Setting row details disclosure.
    if ((el = t.closest(".pm-set-row .pm-set-label")) || (el = t.closest(".pm-set-row .pm-set-desc"))) {
      var row = el.closest(".pm-set-row");
      row.classList.toggle("open");
      return;
    }

    // Permissions view toggle + presets.
    if ((el = t.closest("[data-perm-view]")) && el.tagName === "BUTTON") {
      localUi.permView = el.getAttribute("data-perm-view");
      rerenderManagerInPlace("permissions");
      return;
    }
    if ((el = t.closest("[data-preset]"))) {
      var preset = D.presets.filter(function (p) { return p.id === el.getAttribute("data-preset"); })[0];
      if (preset) window.PMState.receipt("Preset preview: " + preset.name, preset.summary + ". Applying presets is previewed first and receipted. Simulated in this concept.", "info");
      return;
    }

    // Memory manager header actions (capsule preview + maintenance tools).
    if ((el = t.closest('[data-act="memory.capsule"]'))) {
      M.modal("Context capsule preview",
        '<div class="pm-note">Bounded recall capsule assembled from pinned and verified gists. Estimate: <b>' + memTokenEstimate() + 'K tokens</b>. Full sources are never injected.</div>' +
        window.PMState.state.memory.filter(function (m) { return m.pinned || m.state === "verified"; }).map(function (m) {
          return '<div class="at-src-row"><b>' + esc(m.text) + "</b>" + M.badge(m.pinned ? "Pinned" : "Verified", "ok") + "</div>";
        }).join(""),
        [{ label: "Close" }]);
      return;
    }
    if ((el = t.closest("[data-mem-tool]"))) {
      var tool = el.getAttribute("data-mem-tool");
      var slotM = content.querySelector('[data-manager-slot="memory"]');
      if (tool === "rebuild") window.PMState.receipt("Memory index rebuild queued", "Re-embedding with current half-life activations. Simulated.", "sim");
      if (tool === "dedupe") window.PMState.receipt("Dedupe pass", "Near-duplicate gists merged into one with combined evidence. Simulated.", "sim");
      if (tool === "redact") window.PMState.receipt("Redaction pass", "Likely secrets scrubbed from stored gists; receipts record the redaction. Simulated.", "ok");
      if (tool === "restore-last") {
        if (memTrash.length) {
          var item = memTrash.pop();
          var list = window.PMState.state.memory;
          list.splice(Math.min(Math.max(item.index, 0), list.length), 0, item.snap);
          window.PMState.receipt("Memory restored", "The last deleted gist is back in active recall.", "ok");
          window.PMState.emit("memory", { id: item.snap.id });
          if (slotM) mgrMemory(slotM);
        }
      }
      return;
    }

    // Memory actions.
    var memCard = t.closest("[data-memory]");
    if (memCard) {
      var memId = memCard.getAttribute("data-memory");
      var mem = window.PMState.state.memory.filter(function (m) { return m.id === memId; })[0];
      var slot = content.querySelector('[data-manager-slot="memory"]');
      var rerenderMem = function () { if (slot && content.contains(slot)) mgrMemory(slot); };
      if ((el = t.closest("[data-mem-act]")) && mem) {
        var a = el.getAttribute("data-mem-act");
        if (a === "verify") { mem.state = "verified"; window.PMState.receipt("Memory verified", "Evidence checked — the gist is trusted for retrieval now. Simulated.", "ok"); rerenderMem(); }
        else if (a === "pin") { mem.pinned = !mem.pinned; window.PMState.receipt(mem.pinned ? "Pinned" : "Unpinned", mem.text, "ok"); rerenderMem(); }
        else if (a === "edit") {
          window.PMCore.promptDialog("Edit memory", mem.text, function (v2) {
            if (!v2 || v2 === mem.text) return;
            (memHistory[mem.id] = memHistory[mem.id] || []).unshift({ text: mem.text });
            mem.text = v2; mem.versions += 1; mem.state = "verified";
            window.PMState.receipt("Memory edited", "A new version was created; the old one stays restorable. Simulated.", "ok");
            window.PMState.emit("memory", { id: mem.id });
            rerenderMem();
          });
        }
        else if (a === "versions") {
          var hist = memHistory[mem.id] || [];
          var vrows = '<div class="at-log">v' + mem.versions + " — current · accessed " + esc(mem.accessed) + " · " + esc(mem.text.slice(0, 72)) + (mem.text.length > 72 ? "…" : "") + "</div>" +
            hist.map(function (h, i) {
              return '<div class="at-log">v' + (mem.versions - i - 1) + " — superseded · " + esc(h.text.slice(0, 72)) + (h.text.length > 72 ? "…" : "") + "</div>";
            }).join("");
          M.modal("Version history — " + mem.text.slice(0, 48) + "…",
            '<div class="pm-note">' + mem.versions + " version(s). Restoring makes the previous text current and keeps both in history.</div>" + vrows,
            [{ label: "Close" }].concat(hist.length ? [{ label: "Restore previous", primary: true, onClick: function () {
              var h2 = memHistory[mem.id];
              if (!h2 || !h2.length) return false;
              var prev = h2.shift();
              h2.unshift({ text: mem.text });
              mem.text = prev.text; mem.versions += 1; mem.state = "verified";
              window.PMState.receipt("Version restored", "An earlier version is current again; history is preserved. Simulated.", "ok");
              window.PMState.emit("memory", { id: mem.id });
              rerenderMem();
              return false;
            } }] : []));
        }
        else if (a === "delete") {
          var stMem = window.PMState.state.memory;
          var di = stMem.indexOf(mem);
          if (di >= 0) stMem.splice(di, 1);
          memTrash.push({ index: di, snap: JSON.parse(JSON.stringify(mem)) });
          window.PMState.receipt("Memory deleted", "Removed from active recall and the index. Restore is available in this demo.", "ok");
          rerenderMem();
        }
        window.PMState.emit("memory", { id: memId });
        return;
      }
    }

    // Persona actions.
    var perCard = t.closest("[data-persona]");
    if (perCard && (el = t.closest("[data-per-act]"))) {
      var pId = perCard.getAttribute("data-persona");
      var per = window.PMState.state.personas.filter(function (p) { return p.id === pId; })[0];
      if (!per) return;
      var act = el.getAttribute("data-per-act");
      var slotP = content.querySelector('[data-manager-slot="personas"]');
      if (act === "capsule") {
        M.modal("Capsule preview — " + per.name,
          '<div class="pm-note">Model-facing behavior capsule, ' + esc(per.capsule) + ". Personas ship bounded capsules, never full sources.</div>" +
          M.inspector([["Mission", per.description], ["Provenance", per.provenance], ["Eligible surfaces", per.eligible], ["Scope", per.scope], ["Authority", "None — behavior only"]]),
          [{ label: "Close" }]);
      } else if (act === "default") {
        window.PMState.setSettingValue("behavior.personas.default", per.name);
        if (slotP) mgrPersonas(slotP);
      } else if (act === "child") {
        per.childOnly = false; per.scope = "Available";
        window.PMState.receipt("Persona included", per.name + " is now eligible for your surfaces after a trust review. Simulated.", "ok");
        if (slotP) mgrPersonas(slotP);
      } else if (act === "scan") {
        window.PMState.receipt("Import scan", per.name + ": provenance " + per.provenance + ". Diff, trust, secret, and prompt-injection scans passed. Simulated.", "info");
      }
      return;
    }

    // Shared-grammar manager actions (concept-local ones).
    if ((el = t.closest("[data-theme-act]"))) {
      var ta = el.getAttribute("data-theme-act");
      if (ta === "create") window.PMState.receipt("New custom theme", "A starter TOML with base-theme inheritance was created. Only overridden tokens are stored. Simulated.", "sim");
      if (ta === "import") window.PMState.receipt("Import TOML", "The file is validated against the theme schema before load; invalid themes fall back to their base with a diagnostic. Simulated.", "sim");
      if (ta === "export") window.PMState.receipt("Theme exported", "Custom theme written out as portable TOML with base-theme reference. Simulated.", "sim");
      if (ta === "folder") window.PMState.receipt("Theme folder", "themes/ opened in the file manager. Simulated.", "sim");
      return;
    }
    if ((el = t.closest("[data-term-act]"))) {
      window.PMState.receipt("Terminal preview strip", "ANSI palette rendered against the profile background — local preview only. Simulated.", "sim");
      return;
    }
    if ((el = t.closest("[data-lsp-act]"))) {
      var lspAct = el.getAttribute("data-lsp-act");
      var lspId = el.getAttribute("data-lsp");
      var srv = window.PMState.state.lspServers.filter(function (s) { return s.id === lspId; })[0];
      if (!srv) return;
      if (lspAct === "restart") window.PMState.receipt("Restart requested", srv.name + " will restart; diagnostics stay attached to the session. Simulated.", "sim");
      if (lspAct === "logs") {
        M.modal("Logs — " + srv.name, srv.logs.length ? srv.logs.map(function (l) { return '<div class="at-log">' + esc(l) + "</div>"; }).join("") : '<div class="pm-note">No log entries this session.</div>', [{ label: "Close" }]);
      }
      if (lspAct === "install") window.PMState.receipt("Install queued", srv.name + " installs through the official channel; capabilities appear after verification. Simulated.", "sim");
      return;
    }
    if ((el = t.closest("[data-mcp-act]"))) {
      var mcpAct = el.getAttribute("data-mcp-act");
      var mcpId = el.getAttribute("data-mcp");
      var msrv = window.PMState.state.mcpServers.filter(function (s) { return s.id === mcpId; })[0];
      if (!msrv) return;
      if (mcpAct === "connect") { msrv.state = "connected"; msrv.freshness = "Connected just now"; window.PMState.receipt("Connected", msrv.name + " authorization completed. Simulated.", "ok"); }
      if (mcpAct === "repair") { msrv.state = "connected"; msrv.freshness = "Repaired just now"; window.PMState.receipt("Repaired", msrv.name + " transport fixed and reconnected. Simulated.", "ok"); }
      if (mcpAct === "enable") { msrv.state = "connected"; msrv.freshness = "Enabled just now"; window.PMState.receipt("Enabled", msrv.name + " is active again. Simulated.", "ok"); }
      if (mcpAct === "tools") window.PMState.receipt("Tool inventory", msrv.name + ": " + msrv.toolCount + " tools, progressively exposed. Simulated.", "info");
      if (mcpAct === "logs") {
        M.modal("Logs — " + msrv.name, msrv.logs.map(function (l) { return '<div class="at-log">' + esc(l) + "</div>"; }).join(""), [{ label: "Close" }]);
        return;
      }
      if (inWorkspace("extensions")) rerenderManagerInPlace("mcp");
      return;
    }
    if ((el = t.closest("[data-skill-act]"))) {
      var sk = window.PMState.state.skills.filter(function (s) { return s.id === el.getAttribute("data-skill"); })[0];
      if (!sk) return;
      if (el.getAttribute("data-skill-act") === "toggle") { sk.enabled = !sk.enabled; window.PMState.receipt(sk.enabled ? "Skill enabled" : "Skill disabled", sk.name + (sk.enabled ? " can be selected for turns." : " will not be selected."), "ok"); }
      else { sk.trust = sk.trust === "Trusted" ? "Not trusted yet" : "Trusted"; window.PMState.receipt("Trust updated", sk.name + " is now " + sk.trust.toLowerCase() + ".", "ok"); }
      if (inWorkspace("extensions")) rerenderManagerInPlace("skills");
      return;
    }
    if ((el = t.closest("[data-plugin-act]"))) {
      var pl = window.PMState.state.plugins.filter(function (p) { return p.id === el.getAttribute("data-plugin"); })[0];
      if (!pl) return;
      if (el.getAttribute("data-plugin-act") === "toggle") { pl.enabled = !pl.enabled; window.PMState.receipt(pl.enabled ? "Plugin enabled" : "Plugin disabled", pl.name + ".", "ok"); }
      else window.PMState.receipt("Plugin update check", pl.name + ": " + pl.update + ". Simulated.", "info");
      if (inWorkspace("extensions")) rerenderManagerInPlace("plugins");
      return;
    }
    if ((el = t.closest("[data-tool-act]"))) {
      window.PMState.receipt("Tool scope", "Children receive scoped tool sets by role; inventory states stay distinguishable. Simulated.", "info");
      return;
    }
    if ((el = t.closest("[data-files-act]"))) {
      window.PMState.receipt("Project root revealed", "The file manager opens at the workspace root. Simulated.", "sim");
      return;
    }
    if ((el = t.closest("[data-hist-act]"))) {
      var ha = el.getAttribute("data-hist-act");
      if (ha === "archive") window.PMState.receipt("Archived", "The record stays addressable under the retention policy. Simulated.", "ok");
      if (ha === "compare") window.PMState.receipt("Compare", "Pick two records to diff their transcripts. Simulated.", "sim");
      if (ha === "export") window.PMState.receipt("Exported", "Selected records written with redaction applied. Simulated.", "sim");
      return;
    }
    if ((el = t.closest("[data-art-act]"))) {
      var aa = el.getAttribute("data-art-act");
      window.PMState.receipt(aa === "reveal" ? "Artifact revealed" : "Artifact cleaned up", "Identity and provenance stay distinguishable in receipts. Simulated.", "sim");
      return;
    }
    if ((el = t.closest("[data-wt-act]"))) {
      window.PMState.receipt("Worktree opened", "Switching windows to the selected worktree. Simulated.", "sim");
      return;
    }
    if ((el = t.closest("[data-cont-act]"))) {
      window.PMState.receipt("Capability probe", el.getAttribute("data-cont") + ": installation lifecycle shared, probes domain-specific. Simulated.", "info");
      return;
    }
    if ((el = t.closest("[data-web-act]"))) {
      window.PMState.receipt("Web readiness probe", D.webSearchCfg.readiness + ". Simulated.", "info");
      return;
    }
    if ((el = t.closest("[data-storage-act]"))) {
      var sa = el.getAttribute("data-storage-act");
      window.PMState.receipt(sa === "quarantine" ? "Quarantine review" : "Legal holds", sa === "quarantine" ? D.storageHealth.quarantine + " — deletion needs your explicit review." : D.storageHealth.legalHold + ". Simulated.", "info");
      return;
    }
    if ((el = t.closest("[data-fmt-act]"))) {
      var fa = el.getAttribute("data-fmt-act");
      window.PMState.receipt(fa === "add" ? "Add formatter" : "Reset formatters", fa === "add" ? "Register a custom formatter command; it starts disabled until detected. Simulated." : "Formatter table returns to detected defaults. Simulated.", "sim");
      return;
    }
  });

  // ============================================================
  // Router
  // ============================================================
  function route() {
    currentView = window.PMState.state.view;
    if (spy) { spy.destroy(); spy = null; }
    if (currentView.name === "home") renderHome();
    else renderWorkspace(currentView);
  }

  var initial = window.PMCore.startRouter();
  currentView = initial;
  if (initial.name === "home") renderHome();
  else renderWorkspace(initial);
  window.__conceptReady = true;
})();
</script>
</body>
</html>
