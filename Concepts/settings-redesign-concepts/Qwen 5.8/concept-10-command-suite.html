<style>
/* Concept 10 — Command Suite (retheme: layout borrowed, PM tokens only).
   Keyboard-first command index, left-to-right drill panes, compact tables.
   No terminal green, no CRT, no fake shell, no monospace body. */
#content { overflow: hidden; width: 100%; height: 100%; }
.cs-root { display: flex; flex-direction: column; min-height: 0; width: 100%; height: 100%; }
.cs-top {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px;
  border-bottom: 1px solid var(--border); background: var(--bg-shell); flex-wrap: wrap;
}
.cs-crumb { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12px; min-width: 0; flex-wrap: wrap; }
.cs-crumb b { color: var(--text-1); font-weight: 600; }
.cs-crumb .sep { color: var(--text-3); }
.cs-top .pm-spacer { flex: 1; }
.cs-kbdhints { display: flex; gap: 8px; align-items: center; color: var(--text-3); font-size: 11px; }
.cs-body { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.cs-view { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; }
.cs-view.drill-in { animation: csDrillIn .22s var(--ease, cubic-bezier(.2,.8,.2,1)) both; }
@keyframes csDrillIn { from { opacity: .4; transform: translateX(26px); } to { opacity: 1; transform: none; } }
[data-reduced-motion="1"] .cs-view.drill-in { animation: none; }

/* ---- search ---- */
.cs-search { position: relative; flex: 1; min-width: 180px; max-width: 560px; }
.cs-search .pm-input { width: 100%; padding-left: 30px; }
.cs-search .lead { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-3); display: flex; }
.cs-search.big .pm-input { padding: 10px 12px 10px 36px; font-size: 14px; border-radius: var(--radius-m); }
.cs-search.big .lead { left: 12px; }
.cs-drop {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 80;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-m);
  box-shadow: var(--shadow); max-height: min(430px, 60vh); overflow: auto; padding: 6px;
}
.cs-drop-cap { display: flex; align-items: center; gap: 8px; padding: 6px 8px 3px; color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; }
.cs-drop-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 10px; padding: 7px 9px; border-radius: var(--radius-s); cursor: pointer; align-items: start; }
.cs-drop-row:hover, .cs-drop-row.sel { background: var(--accent-soft); }
.cs-drop-row.sel { box-shadow: inset 0 0 0 1px var(--accent); }
.cs-drop-row .t1 { color: var(--text-1); font-size: 12.5px; font-weight: 600; display: flex; gap: 8px; align-items: center; min-width: 0; }
.cs-drop-row .t2 { color: var(--text-3); font-size: 11px; grid-column: 1; }
.cs-drop-row .note { color: var(--warn); font-size: 11px; grid-column: 1 / -1; }
.cs-drop-empty { padding: 14px; color: var(--text-2); font-size: 12.5px; text-align: center; }

/* ---- home ---- */
.cs-home { flex: 1; min-height: 0; overflow: auto; padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.cs-home-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cs-home-head .proj { display: flex; align-items: center; gap: 8px; color: var(--text-1); font-weight: 650; font-size: 14px; }
.cs-status { display: flex; gap: 14px; align-items: center; color: var(--text-2); font-size: 11.5px; flex-wrap: wrap;
  border: 1px solid var(--border); background: var(--surface-3); border-radius: var(--radius-m); padding: 6px 12px; }
.cs-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.cs-status.warn .dot { background: var(--warn); } .cs-status.err .dot { background: var(--err); }
.cs-banner { border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent);
  color: var(--text-1); border-radius: var(--radius-m); padding: 9px 12px; display: flex; gap: 10px; align-items: center; font-size: 12.5px; }
.cs-home-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(300px, 380px); gap: 14px; align-items: stretch; }
.cs-home-grid > .cs-panel, .cs-home-grid > .cs-home-right { max-height: calc(100vh - 210px); min-height: 0; }
.cs-home-grid > .cs-panel { overflow: auto; }
.cs-panel { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); min-width: 0; }
.cs-panel-cap { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border);
  color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; }
.cs-panel-cap .pm-spacer { flex: 1; }
.cs-idx-row { display: grid; grid-template-columns: auto minmax(0,1fr) auto auto; gap: 10px; align-items: center;
  padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; background: none; border-left: none; border-right: none; border-top: none; width: 100%; text-align: left; color: inherit; font: inherit; }
.cs-idx-row:last-child { border-bottom: none; }
.cs-idx-row:hover, .cs-idx-row.sel { background: var(--accent-soft); }
.cs-idx-row.sel { box-shadow: inset 2px 0 0 var(--accent); }
.cs-idx-row .ic { color: var(--text-2); display: flex; }
.cs-idx-row .tt { color: var(--text-1); font-weight: 600; font-size: 12.5px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.cs-idx-row .tt small { color: var(--text-3); font-weight: 400; font-size: 11px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cs-idx-row .ct { color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.cs-idx-row .go { color: var(--text-3); display: flex; }
.cs-home-right { display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; overflow: auto; }
.cs-syspanel { display: flex; flex-direction: column; flex: 1; min-height: 120px; }
.cs-sys { flex: 1; min-height: 0; overflow: auto; }
.cs-sys .row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 11.5px; color: var(--text-2); }
.cs-sys .row:last-child { border-bottom: none; }
.cs-sys .row b { color: var(--text-1); font-weight: 600; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---- tables ---- */
.cs-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.cs-table th { text-align: left; color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; padding: 6px 10px; border-bottom: 1px solid var(--border-strong); background: var(--surface-3); }
.cs-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text-1); vertical-align: top; }
.cs-table tr:last-child td { border-bottom: none; }
.cs-table tr.sel td { background: var(--accent-soft); }
.cs-table .num { font-variant-numeric: tabular-nums; }
.cs-table .path { font-family: var(--font-mono); font-size: 11px; color: var(--text-2); word-break: break-all; }
.cs-meter { display: inline-block; width: 74px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; vertical-align: middle; }
.cs-meter i { display: block; height: 100%; background: var(--accent); }
.cs-meter.warn i { background: var(--warn); } .cs-meter.err i { background: var(--err); }

/* ---- drill panes ---- */
.cs-drill { flex: 1; min-height: 0; display: grid; grid-template-columns: 232px 252px minmax(0,1fr); }
.cs-drill.two { grid-template-columns: 252px minmax(0,1fr); }
.cs-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--bg); }
.cs-pane:last-child { border-right: none; }
.cs-pane-cap { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--border); background: var(--bg-shell);
  color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; }
.cs-pane-cap .pm-spacer { flex: 1; }
.cs-pane-body { flex: 1; min-height: 0; overflow: auto; padding: 8px 10px 16px; }
.cs-pane.detail .cs-pane-body { padding: 12px 14px 20px; }
.cs-subcap { margin: 12px 4px 6px; color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; }
.cs-rowline { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: var(--radius-s); cursor: pointer; border: none; background: none; width: 100%; text-align: left; color: inherit; font: inherit; }
.cs-rowline:hover, .cs-rowline.sel { background: var(--accent-soft); }
.cs-rowline.sel { box-shadow: inset 2px 0 0 var(--accent); }
.cs-rowline .tt { flex: 1; min-width: 0; color: var(--text-1); font-size: 12.5px; font-weight: 550; display: flex; flex-direction: column; gap: 1px; }
.cs-rowline .tt small { color: var(--text-3); font-weight: 400; font-size: 11px; }
.cs-rowline .ic, .cs-rowline .go { color: var(--text-3); display: flex; flex: none; }

/* detail with editor beside */
.cs-detailgrid { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 14px; align-items: start; }
.cs-detailgrid.noedit { grid-template-columns: minmax(0,1fr); }
.cs-editor { border: 1px solid var(--border-strong); border-radius: var(--radius-m); background: var(--surface); position: sticky; top: 0; }
.cs-editor .cap { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; }
.cs-editor .body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.cs-editor .lbl { color: var(--text-1); font-weight: 650; font-size: 13px; }
.cs-editor .dsc { color: var(--text-2); font-size: 12px; }
.cs-editor .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.cs-stagewarn { color: var(--warn); font-size: 11.5px; display: flex; gap: 6px; align-items: center; }
.cs-err { color: var(--err); font-size: 12px; display: flex; gap: 6px; align-items: flex-start; }

/* provider detail */
.cs-sectabs { display: flex; gap: 2px; flex-wrap: wrap; padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--bg-shell); }
.cs-sectabs button { border: none; background: none; color: var(--text-2); padding: 5px 10px; border-radius: var(--radius-s); cursor: pointer; font-size: 12px; }
.cs-sectabs button:hover { background: var(--surface-2); color: var(--text-1); }
.cs-sectabs button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cs-kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0,1fr); gap: 4px 14px; font-size: 12px; margin: 0; }
.cs-kv dt { color: var(--text-3); } .cs-kv dd { margin: 0; color: var(--text-1); word-break: break-word; }
.cs-log { padding: 3px 2px; color: var(--text-2); font-size: 11.5px; font-family: var(--font-mono); border-bottom: 1px dashed var(--border); }
.cs-log:last-child { border-bottom: none; }

/* palette */
.cs-pal-ovl { position: fixed; inset: 0; z-index: 150; background: color-mix(in srgb, var(--bg) 62%, transparent); backdrop-filter: blur(2px); display: flex; justify-content: center; padding-top: 9vh; }
.cs-pal { width: min(620px, 92vw); max-height: 62vh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-l); box-shadow: var(--shadow); overflow: hidden; }
.cs-pal input { border: none; background: none; outline: none; padding: 13px 16px; font-size: 14px; color: var(--text-1); border-bottom: 1px solid var(--border); }
.cs-pal-list { overflow: auto; padding: 6px; }
.cs-pal-row { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: var(--radius-s); cursor: pointer; }
.cs-pal-row.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.cs-pal-row .k { color: var(--text-3); font-size: 11px; min-width: 74px; text-transform: uppercase; letter-spacing: .05em; }
.cs-pal-row .l { color: var(--text-1); font-size: 12.5px; font-weight: 600; flex: 1; min-width: 0; }
.cs-pal-row .p { color: var(--text-3); font-size: 11px; }

/* ops strip */
.cs-ops { border-top: 1px solid var(--border); background: var(--bg-shell); padding: 5px 14px; display: flex; gap: 12px; align-items: center; font-size: 11.5px; color: var(--text-2); flex-wrap: wrap; }
.cs-ops .op { display: flex; gap: 8px; align-items: center; }
.cs-ops .ph { color: var(--text-1); font-weight: 600; }

/* copy flow */
.cs-copy { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.cs-steps { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.cs-step { display: flex; gap: 8px; align-items: center; color: var(--text-3); font-size: 12px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px; background: none; cursor: pointer; font-family: inherit; }
.cs-step.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.cs-step.done { color: var(--text-2); }
.cs-copygrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; align-items: start; }
.cs-check { display: flex; gap: 8px; align-items: flex-start; padding: 7px 9px; border-radius: var(--radius-s); cursor: pointer; }
.cs-check:hover { background: var(--accent-soft); }
.cs-check .t { flex: 1; min-width: 0; color: var(--text-1); font-size: 12.5px; display: flex; flex-direction: column; }
.cs-check .t small { color: var(--text-3); font-size: 11px; }
.cs-count { color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }

/* all settings */
.cs-all { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0,1fr); }
.cs-facets { border-right: 1px solid var(--border); overflow: auto; padding: 10px 12px; background: var(--bg-shell); }
.cs-facet-cap { color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; margin: 10px 0 4px; }
.cs-facet-cap:first-child { margin-top: 0; }
.cs-vlist { flex: 1; min-height: 0; overflow: auto; padding: 6px 12px; }
.cs-vrow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 12px; padding: 9px 6px; border-bottom: 1px solid var(--border); align-items: center; height: 64px; }
.cs-vrow .a { min-width: 0; }
.cs-vrow .a .l { color: var(--text-1); font-size: 12.5px; font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cs-vrow .a .p { color: var(--text-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cs-syn { outline: 1px dashed var(--border-strong); outline-offset: -1px; }

/* deferred shell */
.cs-shellnote { border: 1px dashed var(--border-strong); background: var(--surface-3); border-radius: var(--radius-m); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--text-2); margin-bottom: 12px; }
.cs-shellnote b { color: var(--text-1); }

/* narrow / squeezed: push navigation, one pane at a time */
#app[data-wtier="squeezed"] .cs-drill, #app[data-wtier="narrow"] .cs-drill { grid-template-columns: minmax(0,1fr); }
#app[data-wtier="squeezed"] .cs-drill > .cs-pane, #app[data-wtier="narrow"] .cs-drill > .cs-pane { display: none; }
#app[data-wtier="squeezed"] .cs-drill > .cs-pane.push-on, #app[data-wtier="narrow"] .cs-drill > .cs-pane.push-on { display: flex; }
#app[data-wtier="squeezed"] .cs-home-grid, #app[data-wtier="narrow"] .cs-home-grid { grid-template-columns: minmax(0,1fr); align-items: start; }
#app[data-wtier="squeezed"] .cs-home-grid > .cs-panel, #app[data-wtier="narrow"] .cs-home-grid > .cs-panel,
#app[data-wtier="squeezed"] .cs-home-grid > .cs-home-right, #app[data-wtier="narrow"] .cs-home-grid > .cs-home-right { max-height: none; overflow: visible; }
#app[data-wtier="squeezed"] .cs-detailgrid, #app[data-wtier="narrow"] .cs-detailgrid { grid-template-columns: minmax(0,1fr); }
#app[data-wtier="squeezed"] .cs-all, #app[data-wtier="narrow"] .cs-all { grid-template-columns: minmax(0,1fr); }
#app[data-wtier="squeezed"] .cs-facets, #app[data-wtier="narrow"] .cs-facets { display: none; }
#app[data-wtier="squeezed"] .cs-facets.push-on, #app[data-wtier="narrow"] .cs-facets.push-on { display: block; }
#app[data-wtier="mid"] .cs-drill { grid-template-columns: 210px minmax(0,1fr); }
#app[data-wtier="mid"] .cs-drill > .cs-pane.idx { display: none; }
#app[data-wtier="mid"] .cs-drill > .cs-pane.idx.push-on { display: flex; }
#app[data-wtier="squeezed"] .cs-kbdhints { display: none; }
.cs-pushback { display: none; }
#app[data-wtier="squeezed"] .cs-pushback, #app[data-wtier="narrow"] .cs-pushback { display: inline-flex; }
</style>

<script>

(function () {
"use strict";
var D = window.PMInventoryData, MD = window.PMManagers2Data, S2 = window.PMState2,
    SR = window.PMSearch2, M2 = window.PMManagers2, CP = window.PMCopy2, SH = window.PMShell2;
var esc = M2.esc, ico = M2.ico;

S2.init("concept-10-command-suite");
SR.register(MD.searchEntries());

/* ---------- helpers ---------- */
function catOf(id) { return D.byCategory(id); }
function famById(id) { for (var i = 0; i < MD.families.length; i++) if (MD.families[i].id === id) return MD.families[i]; return null; }
function provById(id) { for (var i = 0; i < MD.providers.length; i++) if (MD.providers[i].id === id) return MD.providers[i]; return null; }
function deferredById(id) { for (var i = 0; i < MD.deferred.length; i++) if (MD.deferred[i].id === id) return MD.deferred[i]; return null; }
var DEFERRED_ROUTE = { onboarding: "onboarding", installation: "providers", "server-claim": "servers", servers: "servers", hosting: "hosting", "remote-access": "servers", "sync-move": "lifecycle", updates: "updates", "server-backup": "backup" };
function healthBadge(h) {
  var map = { ok: ["pm-badge-ok", "Healthy"], warn: ["pm-badge-warn", "Attention"], err: ["pm-badge-danger", "Failing"], muted: ["pm-badge-muted", "Idle"] };
  var m = map[h] || map.muted;
  return '<span class="pm-badge ' + m[0] + '">' + m[1] + "</span>";
}
function readinessBadge(tag) {
  var m = {
    "cli-found": ["pm-badge-ok", "CLI found"], "authenticated": ["pm-badge-ok", "Authenticated"], "probe-ok": ["pm-badge-ok", "Probe passed"],
    "sign-in-required": ["pm-badge-warn", "Sign-in required"], "not-installed": ["pm-badge-muted", "Not installed"],
    "explicit-install-required": ["pm-badge-info", "Explicit install required"], "owner-unknown": ["pm-badge-warn", "Owner unknown"],
    "manual-only": ["pm-badge-managed", "Manual only"], "shadowed-installation": ["pm-badge-warn", "Shadowed installation"],
    "update-available": ["pm-badge-info", "Update available"], "update-scheduled": ["pm-badge-info", "Update scheduled"],
    "rolled-back": ["pm-badge-warn", "Rolled back"], "usage-near-limit": ["pm-badge-warn", "Usage near limit"],
    "key-connected": ["pm-badge-ok", "Key connected"], "setup-incomplete": ["pm-badge-warn", "Setup incomplete"],
    "server-reachable": ["pm-badge-ok", "Server reachable"], "catalog-ok": ["pm-badge-ok", "Catalog available"],
    "underlying-setup-required": ["pm-badge-warn", "Underlying setup required"], "usage-unavailable": ["pm-badge-muted", "Usage unavailable"],
    "daemon-running": ["pm-badge-ok", "Daemon running"], "catalog-last-known-good": ["pm-badge-warn", "Last-known-good catalog"],
    "fallback-configured": ["pm-badge-info", "Fallback configured"], "effort-variation": ["pm-badge-info", "Effort varies"]
  };
  var x = m[tag] || ["pm-badge-muted", tag];
  return '<span class="pm-badge ' + x[0] + '">' + x[1] + "</span>";
}
function scenario() { return S2.state.scenario || "default"; }
function isOffline() { return scenario() === "offline" || scenario() === "poor-network"; }

/* ---------- router ---------- */
var route = { view: "home", parts: [], q: new URLSearchParams() };
var viewSeq = 0;
function parseHash() {
  var h = location.hash.replace(/^#\//, "");
  var qi = h.indexOf("?");
  var q = new URLSearchParams(qi >= 0 ? h.slice(qi + 1) : "");
  if (qi >= 0) h = h.slice(0, qi);
  var parts = h ? h.split("/") : [];
  return { view: parts[0] || "home", parts: parts, q: q, raw: location.hash || "#/home" };
}
function nav(hash, replace) {
  if (replace) history.replaceState(null, "", hash); else location.hash = hash;
}
function backTarget() {
  var p = route.parts;
  if (route.view === "home") return null;
  if (route.view === "cat") {
    if (p[2]) return { hash: "#/cat/" + p[1], label: catOf(p[1]) ? catOf(p[1]).category.title : p[1] };

function dropRender() {

    return;
  }
  var groups = {}, order = [];
  rs.forEach(function (r) { if (!groups[r.type]) { groups[r.type] = []; order.push(r.type); } groups[r.type].push(r); });
  var html = "";
  order.forEach(function (t) {
    html += '<div class="cs-drop-cap">' + esc(t.replace(/_/g, " ")) + " · " + groups[t].length + "</div>";

        '<span class="t2">' + esc((r.path || []).join(" / ")) + "</span>" +
        (r.note ? '<span class="note">' + esc(r.note) + "</span>" : "") + "</div>";
    });
  });

}
function searchExec(rid) {

  var q = searchState.query;
  S2.touchRecent({ kind: "search", id: rid, label: r.label });

}
function routeToDest(dest, r) {

  if (dest.kind === "setting") {
    nav("#/cat/" + dest.category + "/" + dest.subgroup + "?sec=" + encodeURIComponent(dest.subgroup) + "&row=" + encodeURIComponent(dest.settingId));
    return;
  }

    var qs = [];

function bindSearch(scope) {
  var box = scope.querySelector("[data-searchbox]");

  var drop = box.querySelector("[data-test='search-results']");
  input.addEventListener("input", function () {
    searchState.query = input.value;
    searchState.sel = 0;
    if (!input.value) { searchState.results = []; searchState.open = false; dropRender(); return; }
    searchState.open = true;
    SR.searchAsync(input.value, function (rs) {
      if (input.value !== searchState.query) return; // latest-request-wins
      searchState.results = rs; searchState.sel = 0; dropRender();
    });
  });
  input.addEventListener("focus", function () { if (input.value) { searchState.open = true; dropRender(); } });
  input.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); searchState.sel = Math.min(searchState.results.length - 1, searchState.sel + 1); dropRender(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); searchState.sel = Math.max(0, searchState.sel - 1); dropRender(); }
    else if (e.key === "Enter") { e.preventDefault(); var r = searchState.results[searchState.sel]; if (r) searchExec(r.rid); }
    else if (e.key === "Escape") { if (searchState.open) { searchState.open = false; dropRender(); e.stopPropagation(); } }
  });
  drop.addEventListener("mousedown", function (e) { e.preventDefault(); });
  drop.addEventListener("click", function (e) {
    var row = e.target.closest("[data-rid]");
    if (row) searchExec(row.getAttribute("data-rid"));
  });
  if (searchState.restore) {
    var rq = searchState.restore.query || "";
    searchState.restore = null;
    if (rq) {
      input.value = rq; searchState.query = rq; searchState.open = true;
      SR.searchAsync(rq, function (rs) { if (input.value === rq) { searchState.results = rs; dropRender(); } });
    }
  }
}

function allFiltered() {
  var base = D.settings.map(function (s) {

  });

/* ---------- render ---------- */
function render() {
  scrollMem[lastRaw] = viewScrollers().map(function (el) { return el.scrollTop; });
  route = parseHash();
  lastRaw = route.raw;
  if (route.view === "q") searchState.restore = { query: decodeURIComponent(route.parts.slice(1).join("/")) };
  viewSeq++;
  var html = "";
  if (route.view === "home" || route.view === "q") html = homeHTML();
  else if (route.view === "cat") html = catHTML();
  else if (route.view === "mgr") html = mgrHTML();
  else if (route.view === "all") html = allHTML();
  else if (route.view === "copy") html = copyHTML();
  else if (route.view === "lifecycle") html = lifecycleHTML();
  else html = homeHTML();
  var rawRoute = location.hash.replace(/^#/, "") || "/home";
  content.innerHTML = '<div class="cs-root" data-route="' + esc(rawRoute) + '">' + html + "</div>";
  var view = content.querySelector(".cs-view");
  if (view) view.classList.add("drill-in");
  bindSearch(content);
  bindView();
  if (route.view === "all") mountVList();
  var rowId = route.q.get("row");
  if (rowId) {
    setTimeout(function () {
      var sel = "[data-row='" + rowId.replace(/'/g, "\\'") + "'],[data-mrow='" + rowId.replace(/'/g, "\\'") + "'],[data-frow='" + rowId.replace(/'/g, "\\'") + "']";
      var el = content.querySelector(sel);
      if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("pm2-locate"); var f = el.querySelector("button,input,select"); if (f) f.focus({ preventScroll: true }); }
    }, 30);
  }
  // calm locator highlight on exact landing (roster object / section tab)
  if (route.view === "mgr" && route.parts[2]) {
    var rrow = content.querySelector(".cs-pane .cs-rowline.sel");
    if (rrow) rrow.classList.add("pm2-locate");
  }
  if (route.view === "mgr" && route.q.get("sec")) {
    var stab = content.querySelector("[data-psec].active");
    if (stab) stab.classList.add("pm2-locate");
  }
  applyPush();
  var mem = scrollMem[route.raw] || [];
  viewScrollers().forEach(function (el, i) { if (mem[i]) el.scrollTop = mem[i]; });
}
function applyPush() {
  var tier = shell.app.getAttribute("data-wtier");
  if (tier !== "squeezed" && tier !== "narrow") return;
  var panes = content.querySelectorAll(".cs-drill > .cs-pane");
  if (!panes.length) return;
  panes.forEach(function (p) { p.classList.remove("push-on"); });
  var last = null;
  var depthOk = (route.view === "cat" && route.parts[2]) || (route.view === "mgr" && route.parts[2]);
  if (depthOk) last = panes[panes.length - 1];
  else {
    panes.forEach(function (p) { if (p.querySelector(".sel")) last = p; });
    if (!last) last = panes[0];
  }
  last.classList.add("push-on");
}
function mountVList() {
  var host = content.querySelector("[data-test='vlist']");
  if (!host) return;
  vlist = M2.virtualList({
    host: host, rowHeight: 64,
    data: allFiltered(),
    render: allRowRender,
    onWindow: function (s, e, t) { host.setAttribute("data-window", s + ":" + e + ":" + t); var c = content.querySelector("[data-allcount]"); if (c) c.textContent = t.toLocaleString() + " rows · window " + s + "–" + e; }

    });

      bindProvider();

  });
  content.querySelectorAll("[data-pact]").forEach(function (b) {
    b.addEventListener("click", function () {
      var act = b.getAttribute("data-pact");
      var p = provById(route.parts[2] || "openai-cli") || MD.providers[0];
      if (act === "test" || act === "reconnect") {
        var op = S2.beginOp({ title: "Test connection — " + p.name, phase: "Probing", determinate: false, wait: isOffline() ? "network unreachable" : null });
        setTimeout(function () {

        }, 900);

        var n = 0;

          n++; S2.advanceOp(op2, { completed: n, human_phase: n < 4 ? "Installing for " + (host ? host.value : "this host") : "Verifying signature" });
          if (n >= 4) { clearInterval(t); installedLocal[p.id] = true; S2.finishOp(op2, "completed", "Installed and verified"); S2.receipt("Provider installed", p.name + " installed from the official source for " + (host ? host.value : "this host") + ".", "ok"); render(); }
        }, 350);
      } else if (act === "update") {
        var op3 = S2.beginOp({ title: "Update " + p.name, phase: "Waiting for approval", determinate: false });
        setTimeout(function () { S2.advanceOp(op3, { human_phase: "Verifying new generation" }); setTimeout(function () { S2.finishOp(op3, "failed", "Verification failed — rolled back"); S2.receipt("Update rolled back", "Verification failed after updating " + p.name + "; the previous generation was restored.", "warn"); }, 700); }, 700);
      } else if (act === "refresh") {

        setTimeout(function () { if (isOffline()) { S2.finishOp(op4, "degraded", "Serving last-known-good catalog"); S2.receipt("Catalog refresh degraded", "Offline: the last-known-good catalog remains in use.", "warn"); } else { S2.finishOp(op4, "completed", "Catalog current"); S2.receipt("Catalog refreshed", p.name + " models and limits are current.", "ok"); } }, 800);

      } else if (act === "add") {

      }

        demand = { id: p.id, op: "Chat run requesting " + p.name, token: demandToken() };
        S2.receipt("Provider Setup Required", p.name + " is not ready for the originating operation (" + demand.op + "). The operation is preserved with continuation token " + demand.token + ". Deep link: #/mgr/providers/" + p.id + "?sec=install. Resume only while the continuation is still current.", "info");
        render();
      } else if (act === "demand-resume") {

function bindCopy() {

  var allb = content.querySelector("[data-cact='all']");

  var ct = content.querySelector("[data-confirmtype]");
