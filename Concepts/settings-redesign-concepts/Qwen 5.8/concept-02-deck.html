<!doctype html>
<html lang="en" data-theme="friendly-dark" data-reduced-motion="0" data-concept-id="concept-02-deck">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck — Settings Command Center — Qwen 5.8</title>
<link rel="stylesheet" href="_shared/pm-shell.css">
<style>
/* ============ Deck motion ============ */
.dk-home, .dk-work { flex: 1; min-height: 0; overflow-y: auto; }
.dk-enter { animation: dkEnter .36s cubic-bezier(.2,.8,.2,1) both; }
@keyframes dkEnter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.dk-stage > * { animation: dkStage .32s cubic-bezier(.2,.8,.2,1) both; }
.dk-stage > *:nth-child(2) { animation-delay: .05s; }
.dk-stage > *:nth-child(3) { animation-delay: .1s; }
.dk-stage > *:nth-child(4) { animation-delay: .15s; }
.dk-stage > *:nth-child(5) { animation-delay: .2s; }
.dk-stage > *:nth-child(6) { animation-delay: .25s; }
@keyframes dkStage { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.dk-doc .dk-sub, .dk-doc .dk-extra { animation: dkStage .3s cubic-bezier(.2,.8,.2,1) both; }
.dk-doc > *:nth-child(2) { animation-delay: .04s; }
.dk-doc > *:nth-child(3) { animation-delay: .08s; }
.dk-doc > *:nth-child(4) { animation-delay: .12s; }
.dk-doc > *:nth-child(5) { animation-delay: .16s; }
.dk-doc > *:nth-child(6) { animation-delay: .2s; }
.dk-doc > *:nth-child(n+7) { animation-delay: .24s; }
/* LED attention pulse is bounded: exactly three beats, then steady. */
.dk-led-att { animation: dkLedPulse 1.1s ease-in-out 3; }
@keyframes dkLedPulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
[data-reduced-motion="1"] .dk-enter, [data-reduced-motion="1"] .dk-stage > *,
[data-reduced-motion="1"] .dk-doc .dk-sub, [data-reduced-motion="1"] .dk-doc .dk-extra,
[data-reduced-motion="1"] .dk-led-att, [data-reduced-motion="1"] .dk-inbox-pop { animation: none; }

/* ============ Shared Deck atoms ============ */
.dk-wrap { max-width: 1140px; margin: 0 auto; padding: 26px 30px 80px; width: 100%; }
.dk-kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); font-family: var(--font-mono); }
.dk-title { font-size: 26px; font-weight: 750; color: var(--text-1); margin: 2px 0 0; letter-spacing: -.01em; }
.dk-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.dk-cap { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.dk-led { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dk-led-ok { background: var(--ok); }
.dk-led-warn { background: var(--warn); }
.dk-led-att { background: var(--err); }
.dk-led-info { background: var(--info); }
.dk-led-off { background: var(--text-3); }

/* ============ Command field ============ */
.dk-cmd { position: relative; margin-bottom: 24px; }
.dk-cmd-field { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-m); padding: 13px 15px; }
.dk-cmd-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dk-cmd-field input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--text-1); font-size: 14.5px; font-family: var(--font-mono); }
.dk-cmd-field .pm-ico { color: var(--accent); }
.dk-drop { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 60; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-m); box-shadow: var(--shadow); max-height: 380px; overflow-y: auto; padding: 6px; }
.dk-drop[hidden] { display: none; }
.dk-drop-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; border-radius: var(--radius-s); padding: 8px 10px; cursor: pointer; color: var(--text-1); }
.dk-drop-item:hover, .dk-drop-item.active { background: var(--accent-soft); }
.dk-drop-main { flex: 1; min-width: 0; }
.dk-drop-title { font-size: 13px; font-weight: 650; }
.dk-drop-path { color: var(--text-3); font-size: 11px; font-family: var(--font-mono); }
.dk-drop-empty { padding: 10px 12px; color: var(--text-2); font-size: 12.5px; }

/* ============ Status board ============ */
.dk-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-bottom: 26px; }
.dk-cell { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 12px 14px; cursor: pointer; color: var(--text-1); transition: border-color .16s, background-color .16s; }
.dk-cell:hover { border-color: var(--accent); background: var(--surface-2); }
.dk-cell-led { flex: none; display: flex; align-items: center; }
.dk-cell-body { flex: 1; min-width: 0; }
.dk-cell-label { display: block; font-size: 11px; font-family: var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.dk-cell-value { display: block; font-size: 13px; font-weight: 650; margin-top: 2px; }
.dk-cell-sub { display: block; font-size: 11.5px; color: var(--text-2); margin-top: 1px; }
.dk-cell-open { flex: none; display: flex; align-items: center; gap: 4px; color: var(--accent); font-size: 11px; font-weight: 650; font-family: var(--font-mono); }

/* ============ Destination tiles ============ */
.dk-mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-bottom: 28px; }
.dk-mod { display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 16px; cursor: pointer; min-height: 150px; color: var(--text-1); transition: border-color .16s, background-color .16s; }
.dk-mod:hover, .dk-mod:focus-visible { border-color: var(--accent); background: var(--surface-2); }
.dk-mod-top { display: flex; align-items: center; gap: 10px; }
.dk-mod-ico { width: 32px; height: 32px; border-radius: var(--radius-s); background: var(--surface-3); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--accent); flex: none; }
.dk-mod h3 { margin: 0; font-size: 14.5px; color: var(--text-1); font-weight: 700; }
.dk-mod p { margin: 0; color: var(--text-2); font-size: 12px; flex: 1; }
.dk-mod-readout { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dk-mod-open { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 12px; font-weight: 650; font-family: var(--font-mono); }

/* ============ Notices ============ */
.dk-notice { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 11px 14px; margin-bottom: 8px; }
.pm-app[data-wtier="squeezed"] .dk-notice { grid-template-columns: 1fr; gap: 8px; }
.dk-notice .head { color: var(--text-1); font-weight: 650; font-size: 13px; }
.dk-notice .reason { color: var(--text-2); font-size: 12px; margin-top: 2px; }
.dk-notice-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.dk-calm { border: 1px dashed var(--border-strong); border-radius: var(--radius-m); padding: 16px; color: var(--text-2); font-size: 12.5px; display: flex; gap: 8px; align-items: center; }

/* ============ Recents ============ */
.dk-recents { display: flex; flex-direction: column; gap: 6px; }
.dk-recent { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-s); padding: 8px 12px; cursor: pointer; color: var(--text-1); }
.dk-recent:hover { border-color: var(--accent); }
.dk-recent b { font-size: 12.5px; }
.dk-recent .where { color: var(--text-2); font-size: 11.5px; flex: 1; min-width: 0; }
.dk-recent .when { color: var(--text-3); font-size: 11px; font-family: var(--font-mono); }

/* ============ Title-bar inbox (sole in-app notification surface) ============ */
.dk-inbox { position: relative; display: inline-flex; }
.dk-inbox-btn { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-3); color: var(--text-2); font-size: 11.5px; cursor: pointer; }
.dk-inbox-btn:hover { color: var(--text-1); border-color: var(--border-strong); }
.dk-inbox-count { min-width: 16px; height: 16px; border-radius: 999px; background: var(--accent); color: var(--accent-contrast); font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; }
.dk-inbox-count.zero { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); }
.dk-inbox-pop { position: absolute; top: calc(100% + 8px); right: 0; width: 330px; max-width: 86vw; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-m); box-shadow: var(--shadow); z-index: 80; padding: 8px; animation: dkStage .18s ease both; }
.dk-inbox-pop[hidden] { display: none; }
.dk-inbox-item { display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left; background: none; border: none; border-radius: var(--radius-s); padding: 8px 10px; cursor: pointer; color: var(--text-1); }
.dk-inbox-item:hover { background: var(--accent-soft); }
.dk-inbox-item .t { font-size: 12px; font-weight: 600; }
.dk-inbox-item .r { font-size: 11px; color: var(--text-2); }
.dk-inbox-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px 2px; }

/* ============ Workspace: sticky strip ============ */
.dk-work { position: relative; }
.dk-strip { position: sticky; top: 0; z-index: 40; background: var(--bg-shell); border-bottom: 1px solid var(--border); padding: 9px 16px; display: flex; gap: 10px; align-items: center; }
[data-chrome-blur="on"] .dk-strip { backdrop-filter: var(--chrome-blur); }
.dk-back { flex: none; }
.dk-tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; scroll-behavior: smooth; }
.dk-tabs::-webkit-scrollbar { display: none; }
.dk-tab { position: relative; border: none; background: none; color: var(--text-2); font-size: 12.5px; padding: 7px 12px; cursor: pointer; white-space: nowrap; border-radius: var(--radius-s); font-family: var(--font-mono); transition: background-color .18s, color .18s; flex: none; }
.dk-tab:hover { color: var(--text-1); background: var(--surface-2); }
.dk-tab.active { color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.dk-find { flex: none; }

/* ============ Workspace body: subnav + document ============ */
.dk-work-body { display: grid; grid-template-columns: 198px minmax(0, 1fr); gap: 24px; max-width: 1180px; margin: 0 auto; padding: 20px 26px 90px; width: 100%; }
.pm-app[data-wtier="narrow"] .dk-work-body, .pm-app[data-wtier="squeezed"] .dk-work-body { grid-template-columns: 1fr; gap: 12px; padding: 14px 16px 80px; }
.dk-subnav { position: sticky; top: 58px; align-self: start; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 140px); overflow-y: auto; }
.pm-app[data-wtier="narrow"] .dk-subnav, .pm-app[data-wtier="squeezed"] .dk-subnav { display: none; }
.pm-app[data-wtier="narrow"] .dk-subnav.open, .pm-app[data-wtier="squeezed"] .dk-subnav.open { display: flex; flex-direction: column; position: fixed; top: 46px; bottom: 32px; left: 0; width: min(280px, 84vw); z-index: 80; background: var(--surface); border-right: 1px solid var(--border-strong); box-shadow: var(--shadow); padding: 40px 12px 16px; overflow-y: auto; }
.dk-subnav-close { display: none; }
.pm-app[data-wtier="narrow"] .dk-subnav.open .dk-subnav-close, .pm-app[data-wtier="squeezed"] .dk-subnav.open .dk-subnav-close { display: inline-flex; position: absolute; top: 8px; right: 8px; }
.dk-subnav-drawer { display: none; }
.pm-app[data-wtier="narrow"] .dk-subnav-drawer, .pm-app[data-wtier="squeezed"] .dk-subnav-drawer { display: inline-flex; }
.dk-subnav-item { position: relative; display: flex; align-items: center; gap: 8px; text-align: left; border: none; background: none; color: var(--text-2); font-size: 12px; padding: 6px 10px 6px 16px; border-radius: var(--radius-s); cursor: pointer; white-space: nowrap; }
.dk-subnav-item::before { content: ""; position: absolute; left: 5px; top: 50%; width: 5px; height: 5px; border-radius: 50%; transform: translateY(-50%); background: var(--border-strong); transition: background-color .18s, box-shadow .18s; }
.dk-subnav-item:hover { color: var(--text-1); background: var(--surface-2); }
.dk-subnav-item.active { color: var(--accent); font-weight: 650; }
.dk-subnav-item.active::before { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dk-doc { min-width: 0; }
.dk-doc-head { margin-bottom: 18px; }
.dk-doc-head h1 { font-size: 20px; color: var(--text-1); margin: 3px 0 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dk-doc-head p { margin: 0; color: var(--text-2); font-size: 12.5px; }
.dk-sub { margin-bottom: 34px; scroll-margin-top: 70px; }
.dk-sub h2 { font-size: 15.5px; color: var(--text-1); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dk-sub h2 .idx { font-family: var(--font-mono); color: var(--text-3); font-size: 12px; }
.dk-extra { scroll-margin-top: 70px; margin-bottom: 34px; }
.dk-extra h2 { font-size: 15.5px; color: var(--text-1); margin: 0 0 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dk-extra .dk-extra-why { color: var(--text-3); font-size: 11.5px; margin: 0 0 10px; }

/* Deck flavor on shared rows/managers */
.dk-set-row { border-radius: var(--radius-s); }
.dk-mgr { border-radius: var(--radius-m); margin: 14px 0 4px; }
.dk-mgr .pm-mgr-head { background: var(--surface-3); }
.dk-provider { border-radius: var(--radius-m); }

/* ============ Destination list (demonstrated) ============ */
.dk-dest { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 10px 13px; margin-bottom: 8px; }
.dk-dest-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--text-1); font-size: 12.5px; }
.dk-dest-head b { font-size: 13px; }
.dk-dest-meta { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 11.5px; color: var(--text-2); margin-top: 5px; }
.dk-dest-actions { display: inline-flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.dk-dest-note { font-size: 11.5px; color: var(--warn); margin-top: 5px; }
.dk-route-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
.dk-route-table th { text-align: left; color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; padding: 4px 8px; border-bottom: 1px solid var(--border-strong); }
.dk-route-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); color: var(--text-1); vertical-align: top; }
.dk-route-table .dests { color: var(--text-2); }
.dk-surface-card { border: 1px dashed var(--border-strong); border-radius: var(--radius-m); background: var(--surface-3); padding: 11px 13px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }

/* ============ Dictionaries (demonstrated spellcheck) ============ */
.dk-dict-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pm-app[data-wtier="squeezed"] .dk-dict-cols { grid-template-columns: 1fr; }
.dk-dict-col { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 10px 12px; }
.dk-dict-col h4 { margin: 0 0 8px; font-size: 12.5px; color: var(--text-1); display: flex; align-items: center; gap: 8px; }
.dk-word { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface-3); color: var(--text-1); font-size: 11.5px; padding: 2px 6px 2px 9px; margin: 0 5px 5px 0; }
.dk-word button { border: none; background: none; color: var(--text-3); cursor: pointer; display: inline-flex; padding: 1px; border-radius: 50%; }
.dk-word button:hover { color: var(--err); }
.dk-dict-add { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.dk-dict-add input { flex: 1; min-width: 140px; }

/* ============ Theme grid (demonstrated) ============ */
.dk-theme-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.dk-theme-card { cursor: pointer; position: relative; transition: border-color .15s, transform .15s; min-width: 150px; flex: 0 1 auto; }
.dk-theme-card:hover { border-color: var(--accent); }
.dk-theme-card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.dk-theme-card.applied::after { content: "Applied"; position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 700; color: var(--ok); border: 1px solid var(--ok); border-radius: 999px; padding: 0 6px; }
.dk-theme-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.dk-theme-diag { border: 1px solid var(--err); border-radius: var(--radius-s); background: color-mix(in srgb, var(--err) 8%, transparent); color: var(--text-1); font-size: 11.5px; padding: 7px 10px; margin-top: 6px; font-family: var(--font-mono); }
.dk-preview-note { font-size: 11px; color: var(--text-3); margin-top: 8px; }

/* ============ Desktop/Tray/Window + Teacher (Deck-demonstrated) ============ */
.dk-ab { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
.dk-ab-row { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: var(--radius-s); background: var(--surface-3); padding: 6px 10px; flex-wrap: wrap; }
.dk-ab-row.hidden-item { opacity: .55; }
.dk-ab-row .nm { flex: 1; min-width: 100px; font-size: 12.5px; color: var(--text-1); font-weight: 600; }
.dk-fxcard { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 9px 12px; margin-bottom: 7px; display: flex; gap: 9px; align-items: flex-start; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.dk-fxcard .st { flex: none; }
.dk-teacher-card { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 11px 13px; margin-bottom: 8px; }
.dk-teacher-card b { color: var(--text-1); font-size: 13px; }
.dk-teacher-card .screen { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.dk-teacher-card p { margin: 5px 0 8px; color: var(--text-2); font-size: 12px; }
.dk-teacher-acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* ============ Misc ============ */
.dk-cap-line { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
.dk-swatches { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.dk-swatches span { width: 15px; height: 15px; border-radius: 3px; border: 1px solid var(--border-strong); }
.dk-note-card { border: 1px dashed var(--border-strong); border-radius: var(--radius-m); padding: 12px 14px; color: var(--text-2); font-size: 12.5px; margin: 10px 0; background: var(--surface-3); }
.dk-quietline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-2); }
</style>
</head>
<body>
<div id="app" data-concept-model="Qwen 5.8"></div>
<script src="_shared/pm-icons.js"></script>
<script src="_shared/pm-demo-data.js"></script>
<script src="_shared/pm-data-extra.js"></script>
<script src="_shared/pm-state.js"></script>
<script src="_shared/pm-settings-core.js"></script>
<script src="_shared/pm-managers.js"></script>
<script src="_shared/pm-shell.js"></script>
<script src="_shared/concept-hub-bridge.js"></script>
<script>
(function () {
  "use strict";

  var MODEL = "Qwen 5.8";

  // ---- Boot (contract order) ------------------------------------------------
  window.PMState.init("concept-02-deck");
  window.PMManagers.setPrefix("dk-");
  var shell = window.PMShell.mount({ conceptName: "Deck concept", model: MODEL });
  var content = shell.content;

  var ST = window.PMState;
  var M = window.PMManagers;
  var D = window.PMDemoData;
  var esc = M.esc;
  var INDEX = window.PMCore.buildSearchIndex();

  var spy = null;
  var openPanes = {};
  var activeDrop = -1;
  var dropHits = [];

  // Deck-local fixture state for the Desktop/Tray/Window demonstration rows.
  var deckDesktop = {
    minTray: true, closeTray: false, trayRunning: true, crashRecovery: true, bufferProtect: true,
    launchDest: "Restore last workspace", restore: "Last size",
    activityBar: [
      { id: "ab-explore", label: "Explorer", hidden: false },
      { id: "ab-search", label: "Search", hidden: false },
      { id: "ab-scm", label: "Source Control", hidden: false },
      { id: "ab-run", label: "Run & Debug", hidden: true },
      { id: "ab-ext", label: "Extensions", hidden: false }
    ]
  };

  function ico(n, s) { return window.PMIcons.get(n, s || 14); }
  function led(kind) { return '<span class="dk-led dk-led-' + kind + '" aria-hidden="true"></span>'; }
  function wsView(o) { var v = { name: "workspace" }; Object.keys(o).forEach(function (k) { v[k] = o[k]; }); return v; }
  function dest(id) { for (var i = 0; i < D.destinations.length; i++) if (D.destinations[i].id === id) return D.destinations[i]; return null; }

  function bindHomeSearch() {
    var q = document.getElementById("dk-q");
    var drop = document.getElementById("dk-drop");
    if (!q || !drop) return;

    function run() {
      var v = q.value.trim();
      activeDrop = -1;
      if (!v) { drop.hidden = true; return; }
      dropHits = window.PMCore.search(v, INDEX);
      if (!dropHits.length) {
        drop.innerHTML = '<div class="dk-drop-empty">No matches. Try “continuation”, “spellcheck”, “OAuth”, or a provider name.</div>';
        drop.hidden = false;
        return;
      }
      drop.innerHTML = dropHits.map(function (h, i) {
        return '<button class="dk-drop-item" data-hit="' + i + '" role="option">' +
          '<span class="dk-drop-main">' +
            '<span class="dk-drop-title">' + esc(h.title) + "</span> " +
            '<span class="pm-search-type" data-rt="' + esc(h.resultType) + '">' + esc(h.resultType) + "</span><br>" +
            '<span class="dk-drop-path">' + esc(h.path.join(" › ")) + (h.unavailableReason ? " — " + esc(h.unavailableReason) : "") + "</span>" +
          "</span>" + ico("arrowRight", 13) + "</button>";
      }).join("");
      drop.hidden = false;
    }
    function go(h) {
      if (!h) return;
      drop.hidden = true;
      if (h.unavailableReason) ST.receipt("Unavailable capability", h.title + ": " + h.unavailableReason, "info");
      ST.navigate(wsView(h.target));
    }
    function mark() {
      drop.querySelectorAll("[data-hit]").forEach(function (b, i) { b.classList.toggle("active", i === activeDrop); });
    }
    q.addEventListener("input", run);
    q.addEventListener("focus", run);
    q.addEventListener("blur", function () { setTimeout(function () { drop.hidden = true; }, 160); });
    q.addEventListener("keydown", function (e) {
      var items = drop.querySelectorAll("[data-hit]");
      if (e.key === "ArrowDown") { e.preventDefault(); activeDrop = Math.min(activeDrop + 1, items.length - 1); mark(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); activeDrop = Math.max(activeDrop - 1, 0); mark(); }
      else if (e.key === "Enter" && dropHits.length) { e.preventDefault(); go(dropHits[Math.max(activeDrop, 0)]); }
      else if (e.key === "Escape") { drop.hidden = true; }
    });
    drop.addEventListener("mousedown", function (e) {
      var item = e.target.closest ? e.target.closest("[data-hit]") : null;
      if (!item) return;
      e.preventDefault();
      go(dropHits[parseInt(item.getAttribute("data-hit"), 10)]);
    });
  }

  var MANAGER_BUILDERS = {
    providers: providersManager, notifications: notificationsManager, sounds: soundsManager, themes: themesManager,
    memory: memoryManager, "context-sources": contextSourcesManager, crew: crewManager, personas: personasManager,
    permissions: permissionsManager, terminal: terminalManager, lsp: lspManager, formatters: formattersManager,
    commands: commandsManager, testing: testingManager, files: filesManager, mcp: mcpManager, skills: skillsManager,
    plugins: pluginsManager, tools: toolsManager, storage: storageManager, backup: backupManager, history: historyManager,
    artifacts: artifactsManager, "source-control": sourceControlManager, containers: containersManager,
    web: webManager, "search-index": searchIndexManager
  };

  // ---- WORKSPACE -----------------------------------------------------------------
  function renderWorkspace(view) {
    var cat = dest(view.category);
    if (!cat) { renderHome(); return; }
    if (spy) { spy.destroy(); spy = null; }

    var strip = '<div class="dk-strip">' +
      '<button class="pm-btn pm-btn-sm dk-back" data-dk-home>' + ico("arrowLeft", 12) + " Home</button>" +
      '<div class="dk-tabs" role="tablist" aria-label="Settings categories">' +
        D.destinations.map(function (d) {
          return '<button class="dk-tab' + (d.id === cat.id ? " active" : "") + '" role="tab" aria-selected="' + (d.id === cat.id) + '" data-dk-tab="' + esc(d.id) + '">' + esc(d.title) + "</button>";
        }).join("") +
      "</div>" +
      '<button class="pm-btn pm-btn-sm dk-subnav-drawer" data-dk-subnav-toggle>' + ico("list", 12) + " Sections</button>" +
      '<button class="pm-btn pm-btn-sm dk-find" data-dk-find>' + ico("search", 12) + " Find</button>" +
    "</div>";

    var subnav = '<nav class="dk-subnav" id="dk-subnav" aria-label="' + esc(cat.title) + ' sections">' +
      '<button class="pm-btn pm-btn-quiet pm-btn-sm dk-subnav-close" data-dk-subnav-close>' + ico("x", 13) + " Close sections</button>" +
      cat.subcategories.map(function (s, i) {
        return '<button class="dk-subnav-item" data-subnav="' + esc(s.id) + '">' + (i + 1) + ". " + esc(s.title) + "</button>";
      }).join("") +
      (cat.id === "general" ? '<button class="dk-subnav-item" data-subnav="desktop">Desktop & Tray</button><button class="dk-subnav-item" data-subnav="teacher">Teacher & Help</button>' : "") +
    "</nav>";

    var docHead = '<div class="dk-doc-head"><div class="dk-kicker">SETTINGS WORKSPACE // ' + MODEL + '</div>' +
      "<h1>" + ico(cat.icon, 18) + " " + esc(cat.title) + ' <span class="pm-badge pm-badge-' + (cat.status.kind === "ok" ? "ok" : cat.status.kind === "warn" ? "warn" : "danger") + '">' +
      led(destKindLed(cat.status.kind)) + " " + esc(cat.status.summary) + "</span></h1>" +
      "<p>" + esc(cat.purpose) + "</p></div>";

    var sections = cat.subcategories.map(function (sub, i) {
      var rows = sub.settings.map(function (s) { return M.settingRow(ST.state.settings[s.id] || s); }).join("");
      var mgrSlot = "";
      if (sub.manager) mgrSlot = '<div class="dk-mgr-slot" data-manager-slot="' + esc(sub.manager) + '"></div>';
      var extra = "";
      if (cat.id === "general" && sub.id === "language") extra = dictionariesPanel();
      return '<section class="dk-sub" id="dk-sub-' + esc(sub.id) + '" data-sub-id="' + esc(sub.id) + '">' +
        "<h2><span class=\"idx\">" + String(i + 1).padStart(2, "0") + "</span> " + esc(sub.title) + (sub.manager ? ' <span class="pm-badge pm-badge-muted">Manager</span>' : "") + "</h2>" +
        rows + mgrSlot + extra +
      "</section>";
    }).join("");

    var extras = cat.id === "general" ? desktopManager() + teacherSection() : "";

    var html = '<div class="dk-work dk-enter">' + strip +
      '<div class="dk-work-body">' + subnav + '<div class="dk-doc">' + docHead + sections + extras + "</div></div>" +
    "</div>";

    var scrollerEl = content.querySelector(".dk-work");
    var keepScroll = scrollerEl ? scrollerEl.scrollTop : 0;
    var sameCat = scrollerEl && scrollerEl.getAttribute("data-cat") === cat.id;
    content.innerHTML = html;
    var scroller = content.querySelector(".dk-work");
    scroller.setAttribute("data-cat", cat.id);
    if (sameCat) scroller.scrollTop = keepScroll;

    hydrateManagers(cat);
    setupScrollspy(cat, scroller);
    centerActiveTab();
    applyDeepLink(view);
  }

  function hydrateManagers(cat) {
    cat.subcategories.forEach(function (sub) {
      if (!sub.manager) return;
      var slot = content.querySelector('[data-manager-slot="' + sub.manager + '"]');
      if (!slot) return;
      var build = MANAGER_BUILDERS[sub.manager];
      if (!build) return;
      window.PMCore.hydrateManager(slot, function (container) {
        container.innerHTML = build();
        applyDeepLink(ST.state.view);
      });
    });
  }

  function setupScrollspy(cat, scroller) {
    var ids = cat.subcategories.map(function (s) { return s.id; });
    if (cat.id === "general") ids = ids.concat(["desktop", "teacher"]);
    spy = window.PMCore.scrollspy(scroller, function () {
      return ids.map(function (id) {
        var el = content.querySelector('[data-sub-id="' + id + '"], [data-sub-anchor="' + id + '"]');
        return { id: id, el: el };
      }).filter(function (s) { return s.el; });
    }, function (activeId) {
      content.querySelectorAll("[data-subnav]").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-subnav") === activeId);
      });
    }, { offset: 108 });
  }

  function centerActiveTab() {
    var tab = content.querySelector(".dk-tab.active");
    var strip = content.querySelector(".dk-tabs");
    if (!tab || !strip) return;
    strip.scrollTo({ left: Math.max(0, tab.offsetLeft - (strip.clientWidth - tab.offsetWidth) / 2), behavior: reduced() ? "auto" : "smooth" });
  }

  function waitFor(sel, fn, tries) {
    var el = content.querySelector(sel);
    if (el) { fn(el); return; }
    if (tries > 0) setTimeout(function () { waitFor(sel, fn, tries - 1); }, 120);
  }

  function flash(el) {
    if (!el) return;
    el.scrollIntoView({ block: "center", behavior: reduced() ? "auto" : "smooth" });
    window.PMCore.focusFlash(el);
  }

  function openProviderPane(cardId, pane) {
    var card = content.querySelector('[data-provider-card="' + cardId + '"]');
    if (!card) return;
    card.querySelectorAll("[data-ptab]").forEach(function (b) {
      var on = b.getAttribute("data-ptab") === pane;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    card.querySelectorAll(".pm-provider-pane").forEach(function (p) {
      p.hidden = p.getAttribute("data-pane") !== pane;
    });
  }

  function applyDeepLink(view) {
    if (view.provider) {
      waitFor('[data-provider-card="' + view.provider + '"]', function (card) {
        openPanes[view.provider] = openPanes[view.provider] || "install";
        openProviderPane(view.provider, openPanes[view.provider]);
        flash(card);
      }, 20);
    } else if (view.setting) {
      waitFor('[data-setting-row="' + view.setting + '"]', flash, 8);
    } else if (view.manager) {
      waitFor('[data-manager="' + view.manager + '"]', flash, 20);
    } else if (view.subcategory) {
      var el = content.querySelector('[data-sub-id="' + view.subcategory + '"]');
      if (el && spy) spy.jumpTo(view.subcategory);
    }
  }

  // ---- Render dispatch ------------------------------------------------------------
  function render(view) {
    if (spy) { spy.destroy(); spy = null; }
    if (view && view.name === "workspace") renderWorkspace(view);
    else renderHome();
    refreshInbox();
  }

  ST.subscribe(function (kind, payload) {
    if (kind === "navigate") { render(ST.state.view); return; }
    if (kind === "receipt") return;
    if (kind === "teacher") {
      var targets = {
        "tch-providers": { category: "models", manager: "providers" },
        "tch-permissions": { category: "permissions", manager: "permissions" },
        "tch-backup": { category: "system", manager: "backup" }
      };
      var t = targets[payload.id];
      if (t) { ST.navigate(wsView(t)); return; }
    }
    render(ST.state.view);
  });

  // ---- Concept-local interactions ---------------------------------------------------

  // Record provider tab choices so re-renders keep them.
  content.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-ptab]") : null;
    if (!t) return;
    var card = t.closest("[data-provider-card]");
    if (card) openPanes[card.getAttribute("data-provider-card")] = t.getAttribute("data-ptab");
  });

  // Theme hover preview + apply (delegated).
  var previewOrigin = null;
  content.addEventListener("mouseover", function (e) {
    var card = e.target.closest ? e.target.closest("[data-theme-preview]") : null;
    if (!card || card.contains(e.relatedTarget)) return;
    if (previewOrigin === null) previewOrigin = document.documentElement.getAttribute("data-theme");
    document.documentElement.setAttribute("data-theme", card.getAttribute("data-theme-preview"));
  });
  content.addEventListener("mouseout", function (e) {
    var card = e.target.closest ? e.target.closest("[data-theme-preview]") : null;
    if (!card || card.contains(e.relatedTarget)) return;
    if (previewOrigin !== null) {
      document.documentElement.setAttribute("data-theme", previewOrigin);
      previewOrigin = null;
    }
  });

  function findCustomTheme(id) {
    var out = null;
    D.customThemes.themes.forEach(function (t) { if (t.id === id) out = t; });
    return out;
  }

  content.addEventListener("click", function (e) {
    // Theme cards: apply on click/Enter.
    var card = e.target.closest ? e.target.closest("[data-theme-preview]") : null;
    if (card) {
      var customId = card.getAttribute("data-theme-custom");
      if (customId) {
        var ct = findCustomTheme(customId);
        if (ct && ct.state === "schema-invalid") {
          previewOrigin = null;
          document.documentElement.setAttribute("data-theme", card.getAttribute("data-theme-preview"));
          ST.receipt("Cannot apply " + ct.name, "Schema-invalid TOML — PM renders the base theme (" + ct.base + ") and shows the diagnostic instead. Simulated.", "blocked");
          return;
        }
        if (ct) {
          previewOrigin = null;
          document.documentElement.setAttribute("data-theme", card.getAttribute("data-theme-preview"));
          ST.receipt(ct.name + " applied", "Custom TOML over its base theme " + ct.base + " — " + ct.inherited + ". Simulated custom tokens.", "ok");
          return;
        }
      }
      var name = card.getAttribute("data-theme-preview");
      previewOrigin = null;
      document.documentElement.setAttribute("data-theme", name);
      ST.receipt("Theme applied", name.split("-").map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(" ") + " is now active across the shell.", "ok");
      render(ST.state.view);
      return;
    }

    var actEl = e.target.closest ? e.target.closest("[data-dk-act]") : null;
    if (!actEl) {
      // Home + workspace generic bindings
      var home = e.target.closest ? e.target.closest("[data-open]") : null;
      if (home) { ST.navigate(wsView({ category: home.getAttribute("data-open") })); return; }
      var recent = e.target.closest ? e.target.closest("[data-recent]") : null;
      if (recent) {
        var r = null;
        ST.state.recents.forEach(function (x) { if (x.id === recent.getAttribute("data-recent")) r = x; });
        if (r) ST.navigate(wsView(r.target));
        return;
      }
      var nGo = e.target.closest ? e.target.closest("[data-notice-go]") : null;
      if (nGo) {
        var n1 = null;
        ST.state.notices.forEach(function (x) { if (x.id === nGo.getAttribute("data-notice-go")) n1 = x; });
        if (n1) noticePrimary(n1);
        return;
      }
      var nGo2 = e.target.closest ? e.target.closest("[data-notice-go2]") : null;
      if (nGo2) {
        var n2 = null;
        ST.state.notices.forEach(function (x) { if (x.id === nGo2.getAttribute("data-notice-go2")) n2 = x; });
        if (n2) noticeSecondary(n2);
        return;
      }
      var tab = e.target.closest ? e.target.closest("[data-dk-tab]") : null;
      if (tab) { ST.navigate(wsView({ category: tab.getAttribute("data-dk-tab") })); return; }
      var subnavBtn = e.target.closest ? e.target.closest("[data-subnav]") : null;
      if (subnavBtn && spy) { spy.jumpTo(subnavBtn.getAttribute("data-subnav")); var snOpen = content.querySelector("#dk-subnav.open"); if (snOpen) snOpen.classList.remove("open"); return; }
      var backBtn = e.target.closest ? e.target.closest("[data-dk-home]") : null;
      var subnavToggle = e.target.closest ? e.target.closest("[data-dk-subnav-toggle]") : null;
      if (subnavToggle) {
        var sn = content.querySelector("#dk-subnav");
        if (sn) sn.classList.toggle("open");
        return;
      }
      var subnavClose = e.target.closest ? e.target.closest("[data-dk-subnav-close]") : null;
      if (subnavClose) {
        var sn2 = content.querySelector("#dk-subnav");
        if (sn2) sn2.classList.remove("open");
        return;
      }
      if (backBtn) { ST.navigate({ name: "home" }); return; }
      var findBtn = e.target.closest ? e.target.closest("[data-dk-find]") : null;
      if (findBtn) {
        ST.navigate({ name: "home" });
        setTimeout(function () { var q = document.getElementById("dk-q"); if (q) q.focus(); }, reduced() ? 60 : 380);
        return;
      }
      return;
    }

    var act = actEl.getAttribute("data-dk-act");
    switch (act) {
      case "dk.inbox.flash": {
        inbox.querySelector("[data-inbox-btn]").classList.add("pm-focus-wash");
        setTimeout(function () { inbox.querySelector("[data-inbox-btn]").classList.remove("pm-focus-wash"); }, 1300);
        ST.receipt("Title-bar inbox", "That chip is the only in-app notification surface. Simulated highlight.", "info");
        break;
      }
      case "dk.quiet.open": { if (spy) spy.jumpTo("quiet"); break; }
      case "dk.dest.edit": {
        var id = actEl.getAttribute("data-dest");
        var d = null;
        ST.state.collections.notificationDestinations.forEach(function (x) { if (x.id === id) d = x; });
        if (!d) break;
        window.PMCore.promptDialog("Edit destination — " + d.name, d.channel, function (v) {
          if (v) ST.updateDestination(id, { channel: v });
        });
        break;
      }
      case "dk.dict.add": {
        var scope = actEl.closest(".dk-mgr-body") || content;
        var wordEl = scope.querySelector("[data-dict-word]");
        var kindEl = scope.querySelector("[data-dict-kind]");
        var w = (wordEl.value || "").trim();
        if (!w) { ST.receipt("Word needed", "Type a word to add to the dictionary.", "blocked"); break; }
        ST.addToDictionary(kindEl.value, w.toLowerCase());
        wordEl.value = "";
        break;
      }
      case "dk.dict.remove": ST.removeFromDictionary(actEl.getAttribute("data-kind"), actEl.getAttribute("data-word")); break;
      case "dk.theme.create": {
        window.PMCore.promptDialog("New custom theme name (TOML)", "my-theme.toml", function (v) {
          if (v) ST.receipt("Custom theme created", v + " scaffolded with base-theme inheritance — only overridden tokens are stored. Simulated.", "ok");
        });
        break;
      }
      case "dk.theme.import": ST.receipt("Theme imported", "TOML parsed, schema validated, base-theme inheritance resolved. Simulated file.", "sim"); break;
      case "dk.theme.export": ST.receipt("Theme exported", "Custom theme written as TOML with source disclosure. Simulated.", "sim"); break;
      case "dk.theme.folder": ST.receipt("Theme folder opened", "themes/ revealed in the file manager. Simulated.", "sim"); break;
      case "dk.desktop.toggle": {
        var key = actEl.getAttribute("data-key");
        deckDesktop[key] = !deckDesktop[key];
        ST.receipt("Deck fixture updated", key + " is now " + (deckDesktop[key] ? "On" : "Off") + ". Simulated desktop fixture.", "ok");
        ST.emit("collections", { name: "deckDesktop" });
        break;
      }
      case "dk.desktop.seg": {
        deckDesktop[actEl.getAttribute("data-key")] = actEl.getAttribute("data-val");
        ST.receipt("Deck fixture updated", "Window restore set to " + actEl.getAttribute("data-val") + ". Simulated.", "ok");
        ST.emit("collections", { name: "deckDesktop" });
        break;
      }
      case "dk.ab.up":
      case "dk.ab.down": {
        var abid = actEl.getAttribute("data-ab");
        var list = deckDesktop.activityBar;
        var idx = -1;
        list.forEach(function (x, i) { if (x.id === abid) idx = i; });
        var swap = idx + (act === "dk.ab.up" ? -1 : 1);
        if (idx >= 0 && swap >= 0 && swap < list.length) {
          var tmp = list[idx]; list[idx] = list[swap]; list[swap] = tmp;
          ST.receipt("Activity Bar reordered", tmp.label + " moved. Layout state persists. Simulated.", "ok");
          ST.emit("collections", { name: "deckDesktop" });
        }
        break;
      }
      case "dk.ab.hide": {
        var hid = actEl.getAttribute("data-ab");
        deckDesktop.activityBar.forEach(function (x) {
          if (x.id === hid) {
            x.hidden = !x.hidden;
            ST.receipt(x.hidden ? "Activity Bar item hidden" : "Activity Bar item shown", x.label + (x.hidden ? " is hidden; its state is kept." : " is visible again.") + " Simulated.", "ok");
          }
        });
        ST.emit("collections", { name: "deckDesktop" });
        break;
      }
      case "dk.teacher.open": {
        var tm = null;
        D.teacherMoments.forEach(function (t) { if (t.id === actEl.getAttribute("data-teacher")) tm = t; });
        var ttargets = {
          "tch-providers": { category: "models", manager: "providers" },
          "tch-permissions": { category: "permissions", manager: "permissions" },
          "tch-backup": { category: "system", manager: "backup" }
        };
        if (tm && ttargets[tm.id]) ST.navigate(wsView(ttargets[tm.id]));
        break;
      }
      case "dk.memory.verify": {
        ST.state.memory.forEach(function (m) { if (m.id === actEl.getAttribute("data-memory")) { m.state = "verified"; ST.receipt("Memory verified", "Evidence checked; the memory is fully trusted now. Simulated.", "ok"); } });
        ST.emit("collections", { name: "memory" });
        break;
      }
      case "dk.memory.pin": {
        ST.state.memory.forEach(function (m) { if (m.id === actEl.getAttribute("data-memory")) { m.pinned = !m.pinned; ST.receipt(m.pinned ? "Memory pinned" : "Memory unpinned", m.pinned ? "Pinned memories resist half-life fading." : "The memory follows normal activation again.", "ok"); } });
        ST.emit("collections", { name: "memory" });
        break;
      }
      case "dk.memory.capsule": {
        var mem = null;
        ST.state.memory.forEach(function (m) { if (m.id === actEl.getAttribute("data-memory")) mem = m; });
        if (mem) ST.receipt("Capsule preview", mem.kind + " · scope " + mem.scope + " · half-life " + mem.halfLife + " · evidence: " + mem.evidence, "info");
        break;
      }
      case "dk.context.omit": ST.receipt("Source omitted next request", actEl.getAttribute("data-src") + " will be skipped on the next assembly. Admission stays receipted. Simulated.", "ok"); break;
      case "dk.crew.use": ST.receipt("Crew selected", "This crew applies to the current thread or Goal — never globally. Simulated.", "ok"); break;
      case "dk.persona.default": {
        var nm = actEl.getAttribute("data-persona");
        ST.setSettingValue("behavior.personas.default", nm);
        break;
      }
      case "dk.persona.capsule": {
        var pe = null;
        ST.state.personas.forEach(function (p) { if (p.id === actEl.getAttribute("data-persona")) pe = p; });
        if (pe) ST.receipt("Capsule: " + pe.name, pe.capsule + " bounded capsule — provenance " + pe.provenance + ", eligible for " + pe.eligible + ". Behavior, not authority.", "info");
        break;
      }
      case "dk.preset.apply": ST.receipt("Preset staged", "Preset rules would be appended below existing rules — last match wins, so order is confirmed before apply. Simulated.", "info"); break;
      case "dk.term.default": {
        ST.state.terminalProfiles.forEach(function (t) { t.isDefault = t.id === actEl.getAttribute("data-term"); });
        ST.receipt("Default terminal changed", "New sessions use this profile. Simulated.", "ok");
        ST.emit("collections", { name: "terminalProfiles" });
        break;
      }
      case "dk.term.session": ST.receipt("Terminal session", "A new session would open with this profile's shell, env, and palette. Simulated.", "sim"); break;
      case "dk.lsp.restart": ST.receipt("LSP restart queued", "The server restarts without losing editor state; attachment re-resolves. Simulated.", "sim"); break;
      case "dk.lsp.logs": {
        var ls = null;
        ST.state.lspServers.forEach(function (l) { if (l.id === actEl.getAttribute("data-lsp")) ls = l; });
        if (ls) M.modal("Logs — " + ls.name, ls.logs.length ? ls.logs.map(function (line) { return '<div class="pm-log">' + esc(line) + "</div>"; }).join("") : '<div class="pm-empty">No log entries this session.</div>');
        break;
      }
      case "dk.mcp.logs": {
        var sv = null;
        ST.state.mcpServers.forEach(function (s) { if (s.id === actEl.getAttribute("data-mcp")) sv = s; });
        if (sv) M.modal("Logs — " + sv.name, sv.logs.map(function (line) { return '<div class="pm-log">' + esc(line) + "</div>"; }).join(""));
        break;
      }
      case "dk.mcp.repair": ST.receipt("Repair queued", "Transport spawn will be retried with diagnostics attached. Simulated.", "sim"); break;
      case "dk.mcp.reconnect": ST.receipt("Reconnect requested", "Authorization will be requested through the server's own flow. Simulated.", "sim"); break;
      case "dk.skill.trust": {
        ST.state.skills.forEach(function (s) { if (s.id === actEl.getAttribute("data-skill")) { s.trust = "Trusted"; ST.receipt("Skill trusted", s.name + " is trusted for this scope. Trust is revocable. Simulated.", "ok"); } });
        ST.emit("collections", { name: "skills" });
        break;
      }
      case "dk.skill.enable": {
        ST.state.skills.forEach(function (s) { if (s.id === actEl.getAttribute("data-skill")) { s.enabled = !s.enabled; ST.receipt(s.enabled ? "Skill enabled" : "Skill disabled", s.name + (s.enabled ? " can be selected again." : " stays installed but cannot be selected.") + " Simulated.", "ok"); } });
        ST.emit("collections", { name: "skills" });
        break;
      }
      case "dk.plugin.retry": ST.receipt("Load retried", "The plugin host re-attempted loading and recorded the failure reason — incompatible with this build. Simulated.", "blocked"); break;
      case "dk.storage.quarantine": ST.receipt("Quarantine", "2 quarantined artifacts await review. Deletion requires an explicit decision per item. Simulated.", "info"); break;
      case "dk.history.delete": {
        var hid2 = actEl.getAttribute("data-history");
        ST.state.collections.historyRows = ST.state.collections.historyRows.filter(function (h) { return h.id !== hid2; });
        ST.receipt("History deleted", "The thread and its transcripts were removed per the deletion policy. Simulated.", "ok");
        ST.emit("collections", { name: "historyRows" });
        break;
      }
      case "dk.artifact.reveal": ST.receipt("Artifact revealed", "The file's location opens in the file manager with provenance intact. Simulated.", "sim"); break;
      case "dk.artifact.redact": ST.receipt("Artifact redacted", "Likely secrets scrubbed; the redaction is recorded in the receipt trail. Simulated.", "ok"); break;
      case "dk.web.test": ST.receipt("Web readiness", "Built-in provider responding; credit guard and limits verified. Simulated.", "ok"); break;
      case "dk.files.recovery": ST.receipt("Recovery files", "Unsaved buffers from the last exit are listed; each can be restored or discarded. Simulated.", "info"); break;
    }
  });

  // Deck-local select: launch destination fixture.
  content.addEventListener("change", function (e) {
    var el = e.target;
    var key = el.getAttribute && el.getAttribute("data-dk-select");
    if (!key) return;
    deckDesktop[key] = el.value;
    ST.receipt("Deck fixture updated", "Launch destination set to " + el.value + ". Simulated.", "ok");
  });

  // Theme cards: keyboard apply.
  content.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var card = e.target.closest ? e.target.closest("[data-theme-preview]") : null;
    if (card) { e.preventDefault(); card.click(); }
  });

  // ---- Boot ------------------------------------------------------------------------
  var initial = window.PMCore.startRouter();
  render(initial);
  window.__conceptReady = true;
})();
</script>
</body>
</html>
