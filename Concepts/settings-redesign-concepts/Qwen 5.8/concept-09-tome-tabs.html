<!doctype html>
<html lang="en" data-theme="friendly-dark" data-reduced-motion="0" data-concept-id="concept-09-tome-tabs">
<head>
<meta charset="utf-8">

<style>
/* concept-09-tome-tabs — layered reading canvas with persistent edge chapter tabs.
   Layout borrowed from the Tome Tabs reference; rendered entirely in PM tokens.
   Retheme prohibitions honored: zero forbidden ornament or skeuomorphism. */

.tt-root { display: flex; flex-direction: column; min-height: 0; flex: 1; }

/* --- concept topbar: back / breadcrumb / search / close ------------------- */
.tt-topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.tt-crumb { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; color: var(--text-2); font-size: 12px; flex-wrap: wrap; }
.tt-crumb b { color: var(--text-1); font-weight: 600; }
.tt-crumb .tt-sep { color: var(--text-3); }
.tt-topbar .tt-searchbox { width: min(340px, 38vw); flex: none; }

/* --- body: layered page + right edge chapter tabs -------------------------- */
.tt-body { position: relative; display: grid; grid-template-columns: minmax(0,1fr) 74px; min-height: 0; flex: 1; }
.tt-stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--bg-shell, var(--bg)); }

/* the reading page: layered surface tones give depth without paper metaphor */
.tt-page {
  position: absolute; inset: 0 10px 0 0; overflow-y: auto; min-height: 0;
  background: var(--surface);
  border: 1px solid var(--border); border-right: none;
  border-radius: var(--radius-l) 0 0 var(--radius-l);
  box-shadow: var(--shadow);
  padding: 18px clamp(16px, 4vw, 44px) 40px;
}
/* two receding under-pages on the right edge (stacked surfaces, not paper) */
.tt-stage::before, .tt-stage::after {
  content: ""; position: absolute; top: 10px; bottom: 10px; right: 4px; width: 8px;
  border: 1px solid var(--border); border-left: none; border-radius: 0 var(--radius-s) var(--radius-s) 0;
  background: var(--surface-3); pointer-events: none;
}
.tt-stage::after { right: 0; top: 18px; bottom: 18px; background: var(--bg); }

/* page-turn motion: quiet translate, skipped for search paint + reduced motion */
@keyframes ttTurn { from { transform: translateX(18px); opacity: .35; } to { transform: none; opacity: 1; } }
.tt-page.tt-turn { animation: ttTurn .18s ease-out 1; }
[data-reduced-motion="1"] .tt-page.tt-turn { animation: none; }

/* --- right edge chapter tabs ------------------------------------------------ */
.tt-rail { display: flex; flex-direction: column; gap: 4px; padding: 14px 0 14px 0; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.tt-rail::-webkit-scrollbar { display: none; }
.tt-tab {
  position: relative; z-index: 1; flex: none;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  border: 1px solid var(--border); border-right: none;
  border-radius: var(--radius-s) 0 0 var(--radius-s);
  background: var(--surface-2); color: var(--text-2);
  padding: 7px 4px 6px 6px; margin-right: 10px;
  cursor: pointer; font-size: 10px; letter-spacing: .02em;
  transition: transform .12s ease, background .12s ease, color .12s ease;
}
.tt-tab .pm-ico { color: var(--text-3); }
.tt-tab:hover { background: var(--surface-3); color: var(--text-1); transform: translateX(-2px); }
.tt-tab.active {
  z-index: 3; margin-right: 10px; padding-right: 14px;
  background: var(--surface); color: var(--accent);
  border-color: var(--border); box-shadow: var(--shadow);
  transform: translateX(-1px);
}
.tt-tab.active .pm-ico { color: var(--accent); }
.tt-lbl-full { display: none; }
.tt-tab .tt-lbl { line-height: 1.25; }

/* hover/focus tooltip for abbreviated rail labels (non-wide tiers) */
.tt-tip {
  position: fixed; z-index: 95; transform: translate(-100%, -50%);
  background: var(--surface-2); border: 1px solid var(--border-strong);
  color: var(--text-1); border-radius: var(--radius-s); padding: 4px 9px;
  font-size: 11px; white-space: nowrap; pointer-events: none; box-shadow: var(--shadow);
}
.tt-tip[hidden] { display: none; }

/* --- reading rhythm ---------------------------------------------------------- */
.tt-measure { max-width: 75ch; }
.tt-cap { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-3); margin: 22px 0 8px; }
.tt-cap:first-child { margin-top: 0; }
.tt-h1 { display: flex; align-items: center; gap: 10px; color: var(--text-1); font-size: 19px; font-weight: 700; margin: 2px 0 4px; }
.tt-h1 .pm-ico { color: var(--accent); }
.tt-lede { color: var(--text-2); font-size: 12.5px; line-height: 1.55; max-width: 75ch; margin: 0 0 6px; }
.tt-rule { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.tt-note { color: var(--text-3); font-size: 11.5px; }

/* --- home frontispiece -------------------------------------------------------- */
.tt-front-head { text-align: left; }
.tt-search-lg { position: relative; max-width: 640px; margin: 14px 0 6px; }
.tt-search-lg .tt-field { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-strong); border-radius: var(--radius-m); background: var(--surface-2); padding: 10px 12px; }
.tt-search-lg input { flex: 1; border: none; outline: none; background: none; color: var(--text-1); font-size: 13.5px; }
.tt-banner { display: flex; align-items: flex-start; gap: 8px; border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--text-1); border-radius: var(--radius-m); padding: 10px 12px; margin: 10px 0; max-width: 75ch; }
.tt-banner .pm-ico { color: var(--warn); margin-top: 1px; }
.tt-notice { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface-2); padding: 8px 12px; margin-bottom: 6px; max-width: 75ch; }
.tt-notice .pm-ico { color: var(--warn); flex: none; }
.tt-notice .tt-notice-body { flex: 1; min-width: 0; }
.tt-notice strong { display: block; color: var(--text-1); font-size: 12.5px; }
.tt-notice span { color: var(--text-2); font-size: 11.5px; }

.tt-chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(430px, 100%), 1fr)); gap: 8px; }
.tt-chapter {
  display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center;
  border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface-2);
  padding: 12px 14px; cursor: pointer; text-align: left; color: var(--text-1);
  transition: border-color .12s ease, background .12s ease;
}
.tt-chapter:hover { border-color: var(--border-strong); background: var(--surface-3); }
.tt-chapter .tt-ch-ico { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: var(--radius-s); background: var(--accent-soft); color: var(--accent); }
.tt-chapter b { font-size: 13.5px; font-weight: 650; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tt-chapter p { margin: 2px 0 0; color: var(--text-2); font-size: 12px; max-width: 75ch; }
.tt-chapter .tt-ch-meta { color: var(--text-3); font-size: 11px; text-align: right; white-space: nowrap; }
.tt-utilities { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* --- search dropdown ----------------------------------------------------------- */
.tt-searchbox { position: relative; }
.tt-field { display: flex; align-items: center; gap: 7px; border: 1px solid var(--border-strong); border-radius: var(--radius-s); background: var(--surface-2); padding: 6px 9px; }
.tt-field .pm-ico { color: var(--text-3); flex: none; }
.tt-field input { flex: 1; min-width: 0; border: none; outline: none; background: none; color: var(--text-1); font-size: 12.5px; }
.tt-drop {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 60;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-m);
  box-shadow: var(--shadow); max-height: min(430px, 60vh); overflow-y: auto; padding: 6px;
}
.tt-drop-group { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); padding: 7px 8px 3px; }
.tt-drop-row { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; border: none; background: none; border-radius: var(--radius-s); padding: 7px 8px; cursor: pointer; }
.tt-drop-row:hover, .tt-drop-row.active { background: var(--surface-2); }
.tt-drop-row .tt-dr-top { display: flex; align-items: center; gap: 8px; color: var(--text-1); font-size: 12.5px; font-weight: 600; min-width: 0; }
.tt-drop-row .tt-dr-top span.lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt-drop-row .tt-dr-path { color: var(--text-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt-drop-row .tt-dr-note { color: var(--warn); font-size: 11px; }
.tt-drop-empty { padding: 14px 10px; color: var(--text-2); font-size: 12px; text-align: center; }
.tt-drop-foot { padding: 6px 8px 2px; color: var(--text-3); font-size: 10.5px; border-top: 1px solid var(--border); margin-top: 4px; }

/* --- manager-local tabs ---------------------------------------------------------- */
.tt-tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin: 12px 0 14px; }
.tt-tabs [role="tab"] { border: none; background: none; color: var(--text-2); padding: 6px 12px; cursor: pointer; font-size: 12px; border-radius: var(--radius-s) var(--radius-s) 0 0; border-bottom: 2px solid transparent; }
.tt-tabs [role="tab"]:hover { background: var(--surface-2); color: var(--text-1); }
.tt-tabs [role="tab"].active { color: var(--accent); font-weight: 600; border-bottom-color: var(--accent); background: var(--accent-soft); }

/* --- roster + detail ---------------------------------------------------------------- */
.tt-mgr-grid { display: grid; grid-template-columns: minmax(200px, 260px) minmax(0,1fr); gap: 16px; align-items: start; }
.tt-roster { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface-2); overflow: hidden; }
.tt-roster-cap { padding: 8px 12px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); border-bottom: 1px solid var(--border); }
.tt-roster-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: none; background: none; color: var(--text-1); padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.tt-roster-item:last-child { border-bottom: none; }
.tt-roster-item:hover { background: var(--surface-3); }
.tt-roster-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tt-roster-item .pm-ico { color: var(--text-3); flex: none; }
.tt-roster-item.active .pm-ico { color: var(--accent); }
.tt-roster-item .tt-ri-note { margin-left: auto; color: var(--text-3); font-size: 10.5px; white-space: nowrap; }
.tt-health { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-2); }
.tt-health i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.tt-health.warn i { background: var(--warn); } .tt-health.err i { background: var(--err); } .tt-health.muted i { background: var(--text-3); }

.tt-detail { min-width: 0; }
.tt-detail-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.tt-detail-head b { font-size: 15px; color: var(--text-1); }
.tt-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px 18px; margin: 10px 0; }
.tt-kv > div { border: 1px solid var(--border); border-radius: var(--radius-s); background: var(--surface-2); padding: 8px 10px; }
.tt-kv dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); }
.tt-kv dd { margin: 3px 0 0; color: var(--text-1); font-size: 12.5px; }
.tt-secret { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px dashed var(--border-strong); border-radius: var(--radius-s); padding: 6px 10px; margin: 6px 0; color: var(--text-2); font-size: 11.5px; }
.tt-log { font-size: 11.5px; color: var(--text-2); padding: 3px 0; border-bottom: 1px dashed var(--border); }
.tt-log:last-child { border-bottom: none; }

/* --- deferred insertion shell -------------------------------------------------------- */
.tt-defer { border: 1px dashed var(--border-strong); border-radius: var(--radius-m); background: var(--surface-3); padding: 10px 12px; margin: 10px 0; }
.tt-defer .tt-cap { margin: 0 0 6px; }
.tt-defer p { margin: 3px 0; color: var(--text-2); font-size: 12px; max-width: 70ch; }
.tt-defer p b { color: var(--text-1); }

/* --- ops tray (ObservableWork) --------------------------------------------------------- */
.tt-ops { position: sticky; bottom: 0; margin: 18px -8px -8px; display: flex; flex-direction: column; gap: 6px; }
.tt-op { border: 1px solid var(--border-strong); border-radius: var(--radius-m); background: var(--surface-2); box-shadow: var(--shadow); padding: 8px 12px; }
.tt-op-head { display: flex; align-items: center; gap: 8px; color: var(--text-1); font-size: 12px; font-weight: 600; }
.tt-op-head .pm-ico { color: var(--accent); }
.tt-op-phase { color: var(--text-2); font-weight: 400; font-size: 11.5px; }
.tt-op-bar { height: 4px; border-radius: 2px; background: var(--surface-3); margin-top: 6px; overflow: hidden; }
.tt-op-bar i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.tt-op-wait { color: var(--warn); font-size: 11px; margin-top: 4px; }

/* --- all settings ------------------------------------------------------------------------ */
.tt-facets { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 12px; }
.tt-facets .pm-select { max-width: 190px; }
.tt-vlist { height: min(560px, 62vh); overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface-2); padding: 4px 10px; }
.tt-vlist .pm2-row { grid-template-columns: minmax(0,1fr) auto; }
.tt-vlist .pm2-row-desc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56ch; }
.tt-count { color: var(--text-3); font-size: 11.5px; }

/* --- copy flow ------------------------------------------------------------------------------ */
.tt-steps { display: flex; gap: 0; align-items: center; margin: 12px 0 18px; max-width: 720px; }
.tt-step { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 11.5px; }
.tt-step i { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border-strong); font-style: normal; font-size: 11px; flex: none; }
.tt-step.active { color: var(--text-1); }
.tt-step.active i { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); font-weight: 700; }
.tt-step.done i { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tt-step-line { flex: 1; height: 1px; background: var(--border); margin: 0 10px; min-width: 16px; }
.tt-src { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface-2); padding: 10px 12px; margin-bottom: 6px; cursor: pointer; width: 100%; text-align: left; color: var(--text-1); }
.tt-src:hover { border-color: var(--border-strong); }
.tt-src.active { border-color: var(--accent); background: var(--accent-soft); }
.tt-src b { font-size: 12.5px; }
.tt-src .tt-note { display: block; }
.tt-cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 6px; }
.tt-catpick { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: var(--radius-s); background: var(--surface-2); padding: 8px 10px; font-size: 12px; color: var(--text-1); cursor: pointer; }
.tt-catpick input { accent-color: var(--accent); }
.tt-diff { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0; }
.tt-diff th { text-align: left; color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; padding: 4px 8px; border-bottom: 1px solid var(--border-strong); }
.tt-diff td { padding: 5px 8px; border-bottom: 1px solid var(--border); color: var(--text-1); }

/* --- wide margin pane ----------------------------------------------------------------------- */
.tt-margin { display: none; }
#app[data-wtier="wide"] .tt-margin {
  display: flex; flex-direction: column; gap: 10px;
  width: 280px; flex: none; border-left: 1px solid var(--border);
  padding: 14px 14px; background: var(--bg); overflow-y: auto;
}
.tt-margin .tt-cap { margin: 0 0 4px; }
.tt-margin .tt-mcard { border: 1px solid var(--border); border-radius: var(--radius-s); background: var(--surface-2); padding: 8px 10px; font-size: 11.5px; color: var(--text-2); }
.tt-margin .tt-mcard b { display: block; color: var(--text-1); font-size: 12px; margin-bottom: 2px; }

.tt-cols { display: grid; grid-template-columns: minmax(0,1fr); min-height: 0; flex: 1; }
#app[data-wtier="wide"] .tt-cols { grid-template-columns: minmax(0,1fr) 280px; }
/* wide tier: rail shows full human chapter names; no truncated context labels */
#app[data-wtier="wide"] .tt-body { grid-template-columns: minmax(0,1fr) auto; }
#app[data-wtier="wide"] .tt-rail { width: 118px; }
#app[data-wtier="wide"] .tt-tab { padding: 7px 8px 6px 8px; margin-right: 10px; }
#app[data-wtier="wide"] .tt-tab .tt-lbl { display: none; }
#app[data-wtier="wide"] .tt-tab .tt-lbl-full { display: inline; }
/* wide tier: home copy keeps a comfortable measure while the canvas fills */
#app[data-wtier="wide"] .tt-page .tt-lede { max-width: 88ch; }
#app[data-wtier="wide"] .tt-page .tt-banner, #app[data-wtier="wide"] .tt-page .tt-notice { max-width: 92ch; }

/* --- narrow / squeezed: tabs become controlled push navigation ------------------------------ */
#app[data-wtier="squeezed"] .tt-body, #app[data-wtier="narrow"] .tt-body { grid-template-columns: minmax(0,1fr); }
#app[data-wtier="squeezed"] .tt-rail, #app[data-wtier="narrow"] .tt-rail { display: none; }
#app[data-wtier="squeezed"] .tt-page, #app[data-wtier="narrow"] .tt-page { inset: 0; border-radius: 0; border-left: none; }
#app[data-wtier="squeezed"] .tt-stage::before, #app[data-wtier="squeezed"] .tt-stage::after,
#app[data-wtier="narrow"] .tt-stage::before, #app[data-wtier="narrow"] .tt-stage::after { display: none; }
#app[data-wtier="squeezed"] .tt-mgr-grid, #app[data-wtier="narrow"] .tt-mgr-grid { grid-template-columns: 1fr; }
/* push: when an object is open, the roster yields the whole pane */
#app[data-wtier="squeezed"] .tt-mgr-grid[data-hasobj="1"] .tt-roster,
#app[data-wtier="narrow"] .tt-mgr-grid[data-hasobj="1"] .tt-roster { display: none; }
#app[data-wtier="squeezed"] .tt-topbar, #app[data-wtier="narrow"] .tt-topbar { flex-wrap: wrap; }
#app[data-wtier="squeezed"] .tt-topbar .tt-searchbox, #app[data-wtier="narrow"] .tt-topbar .tt-searchbox { width: 100%; order: 5; }
#app[data-wtier="squeezed"] .tt-drop, #app[data-wtier="narrow"] .tt-drop { position: fixed; left: 10px; right: 10px; top: 96px; }
</style>

<script>
(function () {
  "use strict";
  var D = window.PMInventoryData, MD = window.PMManagers2Data, S2 = window.PMState2,
      SR = window.PMSearch2, M2 = window.PMManagers2, CP = window.PMCopy2, esc = M2.esc;

  S2.init("concept-09-tome-tabs");
  SR.register(MD.searchEntries());

  /* ---------- icon mapping (family/category icons onto PM icon set) ---------- */
  var ICONMAP = { database: "server", users: "persona", cpu: "code", box: "puzzle", copy: "layers",
    link: "external", heart: "activity", bell: "inbox", palette: "sun", upload: "refresh",
    film: "image", masks: "persona", toolbox: "grid", clipboard: "list", check: "check" };
  function ico(n, s) { return window.PMIcons.get(ICONMAP[n] || n, s || 15); }

  var SHORT = { general: "General", ai: "AI", safety: "Safety", code: "Code", memory: "Memory",
    planning: "Planning", branching: "Branch", media: "Media", web: "Web", personas: "Personas",
    extensions: "Extend", system: "System" };
  /* full human names for the rail; SHORT stays for the squeezed push-nav */
  var FULL = { general: "General", ai: "AI & Providers", safety: "Safety", code: "Code", memory: "Memory",
    planning: "Planning", branching: "Branching", media: "Media", web: "Web", personas: "Personas",
    extensions: "Extensions", system: "System" };

  /* ---------- shell ---------- */
  var shell = window.PMShell2.mount({
    conceptName: "Tome Tabs", model: "Qwen 5.8",
    onHome: function () { go("#/home"); },
    onTier: function () { /* CSS tiers handle geometry; nothing to re-render */ }
  });
  var content = shell.content;

  /* ---------- concept-local fixture store (manager demo rows only) ---------- */
  var FX = {};
  try { FX = JSON.parse(window.localStorage.getItem("pm.tt9.fx") || "{}") || {}; } catch (e) { FX = {}; }
  function fxSave() { try { window.localStorage.setItem("pm.tt9.fx", JSON.stringify(FX)); } catch (e) {} }
  function fxVal(r) { return FX[r.id] !== undefined ? FX[r.id] : r.value; }

  /* ---------- scroll memory: stable page location per route ---------- */
  var scrollMem = {};
  var pageEl = null;

  /* ---------- routing ---------- */
  function parseHash() {
    var h = window.location.hash || "#/home";
    if (h.indexOf("#/") !== 0) h = "#/home";
    var qi = h.indexOf("?");
    var path = qi >= 0 ? h.slice(2, qi) : h.slice(2);
    var q = {};

    if (sec === "rollback" && fam.id === "lifecycle") {
      var rps = S2.state.restorePoints;
      html += '<div class="tt-cap">Restore points</div>';
      if (!rps.length) html += '<div class="pm2-empty">No restore points yet — imports, copies, and resets create one automatically.</div>';
      rps.slice().reverse().forEach(function (rp) {
        html += '<div class="tt-notice">' + ico("history", 14) + '<div class="tt-notice-body"><strong>' + esc(rp.label) + '</strong><span>' + esc(rp.at) + "</span></div>" +
          '<button class="pm-btn pm-btn-sm" data-rollback="' + esc(rp.id) + '">Roll back</button></div>';
      });
      return html;
    }
    if (sec === "protected" && fam.id === "cleanup") {
      return '<div class="tt-cap">Protected paths</div>' + fxRow(findFx("cleanup.protected")) + fxRow(findFx("cleanup.dry-run")) +
        '<div class="pm2-row"><div class="pm2-row-main"><div class="pm2-row-title">Active worktrees</div><div class="pm2-row-desc">2 worktrees — never cleaned automatically.</div></div><div class="pm2-row-ctl"><span class="pm-badge pm-badge-managed">Protected</span></div></div>';
    }
    if (sec === "preview" && fam.id === "cleanup") {
      return '<div class="tt-cap">Last scan</div>' + fxRow(findFx("cleanup.reclaimable")) + '<div class="tt-cap">Run</div>' + fxRow(findFx("cleanup.run"));
    }
    if (sec === "transactions" && fam.id === "lifecycle") {
      return '<div class="tt-cap">Transactions</div>' + fam.rows.map(fxRow).join("") +
        '<div class="tt-cap">Project settings in this chapter</div>' + chapterSettingsBlock(catById("system"));
    }
    if (sec === "settings") {
      return '<div class="tt-cap">Preferences</div>' + fxRows(fam.rows, "setting") + chapterSettingsBlock(catById(fam.domain));
    }
    var body = '<div class="tt-cap">Status & diagnostics</div>' + fxRows(fam.rows, "status") + fxRows(fam.rows, "diagnostic");
    body += '<div class="tt-cap">Preferences & actions</div>' + fxRows(fam.rows, "setting") + fxRows(fam.rows, "action");
    if (fam.id === "doctor" && S2.state.scenario === "offline") body += '<div class="tt-banner">' + ico("alertTriangle", 14) + "<div>Offline: Doctor reports last-known health; remote checks are skipped honestly.</div></div>";
    if (fam.id === "web" && S2.state.scenario === "unavailable") body += '<div class="tt-banner">' + ico("alertCircle", 14) + "<div>Web search provider unavailable in this scenario; fetch policy still applies to cached pages.</div></div>";
    if (fam.id === "appearance" && S2.state.scenario === "changed-elsewhere") body += '<div class="tt-banner">' + ico("alertCircle", 14) + "<div>Theme changed elsewhere — review the new value or keep this Project's choice.</div></div>";
    if (fam.id === "desktop" && S2.state.scenario === "restart-required") body += '<div class="tt-banner">' + ico("refresh", 14) + "<div>A startup change is pending and needs an app restart to take effect.</div></div>";
    return body;
  }

  /* ---------- all settings ---------- */
  var allState = { cat: "all", type: "all", tier: "all", changed: false, managed: false, syn: false, seq: 0 };
  var vlistCtl = null;
  function synthRow(i) {
    var types = ["toggle", "select", "number", "text"];
    return { id: "synthetic-" + i, label: "Synthetic stress setting " + i, desc: "Generated row for virtualization evidence; never replaces the real 828.", type: types[i % 4], options: types[i % 4] === "select" ? ["A", "B"] : null, default: types[i % 4] === "toggle" ? false : types[i % 4] === "number" ? i % 10 : "x", tier: i % 3 === 0 ? "simple" : i % 3 === 1 ? "standard" : "advanced", synthetic: true };
  }
  function vAll() {
    var html = '<div data-test="all">';
    html += pageHead("list", "All Settings", "The full 828-row inventory in one virtualized compendium. Filters are faceted and bounded; the latest request wins.");
    html += '<div class="tt-facets">' +
      '<select class="pm-select" data-facet="cat"><option value="all">All categories</option>' + D.categories.map(function (c) { return '<option value="' + c.id + '">' + esc(c.title) + "</option>"; }).join("") + "</select>" +
      '<select class="pm-select" data-facet="type"><option value="all">All types</option>' + ["toggle", "select", "number", "text", "action", "slider", "radio", "multiselect", "list", "keyvalue", "path"].map(function (t) { return "<option>" + t + "</option>"; }).join("") + "</select>" +
      '<select class="pm-select" data-facet="tier"><option value="all">All tiers</option><option>simple</option><option>standard</option><option>advanced</option></select>' +
      '<label class="pm-note" style="display:inline-flex;align-items:center;gap:6px"><input type="checkbox" data-facet="changed"> Changed from default</label>' +
      '<label class="pm-note" style="display:inline-flex;align-items:center;gap:6px"><input type="checkbox" data-facet="managed"> Managed / unavailable</label>' +
      '<label class="pm-note" style="display:inline-flex;align-items:center;gap:6px"><input type="checkbox" data-facet="syn"> Synthetic stress +2000</label>' +
      '<span class="tt-count" id="ttAllCount"></span></div>';
    html += '<div class="tt-vlist" data-test="vlist" data-window="0:0:0"></div>';
    html += "</div>";
    return html;
  }
  function buildAll() {
    var host = pageEl.querySelector('[data-test="vlist"]');
    if (!host) return;
    var seq = ++allState.seq;
    setTimeout(function () {
      if (seq !== allState.seq) return; // latest-request-wins
      var rows = D.settings.slice();
      if (allState.syn) { for (var i = 1; i <= 2000; i++) rows.push(synthRow(i)); }
      rows = rows.filter(function (s) {
        if (allState.cat !== "all" && s.id.split(".")[0] !== allState.cat) return false;
        if (allState.type !== "all" && s.type !== allState.type) return false;
        if (allState.tier !== "all" && (s.tier || "standard") !== allState.tier) return false;
        var st = S2.getSetting(s.id);
        if (allState.changed && (!st || st.source !== "custom")) return false;
        if (allState.managed && (!st || (st.source !== "managed" && st.source !== "unavailable"))) return false;
        return true;
      });
      var count = pageEl.querySelector("#ttAllCount");
      if (count) count.textContent = rows.length + " rows" + (allState.syn ? " (incl. 2000 synthetic)" : "");
      vlistCtl = M2.virtualList({
        host: host, rowHeight: 64,
        data: rows,
        onWindow: function (s, e, t) { host.setAttribute("data-window", s + ":" + e + ":" + t); },
        render: function (s) {
          var st = s.synthetic ? { id: s.id, value: s.default, source: "default" } : S2.getSetting(s.id);
          var h = M2.row(s, st);
          if (s.synthetic) h = h.replace('<div class="pm2-row-title">', '<div class="pm2-row-title"><span class="pm-badge pm-badge-muted">Synthetic</span> ');
          return h;
        }
      });
      if (!host._ttBound) {
        host._ttBound = true;
        M2.bindRows(host);
        // details expansion would break the fixed virtual row height; suppress in the compendium
        host.addEventListener("click", function (e) {
          if (e.target.closest("[data-rowact='details']")) { e.stopImmediatePropagation(); }
        }, true);
      }
    }, 30);
  }

  /* ---------- copy flow ---------- */
  var copyState = { step: 1, source: null, cats: {}, preview: null, applied: null };
  function vCopy() {
    var s = copyState;
    var html = '<div data-test="copy">';
    html += pageHead("copy", "Copy Settings From Another Project", "A one-time transactional copy. Source and destination stay independent afterward.");
    html += '<div class="tt-steps">' + [1, 2, 3, 4].map(function (n, i) {
      var names = ["Select source", "Select categories", "Review & confirm", "Complete"];
      return (i ? '<div class="tt-step-line"></div>' : "") + '<div class="tt-step' + (s.step === n ? " active" : s.step > n ? " done" : "") + '"><i>' + n + "</i>" + names[i] + "</div>";
    }).join("") + "</div>";

    if (s.step === 1) {
      html += '<div class="tt-cap">Select source project</div>';
      MD.sourceProjects.forEach(function (p) {
        html += '<button class="tt-src' + (s.source === p.id ? " active" : "") + '" data-copysrc="' + p.id + '"><span><b>' + esc(p.name) + '</b> <span class="pm-badge pm-badge-muted">' + esc(p.updated) + '</span><span class="tt-note">' + esc(p.summary) + "</span></span></button>";
      });
      html += '<div class="pm-dialog-actions" style="justify-content:flex-start"><button class="pm-btn pm-btn-primary" data-copynext="2"' + (s.source ? "" : " disabled") + ">Next: Select Categories</button></div>";
    } else if (s.step === 2) {
      var src = MD.sourceProjects.filter(function (p) { return p.id === s.source; })[0];
      html += '<div class="tt-cap">Choose categories from ' + esc(src ? src.name : "") + '</div><div class="tt-cats">';
      D.categories.forEach(function (c) {
        var on = s.cats[c.id] !== false;
        html += '<label class="tt-catpick"><input type="checkbox" data-copycat="' + c.id + '"' + (on ? " checked" : "") + "> " + esc(c.title) + ' <span class="pm-badge pm-badge-muted">' + (src && src.counts[c.id] !== undefined ? src.counts[c.id] : 0) + "</span></label>";
      });
      html += '</div><div class="pm-dialog-actions" style="justify-content:flex-start"><button class="pm-btn pm-btn-quiet" data-copystep="1">Back</button><button class="pm-btn pm-btn-primary" data-copynext="3">Next: Review & Confirm</button></div>';
    } else if (s.step === 3) {
      if (!s.preview) s.preview = CP.preview(s.source, D.categories.filter(function (c) { return s.cats[c.id] !== false; }).map(function (c) { return c.id; }));
      var pv = s.preview;
      html += '<div class="tt-cap">Preview</div><div class="tt-kv">' +
        '<div><dt>Add</dt><dd>' + pv.counts.add + '</dd></div><div><dt>Replace</dt><dd>' + pv.counts.replace + '</dd></div><div><dt>Unchanged</dt><dd>' + pv.counts.same + '</dd></div><div><dt>Unavailable</dt><dd>' + pv.counts.unavailable + '</dd></div><div><dt>Conflict</dt><dd>' + pv.counts.conflict + "</dd></div></div>";
      html += '<table class="tt-diff"><tr><th>Setting</th><th>Category</th><th>Status</th><th>Note</th></tr>' +
        pv.rows.slice(0, 40).map(function (r) {
          return "<tr><td>" + esc(r.label) + "</td><td>" + esc(r.category) + '</td><td><span class="pm-badge ' + (r.status === "conflict" ? "pm-badge-warn" : r.status === "unavailable" ? "pm-badge-muted" : r.status === "credential" ? "pm-badge-managed" : "pm-badge-info") + '">' + esc(r.status) + "</span></td><td>" + esc(r.note || (r.status === "replace" ? String(r.current) + " → " + String(r.incoming) : "")) + "</td></tr>";
        }).join("") + "</table>" +
        (pv.rows.length > 40 ? '<p class="tt-note">…and ' + (pv.rows.length - 40) + " more rows in the apply set.</p>" : "");
      html += '<div class="tt-secret">' + ico("lock", 13) + "<span>Credential handling: account references copy per policy; raw secrets are never rendered or exported.</span></div>";
      html += '<div class="pm-dialog-actions" style="justify-content:flex-start"><button class="pm-btn pm-btn-quiet" data-copystep="2">Back</button><button class="pm-btn pm-btn-primary" data-copyapply="1">Create restore point & apply</button></div>';
    } else {
      var ap = s.applied;
      html += '<div class="tt-cap">Complete</div>' +
        '<div class="tt-notice">' + ico("checkCircle", 14) + '<div class="tt-notice-body"><strong>' + esc(ap ? ap.receipt.title : "Copy applied") + '</strong><span>' + esc(ap ? ap.receipt.detail : "") + "</span></div></div>" +
        '<div class="tt-kv"><div><dt>Changed</dt><dd>' + (ap ? ap.changed : 0) + '</dd></div><div><dt>Verified</dt><dd>' + (ap && ap.verify.ok ? "Yes — " + ap.verify.checked + " checked" : "Gaps: " + (ap ? ap.verify.mismatched.length : 0)) + '</dd></div><div><dt>Restore point</dt><dd>' + esc(ap ? ap.restorePoint.id : "") + "</dd></div></div>" +
        '<div class="pm-dialog-actions" style="justify-content:flex-start"><button class="pm-btn pm-btn-danger" data-copyrollback="1">Roll back this copy</button><button class="pm-btn pm-btn-quiet" data-go="#/home">Done</button></div>';
    }
    html += "</div>";
    return html;
  }

  /* ---------- margin pane (wide only) ---------- */
  function renderMargin(r) {
    var m = content.querySelector("#ttMargin");
    var rec = S2.state.receipts.slice(-3).reverse();
    m.innerHTML = '<div><div class="tt-cap">You are here</div><div class="tt-mcard"><b>' + esc(routeTitle(r)) + '</b>' + esc((catById(r.seg[1]) || {}).description || "Layered reading canvas; chapters keep their place.") + "</div></div>" +
      '<div><div class="tt-cap">Attention</div><div class="tt-mcard">' + (S2.notices().length ? S2.notices().map(function (n) { return esc(n.title); }).join("<br>") : "Nothing needs attention.") + "</div></div>" +
      '<div><div class="tt-cap">Latest receipts</div><div class="tt-mcard">' + (rec.length ? rec.map(function (x) { return esc(x.title); }).join("<br>") : "No receipts yet.") + "</div></div>";
  }

  /* ---------- render ---------- */
  var firstPaint = true;
  function render(opts) {
    opts = opts || {};
    var r = parseHash();
    var key = routeKey(r);
    if (pageEl && scrollMem.__cur) scrollMem[scrollMem.__cur] = pageEl.scrollTop;
    scrollMem.__cur = key;

    renderTopbar(r);
    renderRail(r);

    var html = "", turn = !opts.noturn && !firstPaint;
    var s = r.seg;
    if (!s.length || s[0] === "home") html = vHome();
    else if (s[0] === "cat") html = vCat(s[1], s[2]);
    else if (s[0] === "mgr") html = vMgr(s[1], s[2], r.q);
    else if (s[0] === "all") html = vAll();
    else if (s[0] === "copy") html = vCopy();
    else if (s[0] === "lifecycle") html = vMgr("lifecycle", null, r.q);
    else if (s[0] === "q") { html = vHome(); }
    else html = vHome();

    pageEl.innerHTML = html + opsTrayHtml();
    bindPage(pageEl);

    if (s[0] === "all") buildAll();
    if (s[0] === "home" || s[0] === "q") {
      var hs = pageEl.querySelector("#ttHomeSearch");
      if (hs) {
        mountSearch(hs, true);
        if (s[0] === "q") {
          var qy = decodeURIComponent(s.slice(1).join("/") || "");
          // search paint: no page-turn, restore query + results
          turn = false;
          hs._ttOpenWith(qy);
        }
      }
    }
    if (r.q.row && !pendingLocate) pendingLocate = { row: r.q.row };
    if (r.q.sec && !pendingLocate) pendingLocate = { sec: r.q.sec };

    renderMargin(r);

    pageEl.classList.remove("tt-turn");
    if (turn && document.documentElement.getAttribute("data-reduced-motion") !== "1") {
      void pageEl.offsetWidth;
      pageEl.classList.add("tt-turn");
    }
    pageEl.scrollTop = scrollMem[key] || 0;
    firstPaint = false;

    applyLocate();
  }

  /* ---------- global events ---------- */
  window.addEventListener("hashchange", function () { render({}); });

  content.addEventListener("click", function (e) {
    var back = e.target.closest("#ttBack");
    if (back) {
      if (window.history.length > 2) window.history.back();
      else go(back.getAttribute("data-back-hash"));
      return;
    }
    if (e.target.closest("#ttClose")) {
      S2.receipt("Settings closed", "Return to the workspace; this Project's settings stay applied.", "info");
      return;
    }
    var g = e.target.closest("[data-go]");
    if (g && !e.target.closest(".tt-page")) { go(g.getAttribute("data-go")); return; }
    var tab = e.target.closest("[data-mgrtab]");
    if (tab) {
      var r = parseHash();
      var base = "#/mgr/" + r.seg[1] + (r.seg[2] ? "/" + r.seg[2] : "");
      go(base + "?sec=" + encodeURIComponent(tab.getAttribute("data-mgrtab")));
      return;
    }
    var n = e.target.closest("[data-notice]");
    if (n) {
      var notice = S2.notices().filter(function (x) { return x.id === n.getAttribute("data-notice"); })[0];
      if (notice && notice.dest) {
        if (notice.dest.kind === "route") go(notice.dest.hash);
        else { pendingLocate = notice.dest; go(destHash(notice.dest)); }
      }
      return;
    }
    var rec = e.target.closest("[data-recent]");
    if (rec) {
      var parts = rec.getAttribute("data-recent").split(":");
      if (parts[0] === "setting") { var inv = D.byId(parts.slice(1).join(":")); if (inv) { pendingLocate = { row: inv.id }; go("#/cat/" + inv.id.split(".")[0] + "/" + inv.id.split(".")[1] + "?row=" + inv.id); } }
      else go("#/mgr/" + parts.slice(1).join(":"));
      return;
    }
    var rb = e.target.closest("[data-rollback]");
    if (rb) { S2.rollbackTo(rb.getAttribute("data-rollback")); return; }
    // copy flow
    var cs = e.target.closest("[data-copysrc]");
    if (cs) { copyState.source = cs.getAttribute("data-copysrc"); render({ noturn: true }); return; }
    var cn = e.target.closest("[data-copynext]");
    if (cn) { copyState.step = +cn.getAttribute("data-copynext"); copyState.preview = null; render({ noturn: true }); return; }
    var cstep = e.target.closest("[data-copystep]");
    if (cstep) { copyState.step = +cstep.getAttribute("data-copystep"); render({ noturn: true }); return; }
    var capp = e.target.closest("[data-copyapply]");
    if (capp) { copyState.applied = CP.apply(copyState.preview); copyState.step = 4; render({ noturn: true }); return; }
    var crb = e.target.closest("[data-copyrollback]");
    if (crb) { CP.rollbackLast(); copyState = { step: 1, source: null, cats: {}, preview: null, applied: null }; render({ noturn: true }); return; }
  });
  content.addEventListener("change", function (e) {
    var f = e.target.getAttribute && e.target.getAttribute("data-facet");
    if (!f) return;
    if (f === "changed" || f === "managed" || f === "syn") allState[f] = e.target.checked;
    else allState[f] = e.target.value;
    buildAll();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (document.querySelector(".pm-pop-menu")) { M2.closePopupMenu(); return; }
    var box = content.querySelector("#ttSearchBox");
    if (box && box._ttIsOpen && box._ttIsOpen()) { box._ttClose(); return; }
    var ov = document.querySelector(".pm-dialog-overlay");
    if (ov) { ov.remove(); return; }
    var r = parseHash();
    if (r.seg[0] !== "home") go("#/home");
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable) {
      e.preventDefault();
      var inp = content.querySelector('#ttSearchBox input');
      if (inp) inp.focus();
    }
  });

  /* ---------- state subscriptions ---------- */
  S2.subscribe(function (kind, payload) {
    if (kind === "setting" && payload && payload.id) {
      var el = pageEl.querySelector('[data-row="' + payload.id + '"]');
      if (el) {
        var inv = D.byId(payload.id);
        if (inv) {
          var tmp = document.createElement("div");
          tmp.innerHTML = M2.row(inv, S2.getSetting(payload.id));
          el.replaceWith(tmp.firstChild);
        }
      }
      return;
    }
    if (kind === "scenario" || kind === "rollback") { render({ noturn: true }); return; }
    if (kind === "op") {
      var tray = pageEl.querySelector(".tt-ops");
      var fresh = opsTrayHtml();
      if (tray) { if (fresh) tray.outerHTML = fresh; else tray.remove(); }
      else if (fresh) pageEl.insertAdjacentHTML("beforeend", fresh);
      return;
    }
  });

  render({});
})();
</script>
</body>
</html>
