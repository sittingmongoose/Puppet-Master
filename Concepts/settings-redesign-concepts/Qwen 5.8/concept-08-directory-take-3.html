<!doctype html>
<html lang="en" data-theme="friendly-dark" data-reduced-motion="0" data-concept-id="concept-08-directory-take-3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Directory Take 3 — Qwen 5.8</title>

<style>
/* scroll containment: #d3-view is the scrollport; nothing paints over the status bar */
/* concept-08-directory-take-3 — bright, spacious directory.
   Low density, big type, soft scale/transfer motion. Colors only via tokens. */
#content { background: var(--bg); }
#d3-view { max-width: 1240px; margin: 0 auto; padding: 26px 30px 90px; font-size: 14.5px; flex: 1 1 0; min-height: 0; overflow-y: auto; }
[data-wtier="squeezed"] #d3-view { padding: 16px 14px 90px; }

/* view transfer: soft scale + rise */
[data-reduced-motion="0"] #d3-view { animation: d3In .22s ease-out; }
@keyframes d3In { from { opacity: 0; transform: translateY(6px) scale(.992); } to { opacity: 1; transform: none; } }

/* header strip */
.d3-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.d3-crumb { display: flex; align-items: center; gap: 7px; color: var(--text-2); font-size: 12.5px; flex-wrap: wrap; min-width: 0; }
.d3-crumb b { color: var(--text-1); font-weight: 600; }
.d3-crumb .sep { color: var(--text-3); }
.d3-top .pm-spacer { flex: 1; }
.d3-top-home .pm-spacer { flex: 0 0 auto; }
.d3-top-home .d3-searchwrap { flex: 1 1 420px; }

/* search */
.d3-searchwrap { position: relative; }
.d3-search { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-l); padding: 10px 14px; color: var(--text-3); }
.d3-search input { flex: 1; border: none; outline: none; background: transparent; color: var(--text-1); font: inherit; font-size: 14.5px; min-width: 0; }
.d3-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.d3-search.big { padding: 15px 18px; }
.d3-search.big input { font-size: 17px; }
.d3-results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-m); box-shadow: var(--shadow); z-index: 60; max-height: min(430px, 60vh); overflow: auto; }
.d3-results .grp { padding: 8px 12px 3px; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); }
.d3-res { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 10px; width: 100%; text-align: left; padding: 9px 12px; border: none; background: transparent; color: var(--text-1); font: inherit; cursor: pointer; border-bottom: 1px solid var(--border); }
.d3-res:last-child { border-bottom: none; }
.d3-res:hover, .d3-res.sel { background: var(--accent-soft); }
.d3-res .lab { font-weight: 600; font-size: 13.5px; display: flex; gap: 8px; align-items: center; min-width: 0; }
.d3-res .pth { grid-column: 1; color: var(--text-2); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d3-res .note { grid-column: 1 / -1; color: var(--text-3); font-size: 11.5px; }
.d3-resfoot { padding: 8px 12px; color: var(--text-3); font-size: 11.5px; border-top: 1px solid var(--border); }

/* attention */
.d3-attention { display: flex; flex-direction: column; gap: 8px; margin: 0 0 22px; }
.d3-att { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 10px 14px; }
.d3-att .t { font-weight: 600; color: var(--text-1); font-size: 13.5px; }
.d3-att .r { color: var(--text-2); font-size: 12px; flex: 1; min-width: 0; }
.d3-att .pm-ico { color: var(--warn); flex: none; }

/* home directory cards */
.d3-h1 { font-size: 26px; font-weight: 700; color: var(--text-1); letter-spacing: -.01em; margin: 4px 0 2px; }
.d3-sub { color: var(--text-2); font-size: 13.5px; margin-bottom: 20px; max-width: 75ch; }
.d3-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.d3-card { display: flex; flex-direction: column; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l); padding: 20px; cursor: pointer; font: inherit; color: var(--text-1); }
[data-reduced-motion="0"] .d3-card { transition: transform .16s ease-out, box-shadow .16s ease-out, border-color .16s ease-out; }
[data-reduced-motion="0"] .d3-card:hover { transform: translateY(-2px) scale(1.008); box-shadow: var(--shadow); border-color: var(--border-strong); }
.d3-card .ic { width: 44px; height: 44px; border-radius: var(--radius-m); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.d3-card h3 { font-size: 17px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.d3-card p { margin: 0; color: var(--text-2); font-size: 12.5px; line-height: 1.5; max-width: 46ch; }
.d3-card .meta { display: flex; align-items: center; gap: 10px; color: var(--text-3); font-size: 11.5px; margin-top: auto; }
.d3-card .go { margin-left: auto; color: var(--accent); display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.d3-utils { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0 26px; }
.d3-recent { margin-top: 26px; }
.d3-recent h4, .d3-sect-h { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-3); margin: 0 0 10px; }
.d3-recent .item { display: inline-flex; align-items: center; gap: 7px; margin: 0 8px 8px 0; }

/* domain overview */
.d3-domhead { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
.d3-domhead .ic { width: 52px; height: 52px; border-radius: var(--radius-m); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
.d3-domhead h2 { margin: 0 0 4px; font-size: 23px; color: var(--text-1); }
.d3-domhead p { margin: 0; color: var(--text-2); font-size: 13px; max-width: 75ch; }
.d3-dest { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 6px 14px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l); padding: 18px 20px; margin-bottom: 12px; cursor: pointer; font: inherit; color: var(--text-1); }
[data-reduced-motion="0"] .d3-dest { transition: transform .16s ease-out, box-shadow .16s ease-out; }
[data-reduced-motion="0"] .d3-dest:hover { transform: translateY(-1px) scale(1.004); box-shadow: var(--shadow); }
.d3-dest .l { display: flex; gap: 14px; align-items: flex-start; min-width: 0; }
.d3-dest .ic { width: 38px; height: 38px; border-radius: var(--radius-s); background: var(--surface-2); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
.d3-dest h3 { margin: 0 0 3px; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.d3-dest p { margin: 0; color: var(--text-2); font-size: 12.5px; max-width: 70ch; }
.d3-dest .go { color: var(--accent); }
.d3-subnav { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 18px; }
.d3-subnav button { font: inherit; font-size: 12.5px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); cursor: pointer; }
.d3-subnav button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); font-weight: 600; }
.d3-defshell { border: 1px dashed var(--border-strong); border-radius: var(--radius-m); background: var(--surface-3); padding: 14px 16px; margin-bottom: 10px; }
.d3-defshell h4 { margin: 0 0 4px; font-size: 13.5px; color: var(--text-1); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.d3-defshell p { margin: 2px 0; font-size: 12px; color: var(--text-2); max-width: 75ch; }

/* manager view */
.d3-mgrhead { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.d3-mgrhead .ic { width: 46px; height: 46px; border-radius: var(--radius-m); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
.d3-mgrhead h2 { margin: 0 0 3px; font-size: 21px; color: var(--text-1); }
.d3-mgrhead p { margin: 0; color: var(--text-2); font-size: 12.5px; max-width: 75ch; }
.d3-mgr { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 18px; align-items: start; }
.d3-roster { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l); padding: 10px; position: sticky; top: 12px; max-height: calc(100vh - 140px); overflow: auto; }
.d3-roster button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border: none; background: transparent; border-radius: var(--radius-s); color: var(--text-1); font: inherit; font-size: 13px; cursor: pointer; }
.d3-roster button:hover { background: var(--surface-2); }
.d3-roster button.active { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
.d3-detail { min-width: 0; }
.d3-seccard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l); padding: 18px 20px; margin-bottom: 14px; scroll-margin-top: 12px; }
.d3-seccard h3 { margin: 0 0 12px; font-size: 14px; color: var(--text-1); display: flex; align-items: center; gap: 8px; }
.d3-statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.d3-stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 12px 14px; }
.d3-stat dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); margin-bottom: 4px; }
.d3-stat dd { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--text-1); word-break: break-word; }
.d3-stat dd small { display: block; font-weight: 400; color: var(--text-2); font-size: 11.5px; margin-top: 2px; }
.d3-qa { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.d3-kv { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 14px; padding: 9px 2px; border-bottom: 1px solid var(--border); align-items: center; }
.d3-kv:last-child { border-bottom: none; }
.d3-kv .k { font-size: 13px; color: var(--text-1); font-weight: 600; }
.d3-kv .k small { display: block; font-weight: 400; color: var(--text-2); font-size: 11.5px; }
.d3-secret { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-s); padding: 9px 12px; font-family: var(--font-mono); font-size: 12px; color: var(--text-2); margin: 8px 0; }
.d3-log { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; color: var(--text-2); font-size: 12.5px; }
.d3-log .pm-ico { color: var(--ok); flex: none; margin-top: 1px; }

/* all settings */
.d3-facets { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.d3-vlist { height: min(62vh, 640px); overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 4px 14px; }
.d3-vlist .pm2-row { min-height: 64px; box-sizing: border-box; }
.d3-count { color: var(--text-3); font-size: 12px; margin: 0 0 10px; }

/* copy flow */
.d3-copy { max-width: 980px; margin: 0 auto; }
.d3-steps { display: flex; align-items: center; gap: 10px; margin: 6px 0 22px; flex-wrap: wrap; }
.d3-step { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 12.5px; font-weight: 600; }
.d3-step .n { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font-size: 11.5px; }
.d3-step.active { color: var(--text-1); }
.d3-step.active .n { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
.d3-step.done .n { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.d3-step .bar { width: 26px; height: 1px; background: var(--border-strong); }
.d3-src { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 14px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; font: inherit; color: var(--text-1); }
.d3-src.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.d3-src h4 { margin: 0; font-size: 14px; }
.d3-src p { margin: 2px 0 0; color: var(--text-2); font-size: 12px; max-width: 70ch; }
.d3-catrow { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--border); }
.d3-catrow label { display: flex; gap: 12px; align-items: center; font-size: 13.5px; color: var(--text-1); font-weight: 600; cursor: pointer; flex-wrap: wrap; }
.d3-catrow .d { color: var(--text-2); font-size: 12px; font-weight: 400; }
.d3-catrow .c { color: var(--text-3); font-size: 12px; }
.d3-sum { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
.d3-sum .pm-badge { font-size: 12px; padding: 6px 10px; }
.d3-diff { max-height: 300px; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-m); padding: 4px 12px; background: var(--surface); }
.d3-diffrow { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--text-1); flex-wrap: wrap; }
.d3-diffrow:last-child { border-bottom: none; }
.d3-diffrow .id { margin-left: auto; color: var(--text-3); font-family: var(--font-mono); font-size: 10.5px; }

/* narrow / squeezed: push navigation, single column */
[data-wtier="narrow"] .d3-grid, [data-wtier="squeezed"] .d3-grid { grid-template-columns: 1fr; }
[data-wtier="narrow"] .d3-mgr, [data-wtier="squeezed"] .d3-mgr { grid-template-columns: 1fr; }
[data-wtier="narrow"] .d3-roster, [data-wtier="squeezed"] .d3-roster { position: static; max-height: none; }
[data-wtier="narrow"] #d3-view[data-roster="1"][data-hasobject="0"] .d3-detail, [data-wtier="squeezed"] #d3-view[data-roster="1"][data-hasobject="0"] .d3-detail { display: none; }
[data-wtier="narrow"] #d3-view[data-roster="1"][data-hasobject="1"] .d3-roster, [data-wtier="squeezed"] #d3-view[data-roster="1"][data-hasobject="1"] .d3-roster { display: none; }
[data-wtier="mid"] .d3-mgr { grid-template-columns: 250px minmax(0,1fr); }

/* reduced motion kills all concept animation */
[data-reduced-motion="1"] #d3-view, [data-reduced-motion="1"] .d3-card, [data-reduced-motion="1"] .d3-dest { animation: none; transition: none; }
</style>

<script src="_shared/pm-icons.js"></script>

<script>
(function () {
  "use strict";
  var D = window.PMInventoryData, MD = window.PMManagers2Data, S2 = window.PMState2, SR = window.PMSearch2, M2 = window.PMManagers2, C2 = window.PMCopy2;
  var esc = M2.esc, ico = M2.ico;
  var ICON_ALIAS = { palette: "sun", clipboard: "list", film: "image", masks: "persona", toolbox: "grid", bell: "inbox", heart: "activity", cpu: "code", copy: "layers", link: "server", upload: "download", users: "persona", database: "layers", box: "puzzle" };
  function ic(n, s) { return ico(ICON_ALIAS[n] || n, s); }

  S2.init("concept-08-directory-take-3");
  SR.register(MD.searchEntries());

  var shell = PMShell2.mount({
    conceptName: "Directory Take 3", model: "Qwen 5.8",
    onHome: function () { go("#/home"); },
    onTier: function () { render(currentRoute(), true); }
  });
  var content = shell.content;
  // tier fallback: ResizeObserver delivery is frame-gated in hidden headless tabs
  window.addEventListener("resize", function () {
    var app = shell.app, w = app.clientWidth;
    var tier = w < 860 ? "squeezed" : w < 1150 ? "narrow" : w < 1600 ? "mid" : "wide";
    if (app.getAttribute("data-wtier") !== tier) {
      app.setAttribute("data-wtier", tier);
      render(currentRoute(), true);
    }
  });
  // ---------------------------------------------------------------- routing
  var scrollMem = {};
  var searchOrigin = null;      // route object where the open search began
  var pendingFocus = null;      // {row, sec, object}
  var synState = {};            // concept-local values for family fixture rows
  var viewCache = {};           // routeKey -> html (loading-with-cache)
  // ---------------------------------------------------------------- runtime-demand continuation (packet 08)
  var demand = null, staleDemand = {}, installedLocal = {};
  var ATT_SOURCES = ["managed", "unavailable", "restart", "reconnect", "changed-elsewhere"];
  function demandToken() { return "cont-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 46656).toString(36); }
  function provReady(p) {
    if (installedLocal[p.id]) return true;
    return p.readiness.indexOf("not-installed") < 0 && (p.readiness.indexOf("authenticated") >= 0 || p.readiness.indexOf("probe-ok") >= 0);
  }
  function destEntries() { return MD.searchEntries(); }
  function demandBlockHTML(p) {
    var html = '<div class="d3-kv" style="margin-top:8px"><span class="k">Runtime demand<small>a chat run requests this CLI; the originating operation is preserved with a continuation token</small></span>' +
      '<button class="pm-btn pm-btn-sm" data-act="demand-simulate" data-prov="' + esc(p.id) + '">Simulate a runtime demand for this CLI</button></div>';
    var d = demand && demand.id === p.id ? demand : null;
    if (d) {
      html += '<div class="d3-kv"><span class="k">' + esc(d.op) + '<small>continuation token ' + esc(d.token) + (provReady(p) ? " — current" : " — waiting for installed + authenticated") + '</small></span>' +
        (provReady(p)
          ? '<button class="pm-btn pm-btn-primary pm-btn-sm" data-act="demand-resume" data-prov="' + esc(p.id) + '">Resume originating operation</button>'
          : '<button class="pm-btn pm-btn-sm" data-act="demand-open" data-prov="' + esc(p.id) + '">Open install row</button>') + "</div>";
      html += '<div class="pm-note">Deep link: #/mgr/providers/' + esc(p.id) + '?sec=install — resumes only while the stored token still matches this demand.</div>';
    } else if (staleDemand[p.id]) {
      html += '<div class="pm-note">Continuation stale: "' + esc(staleDemand[p.id].op) + '" (token ' + esc(staleDemand[p.id].token) + ') was superseded by a newer runtime demand; the stored token no longer matches. Simulate again to preserve a new operation.</div>';
    }
    return html;
  }

  function go(h) { if (location.hash === h) render(currentRoute(), true); else location.hash = h; }

  function currentRoute() {
    var h = location.hash || "#/home";
    var qIdx = h.indexOf("?");
    var qs = qIdx >= 0 ? h.slice(qIdx + 1) : "";
    var path = (qIdx >= 0 ? h.slice(0, qIdx) : h).replace(/^#\/?/, "");
    var parts = path.split("/").filter(Boolean);
    var params = {};
    qs.split("&").forEach(function (kv) { if (!kv) return; var p = kv.split("="); params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ""); });
    var r = { raw: h, routeAttr: h.replace(/^#/, ""), path: path, params: params, name: parts[0] || "home" };
    if (!parts[0]) r.name = "home";
    if (parts[0] === "cat") { r.cat = parts[1] || "general"; r.sub = parts[2] || null; }
    if (parts[0] === "mgr") { r.mgr = parts[1] || "providers"; r.object = parts[2] || null; }
    if (parts[0] === "deferred") { r.deferred = parts[1] || "servers"; }
    if (parts[0] === "q") { r.query = decodeURIComponent(parts.slice(1).join("/")); }
    if (parts[0] === "lifecycle") { r.name = "mgr"; r.mgr = "lifecycle"; }
    return r;
  }

  function family(id) { for (var i = 0; i < MD.families.length; i++) if (MD.families[i].id === id) return MD.families[i]; return null; }
  function provider(id) { for (var i = 0; i < MD.providers.length; i++) if (MD.providers[i].id === id) return MD.providers[i]; return null; }
  function deferredById(id) { for (var i = 0; i < MD.deferred.length; i++) if (MD.deferred[i].id === id) return MD.deferred[i]; return null; }
  function catOf(id) { return D.byCategory(id) ? D.byCategory(id).category : null; }
  var DEF_DOMAIN = { onboarding: "general", installation: "ai", "server-claim": "system", servers: "system", hosting: "system", "remote-access": "system", "sync-move": "system", updates: "system", "server-backup": "system" };

  // ---------------------------------------------------------------- chrome
  function chrome(route, opts) {
    var o = opts || {};
    var back = o.back || { hash: "#/home", label: "Back to Settings Home" };
    var crumb = ['<span class="d3-crumb" data-test="breadcrumb"><b>Settings</b>'];
    (o.crumbs || []).forEach(function (c) { crumb.push('<span class="sep">/</span>' + (c.hash ? '<a href="' + c.hash + '" style="color:inherit;text-decoration:none">' + esc(c.label) + "</a>" : "<b>" + esc(c.label) + "</b>")); });
    crumb.push("</span>");
    var search = o.bigSearch
      ? '<div class="d3-searchwrap">' + searchBox(true) + "</div>"
      : '<div class="d3-searchwrap" style="width:min(340px,46vw)">' + searchBox(false) + "</div>";

  function searchBox(big) {

  // ---------------------------------------------------------------- search dropdown
  var TYPE_LABEL = { setting: "Setting", manager: "Manager", managed_object: "Provider object", action: "Action", setup: "Setup", diagnostic: "Diagnostic", unavailable: "Not available" };
  function bindSearch(root) {
    var input = root.querySelector("[data-test='search-input']");
    var box = root.querySelector("[data-test='search-results']");
    if (!input) return;
    var sel = -1, results = [];
    function close() { box.hidden = true; sel = -1; }
    function open(q) {
      results = SR.search(q);
      if (!q.trim()) { close(); return; }
      if (!results.length) {
        box.innerHTML = '<div class="pm-empty" style="margin:8px">No results for “' + esc(q) + '”. Try a shorter fragment — fuzzy matching tolerates small typos.</div>';
        box.hidden = false;
        return;
      }
      var html = "", last = null;
      results.forEach(function (r) {
        if (r.type !== last) { html += '<div class="grp">' + (TYPE_LABEL[r.type] || r.type) + "</div>"; last = r.type; }
        html += '<button class="d3-res" data-rid="' + esc(r.rid) + '" role="option"><span class="lab pm2-r-title">' + esc(r.label) +
          ' <span class="pm-badge pm-badge-' + (r.type === "unavailable" ? "muted" : r.type === "setting" ? "info" : "effect") + '">' + (TYPE_LABEL[r.type] || r.type) + "</span></span>" +
          '<span class="pth">' + esc((r.path || []).join("  ›  ")) + "</span>" +
          (r.note ? '<span class="note">' + esc(r.note) + "</span>" : "") + "</button>";
      });
      html += '<div class="d3-resfoot">' + results.length + " of " + SR.cap + " max results · grouped by type · Enter opens the highlighted row</div>";
      box.innerHTML = html; box.hidden = false; sel = -1;
    }
    input.addEventListener("input", function () { open(input.value); });
    input.addEventListener("focus", function () { if (input.value.trim()) open(input.value); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { close(); e.stopPropagation(); return; }
      var rows = Array.prototype.slice.call(box.querySelectorAll(".d3-res"));
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!rows.length) return;
        e.preventDefault();
        sel = e.key === "ArrowDown" ? Math.min(rows.length - 1, sel + 1) : Math.max(0, sel - 1);
        rows.forEach(function (r, i) { r.classList.toggle("sel", i === sel); });
        rows[sel].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        var rid = sel >= 0 && rows[sel] ? rows[sel].getAttribute("data-rid") : (rows[0] ? rows[0].getAttribute("data-rid") : null);
        if (rid) { e.preventDefault(); selectResult(rid, input.value); }
      }
    });
    box.addEventListener("mousedown", function (e) {
      var b = e.target.closest ? e.target.closest(".d3-res") : null;
      if (b) { e.preventDefault(); selectResult(b.getAttribute("data-rid"), input.value); }
    });
    box.addEventListener("click", function (e) {
      if (e.detail !== 0) return; // real pointer selections handled on mousedown
      var b = e.target.closest ? e.target.closest(".d3-res") : null;
      if (b) selectResult(b.getAttribute("data-rid"), input.value);
    });
    document.addEventListener("click", function (e) { if (!box.contains(e.target) && e.target !== input) close(); });
    root._d3search = { open: open, close: close, set: function (q) { input.value = q; open(q); input.focus(); } };
  }
  function selectResult(rid, query) {
    var entry = SR.byRid(rid); // route by rid ONLY, never by index
    if (!entry) return;
    if (!entry.dest) { // unavailable capability: calm in-place notice, no fabricated route
      S2.receipt("Not available in this product", entry.label + ": " + (entry.note || "no alternative surface."), "info");
      return;
    }
    searchOrigin = currentRoute();
    var landing = destHash(entry.dest);
    pendingFocus = (entry.dest.row || entry.dest.section || entry.dest.settingId) ? { row: entry.dest.row || (entry.dest.kind === "setting" ? entry.dest.settingId : null), sec: entry.dest.section || null, object: entry.dest.object || null, routeRaw: landing.replace(/^#/, "") } : null;
    location.hash = "#/q/" + encodeURIComponent(query || entry.label); // history entry FIRST so Back restores query + results
    location.hash = landing;
  }
  function destHash(dest) {
    if (dest.kind === "setting") return "#/cat/" + dest.category + "/" + dest.subgroup + "?row=" + encodeURIComponent(dest.settingId);
    if (dest.kind === "manager") {
      var h = "#/mgr/" + dest.manager;

      var q = [];
      if (dest.section) q.push("sec=" + encodeURIComponent(dest.section));
      if (dest.row) q.push("row=" + encodeURIComponent(dest.row));
      return h + (q.length ? "?" + q.join("&") : "");
    }
    return "#/home";
  }

  function synthRow(i) {
    return { id: "synthetic.stress.row-" + i, label: "Synthetic stress row " + i, desc: "Generated row for virtualization evidence; marked synthetic, never replaces real data.", type: "toggle", tier: "advanced", synthetic: true };
  }
  function mountAll(root) {
    var host = root.querySelector("[data-test='vlist']");
    allState.vlist = null; // fresh host per mount; old list references a detached node
    var count = root.querySelector("[data-count]");
    function data() {
      if (allState.kind === "dest") return destEntries();
      var list = D.settings.filter(function (s) {
        if (allState.cat !== "all" && s.id.indexOf(allState.cat + ".") !== 0) return false;
        if (allState.type !== "all" && s.type !== allState.type) return false;
        if (allState.tier !== "all" && s.tier !== allState.tier) return false;
        var st = S2.getSetting(s.id);
        if (allState.changed && !(st && st.source === "custom")) return false;
        if (allState.managed && !(st && (st.source === "managed" || st.source === "unavailable"))) return false;
        if ((allState.attention || allState.kind === "attention") && !(st && ATT_SOURCES.indexOf(st.source) >= 0)) return false;
        return true;
      });
      if (allState.stress) for (var i = 1; i <= 2000; i++) list.push(synthRow(i));
      return list;
    }
    function renderRow(s) {
      if (s.rid) return '<div class="pm2-row" data-row="' + esc(s.rid) + '" data-rdest="1"><div class="pm2-row-main"><div class="pm2-row-title">' + esc(s.label) + ' <span class="pm-badge pm-badge-' + (s.type === "unavailable" ? "muted" : "info") + '">' + esc((s.type || "").replace(/_/g, " ")) + '</span></div><div class="pm2-row-desc">' + esc((s.path || []).join("  ›  ")) + (s.note ? " — " + esc(s.note) : "") + '</div></div><div class="pm2-row-ctl"><span class="pm-note">' + (s.dest ? "opens destination" : "not available") + "</span></div></div>";
      if (s.synthetic) return '<div class="pm2-row" data-row="' + s.id + '"><div class="pm2-row-main"><div class="pm2-row-title">' + esc(s.label) + ' <span class="pm-badge pm-badge-muted">Synthetic</span></div><div class="pm2-row-desc">' + esc(s.desc) + '</div></div><div class="pm2-row-ctl"><span class="pm-toggle" aria-disabled="true"><span class="pm-toggle-knob"></span></span></div></div>';
      return M2.row(s, S2.getSetting(s.id));
    }
    var token = 0;
    function rebuild() {
      var my = ++token; // latest-request-wins
      setTimeout(function () {
        if (my !== token) return;
        var list = data();
        totalNow = list.length;
        count.textContent = "Showing " + list.length + " row" + (list.length === 1 ? "" : "s") + " · " + D.settings.length + " real settings" + (allState.stress ? " + 2000 synthetic" : "") + " · windowed rendering";
        if (allState.vlist) allState.vlist.set(list);
        else allState.vlist = M2.virtualList({
          host: host, rowHeight: 64, render: renderRow, data: list,
          onWindow: function (s, e, t) { host.setAttribute("data-window", s + ":" + e + ":" + t); }
        });
      }, 30);
    }
    root.querySelectorAll("[data-facet]").forEach(function (el) {
      el.addEventListener("change", function () {
        var k = el.getAttribute("data-facet");
        allState[k] = el.type === "checkbox" ? el.checked : el.value;
        rebuild();
      });
    });
    var totalNow = 0;
    host.addEventListener("scroll", function () {
      var rowH = 64, vh = host.clientHeight;
      var s = Math.max(0, Math.floor(host.scrollTop / rowH) - 6);
      var e = Math.min(totalNow, Math.ceil((host.scrollTop + vh) / rowH) + 6);
      host.setAttribute("data-window", s + ":" + e + ":" + totalNow);
    });
    rebuild();
    M2.bindRows(host);
  }

      if (src) { copyState.source = src.getAttribute("data-copysrc"); render(currentRoute(), true); return; }
      if (e.target.closest("[data-copynext]")) { if (copyState.source) { copyState.step = 2; render(currentRoute(), true); } return; }
      var st = e.target.closest("[data-copystep]");
      if (st) { copyState.step = +st.getAttribute("data-copystep"); render(currentRoute(), true); return; }
      if (e.target.closest("[data-copypreview]")) { copyState.preview = C2.preview(copyState.source, copyState.cats); copyState.step = 3; render(currentRoute(), true); return; }
      if (e.target.closest("[data-copyapply]")) {
        var op = S2.beginOp({ title: "Copy settings", phase: "Creating restore point", determinate: true, total: Math.max(1, copyState.preview.rows.length) });
        setTimeout(function () {
          S2.advanceOp(op, { phase: "Applying values", completed: Math.ceil(Math.max(1, copyState.preview.rows.length) / 2) });
          setTimeout(function () {
            var res = C2.apply(copyState.preview);
            S2.advanceOp(op, { phase: "Verifying", completed: Math.max(1, copyState.preview.rows.length) });
            S2.finishOp(op, "completed", res.verify.ok ? "Verified" : "Verified with gaps");
            copyState.applied = res;
            viewCache = {};
            render(currentRoute(), true);
          }, 500);
        }, 400);
        return;
      }
      if (e.target.closest("[data-copyrollback]")) { C2.rollbackLast(); copyState.applied = null; copyState.preview = null; copyState.step = 1; viewCache = {}; render(currentRoute(), true); }
    });
    root.addEventListener("change", function (e) {
      var c = e.target.closest ? e.target.closest("[data-copycat]") : null;
      if (!c) return;
      var id = c.getAttribute("data-copycat");
      if (c.checked) { if (copyState.cats.indexOf(id) < 0) copyState.cats.push(id); }
      else copyState.cats = copyState.cats.filter(function (x) { return x !== id; });
      render(currentRoute(), true);
    });
  }

  // ---------------------------------------------------------------- render
  function wrap(route, html) {
    var attrs = ' id="d3-view" data-route="' + esc(route.routeAttr) + '"';
    if (route.name === "mgr") {
      var f = family(route.mgr);
      attrs += ' data-hasobject="' + (route.object ? "1" : "0") + '" data-roster="' + ((f && (f.archetype === "roster" || f.id === "providers")) ? "1" : "0") + '"';
    }
    return "<div" + attrs + ">" + html + "</div>";
  }
  function viewHtml(route) {
    switch (route.name) {
      case "cat": return catView(route);
      case "mgr": return mgrView(route);
      case "deferred": return deferredView(route);
      case "all": return allView();
      case "copy": return copyView();
      case "q": {
        var base = searchOrigin ? Object.assign({}, searchOrigin) : { name: "home" };
        if (base.name === "q") base = { name: "home" };
        return viewHtml(base);
      }
      default: return homeView();
    }
  }

  function render(route, force) {
    var key = route.raw;
    var cached = viewCache[key];
    if (cached && !force) {
      content.innerHTML = wrap(route, cached);
      afterRender(route);
      return;
    }
    if (!cached) {
      // loading-with-cache: skeleton first, cached content stays available elsewhere
      content.innerHTML = wrap(route, chrome(route, { crumbs: [] }) + M2.skeleton("Loading " + route.name));
      setTimeout(function () {
        if ((location.hash || "#/home") !== route.raw) return; // superseded
        var html = viewHtml(route);
        viewCache[key] = html;
        content.innerHTML = wrap(route, html);
        afterRender(route);
      }, 160);
      return;
    }
    var html2 = viewHtml(route);
    viewCache[key] = html2;
    content.innerHTML = wrap(route, html2);
    afterRender(route);
  }

  function afterRender(route) {
    var root = content.querySelector("#d3-view");
    bindSearch(root);
    bindSyn(root);
    M2.bindRows(root);
    if (route.name === "all") mountAll(root);
    if (route.name === "copy") bindCopy(root);

    root.addEventListener("click", function (e) {
      var g = e.target.closest ? e.target.closest("[data-go]") : null;
      if (g) { go(g.getAttribute("data-go")); return; }
      var d = e.target.closest ? e.target.closest("[data-dest]") : null;
      if (d) {
        var dest = JSON.parse(d.getAttribute("data-dest"));
        if (dest && dest.hash) go(dest.hash); else if (dest && dest.manager) go(destHash(dest));
        return;
      }
      var rd = e.target.closest ? e.target.closest("[data-rdest]") : null;
      if (rd) {
        var entry = SR.byRid(rd.getAttribute("data-row"));
        if (!entry) return;
        if (!entry.dest) { S2.receipt("Not available in this product", entry.label + ": " + (entry.note || "no alternative surface."), "info"); return; }
        go(destHash(entry.dest));
        return;
      }
      var sec = e.target.closest ? e.target.closest("[data-sec]") : null;
      if (sec) { var el = root.querySelector("#sec-" + sec.getAttribute("data-sec")); if (el) el.scrollIntoView({ block: "start" }); return; }
      var a = e.target.closest ? e.target.closest("[data-act]") : null;
      if (a) handleAct(a);
    });

    var mem = scrollMem[route.raw];
    if (mem !== undefined) root.scrollTop = mem;

    if (route.name === "q" && root._d3search) root._d3search.set(route.query || "");

    if (pendingFocus && route.routeAttr === pendingFocus.routeRaw) {
      var pf = pendingFocus, tries = 0;
      var applyFocus = function () {
        var live = content.querySelector("#d3-view");
        if (!live || live.getAttribute("data-route") !== pf.routeRaw) return; // navigated away: abort
        var target = null;
        if (pf.row) target = live.querySelector('[data-row="' + (window.CSS && CSS.escape ? CSS.escape(pf.row) : pf.row) + '"]');
        if (!target && pf.row) {
          var ctl0 = live.querySelector('[data-setting="' + (window.CSS && CSS.escape ? CSS.escape(pf.row) : pf.row) + '"]');
          if (ctl0) target = ctl0.closest(".pm2-row") || ctl0;
        }
        if (!target && pf.sec) target = live.querySelector("#sec-" + pf.sec);
        if (!target && pf.sec) target = live.querySelector('[data-sec="' + pf.sec + '"].active') || live.querySelector('[data-sec="' + pf.sec + '"]');
        if (!target && pf.object) target = live.querySelector('[data-object="' + pf.object + '"]');
        if (!target) target = live.querySelector("[data-manager]");
        if (target && target.isConnected) {
          pendingFocus = null;
          target.scrollIntoView({ block: "center" });
          target.classList.add("pm2-locate");
          var ctl = target.querySelector("button,select,input");
          if (ctl) ctl.focus({ preventScroll: true });
          else { target.setAttribute("tabindex", "-1"); target.focus({ preventScroll: true }); }
        } else if (tries++ < 15) {
          setTimeout(applyFocus, 60);
        } else pendingFocus = null;
      };
      setTimeout(applyFocus, 30);
    } else if (pendingFocus && route.name !== "q") {
      pendingFocus = null; // stale focus from an abandoned landing
    }
    if (route.params.row) {
      setTimeout(function () {
        var t = root.querySelector('[data-row="' + (window.CSS && CSS.escape ? CSS.escape(route.params.row) : route.params.row) + '"]');
        if (t) { t.scrollIntoView({ block: "center" }); t.classList.add("pm2-locate"); }
      });
    }
    if (route.params.sec) {
      setTimeout(function () {
        var t = root.querySelector("#sec-" + route.params.sec);
        if (t) { t.scrollIntoView({ block: "start" }); t.classList.add("pm2-locate"); }
      });
    }
  }

  function handleAct(btn) {
    var host = "Desktop — Windows 11";
    var act = btn.getAttribute("data-act");
    var pid = btn.getAttribute("data-prov") || currentRoute().object;
    if (act === "close") { S2.receipt("Settings closed", "Return to the Dashboard; every change here was receipted for this Project.", "info"); return; }
    if (act === "catalog-refresh") {
      var op = S2.beginOp({ title: "Catalog refresh", phase: "Contacting models.dev", determinate: false, wait: "network round-trip" });
      setTimeout(function () { S2.finishOp(op, "completed", "Catalog current"); S2.receipt("Catalog refreshed", "models.dev and Free Coding Models catalogs are current; last-known-good stayed active during the refresh.", "ok"); }, 900);
      return;
    }
    if (act === "update-now") {
      var u = S2.beginOp({ title: "Provider update", phase: "Downloading signed update", determinate: true, total: 3 });
      setTimeout(function () { S2.advanceOp(u, { phase: "Verifying", completed: 2 }); }, 500);
      setTimeout(function () { S2.advanceOp(u, { phase: "Activating", completed: 3 }); }, 1000);
      setTimeout(function () { S2.finishOp(u, "completed", "Update ready"); S2.receipt("Update applied", "Verification passed; the new generation is active. Ask-first policy honored.", "ok"); }, 1500);
      return;
    }
    if (act === "install-official") {
      var pp = provider(pid);
      var iop = S2.beginOp({ title: "Install " + (pp ? pp.name : pid), phase: "Downloading from official source", determinate: true, total: 3 });
      setTimeout(function () { S2.advanceOp(iop, { completed: 2, human_phase: "Verifying signature" }); }, 400);
      setTimeout(function () {
        installedLocal[pid] = true;
        S2.finishOp(iop, "completed", "Installed");
        S2.receipt("Install complete", (pp ? pp.name : pid) + " installed from the official source for " + host + ".", "ok");
        viewCache = {};
        render(currentRoute(), true);
      }, 1000);
      return;
    }
    if (act === "demand-simulate" || act === "demand-resume" || act === "demand-open") {
      var dp = provider(btn.getAttribute("data-prov"));
      if (!dp) return;
      if (act === "demand-simulate") {
        if (demand && demand.id !== dp.id) staleDemand[demand.id] = demand;
        demand = { id: dp.id, op: "Chat run requesting " + dp.name, token: demandToken() };
        S2.receipt("Provider Setup Required", dp.name + " is not ready for the originating operation (" + demand.op + "). The operation is preserved with continuation token " + demand.token + ". Deep link: #/mgr/providers/" + dp.id + "?sec=install. Resume only while the continuation is still current.", "info");
      } else if (act === "demand-resume") {
        if (demand && demand.id === dp.id && provReady(dp)) {
          S2.receipt("Operation resumed", demand.op + " resumes on " + dp.name + "; continuation token " + demand.token + " matched the stored demand.", "ok");
          demand = null;
        }
      } else {
        go("#/mgr/providers/" + dp.id + "?sec=install");
        return;
      }
      viewCache = {};
      render(currentRoute(), true);
      return;
    }
    if (act === "install-select" || act === "cli-signin" || act === "cred-rotate" || act === "model-default") {
      S2.receipt("Demo action", act + " is a simulated, receipted demo action in this concept; production wiring is described in candidate-wiring-delta.json.", "sim");
    }
  }

  // ---------------------------------------------------------------- events
  var prevRaw = location.hash || "#/home";
  window.addEventListener("hashchange", function () {
    var r = currentRoute();
    if (r.raw === prevRaw) return; // duplicate event from consecutive hash writes
    var cur = content.querySelector("#d3-view");
    scrollMem[prevRaw] = cur ? cur.scrollTop : 0;
    render(r, false);
    prevRaw = r.raw;
  });

  S2.subscribe(function (kind) {
    if (kind === "setting" || kind === "scenario" || kind === "rollback") {
      viewCache = {}; // truth over cache
      render(currentRoute(), true);
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      M2.closePopupMenu();
      var r = currentRoute();
      if (r.name === "mgr" && r.object) { go("#/mgr/" + r.mgr); return; }
      if (r.name !== "home") go("#/home");
      return;
    }
    if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) {
      e.preventDefault();
      var inp = content.querySelector("[data-test='search-input']");
      if (inp) inp.focus();
    }
  });
  if (!location.hash) { history.replaceState(null, "", "#/home"); prevRaw = "#/home"; }

  render(currentRoute(), true);
})();
</script>
</body>
</html>
