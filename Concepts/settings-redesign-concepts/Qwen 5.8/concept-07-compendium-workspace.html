<style>
/* ── Concept 07 · Compendium Workspace ─────────────────────────────
   Identity: a quiet two-pane workspace whose spine is the All Settings
   compendium — faceted, virtualized, readable. Dense but legible type
   rhythm (12.5px body, small-caps captions), pane-transfer motion:
   every route change slides the incoming pane along the reading axis. */
.cw-top {
  display: flex; align-items: center; gap: 8px; padding: 8px 14px;
  border-bottom: 1px solid var(--border); background: var(--bg-shell); flex: none;
}
.cw-crumb { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--text-2); font-size: 12px; flex-wrap: wrap; }
.cw-crumb b { color: var(--text-1); font-weight: 600; }
.cw-crumb .sep { color: var(--text-3); }
.cw-top .pm-spacer { flex: 1; }
.cw { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.cw-body { display: grid; grid-template-columns: 218px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); min-height: 0; flex: 1; }
#app[data-wtier="narrow"] .cw-body, #app[data-wtier="squeezed"] .cw-body { grid-template-columns: minmax(0, 1fr); }

/* left nav */
.cw-nav { border-right: 1px solid var(--border); background: var(--bg-shell); overflow-y: auto; overflow-x: hidden; padding: 10px 8px; min-height: 0; max-height: 100%; scrollbar-gutter: stable; }
.cw-nav-cap { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); padding: 8px 10px 4px; }
.cw-nav-item {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; border: none;
  background: none; color: var(--text-2); padding: 6px 10px; border-radius: var(--radius-s);
  cursor: pointer; font-size: 12.5px;
}
.cw-nav-item:hover { background: var(--surface-2); color: var(--text-1); }
.cw-nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cw-nav-item .n { margin-left: auto; color: var(--text-3); font-size: 10.5px; }
.cw-nav-close { display: none; }
#app[data-wtier="narrow"] .cw-nav, #app[data-wtier="squeezed"] .cw-nav {
  display: none; position: absolute; z-index: 45; top: 0; bottom: 0; left: 0; width: min(280px, 86vw);
  box-shadow: var(--shadow); border-right-color: var(--border-strong);
}
#app[data-wtier="narrow"] .cw-nav.open, #app[data-wtier="squeezed"] .cw-nav.open { display: block; }
#app[data-wtier="narrow"] .cw-nav-close, #app[data-wtier="squeezed"] .cw-nav-close {
  display: inline-flex; margin: 2px 8px 6px auto;
}
.cw-browse-btn { display: none; }
#app[data-wtier="narrow"] .cw-browse-btn, #app[data-wtier="squeezed"] .cw-browse-btn { display: inline-flex; }

/* pane + motion metaphor: pane transfer along reading axis */
.cw-pane { overflow-y: auto; min-height: 0; padding: 18px 22px 40px; position: relative; scroll-behavior: auto; }
.cw-pane-inner { max-width: 1160px; margin: 0 auto; }
#app[data-wtier="wide"] .cw-pane-inner { max-width: 1240px; }
[data-reduced-motion="0"] .cw-pane[data-anim="fwd"] .cw-pane-inner { animation: cwFwd .26s cubic-bezier(.2,.8,.2,1); }
[data-reduced-motion="0"] .cw-pane[data-anim="back"] .cw-pane-inner { animation: cwBack .26s cubic-bezier(.2,.8,.2,1); }
@keyframes cwFwd { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes cwBack { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }

.cw-h1 { font-size: 17px; font-weight: 700; color: var(--text-1); margin: 0 0 4px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.cw-sub { color: var(--text-2); font-size: 12.5px; max-width: 75ch; margin: 0 0 14px; }
.cw-cap { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-3); margin: 18px 0 8px; }
.cw-card { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 14px 16px; margin-bottom: 12px; }
.cw-banner { display: flex; align-items: center; gap: 10px; border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--text-1); border-radius: var(--radius-m); padding: 10px 14px; margin-bottom: 12px; font-size: 12.5px; }
.cw-banner .pm-ico { color: var(--warn); }

/* home */
.cw-hero-search { position: relative; margin: 10px 0 18px; }
.cw-hero-search input {
  width: 100%; height: 42px; border-radius: var(--radius-m); border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--text-1); padding: 0 44px 0 38px; font-size: 13.5px; outline: none;
}
.cw-hero-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.cw-hero-search .mag { position: absolute; left: 12px; top: 13px; color: var(--text-3); }
.cw-hero-search .kbd { position: absolute; right: 12px; top: 12px; }
.cw-dests { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#app[data-wtier="squeezed"] .cw-dests { grid-template-columns: 1fr; }
.cw-dest {
  display: flex; align-items: center; gap: 11px; border: 1px solid var(--border); border-radius: var(--radius-m);
  background: var(--surface); padding: 11px 13px; cursor: pointer; text-align: left; color: var(--text-1); width: 100%;
}
.cw-dest:hover { border-color: var(--border-strong); background: var(--surface-2); }
.cw-dest .ic { color: var(--accent); flex: none; }
.cw-dest .t { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.cw-dest .d { color: var(--text-2); font-size: 11.5px; margin-top: 2px; max-width: 52ch; }
.cw-dest .m { color: var(--text-3); font-size: 10.5px; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.cw-dest .chev { margin-left: auto; color: var(--text-3); flex: none; }
.cw-utils { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
.cw-attn { display: flex; flex-direction: column; gap: 6px; }
.cw-attn-row { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 8px 12px; font-size: 12.5px; color: var(--text-1); }
.cw-attn-row .why { color: var(--text-2); font-size: 11.5px; }
.cw-attn-row .pm-btn { margin-left: auto; }
.cw-recent-row { display: flex; align-items: center; gap: 10px; padding: 6px 2px; border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--text-1); }
.cw-recent-row:last-child { border-bottom: none; }
.cw-recent-row .when { margin-left: auto; color: var(--text-3); font-size: 11px; }

/* universal search dropdown */
.cw-sdrop {
  position: absolute; z-index: 80; left: 0; right: 0; top: calc(100% + 4px);
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-m);
  box-shadow: var(--shadow); max-height: min(430px, 60vh); overflow-y: auto; padding: 6px;
}
.cw-sdrop .row { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: var(--radius-s); cursor: pointer; width: 100%; border: none; background: none; text-align: left; color: var(--text-1); }
.cw-sdrop .row:hover, .cw-sdrop .row.active { background: var(--accent-soft); }
.cw-sdrop .row .lab { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cw-sdrop .row .pth { color: var(--text-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cw-sdrop .row .col { min-width: 0; display: flex; flex-direction: column; gap: 1px; flex: 1; }
.cw-sdrop .note { color: var(--text-3); font-size: 10.5px; }
.cw-compact-search { position: relative; width: min(320px, 38vw); }
.cw-compact-search input { width: 100%; height: 30px; border-radius: var(--radius-s); border: 1px solid var(--border-strong); background: var(--surface-3); color: var(--text-1); padding: 0 10px 0 30px; font-size: 12px; outline: none; }
.cw-compact-search input:focus { border-color: var(--accent); }
.cw-compact-search .mag { position: absolute; left: 9px; top: 8px; color: var(--text-3); }

/* all settings compendium */
.cw-all { display: grid; grid-template-columns: 224px minmax(0, 1fr); gap: 16px; min-height: 0; }
#app[data-wtier="narrow"] .cw-all, #app[data-wtier="squeezed"] .cw-all { grid-template-columns: minmax(0, 1fr); }
.cw-facets { min-height: 0; }
#app[data-wtier="narrow"] .cw-facets, #app[data-wtier="squeezed"] .cw-facets {
  display: none; position: absolute; z-index: 46; top: 0; bottom: 0; left: 0; width: min(300px, 88vw);
  background: var(--bg); box-shadow: var(--shadow); overflow-y: auto; padding: 12px; border-right: 1px solid var(--border-strong);
}
#app[data-wtier="narrow"] .cw-facets.open, #app[data-wtier="squeezed"] .cw-facets.open { display: block; }
.cw-facet-close { display: none; }
#app[data-wtier="narrow"] .cw-facet-close, #app[data-wtier="squeezed"] .cw-facet-close { display: inline-flex; float: right; }
.cw-facet-grp { margin-bottom: 14px; }
.cw-facet-opt { display: flex; align-items: center; gap: 8px; width: 100%; border: none; background: none; color: var(--text-2); padding: 4px 8px; border-radius: var(--radius-s); cursor: pointer; font-size: 12px; text-align: left; }
.cw-facet-opt:hover { background: var(--surface-2); color: var(--text-1); }
.cw-facet-opt.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cw-facet-opt .ct { margin-left: auto; color: var(--text-3); font-size: 10.5px; }
.cw-all-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.cw-all-count { color: var(--text-2); font-size: 12px; }
.cw-vlist { height: calc(100vh - 250px); min-height: 320px; overflow-y: auto; border-top: 1px solid var(--border); }
.cw-allrow {
  height: 64px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto;
  gap: 2px 14px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--border); cursor: pointer;
  border-left: none; border-right: none; border-top: none; width: 100%; background: none; text-align: left; color: var(--text-1);
}
.cw-allrow:hover { background: var(--surface-2); }
.cw-allrow .t { font-size: 12.5px; font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.cw-allrow .p { color: var(--text-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cw-allrow .v { color: var(--text-2); font-size: 11.5px; text-align: right; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cw-allrow .ty { color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
.cw-refresh-chip { display: inline-flex; align-items: center; gap: 6px; color: var(--info); font-size: 11px; }

/* domain pages */
.cw-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-bottom: 12px; }
.cw-stat { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 10px 12px; }
.cw-stat .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); }
.cw-stat .v { font-size: 14px; font-weight: 700; color: var(--text-1); margin-top: 3px; }
.cw-stat .s { font-size: 11px; color: var(--text-2); margin-top: 2px; }
.cw-mgr-row { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 10px 13px; cursor: pointer; color: var(--text-1); margin-bottom: 7px; }
.cw-mgr-row:hover { background: var(--surface-2); border-color: var(--border-strong); }
.cw-mgr-row .ic { color: var(--accent); }
.cw-mgr-row .t { font-weight: 600; font-size: 12.5px; }
.cw-mgr-row .d { color: var(--text-2); font-size: 11.5px; margin-top: 1px; max-width: 70ch; }
.cw-mgr-row .chev { margin-left: auto; color: var(--text-3); }
.cw-subchips { display: flex; gap: 6px; flex-wrap: wrap; }

/* manager workspace: integrated list/detail */
.cw-mgrws { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; min-height: 0; }
#app[data-wtier="narrow"] .cw-mgrws, #app[data-wtier="squeezed"] .cw-mgrws { grid-template-columns: minmax(0, 1fr); }
.cw-roster { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); overflow-y: auto; max-height: calc(100vh - 240px); }
.cw-roster-item { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; border: none; background: none; padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; color: var(--text-1); font-size: 12.5px; }
.cw-roster-item:last-child { border-bottom: none; }
.cw-roster-item:hover { background: var(--surface-2); }
.cw-roster-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cw-roster-item .n { margin-left: auto; color: var(--text-3); font-size: 10.5px; }
#app[data-wtier="narrow"] .cw-roster-only .cw-detail, #app[data-wtier="squeezed"] .cw-roster-only .cw-detail { display: none; }
#app[data-wtier="narrow"] .cw-mgrws.has-obj .cw-roster, #app[data-wtier="squeezed"] .cw-mgrws.has-obj .cw-roster { display: none; }
.cw-tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.cw-tabs button { border: none; background: none; color: var(--text-2); padding: 6px 11px; cursor: pointer; font-size: 12px; border-radius: var(--radius-s) var(--radius-s) 0 0; }
.cw-tabs button:hover { background: var(--surface-2); color: var(--text-1); }
.cw-tabs button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cw-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 18px; font-size: 12px; }
.cw-kv .k { color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
.cw-kv .v { color: var(--text-1); margin: 1px 0 6px; word-break: break-word; }
.cw-deferred { border: 1px dashed var(--border-strong); border-radius: var(--radius-m); padding: 14px 16px; background: var(--surface-3); }
.cw-logline { font-family: var(--font-mono); font-size: 11px; color: var(--text-2); padding: 2px 0; }
details.cw-drawer { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); margin-bottom: 8px; }
details.cw-drawer summary { cursor: pointer; padding: 9px 13px; color: var(--text-1); font-size: 12.5px; font-weight: 600; }
details.cw-drawer .body { padding: 4px 13px 12px; }

/* copy */
.cw-steps { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.cw-step { display: inline-flex; align-items: center; gap: 7px; color: var(--text-3); font-size: 12px; }
.cw-step .bub { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border-strong); display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; }
.cw-step.active { color: var(--text-1); font-weight: 600; }
.cw-step.active .bub { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
.cw-step.done { color: var(--ok); }
.cw-step.done .bub { border-color: var(--ok); }
.cw-step-line { width: 26px; height: 1px; background: var(--border-strong); }
.cw-counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 12px 0; }
.cw-src { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 10px 13px; cursor: pointer; width: 100%; text-align: left; color: var(--text-1); margin-bottom: 7px; }
.cw-src.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.cw-catchk { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: var(--radius-s); background: var(--surface); padding: 6px 10px; font-size: 12px; color: var(--text-1); cursor: pointer; }
.cw-catchk .ct { color: var(--text-3); font-size: 10.5px; }
.cw-cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.cw-diff-add { color: var(--ok); } .cw-diff-rep { color: var(--warn); } .cw-diff-con { color: var(--err); } .cw-diff-una { color: var(--text-3); }

/* ops strip */
.cw-ops { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.cw-op { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 8px 12px; font-size: 12px; color: var(--text-1); }
.cw-op .bar { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; min-width: 60px; }
.cw-op .bar i { display: block; height: 100%; background: var(--accent); }
.cw-op .why { color: var(--text-3); font-size: 11px; }

.pm2-locate { outline: none; }
@media (max-width: 700px) { .cw-pane { padding: 14px 12px 40px; } }
</style>

<script>
(function () {
  "use strict";
  var D = window.PMInventoryData, S2 = window.PMState2, M2 = window.PMManagers2,
      MD = window.PMManagers2Data, C2 = window.PMCopy2, Q = window.PMSearch2;

    { rid: "sr:manager:sync-move", type: "manager", label: "Project Sync / Move", path: ["System & Advanced", "Project Sync / Move"], dest: { kind: "manager", manager: "sync-move" }, keywords: ["sync", "move", "relocate"], note: "Named-owner shell — Project Syncing and Updates" },

  ]);
  var DEFERRED_DOMAIN = { onboarding: "general", installation: "ai", "server-claim": "system", servers: "system", hosting: "system", "remote-access": "system", "sync-move": "system", updates: "system", "server-backup": "system" };

  var shell = PMShell2.mount({ conceptName: "Compendium Workspace", model: "Qwen 5.8", onHome: goHome, onTier: function () {} });

  var UI = {

  var SYNTH = null;

  /* ---------- helpers ---------- */
  function catOf(id) { return id.split(".")[0]; }
  function catTitle(id) { var c = D.byCategory(id); return c ? c.category.title : id; }
  function subTitle(id) {

  function deferredById(id) { var f = null; (MD.deferred || []).forEach(function (x) { if (x.id === id) f = x; }); return f; }
  function isDeferred(id) { return !!deferredById(id); }
  function famDomain(f) { return (f && f.domain) || DEFERRED_DOMAIN[f && f.id] || null; }
  function domainFamilies(catId) { return families().filter(function (f) { return famDomain(f) === catId; }); }
  function changedCount(catId) {
    var n = 0; (D.byCategory(catId) || { settings: [] }).settings.forEach(function (s) {
      var st = S2.getSetting(s.id); if (st && st.source !== "default") n++;
    }); return n;
  }
  function timeAgo(ts) {
    var d = Math.max(0, Date.now() - ts), m = Math.round(d / 60000);
    if (m < 1) return "just now"; if (m < 60) return m + "m ago";
    var h = Math.round(m / 60); if (h < 24) return h + "h ago"; return Math.round(h / 24) + "d ago";
  }
  function synthRows() {
    if (SYNTH) return SYNTH;
    SYNTH = [];
    for (var i = 1; i <= 2000; i++) {
      SYNTH.push({
        id: "synthetic.stress." + i, label: "Synthetic Stress Setting " + i,
        desc: "Generated stress row for virtualization proof. Not part of the real 828-setting inventory.",
        type: i % 3 === 0 ? "toggle" : (i % 3 === 1 ? "number" : "select"),
        tier: i % 4 === 0 ? "advanced" : "simple", default: false, synthetic: true,
        options: ["Low", "High"], cat: "synthetic"
      });
    }
    return SYNTH;
  }

  /* ---------- routing ---------- */
  function parseRoute() {
    var h = location.hash || "#/home";
    var qi = h.indexOf("?"), q = {};
    var path = qi >= 0 ? h.slice(0, qi) : h;
    if (qi >= 0) h.slice(qi + 1).split("&").forEach(function (kv) {
      var p = kv.split("="); q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || "");
    });
    var parts = path.replace(/^#\//, "").split("/").filter(Boolean);
    return { name: parts[0] || "home", parts: parts, q: q, raw: h.replace(/^#/, "") };
  }
  function routeDepth(r) {
    if (r.name === "home" || r.name === "q") return 0;
    if (r.name === "cat") return r.parts[2] ? 2 : 1;
    if (r.name === "mgr") return r.parts[2] ? 2 : 1;
    return 1;
  }
  function destHash(dest) {
    if (!dest) return null;
    if (dest.kind === "setting") return "#/cat/" + dest.category + "/" + dest.subgroup + "?row=" + encodeURIComponent(dest.settingId);
    if (dest.kind === "manager") {
      var h = "#/mgr/" + dest.manager;
      if (dest.object) h += "/" + dest.object;
      var qs = [];
      if (dest.section) qs.push("sec=" + encodeURIComponent(dest.section));
      if (dest.row) qs.push("row=" + encodeURIComponent(dest.row));
      if (qs.length) h += "?" + qs.join("&");
      return h;
    }
    if (dest.kind === "route") return dest.hash;
    return "#/home";
  }
  function goHome() { location.hash = "#/home"; }

  /* ---------- search ---------- */
  function searchBox(large) {
    return large
      ? '<div class="cw-hero-search"><span class="mag">' + ico("search", 15) + '</span>' +
        '<input data-test="search-input" id="cw-search" type="text" autocomplete="off" spellcheck="false" placeholder="Search settings, managers, providers, actions…" aria-label="Universal settings search">' +
        '<span class="kbd pm-kbd">⌘K</span><div class="cw-sdrop" data-test="search-results" hidden></div></div>'
      : '<div class="cw-compact-search"><span class="mag">' + ico("search", 13) + '</span>' +
        '<input data-test="search-input" id="cw-search" type="text" autocomplete="off" spellcheck="false" placeholder="Search settings" aria-label="Universal settings search">' +
        '<div class="cw-sdrop" data-test="search-results" hidden></div></div>';
  }
  var TYPE_ORDER = ["setting", "manager", "managed_object", "action", "setup", "diagnostic", "unavailable"];
  var TYPE_LABEL = { setting: "Settings", manager: "Managers", managed_object: "Managed objects", action: "Actions", setup: "Setup", diagnostic: "Diagnostics", unavailable: "Unavailable" };
  function renderDrop(results) {
    var drop = shell.content.querySelector("[data-test='search-results']");
    if (!drop) return;
    UI.sOpen = results.length > 0;
    if (!results.length) {
      drop.hidden = false;
      drop.innerHTML = '<div class="pm2-empty" style="margin:6px">No results for “' + esc(UI.q) + '”. Check the spelling or browse the compendium.</div>';
      return;
    }
    var html = "", active = 0;
    TYPE_ORDER.forEach(function (t) {
      var rs = results.filter(function (r) { return r.type === t; });
      if (!rs.length) return;
      html += '<div class="pm2-group-cap" style="margin:8px 6px 3px">' + TYPE_LABEL[t] + "</div>";
      rs.forEach(function (r) {
        html += '<button class="row" data-rid="' + esc(r.rid) + '" data-idx="' + (active++) + '" role="option">' +
          '<span class="col"><span class="lab pm2-r-title">' + esc(r.label) + '</span>' +
          '<span class="pth">' + esc((r.path || []).join(" › ")) + "</span>" +
          (r.note ? '<span class="note">' + esc(r.note) + "</span>" : "") + "</span>" +
          '<span class="pm-search-type" data-rt="' + esc(r.type) + '">' + esc(r.type.replace("_", " ")) + "</span></button>";
      });
    });
    drop.hidden = false;
    drop.innerHTML = html;
    UI.sActive = -1;
  }
  function closeDrop() {
    var drop = shell.content.querySelector("[data-test='search-results']");
    if (drop) drop.hidden = true;
    UI.sOpen = false;
  }
  function bindSearch(root) {
    var input = root.querySelector("[data-test='search-input']");
    if (!input) return;
    if (UI.q) input.value = UI.q;
    input.addEventListener("input", function () {
      UI.q = input.value;
      if (!UI.q.trim()) { renderDrop([]); closeDrop(); return; }
      Q.searchAsync(UI.q, function (res) { if (input.value === UI.q) renderDrop(res); });
    });
    input.addEventListener("focus", function () { if (UI.q.trim()) Q.searchAsync(UI.q, renderDrop); });
    input.addEventListener("keydown", function (e) {
      var drop = root.querySelector("[data-test='search-results']");
      var rows = drop ? Array.prototype.slice.call(drop.querySelectorAll(".row")) : [];
      if (e.key === "Escape") { closeDrop(); e.stopPropagation(); return; }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!rows.length) return;
        e.preventDefault();
        UI.sActive = e.key === "ArrowDown" ? Math.min(rows.length - 1, UI.sActive + 1) : Math.max(0, UI.sActive - 1);
        rows.forEach(function (r, i) { r.classList.toggle("active", i === UI.sActive); });
        if (rows[UI.sActive]) rows[UI.sActive].scrollIntoView({ block: "nearest" });
        return;
      }
      if (e.key === "Enter") {
        var pick = rows[UI.sActive >= 0 ? UI.sActive : 0];
        if (pick) pick.click();
        else if (UI.q.trim()) { // no selection: land in the compendium with the query
          history.pushState(null, "", "#/q/" + encodeURIComponent(UI.q));
          UI.facets.q = UI.q; location.hash = "#/all";
        }
      }
    });
    var drop = root.querySelector("[data-test='search-results']");
    drop.addEventListener("click", function (e) {
      var row = e.target.closest ? e.target.closest(".cw-sdrop .row") : null;
      if (!row) return;
      var rid = row.getAttribute("data-rid");
      var entry = Q.byRid(rid); // route by immutable id only
      if (!entry) return;
      var dh = destHash(entry.dest);
      if (!dh) { S2.receipt(entry.label, entry.note || "Unavailable in this product.", "info"); return; }
      if (UI.q.trim()) history.pushState(null, "", "#/q/" + encodeURIComponent(UI.q)); // Back restores query + results
      UI.q = "";
      location.hash = dh;
      UI.pending = entry.dest;
    });
  }

  /* ---------- locate / focus ---------- */
  function applyPending(root) {
    var p = UI.pending; UI.pending = null;
    if (!p) return;
    var target = null;
    function qattr(v) { return String(v).replace(/["\\]/g, "\\$&"); }
    var rowId = p.row || p.settingId;
    if (rowId) target = root.querySelector('[data-row="' + qattr(rowId) + '"]') || root.querySelector('[data-setting="' + qattr(rowId) + '"]');
    if (!target && p.object) target = root.querySelector('[data-object="' + qattr(p.object) + '"]');
    if (!target) return;
    setTimeout(function () {
      target.scrollIntoView({ block: "center" });
      var foc = target.querySelector("[data-ctl]") || target;
      if (foc.setAttribute) { foc.setAttribute("tabindex", "-1"); foc.focus({ preventScroll: true }); }
      target.classList.add("pm2-locate");
      setTimeout(function () { target.classList.remove("pm2-locate"); }, 1700);
    }, 40);
  }

  /* ---------- frame ---------- */
  function crumbHTML(r) {
    var parts = ['<span>Settings</span>'];
    function seg(t) { return '<span class="sep">/</span><span>' + esc(t) + "</span>"; }
    function end(t) { return '<span class="sep">/</span><b>' + esc(t) + "</b>"; }
    if (r.name === "cat") {
      if (r.parts[2]) { parts.push(seg(catTitle(r.parts[1]))); parts.push(end(subTitle(r.parts[1] + "." + r.parts[2]).sub)); }
      else parts.push('<span class="sep">/</span><b>' + esc(catTitle(r.parts[1])) + "</b>");
    } else if (r.name === "mgr") {
      var f = famById(r.parts[1]) || deferredById(r.parts[1]);
      parts.push(famDomain(f) ? seg(catTitle(famDomain(f))) : seg("Managers"));
      if (r.parts[2]) { parts.push(f ? seg(f.title) : seg(r.parts[1])); parts.push(end(r.parts[2])); }
      else parts.push(f ? '<span class="sep">/</span><b>' + esc(f.title) + "</b>" : end(r.parts[1]));
    }
    else if (r.name === "all") parts.push("<b>All Settings</b>");

    else if (r.name === "q") parts.push("<b>Search</b>");
    return '<nav class="cw-crumb" data-test="breadcrumb" aria-label="Breadcrumb">' + parts.join("") + "</nav>";
  }
  function backLabel(r) {
    if (r.name === "cat" && r.parts[2]) return "Back to " + catTitle(r.parts[1]);
    if (r.name === "cat") return "Back to Home";
    if (r.name === "mgr") return "Back to " + (famDomain(famById(r.parts[1]) || deferredById(r.parts[1])) ? catTitle(famDomain(famById(r.parts[1]) || deferredById(r.parts[1]))) : "Home");
    if (r.name === "all" || r.name === "copy" || r.name === "lifecycle") return "Back to Home";
    if (r.name === "q") return "Back to Home";
    return null;
  }
  function opsStrip() {
    var ops = Object.keys(S2.state.ops).map(function (k) { return S2.state.ops[k]; })
      .filter(function (o) { return o.state !== "completed" && o.state !== "failed" && o.state !== "cancelled"; });
    if (!ops.length) return "";
    var html = '<div class="cw-ops">';
    ops.forEach(function (o) {
      var pct = o.total ? Math.round(100 * o.completed / o.total) : null;
      html += '<div class="cw-op" data-op="' + esc(o.operation_id) + '"><span class="pm-spinner"></span><strong>' + esc(o.title) +
        '</strong><span class="why">' + esc(o.human_phase) + (o.wait_reason ? " — waiting: " + esc(o.wait_reason) : "") + "</span>" +
        '<span class="bar">' + (pct !== null ? '<i style="width:' + pct + '%"></i>' : "") + "</span>" +
        (pct !== null ? '<span class="pm-note">' + o.completed + "/" + o.total + "</span>" : "") +
        (o.can_cancel ? '<button class="pm-btn pm-btn-sm" data-opcancel="' + esc(o.operation_id) + '">Cancel</button>' : "") + "</div>";
    });
    return html + "</div>";
  }
  function navHTML(r) {
    var html = '<button class="pm-btn pm-btn-quiet pm-btn-sm cw-nav-close" data-navclose>' + ico("x", 12) + " Close</button>";

    html += navBtn("copy", "layers", "Copy Settings", r);

    html += '<div class="cw-nav-cap">Domains</div>';
    D.categories.forEach(function (c) {
      html += '<button class="cw-nav-item' + (r.name === "cat" && r.parts[1] === c.id ? " active" : "") + '" data-nav="cat:' + c.id + '">' +

  }
  function navBtn(route, icon, label, r, n) {

  /* ---------- views ---------- */
  function viewHome(r) {
    var n = S2.notices();
    var sc = S2.state.scenario;
    var html = '<div data-test="home">';
    html += '<h1 class="cw-h1">Welcome to Project Settings</h1>';
    html += '<p class="cw-sub">Search or browse to configure how Puppet Master works in this Project. Every change applies to <strong>' + esc("Orion Data Pipeline") + "</strong> only.</p>";
    if (sc === "import-conflict") html += '<div class="cw-banner">' + ico("alertTriangle", 15) + " Import needs review — 3 incoming values conflict with this Project's current settings. <button class=\"pm-btn pm-btn-sm\" data-goroute=\"#/lifecycle\" style=\"margin-left:auto\">Review conflicts</button></div>";
    else if (sc === "offline") html += '<div class="cw-banner">' + ico("alertTriangle", 15) + " Working offline — catalogs and usage show last-known values; changes still apply locally.</div>";

    return html;
  }

  /* ---------- All Settings compendium ---------- */
  var vlist = null;
  function allData() {
    var f = UI.facets;
    var rows = D.settings.slice();

    } else {

  /* ---------- render ---------- */
  function render() {
    var r = parseRoute();
    var depth = routeDepth(r);
    UI.anim = depth >= UI.depth ? "fwd" : "back";
    UI.depth = depth;
    if (r.name === "q") { UI.q = decodeURIComponent(r.parts.slice(1).join("/") || ""); }
    var back = backLabel(r);

    html += back ? '<button class="pm-btn pm-btn-quiet pm-btn-sm" data-test="back" data-back>' + ico("arrowLeft", 13) + " " + esc(back) + "</button>" : '<button class="pm-btn pm-btn-quiet pm-btn-sm" data-test="back" disabled>' + ico("arrowLeft", 13) + " Back</button>";
    html += crumbHTML(r);

    html += "</div>";
    html += '<div class="cw-body"><nav class="cw-nav' + (UI.navOpen ? " open" : "") + '" aria-label="Settings navigation">' + navHTML(r) + "</nav>";
    html += '<main class="cw-pane" data-anim="' + UI.anim + '"><div class="cw-pane-inner">';
    html += opsStrip();
    if (r.name === "cat") html += viewCat(r);
    else if (r.name === "mgr") html += viewMgr(r);
    else if (r.name === "all") html += viewAll(r);
    else if (r.name === "copy") html += viewCopy(r);
    else if (r.name === "lifecycle") html += viewLifecycle();
    else html += viewHome(r);
    html += "</div></main></div></div>";
    shell.content.innerHTML = html;
    var root = shell.content;
    bindSearch(root);
    postBind(root);
    if (r.name === "all") {
      if (!UI.allWarmed) { // loading-with-cache: skeleton first, cached content appears on warm-up
        UI.allWarmed = true;
        var sk = root.querySelector("[data-test='vlist']");
        if (sk) sk.innerHTML = M2.skeleton("Loading compendium");
        setTimeout(function () { if (parseRoute().name === "all") mountVlist(shell.content); }, 420);
      } else mountVlist(root);
    }
    root.querySelectorAll("[data-bindrows]").forEach(function (c) { M2.bindRows(c); });
    // restore scroll per route
    var pane = root.querySelector(".cw-pane");
    var saved = UI.scroll[r.raw];
    if (saved) pane.scrollTop = saved;
    pane.addEventListener("scroll", function () { UI.scroll[r.raw] = pane.scrollTop; });
    if (r.name === "q") { // Back restored the query: re-open results
      var input = root.querySelector("[data-test='search-input']");

    applyPending(root);
    UI.lastRoute = r.raw;

  /* One-time global delegation: shell.content persists across renders, so
     root-level listeners must be attached exactly once (never per render). */
  function bindGlobal() {
    var root = shell.content;
    root.addEventListener("click", function (e) {
      var t = e.target;
      function closest(sel) { return t.closest ? t.closest(sel) : null; }
      var r = parseRoute();
      var navclose = closest("[data-navclose]"); if (navclose) { UI.navOpen = false; root.querySelector(".cw-nav").classList.remove("open"); return; }
      var navopen = closest("[data-navopen]"); if (navopen) { UI.navOpen = true; root.querySelector(".cw-nav").classList.add("open"); return; }
      var facetclose = closest("[data-facetclose]"); if (facetclose) { UI.facetOpen = false; root.querySelector(".cw-facets").classList.remove("open"); return; }
      var facetopen = closest("[data-facetopen]"); if (facetopen) { UI.facetOpen = true; root.querySelector(".cw-facets").classList.add("open"); return; }
      var syn = closest("[data-synthrow]"); if (syn) { S2.receipt("Synthetic row", "Stress rows prove virtualization; they are not real settings and do not navigate.", "info"); return; }
      var back = closest("[data-back]"); if (back) { if (history.length > 1) history.back(); else location.hash = "#/home"; return; }
      var close = closest("[data-close]"); if (close) { S2.receipt("Settings closed", "Returning to the Puppet Master surface that opened Settings (simulated in this concept).", "info"); return; }
      var nav = closest("[data-nav]"); if (nav) {
        var v = nav.getAttribute("data-nav");
        UI.navOpen = false;
        if (v === "home") location.hash = "#/home";
        else if (v === "all") location.hash = "#/all";
        else if (v === "copy") location.hash = "#/copy";
        else if (v === "lifecycle") location.hash = "#/lifecycle";
        else if (v.indexOf("cat:") === 0) location.hash = "#/cat/" + v.slice(4);
        return;
      }
      var gr = closest("[data-goroute]"); if (gr) { location.hash = gr.getAttribute("data-goroute"); return; }
      var destBtn = closest("[data-dest]"); if (destBtn) {
        var d = JSON.parse(destBtn.getAttribute("data-dest"));
        if (d && d.kind) { UI.pending = d; location.hash = destHash(d); }
        return;
      }
      var facet = closest("[data-facet]"); if (facet) {
        UI.facets[facet.getAttribute("data-facet")] = facet.getAttribute("data-val");
        rerenderAll(root); return;
      }
      var synth = closest("[data-synthctl]"); if (synth) { UI.facets.synth = synth.checked; rerenderAll(root); return; }
      var expand = closest("[data-expanddiff]"); if (expand) { UI.copy.expanded = !UI.copy.expanded; render(); return; }
      var src = closest("[data-src]"); if (src) { UI.copy.source = src.getAttribute("data-src"); render(); return; }
      var cstep = closest("[data-copystep]"); if (cstep) {
        var s = +cstep.getAttribute("data-copystep");
        if (s === 2 && UI.copy.source) UI.copy.preview = C2.preview(UI.copy.source, UI.copy.cats.length ? UI.copy.cats : D.categories.map(function (c) { return c.id; }));
        UI.copy.step = s; render(); return;
      }
      var caply = closest("[data-copyapply]"); if (caply) { runCopyApply(root); return; }
      var crb = closest("[data-copyrollback]"); if (crb) { C2.rollbackLast(); UI.copy.applied = null; render(); return; }
      var rb = closest("[data-rollback]"); if (rb) { S2.rollbackTo(rb.getAttribute("data-rollback")); render(); return; }
      var exp = closest("[data-export]"); if (exp) { showExport(root); return; }
      var imp = closest("[data-import]"); if (imp) { showImport(root); return; }
      var rst = closest("[data-resetdemo]"); if (rst) { S2.resetDemo(); return; }
      var opc = closest("[data-opcancel]"); if (opc) { var op = S2.state.ops[opc.getAttribute("data-opcancel")]; if (op) S2.finishOp(op, "cancelled", "Cancelled"); render(); return; }
      var ptab = closest("[data-ptab]"); if (ptab) { location.hash = "#/mgr/providers/" + (r.parts[2] || "") + "?sec=" + ptab.getAttribute("data-ptab"); return; }
      var pact = closest("[data-pact]"); if (pact) { providerAction(pact); return; }
      var fact = closest("[data-famact]"); if (fact) { S2.createRestorePoint("Manual restore point (" + fact.getAttribute("data-fam") + ")"); S2.receipt("Restore point created", "You can roll back to it from Lifecycle.", "ok"); render(); return; }
      var oj = closest("[data-ownerjump]"); if (oj) { S2.receipt("Owner surface", "The canonical owner module opens outside Settings; the return deep-link is " + location.hash + " (simulated).", "info"); return; }
      if (UI.sOpen && !t.closest(".cw-hero-search") && !t.closest(".cw-compact-search")) closeDrop();
    });
    root.addEventListener("change", function (e) {
      var t = e.target;
      if (t.hasAttribute && t.hasAttribute("data-cat")) {
        var id = t.getAttribute("data-cat");
        if (t.checked) { if (UI.copy.cats.indexOf(id) < 0) UI.copy.cats.push(id); }
        else UI.copy.cats = UI.copy.cats.filter(function (c) { return c !== id; });
        return;
      }
      if (t.hasAttribute && t.hasAttribute("data-sort")) { UI.facets.sort = t.value; rerenderAll(root); return; }
      if (t.hasAttribute && t.hasAttribute("data-synthctl")) { UI.facets.synth = t.checked; rerenderAll(root); return; }
      if (t.hasAttribute && t.hasAttribute("data-facetq")) { UI.facets.q = t.value; rerenderAll(root); return; }
    });
  }
  function postBind(root) {
    // narrow: show filter open button only at narrow/squeezed tiers
    var fob = root.querySelector(".cw-facet-open");
    if (fob) { var tier0 = shell.app.getAttribute("data-wtier"); fob.style.display = (tier0 === "narrow" || tier0 === "squeezed") ? "" : "none"; }
    // validation error demonstration on number controls
    root.querySelectorAll("input[data-ctl='number']").forEach(function (inp) {
      if (inp.__cwBound) return; inp.__cwBound = true;
      inp.addEventListener("change", function () {
        var v = +inp.value;
        if (isNaN(v) || v < -1e6 || v > 1e6) {
          var row = inp.closest(".pm2-row");
          var er = row.querySelector(".cw-valerr");
          if (!er) { er = document.createElement("div"); er.className = "pm-set-error cw-valerr"; er.style.gridColumn = "1 / -1"; row.appendChild(er); }
          er.textContent = "Value out of range (−1,000,000 … 1,000,000). The change was not saved.";
          var st = S2.getSetting(inp.getAttribute("data-setting"));
          inp.value = st ? st.value : "";
        }
      });
    });
  }
  function rerenderAll(root) {
    var host = root.querySelector("[data-test='vlist']");
    var data = allData();
    var count = root.querySelector(".cw-all-count");
    if (count) count.innerHTML = "<strong>" + data.length + "</strong> settings" + (UI.facets.synth ? " (incl. 2000 synthetic)" : "");
    var facets = root.querySelector("[data-facets]");
    if (facets) facets.innerHTML = facetsHTML();
    if (vlist) vlist.set(data);
    else if (host) { host.innerHTML = '<div class="pm2-empty" style="margin:18px">No settings match these facets.</div>'; host.setAttribute("data-window", "0:0:0"); }
  }
  function runCopyApply(root) {
    var pv = UI.copy.preview; if (!pv) return;
    var op = S2.beginOp({ title: "Copy settings from " + srcName(pv.sourceId), phase: "Creating restore point", determinate: true, total: pv.rows.length + 2 });
    S2.advanceOp(op, { completed: 1, human_phase: "Restore point created" });
    var i = 0;
    var timer = setInterval(function () {
      i += Math.max(1, Math.round(pv.rows.length / 6));
      if (i < pv.rows.length) { S2.advanceOp(op, { completed: i + 2, human_phase: "Applying values" }); return; }
      clearInterval(timer);
      S2.advanceOp(op, { completed: pv.rows.length + 1, human_phase: "Verifying" , wait_reason: "re-reading copied values"});
      setTimeout(function () {
        var res = C2.apply(pv);
        S2.finishOp(op, "completed", "Verified");
        UI.copy.applied = res; UI.copy.step = 3;
        render();
      }, 500);
    }, 120);
  }
  function providerAction(btn) {
    var act = btn.getAttribute("data-pact"), pid = btn.getAttribute("data-pid");
    var p = null; (MD.providers || []).forEach(function (x) { if (x.id === pid) p = x; });
    if (act === "setup") {
      var op = S2.beginOp({ title: "Provider setup: " + (p ? p.name : pid), phase: "Waiting for sign-in", wait_reason: "browser sign-in window", determinate: false });
      setTimeout(function () { S2.finishOp(op, "completed", "Setup complete"); S2.receipt("Setup complete", (p ? p.name : pid) + " is connected for this Project.", "ok"); }, 900);
    } else if (act === "rotate") S2.receipt("Rotation simulated", "A new " + (p ? p.authKind || "secret" : "secret") + " reference was stored; raw value never rendered.", "ok");
    else if (act === "diag") location.hash = "#/mgr/providers/" + pid + "?sec=diagnostics";
    else if (act === "defer") S2.receipt("Update deferred", "Ask-first policy respected; you will be asked again later.", "info");
    else if (act === "update") {
      var op2 = S2.beginOp({ title: "Update " + (p ? p.name : pid), phase: "Downloading", determinate: true, total: 3 });
      setTimeout(function () { S2.advanceOp(op2, { completed: 2, human_phase: "Verifying" }); }, 400);
      setTimeout(function () {
        if (S2.state.scenario === "rollback") { S2.finishOp(op2, "failed", "Verification failed"); S2.receipt("Update rolled back", "Verification failed after updating; the previous generation was restored.", "warn"); }
        else { S2.finishOp(op2, "completed", "Installed"); S2.receipt("Update applied", "Verified after install; ask-first policy respected.", "ok"); }
        render();
      }, 900);
    } else if (act === "addinstall") {
      S2.receipt("Installation queued", "Official vendor source only, Host/Environment selected explicitly.", "ok");
    } else if (act === "runtimedemand") {
      S2.receipt("Runtime demand", "Deep link: a runtime requested this provider; returning here after repair (fixture).", "info");
    }
  }
  function showExport(root) {
    var overlay = document.createElement("div");
    overlay.className = "pm-dialog-overlay";
    var data = {};
    D.settings.slice(0, 40).forEach(function (s) { var st = S2.getSetting(s.id); data[s.id] = st ? st.value : null; });
    overlay.innerHTML = '<div class="pm-dialog pm-dialog-wide"><div class="pm-dialog-title">Export preview (first 40 of ' + D.count + ')</div>' +
      '<textarea class="pm-input" readonly rows="14" style="width:100%;font-family:var(--font-mono);font-size:11px">' + esc(JSON.stringify(data, null, 2)) + "</textarea>" +
      '<div class="pm-dialog-actions"><button class="pm-btn pm-btn-sm" data-dlgclose>Close</button></div></div>';
    document.body.appendChild(overlay);
    overlay.addEventListener("click", function (e) { if (e.target === overlay || e.target.closest("[data-dlgclose]")) overlay.remove(); });
  }
  function showImport(root) {
    var pv = C2.preview((MD.sourceProjects || [])[0] ? MD.sourceProjects[0].id : "customer-support", ["ai", "general", "safety"]);
    var conflicts = pv.rows.filter(function (r) { return r.status === "replace" || r.status === "conflict"; }).slice(0, 3);
    var overlay = document.createElement("div");
    overlay.className = "pm-dialog-overlay";
    var html = '<div class="pm-dialog pm-dialog-wide"><div class="pm-dialog-title">Import review — ' + conflicts.length + " conflicting values</div>";
    html += '<table class="pm-table"><tr><th>Setting</th><th>Current</th><th>Incoming</th><th></th></tr>';
    conflicts.forEach(function (c) {
      html += '<tr><td>' + esc(c.label) + '</td><td><code>' + esc(fmtVal(c.current)) + '</code></td><td><code>' + esc(fmtVal(c.incoming)) + "</code></td>" +
        '<td><button class="pm-btn pm-btn-sm" data-impkeep="' + esc(c.id) + '">Keep current</button> <button class="pm-btn pm-btn-sm" data-imptake="' + esc(c.id) + '">Take incoming</button></td></tr>';
    });
    html += '</table><div class="pm-dialog-actions"><button class="pm-btn pm-btn-sm" data-dlgclose>Done</button></div></div>';
    overlay.innerHTML = html;
    document.body.appendChild(overlay);
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay || e.target.closest("[data-dlgclose]")) { overlay.remove(); return; }
      var keep = e.target.closest("[data-impkeep]"); if (keep) { S2.receipt("Kept current value", keep.getAttribute("data-impkeep") + " unchanged.", "info"); keep.closest("tr").remove(); return; }
      var take = e.target.closest("[data-imptake]"); if (take) { var id = take.getAttribute("data-imptake"); var row = null; conflicts.forEach(function (c) { if (c.id === id) row = c; }); if (row) S2.setSetting(id, row.incoming); take.closest("tr").remove(); }
    });
  }

  /* ---------- global keys ---------- */
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var pop = document.querySelector(".pm-pop-menu"); if (pop) { pop.remove(); return; }
    var overlay = document.querySelector(".pm-dialog-overlay"); if (overlay) { overlay.remove(); return; }
    if (UI.sOpen) { closeDrop(); return; }
    if (UI.facetOpen) { UI.facetOpen = false; var fc = shell.content.querySelector(".cw-facets"); if (fc) fc.classList.remove("open"); return; }
    if (UI.navOpen) { UI.navOpen = false; var nv = shell.content.querySelector(".cw-nav"); if (nv) nv.classList.remove("open"); return; }
    var r = parseRoute();
    if (r.name !== "home") { if (history.length > 1) history.back(); else location.hash = "#/home"; }
  });

  // The shared scenario marks a few legacy ids absent from the current inventory;
  // mirror their intent onto real rows so the states stay visible and truthful.
  S2.subscribe(function (kind) {
    if (kind !== "scenario") return;
    var sc = S2.state.scenario;
    function mark(id, src) { var st = S2.state.settings[id]; if (st) st.source = src; }
    if (sc === "unavailable") mark("web.providers.web-search-enable", "unavailable");
    if (sc === "restart-required") mark("general.startup.window-state", "restart");
    if (sc === "changed-elsewhere") mark("general.visual.theme", "changed-elsewhere");
  });
  window.addEventListener("hashchange", render);
  bindGlobal();
  // ResizeObserver can be throttled in background tabs; mirror the shell's tier logic on a timer.
  setInterval(function () {
    var w = shell.app.clientWidth;
    var tier = w < 860 ? "squeezed" : w < 1150 ? "narrow" : w < 1600 ? "mid" : "wide";
    if (shell.app.getAttribute("data-wtier") !== tier) shell.app.setAttribute("data-wtier", tier);
  }, 250);
  render();
  S2.subscribe(function (kind) {
    if (kind === "receipt") return; // toasts handled by shell
    if (kind === "op") { // update ops strip in place when possible
      var strip = shell.content.querySelector(".cw-ops");
      if (strip) { var tmp = document.createElement("div"); tmp.innerHTML = opsStrip(); if (tmp.firstElementChild) strip.replaceWith(tmp.firstElementChild); else strip.remove(); }
      else render();
      return;
    }
    render();
  });
})();
</script>
</body>
</html>
