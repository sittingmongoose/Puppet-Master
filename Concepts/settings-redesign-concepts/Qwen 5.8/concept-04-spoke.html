<!doctype html>
<html lang="en" data-theme="glass-dark" data-reduced-motion="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spoke — Settings by Intent — Qwen 5.8</title>
<link rel="stylesheet" href="_shared/pm-shell.css">
<style>
.sp-home, .sp-work { flex: 1; min-height: 0; overflow-y: auto; }
.sp-orbit { animation: spOrbit .4s cubic-bezier(.2,.8,.2,1) both; }
@keyframes spOrbit { from { opacity: 0; transform: scale(.985) translateY(8px); } to { opacity: 1; transform: none; } }
.sp-slide-r { animation: spSlideR .32s cubic-bezier(.2,.8,.2,1) both; }
@keyframes spSlideR { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }

.sp-wrap { max-width: 1160px; margin: 0 auto; padding: 26px 28px 80px; width: 100%; }
.sp-hub { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 26px; }
.sp-hub-ring { width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; color: var(--accent); background: var(--surface); box-shadow: var(--shadow); margin-bottom: 12px; }
.sp-kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }
.sp-hub h1 { margin: 4px 0 6px; font-size: 27px; color: var(--text-1); font-weight: 750; letter-spacing: -.01em; }
.sp-hub p { margin: 0 0 16px; color: var(--text-2); font-size: 13px; max-width: 560px; }
.sp-launcher { position: relative; width: min(620px, 100%); }
.sp-launcher-field { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px; padding: 12px 18px; box-shadow: var(--shadow); }
.sp-launcher-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
.sp-launcher-field input { flex: 1; background: none; border: none; outline: none; color: var(--text-1); font-size: 14.5px; min-width: 0; }
.sp-launcher-field .pm-ico { color: var(--accent); }
.sp-launcher-drop { position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 60; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-l); box-shadow: var(--shadow); max-height: 360px; overflow-y: auto; padding: 8px; text-align: left; }
.sp-launcher-drop[hidden] { display: none; }
.sp-ld-group { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); padding: 7px 10px 3px; }
.sp-ld-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none; background: none; padding: 8px 10px; border-radius: var(--radius-m); cursor: pointer; color: var(--text-1); }
.sp-ld-item:hover, .sp-ld-item.active { background: var(--accent-soft); }
.sp-ld-item .path { color: var(--text-3); font-size: 11px; }

.sp-wings { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
.sp-wing { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l); padding: 16px; box-shadow: var(--shadow); }
.sp-wing-cap { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; color: var(--text-1); font-weight: 700; font-size: 14px; }
.sp-wing-cap .pm-ico { color: var(--accent); }
.sp-wing-cap .why { display: block; font-weight: 400; font-size: 11.5px; color: var(--text-3); }
.sp-spoke { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: var(--radius-m); padding: 10px; cursor: pointer; }
.sp-spoke { transition: background-color .16s, border-color .16s; }
.sp-spoke:hover { background: var(--surface-2); border-color: var(--border); }
.sp-spoke-ico { transition: color .16s, border-color .16s; }
.sp-spoke-ico { width: 30px; height: 30px; flex: none; border-radius: 50%; border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; color: var(--text-2); background: var(--surface-3); }
.sp-spoke:hover .sp-spoke-ico { color: var(--accent); border-color: var(--accent); }
.sp-spoke .t { color: var(--text-1); font-weight: 650; font-size: 13px; }
.sp-spoke .p { color: var(--text-3); font-size: 11.5px; }
.sp-spoke .pm-ico.chev { margin-left: auto; color: var(--text-3); flex: none; }
.sp-az { margin-top: 18px; text-align: center; }
.sp-az-list { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.sp-az-list button { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
.sp-az-list button:hover { color: var(--accent); border-color: var(--accent); }

.sp-board { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
.sp-notice { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 12px 14px; box-shadow: var(--shadow); }
.sp-notice .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.sp-notice h4 { margin: 0 0 3px; font-size: 13px; color: var(--text-1); font-weight: 650; }
.sp-notice p { margin: 0 0 9px; font-size: 12px; color: var(--text-2); }
.sp-notice-actions { display: flex; gap: 7px; flex-wrap: wrap; }

.sp-bar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg-shell); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
[data-chrome-blur="on"] .sp-bar { backdrop-filter: var(--chrome-blur); }
.sp-bar .title { font-weight: 700; color: var(--text-1); font-size: 14px; white-space: nowrap; }
.sp-bar .pm-spacer { flex: 1; }
.sp-bar .sp-search-mini { display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px; padding: 5px 12px; flex: 0 1 250px; min-width: 150px; }
.sp-bar .sp-search-mini input { flex: 1; min-width: 0; border: none; outline: none; background: none; color: var(--text-1); font-size: 12px; }
.sp-disc-seg { flex: none; }

.sp-body { display: grid; grid-template-columns: minmax(0, 1fr) 208px; gap: 0; align-items: start; }
.pm-app[data-wtier="squeezed"] .sp-body { grid-template-columns: 1fr; }
.sp-doc { padding: 22px 26px 90px; max-width: 820px; min-width: 0; }
.sp-sub { margin-bottom: 34px; scroll-margin-top: 64px; }
.sp-sub h2 { font-size: 16.5px; color: var(--text-1); margin: 0 0 3px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.sp-sub .lead { color: var(--text-3); font-size: 12px; margin: 0 0 12px; }

.sp-rail { position: sticky; top: 56px; padding: 18px 14px; display: flex; flex-direction: column; gap: 4px; }
.pm-app[data-wtier="squeezed"] .sp-rail { position: static; flex-direction: row; flex-wrap: wrap; padding: 8px 14px; }
.sp-tick { display: flex; align-items: center; gap: 8px; border: none; background: none; color: var(--text-3); font-size: 11.5px; padding: 5px 8px; cursor: pointer; border-radius: 999px; text-align: left; transition: background-color .18s, color .18s; }
.sp-tick .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); flex: none; transition: background-color .18s; }
.sp-tick:hover { color: var(--text-1); }
.sp-tick.active { color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.sp-tick.active .dot { background: var(--accent); }

.sp-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 11px 14px; margin-bottom: 8px; box-shadow: var(--shadow); }
.sp-row-top { display: flex; align-items: flex-start; gap: 12px; }
.sp-row-top > div:first-child { flex: 1; min-width: 0; }
.sp-row-label { color: var(--text-1); font-weight: 650; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sp-row-desc { color: var(--text-3); font-size: 11.5px; margin-top: 2px; }
.sp-row-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.sp-row-ctl { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.pm-app[data-wtier="squeezed"] .sp-row-ctl { align-items: flex-start; }
.sp-row-ctl .line { display: flex; align-items: center; gap: 7px; }
.sp-row-detail { display: none; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-2); }
.sp-row.open .sp-row-detail { display: block; animation: pmReveal .22s ease both; }
.sp-row[data-hidden="true"] { display: none; }

.sp-split { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
.pm-app[data-wtier="squeezed"] .sp-split { grid-template-columns: 1fr; }
.sp-inv { display: flex; flex-direction: column; gap: 6px; }
.sp-inv-cap { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin: 10px 0 2px; }
.sp-inv-item { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-m); padding: 9px 11px; cursor: pointer; color: var(--text-1); font-size: 12.5px; }
.sp-inv-item:hover { border-color: var(--border-strong); background: var(--surface-2); }
.sp-inv-item.sel { border-color: var(--accent); background: var(--accent-soft); }
.sp-inv-item .sub { display: block; color: var(--text-3); font-size: 11px; }
.sp-inspector { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l); box-shadow: var(--shadow); padding: 18px; min-height: 300px; }
.sp-inspector h3 { margin: 0 0 4px; font-size: 16px; color: var(--text-1); display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.sp-inspector .sub { color: var(--text-2); font-size: 12.5px; }
.sp-kv { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 5px 14px; font-size: 12.5px; margin: 12px 0; }
.sp-kv dt { color: var(--text-3); }
.sp-kv dd { margin: 0; color: var(--text-1); }
.sp-ins-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.sp-note-card { border: 1px dashed var(--border-strong); border-radius: var(--radius-m); padding: 12px 14px; color: var(--text-2); font-size: 12.5px; margin-bottom: 12px; background: var(--surface-3); }
.sp-model-mini { display: flex; align-items: center; gap: 9px; border: 1px solid var(--border); border-radius: var(--radius-m); padding: 8px 11px; margin-bottom: 6px; flex-wrap: wrap; background: var(--surface-3); }
.sp-model-mini .name { font-weight: 650; color: var(--text-1); }
.sp-model-mini .meta { color: var(--text-3); font-size: 11px; }
.sp-fav { background: none; border: none; color: var(--text-3); cursor: pointer; padding: 2px; display: inline-flex; }
.sp-fav.on { color: var(--warn); }
.sp-role { display: grid; grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
.pm-app[data-wtier="squeezed"] .sp-role { grid-template-columns: 1fr; }
.sp-role .req { color: var(--text-3); }
.sp-role .eff { color: var(--text-1); font-weight: 650; }
.sp-media-hist { font-size: 12px; color: var(--text-2); padding: 5px 0; border-bottom: 1px solid var(--border); }
</style>
</head>
<body data-concept-model="Qwen 5.8" data-concept="spoke">
<div id="app"></div>
<script src="_shared/concept-hub-bridge.js"></script>
<script src="_shared/pm-icons.js"></script>
<script src="_shared/pm-demo-data.js"></script>
<script src="_shared/pm-state.js"></script>
<script src="_shared/pm-settings-core.js"></script>
<script src="_shared/pm-shell.js"></script>
<script>
(function () {
  "use strict";
  var MODEL = "Qwen 5.8";
  var shell = window.PMShell.mount({ conceptName: "Spoke concept", model: MODEL });
  var content = shell.content;
  var INDEX = window.PMCore.buildSearchIndex();
  var IMPLEMENTED = { providers: true, personas: true, media: true };
  var MANAGER_HOME = { memory: "Atlas", mcp: "Atlas", crew: "Deck", terminal: "Deck", "context-sources": "Ledger", skills: "Ledger", lsp: "Deck" };
  var WINGS = [
    { id: "connect", icon: "plug", title: "Connect & provide", why: "Routes, models, and extensions that do the work.", dests: ["models", "extensions", "media"] },
    { id: "shape", icon: "wand", title: "Shape assistance", why: "How Puppet Master looks, feels, and remembers.", dests: ["general", "appearance", "context"] },
    { id: "guard", icon: "shield", title: "Guard & permit", why: "What is allowed, protected, and diagnosable.", dests: ["safety", "system"] },
    { id: "automate", icon: "target", title: "Plan & automate", why: "Goals, Crews, code, and verification policy.", dests: ["planning", "code"] }
  ];
  var spy = null;
  var selected = {};

  function dest(id) { return window.PMDemoData.destinations.filter(function (d) { return d.id === id; })[0]; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function route() {
    var v = window.PMState.state.view;
    if (spy) { spy.destroy(); spy = null; }
    if (v.name === "home") renderHome(); else renderWork(v);
  }

  function renderHome() {
    var st = window.PMState.state;
    var html = '<div class="sp-home sp-orbit" id="sp-home"><div class="sp-wrap">' +
      '<div class="sp-hub"><div class="sp-hub-ring">' + window.PMIcons.get("compass", 24) + "</div>" +
      '<div class="sp-kicker">Settings · Spoke · ' + MODEL + '</div><h1>The hub knows the way</h1>' +
      "<p>Settings grouped by what you are trying to do. Search reaches everything directly; every destination stays reachable through its wing or the A–Z index.</p>" +
      '<div class="sp-launcher"><label class="sp-launcher-field">' + window.PMIcons.get("search", 17) +
      '<input id="sp-q" placeholder="Search any setting, manager, provider, or model…" autocomplete="off" aria-label="Search settings"></label>' +
      '<div class="sp-launcher-drop" id="sp-drop" hidden></div></div></div>' +
      '<div class="sp-wings">' +
      WINGS.map(function (w) {
        return '<div class="sp-wing"><div class="sp-wing-cap">' + window.PMIcons.get(w.icon, 16) + "<span>" + esc(w.title) + '<span class="why">' + esc(w.why) + "</span></span></div>" +
          w.dests.map(function (id) {
            var d = dest(id);
            var chip = d.status.kind === "attention" ? '<span class="pm-badge pm-badge-danger">' + esc(d.status.summary) + "</span>"
              : d.status.kind === "setup" ? '<span class="pm-badge pm-badge-info">' + esc(d.status.summary) + "</span>"
              : '<span class="pm-badge pm-badge-ok">' + esc(d.status.summary) + "</span>";
            return '<button class="sp-spoke" data-dest="' + d.id + '"><span class="sp-spoke-ico">' + window.PMIcons.get(d.icon, 14) + "</span>" +
              '<span style="flex:1;min-width:0"><span class="t">' + esc(d.title) + '</span><br><span class="p">' + esc(d.purpose) + "</span></span>" +
              chip + '<span class="pm-ico chev">' + window.PMIcons.get("chevronRight", 15) + "</span></button>";
          }).join("") +
        "</div>";
      }).join("") +
      "</div>" +
      '<div class="sp-az"><button class="pm-btn pm-btn-quiet pm-btn-sm" id="sp-az-toggle">' + window.PMIcons.get("list", 13) + " All destinations A–Z</button>" +
      '<div class="sp-az-list" id="sp-az" hidden>' +
      window.PMDemoData.destinations.slice().sort(function (a, b) { return a.title.localeCompare(b.title); }).map(function (d) {
        return '<button data-dest="' + d.id + '">' + esc(d.title) + "</button>";
      }).join("") + "</div></div>" +
      '<div class="sp-board">' +
      (st.notices.length ? st.notices.map(function (n) {
        var chip = n.kind === "attention" ? '<span class="pm-badge pm-badge-danger">' + esc(n.status) + "</span>"
          : n.kind === "continue" ? '<span class="pm-badge pm-badge-info">' + esc(n.status) + "</span>"
          : '<span class="pm-badge pm-badge-ok">' + esc(n.status) + "</span>";
        return '<div class="sp-notice" data-notice="' + n.id + '"><div class="top">' + chip + "</div>" +
          "<h4>" + esc(n.headline) + "</h4><p>" + esc(n.reason) + "</p>" +
          '<div class="sp-notice-actions"><button class="pm-btn pm-btn-primary pm-btn-sm" data-na>' + esc(n.action) + "</button>" +
          (n.secondary ? '<button class="pm-btn pm-btn-quiet pm-btn-sm" data-ns>' + esc(n.secondary) + "</button>" : "") +
          "</div></div>";
      }).join("") : '<div class="sp-note-card" style="grid-column:1/-1">' + window.PMIcons.get("checkCircle", 13) + " Calm state — the board is empty. Nothing needs attention.</div>") +
      "</div>" +
    "</div></div>";
    content.innerHTML = html;
    bindHome();
  }

  function bindHome() {
    var q = document.getElementById("sp-q");
    var drop = document.getElementById("sp-drop");
    var hits = [];
    var active = -1;
    function run() {
      var v = q.value.trim();
      active = -1;
      if (!v) { drop.hidden = true; return; }
      hits = window.PMCore.search(v, INDEX);
      if (!hits.length) { drop.innerHTML = '<div class="sp-ld-group">No matches</div><div class="sp-note-card" style="margin:6px">Try “half-life”, “allowlist”, “Fast”, or a provider name.</div>'; drop.hidden = false; return; }
      var groups = {};
      hits.forEach(function (h) {
        var g = h.kind === "setting" ? "Settings" : h.kind === "manager" ? "Managers" : (h.kind === "provider" || h.kind === "model") ? "Providers & models" : h.kind === "persona" ? "Personas" : "Destinations";
        (groups[g] = groups[g] || []).push(h);
      });
      var html = "";
      Object.keys(groups).forEach(function (g) {
        html += '<div class="sp-ld-group">' + g + "</div>";
        groups[g].forEach(function (h) {
          html += '<button class="sp-ld-item" data-hit><span style="flex:1;min-width:0">' + esc(h.title) + '<br><span class="path">' + esc(h.path.join(" › ")) + "</span></span>" + window.PMIcons.get("arrowRight", 13) + "</button>";
        });
      });
      drop.innerHTML = html;
      drop.hidden = false;
      drop.querySelectorAll("[data-hit]").forEach(function (el, i) {
        el.addEventListener("mousedown", function (ev) { ev.preventDefault(); go(i); });
      });
    }
    function go(i) {
      drop.hidden = true;
      var t = Object.assign({}, hits[i].target);
      t.focusSetting = t.setting || null;
      window.PMState.navigate(t);
    }
    q.addEventListener("input", run);
    q.addEventListener("focus", run);
    q.addEventListener("blur", function () { setTimeout(function () { drop.hidden = true; }, 150); });
    q.addEventListener("keydown", function (e) {
      var items = drop.querySelectorAll("[data-hit]");
      if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(active + 1, items.length - 1); mark(items); }
      else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(active - 1, 0); mark(items); }
      else if (e.key === "Enter" && hits.length) { e.preventDefault(); go(Math.max(active, 0)); }
      else if (e.key === "Escape") drop.hidden = true;
    });
    function mark(items) { items.forEach(function (b, i) { b.classList.toggle("active", i === active); }); }

    content.querySelectorAll("[data-dest]").forEach(function (b) {
      b.addEventListener("click", function () { window.PMState.navigate({ name: "workspace", category: b.getAttribute("data-dest") }); });
    });
    document.getElementById("sp-az-toggle").addEventListener("click", function () {
      var az = document.getElementById("sp-az");
      az.hidden = !az.hidden;
    });
    content.querySelectorAll("[data-notice]").forEach(function (card) {
      var n = window.PMState.state.notices.filter(function (x) { return x.id === card.getAttribute("data-notice"); })[0];
      if (!n) return;
      var na = card.querySelector("[data-na]");
      var ns = card.querySelector("[data-ns]");
      if (na) na.addEventListener("click", function () { noticeGo(n); });
      if (ns) ns.addEventListener("click", function () { noticeGo(n, true); });
    });
  }

  function noticeGo(n, secondary) {
    if (secondary && n.id === "anthropic-usage") { window.PMState.receipt("Deep link to Usage", "Usage owns measured balances. Simulated navigation.", "info"); return; }
    if (secondary && n.id === "gemini-probe") { window.PMState.navigate({ name: "workspace", category: "models", manager: "providers", provider: "gemini-cli" }); return; }
    if (n.id === "gemini-probe") { window.PMState.navigate({ name: "workspace", category: "models", manager: "providers", provider: "gemini-cli" }); return; }
    if (n.id === "anthropic-usage") { window.PMState.navigate({ name: "workspace", category: "models", manager: "providers", provider: "anthropic" }); return; }
    if (n.id === "mcp-docs") { window.PMState.navigate({ name: "workspace", category: "extensions", subcategory: "mcp" }); return; }
    if (n.id === "continue-media") { window.PMState.navigate({ name: "workspace", category: "media", manager: "media" }); return; }
    if (n.id === "rec-persona") { window.PMState.navigate({ name: "workspace", category: "models", manager: "personas" }); return; }
    if (n.id === "rec-snapshot") { window.PMState.navigate({ name: "workspace", category: "system", subcategory: "backups", setting: "system.backups.pre-risky" }); return; }
    window.PMState.receipt(n.action, "Simulated notice action.", "sim");
  }

  function settingRow(s) {
    var meta = window.PMCore.settingMeta(s);
    var ctl = "";
    if (s.type === "toggle") ctl = '<button class="pm-toggle" role="switch" aria-pressed="' + (s.value ? "true" : "false") + '" data-ctl ' + (meta.disabled ? "disabled" : "") + "></button>";
    else if (s.type === "select") ctl = '<select class="pm-select" data-ctl ' + (meta.disabled ? "disabled" : "") + ">" + (s.options || []).map(function (o) { return "<option" + (o === s.value ? " selected" : "") + ">" + esc(o) + "</option>"; }).join("") + "</select>";
    else if (s.type === "segment") ctl = '<span class="pm-seg" data-ctl>' + (s.options || []).map(function (o) { return '<button data-seg="' + esc(o) + '" class="' + (o === s.value ? "active" : "") + '">' + esc(o) + "</button>"; }).join("") + "</span>";

        "</div>" +
        '<nav class="sp-rail" id="sp-rail" aria-label="Subcategory progress">' +
        d.subcategories.map(function (s) { return '<button class="sp-tick" data-sub="' + s.id + '"><span class="dot"></span>' + esc(s.title) + "</button>"; }).join("") +
        "</nav>" +
      "</div></div>";
    content.innerHTML = html;
    bindWork(v, d);
  }

  function bindWork(v, d) {
    var scroller = document.getElementById("sp-work");
    var doc = document.getElementById("sp-doc");
    var ticks = content.querySelectorAll(".sp-tick");
    document.getElementById("sp-back").addEventListener("click", function () { window.PMState.navigate({ name: "home" }); });

    spy = window.PMCore.scrollspy(scroller, function () {
      return d.subcategories.map(function (s) { return { id: s.id, el: doc.querySelector('[data-sub-section="' + s.id + '"]') }; });
    }, function (id) {
      ticks.forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-sub") === id); });
    }, { offset: 70 });

    ticks.forEach(function (b) { b.addEventListener("click", function () { spy.jumpTo(b.getAttribute("data-sub")); }); });

    document.getElementById("sp-disc").querySelectorAll("[data-disc]").forEach(function (b) {
      b.addEventListener("click", function () {
        window.PMState.state.ui.disclosure = b.getAttribute("data-disc");
        content.querySelectorAll("[data-setting-id]").forEach(function (row) {
          var s = window.PMState.getSetting(row.getAttribute("data-setting-id"));
          row.setAttribute("data-hidden", window.PMState.state.ui.disclosure === "standard" && s.tier !== "standard");
        });
        content.querySelectorAll("#sp-disc [data-disc]").forEach(function (x) { x.classList.toggle("active", x === b); });
        window.PMState.receipt("Exposure changed", "Showing " + b.getAttribute("data-disc") + " settings.", "info");
        if (spy) spy.refresh();
      });
    });

    document.getElementById("sp-q2").addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      var hits = window.PMCore.search(e.target.value, INDEX);
      if (!hits.length) { window.PMState.receipt("No matches", "Nothing found.", "info"); return; }
      var t = Object.assign({}, hits[0].target);
      t.focusSetting = t.setting || null;
      window.PMState.navigate(t);
    });

    doc.addEventListener("click", function (e) {
      var t;
      if ((t = e.target.closest("[data-inv]"))) {
        var id = t.getAttribute("data-inv");
        var mgr = currentManager(v);
        selected[mgr] = id;
        var insp = document.getElementById("sp-insp");
        if (insp) {
          insp.innerHTML = mgr === "providers" ? providerInspector() : mgr === "personas" ? personaInspector() : mediaInspector();
          insp.classList.remove("sp-slide-r");
          void insp.offsetWidth;
          insp.classList.add("sp-slide-r");
        }
        doc.querySelectorAll("[data-inv]").forEach(function (b) { b.classList.toggle("sel", b.getAttribute("data-inv") === id); });
        return;
      }
      var row = e.target.closest("[data-setting-id]");
      var btn = e.target.closest("button, select");
      if (row && btn) {
        var id2 = row.getAttribute("data-setting-id");
        var s = window.PMState.getSetting(id2);
        if (btn.matches("[data-ctl].pm-toggle")) { window.PMState.setSettingValue(id2, !(s.value === true)); patchRow(id2); return; }
        if (btn.matches("[data-seg]")) { window.PMState.setSettingValue(id2, btn.getAttribute("data-seg")); patchRow(id2); return; }
        if (btn.matches("[data-reset]")) { window.PMState.resetSetting(id2); patchRow(id2); return; }
        if (btn.matches("[data-details]")) { row.classList.toggle("open"); btn.setAttribute("aria-expanded", row.classList.contains("open")); return; }
        if (btn.matches("[data-ctl]") && btn.tagName === "BUTTON") {
          if (s.id === "models.providers.refresh") { window.PMState.refreshCatalog("models-dev"); return; }
          window.PMState.receipt(s.actionLabel || "Opened", s.label + ": honest simulated result.", "sim");
          return;
        }
      }
      mgrClick(e, v);
    });
    doc.addEventListener("change", function (e) {
      var row = e.target.closest("[data-setting-id]");
      if (row && e.target.matches("[data-ctl]")) {
        var id = row.getAttribute("data-setting-id");
        window.PMState.setSettingValue(id, e.target.value);
        patchRow(id);
      }
      if (e.target.matches("[data-continuation]")) window.PMState.receipt("Continuation saved", "Anthropic Max: " + e.target.value + " — future requests only.", "ok");
    });

    function currentManager(view) {
      if (view.manager && IMPLEMENTED[view.manager]) return view.manager;
      for (var i = 0; i < d.subcategories.length; i++) {
        var m = d.subcategories[i].manager;
        if (m && IMPLEMENTED[m]) return m;
      }
      return "providers";
    }

    function mgrClick(e, view) {
      var t;
      if ((t = e.target.closest("[data-catalog-refresh]"))) { window.PMState.refreshCatalog(t.getAttribute("data-catalog-refresh")); return; }
      var insp = e.target.closest("#sp-insp");
      var mgr = currentManager(view);
      if (mgr === "providers") {
        var pid = selected.providers;
        var acctEl = e.target.closest("[data-account]");
        var aid = acctEl ? acctEl.getAttribute("data-account") : null;
        if ((t = e.target.closest("[data-use-account]"))) { window.PMState.setPreferredAccount(pid, t.getAttribute("data-use-account")); refreshSplit(view); return; }
        if (aid && (t = e.target.closest("[data-nickname]"))) {
          var acc = window.PMState.accountById(pid, aid);
          var nn = prompt("Nickname for " + acc.label + ":", acc.nickname || "");
          if (nn !== null) { window.PMState.setAccountNickname(pid, aid, nn.trim()); refreshSplit(view); }
          return;
        }
        if (aid && (t = e.target.closest("[data-sticky]"))) { var a1 = window.PMState.accountById(pid, aid); window.PMState.setAccountSticky(pid, aid, !a1.sticky); refreshSplit(view); return; }
        if (aid && (t = e.target.closest("[data-enable]"))) { var a2 = window.PMState.accountById(pid, aid); window.PMState.setAccountEnabled(pid, aid, a2.enabled === false); refreshSplit(view); return; }
        if (aid && (t = e.target.closest("[data-acc-up]"))) { window.PMState.moveAccountPriority(pid, aid, -1); refreshSplit(view); return; }
        if (aid && (t = e.target.closest("[data-acc-down]"))) { window.PMState.moveAccountPriority(pid, aid, 1); refreshSplit(view); return; }
        if ((t = e.target.closest("[data-pa]"))) {
          var act = t.getAttribute("data-pa");
          if (act === "setup") { window.PMState.receipt("Setup opened", "Mistral setup runs in the underlying provider. Simulated.", "sim"); return; }
          window.PMState.providerAction(pid, act); return;
        }
        if ((t = e.target.closest("[data-open-usage]"))) { window.PMState.receipt("Deep link to Usage", "Usage owns measured state. Simulated navigation.", "info"); return; }
        var ml = e.target.closest("[data-model]");
        if (ml) {
          var mid = ml.getAttribute("data-model");
          if ((t = e.target.closest("[data-fav]"))) { window.PMState.toggleFavorite(pid, mid); refreshSplit(view); return; }
          if ((t = e.target.closest("[data-up]"))) { window.PMState.movePriority(pid, mid, -1); refreshSplit(view); return; }
          if ((t = e.target.closest("[data-down]"))) { window.PMState.movePriority(pid, mid, 1); refreshSplit(view); return; }
          if ((t = e.target.closest("[data-alias]"))) {
            var p = window.PMState.providerById(pid);
            var m = p.models.filter(function (x) { return x.id === mid; })[0];
            var next = prompt("Alias for " + m.name + ":", m.alias || "");
            if (next !== null) { window.PMState.setAlias(pid, mid, next.trim()); refreshSplit(view); }
            return;
          }
          if ((t = e.target.closest("[data-hide]"))) { window.PMState.toggleHidden(pid, mid); refreshSplit(view); return; }
          if ((t = e.target.closest("[data-effort]"))) { t.parentNode.querySelectorAll("[data-effort]").forEach(function (x) { x.classList.toggle("active", x === t); }); window.PMState.receipt("Effort preference saved", "Applies when supported.", "ok"); return; }
          if ((t = e.target.closest("[data-speed]"))) { t.parentNode.querySelectorAll("[data-speed]").forEach(function (x) { x.classList.toggle("active", x === t); }); window.PMState.receipt("Speed preference saved", t.getAttribute("data-speed") + " requested when genuinely supported.", "ok"); return; }
        }
      }
      if (mgr === "personas" && (t = e.target.closest("[data-persona-apply]"))) {
        var scopeSel = doc.querySelector("[data-persona-scope]");
        var persona = window.PMState.state.personas.filter(function (x) { return x.id === selected.personas; })[0];
        if (scopeSel && persona) {
          window.PMState.receipt("Persona scope applied", persona.name + " → " + scopeSel.value + ". Other threads are unchanged.", "ok");
        }
        return;
      }
      if (mgr === "media" && (t = e.target.closest("[data-media-act]"))) {
        var mp = window.PMState.state.mediaProviders.filter(function (x) { return x.id === selected.media; })[0];
        var a = t.getAttribute("data-media-act");
        if (a === "setup") window.PMState.receipt("Configure route", mp.name + ": route picker opened. Simulated.", "sim");
        if (a === "test") window.PMState.receipt("Test generated", mp.name + " produced a test asset with an honest simulated receipt.", "sim");
        if (a === "history") window.PMState.receipt("Generation history", mp.history + " runs recorded. Viewer simulated.", "sim");
        return;
      }
    }

    function patchRow(id) {
      var s = window.PMState.getSetting(id);
      var el = content.querySelector('[data-setting-id="' + id + '"]');
      if (!el) return;
      var tmp = document.createElement("div");
      tmp.innerHTML = settingRow(s);
      var fresh = tmp.firstChild;
      fresh.classList.toggle("open", el.classList.contains("open"));
      el.replaceWith(fresh);
    }
    function refreshSplit(view) {
      var mgr = currentManager(view);
      var subId = null;
      d.subcategories.forEach(function (s) { if (s.manager === mgr) subId = s.id; });
      var section = content.querySelector('[data-sub-section="' + subId + '"]');
      if (!section) return;
      var h2 = section.querySelector("h2");
      var lead = section.querySelector(".lead");
      var rows = section.querySelectorAll(":scope > .sp-row");
      section.innerHTML = "";
      section.appendChild(h2);
      section.appendChild(lead);
      var tmp = document.createElement("div");
      tmp.innerHTML = mgr === "providers" ? providersSplit(view) : mgr === "personas" ? personasSplit(view) : mediaSplit();
      while (tmp.firstChild) section.appendChild(tmp.firstChild);
      rows.forEach(function (r) { section.appendChild(r); });
      if (spy) spy.refresh();
    }
    window._spokePatch = { patchRow: patchRow, refreshSplit: refreshSplit };

    if (v.subcategory) spy.jumpTo(v.subcategory, function () { focusV(v); });
    else if (v.manager) {
      var subForMgr = null;
      d.subcategories.forEach(function (s) { if (s.manager === v.manager) subForMgr = s.id; });
      if (subForMgr) { spy.jumpTo(subForMgr, function () { focusV(v); }); return; }
      focusV(v);
    } else { scroller.scrollTop = 0; focusV(v); }
  }

  function focusV(v) {
    if (v.focusSetting) {
      var el = content.querySelector('[data-setting-id="' + v.focusSetting + '"]');
      if (el) { el.scrollIntoView({ block: "center", behavior: window.PMCore.reducedMotion() ? "auto" : "smooth" }); window.PMCore.focusFlash(el); }
    } else if (v.provider) {
      selected.providers = v.provider;
      var insp = document.getElementById("sp-insp");
      if (insp) { insp.innerHTML = providerInspector(); window.PMCore.focusFlash(insp); }
    } else if (v.persona) {
      selected.personas = v.persona;
      var insp2 = document.getElementById("sp-insp");
      if (insp2) { insp2.innerHTML = personaInspector(); window.PMCore.focusFlash(insp2); }
    }
  }

  window.PMState.subscribe(function (kind) {
    if (kind === "navigate") { route(); return; }
    if (kind === "scenario") { route(); return; }
    if (kind === "catalog" && window.PMState.state.view.name === "workspace" && window.PMState.state.view.category === "models" && window._spokePatch) {
      window._spokePatch.refreshSplit(window.PMState.state.view);
    }
  });

  route();
})();
</script>
</body>
</html>
