<!doctype html>
<html lang="en" data-theme="friendly-dark" data-reduced-motion="0" data-concept-id="concept-04-spoke">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spoke — Settings by Intent — Qwen 5.8</title>
<link rel="stylesheet" href="_shared/pm-shell.css">
<style>
/* ---------- Spoke: orbital depth ---------- */
.sp-home, .sp-work { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.sp-rise { animation: spRise .42s cubic-bezier(.2,.8,.2,1) both; }
@keyframes spRise { from { opacity: 0; transform: translateY(16px) scale(.986); } to { opacity: 1; transform: none; } }
.sp-rise-late { animation: spRise .42s cubic-bezier(.2,.8,.2,1) both; animation-delay: .07s; }
.sp-wing { animation: spRise .4s cubic-bezier(.2,.8,.2,1) both; }
.sp-wing:nth-child(2) { animation-delay: .05s; }
.sp-wing:nth-child(3) { animation-delay: .1s; }
.sp-wing:nth-child(4) { animation-delay: .15s; }
[data-reduced-motion="1"] .sp-rise, [data-reduced-motion="1"] .sp-rise-late, [data-reduced-motion="1"] .sp-wing,
[data-reduced-motion="1"] .sp-detail-doc, [data-reduced-motion="1"] .sp-launcher-pop, [data-reduced-motion="1"] .sp-master {
  animation: none;
}

/* ---------- Home ---------- */
.sp-home-scroll { flex: 1; min-height: 0; overflow-y: auto; }
.sp-wrap { max-width: 1180px; margin: 0 auto; padding: 28px 28px 90px; width: 100%; box-sizing: border-box; }
.sp-hub { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 26px; }
.sp-hub-ring { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; color: var(--accent); background: var(--surface); box-shadow: var(--shadow); margin-bottom: 12px; }
.sp-kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }
.sp-hub h1 { margin: 4px 0 6px; font-size: 27px; color: var(--text-1); font-weight: 750; letter-spacing: -.01em; }
.sp-hub p { margin: 0; color: var(--text-2); font-size: 13px; max-width: 600px; }

.sp-launcher { position: relative; width: min(640px, 100%); margin-top: 18px; }
.sp-launcher-field { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px; padding: 12px 18px; box-shadow: var(--shadow); }
.sp-launcher-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
.sp-launcher-field input { flex: 1; background: none; border: none; outline: none; color: var(--text-1); font-size: 14.5px; min-width: 0; }
.sp-launcher-field .pm-ico { color: var(--accent); flex: none; }
.sp-launcher-hint { color: var(--text-3); font-size: 11px; margin-top: 7px; }
.sp-launcher-drop { position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 60; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-l); box-shadow: var(--shadow); max-height: 360px; overflow-y: auto; padding: 8px; text-align: left; }
.sp-launcher-drop[hidden] { display: none; }
.sp-ld-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none; background: none; padding: 8px 10px; border-radius: var(--radius-m); cursor: pointer; color: var(--text-1); }
.sp-ld-item:hover, .sp-ld-item.active { background: var(--accent-soft); }
.sp-ld-item .t { font-weight: 650; font-size: 13px; }
.sp-ld-item .path { color: var(--text-3); font-size: 11px; flex: 1; min-width: 0; }
.pm-search-type { flex: none; font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--border-strong); color: var(--text-2); border-radius: 999px; padding: 2px 8px; }
.pm-search-type[data-rt="action"] { color: var(--accent); border-color: var(--accent); }
.pm-search-type[data-rt="status"] { color: var(--info); border-color: var(--info); }
.pm-search-type[data-rt="diagnostic"] { color: var(--warn); border-color: var(--warn); }
.pm-search-type[data-rt="setup"] { color: var(--ok); border-color: var(--ok); }
.pm-search-type[data-rt="unavailable"] { color: var(--err); border-color: var(--err); }
.pm-search-type[data-rt="manager"] { color: var(--managed); border-color: var(--managed); }
.sp-ld-empty { color: var(--text-3); font-size: 12px; padding: 10px; }

.sp-wings { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; margin-top: 30px; }
.sp-wing { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l); padding: 16px; box-shadow: var(--shadow); }
.sp-wing-cap { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; color: var(--text-1); font-weight: 700; font-size: 14px; }
.sp-wing-cap .pm-ico { color: var(--accent); }
.sp-wing-cap .why { display: block; font-weight: 400; font-size: 11.5px; color: var(--text-3); }
.sp-spoke { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: var(--radius-m); padding: 10px; cursor: pointer; transition: background-color .16s, border-color .16s; }
.sp-spoke:hover { background: var(--surface-2); border-color: var(--border); }
.sp-spoke-ico { width: 30px; height: 30px; flex: none; border-radius: 50%; border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; color: var(--text-2); background: var(--surface-3); transition: color .16s, border-color .16s; }
.sp-spoke:hover .sp-spoke-ico { color: var(--accent); border-color: var(--accent); }
.sp-spoke .body { flex: 1; min-width: 0; }
.sp-spoke .t { color: var(--text-1); font-weight: 650; font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sp-spoke .p { color: var(--text-3); font-size: 11.5px; margin-top: 2px; }
.sp-spoke .open { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; flex: none; }
.sp-health-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.sp-health-dot.ok { background: var(--ok); } .sp-health-dot.warn { background: var(--warn); }
.sp-health-dot.attention { background: var(--err); } .sp-health-dot.info { background: var(--info); }

.sp-az { margin-top: 22px; }
.sp-az-toggle { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: 7px 16px; cursor: pointer; font-size: 12px; display: block; margin: 0 auto; }
.sp-az-toggle:hover { color: var(--accent); border-color: var(--accent); }
.sp-az-list { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 5px; }
.sp-az-list[hidden] { display: none; }
.sp-az-item { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-1); border-radius: var(--radius-m); padding: 7px 10px; cursor: pointer; font-size: 12px; text-align: left; }
.sp-az-item:hover { border-color: var(--accent); }
.sp-az-item .where { color: var(--text-3); font-size: 10.5px; display: block; }

.sp-notices { margin-top: 30px; display: grid; gap: 14px; }
.sp-notice-group-cap { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
.sp-notice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
.sp-notice { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 12px 14px; box-shadow: var(--shadow); }
.sp-notice .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.sp-notice h4 { margin: 0 0 3px; font-size: 13px; color: var(--text-1); font-weight: 650; }
.sp-notice p { margin: 0 0 9px; font-size: 12px; color: var(--text-2); }
.sp-notice-actions { display: flex; gap: 7px; flex-wrap: wrap; }

.sp-recents { margin-top: 28px; }
.sp-recents-cap { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
.sp-recent { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-m); padding: 8px 12px; cursor: pointer; color: var(--text-1); font-size: 12.5px; margin-bottom: 6px; }
.sp-recent:hover { border-color: var(--accent); }
.sp-recent .where { color: var(--text-3); font-size: 11px; flex: 1; }
.sp-recent .when { color: var(--text-3); font-size: 11px; }

/* ---------- Workspace ---------- */
.sp-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg-shell); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.sp-bar .title { font-weight: 700; color: var(--text-1); font-size: 14px; white-space: nowrap; }
.sp-bar .pm-spacer { flex: 1; }
.sp-master-toggle { display: none; }
.pm-app[data-wtier="narrow"] .sp-master-toggle, .pm-app[data-wtier="squeezed"] .sp-master-toggle { display: inline-flex; }

.sp-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr) 46px; grid-template-rows: minmax(0, 1fr); }
.pm-app[data-wtier="narrow"] .sp-body { grid-template-columns: minmax(0, 1fr) 46px; }
.pm-app[data-wtier="squeezed"] .sp-body { grid-template-columns: minmax(0, 1fr); }

.sp-master { border-right: 1px solid var(--border); overflow-y: auto; min-height: 0; padding: 12px 10px 40px; background: var(--bg); }
.pm-app[data-wtier="narrow"] .sp-master, .pm-app[data-wtier="squeezed"] .sp-master {
  position: absolute; z-index: 55; top: 0; bottom: 0; left: 0; width: 260px; max-width: 86vw;
  box-shadow: var(--shadow); transform: translateX(-104%); transition: transform .22s ease; pointer-events: none;
}
.pm-app[data-wtier="narrow"] .sp-master.drawer-open, .pm-app[data-wtier="squeezed"] .sp-master.drawer-open {
  transform: none; pointer-events: auto;
}
[data-reduced-motion="1"] .sp-master { transition: none; }
.sp-work { position: relative; }
.sp-master-cap { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); padding: 8px 10px 4px; }
.sp-master-item { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; border: 1px solid transparent; background: none; color: var(--text-2); border-radius: var(--radius-m); padding: 8px 10px; cursor: pointer; font-size: 12.5px; }
.sp-master-item:hover { background: var(--surface-2); color: var(--text-1); }
.sp-master-item.active { background: var(--accent-soft); border-color: var(--accent); color: var(--text-1); font-weight: 650; }
.sp-master-sub { display: block; width: calc(100% - 18px); margin-left: 18px; text-align: left; border: none; background: none; color: var(--text-3); padding: 5px 10px; cursor: pointer; font-size: 11.5px; border-radius: var(--radius-s); }
.sp-master-sub:hover { color: var(--text-1); background: var(--surface-2); }
.sp-master-sub.active { color: var(--accent); font-weight: 700; }

.sp-detail { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.sp-detail-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 26px 90px; }
.sp-detail-doc { max-width: 860px; }
.sp-doc-head { margin-bottom: 18px; }
.sp-doc-head h1 { margin: 0 0 4px; font-size: 21px; color: var(--text-1); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sp-doc-head p { margin: 0; color: var(--text-2); font-size: 12.5px; }
.sp-sub { margin-bottom: 34px; scroll-margin-top: 12px; }
.sp-sub h2 { font-size: 16.5px; color: var(--text-1); margin: 0 0 3px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.sp-sub .lead { color: var(--text-3); font-size: 12px; margin: 0 0 12px; }

.sp-rail { border-left: 1px solid var(--border); padding: 20px 6px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.pm-app[data-wtier="squeezed"] .sp-rail { display: none; }
.sp-tick { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
.sp-tick .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); transition: background-color .18s, transform .18s; }
.sp-tick:hover { border-color: var(--accent); }
.sp-tick.active { border-color: var(--accent); background: var(--accent-soft); }
.sp-tick.active .dot { background: var(--accent); transform: scale(1.25); }
[data-reduced-motion="1"] .sp-tick .dot { transition: none; }

/* Demonstrated manager material */
.sp-mgr { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l); box-shadow: var(--shadow); margin-bottom: 14px; }
.sp-mgr .pm-mgr-head { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.sp-mgr .pm-mgr-body { padding: 14px 16px; }
.sp-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.sp-stat-card { border: 1px solid var(--border); background: var(--surface-3); border-radius: var(--radius-m); padding: 12px 14px; }
.sp-stat-card .k { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.sp-stat-card .v { font-size: 14px; color: var(--text-1); font-weight: 650; margin-top: 3px; }
.sp-stat-card .n { font-size: 11.5px; color: var(--text-2); margin-top: 3px; }
.sp-run-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid var(--border); background: var(--surface-3); border-radius: var(--radius-m); padding: 10px 13px; margin-bottom: 8px; }
.sp-run-row .kind { font-weight: 650; color: var(--text-1); font-size: 13px; min-width: 190px; }
.sp-run-row .meta { color: var(--text-3); font-size: 11.5px; flex: 1; min-width: 180px; }
.sp-run-row .ctl { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.sp-kind-chip { font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; border-radius: 999px; padding: 2px 8px; border: 1px solid var(--border-strong); color: var(--text-3); }
.sp-kind-chip.act { color: var(--accent); border-color: var(--accent); }
.sp-kind-chip.sched { color: var(--info); border-color: var(--info); }
.sp-kind-chip.stat { color: var(--text-3); }
.sp-hist-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.sp-table-row { display: grid; grid-template-columns: minmax(140px, 1.2fr) minmax(120px, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--border); background: var(--surface-3); border-radius: var(--radius-m); padding: 9px 13px; margin-bottom: 7px; }
.sp-table-row .main { min-width: 0; }
.sp-table-row .main b { color: var(--text-1); font-size: 12.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sp-table-row .main .sub { color: var(--text-3); font-size: 11px; }
.sp-table-row .mid { color: var(--text-2); font-size: 11.5px; min-width: 0; }
.sp-table-row .ctl { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pm-app[data-wtier="squeezed"] .sp-table-row { grid-template-columns: 1fr; }
.pm-app[data-wtier="squeezed"] .sp-table-row .ctl { justify-content: flex-start; }
.sp-expand { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface-3); margin-bottom: 8px; }
.sp-expand-head { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; padding: 10px 13px; cursor: pointer; color: var(--text-1); font-size: 13px; font-weight: 650; flex-wrap: wrap; }
.sp-expand-head .pm-ico { color: var(--text-3); }
.sp-expand-body { padding: 4px 13px 12px; display: none; }
.sp-expand.open .sp-expand-body { display: block; }
.sp-expand-body li { color: var(--text-2); font-size: 12px; margin: 3px 0; }
.sp-longlabel { display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--border); background: var(--surface-3); border-radius: var(--radius-m); padding: 11px 14px; margin-bottom: 8px; }
.sp-longlabel .lbl { flex: 1; min-width: 0; color: var(--text-1); font-size: 13px; font-weight: 600; }
.sp-longlabel .d { color: var(--text-3); font-size: 11.5px; font-weight: 400; margin-top: 2px; }
.sp-progress { height: 6px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); max-width: 260px; }
.sp-progress > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .3s ease; }
[data-reduced-motion="1"] .sp-progress > i { transition: none; }

/* Manager-level master-detail split: resource list left, inspector right */
.sp-mgr-split { display: grid; grid-template-columns: minmax(200px, 320px) minmax(0, 1fr); gap: 14px; align-items: start; }
.pm-app[data-wtier="squeezed"] .sp-mgr-split { grid-template-columns: 1fr; }
.sp-mgr-split .sp-md-master { display: flex; flex-direction: column; gap: 6px; }
.sp-md-item { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface-3); border-radius: var(--radius-m); padding: 9px 11px; cursor: pointer; color: var(--text-1); font-size: 12.5px; transition: border-color .16s, background-color .16s; }
.sp-md-item:hover { border-color: var(--border-strong); background: var(--surface-2); }
.sp-md-item.sel { border-color: var(--accent); background: var(--accent-soft); }
.sp-md-item .sub { display: block; color: var(--text-3); font-size: 11px; margin-top: 1px; }
[data-reduced-motion="1"] .sp-md-item { transition: none; }
.sp-md-detail { background: var(--surface-3); border: 1px solid var(--border); border-radius: var(--radius-l); padding: 14px 16px; min-height: 120px; }
.sp-md-detail h4 { margin: 0 0 8px; font-size: 14px; color: var(--text-1); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sp-group-cap { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin: 16px 0 8px; }
.pm-provider-card, .pm-install { margin-bottom: 12px; }
</style>

<body>
<div id="app" data-concept-model="Qwen 5.8"></div>
<script src="_shared/pm-icons.js"></script>
<script src="_shared/pm-demo-data.js"></script>
<script src="_shared/pm-data-extra.js"></script>
<script src="_shared/pm-state.js"></script>
<script src="_shared/pm-settings-core.js"></script>

<script src="_shared/concept-hub-bridge.js"></script>
<script>
(function () {
  "use strict";
  var D = window.PMDemoData;
  var M = window.PMManagers;
  var esc = M.esc;
  var ico = function (n, s) { return window.PMIcons.get(n, s || 14); };

  PMState.init("concept-04-spoke");
  PMManagers.setPrefix("sp-");
  var shell = window.PMShell.mount({ conceptName: "Spoke", model: "Qwen 5.8" });
  var content = shell.content;
  var searchIndex = window.PMCore.buildSearchIndex();
  var spy = null;
  var currentView = { name: "home" };

  var WINGS = [
    { icon: "target", title: "Shape how it behaves", why: "Defaults, behavior, safety, and what enters each request.", dests: ["general", "behavior", "permissions", "context"] },
    { icon: "robot", title: "Connect providers & models", why: "Providers, accounts, models, and the extensions they power.", dests: ["models", "extensions"] },
    { icon: "sun", title: "Look & feel", why: "Theme, motion, and where work reaches you.", dests: ["appearance", "notifications"] },
    { icon: "activity", title: "Keep the system healthy", why: "Storage, backups, history, and the machines underneath.", dests: ["system"] }
  ];

  function destById(id) { for (var i = 0; i < D.destinations.length; i++) if (D.destinations[i].id === id) return D.destinations[i]; return null; }
  function healthDot(kind) { return '<span class="sp-health-dot ' + esc(kind || "ok") + '"></span>'; }

  // ---------- Launcher search (works over any view) ----------
  function resultItemHtml(e, idx) {
    return '<button class="sp-ld-item' + (idx === 0 ? " active" : "") + '" data-ld-idx="' + idx + '">' +
      '<span class="t">' + esc(e.title) + '</span>' +
      '<span class="path">' + esc(e.path.join(" › ")) + (e.unavailableReason ? " — " + esc(e.unavailableReason) : "") + '</span>' +
      '<span class="pm-search-type" data-rt="' + esc(e.resultType) + '">' + esc(e.resultType) + "</span>" +
    "</button>";
  }
  function runSearch(input, drop) {
    var q = input.value.trim();
    if (!q) { drop.hidden = true; drop.innerHTML = ""; drop._results = []; return; }
    var results = window.PMCore.search(q, searchIndex);
    drop._results = results;
    drop.innerHTML = results.length
      ? results.map(function (e, i) { return resultItemHtml(e, i); }).join("")
      : '<div class="sp-ld-empty">Nothing matched. Try a broader term — spelling mistakes are tolerated.</div>';
    drop.hidden = false;
  }
  function activateResult(e) {
    if (!e) return;
    var view = { name: "workspace", category: e.target.category };
    if (e.target.subcategory) view.subcategory = e.target.subcategory;
    if (e.target.manager) view.manager = e.target.manager;
    if (e.target.provider) view.provider = e.target.provider;
    if (e.target.setting) view.setting = e.target.setting;
    window.PMState.navigate(view);
  }
  function wireLauncher(input, drop, onActivate) {
    input.addEventListener("input", function () { runSearch(input, drop); });
    input.addEventListener("focus", function () { if (input.value.trim()) runSearch(input, drop); });
    input.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") {
        ev.preventDefault();
        var results = drop._results || [];
        var active = drop.querySelector(".sp-ld-item.active") || drop.querySelector(".sp-ld-item");
        var idx = active ? parseInt(active.getAttribute("data-ld-idx"), 10) : 0;
        if (results[idx]) { activateResult(results[idx]); input.value = ""; drop.hidden = true; if (onActivate) onActivate(); }
      } else if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        ev.preventDefault();
        var items = Array.prototype.slice.call(drop.querySelectorAll(".sp-ld-item"));
        if (!items.length) return;
        var cur = items.findIndex(function (x) { return x.classList.contains("active"); });
        var next = ev.key === "ArrowDown" ? (cur + 1) % items.length : (cur - 1 + items.length) % items.length;
        items.forEach(function (x, i) { x.classList.toggle("active", i === next); });
      } else if (ev.key === "Escape") { drop.hidden = true; }
    });
    drop.addEventListener("click", function (ev) {
      var item = ev.target.closest ? ev.target.closest(".sp-ld-item") : null;
      if (!item) return;
      var results = drop._results || [];
      activateResult(results[parseInt(item.getAttribute("data-ld-idx"), 10)]);
      input.value = ""; drop.hidden = true;
      if (onActivate) onActivate();
    });
  }

  // ---------- Workspace document ----------
  function managerFor(sub, container) {
    var demonstrated = ["storage", "backup", "history", "artifacts", "source-control", "containers", "web", "search-index"];
    if (sub.manager === "storage") container.innerHTML = mgStorage();
    else if (sub.manager === "backup") container.innerHTML = mgBackup();
    else if (sub.manager === "history") container.innerHTML = mgHistory();
    else if (sub.manager === "artifacts") container.innerHTML = mgArtifacts();
    else if (sub.manager === "source-control") container.innerHTML = mgSourceControl();
    else if (sub.manager === "containers") container.innerHTML = mgContainers();
    else if (sub.manager === "web") container.innerHTML = mgWeb();
    else if (sub.manager === "search-index") container.innerHTML = mgSearchIndex();
    else container.innerHTML = mgShared(sub.manager);
  }

  function renderWorkspace(view) {
    var dest = destById(view.category) || D.destinations[0];
    var subs = dest.subcategories;

    var masterItems = D.destinations.map(function (d) {
      var active = d.id === dest.id;
      var subList = active ? d.subcategories.map(function (s) {
        return '<button class="sp-master-sub' + (view.subcategory === s.id ? " active" : "") + '" data-sp-sub="' + esc(d.id) + "/" + esc(s.id) + '">' + esc(s.title) + "</button>";
      }).join("") : "";
      return '<button class="sp-master-item' + (active ? " active" : "") + '" data-sp-dest="' + esc(d.id) + '">' + ico(d.icon, 14) + esc(d.title) + "</button>" + subList;
    }).join("");

    var sections = subs.map(function (sub) {
      var rows = sub.settings.map(function (s) { return M.settingRow(PMState.getSetting(s.id) || s); }).join("");
      var mgr = "";
      if (sub.manager) {
        mgr = '<div class="sp-mgr-slot" data-mgr-slot="' + esc(sub.manager) + '"></div>';
      }
      var extra = "";
      if (sub.id === "settings-lifecycle") extra = '<div class="sp-mgr-slot" data-mgr-slot="lifecycle"></div>';
      if (sub.id === "cleanup") extra = '<div class="sp-mgr-slot" data-mgr-slot="cleanup"></div>';
      if (sub.id === "server-shell") extra = '<div class="sp-mgr-slot" data-mgr-slot="server-shell"></div>';
      return '<section class="sp-sub" id="sp-sub-' + esc(sub.id) + '" data-sub="' + esc(sub.id) + '">' +
        "<h2>" + esc(sub.title) + (sub.manager ? M.badge("Manager", "info") : "") + "</h2>" +
        '<p class="lead">' + esc(sub.settings.length) + " setting" + (sub.settings.length === 1 ? "" : "s") + (sub.manager ? " · " + esc(window.PMCore.managerTitle(sub.manager)) : "") + "</p>" +
        rows + mgr + extra +
      "</section>";
    }).join("");

    var ticks = subs.map(function (sub, i) {
      return '<button class="sp-tick' + (i === 0 ? " active" : "") + '" data-sp-tick="' + esc(sub.id) + '" aria-label="Jump to ' + esc(sub.title) + '" title="' + esc(sub.title) + '"><span class="dot"></span></button>';
    }).join("");

    content.innerHTML =
      '<div class="sp-work">' +
        '<div class="sp-bar">' +
          '<button class="pm-btn pm-btn-quiet pm-btn-sm" data-sp-home>' + ico("grid", 13) + " Home</button>" +
          '<button class="pm-btn pm-btn-quiet pm-btn-sm sp-master-toggle" data-sp-master-toggle>' + ico("sliders", 13) + " Browse</button>" +
          '<span class="title">' + esc(dest.title) + "</span>" +
          '<span class="pm-badge pm-badge-muted">' + dest.status.summary + "</span>" +
          '<span class="pm-spacer"></span>' +
          '<button class="pm-btn pm-btn-sm" data-sp-launch>' + ico("search", 13) + " Search</button>" +
        "</div>" +
        '<div class="sp-body">' +
          '<nav class="sp-master" aria-label="Settings destinations"><div class="sp-master-cap">Destinations</div>' + masterItems + "</nav>" +
          '<div class="sp-detail"><div class="sp-detail-scroll" data-sp-scroller>' +
            '<div class="sp-detail-doc sp-rise">' +
              '<div class="sp-doc-head"><h1>' + ico(dest.icon, 18) + esc(dest.title) + "</h1><p>" + esc(dest.purpose) + "</p></div>" +
              sections +
            "</div>" +
          "</div></div>" +
          '<nav class="sp-rail" aria-label="Subcategory progress">' + ticks + "</nav>" +
        "</div>" +
      "</div>";

    // Lazy-hydrate manager slots.
    content.querySelectorAll("[data-mgr-slot]").forEach(function (slot) {
      var id = slot.getAttribute("data-mgr-slot");
      window.PMCore.hydrateManager(slot, function (container) {
        if (id === "lifecycle") container.innerHTML = mgLifecycle();
        else if (id === "cleanup") container.innerHTML = mgCleanup();
        else if (id === "server-shell") container.innerHTML = mgServerShell();
        else {
          var sub = null;
          subs.forEach(function (s) { if (s.manager === id) sub = s; });
          if (sub) managerFor(sub, container);
          else container.innerHTML = mgShared(id);
        }
      });
    });

    // Scrollspy drives the tick rail.
    var scroller = content.querySelector("[data-sp-scroller]");
    if (spy) spy.destroy();
    spy = window.PMCore.scrollspy(scroller, function () {
      return subs.map(function (s) { return { id: s.id, el: content.querySelector('[data-sub="' + s.id + '"]') }; });
    }, function (activeId) {
      content.querySelectorAll(".sp-tick").forEach(function (t) {
        t.classList.toggle("active", t.getAttribute("data-sp-tick") === activeId);
      });
      content.querySelectorAll(".sp-master-sub").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-sp-sub") === dest.id + "/" + activeId);
      });
    }, { offset: 60 });

    if (view.subcategory) {
      setTimeout(function () { spy.jumpTo(view.subcategory); }, 40);
    }
    applyDeepFocus(view);
  }

  function applyDeepFocus(view) {
    if (view.setting) {
      setTimeout(function () {
        var row = content.querySelector('[data-setting-row="' + view.setting + '"]');
        if (row) { row.scrollIntoView({ block: "center" }); window.PMCore.focusFlash(row); }
      }, 60);
    } else if (view.provider) {
      setTimeout(function () {
        var card = content.querySelector('[data-provider-card="' + view.provider + '"]');
        if (!card) return;
        // A provider deep link answers "what's going on with this provider" —
        // surface the Installation & Updates pane so update/repair controls are visible.
        var tab = card.querySelector('[data-ptab="install"]');
        if (tab) tab.click();
        card.scrollIntoView({ block: "start" }); window.PMCore.focusFlash(card);
      }, 900);
    } else if (view.manager) {
      setTimeout(function () {
        var mgr = content.querySelector('[data-manager="' + view.manager + '"]');
        if (mgr) { mgr.scrollIntoView({ block: "start" }); window.PMCore.focusFlash(mgr); }
      }, 900);
    }
  }

  // ---------- Router render ----------
  function render(view) {
    currentView = view || { name: "home" };
    if (currentView.name === "home") renderHome();
    else renderWorkspace(currentView);
  }

  PMState.subscribe(function (kind, payload) {
    if (kind === "navigate") { render(payload); return; }
    if (currentView.name !== "workspace") {
      if (currentView.name === "home" && (kind === "notices" || kind === "catalog" || kind === "scenario")) renderHome();
      return;
    }
    var slotFor = {
      backupRuns: "backup", notificationDestinations: "notifications", soundLibrary: "sounds", soundPacks: "sounds",
      permissionRules: "permissions", formatterTable: "formatters", commandsCatalog: "commands", shortcutBindings: "commands",
      storageHealth: "storage", historyRows: "history", artifactRows: "artifacts", searchIndexCfg: "search-index"
    };
    if (kind === "collections" && payload && payload.name) {
      var slotId = slotFor[payload.name];
      if (slotId) refreshSlot(slotId, payload.name === "searchIndexCfg");
      return;
    }
    if (kind === "providers" || kind === "catalog") {
      refreshSlot("providers");
      return;
    }
    if (kind === "lifecycle") {
      refreshSlot("backup"); refreshSlot("lifecycle"); refreshSlot("cleanup");
      return;
    }
    if (kind === "notices" || kind === "scenario") { render(currentView); }
  });

  function refreshSlot(id, keepFocus) {
    var slot = content.querySelector('[data-mgr-slot="' + id + '"]');
    if (!slot || slot.querySelector("[data-skeleton]")) return;
    var focused = keepFocus && document.activeElement && document.activeElement.closest('[data-mgr-slot="' + id + '"]');
    if (id === "lifecycle") slot.innerHTML = mgLifecycle();
    else if (id === "cleanup") slot.innerHTML = mgCleanup();
    else if (id === "server-shell") slot.innerHTML = mgServerShell();
    else if (id === "providers") slot.innerHTML = mgProviders();
    else {
      var dest = destById(currentView.category);
      var sub = null;
      if (dest) dest.subcategories.forEach(function (s) { if (s.manager === id) sub = s; });
      if (sub) managerFor(sub, slot);
      else slot.innerHTML = mgShared(id);
    }
    if (focused && document.activeElement) try { document.activeElement.focus(); } catch (e) {}
  }

  // ---------- Concept-local delegated interactions ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-sp-open],[data-sp-dest],[data-sp-sub],[data-sp-home],[data-sp-launch],[data-sp-master-toggle],[data-sp-tick],[data-sp-az-toggle],[data-az],[data-sp-recent],[data-sp-notice],[data-sp-expand],[data-sp-md],[data-sp-hist],[data-sp-art],[data-sp-mem],[data-sp-persona],[data-sp-crew],[data-sp-term],[data-sp-lsp],[data-sp-mcp],[data-sp-skill],[data-sp-plugin],[data-sp-sc],[data-sp-web],[data-sp-toggle]") : null;
    if (!t) return;
    var ST = window.PMState;

    if (t.hasAttribute("data-sp-md")) {
      var fam = t.getAttribute("data-sp-md");
      var id2 = t.getAttribute("data-id");
      if (fam === "backup") selBackup = id2;
      else if (fam === "history") selHist = id2;
      else if (fam === "artifacts") selArt = id2;
      refreshSlot(fam === "backup" ? "backup" : fam);
      return;
    }

    if (t.hasAttribute("data-sp-open")) { ST.navigate({ name: "workspace", category: t.getAttribute("data-sp-open") }); return; }
    if (t.hasAttribute("data-sp-dest")) { ST.navigate({ name: "workspace", category: t.getAttribute("data-sp-dest") }); return; }
    if (t.hasAttribute("data-sp-sub")) {
      var parts = t.getAttribute("data-sp-sub").split("/");
      ST.navigate({ name: "workspace", category: parts[0], subcategory: parts[1] });
      return;
    }
    if (t.hasAttribute("data-sp-home")) { ST.navigate({ name: "home" }); return; }
    if (t.hasAttribute("data-sp-launch")) { openLauncherOverlay(); return; }
    if (t.hasAttribute("data-sp-master-toggle")) {
      var master = content.querySelector(".sp-master");
      if (master) master.classList.toggle("drawer-open");
      return;
    }
    if (t.hasAttribute("data-sp-tick")) {
      var subId = t.getAttribute("data-sp-tick");
      if (spy) spy.jumpTo(subId);
      var dest = destById(currentView.category);
      var want = { name: "workspace", category: currentView.category, subcategory: subId };
      var wantHash = window.PMCore.viewToHash(want);
      if (wantHash !== window.location.hash) ST.navigate(want);
      return;
    }
    if (t.hasAttribute("data-sp-az-toggle")) {
      var list = content.querySelector(".sp-az-list");
      var open = list.hidden;
      list.hidden = !open;
      t.setAttribute("aria-expanded", String(open));
      t.textContent = open ? "Hide the A–Z index" : "Or browse everything A–Z";
      return;
    }
    if (t.hasAttribute("data-az")) {
      var idx = parseInt(t.getAttribute("data-az"), 10);
      ST.navigate(azIndex()[idx].target);
      return;
    }
    if (t.hasAttribute("data-sp-recent")) {
      var r = null;
      ST.state.recents.forEach(function (x) { if (x.id === t.getAttribute("data-sp-recent")) r = x; });
      if (r) {
        var v = { name: "workspace", category: r.target.category };
        if (r.target.subcategory) v.subcategory = r.target.subcategory;
        if (r.target.manager) v.manager = r.target.manager;
        if (r.target.provider) v.provider = r.target.provider;
        if (r.target.setting) v.setting = r.target.setting;
        ST.navigate(v);
      }
      return;
    }
    if (t.hasAttribute("data-sp-notice")) {
      var n = null;
      ST.state.notices.forEach(function (x) { if (x.id === t.getAttribute("data-sp-notice")) n = x; });
      if (!n) return;
      if (t.getAttribute("data-sp-notice-role") === "secondary" && n.secondary) {
        ST.navigate({ name: "workspace", category: n.target.category, subcategory: n.target.subcategory, manager: n.target.manager, provider: n.target.provider });
        return;
      }
      if (n.id === "rec-backup" && t.getAttribute("data-sp-notice-role") === "primary") { ST.backupNow("bk-settings"); return; }
      var nv = { name: "workspace", category: n.target.category };
      if (n.target.subcategory) nv.subcategory = n.target.subcategory;
      if (n.target.manager) nv.manager = n.target.manager;
      if (n.target.provider) nv.provider = n.target.provider;
      if (n.target.setting) nv.setting = n.target.setting;
      ST.navigate(nv);
      return;
    }
    if (t.hasAttribute("data-sp-expand")) { t.closest(".sp-expand").classList.toggle("open"); return; }
    if (t.hasAttribute("data-sp-toggle")) {
      var on = t.getAttribute("aria-pressed") !== "true";
      t.setAttribute("aria-pressed", String(on));
      ST.receipt(on ? "Restore points on" : "Restore points off", on ? "A restore point will be created before risky or bulk configuration changes." : "Risky changes will no longer create automatic restore points.", "ok");
      return;
    }
    if (t.hasAttribute("data-sp-hist")) {
      var act = t.getAttribute("data-sp-hist");
      var row = null;
      ST.state.collections.historyRows.forEach(function (h) { if (h.id === t.getAttribute("data-id")) row = h; });
      if (!row) return;
      if (act === "delete" && !row.deletable) { ST.receipt("Deletion blocked", row.title + " is under legal hold.", "blocked"); return; }
      var msg = { compare: ["Compare prepared", row.title + " lined up against the previous version. Simulated."],
                  export: ["History exported", row.title + " written to a portable transcript with redactions applied. Simulated."],
                  archive: ["Archived", row.title + " moved out of active history; it stays addressable. Simulated."],
                  delete: ["Deleted", row.title + " removed. A receipt records the deletion. Simulated."] }[act];
      ST.receipt(msg[0], msg[1], act === "delete" ? "info" : "ok");
      return;
    }
    if (t.hasAttribute("data-sp-art")) {
      var aact = t.getAttribute("data-sp-art");
      var art = null;
      ST.state.collections.artifactRows.forEach(function (a) { if (a.id === t.getAttribute("data-id")) art = a; });
      if (!art) return;
      if (aact === "reveal") ST.receipt("Revealed", art.name + " — its containing folder would open. Simulated.", "info");
      if (aact === "redact") { art.redacted = !art.redacted; ST.receipt(art.redacted ? "Redacted" : "Unredacted", art.name + (art.redacted ? " — likely secrets scrubbed from the stored copy." : " — original content restored for review."), "ok"); refreshSlot("artifacts"); }
      if (aact === "cleanup") ST.receipt("Cleanup asked first", art.name + " would be confirmed before removal; retention policy is disclosed. Simulated.", "info");
      return;
    }
    if (t.hasAttribute("data-sp-mem")) {
      var mem = null;
      ST.state.memory.forEach(function (m) { if (m.id === t.getAttribute("data-id")) mem = m; });
      if (!mem) return;
      if (t.getAttribute("data-sp-mem") === "pin") mem.pinned = !mem.pinned;
      else mem.state = "verified";
      ST.receipt(t.getAttribute("data-sp-mem") === "pin" ? (mem.pinned ? "Pinned" : "Unpinned") : "Memory verified", mem.text.slice(0, 60), "ok");
      refreshSlot("memory");
      return;
    }
    if (t.hasAttribute("data-sp-persona")) {
      var pe = null;
      ST.state.personas.forEach(function (p) { if (p.id === t.getAttribute("data-sp-persona")) pe = p; });
      if (pe) M.modal(pe.name + " — capsule preview", '<div class="pm-note">' + esc(pe.description) + "</div>" + M.inspector([["Capsule", pe.capsule], ["Provenance", pe.provenance], ["Eligible", pe.eligible], ["Scope", pe.scope]]), [{ label: "Close" }]);
      return;
    }
    if (t.hasAttribute("data-sp-crew")) {
      var cr = null;
      ST.state.crewTemplates.forEach(function (c) { if (c.id === t.getAttribute("data-sp-crew")) cr = c; });
      if (cr) M.modal(cr.name + " — members", M.inspector(cr.members.map(function (m) { return [m.role, m.route + " · persona " + m.persona]; })) + '<div class="pm-note">Requested ' + cr.requested + " / effective " + cr.effective + " · waves: " + esc(cr.waves) + "</div>", [{ label: "Close" }]);
      return;
    }
    if (t.hasAttribute("data-sp-term")) {
      var tp = null;
      ST.state.terminalProfiles.forEach(function (p) { if (p.id === t.getAttribute("data-sp-term")) tp = p; });
      if (tp) {
        var sw = tp.palette.map(function (c) { return '<span class="pm-theme-swatch" style="background:' + esc(c) + '"></span>'; }).join("");
        M.modal(tp.name + " — palette", '<div class="pm-theme-chips" style="display:flex;gap:6px;flex-wrap:wrap">' + sw + "</div>" + M.inspector([["Shell", tp.shell], ["Cursor", tp.cursor], ["Copy on select", tp.copyOnSelect ? "Yes" : "No"], ["Retention", tp.retention]]), [{ label: "Close" }]);
      }
      return;
    }
    if (t.hasAttribute("data-sp-lsp")) {
      ST.receipt("LSP restart queued", "The language server restarts without losing editor state. Simulated.", "info");
      return;
    }
    if (t.hasAttribute("data-sp-mcp")) {
      var srv = null;
      ST.state.mcpServers.forEach(function (s) { if (s.id === t.getAttribute("data-sp-mcp")) srv = s; });
      if (srv) M.modal(srv.name + " — logs", srv.logs.length ? srv.logs.map(function (l) { return '<div class="pm-log">' + esc(l) + "</div>"; }).join("") : '<div class="pm-empty">No log lines yet.</div>', [{ label: "Close" }]);
      return;
    }
    if (t.hasAttribute("data-sp-skill")) {
      var sk = null;
      ST.state.skills.forEach(function (s) { if (s.id === t.getAttribute("data-sp-skill")) sk = s; });
      if (sk) { sk.enabled = !sk.enabled; ST.receipt(sk.enabled ? "Skill enabled" : "Skill disabled", sk.name + (sk.enabled ? " is available for selection." : " is installed but not offered."), "ok"); refreshSlot("skills"); }
      return;
    }
    if (t.hasAttribute("data-sp-plugin")) {
      var pl = null;
      ST.state.plugins.forEach(function (p) { if (p.id === t.getAttribute("data-sp-plugin")) pl = p; });
      if (pl) { pl.enabled = !pl.enabled; ST.receipt(pl.enabled ? "Plugin enabled" : "Plugin disabled", pl.name + ". Simulated.", "ok"); refreshSlot("plugins"); }
      return;
    }
    if (t.hasAttribute("data-sp-sc")) {
      M.modal("Run " + D.ghActions.currentRun.id + " — logs", D.ghActions.currentRun.jobs.map(function (j) { return '<div class="pm-log">' + esc(j.name) + ": " + esc(j.conclusion) + " (" + esc(j.duration) + ")</div>"; }).join(""), [{ label: "Close" }]);
      return;
    }
    if (t.hasAttribute("data-sp-web")) {
      ST.receipt("Readiness check", D.webSearchCfg.readiness + ". Simulated.", "info");
      return;
    }
  });

  document.addEventListener("change", function (e) {
    var f = e.target.closest ? e.target.closest("[data-sp-hist-filter]") : null;
    if (f) {
      histFilters[f.getAttribute("data-sp-hist-filter")] = e.target.value;
      refreshSlot("history");
    }
  });

  // ---------- Boot ----------
  var initial = window.PMCore.startRouter();
  render(initial);
  window.__conceptReady = true;
})();
</script>
</body>
</html>
