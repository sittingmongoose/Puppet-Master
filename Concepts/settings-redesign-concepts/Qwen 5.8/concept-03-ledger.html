<!doctype html>
<html lang="en" data-theme="friendly-dark" data-reduced-motion="0" data-concept-id="concept-03-ledger">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger — One Annotated Document — Qwen 5.8</title>
<link rel="stylesheet" href="_shared/pm-shell.css">
<style>
/* Ledger: ink-and-paper minimalism. One annotated document per destination. */
.lg-home { flex: 1; min-height: 0; overflow-y: auto; }
.lg-work { flex: 1; min-height: 0; overflow-y: auto; position: relative; }

.lg-page { max-width: 880px; margin: 0 auto; padding: 30px 30px 110px; width: 100%; }

/* Cover page */
.lg-cover { text-align: center; padding: 8px 0 26px; }
.lg-cover-rule { display: flex; align-items: center; gap: 14px; color: var(--text-3); font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; }
.lg-cover-rule::before, .lg-cover-rule::after { content: ""; height: 1px; flex: 1; background: var(--border-strong); }
.lg-cover h1 { font-size: 40px; font-weight: 750; letter-spacing: .02em; color: var(--text-1); margin: 18px 0 6px; }
.lg-cover .lg-sub { color: var(--text-2); font-size: 13.5px; font-style: italic; }
.lg-cover .lg-sub small { display: block; margin-top: 6px; font-style: normal; font-size: 11.5px; color: var(--text-3); letter-spacing: .08em; }

/* Index lookup */
.lg-index { margin: 26px auto 4px; max-width: 620px; text-align: left; }
.lg-index-label { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
.lg-searchline { display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--border-strong); padding: 8px 2px; }
.lg-searchline:focus-within { border-bottom-color: var(--accent); }
.lg-searchline .pm-ico { color: var(--text-3); align-self: center; }
.lg-searchline input { flex: 1; border: none; outline: none; background: none; font-size: 17px; color: var(--text-1); min-width: 0; }
.lg-searchline .lg-search-count { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); white-space: nowrap; }
.lg-searchline.mini { padding: 3px 2px; border-bottom-width: 1px; }
.lg-searchline.mini input { font-size: 12.5px; }
.lg-hits { margin: 6px 0 0; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); }
.lg-hits[hidden] { display: none; }
.lg-hit { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--border); padding: 9px 12px; cursor: pointer; color: var(--text-1); flex-wrap: wrap; }
.lg-hit:last-child { border-bottom: none; }
.lg-hit:hover, .lg-hit.active, .lg-hit:focus-visible { background: var(--accent-soft); outline: none; }
.lg-hit .t { font-weight: 650; font-size: 13px; }
.lg-hit .p { color: var(--text-3); font-size: 11.5px; flex: 1; min-width: 0; }
.lg-hit .pm-search-type { flex: none; }
.lg-hits-float { position: absolute; z-index: 60; top: 52px; right: 20px; width: min(420px, 90%); margin: 0; box-shadow: var(--shadow); }

/* Contents list */
.lg-toc { margin-top: 30px; }
.lg-toc-cap { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 2px solid var(--border-strong); padding-bottom: 6px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); }
.lg-toc-cap .lg-count { font-family: var(--font-mono); letter-spacing: 0; }
.lg-toc-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 14px; align-items: baseline; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--border); padding: 12px 2px; cursor: pointer; color: inherit; }
.lg-toc-row:hover, .lg-toc-row:focus-visible { background: var(--surface-2); outline: none; }
.lg-toc-row .no { font-family: var(--font-mono); color: var(--text-3); font-size: 12px; }
.lg-toc-row .t { color: var(--text-1); font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lg-toc-row .p { color: var(--text-2); font-size: 12px; display: block; margin-top: 2px; }
.lg-toc-row .health { display: flex; align-items: baseline; gap: 6px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.lg-toc-row .open { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }

/* Marginalia: two columns of margin notes */
.lg-marginalia { margin-top: 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
.pm-app[data-wtier="squeezed"] .lg-marginalia { grid-template-columns: 1fr; }
.lg-marg h3 { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); margin: 0 0 8px; font-weight: 650; display: flex; gap: 8px; align-items: baseline; }
.lg-note-item { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 10px 12px; margin-bottom: 8px; }
.lg-note-item .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lg-note-item h4 { margin: 6px 0 3px; font-size: 13px; color: var(--text-1); font-weight: 650; }
.lg-note-item p { margin: 0 0 8px; font-size: 12px; color: var(--text-2); }
.lg-note-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Recently consulted pages */
.lg-recent { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--border); padding: 9px 2px; cursor: pointer; color: var(--text-2); font-size: 12.5px; }
.lg-recent:hover, .lg-recent:focus-visible { color: var(--text-1); background: var(--surface-2); outline: none; }
.lg-recent .ref { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
.lg-recent .when { margin-left: auto; color: var(--text-3); font-size: 11px; white-space: nowrap; }
.lg-cover-foot { margin-top: 40px; text-align: center; color: var(--text-3); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }

/* Catalogs strip on the cover */
.lg-catalogs { margin-top: 34px; }
.lg-catalog-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 9px 12px; margin-bottom: 6px; color: var(--text-1); font-size: 12.5px; }
.lg-catalog-row b { font-weight: 650; }
.lg-catalog-row .lg-cat-meta { color: var(--text-3); font-size: 11.5px; flex: 1; min-width: 120px; }

/* Workspace head */
.lg-workhead { position: sticky; top: 0; z-index: 25; background: var(--bg-shell); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
[data-chrome-blur="on"] .lg-workhead { backdrop-filter: var(--chrome-blur); }
.lg-workhead .doc-title { font-weight: 700; color: var(--text-1); font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.lg-workhead .doc-no { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); font-weight: 400; }
.lg-workhead .pm-spacer { flex: 1; }
.lg-workhead .lg-searchline.mini { flex: 0 1 240px; min-width: 170px; }
.lg-drawer-btn { display: none; }
.pm-app[data-wtier="squeezed"] .lg-drawer-btn, .pm-app[data-wtier="narrow"] .lg-drawer-btn { display: inline-flex; }
.lg-drawer-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

/* Document columns: body + margin outline */
.lg-cols { display: grid; grid-template-columns: minmax(0, 1fr) 196px; gap: 34px; max-width: 1120px; margin: 0 auto; padding: 26px 30px 0; align-items: start; }
.lg-docbody { min-width: 0; padding-bottom: 120px; }
.lg-outline { position: sticky; top: 64px; padding: 6px 0 20px; }
.lg-outline-cap { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
.lg-outline-track { position: relative; display: flex; flex-direction: column; }
.lg-ol-ink { position: absolute; left: -10px; width: 3px; border-radius: 2px; background: var(--accent); transition: top .3s cubic-bezier(.2,.8,.2,1), height .3s cubic-bezier(.2,.8,.2,1); }
.pm-app[data-wtier="squeezed"] .lg-ol-ink, .pm-app[data-wtier="narrow"] .lg-ol-ink { display: none; }
.lg-ol-item { border: none; background: none; text-align: left; color: var(--text-3); font-size: 12px; padding: 6px 4px; cursor: pointer; border-radius: var(--radius-s); transition: color .18s; }
.lg-ol-item:hover { color: var(--text-1); }
.lg-ol-item.active { color: var(--accent); font-weight: 700; }
.lg-ol-item .no { font-family: var(--font-mono); font-size: 10px; margin-right: 6px; }

/* Drawer tiers: outline becomes a slide-in drawer */
.pm-app[data-wtier="squeezed"] .lg-cols, .pm-app[data-wtier="narrow"] .lg-cols { grid-template-columns: 1fr; }
.pm-app[data-wtier="squeezed"] .lg-outline, .pm-app[data-wtier="narrow"] .lg-outline {
  position: fixed; top: 0; bottom: 0; right: 0; z-index: 95; width: 276px;
  transform: translateX(106%); transition: transform .25s cubic-bezier(.2,.8,.2,1), visibility 0s .25s;
  background: var(--surface); border-left: 1px solid var(--border-strong); box-shadow: var(--shadow);
  padding: 16px; overflow-y: auto; visibility: hidden;
}
.pm-app[data-wtier="squeezed"] .lg-outline[data-drawer="open"], .pm-app[data-wtier="narrow"] .lg-outline[data-drawer="open"] {
  transform: translateX(0); visibility: visible; transition: transform .25s cubic-bezier(.2,.8,.2,1);
}
[data-reduced-motion="1"] .lg-outline { transition: none; }
.lg-outline-close { display: none; width: 100%; margin-bottom: 8px; justify-content: flex-end; }
.pm-app[data-wtier="squeezed"] .lg-outline-close, .pm-app[data-wtier="narrow"] .lg-outline-close { display: inline-flex; }
.lg-scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 55%, transparent); z-index: 94; }

/* Document sections */
.lg-doc-open { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 2px solid var(--border-strong); padding-bottom: 8px; margin-bottom: 22px; flex-wrap: wrap; }
.lg-doc-open h1 { margin: 0; font-size: 26px; font-weight: 750; color: var(--text-1); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.lg-doc-open .no { font-family: var(--font-mono); font-size: 14px; color: var(--text-3); font-weight: 400; }
.lg-doc-open .lg-doc-purpose { color: var(--text-2); font-size: 12.5px; max-width: 560px; }
.lg-sub { margin-bottom: 44px; scroll-margin-top: 64px; }
.lg-sub-h { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--border-strong); padding-bottom: 6px; margin-bottom: 10px; }
.lg-sub-h .no { font-family: var(--font-mono); color: var(--text-3); font-size: 12px; }
.lg-sub-h h2 { margin: 0; font-size: 19px; color: var(--text-1); font-weight: 700; }
.lg-sub-h .cnt { margin-left: auto; color: var(--text-3); font-size: 11px; white-space: nowrap; }

/* Ink-spread reveal (opacity fade only — no height animation) */
.lg-sub.lg-inked { animation: lgInk .5s ease backwards; }
@keyframes lgInk { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
[data-reduced-motion="1"] .lg-sub.lg-inked { animation: none; }
.lg-home.lg-fade, .lg-work.lg-fade { animation: lgFade .28s ease backwards; }
@keyframes lgFade { from { opacity: 0; } to { opacity: 1; } }
[data-reduced-motion="1"] .lg-home.lg-fade, [data-reduced-motion="1"] .lg-work.lg-fade { animation: none; }

/* Appendix / appx blocks */
.lg-appx { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 14px 16px; margin: 12px 0; }
.lg-appx-cap { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
.lg-group-cap { margin: 20px 0 6px; padding-bottom: 4px; border-bottom: 1px dashed var(--border-strong); font-size: 10.5px; text-transform: uppercase; letter-spacing: .11em; color: var(--text-3); }

/* Shared-grammar manager blocks in document context */
.lg-docbody .pm-mgr { background: var(--surface); border: 1px solid var(--border); }
.lg-docbody .pm-reslist { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); }
.lg-docbody .pm-resitem { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lg-docbody .pm-resitem:last-child { border-bottom: none; }
.lg-docbody .pm-resitem-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--text-1); font-size: 12.5px; }
.lg-docbody .pm-resitem-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* Ledger tables */
.lg-table-wrap { overflow-x: auto; margin-top: 8px; }
.lg-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.lg-table th { text-align: left; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 600; border-bottom: 1px solid var(--border-strong); padding: 6px 8px 6px 0; white-space: nowrap; }
.lg-table td { border-bottom: 1px solid var(--border); padding: 8px 8px 8px 0; color: var(--text-1); vertical-align: top; }
.lg-table .sub { color: var(--text-3); font-size: 11px; display: block; margin-top: 1px; }
.lg-table code { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-2); word-break: break-word; }

/* Terminal palette chips + live preview strip */
.lg-term-palettes { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 10px; }
.lg-pal-chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border-strong); border-radius: var(--radius-m); background: var(--surface); padding: 6px 10px; cursor: pointer; color: var(--text-2); font-size: 12px; }
.lg-pal-chip:hover { border-color: var(--accent); color: var(--text-1); }
.lg-pal-chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.lg-pal-sw { display: inline-flex; gap: 2px; }
.lg-pal-sw i { width: 9px; height: 14px; border-radius: 2px; display: inline-block; }
.lg-term-preview { border-radius: var(--radius-m); padding: 12px 14px; font-family: var(--font-mono); font-size: 12.5px; margin: 6px 0 12px; border: 1px solid var(--border); }
.lg-term-preview .tp-bar { display: flex; gap: 5px; margin-bottom: 8px; }
.lg-term-preview .tp-bar i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.lg-term-preview .tp-line { padding: 1px 0; word-break: break-word; }
.lg-term-preview .tp-cursor { display: inline-block; width: 7px; height: 12px; vertical-align: -2px; margin-left: 2px; }
.lg-term-preview .tp-meta { margin-top: 8px; font-size: 10.5px; font-family: var(--font-ui); }
.lg-term-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.pm-app[data-wtier="squeezed"] .lg-term-cols { grid-template-columns: 1fr; }

/* Testing matrix */
.lg-matrix { border: 1px solid var(--border); border-radius: var(--radius-m); overflow-x: auto; background: var(--surface); }
.lg-matrix table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 560px; }
.lg-matrix th { text-align: left; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border-strong); white-space: nowrap; }
.lg-matrix th.lg-col-scope { text-align: center; }
.lg-matrix td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text-1); vertical-align: middle; }
.lg-matrix tr:last-child td { border-bottom: none; }
.lg-matrix td.lg-cell { text-align: center; }
.lg-matrix .pm-seg { white-space: nowrap; }

/* MCP log lines */
.lg-logline { font-family: var(--font-mono); font-size: 11px; color: var(--text-2); padding: 2px 0; }

/* Narrow forms: never clip */
.pm-app[data-wtier="squeezed"] .lg-searchline.mini { min-width: 140px; }
.pm-app[data-wtier="squeezed"] .lg-toc-row { grid-template-columns: 24px minmax(0, 1fr); }
.pm-app[data-wtier="squeezed"] .lg-toc-row .health { grid-column: 2; }
.pm-app[data-wtier="squeezed"] .lg-doc-open h1 { font-size: 21px; }
</style>

<body>
<div id="app" data-concept-model="Qwen 5.8"></div>
<script src="_shared/pm-icons.js"></script>
<script src="_shared/pm-demo-data.js"></script>
<script src="_shared/pm-data-extra.js"></script>
<script src="_shared/pm-state.js"></script>
<script src="_shared/pm-settings-core.js"></script>
<script src="_shared/pm-managers.js"></script>
<script src="_shared/pm-shell.js"></script>
<script src="_shared/concept-hub-bridge.js"></script>
<script>
(function () {
  "use strict";

  var D = window.PMDemoData;
  var ST = window.PMState;
  var C = window.PMCore;
  var M = window.PMManagers;
  var esc = M.esc;
  var ico = function (n, s) { return window.PMIcons.get(n, s || 14); };

  var SEARCH = C.buildSearchIndex();
  var GROUP_ORDER = ["attention", "continue", "recommended"];
  var GROUP_LABEL = { attention: "Needs attention", continue: "Continue setup", recommended: "Recommended" };
  var GROUP_KIND = { attention: "warn", continue: "info", recommended: "ok" };

  PMState.init("concept-03-ledger");
  PMManagers.setPrefix("lg-");
  var shell = window.PMShell.mount({ conceptName: "Ledger", model: "Qwen 5.8" });
  var content = shell.content;

  // --- Small helpers ---------------------------------------------------------
  function destById(id) {
    for (var i = 0; i < D.destinations.length; i++) if (D.destinations[i].id === id) return D.destinations[i];
    return null;
  }
  function chapterOf(destId) {
    for (var i = 0; i < D.destinations.length; i++) if (D.destinations[i].id === destId) return i + 1;
    return 0;
  }
  function statusBadge(dest) {
    var s = dest.status || {};
    var kind = s.kind === "ok" ? "ok" : "warn";
    return M.badge(s.summary || "Healthy", kind);
  }
  function targetView(t) {
    var v = { name: "workspace", category: t.category };
    if (t.subcategory) v.subcategory = t.subcategory;
    if (t.manager) v.manager = t.manager;
    if (t.provider) v.provider = t.provider;
    if (t.model) v.model = t.model;
    if (t.setting) v.setting = t.setting;
    return v;
  }

  // Concept-local UI state (not persisted).
  var ui = { spy: null, inkObs: null, activeSub: null, termProfile: null, drawerOpen: false };

  function destroyWorkspaceBindings() {
    if (ui.spy) { ui.spy.destroy(); ui.spy = null; }
    if (ui.inkObs) { try { ui.inkObs.disconnect(); } catch (e) {} ui.inkObs = null; }
    closeDrawer();
  }

  // --- Search -----------------------------------------------------------------
  function resultChip(rt) {
    return '<span class="pm-search-type" data-rt="' + esc(rt) + '">' + esc(rt) + "</span>";
  }
  function hitsHtml(entries, limit) {
    if (!entries.length) return '<div class="pm-empty" style="border:none">No entry matches that spelling. The index tolerates small typos.</div>';
    return entries.slice(0, limit || 12).map(function (e, i) {
      return '<button class="lg-hit" role="option" data-hit="' + i + '" aria-selected="false">' +
        resultChip(e.resultType) +
        '<span class="t">' + esc(e.title) + "</span>" +
        '<span class="p">' + esc(e.path.join(" › ")) + "</span>" +
      "</button>";
    }).join("");
  }
  function bindSearch(box, hits, entries, opts) {
    var o = opts || {};
    var input = box.querySelector("input");
    var count = box.querySelector(".lg-search-count");
    var cur = -1;

    function run() {
      var q = input.value.trim();
      if (!q) {
        if (count) count.textContent = "";
        hits.hidden = true;
        cur = -1;
        return;
      }
      var res = C.search(q, SEARCH);
      entries.list = res;
      if (count) count.textContent = res.length + " entries";
      hits.innerHTML = hitsHtml(res, o.limit || 12);
      hits.hidden = false;
      cur = -1;
    }
    function activate(t) {
      if (t.unavailableReason) {
        ST.receipt(t.title, t.unavailableReason, "info");
        ST.navigate({ name: "workspace", category: t.dest || "models" });
        return;
      }
      ST.navigate(targetView(t.target || t));
    }
    function mark(btns) {
      btns.forEach(function (b, i) { b.classList.toggle("active", i === cur); b.setAttribute("aria-selected", i === cur ? "true" : "false"); });
    }
    input.addEventListener("input", run);
    input.addEventListener("keydown", function (e) {
      var btns = hits.querySelectorAll(".lg-hit");
      if (e.key === "ArrowDown" && btns.length) { e.preventDefault(); cur = Math.min(cur + 1, btns.length - 1); mark(btns); }
      else if (e.key === "ArrowUp" && btns.length) { e.preventDefault(); cur = Math.max(cur - 1, 0); mark(btns); }
      else if (e.key === "Enter") {
        e.preventDefault();
        if (cur >= 0 && btns[cur]) activate(entries.list[cur]);
        else if (entries.list.length) activate(entries.list[0]);
      }
      else if (e.key === "Escape") { input.value = ""; run(); input.blur(); }
    });
    hits.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest(".lg-hit") : null;
      if (!b) return;
      var i = parseInt(b.getAttribute("data-hit"), 10);
      if (entries.list[i]) activate(entries.list[i]);
    });
    if (o.autoFocus) input.focus();
  }

  // --- Notices -----------------------------------------------------------------
  function visibleNotices() {
    var dis = ST.state.collections.dismissedNotices || [];
    return ST.state.notices.filter(function (n) { return dis.indexOf(n.id) < 0; });
  }
  function noticeCard(n) {
    var primaryBtn = "";
    if (n.id === "rec-backup") {

  function noticesColumn() {

    GROUP_ORDER.forEach(function (g) {
      html += "<h3>" + GROUP_LABEL[g] + "</h3>";
      if (byGroup[g].length) html += byGroup[g].map(noticeCard).join("");
      else html += '<div class="pm-note" style="margin-bottom:10px">Nothing here.</div>';

  function noticeNavigate(btn) {
    var id = btn.getAttribute("data-go") || btn.getAttribute("data-go2");
    var n = null;
    ST.state.notices.forEach(function (x) { if (x.id === id) n = x; });
    if (!n || !n.target) return;

    work.className = "lg-work lg-fade";

    content.innerHTML = "";

    if (!dest) {
      work.innerHTML = '<div class="lg-page"><div class="pm-empty">Unknown chapter.</div><div style="margin-top:12px"><button class="pm-btn pm-btn-sm" data-lg-home2>Return to the cover</button></div></div>';

      return work;
    }
    var ch = chapterOf(dest.id);

    var head =
      '<div class="lg-workhead">' +
        '<button class="pm-btn pm-btn-sm pm-btn-ico" data-lg-home aria-label="Back to cover">' + ico("arrowLeft", 14) + "</button>" +
        '<span class="doc-title">' + ico("book", 14) + " Chapter " + ch + " — " + esc(dest.title) + ' <span class="doc-no">§' + ch + "</span></span>" +
        '<button class="pm-btn pm-btn-sm lg-drawer-btn" data-lg-drawer aria-pressed="false">' + ico("menu", 13) + " Outline</button>" +
        '<span class="pm-spacer"></span>' +
        '<div class="lg-searchline mini" data-lg-search>' + ico("search", 13) + '<input type="text" placeholder="Index lookup…" aria-label="Index lookup"><span class="lg-search-count"></span></div>' +
      "</div>";

    var outlineItems = dest.subcategories.map(function (sub, si) {
      return '<button class="lg-ol-item" data-spy="' + esc(sub.id) + '"><span class="no">§' + ch + "." + (si + 1) + "</span>" + esc(sub.title) + "</button>";
    }).join("");
    var outline =
      '<nav class="lg-outline" data-lg-outline aria-label="Margin outline">' +
        '<button class="pm-btn pm-btn-sm lg-outline-close" data-lg-drawer-close>' + ico("x", 12) + " Close outline</button>" +
        '<div class="lg-outline-cap">Margin outline</div>' +
        '<div class="lg-outline-track"><span class="lg-ol-ink" data-lg-ink aria-hidden="true"></span>' + outlineItems + "</div>" +
      "</nav>";

    var sections = dest.subcategories.map(function (sub, si) {
      var num = ch + "." + (si + 1);
      var rowsHtml = sub.settings.map(function (s) { return M.settingRow(s); }).join("");
      var mgrHtml = "";
      if (sub.manager === "providers") {
        mgrHtml = '<div class="lg-appx" data-mgr-host="providers"><div class="lg-appx-cap">Appendix A — Provider families</div><div data-mgr-body="providers"></div></div>';
      } else if (sub.manager) {
        mgrHtml = '<div data-mgr-host="' + esc(sub.manager) + '" data-mgr-body="' + esc(sub.manager) + '"></div>';
      }
      return '<section class="lg-sub" id="lg-sub-' + esc(sub.id) + '" data-sub="' + esc(sub.id) + '">' +
        '<div class="lg-sub-h"><span class="no">§' + num + "</span><h2>" + esc(sub.title) + '</h2><span class="cnt">' + sub.settings.length + " rows" + (sub.manager ? " · manager" : "") + "</span></div>" +
        rowsHtml + mgrHtml +
      "</section>";
    }).join("");

    work.innerHTML = head +
      '<div class="lg-cols">' +
        '<div class="lg-docbody">' +
          '<div class="lg-doc-open"><h1><span class="no">Chapter ' + ch + "</span>" + esc(dest.title) + '</h1><span class="lg-doc-purpose">' + esc(dest.purpose) + "</span></div>" +
          sections +
          '<div class="lg-cover-foot">End of Chapter ' + ch + " — " + esc(dest.title) + "</div>" +
        "</div>" +
        outline +
      "</div>" +
      '<div class="lg-hits lg-hits-float" data-lg-hits hidden role="listbox" aria-label="Index results"></div>';

    bindSearch(work.querySelector("[data-lg-search]"), work.querySelector("[data-lg-hits]"), { list: [] }, { limit: 10 });

    work.querySelector("[data-lg-home]").addEventListener("click", function () {
      ST.navigate({ name: "home" });
    });

    // Lazy hydration for every manager host.
    dest.subcategories.forEach(function (sub) {
      if (!sub.manager) return;
      var host = work.querySelector('[data-mgr-body="' + sub.manager + '"]');
      if (!host) return;
      C.hydrateManager(host, function (container) {
        var fn = sub.manager === "providers" ? providersManagerBody : MANAGER_RENDER[sub.manager];
        container.innerHTML = fn ? fn() : M.managerShell({ id: sub.manager, title: C.managerTitle(sub.manager), body: '<div class="pm-empty">Manager grammar reserved.</div>' });
        if (view.manager === sub.manager || ((view.provider || view.model) && sub.manager === "providers")) {
          applyDeepLink(work, view);
        }
      });
    });

    // Scrollspy with ink marker.
    ui.spy = C.scrollspy(work, function () {
      return dest.subcategories.map(function (sub) {
        return { id: sub.id, el: work.querySelector('#lg-sub-' + sub.id) };
      });
    }, function (activeId) {
      ui.activeSub = activeId;
      work.querySelectorAll(".lg-ol-item").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-spy") === activeId);
      });
      moveInk(work, activeId);
    }, { offset: 90 });

    work.querySelectorAll("[data-spy]").forEach(function (b) {
      b.addEventListener("click", function () {
        ui.spy.jumpTo(b.getAttribute("data-spy"));
        if (ui.drawerOpen) closeDrawer();
      });
    });

    work.querySelectorAll("[data-lg-drawer]").forEach(function (b) {
      b.addEventListener("click", function () { toggleDrawer(work); });
    });
    var closer = work.querySelector("[data-lg-drawer-close]");
    if (closer) closer.addEventListener("click", function () { closeDrawer(); });

    // Ink-spread reveal per section (opacity fade; reduced motion disables it).
    if (!C.reducedMotion() && window.IntersectionObserver) {
      ui.inkObs = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (e.isIntersecting) {
            e.target.classList.add("lg-inked");
            ui.inkObs.unobserve(e.target);
          }
        });
      }, { root: work, threshold: 0.05 });
      work.querySelectorAll(".lg-sub").forEach(function (s) { ui.inkObs.observe(s); });
    }

    applyDeepLink(work, view);
    return work;
  }

  function moveInk(work, activeId) {
    var ink = work.querySelector("[data-lg-ink]");
    var btn = work.querySelector('.lg-ol-item[data-spy="' + activeId + '"]');
    if (!ink || !btn) return;
    ink.style.top = btn.offsetTop + "px";
    ink.style.height = btn.offsetHeight + "px";
  }

  function toggleDrawer(work) {
    var outline = work.querySelector("[data-lg-outline]");
    if (!outline) return;
    if (ui.drawerOpen) { closeDrawer(); return; }
    ui.drawerOpen = true;
    outline.setAttribute("data-drawer", "open");
    var btn = work.querySelector("[data-lg-drawer]");
    if (btn) btn.setAttribute("aria-pressed", "true");
    var scrim = document.createElement("div");
    scrim.className = "lg-scrim";
    scrim.setAttribute("data-lg-scrim", "1");
    scrim.addEventListener("click", closeDrawer);
    document.body.appendChild(scrim);
  }
  function closeDrawer() {
    ui.drawerOpen = false;
    document.querySelectorAll("[data-lg-outline]").forEach(function (o) { o.removeAttribute("data-drawer"); });
    document.querySelectorAll("[data-lg-drawer]").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
    var scrim = document.querySelector("[data-lg-scrim]");
    if (scrim && scrim.parentNode) scrim.parentNode.removeChild(scrim);
  }

  function applyDeepLink(work, view) {
    if (view.setting) {
      var row = work.querySelector('[data-setting-row="' + view.setting + '"]');
      if (row) {
        row.scrollIntoView({ block: "center", behavior: C.reducedMotion() ? "auto" : "smooth" });
        C.focusFlash(row);
      }
    } else if (view.provider) {
      var card = work.querySelector('[data-provider-card="' + view.provider + '"]');
      if (card) {
        var tabBtn = card.querySelector('[data-ptab="install"]');
        if (tabBtn) tabBtn.click();
        card.scrollIntoView({ block: "start", behavior: C.reducedMotion() ? "auto" : "smooth" });
        C.focusFlash(card);
      }
    } else if (view.manager) {
      var mgr = work.querySelector('[data-manager="' + view.manager + '"]') || work.querySelector('[data-mgr-host="' + view.manager + '"]');
      if (mgr) mgr.scrollIntoView({ block: "start", behavior: C.reducedMotion() ? "auto" : "smooth" });
    } else if (view.subcategory) {
      if (ui.spy) ui.spy.jumpTo(view.subcategory);
    }
  }

  // --- Concept-local delegated actions ---------------------------------------------
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t.closest) return;

    var seg = t.closest("[data-tm]");
    if (seg) {
      var tm = ST.state.collections.testingMatrix;
      var cap = tm.capabilities[parseInt(seg.getAttribute("data-tm"), 10)];
      var scope = seg.getAttribute("data-scope");
      var mode = seg.getAttribute("data-mode");
      if (cap && cap[scope] !== mode) {
        cap[scope] = mode;
        var grp = seg.closest(".pm-seg");
        grp.querySelectorAll("[data-mode]").forEach(function (b) {
          var on = b.getAttribute("data-mode") === mode;
          b.classList.toggle("active", on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        });
        ST.emit("collections", { name: "testingMatrix" });
        ST.receipt("Testing matrix updated", cap.name + " (" + (scope === "global" ? "Global" : "Project") + ") set to " + mode + ". Simulated.", "ok");
      }
      return;
    }

    var tp = t.closest("[data-term-profile]");
    if (tp) { ui.termProfile = tp.getAttribute("data-term-profile"); rerenderManagerInPlace("terminal", terminalManager); return; }

    var td = t.closest("[data-term-default]");
    if (td) {
      var tid = td.getAttribute("data-term-default");
      ST.state.terminalProfiles.forEach(function (p) { p.isDefault = p.id === tid; });
      ST.receipt("Default terminal profile set", "New terminals open with the selected profile. Simulated.", "ok");
      rerenderManagerInPlace("terminal", terminalManager);
      return;
    }
    var ti = t.closest("[data-term-inspect]");
    if (ti) {
      var p2 = findTerminal(ti.getAttribute("data-term-inspect"));
      if (p2) M.modal("Profile — " + p2.name, M.inspector([
        ["Shell", p2.shell], ["Environment", p2.env], ["Font", p2.font], ["Colors", p2.colors],
        ["Opacity", p2.opacity + "%"], ["Cursor", p2.cursor], ["Selection", p2.selection],
        ["Copy on select", p2.copyOnSelect ? "Yes" : "No"], ["CWD", p2.cwd], ["Retention", p2.retention], ["Startup", p2.startup]
      ]));
      return;
    }

    var lr = t.closest("[data-lsp-restart]");
    if (lr) {
      var s1 = findLsp(lr.getAttribute("data-lsp-restart"));
      if (s1) ST.receipt("Server restarted", s1.name + " restarted in place; diagnostics re-indexed. Simulated.", "ok");
      return;
    }
    var li = t.closest("[data-lsp-install]");
    if (li) {
      var s2 = findLsp(li.getAttribute("data-lsp-install"));
      if (s2) ST.receipt("Install requested", s2.name + ": the official package would install here. Simulated.", "sim");
      return;
    }
    var ll = t.closest("[data-lsp-logs]");
    if (ll) {
      var s3 = findLsp(ll.getAttribute("data-lsp-logs"));
      if (s3) {
        var logs = s3.logs.length ? s3.logs.map(function (l) { return '<div class="lg-logline">' + esc(l) + "</div>"; }).join("") : '<div class="pm-note">No log lines this session.</div>';
        M.modal("Logs — " + s3.name, logs);
      }
      return;
    }
    var lx = t.closest("[data-lsp-inspect]");
    if (lx) {
      var s4 = findLsp(lx.getAttribute("data-lsp-inspect"));
      if (s4) M.modal("Language server — " + s4.name, M.inspector([
        ["Executable", s4.executable], ["Version", s4.version], ["State", s4.state], ["Scope", s4.scope],
        ["Startup", s4.startup], ["Coverage", s4.coverage], ["Capabilities", s4.capabilities], ["Conflicts", s4.conflicts], ["Health", s4.health]
      ]));
      return;
    }
    var la = t.closest("[data-lsp-add]");
    if (la) {
      C.promptDialog("Custom server executable", "my-langserver --stdio", function (v) {
        if (!v) return;
        ST.state.lspServers.push({ id: "lsp-custom-" + Date.now().toString(36), name: v.split(" ")[0], executable: v, version: "custom", state: "installed", scope: "Global", startup: "On first matching file", coverage: "custom", capabilities: "As declared", conflicts: "None", health: "Registered — not started", logs: [] });
        ST.receipt("Custom server registered", v + " added with provenance recorded. Simulated.", "ok");
        rerenderManagerInPlace("lsp", lspManager);
      });
      return;
    }
    var le = t.closest("[data-lsp-edit]");
    if (le) { ST.receipt("Edit custom server", "Custom registrations edit in place; the ledger keeps provenance. Simulated.", "info"); return; }
    var lrem = t.closest("[data-lsp-remove]");
    if (lrem) {
      var before = ST.state.lspServers.length;
      ST.state.lspServers = ST.state.lspServers.filter(function (s) { return s.id.indexOf("lsp-custom-") !== 0; });
      if (ST.state.lspServers.length < before) {
        ST.receipt("Custom server removed", "Registration deleted; the binary on disk was not touched. Simulated.", "ok");
        rerenderManagerInPlace("lsp", lspManager);
      } else {
        ST.receipt("Nothing to remove", "No custom servers are registered.", "info");
      }
      return;
    }

    var fa = t.closest("[data-fmt-add]");
    if (fa) {
      C.promptDialog("Formatter command", "my-formatter --write", function (v) {
        if (!v) return;
        ST.state.collections.formatterTable.push({ id: "fmt-custom-" + Date.now().toString(36), name: v.split(" ")[0], kind: "Custom", state: "detected", command: v, extensions: "custom", scope: "Project", version: "1.0" });
        ST.emit("collections", { name: "formatterTable" });
        ST.receipt("Formatter added", v + " registered at Project scope. Simulated.", "ok");
        rerenderManagerInPlace("formatters", formattersManager);
      });
      return;
    }
    var fr = t.closest("[data-fmt-reset]");
    if (fr) {
      ST.state.collections.formatterTable = JSON.parse(JSON.stringify(D.formatterTable));
      ST.emit("collections", { name: "formatterTable" });
      ST.receipt("Formatters reset", "Built-in table restored to its fixture state.", "ok");
      rerenderManagerInPlace("formatters", formattersManager);
      return;
    }

    var ce = t.closest("[data-cmd-edit]");
    if (ce) {
      var c1 = findCmd(ce.getAttribute("data-cmd-edit"));
      if (c1) C.promptDialog("Edit command — " + c1.name, c1.command, function (v) {
        if (!v) return;
        c1.command = v;
        ST.emit("collections", { name: "commandsCatalog" });
        ST.receipt("Command saved", c1.name + " updated. Simulated.", "ok");
        rerenderManagerInPlace("commands", commandsManager);
      });
      return;
    }
    var cd = t.closest("[data-cmd-delete]");
    if (cd) {
      var cid = cd.getAttribute("data-cmd-delete");
      var n1 = findCmd(cid);
      ST.state.collections.commandsCatalog = ST.state.collections.commandsCatalog.filter(function (x) { return x.id !== cid; });
      ST.emit("collections", { name: "commandsCatalog" });
      ST.receipt("Command removed", (n1 ? n1.name : "Command") + " deleted from the catalog. Simulated.", "ok");
      rerenderManagerInPlace("commands", commandsManager);
      return;
    }
    var ca = t.closest("[data-cmd-add]");
    if (ca) {
      C.promptDialog("New command shell line", "echo {message}", function (v) {
        if (!v) return;
        ST.state.collections.commandsCatalog.push({ id: "cmd-custom-" + Date.now().toString(36), name: "Custom " + (ST.state.collections.commandsCatalog.length + 1), scope: "Global", command: v, parameters: [], includes: [], shellSafety: "Quoted arguments, no shell expansion", lastRun: "Never" });
        ST.emit("collections", { name: "commandsCatalog" });
        ST.receipt("Command added", "New command registered with shell-safety defaults. Simulated.", "ok");
        rerenderManagerInPlace("commands", commandsManager);
      });
      return;
    }
    var ki = t.closest("[data-kbd-import]");
    if (ki) { ST.receipt("Bindings imported", "Keybinding file parsed; conflicts would preview before apply. Simulated.", "sim"); return; }
    var ke = t.closest("[data-kbd-export]");
    if (ke) { ST.receipt("Bindings exported", "Current bindings written to a portable file. Simulated.", "sim"); return; }
    var kc = t.closest("[data-kbd-cheatsheet]");
    if (kc) {
      var rows2 = ST.state.collections.shortcutBindings.map(function (b) {
        return "<tr><td>" + esc(b.command) + '</td><td><span class="pm-kbd">' + esc(b.binding) + "</span></td><td>" + (b.state === "conflict" ? M.badge("Conflict", "warn") : M.badge("OK", "ok")) + "</td></tr>";
      }).join("");
      M.modal("Shortcut cheat sheet", '<div class="lg-table-wrap"><table class="lg-table"><thead><tr><th>Command</th><th>Binding</th><th>State</th></tr></thead><tbody>' + rows2 + "</tbody></table></div>");
      return;
    }

    var ma = t.closest("[data-mcp-auth]");
    if (ma) { mcpMutate(ma.getAttribute("data-mcp-auth"), function (s) { s.state = "connected"; s.freshness = "Healthy, just now"; }, "MCP authorized", "OAuth flow completed in the native browser session. Simulated."); return; }
    var mr = t.closest("[data-mcp-repair]");
    if (mr) { mcpMutate(mr.getAttribute("data-mcp-repair"), function (s) { s.state = "connected"; s.freshness = "Healthy after repair"; }, "MCP repaired", "Transport re-spawned and handshake succeeded. Simulated."); return; }
    var me = t.closest("[data-mcp-enable]");
    if (me) { mcpMutate(me.getAttribute("data-mcp-enable"), function (s) { s.state = "connected"; s.freshness = "Re-enabled"; }, "MCP enabled", "Server re-enabled for this scope. Simulated."); return; }
    var md = t.closest("[data-mcp-disable]");
    if (md) { mcpMutate(md.getAttribute("data-mcp-disable"), function (s) { s.state = "disabled"; s.freshness = "User-disabled"; }, "MCP disabled", "Server disabled; catalog entry retained. Simulated."); return; }
    var mi = t.closest("[data-mcp-inspect]");
    if (mi) {
      var ms = findMcp(mi.getAttribute("data-mcp-inspect"));
      if (ms) {
        var logHtml = ms.logs.length ? ms.logs.map(function (l) { return '<div class="lg-logline">' + esc(l) + "</div>"; }).join("") : '<div class="pm-note">No log lines.</div>';
        M.modal("MCP — " + ms.name, M.inspector([
          ["Transport", ms.transport], ["Protocol", ms.protocol], ["State", ms.state], ["Scope", ms.scope],
          ["Tools", ms.toolCount + " (" + (ms.tools.slice(0, 4).join(", ") || "none listed") + (ms.tools.length > 4 ? ", …" : "") + ")"],
          ["Approval", ms.approval], ["Exposure", ms.exposure], ["Freshness", ms.freshness]
        ]) + '<div class="lg-appx-cap" style="margin-top:10px">Logs</div>' + logHtml);
      }
      return;
    }

    var stg = t.closest("[data-skill-toggle]");
    if (stg) {
      var sk = findSkill(stg.getAttribute("data-skill-toggle"));
      if (sk) { sk.enabled = !sk.enabled; ST.receipt("Skill " + (sk.enabled ? "enabled" : "disabled"), sk.name + (sk.enabled ? " can be selected now." : " stays installed but dormant."), "ok"); rerenderManagerInPlace("skills", skillsManager); }
      return;
    }
    var su = t.closest("[data-skill-update]");
    if (su) {
      var sk2 = findSkill(su.getAttribute("data-skill-update"));
      if (sk2) { sk2.update = "Up to date"; ST.receipt("Skill updated", sk2.name + " is now up to date. Simulated.", "ok"); rerenderManagerInPlace("skills", skillsManager); }
      return;
    }
    var pt = t.closest("[data-plugin-toggle]");
    if (pt) {
      var pl = findPlugin(pt.getAttribute("data-plugin-toggle"));
      if (pl) {
        if (!pl.enabled && pl.compatibility !== "Compatible") {
          ST.receipt("Plugin blocked", pl.name + " is incompatible with this build: " + pl.compatibility + ". Simulated.", "blocked");
        } else {
          pl.enabled = !pl.enabled;
          pl.state = pl.enabled ? "Enabled" : "Failed to load";
          ST.receipt("Plugin " + (pl.enabled ? "enabled" : "disabled"), pl.name + (pl.enabled ? " loaded with declared permissions." : " unloaded."), "ok");
          rerenderManagerInPlace("plugins", pluginsManager);
        }
      }
      return;
    }

    var fd = t.closest("[data-demo]");
    if (fd) {
      var demo = fd.getAttribute("data-demo");
      if (demo === "transient") ST.receipt("Transient reason", D.fileManagerCfg.transient + " Simulated.", "info");
      if (demo === "largefile") ST.receipt("Large-file handling", "Files over " + D.fileManagerCfg.largeFile.threshold + " open in the read-only viewer first, then ask. Simulated.", "info");
      return;
    }

    var mv = t.closest("[data-mem-verify]");
    if (mv) { memMutate(mv.getAttribute("data-mem-verify"), function (m) { m.state = "verified"; }, "Memory verified", "Evidence reviewed; the memory is fully trusted now. Simulated."); return; }
    var mp = t.closest("[data-mem-pin]");
    if (mp) { memMutate(mp.getAttribute("data-mem-pin"), function (m) { m.pinned = !m.pinned; }, "Memory updated", "Pin state changed. Pinned memories stay in active recall. Simulated."); return; }
    var mvs = t.closest("[data-mem-versions]");
    if (mvs) {
      var m1 = findMem(mvs.getAttribute("data-mem-versions"));
      if (m1) M.modal("Versions — " + m1.versions + " total", '<div class="pm-note">Version history is retained; restoring a version never deletes the newer text, it only changes what recall surfaces. Simulated.</div>');
      return;
    }
    var mdel = t.closest("[data-mem-delete]");
    if (mdel) {
      var mid = mdel.getAttribute("data-mem-delete");
      ST.state.memory = ST.state.memory.filter(function (m) { return m.id !== mid; });
      ST.receipt("Memory deleted", "Removed from active recall and storage. Simulated.", "ok");
      rerenderManagerInPlace("memory", memoryManager);
      return;
    }
    var mrb = t.closest("[data-mem-rebuild]");
    if (mrb) { ST.receipt("Memory index rebuilt", "Embeddings recomputed; nothing was deleted. Simulated.", "ok"); return; }
    var mdd = t.closest("[data-mem-dedupe]");
    if (mdd) { ST.receipt("Dedupe pass complete", "No duplicate memories found in the current set. Simulated.", "ok"); return; }
    var mrd = t.closest("[data-mem-redact]");
    if (mrd) { ST.receipt("Redaction pass complete", "Likely secrets scrubbed from stored memories; receipts recorded. Simulated.", "ok"); return; }

    var pc = t.closest("[data-persona-capsule]");
    if (pc) {
      var pe = null;
      ST.state.personas.forEach(function (p) { if (p.id === pc.getAttribute("data-persona-capsule")) pe = p; });
      if (pe) M.modal("Capsule — " + pe.name, '<div class="pm-note">' + esc(pe.description) + "</div>" + M.inspector([["Capsule size", pe.capsule], ["Provenance", pe.provenance], ["Eligible", pe.eligible], ["Scope", pe.scope]]));
      return;
    }
    var ps = t.closest("[data-persona-scan]");
    if (ps) { ST.receipt("Import scan complete", "No unregistered persona capsules found in the project. Simulated.", "info"); return; }

    var ci = t.closest("[data-crew-inspect]");
    if (ci) {
      var cr = null;
      ST.state.crewTemplates.forEach(function (c) { if (c.id === ci.getAttribute("data-crew-inspect")) cr = c; });
      if (cr) M.modal(cr.name + " — members", M.inspector(cr.members.map(function (m) { return [m.role, m.persona + " → " + m.route + " (candidates: " + m.candidates.join(", ") + ")"]; })));
      return;
    }

    var he = t.closest("[data-hist-export]");
    if (he) { ST.receipt("History exported", "Entry exported with redaction applied. Simulated.", "sim"); return; }
    var ha = t.closest("[data-hist-archive]");
    if (ha) { ST.receipt("Archived", "Entry moved out of active history; still addressable. Simulated.", "ok"); return; }
    var hdel = t.closest("[data-hist-delete]");
    if (hdel && !hdel.disabled) {
      var hid = hdel.getAttribute("data-hist-delete");
      ST.state.collections.historyRows = ST.state.collections.historyRows.filter(function (h) { return h.id !== hid; });
      ST.emit("collections", { name: "historyRows" });
      ST.receipt("History entry deleted", "Deleted under the retention policy; receipts remain. Simulated.", "ok");
      rerenderManagerInPlace("history", historyManager);
      return;
    }

    var ar = t.closest("[data-art-reveal]");
    if (ar) { ST.receipt("Artifact revealed", "The containing folder would open here. Simulated.", "sim"); return; }
    var ax = t.closest("[data-art-export]");
    if (ax) { ST.receipt("Artifact exported", "Copied with identity and redaction markers intact. Simulated.", "sim"); return; }

    var cp = t.closest("[data-container-probe]");
    if (cp) { ST.receipt("Capability probe", cp.getAttribute("data-container-probe") + ": probe ran against the fixture state; results match the card. Simulated.", "info"); return; }

    var wp = t.closest("[data-web-probe]");
    if (wp) { ST.receipt("Web readiness", D.webSearchCfg.readiness + ". Simulated.", "info"); return; }

    var tn = t.closest("[data-theme-new]");
    if (tn) {
      C.promptDialog("New TOML theme name", "ledger-sepia", function (v) {
        if (!v) return;
        ST.state.collections.customThemes.themes.push({ name: v, base: "Friendly Light", state: "valid" });
        ST.emit("collections", { name: "customThemes" });
        ST.receipt("Theme created", v + " inherits from Friendly Light until tokens are overridden. Simulated.", "ok");
        rerenderManagerInPlace("themes", themesManager);
      });
      return;
    }
    var tim = t.closest("[data-theme-import]");
    if (tim) { ST.receipt("Theme import", "A schema-invalid TOML falls back with a diagnostic instead of a blank theme. Simulated.", "info"); return; }
    var tex = t.closest("[data-theme-export]");
    if (tex) { ST.receipt("Theme exported", "Custom themes written as portable TOML. Simulated.", "sim"); return; }
    var tf = t.closest("[data-theme-folder]");
    if (tf) { ST.receipt("Themes folder", "The custom themes folder would open here. Simulated.", "sim"); return; }
  });

  // Finders + mutators for concept-local collections.
  function findTerminal(id) { var x = null; ST.state.terminalProfiles.forEach(function (p) { if (p.id === id) x = p; }); return x; }
  function findLsp(id) { var x = null; ST.state.lspServers.forEach(function (s) { if (s.id === id) x = s; }); return x; }
  function findCmd(id) { var x = null; ST.state.collections.commandsCatalog.forEach(function (c) { if (c.id === id) x = c; }); return x; }
  function findMcp(id) { var x = null; ST.state.mcpServers.forEach(function (s) { if (s.id === id) x = s; }); return x; }
  function findSkill(id) { var x = null; ST.state.skills.forEach(function (s) { if (s.id === id) x = s; }); return x; }
  function findPlugin(id) { var x = null; ST.state.plugins.forEach(function (s) { if (s.id === id) x = s; }); return x; }
  function findMem(id) { var x = null; ST.state.memory.forEach(function (m) { if (m.id === id) x = m; }); return x; }
  function mcpMutate(id, fn, title, detail) {
    var s = findMcp(id);
    if (!s) return;
    fn(s);
    ST.receipt(title, s.name + ": " + detail, "ok");
    rerenderManagerInPlace("mcp", mcpManager);
  }
  function memMutate(id, fn, title, detail) {
    var m = findMem(id);
    if (!m) return;
    fn(m);
    ST.receipt(title, detail, "ok");
    rerenderManagerInPlace("memory", memoryManager);
  }

  // Re-render one hydrated manager in place without rebuilding the whole document.
  function rerenderManagerInPlace(managerId, fn) {
    var host = content.querySelector('[data-mgr-body="' + managerId + '"]');
    if (!host) return;
    var w = content.querySelector(".lg-work");
    var top = w ? w.scrollTop : 0;
    host.innerHTML = fn();
    if (w) w.scrollTop = top;
    if (ui.spy) ui.spy.refresh();
    if (ui.activeSub && w) moveInk(w, ui.activeSub);
  }

  // --- Rendering dispatch ----------------------------------------------------------
  function render(view) {
    if (view.name === "workspace") renderWorkspace(view);
    else renderHome();
  }

  ST.subscribe(function (kind, payload) {
    if (kind === "navigate") { render(payload); return; }
    if (kind === "notices" && ST.state.view.name === "home") {
      var col = content.querySelector("[data-lg-notices]");
      if (col) {
        col.innerHTML = "<h3>Marginalia</h3>" + noticesColumn();
        bindNoticeButtons(col);
      }
      return;
    }
    if (kind === "collections") {
      var name = payload && payload.name;
      var map = { formatterTable: "formatters", commandsCatalog: "commands", shortcutBindings: "commands", notificationDestinations: "notifications", soundLibrary: "sounds", soundPacks: "sounds", searchIndexCfg: "search-index", permissionRules: "permissions", historyRows: "history", backupRuns: "backup", customThemes: "themes" };
      var fn = map[name];
      if (fn && MANAGER_RENDER[fn]) rerenderManagerInPlace(fn, MANAGER_RENDER[fn]);
      return;
    }
    if (kind === "providers" || kind === "catalog") {
      var host = content.querySelector('[data-mgr-body="providers"]');
      if (host && !host.querySelector("[data-skeleton]")) {
        var w = content.querySelector(".lg-work");
        var top = w ? w.scrollTop : 0;
        host.innerHTML = providersManagerBody();
        if (w) w.scrollTop = top;
      }
      var cov = content.querySelector("[data-lg-catalogs]");
      if (cov && ST.state.view.name === "home") {
        cov.innerHTML = '<div class="lg-toc-cap"><span>Catalogs — continuous refresh</span></div>' + catalogsHtml();
      }
      return;
    }
    if (kind === "scenario") { render(ST.state.view); return; }
  });

  var initial = C.startRouter();
  render(initial);
  window.__conceptReady = true;
})();
</script>
</body>
</html>
