<!doctype html>
<html lang="en" data-theme="friendly-dark" data-reduced-motion="0" data-concept-id="concept-11-tabbed-organizer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabbed Organizer — Settings — Qwen 5.8</title>
<link rel="stylesheet" href="_shared/pm-shell.css">
<link rel="stylesheet" href="_shared/pm-managers2.css">
<style>
/* concept-11 Tabbed Organizer — layered sheets + domain tabs, PM tokens only.
   No paper/binder/folder skeuomorphism; flat glass-friendly surfaces. */
#content { padding: 14px 18px 28px; overflow-y: auto; }
.t11-wrap { width: 100%; max-width: 1240px; margin: 0 auto; }
.pm-app[data-wtier="wide"] .t11-wrap { max-width: 1600px; }

/* layered sheet: one surface with two quiet offset layers behind it */
.t11-sheet { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l); box-shadow: var(--shadow); }
.t11-sheet::before, .t11-sheet::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -5px; height: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-l); z-index: -1; }
.t11-sheet::after { left: 20px; right: 20px; bottom: -9px; background: var(--surface-3); }
.t11-sheet.in { animation: t11SheetIn .22s ease-out 1; }
@keyframes t11SheetIn { from { opacity: .35; transform: translateX(16px); } to { opacity: 1; transform: none; } }

/* view header */
.t11-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.t11-crumb { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--text-2); font-size: 12px; min-width: 0; }
.t11-crumb b { color: var(--text-1); font-weight: 650; }
.t11-crumb .t11-sep { color: var(--text-3); }
.t11-crumb button { border: none; background: none; color: var(--text-2); font-size: 12px; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.t11-crumb button:hover { background: var(--surface-2); color: var(--text-1); }
.t11-head-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* tabs */
.t11-tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: thin; }
.t11-tabs [role="tab"] { border: 1px solid transparent; border-bottom: none; background: none; color: var(--text-2); padding: 7px 14px 8px; border-radius: var(--radius-m) var(--radius-m) 0 0; cursor: pointer; font-size: 12.5px; white-space: nowrap; position: relative; top: 1px; }
.t11-tabs [role="tab"]:hover { color: var(--text-1); background: var(--surface-2); }
.t11-tabs [role="tab"][aria-selected="true"] { background: var(--surface); border-color: var(--border); color: var(--accent); font-weight: 650; box-shadow: 0 1px 0 var(--surface); }
.t11-tabbody { padding: 14px 16px; }

/* edge tabs (home right rail) */
.t11-homegrid { display: grid; grid-template-columns: minmax(0,1fr) 44px; gap: 12px; align-items: stretch; }
.t11-home-main { padding: 6px 16px 16px; min-width: 0; }
.t11-edge { display: flex; flex-direction: column; gap: 3px; padding: 8px 4px; }
.t11-edge button { border: 1px solid var(--border); border-right: none; background: var(--surface-2); color: var(--text-2); border-radius: var(--radius-m) 0 0 var(--radius-m); padding: 7px 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.t11-edge button:hover { background: var(--accent-soft); color: var(--accent); }
.t11-edge button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.t11-edge-lbl { display: none; }
/* home right pane: recent changes (stacks below on narrower tiers) */
.t11-home-aside { grid-column: 1 / -1; min-width: 0; border-top: 1px solid var(--border); padding: 4px 16px 16px; }
.pm-app[data-wtier="wide"] .t11-homegrid { grid-template-columns: minmax(0,1fr) 300px 176px; }
.pm-app[data-wtier="wide"] .t11-home-aside { grid-column: auto; border-top: none; border-left: 1px solid var(--border); padding: 8px 4px 16px 16px; }
.pm-app[data-wtier="wide"] .t11-edge button { justify-content: flex-start; padding: 7px 10px; text-align: left; }
.pm-app[data-wtier="wide"] .t11-edge-lbl { display: block; font-size: 11.5px; line-height: 1.3; }

/* home */
.t11-searchbig { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border-strong); background: var(--surface-2); border-radius: var(--radius-m); padding: 10px 14px; margin: 14px 16px 4px; }
.t11-searchbig input { flex: 1; border: none; background: none; outline: none; color: var(--text-1); font-size: 14px; }
.t11-caps { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.t11-cap { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-m); padding: 10px 12px; cursor: pointer; color: var(--text-1); }
.t11-cap:hover { border-color: var(--border-strong); background: var(--surface-2); }
.t11-cap .t11-cap-ico { color: var(--accent); margin-top: 1px; }
.t11-cap b { display: block; font-size: 12.5px; font-weight: 650; }
.t11-cap span { display: block; color: var(--text-2); font-size: 11px; margin-top: 2px; }
.t11-cap em { display: block; font-style: normal; color: var(--text-3); font-size: 10.5px; margin-top: 4px; }
.t11-sec-cap { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-3); margin: 16px 0 8px; }
.t11-recent { display: flex; flex-direction: column; }
.t11-recent-row { display: flex; align-items: baseline; gap: 10px; padding: 6px 2px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-1); }
.t11-recent-row:last-child { border-bottom: none; }
.t11-recent-row .t11-rpath { color: var(--text-3); font-size: 11px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t11-recent-row .t11-rwhen { color: var(--text-3); font-size: 11px; white-space: nowrap; }
.t11-notice { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface-2); padding: 8px 12px; margin-bottom: 6px; font-size: 12px; color: var(--text-1); }
.t11-notice .pm-btn { margin-left: auto; }
.t11-banner { display: flex; gap: 10px; align-items: center; border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--text-1); border-radius: var(--radius-m); padding: 9px 12px; margin: 12px 16px 0; font-size: 12.5px; }

/* search dropdown */
.t11-srwrap { position: relative; }
.t11-srch { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-strong); background: var(--surface-2); border-radius: var(--radius-s); padding: 6px 10px; min-width: 220px; }
.t11-srch input { flex: 1; min-width: 120px; border: none; background: none; outline: none; color: var(--text-1); font-size: 12.5px; }
.t11-drop { position: absolute; top: calc(100% + 4px); left: 0; right: 0; min-width: 320px; max-height: 380px; overflow-y: auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-m); box-shadow: var(--shadow); z-index: 60; }
.t11-drop-cap { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); padding: 8px 12px 3px; }
.t11-drop-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none; background: none; padding: 7px 12px; cursor: pointer; color: var(--text-1); }
.t11-drop-row:hover, .t11-drop-row.sel { background: var(--surface-2); }
.t11-drop-row .t11-dl { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.t11-drop-row .t11-dp { color: var(--text-3); font-size: 11px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t11-drop-row .t11-dn { color: var(--text-2); font-size: 10.5px; padding: 0 12px 6px; }
.t11-drop-foot { display: flex; gap: 14px; padding: 6px 12px; border-top: 1px solid var(--border); color: var(--text-3); font-size: 10.5px; }

/* manager view */
.t11-mgr { display: grid; grid-template-columns: minmax(0,1fr); gap: 0; }
.pm-app[data-wtier="wide"] .t11-mgr.has-roster { grid-template-columns: 232px minmax(0,1fr) 250px; }
.pm-app[data-wtier="mid"] .t11-mgr.has-roster { grid-template-columns: 210px minmax(0,1fr); }
.t11-roster { border-right: 1px solid var(--border); padding: 10px 8px; min-height: 0; }
.t11-roster-cap { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); padding: 2px 8px 6px; }
.t11-roster button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: none; background: none; color: var(--text-1); padding: 7px 9px; border-radius: var(--radius-s); cursor: pointer; font-size: 12.5px; }
.t11-roster button:hover { background: var(--surface-2); }
.t11-roster button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.t11-roster .pm2-health { margin-left: auto; }
.t11-detail { padding: 12px 16px; min-width: 0; }
.t11-ctx { border-left: 1px solid var(--border); padding: 12px; color: var(--text-2); font-size: 12px; }
.t11-objcard { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface-2); padding: 10px 12px; margin-bottom: 12px; }
.t11-objcard b { color: var(--text-1); font-size: 13px; }
.t11-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 18px; margin: 8px 0; }
.t11-kv div dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
.t11-kv div dd { margin: 2px 0 0; color: var(--text-1); font-size: 12px; word-break: break-word; }
.t11-strip { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.t11-strip button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); border-radius: var(--radius-s); padding: 5px 9px; cursor: pointer; font-size: 11.5px; }
.t11-strip button:hover { color: var(--accent); border-color: var(--border-strong); }
.t11-provq { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.t11-provq div { border: 1px solid var(--border); border-radius: var(--radius-s); background: var(--surface-2); padding: 8px 10px; }
.t11-provq dt { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); }
.t11-provq dd { margin: 3px 0 0; font-size: 12px; color: var(--text-1); }

/* all settings */
.t11-facets { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.t11-vlist { height: 560px; overflow-y: auto; padding: 4px 16px 16px; }

/* copy */
.t11-copygrid { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0,1fr); gap: 0; }
.t11-copysrc { border-right: 1px solid var(--border); padding: 12px; }
.t11-copycats { padding: 12px 16px; }
.t11-src { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-s); padding: 8px 10px; margin-bottom: 6px; cursor: pointer; color: var(--text-1); font-size: 12.5px; }
.t11-src[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.t11-catrow { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--text-1); }
.t11-catrow:last-child { border-bottom: none; }
.t11-catrow .t11-cpath { color: var(--text-3); font-size: 11px; flex: 1; }
.t11-steps { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.t11-steps span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 11.5px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); }
.t11-steps span.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.t11-diffrow { display: flex; gap: 10px; align-items: baseline; padding: 5px 2px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-1); }
.t11-diffrow .pm-badge { flex: none; }

/* lifecycle */
.t11-lc { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; padding: 14px 16px; }
.t11-lc-card { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface-2); padding: 12px; }
.t11-lc-card h3 { margin: 0 0 6px; font-size: 12.5px; color: var(--text-1); }
.t11-err { display: flex; gap: 8px; align-items: flex-start; color: var(--err); font-size: 12px; margin: 8px 0; }

/* responsive: one-pane push stack */
.pm-app[data-wtier="squeezed"] .t11-homegrid, .pm-app[data-wtier="narrow"] .t11-homegrid { grid-template-columns: minmax(0,1fr); }
.pm-app[data-wtier="squeezed"] .t11-edge, .pm-app[data-wtier="narrow"] .t11-edge { display: none; }
.pm-app[data-wtier="squeezed"] .t11-mgr.has-roster, .pm-app[data-wtier="narrow"] .t11-mgr.has-roster { grid-template-columns: minmax(0,1fr); }
.pm-app[data-wtier="squeezed"] .t11-roster, .pm-app[data-wtier="narrow"] .t11-roster { border-right: none; border-bottom: 1px solid var(--border); display: flex; gap: 4px; overflow-x: auto; padding: 8px; }
.pm-app[data-wtier="squeezed"] .t11-roster button, .pm-app[data-wtier="narrow"] .t11-roster button { width: auto; white-space: nowrap; }
.pm-app[data-wtier="squeezed"] .t11-copygrid, .pm-app[data-wtier="narrow"] .t11-copygrid { grid-template-columns: minmax(0,1fr); }
.pm-app[data-wtier="squeezed"] .t11-copysrc, .pm-app[data-wtier="narrow"] .t11-copysrc { border-right: none; border-bottom: 1px solid var(--border); }
.pm-app[data-wtier="squeezed"] .t11-drop, .pm-app[data-wtier="narrow"] .t11-drop { position: fixed; left: 12px; right: 12px; top: auto; }
.pm-app[data-wtier="squeezed"] .t11-head-tools .t11-srch { min-width: 140px; }
.pm-app[data-wtier="wide"] .t11-tabbody p, .pm-app[data-wtier="wide"] .pm2-row-desc { max-width: 75ch; }
</style>
</head>
<body data-concept-model="Qwen 5.8" data-concept="concept-11-tabbed-organizer">
<div id="app"></div>
<script src="_shared/pm-icons.js"></script>
<script src="_shared/pm-inventory-data.js"></script>
<script src="_shared/pm-managers2-data.js"></script>
<script src="_shared/pm-state2.js"></script>
<script src="_shared/pm-search2.js"></script>
<script src="_shared/pm-managers2.js"></script>
<script src="_shared/pm-copy2.js"></script>
<script src="_shared/pm-shell2.js"></script>
<script src="_shared/concept-hub-bridge.js"></script>
<script>
(function () {
  "use strict";
  var D = window.PMInventoryData, M = window.PMManagers2Data, S2 = window.PMState2,
      SR = window.PMSearch2, M2 = window.PMManagers2, C2 = window.PMCopy2,
      esc = M2.esc, ico = M2.ico;

  S2.init("concept-11-tabbed-organizer");
  SR.register(M.searchEntries());

  var shell = PMShell2.mount({
    conceptName: "Tabbed Organizer", model: "Qwen 5.8",
    onHome: function () { nav(""); },
    onTier: function () { if (vlist) vlist.refresh(); }
  });
  var content = shell.content;
  var PROJECT = (document.querySelector("[data-shell-project]") || {}).textContent || "this Project";

  /* ---------------- routing ---------------- */
  var scrollMem = {}, vlist = null, openDrop = null, pendingLocate = null;
  var copyState = { step: 1, source: null, cats: [], preview: null, applied: null };
  // ---------------- runtime-demand continuation (packet 08) ----------------
  var demand = null, staleDemand = {}, installedLocal = {};
  function demandToken() { return "cont-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 46656).toString(36); }
  function provReady(p) {
    if (installedLocal[p.id]) return true;
    return p.readiness.indexOf("not-installed") < 0 && (p.readiness.indexOf("authenticated") >= 0 || p.readiness.indexOf("probe-ok") >= 0);
  }
  function demandBlockHTML(p) {
    var html = '<div class="t11-sec-cap">Runtime demand</div>' +
      '<div class="t11-objcard"><b>Simulate a runtime demand for this CLI</b>' +
      '<p class="pm-note" style="margin:6px 0">A chat run requests this provider; the originating operation is preserved with a continuation token until setup completes.</p>' +
      '<div class="pm-mgr-actions"><button class="pm-btn pm-btn-sm" data-provact="demand-simulate" data-prov="' + esc(p.id) + '">Simulate…</button></div>';
    var d = demand && demand.id === p.id ? demand : null;
    if (d) {
      if (provReady(p)) {
        html += '<div class="pm-mgr-actions" style="margin-top:8px"><span class="pm-badge pm-badge-ok">token ' + esc(d.token) + ' — current</span>' +
          '<button class="pm-btn pm-btn-sm pm-btn-primary" data-provact="demand-resume" data-prov="' + esc(p.id) + '">Resume originating operation</button></div>' +
          '<p class="pm-note" style="margin:6px 0">' + esc(d.op) + ': the stored token still matches this demand, so the resume is honored.</p>';
      } else {
        html += '<p class="pm-note" style="margin:6px 0">' + esc(d.op) + ' holds token ' + esc(d.token) + '; resume unlocks when ' + esc(p.name) + ' reports installed + authenticated.</p>';
      }
      html += '<div class="pm-mgr-actions"><button class="pm-btn pm-btn-quiet pm-btn-sm" data-provact="demand-open" data-prov="' + esc(p.id) + '">Open the exact install row</button></div>' +
        '<p class="pm-note" style="margin:4px 0 0">Deep link: #/mgr/providers/' + esc(p.id) + '?sec=install</p>';
    } else if (staleDemand[p.id]) {
      html += '<p class="pm-note" style="margin:6px 0">Continuation stale: "' + esc(staleDemand[p.id].op) + '" (token ' + esc(staleDemand[p.id].token) + ') was superseded by a newer runtime demand; the stored token no longer matches. Simulate again to preserve a new operation.</p>';
    }
    return html + "</div>";
  }

  function parseHash() {
    var h = location.hash.replace(/^#\/?/, "");
    var q = {}, qi = h.indexOf("?");
    if (qi >= 0) { h.slice(qi + 1).split("&").forEach(function (kv) { var p = kv.split("="); q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ""); }); h = h.slice(0, qi); }
    var parts = h.split("/").filter(Boolean);
    return { parts: parts, q: q, key: location.hash || "#/home" };
  }
  function nav(hash) { location.hash = hash ? "#/" + hash : "#/home"; }
  function famById(id) { for (var i = 0; i < M.families.length; i++) if (M.families[i].id === id) return M.families[i]; return null; }
  function provById(id) { for (var i = 0; i < M.providers.length; i++) if (M.providers[i].id === id) return M.providers[i]; return null; }
  function catById(id) { return D.byCategory(id) ? D.byCategory(id).category : null; }
  function timeAgo(ts) {
    var s = Math.max(1, Math.round((Date.now() - ts) / 1000));
    if (s < 60) return s + "s ago"; if (s < 3600) return Math.round(s / 60) + "m ago";
    if (s < 86400) return Math.round(s / 3600) + "h ago"; return Math.round(s / 86400) + "d ago";
  }

  /* ---------------- shared chrome ---------------- */
  function crumbHtml(items) {
    var out = '<nav class="t11-crumb" data-test="breadcrumb" aria-label="Breadcrumb">';
    items.forEach(function (it, i) {
      if (i) out += '<span class="t11-sep">/</span>';
      if (it.hash) out += '<button data-nav="' + esc(it.hash) + '">' + esc(it.label) + "</button>";
      else out += "<b>" + esc(it.label) + "</b>";
    });
    return out + "</nav>";
  }
  function headHtml(crumbItems, backLabel, backHash) {
    return '<div class="t11-head">' +
      '<button class="pm-btn pm-btn-sm" data-test="back" data-back="1" data-fallback="' + esc(backHash || "") + '">' + ico("arrowLeft", 13) + " Back to " + esc(backLabel) + "</button>" +
      crumbHtml(crumbItems) +
      '<div class="t11-head-tools">' +
        '<span class="pm-chip">' + ico("fileText", 12) + " Project: " + esc(PROJECT) + "</span>" +
        searchWidgetHtml(false) +
        '<button class="pm-btn pm-btn-sm" data-test="close" data-close="1">' + ico("x", 12) + " Close Settings</button>" +
      "</div></div>";
  }
  function searchWidgetHtml(large) {
    return '<div class="t11-srwrap' + (large ? " t11-big" : "") + '">' +
      (large ? '<div class="t11-searchbig">' : '<div class="t11-srch">') +
      ico("search", large ? 16 : 13) +
      '<input data-test="search-input" type="text" placeholder="Search settings, managers, providers…" aria-label="Universal settings search" autocomplete="off">' +
      '<span class="pm-kbd">⌘K</span></div>' +
      '<div class="t11-drop" data-test="search-results" hidden></div></div>';
  }

  /* ---------------- universal search ---------------- */
  var GROUPS = [["setting", "Settings"], ["manager", "Managers"], ["managed_object", "Managed objects"], ["action", "Actions"], ["setup", "Setup"], ["diagnostic", "Diagnostics"], ["unavailable", "Not available"]];
  function dropHtml(res, q) {
    if (!res.length) return '<div class="t11-drop-cap">No results</div><div class="pm2-empty" style="margin:8px">No matches for “' + esc(q) + '”. Check spelling or try a shorter term — fuzzy matching is on.</div>';
    var html = "";
    GROUPS.forEach(function (g) {
      var rows = res.filter(function (r) { return r.type === g[0]; });
      if (!rows.length) return;
      html += '<div class="t11-drop-cap">' + g[1] + " (" + rows.length + ")</div>";
      rows.forEach(function (r) {

  function bindSearch(wrap) {

    function close() { drop.hidden = true; if (openDrop === drop) openDrop = null; selIdx = -1; }
    input.addEventListener("input", function () {
      var q = input.value;

    input.addEventListener("keydown", function (e) {
      var rows = Array.prototype.slice.call(drop.querySelectorAll(".t11-drop-row"));
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!rows.length) return;
        e.preventDefault();
        selIdx = e.key === "ArrowDown" ? Math.min(rows.length - 1, selIdx + 1) : Math.max(0, selIdx - 1);
        rows.forEach(function (r, i) { r.classList.toggle("sel", i === selIdx); });

      } else if (e.key === "Enter") {
        if (rows.length) pick(rows[Math.max(0, selIdx)].getAttribute("data-rid"), input.value);
      } else if (e.key === "Escape") { close(); e.stopPropagation(); }
    });
    drop.addEventListener("click", function (e) {
      var b = e.target.closest("[data-rid]");
      if (b) pick(b.getAttribute("data-rid"), input.value);

  function bindAll(root, q) {
    var host = root.querySelector("[data-test='vlist']");
    var gen = 0;
    var synRows = [];
    function synth() {
      if (synRows.length) return synRows;
      for (var i = 0; i < 2000; i++) synRows.push({ id: "syn-" + i, label: "Synthetic stress row " + (i + 1), desc: "Generated row to prove windowed virtualization; not product data.", type: "toggle", default: false, syn: true, tier: "standard" });
      return synRows;
    }
    function current() {
      var cat = root.querySelector("[data-facet='cat']").value;
      var type = root.querySelector("[data-facet='type']").value;
      var tier = root.querySelector("[data-facet='tier']").value;
      var changed = root.querySelector("[data-facet='changed']").checked;
      var managed = root.querySelector("[data-facet='managed']").checked;
      var syn = root.querySelector("[data-facet='syn']").checked;
      var data = D.settings.filter(function (s) {
        if (cat && s.id.split(".")[0] !== cat) return false;
        if (type && s.type !== type) return false;
        if (tier && (s.tier || "standard") !== tier) return false;
        var st = S2.getSetting(s.id);
        if (changed && (!st || st.source === "default")) return false;
        if (managed && (!st || (st.source !== "managed" && st.source !== "unavailable"))) return false;
        return true;
      });
      if (syn) data = data.concat(synth());
      return data;
    }
    var vl = M2.virtualList({
      host: host, rowHeight: 64,
      render: function (item) {
        var h = M2.row(item, item.syn ? null : S2.getSetting(item.id));
        if (item.syn) h = h.replace(esc(item.label), esc(item.label) + ' <span class="pm-badge pm-badge-muted">Synthetic</span>');
        return h;
      },
      data: [],
      onWindow: function (s, e, t) { host.setAttribute("data-window", s + ":" + e + ":" + t); }
    });
    vlist = vl;
    var lastTop = -1;
    host.addEventListener("scroll", function () { vl.refresh(); });
    var poll = setInterval(function () {
      if (!document.body.contains(host)) { clearInterval(poll); return; }
      if (host.scrollTop !== lastTop) { lastTop = host.scrollTop; vl.refresh(); }
    }, 120);
    function apply() {
      var g = ++gen;
      setTimeout(function () {
        if (g !== gen) return;
        var d = current();
        vl.set(d);
        root.querySelector("[data-allcount]").textContent = "Showing " + d.length + " of " + D.settings.length + (d.length > D.settings.length ? " (+" + (d.length - D.settings.length) + " synthetic)" : "");
      }, 30);
    }
    root.querySelectorAll("[data-facet]").forEach(function (el) { el.addEventListener("change", apply); });
    if (q.chg) root.querySelector("[data-facet='changed']").checked = true;
    apply();
  }

  /* ---------------- render + bind ---------------- */
  function render() {
    var r = parseHash();
    content.setAttribute("data-route", (location.hash || "#/home").replace(/^#/, ""));
    var name = r.parts[0] || "home";
    var html = "";
    if (name === "home" || name === "q") html = viewHome();
    else if (name === "cat") html = viewCat(r.parts[1], r.parts[2]);
    else if (name === "mgr") html = viewMgr(r.parts[1], r.parts[2], r.q);
    else if (name === "all") html = viewAll();
    else if (name === "copy") html = viewCopy();
    else if (name === "lifecycle") html = viewLifecycle();
    else html = viewHome();
    content.innerHTML = '<div class="t11-wrap">' + html + "</div>";
    M2.bindRows(content);
    bindFamilyRows(content);
    bindChrome(content);
    content.querySelectorAll(".t11-srwrap").forEach(bindSearch);
    if (name === "all") bindAll(content, r.q);
    if (name === "q") {
      var q = decodeURIComponent(r.parts.slice(1).join("/"));
      var input = content.querySelector(".t11-searchbig input") || content.querySelector("[data-test='search-input']");
      if (input) {
        input.value = q;
        var drop = input.closest(".t11-srwrap").querySelector("[data-test='search-results']");
        drop.innerHTML = dropHtml(SR.search(q), q); drop.hidden = false; openDrop = drop;
        input.focus();
      }
    }
    content.scrollTop = scrollMem[r.key] || 0;
    if (pendingLocate) {
      var pl = pendingLocate; pendingLocate = null;
      requestAnimationFrame(function () { locate(pl); });
    }
  }
  content.addEventListener("scroll", function () { scrollMem[parseHash().key] = content.scrollTop; });
  function locate(pl) {
    var el = null;
    if (pl.settingId) el = content.querySelector("[data-row='" + (window.CSS && CSS.escape ? CSS.escape(pl.settingId) : pl.settingId) + "']");
    else if (pl.row) el = content.querySelector("[data-frow='" + (window.CSS && CSS.escape ? CSS.escape(pl.row) : pl.row) + "']");
    else if (pl.section) el = content.querySelector(".t11-tabbody");
    else if (pl.object) el = content.querySelector(".t11-roster [aria-current='true']");
    if (el) {
      el.scrollIntoView({ block: "center" });
      el.classList.add("pm2-locate");
      var ctl = el.querySelector("button,input,select");
      if (ctl) ctl.focus({ preventScroll: true });
    }
  }
  function bindChrome(root) {
    root.querySelectorAll("[data-nav]").forEach(function (b) {
      b.addEventListener("click", function (e) { e.preventDefault(); nav(b.getAttribute("data-nav")); });
    });
    root.querySelectorAll("[data-back]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.getAttribute("data-backhome")) { if (history.length > 1) history.back(); else nav(""); return; }
        if (history.length > 1) history.back();
        else nav(b.getAttribute("data-fallback") || "");
      });
    });
    root.querySelectorAll("[data-close]").forEach(function (b) {
      b.addEventListener("click", function () { S2.receipt("Settings closed", "Returning to the " + PROJECT + " workspace. Every change made here applied to this Project only.", "info"); });
    });
    root.querySelectorAll("[data-notice]").forEach(function (b) {
      b.addEventListener("click", function () {
        var n = S2.notices().filter(function (x) { return x.id === b.getAttribute("data-notice"); })[0];
        if (!n || !n.dest) return;
        if (n.dest.kind === "manager") { pendingLocate = { object: n.dest.object || null, section: n.dest.section || null, row: null }; nav("mgr/" + n.dest.manager + (n.dest.object ? "/" + n.dest.object : "")); }
        else if (n.dest.kind === "route") nav(n.dest.hash.replace(/^#\/?/, ""));
      });
    });
    root.querySelectorAll("[data-provact]").forEach(function (b) {
      b.addEventListener("click", function () {
        var p = provById(b.getAttribute("data-prov")); if (!p) return;
        var act = b.getAttribute("data-provact");
        if (act === "install") {
          var op = S2.beginOp({ title: "Install " + p.name, phase: "Waiting for explicit confirmation", determinate: false, wait: "explicit user approval" });
          setTimeout(function () { installedLocal[p.id] = true; S2.finishOp(op, "completed", "Verified"); S2.receipt("Installation verified", p.name + " installed from the official source for this Host/Environment and selected. Simulated.", "ok"); render(); }, 900);
        } else if (act === "approve-update" || act === "schedule-update") {
          var op2 = S2.beginOp({ title: "Update " + p.name, phase: act === "approve-update" ? "Downloading signed build" : "Scheduled for next idle window", determinate: act === "approve-update", total: 3 });
          var n = 0;
          var t = setInterval(function () { n++; S2.advanceOp(op2, { completed: n }); if (n >= 3) { clearInterval(t); S2.finishOp(op2, "completed", "Updated"); S2.receipt("Update complete", p.name + " updated after explicit approval; verification passed.", "ok"); } }, 300);
        } else if (act === "defer-update") S2.receipt("Update deferred", p.name + " stays on the current generation. Ask-first policy respected.", "info");
        else if (act === "test") { var op3 = S2.beginOp({ title: "Probe " + p.name, phase: "Probing", determinate: false }); setTimeout(function () { S2.finishOp(op3, "completed", "Probe ok"); S2.receipt("Probe complete", p.name + " connection verified.", "ok"); }, 600); }
        else if (act === "demand-simulate" || act === "demand-resume" || act === "demand-open") {
          if (act === "demand-simulate") {
            if (demand && demand.id !== p.id) staleDemand[demand.id] = demand;
            demand = { id: p.id, op: "Chat run requesting " + p.name, token: demandToken() };
            S2.receipt("Provider Setup Required", p.name + " is not ready for the originating operation (" + demand.op + "). The operation is preserved with continuation token " + demand.token + ". Deep link: #/mgr/providers/" + p.id + "?sec=install. Resume only while the continuation is still current.", "info");
            render();
          } else if (act === "demand-resume") {
            if (demand && demand.id === p.id && provReady(p)) {
              S2.receipt("Operation resumed", demand.op + " resumes on " + p.name + "; continuation token " + demand.token + " matched the stored demand.", "ok");
              demand = null;
              render();
            }
          } else {
            nav("mgr/providers/" + p.id + "?sec=installations");
          }
          return;
        }
        else S2.receipt("Logs", (p.logs || []).join(" · ") || "No log entries.", "info");
      });
    });
    root.querySelectorAll("[data-copysrc]").forEach(function (b) {
      b.addEventListener("click", function () { copyState.source = b.getAttribute("data-copysrc"); copyState.step = 2; render(); });
    });
    root.querySelectorAll("[data-copycat]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var id = cb.getAttribute("data-copycat");
        if (cb.checked) { if (copyState.cats.indexOf(id) < 0) copyState.cats.push(id); }
        else copyState.cats = copyState.cats.filter(function (c) { return c !== id; });
        render();
      });
    });
    root.querySelectorAll("[data-copystep]").forEach(function (b) {
      b.addEventListener("click", function () {
        var st = +b.getAttribute("data-copystep");
        if (st === 3) { copyState.preview = C2.preview(copyState.source, copyState.cats); copyState.step = 3; }
        else if (st === 4) { copyState.applied = C2.apply(copyState.preview); copyState.step = 4; }
        else copyState.step = st;
        render();
      });
    });
    var rb = root.querySelector("[data-copyrollback]");
    if (rb) rb.addEventListener("click", function () { C2.rollbackLast(); copyState = { step: 1, source: null, cats: [], preview: null, applied: null }; render(); });
    root.querySelectorAll("[data-lc]").forEach(function (b) {
      b.addEventListener("click", function () {
        var a = b.getAttribute("data-lc");
        if (a === "export") S2.receipt("Export ready", D.settings.length + " Project settings exported (secrets excluded). Simulated.", "ok");
        else if (a === "import") S2.receipt("Import preview", S2.state.scenario === "import-conflict" ? "3 incoming values conflict with this Project. Review required before apply." : "No conflicts detected. Apply when ready.", S2.state.scenario === "import-conflict" ? "warn" : "info");
        else if (a === "migrate") S2.receipt("Legacy migration dry-run", "Inventory rows carrying legacy global scope would migrate to Project-owned values. No canon mutated; see plan-owner-delta.md.", "info");
        else if (a === "reset") {
          var rp = S2.createRestorePoint("Before reset");
          S2.receipt("Reset prepared", "Restore point " + rp.id + " created. Confirm reset to return every setting to default.", "warn");
        }
      });
    });
    root.querySelectorAll("[data-lcconflict]").forEach(function (b) {
      b.addEventListener("click", function () { S2.receipt(b.getAttribute("data-lcconflict") === "keep" ? "Kept current value" : "Took incoming value", D.byId(b.getAttribute("data-id")).label + " resolved for this import.", "ok"); });
    });
    root.querySelectorAll("[data-rollback]").forEach(function (b) {
      b.addEventListener("click", function () { S2.rollbackTo(b.getAttribute("data-rollback")); render(); });
    });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (document.querySelector(".pm-pop-menu")) { M2.closePopupMenu(); return; }
    if (openDrop) { openDrop.hidden = true; openDrop = null; return; }
    var r = parseHash();
    if ((r.parts[0] || "home") !== "home") nav("");
  });

  S2.subscribe(function (kind) {
    if (kind === "setting" || kind === "scenario" || kind === "rollback") {
      var keep = content.scrollTop;
      render();
      content.scrollTop = keep;
    }
  });

  window.addEventListener("hashchange", render);
  if (!location.hash) location.hash = "#/home";
  render();
})();
</script>
</body>
</html>
