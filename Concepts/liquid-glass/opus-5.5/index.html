<!doctype html>
<html lang="en" data-concept-model="Opus 5.5">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Glass: Usage and the left rail (Opus 5.5)</title>
<!-- The live concept without a generated copy: the published PMConcept7 in a frame, with src/lg.css, src/lg.js and the
     baked wallpapers injected when it loads (served over http by the Concept Hub, so the fetches are same-origin).
     tools/build_proto.py writes the same thing as one file for the share folder. -->
<style>
  html, body { margin: 0; height: 100%; background: #070a14; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  #msg { position: fixed; inset: auto 12px 12px auto; font: 12px/1.4 Inter, system-ui, sans-serif; color: #c8cfdc; }
</style>
</head>
<body>
<iframe id="lg-frame" title="PMConcept7 with the Liquid Glass concept" src="../../PMConcept7.html?o55=off"></iframe>
<div id="msg" role="status"></div>
<script>
(async function () {
  var frame = document.getElementById('lg-frame'), msg = document.getElementById('msg');
  var parts;
  try {
    parts = await Promise.all([fetch('src/lg.css').then(function (r) { return r.text(); }), fetch('src/lg.js').then(function (r) { return r.text(); }),
      fetch('src/wallpapers.json').then(function (r) { return r.json(); })]);
  } catch (e) { msg.textContent = 'Open this page through the Concept Hub (http), or open the share folder copy built by tools/build_proto.py.'; return; }
  function inject() {
    var d = frame.contentDocument;
    if (!d || !d.body || d.readyState === 'loading' || !/PMConcept7\.html/.test(d.URL) || d.getElementById('lg-css')) return;
    var vars = Object.keys(parts[2].images).sort().map(function (k) { return '--lg-' + k.replace('_', '-') + ': url(' + parts[2].images[k].data_uri + ');'; }).join('\n');
    var st = d.createElement('style'); st.id = 'lg-css'; st.textContent = 'html {\n' + vars + '\n}\n' + parts[0]; d.head.appendChild(st);
    var sc = d.createElement('script'); sc.id = 'lg-js'; sc.textContent = parts[1]; d.body.appendChild(sc);
  }
  /* inject once the framed page itself is parsed (not the frame's first about:blank), and again after any reload */
  frame.addEventListener('load', inject);
  setInterval(inject, 300);
})();
/* Concept Hub bridge: the Hub's look and Reduced Motion go to the framed page (a look name like glass-dark becomes the
   page's own setting, so everything that listens to it follows) */
(function () {
  var frame = document.getElementById('lg-frame'), pending = null;
  function apply(state) {
    var w = frame.contentWindow, d = frame.contentDocument;
    if (!w || !d || !w.PM12_KIMI) { pending = state; return; }
    if (state.theme) {
      var name = state.theme.split('-').map(function (s) { return s.charAt(0).toUpperCase() + s.slice(1); }).join(' ');
      try { w.PM12_KIMI.setSettingFromHost('general.visual.theme', name); } catch (e) { d.documentElement.setAttribute('data-theme', state.theme); }
      if (w.PM_PAGES) w.PM_PAGES.go('usage');
    }
    if (state.reducedMotion) d.documentElement.setAttribute('data-motion', 'reduced'); else if (d.documentElement.getAttribute('data-motion') === 'reduced') d.documentElement.removeAttribute('data-motion');
  }
  window.addEventListener('message', function (event) {
    var m = event.data;
    if (!m || m.source !== 'pm-concept-hub' || m.type !== 'pm-concept-state') return;
    apply(m.state || {});
  });
  setInterval(function () { if (pending) { var s = pending; pending = null; apply(s); } }, 500);
  if (window.parent !== window) window.parent.postMessage({ source: 'pm-concept', type: 'pm-concept-ready', version: 1, capabilities: { theme: true, reducedMotion: true, testWidth: false } }, '*');
})();
</script>
</body>
</html>
