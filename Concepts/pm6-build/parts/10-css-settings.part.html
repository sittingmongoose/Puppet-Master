<style id="pm4-settings-css">
/* ============================================================
   Concept 4 — "Spotlight": search-first settings
   Prefix: s4-   Palette: existing CSS vars only
   ============================================================ */

/* ---------- shell / stage ---------- */
.s4-shell {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  font-family: var(--body-font);
  color: var(--text-primary);
  position: relative;
}
.s4-stage {
  max-width: 980px;
  margin: 0 auto;
  padding: clamp(12px, 2vh, 24px) var(--xl) 96px;
  display: flex;
  flex-direction: column;
  gap: var(--xl);
}
.s4-stage.s4-searching { gap: var(--lg); }

/* ---------- hero ---------- */
.s4-hero {
  text-align: center;
  padding-top: clamp(0px, 1vh, 12px);
  transition: padding 0.45s cubic-bezier(0.34, 1.2, 0.64, 1);
}
.s4-searching .s4-hero { padding-top: 0; }
.s4-kicker {
  font-family: var(--display-font);
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--text-muted);
  animation: s4-drop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.s4-title {
  font-family: var(--display-font);
  font-size: clamp(20px, 3.2vw, 30px);
  margin: var(--md) 0 var(--xl);
  letter-spacing: 1px;
  animation: s4-drop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.06s both;
  transition: font-size 0.35s ease, margin 0.35s ease, opacity 0.35s ease;
}
.s4-searching .s4-title { font-size: 15px; opacity: 0.55; margin: var(--sm) 0 var(--md); }

/* ---------- the big bar ---------- */
.s4-bar {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--md);
  max-width: 640px;
  margin: 0 auto;
  padding: 0 var(--xl);
  height: 62px;
  background: var(--surface-elevated);
  border: var(--border-width) solid var(--border-light);
  border-radius: calc(var(--border-radius) + 10px);
  box-shadow: 0 6px 30px color-mix(in srgb, var(--accent-blue) 8%, transparent);
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
              border-color 0.3s ease, box-shadow 0.3s ease, height 0.3s ease;
  animation: s4-drop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.12s both;
}
.s4-bar.s4-focus {
  transform: scale(1.035);
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-blue) 18%, transparent),
              0 14px 44px color-mix(in srgb, var(--accent-blue) 22%, transparent);
}
.s4-searching .s4-bar { height: 52px; }
.s4-bar-icon { color: var(--text-muted); display: flex; transition: color 0.3s ease, transform 0.3s ease; }
.s4-bar.s4-focus .s4-bar-icon { color: var(--accent-blue); transform: scale(1.1) rotate(-8deg); }
.s4-input {
  flex: 1;
  background: transparent;
  border: 0;
  outline: 0;
  color: var(--text-primary);
  font-family: var(--body-font);
  font-size: 19px;
  min-width: 0;
  z-index: 1;
}
.s4-ghost {
  position: absolute;
  left: 58px; right: 52px;
  font-size: 19px;
  color: var(--text-muted);
  pointer-events: none;
  text-align: left;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  animation: s4-ghost-cycle 3.5s ease infinite;
}
.s4-ghost.s4-off { display: none; }
.s4-clear {
  border: 0;
  background: color-mix(in srgb, var(--text-muted) 18%, transparent);
  color: var(--text-secondary);
  width: 26px; height: 26px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 12px;
  line-height: 1;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease;
}
.s4-clear:hover { transform: scale(1.15) rotate(90deg); background: color-mix(in srgb, var(--accent-error) 30%, transparent); }
.s4-hint {
  margin-top: var(--lg);
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  animation: s4-drop-in 0.5s ease 0.2s both;
  transition: opacity 0.3s ease;
}
.s4-hint b { color: var(--text-secondary); font-weight: 600; }
.s4-searching .s4-hint { opacity: 0; height: 0; margin: 0; overflow: hidden; }

/* ---------- category chip rail ---------- */
.s4-chiprail {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--md);
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.s4-searching .s4-chiprail { opacity: 0.35; }
.s4-searching .s4-chiprail:hover { opacity: 1; }
.s4-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px 7px 10px;
  background: var(--surface-elevated);
  border: var(--border-width) solid var(--border-light);
  border-radius: calc(var(--border-radius) + 20px);
  color: var(--text-secondary);
  font-family: var(--body-font);
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: 0.4px;
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
              border-color 0.2s ease, color 0.2s ease, box-shadow 0.25s ease;
  animation: s4-drop-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.s4-chip:hover {
  transform: translateY(-2px) scale(1.05);
  border-color: var(--accent-blue);
  color: var(--text-primary);
  box-shadow: 0 6px 18px color-mix(in srgb, var(--accent-blue) 20%, transparent);
}
.s4-chip:active { transform: scale(0.96); }
.s4-chip .s4-chip-ico { font-size: 15px; }
.s4-chip .s4-chip-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent-warning);
  margin-left: 2px;
  animation: s4-pulse 2s ease infinite;
}

/* ---------- shelves ---------- */
.s4-shelves { display: flex; flex-direction: column; gap: var(--xl); transition: opacity 0.25s ease, transform 0.25s ease; }
.s4-shelves.s4-hidden { display: none; }
.s4-shelf { animation: s4-rise 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) both; }
.s4-shelf:nth-child(2) { animation-delay: 0.08s; }
.s4-shelf:nth-child(3) { animation-delay: 0.16s; }
.s4-shelf-head {
  display: flex;
  align-items: baseline;
  gap: var(--md);
  margin-bottom: var(--md);
}
.s4-shelf-title {
  font-family: var(--display-font);
  font-size: 12px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--text-secondary);
}
.s4-shelf-sub { font-size: 12px; color: var(--text-muted); }
.s4-rail {
  display: flex;
  gap: var(--lg);
  overflow-x: auto;
  scroll-snap-type: x proximity;
  /* glow gutter (shell polish): 12px scrollport room so the first/last
     card's hover ring + glow are not clipped by the rail's own scrollport;
     negative margins cancel the layout shift (cards keep their spot). */
  padding: 12px 12px var(--lg);
  margin: calc(-1 * (12px - var(--sm))) -12px 0;
  scroll-padding-inline: 12px;   /* keep snap from re-hiding the gutter */
}
.s4-card {
  position: relative;
  overflow: hidden;
  scroll-snap-align: start;
  flex: 0 0 236px;
  background: var(--surface-elevated);
  border: var(--border-width) solid var(--border-light);
  border-radius: calc(var(--border-radius) + 8px);
  padding: var(--lg);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: var(--sm);
  min-height: 96px;
  text-align: left;
  transition: transform var(--motion-med) var(--ease-default),
              border-color 0.2s ease, box-shadow var(--motion-med) var(--ease-default);
}
/* hover lift + accent ring come from the shared .pm-sheen utility
   (pm6-css-global; no sweep); the card only tints its boundary here */
.s4-card:hover {
  transform: translateY(-4px);
  border-color: color-mix(in srgb, var(--accent-primary) 45%, var(--border-light));
  box-shadow: var(--elev-hover);
}
.s4-card:active, .s4-card.pm-sheen:active { transform: translateY(-1px) scale(0.98); }
.s4-card-top { display: flex; align-items: center; gap: var(--md); font-size: 12px; color: var(--text-muted); }
.s4-card-label { font-weight: 700; font-size: 15px; color: var(--text-primary); line-height: 1.25; }
.s4-card-note { font-size: 12.5px; color: var(--text-secondary); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- status pills ---------- */
.s4-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 20px;
  white-space: nowrap;
}
.s4-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s4-pill.ok { color: var(--accent-lime); background: color-mix(in srgb, var(--accent-lime) 12%, transparent); }
.s4-pill.needs-setup { color: var(--accent-warning); background: color-mix(in srgb, var(--accent-warning) 14%, transparent); }
.s4-pill.attention { color: var(--accent-error); background: color-mix(in srgb, var(--accent-error) 14%, transparent); }
.s4-pill.attention::before { animation: s4-pulse 1.6s ease infinite; }

/* ---------- results ---------- */
.s4-results { display: flex; flex-direction: column; gap: var(--sm); }
.s4-res-cat {
  display: flex;
  align-items: center;
  gap: var(--md);
  margin: var(--lg) 0 var(--sm);
  font-family: var(--display-font);
  font-size: 11px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  animation: s4-cascade 0.35s cubic-bezier(0.34, 1.4, 0.64, 1) both;
}
.s4-res-cat::after { content: ""; flex: 1; height: 1px; background: var(--border-light); }
.s4-res-count {
  text-align: center;
  font-size: 12.5px;
  color: var(--text-muted);
  padding: var(--sm) 0;
  animation: s4-drop-in 0.3s ease both;
}
.s4-res-empty {
  text-align: center;
  padding: 40px 0 20px;
  color: var(--text-muted);
  font-size: 15px;
  animation: s4-drop-in 0.35s ease both;
}
.s4-res-empty .s4-res-empty-ico { font-size: 30px; display: block; margin-bottom: var(--md); animation: s4-wobble 2.4s ease infinite; }

/* ---------- setting rows (shared: results + panel) ---------- */
.s4-row {
  display: flex;
  align-items: center;
  gap: var(--lg);
  padding: 11px var(--lg);
  background: var(--surface-elevated);
  border: var(--border-width) solid var(--border-light);
  border-radius: calc(var(--border-radius) + 6px);
  transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.25s ease;
  animation: s4-cascade 0.35s cubic-bezier(0.34, 1.4, 0.64, 1) both;
  scroll-margin: 80px;
}
.s4-row:hover { border-color: color-mix(in srgb, var(--accent-blue) 55%, var(--border-light)); }
.s4-row.s4-active {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-blue) 20%, transparent);
  transform: translateX(3px);
}
.s4-row.s4-glow { animation: s4-editglow 0.9s ease; }
.s4-row.s4-flash { animation: s4-editglow 1.4s ease 2; }
.s4-row-main { flex: 1; min-width: 0; }
.s4-row-labelline { display: flex; align-items: center; gap: var(--md); flex-wrap: wrap; }
.s4-row-label { font-weight: 700; font-size: 14.5px; color: var(--text-primary); letter-spacing: 0.2px; }
.s4-row-desc {
  font-size: 12.5px;
  color: var(--text-secondary);
  line-height: 1.4;
  margin-top: 2px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.s4-row-origin { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-style: italic; }
.s4-row-origin::before { content: "\21B3  "; font-style: normal; }
.s4-row-ctl { flex-shrink: 0; display: flex; align-items: center; gap: var(--md); max-width: 46%; }
.s4-hl {
  background: color-mix(in srgb, var(--accent-warning) 32%, transparent);
  color: inherit;
  border-radius: 3px;
  padding: 0 1px;
}

/* badges + scope chips */
.s4-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.6px;
  padding: 1px 7px;
  border-radius: 12px;
  cursor: help;
  border: 1px solid transparent;
}
.s4-badge.restart { color: var(--accent-orange); background: color-mix(in srgb, var(--accent-orange) 12%, transparent); }
.s4-badge.adjudication { color: var(--accent-magenta); background: color-mix(in srgb, var(--accent-magenta) 12%, transparent); }
.s4-badge.new { color: var(--accent-lime); background: color-mix(in srgb, var(--accent-lime) 12%, transparent); animation: s4-pulse 2.6s ease infinite; }
.s4-scope {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  border: 1px solid var(--border-light);
  padding: 1px 6px;
  border-radius: 10px;
}
/* closed-vocab disabled-reason chip (e.g. Glass Transparency outside Glass themes) */
.pm6-settings-reason {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--text-muted);
  border: 1px dashed var(--border-light);
  border-radius: var(--radius-pill);
  padding: 1px 7px;
  cursor: help;
  white-space: nowrap;
}

/* ---------- controls ---------- */
.s4-toggle {
  position: relative;
  width: 46px; height: 26px;
  border-radius: 26px;
  border: var(--border-width) solid var(--border-light);
  background: color-mix(in srgb, var(--text-muted) 15%, transparent);
  cursor: pointer;
  transition: background 0.25s ease, border-color 0.25s ease;
  flex-shrink: 0;
  padding: 0;
}
.s4-toggle .s4-knob {
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--text-secondary);
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.25s ease, width 0.15s ease;
}
.s4-toggle:active .s4-knob { width: 23px; }
.s4-toggle[aria-pressed="true"] {
  background: color-mix(in srgb, var(--accent-lime) 30%, transparent);
  border-color: var(--accent-lime);
}
.s4-toggle[aria-pressed="true"] .s4-knob { transform: translateX(20px); background: var(--accent-lime); }
.s4-toggle[aria-pressed="true"]:active .s4-knob { transform: translateX(15px); }

.s4-select {
  font-family: var(--body-font);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  background: var(--surface);
  border: var(--border-width) solid var(--border-light);
  border-radius: calc(var(--border-radius) + 4px);
  padding: 5px 8px;
  max-width: 210px;
  cursor: pointer;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.s4-select:hover, .s4-select:focus { border-color: var(--accent-blue); outline: none; }
.s4-select:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-blue) 18%, transparent); }

.s4-text, .s4-num {
  font-family: var(--body-font);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--surface);
  border: var(--border-width) solid var(--border-light);
  border-radius: calc(var(--border-radius) + 4px);
  padding: 5px 9px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.s4-text { width: 180px; }
.s4-num { width: 86px; text-align: right; }
.s4-text:focus, .s4-num:focus { border-color: var(--accent-blue); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-blue) 18%, transparent); }
.s4-pathwrap { display: flex; align-items: center; gap: var(--sm); }
.s4-pathwrap .s4-text { width: 170px; font-size: 12px; }
.s4-browse {
  border: var(--border-width) solid var(--border-light);
  background: var(--surface);
  border-radius: calc(var(--border-radius) + 4px);
  padding: 4px 8px;
  cursor: pointer;
  font-size: 13px;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease;
}
.s4-browse:hover { transform: scale(1.1); border-color: var(--accent-blue); }

.s4-sliderwrap { display: flex; align-items: center; gap: var(--md); width: 190px; }
.s4-slider { flex: 1; accent-color: var(--accent-blue); cursor: pointer; }
.s4-bubble {
  min-width: 46px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent-blue);
  background: color-mix(in srgb, var(--accent-blue) 12%, transparent);
  border-radius: 12px;
  padding: 2px 7px;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.s4-sliderwrap:active .s4-bubble { transform: scale(1.2); }

.s4-seg {
  display: inline-flex;
  border: var(--border-width) solid var(--border-light);
  border-radius: calc(var(--border-radius) + 5px);
  overflow: hidden;
  background: var(--surface);
  max-width: 300px;
  flex-wrap: wrap;
}
.s4-seg button {
  border: 0;
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--body-font);
  font-size: 12px;
  font-weight: 700;
  padding: 5px 11px;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}
.s4-seg button:hover { color: var(--text-primary); }
.s4-seg button.active { background: var(--accent-blue); color: var(--surface-elevated); }

.s4-editbtn, .s4-action {
  border: var(--border-width) solid var(--border-light);
  background: var(--surface);
  color: var(--text-primary);
  font-family: var(--body-font);
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.4px;
  padding: 6px 13px;
  border-radius: calc(var(--border-radius) + 5px);
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
}
.s4-editbtn:hover, .s4-action:hover { transform: translateY(-1px) scale(1.04); border-color: var(--accent-blue); }
.s4-action { border-color: color-mix(in srgb, var(--accent-blue) 60%, var(--border-light)); color: var(--accent-blue); }
.s4-action.s4-working { color: var(--accent-warning); border-color: var(--accent-warning); pointer-events: none; animation: s4-pulse 1s ease infinite; }
.s4-action.s4-done { color: var(--accent-lime); border-color: var(--accent-lime); transform: scale(1.05); }
.s4-editbtn .s4-count { color: var(--text-muted); font-weight: 600; }

.s4-swatchwrap { display: flex; align-items: center; gap: var(--md); }
.s4-swatch {
  width: 26px; height: 26px;
  border-radius: 8px;
  border: var(--border-width) solid var(--border-light);
  cursor: pointer;
  padding: 0;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.s4-swatch:hover { transform: scale(1.15) rotate(6deg); }

.s4-mchips { display: flex; flex-wrap: wrap; gap: 6px; max-width: 290px; justify-content: flex-end; }
.s4-mchip {
  border: var(--border-width) solid var(--border-light);
  background: var(--surface);
  color: var(--text-muted);
  font-family: var(--body-font);
  font-size: 11.5px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
}
.s4-mchip:hover { transform: scale(1.07); }
.s4-mchip.on {
  color: var(--accent-blue);
  border-color: var(--accent-blue);
  background: color-mix(in srgb, var(--accent-blue) 12%, transparent);
}

/* disabled-looking but focusable */
.s4-row.s4-locked .s4-row-ctl { opacity: 0.45; }
.s4-row.s4-locked .s4-row-ctl > * { cursor: not-allowed; }

/* ---------- inline expanding editor (list / keyvalue) ---------- */
.s4-expand {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.s4-expand.open { grid-template-rows: 1fr; }
.s4-expand-inner { overflow: hidden; min-height: 0; }
.s4-editor {
  margin: var(--sm) 0 var(--md) var(--xl);
  padding: var(--lg);
  background: var(--surface);
  border: var(--border-width) dashed var(--border-light);
  border-radius: calc(var(--border-radius) + 6px);
  display: flex;
  flex-direction: column;
  gap: var(--sm);
}
.s4-editor-row { display: flex; align-items: center; gap: var(--md); animation: s4-cascade 0.3s ease both; }
.s4-editor-row .s4-text { flex: 1; width: auto; }
.s4-editor-key { width: 34%; }
.s4-editor-del {
  border: 0;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  padding: 3px 6px;
  border-radius: 6px;
