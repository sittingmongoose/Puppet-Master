<style id="pm6-css-cozy-shelves">
/* ============================================================================
   Cozy Shelves panel layer — ported from Concepts/rail-concepts (c2 winning
   concept + c2 files concept + _shared/base.css primitives) per the 2026-07-27
   Cozy Shelves reconciliation. Contracts: Concepts/ChatGuiUpdates2.md
   "Cozy Shelves rail concepts (2026-07-27)" and Plans/FinalGUISpec.md
   F3-471..F3-481 (width envelope 240/280/480, unified shelf expander, motion
   portability map, --cat-* palette indirection, one-shot panel enter,
   measure-based label fitting, unclipped portal popups, direct-child chevron
   rule). No raw hex outside [data-theme]-scoped rules (check_css gate).
   ============================================================================ */

/* ---- cat token layer + reduced-motion supplement + icon sizing (from _shared/base.css) ---- */
/* ---------------------------------------------------------------------------
   Category palette layer (concept-layer addition, promotes to the PM7 token sections).
   Shelf category tints bind to --cat-* indirection tokens, NEVER directly to
   accent tokens: in retro-dark --accent-primary IS --accent-lime, and in
   basic-light warning==orange and magenta reads as error. Defaults alias the
   current colors (6 of 8 themes render pixel-identical); only the colliding
   themes override, using colors already in their own token tables.
   --accent-primary stays reserved for selection / primary action.
   --------------------------------------------------------------------------- */
:root {
  --cat-blue: var(--accent-blue);
  --cat-green: var(--accent-lime);
  --cat-purple: var(--accent-magenta);
  --cat-amber: var(--accent-orange);
  --cat-warn: var(--accent-warning);
  --cat-neutral: var(--text-muted);
  --cat-fail: var(--graph-failed);
}
[data-theme="retro-dark"] {
  --cat-green: #4CAF50; /* its --graph-passed; frees #00FF41 for selection only */
  --cat-blue: #2196F3;  /* its --graph-planning; fixes 2.06:1 ink on #1A1A1A */
}
[data-theme="basic-light"] {
  --cat-purple: #9C27B0; /* its --graph-gating; splits from error red */
  --cat-amber: #F57C00;  /* splits category amber from --accent-warning */
}

/* Reduced-motion supplement: the theme kill-switch zeroes durations but not
   delays, so closed sprout menus lingered ~220ms as inert ghosts and late
   scroll-reveals snapped in after their stagger delay. */
html[data-reduced-motion="1"] *,
html[data-motion="reduced"] *,
html[data-reduced-motion="1"] *::before,
html[data-motion="reduced"] *::before,
html[data-reduced-motion="1"] *::after,
html[data-motion="reduced"] *::after { transition-delay: 0ms !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-delay: 0ms !important; }
}
svg { display: block; flex-shrink: 0; }
/* icon placeholder hydration targets: <i data-ico="name" class="pm-ico ..."> */
i[data-ico] { display: inline-flex; align-items: center; justify-content: center; }
i[data-ico] > svg { width: 100%; height: 100%; display: block; }
.pm-ico { width: 14px; height: 14px; }
.pm-ico.sm { width: 11px; height: 11px; }
.pm-ico.lg { width: 18px; height: 18px; }

/* ---- menu portal/ctx additions (from _shared/base.css) ---- */
.pm6-tb-menu-left, .pm6-tb-menu.pm6-tb-menu-left { right: auto; left: 0; --pm6-sprout-ox: 12%; }
.pm-ctx-menu { position: fixed; max-height: 70vh; overflow-y: auto; }
body > .pm6-tb-menu.is-open,
body > .pm6-tb-menu.is-closing { z-index: 400; }
.pm6-tb-menu-meta { flex: none !important; font-size: 10px; color: var(--text-muted); font-weight: 500; }

/* ---- one-shot panel enter (from _shared/base.css) ---- */
#sidePanelSlot .side-panel-view { position: relative; }
.side-panel-view.active.pm-panel-enter { animation: railPanelIn .22s var(--ease-out); }
@keyframes railPanelIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
.pm-hidden { display: none !important; }

/* ---- cozy primitives (from _shared/base.css) ---- */
.pm-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 9.5px; font-weight: 700; letter-spacing: .04em;
  padding: 1.5px 7px; border-radius: var(--radius-pill);
  background: var(--accent-soft); color: var(--accent-primary);
  border: 1px solid color-mix(in srgb, var(--accent-primary) 28%, transparent);
  white-space: nowrap; flex: none;
  max-width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis;
}
.pm-chip .chip-full, .pm-chip .chip-abbr { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pm-chip-ok { background: color-mix(in srgb, var(--graph-passed) 14%, transparent); color: var(--graph-passed); border-color: color-mix(in srgb, var(--graph-passed) 32%, transparent); }
.pm-chip-warn { background: color-mix(in srgb, var(--accent-warning) 14%, transparent); color: var(--accent-warning); border-color: color-mix(in srgb, var(--accent-warning) 32%, transparent); }
.pm-chip-err { background: color-mix(in srgb, var(--graph-failed) 14%, transparent); color: var(--graph-failed); border-color: color-mix(in srgb, var(--graph-failed) 32%, transparent); }

.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot-ok { background: var(--graph-passed); }
.dot-err { background: var(--graph-failed); }
.dot-warn { background: var(--accent-warning); }
.dot-run { background: var(--graph-running); animation: dotPulse 1.4s var(--ease-out) infinite; }
.dot-idle { background: var(--graph-pending); }
@keyframes liveRail { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes dotPulse { 0%, 100% { opacity: .45; transform: scale(1); } 50% { opacity: 1; transform: scale(1.25); } }

.pm-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: .02em;
  padding: 6px 10px; min-height: 28px;
  background: var(--surface-elevated);
  border: var(--border-width-inner, var(--border-width)) solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  transition: color var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out),
    background var(--motion-fast) var(--ease-out), box-shadow var(--motion-fast) var(--ease-out),
    transform var(--motion-fast) var(--ease-out);
  white-space: nowrap;
}
.pm-btn svg { width: 12px; height: 12px; }
.pm-btn:hover { color: var(--text-primary); border-color: color-mix(in srgb, var(--accent-primary) 45%, var(--border)); box-shadow: var(--elev-1); }
/* press feedback consolidated in the motion layer (scale .96) — keep one rule */
.pm-btn[disabled], .pm-btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; box-shadow: none; }
.pm-btn-primary {
  background: color-mix(in srgb, var(--accent-primary) 16%, var(--surface-elevated));
  border-color: color-mix(in srgb, var(--accent-primary) 40%, transparent);
  color: var(--text-primary);
}
.pm-btn-primary:hover { background: color-mix(in srgb, var(--accent-primary) 26%, var(--surface-elevated)); }
.pm-minibtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; flex: none;
  border: 1px solid var(--border-light); border-radius: var(--radius-xs);
  color: var(--text-muted); background: transparent;
  transition: all var(--motion-fast) var(--ease-out);
}
.pm-minibtn svg { width: 12px; height: 12px; }
.pm-minibtn:hover { color: var(--text-primary); border-color: var(--border); background: var(--surface-elevated); }
.pm-minibtn.danger:hover { color: var(--accent-error); border-color: color-mix(in srgb, var(--accent-error) 50%, transparent); background: color-mix(in srgb, var(--accent-error) 8%, transparent); }
.pm-minibtn[disabled], .pm-minibtn[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }

.pm-input {
  display: flex; align-items: center; gap: var(--md);
  background: var(--surface-elevated);
  border: var(--border-width-inner, var(--border-width)) solid var(--border-light);
  border-radius: var(--radius-sm);
  padding: 6px 9px; color: var(--text-muted);
  transition: border-color var(--motion-fast) var(--ease-out), box-shadow var(--motion-fast) var(--ease-out);
}
.pm-input:focus-within { border-color: color-mix(in srgb, var(--accent-primary) 55%, transparent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pm-input input { flex: 1; min-width: 0; background: none; border: none; outline: none; font-size: 12px; color: var(--text-primary); }
.pm-input input::placeholder { color: var(--text-muted); }
.pm-input-ico { width: 13px; height: 13px; }

.pm-btnrow { display: flex; gap: var(--sm); margin-bottom: var(--md); }
.pm-btnrow .pm-btn { flex: 1; min-width: 0; }
.pm-footnote { font-size: 10px; color: var(--text-muted); line-height: 1.45; padding: 2px 0 var(--md); }
.pm-note {
  display: flex; gap: var(--md); align-items: flex-start;
  font-size: 10.5px; color: var(--text-secondary); line-height: 1.45;
  background: color-mix(in srgb, var(--accent-warning) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent-warning) 24%, transparent);
  border-radius: var(--radius-sm);
  padding: var(--md);
  margin-bottom: var(--md);
}
.pm-note svg { width: 13px; height: 13px; color: var(--accent-warning); margin-top: 1px; }
.pm-note-glyph { flex: none; }
.pm-empty { font-size: 10.5px; color: var(--text-muted); padding: var(--md); border: 1px dashed var(--border-light); border-radius: var(--radius-sm); margin-bottom: var(--md); }

/* segmented chip row (docker subviews, artifact filters) */
.pm-chiprow { display: flex; flex-wrap: wrap; gap: var(--sm); padding: 0 var(--lg) var(--md); flex: none; }
.pm-chipbtn {
  font-size: 10px; font-weight: 700; letter-spacing: .03em;
  padding: 4px 9px; border-radius: var(--radius-pill);
  border: 1px solid var(--border-light); color: var(--text-secondary); background: none; cursor: pointer;
  transition: all var(--motion-fast) var(--ease-out); white-space: nowrap;
}
.pm-chipbtn:hover { color: var(--text-primary); border-color: var(--border); }
.pm-chipbtn.active { color: var(--accent-primary); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent-primary) 38%, transparent); }
.pm-gs { font-family: var(--mono-font); font-size: 9px; font-weight: 700; width: 13px; height: 13px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-xs); margin-left: auto; flex: none; }
.pm-gs-mod { color: var(--accent-warning); background: color-mix(in srgb, var(--accent-warning) 14%, transparent); }
.pm-gs-staged { color: var(--graph-passed); background: color-mix(in srgb, var(--graph-passed) 14%, transparent); }

/* ---- accordion spring + acc inner (from _shared/base.css) ---- */
/* spring accordions: the body animates its row track 0fr -> 1fr. chrome.js
   wraps the body's children in .pm-acc-inner (the required overflow clip). */
[data-acc] > .cr-acc-b,
[data-acc] > .sh-wt-b,
[data-acc] > .sh-accb,
[data-acc] > .sr-wt-b,
[data-acc] > .st-wt-b,
[data-acc] > .bA-accb,
[data-acc] > .bB-accb,
[data-acc] > .dA-accb,
[data-acc] > .dB-accb,
[data-acc] > .aA-accb,
[data-acc] > .aB-accb {
  display: grid !important;
  grid-template-rows: 0fr;
  opacity: 0;
  transition: grid-template-rows var(--motion-med) var(--ease-spring),
    opacity var(--motion-med) var(--ease-out);
}
[data-acc].open > .cr-acc-b,
[data-acc].open > .sh-wt-b,
[data-acc].open > .sh-accb,
[data-acc].open > .sr-wt-b,
[data-acc].open > .st-wt-b,
[data-acc].open > .bA-accb,
[data-acc].open > .bB-accb,
[data-acc].open > .dA-accb,
[data-acc].open > .dB-accb,
[data-acc].open > .aA-accb,
[data-acc].open > .aB-accb { grid-template-rows: 1fr; opacity: 1; }
.pm-acc-inner { overflow: hidden; min-height: 0; }

/* ---- live shimmer + grain (from _shared/base.css) ---- */
.pm-live { position: relative; overflow: hidden; }
.pm-live::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent-primary) 11%, transparent), transparent);
  transform: translateX(-100%);
  animation: pmShimmer 2s var(--ease-out) infinite;
}
@keyframes pmShimmer { 0% { transform: translateX(-100%); } 60%, 100% { transform: translateX(100%); } }

/* a gentle, theme-tied ambient grain on the side panel so it never reads flat */
.side-panel-view::before {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(120% 60% at 0% 0%, color-mix(in srgb, var(--accent-primary) 5%, transparent), transparent 55%);
  opacity: .8;
}
.side-panel-view > * { position: relative; z-index: 1; }

/* ===========================================================================
   POLISH LAYER — fill cards, occupancy, wide-band enrichment, glass edge,
   living home backdrop. All shared so every concept stays consistent.
   =========================================================================== */

/* ---- sumcard/occ/li/acts/rmetric/2col + wtier shrinks (from _shared/base.css) ---- */
.pm-sumcard { border: 1px solid var(--border-light); border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--surface-elevated) 72%, transparent);
  padding: var(--md) var(--lg); margin-top: var(--md); }
.pm-sumcard-h { font-family: var(--display-font); font-size: 8.5px; letter-spacing: 1.3px;
  color: var(--text-muted); margin-bottom: var(--sm); display: flex; align-items: center; gap: var(--md); }
.pm-sumcard-h .c { margin-left: auto; font-family: var(--mono-font); color: var(--text-secondary); letter-spacing: 0; font-size: 9px; }
/* occupancy / meter row */
.pm-occ { display: flex; align-items: center; gap: var(--md); padding: 3px 0; font-size: 10px; min-width: 0; }
.pm-occ .nm { flex: 0 1 auto; max-width: 46%; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pm-occ .bar { flex: 1 1 auto; height: 5px; border-radius: 3px; background: var(--border-light); overflow: hidden; min-width: 24px; }
.pm-occ .bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent-lime); transition: width .6s var(--ease-out); }
.pm-occ .bar.warn i { background: var(--accent-warning); }
.pm-occ .bar.err i { background: var(--graph-failed); }
.pm-occ .v { flex: none; font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); }
/* compact list row inside a sumcard */
.pm-li { display: flex; align-items: center; gap: var(--md); padding: 4px 0; min-width: 0;
  border-top: 1px solid var(--border-light); }
.pm-li:first-of-type { border-top: none; }
.pm-li .dot { width: 7px; height: 7px; }
.pm-li-n { flex: 0 1 auto; max-width: 50%; font-size: 10.5px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pm-li-m { flex: 1 1 auto; min-width: 0; font-size: 9.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.pm-acts { display: flex; flex-wrap: wrap; gap: var(--sm); margin-top: var(--md); }
.pm-acts .pm-btn { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* right-aligned inline metric — hidden until the wide band, where it makes
   stretched rows earn their width (F3-196: richer at 480+) */
.pm-rmetric { display: none; margin-left: auto; flex: none; align-items: center; gap: 4px;
  font-family: var(--mono-font); font-size: 9.5px; color: var(--text-muted); white-space: nowrap; }
.side-panel-slot[data-wtier="wide"] .pm-rmetric { display: inline-flex; }
/* 2-col opt-in at the wide band */
.side-panel-slot[data-wtier="wide"] .pm-2col { display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--lg); }

/* responsive: at the mid band, shrink the chips that flank a receipt title so
   the title is not crushed to a sliver */
.side-panel-slot[data-wtier="mid"] .cr-fam,
.side-panel-slot[data-wtier="mid"] .sh-fam,
.side-panel-slot[data-wtier="mid"] .st-fam,
.side-panel-slot[data-wtier="mid"] .pt-fam,
.side-panel-slot[data-wtier="mid"] .sr-fam { font-size: 7.5px; padding: 1px 5px; }
.side-panel-slot[data-wtier="mid"] .cr-r1 > .pm-chip,
.side-panel-slot[data-wtier="mid"] .sh-r1 > .pm-chip,

/* ---- c2 page layer (panel-specific) ---- */
/* =====================================================================
   C2 — COZY SHELVES
   The rail as a set of soft, category-tinted shelves: rounded pill
   banners, comfortable pill rows, gentle lift on hover. Tints derive from
   the per-shelf category accent so it stays theme-correct on all 8 themes
   (no hardcoded pastels). The opposite register to C1's hard gauges —
   warmth, rounded corners, breathing room — collapsing gracefully to a
   tinted tab strip at minimum width.

   Unified chrome (this revision): a single segmented tab bar (.pm-segtab:
   line-icon stacked over an uppercase label, active = accent + 2px
   underline) drives the sub-views of every multi-section panel, and one
   compact button vocabulary (square per-row icon buttons, equal-width
   segmented action rows, pill text buttons) replaces the old scattered
   pills. Shelves no longer clip their children, so the PM sprout menus
   float cleanly over the shelf below them.
   ===================================================================== */
.side-panel-view { background: var(--surface); }

/* pill banner head */
.sh-banner {
  flex: none; display: flex; align-items: center; gap: var(--md);
  /* padding/margin promoted from the ship-tested min band: the --lg well read
     as dead air at every width, not just under 250px */
  padding: var(--md); min-width: 0; overflow: visible;
  margin: var(--sm) var(--sm) 0;
  border-radius: var(--radius-lg);
  background: var(--surface-elevated);
  box-shadow: var(--elev-1);
  position: relative; z-index: 3;
}
.sh-bico {
  width: 26px; height: 26px; flex: none; border-radius: var(--radius-pill);
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--accent-primary) 16%, transparent);
  color: var(--accent-primary);
}
.sh-bico svg { width: 13px; height: 13px; }
/* banner title keeps a guaranteed share so the status pill yields (ellipsizes) first at 240-280px (retro fonts run wide) */
.sh-title { font-family: var(--display-font); font-size: 11px; font-weight: 700; letter-spacing: .4px; flex: 1 1 auto; min-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-bstatus { margin-left: auto; flex: 0 4 auto; min-width: 0; max-width: 50%; display: inline-flex; align-items: center; gap: 6px; font-size: 9.5px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--graph-passed) 14%, transparent); color: var(--graph-passed); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-bstatus .sh-btext { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* status chip that doubles as a toggle for the advanced-index panel */
.sh-bstatus.sh-idxtoggle { cursor: pointer; user-select: none; display: inline-flex; align-items: center; min-width: 0; max-width: 68%; transition: background var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out); }
.sh-bstatus.sh-idxtoggle:hover { background: color-mix(in srgb, var(--graph-passed) 24%, transparent); }
.sh-bstatus .sh-idxlabel { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-bstatus .sh-bchev { width: 10px; height: 10px; flex: none; transition: transform var(--motion-med) var(--ease-default); }
.sh-bstatus.open .sh-bchev { transform: rotate(180deg); }
/* a shelf whose sprout menu is open must paint above the shelves below it.
   State class (.menu-open) is toggled by page JS off the shared menu.js
   is-open hooks — no :has(), so the Slint port gets an explicit boolean. */
.sh-shelf.menu-open { position: relative; z-index: 6; }
/* Rail menus body-portal — do not lift overflow on rows (that expands nowrap meta past the panel). */
.pm6-tb-menu-wrap.menu-open { position: relative; z-index: 50; }
/* Rail menus portal to body while open (see _shared/menu.js) */
/* history commits: no inset left accent rail on hover (base.css .sh-commit:hover) */
.sh-commit:hover, .sh-commit-h:hover { box-shadow: none !important; border-left-color: transparent !important; }
/* no flashing left rail on running rows (keep the dot pulse, drop the blink
   stripe). Rows that contain a running dot carry an explicit .is-running
   class in markup (Slint: per-row boolean) instead of :has(.dot-run). */
.sh-row.is-running::after { content: none; }
/* banner status that collapses to its indicator light at the min band (Docker ctx) */
.sh-bstatus[data-narrow="light"] .sh-btext { transition: opacity var(--motion-fast) var(--ease-out); }
/* defensive ellipsis so bold row names never hard-clip (basic theme exposed these) */
.sh-name, .sh-rlabel, .fm-path, .ad-cttl, .ad-rname, .sh-fileh { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* inside the column wrapper, size the name to content but let it shrink so the
   nested status chip never overflows the row (base rule is flex:1 = grow) */
.sh-main > .sh-name { flex: 0 1 auto; }
/* the name's text lives in its own shrinkable span so it can ellipsize inside
   the flex container; the nested status chip keeps its natural width */
.sh-name > .sh-nm-txt { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-name > .pm-chip, .sh-name > .pm-gs { flex: none; }
.sh-run-h, .sh-ctr-h { min-width: 0; max-width: 100%; }
.sh-run-h .pm-chip, .sh-ctr-h .pm-chip, .sh-bstatus .pm-chip { flex: 0 1 auto; max-width: 42%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Docker's 6-tab bar: labels shorten by measure (data-fit on the segtab) */
.pm-segtab.fm-docktabs .pm-segtab-item > .eq-full,
.pm-segtab.fm-docktabs .pm-segtab-item > .eq-abbr { display: none; }
.pm-segtab.fm-docktabs .pm-segtab-item svg { width: 16px; height: 16px; }
.pm-segtab.fm-docktabs[data-fit="abbr"] .pm-segtab-item > .eq-abbr { display: inline; }
.pm-segtab.fm-docktabs[data-fit="abbr"] .pm-segtab-item svg { width: 15px; height: 15px; }
.pm-segtab.fm-docktabs[data-fit="full"] .pm-segtab-item > .eq-full { display: inline; }
.pm-segtab.fm-docktabs[data-fit="full"] .pm-segtab-item svg { width: 15px; height: 15px; }
/* at the min band the artifacts type-pill yields its space to the title */
.side-panel-slot[data-wtier="min"] .sh-card .sh-fam { display: none; }
/* at the min band agent/container rows drop the secondary meta line so the
   name + status chip fit without clipping (there's no room for all three) */
.side-panel-slot[data-wtier="min"] .sh-run-h .sh-meta,
.side-panel-slot[data-wtier="min"] .sh-ctr-h .sh-meta { display: none; }
/* cap the secondary meta line so name + status chip always fit (basic @220) */
.sh-run-h .sh-meta, .sh-ctr-h .sh-meta { flex: 0 1 38%; min-width: 0; }
.fm-regrow { display: flex; flex-direction: column; gap: 4px; padding: 6px 2px; border-bottom: 1px solid color-mix(in srgb, var(--border-light) 70%, transparent); }
.fm-regrow:last-of-type { border-bottom: 0; }
.fm-regname { font-family: var(--mono-font); font-size: 10.5px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fm-regstat { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fm-regnote { font-size: 9px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* worktree filter chips: one line; abbreviate at the min band */
/* scrollbar-width lives in the css-tokens opt-in list — declaring it here
   without a scrollbar-color left Chrome with no bar at all (the mirror of
   .sh-scroll's WebKit-only bug). */
.sh-wtchips { flex-wrap: nowrap !important; overflow-x: auto; }
.sh-wtchips .pm-chipbtn { flex: 0 0 auto; }
.sh-wtchips .pm-chipbtn .wt-abbr { display: none; }
.sh-wtchips .pm-chipbtn .wt-full { display: inline; }
/* advanced-index panel that drops from under the banner.
   Only max-height + opacity animate (Slint: height + opacity); the open
   spacing lives INSIDE the clipped box (inner shelf margin-top) so no
   margin transition is needed. */
.sh-idxpanel { overflow: hidden; max-height: 0; opacity: 0; margin: 0 var(--sm); transition: max-height var(--motion-med) var(--ease-out), opacity var(--motion-med) var(--ease-out); }
.sh-idxpanel.open { max-height: 268px; opacity: 1; }
.sh-idxpanel .sh-shelf { margin-top: var(--sm); margin-bottom: 0; }
@media (prefers-reduced-motion: reduce) { .sh-idxpanel { transition: opacity var(--motion-fast) var(--ease-out); } .sh-idxpanel:not(.open) { max-height: 0; } .sh-idxpanel.open { max-height: 268px; } }
[data-reduced-motion="1"] .sh-idxpanel,
[data-motion="reduced"] .sh-idxpanel { transition: opacity var(--motion-fast) var(--ease-out); }
[data-reduced-motion="1"] .sh-idxpanel,
[data-motion="reduced"] .sh-idxpanel:not(.open) { max-height: 0; }
[data-reduced-motion="1"] .sh-idxpanel,
[data-motion="reduced"] .sh-idxpanel.open { max-height: 268px; }
/* branch picker — full width of the Changes pane at every band */
.sh-bbranch { display: block; width: 100%; flex: none; margin-left: 0; max-width: none; min-width: 0; }
/* menu trigger component (from _shared/base.css, scoped to the rail + bottom
   debug host so PM7's title-bar-scoped rules never leak UA ButtonFace in) */
#sidePanelSlot .pm6-tb-menu-trigger,
#bottomDebugHost .pm6-tb-menu-trigger {
  display: inline-flex; align-items: center; gap: var(--sm);
  font-family: var(--body-font); font-weight: 600; font-size: 12px;
  line-height: 1.2; white-space: nowrap; box-sizing: border-box;
  color: var(--text-secondary); background: none; cursor: pointer;
  padding: 5px 9px; border-radius: var(--radius-sm);
  transition: color var(--motion-fast) var(--ease-out), background var(--motion-fast) var(--ease-out);
}
#sidePanelSlot .pm6-tb-menu-trigger:hover,
#bottomDebugHost .pm6-tb-menu-trigger:hover { color: var(--text-primary); background: var(--accent-soft); }
#sidePanelSlot .pm6-tb-menu-trigger[aria-expanded="true"],
#bottomDebugHost .pm6-tb-menu-trigger[aria-expanded="true"] { color: var(--text-primary); background: var(--accent-soft); }
#sidePanelSlot .pm6-tb-menu-item > span,
#bottomDebugHost .pm6-tb-menu-item > span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
/* Portaled rail menus: keep item labels inside the menu plate */
body > .pm6-tb-menu .pm6-tb-menu-item,
#sidePanelSlot .pm6-tb-menu-item,
#bottomDebugHost .pm6-tb-menu-item {
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  min-width: 0;
  overflow: hidden;
  box-sizing: border-box;
}
body > .pm6-tb-menu .pm6-tb-menu-item-label,
#sidePanelSlot .pm6-tb-menu-item-label,
#bottomDebugHost .pm6-tb-menu-item-label {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sh-bbranch .pm6-tb-menu-trigger { display: flex; align-items: center; gap: 6px; min-width: 0; width: 100%; border: 1px solid var(--border-light); border-radius: var(--radius-pill); padding: 3px 9px; box-sizing: border-box; }
.sh-bbranch .pm6-tb-menu-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-bbranch .pm6-tb-menu { min-width: 100%; width: 100%; box-sizing: border-box; }

/* --sm is the ship-tested min-band value AND the hard floor: overflow-x is
   hidden here, so the global button:focus-visible ring (2px outline + 2px
   offset, 05-css-shell) needs all 4px of side room. Never go below --sm. */
.sh-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--sm); }
/* let sprout popups float over neighbouring chrome instead of being clipped
   at narrow widths (a 210px menu inside a 220px panel must not be cut off) */
.side-panel-slot { overflow: visible; }

/* ---- unified segmented tab bar (icon over label, sliding ink underline) ---- */
.pm-segtab {
  flex: none; display: flex; position: relative;
  /* fully superseded by the later .pm-segtab in the c2-files layer; the inset
     is kept in sync so a reorder can't silently re-widen the gutter */
  margin: var(--md) var(--sm) 0;
  border-bottom: 1px solid var(--border-light);
  background: color-mix(in srgb, var(--cat, var(--accent-primary)) 5%, var(--surface-elevated));
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  overflow: hidden;
}
/* sliding active underline (ported from the files variant, adapted to
   transform-only motion: fixed 100px basis scaled/translated by JS —
   Slint: animated x + width on a 2px Rectangle, never a width transition) */
.pm-segtab-ink { position: absolute; left: 0; bottom: 0; height: 2px; width: 100px; background: var(--cat, var(--accent-primary)); border-radius: 2px 2px 0 0; transform: scaleX(0); transform-origin: 0 50%; transition: transform var(--motion-med) var(--ease-default); pointer-events: none; }
.pm-segtab-item {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 2px 8px; margin-bottom: -1px;
  background: none; border: 0; border-bottom: 2px solid transparent;
  cursor: pointer; color: var(--text-muted);
  font-family: var(--display-font); font-size: 8px; font-weight: 700; letter-spacing: 1px;
  transition: color var(--motion-fast) var(--ease-out), background var(--motion-fast) var(--ease-out);
}
.pm-segtab-item svg { width: 15px; height: 15px; flex: none; transition: transform var(--motion-med) var(--ease-default); }
.pm-segtab-item.active svg { transform: translateY(-1px) scale(1.1); }
.pm-segtab-item > span { max-width: 100%; padding: 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pm-segtab-item:hover { color: var(--text-secondary); background: color-mix(in srgb, var(--cat, var(--accent-primary)) 6%, transparent); }
.pm-segtab-item.active { color: var(--cat, var(--accent-primary)); }

/* shelves */
.sh-shelf {
  border-radius: var(--radius-lg);
  background: color-mix(in srgb, var(--cat, var(--accent-blue)) 7%, var(--surface-elevated));
  border: 1px solid color-mix(in srgb, var(--cat, var(--accent-blue)) 16%, var(--border-light));
  margin-bottom: var(--md);
  overflow: visible;
  box-shadow: var(--elev-1);
}
.sh-head {
  display: flex; align-items: center; gap: var(--md);
  padding: var(--md); /* promoted from the ship-tested min band */
  background: color-mix(in srgb, var(--cat, var(--accent-blue)) 11%, transparent);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}
.sh-head[data-collapse] { cursor: pointer; }
.sh-hico {
  width: 22px; height: 22px; flex: none; border-radius: var(--radius-pill);
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--cat, var(--accent-blue)) 20%, transparent);
  color: var(--cat, var(--accent-blue));
}
.sh-hico svg { width: 12px; height: 12px; }
.sh-hlabel { font-family: var(--display-font); font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; color: var(--text-primary); }
.sh-hcount { margin-left: auto; flex: 0 1 auto; max-width: 48%; font-size: 9.5px; font-weight: 700; padding: 1px 8px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--cat, var(--accent-blue)) 16%, transparent); color: var(--cat, var(--accent-blue)); white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sh-hcount .hc-full, .sh-hcount .hc-abbr { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sh-hstatus { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 9px; font-weight: 700; padding: 2px 9px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--graph-passed) 14%, transparent); color: var(--graph-passed); white-space: nowrap; }
.sh-hstatus .dot { width: 7px; height: 7px; flex: none; }
.sh-body { padding: var(--sm) var(--md) var(--md); } /* promoted from the ship-tested min band */
/* staged/unstaged shelves: tighten the well around file rows (esp. below) */
#panel-source [data-pane="changes"] .sh-shelf > .sh-body { padding: var(--sm) var(--md) var(--sm); }
/* worktree collapsed pills: reduce the air under the header text */
#panel-source .sh-wt > .sh-wt-h { padding-bottom: 4px; }

/* cozy buttons */
.side-panel-view .pm-btn { border-radius: var(--radius-pill); }
.side-panel-view .pm-btn:hover { transform: translateY(-1px); box-shadow: var(--elev-hover); }
.side-panel-view .pm-minibtn { border-radius: var(--radius-pill); width: 24px; height: 24px; }

/* ---- generic accordion body (base.css spring grid owns expand/collapse;
   keep padding only — do not fight display:grid !important) ----
   padding promoted from the ship-tested min band; the component-specific
   `X > .sh-accb` rules below (chg / file / commit / stage / sumcard) still
   win on specificity and keep their own tighter or indented values. */
.sh-accb { padding: 0 var(--md) var(--md); width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; }
.sh-accchev { width: 10px; height: 10px; color: var(--text-muted); transition: transform var(--motion-med) var(--ease-default); flex: none; }
/* only the owning row's host chevron (direct child) — never nested SVGs or nested expanders */
[data-acc].open > [data-collapse] > .sh-accchev { transform: rotate(90deg); }

/* pill rows */
.sh-row {
  display: flex; align-items: center; gap: var(--md);
  padding: 6px 8px; border-radius: var(--radius-md); min-width: 0;
  transition: background var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out);
  cursor: pointer;
}
.sh-row:hover { background: color-mix(in srgb, var(--cat, var(--accent-blue)) 10%, transparent); transform: translateX(2px); }
.sh-row.flat { cursor: default; }
.sh-row.flat:hover { transform: none; }
.sh-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.sh-main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.sh-name { font-size: 11.5px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.sh-meta { font-size: 9.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-mono { font-family: var(--mono-font); }
.sh-rowact { display: flex; gap: var(--xs); flex: none; margin-left: auto; }

/* changed-file / branch / stash rows as collapsed expanders: header keeps the
   pill-row look (button-free — actions live in the sprung .sh-accb body) */
.sh-chg { border-radius: var(--radius-md); min-width: 0; }
.sh-chg-h { display: flex; align-items: center; gap: var(--md); padding: 6px 8px; border-radius: var(--radius-md); cursor: pointer; min-width: 0; }
.sh-chg-h:hover { background: color-mix(in srgb, var(--cat, var(--accent-blue)) 10%, transparent); }
.sh-chg > .sh-accb { padding: 0 8px 6px 24px; }
/* compact +N/-N diffstat chip so collapsed headers carry the triage signal */
.sh-ds { flex: none; font-family: var(--mono-font); font-size: 9px; white-space: nowrap; }
.sh-ds .add { color: var(--graph-passed); font-weight: 700; }
.sh-ds .del { color: var(--graph-failed); font-weight: 700; }
/* first-hunk preview line inside a changed-file body (mono, dim) */
.sh-hunkprev { font-family: var(--mono-font); font-size: 9.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0 0; }
/* files-touched mini rows (commit / stash bodies): path ellipsizes, stat stays */
.sh-cfl { display: flex; align-items: baseline; gap: var(--md); font-family: var(--mono-font); font-size: 9.5px; color: var(--text-secondary); padding: 1px 0; min-width: 0; }
.sh-cfl .f { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sh-kv { display: flex; align-items: baseline; justify-content: space-between; gap: var(--md); padding: 3px 2px; font-size: 11.5px; min-width: 0; max-width: 100%; width: 100%; box-sizing: border-box; overflow: hidden; }
.sh-k { color: var(--text-muted); flex: none; }
.sh-v { color: var(--text-primary); text-align: right; min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Keep meta rows clamped (menus portal — no overflow lift needed) */
.menu-open .sh-kv,
.sh-run.menu-open .sh-kv,
[data-acc].menu-open .sh-kv {
  min-width: 0;
  max-width: 100%;
  width: 100%;
  overflow: hidden;
}
/* wrapping kv for long mono keys (secrets / image digests) */
.sh-kvwrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px var(--md); padding: 3px 2px; font-size: 11.5px; }
.sh-kvwrap .sh-k { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
.sh-kvwrap .pm-chip { flex: none; }

/* equal-width + commit action rows */
.pm-eqrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sm); margin-top: var(--sm); }
.pm-eqrow .pm-btn { min-width: 0; padding: 5px 6px; }
.eq-abbr { display: none; }
.pm-commitrow { display: flex; align-items: center; gap: var(--sm); margin-top: var(--sm); }
.pm-commitrow .pm-input { flex: 1; min-width: 0; }
.pm-commitrow .pm-minibtn { flex: none; }
.pm-commitrow .pm-btn { flex: 0 0 auto; }

/* search */
.sh-flags { display: flex; align-items: center; gap: var(--sm); margin-top: var(--md); }
.sh-flag { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--cat) 8%, transparent); border: 1px solid color-mix(in srgb, var(--cat) 16%, transparent); color: var(--text-secondary); transition: all var(--motion-fast) var(--ease-out); }
.sh-flag:hover { color: var(--text-primary); }
.sh-flag.on { color: var(--cat); background: color-mix(in srgb, var(--cat) 18%, transparent); border-color: color-mix(in srgb, var(--cat) 40%, transparent); }
/* scope trigger shrinks with an ellipsized label instead of overflowing the flags row at 240px */
.sh-flags .sh-scope { margin-left: auto; flex: 0 1 auto; min-width: 0; }
.sh-scope .pm6-tb-menu-trigger { border: 1px solid color-mix(in srgb, var(--cat) 18%, transparent); border-radius: var(--radius-pill); padding: 4px 9px; display: flex; align-items: center; gap: 4px; max-width: 100%; }
.sh-scope .pm6-tb-menu-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-stats { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sm); margin-top: var(--md); font-family: var(--mono-font); font-size: 9.5px; color: var(--text-secondary); }
.sh-stats b { color: var(--text-primary); font-weight: 700; }
.sh-stats .dot { width: 7px; height: 7px; flex: none; }
/* min band: drop the timing chunk so the stats stay one line (Slint has no wrapping row) */
.sh-stats .sh-stat-time { display: inline-flex; align-items: center; gap: var(--sm); }
.side-panel-slot[data-wtier="min"] .sh-stats .sh-stat-time { display: none; }
/* segmented tabs sitting directly under the banner (search find/replace) */
/* must track the base .pm-segtab inset — this .flat rule outranks it, so it
   would otherwise re-widen the gutter the min band had already tightened */
.pm-segtab.flat { margin: var(--sm) var(--sm) 0; border-radius: 0; background: transparent; }
/* sticky action footer pinned to the panel bottom (independent of scroll) */
.sh-foot { flex: none; display: flex; align-items: center; gap: var(--sm); padding: var(--sm); background: var(--surface-elevated); border-top: 1px solid var(--border-light); box-shadow: 0 -6px 14px -10px color-mix(in srgb, var(--text-primary) 40%, transparent); }
.sh-foot .sh-footcount { font-family: var(--mono-font); font-size: 10px; color: var(--text-muted); white-space: nowrap; }
.sh-foot .sh-footcount b { color: var(--text-primary); font-weight: 700; }

.sh-file { background: color-mix(in srgb, var(--cat) 5%, var(--surface-elevated)); border-radius: var(--radius-md); margin-bottom: var(--sm); overflow: hidden; }
.sh-fileh { display: flex; align-items: center; gap: var(--sm); padding: 6px 9px; cursor: pointer; font-family: var(--mono-font); font-size: 10.5px; color: var(--cat); }
/* the path lives in its own shrinkable span so it ellipsizes and the count <b> stays visible */
.sh-fileh .sh-fp { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-fileh b { margin-left: auto; flex: none; font-weight: 400; color: var(--text-muted); }
.sh-hit { display: flex; gap: var(--md); align-items: baseline; padding: 3px 9px; cursor: pointer; border-left: 2px solid transparent; }
.sh-hit:hover { background: color-mix(in srgb, var(--cat) 9%, transparent); border-left-color: var(--cat); }
.sh-ln { font-family: var(--mono-font); font-size: 9.5px; color: var(--text-muted); min-width: 22px; text-align: right; flex: none; }
.sh-hit code { font-family: var(--mono-font); font-size: 10px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sh-hit em { font-style: normal; color: var(--text-primary); background: color-mix(in srgb, var(--cat) 22%, transparent); border-radius: var(--radius-pill); padding: 0 3px; }
/* search file-group expanders: hits live in a sprung .sh-accb body; header keeps path + count */
.sh-file > .sh-accb { padding: 0 0 3px; }
.sh-fileh .sh-accchev { width: 9px; height: 9px; }
.sh-fileh .sh-fp:hover { text-decoration: underline; }
/* results-shelf head mini actions sit after the count pill */
.sh-head .pm-minibtn { flex: none; }
/* replace-pane per-file preview rows: old line (strike tint) then new line (green) */
.sh-rr { display: flex; gap: var(--md); align-items: baseline; padding: 3px 9px; }
.sh-rr code { font-family: var(--mono-font); font-size: 10px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sh-rr em { font-style: normal; color: var(--text-primary); border-radius: var(--radius-pill); padding: 0 3px; }
.sh-rr.old em { background: color-mix(in srgb, var(--graph-failed) 20%, transparent); text-decoration: line-through; }
.sh-rr.new em { background: color-mix(in srgb, var(--graph-passed) 20%, transparent); }
.sh-rr-stub { padding: 4px 9px; font-family: var(--mono-font); font-size: 9.5px; color: var(--text-muted); }
/* filters disclosure under the query (idxpanel pattern: max-height + opacity) */
.sh-filtoggle { display: flex; align-items: center; gap: 6px; margin-top: var(--md); padding: 3px 2px; width: 100%; text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; color: var(--text-secondary); background: none; border: 0; cursor: pointer; }
.sh-filtoggle:hover { color: var(--text-primary); }
.sh-filtoggle .sh-accchev { width: 9px; height: 9px; }
.sh-filtoggle.open > .sh-accchev { transform: rotate(90deg); }
.sh-filtpanel { overflow: hidden; max-height: 0; opacity: 0; transition: max-height var(--motion-med) var(--ease-out), opacity var(--motion-med) var(--ease-out); }
.sh-filtpanel.open { max-height: 140px; opacity: 1; }
@media (prefers-reduced-motion: reduce) { .sh-filtpanel { transition: opacity var(--motion-fast) var(--ease-out); } }
[data-reduced-motion="1"] .sh-filtpanel { transition: opacity var(--motion-fast) var(--ease-out); }
.sh-filtrow { display: flex; align-items: center; gap: var(--sm); margin-top: var(--sm); }
/* transient index-state strip under the banner (rebuild demo cycle: building / stale) */
/* horizontal inset tracks .sh-banner above it — it hangs directly under the
   banner and a mismatched gutter reads as a misaligned strip */
.sh-idxstate { display: flex; align-items: center; gap: var(--sm); margin: var(--sm) var(--sm) 0; padding: 4px 9px; border-radius: var(--radius-md); background: color-mix(in srgb, var(--accent-warning) 10%, var(--surface-elevated)); border: 1px solid color-mix(in srgb, var(--accent-warning) 22%, transparent); font-family: var(--mono-font); font-size: 10px; color: var(--text-secondary); }
.sh-idxstate[hidden] { display: none; }
.sh-idxstate span:not(.dot) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-idxstate .pm-minibtn { margin-left: auto; width: auto; padding: 0 8px; height: 20px; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; flex: none; }
.sh-idxstate .pm-minibtn svg { width: 11px; height: 11px; flex: none; }
.sh-idxstate .pm-minibtn[hidden] { display: none; }

/* soft log */
.sh-log { font-family: var(--mono-font); font-size: 9.5px; line-height: 1.55; background: color-mix(in srgb, var(--graph-failed) 6%, var(--surface-elevated)); border-radius: var(--radius-md); padding: var(--md); margin: var(--sm) 0; }
.sh-log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-log .fail { color: var(--graph-failed); }

/* worktree cozy rows */

/* commits — [data-acc] expanders: collapsed = sha + age + message, sprung

.sh-commit { border-radius: var(--radius-md); min-width: 0; }

/* graph */

.sh-gind::before { content: ''; position: absolute; left: 3px; top: -7px; width: 8px; height: 13px; border-left: 2px solid color-mix(in srgb, var(--cat) 30%, transparent); border-bottom: 2px solid color-mix(in srgb, var(--cat) 30%, transparent); border-radius: 0 0 0 4px; }

/* publish chain — soft numbered bubbles */
.sh-chain { position: relative; padding-left: 26px; margin: var(--sm) 0; }

.sh-portchip:hover { background: color-mix(in srgb, var(--cat, var(--accent-blue)) 20%, transparent); }
/* image rows: repo span ellipsizes while the tag span survives (middle-elide
   effect without new machinery); size pinned right, always visible */
.sh-name .sh-imgtag { flex: none; color: var(--text-muted); }
.sh-imgsz { margin-left: auto; flex: none; font-family: var(--mono-font); font-size: 9.5px; color: var(--text-muted); }
.sh-imgsum { display: flex; align-items: center; gap: var(--sm); font-family: var(--mono-font); font-size: 9.5px; color: var(--text-secondary); padding: 0 2px var(--md); min-width: 0; }
.sh-imgsum .sh-imgsum-t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-imgsum .pm-chipbtn { flex: none; }
.sh-kvwrap .pm-minibtn { flex: none; }

/* artifact receipts as cozy cards */
.sh-card { border-radius: var(--radius-lg); padding: var(--md) var(--lg); margin-bottom: var(--sm); background: color-mix(in srgb, var(--cat, var(--accent-blue)) 6%, var(--surface-elevated)); border: 1px solid color-mix(in srgb, var(--cat, var(--accent-blue)) 14%, transparent); cursor: pointer; transition: box-shadow var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.sh-card:hover { box-shadow: var(--elev-hover); transform: translateY(-1px); }
.sh-r1 { display: flex; align-items: center; gap: var(--md); min-width: 0; }
.sh-fam { font-size: 8.5px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--cat, var(--accent-blue)) 16%, transparent); color: var(--cat, var(--accent-blue)); flex: none; }
.sh-rlabel { font-size: 11px; font-weight: 600; color: var(--text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sh-time { display: flex; align-items: center; gap: 6px; font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); margin-top: 4px; }

.sh-thumb { position: relative; height: 56px; border-radius: var(--radius-md); margin-top: var(--sm); overflow: hidden; border: 1px solid var(--border-light); }
.sh-thumb::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 32%, color-mix(in srgb, var(--text-primary) 12%, transparent) 46%, transparent 60%); transform: translateX(-130%); transition: transform .7s var(--ease-out); pointer-events: none; }
.sh-card:hover .sh-thumb::after { transform: translateX(130%); }
.sh-th-editor { background: linear-gradient(180deg, color-mix(in srgb, var(--text-primary) 9%, transparent) 0 13%, transparent 13%), linear-gradient(90deg, color-mix(in srgb, var(--accent-blue) 16%, transparent) 0 24%, transparent 24%), repeating-linear-gradient(180deg, color-mix(in srgb, var(--text-primary) 12%, transparent) 0 3px, transparent 3px 11px), linear-gradient(140deg, color-mix(in srgb, var(--accent-blue) 14%, var(--surface)), color-mix(in srgb, var(--accent-magenta) 9%, var(--surface))); }
.sh-th-matrix { background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent-lime) 18%, transparent) 0 1px, transparent 1px 17%), repeating-linear-gradient(180deg, color-mix(in srgb, var(--accent-lime) 18%, transparent) 0 1px, transparent 1px 20%), linear-gradient(180deg, transparent 0 58%, color-mix(in srgb, var(--accent-lime) 22%, transparent) 58% 79%, transparent 79%), linear-gradient(140deg, color-mix(in srgb, var(--accent-lime) 12%, var(--surface)), var(--surface)); }
.sh-th-ci { background: radial-gradient(circle at 12px 9px, color-mix(in srgb, var(--graph-failed) 80%, transparent) 0 3px, transparent 3px), radial-gradient(circle at 24px 9px, color-mix(in srgb, var(--accent-warning) 80%, transparent) 0 3px, transparent 3px), radial-gradient(circle at 36px 9px, color-mix(in srgb, var(--graph-passed) 80%, transparent) 0 3px, transparent 3px), repeating-linear-gradient(180deg, color-mix(in srgb, var(--text-primary) 10%, transparent) 0 4px, transparent 4px 13px), linear-gradient(140deg, color-mix(in srgb, var(--accent-blue) 10%, var(--surface)), color-mix(in srgb, var(--accent-orange) 8%, var(--surface))); }
.sh-vals { display: flex; align-items: flex-end; gap: var(--lg); margin: var(--sm) 0 2px; }
.sh-val { display: flex; flex-direction: column; }
.sh-valn { font-family: var(--mono-font); font-size: 15px; font-weight: 700; line-height: 1.1; color: var(--text-primary); }
.sh-valn.ok { color: var(--graph-passed); }
.sh-valn.err { color: var(--graph-failed); }
.sh-valk { font-family: var(--display-font); font-size: 7px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-top: 2px; }
.sh-logline { font-family: var(--mono-font); font-size: 9px; color: var(--graph-failed); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
.sh-recrow { display: flex; align-items: center; gap: var(--md); margin-top: var(--sm); }
.sh-play { width: 24px; height: 24px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid color-mix(in srgb, var(--accent-orange) 45%, transparent); background: color-mix(in srgb, var(--accent-orange) 15%, transparent); color: var(--accent-orange); cursor: pointer; }
.sh-play svg { width: 11px; height: 11px; }
.sh-ticks { height: 12px; flex: 1; min-width: 0; border-radius: var(--radius-xs); border: 1px solid var(--border-light); background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent-orange) 50%, transparent) 0 2px, color-mix(in srgb, var(--accent-orange) 14%, transparent) 2px 4px, transparent 4px 11px); }
/* receipt cards as collapsed-by-default expanders: header row carries the
   padding, always-visible exception lines (panic logline, live stream row)
   sit between header and the sprung .sh-accb body */
.sh-card[data-acc] { padding: 0; cursor: default; }
/* insets promoted from the ship-tested min band */
.sh-card[data-acc] > .sh-r1 { padding: var(--md); cursor: pointer; }
.sh-card[data-acc] > .sh-logline, .sh-card[data-acc] > .sh-liveline { margin-top: 0; padding: 0 var(--md) var(--md); }
.sh-card[data-acc] > .sh-accb { padding: 0 var(--md) var(--md); }
.sh-card .sh-age { flex: none; margin-left: 0; display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono-font); font-size: 9px; }
.sh-card .sh-age .dot { width: 7px; height: 7px; }
.sh-liveline { display: flex; align-items: center; gap: var(--md); font-size: 9px; color: var(--text-muted); min-width: 0; }
.sh-liveline .pm-minibtn { margin-left: auto; width: auto; padding: 0 9px; height: 22px; font-size: 9.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; flex: none; }
.sh-liveline .pm-minibtn svg { width: 12px; height: 12px; flex: none; }
.sh-idrow { display: flex; align-items: center; gap: var(--sm); margin-top: var(--sm); min-width: 0; }
.sh-id { font-family: var(--mono-font); font-size: 9px; color: var(--text-secondary); background: color-mix(in srgb, var(--cat, var(--accent-blue)) 10%, transparent); border: 1px solid color-mix(in srgb, var(--cat, var(--accent-blue)) 14%, transparent); padding: 1px 7px; border-radius: var(--radius-pill); user-select: all; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-idrow .pm-minibtn { width: auto; padding: 0 8px; height: 20px; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; flex: none; }
.sh-idrow .pm-minibtn svg { width: 11px; height: 11px; flex: none; }
.sh-retn { display: flex; align-items: center; gap: var(--sm); font-size: 9px; color: var(--text-muted); margin-top: 4px; min-width: 0; }
.sh-retn .pm-minibtn { width: auto; padding: 0 8px; height: 20px; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; flex: none; }
.sh-retn .pm-minibtn svg { width: 11px; height: 11px; flex: none; }
.sh-card.expired { opacity: .62; }
.sh-card.expired:hover { transform: none; box-shadow: none; }
.sh-grpbadge { font-family: var(--mono-font); font-size: 8.5px; font-weight: 700; padding: 0 6px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--cat, var(--accent-blue)) 16%, transparent); color: var(--cat, var(--accent-blue)); flex: none; }
/* investigation stage rows + agents overflow stub navigate -> style them clickable */
#panel-artifacts .sh-body .sh-row.flat[data-demo-action], #panel-agents .sh-body .sh-row.flat[data-demo-action] { cursor: pointer; }
#panel-artifacts .sh-body .sh-row.flat[data-demo-action]:hover, #panel-agents .sh-body .sh-row.flat[data-demo-action]:hover { transform: translateX(2px); }
.sh-sortrow { display: flex; align-items: center; gap: var(--sm); padding: 0 0 var(--md); }
.sh-sortrow .sh-sortlab { font-family: var(--display-font); font-size: 8.5px; font-weight: 700; letter-spacing: 1.4px; color: var(--text-muted); }
.sh-sortrow .pm6-tb-menu-wrap { margin-left: auto; }
.sh-sortrow .pm6-tb-menu-trigger { border: 1px solid var(--border-light); border-radius: var(--radius-pill); font-family: var(--mono-font); font-size: 9.5px; padding: 3px 9px; }

/* tests runs expandable rows (attention-deck style: wrapping meta line) */
.sh-run { border-radius: var(--radius-md); margin-bottom: var(--sm); background: var(--surface-elevated); border: 1px solid var(--border-light); overflow: hidden; width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; }
.sh-run-h { display: flex; align-items: center; gap: var(--md); padding: 7px 9px; cursor: pointer; min-width: 0; }
/* two-line clamp via fixed max-height clip (Slint-portable: fixed-height wrapped Text with clip, no -webkit-line-clamp) */
.sh-runmeta { font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); white-space: normal; overflow: hidden; max-height: 26px; line-height: 1.4; }
/* GitHub Actions run expanders: always-visible failure banner (outside .sh-accb),
   per-job mini-rows, step sublines, artifacts strip, dispatch mini-form */
.sh-runfail { font-family: var(--mono-font); font-size: 9px; color: var(--graph-failed); padding: 0 9px 6px 29px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sh-jstep { font-family: var(--mono-font); font-size: 9px; color: var(--graph-failed); padding: 0 2px 3px 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-jstep.muted { color: var(--text-muted); }
.sh-arth { font-size: 9.5px; font-weight: 700; letter-spacing: .4px; color: var(--text-secondary); margin-top: var(--sm); padding: 2px; }
.sh-art { display: flex; align-items: center; gap: var(--sm); padding: 2px 2px 2px 15px; font-family: var(--mono-font); font-size: 9.5px; color: var(--text-primary); min-width: 0; cursor: pointer; border-radius: var(--radius-sm); }
.sh-art:hover { background: color-mix(in srgb, var(--cat, var(--accent-blue)) 9%, transparent); }
.sh-art.expired { color: var(--text-muted); cursor: default; }
.sh-art.expired:hover { background: none; }
.sh-grp { font-family: var(--display-font); font-size: 8.5px; font-weight: 700; letter-spacing: 1.2px; color: var(--text-muted); padding: var(--md) 2px 1px; }
.sh-dispform { display: flex; flex-direction: column; gap: var(--sm); margin-top: var(--sm); padding: var(--md); border: 1px dashed var(--border-light); border-radius: var(--radius-md); width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; }
.sh-dfk { font-size: 8.5px; font-weight: 700; letter-spacing: 1px; color: var(--text-muted); }

.sh-dfrow .pm6-tb-menu-wrap { flex: 1 1 auto; min-width: 0; max-width: 100%; }
