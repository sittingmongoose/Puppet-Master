.sh-chk { display: flex; align-items: center; gap: var(--sm); font-size: 10.5px; color: var(--text-primary); cursor: pointer; }
.sh-chk input { accent-color: var(--cat, var(--accent-blue)); width: 12px; height: 12px; margin: 0; flex: none; }

/* agents expandable detail */
.sh-agdetail { padding: 2px 2px 4px; }

/* name text absorbs shrinkage before nested status chips do — chips keep
   their natural width until the name is fully ellipsized (fit intent above) */
.sh-name > .sh-nm-txt { flex-shrink: 40; }
/* testing/agents state additions: live-run border (explicit .is-running class,
   mirrors .sh-ctr.is-running — Slint: per-row boolean, no :has()) */
.sh-run.is-running { border-color: color-mix(in srgb, var(--graph-running) 45%, transparent); background: linear-gradient(90deg, color-mix(in srgb, var(--graph-running) 7%, transparent), var(--surface-elevated) 62%); }
/* errored (harness/compile/setup failure) is NOT failed (assertion) — distinct orange chip */
.pm-chip-errored { background: color-mix(in srgb, var(--accent-orange) 14%, transparent); color: var(--accent-orange); border-color: color-mix(in srgb, var(--accent-orange) 32%, transparent); }
/* informational pm-note variant: neutral border + muted glyph instead of the warning tint */
.pm-note-info { background: color-mix(in srgb, var(--accent-blue) 7%, transparent); border-color: var(--border-light); }
.pm-note-info svg { color: var(--text-muted); }
/* assurance note that sits between a shelf head and its collapsed body */
.sh-shelf > .pm-note { margin: var(--md) var(--lg); }
/* changed-since-last-view marker on collapsed agent headers (real app clears it on expand) */
.sh-chgdot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-primary); flex: none; }
/* tiny model mark in identity kvs — tooltip carries the full model string */
.sh-modelmark { font-family: var(--mono-font); font-size: 8.5px; font-weight: 700; padding: 0 6px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--cat, var(--accent-blue)) 14%, transparent); color: var(--cat, var(--accent-blue)); }
/* collapsible sumcards (lane capacity): header toggles, body springs via the shared .sh-accb layer */
.pm-sumcard[data-acc] .pm-sumcard-h[data-collapse] { cursor: pointer; }
.pm-sumcard[data-acc] > .sh-accb { padding: 0; }
.pm-sumcard .sh-accchev { width: 9px; height: 9px; }
/* one-line last-run receipt summary */
.sh-lrline { display: flex; align-items: center; gap: var(--md); margin-bottom: var(--md); min-width: 0; }
.sh-lrsum { font-family: var(--mono-font); font-size: 10px; color: var(--text-secondary); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* chip row as soft segmented pills */
.side-panel-view .pm-chipbtn { border-radius: var(--radius-pill); }


/* progressive disclosure — labels shorten by MEASURE (data-fit), not by a
   hardcoded width band. JS tries full, then abbr/symbol when the pill or its
   row overflows at the current rail width (see pillFit below). */
.sh-bstatus .sh-bshort { display: none; }
.sh-bstatus.sh-idxtoggle { max-width: 68%; }
.pm-chip .chip-abbr { display: none; }
.sh-hcount .hc-abbr { display: none; } /* paired with .hc-full default */

/* data-fit states */
.sh-bstatus .sh-idxabbr { display: none; }
.sh-bstatus[data-narrow="short"][data-fit="abbr"] .sh-bfull { display: none; }
.sh-bstatus[data-narrow="short"][data-fit="abbr"] .sh-bshort { display: inline; }
.sh-bstatus[data-narrow="short"][data-fit="abbr"] .sh-idxfull { display: none; }
.sh-bstatus[data-narrow="short"][data-fit="abbr"] .sh-idxabbr { display: inline; }
.sh-bstatus[data-narrow="extra"][data-fit="abbr"] .sh-bextra,
.sh-bstatus[data-narrow="extra"][data-fit="symbol"] .sh-bextra { display: none; }
.sh-bstatus[data-narrow="symbol"][data-fit="abbr"] .sh-btext,
.sh-bstatus[data-narrow="symbol"][data-fit="abbr"] .sh-idxlabel,
.sh-bstatus[data-narrow="symbol"][data-fit="symbol"] .sh-btext,
.sh-bstatus[data-narrow="symbol"][data-fit="symbol"] .sh-idxlabel { display: none; }
.sh-bstatus[data-narrow="symbol"][data-fit="abbr"],
.sh-bstatus[data-narrow="symbol"][data-fit="symbol"] { flex: 0 0 auto; max-width: none; padding: 5px 7px; gap: 4px; }
.sh-bstatus[data-narrow="light"][data-fit="abbr"] .sh-btext,
.sh-bstatus[data-narrow="light"][data-fit="symbol"] .sh-btext { display: none; }
.sh-bstatus[data-narrow="light"][data-fit="abbr"],
.sh-bstatus[data-narrow="light"][data-fit="symbol"] { display: inline-flex; padding: 5px; }
.sh-bstatus[data-fit="abbr"] .sh-bextra,
.sh-bstatus[data-fit="symbol"] .sh-bextra { display: none; }
.pm-chip[data-narrow-chip][data-fit="abbr"] .chip-full { display: none; }
.pm-chip[data-narrow-chip][data-fit="abbr"] .chip-abbr { display: inline; }
.pm-chip[data-narrow-chip][data-fit="abbr"] { max-width: none; padding: 1px 6px; }
.sh-hcount[data-fit="abbr"] .hc-full { display: none; }
.sh-hcount[data-fit="abbr"] .hc-abbr { display: inline; }
.sh-wtchips[data-fit="abbr"] .pm-chipbtn { padding: 4px 7px; }
.sh-wtchips[data-fit="abbr"] .wt-full { display: none; }
.sh-wtchips[data-fit="abbr"] .wt-abbr { display: inline; }
.pm-eqrow[data-fit="abbr"] .eq-full,
.pm-btnrow[data-fit="abbr"] .eq-full,
.pm-segtab[data-fit="abbr"] .eq-full { display: none; }
.pm-eqrow[data-fit="abbr"] .eq-abbr,
.pm-btnrow[data-fit="abbr"] .eq-abbr,
.pm-segtab[data-fit="abbr"] .eq-abbr { display: inline; }
/* Measure pass: lay out the ACTIVE panel's hidden panes INVISIBLY so banner
   tabs and always-visible pills can be fitted. Do NOT force-expand closed
   accordion bodies (that thrashed layout while dragging). Body chips refit
   when the row opens via PMPillFit(acc). Do NOT set animation:none on the
   whole slot — restoring it retriggers railPanelIn (black flash).
   The eight INACTIVE .side-panel-views are deliberately not laid out here.
   Force-showing them made one fit pass a full layout of nine panels, and the
   ladder then forced a sync layout per candidate inside all of them — the
   bulk of the left-panel drag cost. They are fitted on first show instead:
   the .active MutationObserver below schedules a scoped run in the same task
   the class flips, so the rAF fit lands before the panel's first paint, and
   the slot ResizeObserver covers the hide/re-show path. Elements with no box
   are skipped outright (isFittable's caller) rather than measured as zero. */
/* The measure pass lays out the INACTIVE views too. That was narrowed once to
   only the active view as a drag optimisation and it broke fitting: a hidden
   pill has no box, fitOne bails, and the pill keeps whatever data-fit it last
   had — Source Control sat trapped at 'abbr' showing "origin" instead of
   "tastebook · origin", and GitHub Actions never got fitted at all. The drag
   cost is already solved the right way, by deferring the whole ladder to
   dragend behind body.pm-resizing, so this pass can stay complete. */
.side-panel-slot.pill-fit-measure .side-panel-view:not(.active),
.side-panel-slot.pill-fit-measure [data-pane].pm-hidden {
  display: flex !important;
  flex-direction: column !important;
  position: absolute !important;
  inset: 0;
  visibility: hidden !important;
  pointer-events: none !important;
  z-index: -1;
}
.side-panel-slot.pill-fit-measure .side-panel-view:not(.active) > *,
.side-panel-slot.pill-fit-measure [data-pane].pm-hidden > * {
  animation: none !important;
}

/* history: no left border / rail on hover */
.sh-commit, .sh-commit-h { border-left: 0 !important; box-shadow: none !important; }
.sh-commit:hover, .sh-commit-h:hover { background: color-mix(in srgb, var(--cat) 10%, transparent); box-shadow: none !important; border-left: 0 !important; }
.sh-commit::before, .sh-commit::after, .sh-commit-h::before, .sh-commit-h::after { content: none !important; }
/* investigation body must clear the head — deliberately NOT demoted to --sm
   alongside .sh-body's new top padding: head and body are z-stacked here
   (2 over 1) and the min band kept these at --md too, so --md is ship-tested
   clearance, not slack. */
.sh-body.sh-accb { padding-top: var(--md); }
.sh-shelf[data-acc] > .sh-head { position: relative; z-index: 2; }
.sh-shelf[data-acc] > .sh-body.sh-accb { position: relative; z-index: 1; padding-top: var(--md); }
/* investigation starts open so the chip row is visible for fit-checks */
#panel-artifacts .sh-shelf[data-acc] > .sh-body.sh-accb .pm-chip { position: relative; z-index: 0; }
/* compose identity split rows */
.sh-cmpid { display: flex; flex-direction: column; align-items: stretch; gap: var(--sm); padding: 0 2px var(--sm); min-width: 0; }
.sh-cmpid-row { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sm); min-width: 0; }
.sh-cmpid .sh-cmpf { flex: 1 1 90px; min-width: 56px; font-family: var(--mono-font); font-size: 9.5px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-cmpid .pm-minibtn { flex: none; margin-left: auto; }


/* agent timing sits under the header row so it fits at mid/min (not only wide) */
.sh-agtime { display: flex; align-items: center; gap: var(--sm); padding: 0 8px 5px 28px; font-family: var(--mono-font); font-size: 9.5px; color: var(--text-muted); min-width: 0; }
.sh-agtime b { color: var(--text-secondary); font-weight: 700; }
#panel-agents .sh-run-h .pm-rmetric { display: none !important; }
#panel-agents .sh-agtime { display: flex; }

/* width bands — content demotion and icon-only tabs. Pill *labels* are
   data-fit measured, not band-gated.
   The container padding/margin demotions that used to live here (head, body,
   banner, segtab, scroll, foot, idxpanel, selbar, receipt-card rows) were
   promoted into the base rules — they now apply at every width. */
.side-panel-slot[data-wtier="min"] .sh-owner { display: none; }
.side-panel-slot[data-wtier="min"] .sh-bbranch { width: 100%; max-width: none; }
.side-panel-slot[data-wtier="min"] .sh-bbranch .pm6-tb-menu-trigger { width: 100%; max-width: none; padding: 4px 8px; }
/* NOT redundant with the promoted base .sh-accb: this outranks the
   component-specific `.sh-chg|.sh-file|.sh-commit|.sh-stage|.pm-sumcard >
   .sh-accb` rules, flattening their indents/zero-insets at the min band.
   Deleting it would re-widen those bodies under 250px. */
.side-panel-slot[data-wtier="min"] .sh-accb { padding: 0 var(--md) var(--md); }
.side-panel-slot[data-wtier="min"] .sh-title { font-size: 10.5px; letter-spacing: .2px; }
.side-panel-slot[data-wtier="min"] .pm-segtab-item { gap: 0; padding: 8px 1px 7px; }
.side-panel-slot[data-wtier="min"] .pm-segtab-item > span { display: none; }
.side-panel-slot[data-wtier="min"] .pm-segtab-item svg { width: 16px; height: 16px; }

/* pane entrance: staggered rise on subview switches (ported fmPaneIn pattern;
   transform/opacity only, delays capped at the 4th child, reduced-motion safe) */
@keyframes shPaneIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
[data-pane]:not(.pm-hidden) > * { animation: shPaneIn .3s var(--ease-out) both; }
[data-pane]:not(.pm-hidden) > *:nth-child(2) { animation-delay: .05s; }
[data-pane]:not(.pm-hidden) > *:nth-child(3) { animation-delay: .1s; }
[data-pane]:not(.pm-hidden) > *:nth-child(n+4) { animation-delay: .15s; }

@media (prefers-reduced-motion: reduce) {
  .sh-stage.now .sh-stgnum::after { content: none; }
  .sh-thumb::after { transition: none; }
  .pm-segtab-ink { transition: none; }
  [data-pane]:not(.pm-hidden) > * { animation: none; }
}
[data-reduced-motion="1"] .sh-stage.now .sh-stgnum::after { content: none; }
[data-reduced-motion="1"] .sh-thumb::after { transition: none; }
[data-reduced-motion="1"] .pm-segtab-ink { transition: none; }
[data-reduced-motion="1"] [data-pane]:not(.pm-hidden) > * { animation: none; }

/* ---- c2 files layer (File Manager, deduped vs c2) ---- */
/* =====================================================================
   C2 — COZY SHELVES · FILE MANAGER
   The File Manager re-cut in the cozy-shelves language: a soft pill
   banner carrying the worktree-root picker, a toolbar carrying the
   Hide-ignored toggle, a segmented tab bar (Explorer / Changed / Open),
   a comfortable nested
   tree of pill rows with hover-reveal quick actions, a reskinned PM
   sprout context menu (Slint has no native one), and a sticky status
   footer. Tints derive from theme tokens so it stays correct on all 8
   themes; glyphs are bundled stroke SVGs only (F3-417: no emoji /
   pictographs / CDN icons; every icon-only control carries a label and
   a non-icon status word). Tree behavior defers to Plans/FileManager.md:
   virtualized (row 24px, lazy expand, 10k row-cap + Show more), current-
   file reveal with hidden-by-filter disclosure, read-only git badges
   sourced from Source Control, path-based narrow open, single-row open
   (no bulk-open), worktree-keyed roots.
   ===================================================================== */
.side-panel-view { background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.side-panel-view:not(.active) { display: none; }

/* ---- banner ---- */
.sh-banner {
  flex: none; display: flex; align-items: center; gap: var(--md);
  /* promoted from the ship-tested min band (mirrors the base .sh-banner) */
  padding: var(--md); min-width: 0; overflow: visible;
  margin: var(--sm) var(--sm) 0; border-radius: var(--radius-lg);
  background:
    radial-gradient(135% 150% at 6% -30%, color-mix(in srgb, var(--accent-primary) 17%, transparent), transparent 56%),
    radial-gradient(120% 150% at 100% 0%, color-mix(in srgb, var(--accent-blue) 11%, transparent), transparent 52%),
    var(--surface-elevated);
  box-shadow: var(--elev-1); position: relative; z-index: 2;
}
.sh-banner:hover .sh-bico { transform: rotate(-7deg) scale(1.06); }
.sh-title { font-family: var(--display-font); font-size: 12px; font-weight: 700; letter-spacing: .9px; flex: 0 0 auto; }
#panel-files .sh-bbranch { margin-left: auto; flex: 0 1 52%; min-width: 0; }
/* c2-files banner: title is content-sized (no 45% reservation) so the root
   menu keeps its 52% flex share — the 45% rule is for status-pill banners */
#panel-files .sh-banner .sh-title { flex: 0 0 auto; min-width: 0; }
.sh-bhead-acts { display: flex; align-items: center; gap: var(--xs); flex: none; }

/* ---- segmented tab bar (shared idiom) ---- */
.pm-segtab { flex: none; display: flex; margin: var(--sm) var(--sm) 0; border-bottom: 1px solid var(--border-light); background: color-mix(in srgb, var(--cat, var(--accent-primary)) 5%, var(--surface-elevated)); border-radius: var(--radius-lg) var(--radius-lg) 0 0; overflow: hidden; position: relative; }
.pm-segtab-ink { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--cat, var(--accent-primary)); border-radius: 2px 2px 0 0; transition: transform var(--motion-med) var(--ease-default), width var(--motion-med) var(--ease-default); pointer-events: none; box-shadow: 0 0 10px color-mix(in srgb, var(--cat, var(--accent-primary)) 55%, transparent); }

/* ---- selection bar (appears on multi-select) ---- */
.fm-selbar { flex: none; display: none; align-items: center; gap: var(--sm); padding: var(--sm) var(--md); margin: var(--sm) var(--sm) 0; border-radius: var(--radius-md); background: color-mix(in srgb, var(--accent-primary) 12%, var(--surface-elevated)); border: 1px solid color-mix(in srgb, var(--accent-primary) 30%, transparent); }
.fm-selbar.show { display: flex; }
.fm-selbar .fm-selcount { font-family: var(--mono-font); font-size: 10px; color: var(--text-secondary); white-space: nowrap; }
.fm-selbar .fm-selcount b { color: var(--text-primary); }
.fm-selbar .fm-selacts { display: flex; gap: var(--xs); margin-left: auto; flex-wrap: wrap; }
/* (.sh-scroll's width-only ::-webkit-scrollbar rule is gone — it was
   WebKit-only, so Firefox rendered no bar at all on all nine side panels.
   .sh-scroll is opted in to the standard bar at css-tokens instead.) */

/* ---- filter / type-ahead (collapsible; toggled from the toolbar) ---- */
.fm-filter { display: none; opacity: 0; overflow: hidden; margin-bottom: 0; align-items: center; gap: var(--sm); transition: max-height var(--motion-med) var(--ease-default), opacity var(--motion-med) var(--ease-out), margin-bottom var(--motion-med) var(--ease-default); }
.fm-filter.open { display: flex; opacity: 1; margin-bottom: var(--md); }
.fm-filter .pm-input { flex: 1 1 auto; min-width: 0; border-radius: var(--radius-pill); }
.fm-filtercount { flex: 0 0 auto; font-family: var(--mono-font); font-size: 9px; color: var(--text-muted); white-space: nowrap; }
.fm-filterclear { flex: none; }

/* ---- tree ---- */
.fm-tree { display: flex; flex-direction: column; }
.fm-node { border-radius: var(--radius-md); }
.fm-row { display: grid; grid-template-columns: auto var(--sm) minmax(0, 1fr) auto; align-items: center; padding: 2px 6px; border-radius: var(--radius-md); min-width: 0; cursor: pointer; position: relative; transition: background var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out), box-shadow var(--motion-fast) var(--ease-out); }
.fm-row > .fm-chevron, .fm-row > .fm-ficon { grid-column: 1; }
.fm-row > .fm-name { grid-column: 3; }
.fm-row > .fm-trail { grid-column: 4; }
.fm-row:hover { background: color-mix(in srgb, var(--accent-primary) 8%, transparent); transform: translateX(2px); }
.fm-row:active { transform: scale(.985); }
.fm-row.selected { background: color-mix(in srgb, var(--accent-primary) 16%, transparent); }
.fm-row.active-file { background: color-mix(in srgb, var(--accent-primary) 12%, transparent); }
.fm-row.ignored { opacity: .5; }
.fm-row.ignored .fm-name { font-style: italic; }
.fm-chevron { width: 12px; height: 12px; flex: none; color: var(--text-muted); transition: transform var(--motion-med) var(--ease-default); }
.fm-node.open > .fm-row > .fm-chevron { transform: rotate(90deg); }
.fm-ficon { width: 15px; height: 15px; flex: none; color: var(--text-muted); }
.fm-ficon.folder { color: var(--accent-warning); }
.fm-ficon.rs { color: var(--accent-orange); }
.fm-ficon.ts, .fm-ficon.tsx { color: var(--accent-blue); }
.fm-ficon.js, .fm-ficon.jsx { color: var(--cat-amber); }
.fm-ficon.svelte { color: var(--accent-magenta); }
.fm-ficon.sql { color: var(--accent-lime); }
.fm-ficon.toml { color: var(--accent-orange); }
.fm-ficon.yml, .fm-ficon.yaml { color: var(--accent-lime); }
.fm-ficon.xml { color: var(--accent-magenta); }
.fm-ficon.md { color: var(--text-secondary); }
.fm-ficon.docker { color: var(--accent-blue); }
.fm-name { min-width: 0; font-size: 11px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color var(--motion-fast) var(--ease-out); }
.fm-name.mono { font-family: var(--mono-font); font-size: 10.5px; }
.fm-folder > .fm-row > .fm-name { font-weight: 600; }
/* filename colour by git state: clean = normal text; ignored = muted/dull */
.fm-row.M > .fm-name { color: var(--accent-warning); }
.fm-row.A > .fm-name { color: var(--graph-passed); }
.fm-row.Q > .fm-name { color: var(--accent-blue); }
.fm-row.D > .fm-name { color: var(--graph-failed); }
.fm-row.C > .fm-name { color: var(--accent-blue); }
.fm-row.ignored > .fm-name { color: var(--text-muted); }
/* trailing cell: fixed-width right column so counts + badges align on every row;
   quick actions overlay it on hover (gradient backdrop) so nothing jumps */
.fm-trail { position: relative; display: flex; align-items: center; justify-content: flex-end; gap: 4px; min-width: 46px; height: 20px; }
.fm-trail .fm-markers { display: flex; align-items: center; gap: 4px; transition: opacity var(--motion-fast) var(--ease-out); }
.fm-count { flex: none; font-family: var(--mono-font); font-size: 8.5px; color: var(--text-muted); }
.fm-gitbadge { flex: none; display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono-font); font-size: 8px; font-weight: 700; padding: 0 5px; border-radius: var(--radius-pill); }
.fm-gitbadge svg { width: 9px; height: 9px; }
.fm-gitbadge.M { color: var(--accent-warning); background: color-mix(in srgb, var(--accent-warning) 16%, transparent); }
.fm-gitbadge.A { color: var(--graph-passed); background: color-mix(in srgb, var(--graph-passed) 16%, transparent); }
.fm-gitbadge.Q { color: var(--text-muted); background: color-mix(in srgb, var(--text-muted) 18%, transparent); }
.fm-gitbadge.D { color: var(--graph-failed); background: color-mix(in srgb, var(--graph-failed) 16%, transparent); }
.fm-gitbadge.C { color: var(--accent-blue); background: color-mix(in srgb, var(--accent-blue) 16%, transparent); }
.fm-quick { position: absolute; right: 0; top: 50%; transform: translateY(-50%) translateX(6px); display: flex; align-items: center; gap: 2px; padding-left: 12px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface-elevated) 94%, transparent) 30%, var(--surface-elevated) 62%); opacity: 0; pointer-events: none; transition: opacity var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.fm-quick .pm-minibtn { width: 20px; height: 20px; border-radius: var(--radius-pill); transition: transform var(--motion-fast) var(--ease-out), background var(--motion-fast) var(--ease-out); }
.fm-quick .pm-minibtn:hover { transform: translateY(-1px) scale(1.08); }
.fm-quick .pm-minibtn svg { width: 11px; height: 11px; }
.fm-row:hover .fm-quick, .fm-row.selected .fm-quick { opacity: 1; transform: translateY(-50%) translateX(0); pointer-events: auto; }
.fm-row:hover .fm-markers, .fm-row.selected .fm-markers { opacity: 0; }
[data-reduced-motion="1"] .fm-quick, [data-reduced-motion="1"] .fm-trail .fm-markers { transition: none; }
/* nesting — closed = display:none (guaranteed 0 height, no gaps); open/close
   height is animated via JS-measured max-height (see collapse IIFE) */
.fm-children { display: none; opacity: 0; overflow: hidden; padding-left: 7px; border-left: 1px solid color-mix(in srgb, var(--border-light) 80%, transparent); margin-left: 5px; transition: max-height var(--motion-med) var(--ease-default), opacity var(--motion-med) var(--ease-out); will-change: max-height, opacity; }
.fm-node.open > .fm-children { display: block; opacity: 1; }
/* row-cap + show more */
.fm-showmore { display: flex; align-items: center; gap: var(--sm); padding: 4px 8px 4px 20px; font-family: var(--mono-font); font-size: 9px; color: var(--accent-primary); cursor: pointer; }
.fm-showmore:hover { text-decoration: underline; }
.fm-emptytree { padding: var(--lg); text-align: center; color: var(--text-muted); font-size: 10.5px; line-height: 1.6; }

/* ---- cozy shelf cards (Changed / Open groups) ---- */
.sh-shelf { border-radius: var(--radius-lg); background: color-mix(in srgb, var(--cat, var(--accent-blue)) 7%, var(--surface-elevated)); border: 1px solid color-mix(in srgb, var(--cat, var(--accent-blue)) 16%, var(--border-light)); margin-bottom: var(--md); overflow: visible; box-shadow: var(--elev-1); }
.side-panel-view .pm-btn { border-radius: var(--radius-pill); }
.fm-changerow { display: flex; align-items: center; gap: var(--sm); padding: 5px 6px 5px 9px; border-radius: var(--radius-md); min-width: 0; position: relative; transition: background var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.fm-changerow::before { content: ''; position: absolute; left: 0; top: 5px; bottom: 5px; width: 2px; border-radius: 2px; background: var(--cat, var(--accent-blue)); opacity: 0; transform: scaleY(.4); transition: opacity var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.fm-changerow:hover { background: color-mix(in srgb, var(--cat) 9%, transparent); transform: translateX(2px); }

/* ---- Left-rail frosted scroll-under — ALL NINE panels, files included. ----
   The chrome above .sh-scroll is one row in some panels, two in others and
   five in #panel-files (.sh-banner, .pm-segtab, .fm-toolbar-wrap, .fm-selbar,
   .fm-filter — the last two come and go). Rather than key on any of that,
   PM_FROST measures --pm6-shrun-banner-h with gap:true: it walks back from the
   scroller to the last VISIBLE row above it. Shape stops mattering, which is
   what finally made #panel-files tractable.
   EVERY chrome row carries the plate, not just the banner: content passing
   behind an unplated row shows through the gap between plates.
   The banner is an inset pill (margin var(--sm), radius var(--radius-lg),
   elev-1, two-radial-gradient fill), so only its background-COLOR goes
   translucent — both accent radials survive. z-index 2 -> 5 keeps it under
   .sh-shelf.menu-open's 6 so sprout menus still float over it, and above the
   lifted scroller so the tab strip and toolbar stay clickable. ---- */
.side-panel-view .sh-banner,
.side-panel-view .pm-segtab,
.side-panel-view .fm-toolbar-wrap,
.side-panel-view .fm-selbar,
.side-panel-view .fm-filter {
  position: relative;
  z-index: 5;
  background-color: color-mix(in srgb, var(--surface-elevated) 72%, transparent);
  -webkit-backdrop-filter: blur(11px) saturate(140%);
  backdrop-filter: blur(11px) saturate(140%);
}
/* glass blur budget: no nested backdrop-filter inside the panel */
[data-theme^="glass"] .side-panel-view .sh-banner,
[data-theme^="glass"] .side-panel-view .pm-segtab,
[data-theme^="glass"] .side-panel-view .fm-toolbar-wrap,
[data-theme^="glass"] .side-panel-view .fm-selbar,

   the real measured chrome height per panel. */
.side-panel-view { --pm6-shrun-banner-h: 42px; }
/* The flex arithmetic here is exact, not approximate, and it is worth stating
   because it is easy to "fix" into a bug: for a flex:1 item, margin-top:-H
   raises free space by H, so the item claims H MORE height and its top moves
   up by H. Net: top 0, bottom = container bottom. It fills the panel with no
   overflow and leaves no dead strip. padding-top then puts content back below
   the chrome. Do not add a compensating margin-bottom — that WOULD create the
   gap it looks like it should close. */
