<script id="pm6-js-orchestrator">
/* PMConcept6 — Orchestrator page renderer (owner: orchestrator agent).
   Consumes PM_DEMO (bus/state/facades) only; never mutates engine state
   directly. Seven tabs: Progress | Plan Compile | Seams | Node Graph |
   Evidence | History | Ledger. */
(function () {
  'use strict';

  var root = document.getElementById('panel-orchestrator');
  if (!root) return;

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function $q(sel, scope) { return (scope || root).querySelector(sel); }
  function $qa(sel, scope) { return Array.prototype.slice.call((scope || root).querySelectorAll(sel)); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function say(msg) { try { if (window.toast) window.toast(msg); } catch (e) {} }
  function D() { return window.PM_DEMO || null; }
  function ST() { var d = D(); return d && d.state ? d.state : null; }
  function DATA() { var d = D(); return d && d.data ? d.data : null; }
  function safe(fn, tag) {
    return function () {
      try { return fn.apply(null, arguments); }
      catch (e) { try { console.error('[pm6-orch]', tag || 'render', e); } catch (e0) {} }
    };
  }
  function ico(key) {
    var m = window.PM_ICONS || {};
    return '<span class="pm6-ico" aria-hidden="true">' + (m[key] || m.gear || '') + '</span>';
  }
  function hydrateIcons(scope) {
    var m = window.PM_ICONS;
    if (!m) return;
    $qa('.pm6-ico[data-ico]', scope || root).forEach(function (el) {
      var k = el.getAttribute('data-ico');
      if (m[k]) { el.innerHTML = m[k]; el.removeAttribute('data-ico'); }
    });
  }
  function hashStr(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
  }
  function chip(text, tone) {
    return '<span class="pm6-orch-chip"' + (tone ? ' data-tone="' + tone + '"' : '') + '>' + esc(text) + '</span>';
  }
  function dot(state) { return '<span class="pm6-orch-dot" data-state="' + esc(state) + '"></span>'; }

  /* closed-vocab disabled-reason copy + recovery hints (display only) */
  var REASON_HINT = {
    unsupported: 'Not supported in this build.',
    not_configured: 'Not configured — connect it in Settings first.',
    busy: 'Another operation is still running — let it finish first.',
    blocked_by_gate: 'Blocked by an open approval gate — resolve it below or in Chat.',
    already_done: 'Already done — nothing new to apply.',
    stale: 'Projection is stale — wait for it to refresh before mutating.',
    demo_scope: 'Outside the Tastebook demo script.'
  };

  /* ---------- run meta (deterministic display-only derivations) ---------- */
  var LANE_META = {
    'lane-a': { provider: 'Claude', model: 'Sonnet 4.6', persona: 'worker-data', effort: 'medium' },
    'lane-b': { provider: 'Claude', model: 'Opus 4.6', persona: 'worker-backend', effort: 'high' },
    'lane-c': { provider: 'Cursor', model: 'composer-2', persona: 'worker-frontend', effort: 'medium' },
    'lane-d': { provider: 'Codex', model: 'GPT-5.2', persona: 'worker-infra', effort: 'medium' }
  };
  var SAFE_POINTS = { 'n-13': 'sp-47a9', 'n-19': 'sp-47c2' };
  function safePointOf(nodeId) {
    return SAFE_POINTS[nodeId] || ('sp-47' + nodeId.replace('n-', ''));
  }
  function nodeMeta(n) {
    var lm = LANE_META[n.lane] || LANE_META['lane-a'];
    var h = hashStr(n.id + n.label);
    var switched = false;
    var st = ST();
    if (st && st.run.accountSwitches.length && lm.provider === 'Claude') switched = true;
    return {
      provider: lm.provider, model: lm.model, persona: lm.persona,
      effort: (n.id === 'n-13' || n.id === 'n-19') ? 'high' : lm.effort,
      accountReq: 'jared-dev',
      accountEff: switched ? 'jared-burst' : 'jared-dev',
      tokensIn: 2400 + h % 9200,
      tokensOut: 700 + h % 3400,
      cost: (0.01 + (h % 90) / 1000).toFixed(3),
      safePoint: safePointOf(n.id)
    };
  }
  function laneLabel(laneId) {
    var d = DATA();
    if (!d) return laneId;
    for (var i = 0; i < d.run.lanes.length; i++) if (d.run.lanes[i].id === laneId) return d.run.lanes[i].label;
    return laneId;
  }
  function laneSpec(laneId) {
    var d = DATA();
    if (!d) return null;
    for (var i = 0; i < d.run.lanes.length; i++) if (d.run.lanes[i].id === laneId) return d.run.lanes[i];
    return null;
  }
  function seamOfLane(laneId) {
    var d = DATA();
    if (!d) return null;
    for (var i = 0; i < d.run.seams.length; i++) {
      if (d.run.seams[i].lanes.indexOf(laneId) !== -1) return d.run.seams[i];
    }
    return null;
  }
  var PKG_NAMES = ['core', 'services', 'ops'];
  function pkgOfCol(laneId, col) {
    var slot = col <= 3 ? 0 : (col <= 6 ? 1 : 2);
    return laneLabel(laneId) + '-' + PKG_NAMES[slot];
  }
  function isProblem(stateName) {
    return stateName === 'attention_required' || stateName === 'blocked' || stateName === 'recovering';
  }
  function hist() {
    var st = ST();
    return !!(st && st.run.focusMode === 'historical');
  }
  function focusedId() {
    var st = ST();
    return (st && (st.run.focusedRunId || st.run.id)) || 'pcr-47';
  }
  function lockedHtml(msg) {
    return '<div class="pm6-orch-locked">' + ico('telescope') +
      '<span>' + esc(msg || 'Historical snapshot — live telemetry is paused for this widget.') + '</span>' +
      '<button type="button" class="pm6-orch-mini-btn" data-demo-action="orch.focusLive">Back to live ' + esc((ST() && ST().run.id) || 'pcr-47') + ' &#8594;</button></div>';
  }

  /* ---------- dirty-flag render scheduler ---------- */
  var dirty = {}, rafPending = false;
  var RENDERERS = {};
  function mark() {
    for (var i = 0; i < arguments.length; i++) dirty[arguments[i]] = true;
    if (rafPending) return;
    rafPending = true;
    var raf = window.requestAnimationFrame || function (f) { setTimeout(f, 32); };
    raf(function () {
      rafPending = false;
      var keys = Object.keys(dirty);
      dirty = {};
      keys.forEach(function (k) { if (RENDERERS[k]) RENDERERS[k](); });
    });
  }
  function markAll() {
    mark('header', 'progress', 'plancompile', 'seams', 'graph', 'evidence', 'history', 'ledger');
  }

  /* ---------- header + banners + tab badges ---------- */
  var elapsedStart = null, elapsedEnd = null;
  RENDERERS.header = safe(function () {
    var st = ST();
    if (!st) return;
    var run = st.run;
    var chipId = $('pm6OrchRunChipId'), modeEl = $('pm6OrchRunMode');
    if (chipId) chipId.textContent = focusedId();
    if (modeEl) {
      modeEl.textContent = run.focusMode === 'historical' ? 'historical' : 'live';
      modeEl.setAttribute('data-mode', run.focusMode === 'historical' ? 'historical' : 'live');
    }
    var badge = $('pm6OrchStatusBadge');
    if (badge) {
      var stage = run.stage || 'idle';
      var label = !st.clock.playing && stage !== 'complete' ? 'Paused'
        : stage === 'idle' ? 'Ready'
        : stage === 'pending-launch' ? 'Pending launch'
        : stage === 'compiling' ? 'Compiling'
        : stage === 'executing' ? 'Running'
        : stage === 'blocked' ? 'Blocked'
        : stage === 'complete' ? 'Complete' : stage;
      badge.textContent = label;
      badge.setAttribute('data-state',
        !st.clock.playing && stage !== 'complete' ? 'paused'
        : stage === 'executing' ? 'running' : stage);
    }
    /* freshness */
    var fr = run.freshness || 'current';
    var fchip = $('pm6OrchFreshChip'), flabel = $('pm6OrchFreshLabel'), fban = $('pm6OrchFreshBanner');
    if (fchip) fchip.setAttribute('data-fresh', fr);
    if (flabel) flabel.textContent = 'Projection: ' + fr;
    if (fban) fban.hidden = fr === 'current';
    /* historical banner */
    var hban = $('pm6OrchHistBanner'), htext = $('pm6OrchHistBannerText');
    if (hban) hban.hidden = !hist();
    if (htext && hist()) {
      htext.textContent = 'Viewing ' + focusedId() + ' — read-only historical snapshot. Controls that mutate the run are parked.';
    }
    /* pause / resume */
    var pb = $('pm6OrchPauseBtn'), rb = $('pm6OrchResumeBtn');
    if (pb && rb) {
      var playing = !!st.clock.playing;
      if (hist()) {
        pb.disabled = true; rb.disabled = true;
        pb.setAttribute('data-reason', 'stale'); rb.setAttribute('data-reason', 'stale');
        pb.title = 'stale — historical snapshot; focus the live run to control it';
        rb.title = pb.title;
      } else {
        pb.disabled = !playing;
        rb.disabled = playing;
        pb.setAttribute('data-reason', playing ? '' : 'already_done');
        rb.setAttribute('data-reason', playing ? 'already_done' : '');
        pb.title = playing ? 'Pause the focused run at the next safe point' : 'already_done — ' + REASON_HINT.already_done;
        rb.title = playing ? 'already_done — run is already live' : 'Resume the paused run';
      }
    }
    /* elapsed */
    var stage2 = run.stage;
    if (stage2 && stage2 !== 'idle' && stage2 !== 'pending-launch' && elapsedStart === null) {
      var guess = stage2 === 'complete' ? 110000 : (stage2 === 'compiling' ? 2000 : 45000);
      elapsedStart = st.clock.t - guess;
    }
    if (stage2 === 'complete' && elapsedEnd === null && elapsedStart !== null) elapsedEnd = st.clock.t;
    var eEl = $('pm6OrchElapsed');
    if (eEl) {
      eEl.textContent = elapsedStart === null ? '--:--'
        : fmtClock(((elapsedEnd === null ? st.clock.t : elapsedEnd) - elapsedStart) / 1000);
    }
    /* tab badges */
    var gates = run.gates || {};
    var pending = Object.keys(gates).filter(function (k) { return gates[k].state === 'attention_required'; }).length;
    var bp = $('orchTabBadgeProgress');
    if (bp) bp.textContent = pending ? String(pending) : '';
    var attn = false;
    Object.keys(run.nodes || {}).forEach(function (k) { if (isProblem(run.nodes[k].state)) attn = true; });
    var bg = $('orchTabBadgeNodeGraph');
    if (bg) bg.style.display = attn ? 'inline-block' : 'none';
    var be = $('orchTabBadgeEvidence');
    if (be) be.textContent = String(evidenceRows().length);
    var bl = $('orchTabBadgeLedger');
    var d = D();
    if (bl) bl.textContent = d && d.log ? String(d.log.length) : '';
  }, 'header');

  /* ---------- Progress widgets ---------- */
  function laneRowsHtml() {
    var st = ST(), out = '';
    if (!st) return out;
    st.run.lanes.forEach(function (l) {
      var pct = l.total ? Math.round(l.done / l.total * 100) : 0;
      var tone = l.state === 'complete' ? 'ok' : (l.state === 'running' ? 'run' : 'mut');
      out += '<div class="pm6-orch-row">' + dot(l.state === 'running' ? 'running' : (l.state === 'complete' ? 'complete' : 'queued')) +
        '<div class="pm6-orch-row-main"><div class="pm6-orch-row-title">' + esc(l.label) + '</div>' +
        '<div class="pm6-orch-row-sub">worktree ' + esc(l.worktree) + '</div></div>' +
        '<div class="pm6-orch-bar" style="max-width:130px"><i style="width:' + pct + '%"' + (l.state === 'complete' ? ' data-state="complete"' : '') + '></i></div>' +
        chip(l.done + '/' + l.total, tone) + '</div>';
    });
    return out;
  }
  RENDERERS.progress = safe(function () {
    var st = ST(), d = DATA();
    if (!st || !d) return;
    var run = st.run;

    /* CTA slot */
    var slot = $('pm6OrchCtaSlot');
    if (slot) {
      var html = '';
      if (hist()) {
        html += '<div class="pm6-orch-cta" data-severity="info">' + ico('telescope') +
          '<div class="pm6-orch-cta-text"><div class="pm6-orch-cta-title">Historical focus: ' + esc(focusedId()) + '</div>' +
          '<div class="pm6-orch-cta-body">This is a durable snapshot. Nothing here mutates — switch back to the live run to act.</div></div>' +
          '<div class="pm6-orch-cta-actions"><button type="button" class="pm6-orch-ctl pm6-orch-ctl-primary" data-demo-action="orch.focusLive">Back to live</button></div></div>';
      } else {
        (st.dash.ctas || []).forEach(function (c) {
          if (c.id !== 'cta-gate' && c.id !== 'cta-safepoint') return;
          var sev = c.severity === 'blocked' ? 'blocked' : 'attn';
          var actions = '';
          if (c.id === 'cta-gate') {
            actions = '<button type="button" class="pm6-orch-ctl pm6-orch-ctl-primary" data-demo-action="run.approve_gate" data-command="cmd.runtime.approve">Approve</button>' +
              '<button type="button" class="pm6-orch-ctl" data-demo-action="run.decline_gate">Decline</button>';
          } else {
            actions = '<button type="button" class="pm6-orch-ctl pm6-orch-ctl-primary" data-demo-action="orch.safePointOpen" data-demo-arg="n-13" data-command="cmd.orchestrator.safe_point_retry">Retry from safe point</button>';
          }
          html += '<div class="pm6-orch-cta" data-severity="' + sev + '">' + ico(c.id === 'cta-gate' ? 'warning' : 'restart') +
            '<div class="pm6-orch-cta-text"><div class="pm6-orch-cta-title">' + esc(c.title) + '</div>' +
            '<div class="pm6-orch-cta-body">' + esc(c.body || '') + '</div></div>' +
            '<div class="pm6-orch-cta-actions">' + actions + '</div></div>';
        });
      }
      slot.innerHTML = html;
    }

    /* run-overview */
    var ov = $('pm6OrchWRunOverview'), ovK = $('pm6OrchWOverviewKicker');
    if (ov) {
      if (run.stage === 'idle') {
        ov.innerHTML = '<div class="pm6-orch-empty">No PlanCompileRun bound yet. Approve And Build in the Planning Wizard launches one here.</div>';
      } else if (hist()) {
        var h = null;
        (run.history || []).forEach(function (x) { if (x.id === focusedId()) h = x; });
        ov.innerHTML = h
          ? '<div class="pm6-orch-row">' + dot(h.state === 'degraded' ? 'degraded' : 'complete') +
            '<div class="pm6-orch-row-main"><div class="pm6-orch-row-title">' + esc(h.label) + '</div>' +
            '<div class="pm6-orch-row-sub">' + esc(h.when) + ' &middot; ' + h.nodes + ' nodes &middot; durable record</div></div>' +
            chip(h.state, h.state === 'degraded' ? 'warn' : 'ok') + '</div>' + lockedHtml('Summary only — the full execution tree lives in the durable ledger.')
          : lockedHtml();
      } else {
        var html2 = '';
        d.run.seams.forEach(function (sm) {
          var tot = 0, done = 0, laneHtml = '';
          sm.lanes.forEach(function (laneId) {
            var lane = null;
            run.lanes.forEach(function (l) { if (l.id === laneId) lane = l; });
            if (!lane) return;
            tot += lane.total; done += lane.done;
            var pct = lane.total ? Math.round(lane.done / lane.total * 100) : 0;
            laneHtml += '<div class="pm6-orch-tree-lane"><b>' + esc(lane.label) + '</b>' +
              '<div class="pm6-orch-bar"><i style="width:' + pct + '%"' + (lane.done === lane.total ? ' data-state="complete"' : '') + '></i></div>' +
              '<span class="pm6-orch-row-sub">' + lane.done + '/' + lane.total + '</span></div>';
          });
          var sealed = done === tot && tot > 0;
          html2 += '<div class="pm6-orch-tree-seam"><div class="pm6-orch-tree-seam-head">' + ico('layers') + esc(sm.label) +
            chip(sealed ? 'seam_complete' : done + '/' + tot + ' nodes', sealed ? 'ok' : 'run') + '</div>' + laneHtml + '</div>';
        });
        ov.innerHTML = html2;
        hydrateIcons(ov);
      }
    }
    if (ovK) ovK.textContent = run.stage === 'idle' ? 'execution tree' : run.planUnits + ' PlanUnits · 40 nodes';

    /* current node */
    var cur = $('pm6OrchWCurrentNode');
    if (cur) {
      if (hist()) { cur.innerHTML = lockedHtml(); }
      else {
        var active = null;
        Object.keys(run.nodes).forEach(function (k) {
          var n = run.nodes[k];
          if (!active && (n.state === 'attention_required' || n.state === 'recovering' || n.state === 'blocked')) active = n;
        });
        if (!active) {
          Object.keys(run.nodes).forEach(function (k) {
            if (!active && run.nodes[k].state === 'running') active = run.nodes[k];
          });
        }
        if (!active) {
          cur.innerHTML = '<div class="pm6-orch-empty">' + (run.stage === 'complete'
            ? 'Run complete — every node sealed. Nothing is executing.'
            : 'No node running yet.') + '</div>';
        } else {
          var m = nodeMeta(active);
          var logLine = active.state === 'recovering'
            ? 'restoring ' + m.safePoint + ' &middot; attempt ' + (active.attempts + 1)
            : active.state === 'attention_required'
              ? 'holding for approval &middot; gate g-image-processing'
              : 'cargo test ' + laneLabel(active.lane) + '::' + active.id.replace('-', '_') + ' &middot; streaming';
          cur.innerHTML =
            '<div class="pm6-orch-cur-label">' + esc(active.label) + '</div>' +
            '<div class="pm6-orch-cur-meta">' + esc(active.id) + ' &middot; lane ' + esc(laneLabel(active.lane)) + ' &middot; ' + esc(active.state) + '</div>' +
            '<div class="pm6-orch-kv"><span>requested &#8594; effective</span><b>' + esc(m.provider + ' ' + m.model) + '</b></div>' +
            '<div class="pm6-orch-kv"><span>persona / effort</span><b>' + esc(m.persona + ' / ' + m.effort) + '</b></div>' +
            '<div class="pm6-orch-kv"><span>account</span><b>' + esc(m.accountReq === m.accountEff ? m.accountEff : m.accountReq + ' &#8594; ' + m.accountEff) + '</b></div>' +
            '<div class="pm6-orch-cur-log">' + logLine + '</div>' +
            '<div class="pm6-orch-insp-actions"><button type="button" class="pm6-orch-mini-btn" data-demo-action="orch.inspect" data-demo-arg="' + active.id + '">Inspect in graph</button>' +
            '<button type="button" class="pm6-orch-mini-btn" data-demo-action="orch.nodeEvidence" data-demo-arg="' + active.id + '">Open evidence</button></div>';
        }
      }
    }

    /* approval queue */
    var ap = $('pm6OrchWApprovals'), apK = $('pm6OrchWApprovalsKicker');
    if (ap) {
      if (hist()) { ap.innerHTML = lockedHtml(); if (apK) apK.textContent = 'snapshot'; }
      else {
        var gates = run.gates || {}, keys = Object.keys(gates);
        var waiting = keys.filter(function (k) { return gates[k].state === 'attention_required'; });
        if (apK) apK.textContent = waiting.length + ' waiting';
        if (!keys.length) {
          ap.innerHTML = '<div class="pm6-orch-empty">No approvals pending. Gates will surface here the moment a node needs you.</div>';
        } else {
          var gh = '';
          keys.forEach(function (k) {
            var g = gates[k];
            if (g.state === 'attention_required') {
              gh += '<div class="pm6-orch-gate"><div class="pm6-orch-row-title">' + ico('warning') + ' ' + esc(g.label) + ' <span class="pm6-orch-mono">(' + esc(g.node) + ')</span></div>' +
                '<div class="pm6-orch-gate-q">' + esc(g.question) + '</div>' +
                '<div class="pm6-orch-gate-actions">' +
                '<button type="button" class="pm6-orch-ctl pm6-orch-ctl-primary" data-demo-action="run.approve_gate" data-demo-arg="' + esc(g.id) + '">Approve</button>' +
                '<button type="button" class="pm6-orch-ctl" data-demo-action="run.decline_gate" data-demo-arg="' + esc(g.id) + '">Decline</button>' +
                '</div></div>';
            } else {
              gh += '<div class="pm6-orch-row">' + dot(g.state === 'approved' ? 'complete' : 'blocked') +
                '<div class="pm6-orch-row-main"><div class="pm6-orch-row-title">' + esc(g.label) + '</div>' +
                '<div class="pm6-orch-row-sub">receipt: gate ' + esc(g.state) + ' &middot; ' + esc(g.node) + '</div></div>' +
                chip(g.state, g.state === 'approved' ? 'ok' : 'err') + '</div>';
            }
          });
          ap.innerHTML = gh;
          hydrateIcons(ap);
        }
      }
    }

    /* lane health */
    var lh = $('pm6OrchWLanes');
    if (lh) lh.innerHTML = hist() ? lockedHtml() : (run.stage === 'idle'
      ? '<div class="pm6-orch-empty">Lanes appear when the run binds.</div>' : laneRowsHtml());

    /* blocked + concerns */
    var cw = $('pm6OrchWConcerns'), cwK = $('pm6OrchWConcernsKicker');
    if (cw) {
      if (hist()) { cw.innerHTML = lockedHtml(); }
      else {
        var concerns = [];
        Object.keys(run.gates || {}).forEach(function (k) {
          var g = run.gates[k];
          if (g.state === 'declined') {
            concerns.push({ sev: 'blocked', owner: 'User', title: g.label + ' declined', sub: 'blocked-owner: User · node ' + g.node + ' parked at ' + safePointOf(g.node), lifecycle: 'active' });
          }
        });
        Object.keys(run.nodes).forEach(function (k) {
          var n = run.nodes[k];
          if (n.state === 'recovering') {
            concerns.push({ sev: 'attention_required', owner: 'Recovery', title: n.label + ' recovering', sub: 'blocked-owner: Recovery · attempt ' + (n.attempts + 1) + ' from ' + safePointOf(n.id), lifecycle: 'active' });
          } else if (n.degraded && n.state === 'complete') {
            concerns.push({ sev: 'watch', owner: 'Package Overseer', title: n.label + ' finished degraded', sub: 'resolution_kind: accepted_risk · regression fixture added', lifecycle: 'resolved' });
          }
        });
        if (run.freshness && run.freshness !== 'current') {
          concerns.push({ sev: 'watch', owner: 'Runtime', title: 'Projection ' + run.freshness, sub: 'degraded_projection advisory — figures may lag the run', lifecycle: 'active' });
        }
        if (cwK) cwK.textContent = concerns.filter(function (c) { return c.lifecycle === 'active'; }).length + ' active';
        cw.innerHTML = concerns.length ? concerns.map(function (c) {
          var tone = c.sev === 'blocked' ? 'err' : (c.sev === 'attention_required' ? 'warn' : 'mut');
          return '<div class="pm6-orch-row">' + dot(c.sev === 'blocked' ? 'blocked' : (c.sev === 'attention_required' ? 'attention_required' : 'degraded')) +
            '<div class="pm6-orch-row-main"><div class="pm6-orch-row-title">' + esc(c.title) + '</div>' +
            '<div class="pm6-orch-row-sub">' + esc(c.sub) + '</div></div>' + chip(c.lifecycle, tone) + '</div>';
        }).join('') : '<div class="pm6-orch-empty">Nothing blocked. All concerns resolved or dismissed.</div>';
      }
    }

        '<span class="pm6-orch-hist-id">' + esc(r.id) + '</span>' +
        '<span class="pm6-orch-hist-name">' + esc(r.name) + '</span>' +
        '<span class="pm6-orch-hist-meta">' + esc(r.meta) + '</span>' +
        '<span class="pm6-orch-hist-state">' + esc(r.stateLabel) + '</span>' +
        (focused
          ? '<button type="button" class="pm6-orch-mini-btn" disabled data-reason="already_done" title="already_done — this run already has focus">Focused</button>'
          : (r.live
            ? '<button type="button" class="pm6-orch-mini-btn" data-demo-action="orch.focusLive">Focus</button>'
            : '<button type="button" class="pm6-orch-mini-btn" data-demo-action="orch.focusRun" data-demo-arg="' + esc(r.id) + '">Focus</button>')) +
        '</div>';
    }).join('');
  }, 'history');

  /* ---------- Ledger ---------- */
  function ledgerFamily(action) {
    if (/gate|approveGate|declineGate/i.test(action)) return 'gate';
    if (/promote/i.test(action)) return 'promotion';
    if (/account/i.test(action)) return 'account';
    if (/fail|retry|degraded|safePoint/i.test(action)) return 'recovery';
    if (/^run\./.test(action)) return 'run';
    return 'other';
  }
  function ledgerSubject(args) {
    if (!args) return '—';
    return args.id || args.node || args.topic || args.ref || args.cls || args.marker || '—';
  }
  var ledgerRendered = 0;
  RENDERERS.ledger = safe(function () {
    var body = $('pm6OrchLedgerBody');
    var d = D();
    if (!body || !d || !d.log) return;
    var filterSel = $('pm6OrchLedgerFilter');
    var fam = filterSel ? filterSel.value : '';
    /* full rebuild when filtered or log truncated; append otherwise */
    if (fam || ledgerRendered > d.log.length) {
      body.innerHTML = '';
      ledgerRendered = 0;
    }
    var frag = '';
    for (var i = fam ? 0 : ledgerRendered; i < d.log.length; i++) {
      var b = d.log[i];
      if (fam && ledgerFamily(b.action) !== fam) continue;
      var detail = '';
      try { detail = b.args ? JSON.stringify(b.args) : ''; } catch (e) { detail = ''; }
      if (detail.length > 90) detail = detail.slice(0, 89) + '…';
      frag += '<tr' + (i >= d.log.length - 1 && !fam ? ' class="is-new"' : '') + '>' +
        '<td>t+' + (b.t || 0) + 's</td>' +
        '<td class="pm6-orch-led-ev">' + esc(b.action) + '</td>' +
        '<td>' + esc(ledgerSubject(b.args)) + '</td>' +
        '<td class="pm6-orch-led-detail">' + esc(detail) + '</td></tr>';
    }
    if (fam) body.innerHTML = frag;
    else { body.insertAdjacentHTML('beforeend', frag); ledgerRendered = d.log.length; }
    var empty = $('pm6OrchLedgerEmpty');
    if (empty) empty.style.display = body.children.length ? 'none' : '';
  }, 'ledger');

  /* ---------- tab switching ---------- */
  var TAB_RENDER = {
    progress: ['header', 'progress'],
    plan_compile: ['plancompile'],
    seams: ['seams'],
    node_graph: ['graph'],
    evidence: ['evidence'],
    history: ['history'],
    ledger: ['ledger']
  };
  function switchTab(tabId) {
    var tab = $q('.orch-tab[data-tab="' + tabId + '"]');
    if (tab && !tab.classList.contains('active')) tab.click(); /* part-25 handler toggles classes */
    (TAB_RENDER[tabId] || []).forEach(function (k) { mark(k); });
  }
  var tabsWrap = $q('.orch-tabs');
  if (tabsWrap) {
    tabsWrap.addEventListener('click', function (e) {
      var tab = e.target.closest ? e.target.closest('.orch-tab') : null;
      if (!tab) return;
      var id = tab.getAttribute('data-tab');
      (TAB_RENDER[id] || []).forEach(function (k) { mark(k); });
      if (id === 'node_graph') { var c = $('pm6OrchGraphCanvas'); if (c) setTimeout(function () { fitGraphToWidth(false); try { c.focus({ preventScroll: true }); } catch (e0) {} }, 0); }
    });
  }
  if (window.PM_PAGES && PM_PAGES.registerSubtab) {
    PM_PAGES.registerSubtab('orchestrator', function (subTab) {
      var id = String(subTab || 'progress').replace(/-/g, '_');
      if (!TAB_RENDER[id]) id = 'progress';
      switchTab(id);
    });
  }

  /* ---------- action registrations ---------- */
  function reg(id, fn) {
    var d = D();
    if (d && d.actions && d.actions.register) d.actions.register(id, fn);
  }
  function argOf(ctx) { return ctx && ctx.arg != null ? String(ctx.arg) : ''; }
  function histGuard() {
    if (!hist()) return null;
    return { toast: 'Viewing ' + focusedId() + ' — a read-only historical snapshot. Focus the live run ' + ((ST() && ST().run.id) || 'pcr-47') + ' to control it.' };
  }
  reg('orch.copyRunId', function () {
    var id = focusedId();
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(id); } catch (e) {}
    return { toast: 'Copied focused_run_id ' + id };
  });
  reg('orch.pause', function () { return histGuard() || D().run.pause(); });
  reg('orch.resume', function () { return histGuard() || D().run.resume(); });
  reg('orch.focusLive', function () {
    var st = ST();
    var r = D().run.focusRun((st && st.run.id) || 'pcr-47');
    markAll();
    return r;
  });
  reg('orch.focusRun', function (ctx) {
    var id = argOf(ctx);
    if (!id) return { toast: 'No run id given.' };
    var r = D().run.focusRun(id);
    markAll();
    switchTab('progress');
    return { ok: true, toast: 'Focused ' + id + (id !== ((ST() && ST().run.id) || '') ? ' — read-only historical snapshot' : '') };
  });
  reg('orch.replayCompile', function () {
    var feed = $('pm6OrchPcFeed');
    if (!feed) return { ok: true };
    var st = ST();
    if (st && st.run.stage === 'idle') return { toast: 'No PlanCompileRun bound yet — Approve And Build in the Planning Wizard starts one.' };
    feed.innerHTML = '';
    feedShown = 0;
    feedAppendUpTo(feedTarget(), true);
    return { toast: 'Replaying the compile projection (display only — the durable record is untouched)' };
  });
  reg('orch.seamToggle', function (ctx) {
    var id = argOf(ctx);
    seamOpen[id] = !seamOpen[id];
    mark('seams');
    return { ok: true };
  });
  reg('orch.seamsExpandAll', function () {
    var d = DATA();
    if (d) d.run.seams.forEach(function (sm) { seamOpen[sm.id] = true; });
    mark('seams');
    return { ok: true };
  });
  reg('orch.seamsCollapseAll', function () {
    seamOpen = {};
    mark('seams');
    return { ok: true };
  });
  reg('orch.graphZoomIn', function () { setZoom(view.k * 1.2); return { ok: true }; });
  reg('orch.graphZoomOut', function () { setZoom(view.k / 1.2); return { ok: true }; });
  reg('orch.graphFit', function () { fitGraphToWidth(true); return { ok: true }; });
  reg('orch.graphOnlyProblems', function (ctx) {
    onlyProblems = !onlyProblems;
    var btn = (ctx && ctx.el) || $('pm6OrchGraphOnlyProblems');
    if (btn) btn.setAttribute('aria-pressed', onlyProblems ? 'true' : 'false');
    applyFilters();
    return { ok: true };
  });
  reg('orch.inspect', function (ctx) {
    var nid = argOf(ctx);
    switchTab('node_graph');
    setTimeout(function () { selectNode(nid, true); }, 50);
    return { ok: true };
  });
  reg('orch.nodeEvidence', function (ctx) {
    openEvidenceForNode(argOf(ctx) || null);
    return { ok: true };
  });
  reg('orch.evidenceNode', function (ctx) {
    evNodeFilter = argOf(ctx) || null;
    mark('evidence');
    return { ok: true };
  });
  reg('orch.evidenceClearNode', function () {
    evNodeFilter = null;
    mark('evidence');
    return { ok: true };
  });
  reg('orch.webopSources', function () {
    var card = $('pm6OrchWebOp');
    if (card) card.classList.toggle('is-open');
    return { ok: true };
  });
  reg('orch.webopArtifact', function () {
    return { toast: 'Runtime Artifact ra-web-0117 (api_web_call) — open the Runtime Artifacts panel from the activity bar to inspect the full payload.' };
  });
  var spTarget = null;
  reg('orch.safePointOpen', function (ctx) {
    var g = histGuard();
    if (g) return g;
    var st = ST();
    if (st && st.run.freshness && st.run.freshness !== 'current') {
      return { disabled: true, reason: 'stale' };
    }
    var nid = argOf(ctx) || 'n-13';
    spTarget = nid;
    var spEl = $('pm6OrchSpModalSp'), ndEl = $('pm6OrchSpModalNode'), modal = $('pm6OrchSpModal');
    if (spEl) spEl.textContent = safePointOf(nid);
    if (ndEl) ndEl.textContent = nid + (st && st.run.nodes[nid] ? ' (' + st.run.nodes[nid].label + ')' : '');
    if (modal) modal.hidden = false;
    return { ok: true };
  });
  reg('orch.safePointCancel', function () {
    var modal = $('pm6OrchSpModal');
    if (modal) modal.hidden = true;
    spTarget = null;
    return { ok: true };
  });
  reg('orch.safePointConfirm', function () {
    var modal = $('pm6OrchSpModal');
    if (modal) modal.hidden = true;
    var nid = spTarget || 'n-13';
    spTarget = null;
    return D().run.safePointRetry(nid);
  });
  reg('orch.ledgerExport', function () {
    var d = D();
    if (!d || !d.log || !d.log.length) return { toast: 'Ledger is empty — nothing to export yet.' };
    try {
      var blob = new Blob([JSON.stringify(d.log, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'pm-ledger-' + focusedId() + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { try { URL.revokeObjectURL(a.href); a.remove(); } catch (e) {} }, 400);
      return { toast: 'Exported ' + d.log.length + ' ledger events as JSON' };
    } catch (e) {
      return { toast: 'Export is blocked in this context — the ledger stays inspectable in the table.' };
    }
  });

  /* ---------- ambient baseline (failure-proofing rule 2a) ---------- */
  var baselineTried = false;
  function ensureBaseline() {
    var d = D(), st = ST();
    if (!d || d._shim || !st || baselineTried) return;
    if (st.run.stage === 'idle' && !st.wizard.approved) {
      baselineTried = true;
      try { d.run.bind(); } catch (e) {}
      markAll();
    }
  }
  function pageIsActive() { return root.classList.contains('active'); }

  /* ---------- event subscriptions ---------- */
  function subscribe() {
    var d = D();
    if (!d || !d.on) return;
    d.on('run.state', function () { mark('header', 'progress', 'plancompile', 'seams', 'history'); });
    d.on('run.node', function () { mark('header', 'progress', 'graph', 'seams', 'evidence'); });
    d.on('run.gate', function () { mark('header', 'progress', 'graph', 'evidence'); });
    d.on('dash.cta', function () { mark('progress'); });
    d.on('usage.alert', function () { mark('progress', 'evidence'); });
    d.on('demo.log', function () { mark('ledger', 'header'); });
    d.on('demo.jump', function () { feedShown = 0; var f = $('pm6OrchPcFeed'); if (f) f.innerHTML = ''; markAll(); });
    d.on('page.changed', function (p) {
      if (p && p.page === 'orchestrator') { ensureBaseline(); markAll(); }
    });
  }

  /* ---------- filter inputs ---------- */
  function wireFilters() {
    var fam = $('pm6OrchEvFamily');
    if (fam) fam.addEventListener('change', function () { mark('evidence'); });
    var evs = $('pm6OrchEvSearch');
    if (evs) evs.addEventListener('input', function () { mark('evidence'); });
    var led = $('pm6OrchLedgerFilter');
    if (led) led.addEventListener('change', function () { ledgerRendered = 0; mark('ledger'); });
    var scrim = $('pm6OrchSpModal');
    if (scrim) {
      scrim.addEventListener('click', function (e) {
        if (e.target === scrim) { scrim.hidden = true; spTarget = null; }
      });
    }
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      var modal = $('pm6OrchSpModal');
      if (modal && !modal.hidden) { modal.hidden = true; spTarget = null; }
    });
    /* legacy page-tab path (in case navigation bypasses PM_PAGES.go) */
    document.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('.page-tab[data-page="orchestrator"], .activity-bar .icon[title="Orchestrator"]') : null;
      if (t) setTimeout(function () { if (pageIsActive()) { ensureBaseline(); markAll(); } }, 0);
    });
  }

  /* ---------- boot ---------- */
  var elapsedInterval = null;
  function boot() {
    hydrateIcons(root);
    wireGraph();
    wireFilters();
    subscribe();
    RENDERERS.graph();
    markAll();
    if (pageIsActive()) ensureBaseline();
    elapsedInterval = setInterval(function () {
      if (document.hidden || !pageIsActive()) return;
      mark('header');
    }, 1000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
