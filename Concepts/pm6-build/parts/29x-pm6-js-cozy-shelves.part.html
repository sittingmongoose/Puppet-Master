    ];
    var focusedId = 'rd-1';
    function sess(id) { return sessions.filter(function (s) { return s.id === (id || focusedId); })[0]; }
    function fmt(sec) {
      var m = Math.floor(sec / 60), s = sec % 60;
      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }
    function setDisabled(el, on, reason) {
      if (!el) return;
      if (on) { el.setAttribute('data-demo-disabled', '1'); if (reason) el.setAttribute('data-demo-reason', reason); el.setAttribute('aria-disabled', 'true'); }
      else { el.removeAttribute('data-demo-disabled'); el.removeAttribute('aria-disabled'); }
    }
    function render() {
      var f = sess();
      var st = byId('rdStatus');
      if (st) {
        var full = st.querySelector('.sh-bfull'), short = st.querySelector('.sh-bshort');
        var txt = f.state === 'paused' ? ('paused · ' + f.where) : (f.state === 'terminated' ? 'terminated · exit 0' : 'running');
        if (full) full.textContent = txt;
        if (short) short.textContent = f.state === 'terminated' ? 'ended' : f.state;
        st.style.setProperty('--cat', f.state === 'paused' ? 'var(--cat-amber)' : (f.state === 'running' ? 'var(--cat-green)' : 'var(--cat-neutral)'));
      }
      document.querySelectorAll('#panel-run .sh-sess').forEach(function (row) {
        var s = sess(row.getAttribute('data-sess'));
        if (!s) return;
        row.classList.toggle('is-active', s.id === focusedId);
        var line = row.querySelector('.sh-sessline');
        if (line) {
          var el = line.querySelector('.sh-elapsed');
          var label = (s.state === 'paused' ? 'paused · ' + s.where : s.state) + ' · ';
          if (el) { el.setAttribute('data-elapsed', s.elapsed); el.textContent = fmt(s.elapsed); line.textContent = label; line.appendChild(el); }
          else line.textContent = label + fmt(s.elapsed);
        }
        var dot = row.querySelector('.sh-sdot');
        if (dot) dot.className = 'sh-sdot is-' + (s.state === 'terminated' ? 'paused' : s.state);
      });
      var paused = f.state === 'paused', running = f.state === 'running', ended = f.state === 'terminated';
      function btns(a) { return document.querySelectorAll('#panel-run [data-demo-action="' + a + '"], #bottomDebugHost [data-demo-action="' + a + '"]'); }
      btns('cmd.run_debug.continue').forEach(function (b) { setDisabled(b, !paused, 'continue requires a paused session'); });
      btns('cmd.run_debug.pause').forEach(function (b) { setDisabled(b, !running, 'session not running'); });
      ['cmd.run_debug.step_over', 'cmd.run_debug.step_into', 'cmd.run_debug.step_out'].forEach(function (a) {
        btns(a).forEach(function (b) { setDisabled(b, !paused, 'steps require a paused session'); });
      });
      btns('cmd.run_debug.stop').forEach(function (b) { setDisabled(b, ended, 'session already terminated'); });
      btns('cmd.run_debug.disconnect').forEach(function (b) { setDisabled(b, f.kind !== 'attach' || ended, 'focused session is a launch session'); });
      var menu = byId('rdSessMenu');
      if (menu) menu.querySelectorAll('[role="menuitem"]').forEach(function (it) { it.classList.toggle('is-selected', it.getAttribute('data-value') === focusedId); });
      var cs = byId('rdChromeState');
      if (cs) { cs.textContent = f.state; cs.className = 'rd-state is-' + (f.state === 'terminated' ? 'paused' : f.state); }
      var ce = byId('rdChromeElapsed');
      if (ce) ce.textContent = fmt(f.elapsed);
      document.querySelectorAll('.rd-sestab').forEach(function (t) {
        var on = t.getAttribute('data-sess') === focusedId;
        t.classList.toggle('active', on);
        t.setAttribute('aria-selected', String(on));
      });
    }
    function focus(id) { if (sess(id)) { focusedId = id; render(); } }
    function hostState(name) {
      var host = byId('bottomDebugHost');
      if (host) host.setAttribute('data-rd-state', name);
    }
    function tick() {
      setInterval(function () {
        if (document.hidden) return;
        sessions.forEach(function (s) { if (s.state !== 'terminated') s.elapsed += 1; });
        render();
      }, 1000);
    }
    return {
      sessions: sessions, sess: sess, focus: focus, render: render, hostState: hostState, tick: tick, fmt: fmt,
      get focusedId() { return focusedId; }
    };
  })();
  window.PM_RD_DEMO = PM_RD_DEMO;

  function registerRdActions() {
    if (!window.PM_DEMO || !PM_DEMO.actions || !PM_DEMO.actions.register) return;
    var reg = PM_DEMO.actions.register;
    reg('cmd.run_debug.session.select', function (ctx) {
      var arg = argOf(ctx);
      var id = (ctx.el && ctx.el.getAttribute && ctx.el.getAttribute('data-value')) || (ctx.el && ctx.el.getAttribute && ctx.el.getAttribute('data-sess')) || '';
      if (!id) id = arg.indexOf('import worker') !== -1 ? 'rd-2' : 'rd-1';
      PM_RD_DEMO.focus(id);
      return { toast: arg || 'cmd.run_debug.session.select' };
    });
    reg('cmd.run_debug.start', function (ctx) {
      PM_RD_DEMO.focus('rd-1');
      PM_RD_DEMO.sess('rd-1').state = 'paused';
      PM_RD_DEMO.render();
      PM_RD_DEMO.hostState('live');
      revealBottomTab('debug'); /* F3-491: reveal, never steal keyboard focus */
      return { toast: argOf(ctx) || 'cmd.run_debug.start' };
    });
    reg('cmd.run_debug.stop', function (ctx) {
      PM_RD_DEMO.sess().state = 'terminated';
      PM_RD_DEMO.render();
      PM_RD_DEMO.hostState('term'); /* scrollback retained (F3-490) */
      return { toast: argOf(ctx) || 'cmd.run_debug.stop' };
    });
    reg('cmd.run_debug.restart', function (ctx) {
      PM_RD_DEMO.sess().state = 'paused';
      PM_RD_DEMO.render();
      PM_RD_DEMO.hostState('live');
      return { toast: argOf(ctx) || 'cmd.run_debug.restart' };
    });
    reg('cmd.run_debug.config.add', function (ctx) {
      var form = byId('rdAddForm');
      if (form) {
        form.classList.toggle('pm-hidden');
        return { ok: true };
      }
      return { toast: argOf(ctx) || 'cmd.run_debug.config.add' };
    });
    reg('cmd.run_debug.console.clear', function (ctx) {
      var c = byId('rdConsole');
      if (c) c.querySelectorAll('.rd-line').forEach(function (l) { l.remove(); });
      return { toast: argOf(ctx) || 'cmd.run_debug.console.clear' };
    });
    reg('cmd.run_debug.console.evaluate', function (ctx) {
      var input = byId('rdReplInput');
      var c = byId('rdConsole');
      if (input && c && input.value.trim()) {
        var expr = input.value.trim();
        var vals = { 'qty.value': '11.5', 'servings_ratio': '1.0', 'raw': '"1 1/2 cup"', 'cfg.port': '4017' };
        var line = document.createElement('div');
        line.className = 'rd-line';
        line.innerHTML = '<span class="rd-tag rd-tag-repl">REPL</span><span class="rd-text"></span>';
        line.querySelector('.rd-text').textContent = '› ' + expr + ' → ' + (vals[expr] !== undefined ? vals[expr] : 'undefined');
        c.appendChild(line);
        c.scrollTop = c.scrollHeight;
        input.value = '';
      }
      return { toast: argOf(ctx) || 'cmd.run_debug.console.evaluate' };
    });
    var cancel = byId('rdAddCancel');
    if (cancel) cancel.addEventListener('click', function () {
      var form = byId('rdAddForm');
      if (form) form.classList.add('pm-hidden');
    });
    var repl = byId('rdReplInput');
    if (repl) repl.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter') return;
      ev.preventDefault();
      if (window.PM_DEMO && PM_DEMO.guard) PM_DEMO.guard.attempt('cmd.run_debug.console.evaluate', { el: repl });
    });
  }

  /* ================= 10. boot ================= */
  /* hover titles on informative / interactive elements (ported c2 titles(),
     extended for the Debug & Run rows) */
  function wireTitles() {
    function set(el, txt) { if (el && !el.getAttribute('title') && txt) el.setAttribute('title', txt.trim().replace(/\s+/g, ' ')); }
    document.querySelectorAll('.side-panel-view .pm-segtab-item').forEach(function (el) { set(el, el.textContent); });
    document.querySelectorAll('.sh-hlabel, .sh-head[data-collapse]').forEach(function (el) {
      var head = el.classList.contains('sh-head') ? el : el.closest('.sh-head');
      var lab = head ? head.querySelector('.sh-hlabel') : el;
      var extra = head ? (head.querySelector('.sh-hcount, .sh-hstatus') || {}).textContent || '' : '';
      set(el, ((lab && lab.textContent) || el.textContent) + (extra ? ' · ' + extra : ''));
    });
    document.querySelectorAll('.sh-bstatus').forEach(function (el) { set(el, el.getAttribute('title') || el.textContent); });
    document.querySelectorAll('.pm-chip, .sh-fam, .sh-pill, .sh-valk, .sh-agtime, .dot').forEach(function (el) { set(el, el.textContent || el.className); });
    document.querySelectorAll('.sh-card, .fm-changerow, .fm-openrow, .fm-row, .sh-row[data-demo-action], .sh-commit, .sh-commit-h, .sh-wt-h, .sh-run-h, .sh-ctr-h, .sh-chg-h, .sh-stage-h, .sh-fileh, .pm-sumcard-h, .sh-frame, .sh-sess, .sh-bp, .sh-watch, .sh-var, .sh-scope-h, .rd-sestab, [data-collapse]').forEach(function (el) {
      var n = el.querySelector('.sh-rlabel, .sh-name, .fm-path, .fm-name, .sh-msg, .sh-branch, .sh-nm-txt, .sh-stage-l, .sh-fname, .sh-sessname, .sh-bploc, .sh-wexpr, .sh-vname');
      set(el, n ? n.textContent : el.textContent);
    });
    document.querySelectorAll('.pm6-tb-menu-trigger').forEach(function (el) { var l = el.querySelector('.pm6-tb-menu-label'); set(el, l ? l.textContent : el.textContent); });
    document.querySelectorAll('.pm6-tb-menu-item').forEach(function (el) { set(el, el.textContent); });
    document.querySelectorAll('.pm-btn, .pm-minibtn, .fm-tbtn, .sh-toggle, .pm-chipbtn, .ab-icon, .sb-preset, .tb-page-tab').forEach(function (el) { if (!el.getAttribute('title')) set(el, el.textContent || el.getAttribute('aria-label')); });
    document.querySelectorAll('.sh-k, .sh-title, .sh-bico, .sh-sha, .sh-age, .sh-meta, .sh-ds, .sh-portchip, .sh-modelmark').forEach(function (el) { set(el, el.textContent || el.getAttribute('aria-label')); });
    document.querySelectorAll('.pm-rmetric').forEach(function (el) { set(el, el.textContent || 'Timing'); });
    document.querySelectorAll('.sh-banner').forEach(function (el) {
      var ti = el.querySelector('.sh-title'); set(el, ti ? ti.textContent : el.textContent);
    });
  }

  function boot() {
    wrapAccInners(document);
    if (window.PMCozeHydrate) PMCozeHydrate(document);
    PMMenu.init(document);
    wireAccordion();
    wireTabber();
    wireSearch();
    wireSource();
    wireArtifacts();
    wireSegInk();
    wireTickers();
    wireFiles();
    wireTitles();
    registerActions();
    registerRdActions();
    PM_RD_DEMO.render();
    PM_RD_DEMO.tick();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
