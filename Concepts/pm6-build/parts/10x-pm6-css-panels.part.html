<style id="pm6-css-panels">
    /* ====================================================================
       pm6-css-panels — shell chrome (activity bar groups, breadcrumb) +
       side panels (File Manager, Search, Run & Debug, Source Control,
       GitHub Actions, Docker Manager, Unraid pointer, Runtime Artifacts,
       Testing, Agents, Notifications). Token-only; all 8 themes native.
       ==================================================================== */

    /* ---- activity bar: 5 enumerated groups + separators ---- */
    .activity-bar { overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
    .pm6-ab-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: var(--sm);
      padding-top: var(--sm);
      border-top: 1px solid var(--border-light);
    }
    .activity-bar.collapsed .pm6-ab-group { margin-top: var(--xs); padding-top: var(--xs); }
    .pm6-ab-group .icon { width: 100%; }
    .pm6-ab-bell { position: relative; }
    .pm6-ab-dot {
      position: absolute;
      top: -2px;
      right: -4px;
      width: 7px;
      height: 7px;
      border-radius: var(--radius-pill);
      background: var(--accent-warning);
      box-shadow: 0 0 0 2px var(--surface-alt, var(--surface));
    }
    .pm6-ab-dot.pm6-hidden { display: none; }

    /* ---- breadcrumb strip (20px, Group > Page) ---- */
    .pm6-shell-breadcrumb {
      height: 20px;
      display: flex;
      align-items: center;
      gap: var(--xs);
      padding: 0 var(--md);
      font-size: var(--fs-2xs);
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-light);
      background: var(--surface-alt, var(--surface));
      flex: none;
      user-select: none;
    }
    .pm6-bc-sep { color: var(--text-muted); opacity: .6; }
    .pm6-bc-page { color: var(--text-secondary); }

    /* ---- shared side-panel building blocks ---- */
    .pm6-sp-header { display: flex; justify-content: space-between; align-items: center; }
    .pm6-sp-content { flex: 1; overflow-y: auto; padding: var(--md); display: flex; flex-direction: column; gap: var(--md); }
    .pm6-sp-card {
      border: var(--border-width, 1px) solid var(--border-light);
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: var(--sm) var(--md) var(--md);
      display: flex;
      flex-direction: column;
      gap: var(--xs);
    }
    .pm6-sp-card-head {
      font-family: var(--display-font);
      font-size: var(--fs-2xs);
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: var(--sm);
      padding-bottom: var(--xs);
    }
    .pm6-sp-card-meta { margin-left: auto; font-weight: 500; color: var(--text-muted); text-transform: none; letter-spacing: 0; }
    .pm6-sp-row {
      display: flex;
      align-items: center;
      gap: var(--sm);
      font-size: var(--fs-xs);
      padding: 3px var(--xs);
      border-radius: var(--radius-xs);
      cursor: pointer;
      color: var(--text-primary);
    }
    .pm6-sp-row:hover { background: var(--accent-soft); }
    .pm6-sp-row-meta { margin-left: auto; font-size: var(--fs-2xs); color: var(--text-muted); font-weight: 400; }
    .pm6-sp-note { font-size: var(--fs-xs); color: var(--text-secondary); line-height: var(--lh-body); }
    .pm6-warn-note { color: var(--accent-warning); }
    .pm6-note-glyph { font-size: var(--fs-xs); }
    .pm6-sp-footnote { font-size: var(--fs-2xs); color: var(--text-muted); line-height: var(--lh-body); }
    .pm6-kv { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sm); font-size: var(--fs-xs); padding: 2px 0; }
    .pm6-kv-k { color: var(--text-muted); flex: none; }
    .pm6-kv-v { color: var(--text-primary); text-align: right; overflow: hidden; text-overflow: ellipsis; }

    .pm6-sp-btn {
      font-family: var(--body-font);
      font-size: var(--fs-2xs);
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: var(--border-width, 1px) solid var(--border-light);
      background: var(--surface-elevated);
      color: var(--text-primary);
      cursor: pointer;
      transition: background var(--motion-fast) var(--ease-default), border-color var(--motion-fast) var(--ease-default), transform var(--motion-fast) var(--ease-snap);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--xs);
    }
    .pm6-sp-btn:hover { border-color: var(--accent-primary); background: var(--accent-soft); }
    .pm6-sp-btn:active { transform: scale(.97); }
    .pm6-sp-btn-primary { background: var(--accent-primary); border-color: var(--accent-primary); color: var(--surface); }
    .pm6-sp-btn-primary:hover { background: var(--accent-primary); filter: brightness(1.12); }
    .pm6-sp-minibtn {
      font-size: var(--fs-2xs);
      padding: 2px 7px;
      border-radius: var(--radius-xs);
      border: var(--border-width, 1px) solid var(--border-light);
      background: var(--surface-elevated);
      color: var(--text-secondary);
      cursor: pointer;
    }
    .pm6-sp-minibtn:hover { color: var(--text-primary); border-color: var(--accent-primary); }
    .pm6-sp-minibtn[disabled], .pm6-sp-btn[disabled],
    .pm6-sp-minibtn[aria-disabled="true"], .pm6-sp-btn[aria-disabled="true"],
    .pm6-sp-minibtn[data-demo-disabled], .pm6-sp-btn[data-demo-disabled] { opacity: .45; cursor: not-allowed; }
    .pm6-sp-minibtn[aria-disabled="true"]:hover, .pm6-sp-btn[aria-disabled="true"]:hover,
    .pm6-sp-minibtn[data-demo-disabled]:hover { border-color: var(--border-light); color: var(--text-secondary); background: var(--surface-elevated); }
    .pm6-sp-minibtn.pm6-danger:hover { color: var(--accent-error); border-color: var(--accent-error); }
    .pm6-sp-iconbtn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: var(--fs-xs); padding: 2px; }
    .pm6-sp-iconbtn:hover { color: var(--text-primary); }
    .pm6-btnrow { display: flex; flex-wrap: wrap; gap: var(--xs); margin-top: var(--xs); }
    .pm6-w100 { width: 100%; }
    .pm6-flex1 { flex: 1; }
    .pm6-mt-sm { margin-top: var(--sm); }
    .pm6-mb-sm { margin-bottom: var(--sm); }
    .pm6-hidden { display: none; }
    .pm6-dim { color: var(--text-muted); }
    .pm6-mono { font-family: var(--mono-font, monospace); font-size: var(--fs-2xs); }

    .pm6-chip {
      display: inline-flex;
      align-items: center;
      font-size: var(--fs-2xs);
      font-weight: 600;
      line-height: 1.4;
      padding: 1px 8px;
      border-radius: var(--radius-pill);
      background: color-mix(in srgb, var(--text-muted) 14%, transparent);
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .pm6-chip-ok { background: color-mix(in srgb, var(--accent-lime) 16%, transparent); color: var(--accent-lime); }
    .pm6-chip-warn { background: color-mix(in srgb, var(--accent-warning) 16%, transparent); color: var(--accent-warning); }
    .pm6-chip-err { background: color-mix(in srgb, var(--accent-error) 16%, transparent); color: var(--accent-error); }
    .pm6-fam { text-transform: none; font-family: var(--mono-font, monospace); font-weight: 500; }
    .pm6-fam-web { background: var(--accent-soft); color: var(--accent-primary); }

    .pm6-status-dot { font-size: 9px; line-height: 1; flex: none; }
    .pm6-dot-ok { color: var(--accent-lime); }
    .pm6-dot-err { color: var(--accent-error); }
    .pm6-dot-idle { color: var(--text-muted); }
    .pm6-dot-run { color: var(--accent-primary); animation: pm6-panels-pulse 1.4s ease-in-out infinite; }
    @keyframes pm6-panels-pulse { 50% { opacity: .35; } }

    /* ---- File Manager ---- */
    .pm6-fm-crumb { position: relative; display: flex; align-items: center; gap: var(--xs); padding: var(--xs) var(--md); font-size: var(--fs-2xs); color: var(--text-secondary); border-bottom: 1px solid var(--border-light); }
    .pm6-fm-rootbtn { background: none; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: var(--fs-2xs); padding: 0; }
    .pm6-fm-rootname { color: var(--accent-primary); font-weight: 600; }
    .pm6-fm-chev { color: var(--text-muted); }
    .pm6-fm-sep { color: var(--text-muted); }
    .pm6-fm-rootdd {
      display: none;
      position: absolute;
      top: 100%;
      left: var(--md);
      z-index: 60;
      min-width: 220px;
      background: var(--surface-elevated);
      border: var(--border-width, 1px) solid var(--border-light);
      border-radius: var(--radius-sm);
      box-shadow: var(--elev-2);
      padding: var(--xs);
    }
    .pm6-fm-rootdd.active { display: block; }
    .pm6-fm-rootitem { display: flex; justify-content: space-between; gap: var(--sm); padding: 4px var(--sm); border-radius: var(--radius-xs); font-size: var(--fs-xs); cursor: pointer; }
    .pm6-fm-rootitem:hover { background: var(--accent-soft); }
    .pm6-fm-rootmeta { color: var(--text-muted); font-size: var(--fs-2xs); }
    .pm6-fm-search { padding: var(--xs) var(--md); border-bottom: 1px solid var(--border-light); }
    .pm6-fm-search .wizard-input { width: 100%; font-size: var(--fs-xs); padding: 4px var(--sm); }
    .pm6-fm-tree { position: relative; font-size: var(--fs-xs); }
    .pm6-fm-folder { padding: 3px 0; color: var(--text-secondary); font-weight: 600; }
    .pm6-fm-file { display: flex; align-items: center; gap: var(--xs); padding: 3px 0 3px var(--sm); border-radius: var(--radius-xs); cursor: pointer; }
    .pm6-fm-file:hover { background: var(--accent-soft); }
    .pm6-fm-file.file-active { background: var(--accent-soft); color: var(--accent-primary); }
    .pm6-fm-file .git-status { margin-left: auto; font-weight: 700; font-size: var(--fs-2xs); }
    .pm6-ind1 { padding-left: calc(var(--md) + var(--xs)); }
    .pm6-ind2 { padding-left: calc(var(--xl) + var(--xs)); }
    .pm6-gs-staged { color: var(--accent-lime); }
    .pm6-gs-mod { color: var(--accent-orange); }

    /* ---- Search ---- */
    .pm6-search-index .pm6-kv { padding: 1px 0; }
    .pm6-search-qrow { display: flex; align-items: center; gap: var(--xs); }
    .pm6-search-qrow .wizard-input { padding: 4px var(--sm); font-size: var(--fs-xs); }
    .pm6-search-replacerow { display: flex; align-items: center; gap: var(--xs); margin-top: var(--xs); }
    .pm6-search-replacerow .wizard-input { padding: 4px var(--sm); font-size: var(--fs-xs); }
    .pm6-search-indent { width: 18px; flex: none; }
    .pm6-search-flags { display: flex; align-items: center; gap: var(--xs); }
    .pm6-flagbtn { font-size: var(--fs-2xs); padding: 2px 6px; font-family: var(--mono-font, monospace); }
    .pm6-search-scope { padding: var(--xs); font-size: var(--fs-2xs); }
    .pm6-search-results { display: flex; flex-direction: column; gap: 1px; }
    .pm6-search-note { font-size: var(--fs-2xs); color: var(--text-muted); padding-bottom: var(--xs); }
    .pm6-search-file { font-weight: 600; font-size: var(--fs-xs); padding: 4px 0 2px; color: var(--text-secondary); cursor: pointer; }
    .pm6-search-file:hover { color: var(--text-primary); }
    .pm6-search-count { color: var(--text-muted); font-weight: 400; }
    .pm6-search-hit { padding: 2px var(--sm); cursor: pointer; border-left: 2px solid transparent; font-size: var(--fs-xs); }
    .pm6-search-hit:hover { border-left-color: var(--accent-primary); background: var(--accent-soft); }
    .pm6-search-ln { color: var(--text-muted); font-family: var(--mono-font, monospace); font-size: var(--fs-2xs); margin-right: var(--sm); }
    .pm6-search-hit .search-match { background: color-mix(in srgb, var(--accent-warning) 30%, transparent); padding: 0 2px; border-radius: var(--radius-xs); }

    /* ---- Run & Debug ---- */
    .pm6-run-launchrow { display: flex; gap: var(--xs); }
    .pm6-run-launchrow .wizard-select { font-size: var(--fs-xs); padding: 4px; }
    .pm6-bp-dot { color: var(--accent-error); font-size: 9px; }

    /* ---- Source Control ---- */
    .pm6-acc-meta { font-size: var(--fs-2xs); color: var(--text-muted); margin-left: auto; font-weight: 500; text-transform: none; letter-spacing: 0; }
    .pm6-sc-file { display: flex; justify-content: space-between; align-items: center; gap: var(--sm); font-size: var(--fs-xs); padding: 3px 0; }
    .pm6-sc-fname { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; gap: var(--xs); align-items: center; }
    .pm6-sc-fname:hover { color: var(--accent-primary); }
    .pm6-sc-acts { display: flex; gap: 2px; flex: none; }
    .pm6-sc-commitrow { display: flex; gap: var(--xs); align-items: center; }
    .pm6-sc-commitrow .wizard-input { padding: 4px var(--sm); font-size: var(--fs-xs); }
    .pm6-ai-spin { display: none; width: 10px; height: 10px; border-radius: var(--radius-pill); border: 2px solid var(--accent-soft); border-top-color: var(--accent-primary); animation: pm6-panels-spin .7s linear infinite; }
    .pm6-ai-spin.active { display: inline-block; }
    @keyframes pm6-panels-spin { to { transform: rotate(360deg); } }
    .pm6-cyclable { cursor: pointer; }
    .pm6-wt-head { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); min-width: 0; }
    .pm6-wt-chev { color: var(--text-muted); font-size: var(--fs-2xs); transition: transform var(--motion-fast) var(--ease-default); flex: none; }
    .sc-wt-row.sc-wt-expanded .pm6-wt-chev, .sc-wt-row.expanded .pm6-wt-chev { transform: rotate(90deg); }
    .pm6-wt-branch { font-weight: 600; font-family: var(--mono-font, monospace); font-size: var(--fs-2xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pm6-wt-owner { margin-left: auto; flex: none; font-size: var(--fs-2xs); color: var(--text-muted); max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sc-wt-row.expanded .sc-wt-detail { max-height: 320px; padding: var(--sm) 0 var(--xs); }
    .pm6-wt-detail .pm6-kv { padding: 1px 0; }
    .pm6-sc-commit { padding: 5px var(--xs); border-bottom: 1px solid var(--border-light); font-size: var(--fs-xs); cursor: pointer; border-radius: var(--radius-xs); }
    .pm6-sc-commit:hover { background: var(--accent-soft); }
    .pm6-sc-commit-top { display: flex; justify-content: space-between; align-items: baseline; }
    .pm6-sha { color: var(--accent-primary); font-weight: 600; }
    .pm6-sc-graph { font-size: var(--fs-xs); padding: var(--sm) var(--xs); display: flex; flex-direction: column; gap: 3px; }
    .pm6-graph-line { padding-left: var(--md); color: var(--text-secondary); }
    .pm6-graph-dot { font-size: 9px; }
    .pm6-g-main { color: var(--accent-primary); }
    .pm6-g-lane { color: var(--accent-orange); }
    .pm6-g-thread { color: var(--accent-lime); }

    /* ---- GitHub Actions ---- */
    .pm6-gh-device { display: none; margin-top: var(--xs); padding: var(--sm); border: 1px dashed var(--border-light); border-radius: var(--radius-sm); font-size: var(--fs-xs); text-align: center; }
    .pm6-gh-device.active { display: block; }
    .pm6-gh-device .pm6-gh-code { font-family: var(--mono-font, monospace); font-size: var(--fs-lg); font-weight: 700; letter-spacing: .2em; color: var(--accent-primary); display: block; padding: var(--xs) 0; }
    .pm6-gh-run { display: flex; align-items: center; gap: var(--sm); padding: 4px 0; font-size: var(--fs-xs); border-bottom: 1px solid var(--border-light); }
    .pm6-gh-run:last-child { border-bottom: none; }
    .pm6-gh-run-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; display: inline-flex; gap: var(--xs); align-items: baseline; min-width: 0; }
    .pm6-gh-run .pm6-chip { margin-left: auto; flex: none; }
    .pm6-gh-triage { margin-top: var(--xs); border: 1px solid color-mix(in srgb, var(--accent-error) 35%, transparent); border-radius: var(--radius-sm); padding: var(--sm); display: flex; flex-direction: column; gap: var(--xs); background: color-mix(in srgb, var(--accent-error) 5%, transparent); }
    .pm6-gh-triage-head { font-size: var(--fs-xs); color: var(--text-primary); }
    .pm6-gh-log { background: var(--terminal-bg, var(--surface-elevated)); border-radius: var(--radius-xs); padding: var(--xs) var(--sm); color: var(--text-secondary); line-height: 1.6; overflow-x: auto; white-space: nowrap; }

    /* ---- Docker Manager ---- */
    .pm6-dm-runtime { display: flex; align-items: center; gap: var(--xs); font-size: var(--fs-2xs); color: var(--text-secondary); padding: var(--xs) var(--md); border-bottom: 1px solid var(--border-light); }
    .pm6-dm-chips, .pm6-art-filters { display: flex; flex-wrap: wrap; gap: var(--xs); padding: var(--xs) var(--md); border-bottom: 1px solid var(--border-light); }
    .pm6-dm-chip {
      font-size: var(--fs-2xs);
      font-weight: 600;
      padding: 2px 9px;
      border-radius: var(--radius-pill);
      border: var(--border-width, 1px) solid var(--border-light);
      background: none;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color var(--motion-fast) var(--ease-default), border-color var(--motion-fast) var(--ease-default), background var(--motion-fast) var(--ease-default);
    }
    .pm6-dm-chip:hover { color: var(--text-primary); border-color: var(--accent-primary); }
    .pm6-dm-chip.active { background: var(--accent-soft); border-color: var(--accent-primary); color: var(--accent-primary); }
    .pm6-dm-ct { display: flex; align-items: center; gap: var(--sm); padding: 5px 0; border-bottom: 1px solid var(--border-light); font-size: var(--fs-xs); }
    .pm6-dm-ct:last-child { border-bottom: none; }
    .pm6-dm-ct-name { min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .pm6-dm-ct-meta { font-size: var(--fs-2xs); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pm6-dm-chain { display: flex; flex-direction: column; gap: 0; padding: var(--xs) 0; }
    .pm6-dm-stage { display: flex; align-items: center; gap: var(--sm); font-size: var(--fs-xs); padding: 4px 0; position: relative; }
    .pm6-dm-stage + .pm6-dm-stage::before { content: ""; position: absolute; left: 8px; top: -7px; height: 10px; width: 1px; background: var(--border-light); }
    .pm6-dm-stage-dot { width: 17px; height: 17px; border-radius: var(--radius-pill); border: 1px solid var(--border-light); background: var(--surface-elevated); color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; font-size: var(--fs-2xs); font-weight: 700; flex: none; }
    .pm6-dm-stage.done .pm6-dm-stage-dot { border-color: var(--accent-lime); color: var(--accent-lime); }
    .pm6-dm-stage-label { flex: 1; }
    .pm6-dm-stage .pm6-chip { margin-left: auto; }

    /* ---- Runtime Artifacts ---- */
    .pm6-art-row { border: var(--border-width, 1px) solid var(--border-light); background: var(--surface); border-radius: var(--radius-sm); padding: var(--sm) var(--md); display: flex; flex-direction: column; gap: 3px; cursor: pointer; }
    .pm6-art-row:hover { border-color: var(--accent-primary); }
    .pm6-art-typed { cursor: default; }
    .pm6-art-l1 { display: flex; align-items: center; gap: var(--xs); min-width: 0; }
    .pm6-art-label { font-size: var(--fs-xs); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .pm6-art-l1 .pm6-chip:last-child { margin-left: auto; flex: none; }
    .pm6-art-prev { font-size: var(--fs-xs); color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pm6-art-meta { font-size: var(--fs-2xs); color: var(--text-muted); }
    .pm6-art-prov { font-size: var(--fs-2xs); color: var(--text-secondary); display: flex; flex-wrap: wrap; gap: var(--xs); align-items: center; line-height: var(--lh-body); }
    .pm6-art-bundle-chips { display: flex; flex-wrap: wrap; gap: var(--xs); padding: var(--xs) 0; }
    .pm6-art-empty { padding: var(--sm); border: 1px dashed var(--border-light); border-radius: var(--radius-sm); }

    /* ---- Agents / Notifications ---- */
    .pm6-agent-row { display: flex; align-items: center; gap: var(--sm); font-size: var(--fs-xs); padding: 4px 0; border-bottom: 1px solid var(--border-light); }
    .pm6-agent-row:last-of-type { border-bottom: none; }
    .pm6-agent-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; gap: var(--xs); align-items: baseline; }
    .pm6-agent-row .pm6-chip { margin-left: auto; flex: none; }
    .pm6-notify-row { border: var(--border-width, 1px) solid var(--border-light); background: var(--surface); border-radius: var(--radius-sm); padding: var(--sm) var(--md); display: flex; flex-direction: column; gap: 3px; margin-bottom: var(--sm); animation: pm-enter-up var(--motion-med) var(--ease-default) both; }
    .pm6-notify-warn { border-left: 3px solid var(--accent-warning); }
    .pm6-notify-gate { border-left: 3px solid var(--accent-error); }
    .pm6-notify-row.pm6-acked { opacity: .5; }
    .pm6-notify-row.pm6-acked .pm6-btnrow { display: none; }
