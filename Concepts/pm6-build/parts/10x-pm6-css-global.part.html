    .pm6-ctx-tab .cdp-tab.active { background: var(--accent-soft); color: var(--text-primary); }
  

  /* ============================================================
     PM8 smooth page tabs — sliding selector + directional page
     transitions, reproducing motion.dev/examples/react-smooth-tabs:
     shared pill indicator springing between tabs (stiffness 500,
     damping 35 — driven from JS), content sliding ±50px as an
     immediate directional crossfade (150ms exit under a 300ms enter;
     see the page-transition block below for why the example's
     wait-mode + blur was adapted for full-bleed pages).
     The active-tab chrome (background / glow / frost) lives on the
     shared .page-tab-ink element per theme so it travels with the
     spring; .page-tab.active keeps only its text color + weight.
     ============================================================ */
  .title-bar .page-tabs { position: relative; }
  .title-bar .page-tabs .page-tab {
    position: relative;
    z-index: 1;
    transition: color var(--motion-med, 240ms) var(--ease-smooth, ease);
  }
  /* equal-or-higher specificity than every theme's .page-tab.active
     skin so the opaque background moves to the ink exclusively */
  [data-theme] .title-bar .page-tabs .page-tab.active {
    background: transparent;
    border-color: transparent;
    box-shadow: none;
  }

  .page-tab-ink {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 0;
    pointer-events: none;
    box-sizing: border-box;
    background: var(--accent-lime);
    border: var(--border-width) solid var(--border);
    border-radius: var(--border-radius);
    will-change: transform, width;
  }
  [data-theme="basic-light"] .page-tab-ink,
  [data-theme="basic-dark"] .page-tab-ink {
    background: var(--accent-blue);
    border-color: transparent;
  }
  [data-theme^="glass"] .page-tab-ink {
    background: var(--pm6-glass-step-3);
    border-color: transparent;
    border-radius: var(--radius-pill);
    box-shadow: inset 0 1px 0 var(--glass-edge),
      0 2px 8px var(--pm6-glass-pane-shadow2);
  }
  [data-theme^="friendly"] .page-tab-ink {
    background: color-mix(in srgb, var(--pm6-cozy-mint) 20%, var(--pm6-cozy-card-base));
    border-color: transparent;
    border-radius: var(--radius-pill);
    box-shadow: 0 0 14px color-mix(in srgb, var(--pm6-cozy-mint) 45%, transparent);
  }

  /* Directional page transitions — --pm-dir (+1 forward / -1 back)
     is stamped on the panels by the PM_PAGES.go wrapper in JS.
     Deliberate deviation from the reference's "wait" mode: these pages
     are full-bleed IDE surfaces with their own entrance choreography
     (s4 settings hero/shelves, dashboard widgets), so a sequential
     blank-then-blur-in read as a page reload. Instead: immediate
     directional crossfade — exit slides out underneath over 150ms while
     the enter slides in on top over 300ms ([.25,1,.5,1]). No blur:
     a full-page filter re-renders the glass/backdrop-filter surfaces
     inside the page and flickers on arrival. */
  /* Names are pm8-prefixed on purpose: this file already ships a
     `pm-page-in` keyframe + utility class (wizard stage switches);
     reusing that name hijacked it globally. */
  /* Active+in must beat the fadeIn kill-switch (same 3-class specificity
     otherwise; later `animation:none` was cancelling enter and leaving
     .pm8-page-in stuck — a reload / tab-switch opacity dip). */
  .primary-content > .page.pm8-page-in,
  .primary-content > .page.active.pm8-page-in {
    position: relative;
    z-index: 6;
    animation: pm8-page-in 300ms cubic-bezier(0.25, 1, 0.5, 1) both;
    will-change: transform, opacity;
  }
  @keyframes pm8-page-in {
    from { opacity: 0; transform: translateX(calc(var(--pm-dir, 1) * 50px)); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .primary-content > .page.pm8-page-out {
    display: flex !important;
    position: absolute;
    z-index: 5;
    animation: pm8-page-out 150ms linear both;
    will-change: transform, opacity;
  }
  @keyframes pm8-page-out {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(calc(var(--pm-dir, 1) * -50px)); }
  }
  /* Retire the legacy per-page `animation: fadeIn 0.3s` (wizard +
     settings are the two pages carrying one). It restarted the moment
     the .pm8-page-in class came off — a second full opacity dip that
     read as a reload flicker on Settings and a black flash on Wizard
     (its var(--background) plate vanished with it). The directional
     transition above now owns the enter motion for every page.
     Exclude the transition classes so enter/exit are not cancelled. */
  .primary-content > .page.active:not(.pm8-page-in):not(.pm8-page-out) { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    .primary-content > .page.pm8-page-in,
    .primary-content > .page.pm8-page-out { animation: none; }
  }
  [data-motion="reduced"] .primary-content > .page.pm8-page-in,
  [data-motion="reduced"] .primary-content > .page.pm8-page-out { animation: none; }

    /* ==================================================================
       EDGE DISSOLVE (Task 4) — soft scroll-edge dissolve. Content that
       is about to leave a panel viewport edge progressively loses
       opacity and gains defocus, dissolving into a soft low-contrast
       haze instead of a hard clipping line — vertical AND horizontal.
        Stage A = a four-layer intersect mask on the scroller itself,
        driven by .pm-edge-t/-b/-l/-r classes (toggled by the PM_EDGE
        module in 29x-pm6-js-globals). Stage B = .pm-edge-band
       backdrop-filter siblings (JS-built) that add a progressive
       defocus ramp on the flagship scrollers. Intensity is tuned well
       below the reference: shallow eased ramps (36px vertical / 30px
       horizontal) bottoming out at a .45 residual alpha, so content
       thins at the boundary rather than washing out. Enrolled set =
       the part-02 opt-in scroll-pane list + the strip additions
       below; no mask by default — the mask rule only matches once an
       edge class lands, so idle scrollers carry no mask layer at all.
       Panel surfaces, borders and fixed controls are never masked,
       and the effect is clipped to each panel's own viewport by
       construction. Sticky-chrome scrollers (.pm6-usage-tblwrap /
       .pm6-orch-ledger-wrap) never receive a top dissolve (PM_EDGE
       skips it) so their pinned theads stay completely sharp.
       Everything here is scroll-position driven — nothing animates —
       so it is reduced-motion safe as-is; no transitions, therefore
       no kill switch is required (self-contained guard: this section
       intentionally sits after the file's reduced-motion block).
       ================================================================== */
    /* Residual alpha raised .45 -> .58 on review: the eased ramp shape was
       right but the wash still read too deep at the very edge. Depths and the
       quarter-point ease-out stops below are unchanged — only how far down the
       edge pixel is pulled. */
    .pm-edge-t { --pm-et-o: .58; --pm-et-s: 36px; }
    .pm-edge-b { --pm-eb-o: .58; --pm-eb-s: 36px; }
    .pm-edge-l { --pm-el-o: .58; --pm-el-s: 30px; }
    .pm-edge-r { --pm-er-o: .58; --pm-er-s: 30px; }

    /* Terminal surfaces are deliberately absent from the list below
       (.terminal-output, .terminal-pane-body, .terminal-tabstrip,
       .pm-editor-term-stack, .pm-term-center-wrap): a terminal is a
       console, and a dissolving edge on console text reads as corrupted
       output. Do not re-add them. This list mirrors PM_EDGE.CONFIG's
       vertical/horizontalOnly/bothAxes in 29x-pm6-js-globals and MUST stay
       in sync with it — a selector in only one place is either a dead
       class or a live-but-unstyled one. (.pm6-bottom-* stay enrolled:
       those are the bottom debug/output panes, not the terminal.) */
    :is(.primary-content, .page-projects, .panel-content, .message-stream, .messageStream,
    .chat-thread-list, .file-tree,
    .s4-shell, .s4-stage, .s4-panel-body, .s4-psm-body, .s4-rail,
    .pm6-usage-wrap [class*="scroll"], .pm6-usage-tblwrap,
    .dashboard-grid, .bento-card, .chat-dropdown-list, textarea,
    .browser-viewport, .browser-permissions-panel, .browser-console-pane,
    .browser-network-pane, .browser-evidence-pane,
    .wizard-step-panel, .wizard-annotation-drawer, .wizard-activity-log,
    .pm6-wiz-intake-scroll, .pm6-wiz-topic-list, .pm6-wiz-thread-body, .pm6-wiz-doc,
    .orch-tab-content, .orch-evidence-detail-body, .orch-rungraph-canvas,
    .orch-rungraph-table-wrap, .orch-rungraph-detail-body,
    .pm6-orch-w-body, .pm6-orch-pc-feed, .pm6-orch-pc-sidecol, .pm6-orch-seams,
    .pm6-orch-inspector-body, .pm6-orch-evlist, .pm6-orch-history, .pm6-orch-ledger-wrap,
    .settings-inspector-panel .inspector-body, .interview-sidebar, .interview-messages,
    .pm-inspector-drawer, .pm-debug-cell,
    .pm6-dash-scroll, .pm6-dash-catalog-panel, .pm6-proj-sheet, .pm6-sp-content,
    .pm6-bottom-scroll, .pm6-bottom-pre, .pm6-bottom-empty,
    .context-detail-pane, .cdp-raw-view, .wt-test-output, .sa-work-stream, .sc-accordion-body,
    .msg-body, .page-tabs, .orch-tabs, .editor-tabs,
    .sc-subview-tabs, .cdp-tab-bar, .dashboard-tabs, .sh-wtchips, .debug-thread-header,
    .sa-crew-board, .sa-crew-msg, .pm6-route-tree
    ):is(.pm-edge-t, .pm-edge-b, .pm-edge-l, .pm-edge-r) {
      /* Quadratic ease-out ramp, sampled at quarters of each side's depth
         token: .45 / .69 / .86 / .97 / 1. Ease-out front-loads the
         attenuation at the boundary and then flattens — half the ramp
         already reads 86% opaque — so the edge thins locally instead of
         producing the even wash the old linear ramp at .14 gave. One token
         per side still drives the whole ramp; the intermediate stops are
         calc() fractions of it.
         STOP ORDER IS LOAD-BEARING. With a side's class absent its
         defaults are o = 1 and s = 0px, so all five stops collapse onto
         position 0 with alphas 1, .69, .86, .97, 1. Per the gradient spec
         coincident stops form zero-width transitions and the LAST stop at
         a position governs the range after it, so the alpha-1 stop must
         stay last at --pm-*-s. That is what makes an unflagged side a
         true no-op — reorder these and idle scrollers get masked. */
      -webkit-mask-image:
        linear-gradient(to bottom,
          rgba(0,0,0,var(--pm-et-o,1)) 0px,
          rgba(0,0,0,.69) calc(var(--pm-et-s,0px) * .25),
          rgba(0,0,0,.86) calc(var(--pm-et-s,0px) * .5),
          rgba(0,0,0,.97) calc(var(--pm-et-s,0px) * .75),
          rgba(0,0,0,1)   var(--pm-et-s,0px),
          rgba(0,0,0,1)   100%),
        linear-gradient(to top,
          rgba(0,0,0,var(--pm-eb-o,1)) 0px,
          rgba(0,0,0,.69) calc(var(--pm-eb-s,0px) * .25),
          rgba(0,0,0,.86) calc(var(--pm-eb-s,0px) * .5),
          rgba(0,0,0,.97) calc(var(--pm-eb-s,0px) * .75),
          rgba(0,0,0,1)   var(--pm-eb-s,0px),
          rgba(0,0,0,1)   100%),
        linear-gradient(to right,
          rgba(0,0,0,var(--pm-el-o,1)) 0px,
          rgba(0,0,0,.69) calc(var(--pm-el-s,0px) * .25),
          rgba(0,0,0,.86) calc(var(--pm-el-s,0px) * .5),
          rgba(0,0,0,.97) calc(var(--pm-el-s,0px) * .75),
          rgba(0,0,0,1)   var(--pm-el-s,0px),
          rgba(0,0,0,1)   100%),
        linear-gradient(to left,
          rgba(0,0,0,var(--pm-er-o,1)) 0px,
          rgba(0,0,0,.69) calc(var(--pm-er-s,0px) * .25),
          rgba(0,0,0,.86) calc(var(--pm-er-s,0px) * .5),
          rgba(0,0,0,.97) calc(var(--pm-er-s,0px) * .75),
          rgba(0,0,0,1)   var(--pm-er-s,0px),
          rgba(0,0,0,1)   100%);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to bottom,
          rgba(0,0,0,var(--pm-et-o,1)) 0px,
          rgba(0,0,0,.69) calc(var(--pm-et-s,0px) * .25),
          rgba(0,0,0,.86) calc(var(--pm-et-s,0px) * .5),
          rgba(0,0,0,.97) calc(var(--pm-et-s,0px) * .75),
          rgba(0,0,0,1)   var(--pm-et-s,0px),
          rgba(0,0,0,1)   100%),
        linear-gradient(to top,
          rgba(0,0,0,var(--pm-eb-o,1)) 0px,
          rgba(0,0,0,.69) calc(var(--pm-eb-s,0px) * .25),
          rgba(0,0,0,.86) calc(var(--pm-eb-s,0px) * .5),
          rgba(0,0,0,.97) calc(var(--pm-eb-s,0px) * .75),
          rgba(0,0,0,1)   var(--pm-eb-s,0px),
          rgba(0,0,0,1)   100%),
        linear-gradient(to right,
          rgba(0,0,0,var(--pm-el-o,1)) 0px,
          rgba(0,0,0,.69) calc(var(--pm-el-s,0px) * .25),
          rgba(0,0,0,.86) calc(var(--pm-el-s,0px) * .5),
          rgba(0,0,0,.97) calc(var(--pm-el-s,0px) * .75),
          rgba(0,0,0,1)   var(--pm-el-s,0px),
          rgba(0,0,0,1)   100%),
        linear-gradient(to left,
          rgba(0,0,0,var(--pm-er-o,1)) 0px,
          rgba(0,0,0,.69) calc(var(--pm-er-s,0px) * .25),
          rgba(0,0,0,.86) calc(var(--pm-er-s,0px) * .5),
          rgba(0,0,0,.97) calc(var(--pm-er-s,0px) * .75),
          rgba(0,0,0,1)   var(--pm-er-s,0px),
          rgba(0,0,0,1)   100%);
      mask-composite: intersect;
    }

    /* Stage B: defocus bands. PM_EDGE appends .pm-edge-band siblings over
       the flagship scrollers, positioned on the scroller's own box
       (JS computes the offsets). ONE backdrop layer, opaque at the
       boundary and feathering to transparent at 55% of the band, on every
       theme. It replaces a blur(1.6px)/60% + blur(3.4px)/40% stack plus a
       glass-only display:none; 55% sits between the two old feathers and
       approximates the stacked profile. Why this over keeping the stack
       and single-banding glass only:
         1. glass matches every other theme by construction — no theme
            branch left to drift;
         2. the documented one-backdrop-filter-per-pane glass budget is
            honoured everywhere, not only on glass;
         3. it halves backdrop-filter cost in every theme, and the second
            layer contributed almost nothing;
         4. it ports — Slint 1.17.1 has no backdrop-filter analogue at all,
            so halving the irreducible-effects surface matters for the
            eventual port.
       z-index: 2 keeps bands under in-scroller sticky chrome and floating
       chrome like .jump-to-latest (z-11); pointer-events stays off. Bands
       are visibility-toggled (never display) so state changes never touch
       layout. */
    .pm-edge-pos { position: relative; }
    .pm-edge-band {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      visibility: hidden;
    }
    .pm-edge-band.pm-edge-band-on { visibility: visible; }
    .pm-edge-band::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      /* The EDGE band is a subtle defocus at a scroller's own boundary. It is
         NOT the "scroll-under" effect (content passing behind a frosted header
         above it) — that is the header plate + lift, a different mechanism.
         This was briefly pushed to 4.5px/saturate chasing a complaint that the
         scroll-under was too faint; wrong knob, reverted. Keep it subtle. */
      -webkit-backdrop-filter: blur(2.4px);
      backdrop-filter: blur(2.4px);
    }
    .pm-edge-band-t::before {
      -webkit-mask: linear-gradient(to bottom, rgba(0,0,0,1) 0%, transparent 55%);
      mask: linear-gradient(to bottom, rgba(0,0,0,1) 0%, transparent 55%);
    }
    .pm-edge-band-b::before {
      -webkit-mask: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 55%);
      mask: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 55%);
    }
