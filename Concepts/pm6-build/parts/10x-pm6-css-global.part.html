  <style id="pm6-css-global">
    /* ==================================================================
       pm6-css-global - shared utilities, motion system, friendly skins,
       containment. Owned by theme-tokens (W1); polish extends (W3).
       Token-only: vars from contracts/TOKENS.md; hex only under
       [data-theme] scope. Reduced-motion block stays LAST in this file.
       ================================================================== */

    /* --- icon wrapper sizing (PM_ICONS injected SVGs) --- */
    .pm6-ico { display: inline-flex; align-items: center; justify-content: center; flex: none; line-height: 1; }
    .pm6-ico svg { width: 1em; height: 1em; display: block; }

    /* --- transitional guard: shimmer overlay div until removed from part 11 --- */
    .gl-shimmer-overlay { display: none; }

    /* --- .pm-sheen hover utility: lift + accent ring/glow (the old ::before
       sweep is killed via content:none; class stays in markup) --- */
    .pm-sheen {
      position: relative;
      transition: transform 70ms var(--ease-out), box-shadow 70ms var(--ease-out), border-color 70ms var(--ease-out);
    }
    .pm-sheen::before { content: none; }   /* kills the sweep everywhere */
    .pm-sheen:hover {
      transition-duration: var(--motion-fast);           /* fast in (120ms), instant-ish out (70ms base) */
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent-primary) 40%, var(--border));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent-primary) 30%, transparent),
                  0 6px 18px color-mix(in srgb, var(--accent-primary) 16%, transparent);
    }
    .pm-hover-icon { transition: transform var(--motion-med) var(--ease-spring); }   /* keep micro-motion */
    .pm-sheen:hover .pm-hover-icon { transform: scale(1.06); }
    [data-motion="reduced"] .pm-sheen:hover { transform: none; }

    /* --- PM8 hover system: magnet + spotlight (replaces the pm6 jiggle).
       Covers the same box-set the one-shot rotate wobble did (PM8_SEL in
       pm6-js-globals): the hovered box leans a few px toward the pointer
       (magnet) and lights an accent ring that is strongest at the
       pointer and decays to nothing around the border (spotlight), plus
       a soft interior wash AND an outward bloom around the box (the
       reference's hover glow), concentrated at the pointer - the light
       comes FROM the box itself; neighbors stay untouched. The bloom
       is the box's own accent bloom shadow - cast by a FIXED
       transparent proxy (#pm8-bloom) kept locked to the box's rect,
       radius and magnet offset. The look is a plain card shadow
       (lean + blur riding the same continuous field as the ring), but
       fixed positioning escapes every scroll container's clip, so the
       glow passes freely across scroll-region boundaries instead of
       being hard-cut at a panel edge the way a shadow on the card is;
       when the box itself is partly scrolled away the proxy is
       clip-path'd to the box's visible rect so the shadow never floats
       in dead space, and the field is occlusion-aware: a panel or
       terminal over the grid (an unrelated hit subtree) can't light
       the boxes behind it, while the gap between cards still bleeds
       (the hit target there is the grid - an ancestor of the cards -
       so entering a box from empty space stays snap-free).
       Targets nested inside
       another target (widget gear/close buttons) are not standalone -
       the outer box owns the effect. Intensity is continuous everywhere:
       it ramps up to --pm8-edge at a box's edge, reaches full --pm8-ramp
       px inside, and fades to zero over --pm8-bleed px outside - no
       snap at the edge. Feel is themed via the --pm8-* knobs below:
       retro snaps (stiff spring, small hard ring), basic stays
       restrained, glass drifts (wide soft ring, loose spring), friendly
       springs with a micro overshoot. Color always rides
       --accent-primary-rgb, so all 8 themes recolor automatically.

       Slint 1.17 porting table (this HTML demo -> native primitives):
         magnet offset            -> element `translate` property animated
                                     with a spring (animate { spring(...) })
         pointer tracking         -> TouchArea mouse-cursor-position
         spotlight ring ::after   -> Rectangle painted with @radial-gradient
                                     centered on the bound cursor position,
                                     opacity bound to proximity; the CSS
                                     mask below only crops the gradient to
                                     the border band - in Slint, form the
                                     band with an inner cover Rectangle
                                     instead (no mask support needed)
         interior wash ::before   -> second Rectangle painted with its own
                                     @radial-gradient, stacked under the
                                     box content (z-order, not z-index)
         outward bloom shadow     -> Window-level transparent Rectangle
                                     declared AFTER the content (never
                                     clipped by a ScrollView - same
                                     principle as the web's fixed
                                     proxy), tracking the box's rect,
                                     radius and magnet offset, with
                                     drop-shadow-color / -offset /
                                     -blur bound to intensity (Slint's
                                     drop-shadow-* map 1:1 to the
                                     proxy's box-shadow; an outer
                                     shadow never paints inside its
                                     border-box, so no mask needed). In
                                     Slint the drop-shadow lives on the
                                     box itself, so ScrollView clipping
                                     is automatic - no proxy/clip-path
                                     needed. Occlusion is automatic too
                                     (a top element wins hit-testing).
       Deliberately blend-mode-, filter- and canvas-free: everything here
       reduces to translate + radial-gradient + opacity, all of which map
       to Slint-native primitives. The magnet writes the standalone
       `translate` property (never `transform`) so it composes with -
       instead of displacing - entrance animations (fill-mode:both) and
       any existing transform state, exactly as the old WAA track did. */
    :root {
      --pm8-ring: 5px;     /* thickness of the pointer ring band */
      --pm8-bleed: 12;     /* px outside a box over which intensity fades to zero (JS reads) */
      --pm8-edge: .45;     /* intensity exactly at a box's edge (continuous ramp - no snap) */
      --pm8-ramp: 18;      /* px inside a box over which intensity ramps edge -> full (JS reads) */
      --pm8-spot: 53px;        /* activation disc radius (59px −10%) */
      --pm8-ring-spot: 115px;   /* border-ring radial radius (independent of disc) */
      --pm8-spot-glow: .04;     /* activation disc alpha (barely visible) */
      --pm8-glow: .60;          /* border ring alpha (~75% of .8) */
      --pm8-wash: .38;          /* outward bloom alpha (~75% of .5) */
      --pm8-mag: 1;        /* magnet strength scale */
      --pm8-stiff: 170;    /* magnet spring stiffness */
      --pm8-damp: 22;      /* magnet spring damping */
    }
    [data-theme^="retro"]    { --pm8-ring: 3px; --pm8-bleed: 6;  --pm8-edge: .5;  --pm8-ramp: 10; --pm8-spot-glow: .05; --pm8-glow: .71; --pm8-wash: .34; --pm8-mag: .8;  --pm8-stiff: 340; --pm8-damp: 30; }
    [data-theme^="basic"]    { --pm8-ring: 2px; --pm8-bleed: 10; --pm8-edge: .45; --pm8-ramp: 14; --pm8-spot-glow: .03; --pm8-glow: .45; --pm8-wash: .30; --pm8-mag: .9;  --pm8-stiff: 210; --pm8-damp: 26; }
    [data-theme^="glass"]    { --pm8-ring: 6px; --pm8-bleed: 18; --pm8-edge: .4;  --pm8-ramp: 26; --pm8-spot-glow: .04; --pm8-glow: .64; --pm8-wash: .41; --pm8-mag: 1.15; --pm8-stiff: 110; --pm8-damp: 15; }
    [data-theme^="friendly"] { --pm8-ring: 5px; --pm8-bleed: 12; --pm8-edge: .45; --pm8-ramp: 18; --pm8-spot-glow: .04; --pm8-glow: .60; --pm8-wash: .38; --pm8-mag: 1.1; --pm8-stiff: 150; --pm8-damp: 14; }

    /* Pointer-tracking accent ring. pm6-js-globals writes --pm8-x/--pm8-y
       (pointer position, %) and --pm8-i (continuous intensity 0..1).
       Strongest at the pointer, decaying to nothing well before the far
       side - never a uniform ring. Edge profile: a hard line on the box
       perimeter, then an eased roll-off inward over ring+11px (four
       edge-fade mask layers with a soft multi-stop curve, default-add)
       instead of a hard inner cut. Idle defaults resolve the band to
       nothing. */
    :is(.pm-sheen,.pm-term-icon-btn,.pm6-dash-iconbtn,.browser-action-btn,.activity-bar .icon,.pm6-dash-card,.pm6-dash-catalog-item,.pm6-proj-card,.project-card-bento,.pm6-wiz-choice-card,.pm6-wiz-attach-card,.pm6-wiz-disc-card,.pm6-orch-ctl,.pm6-orch-pc-stat,.pm6-orch-hist-state,.pm6-usage-acct-status,.pm6-sp-row,.pm6-art-row,.pm6-search-hit)::after {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      background: radial-gradient(var(--pm8-ring-spot) circle at var(--pm8-x, 50%) var(--pm8-y, 50%),
          rgba(var(--accent-primary-rgb), calc(var(--pm8-i, 0) * var(--pm8-glow) * .95)) 0%,
          rgba(var(--accent-primary-rgb), calc(var(--pm8-i, 0) * var(--pm8-glow) * .5)) 28%,
          rgba(var(--accent-primary-rgb), calc(var(--pm8-i, 0) * var(--pm8-glow) * .16)) 58%,
          transparent 88%);
      -webkit-mask:
        linear-gradient(to bottom, white, rgba(255,255,255,.62) calc((var(--pm8-ring) + 11px) * .38), rgba(255,255,255,.25) calc((var(--pm8-ring) + 11px) * .68), transparent calc(var(--pm8-ring) + 11px)),
        linear-gradient(to top,    white, rgba(255,255,255,.62) calc((var(--pm8-ring) + 11px) * .38), rgba(255,255,255,.25) calc((var(--pm8-ring) + 11px) * .68), transparent calc(var(--pm8-ring) + 11px)),
        linear-gradient(to right,  white, rgba(255,255,255,.62) calc((var(--pm8-ring) + 11px) * .38), rgba(255,255,255,.25) calc((var(--pm8-ring) + 11px) * .68), transparent calc(var(--pm8-ring) + 11px)),
        linear-gradient(to left,   white, rgba(255,255,255,.62) calc((var(--pm8-ring) + 11px) * .38), rgba(255,255,255,.25) calc((var(--pm8-ring) + 11px) * .68), transparent calc(var(--pm8-ring) + 11px));
      -webkit-mask-composite: source-over;
              mask:
        linear-gradient(to bottom, white, rgba(255,255,255,.62) calc((var(--pm8-ring) + 11px) * .38), rgba(255,255,255,.25) calc((var(--pm8-ring) + 11px) * .68), transparent calc(var(--pm8-ring) + 11px)),
        linear-gradient(to top,    white, rgba(255,255,255,.62) calc((var(--pm8-ring) + 11px) * .38), rgba(255,255,255,.25) calc((var(--pm8-ring) + 11px) * .68), transparent calc(var(--pm8-ring) + 11px)),
        linear-gradient(to right,  white, rgba(255,255,255,.62) calc((var(--pm8-ring) + 11px) * .38), rgba(255,255,255,.25) calc((var(--pm8-ring) + 11px) * .68), transparent calc(var(--pm8-ring) + 11px)),
        linear-gradient(to left,   white, rgba(255,255,255,.62) calc((var(--pm8-ring) + 11px) * .38), rgba(255,255,255,.25) calc((var(--pm8-ring) + 11px) * .68), transparent calc(var(--pm8-ring) + 11px));
              mask-composite: add;
      pointer-events: none;
      z-index: 3;
    }
    /* Ring hosts must be positioned for the ::after anchor; the rest of
       the set is static today (verified), so relative is safe and moves
       no layout. .pm-sheen / wizard cards / bento are already relative. */
    :is(.pm-term-icon-btn,.pm6-dash-iconbtn,.browser-action-btn,.pm6-dash-card,.pm6-wiz-disc-card,.pm6-orch-ctl,.pm6-orch-pc-stat,.pm6-orch-hist-state,.pm6-usage-acct-status,.pm6-sp-row,.pm6-art-row,.pm6-search-hit) { position: relative; }
    /* The magnet writes `translate` every frame; keep host transitions
       (hover shadow / border fades) but never transition translate
       itself. Some targets carry `transition: all`, which would lag the
       spring. */
    .pm8-live { transition-property: transform, box-shadow, border-color, background-color, color, opacity !important; }

    /* Interior wash: the hovered box's own light, from the pointer
       position. Scoped to card/row-level hosts (icon buttons keep just
       the ring arc - and some already own a ::before). The isolation
       stacking context keeps the negative-z pseudo above the host's own
       background and below its content, and inset:0 with the host's
       radius keeps it inside the box. The OUTWARD emission is a
       separate mechanism (the #pm8-bloom fixed shadow proxy below)
       because widget cards - and their scroll containers - clip
       everything a child paints; only a fixed, window-level proxy
       escapes. */
    :is(.pm-sheen,.pm6-dash-card,.pm6-dash-catalog-item,.pm6-proj-card,.project-card-bento,.pm6-wiz-choice-card,.pm6-wiz-attach-card,.pm6-wiz-disc-card,.pm6-orch-ctl,.pm6-orch-pc-stat,.pm6-usage-acct-status,.pm6-sp-row,.pm6-art-row,.pm6-search-hit) { isolation: isolate; }
    :is(.pm-sheen,.pm6-dash-card,.pm6-dash-catalog-item,.pm6-proj-card,.project-card-bento,.pm6-wiz-choice-card,.pm6-wiz-attach-card,.pm6-wiz-disc-card,.pm6-orch-ctl,.pm6-orch-pc-stat,.pm6-usage-acct-status,.pm6-sp-row,.pm6-art-row,.pm6-search-hit)::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(var(--pm8-spot) circle at var(--pm8-x, 50%) var(--pm8-y, 50%),
          rgba(var(--accent-primary-rgb), calc(var(--pm8-i, 0) * var(--pm8-spot-glow) * .32)) 0%,
          rgba(var(--accent-primary-rgb), calc(var(--pm8-i, 0) * var(--pm8-spot-glow) * .12)) 45%,
          transparent 78%);
    }

    /* PM8 owns the hover feedback on a live box: suppress the uniform
       .pm-sheen accent ring/glow (base + themed variants further down
       this block) so only the pointer-tracking ring + wash read. The
       OUTWARD emission lives on #pm8-bloom below. */
    .pm8-live {
      border-color: var(--border) !important;
      box-shadow: var(--elev-2) !important;
    }

    /* Outward emission: the bloom is a box-shadow - but cast by a
       FIXED transparent proxy (#pm8-bloom) that the engine keeps
       locked to the hovered box's rect, radius and magnet offset,
       instead of by the box itself. The look is identical to a shadow
       on the card (same geometry: an outer shadow never paints inside
       its own border-box, so the box surface stays clean - no mask
       needed), but fixed positioning escapes every scroll container's
       clip, so the glow is never hard-cut at a panel edge the way a
       shadow on the card is. Lean (--pm8-ox/oy) and intensity
       (--pm8-i) are fed per-frame by the engine. */
    #pm8-bloom {
      position: fixed; left: 0; top: 0;
      z-index: 95;
      pointer-events: none;
      background: transparent;
      transform: translate3d(-9999px, -9999px, 0);
      will-change: transform;
      box-shadow: var(--pm8-ox, 0px) var(--pm8-oy, 0px)
        calc(var(--pm8-i, 0) * 20px)
        rgba(var(--accent-primary-rgb), calc(var(--pm8-i, 0) * var(--pm8-wash) * .62));
    }

    /* --- motion keyframes --- */
    @keyframes pm-enter-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes pm-enter-scale {
      from { opacity: 0; transform: scale(.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes pm-pop {
      0%   { transform: scale(.92); }
      60%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    @keyframes pm-press {
      0%   { transform: scale(1); }
      50%  { transform: scale(.97); }
      100% { transform: scale(1); }
    }
    @keyframes pm-page-in {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes pm-celebrate {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.08); }
      70%  { transform: scale(.98); }
      100% { transform: scale(1); }
    }
    @keyframes pm-celebrate-ring {
      from { opacity: .8; transform: scale(.6); }
      to   { opacity: 0; transform: scale(1.6); }
    }
    @keyframes pm-shake-subtle {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-3px); }
      55%      { transform: translateX(3px); }
      80%      { transform: translateX(-2px); }
    }

    /* --- motion utility classes + stagger helper (cap 8 via min()) --- */
    .pm-enter-up { animation: pm-enter-up var(--motion-med) var(--ease-default) both; }
    .pm-enter-scale { animation: pm-enter-scale var(--motion-med) var(--ease-default) both; }
    .pm-pop { animation: pm-pop var(--motion-med) var(--ease-spring) both; }
    .pm-page-in { animation: pm-page-in 180ms var(--ease-out) both; }
    .pm-shake-subtle { animation: pm-shake-subtle 300ms var(--ease-smooth); }
    .pm-press:active { transform: scale(.97); transition: transform var(--motion-fast) var(--ease-snap); }
    .pm-celebrate { position: relative; animation: pm-celebrate 480ms var(--ease-spring); }
    .pm-celebrate::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      border: 1px solid var(--accent-primary);
      opacity: 0;
      animation: pm-celebrate-ring 600ms var(--ease-out);
      pointer-events: none;
    }
    .pm-stagger > * { animation-delay: calc(min(var(--i, 0), 8) * 50ms); }

    /* --- focus ring alias (low-specificity default; explicit class wins) --- */
    .pm6-focus-ring:focus-visible,
    :where(button, [href], input, select, textarea, [role="tab"], [tabindex]):focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    /* --- containment (perf budget, design_system section 3) --- */
    .bento-card, .widget-card, .bento-widget, .project-card-bento,
    .chat-panel, .files-panel, .bottom-panel, .floating-chat,
    .s4-panel, .chat-thread-sidebar { contain: layout paint; }
    .page:not(.active) { content-visibility: auto; contain-intrinsic-size: auto 600px; }

    /* ==================================================================
       FRIENDLY "COZY" COMPONENT SKINS (friendly-dark is the app default)
       Warm paper/charcoal ground with dot grid + static pastel corner
       glows, frosted floating chrome, pastel category-tinted cards
       (files=mint, orchestrator=sky, lanes/worktree=lavender,
       warn=butter, error=coral), pill buttons, own-accent glow rings.
       Consumes the --pm6-cozy-* hooks from part 02; every rule stays
       under [data-theme^="friendly"] scope.
       ================================================================== */

    /* ground: paper + subtle dot grid + three soft pastel corner glows */
    [data-theme^="friendly"] body {
      background:
        radial-gradient(var(--pm6-cozy-dot) 1px, transparent 1.5px) 0 0 / 18px 18px,
        radial-gradient(46% 38% at 16% 6%, var(--pm6-cozy-glow-mint), transparent 65%),
        radial-gradient(50% 42% at 88% 12%, var(--pm6-cozy-glow-lav), transparent 65%),
        radial-gradient(55% 40% at 55% 108%, var(--pm6-cozy-glow-sky), transparent 65%),
        var(--background);
    }
    /* let the ground show behind the left rail + side panel area */
    [data-theme^="friendly"] .left-panel { background: transparent; border-right-color: transparent; }

    /* chrome: frosted floating title bar, softened drawer.
       Backdrop blur lives on ::before so brand/notify text stays on a sharp
       layer (filter on the same element as type softens glyphs). */
    [data-theme^="friendly"] .title-bar,
    [data-theme^="friendly"] .bottom-panel {
      isolation: isolate;
    }
    [data-theme^="friendly"] .title-bar::before,
    [data-theme^="friendly"] .bottom-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      pointer-events: none;
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    [data-theme^="friendly"] .title-bar {
      position: relative;
      z-index: 50; /* above page layers (5–6); notify panel escapes frosted SC */
      overflow: visible; /* pages/theme/project sprouts must not clip */
      margin: 8px 12px 2px;
      padding: 0 16px; /* clear rounded chrome — shell default 0 8px hugs the edge */
      max-width: calc(100% - 24px); /* preserve 12px side margins without growth */
      background: var(--pm6-cozy-chrome);
      border: 1px solid var(--pm6-cozy-chrome-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--elev-2);
    }
    [data-theme^="friendly"] .bottom-panel {
      position: relative;
      background: var(--pm6-cozy-chrome);
      border-top: 1px solid var(--pm6-cozy-chrome-border);
    }
    [data-theme^="friendly"] .title-bar .app-name,
    [data-theme^="friendly"] .rs-card .n-title,
    [data-theme^="friendly"] .rs-item .t {
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      transform: translateZ(0);
    }
    /* Friendly notify titles: slightly open letter-spacing (bar + boxes) */
    [data-theme^="friendly"] .rs-card .n-title,
    [data-theme^="friendly"] .rs-item .t {
      letter-spacing: 0.04em;
    }

    /* nav: pill page tabs; active = mint-tinted pill w/ own-accent glow */
    [data-theme^="friendly"] .title-bar .page-tabs { gap: 2px; }
    [data-theme^="friendly"] .title-bar .page-tabs .page-tab {
      border: none;
      border-radius: var(--radius-pill);
      padding: 6px 8px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      transition: background var(--motion-fast) var(--ease-smooth),
                  color var(--motion-fast) var(--ease-smooth),
                  transform var(--motion-med) var(--ease-spring);
    }
    [data-theme^="friendly"] .title-bar .page-tabs .page-tab:hover {
      color: var(--text-primary);
      background: color-mix(in srgb, var(--text-primary) 6%, transparent);
    }
    [data-theme^="friendly"] .title-bar .page-tabs .page-tab:active { transform: scale(.97); }
    [data-theme^="friendly"] .title-bar .page-tabs .page-tab.active {
      background: color-mix(in srgb, var(--pm6-cozy-mint) 20%, var(--pm6-cozy-card-base));
      color: var(--accent-lime);
      border-color: transparent;
      box-shadow: 0 0 14px color-mix(in srgb, var(--pm6-cozy-mint) 45%, transparent);
    }

    /* editor file tabs: top-rounded folder tabs (not full pills).
       The plate is the house frost value, NOT transparent: this rule ships
       after the frost recipe in pm6-css-components-a and at equal specificity,
       so `background: transparent` here silently cancelled it and left a
       backdrop-filter with nothing to tint — which is why the editor tab bar
       read as unfrosted. Keep the two in step if either moves. */
    [data-theme^="friendly"] .editor-tabs {
      gap: 4px;
      background: color-mix(in srgb, var(--surface) 72%, transparent);
      border-bottom-color: var(--border);
    }
    [data-theme^="friendly"] .editor-tabs .tab {
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      padding: 6px 12px;
      font-weight: 700;
      color: var(--text-secondary);
      background: transparent;
    }
    [data-theme^="friendly"] .editor-tabs .tab:hover {
      background: color-mix(in srgb, var(--text-primary) 6%, transparent);
      color: var(--text-primary);
    }
    [data-theme^="friendly"] .editor-tabs .tab.active {
      background: color-mix(in srgb, var(--pm6-cozy-mint) 20%, var(--pm6-cozy-card-base));
      color: var(--accent-lime);
      box-shadow: 0 0 14px color-mix(in srgb, var(--pm6-cozy-mint) 35%, transparent);
    }
    [data-theme^="friendly"] .editor-tabs .tab.active::after { display: none; }

    /* activity bar: transparent over the ground, pill tiles, sky active */
    [data-theme^="friendly"] .activity-bar { border-right: none; background: transparent; }
    [data-theme^="friendly"] .activity-bar .icon { border-radius: 14px; color: var(--text-muted); }
    [data-theme^="friendly"] .activity-bar .icon .symbol {
      width: 40px;
      height: 40px;
      max-width: 100%;
      border-radius: 14px;
      transition: transform var(--motion-med) var(--ease-spring),
                  background var(--motion-fast) var(--ease-smooth);
    }
    [data-theme^="friendly"] .activity-bar.collapsed .icon .symbol { width: 28px; height: 28px; border-radius: 10px; }
    [data-theme^="friendly"] .activity-bar .icon:hover { color: var(--text-primary); }
    [data-theme^="friendly"] .activity-bar .icon:hover .symbol {
      transform: scale(1.1);
      background: color-mix(in srgb, var(--text-primary) 7%, transparent);
    }
    [data-theme^="friendly"] .activity-bar .icon.active { color: var(--accent-primary); }
    [data-theme^="friendly"] .activity-bar .icon.active .symbol {
      background: color-mix(in srgb, var(--pm6-cozy-sky) 16%, var(--pm6-cozy-card-base));
      box-shadow: 0 0 12px color-mix(in srgb, var(--pm6-cozy-sky) 35%, transparent);
    }
    [data-theme^="friendly"] .activity-bar .icon.active::before {
      background: var(--pm6-cozy-sky);
      border-radius: var(--radius-pill);
      left: -2px;
      top: 8px;
      bottom: 8px;
    }

    /* neutral cards: white-ish surface, soft lavender-gray border, r20 */
    [data-theme^="friendly"] .bento-widget,
    [data-theme^="friendly"] .bento-card,
    [data-theme^="friendly"] .widget-card,
    [data-theme^="friendly"] .project-card-bento {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--elev-2);
    }

    /* cozy hover/focus: own-accent glow ring + tiny scale on top of the
       shared .pm-sheen lift; --pm6-sheen-accent is set by the category
       scopes below and defaults to accent-primary (sky) elsewhere */
    [data-theme^="friendly"] .pm-sheen:hover {
      transform: translateY(-2px) scale(1.005);
      border-color: color-mix(in srgb, var(--pm6-sheen-accent, var(--accent-primary)) 45%, var(--border));
      box-shadow: 0 0 0 2px var(--pm6-sheen-accent, var(--accent-primary)),
                  0 0 22px color-mix(in srgb, var(--pm6-sheen-accent, var(--accent-primary)) 55%, transparent);
    }
    [data-theme^="friendly"][data-motion="reduced"] .pm-sheen:hover { transform: none; }
    [data-theme^="friendly"] .pm6-focus-ring:focus-visible,
    [data-theme^="friendly"] :where(button, [href], input, select, textarea, [role="tab"], [tabindex]):focus-visible {
      outline: 2px solid var(--pm6-sheen-accent, var(--accent-primary));
      outline-offset: 2px;
      box-shadow: 0 0 22px color-mix(in srgb, var(--pm6-sheen-accent, var(--accent-primary)) 55%, transparent);
    }

    /* category accents: mint = files / side-panel area */
    [data-theme^="friendly"] .side-panel-slot { --pm6-sheen-accent: var(--pm6-cozy-mint); }
    [data-theme^="friendly"] .files-panel {
      --pm6-sheen-accent: var(--pm6-cozy-mint);
      background: color-mix(in srgb, var(--pm6-cozy-mint) var(--pm6-cozy-mix), var(--pm6-cozy-card-base));
      border: 1px solid color-mix(in srgb, var(--pm6-cozy-mint) var(--pm6-cozy-border-mix), var(--pm6-cozy-card-base));
      border-radius: var(--radius-lg);
      box-shadow: var(--elev-1);
    }
    [data-theme^="friendly"] .files-panel-header {
      background: transparent;
      border-bottom-color: color-mix(in srgb, var(--pm6-cozy-mint) var(--pm6-cozy-border-mix), var(--pm6-cozy-card-base));
    }
    [data-theme^="friendly"] .files-status {
      border-top-color: color-mix(in srgb, var(--pm6-cozy-mint) var(--pm6-cozy-border-mix), var(--pm6-cozy-card-base));
    }

    /* chat panel chrome stays neutral; message stream shows the cozy ground */
    [data-theme^="friendly"] .chat-panel {
      background: var(--surface-elevated);
      border-color: var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--elev-1);
    }
    [data-theme^="friendly"] .message-stream,
    [data-theme^="friendly"] .messageStream,
    [data-theme^="friendly"] .pm6-chat-stream {
      background:
        radial-gradient(var(--pm6-cozy-dot) 1px, transparent 1.5px) 0 0 / 18px 18px,
        radial-gradient(46% 38% at 16% 6%, var(--pm6-cozy-glow-mint), transparent 65%),
        radial-gradient(50% 42% at 88% 12%, var(--pm6-cozy-glow-lav), transparent 65%),
        radial-gradient(55% 40% at 55% 108%, var(--pm6-cozy-glow-sky), transparent 65%),
        var(--background);
    }

    /* buttons: secondary = soft-bordered pill; primary = sky->mint
       gradient pill w/ soft sky glow (primary blocks come LAST so they
       win the shared-class tie) */
    [data-theme^="friendly"] button { border-radius: var(--radius-md); font-family: var(--body-font); }
    [data-theme^="friendly"] button:active { transform: scale(.97); }
    [data-theme^="friendly"] .pm6-sp-btn,
    [data-theme^="friendly"] .pm6-sp-minibtn,
    [data-theme^="friendly"] .pm6-chat-btn,
    [data-theme^="friendly"] .pm6-dash-btn {
      border-radius: var(--radius-pill);
      background: var(--surface-elevated);
      border-color: var(--border);
    }
    [data-theme^="friendly"] .pm6-sp-btn-primary,
    [data-theme^="friendly"] .pm6-chat-btn-primary,
    [data-theme^="friendly"] .pm6-dash-btn--primary,
    [data-theme^="friendly"] .pm6-chat-send,
    [data-theme^="friendly"] .pm6-wiz-send,
    [data-theme^="friendly"] .pm6-wiz-approve {
      background: linear-gradient(120deg, var(--pm6-cozy-sky), var(--pm6-cozy-mint));
      border-color: transparent;
      color: #FFF;
      border-radius: var(--radius-pill);
      box-shadow: 0 4px 14px color-mix(in srgb, var(--pm6-cozy-sky) 45%, transparent);
    }
    [data-theme^="friendly"] .pm6-sp-btn-primary:hover,
    [data-theme^="friendly"] .pm6-chat-btn-primary:hover,
    [data-theme^="friendly"] .pm6-dash-btn--primary:hover,
    [data-theme^="friendly"] .pm6-chat-send:hover,
    [data-theme^="friendly"] .pm6-wiz-send:hover,
    [data-theme^="friendly"] .pm6-wiz-approve:hover {
      background: linear-gradient(120deg, var(--pm6-cozy-sky), var(--pm6-cozy-mint));
      filter: brightness(1.06);
    }

    /* Issue 3: glass counterparts for the friendly hover transforms above.
       Glass had no hover rules for .pm-sheen's extra scale+glow, the activity-
       bar icon .symbol scale, or primary-button brightness — so those elements
       felt flat vs other themes. Use glass tokens so the motion reads as glass
       (frosted edge + accent tint) rather than a copy of the cozy palette. */
    [data-theme^="glass"] .pm-sheen:hover {
      transform: translateY(-2px) scale(1.005);
      border-color: color-mix(in srgb, var(--accent-primary) 40%, var(--border));
      box-shadow: 0 0 0 1px var(--glass-hairline),
                  0 8px 22px rgba(var(--pm6-glass-a-rgb), .22);
    }
    [data-theme^="glass"][data-motion="reduced"] .pm-sheen:hover { transform: none; }
    [data-theme^="glass"] .activity-bar .icon:hover { color: var(--text-primary); }
    [data-theme^="glass"] .activity-bar .icon:hover .symbol {
      transform: scale(1.1);
      background: color-mix(in srgb, var(--text-primary) 7%, transparent);
    }
    [data-theme^="glass"] .pm6-sp-btn-primary:hover,
    [data-theme^="glass"] .pm6-chat-btn-primary:hover,
    [data-theme^="glass"] .pm6-dash-btn--primary:hover,
    [data-theme^="glass"] .pm6-chat-send:hover,
    [data-theme^="glass"] .pm6-wiz-send:hover,
    [data-theme^="glass"] .pm6-wiz-approve:hover {
      filter: brightness(1.06);
    }

    /* chips + badges go full pill */
    [data-theme^="friendly"] .role-badge { border-radius: var(--radius-pill); }

    /* inputs: frosted-field pills in the title bar, sky glow focus.
       padding-inline clears the pill semicircle so glyphs/glow are not
       clipped by the rounded ends (half of typical ~28px control height). */
    [data-theme^="friendly"] .title-bar .search-bar,
    [data-theme^="friendly"] .title-bar .theme-select,
    [data-theme^="friendly"] .title-bar .project-dropdown,
    [data-theme^="friendly"] .title-bar .pm6-tb-menu-trigger,
    [data-theme^="friendly"] .title-bar .pm6-tb-search-btn {
      border: 1px solid var(--pm6-cozy-chrome-border);
      border-radius: var(--radius-pill);
      background: var(--pm6-cozy-field);
      padding-inline: 14px;
      overflow: visible;
    }
    [data-theme^="friendly"] .title-bar .pm6-tb-search-btn {
      padding-inline: 0;
    }
    [data-theme^="friendly"] .title-bar #themeMenuWrap[data-mode="icon"] .pm6-tb-menu-trigger,
    [data-theme^="friendly"] .title-bar #projectMenuWrap[data-mode="icon"] .pm6-tb-menu-trigger,
    [data-theme^="friendly"] .title-bar .pm6-tb-pages-more-btn {
      padding-inline: 0;
    }
    [data-theme^="friendly"] .title-bar .pm6-tb-search-pop {
      border-radius: var(--radius-md);
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      box-shadow: var(--elev-3);
    }
    [data-theme^="friendly"] .title-bar .pm6-tb-search-pop-input {
      border-radius: var(--radius-pill);
      padding-inline: 14px;
      background: var(--pm6-cozy-field);
      border: 1px solid var(--pm6-cozy-chrome-border);
    }
    [data-theme^="friendly"] .title-bar .project-dropdown {
      gap: var(--sm);
    }
    [data-theme^="friendly"] :where(input[type="text"], input[type="search"], textarea, select) {
      border-radius: var(--radius-md);
      padding-inline: 12px;
      overflow: visible;
      transition: border-color var(--motion-fast) var(--ease-smooth),
                  box-shadow var(--motion-fast) var(--ease-smooth);
    }
    [data-theme^="friendly"] :where(input[type="text"], input[type="search"], textarea, select):focus {
      border-color: var(--pm6-cozy-sky);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--pm6-cozy-sky) 55%, transparent),
                  0 0 18px color-mix(in srgb, var(--pm6-cozy-sky) 30%, transparent);
    }
    /* chat / popout search pills: same end-clearance as title chrome */
    [data-theme^="friendly"] .pm6-chat-headsearch,
    [data-theme^="friendly"] .pm6-chat-modelsearch,
    [data-theme^="friendly"] .pm6-chat-modesearch,
    [data-theme^="friendly"] .pm6-chat-personasearch,
    [data-theme^="friendly"] .chat-dropdown-search input {
      padding-inline: 12px;
      overflow: visible;
    }
    [data-theme^="friendly"] .pm6-chat-headsearch input,
    [data-theme^="friendly"] .pm6-chat-modelsearch input,
    [data-theme^="friendly"] .pm6-chat-modesearch input,
    [data-theme^="friendly"] .pm6-chat-personasearch input {
      padding-inline: 4px;
    }

    /* dropdown popovers: lifted, rounded */
    [data-theme^="friendly"] .chat-dropdown-popover {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--elev-3);
      background: var(--surface-elevated);
    }
    [data-theme^="friendly"] .chat-dropdown-item { border-radius: 10px; }
    [data-theme^="friendly"] .chat-dropdown-item.active {
      background: color-mix(in srgb, var(--pm6-cozy-sky) 16%, var(--pm6-cozy-card-base));
      color: var(--accent-primary);
    }

    /* scrollbars: friendly thumb tints via the --pm6-sb-* hooks; the opt-in
       scroll-pane selector list itself lives in part 02 (css-tokens) only */
    [data-theme="friendly-dark"] {
      --pm6-sb-thumb: color-mix(in srgb, var(--text-primary) 22%, transparent);
      --pm6-sb-thumb-hover: color-mix(in srgb, var(--text-primary) 36%, transparent);
    }
    [data-theme="friendly-light"] {
      --pm6-sb-thumb: color-mix(in srgb, var(--text-primary) 18%, transparent);
      --pm6-sb-thumb-hover: color-mix(in srgb, var(--text-primary) 32%, transparent);
    }

    /* ==================================================================
       LEGIBILITY + POLISH SWEEP (W3)
       ================================================================== */

    /* text selection rides the accent family (accent-soft was sub-AA faint;
       the 25% glow mix of the same --accent-primary reads correctly) */
    ::selection { background: var(--accent-glow); color: var(--text-primary); }

    /* panel headers step up the type scale (design_system section 4) */
    .s4-panel-title { font-size: var(--fs-xl); }
    .chat-panel-header .title { font-size: var(--fs-lg); }

    /* themed scrollbars: part 02 ships the hidden-by-default base + the
       opt-in scroll-pane list; theme families tint thumbs via the
       --pm6-sb-* hooks (retro also squares the thumb) */
    [data-theme^="retro"] {
      --pm6-sb-radius: 0px;
      --pm6-sb-thumb: color-mix(in srgb, var(--accent-primary) 50%, transparent);
      --pm6-sb-thumb-hover: color-mix(in srgb, var(--accent-primary) 70%, transparent);
    }
    [data-theme^="glass"] {
      --pm6-sb-thumb: color-mix(in srgb, var(--text-primary) 26%, transparent);
      --pm6-sb-thumb-hover: color-mix(in srgb, var(--text-primary) 40%, transparent);
    }

    /* card padding floor: var(--xl), friendly 20px (density-scaled below) */
    .bento-widget,
    .project-card-bento,
    .s4-card,
    .questionnaire-ui { padding: calc(var(--xl) * var(--density, 1)); }
    [data-theme^="friendly"] .bento-widget,
    [data-theme^="friendly"] .project-card-bento,
    [data-theme^="friendly"] .s4-card { padding: calc(20px * var(--density, 1)); }

    /* ==================================================================
       PM6 TABSTRIP RECIPE — one shared behavior for the seven horizontal
       tab systems (page/orch/editor/terminal/sc-subview/cdp/dashboard):
       nowrap strip, hidden horizontal scroll on overflow, ellipsis tabs.
       Theme skins (friendly pills, glass pills, retro) sit on top via
       higher-specificity [data-theme] rules. Settings nav is vertical
       and deliberately excluded.
       ================================================================== */
    .page-tabs, .orch-tabs, .editor-tabs, .terminal-tabstrip,
    .sc-subview-tabs, .cdp-tab-bar, .dashboard-tabs {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    .page-tabs::-webkit-scrollbar, .orch-tabs::-webkit-scrollbar,
    .editor-tabs::-webkit-scrollbar, .terminal-tabstrip::-webkit-scrollbar,
    .sc-subview-tabs::-webkit-scrollbar, .cdp-tab-bar::-webkit-scrollbar,
    .dashboard-tabs::-webkit-scrollbar { display: none; }
    /* PM_HWHEEL (pm6-js-globals) parks this class on a strip for the duration
       of a wheel gesture. Without it a snapping strip such as .s4-rail
       (scroll-snap-type: x proximity, 248px card pitch) swallows a ~100px
       wheel notch: the new offset is still inside proximity range, so
       Chromium snaps straight back and the rail looks frozen. The class comes
       off on an idle timer, so snapping still lands the gesture. */
    .pm-hwheel-nosnap { scroll-snap-type: none !important; }
    .page-tabs .page-tab, .orch-tabs .orch-tab, .editor-tabs .tab,
    .sc-subview-tabs .sc-tab, .cdp-tab-bar .cdp-tab, .dashboard-tabs .tab {
      flex: 0 0 auto;
      min-width: 56px;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: var(--xs);
      height: 28px;
      box-sizing: border-box;
      font-size: var(--fs-xs);
      line-height: 1;
    }
    /* per-system deltas — title-bar tabs: do not grow/shrink; density floor
       moves overflowed tabs into the ▼ sprout (data-tb-tabs=overflow).
       Must beat the shared tabstrip recipe (overflow-x:auto / overflow-y:hidden)
       or the pages menu is clipped and paints under .main-area. */
    .title-bar .page-tabs {
      flex: 0 0 auto;
      min-width: max-content; /* do not report a shrunken box to density math */
      overflow: visible;
      /* glow gutter: pad so the friendly mint active glow (14px) and the
         22px :focus-visible glow render inside; negative margins cancel
         the layout shift. Per-strip on purpose — NOT in the shared recipe. */
      padding-block: 12px;
      margin-block: -12px;
      padding-inline: 6px;
      margin-inline: -6px;
      margin-left: calc(var(--2xl) - 6px);   /* keeps the 2xl tab offset under the -6px start margin */
    }
    .title-bar[data-tb-tabs="overflow"] .page-tabs {
      overflow: visible;
    }
    .title-bar #pageTabsMoreMenu {
      z-index: 230;
      /* sprout down from the chip (theme menu uses right-edge origin) */
      right: auto;
      left: 0;
      --pm6-sprout-ox: 20%;
    }
    .orch-tabs .orch-tab { height: 100%; }   /* keep the 3px underline on the 36px strip's baseline */
    /* Editor tabs are non-shrinking: when too many to fit, they must truly
       overflow (scrollWidth > clientWidth) so the width-based overflow JS in
       edFitOverflow/ed2FitOverflow fires and surfaces the "+N more" chip +
       dropdown, matching the terminal tab strip. (Shrinkable flex items would
       compress and the overflow loop would never trigger.) */
    .editor-tabs .tab { max-width: 160px; flex: 0 0 auto; }
    /* glow gutter for the editor strip (gains close/overflow chrome later):
       additive to the base padding (06: var(--xs) var(--md) 0 calc(var(--md)
       + 8px)) so tab positions do not move; no bottom gutter — the strip's
       border-bottom must hug the tabs. */
    .editor-tabs {
      padding-top: calc(var(--xs) + 12px);
      margin-top: -12px;
      padding-right: calc(var(--md) + 6px);
      padding-left: calc(var(--md) + 8px + 6px);
      margin-inline: -6px;
    }
    /* glass repads .editor-tabs (03: padding 0 10px 0 16px + hairline
       border-bottom); its padding override already voids the gutter there,
       so cancel the leftover margins to keep glass geometry exact (glass
       editor tabs carry inset-only shadows — nothing to un-clip). */
    [data-theme^="glass"] .editor-tabs {
      margin-top: 0;
      margin-inline: 0;
    }

    /* ==================================================================
       DENSITY (design_system section 6) — data-density maps onto
       --density; high-traffic containers multiply padding/gaps by it.
       Range C/D media queries below set .9/.85 automatically; an explicit
       user choice on <html> overrides them (rules are later in source).
       ================================================================== */
    /* bottom side stays 0 — see the base rule in css-shell */
    .primary-content { padding: calc(var(--md) * var(--density, 1)) calc(var(--md) * var(--density, 1)) 0; }
    .panel-content {
      padding: calc(var(--md) * var(--density, 1));
      gap: calc(var(--md) * var(--density, 1));
    }
    .chat-panel-header { padding: calc(var(--md) * var(--density, 1)); }
    .files-panel-header { padding: calc(var(--xs) * var(--density, 1)) calc(var(--sm) * var(--density, 1)); }
    /* Issue 7: balanced bubble padding — was 2px top / 8px bottom (top-heavy),
       leaving text crowded against the top edge and the hover-row cramped.
       Symmetric vertical padding with slightly more bottom gives text room to
       breathe and centers multi-line content. */
    .msg-body { padding: calc(var(--sm) * var(--density, 1)) calc(var(--md) * var(--density, 1)) calc(var(--md) * var(--density, 1)); }
    .sticky-plan-tracker { padding: calc(var(--md) * var(--density, 1)); }

    /* ==================================================================
       RESPONSIVE RANGES (design_system section 6)
       Range A (>=2200px): baseline :root values from part 02 — no query.
       Width vars are consumed by parts 05/06/09 (.activity-bar,
       .files-panel, .side-panel-slot, .chat-panel, .chat-thread-sidebar,
       .floating-chat, .bento-widget.size-*).
       ================================================================== */

    /* range B: 1720-2199 */
    @media (max-width: 2199px) {
      :root {
        --chat-panel-w: 480px;
        --files-panel-w: 240px;
        --tile-size: 200px;
        --grid-gap: 20px;
      }
    }

    /* docked chat interior: the sidebar must never be crushed by
       .chat-main's legacy 360px min-width (05-css-shell) — the sidebar
       holds its var width and the stream/composer column shrinks. */
    .chat-body .chat-thread-sidebar { flex: 0 0 auto; }
    .chat-body .chat-main { min-width: 0; }

    /* range C: 1440-1719 — PRIMARY 16:9 target */
    @media (max-width: 1719px) {
      :root {
        --chat-panel-w: clamp(380px, 26vw, 440px);
        --files-panel-w: 240px;
        --chat-sidebar-w: 160px;
        --tile-size: 190px;
        --floating-chat-w: 440px;
        --density: .9;
      }
      /* thread sidebar shrinks, never hides (base min-width is 160px) */
      .chat-body .chat-thread-sidebar { width: 160px; min-width: 72px; }
    }

    /* short-viewport modifier: range-C compact values on any width */
    @media (max-height: 800px) {
      :root {
        --chat-panel-w: clamp(380px, 26vw, 440px);
        --files-panel-w: 240px;
        --chat-sidebar-w: 160px;
        --tile-size: 190px;
        --floating-chat-w: 440px;
        --density: .9;
      }
      .chat-body .chat-thread-sidebar { width: 160px; min-width: 72px; }
    }

    /* range D: 1180-1439 — docked chat stays IN-FLOW and narrows;
       content squeezes via existing min-width:0 on .center-column /
       .content-wrapper. Side panel keeps its full width (resizable). */
    @media (max-width: 1439px) {
      :root {
        --density: .85;
        --files-panel-w: 240px;
        --chat-panel-w: clamp(360px, 34vw, 440px);
        --chat-sidebar-w: 120px;
      }
      .chat-body .chat-thread-sidebar { width: 120px; min-width: 72px; }
      .pm6-dash-grid { grid-template-columns: minmax(0, 1fr) !important; }
      .bottom-panel:not(.collapsed) { height: 120px !important; }
    }

    /* range E: <1180 — single-column stage, scrollable tabs
       (range D drawer + rail rules still cascade in here) */
    @media (max-width: 1179px) {
      .side-panel-slot { display: none !important; }
      /* page-tabs scroll/shrink now comes from the pm6 tabstrip recipe above */
      .activity-bar {
        width: 56px !important;
        min-width: 56px !important;
      }
    }

    /* ==================================================================
       LEFT PANEL RESIZE (resizer lives between .left-panel and
       .center-column; drag JS in part 25)
       ================================================================== */
    .pm6-noanim { transition: none !important; }
    .side-panel-slot:not(.hidden) { min-width: 240px; max-width: min(480px, 50vw); }
    .left-panel:has(.side-panel-slot.hidden) + .resizer-col { display: none; }

    /* explicit density choices (later in source: win over range defaults) */
    [data-density="comfortable"] { --density: 1; }
    [data-density="compact"] { --density: .85; }

    /* ==================================================================
       REDUCED MOTION - keep LAST in this block
       ================================================================== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
      #glass-bg * { animation: none !important; }
    }
    [data-motion="reduced"] *,
    [data-motion="reduced"] *::before,
    [data-motion="reduced"] *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
    [data-motion="reduced"] #glass-bg * { animation: none !important; }

    /* ============================================================
       pm6-css-global overrides (Wave: concept touch-up)
       These rules sit AFTER the frozen base parts in the cascade and
       refine chrome that spans multiple pages. Token-only — no raw hex.
       ============================================================ */

    /* --- Issue 6: compact "+" New Thread + resize-driven collapse.
       Label is "Chats" (shorter than HISTORY). Collapse is NOT a button —
       ResizeObserver toggles .collapsed when the rail width drops below
       ~148px. Collapsed rows hide status/time/summary, truncate harder,
       and glow the border with the status-light color.
       Follow-up: Chats label ~11.5px (same collapsed/expanded); + btn 18px
       vertically centered; stronger selected-thread indicator. --- */
    .pm6-chat-sbtitle {
      font-size: 11.5px;
      letter-spacing: 0.02em;
      padding: 6px 8px;
      min-height: 30px;
      box-sizing: border-box;
      align-items: center;
    }
    .pm6-chat-sbtitle-label {
      text-transform: none;
      font-weight: 600;
      letter-spacing: 0.01em;
      font-size: 11.5px;
      line-height: 1;
      margin-right: auto;
      display: inline-flex;
      align-items: center;
    }
    /* Compact header "+" — must beat later .pm6-chat-newthread full-width CTA
       rules (same button carries both classes). */
    .pm6-chat-newthread.pm6-chat-newthread-add,
    .pm6-chat-newthread-add {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; flex: 0 0 18px;
      margin: 0; padding: 0;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      background: var(--surface-elevated);
      color: var(--text-secondary);
      font-size: 0;
      font-weight: 600;
      line-height: 0;
      gap: 0;
      cursor: pointer;
      box-sizing: border-box;
      align-self: center;
      transition: color var(--motion-fast) var(--ease-default),
                  background var(--motion-fast) var(--ease-default),
                  border-color var(--motion-fast) var(--ease-default);
    }
    .pm6-chat-newthread.pm6-chat-newthread-add:hover,
    .pm6-chat-newthread-add:hover {
      color: var(--accent-primary);
      border-color: var(--accent-primary);
      background: var(--accent-soft);
      transform: none;
    }
    .pm6-chat-newthread.pm6-chat-newthread-add:active,
    .pm6-chat-newthread-add:active { transform: scale(.96); }
    .pm6-chat-newthread.pm6-chat-newthread-add svg,
    .pm6-chat-newthread-add svg { width: 10px; height: 10px; display: block; }

    /* Selected thread — clear fill + left accent bar (beats subtle border-only). */
    .chat-thread-item.active {
      background: color-mix(in srgb, var(--accent-blue) 16%, var(--surface));
      border-color: var(--accent-blue);
      box-shadow:
        inset 3px 0 0 0 var(--accent-blue),
        0 0 0 1px color-mix(in srgb, var(--accent-blue) 22%, transparent);
      color: var(--text-primary);
    }
    .chat-thread-item.active .thread-title {
      color: var(--text-primary);
      font-weight: 700;
    }
    .chat-thread-item.role-assistant.active {
      background: color-mix(in srgb, var(--text-primary) 10%, var(--surface));
      border-color: var(--text-primary);
      box-shadow:
        inset 3px 0 0 0 var(--text-primary),
        0 0 0 1px color-mix(in srgb, var(--text-primary) 18%, transparent);
    }
    [data-theme^="retro"] .chat-thread-item.role-assistant.active {
      background: color-mix(in srgb, var(--accent-lime) 14%, var(--surface));
      border-color: var(--accent-lime);
      box-shadow: 3px 3px 0 color-mix(in srgb, var(--accent-lime) 55%, transparent),
                  inset 3px 0 0 0 var(--accent-lime);
    }
    .chat-thread-item.role-interviewer.active {
      background: color-mix(in srgb, var(--accent-lime) 14%, var(--surface));
      border-color: var(--accent-lime);
      box-shadow:
        inset 3px 0 0 0 var(--accent-lime),
        0 0 0 1px color-mix(in srgb, var(--accent-lime) 22%, transparent);
    }
    [data-theme^="retro"] .chat-thread-item.role-interviewer.active {
      box-shadow: 3px 3px 0 color-mix(in srgb, var(--accent-lime) 55%, transparent),
                  inset 3px 0 0 0 var(--accent-lime);
    }
    .chat-thread-item.role-doc.active {
      background: color-mix(in srgb, var(--accent-orange) 14%, var(--surface));
      border-color: var(--accent-orange);
      box-shadow:
        inset 3px 0 0 0 var(--accent-orange),
        0 0 0 1px color-mix(in srgb, var(--accent-orange) 22%, transparent);
    }
    [data-theme^="retro"] .chat-thread-item.role-doc.active {
      box-shadow: 3px 3px 0 color-mix(in srgb, var(--accent-orange) 55%, transparent),
                  inset 3px 0 0 0 var(--accent-orange);
    }
    .chat-thread-item.role-prd.active {
      background: color-mix(in srgb, var(--accent-magenta) 14%, var(--surface));
      border-color: var(--accent-magenta);
      box-shadow:
        inset 3px 0 0 0 var(--accent-magenta),
        0 0 0 1px color-mix(in srgb, var(--accent-magenta) 22%, transparent);
    }
    [data-theme^="retro"] .chat-thread-item.role-prd.active {
      box-shadow: 3px 3px 0 color-mix(in srgb, var(--accent-magenta) 55%, transparent),
                  inset 3px 0 0 0 var(--accent-magenta);
    }
    [data-theme^="glass"] .chat-thread-item.active {
      background: color-mix(in srgb, var(--accent-blue) 22%, var(--pm6-glass-step-3));
      border-color: color-mix(in srgb, var(--accent-blue) 55%, var(--glass-edge));
      box-shadow:
        inset 3px 0 0 0 var(--accent-blue),
        inset 0 1px 0 var(--glass-edge),
        0 0 14px color-mix(in srgb, var(--accent-blue) 28%, transparent);
    }
    [data-theme^="friendly"] .chat-thread-item.active {
      background: color-mix(in srgb, var(--accent-blue) 14%, var(--surface-elevated));
      border-color: var(--accent-blue);
      box-shadow:
        inset 3px 0 0 0 var(--accent-blue),
        0 0 10px color-mix(in srgb, var(--accent-blue) 18%, transparent);
    }

    .chat-thread-sidebar.collapsed .sidebar-title,
    .chat-thread-sidebar.collapsed .pm6-chat-sbtitle {
      gap: 4px; padding: 6px 8px; min-height: 30px;
    }
    .chat-thread-sidebar.collapsed .pm6-chat-sbtitle-label {
      font-size: 11.5px;
      line-height: 1;
    }
    .chat-thread-sidebar.collapsed .chat-thread-list {
      padding: 4px;
      /* the frosted scroll-under in css-shell re-pays the title-row lift in
         padding-top; this collapsed shorthand lands after it, so it has to
         re-state it or the first thread pill parks under the plate */
      padding-top: calc(var(--pm6-chat-sidehead-h, 30px) + 4px);
    }
    .chat-thread-sidebar.collapsed .chat-thread-item {
      padding: 3px 5px;
      margin-bottom: 4px;
      border-color: color-mix(in srgb, var(--thread-status-glow) 72%, transparent);
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--thread-status-glow) 28%, transparent),
        0 0 10px color-mix(in srgb, var(--thread-status-glow) 42%, transparent);
    }
    .chat-thread-sidebar.collapsed .chat-thread-item.active {
      background: color-mix(in srgb, var(--accent-blue) 16%, var(--surface));
      border-color: color-mix(in srgb, var(--accent-blue) 70%, var(--thread-status-glow));
      box-shadow:
        inset 3px 0 0 0 var(--accent-blue),
        0 0 0 1px color-mix(in srgb, var(--thread-status-glow) 40%, transparent),
        0 0 12px color-mix(in srgb, var(--thread-status-glow) 50%, transparent);
    }
    [data-theme^="retro"] .chat-thread-sidebar.collapsed .chat-thread-item {
      box-shadow: 2px 2px 0 color-mix(in srgb, var(--thread-status-glow) 55%, transparent);
    }
    [data-theme^="retro"] .chat-thread-sidebar.collapsed .chat-thread-item.active {
      box-shadow:
        2px 2px 0 color-mix(in srgb, var(--thread-status-glow) 55%, transparent),
        inset 3px 0 0 0 var(--accent-blue);
    }
    [data-theme^="glass"] .chat-thread-sidebar.collapsed .chat-thread-item {
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--thread-status-glow) 35%, transparent),
        0 0 14px color-mix(in srgb, var(--thread-status-glow) 38%, transparent);
    }
    [data-theme^="glass"] .chat-thread-sidebar.collapsed .chat-thread-item.active {
      background: color-mix(in srgb, var(--accent-blue) 22%, var(--pm6-glass-step-3));
      box-shadow:
        inset 3px 0 0 0 var(--accent-blue),
        0 0 0 1px color-mix(in srgb, var(--thread-status-glow) 35%, transparent),
        0 0 14px color-mix(in srgb, var(--thread-status-glow) 38%, transparent);
    }
    .chat-thread-sidebar.collapsed .chat-thread-item .thread-top-row {
      display: flex; align-items: center; gap: 0;
      min-width: 0;
    }
    .chat-thread-sidebar.collapsed .chat-thread-item .thread-title {
      display: block;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 10px;
    }
    .chat-thread-sidebar.collapsed .chat-thread-item .thread-title > span {
      display: none; /* strip any leftover decorative dots in titleHtml */
    }

    /* --- Issue 7: chat bubble corners + directional glow, consistent across
       all 8 themes. Agent (left) bubble = sharp top-left corner; user (right)
       bubble = sharp top-right corner. Left bubble glows on its left edge,
       right bubble glows on its right edge. Retro themes keep all-sharp
       corners by their token (--border-radius: 0), so they are not overridden
       here. These override the frozen base (part 06) and glass (part 03). --- */
    .message.assistant .msg-body {
      border-radius: 0 var(--border-radius) var(--border-radius) var(--border-radius);
    }
    .message.user .msg-body {
      border-radius: var(--border-radius) 0 var(--border-radius) var(--border-radius);
    }
    /* Restore the directional glow on glass bubbles (glass dropped it for an
       inset hairline). Compose the side glow WITH the glass edge so both read. */
    [data-theme^="glass"] .message.assistant .msg-body {
      box-shadow:
        -8px 0 12px -8px color-mix(in srgb, var(--accent-blue) 50%, transparent),
        inset 0 1px 0 var(--glass-edge),
        inset 0 0 0 1px var(--glass-hairline);
    }
    [data-theme^="glass"] .message.user .msg-body {
      box-shadow:
        8px 0 12px -8px color-mix(in srgb, var(--accent-blue) 50%, transparent),
        inset 0 0 0 1px color-mix(in srgb, var(--accent-primary) 25%, transparent);
    }
    /* Friendly + basic: the directional glow is already present in the base;
       the only gap was the uniform radius, fixed above. */

    /* --- Issue 8: agent (LEFT) bubble edges were vanishing on the right/top/
       bottom in friendly-dark, friendly-light, glass-light and glass-dark: only
       a border-left existed, and the other three sides relied on a faint inset
       hairline that washed out. Give the agent bubble a full 1px hairline on
       all four sides PLUS the accent left edge, and strengthen the accent for
       the low-contrast themes. The sharp top-left radius and directional glow
       above are preserved. --- */
    .message.assistant .msg-body {
      border: 1px solid color-mix(in srgb, var(--border) 85%, transparent);
      border-left: 2px solid color-mix(in srgb, var(--accent-blue) 45%, transparent);
    }
    [data-theme="friendly-dark"] .message.assistant .msg-body {
      border: 1px solid color-mix(in srgb, var(--border) 90%, transparent);
      border-left: 2px solid color-mix(in srgb, var(--accent-blue) 60%, transparent);
    }
    [data-theme="friendly-light"] .message.assistant .msg-body {
      border: 1px solid color-mix(in srgb, var(--border) 90%, transparent);
      border-left: 2px solid color-mix(in srgb, var(--accent-blue) 55%, transparent);
    }
    [data-theme^="glass"] .message.assistant .msg-body {
      border: 1px solid var(--glass-hairline);
      border-left: 2px solid color-mix(in srgb, var(--accent-blue) 45%, transparent);
    }
    /* Issue 9 (follow-up): on glass-light the white --glass-hairline sits on a
       near-white frosted surface and vanishes (white-on-near-white). Override
       with the theme's dark pigment (--text-primary #453A5C) at a low alpha so
       the top/right/bottom edges stay subtle but actually visible. Glass-dark
       keeps the white hairline — it reads fine on a dark surface. */
    [data-theme="glass-light"] .message.assistant .msg-body {
      border: 1px solid color-mix(in srgb, var(--text-primary) 22%, transparent);
      border-left: 2px solid color-mix(in srgb, var(--accent-blue) 45%, transparent);
    }

    /* --- Issue 6: Friendly Light's RIGHT (user) bubble inherited the base
       --accent-lime (#2FA183, a harsh teal-green) which clashes with the warm
       cream/pastel friendly-light palette. Recolor it with the theme's cozy
       sky hooks (approved mockup pastels) and a dark, readable text color. --- */
    [data-theme="friendly-light"] .message.user .msg-body {
      background: linear-gradient(135deg,
        var(--pm6-cozy-sky),
        color-mix(in srgb, var(--pm6-cozy-sky) 65%, white));
      color: #1A2A33;
      border: none;
    }

    /* --- Issue 3: collapse the double line-hover highlight to a single,
       instant overlay. Neutralize the frozen .code-line:hover background
       (part 07) and its background transition; the JS .cursor-line-highlight
       overlay is the single source of truth. Its lag transition is also
       removed so it tracks the cursor exactly. --- */
    .code-line { transition: none !important; }
    .code-line:hover,
    [data-theme$="light"] .code-line:hover {
      background: transparent !important;
    }
    .cursor-line-highlight { transition: none !important; }

    /* --- Issue 1: keep the per-pane close (X) button ALWAYS reachable, even
       when an editor pane is very narrow. The frozen base flows tabs + actions
       in a single flex row, so overflowing tabs push the actions/close span off
       the pane. Pin the actions span to the strip's right edge so the close
       button never leaves the pane; the overflow chip (JS) collapses extra
       tabs to keep the visible tabs underneath it. --- */
    /* The right-hand reserve tracks the MEASURED width of the pinned actions
       cluster (--pm6-ed-actions-w, written by the tab fitter). A hard-coded
       28px was correct only while that cluster held one close button; PM7's
       Home layer adds a surface-options button to the same span, and the last
       tab plus the "+N more" chip then slid underneath it. */
    .editor-tabs { position: relative; flex-wrap: nowrap; min-width: 0; padding-right: var(--pm6-ed-actions-w, 28px); }
    .editor-tabs .pane-tabbar-actions {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      flex: 0 0 auto;
      z-index: 5;
    }

    /* ==================================================================
       Contact-aware active tab silhouette (editor panes AND the dashboard).

       The active tab and the canvas below it are ONE continuous surface:
       same fill, no border between them, joined by concave shoulders. The
       rail behind them is darker. This replaces the old "active tab
       tinted + 2px accent underline" treatment on both strip families.

       Geometry is driven from JS (PM6_EDTAB_SHAPE) as custom properties:
         --ed-shape-x / --ed-shape-w   the active tab's box in the rail
         --ed-lp / --ed-rp             contact PROGRESS (0..1), per side
       The stylesheet multiplies progress by per-theme radius maxima
       (--ed-shoulder-rx-max / --ed-canvas-rx-max), so a theme retunes its
       corner language without touching the controller. Each horizontal
       radius collapses to 0 as the tab approaches that side of the rail,
       so a flush edge has no decorative notch. The VERTICAL radius stays
       at full height throughout, so a corner flattens sideways instead
       of shrinking into a circular dimple.
       ================================================================== */
    .editor-pane, .dashboard-view {
      --ed-canvas-bg: var(--surface);
      /* Derive the rail from the CANVAS fill, never from --bg: several themes set
         --surface == --bg, which collapses the mix back to the canvas colour and
         leaves no rail/canvas separation at all (retro light and dark, basic
         light), and glass-dark inverted it so the rail came out LIGHTER than the
         surface. Mixing toward black is monotonic, so the rail is darker by
         construction in every theme. Dark themes take a larger factor because the
         same proportional step is a much smaller absolute one down there. */
      --ed-rail-solid: color-mix(in srgb, var(--ed-canvas-bg) 88%, rgb(0, 0, 0));
      /* The rail PLATE is that hue at --ed-rail-alpha. The strip keeps part
         06's backdrop blur, so scrolled content ghosts through the rail (the
         scroll-under frost); an opaque rail killed that effect in the shipped
         rev. The silhouette and the canvas stay opaque -- content sliding
         under the ACTIVE tab reads as sliding under the canvas's own top
         edge, which is the physical metaphor. */
      --ed-rail-alpha: 72%;
      --ed-rail-bg: color-mix(in srgb, var(--ed-rail-solid) var(--ed-rail-alpha), transparent);
      /* What the translucent rail composites to OVER the canvas fill: the
         corner caps paint this -- the colour the eye actually sees at the
         rail/canvas boundary -- so the wedges match it seamlessly. */
      --ed-cap-bg: color-mix(in srgb, var(--ed-rail-solid) var(--ed-rail-alpha), var(--ed-canvas-bg));
      /* Opaque ground that the rail, the silhouette and the canvas are all
         composited over. Without it the glass themes break the central promise:
         --surface is translucent there, so the silhouette (over the rail) and the
         canvas (over the wallpaper) resolve to DIFFERENT colours and stop reading
         as one surface. A shared opaque ground makes the fills identical by
         construction, in all eight themes. */
      --ed-solid-base: var(--bg);
      --ed-strip-h: 40px;
      --ed-tab-top: 2px;
      --ed-top-radius: 13px;
      --ed-corner-ry: 12px;      /* canvas exposed corner, vertical radius */
      --ed-shoulder-ry: 12px;    /* tab shoulder cutout, vertical radius */
      /* horizontal radius maxima -- multiplied by the JS-written progress */
      --ed-canvas-rx-max: 12px;
      --ed-shoulder-rx-max: 12px;
      --ed-shape-x: 0px;
      --ed-shape-w: 0px;
    }
    .dashboard-view { --ed-strip-h: 36px; }
    [data-theme$="-dark"] :is(.editor-pane, .dashboard-view) { --ed-rail-solid: color-mix(in srgb, var(--ed-canvas-bg) 66%, rgb(0, 0, 0)); }
    /* Glass reads the code surface as its near-opaque plate; adopt that as the
       shared fill so the silhouette and the canvas stay identical AND glass keeps
       its own material. Its rail runs less translucent: the plate is already
       glassy, and plate-on-plate at 72% went muddy. */
    [data-theme^="glass"] :is(.editor-pane, .dashboard-view) { --ed-canvas-bg: var(--pm6-glass-plate); --ed-rail-alpha: 88%; --ed-top-radius: 14px; }
    [data-theme^="glass"] .ed-tab-shape { box-shadow: inset 0 1px 0 var(--glass-edge); }
    [data-theme^="friendly"] :is(.editor-pane, .dashboard-view) { --ed-canvas-bg: color-mix(in srgb, var(--pm6-cozy-mint) 7%, var(--surface)); --ed-top-radius: 16px; --ed-canvas-rx-max: 14px; --ed-shoulder-rx-max: 14px; }
    [data-theme^="friendly"] :is(.editor-tabs, .dashboard-tabs).ed-shape-on .tab.active { color: var(--accent-lime); }
    [data-theme^="retro"] :is(.editor-pane, .dashboard-view) { --ed-top-radius: 6px; --ed-corner-ry: 8px; --ed-shoulder-ry: 8px; --ed-canvas-rx-max: 8px; --ed-shoulder-rx-max: 8px; }
    [data-theme^="retro"] :is(.editor-tabs, .dashboard-tabs).ed-shape-on .tab.active { color: var(--accent-lime); }
    /* retro AFTER the generic -dark line: retro light AND dark share the 88%
       base, then retro-dark alone deepens to 60%. */
    [data-theme^="retro"] :is(.editor-pane, .dashboard-view) { --ed-rail-solid: color-mix(in srgb, var(--ed-canvas-bg) 88%, rgb(0, 0, 0)); }
    [data-theme="retro-dark"] :is(.editor-pane, .dashboard-view) { --ed-rail-solid: color-mix(in srgb, var(--ed-canvas-bg) 60%, rgb(0, 0, 0)); }
    .editor-tabs.ed-shape-on, .dashboard-tabs.ed-shape-on {
      position: relative;
      /* single translucent layer: part 06's backdrop blur on .editor-tabs now
         has scrolled content to show through the rail */
      background: var(--ed-rail-bg);
      border-bottom: 0;
      align-items: center;
      height: var(--ed-strip-h, 40px);
      /* margin/padding zeroed: the theme glow-gutter offsets (-12px/-6px)
         would put the strip's box out of register with the rail it paints,
         and the abs-positioned actions cluster's top:50% must centre against
         the TRUE strip box. No left inset either: the first tab must be able
         to sit FLUSH against the canvas's left boundary, which is the contact
         case the smart-corner rule exists for. A padded rail would mean the
         flush state is unreachable and the morph never demonstrates. */
      margin: 0;
      padding: 0;
      overflow: visible;
      --ed-shape-lrx: calc(var(--ed-lp, 0) * var(--ed-shoulder-rx-max, 12px));
      --ed-shape-rrx: calc(var(--ed-rp, 0) * var(--ed-shoulder-rx-max, 12px));
      --ed-canvas-lrx: calc(var(--ed-lp, 0) * var(--ed-canvas-rx-max, 12px));
      --ed-canvas-rrx: calc(var(--ed-rp, 0) * var(--ed-canvas-rx-max, 12px));
    }
    .editor-tabs.ed-shape-on { padding-right: var(--pm6-ed-actions-w, 28px); }
    /* `!important` is load-bearing here, not laziness: glass paints the code
       surface through `[data-theme^="glass"] #editorPane1 .editor-area`, whose id
       specificity outranks any class selector. If the canvas keeps that rule and
       the silhouette does not, the two composite differently and the "one
       continuous surface" promise fails on exactly the glass themes. Glass keeps
       its own plate colour below via --ed-canvas-bg. */
    .editor-pane:has(.editor-tabs.ed-shape-on) .editor-area {
      background: linear-gradient(var(--ed-canvas-bg), var(--ed-canvas-bg)), var(--ed-solid-base) !important;
    }
    /* the travelling surface itself */
    .ed-tab-shape {
      position: absolute;
      left: var(--ed-shape-x);
      width: var(--ed-shape-w);
      top: var(--ed-tab-top, 2px);
      bottom: -1px;               /* overlap the join so no hairline shows */
      background: linear-gradient(var(--ed-canvas-bg), var(--ed-canvas-bg)), var(--ed-solid-base);
      border-radius: var(--ed-top-radius) var(--ed-top-radius) 0 0;
      pointer-events: none;
      z-index: 0;
    }
    @supports (corner-shape: squircle) {
      .ed-tab-shape { corner-shape: squircle squircle flat flat; }
      /* retro keeps plain circular arcs -- a squircle crown reads soft
         against its square-cornered chrome */
      [data-theme^="retro"] .ed-tab-shape { corner-shape: round; }
    }
    /* concave shoulders: a quarter-ellipse CUT OUT of a block of canvas fill,
       so the tab flares outward into the canvas rather than sitting on top of
       it. An external join like this cannot be produced by border-radius
       alone. The cutout is a mask (not a painted rail gradient) so whatever
       the rail is -- now a translucent, blurred plate -- shows through the
       hole; a painted shoulder would leave opaque patches on the frost.
       (Masks on pseudo-elements are safe re: the fixed-position containing
       block hazard -- pseudos host no descendants.) */
    .ed-tab-shape::before,
    .ed-tab-shape::after {
      content: '';
      position: absolute;
      bottom: 0;
      height: var(--ed-shoulder-ry);
      pointer-events: none;
      background: linear-gradient(var(--ed-canvas-bg), var(--ed-canvas-bg)), var(--ed-solid-base);
    }
    .ed-tab-shape::before {
      left: calc(-1 * var(--ed-shape-lrx));
      width: var(--ed-shape-lrx);
      -webkit-mask-image: radial-gradient(var(--ed-shape-lrx) var(--ed-shoulder-ry) at 0 0,
          transparent calc(100% - 0.5px), rgb(0, 0, 0) calc(100% + 0.5px));
      mask-image: radial-gradient(var(--ed-shape-lrx) var(--ed-shoulder-ry) at 0 0,
          transparent calc(100% - 0.5px), rgb(0, 0, 0) calc(100% + 0.5px));
    }
    .ed-tab-shape::after {
      right: calc(-1 * var(--ed-shape-rrx));
      width: var(--ed-shape-rrx);
      -webkit-mask-image: radial-gradient(var(--ed-shape-rrx) var(--ed-shoulder-ry) at 100% 0,
          transparent calc(100% - 0.5px), rgb(0, 0, 0) calc(100% + 0.5px));
      mask-image: radial-gradient(var(--ed-shape-rrx) var(--ed-shoulder-ry) at 100% 0,
          transparent calc(100% - 0.5px), rgb(0, 0, 0) calc(100% + 0.5px));
    }
    /* Corner caps: the strip paints the canvas's exposed top corners itself,
       as two masked wedges hanging just below the rail. Each cap is filled
       with --ed-cap-bg -- the rail-over-canvas COMPOSITE colour at the
       VISIBLE boundary -- so the wedge is indistinguishable from the real
       translucent rail sitting on the canvas. Accepted tradeoff: no frost
       ghosting inside the two wedges (the T16 pin forbids adding blur
       layers), imperceptible at these radii. */
    .editor-tabs.ed-shape-on::before,
    .editor-tabs.ed-shape-on::after {
      content: '';
      position: absolute;
      top: 100%;
      height: var(--ed-corner-ry);
      background: var(--ed-cap-bg);
      pointer-events: none;
      z-index: 2;
    }
    .editor-tabs.ed-shape-on::before {
      left: 0;
      width: var(--ed-canvas-lrx);
      -webkit-mask-image: radial-gradient(var(--ed-canvas-lrx) var(--ed-corner-ry) at 100% 100%,
          transparent calc(100% - 0.5px), rgb(0, 0, 0) calc(100% + 0.5px));
      mask-image: radial-gradient(var(--ed-canvas-lrx) var(--ed-corner-ry) at 100% 100%,
          transparent calc(100% - 0.5px), rgb(0, 0, 0) calc(100% + 0.5px));
    }
    .editor-tabs.ed-shape-on::after {
      right: 0;
      width: var(--ed-canvas-rrx);
      -webkit-mask-image: radial-gradient(var(--ed-canvas-rrx) var(--ed-corner-ry) at 0 100%,
          transparent calc(100% - 0.5px), rgb(0, 0, 0) calc(100% + 0.5px));
      mask-image: radial-gradient(var(--ed-canvas-rrx) var(--ed-corner-ry) at 0 100%,
          transparent calc(100% - 0.5px), rgb(0, 0, 0) calc(100% + 0.5px));
    }
    /* Labels ride ABOVE the silhouette; the tab element itself paints nothing.
       Per-theme active-tab fills, glows and underlines are all cleared here --
       the silhouette IS the active-tab treatment now, and a theme halo around
       it would read as a floating pill rather than a joined surface. Inactive
       tabs are text-only; hover gets a faint canvas-tinted ghost. */
    :is(.editor-tabs, .dashboard-tabs).ed-shape-on .tab {
      position: relative;
      z-index: 1;
      height: 100%;
      background: transparent;
      box-shadow: none;
      border-radius: var(--ed-top-radius) var(--ed-top-radius) 0 0;
    }
    :is(.editor-tabs, .dashboard-tabs).ed-shape-on .tab.active,
    :is(.editor-tabs, .dashboard-tabs).ed-shape-on .tab.tab-focused,
    :is(.editor-tabs, .dashboard-tabs).ed-shape-on .tab:hover {
      background: transparent;
      box-shadow: none;
      filter: none;
    }
    :is(.editor-tabs, .dashboard-tabs).ed-shape-on .tab:not(.active) {
      color: var(--text-secondary);
    }
    :is(.editor-tabs, .dashboard-tabs).ed-shape-on .tab:not(.active):hover {
      background: color-mix(in srgb, var(--ed-canvas-bg) 30%, transparent);
      color: var(--text-primary);
    }
    :is(.editor-tabs, .dashboard-tabs).ed-shape-on .tab.active { color: var(--text-primary); }
    :is(.editor-tabs, .dashboard-tabs).ed-shape-on .tab:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: -2px; }
    :is(.editor-tabs, .dashboard-tabs).ed-shape-on .tab.active::after,
    :is(.editor-tabs, .dashboard-tabs).ed-shape-on .tab.active::before { display: none; }
    .editor-tabs.ed-shape-on .pm-ed-overflow { position: relative; z-index: 2; }
    /* NO position override on the cluster: it must stay absolutely positioned
       (top: 50% + translateY(-50%)) or "relative" turns that pair into a
       +9px downward shove and the X/kebab ride below the strip's centre. */
    .editor-tabs.ed-shape-on .pane-tabbar-actions { z-index: 2; }
    /* Reduced motion keeps the state change, drops the spring travel; the JS
       reads this flag too and snaps instead of animating. */
    @media (prefers-reduced-motion: reduce) { .ed-tab-shape { transition: none; } }
    [data-motion="reduced"] .ed-tab-shape { transition: none; }

    /* --- Issue 5: context-details rendered inside an editor pane tab. The
       .cdp-* classes come from the frozen context-detail markup (part 14);
       this just makes them lay out inside a code pane that normally hosts
       code lines. --- */
    .editor-code.pm6-ctx-host {
      padding: var(--md);
      background: var(--surface);
      overflow-y: auto;
      line-height: var(--lh-body);
      /* The context tab is a detail view, not a code pane — reset the base
         .editor-code monospace/preformatting that otherwise wraps long
         content and surfaces a horizontal file-diff scrollbar. */
      white-space: normal;
      font-family: inherit;
      font-size: var(--fs-xs);
      /* Detail view: vertical only, no horizontal file-diff bar. The bar
         itself is the shared thin auto-hiding one — .editor-code is opted in
         at css-tokens and this compound is a strict subset of it, so the
         bespoke 12px bar (visible track, no auto-hide) that used to live here
         is gone. */
      overflow-x: hidden;
    }
    /* Issue 4 (follow-up): the cursor-line highlight overlay is
       position:absolute and must anchor to the .editor-code itself, but the
       base rule (07-css-components-b) leaves .editor-code at position:static.
       Without this, the highlight anchors to the nearest positioned ancestor
       (#editorView) while the JS math uses offsets relative to .editor-code,
       producing a constant vertical misalignment. position:relative makes the
       offset parent and the math agree. */
    .editor-code { position: relative; }
    .pm6-ctx-tab .cdp-tab-bar { margin-bottom: var(--sm); }
    .pm6-ctx-tab .cdp-section { padding: var(--sm) 0; }
    .pm6-ctx-tab .cdp-kv-row {
      display: flex; justify-content: space-between; gap: var(--md);
      padding: 3px 0; font-size: var(--fs-xs);
    }
    .pm6-ctx-tab .cdp-kv-label { color: var(--text-muted); }
    .pm6-ctx-tab .cdp-kv-value { color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .pm6-ctx-tab .cdp-section-title {
      font-size: var(--fs-xs); font-weight: 700; letter-spacing: .05em;
      text-transform: uppercase; color: var(--accent-primary); margin-bottom: var(--xs);
    }
    .pm6-ctx-tab .cdp-bar {
      display: flex; height: 8px; border-radius: var(--radius-xs);
      overflow: hidden; background: var(--border-light);
    }
    .pm6-ctx-tab .cdp-bar-segment { height: 100%; }
    .pm6-ctx-tab .cdp-tab {
      display: inline-block; padding: 3px 10px; font-size: var(--fs-xs);
      border-radius: var(--radius-sm); color: var(--text-secondary);
      cursor: default;
    }
