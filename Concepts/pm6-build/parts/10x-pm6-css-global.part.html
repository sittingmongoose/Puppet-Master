  <style id="pm6-css-global">
    /* ==================================================================
       pm6-css-global - shared utilities, motion system, friendly skins,
       containment. Owned by theme-tokens (W1); polish extends (W3).
       Token-only: vars from contracts/TOKENS.md; hex only under
       [data-theme] scope. Reduced-motion block stays LAST in this file.
       ================================================================== */

    /* --- icon wrapper sizing (PM_ICONS injected SVGs) --- */
    .pm6-ico { display: inline-flex; align-items: center; justify-content: center; flex: none; line-height: 1; }
    .pm6-ico svg { width: 1em; height: 1em; display: block; }

    /* --- transitional guard: shimmer overlay div until removed from part 11 --- */
    .gl-shimmer-overlay { display: none; }

    /* --- .pm-sheen hover utility (replaces all pink-glow hovers) --- */
    .pm-sheen {
      position: relative;
      overflow: hidden;
      transition: transform var(--motion-med) var(--ease-default), box-shadow var(--motion-med) var(--ease-default);
    }
    .pm-sheen::before {
      content: "";
      position: absolute;
      top: 0;
      left: -70%;
      width: 45%;
      height: 100%;
      background: linear-gradient(105deg, transparent, color-mix(in srgb, var(--text-primary) 8%, transparent), transparent);
      transform: skewX(-18deg);
      transition: left var(--sheen-dur) ease;
      pointer-events: none;
      z-index: 1;
    }
    .pm-sheen:hover::before { left: 130%; }
    .pm-sheen:hover { transform: translateY(-4px); box-shadow: var(--elev-hover); }
    .pm-hover-icon { transition: transform var(--motion-med) var(--ease-spring); }
    .pm-sheen:hover .pm-hover-icon { transform: scale(1.1) rotate(-4deg); }

    /* --- motion keyframes --- */
    @keyframes pm-enter-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes pm-enter-scale {
      from { opacity: 0; transform: scale(.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes pm-pop {
      0%   { transform: scale(.92); }
      60%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    @keyframes pm-press {
      0%   { transform: scale(1); }
      50%  { transform: scale(.97); }
      100% { transform: scale(1); }
    }
    @keyframes pm-page-in {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes pm-celebrate {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.08); }
      70%  { transform: scale(.98); }
      100% { transform: scale(1); }
    }
    @keyframes pm-celebrate-ring {
      from { opacity: .8; transform: scale(.6); }
      to   { opacity: 0; transform: scale(1.6); }
    }
    @keyframes pm-shake-subtle {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-3px); }
      55%      { transform: translateX(3px); }
      80%      { transform: translateX(-2px); }
    }

    /* --- motion utility classes + stagger helper (cap 8 via min()) --- */
    .pm-enter-up { animation: pm-enter-up var(--motion-med) var(--ease-default) both; }
    .pm-enter-scale { animation: pm-enter-scale var(--motion-med) var(--ease-default) both; }
    .pm-pop { animation: pm-pop var(--motion-med) var(--ease-spring) both; }
    .pm-page-in { animation: pm-page-in 180ms var(--ease-out) both; }
    .pm-shake-subtle { animation: pm-shake-subtle 300ms var(--ease-smooth); }
    .pm-press:active { transform: scale(.97); transition: transform var(--motion-fast) var(--ease-snap); }
    .pm-celebrate { position: relative; animation: pm-celebrate 480ms var(--ease-spring); }
    .pm-celebrate::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      border: 1px solid var(--accent-primary);
      opacity: 0;
      animation: pm-celebrate-ring 600ms var(--ease-out);
      pointer-events: none;
    }
    .pm-stagger > * { animation-delay: calc(min(var(--i, 0), 8) * 50ms); }

    /* --- focus ring alias (low-specificity default; explicit class wins) --- */
    .pm6-focus-ring:focus-visible,
    :where(button, [href], input, select, textarea, [role="tab"], [tabindex]):focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    /* --- containment (perf budget, design_system section 3) --- */
    .bento-card, .widget-card, .bento-widget, .project-card-bento,
    .chat-panel, .files-panel, .bottom-panel, .floating-chat,
    .s4-panel, .chat-thread-sidebar { contain: layout paint; }
    .page:not(.active) { content-visibility: auto; contain-intrinsic-size: auto 600px; }

    /* ==================================================================
       FRIENDLY COMPONENT SKINS (friendly-dark is the app default)
       Pill nav, 40px radius-14 activity tiles, accent-soft active fills,
       borderless elevation-only cards with top-light inset. No glows.
       ================================================================== */

    /* nav: pill page tabs */
    [data-theme^="friendly"] .title-bar .page-tabs { gap: var(--sm); }
    [data-theme^="friendly"] .title-bar .page-tabs .page-tab {
      border: none;
      border-radius: var(--radius-pill);
      padding: 6px 14px;
      font-weight: 700;
      color: var(--text-secondary);
      transition: background var(--motion-fast) var(--ease-smooth),
                  color var(--motion-fast) var(--ease-smooth),
                  transform var(--motion-med) var(--ease-spring);
    }
    [data-theme^="friendly"] .title-bar .page-tabs .page-tab:hover {
      color: var(--text-primary);
      background: color-mix(in srgb, var(--text-primary) 6%, transparent);
    }
    [data-theme^="friendly"] .title-bar .page-tabs .page-tab:active { transform: scale(.97); }
    [data-theme^="friendly"] .title-bar .page-tabs .page-tab.active {
      background: var(--accent-soft);
      color: var(--accent-primary);
      border-color: transparent;
      box-shadow: none;
    }

    /* activity bar: Switch-home-row icon tiles */
    [data-theme^="friendly"] .activity-bar { border-right: none; background: var(--surface-alt); }
    [data-theme^="friendly"] .activity-bar .icon { border-radius: 14px; color: var(--text-muted); }
    [data-theme^="friendly"] .activity-bar .icon .symbol {
      width: 40px;
      height: 40px;
      max-width: 100%;
      border-radius: 14px;
      transition: transform var(--motion-med) var(--ease-spring),
                  background var(--motion-fast) var(--ease-smooth);
    }
    [data-theme^="friendly"] .activity-bar.collapsed .icon .symbol { width: 28px; height: 28px; border-radius: 10px; }
    [data-theme^="friendly"] .activity-bar .icon:hover { color: var(--text-primary); }
    [data-theme^="friendly"] .activity-bar .icon:hover .symbol {
      transform: scale(1.1);
      background: color-mix(in srgb, var(--text-primary) 7%, transparent);
    }
    [data-theme^="friendly"] .activity-bar .icon.active { color: var(--accent-primary); }
    [data-theme^="friendly"] .activity-bar .icon.active .symbol { background: var(--accent-soft); }
    [data-theme^="friendly"] .activity-bar .icon.active::before {
      background: var(--accent-primary);
      border-radius: var(--radius-pill);
      left: -2px;
      top: 8px;
      bottom: 8px;
    }

    /* cards: borderless, elevation-only, top-light inset */
    [data-theme^="friendly"] .bento-widget,
    [data-theme^="friendly"] .bento-card,
    [data-theme^="friendly"] .widget-card,
    [data-theme^="friendly"] .project-card-bento {
      border: none;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--elev-2), inset 0 1px 0 rgba(255,255,255,.04);
    }
    [data-theme="friendly-light"] .bento-widget,
    [data-theme="friendly-light"] .bento-card,
    [data-theme="friendly-light"] .widget-card,
    [data-theme="friendly-light"] .project-card-bento {
      background: var(--surface-elevated);
      box-shadow: var(--elev-2), inset 0 1px 0 rgba(255,255,255,.85);
    }

    /* buttons: r10, pressed scale */
    [data-theme^="friendly"] button { border-radius: 10px; font-family: var(--body-font); }
    [data-theme^="friendly"] button:active { transform: scale(.97); }

    /* chips + badges go full pill */
    [data-theme^="friendly"] .role-badge { border-radius: var(--radius-pill); }

    /* inputs: soft fills, accent focus ring */
    [data-theme^="friendly"] .title-bar .search-bar,
    [data-theme^="friendly"] .title-bar .theme-select,
    [data-theme^="friendly"] .title-bar .project-dropdown {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-alt);
    }
    [data-theme^="friendly"] :where(input[type="text"], input[type="search"], textarea, select) {
      border-radius: 10px;
      transition: border-color var(--motion-fast) var(--ease-smooth),
                  box-shadow var(--motion-fast) var(--ease-smooth);
    }
    [data-theme^="friendly"] :where(input[type="text"], input[type="search"], textarea, select):focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* side + chat panels: soft borderless surfaces */
    [data-theme^="friendly"] .files-panel,
    [data-theme^="friendly"] .chat-panel {
      border-color: var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--elev-1);
    }

    /* dropdown popovers: lifted, rounded */
    [data-theme^="friendly"] .chat-dropdown-popover {
      border: none;
      border-radius: 14px;
      box-shadow: var(--elev-3);
      background: var(--surface-elevated);
    }
    [data-theme^="friendly"] .chat-dropdown-item { border-radius: 10px; }
    [data-theme^="friendly"] .chat-dropdown-item.active {
      background: var(--accent-soft);
      color: var(--accent-primary);
    }

    /* scrollbars: accent-tinted thumb on hover */
    [data-theme="friendly-dark"] *:hover::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--text-primary) 22%, transparent);
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    [data-theme="friendly-light"] *:hover::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--text-primary) 18%, transparent);
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    /* ==================================================================
       LEGIBILITY + POLISH SWEEP (W3)
       ================================================================== */

    /* text selection rides the accent family (accent-soft was sub-AA faint;
       the 25% glow mix of the same --accent-primary reads correctly) */
    ::selection { background: var(--accent-glow); color: var(--text-primary); }

    /* panel headers step up the type scale (design_system section 4) */
    .s4-panel-title { font-size: var(--fs-xl); }
    .chat-panel-header .title { font-size: var(--fs-lg); }

    /* themed scrollbars: part 02 ships the thin macOS base + light variants;
       these tint the thumb per theme family */
    [data-theme^="retro"] *::-webkit-scrollbar-thumb { border-radius: 0; }
    [data-theme^="retro"] *:hover::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--accent-primary) 50%, transparent);
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    [data-theme^="retro"] *:hover { scrollbar-color: color-mix(in srgb, var(--accent-primary) 50%, transparent) transparent; }
    [data-theme^="glass"] *:hover::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--text-primary) 26%, transparent);
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    [data-theme^="glass"] *:hover { scrollbar-color: color-mix(in srgb, var(--text-primary) 26%, transparent) transparent; }

    /* card padding floor: var(--xl), friendly 20px (density-scaled below) */
    .bento-widget,
    .project-card-bento,
    .s4-card,
    .questionnaire-ui { padding: calc(var(--xl) * var(--density, 1)); }
    [data-theme^="friendly"] .bento-widget,
    [data-theme^="friendly"] .project-card-bento,
    [data-theme^="friendly"] .s4-card { padding: calc(20px * var(--density, 1)); }

    /* ==================================================================
       DENSITY (design_system section 6) — data-density maps onto
       --density; high-traffic containers multiply padding/gaps by it.
       Range C/D media queries below set .9/.85 automatically; an explicit
       user choice on <html> overrides them (rules are later in source).
       ================================================================== */
    .primary-content { padding: calc(var(--md) * var(--density, 1)); }
    .panel-content {
      padding: calc(var(--md) * var(--density, 1));
      gap: calc(var(--md) * var(--density, 1));
    }
    .chat-panel-header { padding: calc(var(--md) * var(--density, 1)); }
    .files-panel-header { padding: calc(var(--xs) * var(--density, 1)) calc(var(--sm) * var(--density, 1)); }
    .msg-body { padding: calc(var(--xs) * var(--density, 1)) calc(var(--md) * var(--density, 1)) calc(var(--md) * var(--density, 1)); }
    .sticky-plan-tracker { padding: calc(var(--md) * var(--density, 1)); }

    /* ==================================================================
       RESPONSIVE RANGES (design_system section 6)
       Range A (>=2200px): baseline :root values from part 02 — no query.
       Width vars are consumed by parts 05/06/09 (.activity-bar,
       .files-panel, .side-panel-slot, .chat-panel, .chat-thread-sidebar,
       .floating-chat, .bento-widget.size-*).
       ================================================================== */

    /* range B: 1720-2199 */
    @media (max-width: 2199px) {
      :root {
        --chat-panel-w: 480px;
        --files-panel-w: 240px;
        --tile-size: 200px;
        --grid-gap: 20px;
      }
    }

    /* range C: 1440-1719 — PRIMARY 16:9 target */
    @media (max-width: 1719px) {
      :root {
        --chat-panel-w: clamp(380px, 26vw, 440px);
        --files-panel-w: 220px;
        --chat-sidebar-w: 0px;
        --tile-size: 190px;
        --floating-chat-w: 440px;
        --density: .9;
      }
      /* thread sidebar auto-collapse (width var alone loses to its min-width) */
      .chat-body .chat-thread-sidebar {
        width: 0 !important;
        min-width: 0 !important;
        padding: 0 !important;
        border-right: none !important;
        overflow: hidden !important;
        resize: none;
      }
    }

    /* short-viewport modifier: range-C compact values on any width */
    @media (max-height: 800px) {
      :root {
        --chat-panel-w: clamp(380px, 26vw, 440px);
        --files-panel-w: 220px;
        --chat-sidebar-w: 0px;
        --tile-size: 190px;
        --floating-chat-w: 440px;
        --density: .9;
      }
      .chat-body .chat-thread-sidebar {
        width: 0 !important;
        min-width: 0 !important;
        padding: 0 !important;
        border-right: none !important;
        overflow: hidden !important;
        resize: none;
      }
    }

    /* chat drawer scrim (visible only in range D/E drawer mode) */
    .pm6-chat-scrim {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 899;
      background: rgba(0, 0, 0, .45);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--motion-med) var(--ease-smooth);
    }

    /* range D: 1180-1439 — chat becomes an overlay drawer; files panel
       collapses to a 48px rail with hover flyout */
    @media (max-width: 1439px) {
      :root {
        --density: .85;
        --files-panel-w: 240px; /* flyout width, not rail width */
      }
      .chat-panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(var(--chat-panel-w, 440px), 92vw) !important;
        min-width: 0 !important;
        z-index: 900;
        transform: translateX(100%);
        transition: transform var(--motion-med) var(--ease-default);
        box-shadow: var(--elev-3);
        border-left: 1px solid var(--border);
      }
      .chat-panel.pm6-chat-open { transform: none; }
      .pm6-chat-scrim { display: block; }
      .chat-panel.pm6-chat-open ~ .pm6-chat-scrim,
      body.pm6-chat-open .pm6-chat-scrim,
      .pm6-chat-scrim.pm6-chat-open {
        opacity: 1;
        pointer-events: auto;
      }
      .side-panel-slot {
        width: 48px !important;
        min-width: 48px !important;
        position: relative;
        overflow: visible;
      }
      .side-panel-slot::after {
        content: "";
        position: absolute;
        top: var(--md);
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 56px;
        border-radius: var(--radius-pill);
        background: color-mix(in srgb, var(--text-primary) 18%, transparent);
        pointer-events: none;
      }
      .side-panel-slot .side-panel-view {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 48px;
        width: var(--files-panel-w, 240px);
        z-index: 850;
        background: var(--surface-elevated);
        border-right: 1px solid var(--border);
        box-shadow: var(--elev-3);
        opacity: 0;
        pointer-events: none;
        transform: translateX(-8px);
        transition: opacity var(--motion-fast) var(--ease-smooth),
                    transform var(--motion-med) var(--ease-default);
      }
      .side-panel-slot:hover .side-panel-view.active,
      .side-panel-slot:focus-within .side-panel-view.active {
        opacity: 1;
        pointer-events: auto;
        transform: none;
      }
      .pm6-dash-grid { grid-template-columns: minmax(0, 1fr) !important; }
      .bottom-panel:not(.collapsed) { height: 120px !important; }
    }

    /* range E: <1180 — single-column stage, scrollable tabs
       (range D drawer + rail rules still cascade in here) */
    @media (max-width: 1179px) {
      .side-panel-slot { display: none !important; }
      .title-bar .page-tabs {
        flex: 1 1 auto;
        min-width: 0;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
      }
      .title-bar .page-tabs::-webkit-scrollbar { display: none; }
      .activity-bar {
        width: 56px !important;
        min-width: 56px !important;
      }
    }

    /* explicit density choices (later in source: win over range defaults) */
    [data-density="comfortable"] { --density: 1; }
    [data-density="compact"] { --density: .85; }

    /* ==================================================================
       REDUCED MOTION - keep LAST in this block
       ================================================================== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
      #glass-bg * { animation: none !important; }
    }
    [data-motion="reduced"] *,
    [data-motion="reduced"] *::before,
    [data-motion="reduced"] *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
    [data-motion="reduced"] #glass-bg * { animation: none !important; }
  </style>
