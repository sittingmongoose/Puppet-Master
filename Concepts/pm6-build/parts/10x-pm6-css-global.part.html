  <style id="pm6-css-global">
    /* ==================================================================
       pm6-css-global - shared utilities, motion system, friendly skins,
       containment. Owned by theme-tokens (W1); polish extends (W3).
       Token-only: vars from contracts/TOKENS.md; hex only under
       [data-theme] scope. Reduced-motion block stays LAST in this file.
       ================================================================== */

    /* --- icon wrapper sizing (PM_ICONS injected SVGs) --- */
    .pm6-ico { display: inline-flex; align-items: center; justify-content: center; flex: none; line-height: 1; }
    .pm6-ico svg { width: 1em; height: 1em; display: block; }

    /* --- transitional guard: shimmer overlay div until removed from part 11 --- */
    .gl-shimmer-overlay { display: none; }

    /* --- .pm-sheen hover utility: lift + accent ring/glow (the old ::before
       sweep is killed via content:none; class stays in markup) --- */
    .pm-sheen {
      position: relative;
      transition: transform 70ms var(--ease-out), box-shadow 70ms var(--ease-out), border-color 70ms var(--ease-out);
    }
    .pm-sheen::before { content: none; }   /* kills the sweep everywhere */
    .pm-sheen:hover {
      transition-duration: var(--motion-fast);           /* fast in (120ms), instant-ish out (70ms base) */
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent-primary) 40%, var(--border));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent-primary) 30%, transparent),
                  0 6px 18px color-mix(in srgb, var(--accent-primary) 16%, transparent);
    }
    .pm-hover-icon { transition: transform var(--motion-med) var(--ease-spring); }   /* keep micro-motion */
    .pm-sheen:hover .pm-hover-icon { transform: scale(1.06); }
    [data-motion="reduced"] .pm-sheen:hover { transform: none; }

    /* --- pm6 jiggle: one-shot pointer-entry wobble (trigger JS in
       pm6-js-globals adds .pm-jiggle-run; animationend removes it).
       Keyframes animate the standalone `rotate` property, NOT transform,
       so the transitioned translateY lift + glow keep composing beneath
       the wobble (transient-class model: pm-term-subtab--enter). --- */
    @keyframes pm6Jiggle {
      0%   { rotate: 0deg; }
      20%  { rotate: 1.8deg; }
      45%  { rotate: -1.4deg; }
      70%  { rotate: .8deg; }
      100% { rotate: 0deg; }
    }
    .pm-jiggle-run { animation: pm6Jiggle 420ms var(--ease-out); }
    /* friendly scale-conflict kills: snap the 1.1 spring-scale while the
       symbol wobbles, and drop the sheen scale(1.005) during the wobble */
    [data-theme^="friendly"] .activity-bar .icon:hover .symbol.pm-jiggle-run {
      transition: background var(--motion-fast) var(--ease-smooth);
    }
    [data-theme^="friendly"] .pm-sheen.pm-jiggle-run:hover { transform: translateY(-2px); }

    /* --- motion keyframes --- */
    @keyframes pm-enter-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes pm-enter-scale {
      from { opacity: 0; transform: scale(.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes pm-pop {
      0%   { transform: scale(.92); }
      60%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    @keyframes pm-press {
      0%   { transform: scale(1); }
      50%  { transform: scale(.97); }
      100% { transform: scale(1); }
    }
    @keyframes pm-page-in {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes pm-celebrate {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.08); }
      70%  { transform: scale(.98); }
      100% { transform: scale(1); }
    }
    @keyframes pm-celebrate-ring {
      from { opacity: .8; transform: scale(.6); }
      to   { opacity: 0; transform: scale(1.6); }
    }
    @keyframes pm-shake-subtle {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-3px); }
      55%      { transform: translateX(3px); }
      80%      { transform: translateX(-2px); }
    }

    /* --- motion utility classes + stagger helper (cap 8 via min()) --- */
    .pm-enter-up { animation: pm-enter-up var(--motion-med) var(--ease-default) both; }
    .pm-enter-scale { animation: pm-enter-scale var(--motion-med) var(--ease-default) both; }
    .pm-pop { animation: pm-pop var(--motion-med) var(--ease-spring) both; }
    .pm-page-in { animation: pm-page-in 180ms var(--ease-out) both; }
    .pm-shake-subtle { animation: pm-shake-subtle 300ms var(--ease-smooth); }
    .pm-press:active { transform: scale(.97); transition: transform var(--motion-fast) var(--ease-snap); }
    .pm-celebrate { position: relative; animation: pm-celebrate 480ms var(--ease-spring); }
    .pm-celebrate::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      border: 1px solid var(--accent-primary);
      opacity: 0;
      animation: pm-celebrate-ring 600ms var(--ease-out);
      pointer-events: none;
    }
    .pm-stagger > * { animation-delay: calc(min(var(--i, 0), 8) * 50ms); }

    /* --- focus ring alias (low-specificity default; explicit class wins) --- */
    .pm6-focus-ring:focus-visible,
    :where(button, [href], input, select, textarea, [role="tab"], [tabindex]):focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    /* --- containment (perf budget, design_system section 3) --- */
    .bento-card, .widget-card, .bento-widget, .project-card-bento,
    .chat-panel, .files-panel, .bottom-panel, .floating-chat,
    .s4-panel, .chat-thread-sidebar { contain: layout paint; }
    .page:not(.active) { content-visibility: auto; contain-intrinsic-size: auto 600px; }

    /* ==================================================================
       FRIENDLY "COZY" COMPONENT SKINS (friendly-dark is the app default)
       Warm paper/charcoal ground with dot grid + static pastel corner
       glows, frosted floating chrome, pastel category-tinted cards
       (files=mint, orchestrator=sky, lanes/worktree=lavender,
       warn=butter, error=coral), pill buttons, own-accent glow rings.
       Consumes the --pm6-cozy-* hooks from part 02; every rule stays
       under [data-theme^="friendly"] scope.
       ================================================================== */

    /* ground: paper + subtle dot grid + three soft pastel corner glows */
    [data-theme^="friendly"] body {
      background:
        radial-gradient(var(--pm6-cozy-dot) 1px, transparent 1.5px) 0 0 / 18px 18px,
        radial-gradient(46% 38% at 16% 6%, var(--pm6-cozy-glow-mint), transparent 65%),
        radial-gradient(50% 42% at 88% 12%, var(--pm6-cozy-glow-lav), transparent 65%),
        radial-gradient(55% 40% at 55% 108%, var(--pm6-cozy-glow-sky), transparent 65%),
        var(--background);
    }
    /* let the ground show behind the left rail + side panel area */
    [data-theme^="friendly"] .left-panel { background: transparent; border-right-color: transparent; }

    /* chrome: frosted floating title bar + status bar, softened drawer */
    [data-theme^="friendly"] .title-bar {
      margin: 8px 12px 2px;
      background: var(--pm6-cozy-chrome);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid var(--pm6-cozy-chrome-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--elev-2);
    }
    [data-theme^="friendly"] .status-bar {
      margin: 2px 12px 8px;
      background: var(--pm6-cozy-chrome);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid var(--pm6-cozy-chrome-border);
      border-radius: var(--radius-pill);
      box-shadow: var(--elev-2);
    }
    [data-theme^="friendly"] .bottom-panel {
      background: var(--pm6-cozy-chrome);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--pm6-cozy-chrome-border);
    }

    /* nav: pill page tabs; active = mint-tinted pill w/ own-accent glow */
    [data-theme^="friendly"] .title-bar .page-tabs { gap: var(--sm); }
    [data-theme^="friendly"] .title-bar .page-tabs .page-tab {
      border: none;
      border-radius: var(--radius-pill);
      padding: 6px 14px;
      font-weight: 700;
      color: var(--text-secondary);
      transition: background var(--motion-fast) var(--ease-smooth),
                  color var(--motion-fast) var(--ease-smooth),
                  transform var(--motion-med) var(--ease-spring);
    }
    [data-theme^="friendly"] .title-bar .page-tabs .page-tab:hover {
      color: var(--text-primary);
      background: color-mix(in srgb, var(--text-primary) 6%, transparent);
    }
    [data-theme^="friendly"] .title-bar .page-tabs .page-tab:active { transform: scale(.97); }
    [data-theme^="friendly"] .title-bar .page-tabs .page-tab.active {
      background: color-mix(in srgb, var(--pm6-cozy-mint) 20%, var(--pm6-cozy-card-base));
      color: var(--accent-lime);
      border-color: transparent;
      box-shadow: 0 0 14px color-mix(in srgb, var(--pm6-cozy-mint) 45%, transparent);
    }

    /* activity bar: transparent over the ground, pill tiles, sky active */
    [data-theme^="friendly"] .activity-bar { border-right: none; background: transparent; }
    [data-theme^="friendly"] .activity-bar .icon { border-radius: 14px; color: var(--text-muted); }
    [data-theme^="friendly"] .activity-bar .icon .symbol {
      width: 40px;
      height: 40px;
      max-width: 100%;
      border-radius: 14px;
      transition: transform var(--motion-med) var(--ease-spring),
                  background var(--motion-fast) var(--ease-smooth);
    }
    [data-theme^="friendly"] .activity-bar.collapsed .icon .symbol { width: 28px; height: 28px; border-radius: 10px; }
    [data-theme^="friendly"] .activity-bar .icon:hover { color: var(--text-primary); }
    [data-theme^="friendly"] .activity-bar .icon:hover .symbol {
      transform: scale(1.1);
      background: color-mix(in srgb, var(--text-primary) 7%, transparent);
    }
    [data-theme^="friendly"] .activity-bar .icon.active { color: var(--accent-primary); }
    [data-theme^="friendly"] .activity-bar .icon.active .symbol {
      background: color-mix(in srgb, var(--pm6-cozy-sky) 16%, var(--pm6-cozy-card-base));
      box-shadow: 0 0 12px color-mix(in srgb, var(--pm6-cozy-sky) 35%, transparent);
    }
    [data-theme^="friendly"] .activity-bar .icon.active::before {
      background: var(--pm6-cozy-sky);
      border-radius: var(--radius-pill);
      left: -2px;
      top: 8px;
      bottom: 8px;
    }

    /* neutral cards: white-ish surface, soft lavender-gray border, r20 */
    [data-theme^="friendly"] .bento-widget,
    [data-theme^="friendly"] .bento-card,
    [data-theme^="friendly"] .widget-card,
    [data-theme^="friendly"] .project-card-bento {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--elev-2);
    }

    /* cozy hover/focus: own-accent glow ring + tiny scale on top of the
       shared .pm-sheen lift; --pm6-sheen-accent is set by the category
       scopes below and defaults to accent-primary (sky) elsewhere */
    [data-theme^="friendly"] .pm-sheen:hover {
      transform: translateY(-2px) scale(1.005);
      border-color: color-mix(in srgb, var(--pm6-sheen-accent, var(--accent-primary)) 45%, var(--border));
      box-shadow: 0 0 0 2px var(--pm6-sheen-accent, var(--accent-primary)),
                  0 0 22px color-mix(in srgb, var(--pm6-sheen-accent, var(--accent-primary)) 55%, transparent);
    }
    [data-theme^="friendly"][data-motion="reduced"] .pm-sheen:hover { transform: none; }
    [data-theme^="friendly"] .pm6-focus-ring:focus-visible,
    [data-theme^="friendly"] :where(button, [href], input, select, textarea, [role="tab"], [tabindex]):focus-visible {
      outline: 2px solid var(--pm6-sheen-accent, var(--accent-primary));
      outline-offset: 2px;
      box-shadow: 0 0 22px color-mix(in srgb, var(--pm6-sheen-accent, var(--accent-primary)) 55%, transparent);
    }

    /* category accents: mint = files / side-panel area */
    [data-theme^="friendly"] .side-panel-slot { --pm6-sheen-accent: var(--pm6-cozy-mint); }
    [data-theme^="friendly"] .files-panel {
      --pm6-sheen-accent: var(--pm6-cozy-mint);
      background: color-mix(in srgb, var(--pm6-cozy-mint) var(--pm6-cozy-mix), var(--pm6-cozy-card-base));
      border: 1px solid color-mix(in srgb, var(--pm6-cozy-mint) var(--pm6-cozy-border-mix), var(--pm6-cozy-card-base));
      border-radius: var(--radius-lg);
      box-shadow: var(--elev-1);
    }
    [data-theme^="friendly"] .files-panel-header {
      background: transparent;
      border-bottom-color: color-mix(in srgb, var(--pm6-cozy-mint) var(--pm6-cozy-border-mix), var(--pm6-cozy-card-base));
    }
    [data-theme^="friendly"] .files-status {
      border-top-color: color-mix(in srgb, var(--pm6-cozy-mint) var(--pm6-cozy-border-mix), var(--pm6-cozy-card-base));
    }

    /* chat panel stays neutral white-ish */
    [data-theme^="friendly"] .chat-panel {
      background: var(--surface-elevated);
      border-color: var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--elev-1);
    }

    /* buttons: secondary = soft-bordered pill; primary = sky->mint
       gradient pill w/ soft sky glow (primary blocks come LAST so they
       win the shared-class tie) */
    [data-theme^="friendly"] button { border-radius: var(--radius-md); font-family: var(--body-font); }
    [data-theme^="friendly"] button:active { transform: scale(.97); }
    [data-theme^="friendly"] .pm6-sp-btn,
    [data-theme^="friendly"] .pm6-sp-minibtn,
    [data-theme^="friendly"] .pm6-chat-btn,
    [data-theme^="friendly"] .pm6-dash-btn {
      border-radius: var(--radius-pill);
      background: var(--surface-elevated);
      border-color: var(--border);
    }
    [data-theme^="friendly"] .pm6-sp-btn-primary,
    [data-theme^="friendly"] .pm6-chat-btn-primary,
    [data-theme^="friendly"] .pm6-dash-btn--primary,
    [data-theme^="friendly"] .pm6-chat-send,
    [data-theme^="friendly"] .pm6-wiz-send,
    [data-theme^="friendly"] .pm6-wiz-approve {
      background: linear-gradient(120deg, var(--pm6-cozy-sky), var(--pm6-cozy-mint));
      border-color: transparent;
      color: #FFF;
      border-radius: var(--radius-pill);
      box-shadow: 0 4px 14px color-mix(in srgb, var(--pm6-cozy-sky) 45%, transparent);
    }
    [data-theme^="friendly"] .pm6-sp-btn-primary:hover,
    [data-theme^="friendly"] .pm6-chat-btn-primary:hover,
    [data-theme^="friendly"] .pm6-dash-btn--primary:hover,
    [data-theme^="friendly"] .pm6-chat-send:hover,
    [data-theme^="friendly"] .pm6-wiz-send:hover,
    [data-theme^="friendly"] .pm6-wiz-approve:hover {
      background: linear-gradient(120deg, var(--pm6-cozy-sky), var(--pm6-cozy-mint));
      filter: brightness(1.06);
    }

    /* chips + badges go full pill */
    [data-theme^="friendly"] .role-badge { border-radius: var(--radius-pill); }

    /* inputs: frosted-field pills in the title bar, sky glow focus */
    [data-theme^="friendly"] .title-bar .search-bar,
    [data-theme^="friendly"] .title-bar .theme-select,
    [data-theme^="friendly"] .title-bar .project-dropdown {
      border: 1px solid var(--pm6-cozy-chrome-border);
      border-radius: var(--radius-pill);
      background: var(--pm6-cozy-field);
    }
    [data-theme^="friendly"] :where(input[type="text"], input[type="search"], textarea, select) {
      border-radius: var(--radius-md);
      transition: border-color var(--motion-fast) var(--ease-smooth),
                  box-shadow var(--motion-fast) var(--ease-smooth);
    }
    [data-theme^="friendly"] :where(input[type="text"], input[type="search"], textarea, select):focus {
      border-color: var(--pm6-cozy-sky);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--pm6-cozy-sky) 55%, transparent),
                  0 0 18px color-mix(in srgb, var(--pm6-cozy-sky) 30%, transparent);
    }

    /* dropdown popovers: lifted, rounded */
    [data-theme^="friendly"] .chat-dropdown-popover {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--elev-3);
      background: var(--surface-elevated);
    }
    [data-theme^="friendly"] .chat-dropdown-item { border-radius: 10px; }
    [data-theme^="friendly"] .chat-dropdown-item.active {
      background: color-mix(in srgb, var(--pm6-cozy-sky) 16%, var(--pm6-cozy-card-base));
      color: var(--accent-primary);
    }

    /* scrollbars: friendly thumb tints via the --pm6-sb-* hooks; the opt-in
       scroll-pane selector list itself lives in part 02 (css-tokens) only */
    [data-theme="friendly-dark"] {
      --pm6-sb-thumb: color-mix(in srgb, var(--text-primary) 22%, transparent);
      --pm6-sb-thumb-hover: color-mix(in srgb, var(--text-primary) 36%, transparent);
    }
    [data-theme="friendly-light"] {
      --pm6-sb-thumb: color-mix(in srgb, var(--text-primary) 18%, transparent);
      --pm6-sb-thumb-hover: color-mix(in srgb, var(--text-primary) 32%, transparent);
    }

    /* ==================================================================
       LEGIBILITY + POLISH SWEEP (W3)
       ================================================================== */

    /* text selection rides the accent family (accent-soft was sub-AA faint;
       the 25% glow mix of the same --accent-primary reads correctly) */
    ::selection { background: var(--accent-glow); color: var(--text-primary); }

    /* panel headers step up the type scale (design_system section 4) */
    .s4-panel-title { font-size: var(--fs-xl); }
    .chat-panel-header .title { font-size: var(--fs-lg); }

    /* themed scrollbars: part 02 ships the hidden-by-default base + the
       opt-in scroll-pane list; theme families tint thumbs via the
       --pm6-sb-* hooks (retro also squares the thumb) */
    [data-theme^="retro"] {
      --pm6-sb-radius: 0px;
      --pm6-sb-thumb: color-mix(in srgb, var(--accent-primary) 50%, transparent);
      --pm6-sb-thumb-hover: color-mix(in srgb, var(--accent-primary) 70%, transparent);
    }
    [data-theme^="glass"] {
      --pm6-sb-thumb: color-mix(in srgb, var(--text-primary) 26%, transparent);
      --pm6-sb-thumb-hover: color-mix(in srgb, var(--text-primary) 40%, transparent);
    }

    /* card padding floor: var(--xl), friendly 20px (density-scaled below) */
    .bento-widget,
    .project-card-bento,
    .s4-card,
    .questionnaire-ui { padding: calc(var(--xl) * var(--density, 1)); }
    [data-theme^="friendly"] .bento-widget,
    [data-theme^="friendly"] .project-card-bento,
    [data-theme^="friendly"] .s4-card { padding: calc(20px * var(--density, 1)); }

    /* ==================================================================
       PM6 TABSTRIP RECIPE — one shared behavior for the seven horizontal
       tab systems (page/orch/editor/terminal/sc-subview/cdp/dashboard):
       nowrap strip, hidden horizontal scroll on overflow, ellipsis tabs.
       Theme skins (friendly pills, glass pills, retro) sit on top via
       higher-specificity [data-theme] rules. Settings nav is vertical
       and deliberately excluded.
       ================================================================== */
    .page-tabs, .orch-tabs, .editor-tabs, .terminal-tabstrip,
    .sc-subview-tabs, .cdp-tab-bar, .dashboard-tabs {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    .page-tabs::-webkit-scrollbar, .orch-tabs::-webkit-scrollbar,
    .editor-tabs::-webkit-scrollbar, .terminal-tabstrip::-webkit-scrollbar,
    .sc-subview-tabs::-webkit-scrollbar, .cdp-tab-bar::-webkit-scrollbar,
    .dashboard-tabs::-webkit-scrollbar { display: none; }
    .page-tabs .page-tab, .orch-tabs .orch-tab, .editor-tabs .tab,
    .sc-subview-tabs .sc-tab, .cdp-tab-bar .cdp-tab, .dashboard-tabs .tab {
      flex: 0 1 auto;
      min-width: 56px;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-flex;
      align-items: center;
      gap: var(--xs);
      height: 28px;
      box-sizing: border-box;
      font-size: var(--fs-xs);
      line-height: 1;
    }
    /* per-system deltas */
    .title-bar .page-tabs {
      flex: 1 1 auto;
      /* glow gutter: pad the scrollport so the friendly mint active glow
         (14px) and the 22px :focus-visible glow render inside it; the
         negative margins cancel the layout shift (zero visual shift).
         Per-strip on purpose — NOT in the shared recipe: theme skins
         repad other strips and carry border-bottom hairlines that must
         stay on the content edge. */
      padding-block: 12px;
      margin-block: -12px;
      padding-inline: 6px;
      margin-inline: -6px;
      margin-left: calc(var(--2xl) - 6px);   /* keeps the 2xl tab offset under the -6px start margin */
    }
    .orch-tabs .orch-tab { height: 100%; }   /* keep the 3px underline on the 36px strip's baseline */
    .editor-tabs .tab { max-width: 160px; }
    /* glow gutter for the editor strip (gains close/overflow chrome later):
       additive to the base padding (06: var(--xs) var(--md) 0 calc(var(--md)
       + 8px)) so tab positions do not move; no bottom gutter — the strip's
       border-bottom must hug the tabs. */
    .editor-tabs {
      padding-top: calc(var(--xs) + 12px);
      margin-top: -12px;
      padding-right: calc(var(--md) + 6px);
      padding-left: calc(var(--md) + 8px + 6px);
      margin-inline: -6px;
    }
    /* glass repads .editor-tabs (03: padding 0 10px 0 16px + hairline
       border-bottom); its padding override already voids the gutter there,
       so cancel the leftover margins to keep glass geometry exact (glass
       editor tabs carry inset-only shadows — nothing to un-clip). */
    [data-theme^="glass"] .editor-tabs {
      margin-top: 0;
      margin-inline: 0;
    }

    /* ==================================================================
       DENSITY (design_system section 6) — data-density maps onto
       --density; high-traffic containers multiply padding/gaps by it.
       Range C/D media queries below set .9/.85 automatically; an explicit
       user choice on <html> overrides them (rules are later in source).
       ================================================================== */
    .primary-content { padding: calc(var(--md) * var(--density, 1)); }
    .panel-content {
      padding: calc(var(--md) * var(--density, 1));
      gap: calc(var(--md) * var(--density, 1));
    }
    .chat-panel-header { padding: calc(var(--md) * var(--density, 1)); }
    .files-panel-header { padding: calc(var(--xs) * var(--density, 1)) calc(var(--sm) * var(--density, 1)); }
    .msg-body { padding: calc(var(--xs) * var(--density, 1)) calc(var(--md) * var(--density, 1)) calc(var(--md) * var(--density, 1)); }
    .sticky-plan-tracker { padding: calc(var(--md) * var(--density, 1)); }

    /* ==================================================================
       RESPONSIVE RANGES (design_system section 6)
       Range A (>=2200px): baseline :root values from part 02 — no query.
