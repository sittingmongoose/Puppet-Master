    /* ── Scrollbars: hidden everywhere by default; real scroll panes opt in ──
       The opt-in scroll-pane selector list lives HERE and only here (update
       BOTH copies below: the flat list and the :is() width rule). Theme
       families tint thumbs by overriding the --pm6-sb-* hooks (see
       pm6-css-global "themed scrollbars"); thumb color rides
       --text-primary, so light themes adapt automatically.

       Auto-hide is UNIVERSAL: every opted-in pane starts with a transparent
       thumb and reveals it while scrolling (.pm6-sb-active, written by the
       scroll-idle driver in pm6-js-globals) or while hovered. The reveal
       rules carry no copy of the selector list on purpose — see the comment
       above each for why they cannot leak into a pane that did not opt in.
       That is what keeps the list at exactly two copies. */
    :root {
      --pm6-sb-size: 10px;
      --pm6-sb-thumb: color-mix(in srgb, var(--text-primary) 16%, transparent);
      --pm6-sb-thumb-hover: color-mix(in srgb, var(--text-primary) 30%, transparent);
      --pm6-sb-radius: 8px;
    }
    /* Firefox reveal hook. inherits:false is load-bearing: scrollbar-color
       itself inherits, so a hovered outer pane would otherwise light up every
       nested pane's bar. Routing the reveal through a non-inherited hook lets
       the reveal rule stay list-free AND out of the specificity fight with the
       opt-in list (which never declares this hook). */
    @property --pm6-sb-ink { syntax: '*'; inherits: false; }
    * { scrollbar-width: none; }
    *::-webkit-scrollbar { width: 0; height: 0; }
    *::-webkit-scrollbar-button { display: none; height: 0; width: 0; }
    *::-webkit-scrollbar-corner { background: transparent; }
    /* thumb/track skin is global but only renders where a pane opts in to a
       nonzero width below; 3px transparent border fakes an inset overlay */
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb {
      background: transparent;
      border: 3px solid transparent; background-clip: padding-box;
      border-radius: var(--pm6-sb-radius);
      transition: background 0.25s ease;
    }
    /* Reveal (WebKit). Needs no selector list and cannot leak: a scrollbar
       pseudo-element belongs to the element the rule matched, so a hovered
       ancestor only ever lights up its OWN bar. Order is load-bearing — this
       ties on specificity with the thumb:hover rule, so it must stay first. */
    :is(.pm6-sb-active, :hover)::-webkit-scrollbar-thumb { background: var(--pm6-sb-thumb); }
    *::-webkit-scrollbar-thumb:hover { background: var(--pm6-sb-thumb-hover); }
    /* Reveal (Firefox): writes the non-inherited hook; only the opted-in
       panes below ever read it, so matching every hovered element is inert
       everywhere else. */
    :is(.pm6-sb-active, :hover) { --pm6-sb-ink: var(--pm6-sb-thumb); }

    /* ====================================================================
       GLASS BACKGROUND STAGE - #glass-bg (single fixed div, first in body)
       Cloudscape skies from the approved glass mockup (.gL/.gD .sky).
       Modes via html[data-glass-bg="mesh|depth|minimal"]:
         mesh    = full cloudscape (base sky + billow layer) + slow drift
         depth   = same + second parallax billow layer (--par-x/--par-y)
         minimal = base gradient sky only, static
       The whole layer is blurred so the billows fuse photographically.
       Drift is transform-only and killed globally by [data-motion="reduced"]
       / prefers-reduced-motion (see pm6-css-global "#glass-bg *" rules).
       ==================================================================== */
    #glass-bg {
      --par-x: 0;
      --par-y: 0;
      position: fixed;
      inset: 0;
      z-index: 0;
      contain: strict;
      overflow: hidden;
      pointer-events: none;
      display: none;
    }
    [data-theme^="glass"] #glass-bg { display: block; }
    [data-theme^="glass"] .app-shell { position: relative; z-index: 1; }
    #glass-bg .pm6-gbg { position: absolute; inset: 0; display: none; }
    [data-glass-bg="mesh"] #glass-bg .pm6-gbg-mesh,
    [data-glass-bg="depth"] #glass-bg .pm6-gbg-depth,
    [data-glass-bg="minimal"] #glass-bg .pm6-gbg-minimal { display: block; }

    /* --- mode: mesh (default) - one cloudscape layer (+billow pseudo),
           one very slow transform-only drift --- */
    .pm6-gbg-mesh .pm6-gbg-mesh-layer {
      position: absolute;
      inset: -8%;
      will-change: transform;
      animation: pm-sky-drift 140s ease-in-out infinite alternate;
    }
    .pm6-gbg-mesh .pm6-gbg-mesh-layer::before {
      content: "";
      position: absolute;
      inset: 0;
    }
    @keyframes pm-sky-drift {
      to { transform: translate3d(-1.6%, 1.1%, 0) scale(1.05); }
    }
    [data-theme="glass-light"] .pm6-gbg-mesh .pm6-gbg-mesh-layer {
      filter: blur(14px) saturate(1.12);
      background:
        radial-gradient(ellipse 46% 34% at 12% 8%,  #F5A9CB 0%, transparent 68%),
        radial-gradient(ellipse 52% 40% at 88% 6%,  #C9A6EE 0%, transparent 70%),
        radial-gradient(ellipse 60% 42% at 50% 100%,#9FA8EF 0%, transparent 72%),
        radial-gradient(ellipse 40% 30% at 100% 55%,#F2B9A4 0%, transparent 70%),
        linear-gradient(165deg, #F0D6EC 0%, #D9C4F0 45%, #B9B7F2 100%);
    }
    [data-theme="glass-light"] .pm6-gbg-mesh .pm6-gbg-mesh-layer::before {
      background:
        radial-gradient(ellipse 340px 120px at 18% 66%, rgba(255,255,255,.95) 40%, transparent 70%),
        radial-gradient(ellipse 240px 95px  at 30% 74%, rgba(255,255,255,.85) 40%, transparent 72%),
        radial-gradient(ellipse 420px 140px at 78% 34%, rgba(255,255,255,.9) 38%, transparent 70%),
        radial-gradient(ellipse 260px 100px at 90% 44%, rgba(255,255,255,.75) 42%, transparent 72%),
        radial-gradient(ellipse 380px 130px at 45% 14%, rgba(255,255,255,.8) 40%, transparent 70%),
        radial-gradient(ellipse 300px 110px at 8% 96%,  rgba(255,255,255,.85) 40%, transparent 72%),
        radial-gradient(ellipse 460px 150px at 62% 92%, rgba(255,255,255,.9) 38%, transparent 70%),
        radial-gradient(ellipse 200px 80px  at 55% 55%, rgba(244,199,235,.8) 40%, transparent 72%),
        radial-gradient(ellipse 240px 90px  at 35% 40%, rgba(214,190,246,.85) 40%, transparent 72%);
    }
    [data-theme="glass-dark"] .pm6-gbg-mesh .pm6-gbg-mesh-layer {
      filter: blur(14px) saturate(1.15);
      background:
        radial-gradient(ellipse 50% 38% at 15% 10%, #6E4FA3 0%, transparent 68%),
        radial-gradient(ellipse 46% 34% at 85% 8%,  #46387E 0%, transparent 70%),
        radial-gradient(ellipse 62% 44% at 50% 102%,#B25E8E 0%, transparent 72%),
        radial-gradient(ellipse 38% 28% at 98% 60%, #D08256 0%, transparent 70%),
        linear-gradient(168deg, #3A2B58 0%, #2C2148 48%, #52325C 100%);
    }
    [data-theme="glass-dark"] .pm6-gbg-mesh .pm6-gbg-mesh-layer::before {
      background:
        radial-gradient(ellipse 360px 125px at 20% 70%, rgba(203,148,206,.55) 40%, transparent 70%),
        radial-gradient(ellipse 250px 95px  at 34% 78%, rgba(178,120,182,.45) 42%, transparent 72%),
        radial-gradient(ellipse 430px 140px at 76% 36%, rgba(146,110,196,.5) 38%, transparent 70%),
        radial-gradient(ellipse 270px 100px at 92% 46%, rgba(196,130,148,.4) 42%, transparent 72%),
        radial-gradient(ellipse 380px 130px at 48% 16%, rgba(120,96,180,.45) 40%, transparent 70%),
        radial-gradient(ellipse 320px 115px at 10% 96%, rgba(226,152,142,.5) 40%, transparent 72%),
        radial-gradient(ellipse 480px 155px at 66% 94%, rgba(233,166,152,.55) 38%, transparent 70%);
    }

    /* --- mode: depth - same cloudscape + a second parallax billow layer.
           Base sky + blur live on the container; the two wrappers keep the
           pointer-parallax transform (so drift stays on their ::before /
           the cloud-puff shapes, never fighting the parallax). --- */
    [data-theme="glass-light"] .pm6-gbg-depth {
      filter: blur(14px) saturate(1.12);
      background:
        radial-gradient(ellipse 46% 34% at 12% 8%,  #F5A9CB 0%, transparent 68%),
        radial-gradient(ellipse 52% 40% at 88% 6%,  #C9A6EE 0%, transparent 70%),
        radial-gradient(ellipse 60% 42% at 50% 100%,#9FA8EF 0%, transparent 72%),
        radial-gradient(ellipse 40% 30% at 100% 55%,#F2B9A4 0%, transparent 70%),
        linear-gradient(165deg, #F0D6EC 0%, #D9C4F0 45%, #B9B7F2 100%);
    }
    [data-theme="glass-dark"] .pm6-gbg-depth {
      filter: blur(14px) saturate(1.15);
      background:
        radial-gradient(ellipse 50% 38% at 15% 10%, #6E4FA3 0%, transparent 68%),
        radial-gradient(ellipse 46% 34% at 85% 8%,  #46387E 0%, transparent 70%),
        radial-gradient(ellipse 62% 44% at 50% 102%,#B25E8E 0%, transparent 72%),
        radial-gradient(ellipse 38% 28% at 98% 60%, #D08256 0%, transparent 70%),
        linear-gradient(168deg, #3A2B58 0%, #2C2148 48%, #52325C 100%);
    }
    .pm6-gbg-depth .pm6-par-far,
    .pm6-gbg-depth .pm6-par-near { position: absolute; inset: -8%; }
    .pm6-gbg-depth .pm6-par-far  { transform: translate3d(calc(var(--par-x, 0) * 4px),  calc(var(--par-y, 0) * 2px), 0); }
    .pm6-gbg-depth .pm6-par-near { transform: translate3d(calc(var(--par-x, 0) * 10px), calc(var(--par-y, 0) * 6px), 0); }
    .pm6-gbg-depth .pm6-par-far::before {
      content: "";
      position: absolute;
      inset: 0;
      will-change: transform;
      animation: pm-sky-drift 160s ease-in-out infinite alternate;
    }
    [data-theme="glass-light"] .pm6-gbg-depth .pm6-par-far::before {
      background:
        radial-gradient(ellipse 340px 120px at 18% 66%, rgba(255,255,255,.95) 40%, transparent 70%),
        radial-gradient(ellipse 420px 140px at 78% 34%, rgba(255,255,255,.9) 38%, transparent 70%),
        radial-gradient(ellipse 380px 130px at 45% 14%, rgba(255,255,255,.8) 40%, transparent 70%),
        radial-gradient(ellipse 460px 150px at 62% 92%, rgba(255,255,255,.9) 38%, transparent 70%),
        radial-gradient(ellipse 240px 90px  at 35% 40%, rgba(214,190,246,.85) 40%, transparent 72%);
    }
    [data-theme="glass-dark"] .pm6-gbg-depth .pm6-par-far::before {
      background:
        radial-gradient(ellipse 360px 125px at 20% 70%, rgba(203,148,206,.55) 40%, transparent 70%),
        radial-gradient(ellipse 430px 140px at 76% 36%, rgba(146,110,196,.5) 38%, transparent 70%),
        radial-gradient(ellipse 380px 130px at 48% 16%, rgba(120,96,180,.45) 40%, transparent 70%),
        radial-gradient(ellipse 480px 155px at 66% 94%, rgba(233,166,152,.55) 38%, transparent 70%);
    }
    /* cloud puffs — flat white/dusk ellipses, transform-only float */
    .pm6-gbg-shape {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
      animation: pm-float var(--float-dur, 70s) ease-in-out infinite alternate;
    }
    @keyframes pm-float {
      to { transform: translate3d(var(--fx, 4%), var(--fy, -3%), 0); }
    }
    .pm6-par-far  .pm6-gbg-shape:nth-child(1) { width: 560px; height: 200px; top: 12%; left: 8%;   --fx: 3%;  --fy: 2%;  --float-dur: 100s; }
    .pm6-par-far  .pm6-gbg-shape:nth-child(2) { width: 460px; height: 170px; top: 58%; right: 6%;  --fx: -4%; --fy: -2%; --float-dur: 84s; }
    .pm6-par-far  .pm6-gbg-shape:nth-child(3) { width: 340px; height: 130px; top: 76%; left: 28%;  --fx: 5%;  --fy: -2%; --float-dur: 72s; }
    .pm6-par-near .pm6-gbg-shape:nth-child(1) { width: 320px; height: 120px; top: 22%; right: 20%; --fx: -6%; --fy: 3%;  --float-dur: 68s; }
    .pm6-par-near .pm6-gbg-shape:nth-child(2) { width: 260px; height: 100px; top: 48%; left: 12%;  --fx: 6%;  --fy: -3%; --float-dur: 76s; }
    .pm6-par-near .pm6-gbg-shape:nth-child(3) { width: 240px; height: 95px;  bottom: 10%; right: 36%; --fx: -5%; --fy: -3%; --float-dur: 64s; }
    [data-theme="glass-light"] .pm6-par-far  .pm6-gbg-shape:nth-child(1) { background: radial-gradient(closest-side, rgba(255,255,255,.85), transparent 75%); }
    [data-theme="glass-light"] .pm6-par-far  .pm6-gbg-shape:nth-child(2) { background: radial-gradient(closest-side, rgba(255,255,255,.75), transparent 75%); }
    [data-theme="glass-light"] .pm6-par-far  .pm6-gbg-shape:nth-child(3) { background: radial-gradient(closest-side, rgba(244,199,235,.7), transparent 75%); }
    [data-theme="glass-light"] .pm6-par-near .pm6-gbg-shape:nth-child(1) { background: radial-gradient(closest-side, rgba(255,255,255,.9), transparent 75%); }
    [data-theme="glass-light"] .pm6-par-near .pm6-gbg-shape:nth-child(2) { background: radial-gradient(closest-side, rgba(214,190,246,.8), transparent 75%); }
    [data-theme="glass-light"] .pm6-par-near .pm6-gbg-shape:nth-child(3) { background: radial-gradient(closest-side, rgba(255,255,255,.8), transparent 75%); }
    [data-theme="glass-dark"] .pm6-par-far  .pm6-gbg-shape:nth-child(1) { background: radial-gradient(closest-side, rgba(203,148,206,.5), transparent 75%); }
    [data-theme="glass-dark"] .pm6-par-far  .pm6-gbg-shape:nth-child(2) { background: radial-gradient(closest-side, rgba(146,110,196,.45), transparent 75%); }
    [data-theme="glass-dark"] .pm6-par-far  .pm6-gbg-shape:nth-child(3) { background: radial-gradient(closest-side, rgba(226,152,142,.45), transparent 75%); }
    [data-theme="glass-dark"] .pm6-par-near .pm6-gbg-shape:nth-child(1) { background: radial-gradient(closest-side, rgba(178,120,182,.5), transparent 75%); }
    [data-theme="glass-dark"] .pm6-par-near .pm6-gbg-shape:nth-child(2) { background: radial-gradient(closest-side, rgba(196,130,148,.45), transparent 75%); }
    [data-theme="glass-dark"] .pm6-par-near .pm6-gbg-shape:nth-child(3) { background: radial-gradient(closest-side, rgba(233,166,152,.5), transparent 75%); }

    /* --- mode: minimal - base gradient sky only, no billows, static --- */
    [data-theme="glass-light"] .pm6-gbg-minimal {
      background:
        radial-gradient(ellipse 46% 34% at 12% 8%,  #F5A9CB 0%, transparent 68%),
        radial-gradient(ellipse 52% 40% at 88% 6%,  #C9A6EE 0%, transparent 70%),
        radial-gradient(ellipse 60% 42% at 50% 100%,#9FA8EF 0%, transparent 72%),
        radial-gradient(ellipse 40% 30% at 100% 55%,#F2B9A4 0%, transparent 70%),
        linear-gradient(165deg, #F0D6EC 0%, #D9C4F0 45%, #B9B7F2 100%);
    }
    [data-theme="glass-dark"] .pm6-gbg-minimal {
      background:
        radial-gradient(ellipse 50% 38% at 15% 10%, #6E4FA3 0%, transparent 68%),
        radial-gradient(ellipse 46% 34% at 85% 8%,  #46387E 0%, transparent 70%),
        radial-gradient(ellipse 62% 44% at 50% 102%,#B25E8E 0%, transparent 72%),
        radial-gradient(ellipse 38% 28% at 98% 60%, #D08256 0%, transparent 70%),
        linear-gradient(168deg, #3A2B58 0%, #2C2148 48%, #52325C 100%);
    }
