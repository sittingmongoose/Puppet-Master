  <style id="pm6-css-chat">
    /* ==================================================================
       pm6-css-chat — chat panel + floating chat surfaces (owner: chat).
       Token-only; theme accents under [data-theme…] scopes at the bottom.
       ================================================================== */

    .pm6-hidden { display: none !important; }

    /* ---- header ---- */
    .pm6-chat-header .pm6-chat-title {
      font-size: var(--fs-md);
      font-weight: 700;
      color: var(--text-primary);
      border-radius: var(--radius-xs);
      padding: 1px 4px;
      outline: none;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: text;
    }
    .pm6-chat-title:hover { background: var(--accent-soft); }
    .pm6-chat-title:focus { outline: 2px solid; outline-color: var(--accent-primary); outline-offset: 1px; }
    .pm6-chat-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: var(--fs-2xs);
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      background: var(--surface-elevated);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-pill);
      padding: 1px 7px;
      line-height: var(--lh-tight);
      white-space: nowrap;
      flex: none;
    }
    .pm6-chat-headstats { font-size: var(--fs-xs); }
    .pm6-chat-issues {
      color: var(--accent-orange);
      border: 1px solid var(--accent-orange);
      display: flex; align-items: center; gap: 4px;
      text-decoration: none;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      transition: background var(--motion-fast) var(--ease-default);
    }
    .pm6-chat-issues:hover { background: color-mix(in srgb, var(--accent-orange) 14%, transparent); }
    .pm6-chat-iconbtn {
      background: none; border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 3px;
      border-radius: var(--radius-xs);
      display: inline-flex; align-items: center; justify-content: center;
      transition: color var(--motion-fast) var(--ease-default), background var(--motion-fast) var(--ease-default);
    }
    .pm6-chat-iconbtn:hover { color: var(--text-primary); background: var(--accent-soft); }
    .pm6-chat-ctx { cursor: pointer; color: var(--text-secondary); font-family: var(--body-font); display: flex; align-items: center; gap: var(--xs); }
    .pm6-chat-ctx-label { font-variant-numeric: tabular-nums; }
    .pm6-chat-wt { position: relative; }
    .pm6-chat-wt-dot {
      position: absolute; top: -1px; right: -2px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent-orange);
      display: none;
    }
    .wt-bind-btn.wt-unbound { color: var(--text-muted); opacity: .55; }
    .wt-bind-btn.wt-bound-clean { color: var(--accent-lime); }
    .wt-bind-btn.wt-bound-dirty { color: var(--accent-lime); }
    .wt-bind-btn.wt-bound-dirty .pm6-chat-wt-dot { display: block; }
    .wt-bind-btn.wt-bound-conflict { color: var(--accent-warning); }
    .wt-bind-btn.wt-bound-conflict .pm6-chat-wt-dot { display: block; background: var(--accent-error); }
    .pm6-chat-wt-row {
      padding: 3px 8px;
      font-size: var(--fs-xs);
      cursor: pointer;
      border-radius: var(--radius-xs);
    }
    .pm6-chat-wt-row:hover { background: var(--surface-elevated); }
    .pm6-chat-sbtitle {
      padding: var(--md);
      font-weight: 600;
      font-size: var(--fs-sm);
      letter-spacing: .06em;
      border-bottom: 1px solid var(--border-light);
      display: flex; justify-content: space-between; align-items: center;
      color: var(--text-secondary);
    }

    /* ---- thread sidebar ---- */
    .pm6-chat-newthread {
      display: flex; align-items: center; justify-content: center; gap: var(--xs);
      width: 100%;
      margin-bottom: var(--sm);
      padding: 5px var(--sm);
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--accent-primary);
      background: var(--accent-soft);
      border: 1px dashed var(--accent-glow);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--motion-fast) var(--ease-default), transform var(--motion-fast) var(--ease-default);
    }
    .pm6-chat-newthread:hover { background: var(--accent-glow); }
    .pm6-chat-newthread:active { transform: scale(.97); }
    .pm6-chat-thread { border-radius: var(--radius-sm); }
    @keyframes pm6-chat-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .45; transform: scale(.8); }
    }

    /* ---- stream + typed messages ---- */
    .pm6-chat-stream { scroll-behavior: smooth; }
    .pm6-chat-msg { animation: pm-enter-up var(--motion-med) var(--ease-default) both; }
    .pm6-chat-sys {
      align-self: center;
      display: flex; align-items: center; gap: var(--xs);
      font-size: var(--fs-2xs);
      color: var(--text-muted);
      background: var(--surface-elevated);
      border: 1px dashed var(--border-light);
      border-radius: var(--radius-pill);
      padding: 3px 12px;
      max-width: 92%;
    }
    .pm6-chat-notice {
      display: flex; gap: var(--sm); align-items: flex-start;
      font-size: var(--fs-xs);
      line-height: var(--lh-body);
      border-radius: var(--radius-md);
      padding: var(--sm) var(--md);
      border: 1px solid var(--border-light);
      background: var(--surface-elevated);
      color: var(--text-secondary);
    }
    .pm6-chat-notice-warn {
      border-color: color-mix(in srgb, var(--accent-warning) 45%, transparent);
      background: color-mix(in srgb, var(--accent-warning) 8%, transparent);
    }
    .pm6-chat-notice-error {
      border-color: color-mix(in srgb, var(--accent-error) 45%, transparent);
      background: color-mix(in srgb, var(--accent-error) 8%, transparent);
    }
    .pm6-chat-notice .pm6-ico { color: var(--accent-warning); margin-top: 1px; font-size: 13px; }
    .pm6-chat-jump { cursor: pointer; }

    /* ---- generic pm6 chat card ---- */
    .pm6-chat-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      background: var(--surface-elevated);
      padding: var(--md);
      display: flex; flex-direction: column; gap: var(--sm);
      animation: pm-enter-scale var(--motion-med) var(--ease-default) both;
    }
    .pm6-chat-card-head { display: flex; align-items: center; gap: var(--sm); }
    .pm6-chat-card-head .pm6-ico { color: var(--accent-primary); font-size: 16px; }
    .pm6-chat-card-title { font-size: var(--fs-sm); font-weight: 700; color: var(--text-primary); font-family: var(--display-font); }
    .pm6-chat-card-body { font-size: var(--fs-xs); color: var(--text-secondary); line-height: var(--lh-body); }
    .pm6-chat-card-actions { display: flex; gap: var(--sm); flex-wrap: wrap; }
    .pm6-chat-btn {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: var(--fs-2xs);
      font-weight: 600;
      padding: 3px 10px;
      cursor: pointer;
      transition: border-color var(--motion-fast) var(--ease-default), background var(--motion-fast) var(--ease-default), transform var(--motion-fast) var(--ease-default);
    }
    .pm6-chat-btn:hover { border-color: var(--accent-primary); background: var(--accent-soft); }
    .pm6-chat-btn:active { transform: scale(.96); }
    .pm6-chat-btn-primary {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: var(--surface);
    }
    .pm6-chat-btn-primary:hover { background: color-mix(in srgb, var(--accent-primary) 85%, var(--text-primary)); }
    .pm6-chat-btn[disabled], .pm6-chat-btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
    .pm6-chat-disabled { opacity: .45; cursor: not-allowed; }

    /* ---- web operation cards ---- */
    .pm6-opcard {
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      background: var(--surface-elevated);
      padding: var(--sm) var(--md);
      display: flex; flex-direction: column; gap: var(--xs);
      font-size: var(--fs-xs);
      animation: pm-enter-up var(--motion-med) var(--ease-default) both;
    }
    .pm6-opcard-head { display: flex; align-items: center; gap: var(--sm); min-width: 0; }
    .pm6-opcard-head .pm6-ico { color: var(--accent-primary); font-size: 14px; }
    .pm6-opcard-label {
      flex: 1;
      font-weight: 700;
      font-size: var(--fs-sm);
      color: var(--text-primary);
      font-family: var(--mono-font);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      min-width: 0;
    }
    .pm6-opcard-chip {
      flex: none;
      font-size: var(--fs-2xs);
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      border-radius: var(--radius-pill);
      padding: 1px 8px;
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      background: var(--surface);
      white-space: nowrap;
    }
    .pm6-opcard-chip-completed { color: var(--accent-lime); border-color: color-mix(in srgb, var(--accent-lime) 50%, transparent); background: color-mix(in srgb, var(--accent-lime) 10%, transparent); }
    .pm6-opcard-chip-running { color: var(--accent-primary); border-color: var(--accent-glow); background: var(--accent-soft); animation: pm6-chat-pulse 1.6s ease-in-out infinite; }
    .pm6-opcard-chip-waiting { color: var(--accent-orange); border-color: color-mix(in srgb, var(--accent-orange) 50%, transparent); background: color-mix(in srgb, var(--accent-orange) 10%, transparent); }
    .pm6-opcard-chip-failed { color: var(--accent-error); border-color: color-mix(in srgb, var(--accent-error) 50%, transparent); background: color-mix(in srgb, var(--accent-error) 10%, transparent); }
    .pm6-opcard-chip-canceled { color: var(--text-muted); }
    .pm6-opcard-chip-degraded { color: var(--accent-warning); border-color: color-mix(in srgb, var(--accent-warning) 50%, transparent); background: color-mix(in srgb, var(--accent-warning) 10%, transparent); }
    .pm6-opcard-prov {
      display: flex; gap: var(--xs); align-items: flex-start;
      color: var(--text-muted);
      font-style: italic;
      line-height: var(--lh-body);
    }
    .pm6-opcard-prov .pm6-ico { font-size: 12px; margin-top: 1px; flex: none; }
    .pm6-opcard-prov code, .pm6-opcard-meta code { font-family: var(--mono-font); font-size: var(--fs-2xs); color: var(--text-secondary); background: var(--surface); border-radius: var(--radius-xs); padding: 0 4px; }
    .pm6-opcard-meta {
      display: flex; flex-wrap: wrap; gap: 3px var(--md);
      padding: var(--xs) 0;
      border-top: 1px dashed var(--border-light);
    }
    .pm6-opcard-krow { color: var(--text-secondary); font-size: var(--fs-2xs); line-height: var(--lh-body); }
    .pm6-opcard-krow b { color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: var(--fs-2xs); margin-right: 3px; }
    .pm6-opcard-actions { display: flex; gap: var(--sm); flex-wrap: wrap; align-items: center; }
    .pm6-opcard-progress { display: flex; align-items: center; gap: var(--sm); }
    .pm6-opcard-progressbar {
      flex: 1; height: 4px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      border: 1px solid var(--border-light);
      overflow: hidden;
    }
    .pm6-opcard-progressfill {
      height: 100%;
      background: var(--accent-primary);
      border-radius: var(--radius-pill);
      transition: width var(--motion-slow) var(--ease-default);
    }
    .pm6-opcard-progresstext { font-size: var(--fs-2xs); color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pm6-opcard-sources { display: none; flex-direction: column; gap: 3px; border-top: 1px dashed var(--border-light); padding-top: var(--xs); }
    .pm6-opcard-sources.open { display: flex; animation: pm-enter-up var(--motion-fast) var(--ease-default) both; }
    .pm6-opcard-srcrow { display: flex; align-items: center; gap: var(--sm); font-size: var(--fs-2xs); min-width: 0; }
    .pm6-src-title { flex: 1; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pm6-src-read { color: var(--accent-lime); font-weight: 600; flex: none; }
    .pm6-src-skip { color: var(--text-muted); flex: none; }
    .pm6-conf {
      flex: none;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      border-radius: var(--radius-xs);
      padding: 0 5px;
      border: 1px solid var(--border-light);
    }
    .pm6-conf-high { color: var(--accent-lime); border-color: color-mix(in srgb, var(--accent-lime) 45%, transparent); }
    .pm6-conf-medium { color: var(--accent-primary); border-color: var(--accent-glow); }
    .pm6-conf-low { color: var(--accent-orange); border-color: color-mix(in srgb, var(--accent-orange) 45%, transparent); }
    .pm6-conf-unknown { color: var(--text-muted); }
    .pm6-opcard-cites { display: none; flex-direction: column; gap: 3px; border-top: 1px dashed var(--border-light); padding-top: var(--xs); }
    .pm6-opcard-cites.open { display: flex; }
    .pm6-opcard-citehead { font-size: var(--fs-2xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
    .pm6-opcard-citebody { display: flex; flex-direction: column; gap: 3px; }
    .pm6-opcard-denied {
      display: none;
      font-size: var(--fs-2xs);
      color: var(--text-secondary);
      border-top: 1px dashed var(--border-light);
      padding-top: var(--xs);
      align-items: center; gap: var(--sm);
    }
    .pm6-opcard[data-op-state="denied"] .pm6-opcard-denied { display: flex; flex-wrap: wrap; }
    .pm6-opcard[data-op-state="denied"] .pm6-chat-x1-actions { display: none; }
    .pm6-opcard-approval { background: color-mix(in srgb, var(--accent-orange) 8%, transparent); border-color: color-mix(in srgb, var(--accent-orange) 30%, var(--border)); }
    .pm6-opcard-research { background: color-mix(in srgb, var(--accent-primary) 8%, transparent); border-color: color-mix(in srgb, var(--accent-primary) 30%, var(--border)); }
    .pm6-opcard[data-op-state="completed"] { background: color-mix(in srgb, var(--accent-lime) 8%, transparent); border-color: color-mix(in srgb, var(--accent-lime) 30%, var(--border)); }

    /* ---- subagent card ---- */
    .pm6-subagent-card {
      margin-top: var(--sm);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      background: var(--surface);
      overflow: hidden;
    }
    .pm6-subagent-row {
      display: flex; align-items: center; gap: var(--sm);
      padding: var(--xs) var(--sm);
      cursor: pointer;
      font-size: var(--fs-xs);
      transition: background var(--motion-fast) var(--ease-default);
    }
    .pm6-subagent-row:hover { background: var(--surface-elevated); }
    .pm6-subagent-status { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); flex: none; }
    .pm6-subagent-status-running { background: var(--accent-lime); animation: pm6-chat-pulse 1.4s ease-in-out infinite; }
    .pm6-subagent-status-waiting { background: var(--accent-orange); }
    .pm6-subagent-status-failed { background: var(--accent-error); }
    .pm6-subagent-status-done { background: var(--accent-lime); animation: none; }
    .pm6-subagent-name { font-weight: 700; color: var(--text-primary); }
    .pm6-subagent-task { flex: 1; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pm6-subagent-state { color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pm6-subagent-caret { color: var(--text-muted); transition: transform var(--motion-fast) var(--ease-default); }
    .pm6-subagent-card.expanded .pm6-subagent-caret { transform: rotate(180deg); }
    .pm6-subagent-detail {
      display: none;
      border-top: 1px dashed var(--border-light);
      padding: var(--sm);
      font-size: var(--fs-2xs);
      color: var(--text-secondary);
      flex-direction: column;
      gap: var(--xs);
    }
    .pm6-subagent-card.expanded .pm6-subagent-detail { display: flex; animation: pm-enter-up var(--motion-fast) var(--ease-default) both; }
    .pm6-subagent-sec b { color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; font-size: 9px; display: block; margin-bottom: 2px; }
    .pm6-subagent-line { font-family: var(--mono-font); padding-left: var(--sm); line-height: var(--lh-body); }
    .pm6-subagent-thought { font-style: italic; font-family: var(--body-font); color: var(--text-muted); }

    /* ---- plan panel ---- */
    .pm6-chat-planpanel {
      flex-shrink: 0;
      margin: 0 var(--md) var(--xs);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      background: var(--surface-elevated);
      padding: var(--sm) var(--md);
      display: flex; flex-direction: column; gap: var(--xs);
    }
    .pm6-chat-planhead { display: flex; align-items: center; gap: var(--sm); flex-wrap: wrap; }
    .pm6-chat-planhead .pm6-ico { color: var(--accent-magenta); }
    .pm6-chat-plantitle { font-weight: 700; font-size: var(--fs-sm); color: var(--text-primary); font-family: var(--display-font); flex: 1; }
    .pm6-chat-plantodos { display: flex; flex-direction: column; gap: 3px; }
    .pm6-chat-todo { display: flex; align-items: center; gap: var(--sm); font-size: var(--fs-xs); color: var(--text-secondary); }
    .pm6-chat-tododot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--border); background: transparent; flex: none; }
    .pm6-chat-todo[data-todo="completed"] { color: var(--text-muted); text-decoration: line-through; }
    .pm6-chat-todo[data-todo="completed"] .pm6-chat-tododot { background: var(--accent-lime); border-color: var(--accent-lime); }
    .pm6-chat-todo[data-todo="in_progress"] { color: var(--text-primary); font-weight: 600; }
    .pm6-chat-todo[data-todo="in_progress"] .pm6-chat-tododot { background: var(--accent-primary); border-color: var(--accent-primary); animation: pm6-chat-pulse 1.4s ease-in-out infinite; }
    .pm6-chat-todo[data-todo="blocked"] .pm6-chat-tododot { background: var(--accent-orange); border-color: var(--accent-orange); }
    .pm6-chat-todo[data-todo="skipped"] { opacity: .55; font-style: italic; }
    .pm6-chat-todo-active { background: var(--accent-soft); border-radius: var(--radius-xs); padding: 1px 4px; margin: 0 -4px; }

    /* ---- queue chips ---- */
    .pm6-chat-queue {
      flex-shrink: 0;
      display: flex; flex-direction: column; gap: var(--xs);
      padding: 0 var(--md);
    }
    .pm6-chat-queue:not(:empty) { padding-bottom: var(--xs); }
    .pm6-chat-queuechip {
      display: flex; align-items: center; gap: var(--sm);
      background: var(--surface-elevated);
      border: 1px dashed var(--border-light);
      border-radius: var(--radius-sm);
      padding: 3px var(--sm);
      font-size: var(--fs-2xs);
      color: var(--text-secondary);
      animation: pm-enter-up var(--motion-fast) var(--ease-default) both;
    }
    .pm6-chat-queuechip-pos { flex: none; font-weight: 700; color: var(--accent-primary); }
    .pm6-chat-queuechip-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pm6-chat-queuechip-x { flex: none; cursor: pointer; color: var(--text-muted); background: none; border: none; padding: 1px 3px; }
    .pm6-chat-queuechip-x:hover { color: var(--accent-error); }
    .pm6-chat-queuefull {
      font-size: var(--fs-2xs);
      color: var(--accent-orange);
      padding: 2px var(--sm);
      font-weight: 600;
    }

    /* ---- composer ---- */
    .pm6-chat-composer:focus-within { border-color: var(--accent-primary); box-shadow: 0 0 0 2px var(--accent-soft); }
    .pm6-chat-slash-title {
      font-size: var(--fs-2xs);
      color: var(--text-muted);
      padding: var(--xs) var(--sm);
      border-bottom: 1px solid var(--border-light);
      line-height: var(--lh-body);
    }
    .pm6-chat-slash-item { cursor: pointer; }
    .pm6-chat-ptbtn {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--text-muted);
      padding: 1px 7px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: background var(--motion-fast) var(--ease-default), color var(--motion-fast) var(--ease-default);
    }
    .pm6-chat-ptbtn.active { background: var(--accent-soft); color: var(--accent-primary); }
    .pm6-chat-send {
      display: inline-flex; align-items: center; gap: var(--xs);
      background: var(--accent-primary);
      border: 1px solid var(--accent-primary);
      color: var(--surface);
      border-radius: var(--radius-sm);
      font-size: var(--fs-xs);
      font-weight: 700;
      padding: 5px 14px;
      cursor: pointer;
      transition: background var(--motion-med) var(--ease-default), border-color var(--motion-med) var(--ease-default), transform var(--motion-fast) var(--ease-default);
    }
    .pm6-chat-send:active { transform: scale(.95); }
    .pm6-chat-send .pm6-chat-send-ico-stop { display: none; }
    .pm6-chat-send[data-pm6-state="busy"] { background: var(--accent-magenta); border-color: var(--accent-magenta); }
