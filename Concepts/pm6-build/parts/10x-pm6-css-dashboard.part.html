<style id="pm6-css-dashboard">
/* ============================================================
   PMConcept6 — Dashboard page (widgets, CTA cards, catalog)
   Token-only: all vars come from the part-02 contract tokens
   (TOKENS.md) — no local standin definitions.
   ============================================================ */

/* ---------- header strip ---------- */
.page-dashboard .dashboard-header {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border-light);
  cursor: grab; padding: var(--xs) var(--sm); gap: var(--sm);
}
.page-dashboard .dashboard-tabs { display: flex; gap: 2px; }
.page-dashboard .dashboard-tabs .tab {
  padding: var(--xs) var(--md); font-size: var(--fs-xs); cursor: pointer;
  color: var(--text-secondary); border: var(--border-width) solid transparent;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  transition: color var(--motion-fast) var(--ease-default);
}
.page-dashboard .dashboard-tabs .tab:hover { color: var(--text-primary); }
.page-dashboard .dashboard-tabs .tab.active {
  color: var(--text-primary); background: var(--surface);
  border: var(--border-width) solid var(--border); border-bottom: none;
}
.pm6-dash-actions { display: flex; align-items: center; gap: var(--sm); }
.pm6-dash-add {
  display: inline-flex; align-items: center; gap: 6px;
  padding: var(--xs) var(--md); font-size: var(--fs-xs); font-weight: 600;
  color: var(--text-primary); background: var(--surface-elevated);
  border: var(--border-width) solid var(--border); border-radius: var(--radius-pill);
  cursor: pointer; font-family: var(--body-font);
  transition: transform var(--motion-fast) var(--ease-default), box-shadow var(--motion-fast) var(--ease-default), border-color var(--motion-fast) var(--ease-default);
}
.pm6-dash-add:hover { border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-soft); }
.pm6-dash-add:active { transform: scale(.97); }
.pm6-dash-add .pm6-ico { color: var(--accent-primary); }

/* Frosted scroll-under (Task 5): the widget scroll surface runs BEHIND
   the Main/Metrics/Monitoring header. Fixed header height — CSS
   constant; the scroller is lifted under the plate and padded back
   down, so content stays sharp until it crosses the header's lower
   boundary. z stays under the catalog overlay (z 60) and the pane drag
   handle (z 50). */
.dashboard-view { --pm6-dash-head-h: 36px; }
.page-dashboard .dashboard-header {
  position: relative;
  z-index: 5;
  background: var(--ed-rail-bg);
  -webkit-backdrop-filter: blur(11px) saturate(140%);
  backdrop-filter: blur(11px) saturate(140%);
}
/* glass blur budget: no nested backdrop-filter inside the pane */
[data-theme^="glass"] .page-dashboard .dashboard-header {
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  background: var(--ed-rail-bg);
}
.page-dashboard .pm6-dash-scroll {
  margin-top: calc(-1 * var(--pm6-dash-head-h));
  padding-top: calc(var(--pm6-dash-head-h) + var(--md));
}

/* ---------- icon plumbing ---------- */
.pm6-ico { display: inline-flex; width: 1em; height: 1em; flex: none; }
.pm6-ico svg { width: 1em; height: 1em; display: block; }

/* ---------- scroll region + grid ---------- */
.pm6-dash-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  /* bottom trimmed to --sm: enough to keep the last row off the panel edge
     now that .primary-content no longer contributes a gutter of its own.
     padding-top is re-set by the .page-dashboard rule above (frosted header
     inset) — do not fold it back into this shorthand. */
  padding: var(--md) var(--md) var(--sm); display: flex; flex-direction: column; gap: var(--md);
  container-type: inline-size; container-name: pm6dash;
}
.pm6-dash-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: 128px; grid-auto-flow: dense; gap: 8px; /* spec: 8px gutters */
  align-content: start;
}
@container pm6dash (min-width: 700px)  { .pm6-dash-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@container pm6dash (min-width: 1060px) { .pm6-dash-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

/* ---------- widget cards ---------- */
.pm6-dash-card {
  position: relative; overflow: hidden; /* pm-sheen host contract */
  grid-column: span min(var(--dw, 1), 2); grid-row: span var(--dh, 1);
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--surface-elevated);
  border: var(--border-width) solid var(--border-light);
  border-radius: var(--radius-lg);
  box-shadow: var(--elev-1);
  animation: pm6-dash-in var(--motion-med) var(--ease-default) both;
  animation-delay: calc(var(--i, 0) * 50ms);
  transition: transform var(--motion-med) var(--ease-default), box-shadow var(--motion-med) var(--ease-default), border-color var(--motion-med) var(--ease-default);
  contain: layout paint;
}
@container pm6dash (min-width: 700px)  { .pm6-dash-card { grid-column: span min(var(--dw, 1), 3); } }
@container pm6dash (min-width: 1060px) { .pm6-dash-card { grid-column: span min(var(--dw, 1), 4); } }
.pm6-dash-card:hover { border-color: var(--border); }
.pm6-dash-card.pm6-is-dragging { opacity: .45; transform: scale(.98); box-shadow: none; }
.pm6-dash-card.pm6-is-resizing { outline: 2px dashed var(--accent-primary); outline-offset: -2px; transition: none; }
@keyframes pm6-dash-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.pm6-dash-card-head {
  display: flex; align-items: center; gap: 6px;
  padding: var(--sm) var(--md) var(--xs); min-height: 34px;
}
.pm6-dash-card-title {
  margin: 0; font-size: var(--fs-sm); font-weight: 700; color: var(--text-primary);
  font-family: var(--display-font); letter-spacing: .02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
}
.pm6-dash-card-ico { font-size: var(--fs-md); color: var(--accent-primary); }
.pm6-dash-iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; flex: none; padding: 0;
  color: var(--text-muted); background: transparent; border: none;
  border-radius: var(--radius-sm); cursor: pointer; font-size: var(--fs-2xs);
  opacity: 0; transition: opacity var(--motion-fast) var(--ease-default), color var(--motion-fast) var(--ease-default), background var(--motion-fast) var(--ease-default);
}
.pm6-dash-card:hover .pm6-dash-iconbtn, .pm6-dash-iconbtn:focus-visible { opacity: 1; }
.pm6-dash-iconbtn:hover { color: var(--text-primary); background: var(--accent-soft); }

/* Drag handle, top-left. Matches the Home surface grip so the two movable
   things in the shell share one affordance: always visible, grab cursor,
   touch-action:none so the grip drags instead of scrolling the board. */
.pm6-dash-drag {
  width: 14px; height: 14px; flex: none; cursor: grab; border-radius: 3px;
  background-image:
    repeating-linear-gradient(45deg, var(--text-muted) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(-45deg, var(--text-muted) 0 1px, transparent 1px 4px);
  opacity: .55; touch-action: none;
  transition: opacity var(--motion-fast) var(--ease-default);
}
.pm6-dash-card:hover .pm6-dash-drag { opacity: .9; }
.pm6-dash-drag:active { cursor: grabbing; }
.pm6-dash-drag:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 1px; }

/* ---------- lifted clone + landing placeholder (u11-prism vocabulary) ----- */
.pm6-dash-lifted {
  position: fixed;
  z-index: 600;
  margin: 0;
  pointer-events: none;
  cursor: grabbing;
  transform-origin: top left;
  will-change: left, top, transform;
  box-shadow: var(--elev-2);
  transition: transform var(--mo-widget-pickup-dur, 120ms) var(--mo-widget-pickup-ease, cubic-bezier(.22,1,.36,1)),
              box-shadow var(--mo-widget-pickup-dur, 120ms) var(--mo-widget-pickup-ease, cubic-bezier(.22,1,.36,1));
}
.pm6-dash-lifted.is-lifted {
  transform: scale(1.03) rotate(.4deg);
  box-shadow: 0 20px 44px color-mix(in srgb, var(--accent-primary) 20%, transparent), var(--elev-3);
}
.pm6-dash-card.pm6-dash-placeholder {
  pointer-events: none;
  background-color: color-mix(in srgb, var(--accent-primary) 6%, transparent);
  border: 1px dashed color-mix(in srgb, var(--accent-primary) 55%, transparent);
  box-shadow: none;
  animation: pm6DashPhBreath var(--mo-pulse, 1.8s) ease-in-out infinite;
}
.pm6-dash-card.pm6-dash-placeholder > * { display: none; }
@keyframes pm6DashPhBreath {
  0%, 100% { background-color: color-mix(in srgb, var(--accent-primary) 5%, transparent); }
  50% { background-color: color-mix(in srgb, var(--accent-primary) 12%, transparent); }
}
html.pm6-dash-dragging, html.pm6-dash-dragging * { cursor: grabbing !important; }
html.pm6-dash-dragging { -webkit-user-select: none; user-select: none; }
html.pm6-dash-dragging .pm6-dash-card:hover { transform: none; }
@media (prefers-reduced-motion: reduce) {
  .pm6-dash-lifted { transition: none; }
  .pm6-dash-lifted.is-lifted { transform: none; }
  .pm6-dash-card.pm6-dash-placeholder { animation: none; background-color: color-mix(in srgb, var(--accent-primary) 8%, transparent); }
}
[data-motion="reduced"] .pm6-dash-lifted { transition: none; }
[data-motion="reduced"] .pm6-dash-lifted.is-lifted { transform: none; }
[data-motion="reduced"] .pm6-dash-card.pm6-dash-placeholder { animation: none; }

/* edge-resize grip (bottom-right) */
.pm6-dash-resize {
  position: absolute; right: 2px; bottom: 2px; width: 16px; height: 16px;
  cursor: nwse-resize; opacity: 0; border-radius: 3px;
  background:
    linear-gradient(135deg, transparent 0 52%, var(--text-muted) 52% 58%, transparent 58% 70%, var(--text-muted) 70% 76%, transparent 76%);
  transition: opacity var(--motion-fast) var(--ease-default);
  touch-action: none;
}
.pm6-dash-card:hover .pm6-dash-resize { opacity: .7; }

.pm6-dash-card-body {
  flex: 1; min-height: 0; padding: var(--xs) var(--md) var(--md);
  display: flex; flex-direction: column; gap: var(--xs);
  font-size: var(--fs-xs); color: var(--text-secondary); overflow: hidden;
}

/* ---------- shared widget innards ---------- */
.pm6-dash-chip {
  display: inline-flex; align-items: center; padding: 1px 8px; flex: none;
  border-radius: var(--radius-pill); font-size: var(--fs-2xs); font-weight: 700;
  letter-spacing: .06em; line-height: 1.6;
  background: var(--accent-soft); color: var(--accent-primary);
}
.pm6-dash-chip--live { background: color-mix(in srgb, var(--accent-lime) 14%, transparent); color: var(--accent-lime); }
.pm6-dash-chip--pass { background: color-mix(in srgb, var(--accent-lime) 14%, transparent); color: var(--accent-lime); }
.pm6-dash-chip--run  { background: color-mix(in srgb, var(--accent-orange) 14%, transparent); color: var(--accent-orange); }
.pm6-dash-chip--warn { background: color-mix(in srgb, var(--accent-warning) 16%, transparent); color: var(--accent-warning); }
.pm6-dash-chip--fail { background: color-mix(in srgb, var(--accent-error) 14%, transparent); color: var(--accent-error); }
.pm6-dash-chip--gate { background: color-mix(in srgb, var(--accent-magenta) 14%, transparent); color: var(--accent-magenta); }

.pm6-dash-bar {
  flex: 1; height: 6px; min-width: 40px; border-radius: var(--radius-pill);
  background: var(--border-light); overflow: hidden;
}
.pm6-dash-bar-fill {
  display: block; height: 100%; border-radius: inherit;
  background: var(--accent-primary);
  transition: width var(--motion-med) var(--ease-default);
}
.pm6-dash-bar-fill.is-done  { background: var(--accent-lime); }
.pm6-dash-bar-fill.is-run   { background: var(--accent-orange); }
.pm6-dash-bar-fill.is-warn  { background: var(--accent-warning); }
.pm6-dash-bar-fill.is-queue { background: var(--text-muted); }

.pm6-dash-lane { display: flex; align-items: center; gap: var(--sm); min-height: 20px; }
.pm6-dash-lane-name { flex: none; width: 44%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
.pm6-dash-lane-val { flex: none; font-variant-numeric: tabular-nums; color: var(--text-muted); font-size: var(--fs-2xs); }

.pm6-dash-rows { display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow: hidden; }
.pm6-dash-row { display: flex; align-items: center; gap: var(--sm); padding: 3px 0; border-bottom: 1px solid var(--border-light); }
.pm6-dash-row:last-child { border-bottom: none; }
.pm6-dash-row-main { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
.pm6-dash-row-t { flex: none; color: var(--text-muted); font-size: var(--fs-2xs); font-variant-numeric: tabular-nums; }
.pm6-dash-row.pm6-row-new { animation: pm6-dash-in var(--motion-med) var(--ease-default) both; }

.pm6-dash-empty {
  margin: auto 0; padding: var(--sm) 0; text-align: center;
  color: var(--text-muted); font-size: var(--fs-xs); font-style: italic;
}

/* orchestrator-progress widget */
.pm6-dash-orch { display: flex; align-items: center; gap: var(--lg); flex: 1; min-height: 0; }
.pm6-dash-ring-wrap { position: relative; width: 72px; height: 72px; flex: none; }
.pm6-dash-ring { width: 100%; height: 100%; transform: rotate(-90deg); }
.pm6-dash-ring-track { fill: none; stroke: var(--border-light); stroke-width: 6; }
.pm6-dash-ring-val {
  fill: none; stroke: var(--accent-primary); stroke-width: 6; stroke-linecap: round;
  transition: stroke-dashoffset var(--motion-med) var(--ease-default);
}
.pm6-dash-ring-label {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 0;
}
.pm6-dash-ring-label b { font-size: var(--fs-md); color: var(--text-primary); font-family: var(--display-font); }
.pm6-dash-ring-label small { font-size: var(--fs-2xs); color: var(--text-muted); }
.pm6-dash-orch-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pm6-dash-orch-run { font-size: var(--fs-sm); font-weight: 700; color: var(--text-primary); }
.pm6-dash-orch-line { font-size: var(--fs-xs); color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pm6-dash-orch-dots { display: flex; gap: 6px; font-size: var(--fs-2xs); }
.pm6-dash-dot.is-done  { color: var(--accent-lime); }
.pm6-dash-dot.is-run   { color: var(--accent-orange); }
.pm6-dash-dot.is-fail  { color: var(--accent-error); }
.pm6-dash-dot.is-queue { color: var(--text-muted); }
.pm6-dash-orch-foot { display: flex; gap: var(--sm); flex: none; padding-top: var(--xs); flex-wrap: wrap; }

/* buttons */
.pm6-dash-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 12px; font-size: var(--fs-xs); font-weight: 600;
  font-family: var(--body-font); color: var(--text-primary);
  background: var(--surface); border: var(--border-width) solid var(--border);
  border-radius: var(--radius-md); cursor: pointer;
  transition: transform var(--motion-fast) var(--ease-default), box-shadow var(--motion-fast) var(--ease-default), background var(--motion-fast) var(--ease-default);
}
.pm6-dash-btn:hover { box-shadow: 0 0 0 3px var(--accent-soft); }
.pm6-dash-btn:active { transform: scale(.97); }
.pm6-dash-btn--primary {
  background: var(--accent-primary); border-color: transparent;
  color: var(--background); font-weight: 700;
}
.pm6-dash-btn--primary:hover { box-shadow: var(--elev-hover); }
.pm6-dash-btn--ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
.pm6-dash-btn--ghost:hover { color: var(--text-primary); box-shadow: none; background: var(--accent-soft); }
.pm6-dash-btn[disabled] { opacity: .55; cursor: not-allowed; box-shadow: none; }

/* custom-metrics widget */
.pm6-dash-metric { display: flex; align-items: flex-end; gap: var(--md); flex: 1; min-height: 0; }
.pm6-dash-metric-num { display: flex; flex-direction: column; flex: none; }
.pm6-dash-metric-num b { font-size: 26px; line-height: 1.1; color: var(--text-primary); font-family: var(--display-font); font-variant-numeric: tabular-nums; }
.pm6-dash-metric-unit { font-size: var(--fs-2xs); color: var(--text-muted); letter-spacing: .06em; font-weight: 600; }
.pm6-dash-spark { flex: 1; min-width: 0; height: 34px; }
.pm6-dash-spark--tall { height: 44px; flex: 1; }
.pm6-dash-spark-line { fill: none; stroke: var(--accent-primary); stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.pm6-dash-spark-fill { fill: var(--accent-soft); stroke: none; }
.pm6-dash-metric-sub { font-size: var(--fs-2xs); color: var(--text-muted); }

/* donuts */
.pm6-dash-donut-row { display: flex; align-items: center; gap: var(--md); flex: 1; }
.pm6-dash-donut { width: 48px; height: 48px; flex: none; transform: rotate(-90deg); }
.pm6-dash-donut-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pm6-dash-donut-meta b { font-size: var(--fs-lg); color: var(--text-primary); font-family: var(--display-font); }
.pm6-dash-donut-meta small { font-size: var(--fs-2xs); color: var(--text-muted); }

/* ---------- CTA rail ---------- */
.pm6-dash-cta-rail { display: flex; flex-direction: column; gap: var(--sm); }
.pm6-dash-cta-rail:empty { display: none; }
.pm6-dash-cta {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: var(--md);
  padding: var(--md) var(--lg);
  background: color-mix(in srgb, var(--accent-primary) 8%, transparent);
  border: var(--border-width) solid color-mix(in srgb, var(--accent-primary) 30%, var(--border));
  border-radius: var(--radius-md);
  box-shadow: var(--elev-2);
  animation: pm6-dash-in var(--motion-med) var(--ease-default) both;
  animation-delay: calc(var(--i, 0) * 50ms);
}
.pm6-dash-cta[hidden] { display: none; }
.pm6-dash-cta--hitl { background: color-mix(in srgb, var(--accent-magenta) 8%, transparent); border-color: color-mix(in srgb, var(--accent-magenta) 30%, var(--border)); }
.pm6-dash-cta--hitl .pm6-dash-cta-ico { color: var(--accent-magenta); }
.pm6-dash-cta--warning { background: color-mix(in srgb, var(--accent-warning) 8%, transparent); border-color: color-mix(in srgb, var(--accent-warning) 30%, var(--border)); }
.pm6-dash-cta--warning .pm6-dash-cta-ico { color: var(--accent-warning); }
.pm6-dash-cta--blocked { background: color-mix(in srgb, var(--accent-error) 8%, transparent); border-color: color-mix(in srgb, var(--accent-error) 30%, var(--border)); }
.pm6-dash-cta--blocked .pm6-dash-cta-ico { color: var(--accent-error); }
.pm6-dash-cta-ico { font-size: 20px; flex: none; }
.pm6-dash-cta-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pm6-dash-cta-title { font-size: var(--fs-sm); font-weight: 700; color: var(--text-primary); }
.pm6-dash-cta-sub { font-size: var(--fs-xs); color: var(--text-secondary); }
.pm6-dash-cta-btns { display: flex; gap: var(--xs); flex: none; flex-wrap: wrap; justify-content: flex-end; }
.pm6-dash-cta.pm6-cta-pulse { animation: pm6-dash-cta-pulse 1.4s var(--ease-default) 2; }
@keyframes pm6-dash-cta-pulse {
  0%, 100% { box-shadow: var(--elev-2); }
  50% { box-shadow: 0 0 0 4px var(--accent-soft), var(--elev-2); }
}

/* ---------- catalog overlay ---------- */
.pm6-dash-catalog { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; }
.pm6-dash-catalog[hidden] { display: none; }
.pm6-dash-catalog-scrim {
  position: absolute; inset: 0; cursor: pointer;
  background: color-mix(in srgb, var(--background) 62%, transparent);
}
.pm6-dash-catalog-panel {
  position: relative; width: min(560px, calc(100% - 32px)); max-height: min(78%, 560px);
  display: flex; flex-direction: column; gap: var(--md);
  padding: var(--lg); overflow-y: auto;
  background: var(--surface-elevated);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--elev-2), 0 24px 60px rgba(0,0,0,.30);
  animation: pm6-dash-pop var(--motion-med) var(--ease-default) both;
}
@keyframes pm6-dash-pop { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
.pm6-dash-catalog-head { display: flex; align-items: baseline; gap: var(--sm); }
.pm6-dash-catalog-head h3 { margin: 0; font-size: var(--fs-lg); color: var(--text-primary); font-family: var(--display-font); flex: none; }
.pm6-dash-catalog-head .pm6-dash-iconbtn { opacity: 1; margin-left: auto; align-self: center; }
.pm6-dash-catalog-hint { font-size: var(--fs-2xs); color: var(--text-muted); }
.pm6-dash-catalog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sm); }
.pm6-dash-catalog-item {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
  padding: var(--md); text-align: left; cursor: pointer;
  font-family: var(--body-font); color: var(--text-secondary);
  background: var(--surface); border: var(--border-width) solid var(--border-light);
  border-radius: var(--radius-md);
  transition: transform var(--motion-fast) var(--ease-default), border-color var(--motion-fast) var(--ease-default), box-shadow var(--motion-fast) var(--ease-default);
}
.pm6-dash-catalog-item:hover { border-color: var(--accent-primary); transform: translateY(-2px); box-shadow: var(--elev-hover); }
