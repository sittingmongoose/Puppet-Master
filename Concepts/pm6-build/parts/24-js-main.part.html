      function initPaneResizersIn(root) {
        if (!root) return;
        root.querySelectorAll('.pm-term-pane-resizer').forEach(function(rz) {
          if (rz.dataset.pmReg) return;
          rz.dataset.pmReg = '1';
          var prev = rz.previousElementSibling;
          var next = rz.nextElementSibling;
          if (prev && next && window.registerResizer) {
            window.registerResizer(rz, {
              isHorizontal: rz.classList.contains('resizer-col'),
              onMove: function(e) {
                if (rz.classList.contains('resizer-col') && prev.parentNode) {
                  var total = prev.getBoundingClientRect().width + next.getBoundingClientRect().width;
                  var pw = e.clientX - prev.getBoundingClientRect().left;
                  if (pw > 80 && total - pw > 80) {
                    prev.style.flex = 'none';
                    next.style.flex = 'none';
                    prev.style.width = pw + 'px';
                    next.style.width = (total - pw) + 'px';
                  }
                } else if (!rz.classList.contains('resizer-col') && prev.parentNode) {
                  var total = prev.getBoundingClientRect().height + next.getBoundingClientRect().height;
                  var ph = e.clientY - prev.getBoundingClientRect().top;
                  if (ph > 40 && total - ph > 40) {
                    prev.style.flex = 'none';
                    next.style.flex = 'none';
                    prev.style.height = ph + 'px';
                    next.style.height = (total - ph) + 'px';
                  }
                }
              }
            });
          }
        });
      }
