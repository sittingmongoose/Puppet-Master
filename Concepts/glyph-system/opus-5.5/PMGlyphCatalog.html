/* ------------------------------------------------------------------ 8c. the capabilities wand in colour (2026-10-07) */
/* OWNER of this block: Neon icons (Jared, 2026-10-07: "The Assistant capabilities wand should be colored. Maybe silver
   handle, gold star end, with the 3 sparkles being colored, maybe blue, pink, green? It should still read as neon ...
   after the shake it should sparkle the colored sparkles"). The one deliberate exception to "colour is reserved for
   status" (section 12): the composer's capabilities wand ([data-menu-anchor="wand"]) and its menu head (the
   Assistant capabilities menu's .menu-head) paint the wand's element inks (neon-icons.js wand: nx-i-silver, -gold,
   -blue, -pink, -green on each tube and on its own halo path), so each tube blooms in its own colour on dark themes.
   The Skill step's wand (Orbit, the working card) is not in scope: it inks by status as before.
   The inks are literal per theme brightness (like --nx-idle, section 1: no color-mix()), the deeper set on paper,
   where halos are off and the ink alone carries the colour (each >= 3:1 on the light composer and menu fields). The
   svg pins --nx-ink to the silver, so the hover ink rule (section 8, zero specificity) never greys it and neon-verify
   17b reads it as a glyph with its own ink. NieR draws it in ink (no colour; the handle a lighter ink tone and the
   star filled, so the star end still reads), with square caps and no glow. */
body {
  --nx-wand-silver: #c6cdda; --nx-wand-gold: #ffc940; --nx-wand-blue: #55aeff; --nx-wand-pink: #ff6fbc; --nx-wand-green: #46df93;
  /* the sparkle's bloom at the peak of its twinkle (element opacity carries the curve, so it composites) */
  --nx-h-spark-i: .8;
}
body[data-theme$="-light"] {
  --nx-wand-silver: #6a7280; --nx-wand-gold: #a26f00; --nx-wand-blue: #1d6ccc; --nx-wand-pink: #c42f7c; --nx-wand-green: #16834a;
  --nx-h-spark-i: 0;
}
html:not([data-o55-nier="on"]) [data-menu-anchor="wand"] > svg[data-nx="wand"],
html:not([data-o55-nier="on"]) .menu-head > svg[data-nx="wand"] { --nx-ink: var(--nx-wand-silver); }
html:not([data-o55-nier="on"]) [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-i-gold,
html:not([data-o55-nier="on"]) .menu-head > svg[data-nx="wand"] .nx-i-gold { stroke: var(--nx-wand-gold); }
html:not([data-o55-nier="on"]) [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-i-blue,
html:not([data-o55-nier="on"]) .menu-head > svg[data-nx="wand"] .nx-i-blue { stroke: var(--nx-wand-blue); }
html:not([data-o55-nier="on"]) [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-i-pink,
html:not([data-o55-nier="on"]) .menu-head > svg[data-nx="wand"] .nx-i-pink { stroke: var(--nx-wand-pink); }
html:not([data-o55-nier="on"]) [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-i-green,
html:not([data-o55-nier="on"]) .menu-head > svg[data-nx="wand"] .nx-i-green { stroke: var(--nx-wand-green); }
/* NieR: ink only; a lighter ink tone on the handle and a filled star tell the parts apart without colour */
html[data-o55-nier="on"] [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-c.nx-i-silver,
html[data-o55-nier="on"] .menu-head > svg[data-nx="wand"] .nx-c.nx-i-silver { stroke-opacity: .55; }
html[data-o55-nier="on"] [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-c.nx-i-gold,
html[data-o55-nier="on"] .menu-head > svg[data-nx="wand"] .nx-c.nx-i-gold { fill: var(--nx-ink, currentColor); }
/* The sparkle. After the hover/focus flick (the rod's 440 ms bounce), the sparkles twinkle in turn, blue, pink,
   green, 120 ms apart (240 ms + each sparkle's --ad: 360, 480, 600 ms): each dims, turns (a plus turned 90 degrees
   lands on itself, so it reads as a glint, never a spin), bursts into an eight-point glint (its thin diagonal cross,
   an nx-ov overlay, flashes) with its bloom flaring to --nx-h-spark-i, and settles; all done about 1.1 s after the
   hover. Opacity and transform only. The bloom's flare is opacity: while hovered the sparkle's halo takes the strong
   token as its stroke-opacity and the host's halo strength over it as its element opacity, and the keyframes name
   only the peak (the rest is the underlying value). Light themes have no halo (the token is 0, so the halo stays at
   stroke-opacity 0 whatever its element opacity): there the dip, the turn and the burst carry it. Retro and NieR step it
   (their --nx-ease; NieR steps(2)). Reduced motion (section 10) stops all of it. */
[data-menu-anchor="wand"]:where(:hover, :focus-visible) > svg[data-nx="wand"] .nx-wsp { animation: nx-wand-spark 520ms var(--nx-ease) calc(240ms + var(--ad, 0) * 1ms) backwards; }
[data-menu-anchor="wand"]:where(:hover, :focus-visible) > svg[data-nx="wand"] .nx-wsp > .nx-wray { animation: nx-wand-ray 520ms linear calc(240ms + var(--ad, 0) * 1ms) backwards; }
[data-menu-anchor="wand"]:where(:hover, :focus-visible) > svg[data-nx="wand"] .nx-wsp > .nx-h {
  stroke-opacity: var(--nx-h-spark-i); opacity: calc(var(--nx-hi-a, 0) / var(--nx-h-spark-i));
  animation: nx-wand-flare 520ms linear calc(240ms + var(--ad, 0) * 1ms) backwards;
}
html[data-o55-nier="on"] [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-wsp,
html[data-o55-nier="on"] [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-wray { animation-timing-function: steps(2, end); }
/* the glint's rays are thin (the tube's weight x .55), so the burst reads as a star, not a ball */
svg:where([data-nx="wand"]) .nx-wray { stroke-width: calc(var(--nx-stroke-base, 1.8) * var(--nx-tone-k, 1) * .55); }
@keyframes nx-wand-spark { 0% { transform: rotate(0deg); opacity: 1; } 28% { transform: rotate(40deg); opacity: .5; } 50% { transform: rotate(68deg); opacity: 1; } 100% { transform: rotate(90deg); opacity: 1; } }
@keyframes nx-wand-ray { 0%, 34% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
@keyframes nx-wand-flare { 50% { opacity: 1; } }

/* ------------------------------------------------------------------ 8d. Grill Me's kettle grill (2026-10-07) */
/* OWNER of this block: Neon icons. neon-icons.js grill: whenever a context plays the glyph's one-shot (--nx-1: a
   hovered or focused host, a mounting still mark), the lid swings open about its left hinge, flames flicker in the
   gap, a puff of smoke (two wisps, the second 60 ms behind) rises out of it and drifts off, and the lid drops shut
   with a small clank, in about a second (the grill's own --nx-d1). The lid's keyframes are bespoke (lift, hold, an
   accelerating drop in short segments, one bounce), so the voice's easing still shapes every segment (Retro and NieR
   step it). The flames and the smoke are act overlays (nx-ov): hidden at rest, they take their keyframes from the same
   --nx-1 (unset, the declaration is invalid and they stay still) and never play below 12 px (nx-z0), where the lid
   does not move either. Transform and opacity only; reduced motion (section 10) stops all of it. */
svg:where([data-nx="grill"]) { --nx-d1: 1000ms; }
svg:where([data-nx="grill"]) .nx-glid { animation: nx-grill-lid var(--nx-1); }
svg:where([data-nx="grill"]:not(.nx-z0)) .nx-gfl { animation: nx-grill-flame var(--nx-1); }
svg:where([data-nx="grill"]:not(.nx-z0)) .nx-gsm1 { animation: nx-grill-smoke1 var(--nx-1); }
svg:where([data-nx="grill"]:not(.nx-z0)) .nx-gsm2 { animation: nx-grill-smoke2 var(--nx-1); }
/* the smoke is a finer tube than the kettle */
svg:where([data-nx="grill"]) .nx-gsm { stroke-width: calc(var(--nx-stroke-base, 1.8) * var(--nx-tone-k, 1) * .75); }
/* Where the grill is drawn (item 11, 2026-10-07): the Deep Plan sidecar's Grill Me row and the plan dialogs' Grill Me
   buttons (buttons: the concept hover rule above plays it), the run views' Grill Me checks (module-shell pmxCheck's
   glyph) and the setup sheets' Add specialists shelf (collaboration.js: the Grill Me item, in its seat hue). A check
   row is a label and a shelf item a plain row, not the hover rule's hosts, so they are named here: hovering the row or
   focusing its box or its Add swells the halo and plays the act once, exactly like a concept glyph in a button. At
   rest the grill stands still (a sheet's marks hold still, the pmx loop budget is the sheen's). */
.pmx-check:where(:hover, :focus-within) > .pmx-check-glyph > svg:where(.nx),
.pmx-spec:where(:hover, :focus-within) > .pmx-spec-glyph > svg:where(.nx) {
  --nx-hi-a: var(--nx-h-swell-i);
  --nx-1: var(--nx-d1) var(--nx-ease) backwards;
}
@keyframes nx-grill-lid {
  0% { transform: translate(0px, 0px) rotate(0deg); } 24%, 50% { transform: translate(0px, -1.2px) rotate(-20deg); }
  58% { transform: translate(0px, -.96px) rotate(-16deg); } 63% { transform: translate(0px, -.54px) rotate(-9deg); }
  67% { transform: translate(0px, 0px) rotate(0deg); } 73% { transform: translate(0px, -.19px) rotate(-3.2deg); }
  79%, 100% { transform: translate(0px, 0px) rotate(0deg); }
}
@keyframes nx-grill-flame {
  0%, 10% { opacity: 0; transform: translate(0px, .6px); } 18% { opacity: 1; transform: translate(0px, 0px); }
  24% { opacity: .6; transform: translate(0px, .3px); } 30% { opacity: 1; transform: translate(0px, -.3px); }
  37% { opacity: .7; transform: translate(0px, 0px); } 44% { opacity: 1; transform: translate(0px, -.2px); }
  52% { opacity: .8; transform: translate(0px, 0px); } 60%, 100% { opacity: 0; transform: translate(0px, .6px); }
}
@keyframes nx-grill-smoke1 {
  0%, 26% { opacity: 0; transform: translate(0px, 0px); } 36% { opacity: .85; transform: translate(.6px, -1.6px); }
  62% { opacity: .55; transform: translate(1.8px, -4px); } 80%, 100% { opacity: 0; transform: translate(2.4px, -5.6px); }
}
@keyframes nx-grill-smoke2 {
  0%, 32% { opacity: 0; transform: translate(0px, 0px); } 42% { opacity: .85; transform: translate(.4px, -1.6px); }
  68% { opacity: .5; transform: translate(1.2px, -4.2px); } 86%, 100% { opacity: 0; transform: translate(1.6px, -6px); }
}

/* ------------------------------------------------------------------ 9. the status set (plan §3) */
/* The wrapper carries the list rhythm; .nx-st-base is the static lit layer, .nx-st-move the moving part. Wired
   into the surfaces by step 3B; here so the gallery and every later surface share one definition. */
/* The wrapper is a small stacking context, so its backlight paints behind the glyph and above the row. */
.nx-st { position: relative; isolation: isolate; display: inline-flex; flex: none; line-height: 0; vertical-align: middle; }
.nx-st > svg.nx { display: block; }
/* The backlight: the glow's soft tail, a radial gradient of the plain tone token, about 2.2x the mark, faded by
   element opacity (no color-mix, no filter). It has no edge, unlike stepped stroke bands. */
.nx-st::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 220%; height: 220%; translate: -50% -50%;
  border-radius: 50%; pointer-events: none; z-index: -1;
  background: radial-gradient(closest-side, var(--nx-bl-ink, currentColor), transparent);
  opacity: var(--nx-bl-a, 0);
}
.nx-tn-blocked { --nx-bl-ink: var(--danger); --nx-bl-a: var(--nx-bl-blocked); }
.nx-tn-attention { --nx-bl-ink: var(--warning); --nx-bl-a: var(--nx-bl-attention); }
.nx-tn-working { --nx-bl-ink: var(--accent); --nx-bl-a: var(--nx-bl-working); }
.nx-tn-changed { --nx-bl-ink: var(--accent-2); --nx-bl-a: var(--nx-bl-changed); }
/* the quiet tones are unlit: no backlight box at all */
.nx-tn-done::before, .nx-tn-idle::before, .nx-tn-paused::before { display: none; }
/* working: the bead orbits slowly on the still ring (9 s: the quietest live mark, below reviewing), no breathe, no
   backlight (the inner halo only), the same 9 s in the thread list and alone. Final review (2026-10-03): the list used
   to turn the whole gapped ring in 16 s, which read as a frozen spinner at a glance (the bead crept 1.84 px/s) while
   the turning arc's antialiasing still out-moved needs-you; now only the bead moves (neon-icons.js st-working), so a
   9 s list bead is both livelier and quieter, and needs-you's lead (neon-verify 13) is wider. */
.nx-st-working::before { display: none; }
.nx-st-working .nx-p { animation: var(--kl) 9000ms var(--nx-le) infinite; animation-delay: calc(var(--ad, 0) * 9ms - 9000ms); }
/* reviewing: the lens sweeps the page; no outer glow, so it stays below needs-you */
.nx-st-reviewing::before { display: none; }
.nx-st-reviewing .nx-p { animation: var(--kl) 2800ms var(--nx-le) infinite; animation-delay: calc(var(--ad, 0) * 2.8ms - 2800ms); }
/* waiting (needs you) leads every list: full steady halo, the "?" hops 3.4 units twice every 2.4 s and the
   backlight breathes .6-1 (literal keyframes per theme brightness; opacity only, so it composites). In the thread
   list (.ph-status) the backlight swells with the beat instead: brightest and widest (x1.12) on the hops, ebbing to a
   quarter and x.88 between them (opacity and transform). Integrate (2026-10-02): the deeper, wider swell is what keeps
   needs-you above the working bead in every theme's list; fix cycle 1 keeps it to the list (:not(.nx-still), so
   section 14's still rule keeps the last word on a still mark's backlight). */
.nx-st-waiting .nx-p { animation: var(--kl) 2400ms var(--nx-le) infinite; animation-delay: calc(var(--ad, 0) * 2.4ms - 2400ms); }
.nx-st-waiting::before { animation: nx-bl-needs 2400ms ease-in-out infinite; }
body[data-theme$="-light"] .nx-st-waiting::before { animation-name: nx-bl-needs-l; }
.ph-status .nx-st-waiting:not(.nx-still)::before { animation-name: nx-bl-swell; }
body[data-theme$="-light"] .ph-status .nx-st-waiting:not(.nx-still)::before { animation-name: nx-bl-swell-l; }
@keyframes nx-bl-needs { 0%, 100% { opacity: .08; } 50% { opacity: .048; } }
@keyframes nx-bl-needs-l { 0%, 100% { opacity: .081; } 50% { opacity: .049; } }
@keyframes nx-bl-swell { 0%, 100% { opacity: .085; transform: scale(1.12); } 50% { opacity: .025; transform: scale(.88); } }
/* light themes' list swell peaks at .08 (final review: .11 read as a disc), the light attention backlight's swell */
@keyframes nx-bl-swell-l { 0%, 100% { opacity: .08; transform: scale(1.12); } 50% { opacity: .025; transform: scale(.88); } }
/* waiting on a dependency: the hourglass tips once, then holds */
.nx-st-waiting-dep .nx-p { animation: var(--kl) 3600ms var(--nx-le) infinite; animation-delay: calc(var(--ad, 0) * 3.6ms - 3600ms); }
/* recovering: a counter-clockwise ratchet, one 90-degree tick every 2.4 s (two per 4.8 s cycle) */
.nx-st-recovering .nx-p { animation: var(--kl) 4800ms var(--nx-le) infinite; animation-delay: calc(var(--ad, 0) * 4.8ms - 4800ms); }
/* complete: a bold check that clip-draws once on mount */
.nx-st-complete > svg.nx { --nx-stroke-base: 2.4; --nx-tone-k: 1; }
.nx-st-complete .nx-p { animation: var(--k1) 520ms var(--nx-ease-c) backwards; }
/* blocked: the shackle drops shut once, then the wrapper takes the bar's hard double blink */
.nx-st-blocked .nx-p { animation: var(--k1) 520ms var(--nx-ease) backwards; }
.nx-st-blocked { animation: ab-alert 1900ms steps(1, end) 700ms infinite; }
/* failed: an irregular stutter, reserved for failed */
.nx-st-failed { animation: nx-stutter 2700ms linear infinite; }
@keyframes nx-stutter { 0%, 61%, 66%, 70%, 74%, 100% { opacity: 1; } 63% { opacity: .35; } 68% { opacity: .55; } 72% { opacity: .3; } }
/* idle (ready), paused, pending, skipped, mixed: static */
/* idle and pending are unlit, but keep the full weight so a ready or queued row still reads at a glance */
.nx-st-idle > svg.nx { --nx-hi-a: 0; --nx-hiv: hidden; --nx-tone-k: 1; }
.nx-st-pending > svg.nx { --nx-tone-k: 1; --nx-ink: var(--muted); }

/* ------------------------------------------------------------------ 10. reduced motion */
/* All three routes (the media query, body.pm56-reduced and html[data-motion="reduced"], the PMConcept7 contract) stop
   every neon animation and transition outright; the base style is the finished, lit pose, so ink, halo and weight
   still carry the state with no infinite animation. This covers every host's loops on an svg.nx or a status wrapper:
   the Orbit's live glyph parts, the bar's breathe and alert rhythms, the jump button's working breathe, the status
   beads, the needs-you hop and backlight, blocked's blink and failed's stutter. (The data-motion route was missing
   until 3E2 fix cycle 1: only NieR's section 11 had it.) */
@media (prefers-reduced-motion: reduce) {
  svg.nx, svg.nx .nx-p, svg.nx .nx-h, svg.nx .nx-ov, .nx-st, .nx-st::before, .nx-bolt::before { animation: none !important; transition: none !important; }
}
body.pm56-reduced svg.nx, body.pm56-reduced svg.nx .nx-p, body.pm56-reduced svg.nx .nx-h, body.pm56-reduced svg.nx .nx-ov, body.pm56-reduced .nx-st, body.pm56-reduced .nx-st::before, body.pm56-reduced .nx-bolt::before { animation: none !important; transition: none !important; }
html[data-motion="reduced"] svg.nx, html[data-motion="reduced"] svg.nx .nx-p, html[data-motion="reduced"] svg.nx .nx-h, html[data-motion="reduced"] svg.nx .nx-ov, html[data-motion="reduced"] .nx-st, html[data-motion="reduced"] .nx-st::before, html[data-motion="reduced"] .nx-bolt::before { animation: none !important; transition: none !important; }

/* ------------------------------------------------------------------ 11. NieR Mode (PMConcept7 contract) */
/* OWNER of this section: NieR Mode, step N-A (2026-10-02); the rest of the file is the foundation's. Every rule is
   scoped by html[data-o55-nier="on"] (nier.js writes it only while a NieR theme is painted; nier.css holds the
   palette), so the default themes never see one. NieR: Automata has no bloom: ink tubes, no halo band and no
   backlight. Tone inks come from the NieR tables through the same tokens (--accent is the ink, --warning the warning
   ink, --danger the rust, --positive the olive, --accent-2 the secondary ink); idle and paused are the ink at .45.
   Motion is stepped (the NieR voice), transform and opacity only. */
html[data-o55-nier="on"] body {
  --nx-h-blocked-i: 0; --nx-h-attention-i: 0; --nx-h-working-i: 0; --nx-h-changed-i: 0; --nx-h-quiet-i: 0;
  --nx-h-concept-i: 0; --nx-h-hover-i: 0; --nx-h-swell-i: 0; --nx-h-bolt-i: 0;
  --nx-bl-blocked: 0; --nx-bl-attention: 0; --nx-bl-working: 0; --nx-bl-changed: 0;
  --nx-ease: steps(4, end); --nx-le: steps(6, end); --nx-ease-c: steps(3, end);
}
html[data-o55-nier="on"] svg.nx .nx-h { display: none; }
html[data-o55-nier="on"] .nx-st::before { display: none; }
html[data-o55-nier="on"] .activity-item[data-hover-domain]::after { display: none; }
html[data-o55-nier="on"] svg:where(.nx-a-spin) { --nx-le: steps(12, end); }
html[data-o55-nier="on"] svg:where(.nx-t-idle) { --nx-ink: rgba(var(--o55-nier-ink-rgb), var(--nx-idle-a, .45)); }
/* NieR Light: idle ink at .545 reads 3.06:1 on the row field (3:1 floor; the rust of blocked is 3.14) (3E2). A token,
   so the rules that restate a set member's ink (pending's, section 6) keep their specificity over it. */
html[data-o55-nier="on"] body[data-theme$="-light"] { --nx-idle-a: .545; }
html[data-o55-nier="on"] svg:where(.nx-t-paused) { --nx-ink: rgba(var(--o55-nier-ink-rgb), var(--nx-paused-a, .45)); }
/* NieR Light paused and skipped at .63 (3.78:1 on the row field), so the quiet order holds above idle's .545 (fix
   cycle 1; at .45 they read 2.45, under idle). NieR Dark keeps .45. */
html[data-o55-nier="on"] body[data-theme$="-light"] { --nx-paused-a: .63; }
/* On the cursor bar (a hovered or selected thread row) the quiet tones stay quiet: the bar's :where(*) rule
   (nier-parts.css, 0,3,1) turns every glyph to full paper, and idle's whole ring then outweighed the working diamond,
   which rotateY narrows in four of its six steps (integrate fix cycle 1). They take the bar's paper at their own
   alpha instead (0,4,2, so they beat the bar's rule although neon-icons.css comes first). */
html[data-o55-nier-parts~="cursor"] .thread-row:hover svg.nx-t-idle,
html[data-o55-nier-parts~="cursor"] .thread-row.active svg.nx-t-idle { --nx-ink: rgba(var(--o55-nier-on-ink-rgb), var(--nx-idle-a, .45)); }
html[data-o55-nier-parts~="cursor"] .thread-row:hover svg.nx-t-paused,
html[data-o55-nier-parts~="cursor"] .thread-row.active svg.nx-t-paused { --nx-ink: rgba(var(--o55-nier-on-ink-rgb), var(--nx-paused-a, .45)); }
/* Square icon strokes [icons]: square caps and mitred joins, with a miter limit of 2 so a right angle stays sharp and
   anything tighter (the bolt, the wand's sparkle, a chevron at 12 px) bevels instead of spiking. */
html[data-o55-nier-parts~="icons"] svg.nx { stroke-linecap: square; stroke-linejoin: miter; stroke-miterlimit: 2; }
/* NieR forbids animated clip-path: a part that draws in by clip appears by stepped opacity instead, from .4 so a
   hover act never blanks it; the complete check appears in two steps. */
html[data-o55-nier="on"] svg.nx .nx-pc { animation-name: o55n-nx-reveal; animation-timing-function: steps(3, end); }
@keyframes o55n-nx-reveal { from { opacity: .4; } to { opacity: 1; } }
html[data-o55-nier="on"] .nx-st-complete .nx-p { animation: o55n-nx-two 360ms steps(2, end) backwards; }
@keyframes o55n-nx-two { from { opacity: 0; } to { opacity: 1; } }
/* Hover ignite is a two-beat stepped flicker of the tube itself (there is no halo to light). One selector per host
   kind (shell-selfcheck: no rightmost :is() list); the svg's own animation is never touched. */
html[data-o55-nier="on"] button:hover > svg.nx-r-control .nx-c,
html[data-o55-nier="on"] button:focus-visible > svg.nx-r-control .nx-c,
html[data-o55-nier="on"] button:hover > :not(button) > svg.nx-r-control .nx-c,
html[data-o55-nier="on"] [data-action]:hover > svg.nx-r-control .nx-c,
html[data-o55-nier="on"] [data-action]:focus-visible > svg.nx-r-control .nx-c,
html[data-o55-nier="on"] [data-action]:hover > :not([data-action]) > svg.nx-r-control .nx-c,
html[data-o55-nier="on"] [role="button"]:hover > svg.nx-r-control .nx-c,
html[data-o55-nier="on"] summary:hover > svg.nx-r-control .nx-c { animation: o55n-nx-flick 240ms steps(1, end); }
@keyframes o55n-nx-flick { 0% { opacity: .45; } 33% { opacity: 1; } 66% { opacity: .45; } 100% { opacity: 1; } }
/* The Fast bolt strikes in ink, in steps (3D; redrawn 2026-10-07): the ink fill steps down band by band, then the bolt
   flashes solid ink, flickers once and clears, every frame held; the halo and the backlight are gone. */
html[data-o55-nier="on"] .nx-bolt > svg.nx .nx-p { animation-timing-function: steps(1, end); }
html[data-o55-nier="on"] .nx-bolt > svg.nx .nx-bk { fill: var(--nx-ink, currentColor); }
html[data-o55-nier="on"] .nx-bolt::before { display: none; }
/* The status set keeps every silhouette apart, because NieR's inks are close:
   needs-you is an inverted ink block with paper strokes and a paper "?" (it outshines everything); */
html[data-o55-nier="on"] .nx-st-waiting { background: var(--nx-bk, var(--o55-nier-ink)); box-shadow: 0 0 0 2px var(--nx-bk, var(--o55-nier-ink)); }
html[data-o55-nier="on"] .nx-st-waiting > svg.nx { --nx-ink: var(--o55-nier-on-ink); }
/* a pmx decision row ("Your move.") inks its mark in --accent (module-shell.css, 0,5,1), and NieR's --accent is the
   block's own ink, so the "?" vanished into the block (final review, 2026-10-03): the block's strokes stay paper there */
html[data-o55-nier="on"] .pmx-decision[data-tone] .pmx-decision-mark > .nx-st-waiting > svg.nx { --nx-ink: var(--o55-nier-on-ink); }
/* on an ink cursor bar the block turns over: paper with ink strokes */
html[data-o55-nier-parts~="cursor"] .thread-row:hover .nx-st-waiting,
html[data-o55-nier-parts~="cursor"] .thread-row.active .nx-st-waiting { --nx-bk: var(--o55-nier-on-ink); }
html[data-o55-nier-parts~="cursor"] .thread-row:hover .nx-st-waiting > svg.nx,
html[data-o55-nier-parts~="cursor"] .thread-row.active .nx-st-waiting > svg.nx { --nx-ink: var(--o55-nier-ink); }
/* and, NieR's form of the list swell (it has no backlight): in the thread list four ink corner brackets lock on
   around the block for the two "?" beats of each 2.4 s cycle, then let go (held frames, opacity only). Integrate
   (2026-10-02): without them the slowed working diamond still out-moved needs-you in a NieR list (neon-verify 13).
   List only, like the swell (fix cycle 1): the chat header's mark clips its own box, so the brackets never showed there.
   They are the Target brackets part's (final fix 2026-10-03): with that part off the block stays, the brackets go. */
html[data-o55-nier-parts~="brackets"] .ph-status .nx-st-waiting::after {
  content: ""; position: absolute; inset: -5px; pointer-events: none; opacity: 0; --nx-bk-c: var(--nx-bk, var(--o55-nier-ink));
  background:
    linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) left top / 4px 1px no-repeat, linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) left top / 1px 4px no-repeat,
    linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) right top / 4px 1px no-repeat, linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) right top / 1px 4px no-repeat,
    linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) left bottom / 4px 1px no-repeat, linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) left bottom / 1px 4px no-repeat,
    linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) right bottom / 4px 1px no-repeat, linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) right bottom / 1px 4px no-repeat;
  animation: o55n-nx-lock 2400ms steps(1, end) infinite;
}
@keyframes o55n-nx-lock { 0%, 31% { opacity: 1; } 32%, 100% { opacity: 0; } }
/* blocked keeps the wrapper's hard double blink (ab-alert, already steps(1)); failed glitches once as it arrives
   (the mark remounts on a change) instead of stuttering for ever; */
html[data-o55-nier="on"] .nx-st-failed { animation: o55n-nx-glitch 320ms steps(4, end) 1; }
@keyframes o55n-nx-glitch { 0% { transform: translateX(0); opacity: 1; } 25% { transform: translateX(2px); opacity: .4; } 50% { transform: translateX(-2px); opacity: 1; } 75% { transform: translateX(1px); opacity: .6; } 100% { transform: none; opacity: 1; } }
/* working is PMConcept7's diamond loader while the diamonds part is on (a hollow diamond turning in depth, its ink
   flipping to paper on a cursor bar), turned in six held steps of 60 degrees so it is never seen edge-on in a list,
   one step every 467 ms (2.8 s a turn); in the thread list one step every 1.4 s (8.4 s a turn; integrate, 2026-10-02:
   at 2.8 s it out-moved needs-you 3-4x in a list; fix cycle 1 keeps the slow turn to the list);
   otherwise it is the ink bead on the ring, going round in steps (--nx-le above). */
html[data-o55-nier-parts~="diamonds"] .nx-st-working > svg.nx { visibility: hidden; }
html[data-o55-nier-parts~="diamonds"] .nx-st-working::after {
  content: ""; position: absolute; inset: 18%; box-sizing: border-box; pointer-events: none;
  border: 1.5px solid var(--nx-ink, var(--o55-nier-ink)); outline: 1px solid var(--nx-ink, var(--o55-nier-ink)); outline-offset: -4.5px;
  transform: rotateY(0deg) rotate(45deg) scale(.82);
  animation: o55n-nx-diamond 2.8s steps(6, end) infinite;
}
html[data-o55-nier-parts~="diamonds"] .ph-status .nx-st-working::after { animation-duration: 8.4s; }
@keyframes o55n-nx-diamond { from { transform: rotateY(0deg) rotate(45deg) scale(.82); } to { transform: rotateY(360deg) rotate(45deg) scale(.82); } }
/* idle and pending are squares while the square part is on (final review, 2026-10-03): PMConcept7's NieR lists draw
   an idle or draft row as a hollow square (its square part squares every round mark), and the idle ring was the one
   round mark left in the NieR set. Idle is a hollow square the idle ring's size (its outer edge, 10.8 of 24 units) in
   the idle ink; pending a dashed square the pending ring's size in its muted ink; both turn to paper at their own
   alpha on a cursor bar, like the rings they replace. Drawn by the wrapper's ::after (the svg hides), like the diamond,
   static. The needs-you ink block already matches PMConcept7's filled square. */
html[data-o55-nier-parts~="square"] .nx-st-idle > svg.nx, html[data-o55-nier-parts~="square"] .nx-st-pending > svg.nx { visibility: hidden; }
html[data-o55-nier-parts~="square"] .nx-st-idle::after, html[data-o55-nier-parts~="square"] .nx-st-pending::after {
  content: ""; position: absolute; inset: 27.5%; box-sizing: border-box; pointer-events: none;
  border: 1.2px solid rgba(var(--o55-nier-ink-rgb), var(--nx-idle-a, .45));
}
html[data-o55-nier-parts~="square"] .nx-st-pending::after { inset: 15%; border-style: dashed; border-color: var(--muted); }
html[data-o55-nier-parts~="cursor"][data-o55-nier-parts~="square"] .thread-row:hover .nx-st-idle::after,
html[data-o55-nier-parts~="cursor"][data-o55-nier-parts~="square"] .thread-row.active .nx-st-idle::after { border-color: rgba(var(--o55-nier-on-ink-rgb), var(--nx-idle-a, .45)); }
html[data-o55-nier-parts~="cursor"][data-o55-nier-parts~="square"] .thread-row:hover .nx-st-pending::after,
html[data-o55-nier-parts~="cursor"][data-o55-nier-parts~="square"] .thread-row.active .nx-st-pending::after { border-color: var(--o55-nier-on-ink); }
/* The bar: ink glyphs with stepped acts (the tokens above); a working domain carries an ink underline under its
   glyph, drawn by the item's anchored ::after (the backlight's slot, unused in NieR). */
html[data-o55-nier="on"][data-ab-goal="working"] .activity-item[data-hover-domain="goal"]::after,
html[data-o55-nier="on"][data-ab-todo="working"] .activity-item[data-hover-domain="todo"]::after,
html[data-o55-nier="on"][data-ab-subagents="working"] .activity-item[data-hover-domain="subagents"]::after,
html[data-o55-nier="on"][data-ab-crew="working"] .activity-item[data-hover-domain="crew"]::after,
html[data-o55-nier="on"][data-ab-brainstorm="working"] .activity-item[data-hover-domain="brainstorm"]::after,
html[data-o55-nier="on"][data-ab-review="working"] .activity-item[data-hover-domain="review"]::after,
html[data-o55-nier="on"][data-ab-chat_room="working"] .activity-item[data-hover-domain="chat_room"]::after,
html[data-o55-nier="on"][data-ab-changes="working"] .activity-item[data-hover-domain="changes"]::after,
html[data-o55-nier="on"][data-ab-artifacts="working"] .activity-item[data-hover-domain="artifacts"]::after {
  display: block; top: anchor(bottom); width: 12px; height: 2px; translate: -50% 3px; border-radius: 0; z-index: 0;
  background: var(--o55-nier-ink); opacity: 1;
}
/* Reduced motion (the media query, html[data-motion], body.pm56-reduced): every NieR act and loop stops; the inverted
   needs-you block, the diamond and the underline still carry the state. */
@media (prefers-reduced-motion: reduce) {
  html[data-o55-nier="on"] svg.nx .nx-c, html[data-o55-nier="on"] .nx-st::after { animation: none !important; }
}
html[data-o55-nier="on"] body.pm56-reduced svg.nx .nx-c, html[data-o55-nier="on"] body.pm56-reduced .nx-st::after { animation: none !important; }
html[data-o55-nier="on"][data-motion="reduced"] svg.nx, html[data-o55-nier="on"][data-motion="reduced"] svg.nx .nx-p,
html[data-o55-nier="on"][data-motion="reduced"] svg.nx .nx-c, html[data-o55-nier="on"][data-motion="reduced"] .nx-st,
html[data-o55-nier="on"][data-motion="reduced"] .nx-st::after { animation: none !important; transition: none !important; }

/* ------------------------------------------------------------------ 12. app.js surfaces (step 3A) */
/* OWNER of this section: Neon icons, surface step 3A (2026-10-02); the rest of the file is the foundation's and
   NieR's. styles.css is closed and app.js has no sheet of its own, so the containers app.js draws round a glyph are
   restated here at the specificity styles.css (or composer.css) gave them: this sheet loads after both.
   Colour is reserved for status (plan §4): a container is neutral and its glyph is lit in the host ink. Coloured ink
   comes only from .event-card.danger/.warning, [data-tone], a status mark's own tone (--nx-ink, section 5) and the
   owners' .is-danger rules (higher specificity, untouched). */
.event-icon { background: var(--surface-3); color: var(--text); }
/* (0,1,0) on purpose: the transcript's own family rules (the Needs-you medallion's canon accent, the neutral ledger)
   stay above it */
:where(.event-card.warning) > .event-icon { color: var(--warning); }
:where(.event-card.danger) > .event-icon { color: var(--danger); }
/* a menu row's glyph takes the row's ink: muted at rest, the text ink on hover, where it ignites (section 8) */
.menu-item .menu-icon { color: inherit; }
/* a toggled icon button reads as on by its lit glyph on the raised neutral tile (the pins' idiom, composer.css), not
   by an accent tile, and never by the hover tile (--surface-3) */
.icon-button.active { color: var(--text); border-color: var(--border-strong); background: var(--surface-4); }
.icon-button.active > svg.nx { --nx-hiv: visible; --nx-hi-a: var(--nx-h-concept-i); }
/* Activity lines name their tone (data-tone), never an inline colour. */
.activity-line [data-tone="blocked"] { color: var(--danger); }
.activity-line [data-tone="attention"] { color: var(--warning); }
.activity-line [data-tone="working"] { color: var(--accent); }
.activity-line [data-tone="changed"] { color: var(--accent-2); }
.activity-line [data-tone="done"] { color: var(--positive); }
.activity-line [data-tone="idle"] { color: var(--subtle); }
.activity-line [data-tone="paused"] { color: var(--muted); }
/* Capability dots (the composer): a neutral tile; a dot is drawn only while its capability is on, so its glyph is
   concept-lit (the text ink with its bloom) and plays its act when hovered. Back Seat Driver On (the open eye) is
   lit; Auto (the lowered lid) is dim: bsd.css's muted ink and no bloom. */
.capability-dot, .capability-dot.goal { color: var(--text); background: var(--surface-3); }
.composer-infield .capability-dot, .composer-infield .capability-dot.goal { color: var(--text); background: var(--surface-3); border-color: var(--border); }
.composer-infield .capability-dot.bsd > svg.nx[data-nx="eye"] { color: var(--text); }
.capability-dot.bsd > svg.nx[data-nx="kind-bsd-auto"] { --nx-hi-a: 0; }
.capability-dot:hover > svg.nx { --nx-hi-a: var(--nx-h-swell-i); --nx-1: var(--nx-d1) var(--nx-ease) backwards; }
/* The working card's head: while the run runs, the step's glyph is a live status mark (working tone and bloom) that
   breathes like the bar's working domain. It is keyed by step (wpi:<step.id>), so it remounts at every handover and
   plays the step glyph's act once. The tile is neutral; a paused or finished run shows the glyph at rest. */
.working-head .work-phase-icon { background: var(--surface-3); color: var(--muted); box-shadow: none; }
.working-head .work-phase-icon > svg.nx-r-status { --nx-1: var(--nx-d1) var(--nx-ease) backwards; animation: ab-breathe 2200ms ease-in-out infinite; }
html[data-o55-nier="on"] .working-head .work-phase-icon > svg.nx-r-status { animation-timing-function: steps(3, end); }
/* The chat header's status: the thread's live mark beside the word, and the word in the mark's tone (app.js
   headerStatusTone; styles.css gave every word the warning amber, so Ready, Paused and Complete read lit beside their
   quiet marks and Waiting matched Working: final review, 2026-10-03). The quiet tones read muted. */
.chat-state > .nx-st { margin-right: 1px; }
.chat-state[data-tone="blocked"] { color: var(--danger); }
.chat-state[data-tone="attention"] { color: var(--warning); }
.chat-state[data-tone="working"] { color: var(--accent); }
.chat-state[data-tone="changed"] { color: var(--accent-2); }
.chat-state[data-tone="done"] { color: var(--positive); }
.chat-state[data-tone="idle"], .chat-state[data-tone="paused"] { color: var(--muted); }
/* the decision panel is needs-you: its head glyph keeps the canon accent (ACD-469) on the neutral tile */
.decision-top > .event-icon { color: var(--accent); }

/* ------------------------------------------------------------------ 13. 3D surfaces (step 3D) */
/* OWNER of this section: Neon icons, surface step 3D (2026-10-02). The 3D surfaces keep their rules in their owner
   sheets (composer.css, composer-state.css, lens.css, turn-stage.css, transcript.css, history.css) and the Fast
   bolt's strike is block 8b; only the NieR restatement of an owner sheet's rhythm lives here, under the contract. */
/* the Context Lens trigger's breathe (Mute, Focus) is stepped like every NieR rhythm */
html[data-o55-nier="on"] .pm-lens-trigger.is-on svg.nx { animation-timing-function: steps(3, end); }

/* ------------------------------------------------------------------ 14. still status marks (step 3E) */
/* OWNER of this section: Neon icons, surface step 3E (2026-10-02). A status mark whose wrapper carries nx-still is
   lit and STILL: no list rhythm (the bead's orbit, the needs-you hop, the tip, the ratchet), no breathing backlight,
   no blocked blink or failed stutter; its moving part plays the mark's one-shot act once as it mounts (the bead comes
   round, the "?" hops in, the shackle drops, the check draws), and a status change remounts it (data-k="st:<s>").
   module-shell.js pmxStatus() asks for it: every pmx host allows no loop of its own (pmx-verify loop-census; a live
   card's two are the pmx-sheen loops). Ink, halo, weight and the static backlight still carry the state. The
   body-qualified ::before rule outranks the light themes' backlight-breathe name (section 9). */
.nx-st.nx-still { animation: none; }
body .nx-st.nx-still::before { animation: none; }
.nx-st.nx-still .nx-p { animation: var(--k1) var(--nx-d1) var(--nx-ease) backwards; animation-delay: calc(var(--ad, 0) * 1ms); }
/* NieR: the working diamond holds its pose (no turn), like the pmx running mark of N-A */
html[data-o55-nier-parts~="diamonds"] .nx-st-working.nx-still::after { animation: none; }
/* NieR: a still needs-you mark keeps its ink block; the corner brackets stay let go (opacity 0) */
html[data-o55-nier="on"] .nx-st-waiting.nx-still::after { animation: none; }

/* ==== glyph-system/opus-5.5/src/catalog/10-catalog.css ==== */
/* 10-catalog.css: the catalog's own chrome. Quiet on purpose: the glyphs are the subject. PM7 tokens only.
 * No pills (no capsule shapes anywhere: selections are an underline and ink), no side-stripe boxes, no emoji. */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--background);
  color: var(--text-primary);
  font: 14px/1.5 var(--body-font, Inter, system-ui, sans-serif);
  -webkit-font-smoothing: antialiased;
}
html[data-theme^="retro"] body { font-family: var(--mono-font, "IBM Plex Mono", ui-monospace, monospace); }
/* Glass sits on a wallpaper: a stand-in of soft colour fields under the frosted panels (the GPU film uses PM7's own) */
html[data-theme^="glass"]:not([data-o55-nier]) body {
  background:
    radial-gradient(60% 50% at 12% 8%, rgb(var(--accent-primary-rgb) / .30), transparent 70%),
    radial-gradient(50% 45% at 88% 14%, rgb(178 140 255 / .22), transparent 70%),
    radial-gradient(70% 60% at 60% 100%, rgb(104 242 189 / .14), transparent 70%),
    var(--background);
  background-attachment: fixed;
}
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
html[data-theme^="retro"] :is(h1, h2, h3, h4) { letter-spacing: 0; text-transform: uppercase; font-weight: 600; }
p { margin: 0; }
code, .pmg-mono { font-family: var(--mono-font, "IBM Plex Mono", ui-monospace, monospace); font-size: .92em; }

/* ---------------------------------------------------------------- frame */
.pmg-app { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }
.pmg-top {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 28px;
  padding: 14px 28px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
html[data-theme^="glass"]:not([data-o55-nier]) .pmg-top { backdrop-filter: blur(22px) saturate(1.3); }
.pmg-brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.pmg-brand-mark { display: grid; place-items: center; width: 34px; height: 34px; color: var(--pmg-ink-working); }
.pmg-brand h1 { font-size: 17px; }
.pmg-brand p { color: var(--text-secondary); font-size: 12.5px; }
.pmg-model { color: var(--text-muted); margin-left: 6px; }

.pmg-controls { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; }
.pmg-ctl { display: flex; align-items: center; gap: 2px; }
.pmg-ctl-label { color: var(--text-muted); font-size: 11.5px; margin-right: 6px; text-transform: uppercase; letter-spacing: .08em; }
.pmg-ctl button {
  appearance: none; border: 0; background: none; cursor: pointer;
  padding: 6px 8px 5px; color: var(--text-secondary); font-size: 13px;
  border-bottom: 2px solid transparent;
  transition: color 160ms, border-color 160ms;
}
.pmg-ctl button:hover { color: var(--text-primary); }
.pmg-ctl button[aria-checked="true"] { color: var(--text-primary); border-bottom-color: var(--pmg-ink-working); }
.pmg-ctl button:focus-visible, .pmg-tile:focus-visible, .pmg-nav a:focus-visible { outline: 2px solid var(--pmg-ink-working); outline-offset: 2px; }

.pmg-body { display: grid; grid-template-columns: 228px minmax(0, 1fr); }
.pmg-nav { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 64px); overflow: auto; padding: 22px 10px 40px 22px; }
.pmg-nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.pmg-nav a {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-md, 6px);
  color: var(--text-secondary); text-decoration: none; font-size: 13px;
}
.pmg-nav a:hover { background: var(--surface); color: var(--text-primary); }
.pmg-nav a[aria-current="true"] { color: var(--text-primary); background: var(--surface-elevated); }
.pmg-nav a .pmg-count { margin-left: auto; color: var(--text-muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.pmg-nav a svg { flex: none; }

.pmg-main { padding: 26px 34px 120px 18px; display: grid; gap: 56px; min-width: 0; outline: none; }
.pmg-sec { display: grid; gap: 18px; scroll-margin-top: 80px; }
.pmg-sec-head { display: grid; gap: 6px; max-width: 880px; }
.pmg-sec-head h2 { font-size: 21px; display: flex; align-items: center; gap: 12px; }
.pmg-sec-head p { color: var(--text-secondary); font-size: 13.5px; }
.pmg-kicker { color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; }

/* ---------------------------------------------------------------- panels */
.pmg-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl, 10px);
}
html[data-theme^="glass"]:not([data-o55-nier]) .pmg-panel { backdrop-filter: blur(18px) saturate(1.25); }
html[data-theme^="retro"] .pmg-panel { border-radius: 0; }
html[data-theme^="friendly"] .pmg-panel { border-radius: 16px; box-shadow: var(--shadow); }

/* ---------------------------------------------------------------- status table */
.pmg-status { display: grid; }
.pmg-st-row {
  display: grid; align-items: center; gap: 18px;
  grid-template-columns: 210px 196px minmax(220px, 1fr) minmax(220px, 1.2fr) 92px;
  padding: 14px 20px; border-top: 1px solid var(--border-light, var(--border));
}
.pmg-st-row:first-child { border-top: 0; }
.pmg-st-row.pmg-st-head { color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; padding-block: 10px; }
.pmg-st-name { display: flex; align-items: center; gap: 12px; font-weight: 600; }
.pmg-st-name small { display: block; color: var(--text-muted); font-weight: 400; font-size: 12px; }
.pmg-sizes { display: flex; align-items: flex-end; gap: 14px; }
.pmg-sizes > span { display: grid; justify-items: center; gap: 4px; color: var(--text-muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.pmg-st-row .pmg-meaning { color: var(--text-secondary); font-size: 13px; }
.pmg-aliases { color: var(--text-muted); font-size: 12px; }
.pmg-aliases b { color: var(--text-secondary); font-weight: 500; }
.pmg-contrast { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--text-secondary); text-align: right; }
.pmg-contrast.pmg-low { color: var(--pmg-ink-blocked); }

/* the in-context row: a list line like PM7's thread and agent rows */
.pmg-line { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-md, 6px); background: var(--surface-elevated); font-size: 13px; }
html[data-theme^="retro"] .pmg-line { border-radius: 0; }
.pmg-line .pmg-line-sub { margin-left: auto; color: var(--text-muted); font-size: 12px; }

/* ---------------------------------------------------------------- glyph grid */
.pmg-family { display: grid; gap: 12px; }
.pmg-family-head { display: flex; align-items: baseline; gap: 12px; }
.pmg-family-head h3 { font-size: 15px; }
.pmg-family-head p { color: var(--text-muted); font-size: 12.5px; }
.pmg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 10px; }
.pmg-tile {
  position: relative; display: grid; grid-template-rows: 92px auto auto; gap: 8px;
  padding: 14px 14px 13px; text-align: left; cursor: pointer;
  appearance: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl, 10px);
  color: var(--text-secondary);
  transition: border-color 180ms, background 180ms, transform 220ms var(--nx-ease);
}
html[data-theme^="glass"]:not([data-o55-nier]) .pmg-tile { backdrop-filter: blur(14px) saturate(1.2); }
html[data-theme^="retro"] .pmg-tile { border-radius: 0; }
html[data-theme^="friendly"] .pmg-tile { border-radius: 16px; }
.pmg-tile:hover { border-color: var(--text-muted); background: var(--surface-elevated); }
html:not([data-motion="reduced"]) .pmg-tile:hover { transform: translateY(-2px); }
.pmg-tile-stage { display: grid; place-items: center; color: var(--pmg-ink-concept); }
.pmg-tile[data-role="status"] .pmg-tile-stage { color: inherit; }
.pmg-tile-name { font: 600 12.5px/1.3 var(--mono-font, ui-monospace, monospace); color: var(--text-primary); overflow-wrap: anywhere; }
.pmg-tile-meta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-muted); }
.pmg-tile-meta .pmg-small { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--pmg-ink-concept); }
/* origin: plain ink words, never a chip */
.pmg-origin-new { color: var(--pmg-ink-changed); }

/* the live stage: loops run here (the neon CSS keeps every loop off unless a host asks for it) */
.pmg-live svg.nx .nx-p { animation: var(--kl) 2600ms var(--nx-le) infinite; animation-delay: calc(var(--ad, 0) * 2.6ms - 2600ms); }
/* a tile that is hovered or focused plays the glyph's one-shot instead (the neon "ignite") */
.pmg-tile:is(:hover, :focus-visible) .pmg-tile-stage svg.nx { --nx-1: var(--nx-d1) var(--nx-ease) backwards; --nx-hi-a: var(--nx-h-hover-i); --nx-hiv: visible; }

/* ---------------------------------------------------------------- the ten-look matrix */
.pmg-matrix { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pmg-matrix figure { margin: 0; display: grid; gap: 6px; }
.pmg-matrix figcaption { color: var(--text-muted); font-size: 12px; display: flex; gap: 8px; }
.pmg-matrix iframe { width: 100%; height: 520px; border: 1px solid var(--border); border-radius: var(--radius-lg, 8px); background: var(--background); }
html[data-pmg-frame] .pmg-top, html[data-pmg-frame] .pmg-nav { display: none; }
html[data-pmg-frame] .pmg-body { grid-template-columns: 1fr; }
html[data-pmg-frame] .pmg-main { padding: 14px 16px 30px; gap: 26px; }

/* ---------------------------------------------------------------- decision cards */
.pmg-cards { display: grid; gap: 14px; }
.pmg-card { padding: 20px 22px; display: grid; gap: 14px; }
.pmg-card-head { display: flex; align-items: baseline; gap: 12px; }
.pmg-card-id { font: 600 12px var(--mono-font, ui-monospace, monospace); color: var(--text-muted); }
.pmg-card h3 { font-size: 15.5px; }
.pmg-card > p { color: var(--text-secondary); font-size: 13.5px; max-width: 900px; }
.pmg-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.pmg-option { padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-lg, 8px); display: grid; gap: 10px; background: var(--surface-elevated); }
html[data-theme^="retro"] .pmg-option { border-radius: 0; }
.pmg-option.pmg-rec { border-color: var(--pmg-ink-working); }
.pmg-option-head { display: flex; align-items: baseline; gap: 10px; font-weight: 600; font-size: 13.5px; }
.pmg-option-head .pmg-rec-word { margin-left: auto; color: var(--pmg-ink-working); font-weight: 500; font-size: 12px; }
.pmg-option p { color: var(--text-secondary); font-size: 12.5px; }
.pmg-option-demo { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; }
.pmg-option-demo > span { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-secondary); }

/* ---------------------------------------------------------------- ink table */
.pmg-inks { overflow-x: auto; }
.pmg-inks table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.pmg-inks th, .pmg-inks td { padding: 9px 12px; text-align: left; border-top: 1px solid var(--border-light, var(--border)); white-space: nowrap; }
.pmg-inks th { color: var(--text-muted); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; border-top: 0; }
.pmg-inks td .pmg-sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
.pmg-inks td.pmg-moved { color: var(--text-primary); }
.pmg-inks td small { color: var(--text-muted); margin-left: 4px; }
.pmg-inks tr.pmg-here td { background: var(--surface-elevated); }

/* ---------------------------------------------------------------- detail sheet */
.pmg-detail {
  position: fixed; inset: 0 0 0 auto; width: min(560px, 100vw); z-index: 20; overflow: auto;
  background: var(--surface-elevated); border-left: 1px solid var(--border); box-shadow: var(--elev-3, 0 6px 20px rgba(0,0,0,.3));
  padding: 26px 28px 60px; display: grid; align-content: start; gap: 22px;
}
html[data-theme^="glass"]:not([data-o55-nier]) .pmg-detail { backdrop-filter: blur(26px) saturate(1.3); }
.pmg-detail[hidden] { display: none; }
html:not([data-motion="reduced"]) .pmg-detail:not([hidden]) { animation: pmg-sheet-in 280ms var(--nx-ease) both; }
@keyframes pmg-sheet-in { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
.pmg-detail-head { display: flex; align-items: center; gap: 18px; }
.pmg-detail-head .pmg-hero { color: var(--pmg-ink-concept); display: grid; place-items: center; width: 84px; height: 84px; border: 1px solid var(--border); border-radius: var(--radius-xl, 10px); background: var(--surface); }
.pmg-detail-head h3 { font: 600 17px var(--mono-font, ui-monospace, monospace); }
.pmg-detail-head p { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }
.pmg-close { margin-left: auto; align-self: start; appearance: none; border: 0; background: none; cursor: pointer; color: var(--text-secondary); padding: 6px; border-radius: 6px; }
.pmg-close:hover { color: var(--text-primary); background: var(--surface); }
.pmg-dl { display: grid; grid-template-columns: 120px 1fr; gap: 8px 14px; font-size: 13px; }
.pmg-dl dt { color: var(--text-muted); }
.pmg-dl dd { margin: 0; color: var(--text-secondary); }
.pmg-contexts { display: grid; gap: 12px; }
.pmg-contexts h4 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 500; }
.pmg-ctx-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
/* context hosts that mimic PM7's: an icon button, a rail item, a tab, a menu row */
.pmg-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-md, 6px); border: 0; background: none; color: var(--text-secondary); cursor: pointer; }
.pmg-btn:hover { background: var(--surface); color: var(--text-primary); }
.pmg-rail { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; color: var(--text-secondary); background: var(--surface); cursor: pointer; border: 0; }
.pmg-tab { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border: 1px solid var(--border); border-bottom-color: transparent; border-radius: 7px 7px 0 0; background: var(--surface); color: var(--text-primary); font-size: 12.5px; cursor: pointer; }
html[data-theme^="retro"] :is(.pmg-tab, .pmg-rail, .pmg-btn) { border-radius: 0; }
.pmg-menu-row { display: flex; align-items: center; gap: 10px; width: 220px; padding: 7px 10px; border-radius: 6px; background: var(--surface); color: var(--text-primary); font-size: 13px; border: 0; cursor: pointer; text-align: left; }
.pmg-menu-row:hover { background: var(--surface-alt, var(--surface)); }

/* ---------------------------------------------------------------- notes */
.pmg-note { color: var(--text-muted); font-size: 12.5px; max-width: 900px; }
.pmg-empty { color: var(--text-muted); font-size: 13px; padding: 18px 20px; }

@media (max-width: 980px) {
  .pmg-body { grid-template-columns: 1fr; }
  .pmg-nav { display: none; }
  .pmg-main { padding: 20px 16px 80px; }
  .pmg-st-row { grid-template-columns: 1fr 1fr; }
  .pmg-matrix { grid-template-columns: 1fr; }
}
html[data-motion="reduced"] *, html[data-motion="reduced"] *::before, html[data-motion="reduced"] *::after { transition-duration: 0ms !important; }

</style>
</head>
<body>
<div class="pmg-app" data-concept-model="Opus 5.5">
  <header class="pmg-top">
    <div class="pmg-brand">
      <span class="pmg-brand-mark" aria-hidden="true"></span>
      <div class="pmg-brand-text">
        <h1>Puppet Master glyphs</h1>
        <p>The 5.6 Pro chat's neon set, made the default for every surface. <span class="pmg-model">Opus 5.5</span></p>
      </div>
    </div>
    <nav class="pmg-controls" aria-label="View">
      <div class="pmg-ctl" role="radiogroup" aria-label="Look" data-ctl="family">
        <span class="pmg-ctl-label">Look</span>
        <button role="radio" data-v="basic">Basic</button><button role="radio" data-v="friendly">Friendly</button><button role="radio" data-v="glass">Glass</button><button role="radio" data-v="retro">Retro</button><button role="radio" data-v="nier">NieR</button>
      </div>
      <div class="pmg-ctl" role="radiogroup" aria-label="Mode" data-ctl="mode">
        <span class="pmg-ctl-label">Mode</span>
        <button role="radio" data-v="light">Light</button><button role="radio" data-v="dark">Dark</button>
      </div>
      <div class="pmg-ctl" role="radiogroup" aria-label="Motion" data-ctl="motion">
        <span class="pmg-ctl-label">Motion</span>
        <button role="radio" data-v="full">Full</button><button role="radio" data-v="reduced">Reduced</button>
      </div>
      <div class="pmg-ctl" role="radiogroup" aria-label="Layout" data-ctl="layout">
        <span class="pmg-ctl-label">Show</span>
        <button role="radio" data-v="one">This look</button><button role="radio" data-v="all">All ten looks</button>
      </div>
    </nav>
  </header>
  <div class="pmg-body">
    <aside class="pmg-nav" aria-label="Sections"><ol id="pmgNav"></ol></aside>
    <main class="pmg-main" id="pmgMain" tabindex="-1"></main>
  </div>
</div>

    records[name] = {
      name: name, family: r.family || 'misc', meaning: r.meaning, role: role, act: act,
      replaces: r.replaces || [], aliases: r.aliases || [], surfaces: r.surfaces || [], note: r.note || '',
      redraw: r.redraw || '', moving: moving, source: 'pmg'
    };
    order.push(name);
    return true;
  }

  /* A mapping record for a glyph the chat already draws: which PM7 items it now stands for. */
  function map(name, r) {
    var c = N.alias(name);
    if (!N.has(c)) { problems.push('map ' + name + ': the 5.6 Pro set has no such glyph'); return false; }
    var rec = records[c];
    if (!rec) {
      rec = records[c] = { name: c, family: r.family || 'chat', meaning: r.meaning || '', role: '', act: '', replaces: [], aliases: [], surfaces: [], note: '', source: 'c56' };
      order.push(c);
    }
    (r.replaces || []).forEach(function (x) { if (rec.replaces.indexOf(x) < 0) rec.replaces.push(x); });
    (r.surfaces || []).forEach(function (x) { if (rec.surfaces.indexOf(x) < 0) rec.surfaces.push(x); });
    if (r.meaning && !rec.meaning) rec.meaning = r.meaning;
    return true;
  }

  window.PMG = {
    version: 1,
    ACTS: ACTS, ROLES: ROLES,
    def: def, map: map,
    icon: N.icon, status: N.status, has: N.has, alias: N.alias,
    records: function () { return order.map(function (k) { return records[k]; }); },
    record: function (k) { return records[N.alias(k)] || records[k] || null; },
    problems: problems
  };
})();

</script>
<script>
/* ==== glyph-system/opus-5.5/src/catalog/20-catalog.js ==== */
/* 20-catalog.js: renders the catalog from PM56_NEON (the chat set), PMG (the Puppet Master additions) and PMG_DATA.
 * Every glyph on the page is drawn by the real renderer, so what Jared reviews is what the surfaces will get. */
(function () {
  'use strict';
  var N = window.PM56_NEON, G = window.PMG, D = window.PMG_DATA || {};
  var html = document.documentElement, main = document.getElementById('pmgMain'), nav = document.getElementById('pmgNav');
  if (!N || !G) { main.innerHTML = '<p class="pmg-empty">The glyph renderer did not load: ' + (window.PM56_NEON_ERROR || window.PMG_ERROR || 'unknown') + '</p>'; return; }

  var LOOKS = ['basic', 'friendly', 'glass', 'retro', 'nier'];
  var LOOK_NAME = { basic: 'Basic', friendly: 'Friendly', glass: 'Glass', retro: 'Retro', nier: 'NieR' };
  var SIZES = [12, 14, 16, 20, 24];
  var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
  var frame = html.getAttribute('data-pmg-frame');

  /* ------------------------------------------------------------ view state */
  var q = new URLSearchParams(location.search), saved = {};
  try { saved = JSON.parse(localStorage.getItem('pmg.view') || '{}'); } catch (e) {}
  var lookQ = /^(basic|friendly|glass|retro|nier)-(light|dark)$/.exec(q.get('look') || '');
  var view = {
    family: lookQ ? lookQ[1] : (saved.family || 'basic'),
    mode: lookQ ? lookQ[2] : (saved.mode || 'dark'),
    motion: q.get('motion') || saved.motion || 'full',
    layout: frame ? 'one' : (saved.layout || 'one'),
    section: q.get('section') || saved.section || 'status'
  };
  function lookKey() { return view.family + '-' + view.mode; }
  function paint() {
    var theme = (view.family === 'nier' ? 'basic' : view.family) + '-' + view.mode;
    html.setAttribute('data-theme', theme);
    document.body.setAttribute('data-theme', theme);
    if (view.family === 'nier') { html.setAttribute('data-o55-nier', 'on'); html.setAttribute('data-o55-nier-parts', 'icons'); }
    else { html.removeAttribute('data-o55-nier'); html.removeAttribute('data-o55-nier-parts'); }
    if (view.motion === 'reduced') html.setAttribute('data-motion', 'reduced'); else html.removeAttribute('data-motion');
    document.querySelectorAll('.pmg-ctl').forEach(function (g) {
      var k = g.getAttribute('data-ctl');
      g.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-checked', String(b.getAttribute('data-v') === view[k])); });
    });
    if (!frame) try { localStorage.setItem('pmg.view', JSON.stringify(view)); } catch (e) {}
  }

  /* ------------------------------------------------------------ colour maths (the 3:1 gate, measured live) */
  function rgba(s) {
    var m = /rgba?\(([^)]+)\)/.exec(s || ''); if (!m) return null;
    var p = m[1].split(/[\s,/]+/).filter(Boolean).map(Number);
    return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
  }
  function over(c, b) { return [0, 1, 2].map(function (i) { return c[i] * c[3] + b[i] * (1 - c[3]); }).concat(1); }
  function lum(c) { return [0, 1, 2].map(function (i) { var x = c[i] / 255; return x <= .03928 ? x / 12.92 : Math.pow((x + .055) / 1.055, 2.4); }).reduce(function (a, x, i) { return a + x * [.2126, .7152, .0722][i]; }, 0); }
  function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
  /* the field behind an element: its ancestors' backgrounds composited over the page background */
  function field(el) {
    var stack = [];
    for (var n = el; n && n.nodeType === 1; n = n.parentElement) { var c = rgba(getComputedStyle(n).backgroundColor); if (c && c[3] > 0) stack.push(c); }
    var base = rgba(getComputedStyle(document.body).backgroundColor) || [0, 0, 0, 1];
    if (base[3] < 1) base = over(base, [255, 255, 255, 1]);
    for (var i = stack.length - 1; i >= 0; i--) base = over(stack[i], base);
    return base;
  }
  function inkOf(svg) { var t = svg.querySelector('.nx-c, .nx-f'); if (!t) return null; var cs = getComputedStyle(t); return rgba(t.classList.contains('nx-f') ? cs.fill : cs.stroke); }
  function contrastOf(svg) { var ink = inkOf(svg); if (!ink) return null; var f = field(svg); return ratio(over(ink, f), f); }

  /* ------------------------------------------------------------ data */
  var STATUS = N.STATUS;
  var EXTRA = (D.status && D.status.extra) || {};           /* PMG statuses beyond the chat's 13 (10-status.js data) */
  var SURF = (D.status && D.status.surfaces) || {};         /* status key -> the PM7 words that map to it, by surface */
  var STATUS_ORDER = ((D.status && D.status.order) || Object.keys(STATUS)).filter(function (k) { return STATUS[k] || EXTRA[k]; });
  var families = (D.families && D.families.list) || [];
  var records = G.records();
  var chat = N.list().filter(function (r) { return !r.status; });

  function famGlyphs(f) {
    if (f.from === 'chat') return chat.filter(function (r) { return (f.match ? new RegExp(f.match).test(r.name) : true) && !(f.exclude && new RegExp(f.exclude).test(r.name)) && !records.some(function (x) { return x.name === r.name && x.source === 'pmg'; }); }).map(function (r) { return { name: r.name, role: r.role, act: r.act, aliases: r.aliases, source: 'c56', rec: G.record(r.name) }; });
    return records.filter(function (r) { return r.family === f.id && r.source === 'pmg'; }).map(function (r) { return { name: r.name, role: r.role, act: r.act, aliases: r.aliases, source: 'pmg', rec: r }; });
  }

  var SECTIONS = [
    { id: 'status', title: 'Status vocabulary', icon: 'st-working', count: function () { return STATUS_ORDER.length; }, render: renderStatus },
    { id: 'decisions', title: 'Decisions for Jared', icon: 'question', count: function () { return ((D.decisions && D.decisions.cards) || []).length; }, render: renderDecisions },
    { id: 'inks', title: 'Glyph inks and contrast', icon: 'eye', count: function () { return 10; }, render: renderInks }
  ].concat(families.map(function (f) {
    return { id: 'fam-' + f.id, title: f.title, icon: f.icon || 'sparkles', fam: f, count: function () { return famGlyphs(f).length; }, render: function (el) { renderFamily(el, f); } };
  }));

  /* ------------------------------------------------------------ sections */
  function head(sec, kicker, intro) {
    return '<header class="pmg-sec-head"><span class="pmg-kicker">' + esc(kicker) + '</span><h2>' + N.icon(sec.icon, 22, 'nx-r-concept') + esc(sec.title) + '</h2>' + (intro ? '<p>' + intro + '</p>' : '') + '</header>';
  }

  function statusMark(k, size) {
    if (STATUS[k]) return N.status(k, size);
    var x = EXTRA[k]; if (!x) return '';
    return '<span class="nx-st nx-st-' + esc(k) + ' nx-tn-' + esc(x.tone) + '" data-k="st:' + esc(k) + '" aria-hidden="true">' + N.icon(x.glyph, size, 'nx-r-status nx-t-' + x.tone) + '</span>';
  }
  function renderStatus(el) {
    var sec = SECTIONS[0];
    var rows = STATUS_ORDER.map(function (k) {
      var S = STATUS[k] || EXTRA[k], words = SURF[k] || {}, isNew = !STATUS[k];
      var aliasHtml = Object.keys(words).map(function (s) { return '<b>' + esc(s) + '</b> ' + esc(words[s].join(', ')); }).join(' · ') || ('<b>chat</b> ' + esc((S.aliases || []).join(', ')));
      return '<div class="pmg-st-row" data-status="' + esc(k) + '">' +
        '<div class="pmg-st-name">' + statusMark(k, 20) + '<div>' + esc(S.label || k) + (isNew ? ' <span class="pmg-origin-new">new</span>' : '') + '<small>' + esc(S.glyph) + ' · tone ' + esc(S.tone) + '</small></div></div>' +
        '<div class="pmg-sizes">' + SIZES.map(function (z) { return '<span>' + statusMark(k, z) + z + '</span>'; }).join('') + '</div>' +
        '<div class="pmg-line pmg-live">' + statusMark(k, 15) + '<span>' + esc((S.example || 'Refactor the settings store')) + '</span><span class="pmg-line-sub">' + esc(S.label || k) + '</span></div>' +
        '<div><div class="pmg-meaning">' + esc(S.meaning || S.motion || '') + '</div><div class="pmg-aliases">' + aliasHtml + '</div></div>' +
        '<div class="pmg-contrast" data-measure>…</div></div>';
    }).join('');
    el.innerHTML = head(sec, 'One meaning per shape, everywhere',
      'Every state Puppet Master shows maps to one of these marks. A shape never means two states, and a state never wears two shapes. The marks move only as the chat set does (the bead orbits, the question mark hops), and Reduced Motion keeps the lit pose with no movement.') +
      '<div class="pmg-panel pmg-status"><div class="pmg-st-row pmg-st-head"><span>State</span><span>Real sizes</span><span>In a list row</span><span>Meaning and the words it replaces</span><span style="text-align:right">Contrast</span></div>' + rows + '</div>';
    requestAnimationFrame(function () {
      el.querySelectorAll('.pmg-st-row[data-status]').forEach(function (row) {
        var svg = row.querySelector('.pmg-line svg.nx'), out = row.querySelector('[data-measure]');
        var r = svg && contrastOf(svg);
        out.textContent = r ? r.toFixed(2) + ':1' : '–';
        if (r && r < 3) out.classList.add('pmg-low');
      });
    });
  }

  function renderDecisions(el) {
    var sec = SECTIONS[1], cards = (D.decisions && D.decisions.cards) || [];
    var demo = function (items) {
      return (items || []).map(function (d) {
        var g = d.status ? statusMark(d.status, 18) : N.icon(d.glyph, 18, d.tone ? 'nx-r-status nx-t-' + d.tone : 'nx-r-concept');
        return '<span>' + g + esc(d.label) + '</span>';
      }).join('');
    };
    el.innerHTML = head(sec, 'Open choices', 'Each card names the choice, shows every option in the current look, and gives a recommendation. Nothing here is adopted until Jared answers.') +
      '<div class="pmg-cards">' + (cards.length ? cards.map(function (c) {
        return '<article class="pmg-panel pmg-card" id="card-' + esc(c.id) + '"><div class="pmg-card-head"><span class="pmg-card-id">' + esc(c.id) + '</span><h3>' + esc(c.title) + '</h3></div><p>' + esc(c.question) + '</p>' +
          '<div class="pmg-options">' + c.options.map(function (o) {
            return '<div class="pmg-option' + (o.recommended ? ' pmg-rec' : '') + '"><div class="pmg-option-head">' + esc(o.key) + '. ' + esc(o.title) + (o.recommended ? '<span class="pmg-rec-word">Recommended</span>' : '') + '</div><div class="pmg-option-demo pmg-live">' + demo(o.demo) + '</div><p>' + esc(o.detail) + '</p></div>';
          }).join('') + '</div></article>';
      }).join('') : '<p class="pmg-empty">No open decisions yet.</p>') + '</div>';
  }

  function renderInks(el) {
    var sec = SECTIONS[2], rep = (D['ink-report'] && D['ink-report'].looks) || {};
    var tones = ['blocked', 'attention', 'working', 'changed', 'done', 'paused', 'idle'];
    var here = view.family === 'nier' ? 'nier-' + view.mode : lookKey();
    var rows = Object.keys(rep).map(function (look) {
      var r = rep[look];
      return '<tr' + (look === here ? ' class="pmg-here"' : '') + '><td>' + esc(look) + '</td>' + tones.map(function (t) {
        var x = r[t]; if (!x) return '<td>–</td>';
        return '<td' + (x.moved ? ' class="pmg-moved"' : '') + '><span class="pmg-sw" style="background:' + esc(x.ink) + '"></span>' + x.after.toFixed(2) + (x.moved ? '<small>was ' + x.before.toFixed(2) + '</small>' : '') + '</td>';
      }).join('') + '</tr>';
    }).join('');
    el.innerHTML = head(sec, 'The 3:1 gate', 'Glyphs take their own inks, fitted per look so every tone reads at least 3.1:1 on every field a glyph sits on, keeping the look\'s hue. A tone that already passed keeps PMConcept7\'s token exactly. Changed is the violet second accent in every look, so it never shares a colour with blocked or attention. NieR keeps its near-monochrome palette; its close pairs are told apart by shape.') +
      '<div class="pmg-panel pmg-inks"><table><thead><tr><th>Look</th>' + tones.map(function (t) { return '<th>' + t + '</th>'; }).join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="pmg-note">Measured by tools/tune_inks.py on PMConcept7\'s own look tokens (tools/extract_looks.py). Glass fields are composited over the look\'s background; the GPU film measures them over the real wallpaper.</p>';
  }

  function tile(g) {
    var small = [12, 16].map(function (z) { return N.icon(g.name, z, g.role === 'status' ? '' : 'nx-r-' + (g.role || 'concept')); }).join('');
    var meta = g.source === 'pmg' ? '<span class="pmg-origin-new">new</span>' : '<span>chat set</span>';
    return '<button class="pmg-tile" data-glyph="' + esc(g.name) + '" data-role="' + esc(g.role) + '"><span class="pmg-tile-stage">' + N.icon(g.name, 40, 'nx-r-' + (g.role === 'status' ? 'concept' : g.role || 'concept')) + '</span><span class="pmg-tile-name">' + esc(g.name) + '</span><span class="pmg-tile-meta">' + meta + (g.act && g.act !== 'none' ? '<span>' + esc(g.act) + '</span>' : '') + '<span class="pmg-small">' + small + '</span></span></button>';
  }
  function renderFamily(el, f) {
    var sec = SECTIONS.filter(function (s) { return s.fam === f; })[0], list = famGlyphs(f);
    el.innerHTML = head(sec, f.kicker || (f.from === 'chat' ? 'From the 5.6 Pro chat' : 'New in the neon language'), esc(f.intro || '')) +
      (list.length ? '<div class="pmg-grid">' + list.map(tile).join('') + '</div>' : '<p class="pmg-panel pmg-empty">' + esc(f.empty || 'Being drawn.') + '</p>');
  }

  /* ------------------------------------------------------------ detail sheet */
  var sheet = document.getElementById('pmgDetail');
  function openDetail(name) {
    var r = G.record(name) || {}, l = N.list().filter(function (x) { return x.name === N.alias(name); })[0] || {};
    var role = r.role || l.role || 'concept';
    var ctl = 'nx-r-' + (role === 'status' ? 'concept' : role);
    sheet.innerHTML = '<div class="pmg-detail-head"><span class="pmg-hero pmg-live">' + N.icon(name, 56, ctl) + '</span><div><h3>' + esc(name) + '</h3><p>' + esc(r.meaning || '') + '</p></div><button class="pmg-close" aria-label="Close">' + N.icon('close', 18, 'nx-r-control') + '</button></div>' +
      '<dl class="pmg-dl"><dt>Origin</dt><dd>' + (r.source === 'pmg' ? 'New, ' + esc(r.family) + ' family' : '5.6 Pro chat set') + '</dd><dt>Role</dt><dd>' + esc(role) + '</dd><dt>Act</dt><dd>' + esc(r.act || l.act || 'none') + '</dd>' +
      ((l.aliases && l.aliases.length) || (r.aliases && r.aliases.length) ? '<dt>Also drawn as</dt><dd>' + esc((r.aliases || []).concat(l.aliases || []).join(', ')) + '</dd>' : '') +
      (r.replaces && r.replaces.length ? '<dt>Replaces</dt><dd>' + esc(r.replaces.join('; ')) + '</dd>' : '') + (r.note ? '<dt>Note</dt><dd>' + esc(r.note) + '</dd>' : '') + '</dl>' +
      '<div class="pmg-contexts"><h4>Real sizes</h4><div class="pmg-sizes">' + SIZES.concat([32]).map(function (z) { return '<span>' + N.icon(name, z, ctl) + z + '</span>'; }).join('') + '</div>' +
      '<h4>In context (hover each)</h4><div class="pmg-ctx-row"><button class="pmg-btn" title="Icon button">' + N.icon(name, 16, 'nx-r-control') + '</button><button class="pmg-rail" title="Rail item">' + N.icon(name, 20, 'nx-r-concept') + '</button><button class="pmg-tab">' + N.icon(name, 14, 'nx-r-concept') + 'Tab title</button></div>' +
      '<div class="pmg-ctx-row"><button class="pmg-menu-row">' + N.icon(name, 15, 'nx-r-concept') + 'Menu item</button><span class="pmg-line pmg-live" style="min-width:260px">' + N.icon(name, 15, 'nx-r-concept') + '<span>List row</span><span class="pmg-line-sub">now</span></span></div>' +
      '<h4>Every tone</h4><div class="pmg-ctx-row pmg-live">' + ['blocked', 'attention', 'working', 'changed', 'done', 'idle', 'paused'].map(function (t) { return '<span title="' + t + '">' + N.icon(name, 20, 'nx-r-status nx-t-' + t) + '</span>'; }).join('') + '</div></div>';
    sheet.hidden = false;
    sheet.querySelector('.pmg-close').addEventListener('click', closeDetail);
    sheet.querySelector('.pmg-close').focus();
  }
  function closeDetail() { sheet.hidden = true; }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) closeDetail(); });

  /* ------------------------------------------------------------ layout */
  function renderNav() {
    nav.innerHTML = SECTIONS.map(function (s) { return '<li><a href="#' + s.id + '" data-sec="' + s.id + '"' + (s.id === view.section ? ' aria-current="true"' : '') + '>' + N.icon(s.icon, 15, 'nx-r-concept') + '<span>' + esc(s.title) + '</span><span class="pmg-count">' + s.count() + '</span></a></li>'; }).join('');
  }
  function renderMain() {
    if (view.layout === 'all' && !frame) {
      var sec = SECTIONS.filter(function (s) { return s.id === view.section; })[0] || SECTIONS[0];
      var src = location.pathname.split('/').pop() || '';
      var figs = [];
      LOOKS.forEach(function (f) { ['light', 'dark'].forEach(function (m) {
        figs.push('<figure><figcaption>' + N.icon('eye', 13, 'nx-r-concept') + LOOK_NAME[f] + ' ' + m + '</figcaption><iframe loading="lazy" title="' + LOOK_NAME[f] + ' ' + m + '" src="' + esc(src) + '?frame=1&section=' + esc(sec.id) + '&look=' + f + '-' + m + '&motion=' + view.motion + '"></iframe></figure>');
      }); });
      main.innerHTML = '<section class="pmg-sec">' + head(sec, 'All ten looks', 'The same section in every look and mode. Scroll inside each frame.') + '<div class="pmg-matrix">' + figs.join('') + '</div></section>';
      return;
    }
    var only = frame ? SECTIONS.filter(function (s) { return s.id === view.section; }) : SECTIONS;
    main.innerHTML = only.map(function (s) { return '<section class="pmg-sec" id="' + s.id + '"></section>'; }).join('');
    only.forEach(function (s) { s.render(document.getElementById(s.id)); });
  }

  document.querySelectorAll('.pmg-ctl button').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = b.parentElement.getAttribute('data-ctl'), v = b.getAttribute('data-v');
      if (view[k] === v) return;
      view[k] = v; paint();
      if (k === 'layout' || k === 'motion' || k === 'family' || k === 'mode') renderMain();
    });
  });
  nav.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-sec]'); if (!a) return;
    view.section = a.getAttribute('data-sec'); paint();
    nav.querySelectorAll('a').forEach(function (x) { x.setAttribute('aria-current', String(x === a)); });
    if (view.layout === 'all') { e.preventDefault(); renderMain(); }
  });
  main.addEventListener('click', function (e) { var t = e.target.closest('.pmg-tile'); if (t) openDetail(t.getAttribute('data-glyph')); });
  sheet.addEventListener('click', function () {});

  var brand = document.querySelector('.pmg-brand-mark');
  if (brand) brand.innerHTML = '<span class="nx-st nx-tn-working pmg-live">' + N.icon('sparkles', 26, 'nx-r-concept') + '</span>';
  /* Concept Hub bridge (pm-concept-ready / pm-concept-state): the Hub's theme and reduced motion drive the view. The
     catalog's own look frames (?frame=) ignore it: their look is fixed by the URL. */
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (frame || !m || m.source !== 'pm-concept-hub' || m.type !== 'pm-concept-state' || !m.state) return;
    var t = /^(basic|friendly|glass|retro)-(light|dark)$/.exec(m.state.theme || '');
    if (t) { view.family = t[1]; view.mode = t[2]; }
    if (typeof m.state.reducedMotion === 'boolean') view.motion = m.state.reducedMotion ? 'reduced' : 'full';
    paint(); renderMain();
  });
  if (!frame && window.parent !== window) window.parent.postMessage({ source: 'pm-concept', type: 'pm-concept-ready', version: 1, capabilities: { theme: true, reducedMotion: true, testWidth: false } }, '*');

  paint(); renderNav(); renderMain();
  if (!frame && location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  window.PMG_CATALOG = { view: view, render: function () { renderNav(); renderMain(); }, contrastOf: contrastOf };
  if (G.problems.length) console.warn('PMG problems:', G.problems);
})();

</script>
