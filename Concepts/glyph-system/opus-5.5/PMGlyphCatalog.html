  --accent-2: var(--pmg-ink-changed);
  --positive: var(--pmg-ink-done);
  --muted: var(--pmg-ink-paused);
  --subtle: var(--pmg-ink-idle);
  --nx-idle: var(--pmg-ink-idle);
  --text: var(--text-primary);
  /* the default ink of a concept glyph: PM7's secondary text, lit by its halo (dark) or its ink alone (light) */
  --pmg-ink-concept: var(--text-secondary);
}
/* NieR's tone inks are the NieR tables' (pm7-glyph-inks.css); the neon NieR section reads --o55-nier-ink-rgb. */

/* The weight ladder (pm7-glyphs-designer2, NEON-GRAMMAR.md section 2, measured at dpr 1; confirmed 2026-10-10): the
   source's 1.8 paints 0.9 px at 12 px, where a check almost vanishes. Keyed on the size the renderer writes, at zero
   specificity, so any context that sets its own --nx-stroke-base (the rail, complete's bold check) still wins. */
svg:where(.nx[width="10"], .nx[width="11"]) { --nx-stroke-base: 3; }
svg:where(.nx[width="12"], .nx[width="13"]) { --nx-stroke-base: 2.6; }
svg:where(.nx[width="14"], .nx[width="15"]) { --nx-stroke-base: 2.3; }
svg:where(.nx[width="16"], .nx[width="17"], .nx[width="18"]) { --nx-stroke-base: 2; }

/* The change marks (added, modified, deleted, renamed) are facts about a file, not alarms: their tone inks them, but
   they never take a status backlight (a deleted file must not glow like a blocked run). */
.nx-st:is(.nx-st-change-added, .nx-st-change-modified, .nx-st-change-deleted, .nx-st-change-renamed)::before { display: none; }

/* NieR Dark's quiet tones (neon-icons.css section 11 paints idle and paused as the ink at .45) read 2.70-2.98:1 on
   every NieR Dark field in PMConcept7 (measured by pm7-glyphs-designer2 on the terminal sheet, 2026-10-10); .55 reads
   3.29-3.72:1 and keeps the quiet order (idle and paused stay under every live tone). NieR Light keeps the chat's
   .545 and .63. Same specificity as the source rule, later in the cascade. Paused (info and off are paused too) takes .6:
   an info toast's card (rgb 71 69 59) read 2.99:1 at .55 and reads 3.2:1 at .6, still a step above idle. */
html[data-o55-nier="on"] body[data-theme="basic-dark"] { --nx-idle-a: .55; --nx-paused-a: .6; }

/* Toasts (rollout TOASTS): the dismiss is the close control at the secondary text ink and full strength. The base's ×
   sat at .72 of the muted ink and read 1.4-2.7:1 on the severity-tinted cards; hover still ignites it. */
:is(#rsStage, #rsStack, #rsPanel) .n-card .n-x { opacity: 1; }
:is(#rsStage, #rsStack, #rsPanel) .n-card .n-x > svg.nx { --nx-ink: var(--text-secondary); }
/* The empty stack's bell (the title bar's notification button with nothing in it): the button sits at .72, so the bell
   takes the primary ink (it read 1.9-3.6:1 in the muted ink, 2.9-4.6 in the secondary). Its hover is its own ignite. */
#rsStack .rs-empty-bell.nx { color: var(--text-primary); }

/* PMG.calm(key): a status mark that is lit and still from its first frame (no list rhythm, no mount act): Usage, where
   the room entrance owns all arrival motion (t3-usage-pm7, 2026-10-10). */
.nx-st.pmg-calm, .nx-st.pmg-calm::before, .nx-st.pmg-calm .nx-p { animation: none !important; }
/* PMG.flat(name): one path, no halo, no parts; it lights by ink alone on hover, as the light looks do. */
svg.pmg-flat { --nx-hiv: hidden; --nx-hi-a: 0; }

/* ==== chat-assistant-concepts/5.6 Pro/neon-icons.css ==== */
/* neon-icons.css — the neon lighting grammar for every svg.nx that neon-icons.js renders.
 * OWNER: Neon icons, step 2 Foundation (2026-10-02). Appended after composer.css (build.py), so it is the last
 * sheet; every generic rule here sits at specificity (0,0,1) (svg:where(...)) or (0,1,1) (svg:where(.nx) .part),
 * so ANY context rule (.primary-button > svg, the bar's html[data-ab-ready] .activity-item > svg, ...) overrides it
 * without !important. Only reduced motion uses !important.
 *
 * Forbidden here (plan §1, pmx-verify forbidden-props, portability to Slint): filter, color-mix(),
 * stroke-dashoffset, and "pmx" inside a keyframe name. The glow is a stroke halo (the tube's bloom) plus, on an HTML
 * host, a radial-gradient backlight at element opacity (the soft tail); draw-ons are clip reveals.
 * Selector rules (tests/shell-selfcheck.cjs): no rightmost bare :is()/:where() compound (the universal bucket),
 * so zero-specificity rules are written svg:where(.x); no :has() anywhere.
 *
 * THE API (custom properties on svg.nx, inherited by its parts; tokens on body)
 *   --nx-ink                tube + halo ink (tone classes set it; unset = the host's currentColor)
 *   --nx-stroke-base        context weight (was each context's stroke-width); --nx-tone-k the tone's factor
 *   --nx-hi-a / --nx-hiv    the core halo's stroke-opacity and (controls) visibility
 *   --nx-bl-ink / --nx-bl-a the backlight on an HTML host (.nx-st wrapper; the bar has its own): ink and opacity
 *   --nx-1                  a one-shot's timing (a hover state sets it); each part's own keyframes play once
 *   --nx-le                 the loop easing (the voice); a context that runs a loop targets the parts:
 *                           <ctx> .nx-p { animation: var(--kl) <period> var(--nx-le) infinite;
 *                                         animation-delay: calc(var(--ad, 0) * <stagger> * 1ms - <period>); }
 * Each moving part carries --k1 (its one-shot keyframes) and --kl (its loop keyframes), literal keyframes that
 * neon-icons.js generates from the part's pose (transform and opacity only, so they composite).
 * Nothing here sets an svg's own `animation` on hover (the Fast bolt's re-strike, 8b, plays on its parts and halo), so the
 * bar's and the status wrappers' rhythms (ab-breathe, ab-alert) are never touched by hover.
 * Colour: every ink is a theme token (--danger, --warning, --accent, --accent-2, --positive, --subtle, --muted) and
 * every halo or backlight strength is a body token (--nx-h-*, --nx-bl-*), so a theme layer (NieR Mode, next step,
 * on html[data-o55-nier="on"]) repaints the ink and drops the glow by restating tokens: no colour literal here.
 */

/* ------------------------------------------------------------------ 1. tokens */
/* Dark themes, fitted to tools/glow-metric.mjs (the bar) and by eye (G1). The core band (-i) is the tube's bloom,
   in screen px (non-scaling-stroke); the backlight (--nx-bl-*) is the soft tail, a radial gradient behind the
   glyph on its HTML host at element opacity, so it has no edge. Per tone, because the bar's old filter glow was not
   one strength (blocked 62 %, attention 58 %, working 60 %, changed 44 % at 4 px). */
body {
  --nx-hi-w: 3.6px;
  --nx-h-blocked-i: .24; --nx-h-attention-i: .20; --nx-h-working-i: .20; --nx-h-changed-i: .12;
  --nx-h-quiet-i: .10;
  /* concept "lit steady": a visible bloom on dark; hover ignite (controls, and concepts inside a host) */
  --nx-h-concept-i: .17; --nx-h-hover-i: .30; --nx-h-swell-i: .30;
  /* the Fast bolt's flash peak (8b): its halo rests at .32 of this, the attention strength */
  --nx-h-bolt-i: .62;
  --nx-bl-blocked: .086; --nx-bl-attention: .08; --nx-bl-working: .082; --nx-bl-changed: .042;
  /* voices (plan §1): one easing token per theme family; timing and order never change */
  --nx-ease: cubic-bezier(.2, .75, .25, 1);
  --nx-le: cubic-bezier(.45, 0, .25, 1);
  --nx-ease-c: cubic-bezier(.3, .6, .3, 1);
  --nx-d1: 440ms;
}
/* Light themes: a dark-on-light halo reads as a tinted sticker, so the core stays thin and faint, concept and
   hover icons carry "lit" by ink alone (G1), and the backlight is lower. Final review (2026-10-03): at .12/.095/.10/.05
   the backlights read as soft tinted discs 8.5-15 px out (CIE76 dE 25-40 % above main's filter glow on the bar: pink
   behind Todo and Subagents on Basic Light, tan behind the collab marks on Retro Light's cream). They are 15 % lower:
   the review's 30 % matched main's tint in that ring but took the plan's glow metric (tools/glow-metric.mjs, total
   within 25 % of main's bar glow) to 64-75 % of main on every light theme, because main's light glow is a wide
   drop-shadow and most of ours, past the thin core, is this backlight; at 15 % the metric holds (32/32 light rows,
   total 78-97 %, tail 94-115 %) and the ring tint drops by about a quarter of its excess. A smaller disc failed the
   metric's edge check. The list's needs-you swell, which no metric holds to main, peaks at .08 (from .11). */
body[data-theme$="-light"] {
  --nx-hi-w: 3.4px;
  --nx-h-blocked-i: .08; --nx-h-attention-i: .08; --nx-h-working-i: .08; --nx-h-changed-i: .07;
  --nx-h-quiet-i: .06;
  --nx-h-concept-i: 0; --nx-h-hover-i: 0; --nx-h-swell-i: 0;
  --nx-h-bolt-i: .2;
  --nx-bl-blocked: .102; --nx-bl-attention: .081; --nx-bl-working: .085; --nx-bl-changed: .043;
}
/* Idle (Ready) ink on paper (3E2, 2026-10-02): the theme's --subtle read under 3:1 on the thread rows (2.4-2.8), so
   each light theme's idle ink is precomputed (work/3E2/idlecalc.py): --subtle moved toward --muted in sRGB until it
   reads 3.08-3.13:1 on the row field, still under every live tone there (the lowest, friendly-light working, is
   3.22). It stays unlit (no halo, no backlight) and is not the paused or pending ink (--muted, about 4.1-4.9). Dark
   themes keep --subtle. Literal colours, no color-mix(). */
/* Fix cycle 1: the row's hover tint (--surface-3) is the darker field, so basic and retro take the ink that holds
   3.06-3.07:1 there (3.37 and 3.50 at rest, still under their live minimums 4.35 and 4.80). Friendly cannot: its
   working ink (the theme accent) is only 3.22 at rest, so a darker idle would read above working. Friendly keeps
   3.08 at rest on every row state (integrate, lead decision 2026-10-02: the hover-only darkening put idle above
   working on a hovered row, and salience order wins; idle under 3:1 on a hovered or selected row is accepted). Glass
   holds 3.35+ on its tint. Retro Light (PMConcept7's paper, item 16, 2026-10-07): its rows are boxes on the paper
   (#F5F0E8, hover #FAF7F2, selected #d9dfd0), where #7f7a71 reads 3.76 / 3.99 / 3.13:1, under its lowest live tone
   (danger, 4.39 at rest). */
body[data-theme="basic-light"] { --nx-idle: #86868f; }
body[data-theme="friendly-light"] { --nx-idle: #93838e; }
body[data-theme="glass-light"] { --nx-idle: #857d98; }
body[data-theme="retro-light"] { --nx-idle: #7f7a71; }
/* Friendly overshoots, Glass glides, Retro steps. */
body[data-theme^="friendly"] { --nx-ease: cubic-bezier(.34, 1.56, .64, 1); --nx-le: cubic-bezier(.34, 1.4, .64, 1); --nx-ease-c: cubic-bezier(.34, 1.3, .64, 1); }
body[data-theme^="glass"] { --nx-ease: cubic-bezier(.4, 0, .1, 1); --nx-le: cubic-bezier(.6, 0, .25, 1); --nx-ease-c: cubic-bezier(.4, 0, .1, 1); }
body[data-theme^="retro"] { --nx-ease: steps(4, end); --nx-le: steps(4, end); --nx-ease-c: steps(4, end); }
/* Inside the transcript the voice follows .transcript[data-voice], which PM56_DEMO can pin apart from the theme. */
:is(.transcript, .tx-feed)[data-voice="basic"] { --nx-ease: cubic-bezier(.2, .75, .25, 1); --nx-le: cubic-bezier(.45, 0, .25, 1); --nx-ease-c: cubic-bezier(.3, .6, .3, 1); }
:is(.transcript, .tx-feed)[data-voice="friendly"] { --nx-ease: cubic-bezier(.34, 1.56, .64, 1); --nx-le: cubic-bezier(.34, 1.4, .64, 1); --nx-ease-c: cubic-bezier(.34, 1.3, .64, 1); }
:is(.transcript, .tx-feed)[data-voice="glass"] { --nx-ease: cubic-bezier(.4, 0, .1, 1); --nx-le: cubic-bezier(.6, 0, .25, 1); --nx-ease-c: cubic-bezier(.4, 0, .1, 1); }
:is(.transcript, .tx-feed)[data-voice="retro"] { --nx-ease: steps(4, end); --nx-le: steps(4, end); --nx-ease-c: steps(4, end); }

/* ------------------------------------------------------------------ 2. the glyph */
/* Halos and part travel run past the 24-unit box; the ink is inherited by every tube and halo; the weight is a
   base times the tone factor, so a context (the bar: --ab-stroke) and a tone never fight over stroke-width. */
svg:where(.nx) {
  overflow: visible;
  stroke: var(--nx-ink, currentColor);
  stroke-width: calc(var(--nx-stroke-base, 1.8) * var(--nx-tone-k, 1));
}
/* Filled parts (stop, status satellites) paint the ink as fill and carry no tube stroke. */
svg:where(.nx) .nx-f { fill: var(--nx-ink, currentColor); stroke: none; }
/* The quieter half of a two-level drawing (working's ring under the bright bead that orbits on it). */
svg:where(.nx) .nx-dim { opacity: .65; }
/* module-shell's picker chevron (CHEVRON) keeps the 2-unit weight it was drawn with. */


/* ------------------------------------------------------------------ 3. halos */
/* The core band, one merged path. Strength is stroke-opacity on the halo path, never group opacity or color-mix().
   Never a hit target. */
svg:where(.nx) .nx-h {
  fill: none;
  stroke-width: var(--nx-hi-w, 3.6px);
  stroke-opacity: var(--nx-hi-a, 0);
  vector-effect: non-scaling-stroke;
  pointer-events: none;
}
/* Only a control's halo comes and goes (hover ignite): it alone carries the visibility switch, the 180 ms fade
   and the flicker slot, so the other halos (most of them) cost no transition or animation bookkeeping in a
   whole-document restyle. */
svg:where(.nx-r-control) .nx-h {
  visibility: var(--nx-hiv, hidden);
  transition: stroke-opacity 180ms ease-out, visibility 180ms;
  animation: var(--nx-fl);
}
/* Halo copies inside a moving part scale with the drawing instead (non-scaling-stroke would keep the part's
   transform off the compositor): the same screen width, converted with the root's --nx-u (24 / size). */
svg:where(.nx) .nx-p .nx-h { vector-effect: none; stroke-width: calc(var(--nx-hi-w, 3.6px) * var(--nx-u, var(--nx-u0, 1.6))); }

/* ------------------------------------------------------------------ 4. roles (plan §1 table) */
/* concept: the host's ink with a same-ink bloom, lit steady (on light themes the ink alone carries it). */
svg:where(.nx-r-concept) { --nx-hi-a: var(--nx-h-concept-i); }
/* control: unlit at rest (no halo painted); it ignites on hover / focus-visible (section 8). */
svg:where(.nx-r-control) { --nx-hiv: hidden; --nx-hi-a: 0; }
/* status: lit by its tone class (section 5) and its wrapper's backlight (section 9). */
svg:where(.nx-r-status) { --nx-hi-a: var(--nx-h-quiet-i); }
/* brand: provider marks keep their own drawing and get no neon light. */
svg:where(.nx-r-brand) { --nx-hiv: hidden; }
/* A concept glyph inside an interactive host (a header button, a menu row) is lit as a control at rest: unlit, it
   ignites on hover (section 8). Zero specificity, so the bar and other self-lit hosts keep their own rules. */
:where(button, summary, [role="button"], [data-action]):where(:not(.activity-item, .pm-lens-trigger, .jump-bottom, .af-chip-pending, .orbit-node, .wa-disc, .rail8-item)) > svg:where(.nx-r-concept:not(.nx-self)),
:where(button, summary, [role="button"], [data-action]):where(:not(.activity-item, .pm-lens-trigger, .jump-bottom, .af-chip-pending, .orbit-node, .wa-disc, .rail8-item)) > :where(:not(button, summary, [role="button"], [data-action])) > svg:where(.nx-r-concept:not(.nx-self)) {
  --nx-hi-a: 0;
}

/* ------------------------------------------------------------------ 5. tones (the bar's, verbatim) */
/* Ink goes through --nx-ink (never `color`), so the transcript accent budget turn-verify counts is unchanged.
   The weight factor is the bar's TONE_STROKE over 1.8. */
svg:where(.nx-t-blocked) { --nx-ink: var(--danger); --nx-tone-k: 1.22; --nx-hi-a: var(--nx-h-blocked-i); }
svg:where(.nx-t-attention) { --nx-ink: var(--warning); --nx-tone-k: 1.17; --nx-hi-a: var(--nx-h-attention-i); }
svg:where(.nx-t-working) { --nx-ink: var(--accent); --nx-tone-k: 1.17; --nx-hi-a: var(--nx-h-working-i); }
svg:where(.nx-t-changed) { --nx-ink: var(--accent-2); --nx-tone-k: 1; --nx-hi-a: var(--nx-h-changed-i); }
svg:where(.nx-t-done) { --nx-ink: var(--positive); --nx-tone-k: .83; --nx-hi-a: var(--nx-h-quiet-i); }
svg:where(.nx-t-idle) { --nx-ink: var(--nx-idle, var(--subtle)); --nx-tone-k: .78; --nx-hi-a: var(--nx-h-quiet-i); }
/* paused (and skipped): muted, no halo. */
svg:where(.nx-t-paused) { --nx-ink: var(--muted); --nx-tone-k: 1; --nx-hi-a: 0; }

/* ------------------------------------------------------------------ 6. parts and acts */
/* A moving part rotates about its pivot (--o, user units on the view box). At rest it carries no transform and no
   opacity of its own: the base style is the finished, lit drawing. Its one-shot plays when a state sets --nx-1
   (both unset resolve to none: invalid at computed-value time); the stagger is --ad. No scale anywhere. */
svg:where(.nx) .nx-p {
  transform-box: view-box;
  transform-origin: var(--o, 12px 12px);
  animation: var(--k1) var(--nx-1);
  animation-delay: calc(var(--ad, 0) * 1ms);
}
/* self-centred parts (strike and scan about their own box) */
svg:where(.nx) .nx-pf { transform-box: fill-box; transform-origin: center; }
/* Act overlays (nx-ov: the Fast bolt's strike fills, the wand's sparkle bursts, the grill's smoke): drawn in the
   glyph but hidden and still at rest everywhere, so no generic one-shot or loop ever shows them; only a context's own
   keyframes light them (8b, 8c, 8d). They have no halo (neon-icons.js nh). Reduced motion leaves them hidden. */
svg:where(.nx) .nx-ov { opacity: 0; animation: none; }
/* continuous turns are linear in every voice (an eased orbit lurches); retro keeps its stepped texture */
svg:where(.nx-a-spin) { --nx-le: linear; }
body[data-theme^="retro"] svg:where(.nx-a-spin) { --nx-le: steps(16, end); }
/* the ignite flicker lives on the halo path, never the tube */
@keyframes nx-flick { 0% { opacity: 0; } 16% { opacity: .9; } 28% { opacity: .3; } 46% { opacity: 1; } 60% { opacity: .55; } 100% { opacity: 1; } }

/* ------------------------------------------------------------------ 7. size gate */
/* neon-icons.js already renders every part static below 12 px; this guards a context that resizes a moving
   icon below its size argument by adding nx-z0 itself. */
svg:where(.nx-z0) .nx-p { animation: none; }

/* ------------------------------------------------------------------ 8. hover ignite */
/* Hosts are button, summary, [role=button] and [data-action]; the glyph is the host's child or grandchild (not
   inside a nested host). The rightmost compound is svg, with no :has(). Self-lit hosts (the bar, the lens
   trigger, jump-bottom, the pending chip, Orbit's nodes, discs and rail) and status, nx-self and brand glyphs are
   excluded. Only custom properties change, never the svg's own animation. */
:where(button, summary, [role="button"], [data-action]):where(:hover, :focus-visible):where(:not(.activity-item, .pm-lens-trigger, .jump-bottom, .af-chip-pending, .orbit-node, .wa-disc, .rail8-item)) > svg:where(.nx-r-control:not(.nx-self)),
:where(button, summary, [role="button"], [data-action]):where(:hover, :focus-visible):where(:not(.activity-item, .pm-lens-trigger, .jump-bottom, .af-chip-pending, .orbit-node, .wa-disc, .rail8-item)) > :where(:not(button, summary, [role="button"], [data-action])) > svg:where(.nx-r-control:not(.nx-self)) {
  /* control: the halo fades in over 180 ms and flickers once; the act plays once, then rests */
  --nx-hiv: visible; --nx-hi-a: var(--nx-h-hover-i);
  --nx-fl: nx-flick 300ms linear;
  --nx-1: var(--nx-d1) var(--nx-ease) backwards;
}
:where(button, summary, [role="button"], [data-action]):where(:hover, :focus-visible):where(:not(.activity-item, .pm-lens-trigger, .jump-bottom, .af-chip-pending, .orbit-node, .wa-disc, .rail8-item)) > svg:where(.nx-r-concept:not(.nx-self)),
:where(button, summary, [role="button"], [data-action]):where(:hover, :focus-visible):where(:not(.activity-item, .pm-lens-trigger, .jump-bottom, .af-chip-pending, .orbit-node, .wa-disc, .rail8-item)) > :where(:not(button, summary, [role="button"], [data-action])) > svg:where(.nx-r-concept:not(.nx-self)) {
  /* concept: the halo swells and the act plays once; no flicker, no dimming of the tube */
  --nx-hi-a: var(--nx-h-swell-i);
  --nx-1: var(--nx-d1) var(--nx-ease) backwards;
}
/* Ignite lights the tube itself (final review, 2026-10-03): a hovered or focused control, and a concept glyph inside a
   host, takes the text ink. Many hosts restate their muted ink after styles.css's `.icon-button:hover{color:var(--text)}`
   (the composer's attach, the header's search, the history close: (0,2,0), later), so the host's own hover never
   reached the glyph: on light themes (no hover halo) a hovered control was pixel-identical to rest once its act ended,
   and on dark ones the .30 halo was a grey blur round a dim tube. Now light themes light by ink alone (G1: about 2.5:1
   rising to about 15:1) and the dark halo follows the brighter ink. Hosts that carry a tone or a selection keep their
   ink (an active, pressed, checked or pinned toggle, a danger or warning row or button, a primary chip, Orbit's core, a
   [data-tone] host; NieR inverts a pressed filter to paper on ink, which the text ink would blank), and so
   does a glyph on a tinted tile (.work-output-icon, .event-icon) or one wearing a tone class (nx-t-*, also zero
   specificity, so it is excluded rather than outranked); any rule that inks a glyph through --nx-ink at a specificity
   above zero (the Fast bolt, a NieR cursor bar) still wins. neon-verify 17 holds both. (No .af-chip-pending here: no
   source draws that class any more, and orphan-gate counts it.) */
:where(button, summary, [role="button"], [data-action]):where(:hover, :focus-visible):where(:not(.activity-item, .pm-lens-trigger, .jump-bottom, .orbit-node, .wa-disc, .rail8-item, .active, .is-on, .is-pinned, [aria-pressed="true"], [aria-checked="true"], [aria-selected="true"], [class*="danger"], [class*="warn"], .primary-button, .primary, .orbit-core, [data-tone])) > svg:where(.nx-r-control, .nx-r-concept):where(:not(.nx-self, [class*="nx-t-"])),
:where(button, summary, [role="button"], [data-action]):where(:hover, :focus-visible):where(:not(.activity-item, .pm-lens-trigger, .jump-bottom, .orbit-node, .wa-disc, .rail8-item, .active, .is-on, .is-pinned, [aria-pressed="true"], [aria-checked="true"], [aria-selected="true"], [class*="danger"], [class*="warn"], .primary-button, .primary, .orbit-core, [data-tone])) > :where(:not(button, summary, [role="button"], [data-action], .work-output-icon, .event-icon)) > svg:where(.nx-r-control, .nx-r-concept):where(:not(.nx-self, [class*="nx-t-"])) {
  --nx-ink: var(--text);
}
/* Filled chips (primary buttons) already carry their own fill: the act plays, the halo stays off. (Send/Stop is
   send-stop.css's solid chip, its glyph inside .ss-face with its own lighting; the .send-button arm went with it.) */


/* ------------------------------------------------------------------ 8b. Fast mode (Jared, G1 item 15; the strike, 3D) */
/* OWNER of this block: Neon icons, surface step 3D (2026-10-02); the strike redrawn 2026-10-07. The Fast bolt is drawn
   only while Fast mode is on (the composer model chip and the picker's model row .fast-bolt, the transcript meta
   .meta-fast, the model sidecar's Fast row .fast-row-bolt), so the class is the ON state: the bolt is lit in the
   warning tone, and it STRIKES like lightning coming down from the sky, never shaking or moving as a whole. Light is
   only ever added: the outline tube stays at full ink, the halo never drops under its rest (.32) and the backlight
   never under its rest, so the bolt never goes dark (Jared, 2026-10-07: the old crack blanked the bolt and relit four
   bands, which read "like the bottom half is glitching out black and not really animating down from the top").
     1. the leader: a bright fill runs down inside the bolt from the top. Five filled copies of the bolt, each clipped
        (statically) to a 4-unit band, light top to bottom 40 ms apart, each with a short fading tail, so the light
        pours from the spike to the point in about 180 ms;
     2. the return stroke: the whole bolt flashes solid (the flash fill) with the halo and the backlight at their
        peak, dips, and flashes again, like a real strike's re-stroke;
     3. the afterglow: the fill fades out over about 0.7 s and the halo and backlight settle to the steady lit state;
     4. the hold: about 4.1 s of steady light until the next strike (a 5.2 s cycle).
   Everything animates opacity only (the overlays, the merged halo path, the host's backlight), so it composites; the
   band clips are static (never animated) and there is no dash or stroke-opacity in the loop. The halo's
   stroke-opacity is a strong token (--nx-h-bolt-i) and its element opacity carries the curve (.32 at rest = the
   attention tone's strength). The backlight is the ::before of the .nx-bolt wrapper the hosts draw round the svg.
   Hovering the host strikes once more: a one-shot copy joins the animation list (the loop keeps running underneath,
   so leaving the host does not strike again). The keyframes are one timeline in milliseconds, written out as
   percentages of the 5200 ms loop and of the 1100 ms one-shot: band k lights at 6 + 40k ms (to 1 in 10 ms, held
   30 ms, then a comet tail gone 80 ms later), so the head reaches the point at 176 ms; at 208-220 ms every band, the
   flash fill, the halo and the backlight fire together (the return stroke: the whole bolt white-hot on dark), the
   bands clear by 264 while the fill dips to .5, the re-stroke at 304 flickers the bands to .6 and the fill to .95,
   and the afterglow eases out: the fill is gone by 920 and the halo and backlight are at rest by 1100 (dark .32
   halo / .08 backlight; light themes a lower backlight curve, rest .07). Reduced motion: lit and static, the
   overlays hidden. NieR: the ink fill steps down band by band and the bolt flashes solid ink in held frames; no
   halo, no backlight. */
.nx-bolt {
  position: relative; isolation: isolate; display: inline-flex; flex: none; line-height: 0; vertical-align: middle;
  --nxb-bl: nx-bolt-bl; --nxb-blh: nx-bolt-bl-h; --nxb-rest: var(--nx-bl-attention);
}
body[data-theme$="-light"] .nx-bolt { --nxb-bl: nx-bolt-bl-l; --nxb-blh: nx-bolt-bl-lh; --nxb-rest: .07; }
.nx-bolt > svg.nx { display: block; }
.nx-bolt::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 200%; height: 200%; translate: -50% -50%;
  border-radius: 50%; pointer-events: none; z-index: -1;
  background: radial-gradient(closest-side, var(--warning), transparent);
  opacity: var(--nxb-rest);
}

.nx-bolt > svg .nx-h { opacity: .32; }
/* The strike overlays (neon-icons.js lightning: .nx-bk0-4 the leader bands, .nx-bkf the flash fill) are act overlays
   (nx-ov, section 6): hidden and still everywhere until a strike lights them, so the Fast row's unlit glyph (no
   .nx-bolt) never shows them and the generic one-shot never plays on them. The bands are clipped on the view box
   (static clips). */
svg:where([data-nx="lightning"]) .nx-bk0 { clip-path: inset(0px 0px 18px 0px) view-box; }
svg:where([data-nx="lightning"]) .nx-bk1 { clip-path: inset(6px 0px 14px 0px) view-box; }
svg:where([data-nx="lightning"]) .nx-bk2 { clip-path: inset(10px 0px 10px 0px) view-box; }
svg:where([data-nx="lightning"]) .nx-bk3 { clip-path: inset(14px 0px 6px 0px) view-box; }
svg:where([data-nx="lightning"]) .nx-bk4 { clip-path: inset(18px 0px 0px 0px) view-box; }
/* The leader is white-hot on dark themes (a neon tube's core: the text ink, over the amber), so its head reads as
   light pouring down even at 10 px; the flash fill (under the bands) is the bolt's own amber. On paper there is no
   brighter-than-ink, so the bands are the warning ink, thinner (a full fill of the deep ink reads heavy there). */
.nx-bolt > svg .nx-bk { fill: var(--text); }
.nx-bolt > svg .nx-bkf { fill: var(--nx-ink, currentColor); }
body[data-theme$="-light"] .nx-bolt > svg .nx-bk { fill: var(--nx-ink, currentColor); fill-opacity: .7; }
/* the loop (the composer chip, the picker's model row, the Fast row: always while drawn) */
.nx-bolt::before { animation: var(--nxb-bl) 5200ms linear infinite; }
.nx-bolt > svg .nx-h { animation: nx-bolt-halo 5200ms linear infinite; }
.nx-bolt > svg .nx-bk0 { animation: nx-bolt-k0 5200ms linear infinite; }
.nx-bolt > svg .nx-bk1 { animation: nx-bolt-k1 5200ms linear infinite; }
.nx-bolt > svg .nx-bk2 { animation: nx-bolt-k2 5200ms linear infinite; }
.nx-bolt > svg .nx-bk3 { animation: nx-bolt-k3 5200ms linear infinite; }
.nx-bolt > svg .nx-bk4 { animation: nx-bolt-k4 5200ms linear infinite; }
.nx-bolt > svg .nx-bkf { animation: nx-bolt-fill 5200ms linear infinite; }
/* The transcript meta's bolt (.nx-bolt-gated) sits in the message chrome, which is hidden until its message is
   hovered (transcript.css), so it strikes only while the chrome shows: as the row appears the bolt strikes, then it
   keeps the cycle; a hidden row runs no animation (one per fast turn would otherwise tick unseen). */
.nx-bolt-gated::before, .nx-bolt-gated > svg .nx-h, .nx-bolt-gated > svg .nx-bk { animation: none; }
:where(.message:hover, .message:focus-within, .tx-peek, .message-chrome.is-overflow-open) .nx-bolt-gated::before { animation: var(--nxb-bl) 5200ms linear infinite; }
:where(.message:hover, .message:focus-within, .tx-peek, .message-chrome.is-overflow-open) .nx-bolt-gated > svg .nx-h { animation: nx-bolt-halo 5200ms linear infinite; }
:where(.message:hover, .message:focus-within, .tx-peek, .message-chrome.is-overflow-open) .nx-bolt-gated > svg .nx-bk0 { animation: nx-bolt-k0 5200ms linear infinite; }
:where(.message:hover, .message:focus-within, .tx-peek, .message-chrome.is-overflow-open) .nx-bolt-gated > svg .nx-bk1 { animation: nx-bolt-k1 5200ms linear infinite; }
:where(.message:hover, .message:focus-within, .tx-peek, .message-chrome.is-overflow-open) .nx-bolt-gated > svg .nx-bk2 { animation: nx-bolt-k2 5200ms linear infinite; }
:where(.message:hover, .message:focus-within, .tx-peek, .message-chrome.is-overflow-open) .nx-bolt-gated > svg .nx-bk3 { animation: nx-bolt-k3 5200ms linear infinite; }
:where(.message:hover, .message:focus-within, .tx-peek, .message-chrome.is-overflow-open) .nx-bolt-gated > svg .nx-bk4 { animation: nx-bolt-k4 5200ms linear infinite; }
:where(.message:hover, .message:focus-within, .tx-peek, .message-chrome.is-overflow-open) .nx-bolt-gated > svg .nx-bkf { animation: nx-bolt-fill 5200ms linear infinite; }
/* hover strikes once more (hosts: a button, a [data-action] row, the transcript's model chip) */
:where(button, [data-action], .meta-model):where(:hover, :focus-visible) .nx-bolt::before { animation: var(--nxb-bl) 5200ms linear infinite, var(--nxb-blh) 1100ms linear 1; }
:where(button, [data-action], .meta-model):where(:hover, :focus-visible) .nx-bolt > svg .nx-h { animation: nx-bolt-halo 5200ms linear infinite, nx-bolt-halo-h 1100ms linear 1; }
:where(button, [data-action], .meta-model):where(:hover, :focus-visible) .nx-bolt > svg .nx-bk0 { animation: nx-bolt-k0 5200ms linear infinite, nx-bolt-k0h 1100ms linear 1; }
:where(button, [data-action], .meta-model):where(:hover, :focus-visible) .nx-bolt > svg .nx-bk1 { animation: nx-bolt-k1 5200ms linear infinite, nx-bolt-k1h 1100ms linear 1; }
:where(button, [data-action], .meta-model):where(:hover, :focus-visible) .nx-bolt > svg .nx-bk2 { animation: nx-bolt-k2 5200ms linear infinite, nx-bolt-k2h 1100ms linear 1; }
:where(button, [data-action], .meta-model):where(:hover, :focus-visible) .nx-bolt > svg .nx-bk3 { animation: nx-bolt-k3 5200ms linear infinite, nx-bolt-k3h 1100ms linear 1; }
:where(button, [data-action], .meta-model):where(:hover, :focus-visible) .nx-bolt > svg .nx-bk4 { animation: nx-bolt-k4 5200ms linear infinite, nx-bolt-k4h 1100ms linear 1; }
:where(button, [data-action], .meta-model):where(:hover, :focus-visible) .nx-bolt > svg .nx-bkf { animation: nx-bolt-fill 5200ms linear infinite, nx-bolt-fill-h 1100ms linear 1; }

/* ------------------------------------------------------------------ 8c. the capabilities wand in colour (2026-10-07) */
/* OWNER of this block: Neon icons (Jared, 2026-10-07: "The Assistant capabilities wand should be colored. Maybe silver
   handle, gold star end, with the 3 sparkles being colored, maybe blue, pink, green? It should still read as neon ...
   after the shake it should sparkle the colored sparkles"). The one deliberate exception to "colour is reserved for
   status" (section 12): the composer's capabilities wand ([data-menu-anchor="wand"]) and its menu head (the
   Assistant capabilities menu's .menu-head) paint the wand's element inks (neon-icons.js wand: nx-i-silver, -gold,
   -blue, -pink, -green on each tube and on its own halo path), so each tube blooms in its own colour on dark themes.
   The Skill step's wand (Orbit, the working card) is not in scope: it inks by status as before.
   The inks are literal per theme brightness (like --nx-idle, section 1: no color-mix()), the deeper set on paper,
   where halos are off and the ink alone carries the colour (each >= 3:1 on the light composer and menu fields). The
   svg pins --nx-ink to the silver, so the hover ink rule (section 8, zero specificity) never greys it and neon-verify
   17b reads it as a glyph with its own ink. NieR draws it in ink (no colour; the handle a lighter ink tone and the
   star filled, so the star end still reads), with square caps and no glow. */
body {
  --nx-wand-silver: #c6cdda; --nx-wand-gold: #ffc940; --nx-wand-blue: #55aeff; --nx-wand-pink: #ff6fbc; --nx-wand-green: #46df93;
  /* the sparkle's bloom at the peak of its twinkle (element opacity carries the curve, so it composites) */
  --nx-h-spark-i: .8;
}
body[data-theme$="-light"] {
  --nx-wand-silver: #6a7280; --nx-wand-gold: #a26f00; --nx-wand-blue: #1d6ccc; --nx-wand-pink: #c42f7c; --nx-wand-green: #16834a;
  --nx-h-spark-i: 0;
}
html:not([data-o55-nier="on"]) [data-menu-anchor="wand"] > svg[data-nx="wand"],
html:not([data-o55-nier="on"]) .menu-head > svg[data-nx="wand"] { --nx-ink: var(--nx-wand-silver); }
html:not([data-o55-nier="on"]) [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-i-gold,
html:not([data-o55-nier="on"]) .menu-head > svg[data-nx="wand"] .nx-i-gold { stroke: var(--nx-wand-gold); }
html:not([data-o55-nier="on"]) [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-i-blue,
html:not([data-o55-nier="on"]) .menu-head > svg[data-nx="wand"] .nx-i-blue { stroke: var(--nx-wand-blue); }
html:not([data-o55-nier="on"]) [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-i-pink,
html:not([data-o55-nier="on"]) .menu-head > svg[data-nx="wand"] .nx-i-pink { stroke: var(--nx-wand-pink); }
html:not([data-o55-nier="on"]) [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-i-green,
html:not([data-o55-nier="on"]) .menu-head > svg[data-nx="wand"] .nx-i-green { stroke: var(--nx-wand-green); }
/* NieR: ink only; a lighter ink tone on the handle and a filled star tell the parts apart without colour */
html[data-o55-nier="on"] [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-c.nx-i-silver,
html[data-o55-nier="on"] .menu-head > svg[data-nx="wand"] .nx-c.nx-i-silver { stroke-opacity: .55; }
html[data-o55-nier="on"] [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-c.nx-i-gold,
html[data-o55-nier="on"] .menu-head > svg[data-nx="wand"] .nx-c.nx-i-gold { fill: var(--nx-ink, currentColor); }
/* The sparkle. After the hover/focus flick (the rod's 440 ms bounce), the sparkles twinkle in turn, blue, pink,
   green, 120 ms apart (240 ms + each sparkle's --ad: 360, 480, 600 ms): each dims, turns (a plus turned 90 degrees
   lands on itself, so it reads as a glint, never a spin), bursts into an eight-point glint (its thin diagonal cross,
   an nx-ov overlay, flashes) with its bloom flaring to --nx-h-spark-i, and settles; all done about 1.1 s after the
   hover. Opacity and transform only. The bloom's flare is opacity: while hovered the sparkle's halo takes the strong
   token as its stroke-opacity and the host's halo strength over it as its element opacity, and the keyframes name
   only the peak (the rest is the underlying value). Light themes have no halo (the token is 0, so the halo stays at
   stroke-opacity 0 whatever its element opacity): there the dip, the turn and the burst carry it. Retro and NieR step it
   (their --nx-ease; NieR steps(2)). Reduced motion (section 10) stops all of it. */
[data-menu-anchor="wand"]:where(:hover, :focus-visible) > svg[data-nx="wand"] .nx-wsp { animation: nx-wand-spark 520ms var(--nx-ease) calc(240ms + var(--ad, 0) * 1ms) backwards; }
[data-menu-anchor="wand"]:where(:hover, :focus-visible) > svg[data-nx="wand"] .nx-wsp > .nx-wray { animation: nx-wand-ray 520ms linear calc(240ms + var(--ad, 0) * 1ms) backwards; }
[data-menu-anchor="wand"]:where(:hover, :focus-visible) > svg[data-nx="wand"] .nx-wsp > .nx-h {
  stroke-opacity: var(--nx-h-spark-i); opacity: calc(var(--nx-hi-a, 0) / var(--nx-h-spark-i));
  animation: nx-wand-flare 520ms linear calc(240ms + var(--ad, 0) * 1ms) backwards;
}
html[data-o55-nier="on"] [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-wsp,
html[data-o55-nier="on"] [data-menu-anchor="wand"] > svg[data-nx="wand"] .nx-wray { animation-timing-function: steps(2, end); }
/* the glint's rays are thin (the tube's weight x .55), so the burst reads as a star, not a ball */
svg:where([data-nx="wand"]) .nx-wray { stroke-width: calc(var(--nx-stroke-base, 1.8) * var(--nx-tone-k, 1) * .55); }
@keyframes nx-wand-spark { 0% { transform: rotate(0deg); opacity: 1; } 28% { transform: rotate(40deg); opacity: .5; } 50% { transform: rotate(68deg); opacity: 1; } 100% { transform: rotate(90deg); opacity: 1; } }
@keyframes nx-wand-ray { 0%, 34% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
@keyframes nx-wand-flare { 50% { opacity: 1; } }

/* ------------------------------------------------------------------ 8d. Grill Me's kettle grill (2026-10-07) */
/* OWNER of this block: Neon icons. neon-icons.js grill: whenever a context plays the glyph's one-shot (--nx-1: a
   hovered or focused host, a mounting still mark), the lid swings open about its left hinge, flames flicker in the
   gap, a puff of smoke (two wisps, the second 60 ms behind) rises out of it and drifts off, and the lid drops shut
   with a small clank, in about a second (the grill's own --nx-d1). The lid's keyframes are bespoke (lift, hold, an
   accelerating drop in short segments, one bounce), so the voice's easing still shapes every segment (Retro and NieR
   step it). The flames and the smoke are act overlays (nx-ov): hidden at rest, they take their keyframes from the same
   --nx-1 (unset, the declaration is invalid and they stay still) and never play below 12 px (nx-z0), where the lid
   does not move either. Transform and opacity only; reduced motion (section 10) stops all of it. */
svg:where([data-nx="grill"]) { --nx-d1: 1000ms; }
svg:where([data-nx="grill"]) .nx-glid { animation: nx-grill-lid var(--nx-1); }
svg:where([data-nx="grill"]:not(.nx-z0)) .nx-gfl { animation: nx-grill-flame var(--nx-1); }
svg:where([data-nx="grill"]:not(.nx-z0)) .nx-gsm1 { animation: nx-grill-smoke1 var(--nx-1); }
svg:where([data-nx="grill"]:not(.nx-z0)) .nx-gsm2 { animation: nx-grill-smoke2 var(--nx-1); }
/* the smoke is a finer tube than the kettle */
svg:where([data-nx="grill"]) .nx-gsm { stroke-width: calc(var(--nx-stroke-base, 1.8) * var(--nx-tone-k, 1) * .75); }
/* Where the grill is drawn (item 11, 2026-10-07): the Deep Plan sidecar's Grill Me row and the plan dialogs' Grill Me
   buttons (buttons: the concept hover rule above plays it), the run views' Grill Me checks (module-shell pmxCheck's
   glyph) and the setup sheets' Add specialists shelf (collaboration.js: the Grill Me item, in its seat hue). A check
   row is a label and a shelf item a plain row, not the hover rule's hosts, so they are named here: hovering the row or
   focusing its box or its Add swells the halo and plays the act once, exactly like a concept glyph in a button. At
   rest the grill stands still (a sheet's marks hold still, the pmx loop budget is the sheen's). */

@keyframes nx-grill-lid {
  0% { transform: translate(0px, 0px) rotate(0deg); } 24%, 50% { transform: translate(0px, -1.2px) rotate(-20deg); }
  58% { transform: translate(0px, -.96px) rotate(-16deg); } 63% { transform: translate(0px, -.54px) rotate(-9deg); }
  67% { transform: translate(0px, 0px) rotate(0deg); } 73% { transform: translate(0px, -.19px) rotate(-3.2deg); }
  79%, 100% { transform: translate(0px, 0px) rotate(0deg); }
}
@keyframes nx-grill-flame {
  0%, 10% { opacity: 0; transform: translate(0px, .6px); } 18% { opacity: 1; transform: translate(0px, 0px); }
  24% { opacity: .6; transform: translate(0px, .3px); } 30% { opacity: 1; transform: translate(0px, -.3px); }
  37% { opacity: .7; transform: translate(0px, 0px); } 44% { opacity: 1; transform: translate(0px, -.2px); }
  52% { opacity: .8; transform: translate(0px, 0px); } 60%, 100% { opacity: 0; transform: translate(0px, .6px); }
}
@keyframes nx-grill-smoke1 {
  0%, 26% { opacity: 0; transform: translate(0px, 0px); } 36% { opacity: .85; transform: translate(.6px, -1.6px); }
  62% { opacity: .55; transform: translate(1.8px, -4px); } 80%, 100% { opacity: 0; transform: translate(2.4px, -5.6px); }
}
@keyframes nx-grill-smoke2 {
  0%, 32% { opacity: 0; transform: translate(0px, 0px); } 42% { opacity: .85; transform: translate(.4px, -1.6px); }
  68% { opacity: .5; transform: translate(1.2px, -4.2px); } 86%, 100% { opacity: 0; transform: translate(1.6px, -6px); }
}

/* ------------------------------------------------------------------ 9. the status set (plan §3) */
/* The wrapper carries the list rhythm; .nx-st-base is the static lit layer, .nx-st-move the moving part. Wired
   into the surfaces by step 3B; here so the gallery and every later surface share one definition. */
/* The wrapper is a small stacking context, so its backlight paints behind the glyph and above the row. */
.nx-st { position: relative; isolation: isolate; display: inline-flex; flex: none; line-height: 0; vertical-align: middle; }
.nx-st > svg.nx { display: block; }
/* The backlight: the glow's soft tail, a radial gradient of the plain tone token, about 2.2x the mark, faded by
   element opacity (no color-mix, no filter). It has no edge, unlike stepped stroke bands. */
.nx-st::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 220%; height: 220%; translate: -50% -50%;
  border-radius: 50%; pointer-events: none; z-index: -1;
  background: radial-gradient(closest-side, var(--nx-bl-ink, currentColor), transparent);
  opacity: var(--nx-bl-a, 0);
}
.nx-tn-blocked { --nx-bl-ink: var(--danger); --nx-bl-a: var(--nx-bl-blocked); }
.nx-tn-attention { --nx-bl-ink: var(--warning); --nx-bl-a: var(--nx-bl-attention); }
.nx-tn-working { --nx-bl-ink: var(--accent); --nx-bl-a: var(--nx-bl-working); }
.nx-tn-changed { --nx-bl-ink: var(--accent-2); --nx-bl-a: var(--nx-bl-changed); }
/* the quiet tones are unlit: no backlight box at all */
.nx-tn-done::before, .nx-tn-idle::before, .nx-tn-paused::before { display: none; }
/* working: the bead orbits slowly on the still ring (9 s: the quietest live mark, below reviewing), no breathe, no
   backlight (the inner halo only), the same 9 s in the thread list and alone. Final review (2026-10-03): the list used
   to turn the whole gapped ring in 16 s, which read as a frozen spinner at a glance (the bead crept 1.84 px/s) while
   the turning arc's antialiasing still out-moved needs-you; now only the bead moves (neon-icons.js st-working), so a
   9 s list bead is both livelier and quieter, and needs-you's lead (neon-verify 13) is wider. */
.nx-st-working::before { display: none; }
.nx-st-working .nx-p { animation: var(--kl) 9000ms var(--nx-le) infinite; animation-delay: calc(var(--ad, 0) * 9ms - 9000ms); }
/* reviewing: the lens sweeps the page; no outer glow, so it stays below needs-you */
.nx-st-reviewing::before { display: none; }
.nx-st-reviewing .nx-p { animation: var(--kl) 2800ms var(--nx-le) infinite; animation-delay: calc(var(--ad, 0) * 2.8ms - 2800ms); }
/* waiting (needs you) leads every list: full steady halo, the "?" hops 3.4 units twice every 2.4 s and the
   backlight breathes .6-1 (literal keyframes per theme brightness; opacity only, so it composites). In the thread
   list (.ph-status) the backlight swells with the beat instead: brightest and widest (x1.12) on the hops, ebbing to a
   quarter and x.88 between them (opacity and transform). Integrate (2026-10-02): the deeper, wider swell is what keeps
   needs-you above the working bead in every theme's list; fix cycle 1 keeps it to the list (:not(.nx-still), so
   section 14's still rule keeps the last word on a still mark's backlight). */
.nx-st-waiting .nx-p { animation: var(--kl) 2400ms var(--nx-le) infinite; animation-delay: calc(var(--ad, 0) * 2.4ms - 2400ms); }
.nx-st-waiting::before { animation: nx-bl-needs 2400ms ease-in-out infinite; }
body[data-theme$="-light"] .nx-st-waiting::before { animation-name: nx-bl-needs-l; }
.ph-status .nx-st-waiting:not(.nx-still)::before { animation-name: nx-bl-swell; }
body[data-theme$="-light"] .ph-status .nx-st-waiting:not(.nx-still)::before { animation-name: nx-bl-swell-l; }
@keyframes nx-bl-needs { 0%, 100% { opacity: .08; } 50% { opacity: .048; } }
@keyframes nx-bl-needs-l { 0%, 100% { opacity: .081; } 50% { opacity: .049; } }
@keyframes nx-bl-swell { 0%, 100% { opacity: .085; transform: scale(1.12); } 50% { opacity: .025; transform: scale(.88); } }
/* light themes' list swell peaks at .08 (final review: .11 read as a disc), the light attention backlight's swell */
@keyframes nx-bl-swell-l { 0%, 100% { opacity: .08; transform: scale(1.12); } 50% { opacity: .025; transform: scale(.88); } }
/* waiting on a dependency: the hourglass tips once, then holds */
.nx-st-waiting-dep .nx-p { animation: var(--kl) 3600ms var(--nx-le) infinite; animation-delay: calc(var(--ad, 0) * 3.6ms - 3600ms); }
/* recovering: a counter-clockwise ratchet, one 90-degree tick every 2.4 s (two per 4.8 s cycle) */
.nx-st-recovering .nx-p { animation: var(--kl) 4800ms var(--nx-le) infinite; animation-delay: calc(var(--ad, 0) * 4.8ms - 4800ms); }
/* complete: a bold check that clip-draws once on mount */
.nx-st-complete > svg.nx { --nx-stroke-base: 2.4; --nx-tone-k: 1; }
.nx-st-complete .nx-p { animation: var(--k1) 520ms var(--nx-ease-c) backwards; }
/* blocked: the shackle drops shut once, then the wrapper takes the bar's hard double blink */
.nx-st-blocked .nx-p { animation: var(--k1) 520ms var(--nx-ease) backwards; }
.nx-st-blocked { animation: ab-alert 1900ms steps(1, end) 700ms infinite; }
/* failed: an irregular stutter, reserved for failed */
.nx-st-failed { animation: nx-stutter 2700ms linear infinite; }
@keyframes nx-stutter { 0%, 61%, 66%, 70%, 74%, 100% { opacity: 1; } 63% { opacity: .35; } 68% { opacity: .55; } 72% { opacity: .3; } }
/* idle (ready), paused, pending, skipped, mixed: static */
/* idle and pending are unlit, but keep the full weight so a ready or queued row still reads at a glance */
.nx-st-idle > svg.nx { --nx-hi-a: 0; --nx-hiv: hidden; --nx-tone-k: 1; }
.nx-st-pending > svg.nx { --nx-tone-k: 1; --nx-ink: var(--muted); }

/* ------------------------------------------------------------------ 10. reduced motion */
/* All three routes (the media query, body.pm56-reduced and html[data-motion="reduced"], the PMConcept7 contract) stop
   every neon animation and transition outright; the base style is the finished, lit pose, so ink, halo and weight
   still carry the state with no infinite animation. This covers every host's loops on an svg.nx or a status wrapper:
   the Orbit's live glyph parts, the bar's breathe and alert rhythms, the jump button's working breathe, the status
   beads, the needs-you hop and backlight, blocked's blink and failed's stutter. (The data-motion route was missing
   until 3E2 fix cycle 1: only NieR's section 11 had it.) */
@media (prefers-reduced-motion: reduce) {
  svg.nx, svg.nx .nx-p, svg.nx .nx-h, svg.nx .nx-ov, .nx-st, .nx-st::before, .nx-bolt::before { animation: none !important; transition: none !important; }
}

html[data-motion="reduced"] svg.nx, html[data-motion="reduced"] svg.nx .nx-p, html[data-motion="reduced"] svg.nx .nx-h, html[data-motion="reduced"] svg.nx .nx-ov, html[data-motion="reduced"] .nx-st, html[data-motion="reduced"] .nx-st::before, html[data-motion="reduced"] .nx-bolt::before { animation: none !important; transition: none !important; }

/* ------------------------------------------------------------------ 11. NieR Mode (PMConcept7 contract) */
/* OWNER of this section: NieR Mode, step N-A (2026-10-02); the rest of the file is the foundation's. Every rule is
   scoped by html[data-o55-nier="on"] (nier.js writes it only while a NieR theme is painted; nier.css holds the
   palette), so the default themes never see one. NieR: Automata has no bloom: ink tubes, no halo band and no
   backlight. Tone inks come from the NieR tables through the same tokens (--accent is the ink, --warning the warning
   ink, --danger the rust, --positive the olive, --accent-2 the secondary ink); idle and paused are the ink at .45.
   Motion is stepped (the NieR voice), transform and opacity only. */
html[data-o55-nier="on"] body {
  --nx-h-blocked-i: 0; --nx-h-attention-i: 0; --nx-h-working-i: 0; --nx-h-changed-i: 0; --nx-h-quiet-i: 0;
  --nx-h-concept-i: 0; --nx-h-hover-i: 0; --nx-h-swell-i: 0; --nx-h-bolt-i: 0;
  --nx-bl-blocked: 0; --nx-bl-attention: 0; --nx-bl-working: 0; --nx-bl-changed: 0;
  --nx-ease: steps(4, end); --nx-le: steps(6, end); --nx-ease-c: steps(3, end);
}
html[data-o55-nier="on"] svg.nx .nx-h { display: none; }
html[data-o55-nier="on"] .nx-st::before { display: none; }

html[data-o55-nier="on"] svg:where(.nx-a-spin) { --nx-le: steps(12, end); }
html[data-o55-nier="on"] svg:where(.nx-t-idle) { --nx-ink: rgba(var(--o55-nier-ink-rgb), var(--nx-idle-a, .45)); }
/* NieR Light: idle ink at .545 reads 3.06:1 on the row field (3:1 floor; the rust of blocked is 3.14) (3E2). A token,
   so the rules that restate a set member's ink (pending's, section 6) keep their specificity over it. */
html[data-o55-nier="on"] body[data-theme$="-light"] { --nx-idle-a: .545; }
html[data-o55-nier="on"] svg:where(.nx-t-paused) { --nx-ink: rgba(var(--o55-nier-ink-rgb), var(--nx-paused-a, .45)); }
/* NieR Light paused and skipped at .63 (3.78:1 on the row field), so the quiet order holds above idle's .545 (fix
   cycle 1; at .45 they read 2.45, under idle). NieR Dark keeps .45. */
html[data-o55-nier="on"] body[data-theme$="-light"] { --nx-paused-a: .63; }
/* On the cursor bar (a hovered or selected thread row) the quiet tones stay quiet: the bar's :where(*) rule
   (nier-parts.css, 0,3,1) turns every glyph to full paper, and idle's whole ring then outweighed the working diamond,
   which rotateY narrows in four of its six steps (integrate fix cycle 1). They take the bar's paper at their own
   alpha instead (0,4,2, so they beat the bar's rule although neon-icons.css comes first). */
html[data-o55-nier-parts~="cursor"] .thread-row:hover svg.nx-t-idle,
html[data-o55-nier-parts~="cursor"] .thread-row.active svg.nx-t-idle { --nx-ink: rgba(var(--o55-nier-on-ink-rgb), var(--nx-idle-a, .45)); }
html[data-o55-nier-parts~="cursor"] .thread-row:hover svg.nx-t-paused,
html[data-o55-nier-parts~="cursor"] .thread-row.active svg.nx-t-paused { --nx-ink: rgba(var(--o55-nier-on-ink-rgb), var(--nx-paused-a, .45)); }
/* Square icon strokes [icons]: square caps and mitred joins, with a miter limit of 2 so a right angle stays sharp and
   anything tighter (the bolt, the wand's sparkle, a chevron at 12 px) bevels instead of spiking. */
html[data-o55-nier-parts~="icons"] svg.nx { stroke-linecap: square; stroke-linejoin: miter; stroke-miterlimit: 2; }
/* NieR forbids animated clip-path: a part that draws in by clip appears by stepped opacity instead, from .4 so a
   hover act never blanks it; the complete check appears in two steps. */
html[data-o55-nier="on"] svg.nx .nx-pc { animation-name: o55n-nx-reveal; animation-timing-function: steps(3, end); }
@keyframes o55n-nx-reveal { from { opacity: .4; } to { opacity: 1; } }
html[data-o55-nier="on"] .nx-st-complete .nx-p { animation: o55n-nx-two 360ms steps(2, end) backwards; }
@keyframes o55n-nx-two { from { opacity: 0; } to { opacity: 1; } }
/* Hover ignite is a two-beat stepped flicker of the tube itself (there is no halo to light). One selector per host
   kind (shell-selfcheck: no rightmost :is() list); the svg's own animation is never touched. */
html[data-o55-nier="on"] button:hover > svg.nx-r-control .nx-c,
html[data-o55-nier="on"] button:focus-visible > svg.nx-r-control .nx-c,
html[data-o55-nier="on"] button:hover > :not(button) > svg.nx-r-control .nx-c,
html[data-o55-nier="on"] [data-action]:hover > svg.nx-r-control .nx-c,
html[data-o55-nier="on"] [data-action]:focus-visible > svg.nx-r-control .nx-c,
html[data-o55-nier="on"] [data-action]:hover > :not([data-action]) > svg.nx-r-control .nx-c,
html[data-o55-nier="on"] [role="button"]:hover > svg.nx-r-control .nx-c,
html[data-o55-nier="on"] summary:hover > svg.nx-r-control .nx-c { animation: o55n-nx-flick 240ms steps(1, end); }
@keyframes o55n-nx-flick { 0% { opacity: .45; } 33% { opacity: 1; } 66% { opacity: .45; } 100% { opacity: 1; } }
/* The Fast bolt strikes in ink, in steps (3D; redrawn 2026-10-07): the ink fill steps down band by band, then the bolt
   flashes solid ink, flickers once and clears, every frame held; the halo and the backlight are gone. */
html[data-o55-nier="on"] .nx-bolt > svg.nx .nx-p { animation-timing-function: steps(1, end); }
html[data-o55-nier="on"] .nx-bolt > svg.nx .nx-bk { fill: var(--nx-ink, currentColor); }
html[data-o55-nier="on"] .nx-bolt::before { display: none; }
/* The status set keeps every silhouette apart, because NieR's inks are close:
   needs-you is an inverted ink block with paper strokes and a paper "?" (it outshines everything); */
html[data-o55-nier="on"] .nx-st-waiting { background: var(--nx-bk, var(--o55-nier-ink)); box-shadow: 0 0 0 2px var(--nx-bk, var(--o55-nier-ink)); }
html[data-o55-nier="on"] .nx-st-waiting > svg.nx { --nx-ink: var(--o55-nier-on-ink); }
/* a pmx decision row ("Your move.") inks its mark in --accent (module-shell.css, 0,5,1), and NieR's --accent is the
   block's own ink, so the "?" vanished into the block (final review, 2026-10-03): the block's strokes stay paper there */

/* on an ink cursor bar the block turns over: paper with ink strokes */
html[data-o55-nier-parts~="cursor"] .thread-row:hover .nx-st-waiting,
html[data-o55-nier-parts~="cursor"] .thread-row.active .nx-st-waiting { --nx-bk: var(--o55-nier-on-ink); }
html[data-o55-nier-parts~="cursor"] .thread-row:hover .nx-st-waiting > svg.nx,
html[data-o55-nier-parts~="cursor"] .thread-row.active .nx-st-waiting > svg.nx { --nx-ink: var(--o55-nier-ink); }
/* and, NieR's form of the list swell (it has no backlight): in the thread list four ink corner brackets lock on
   around the block for the two "?" beats of each 2.4 s cycle, then let go (held frames, opacity only). Integrate
   (2026-10-02): without them the slowed working diamond still out-moved needs-you in a NieR list (neon-verify 13).
   List only, like the swell (fix cycle 1): the chat header's mark clips its own box, so the brackets never showed there.
   They are the Target brackets part's (final fix 2026-10-03): with that part off the block stays, the brackets go. */
html[data-o55-nier-parts~="brackets"] .ph-status .nx-st-waiting::after {
  content: ""; position: absolute; inset: -5px; pointer-events: none; opacity: 0; --nx-bk-c: var(--nx-bk, var(--o55-nier-ink));
  background:
    linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) left top / 4px 1px no-repeat, linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) left top / 1px 4px no-repeat,
    linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) right top / 4px 1px no-repeat, linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) right top / 1px 4px no-repeat,
    linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) left bottom / 4px 1px no-repeat, linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) left bottom / 1px 4px no-repeat,
    linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) right bottom / 4px 1px no-repeat, linear-gradient(var(--nx-bk-c), var(--nx-bk-c)) right bottom / 1px 4px no-repeat;
  animation: o55n-nx-lock 2400ms steps(1, end) infinite;
}
@keyframes o55n-nx-lock { 0%, 31% { opacity: 1; } 32%, 100% { opacity: 0; } }
/* blocked keeps the wrapper's hard double blink (ab-alert, already steps(1)); failed glitches once as it arrives
   (the mark remounts on a change) instead of stuttering for ever; */
html[data-o55-nier="on"] .nx-st-failed { animation: o55n-nx-glitch 320ms steps(4, end) 1; }
@keyframes o55n-nx-glitch { 0% { transform: translateX(0); opacity: 1; } 25% { transform: translateX(2px); opacity: .4; } 50% { transform: translateX(-2px); opacity: 1; } 75% { transform: translateX(1px); opacity: .6; } 100% { transform: none; opacity: 1; } }
/* working is PMConcept7's diamond loader while the diamonds part is on (a hollow diamond turning in depth, its ink
   flipping to paper on a cursor bar), turned in six held steps of 60 degrees so it is never seen edge-on in a list,
   one step every 467 ms (2.8 s a turn); in the thread list one step every 1.4 s (8.4 s a turn; integrate, 2026-10-02:
   at 2.8 s it out-moved needs-you 3-4x in a list; fix cycle 1 keeps the slow turn to the list);
   otherwise it is the ink bead on the ring, going round in steps (--nx-le above). */
html[data-o55-nier-parts~="diamonds"] .nx-st-working > svg.nx { visibility: hidden; }
html[data-o55-nier-parts~="diamonds"] .nx-st-working::after {
  content: ""; position: absolute; inset: 18%; box-sizing: border-box; pointer-events: none;
  border: 1.5px solid var(--nx-ink, var(--o55-nier-ink)); outline: 1px solid var(--nx-ink, var(--o55-nier-ink)); outline-offset: -4.5px;
  transform: rotateY(0deg) rotate(45deg) scale(.82);
  animation: o55n-nx-diamond 2.8s steps(6, end) infinite;
}
html[data-o55-nier-parts~="diamonds"] .ph-status .nx-st-working::after { animation-duration: 8.4s; }
@keyframes o55n-nx-diamond { from { transform: rotateY(0deg) rotate(45deg) scale(.82); } to { transform: rotateY(360deg) rotate(45deg) scale(.82); } }
/* idle and pending are squares while the square part is on (final review, 2026-10-03): PMConcept7's NieR lists draw
   an idle or draft row as a hollow square (its square part squares every round mark), and the idle ring was the one
   round mark left in the NieR set. Idle is a hollow square the idle ring's size (its outer edge, 10.8 of 24 units) in
   the idle ink; pending a dashed square the pending ring's size in its muted ink; both turn to paper at their own
   alpha on a cursor bar, like the rings they replace. Drawn by the wrapper's ::after (the svg hides), like the diamond,
   static. The needs-you ink block already matches PMConcept7's filled square. */
html[data-o55-nier-parts~="square"] .nx-st-idle > svg.nx, html[data-o55-nier-parts~="square"] .nx-st-pending > svg.nx { visibility: hidden; }
html[data-o55-nier-parts~="square"] .nx-st-idle::after, html[data-o55-nier-parts~="square"] .nx-st-pending::after {
  content: ""; position: absolute; inset: 27.5%; box-sizing: border-box; pointer-events: none;
  border: 1.2px solid rgba(var(--o55-nier-ink-rgb), var(--nx-idle-a, .45));
}
html[data-o55-nier-parts~="square"] .nx-st-pending::after { inset: 15%; border-style: dashed; border-color: var(--muted); }
html[data-o55-nier-parts~="cursor"][data-o55-nier-parts~="square"] .thread-row:hover .nx-st-idle::after,
html[data-o55-nier-parts~="cursor"][data-o55-nier-parts~="square"] .thread-row.active .nx-st-idle::after { border-color: rgba(var(--o55-nier-on-ink-rgb), var(--nx-idle-a, .45)); }
html[data-o55-nier-parts~="cursor"][data-o55-nier-parts~="square"] .thread-row:hover .nx-st-pending::after,
html[data-o55-nier-parts~="cursor"][data-o55-nier-parts~="square"] .thread-row.active .nx-st-pending::after { border-color: var(--o55-nier-on-ink); }
/* The bar: ink glyphs with stepped acts (the tokens above); a working domain carries an ink underline under its
   glyph, drawn by the item's anchored ::after (the backlight's slot, unused in NieR). */

/* Reduced motion (the media query, html[data-motion], body.pm56-reduced): every NieR act and loop stops; the inverted
   needs-you block, the diamond and the underline still carry the state. */
@media (prefers-reduced-motion: reduce) {
  html[data-o55-nier="on"] svg.nx .nx-c, html[data-o55-nier="on"] .nx-st::after { animation: none !important; }
}

html[data-o55-nier="on"][data-motion="reduced"] svg.nx, html[data-o55-nier="on"][data-motion="reduced"] svg.nx .nx-p,
html[data-o55-nier="on"][data-motion="reduced"] svg.nx .nx-c, html[data-o55-nier="on"][data-motion="reduced"] .nx-st,
html[data-o55-nier="on"][data-motion="reduced"] .nx-st::after { animation: none !important; transition: none !important; }

/* ------------------------------------------------------------------ 14. still status marks (step 3E) */
/* OWNER of this section: Neon icons, surface step 3E (2026-10-02). A status mark whose wrapper carries nx-still is
   lit and STILL: no list rhythm (the bead's orbit, the needs-you hop, the tip, the ratchet), no breathing backlight,
   no blocked blink or failed stutter; its moving part plays the mark's one-shot act once as it mounts (the bead comes
   round, the "?" hops in, the shackle drops, the check draws), and a status change remounts it (data-k="st:<s>").
   module-shell.js pmxStatus() asks for it: every pmx host allows no loop of its own (pmx-verify loop-census; a live
   card's two are the pmx-sheen loops). Ink, halo, weight and the static backlight still carry the state. The
   body-qualified ::before rule outranks the light themes' backlight-breathe name (section 9). */

/* pm7-retro-phosphor.css: Retro lights a neon glyph like phosphor on a CRT, on PMConcept7's 33 ms Retro clock.
 * OWNER: pm7-glyphs-designer2 (2026-10-10; NEON-GRAMMAR.md section 9, accepted by pm7-glyphs; timing agreed with pm7-hover
 * against PMH's Retro "Raise", Concepts/onboarding/opus-5.5/src/css/22-hover.css on main 605ce4857c).
 * Order-proof: it works before or after neon-icons.css (build_catalog.py loads it after). The Retro scope sits inside
 * :where(), so each rule weighs only what it names: svg.nx (0,1,1) beats the generic hover rule (0,0,1), and svg.nx .nx-h
 * and .nx-p (0,2,1) beat the generic halo and part rules (0,1,1). Bespoke rules keep their own timing: the wand's sparkle
 * (0,3,1) and the filled chips' --nx-fl (0,2,1, which this file never sets on a chip's own selector) outrank or miss it,
 * and the Fast bolt (0,2,1, the one tie) is excluded by name ([data-nx="lightning"]) along with every part that sits out
 * the loops (.nx-pn, its strike overlays), so it strikes on its own clock in Retro too.
 *
 * WHAT CHANGES IN RETRO (the other looks are untouched)
 * - Ignite, on the rule's tick. PMH raises a hovered plate on the hover-start frame and draws its phosphor rule one tick
 *   (33 ms) later; the glyph strikes with the rule: its tube takes the hover ink and its halo powers on at +33 ms in two
 *   held ticks (half strength, then full), with no 180 ms fade and no neon flicker. Its one-shot act starts on the same
 *   tick and runs 396 ms (twelve ticks, three per step of the look's steps(4) voice).
 * - Decay, from the leave frame. Phosphor holds briefly after the beam leaves: the halo drops to half on the leave frame
 *   (with PMH's rule going off) and goes out one tick later (with the plate dropping), and the tube returns to its rest
 *   ink on that second tick. Nothing glows after the plate drops.
 * - A tighter bloom on Retro Dark: the core band is 3.0 px (3.6 elsewhere) and the status backlights are halved, so a
 *   glyph reads as phosphor on glass rather than a sign on a wall. Retro Light keeps the light looks' faint band.

 * rules; F3-465). Status marks, the activity bar and the other self-lit hosts keep their own rhythms, so nothing here
 * can out-move needs-you. Reduced Motion shows the end state at once: neon-icons.css section 10 removes every transition
 * and animation, and the routes at the end of this file cover the fills this file adds.
 *
 * Hosts are neon-icons.css section 8's: button, summary, [role=button] and [data-action], the glyph their child or
 * grandchild, minus the self-lit hosts. No :has(), and no rightmost bare :is()/:where() compound (shell-selfcheck).
 *
 * PMH TARGETS (section 5; asked by pm7-glyphs 2026-10-10, after pm7-hover-bridge.css 17fd3f9b96). Where the glyph's host
 * is a PMH target ([data-pmh-kind]) the ignite follows PMH's classes, not :hover, so the phosphor does too: the strike
 * starts on .pmh-on and the decay is held by .pmh-out (Retro's --pmh-out-ms is 34 ms, one tick; 66 ms on rows, so a row's
 * glyph fades with its two-step unfill). On .pmh-out the halo holds half strength and the tube its hover ink; when PMH
 * drops .pmh-out both cut to rest. Under Reduced Motion PMH sets no .pmh-out, so the glyph goes out at once. These rules
 * outweigh the hover bridge on purpose ((0,6,2) against its (0,4,1), (0,7,2) against (0,5,1) one level down), so they
 * hold in either load order.

/* ==== glyph-system/opus-5.5/src/bridge/pm7-hover-bridge.css ==== */
/* pm7-hover-bridge.css: the neon hover ignite (neon-icons.css section 8) under PMConcept7's hover engine, PMH
 * (Concepts/onboarding/opus-5.5/src/js/18-hover.js). OWNER: pm7-glyphs, agreed with pm7-hover 2026-10-10.
 *
 * PMH styles the plate (classes, pseudo-elements, fixed proxies); the neon ignite changes only custom properties on the
 * svg inside it, so they never touch the same thing. One rule joins them: where the glyph's host IS a PMH target
 * (PMH stamps every target with data-pmh-kind), the ignite follows PMH's .pmh-on instead of :hover, so it inherits
 * PMH's rests (no hover while resizing or dragging, Usage board operations and moments), its outermost-target
 * resolution and its exemption ([data-pm-hover-exempt] between host and pointer hovers nothing). A glyph in an ordinary
 * button inside a card keeps the neon :hover / :focus-visible rule. Timing fits inside PMH's: the 180 ms halo lands
 * within the families' 90-130 ms light-in and 220-380 ms fade-out. Retro is designer2's phosphor (pm7-retro-phosphor.css).
 * NieR: one cut on, a two-step decay while PMH holds .pmh-out, no flicker. Reduced Motion: the neon section 10 rule
 * already ends every animation and transition, so the end state comes at once and no act plays.
 * No filter or blend (F3-465, Slint).
 */

/* 1. A PMH target's own :hover does not ignite its glyph; .pmh-on does. Back to rest (role defaults, sections 4-5). */
[data-pmh-kind]:is(:hover, :focus-visible):not(.pmh-on) > svg.nx-r-control:not(.nx-self),
[data-pmh-kind]:is(:hover, :focus-visible):not(.pmh-on) > :not(button, summary, [role="button"], [data-action]) > svg.nx-r-control:not(.nx-self) {
  --nx-hiv: hidden; --nx-hi-a: 0; --nx-fl: none; --nx-1: initial;
}
[data-pmh-kind]:is(:hover, :focus-visible):not(.pmh-on) > svg.nx-r-concept:not(.nx-self),
[data-pmh-kind]:is(:hover, :focus-visible):not(.pmh-on) > :not(button, summary, [role="button"], [data-action]) > svg.nx-r-concept:not(.nx-self) {
  --nx-hi-a: var(--nx-h-concept-i); --nx-1: initial;
}
[data-pmh-kind]:is(:hover, :focus-visible):not(.pmh-on) > svg.nx:not(.nx-self, [class*="nx-t-"]),
[data-pmh-kind]:is(:hover, :focus-visible):not(.pmh-on) > :not(button, summary, [role="button"], [data-action]) > svg.nx:not(.nx-self, [class*="nx-t-"]) {
  --nx-ink: initial;
}

/* 2. The ignite on .pmh-on: the neon section 8 values, keyed on PMH's state. */
[data-pmh-kind].pmh-on > svg.nx-r-control:not(.nx-self),
[data-pmh-kind].pmh-on > :not(button, summary, [role="button"], [data-action]) > svg.nx-r-control:not(.nx-self) {
  --nx-hiv: visible; --nx-hi-a: var(--nx-h-hover-i); --nx-fl: nx-flick 300ms linear; --nx-1: var(--nx-d1) var(--nx-ease) backwards;
}
[data-pmh-kind].pmh-on > svg.nx-r-concept:not(.nx-self),
[data-pmh-kind].pmh-on > :not(button, summary, [role="button"], [data-action]) > svg.nx-r-concept:not(.nx-self) {
  --nx-hi-a: var(--nx-h-swell-i); --nx-1: var(--nx-d1) var(--nx-ease) backwards;
}
[data-pmh-kind].pmh-on > svg.nx:not(.nx-self, [class*="nx-t-"]),
[data-pmh-kind].pmh-on > :not(button, summary, [role="button"], [data-action]) > svg.nx:not(.nx-self, [class*="nx-t-"]) {
  --nx-ink: var(--text);
}

/* 3. NieR: a cut on (no flicker tween) and, on a PMH target, a two-step decay while .pmh-out holds. */
html[data-o55-nier="on"] :is(button, summary, [role="button"], [data-action]):is(:hover, :focus-visible) svg.nx .nx-c:not(.nx-p) { animation: none; }
html[data-o55-nier="on"] [data-pmh-kind].pmh-out > svg.nx:not(.nx-self, [class*="nx-t-"]) .nx-c:not(.nx-p),
html[data-o55-nier="on"] [data-pmh-kind].pmh-out > :not(button, summary, [role="button"], [data-action]) > svg.nx:not(.nx-self, [class*="nx-t-"]) .nx-c:not(.nx-p) {
  animation: pmg-nier-decay var(--pmh-out-ms, 220ms) steps(2, end) both;
}
@keyframes pmg-nier-decay { from { stroke: var(--text); } to { stroke: var(--nx-ink, currentColor); } }

/* ==== glyph-system/opus-5.5/src/bridge/pm7-beat.css ==== */
/* pm7-beat.css: the 2200 ms beat of a live category glyph (D14 second review, 2026-10-28; DL-253). OWNER: pm7-found
 * (PM7 build, 2026-10-29).
 * "The icons are not animated in the status bar": while anything runs, the agents (robot) and processes glyphs move
 * exactly as the chat's Activity bar icon does: the tube breathes on the bar's 2200 ms beat (ab-breathe's curve) and
 * the glyph's parts loop on the same beat (the cursor types in, the antenna blinks). A host that stands for live work
 * wears .pmg-beat around the glyph it draws (PMG.icon('robot' | 'processes', size, 'nx-r-concept nx-lit')): the status
 * bar's two items and the panel's tab and column heads. Row marks never wear it (lists keep their marks still, the
 * loop budget). Drags hold it; Reduced Motion shows the lit rest pose, still. */
@keyframes pmg-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .48; } }
.pmg-beat > svg.nx { animation: pmg-breathe 2200ms ease-in-out infinite; }
.pmg-beat > svg.nx .nx-p { animation: var(--kl) 2200ms var(--nx-le) infinite; animation-delay: calc(var(--ad, 0) * 2.2ms - 2200ms); }
