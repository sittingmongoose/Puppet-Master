<div id="pmf-tour" class="pmft" data-open="false" data-phase="idle" data-slint-counterpart="GuidedTourLayer" hidden>
  <svg class="pmft-mask" aria-hidden="true">
    <defs><mask id="pmft-cutout"><rect width="100%" height="100%" fill="#fff"/><rect class="pmft-hole" x="0" y="0" width="0" height="0" rx="12" fill="#000"/></mask></defs>
    <rect class="pmft-dim" width="100%" height="100%" mask="url(#pmft-cutout)"/>
  </svg>
  <div class="pmft-blockers" aria-hidden="true"><div class="pmft-block" data-side="t"></div><div class="pmft-block" data-side="r"></div><div class="pmft-block" data-side="b"></div><div class="pmft-block" data-side="l"></div></div>
  <div class="pmft-ring" aria-hidden="true"><i></i></div>
  <div class="pmft-pointer" aria-hidden="true"><span class="pmft-pointer-ring"></span><span class="pmft-pointer-dot"></span><span class="pmft-pointer-label"></span></div>
  <aside class="pmft-card" id="pmft-card" role="dialog" aria-live="polite" aria-labelledby="pmft-title" data-place="right">
    <div class="pmft-card-arrow"></div>
    <header class="pmft-card-head">
      <div class="pmft-chapters" id="pmft-chapters"></div>
      <button type="button" class="pmft-skip" data-act="skip" title="Skip Tour">Skip Tour</button>
    </header>
    <div class="pmft-card-body" id="pmft-card-body"></div>
    <footer class="pmft-card-foot" id="pmft-card-foot"></footer>
  </aside>
  <div class="pmft-note" id="pmft-note" aria-live="polite"></div>
</div>
