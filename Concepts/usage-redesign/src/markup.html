<!-- Usage redesign (B v2 + A1; owner: engine). The DOM contract is ARCHITECTURE.md section 5. The rail lists the 13
     rooms in canon order; icons are filled from the SVG map by PM7_USAGE.injectIcons(); the board by PMU.board.mount().
     Every head dropdown is a PMU.menu (src/js/45-menu.js) in the Chat Assistant 5.6 Pro menu style. -->
<div class="pmu-shell" id="pmuApp" data-room="overview">
  <aside class="pmu-rail" aria-label="Usage rooms">
    <div class="pmu-brand"><h1>Usage</h1>
      <span class="pmu-livectl" id="pmuLiveCtl" data-state="on" hidden>
        <button type="button" class="pmu-livebtn" id="pmuLiveBtn" aria-pressed="true"><span class="pmu-livedot" aria-hidden="true"><svg viewBox="0 0 12 12" width="12" height="12" focusable="false"><defs><linearGradient id="pmuLiveGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C2557A"/><stop offset="1" stop-color="#2E8F86"/></linearGradient></defs><circle class="pmu-ld-dot" cx="6" cy="6" r="3"/><circle class="pmu-ld-ring" cx="6" cy="6" r="2.6"/><path class="pmu-ld-dia" d="M6 2.2 9.8 6 6 9.8 2.2 6z"/><rect class="pmu-ld-cur" x="3.5" y="2.5" width="5" height="7"/></svg><i class="pmu-livepulse"></i></span><span class="pmu-liveword">Live</span></button>
        <button type="button" class="pmu-livechev" id="pmuLiveMenu" aria-haspopup="menu" aria-expanded="false" aria-label="Live readings" data-pm-hover-label="Live readings"><span class="pmu-ico" data-icon="chevronDown" aria-hidden="true"></span></button>
      </span></div>
    <nav class="pmu-nav" id="pmuNav" aria-label="Usage rooms">
      <span class="pmu-navink" id="pmuNavInk" aria-hidden="true"></span>
      <button type="button" class="pmu-navbtn active" data-room="overview" aria-current="page"><span class="pmu-navicon" data-icon="grid" aria-hidden="true"></span><span class="pmu-navtext">Overview</span></button>
      <button type="button" class="pmu-navbtn" data-room="plans"><span class="pmu-navicon" data-icon="gauge" aria-hidden="true"></span><span class="pmu-navtext">Plans &amp; limits</span></button>
      <button type="button" class="pmu-navbtn" data-room="costs"><span class="pmu-navicon" data-icon="wallet" aria-hidden="true"></span><span class="pmu-navtext">Costs</span></button>
      <button type="button" class="pmu-navbtn" data-room="accounts"><span class="pmu-navicon" data-icon="users" aria-hidden="true"></span><span class="pmu-navtext">Accounts</span></button>
      <button type="button" class="pmu-navbtn" data-room="free"><span class="pmu-navicon" data-icon="spark" aria-hidden="true"></span><span class="pmu-navtext">Free models</span></button>
      <button type="button" class="pmu-navbtn" data-room="context"><span class="pmu-navicon" data-icon="ring" aria-hidden="true"></span><span class="pmu-navtext">Context</span></button>
      <button type="button" class="pmu-navbtn" data-room="analytics"><span class="pmu-navicon" data-icon="chart" aria-hidden="true"></span><span class="pmu-navtext">Analytics</span></button>
      <button type="button" class="pmu-navbtn" data-room="ledger"><span class="pmu-navicon" data-icon="list" aria-hidden="true"></span><span class="pmu-navtext">Ledger</span></button>
      <button type="button" class="pmu-navbtn" data-room="attention"><span class="pmu-navicon" data-icon="shield" aria-hidden="true"></span><span class="pmu-navtext">Attention</span></button>
      <button type="button" class="pmu-navbtn" data-room="cache"><span class="pmu-navicon" data-icon="layers" aria-hidden="true"></span><span class="pmu-navtext">Prompt cache</span></button>
      <button type="button" class="pmu-navbtn" data-room="tools"><span class="pmu-navicon" data-icon="tool" aria-hidden="true"></span><span class="pmu-navtext">Tools</span></button>
      <button type="button" class="pmu-navbtn" data-room="signals"><span class="pmu-navicon" data-icon="pulse" aria-hidden="true"></span><span class="pmu-navtext">Signals</span></button>
      <button type="button" class="pmu-navbtn" data-room="authority"><span class="pmu-navicon" data-icon="book" aria-hidden="true"></span><span class="pmu-navtext">Source authority</span></button>
    </nav>
  </aside>
  <section class="pmu-stage" id="pmuStage" aria-labelledby="pmuRoomTitle">
    <header class="pmu-stagehead">
      <div class="pmu-titleblock">
        <h2 id="pmuRoomTitle" tabindex="-1" data-tour-id="guided_tour.usage.heading">Current usage</h2>
        <p class="pmu-roomdesc" id="pmuRoomDesc">Limits, costs, and run pressure at the current pace.</p>
      </div>
      <div class="pmu-headctl">
        <button type="button" class="pmu-ctlbtn pmu-ctlmenu" id="pmuScopeBtn" aria-haspopup="menu" aria-expanded="false"><span class="pmu-ctllead" id="pmuScopeLead" aria-hidden="true"></span><span class="pmu-ctltext" id="pmuScopeLabel">All current usage</span><span class="pmu-ico pmu-ctlchev" data-icon="chevronDown" aria-hidden="true"></span></button>
        <div class="pmu-range pmu-seg" id="pmuRange" role="group" aria-label="Range"><button type="button" data-range="5h">5h</button><button type="button" data-range="24h" class="active" aria-pressed="true">24h</button><button type="button" data-range="7d">7d</button><button type="button" data-range="30d">30d</button><i class="pmu-seg-ink" aria-hidden="true"></i></div>
        <button type="button" class="pmu-ctlbtn pmu-ctlmenu pmu-rangebtn" id="pmuRangeBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Range"><span class="pmu-ctltext pmu-rangetext" id="pmuRangeLabel">24h</span><span class="pmu-ico pmu-ctlchev" data-icon="chevronDown" aria-hidden="true"></span></button>
        <button type="button" class="pmu-ctlbtn pmu-ctlmenu" id="pmuDetailBtn" aria-haspopup="menu" aria-expanded="false"><span class="pmu-ctllead pmu-detlead" id="pmuDetailLead" aria-hidden="true"></span><span class="pmu-ctltext" id="pmuDetailLabel">At a glance</span><span class="pmu-ico pmu-ctlchev" data-icon="chevronDown" aria-hidden="true"></span></button>
        <button type="button" class="pmu-ctlbtn pmu-ctlmenu" id="pmuCustomize" aria-haspopup="menu" aria-expanded="false" data-pm-hover-label="Panels in this room"><span class="pmu-ico pmu-ctlicon" data-icon="grid" aria-hidden="true"></span><span class="pmu-ctltext" id="pmuPanelCount">Panels</span><span class="pmu-ico pmu-ctlchev" data-icon="chevronDown" aria-hidden="true"></span></button>
        <button type="button" class="pmu-iconbtn" id="pmuRefresh" aria-label="Refresh usage" data-pm-hover-label="Refresh usage"><span class="pmu-ico" data-icon="refresh" aria-hidden="true"></span></button>
        <button type="button" class="pmu-iconbtn" id="pmuExport" aria-label="Export usage" aria-haspopup="menu" aria-expanded="false" data-pm-hover-label="Export usage"><span class="pmu-ico" data-icon="export" aria-hidden="true"></span></button>
      </div>
    </header>
    <div class="pmu-scroll" id="pmuScroll">
      <div class="pmu-board" id="pmuBoard" data-room="overview"></div>
      <div class="pmu-board" hidden></div>
    </div>
    <aside class="pmu-inspector" id="pmuInspector" aria-hidden="true" aria-labelledby="pmuInspTitle">
      <header class="pmu-insphead"><div class="pmu-insptitles"><h3 id="pmuInspTitle">Details</h3><p class="pmu-inspsub" id="pmuInspSub"></p></div>
        <div class="pmu-seg pmu-inspmode" id="pmuInspMode" role="group" aria-label="View"><button type="button" data-insp-mode="curated" class="active" aria-pressed="true">Curated</button><button type="button" data-insp-mode="raw" aria-pressed="false">Raw</button><i class="pmu-seg-ink" aria-hidden="true"></i></div>
        <button type="button" class="pmu-iconbtn" id="pmuInspClose" aria-label="Close details"><span class="pmu-ico" data-icon="close" aria-hidden="true"></span></button></header>
      <div class="pmu-inspactions" id="pmuInspActions"></div>
      <div class="pmu-inspbody" id="pmuInspBody"></div>
    </aside>
  </section>
  <svg class="pmu-defs" aria-hidden="true" width="0" height="0" focusable="false"><defs id="pmuDefs"></defs></svg>
  <div class="pmu-sr" id="pmuLive" aria-live="polite"></div>
  <div class="pmu-flight" id="pmuFlight" aria-hidden="true"></div>
</div>
