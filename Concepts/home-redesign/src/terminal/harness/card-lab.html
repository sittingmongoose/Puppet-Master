/* ---- lab chrome (pmt-lab-*): not part of the card ---- */
html, body { margin: 0; padding: 0; }
html { min-height: 100%; }
body {
  min-height: 100vh;
  background: var(--background);
  color: var(--text-primary);
  font-family: var(--body-font);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}
html[data-theme="glass-dark"] body {
  background: radial-gradient(120% 80% at 15% 10%, #6d4f9e 0%, transparent 60%),
    radial-gradient(90% 70% at 85% 30%, #b0629a 0%, transparent 55%),
    linear-gradient(180deg, #2a1f45 0%, #1b1430 100%);
}
html[data-theme="glass-light"] body {
  background: radial-gradient(110% 80% at 20% 0%, #f7e4f2 0%, transparent 60%),
    radial-gradient(90% 70% at 85% 35%, #cdbdf0 0%, transparent 60%),
    linear-gradient(180deg, #e9d6ea 0%, #d8c8ec 100%);
}
.pmt-lab-bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
  padding: 10px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
html[data-theme^="glass"] .pmt-lab-bar { backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); }
.pmt-lab-title { font-weight: 650; font-size: 13px; margin-right: 6px; }
.pmt-lab-group { display: inline-flex; align-items: center; gap: 4px; }
.pmt-lab-group > span { color: var(--text-secondary); font-size: 11.5px; margin-right: 4px; }
.pmt-lab-btn {
  appearance: none; height: 26px; padding: 0 10px; margin: 0;
  border: 1px solid var(--border); border-radius: var(--radius-sm, 4px);
  background: transparent; color: var(--text-secondary);
  font: 600 11.5px/24px var(--body-font); cursor: pointer;
}
.pmt-lab-btn[aria-pressed="true"] { background: var(--text-primary); color: var(--background); border-color: var(--text-primary); }
.pmt-lab-btn:disabled { opacity: .45; cursor: default; }
.pmt-lab-btn:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 1px; }
.pmt-lab-stage { display: flex; gap: 28px; align-items: flex-start; padding: 22px 18px 60px; overflow-x: auto; }
.pmt-lab-col { flex: none; }
.pmt-lab-caption { color: var(--text-secondary); font-size: 11.5px; margin: 0 0 6px 2px; }

/* the chat column mock: the 5.6 Pro transcript at its own width */
.pmt-lab-chat {
  box-sizing: border-box;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg, 8px);
  padding: 16px 14px 18px;
  display: flex; flex-direction: column; gap: 10px;
}
html[data-theme^="glass"] .pmt-lab-chat { backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); border-color: var(--glass-hairline); }
html[data-theme^="retro"] .pmt-lab-chat, html[data-o55-nier="on"] .pmt-lab-chat { border-radius: 0; }
.pmt-lab-msg { font-size: 13px; line-height: 1.5; margin: 0; }
.pmt-lab-msg code { font-family: var(--pm-font-code); font-size: 12px; }
.pmt-lab-user {
  align-self: flex-end; max-width: 82%;
  padding: 8px 12px; border-radius: 14px;
  background: color-mix(in srgb, var(--accent-primary) 12%, var(--surface-elevated));
  border: 1px solid var(--border-light, var(--border));
}
html[data-theme^="basic"] .pmt-lab-user { border-radius: 8px; }
html[data-theme^="retro"] .pmt-lab-user, html[data-o55-nier="on"] .pmt-lab-user { border-radius: 0; }
.pmt-lab-asst { color: var(--text-primary); padding: 2px 2px; }
.pmt-lab-note { color: var(--text-secondary); font-size: 11.5px; padding: 0 2px; }

    '3:42:07 PM [vite] page reload src/routes/upload.tsx', '3:43:55 PM [vite] hmr update /src/components/BatchProgress.tsx', '^C'];

  function noop() {}
  function log(name) { return function () { note('Pressed ' + name); }; }
  function cards() {
    return {
      failed: { command: 'cargo test --workspace', cwd: '~/tastebook/api', status: 'failed', exitCode: 101, elapsedMs: 62400,
        lines: cargoFail, totalLines: cargoFail.length, by: 'agent:Builder',
        failureLine: "thread 'media::import::tests::large_batch' panicked at src/media/import.rs:128:14:",
        onOpen: log('Open in Terminal'), onRerun: log('Rerun in Terminal') },
      running: { command: 'cargo test -p tastebook-api media::import', cwd: '~/tastebook/api', status: 'running',
        startedAt: Date.now() - 12000, lines: freeze ? rerunScript.slice(0, 8) : [], totalLines: freeze ? 8 : 0, by: 'agent:Builder',
        onOpen: log('Open in Terminal'), onRerun: log('Rerun in Terminal') },
      waiting: { command: './scripts/setup-media.sh', cwd: '~/tastebook/api', status: 'waiting', startedAt: Date.now() - 31000,
        lines: ['==> Checking the media toolchain', 'libvips 8.15 not found', '==> Installing libvips-dev with apt', '[sudo] password for jared: '],
        totalLines: 4, by: 'agent:Builder', onOpen: log('Open in Terminal'), onRerun: log('Rerun in Terminal') },
      interrupted: { command: 'npm run dev', cwd: '~/tastebook/web', status: 'interrupted', exitCode: 130, elapsedMs: 252000,
        lines: vite, totalLines: vite.length, by: 'user', onOpen: log('Open in Terminal'), onRerun: log('Rerun in Terminal') },
      release: { command: 'cargo build --release', cwd: '~/tastebook/api', status: 'ok', exitCode: 0, elapsedMs: 108000,
        lines: release, totalLines: release.length, by: 'user', expanded: true, onOpen: log('Open in Terminal'), onRerun: log('Rerun in Terminal') },
      bench: { command: 'RUST_LOG=tastebook_api::media=trace cargo run --release --bin import-bench -- --fixture assets/fixtures/large-batch.json --repeat 12 --report target/bench/import.json',
        cwd: '~/tastebook/api', status: 'ok', exitCode: 0, elapsedMs: 38200, lines: bench, totalLines: bench.length, by: 'agent:Builder',
        onViewOutput: log('View output'), onRerun: log('Rerun in Terminal') },
      quiet: { command: 'mkdir -p target/bench', cwd: '~/tastebook/api', status: 'ok', exitCode: 0, elapsedMs: 40, lines: [], totalLines: 0,
        by: 'agent:Builder', onViewOutput: log('View output'), onRerun: log('Rerun in Terminal') }
    };
  }

  var live = [];   /* every running card instance, for the streaming demo */
  function note(text) { document.querySelectorAll('.pmt-lab-note').forEach(function (n) { n.textContent = text; }); }

  function msg(cls, htmlText) { var p = document.createElement('p'); p.className = 'pmt-lab-msg ' + cls; p.innerHTML = htmlText; return p; }
  function column(width) {
    var wrap = document.createElement('section');
    wrap.className = 'pmt-lab-col';
    wrap.setAttribute('aria-label', 'Chat column ' + width + ' px');
    var cap = document.createElement('div'); cap.className = 'pmt-lab-caption'; cap.textContent = 'Chat column, ' + width + ' px';
    var chat = document.createElement('div'); chat.className = 'pmt-lab-chat'; chat.style.width = width + 'px';
    var c = cards();
    var C = T.CommandCard;
    chat.appendChild(msg('pmt-lab-user', 'The large batch import test is failing again. Can you find out why and fix it?'));
    chat.appendChild(msg('pmt-lab-asst', 'I will run the whole test suite first to see what fails.'));
    chat.appendChild(C.create(c.failed));
    chat.appendChild(msg('pmt-lab-asst', 'One test fails: <code>large_batch</code> reads one past the end of the batch at <code>import.rs:128</code>. I changed the loop bound and I am running the import tests again.'));
    var run = C.create(c.running); chat.appendChild(run); live.push(run);
    chat.appendChild(msg('pmt-lab-asst', 'Thumbnails need libvips. Installing it asks for your password, so the setup script is waiting for you in its terminal.'));
    chat.appendChild(C.create(c.waiting));
    chat.appendChild(msg('pmt-lab-user', 'I stopped the dev server and built a release myself.'));
    chat.appendChild(C.create(c.interrupted));
    chat.appendChild(C.create(c.release));
    chat.appendChild(msg('pmt-lab-asst', 'The import benchmark ran as a one-shot command, so its output is saved with the chat rather than in a terminal.'));
    chat.appendChild(C.create(c.quiet));
    chat.appendChild(C.create(c.bench));
    var noteEl = document.createElement('p'); noteEl.className = 'pmt-lab-msg pmt-lab-note'; noteEl.setAttribute('aria-live', 'polite');
    chat.appendChild(noteEl);
    wrap.appendChild(cap); wrap.appendChild(chat);
    return wrap;
  }

  var streamTimer = 0;
  function stream() {
    clearTimeout(streamTimer);
    if (freeze) return;
    var start = Date.now(), i = 0;
    live.forEach(function (n) { T.CommandCard.update(n, { status: 'running', startedAt: start, lines: [], totalLines: 0, exitCode: null }); });
    (function step() {
      if (i < rerunScript.length) {
        i++;
        var shown = rerunScript.slice(0, i);
        live.forEach(function (n) { T.CommandCard.update(n, { lines: shown, totalLines: shown.length }); });
        streamTimer = setTimeout(step, i < 3 ? 1600 : 900);
      } else {
        live.forEach(function (n) { T.CommandCard.update(n, { status: 'ok', exitCode: 0, elapsedMs: Date.now() - start }); });
      }
    })();
  }

  function render() {
    var stage = document.getElementById('pmt-lab-stage');
    stage.textContent = ''; live = [];
    var widths = look.width === 'all' ? [360, 480, 600] : [+look.width || 480];
    widths.forEach(function (w) { stage.appendChild(column(w)); });
    stream();
  }

  function applyLook() {
    html.setAttribute('data-theme', (look.nier ? 'basic' : look.family) + '-' + look.mode);
    if (look.nier) {
      html.setAttribute('data-o55-nier', 'on');
      html.setAttribute('data-o55-nier-parts', 'square cursor headers brackets icons ground');
    } else {
      html.removeAttribute('data-o55-nier');
      html.removeAttribute('data-o55-nier-parts');
    }
    if (look.reduced) html.setAttribute('data-motion', 'reduced'); else html.removeAttribute('data-motion');
    document.querySelectorAll('[data-lab-family]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(!look.nier && b.getAttribute('data-lab-family') === look.family));
      b.disabled = look.nier;
    });
    document.querySelectorAll('[data-lab-mode]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lab-mode') === look.mode)); });
    document.querySelectorAll('[data-lab-toggle]').forEach(function (b) { b.setAttribute('aria-pressed', String(!!look[b.getAttribute('data-lab-toggle')])); });
    document.querySelectorAll('[data-lab-width]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lab-width') === look.width)); });
  }

  document.querySelector('.pmt-lab-bar').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-lab-family')) look.family = b.getAttribute('data-lab-family');
    else if (b.hasAttribute('data-lab-mode')) look.mode = b.getAttribute('data-lab-mode');
    else if (b.hasAttribute('data-lab-toggle')) { var k = b.getAttribute('data-lab-toggle'); look[k] = !look[k]; }
    else if (b.hasAttribute('data-lab-width')) { look.width = b.getAttribute('data-lab-width'); applyLook(); render(); return; }
    else if (b.hasAttribute('data-lab-do')) {
      var d = b.getAttribute('data-lab-do');
      if (d === 'restart') { stream(); return; }
      document.querySelectorAll('.pmt-card').forEach(function (n) { T.CommandCard.update(n, { expanded: d === 'expand' }); });
      return;
    }
    applyLook();
  });

  applyLook();
  render();
  window.pmtLab = { look: look, render: render, applyLook: applyLook, stream: stream };
})();
</script>
</body>
</html>
